      SHEET_END_DATE:      {source: EmployeeTimeSheet.endDate, type: DATE, verify: true, description: Timesheet period end}
      ABSENCE_ID:          {source: EmployeeTime.externalCode, type: STRING, length: 128, verify: true, description: Absence record ID}
