      WORK_SCHEDULE:       {source: EmpJob.workscheduleCode, type: STRING, length: 128, verify: true, description: Work schedule of the employee}
      HOLIDAY_CALENDAR:    {source: EmpJob.holidayCalendarCode, type: STRING, length: 128, verify: true, description: Holiday calendar of the employee}
      TIME_TYPE_PROFILE:   {source: EmpJob.timeTypeProfileCode, type: STRING, length: 128, verify: true, description: Time profile (allowed time types)}
      TIME_RECORDING_PROFILE: {source: EmpJob.timeRecordingProfileCode, type: STRING, length: 128, verify: true, description: Time recording profile}
      TIME_RECORDING_VARIANT: {source: EmpJob.timeRecordingVariant, type: STRING, length: 32, verify: true, description: DURATION or CLOCK_TIME recording}

