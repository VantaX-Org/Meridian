    fields:
      USERID:       {source: payroll_export.personnel_number, type: STRING, length: 100, verify: true}
      USERID_PAY:   {source: payroll_export.personnel_number, type: STRING, length: 100, verify: true, description: Payee on the payroll result}
      PAY_PERIOD:   {source: payroll_export.period, type: STRING, length: 6, verify: true}
      PAY_DATE:     {source: payroll_export.pay_date, type: DATE, verify: true}
      PAYROLL_AREA: {source: payroll_export.payroll_area, type: STRING, length: 2, verify: true}
      COMPANY:      {source: payroll_export.company_code, type: STRING, length: 4, verify: true}
      COST_CENTRE:  {source: payroll_export.cost_center, type: STRING, length: 10, verify: true}
      GROSS_PAY:    {source: payroll_export.gross, type: DECIMAL, verify: true}
      NET_PAY:      {source: payroll_export.net, type: DECIMAL, verify: true}
