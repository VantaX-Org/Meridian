  # I4 (review): every FO* target below (FOCompany, FODepartment, FODivision, FOLocation,
  # FOJobCode, FOCostCenter, FOBusinessUnit, FOEventReason, ...) also extracts with
  # from_date=None, so each selects exactly one current row per externalCode and none of
  # them carries an effective-start date. Rules written against these tables implicitly
  # assume "current" and that assumption holds today. No effective-dated FO* rule is
  # possible until a from_date is set on these targets; see the coverage-gap list for the
