  # I1 (review): Position extracts with from_date=None (no fromDate sent, see
  # sap/successfactors.py), so SF returns only the as-of-today row per position code and
  # keys: [CODE] never collides even though effectiveStartDate/effectiveEndDate are selected.
  # This is safe only because of that current-record-only extraction: the moment Position is
  # extracted with an effective-dated from_date, multiple rows per CODE become live and
  # EC299 (uniqueness on POSITION.CODE) will mass-fire on every position ever changed.
  POSITION:
    description: Positions (Position Management), current record
    source: Position
    keys: [CODE]
    fields:
      CODE:             {source: Position.code, type: STRING, length: 128, description: Position code}
      COMPANY:          {source: Position.company, type: STRING, length: 128, description: Legal entity of the position}
      DEPARTMENT:       {source: Position.department, type: STRING, length: 128, description: Department of the position}
      JOB_CODE:         {source: Position.jobCode, type: STRING, length: 128, description: Job classification of the position}
      COST_CENTER:      {source: Position.costCenter, type: STRING, length: 128, verify: true, description: Cost centre of the position}
      VACANT:           {source: Position.vacant, type: BOOLEAN, description: Position flagged as vacant (to be hired)}
      EFFECTIVE_STATUS: {source: Position.effectiveStatus, type: STRING, length: 2, description: A active / I inactive}
      CRITICALITY:      {source: Position.positionCriticality, type: STRING, length: 128, verify: true, description: Position criticality (key position indicator)}
      TARGET_FTE:       {source: Position.targetFTE, type: DECIMAL, verify: true, description: Target FTE of the position}
      MULTIPLE_INCUMBENTS: {source: Position.multipleIncumbentsAllowed, type: BOOLEAN, verify: true, description: More than one incumbent allowed}
      STANDARD_HOURS:   {source: Position.standardHours, type: DECIMAL, verify: true, description: Standard weekly hours of the position}
      EFFECTIVE_START_DATE: {source: Position.effectiveStartDate, type: DATE, verify: true, description: Effective start date of the current position record}
      EFFECTIVE_END_DATE:   {source: Position.effectiveEndDate, type: DATE, verify: true, description: Effective end date of the current position record}
      BUSINESS_UNIT:    {source: Position.businessUnit, type: STRING, length: 128, verify: true, check_table: FOBusinessUnit, description: Business unit of the position}
      DIVISION:         {source: Position.division, type: STRING, length: 128, verify: true, check_table: FODivision, description: Division of the position}
      LOCATION:         {source: Position.location, type: STRING, length: 128, verify: true, check_table: FOLocation, description: Location of the position}
      PAY_GRADE:        {source: Position.payGrade, type: STRING, length: 128, verify: true, check_table: FOPayGrade, description: Pay grade of the position}
      EXTERNAL_NAME:    {source: Position.externalName_defaultValue, type: STRING, length: 256, verify: true, description: External (job-board facing) position name}

  # I4 (review): every FO* target below (FOCompany, FODepartment, FODivision, FOLocation,
  # FOJobCode, FOCostCenter, FOBusinessUnit, FOEventReason, ...) also extracts with
  # from_date=None, so each selects exactly one current row per externalCode and none of
  # them carries an effective-start date. Rules written against these tables implicitly
  # assume "current" and that assumption holds today. No effective-dated FO* rule is
  # possible until a from_date is set on these targets; see the coverage-gap list for the
  # rules that gap blocks.
  FOCOMPANY:
    description: Legal entities (Foundation Object), current record
    source: FOCompany
    keys: [EXTERNAL_CODE]
    fields:
      EXTERNAL_CODE: {source: FOCompany.externalCode, type: STRING, length: 128, description: Legal entity code}
      COUNTRY:       {source: FOCompany.country, type: STRING, length: 128, description: Country of the legal entity}
      CURRENCY:      {source: FOCompany.currency, type: STRING, length: 20, description: Default currency of the legal entity}
      STATUS:        {source: FOCompany.status, type: STRING, length: 2, description: A active / I inactive}

  FODEPARTMENT:
    description: Departments (Foundation Object), current record
    source: FODepartment
    keys: [EXTERNAL_CODE]
    fields:
      EXTERNAL_CODE: {source: FODepartment.externalCode, type: STRING, length: 128, description: Department code}
      COST_CENTER:   {source: FODepartment.costCenter, type: STRING, length: 128, description: Default cost centre of the department}
      STATUS:        {source: FODepartment.status, type: STRING, length: 2, description: A active / I inactive}

  # Employee Central depth (EC121+): full job history, permits, payment, emergency
  # contacts, global assignments and the remaining Foundation Objects.
  EMPJOBHIST:
    description: Job history, every effective-dated EmpJob record (not only the current one)
    source: EmpJob (all records, asOfDate not applied)
    keys: [USERID, START_DATE, SEQ_NUMBER]
    fields:
      USERID:       {source: EmpJob.userId, type: STRING, length: 100, verify: true}
      START_DATE:   {source: EmpJob.startDate, type: DATE, verify: true, description: Record effective start}
      SEQ_NUMBER:   {source: EmpJob.seqNumber, type: INTEGER, verify: true, description: Sequence on the same start date}
      END_DATE:     {source: EmpJob.endDate, type: DATE, verify: true, description: Record effective end}
      EVENT:        {source: EmpJob.event, type: STRING, length: 128, verify: true, picklist: event}
      EVENT_REASON: {source: EmpJob.eventReason, type: STRING, length: 128, verify: true, check_table: FOEventReason}
      STATUS:       {source: EmpJob.emplStatus, type: STRING, length: 128, verify: true, picklist: employee-status}
      COMPANY:      {source: EmpJob.company, type: STRING, length: 128, verify: true, check_table: FOCompany}
      POSITION:     {source: EmpJob.position, type: STRING, length: 128, verify: true}
      MANAGER_ID:   {source: EmpJob.managerId, type: STRING, length: 100, verify: true}
      BUSINESS_UNIT: {source: EmpJob.businessUnit, type: STRING, length: 128, verify: true, check_table: FOBusinessUnit}
      DIVISION:     {source: EmpJob.division, type: STRING, length: 128, verify: true, check_table: FODivision}
      DEPARTMENT:   {source: EmpJob.department, type: STRING, length: 128, verify: true, check_table: FODepartment}
      LOCATION:     {source: EmpJob.location, type: STRING, length: 128, verify: true, check_table: FOLocation}
      COST_CENTER:  {source: EmpJob.costCenter, type: STRING, length: 128, verify: true, check_table: FOCostCenter}
      JOB_CODE:     {source: EmpJob.jobCode, type: STRING, length: 128, verify: true, check_table: FOJobCode}
      EMPLOYEE_CLASS: {source: EmpJob.employeeClass, type: STRING, length: 128, verify: true, picklist: employee-class}
      EMPLOYMENT_TYPE: {source: EmpJob.employmentType, type: STRING, length: 128, verify: true, picklist: employmentType}
