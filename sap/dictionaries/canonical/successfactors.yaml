      EMAIL_ADDRESS: {source: PerEmail.emailAddress, type: STRING, length: 100, description: E-mail address}
      IS_PRIMARY:    {source: PerEmail.isPrimary, type: BOOLEAN, verify: true, description: Primary e-mail flag}

  PERPHONE:
    description: Phone numbers
    source: PerPhone
    keys: [PERSON_ID, PHONE_TYPE]
    fields:
      PERSON_ID:    {source: PerPhone.personIdExternal, type: STRING, length: 100}
      PHONE_TYPE:   {source: PerPhone.phoneType, type: STRING, length: 128, picklist: ecPhoneType, description: Phone type}
      PHONE_NUMBER: {source: PerPhone.phoneNumber, type: STRING, length: 256, description: Phone number}
      COUNTRY_CODE: {source: PerPhone.countryCode, type: STRING, length: 256, verify: true, description: International dialling code}
      AREA_CODE:    {source: PerPhone.areaCode, type: STRING, length: 256, verify: true, description: Area code}
      EXTENSION:    {source: PerPhone.extension, type: STRING, length: 256, verify: true, description: Extension}
      IS_PRIMARY:   {source: PerPhone.isPrimary, type: BOOLEAN, verify: true, description: Primary phone flag}

  PERADDRESS:
    description: Home address (default country format)
    source: PerAddressDEFLT
    keys: [PERSON_ID, ADDRESS_TYPE]
    fields:
      PERSON_ID:     {source: PerAddressDEFLT.personIdExternal, type: STRING, length: 100}
      ADDRESS_TYPE:  {source: PerAddressDEFLT.addressType, type: STRING, length: 128, picklist: addressType}
      ADDRESS_LINE1: {source: PerAddressDEFLT.address1, type: STRING, length: 256}
      ADDRESS_LINE2: {source: PerAddressDEFLT.address2, type: STRING, length: 256}
      CITY:          {source: PerAddressDEFLT.city, type: STRING, length: 256}
      STATE:         {source: PerAddressDEFLT.state, type: STRING, length: 256}
      ZIPCODE:       {source: PerAddressDEFLT.zipCode, type: STRING, length: 256}
