      PLAN_TYPE:      {source: Benefit.benefitType, type: STRING, length: 128, verify: true}
      COVERAGE_LEVEL: {source: BenefitEnrollment.coverage, type: STRING, length: 128, verify: true}
      EFFECTIVE_DATE: {source: BenefitEnrollment.effectiveDate, type: DATE, verify: true}
