      USERID:            {source: EmployeeTimeSheet.userId, type: STRING, length: 100}
      DATE:              {source: EmployeeTimeSheetEntry.startDate, type: DATE}
      HOURS:             {source: EmployeeTimeSheetEntry.quantityInHours, type: DECIMAL}
      OVERTIME_HOURS:    {source: EmployeeTimeSheetEntry.quantityInHours (overtime recording type), type: DECIMAL, verify: true}
      COST_CENTER:       {source: EmployeeTimeSheetEntry.costCenter, type: STRING, length: 128, verify: true}
      APPROVAL_STATUS:   {source: EmployeeTimeSheet.approvalStatus, type: STRING, length: 32}
      ABSENCE_TYPE:      {source: EmployeeTime.timeType, type: STRING, length: 128, check_table: TimeType}
      TIME_ACCOUNT_TYPE: {source: TimeAccount.accountType, type: STRING, length: 128, check_table: TimeAccountType}
      BALANCE:           {source: TimeAccountBalance.balance, type: DECIMAL, verify: true}
