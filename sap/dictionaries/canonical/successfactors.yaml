      SALARY:              {source: EmpPayCompRecurring.paycompvalue, type: DECIMAL, description: Pay component amount}
      CURRENCY:            {source: EmpPayCompRecurring.currencyCode, type: STRING, length: 20, check_table: Currency}
      COMP_FREQUENCY:      {source: EmpPayCompRecurring.frequency, type: STRING, length: 32, check_table: FOFrequency}
      PAY_RANGE_MIN:       {source: FOPayRange.minimumPay, type: DECIMAL}
      PAY_RANGE_MID:       {source: FOPayRange.midPoint, type: DECIMAL}
      PAY_RANGE_MAX:       {source: FOPayRange.maximumPay, type: DECIMAL}
      COMPA_RATIO:         {source: EmpCompensationCalculatedNavigation.compaRatio, type: DECIMAL, verify: true}

  PAYRESULT:
