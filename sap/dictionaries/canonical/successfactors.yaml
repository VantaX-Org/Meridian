  # I1 (review): Position extracts with from_date=None (no fromDate sent, see
  # sap/successfactors.py), so SF returns only the as-of-today row per position code and
  # keys: [CODE] never collides even though effectiveStartDate/effectiveEndDate are selected.
  # This is safe only because of that current-record-only extraction: the moment Position is
  # extracted with an effective-dated from_date, multiple rows per CODE become live and
  # EC299 (uniqueness on POSITION.CODE) will mass-fire on every position ever changed.
  POSITION:
    description: Positions (Position Management), current record
    source: Position
    keys: [CODE]
    fields:
      CODE:             {source: Position.code, type: STRING, length: 128, description: Position code}
      COMPANY:          {source: Position.company, type: STRING, length: 128, description: Legal entity of the position}
      DEPARTMENT:       {source: Position.department, type: STRING, length: 128, description: Department of the position}
      JOB_CODE:         {source: Position.jobCode, type: STRING, length: 128, description: Job classification of the position}
      COST_CENTER:      {source: Position.costCenter, type: STRING, length: 128, verify: true, description: Cost centre of the position}
      VACANT:           {source: Position.vacant, type: BOOLEAN, description: Position flagged as vacant (to be hired)}
      EFFECTIVE_STATUS: {source: Position.effectiveStatus, type: STRING, length: 2, description: A active / I inactive}
      CRITICALITY:      {source: Position.positionCriticality, type: STRING, length: 128, verify: true, description: Position criticality (key position indicator)}
      TARGET_FTE:       {source: Position.targetFTE, type: DECIMAL, verify: true, description: Target FTE of the position}
      MULTIPLE_INCUMBENTS: {source: Position.multipleIncumbentsAllowed, type: BOOLEAN, verify: true, description: More than one incumbent allowed}
      STANDARD_HOURS:   {source: Position.standardHours, type: DECIMAL, verify: true, description: Standard weekly hours of the position}
      EFFECTIVE_START_DATE: {source: Position.effectiveStartDate, type: DATE, verify: true, description: Effective start date of the current position record}
      EFFECTIVE_END_DATE:   {source: Position.effectiveEndDate, type: DATE, verify: true, description: Effective end date of the current position record}
      BUSINESS_UNIT:    {source: Position.businessUnit, type: STRING, length: 128, verify: true, check_table: FOBusinessUnit, description: Business unit of the position}
      DIVISION:         {source: Position.division, type: STRING, length: 128, verify: true, check_table: FODivision, description: Division of the position}
      LOCATION:         {source: Position.location, type: STRING, length: 128, verify: true, check_table: FOLocation, description: Location of the position}
      PAY_GRADE:        {source: Position.payGrade, type: STRING, length: 128, verify: true, check_table: FOPayGrade, description: Pay grade of the position}
      EXTERNAL_NAME:    {source: Position.externalName_defaultValue, type: STRING, length: 256, verify: true, description: External (job-board facing) position name}
      POSITION_TITLE:              {source: Position.positionTitle, type: STRING, length: 255, verify: true, description: Position title}
      POSITION_CONTROLLED:         {source: Position.positionControlled, type: BOOLEAN, verify: true, description: Position controlled}
      COMMENT:                     {source: Position.comment, type: STRING, length: 255, verify: true, description: Comment}
      INCUMBENT:                   {source: Position.incumbent, type: STRING, length: 255, verify: true, description: Incumbent}
