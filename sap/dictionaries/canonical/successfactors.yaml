# Meridian canonical views over SAP SuccessFactors (OData V2).
#
# Rules address SuccessFactors data as TABLE.FIELD (e.g. EMPEMPLOYMENT.USERID).
# Each canonical table flattens one or more SF entities; every field names its
# OData source as Entity.property. The SF connector selects exactly these
# properties and renames them to the canonical names.
#
# verify: true  — property name is standard in SAP's EC OData reference but
#                 was not confirmed against a live $metadata document; the SF
#                 connector's $metadata check reports it if the tenant differs.
# picklist:     — SF picklist id; domain rules prefer the tenant's live picklist
#                 values (PickListValueV2) over the rule's baseline list.
# Types: STRING, DATE, DATETIME, DECIMAL, INTEGER, BOOLEAN. length 0 = not fixed.

system: successfactors
tables:
  EMPEMPLOYMENT:
    description: Employment + current job information (EmpEmployment ⋈ EmpJob)
    source: EmpEmployment, EmpJob (effective-dated, current record)
    keys: [USERID]
    fields:
      USERID:          {source: EmpEmployment.userId, type: STRING, length: 100, description: User ID}
      PERSON_ID:       {source: EmpEmployment.personIdExternal, type: STRING, length: 100, description: Person ID (external)}
      START_DATE:      {source: EmpEmployment.startDate, type: DATE, description: Employment start date}
      END_DATE:        {source: EmpEmployment.endDate, type: DATE, description: Employment end date}
      CREATED_DATE:    {source: EmpEmployment.createdDateTime, type: DATETIME, description: Created on}
      LAST_MODIFIED:   {source: EmpJob.lastModifiedDateTime, type: DATETIME, description: Job info last modified}
      COMPANY:         {source: EmpJob.company, type: STRING, length: 128, check_table: FOCompany, description: Legal entity}
      DIVISION:        {source: EmpJob.division, type: STRING, length: 128, check_table: FODivision, description: Division}
      DEPARTMENT:      {source: EmpJob.department, type: STRING, length: 128, check_table: FODepartment, description: Department}
      LOCATION:        {source: EmpJob.location, type: STRING, length: 128, check_table: FOLocation, description: Location}
      COST_CENTER:     {source: EmpJob.costCenter, type: STRING, length: 128, check_table: FOCostCenter, description: Cost centre}
      JOB_CODE:        {source: EmpJob.jobCode, type: STRING, length: 128, check_table: FOJobCode, description: Job classification}
      JOB_TITLE:       {source: EmpJob.jobTitle, type: STRING, length: 256, description: Job title}
      MANAGER_ID:      {source: EmpJob.managerId, type: STRING, length: 100, description: Manager user ID}
      POSITION:        {source: EmpJob.position, type: STRING, length: 128, description: Position}
      EMPLOYMENT_TYPE: {source: EmpJob.employmentType, type: STRING, length: 128, picklist: employmentType, description: Employment type}
      EVENT_REASON:    {source: EmpJob.eventReason, type: STRING, length: 128, check_table: FOEventReason, description: Event reason}
      STATUS:          {source: EmpJob.emplStatus, type: STRING, length: 128, picklist: employee-status, description: Employee status}
      JOB_START_DATE:  {source: EmpJob.startDate, type: DATE, verify: true, description: Effective start date of the current job record}
      SEQ_NUMBER:      {source: EmpJob.seqNumber, type: INTEGER, verify: true, description: Sequence of job records on the same start date}
      EVENT:           {source: EmpJob.event, type: STRING, length: 128, verify: true, picklist: event, description: Job event (hire, transfer, termination, ...)}
      BUSINESS_UNIT:   {source: EmpJob.businessUnit, type: STRING, length: 128, verify: true, check_table: FOBusinessUnit, description: Business unit}
      FTE:             {source: EmpJob.fte, type: DECIMAL, verify: true, description: Full-time equivalent}
      STANDARD_HOURS:  {source: EmpJob.standardHours, type: DECIMAL, verify: true, description: Standard weekly hours}
      WORKING_DAYS_PER_WEEK: {source: EmpJob.workingDaysPerWeek, type: DECIMAL, verify: true, description: Working days per week}
      IS_FULLTIME:     {source: EmpJob.isFulltimeEmployee, type: BOOLEAN, verify: true, description: Full-time employee flag}
      REGULAR_TEMP:    {source: EmpJob.regularTemp, type: STRING, length: 128, verify: true, picklist: regular-temp, description: Regular or temporary}
      EMPLOYEE_CLASS:  {source: EmpJob.employeeClass, type: STRING, length: 128, verify: true, picklist: employee-class, description: Employee class}
      CONTRACT_TYPE:   {source: EmpJob.contractType, type: STRING, length: 128, verify: true, picklist: contractType, description: Contract type}
      CONTRACT_END_DATE: {source: EmpJob.contractEndDate, type: DATE, verify: true, description: Fixed-term contract end date}
      PROBATION_END_DATE: {source: EmpJob.probationPeriodEndDate, type: DATE, verify: true, description: Probation period end date}
      PAY_GROUP:       {source: EmpJob.payGroup, type: STRING, length: 128, verify: true, check_table: FOPayGroup, description: Pay group}
      PAY_SCALE_TYPE:  {source: EmpJob.payScaleType, type: STRING, length: 128, verify: true, description: Pay scale type}
      PAY_SCALE_AREA:  {source: EmpJob.payScaleArea, type: STRING, length: 128, verify: true, description: Pay scale area}
      PAY_SCALE_GROUP: {source: EmpJob.payScaleGroup, type: STRING, length: 128, verify: true, description: Pay scale group}
      PAY_SCALE_LEVEL: {source: EmpJob.payScaleLevel, type: STRING, length: 128, verify: true, description: Pay scale level}
      COUNTRY_OF_COMPANY: {source: EmpJob.countryOfCompany, type: STRING, length: 128, verify: true, description: Country of the legal entity on the job record}
      TIMEZONE:        {source: EmpJob.timezone, type: STRING, length: 128, verify: true, description: Time zone}
      ORIGINAL_START_DATE: {source: EmpEmployment.originalStartDate, type: DATE, verify: true, description: Original start date (first hire)}
      SENIORITY_DATE:  {source: EmpEmployment.seniorityDate, type: DATE, verify: true, description: Seniority start date}
      SERVICE_DATE:    {source: EmpEmployment.serviceDate, type: DATE, verify: true, description: Service date}
      LAST_DATE_WORKED: {source: EmpEmployment.lastDateWorked, type: DATE, verify: true, description: Last date worked}
      PAYROLL_END_DATE: {source: EmpEmployment.payrollEndDate, type: DATE, verify: true, description: Payroll end date}
      OK_TO_REHIRE:    {source: EmpEmployment.okToRehire, type: BOOLEAN, verify: true, description: Eligible for rehire}
      IS_CONTINGENT_WORKER: {source: EmpEmployment.isContingentWorker, type: BOOLEAN, verify: true, description: Contingent worker flag}
      IS_PRIMARY:      {source: EmpEmployment.isPrimary, type: BOOLEAN, verify: true, description: Primary employment (concurrent employment)}
      ASSIGNMENT_CLASS: {source: EmpEmployment.assignmentClass, type: STRING, length: 128, verify: true, description: ST standard, GA global assignment, PH higher duty, ...}
      PAY_GRADE:       {source: EmpJob.payGrade, type: STRING, length: 128, verify: true, check_table: FOPayGrade, description: Pay grade}
      WORK_SCHEDULE:   {source: EmpJob.workScheduleCode, type: STRING, length: 128, verify: true, description: Work schedule code}
      HOLIDAY_CALENDAR: {source: EmpJob.holidayCalendarCode, type: STRING, length: 128, verify: true, description: Holiday calendar code}
      TIME_TYPE_PROFILE: {source: EmpJob.timeTypeProfileCode, type: STRING, length: 128, verify: true, description: Time type profile code}
      JOB_END_DATE:    {source: EmpJob.endDate, type: DATE, verify: true, description: Effective end date of the current job record}

  PERINFO:
    description: Personal information (PerPersonal ⋈ PerPerson ⋈ primary PerNationalId)
    source: PerPersonal, PerPerson, PerNationalId
    keys: [PERSON_ID]
    fields:
      PERSON_ID:      {source: PerPersonal.personIdExternal, type: STRING, length: 100, description: Person ID}
      FIRSTNAME:      {source: PerPersonal.firstName, type: STRING, length: 128, description: First name}
      LASTNAME:       {source: PerPersonal.lastName, type: STRING, length: 128, description: Last name}
      MIDDLENAME:     {source: PerPersonal.middleName, type: STRING, length: 128, description: Middle name}
      PREFERRED_NAME: {source: PerPersonal.preferredName, type: STRING, length: 128, description: Preferred name}
      SALUTATION:     {source: PerPersonal.salutation, type: STRING, length: 128, picklist: salutation, description: Salutation}
      GENDER:         {source: PerPersonal.gender, type: STRING, length: 2, description: Gender}
      MARITAL_STATUS: {source: PerPersonal.maritalStatus, type: STRING, length: 128, picklist: ecMaritalStatus, description: Marital status}
      NATIONALITY:    {source: PerPersonal.nationality, type: STRING, length: 128, check_table: Country, description: Nationality}
      DATE_OF_BIRTH:  {source: PerPerson.dateOfBirth, type: DATE, description: Date of birth}
      NATIONAL_ID:    {source: PerNationalId.nationalId, type: STRING, length: 256, description: National ID (primary)}
      NATIONAL_ID_COUNTRY: {source: PerNationalId.country, type: STRING, length: 128, description: Country that issued the national ID}
      NATIONAL_ID_CARD_TYPE: {source: PerNationalId.cardType, type: STRING, length: 256, verify: true, description: National ID card type}
      COUNTRY_OF_BIRTH: {source: PerPerson.countryOfBirth, type: STRING, length: 128, verify: true, check_table: Country, description: Country of birth}
      DATE_OF_DEATH:  {source: PerPerson.dateOfDeath, type: DATE, verify: true, description: Date of death}
      SECOND_NATIONALITY: {source: PerPersonal.secondNationality, type: STRING, length: 128, verify: true, check_table: Country, description: Second nationality}
      PLACE_OF_BIRTH: {source: PerPerson.placeOfBirth, type: STRING, length: 128, verify: true, description: Place of birth}
      PERSON_UUID:    {source: PerPerson.perPersonUuid, type: STRING, length: 128, verify: true, description: Person UUID (stable surrogate key)}

  PEREMAIL:
    description: E-mail addresses
    source: PerEmail
    keys: [PERSON_ID, EMAIL_TYPE]
    fields:
      PERSON_ID:     {source: PerEmail.personIdExternal, type: STRING, length: 100}
      EMAIL_TYPE:    {source: PerEmail.emailType, type: STRING, length: 128, picklist: ecEmailType, description: E-mail type}
      EMAIL_ADDRESS: {source: PerEmail.emailAddress, type: STRING, length: 100, description: E-mail address}
      IS_PRIMARY:    {source: PerEmail.isPrimary, type: BOOLEAN, verify: true, description: Primary e-mail flag}

  PERPHONE:
    description: Phone numbers
    source: PerPhone
    keys: [PERSON_ID, PHONE_TYPE]
    fields:
      PERSON_ID:    {source: PerPhone.personIdExternal, type: STRING, length: 100}
      PHONE_TYPE:   {source: PerPhone.phoneType, type: STRING, length: 128, picklist: ecPhoneType, description: Phone type}
      PHONE_NUMBER: {source: PerPhone.phoneNumber, type: STRING, length: 256, description: Phone number}
      COUNTRY_CODE: {source: PerPhone.countryCode, type: STRING, length: 256, verify: true, description: International dialling code}
      AREA_CODE:    {source: PerPhone.areaCode, type: STRING, length: 256, verify: true, description: Area code}
      EXTENSION:    {source: PerPhone.extension, type: STRING, length: 256, verify: true, description: Extension}
      IS_PRIMARY:   {source: PerPhone.isPrimary, type: BOOLEAN, verify: true, description: Primary phone flag}

  PERADDRESS:
    description: Home address (default country format)
    source: PerAddressDEFLT
    # Record-key migration (added START_DATE alongside PERSON_ID/ADDRESS_TYPE): this is a
    # legitimate fix, not a revert candidate -- addresses are effective-dated in SF and the
    # 2-part key collapsed distinct historical rows. Any persisted remediation/finding state
    # keyed on the old 2-part failing_record_keys shape will not match after this change and
    # needs a migration or re-run; it is not auto-migrated here.
    keys: [PERSON_ID, ADDRESS_TYPE, START_DATE]
    fields:
      PERSON_ID:     {source: PerAddressDEFLT.personIdExternal, type: STRING, length: 100}
      ADDRESS_TYPE:  {source: PerAddressDEFLT.addressType, type: STRING, length: 128, picklist: addressType}
      START_DATE:    {source: PerAddressDEFLT.startDate, type: DATE, verify: true, description: Effective start date of the address record}
      ADDRESS_LINE1: {source: PerAddressDEFLT.address1, type: STRING, length: 256}
      ADDRESS_LINE2: {source: PerAddressDEFLT.address2, type: STRING, length: 256}
      CITY:          {source: PerAddressDEFLT.city, type: STRING, length: 256}
      STATE:         {source: PerAddressDEFLT.state, type: STRING, length: 256}
      ZIPCODE:       {source: PerAddressDEFLT.zipCode, type: STRING, length: 256}
      COUNTRY:       {source: PerAddressDEFLT.country, type: STRING, length: 128, check_table: Country}

  COMPINFO:
    description: Compensation (EmpCompensation ⋈ recurring pay component ⋈ pay range)
    source: EmpCompensation, EmpPayCompRecurring, FOPayRange
    keys: [USERID, EFFECTIVE_DATE]
    fields:
      USERID:              {source: EmpCompensation.userId, type: STRING, length: 100}
      EFFECTIVE_DATE:      {source: EmpCompensation.startDate, type: DATE}
      EFFECTIVE_DATE_COMP: {source: EmpPayCompRecurring.startDate, type: DATE, description: Pay component effective date}
      PAY_GROUP:           {source: EmpCompensation.payGroup, type: STRING, length: 128, check_table: FOPayGroup, description: Pay group}
      PAY_GRADE:           {source: EmpJob.payGrade, type: STRING, length: 128, check_table: FOPayGrade}
      PAY_TYPE:            {source: EmpPayCompRecurring.payComponent, type: STRING, length: 32, check_table: FOPayComponent, description: Pay component}
      SALARY:              {source: EmpPayCompRecurring.paycompvalue, type: DECIMAL, description: Pay component amount}
      CURRENCY:            {source: EmpPayCompRecurring.currencyCode, type: STRING, length: 20, check_table: Currency}
      COMP_FREQUENCY:      {source: EmpPayCompRecurring.frequency, type: STRING, length: 32, check_table: FOFrequency}
      PAY_RANGE_MIN:       {source: FOPayRange.minimumPay, type: DECIMAL}
      PAY_RANGE_MID:       {source: FOPayRange.midPoint, type: DECIMAL}
      PAY_RANGE_MAX:       {source: FOPayRange.maximumPay, type: DECIMAL}
      COMPA_RATIO:         {source: EmpCompensationCalculatedNavigation.compaRatio, type: DECIMAL, verify: true}
      EVENT_REASON:        {source: EmpCompensation.eventReason, type: STRING, length: 128, check_table: FOEventReason, verify: true, description: Compensation change reason}
      PAY_SCALE_TYPE:      {source: EmpJob.payScaleType, type: STRING, length: 32, verify: true, description: SAP pay scale type (PA0008.TRFAR)}
      PAY_SCALE_AREA:      {source: EmpJob.payScaleArea, type: STRING, length: 32, verify: true, description: SAP pay scale area (PA0008.TRFGB)}
      PAY_SCALE_LEVEL:     {source: EmpJob.payScaleLevel, type: STRING, length: 32, verify: true, description: SAP pay scale level (PA0008.TRFST)}
      END_DATE:            {source: EmpCompensation.endDate, type: DATE, verify: true, description: End of the compensation record's validity}
      PAYCOMP_END_DATE:    {source: EmpPayCompRecurring.endDate, type: DATE, verify: true, description: End of the recurring pay component's validity}
      PAYROLL_ID:          {source: EmpCompensation.payrollId, type: STRING, length: 256, verify: true, description: Personnel number in the payroll system (EC Payroll PERNR)}
      PAYROLL_SYSTEM_ID:   {source: EmpCompensation.payrollSystemId, type: STRING, length: 128, verify: true, description: Payroll system the employee is replicated to}
      PAY_GRADE_STATUS:    {source: FOPayGrade.status, type: STRING, length: 2, verify: true, description: A active / I inactive}
      PAY_RANGE_CURRENCY:  {source: FOPayRange.currency, type: STRING, length: 20, verify: true, description: Currency of the pay range}
      PAY_RANGE_FREQUENCY: {source: FOPayRange.frequencyCode, type: STRING, length: 32, verify: true, description: Frequency the pay range is expressed in}
      PAY_RANGE_STATUS:    {source: FOPayRange.status, type: STRING, length: 2, verify: true, description: A active / I inactive}
      PAY_COMPONENT_TYPE:  {source: FOPayComponent.payComponentType, type: STRING, length: 32, verify: true, description: Pay component type (AMOUNT / PERCENTAGE / NUMBER)}
      PAY_COMPONENT_RECURRING: {source: FOPayComponent.recurring, type: BOOLEAN, verify: true, description: Pay component is a recurring component}
      PAY_COMPONENT_CURRENCY:  {source: FOPayComponent.currency, type: STRING, length: 20, verify: true, description: Default currency of the pay component}
      PAY_COMPONENT_FREQUENCY: {source: FOPayComponent.frequencyCode, type: STRING, length: 32, verify: true, description: Default frequency of the pay component}
      PAY_COMPONENT_STATUS:    {source: FOPayComponent.status, type: STRING, length: 2, verify: true, description: A active / I inactive}
      PAY_COMPONENT_IS_EARNING: {source: FOPayComponent.isEarning, type: BOOLEAN, verify: true, description: Pay component is an earning (not a deduction)}
      PAY_COMPONENT_CAN_OVERRIDE: {source: FOPayComponent.canOverride, type: BOOLEAN, verify: true, description: Default value of the pay component may be overridden}
      PAY_COMPONENT_DEFAULT:   {source: FOPayComponent.payComponentValue, type: DECIMAL, verify: true, description: Default value of the pay component}
      ANNUALIZATION_FACTOR:    {source: FOFrequency.annualizationFactor, type: DECIMAL, verify: true, description: Periods per year of the pay component frequency}
      ANNUAL_SALARY:       {source: EmpCompensationCalculatedNavigation.yearlyBaseSalary, type: DECIMAL, verify: true, description: Calculated annual base salary}
      RANGE_PENETRATION:   {source: EmpCompensationCalculatedNavigation.rangePenetration, type: DECIMAL, verify: true, description: Calculated position in the pay range (0 at minimum, 1 at maximum)}

  PAYCOMPNONREC:
    description: One-time pay components (EmpPayCompNonRecurring)
    source: EmpPayCompNonRecurring
    keys: [USERID, PAY_COMPONENT, PAY_DATE]
    fields:
      USERID:          {source: EmpPayCompNonRecurring.userId, type: STRING, length: 100}
      PAY_COMPONENT:   {source: EmpPayCompNonRecurring.payComponentCode, type: STRING, length: 32, verify: true, description: One-time pay component}
      PAY_DATE:        {source: EmpPayCompNonRecurring.payDate, type: DATE}
      VALUE:           {source: EmpPayCompNonRecurring.value, type: DECIMAL}
      CURRENCY:        {source: EmpPayCompNonRecurring.currencyCode, type: STRING, length: 20}
      ALT_COST_CENTER: {source: EmpPayCompNonRecurring.alternativeCostCenter, type: STRING, length: 128, verify: true, description: Cost centre charged instead of the employee's own}
      SEQUENCE_NUMBER: {source: EmpPayCompNonRecurring.sequenceNumber, type: STRING, length: 32, verify: true, description: Sequence of several payments of one component on one date}
      NUMBER_OF_UNITS: {source: EmpPayCompNonRecurring.numberOfUnits, type: DECIMAL, verify: true, description: Quantity paid (units-based component)}
      UNIT_OF_MEASURE: {source: EmpPayCompNonRecurring.unitOfMeasure, type: STRING, length: 32, verify: true, description: Unit of the quantity paid}

  PAYRESULT:
    description: Payroll results (Employee Central Payroll export / Payroll Control Center)
    source: EC Payroll result export (not a standard SF OData entity)
    keys: [USERID, PAY_PERIOD]
    fields:
      USERID:       {source: payroll_export.personnel_number, type: STRING, length: 100, verify: true}
      USERID_PAY:   {source: payroll_export.personnel_number, type: STRING, length: 100, verify: true, description: Payee on the payroll result}
      PAY_PERIOD:   {source: payroll_export.period, type: STRING, length: 6, verify: true}
      PAY_DATE:     {source: payroll_export.pay_date, type: DATE, verify: true}
      PAYROLL_AREA: {source: payroll_export.payroll_area, type: STRING, length: 2, verify: true}
      COMPANY:      {source: payroll_export.company_code, type: STRING, length: 4, verify: true}
      COST_CENTRE:  {source: payroll_export.cost_center, type: STRING, length: 10, verify: true}
      GROSS_PAY:    {source: payroll_export.gross, type: DECIMAL, verify: true}
      NET_PAY:      {source: payroll_export.net, type: DECIMAL, verify: true}
      TAX_AMOUNT:   {source: payroll_export.tax, type: DECIMAL, verify: true}
      DEDUCTIONS:   {source: payroll_export.deductions, type: DECIMAL, verify: true}
      CURRENCY:     {source: payroll_export.currency, type: STRING, length: 5, verify: true}
      DELTA_FLAG:   {source: payroll_export.delta_flag, type: STRING, length: 1, verify: true}

  TIMESHEET:
    description: Time recording (EmployeeTimeSheetEntry, EmployeeTime, TimeAccount)
    source: EmployeeTimeSheet, EmployeeTimeSheetEntry, EmployeeTime, TimeAccount
    keys: [USERID, DATE]
