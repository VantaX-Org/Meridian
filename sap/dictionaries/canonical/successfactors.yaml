      ACCOUNT_START_DATE:  {source: TimeAccount.startDate, type: DATE, verify: true, description: Time account validity start}
      ACCOUNT_END_DATE:    {source: TimeAccount.endDate, type: DATE, verify: true, description: Time account validity end}
      BOOKING_START_DATE:  {source: TimeAccount.bookingStartDate, type: DATE, verify: true, description: First date bookable against the account}
      BOOKING_END_DATE:    {source: TimeAccount.bookingEndDate, type: DATE, verify: true, description: Last date bookable against the account}
