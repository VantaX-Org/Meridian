# Active population per table: records a rule on that table does NOT judge.
#
# SAP keeps dead and special records in the same tables as live ones. Judging a
# vendor flagged for deletion for a missing phone number, or a one-time account
# (whose name/address/bank data is captured per document, in BSEC) for a
# missing street, produces findings nobody should act on. Every exclusion here
# is an SAP-standard flag; each is counted per rule (details.population_excluded)
# so the population is never silently smaller.
#
#   field        TABLE.FIELD holding the flag (parent-table flags cascade:
#                the central deletion flag LFA1.LOEVM covers every LFB1 row)
#   values       flag values that exclude; omitted = any non-blank value
#   only_fields / only_tables
#                the exclusion applies only to rules reading these columns
#
# A rule is never filtered by a flag it reads itself (MM013 validates
# MARA.LVORM), and `population: all` on a rule disables every exclusion.

_deleted: &deleted_label "flagged for deletion"

# name, address, communication, tax and bank data of a one-time account live on
# the document (BSEC), not the master record
_one_time_fields: &one_time_fields
  [NAME2, NAME3, NAME4, STRAS, ORT01, ORT02, PSTLZ, PFACH, PSTL2, REGIO, TELF1, TELF2, TELFX,
   TELX1, TELTX, STCD1, STCD2, STCD3, STCD4, STCD5, STCEG, STKZN, STKZU, BANKS, BANKL, BANKN, BKONT, KOINH, IBAN,
   ADR6.SMTP_ADDR, ADR2.TEL_NUMBER, ADR3.FAX_NUMBER, ADRC.STREET, ADRC.CITY1, ADRC.POST_CODE1, ADRC.TEL_NUMBER]

tables:
  LFA1:
    - {id: deleted, field: LFA1.LOEVM, label: *deleted_label}
    - {id: one_time_account, field: LFA1.XCPDK, values: [X], label: "one-time account", only_fields: *one_time_fields}
  LFB1:
    - {id: deleted, field: LFB1.LOEVM, label: *deleted_label}
    - {id: deleted, field: LFA1.LOEVM, label: *deleted_label}
  LFM1:
    - {id: deleted, field: LFM1.LOEVM, label: *deleted_label}
    - {id: deleted, field: LFA1.LOEVM, label: *deleted_label}
  LFBK:
    - {id: deleted, field: LFA1.LOEVM, label: *deleted_label}
    - {id: one_time_account, field: LFA1.XCPDK, values: [X], label: "one-time account"}
  KNA1:
