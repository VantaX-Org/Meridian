# SAP table relationships used by the check engine to evaluate each rule at
# its correct record grain (checks/frames.py).
#
#   parent → child, joined on join: {child_field: parent_field}
#   cardinality: "one"  — at most one child row per parent row (after filter /
#                         prefer); the child is an *attribute* of the parent
#                         and rules on it are evaluated at the parent's grain
#                         (e.g. a vendor with no ADR6 e-mail row fails a
#                         "vendor e-mail required" check).
#                "many" — a real child entity with its own grain (LFB1 is one
#                         row per vendor × company code).
#   filter:  {FIELD: value} applied to the child before joining
#            (current time segment, active status, default address).
#   prefer:  {FIELD: value} rows sorted first before de-duplicating on the
#            join keys (text tables: English description first).
#
# Every field named here must exist in sap/dictionaries (enforced by
# tests/checks/test_joins_valid.py).

edges:
  # ── Vendor master ──────────────────────────────────────────────────────
  - {parent: LFA1, child: LFB1,  join: {LIFNR: LIFNR}, cardinality: many}
  # the customer account a vendor is linked to (clearing between vendor and customer)
  - {parent: KNA1, child: LFA1,  join: {KUNNR: KUNNR}, cardinality: many}
  - {parent: LFB1, child: LFB5,  join: {LIFNR: LIFNR, BUKRS: BUKRS}, cardinality: one}
  - {parent: LFB1, child: LFBW, join: {LIFNR: LIFNR, BUKRS: BUKRS}, cardinality: many}
  - {parent: T012, child: T012K, join: {BUKRS: BUKRS, HBKID: HBKID}, cardinality: many}
  - {parent: SKB1, child: T012K, join: {BUKRS: BUKRS, HKONT: SAKNR}, cardinality: many}
  - {parent: LFA1, child: LFBK,  join: {LIFNR: LIFNR}, cardinality: one}
  - {parent: LFA1, child: LFM1,  join: {LIFNR: LIFNR}, cardinality: many}
  - {parent: LFA1, child: ADRC,  join: {ADDRNUMBER: ADRNR}, cardinality: one}
  - {parent: LFA1, child: ADR6,  join: {ADDRNUMBER: ADRNR}, cardinality: one, prefer: {FLGDEFAULT: "X"}}

  # ── Customer master ────────────────────────────────────────────────────
  - {parent: KNA1, child: KNB1,  join: {KUNNR: KUNNR}, cardinality: many}
  - {parent: KNB1, child: KNB5,  join: {KUNNR: KUNNR, BUKRS: BUKRS}, cardinality: one}
  - {parent: KNA1, child: KNKK,  join: {KUNNR: KUNNR}, cardinality: one}
  - {parent: KNA1, child: KNVV,  join: {KUNNR: KUNNR}, cardinality: many}
  - {parent: KNA1, child: KNBK,  join: {KUNNR: KUNNR}, cardinality: one}
  - {parent: KNA1, child: ADRC,  join: {ADDRNUMBER: ADRNR}, cardinality: one}
  - {parent: KNA1, child: ADR6,  join: {ADDRNUMBER: ADRNR}, cardinality: one, prefer: {FLGDEFAULT: "X"}}
  # contact persons (KNVK holds both customer and vendor contacts)
  - {parent: KNA1, child: KNVK,  join: {KUNNR: KUNNR}, cardinality: many}
  - {parent: LFA1, child: KNVK,  join: {LIFNR: LIFNR}, cardinality: many}

  # ── Business partner ───────────────────────────────────────────────────
  - {parent: BUT000, child: BUT020, join: {PARTNER: PARTNER}, cardinality: one}
  - {parent: BUT020, child: ADRC,   join: {ADDRNUMBER: ADDRNUMBER}, cardinality: one}
  - {parent: BUT020, child: ADR6,   join: {ADDRNUMBER: ADDRNUMBER}, cardinality: one, prefer: {FLGDEFAULT: "X"}}
  - {parent: BUT000, child: BUT100, join: {PARTNER: PARTNER}, cardinality: many}
  - {parent: BUT000, child: BUT0BK, join: {PARTNER: PARTNER}, cardinality: one}
  - {parent: BUT000, child: BUT0ID, join: {PARTNER: PARTNER}, cardinality: many}
  - {parent: BUT000, child: DFKKBPTAXNUM, join: {PARTNER: PARTNER}, cardinality: many}

  # ── Material master ────────────────────────────────────────────────────
  - {parent: MARA, child: MAKT, join: {MATNR: MATNR}, cardinality: one, prefer: {SPRAS: "E"}}
  - {parent: MARA, child: MARC, join: {MATNR: MATNR}, cardinality: many}
  - {parent: MARC, child: MARD, join: {MATNR: MATNR, WERKS: WERKS}, cardinality: many}
  - {parent: MARC, child: MBEW, join: {MATNR: MATNR, BWKEY: WERKS}, cardinality: one, prefer: {BWTAR: ""}}
  - {parent: MARA, child: MVKE, join: {MATNR: MATNR}, cardinality: many}
  - {parent: MARA, child: MARM, join: {MATNR: MATNR}, cardinality: many}
  - {parent: MARA, child: MLGN, join: {MATNR: MATNR}, cardinality: many}
  - {parent: MLGN, child: MLGT, join: {MATNR: MATNR, LGNUM: LGNUM}, cardinality: many}
  - {parent: MARA, child: MEAN, join: {MATNR: MATNR}, cardinality: many}

  # ── Batches ────────────────────────────────────────────────────────────
  - {parent: MARA, child: MCH1, join: {MATNR: MATNR}, cardinality: many}
  - {parent: MCH1, child: MCHA, join: {MATNR: MATNR, CHARG: CHARG}, cardinality: many}
  - {parent: MCHA, child: MCHB, join: {MATNR: MATNR, WERKS: WERKS, CHARG: CHARG}, cardinality: many}

  # ── General ledger ─────────────────────────────────────────────────────
  - {parent: SKA1, child: SKAT, join: {KTOPL: KTOPL, SAKNR: SAKNR}, cardinality: one, prefer: {SPRAS: "E"}}
  - {parent: SKA1, child: SKB1, join: {SAKNR: SAKNR}, cardinality: many}
  # chart of accounts and company code above the G/L master (chart-level and company-code-level settings)
  - {parent: T004, child: SKA1, join: {KTOPL: KTOPL}, cardinality: many}
  - {parent: T001, child: SKB1, join: {BUKRS: BUKRS}, cardinality: many}
  # cost elements under their controlling area (chart of accounts of the CO area)
  - {parent: TKA01, child: CSKB, join: {KOKRS: KOKRS}, cardinality: many}
  # company codes assigned to the controlling area (OX19)
  - {parent: TKA01, child: TKA02, join: {KOKRS: KOKRS}, cardinality: many}
  - {parent: BKPF, child: BSEG, join: {BUKRS: BUKRS, BELNR: BELNR, GJAHR: GJAHR}, cardinality: many}
  - {parent: SKB1, child: BSEG, join: {BUKRS: BUKRS, HKONT: SAKNR}, cardinality: many}

  # ── Asset accounting ───────────────────────────────────────────────────
  - {parent: ANLA, child: ANLB, join: {BUKRS: BUKRS, ANLN1: ANLN1, ANLN2: ANLN2}, cardinality: many}
  - {parent: ANLA, child: ANLZ, join: {BUKRS: BUKRS, ANLN1: ANLN1, ANLN2: ANLN2}, cardinality: one, filter: {BDATU: "99991231"}}
  # company code and its asset accounting settings (chart of depreciation) above the asset
  - {parent: T001, child: ANLA, join: {BUKRS: BUKRS}, cardinality: many}
  - {parent: T093C, child: ANLA, join: {BUKRS: BUKRS}, cardinality: many}

  # ── Purchasing ─────────────────────────────────────────────────────────
  - {parent: EKKO, child: EKPO, join: {EBELN: EBELN}, cardinality: many}
  # master data behind documents (cross-object consistency: open items on dead masters)
  - {parent: LFA1, child: EKKO, join: {LIFNR: LIFNR}, cardinality: many}
  - {parent: MARA, child: EKPO, join: {MATNR: MATNR}, cardinality: many}
  - {parent: MARC, child: EKPO, join: {MATNR: MATNR, WERKS: WERKS}, cardinality: many}
  - {parent: LFM1, child: EKKO, join: {LIFNR: LIFNR, EKORG: EKORG}, cardinality: many}

  # ── Sales (ECC status tables feed S/4 VBAK/VBAP status fields) ─────────
  - {parent: VBAK, child: VBAP, join: {VBELN: VBELN}, cardinality: many}
  - {parent: KNA1, child: VBAK, join: {KUNNR: KUNNR}, cardinality: many}
  - {parent: MARA, child: VBAP, join: {MATNR: MATNR}, cardinality: many}
  # reconciliation account of a vendor / customer company-code record
  - {parent: SKB1, child: LFB1, join: {BUKRS: BUKRS, AKONT: SAKNR}, cardinality: many}
  - {parent: SKB1, child: KNB1, join: {BUKRS: BUKRS, AKONT: SAKNR}, cardinality: many}
  - {parent: VBAK, child: VBUK, join: {VBELN: VBELN}, cardinality: one}
  - {parent: VBAP, child: VBUP, join: {VBELN: VBELN, POSNR: POSNR}, cardinality: one}

  # ── Open items (vendor / customer sub-ledger) ───────────────────────────
  - {parent: LFB1, child: BSIK, join: {BUKRS: BUKRS, LIFNR: LIFNR}, cardinality: many}
  - {parent: LFB1, child: BSAK, join: {BUKRS: BUKRS, LIFNR: LIFNR}, cardinality: many}
  - {parent: KNB1, child: BSID, join: {BUKRS: BUKRS, KUNNR: KUNNR}, cardinality: many}
  - {parent: KNB1, child: BSAD, join: {BUKRS: BUKRS, KUNNR: KUNNR}, cardinality: many}

  # ── PO history (GR/IR) and logistics invoice verification ──────────────
  - {parent: EKPO, child: EKBE, join: {EBELN: EBELN, EBELP: EBELP}, cardinality: many}
  - {parent: EINA, child: EINE, join: {INFNR: INFNR}, cardinality: many}
  - {parent: RBKP, child: RSEG, join: {BELNR: BELNR, GJAHR: GJAHR}, cardinality: many}
  - {parent: LFA1, child: RBKP, join: {LIFNR: LIFNR}, cardinality: many}

  # ── Pricing condition records (A-table key → KONH header → KONP item) ──
  # the first item carries the rate; KOPOS 02+ are condition supplements
  - {parent: KONH, child: KONP, join: {KNUMH: KNUMH}, cardinality: one, prefer: {KOPOS: "01"}}
  - {parent: KONH, child: A004, join: {KNUMH: KNUMH}, cardinality: many}
  - {parent: KONH, child: A005, join: {KNUMH: KNUMH}, cardinality: many}
  - {parent: KONH, child: A304, join: {KNUMH: KNUMH}, cardinality: many}
  - {parent: KONH, child: A305, join: {KNUMH: KNUMH}, cardinality: many}
  - {parent: KONH, child: A017, join: {KNUMH: KNUMH}, cardinality: many}
  - {parent: KONH, child: A018, join: {KNUMH: KNUMH}, cardinality: many}

  # ── HCM: the employee's current employment status beside each org-assignment record ──
  - {parent: PA0001, child: PA0000, join: {PERNR: PERNR}, cardinality: one, filter: {ENDDA: "99991231"}}
  - {parent: PA0002, child: PA0000, join: {PERNR: PERNR}, cardinality: one, filter: {ENDDA: "99991231"}}
  # the infotype record in force today beside the org-assignment record (time constraint 1/2: at most one)
  - {parent: PA0001, child: PA0003, join: {PERNR: PERNR}, cardinality: one}
  - {parent: PA0001, child: PA0007, join: {PERNR: PERNR}, cardinality: one, filter: {ENDDA: "99991231"}}
  - {parent: PA0001, child: PA0008, join: {PERNR: PERNR}, cardinality: one, filter: {ENDDA: "99991231"}}
  - {parent: PA0001, child: PA0105, join: {PERNR: PERNR}, cardinality: one, filter: {SUBTY: "0001", ENDDA: "99991231"}}
  - {parent: PA0001, child: T500P, join: {PERSA: WERKS}, cardinality: one}
  - {parent: PA0105, child: USR02, join: {BNAME: USRID}, cardinality: one}
  - {parent: PA0001, child: HRP1001, join: {OBJID: PLANS}, cardinality: one, filter: {PLVAR: "01", OTYPE: S, RSIGN: A, RELAT: "003", ENDDA: "99991231"}}

  # ── Payroll: results directory → wage-type totals (Z_MERIDIAN_PAYROLL_TOTALS) ──
  - {parent: HRPY_RGDIR, child: ZMERIDIAN_PAYRT, join: {PERNR: PERNR, SEQNR: SEQNR}, cardinality: many}

  # ── Plant maintenance ──────────────────────────────────────────────────
  - {parent: EQUI, child: EQKT,  join: {EQUNR: EQUNR}, cardinality: one, prefer: {SPRAS: "E"}}
  - {parent: EQUI, child: EQUZ,  join: {EQUNR: EQUNR}, cardinality: one, filter: {DATBI: "99991231"}}
  - {parent: EQUZ, child: ILOA,  join: {ILOAN: ILOAN}, cardinality: one}
  - {parent: EQUI, child: JEST,  join: {OBJNR: OBJNR}, cardinality: one, filter: {INACT: ""}, prefer: {}}
  - {parent: EQUI, child: FLEET, join: {OBJNR: OBJNR}, cardinality: one}
  - {parent: EQUI, child: FLEET_MASTER, join: {EQUNR: EQUNR}, cardinality: one}
  # ── Project system and internal orders ─────────────────────────────────
  - {parent: PROJ, child: PRPS, join: {PSPHI: PSPNR}, cardinality: many}
  - {parent: PRPS, child: PRHI, join: {POSNR: PSPNR}, cardinality: one}
  - {parent: PRPS, child: AUFK, join: {PSPEL: PSPNR}, cardinality: many}
  - {parent: AUFK, child: T003O, join: {AUART: AUART}, cardinality: one}
  - {parent: COBRA, child: COBRB, join: {OBJNR: OBJNR}, cardinality: many}
  - {parent: IFLOT, child: IFLOTX, join: {TPLNR: TPLNR}, cardinality: one, prefer: {SPRAS: "E"}}
  - {parent: IFLOT, child: ILOA,  join: {ILOAN: ILOAN}, cardinality: one}

  # ── Production planning ────────────────────────────────────────────────
  - {parent: MAST, child: STKO, join: {STLNR: STLNR, STLAL: STLAL}, cardinality: one, filter: {STLTY: "M"}}
  - {parent: STKO, child: STPO, join: {STLNR: STLNR}, cardinality: many, filter: {STLTY: "M"}}
  - {parent: PLKO, child: PLPO, join: {PLNTY: PLNTY, PLNNR: PLNNR}, cardinality: many}

  # ── Warehouse (classic WM) & transport ─────────────────────────────────
  - {parent: LTAK, child: LTAP, join: {LGNUM: LGNUM, TANUM: TANUM}, cardinality: many}
  - {parent: LAGP, child: LQUA, join: {LGNUM: LGNUM, LGTYP: LGTYP, LGPLA: LGPLA}, cardinality: many}
  # material/plant settings of stock and TO items (batch management, …)
  - {parent: MARC, child: LQUA, join: {MATNR: MATNR, WERKS: WERKS}, cardinality: many}
  - {parent: MARC, child: LTAP, join: {MATNR: MATNR, WERKS: WERKS}, cardinality: many}
  # embedded / decentralised EWM (/SCWM/ namespace)
  - {parent: /SCWM/LAGP, child: /SCWM/AQUA, join: {LGNUM: LGNUM, LGPLA: LGPLA}, cardinality: many}
  - {parent: VTTK, child: VTTP, join: {TKNUM: TKNUM}, cardinality: many}
  - {parent: VTTK, child: TVRO, join: {ROUTE: ROUTE}, cardinality: one}

  # ── GRC access control, MDG change requests, change documents ─────────
  - {parent: GRACUSERROLE, child: GRACROLE, join: {ROLEID: ROLE_ID}, cardinality: one}
  - {parent: GRACSODRISK, child: GRACSODRISKT, join: {RISKID: RISKID}, cardinality: one, prefer: {LANG: "E"}}
  - {parent: USMD120C, child: USMD1213, join: {USMD_CREQUEST: USMD_CREQUEST}, cardinality: many}
  - {parent: CDHDR, child: CDPOS, join: {OBJECTCLAS: OBJECTCLAS, OBJECTID: OBJECTID, CHANGENR: CHANGENR}, cardinality: many}
  - {parent: EDIDC, child: EDIDS, join: {DOCNUM: DOCNUM}, cardinality: many}

  # ── SuccessFactors canonical views ─────────────────────────────────────
  - {parent: PERINFO, child: EMPEMPLOYMENT, join: {PERSON_ID: PERSON_ID}, cardinality: many}
  - {parent: PERINFO, child: PEREMAIL, join: {PERSON_ID: PERSON_ID}, cardinality: many}
  - {parent: PERINFO, child: PERPHONE, join: {PERSON_ID: PERSON_ID}, cardinality: many}
  - {parent: PERINFO, child: PERADDRESS, join: {PERSON_ID: PERSON_ID}, cardinality: many}
  - {parent: EMPEMPLOYMENT, child: COMPINFO, join: {USERID: USERID}, cardinality: many}
  - {parent: EMPEMPLOYMENT, child: TIMESHEET, join: {USERID: USERID}, cardinality: many}
  - {parent: EMPEMPLOYMENT, child: BENEFITENROLLMENT, join: {USERID: USERID}, cardinality: many}
  - {parent: EMPEMPLOYMENT, child: GOALPLAN, join: {USERID: USERID}, cardinality: many}
  - {parent: EMPEMPLOYMENT, child: PMREVIEWRESULT, join: {USERID: USERID}, cardinality: many}
  - {parent: EMPEMPLOYMENT, child: PAYRESULT, join: {USERID: USERID}, cardinality: many}
  - {parent: EMPEMPLOYMENT, child: LEARNINGASSIGNMENT, join: {USERID: USERID}, cardinality: many}
  - {parent: EMPEMPLOYMENT, child: LEARNINGCOMPLETION, join: {USERID: USERID}, cardinality: many}
  - {parent: EMPEMPLOYMENT, child: ONBOARDINGCANDIDATEINFO, join: {USERID: USERID}, cardinality: one}
  - {parent: JOBREQUISITION, child: JOBAPPLICATION, join: {JOB_REQ_ID: JOB_REQ_ID}, cardinality: many}
  # foundation objects and the position an employment points at (attributes of the employment)
  - {parent: EMPEMPLOYMENT, child: POSITION, join: {CODE: POSITION}, cardinality: one}
  - {parent: EMPEMPLOYMENT, child: FOCOMPANY, join: {EXTERNAL_CODE: COMPANY}, cardinality: one}
  - {parent: EMPEMPLOYMENT, child: FODEPARTMENT, join: {EXTERNAL_CODE: DEPARTMENT}, cardinality: one}

  # Concur Expense and SAP Ariba (canonical views, sap/dictionaries/canonical)
  - {parent: CONCUR_USER, child: CONCUR_REPORT, join: {OWNER_LOGIN_ID: LOGIN_ID}, cardinality: many}
  - {parent: CONCUR_REPORT, child: CONCUR_ENTRY, join: {REPORT_ID: REPORT_ID}, cardinality: many}
  - {parent: ARIBA_PO, child: ARIBA_INVOICE, join: {PURCHASE_ORDER_ID: ORDER_ID}, cardinality: many}

# Default grain per module when a rule names only attribute tables.
anchors:
  accounts_payable: LFA1
  accounts_receivable: KNA1
  sd_customer_master: KNA1
  business_partner: BUT000
  material_master: MARA
  mm_purchasing: EKKO
  fi_gl: SKA1
  asset_accounting: ANLA
  hcm: PA0001
  controlling: CSKS
  plant_maintenance: EQUI
  fleet_management: EQUI
  production_planning: MAST
  project_system: PRPS
  sd_sales_orders: VBAK
  batch_management: MCH1
  ewms_stock: LQUA
  ewms_transfer_orders: LTAK
  transport_management: VTTK
  grc_compliance: GRACUSERROLE
  mdg_master_data: USMD120C
  interface_health: EDIDC
  employee_central: EMPEMPLOYMENT
  s4hc_master_data: BUT000
  concur_expense: CONCUR_REPORT
  concur_users: CONCUR_USER
  ariba_supplier: ARIBA_SUPPLIER
  ariba_contracts: ARIBA_CONTRACT
  ariba_procurement: ARIBA_PO
