# Bounded reads for transactional tables (master data is always read in full).
#
#   where: pushed down to RFC_READ_TABLE. Placeholders:
#          {months_ago:N}  → YYYYMMDD N months before today
#          {years_ago:N}   → YYYY N years before this year
#          {days_ago:N}    → YYYYMMDD N days before today
#   via:   read only rows belonging to the parent rows already extracted
#          (IN-lists over the join keys from sap/dictionaries/joins.yaml)
# Override per deployment with MERIDIAN_EXTRACT_MONTHS (default windows below).
EKKO:  {where: "BEDAT >= '{months_ago:24}'"}
EKPO:  {via: EKKO}
VBAK:  {where: "ERDAT >= '{months_ago:24}'"}
VBAP:  {via: VBAK}
VBUK:  {via: VBAK}
VBUP:  {via: VBAP}
BKPF:  {where: "BUDAT >= '{months_ago:3}'"}  # FI documents are high-volume: last quarter
BSEG:  {via: BKPF}
LTAK:  {where: "BDATU >= '{months_ago:6}'"}
LTAP:  {via: LTAK}
/SCWM/ORDIM_C: {where: "CONFIRMED_AT >= '{months_ago:6}000000'"}  # EWM confirmed tasks (DEC15 timestamp)
VTTK:  {where: "ERDAT >= '{months_ago:12}'"}
VTTP:  {via: VTTK}
CDHDR: {where: "UDATE >= '{months_ago:3}'"}
CDPOS: {via: CDHDR}
USMD120C: {where: "USMD_CREATED_AT >= '{months_ago:24}000000'"}
USMD1213: {via: USMD120C}
# open items are read in full (they are the live sub-ledger); cleared items by clearing date
BSAK:  {where: "AUGDT >= '{months_ago:12}'"}
BSAD:  {where: "AUGDT >= '{months_ago:12}'"}
EKBE:  {via: EKPO}
RBKP:  {where: "BUDAT >= '{months_ago:24}'"}
# process discovery (counts + recency of document types): last 12 months of each header
VBRK:  {where: "FKDAT >= '{months_ago:12}'"}
LIKP:  {where: "ERDAT >= '{months_ago:12}'"}
MKPF:  {where: "BUDAT >= '{months_ago:12}'"}
EBAN:  {where: "BADAT >= '{months_ago:12}'"}
RSEG:  {via: RBKP}
# condition records still valid today or later (expired prices cannot be used)
KONH:  {where: "DATBI >= '{months_ago:0}'"}
KONP:  {via: KONH}
KONV:  {via: VBAK}
A004:  {where: "DATBI >= '{months_ago:0}'"}
A005:  {where: "DATBI >= '{months_ago:0}'"}
A304:  {where: "DATBI >= '{months_ago:0}'"}
A305:  {where: "DATBI >= '{months_ago:0}'"}
A017:  {where: "DATBI >= '{months_ago:0}'"}
A018:  {where: "DATBI >= '{months_ago:0}'"}
HRPY_RGDIR: {where: "FPEND >= '{months_ago:24}'"}
ZMERIDIAN_PAYRT: {via: HRPY_RGDIR}  # read through the customer's RFC function, not RFC_READ_TABLE
# S/4HANA universal journal (read only when the live dictionary has it): last quarter, like BKPF
ACDOCA: {where: "BUDAT >= '{months_ago:3}'"}
# S/4HANA document pricing conditions (live dictionary only): last quarter by pricing date
PRCD_ELEMENTS: {where: "KDATU >= '{months_ago:3}'"}
# IDocs: EDIDC grows without bound on busy systems, so never read in full.
# Status records of an IDoc are logged on/after its creation, so the same
# LOGDAT window covers EDIDS without per-IDoc IN-lists.
EDIDC: {where: "CREDAT >= '{days_ago:90}'"}
EDIDS: {where: "LOGDAT >= '{days_ago:90}'"}
# qRFC/tRFC queues hold only unprocessed LUWs; a wider window keeps old stuck entries.
TRFCQOUT:   {where: "QRFCDATUM >= '{days_ago:365}'"}
TRFCQIN:    {where: "QRFCDATUM >= '{days_ago:365}'"}
ARFCSSTATE: {where: "ARFCDATUM >= '{days_ago:365}'"}
QALS:  {where: "ENSTEHDAT >= '{months_ago:24}'"}
# NAST output status records: two years covers the 12 month deletion-candidate rule
NAST: {where: "ERDAT >= '{months_ago:24}'"}
