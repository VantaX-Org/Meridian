# Policy packs (api/services/policy_packs.py, GET /api/v1/policy-packs).
#
# A pack names field classes, each with the authority it answers to (a regulation article or section, as text) and
# the rules of the catalogue (checks/rules) whose checked field is one of the class's fields: those rules evidence the
# class. Applying a pack (POST /api/v1/policy-packs/{id}/apply, manage_rules) materialises its classes for the tenant
# (policy_field_classes, migration 113); an applied class with a failing critical rule is a policy breach on the
# landscape cell and the object receipt.
#
# ``rules`` is generated from the catalogue: every enabled rule whose ``field`` or ``fields`` names one of the class's
# fields. tests/test_policy_packs.py fails when a listed rule leaves the catalogue or stops checking a class field.
# No URLs: authorities are cited by article or section so the text does not rot.
packs:
- id: gdpr
  name: GDPR personal data
  authority: Regulation (EU) 2016/679, General Data Protection Regulation
  description: >-
    Personal data of natural persons held in business partner, HR and SuccessFactors master data. The classes are the fields the regulation's accuracy and rectification duties reach; the rules are the catalogue checks that evidence each class is accurate and complete.
  classes:
  - id: identity
    label: Identity of natural persons
    authority: GDPR Article 4(1) (personal data) and Article 5(1)(d) (accuracy)
    fields: [BUT000.NAME_FIRST, BUT000.NAME_LAST, BUT000.BIRTHDT, BUT000.TITLE_ACA1, BUT000.NATIO, BUT000.MARST,
             BUT000.DEATHDT, PA0002.VORNA, PA0002.NACHN, PA0002.GBDAT, PA0002.GBLND, PA0002.GBDEP, PA0002.GESCH,
             PA0002.NATIO, PA0002.NATI2, PA0002.NATI3, PA0002.FAMST, PA0002.ANRED, PA0002.TITEL]
    rules: [BP007, BP008, BP038, BP046, BP048, BP217, BP225, BP268, BP269, BP271, BP274, HCM015, HCM016, HCM017,
            HCM018, HCM019, HCM020, PA031, PA032, PA033, PA034, PA085, PA087, PA088, PA090, S4C028, S4C029,
            S4R-HCM-GESCH, S4R-HCM-NACHN]
  - id: contact
