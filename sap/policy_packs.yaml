    authority: GDPR Article 5(1)(d) (accuracy) and Article 16 (right to rectification)
    fields: [ADR6.SMTP_ADDR, ADR2.TEL_NUMBER, ADRC.STREET, ADRC.CITY1, ADRC.POST_CODE1, PA0006.STRAS, PA0006.ORT01,
             PA0006.PSTLZ, PA0006.LAND1, PA0105.USRID_LONG, PEREMAIL.EMAIL_ADDRESS, PERPHONE.PHONE_NUMBER,
             PERADDRESS.ADDRESS_LINE1, PERADDRESS.CITY, PERADDRESS.ZIPCODE]
    rules: [AP009, AP096, AR008, BP017, BP018, BP020, BP021, BP022, BP294, EC017, EC018, EC029, EC031, EC033, EC040,
            EC061, EC063, EC064, EC065, EC066, EC067, EC068, EC069, EC070, EC071, EC072, EC073, EC074, EC086, EC120,
            EC149, EC150, EC155, EC156, EC161, EC162, EC163, EC164, EC165, EC166, EC356, HCM022, HCM023, HCM029,
            PA036, PA091, PA092, PA101, S4R-HCM-LAND1, S4R-HCM-ORT01, SDCM007]
