global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: meridian-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    # Labels attached to every sample from the api job — so
    # dashboards can filter "service=api" vs "service=worker" etc.
    relabel_configs:
      - target_label: service
        replacement: api

  # The worker exposes /metrics on 8000 too (same app, same ports).
  # Even though individual Celery worker processes don't have an HTTP
  # server, the api container's Prometheus registry is shared — worker
  # counters (meridian_celery_tasks_total, …) are scraped from api.

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
