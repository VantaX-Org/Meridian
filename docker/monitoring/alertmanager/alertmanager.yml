global:
  # SMTP — populate SMTP_SMARTHOST etc. in .env to enable email alerts.
  smtp_from: "${ALERT_EMAIL_FROM}"
  smtp_smarthost: "${SMTP_SMARTHOST}"
  smtp_auth_username: "${SMTP_AUTH_USERNAME}"
  smtp_auth_password: "${SMTP_AUTH_PASSWORD}"
  smtp_require_tls: true

route:
  # Default for anything unlabelled — gets all three receivers, but
  # each receiver is a no-op if its env var is empty.
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  # Resend an unresolved critical every hour; warnings every 4h.
  repeat_interval: 1h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical
      continue: true
    - matchers:
        - severity="warning"
      receiver: warning
      repeat_interval: 4h

receivers:
  - name: default
    webhook_configs:
      - url: "https://example.com/hook"
        send_resolved: false
        # Never actually fires — no URL env var set means Alertmanager
        # treats this as a placeholder. Real customers route to one of
        # the receivers below.

  - name: critical
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#meridian-alerts"
        send_resolved: true
        title: "[CRITICAL] {{ .GroupLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          Runbook: docs/ops/runbooks/{{ .Labels.runbook }}.md
          {{ end }}
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_ROUTING_KEY}"
        severity: critical
        description: "{{ .GroupLabels.alertname }}: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}"
    email_configs:
      - to: "${ALERT_EMAIL_TO}"
        send_resolved: true

  - name: warning
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#meridian-alerts"
        send_resolved: true
        title: "[warn] {{ .GroupLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          {{ .Annotations.summary }}: {{ .Annotations.description }}
          {{ end }}
    email_configs:
      - to: "${ALERT_EMAIL_TO}"
        send_resolved: false

inhibit_rules:
  - source_matchers: [severity="critical", alertname="ApiDown"]
    target_matchers: [severity=~"warning|critical"]
    equal: [alertname]
