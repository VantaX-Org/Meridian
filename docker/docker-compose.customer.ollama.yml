# =========================================================
# Meridian Platform — Tier 2 Ollama Overlay
# Merge with docker-compose.customer.yml:
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
# =========================================================

services:
  ollama:
    image: ghcr.io/vantax-org/meridian-ollama:{{MODEL_TAG}}
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - meridian-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Caps CPU-only inference at 3 of the host's cores so a generation can
    # never starve the rest of the stack (api/nginx/healthchecks) — on a
    # 4-core box, Ollama alone was observed pegging all cores during a single
    # long generation, freezing even unrelated requests for its duration.
    # Trade-off: individual LLM calls run proportionally slower. Raise or
    # remove this if the host has more cores to spare.
    deploy:
      resources:
        limits:
          cpus: "3.0"
    # Uncomment to enable NVIDIA GPU acceleration (merge into the deploy key above):
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama_data:
