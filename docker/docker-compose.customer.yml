# =========================================================
# Meridian Platform — Customer Deployment
# Pre-built images only — NO source code, NO build contexts
# Generated by: scripts/create-customer-package.sh
# Version:      {{VERSION}}
# Customer:     {{CUSTOMER_NAME}}
# Tier:         {{TIER}}
# =========================================================

# Container log rotation (json-file): at most 5 files of 50 MB per container, so logs cannot fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  nginx:
    logging: *default-logging
    image: ghcr.io/vantax-org/meridian-nginx:${MERIDIAN_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Bind-mount certs dir — populated by meridian-deploy.sh for SSL
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/meridian.conf:/etc/nginx/conf.d/meridian.conf:ro
      # Local tuning kept across updates (see docker/nginx/meridian.conf)
      - ./nginx/local:/etc/nginx/local:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - meridian-net
    healthcheck:
      test: ["CMD-SHELL", "nginx -t 2>/dev/null && wget -qO- http://127.0.0.1/health > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  api:
    logging: *default-logging
    image: ghcr.io/vantax-org/meridian-api:${MERIDIAN_VERSION:-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      # Structured JSON logs + Prometheus scrape endpoint default-on for
      # production deployments. Override via .env: LOG_FORMAT=text for a
      # readable shell session.
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SERVICE_NAME=${SERVICE_NAME:-meridian-api}
      - ALETHEIA_URL=${ALETHEIA_URL:-http://aletheia:8000}
    # No ports exposed — API is only reachable via internal Docker network (http://api:8000)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - meridian-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # DNS: the host's resolver. Behind a corporate DNS set MERIDIAN_DNS_1 (and _2) in .env;
    # meridian-deploy.sh and update.sh then write docker-compose.dns.yml next to this file.

  worker:
    logging: *default-logging
    image: ghcr.io/vantax-org/meridian-worker:${MERIDIAN_VERSION:-latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SERVICE_NAME=${SERVICE_NAME_WORKER:-meridian-worker}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - meridian-net
    restart: unless-stopped
    # DNS: the host's resolver. Behind a corporate DNS set MERIDIAN_DNS_1 (and _2) in .env;
    # meridian-deploy.sh and update.sh then write docker-compose.dns.yml next to this file.

  beat:
    logging: *default-logging
    image: ghcr.io/vantax-org/meridian-worker:${MERIDIAN_VERSION:-latest}
    command: ["celery", "-A", "workers.celery_app", "beat", "--loglevel=info"]
    env_file: .env
    depends_on:
      - redis
    networks:
      - meridian-net
    restart: unless-stopped

  frontend:
    logging: *default-logging
    image: ghcr.io/vantax-org/meridian-frontend:${MERIDIAN_VERSION:-latest}
    expose:
      - "3000"
    env_file: .env
    environment:
      - INTERNAL_API_URL=http://api:8000
      - AUTH_MODE=${AUTH_MODE:-local}
      - NEXT_PUBLIC_AUTH_MODE=${AUTH_MODE:-local}
    depends_on:
      - api
    networks:
      - meridian-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://0.0.0.0:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    logging: *default-logging
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=meridian
      - POSTGRES_USER=meridian
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - meridian-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    logging: *default-logging
    image: redis:7.2-alpine@sha256:2c933526722b4126a61d5c170f766dc159adf97682f0b1cbbc27b1666ba96d84  # 7.4 and later are not open source (RSALv2/SSPLv1)
    volumes:
      - redis_data:/data
    networks:
      - meridian-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Object storage: Garage (S3-compatible), single node, configured on first
  # start by docker/garage/entrypoint.sh. The stack reaches it as minio:9000.
  storage:
    logging: *default-logging
    image: ghcr.io/vantax-org/meridian-garage:${MERIDIAN_VERSION:-latest}  # docker/Dockerfile.garage
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
      - MINIO_BUCKET_UPLOADS=${MINIO_BUCKET_UPLOADS:-meridian-uploads}
      - MINIO_BUCKET_REPORTS=${MINIO_BUCKET_REPORTS:-meridian-reports}
    volumes:
      - storage_data:/var/lib/garage
    networks:
      meridian-net:
        aliases: [minio]  # S3 endpoint stays minio:9000 for existing .env files
    restart: unless-stopped
    healthcheck:
      # ready only after keys and buckets are set up
      test: ["CMD-SHELL", "test -f /tmp/storage-ready && curl -fsS http://127.0.0.1:3903/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Aletheia engine sidecar: Meridian's own instance, own volume, own deployment id. Never shared with
  # another product's engine on the same host. It only ever receives aggregates (run trend series, rule
  # counts), never extracted records. In the "aletheia" profile so a plain `up -d` never fails on it;
  # update.sh starts it by name. Without ALETHEIA_LICENSE_KEY it runs unlicensed and Meridian says so.
  aletheia:
    logging: *default-logging
    image: ${MERIDIAN_ALETHEIA_IMAGE:-ghcr.io/vantax-org/cortex0:1.7.0}
    profiles: ["aletheia"]
    environment:
      - ALETHEIA_DEMO=0
      - ALETHEIA_DATA_DIR=/data
      - CORTEX0_TOKEN=${ALETHEIA_TOKEN:-}
      - ALETHEIA_LICENSE_KEY=${ALETHEIA_LICENSE_KEY:-}
      - ALETHEIA_DEPLOYMENT_ID=${ALETHEIA_DEPLOYMENT_ID:-meridian}  # set per host in .env: the id the licence token was issued for
      - ALETHEIA_LICENSE_SERVER=${ALETHEIA_LICENSE_SERVER:-}
    volumes:
      - aletheia_data:/data
    networks:
      - meridian-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
  aletheia_data:

networks:
  meridian-net:
    driver: bridge
