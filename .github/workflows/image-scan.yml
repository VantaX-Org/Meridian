name: Container image scan (Trivy)

# Scans the four prod Docker images for CVEs. Fails on HIGH or CRITICAL
# findings in the OS packages or installed libraries.
#
# Runs on:
#   - PRs that touch any Dockerfile (catches a dodgy base-image bump)
#   - Every push to main (signal for drift over time)
#   - Weekly schedule (catches CVEs newly-disclosed against already-
#     shipped tags)

on:
  pull_request:
    paths:
      - "docker/Dockerfile.*"
      - "requirements.txt"
      - "frontend/package-lock.json"
      - ".github/workflows/image-scan.yml"
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile.*"
      - "requirements.txt"
      - "frontend/package-lock.json"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  trivy:
    name: Scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: meridian-api
            dockerfile: docker/Dockerfile.api.prod
            context: .
          - image: meridian-worker
            dockerfile: docker/Dockerfile.worker.prod
            context: .
          - image: meridian-frontend
            dockerfile: docker/Dockerfile.frontend.prod
            context: .
          - image: meridian-nginx
            dockerfile: docker/Dockerfile.nginx
            context: .

    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk
        # Trivy's cache + docker layers blow past default free space.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build image
        id: build
        run: |
          if [ ! -f ${{ matrix.dockerfile }} ]; then
            echo "Dockerfile not found: ${{ matrix.dockerfile }} — skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t ${{ matrix.image }}:scan \
            ${{ matrix.context }}
          echo "skip=false" >> $GITHUB_OUTPUT

      # Run trivy via its official Docker image instead of aquasecurity/trivy-action.
      # The action wrapper pins setup-trivy@v0.2.1 (a tag deleted upstream, so it
      # fails at "resolve action"), and the install.sh script flakes on the GitHub
      # release download. Docker is already on the runner; mount the daemon socket
      # so trivy can read the locally-built image, and persist the vuln DB cache.
      - name: Trivy vulnerability scan
        if: steps.build.outputs.skip != 'true'
        run: |
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy":/root/.cache/trivy \
            aquasec/trivy:0.58.1 image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --pkg-types os,library \
            --format table \
            ${{ matrix.image }}:scan

      - name: Trivy SBOM (advisory only, weekly)
        if: steps.build.outputs.skip != 'true' && github.event_name == 'schedule'
        run: |
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy":/root/.cache/trivy \
            -v "$PWD":/work -w /work \
            aquasec/trivy:0.58.1 image \
            --format cyclonedx \
            --output sbom-${{ matrix.image }}.cdx.json \
            ${{ matrix.image }}:scan

      - name: Upload SBOM (weekly)
        if: steps.build.outputs.skip != 'true' && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json
          retention-days: 90
