name: Container image scan (Trivy)

# Scans the four prod Docker images for CVEs. Fails on HIGH or CRITICAL
# findings in the OS packages or installed libraries.
#
# Runs on:
#   - PRs that touch any Dockerfile (catches a dodgy base-image bump)
#   - Every push to main (signal for drift over time)
#   - Weekly schedule (catches CVEs newly-disclosed against already-
#     shipped tags)

on:
  pull_request:
    paths:
      - "docker/Dockerfile.*"
      - "requirements.txt"
      - "frontend/package-lock.json"
      - ".github/workflows/image-scan.yml"
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile.*"
      - "requirements.txt"
      - "frontend/package-lock.json"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  trivy:
    name: Scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: meridian-api
            dockerfile: docker/Dockerfile.api.prod
            context: .
          - image: meridian-worker
            dockerfile: docker/Dockerfile.worker.prod
            context: .
          - image: meridian-frontend
            dockerfile: docker/Dockerfile.frontend.prod
            context: .
          - image: meridian-nginx
            dockerfile: docker/Dockerfile.nginx
            context: .

    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk
        # Trivy's cache + docker layers blow past default free space.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build image
        id: build
        run: |
          if [ ! -f ${{ matrix.dockerfile }} ]; then
            echo "Dockerfile not found: ${{ matrix.dockerfile }} — skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t ${{ matrix.image }}:scan \
            ${{ matrix.context }}
          echo "skip=false" >> $GITHUB_OUTPUT

      # Install the trivy CLI directly instead of via aquasecurity/trivy-action.
      # The action wrapper internally pins setup-trivy@v0.2.1, a tag that was
      # deleted upstream — so every pinned trivy-action release that referenced
      # it now fails at "resolve action". The official install script has no
      # such indirection and pins a known trivy version.
      - name: Install Trivy
        if: steps.build.outputs.skip != 'true'
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin v0.58.1
          trivy --version

      - name: Trivy vulnerability scan
        if: steps.build.outputs.skip != 'true'
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --pkg-types os,library \
            --format table \
            ${{ matrix.image }}:scan

      - name: Trivy SBOM (advisory only, weekly)
        if: steps.build.outputs.skip != 'true' && github.event_name == 'schedule'
        run: |
          trivy image \
            --format cyclonedx \
            --output sbom-${{ matrix.image }}.cdx.json \
            ${{ matrix.image }}:scan

      - name: Upload SBOM (weekly)
        if: steps.build.outputs.skip != 'true' && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json
          retention-days: 90
