name: Aurora E2E

# Playwright smoke + a11y + perf against the four Aurora workspace
# routes. Spec §15 — this is the automated acceptance suite that
# guards cutover. Visual-regression runs in a separate job because
# baselines are pinned to a specific Chromium build and we don't
# want flakes from rendering differences blocking feature PRs.

on:
  push:
    branches: [main, redesign/aurora]
  pull_request:
    branches: [main, redesign/aurora]
    paths:
      - "frontend/**"
      - ".github/workflows/aurora-e2e.yml"
  workflow_dispatch: {}

jobs:
  e2e:
    name: Aurora E2E (smoke + a11y + perf)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Aurora smoke, a11y, and perf specs
        run: |
          npx playwright test \
            e2e/aurora-smoke.spec.ts \
            e2e/aurora-a11y.spec.ts \
            e2e/aurora-perf.spec.ts
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

  visual:
    name: Aurora visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (pinned for VR determinism)
        run: npx playwright install --with-deps chromium

      - name: Run visual-regression specs
        run: npx playwright test e2e/aurora-visual.spec.ts
        env:
          CI: "true"

      - name: Upload VR diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diff
          path: frontend/test-results
          retention-days: 14
