name: Aurora E2E

# Typecheck + lint, Vitest with a coverage floor, token, i18n and contrast gates (the `checks` job, once), then
# Playwright against the production build (the image's standalone server): every screen of the map, canvas and
# inspector in fixture mode (`?fixture=1`, the API answered from lib/api/v2/fixtures, so no backend), axe on every
# page, the sign-in states, and the redirects from the retired interface's addresses (e2e/redirects.spec.ts). The
# workflow and job names are kept from before the cut-over so required checks on the branch still match.

on:
  push:
    branches: [main, redesign/aurora]
  pull_request:
    branches: [main, redesign/aurora]
    paths:
      - "frontend/**"
      - ".github/workflows/aurora-e2e.yml"
  workflow_dispatch: {}

# A new push to a PR cancels that PR's running check. On main, runs never
# cancel: one runs, and only the newest waiting commit queues behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Aurora checks (types, lint, unit, tokens, contrast)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test -- --run --coverage

      - name: Token lint
        run: npm run lint:tokens

      - name: Every word translated (en, de, ja)
        run: node scripts/i18n-extract.mjs

      - name: Contrast check
        run: npm run check:contrast

  e2e:
    # The browser suite split into shards of two workers each. The help recordings (guided-tours-v2.spec.ts) run
    # only in record-help-videos.yml.
    name: Aurora E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "shard 1 of 4", shard: "1/4" }
          - { name: "shard 2 of 4", shard: "2/4" }
          - { name: "shard 3 of 4", shard: "3/4" }
          - { name: "shard 4 of 4", shard: "4/4" }
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Every acceptance spec. Fully parallel (playwright.config.ts), so shards split by test, not by file.
      SPECS: >-
        e2e/v2-a11y.spec.ts
        e2e/v2-admin.spec.ts
        e2e/v2-help.spec.ts
        e2e/v2-landscape.spec.ts
        e2e/v2-mdm.spec.ts
        e2e/v2-object.spec.ts
        e2e/v2-people.spec.ts
        e2e/v2-roles.spec.ts
        e2e/v2-rules.spec.ts
        e2e/v2-runs.spec.ts
        e2e/v2-status.spec.ts
        e2e/v2-step9.spec.ts
        e2e/v2-step10.spec.ts
        e2e/v2-systems.spec.ts
        e2e/v2-work.spec.ts
        e2e/redirects.spec.ts
        e2e/sign-in-states.spec.ts
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Next's build cache (the web server in playwright.config.ts builds before it serves): restored from the
      # newest run on the same lockfile, which Next revalidates itself.
      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.name }}
        run: |
          npx playwright test ${{ env.SPECS }} \
            --shard=${{ matrix.shard }} \
            --workers=2

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: frontend/playwright-report
          retention-days: 14
