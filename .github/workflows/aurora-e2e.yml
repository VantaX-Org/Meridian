name: Aurora E2E

# Typecheck + lint, then Playwright smoke + a11y + perf on every Aurora
# workspace route, plus the steward/basis/lead/insights journey specs, signed
# in against the recorded API (frontend/e2e/fixtures.ts) and served from the
# production build. There is no visual-regression job: the Aurora shell was
# retired in Wave 3 and its snapshots deleted with it.

on:
  push:
    branches: [main, redesign/aurora]
  pull_request:
    branches: [main, redesign/aurora]
    paths:
      - "frontend/**"
      - ".github/workflows/aurora-e2e.yml"
  workflow_dispatch: {}

jobs:
  e2e:
    name: Aurora E2E (smoke + a11y + perf)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Aurora smoke, a11y, perf, and journey specs
        run: |
          npx playwright test \
            e2e/aurora-smoke.spec.ts \
            e2e/aurora-a11y.spec.ts \
            e2e/aurora-perf.spec.ts \
            e2e/basis-failed-extraction.spec.ts \
            e2e/steward-accept-proposal.spec.ts \
            e2e/lead-failing-record-journey.spec.ts \
            e2e/insights-readiness-drill.spec.ts
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
