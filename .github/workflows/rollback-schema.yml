name: Rollback schema check

# scripts/update.sh rollback restores images, not the database. This applies the head migrations, then starts the
# latest released tag's code on that schema and reads from it (D-22). It catches a migration that breaks the
# previous release (a renamed or dropped column the old code still reads). Runs on the previous release's source
# with this commit's pinned dependencies, not on its built image.

on:
  pull_request:
    paths:
      - "db/migrations/**"
      - "db/schema.py"
      - "docker/entrypoint.api.sh"
      - "scripts/check_rollback_schema.sh"
      - ".github/workflows/rollback-schema.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rollback-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: meridian_test
          POSTGRES_DB: meridian_test
          POSTGRES_USER: meridian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://meridian_test:meridian_test@localhost:5432/meridian_test
      DATABASE_URL_SYNC: postgresql://meridian_test:meridian_test@localhost:5432/meridian_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out the latest released tag
        # Same rule as build-and-deploy.yml: the highest vX.Y.Z tag is the release a rollback returns to.
        run: |
          PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          echo "Previous release: $PREV"
          git worktree add ../prev "$PREV"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          sudo apt-get install -y -qq postgresql-client
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements.lock

      - name: Head migrations, then the previous release on them
        run: bash scripts/check_rollback_schema.sh ../prev
