name: Record help videos

# Produces the help centre's training recordings: runs e2e/guided-tours.spec.ts under the
# `recording` Playwright project (recordVideo on, pinned clock, HAR fixtures — deterministic
# screens, demo data only), converts the webm captures to faststart mp4, and uploads them as an
# artifact. A maintainer reviews the artifact and commits the mp4s into frontend/docs/help-videos/
# (they ship inside the API image and are served at /api/v1/docs/help-videos/<name>.mp4).
#
# Videos are deliberately NOT auto-committed: a training video is a published claim about the
# product, so a human watches it before it ships.

on:
  workflow_dispatch:
    inputs:
      journeys:
        description: "Only record these journeys (comma-separated video keys; empty = all)"
        required: false
        default: ""

concurrency:
  group: record-help-videos
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # ubuntu-latest does not carry ffmpeg; the conversion step needs it
      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Record the guided tours
        run: |
          if [ -n "${{ github.event.inputs.journeys }}" ]; then
            GREP=$(echo "${{ github.event.inputs.journeys }}" | tr ',' '|')
            RECORD_HELP=1 npx playwright test --project=recording --workers=1 --grep "$GREP"
          else
            RECORD_HELP=1 npx playwright test --project=recording --workers=1
          fi

      - name: Convert webm captures to mp4
        run: |
          mkdir -p docs/help-videos
          n=0
          while IFS= read -r f; do
            key=$(echo "$f" | grep -oE 'help-[a-z0-9-]+' | head -1)
            [ -z "$key" ] && continue
            ffmpeg -y -loglevel error -i "$f" -c:v libx264 -preset slow -crf 23 \
              -pix_fmt yuv420p -movflags +faststart -an "docs/help-videos/$key.mp4"
            n=$((n+1))
          done < <(find help-videos-raw -name '*.webm' 2>/dev/null)
          echo "converted $n recordings"
          [ "$n" -gt 0 ] || { echo "no recordings produced"; exit 1; }
          ls -la docs/help-videos/

      - uses: actions/upload-artifact@v4
        with:
          name: help-videos
          path: frontend/docs/help-videos/*.mp4
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-recording
          path: frontend/playwright-report
          retention-days: 14
