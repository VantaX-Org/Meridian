name: Record help videos

# Produces the guide's recordings: runs e2e/guided-tours-v2.spec.ts (fixture mode, captions as WebVTT) under the
# `recording` Playwright project (recordVideo on, demo data only, deterministic screens), converts each capture to a
# faststart mp4 with its poster and captions (scripts/help-videos.mjs), and uploads them as an artifact. A maintainer
# reviews the artifact and commits the files into frontend/docs/help-videos/ (they ship inside the API image and are
# served at /api/v1/docs/help-videos/<name>).
#
# Videos are deliberately NOT auto-committed: a training video is a published claim about the
# product, so a human watches it before it ships.

on:
  workflow_dispatch:
    inputs:
      journeys:
        description: "Only record these tours (comma-separated video keys such as guide2-work; empty = all)"
        required: false
        default: ""

concurrency:
  group: record-help-videos
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # ubuntu-latest does not carry ffmpeg; the conversion step needs it
      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Record the guided tours
        # The tours run in fixture mode, which only a demo build honours (frontend/lib/api/v2/fixture.ts).
        env:
          NEXT_PUBLIC_MERIDIAN_DEMO: "1"
        run: |
          if [ -n "${{ github.event.inputs.journeys }}" ]; then
            GREP=$(echo "${{ github.event.inputs.journeys }}" | tr ',' '|')
            RECORD_HELP=1 npx playwright test --project=recording --workers=1 --grep "$GREP"
          else
            RECORD_HELP=1 npx playwright test --project=recording --workers=1
          fi

      # Each tour: mp4, poster frame (.jpg) and captions (.vtt), lengths in manifest.json, then the help index so the
      # panel shows each recording's length.
      - name: Convert the tours
        run: |
          ls help-videos-raw/captions/*.json >/dev/null 2>&1 || { echo "no recordings produced"; exit 1; }
          node scripts/help-videos.mjs
          node scripts/help-index.mjs
          ls -la docs/help-videos/

      - uses: actions/upload-artifact@v4
        with:
          name: help-videos
          path: |
            frontend/docs/help-videos/*.mp4
            frontend/docs/help-videos/*.jpg
            frontend/docs/help-videos/*.vtt
            frontend/docs/help-videos/manifest.json
            frontend/lib/v2/help-data.json
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-recording
          path: frontend/playwright-report
          retention-days: 14
