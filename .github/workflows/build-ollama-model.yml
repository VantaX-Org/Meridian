name: Build Ollama Model Image

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Ollama model name (e.g. llama3.1:8b, mistral:7b)'
        required: true
        default: 'qwen3.5:9b-instruct'

env:
  REGISTRY: ghcr.io/vantax-org

jobs:
  build-ollama:
    name: Build Ollama — ${{ github.event.inputs.model_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af
          df -h /

      - name: Generate image tag
        id: tag
        run: |
          MODEL_TAG=$(echo "${{ github.event.inputs.model_name }}" | tr ':' '-' | tr '.' '-')
          echo "MODEL_TAG=${MODEL_TAG}" >> $GITHUB_OUTPUT
          echo "Building model: ${{ github.event.inputs.model_name }}"
          echo "Image tag: ${MODEL_TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Ollama image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ollama
          platforms: linux/amd64
          push: true
          build-args: |
            MODEL_NAME=${{ github.event.inputs.model_name }}
          tags: |
            ${{ env.REGISTRY }}/meridian-ollama:${{ steps.tag.outputs.MODEL_TAG }}
