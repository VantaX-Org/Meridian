name: Build & Deploy Multi-Platform Images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/vantax-org/meridian

# One release build at a time: two overlapping builds race to push :latest,
# and the older commit can win.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Release gate: no image is published from a commit whose test suite fails.
  tests:
    uses: ./.github/workflows/unit-tests.yml

  build-and-push:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Determine next version
        id: version
        run: |
          # Get the latest tag
          LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "Latest tag: $LATEST_TAG"
          
          # Extract version numbers
          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          
          # Determine bump type
          BUMP_TYPE="${{ github.event.inputs.version_bump }}"
          if [ -z "$BUMP_TYPE" ]; then
            BUMP_TYPE="patch"
          fi
          
          # Increment version
          if [ "$BUMP_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_NUMBER=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
      
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.VERSION }}
          git push origin ${{ steps.version.outputs.VERSION }}
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api.prod
          platforms: linux/amd64
          push: true
          build-args: |
            MERIDIAN_VERSION=${{ steps.version.outputs.VERSION_NUMBER }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend.prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker.prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-worker:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push object storage (Garage)
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.garage
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-garage:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}-garage:latest
          cache-from: type=gha,scope=garage
          cache-to: type=gha,mode=max,scope=garage
      
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          release_name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## Meridian Platform ${{ steps.version.outputs.VERSION }}
            
            ### Docker Images (Multi-Platform: amd64 + arm64)
            ```
            ghcr.io/vantax-org/meridian-api:${{ steps.version.outputs.VERSION }}
            ghcr.io/vantax-org/meridian-frontend:${{ steps.version.outputs.VERSION }}
            ghcr.io/vantax-org/meridian-worker:${{ steps.version.outputs.VERSION }}
            ghcr.io/vantax-org/meridian-garage:${{ steps.version.outputs.VERSION }}
            ```

            ### Installation
            ```bash
            sudo bash scripts/meridian-deploy.sh
            ```
          draft: false
          prerelease: false

  build-nginx:
    name: Build and Push nginx Image
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version from build job
        id: version
        run: |
          LATEST_TAG=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "VERSION=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Build and push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.nginx
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/vantax-org/meridian-nginx:${{ steps.version.outputs.VERSION }}
            ghcr.io/vantax-org/meridian-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-updater:
    name: Build and Push updater Image
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version from build job
        id: version
        run: |
          LATEST_TAG=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "VERSION=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Build and push updater image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.updater
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/vantax-org/meridian-updater:${{ steps.version.outputs.VERSION }}
            ghcr.io/vantax-org/meridian-updater:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tell Meridian HQ about the release once every image a customer's update pulls
  # exists. Installed systems read latest_version from HQ (licence manifest) and
  # offer "Update now" to their admin. RELEASE_PUBLISH_TOKEN works for this one
  # endpoint only and can never move the release backwards (licence-worker).
  publish-release:
    name: Publish release to Meridian HQ
    runs-on: ubuntu-latest
    needs: [build-and-push, build-nginx, build-updater]
    permissions: {}
    steps:
      - name: Set latest_version in HQ
        env:
          TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          VERSION: ${{ needs.build-and-push.outputs.version }}
          HQ: ${{ vars.LICENCE_SERVER_URL || 'https://licence.meridian.vantax.co.za' }}
          NOTES: "Release ${{ needs.build-and-push.outputs.version }} — https://github.com/${{ github.repository }}/releases/tag/${{ needs.build-and-push.outputs.version }}"
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::RELEASE_PUBLISH_TOKEN is not set — $VERSION was not published to HQ; installed systems won't offer it."
            exit 0
          fi
          body=$(jq -n --arg v "$VERSION" --arg n "$NOTES" '{latest_version: $v, release_notes: $n}')
          code=$(curl -sS -o resp.json -w '%{http_code}' -X PUT "$HQ/api/admin/release" \
                 -H "Content-Type: application/json" -H "X-Release-Token: $TOKEN" --data "$body")
          cat resp.json; echo
          if [ "$code" != "200" ]; then
            echo "::error::HQ did not accept release $VERSION (HTTP $code)"
            exit 1
          fi
