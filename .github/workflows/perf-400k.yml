name: 400k rows perf check

# Weekly scheduled run of the 400k-row perf test + ad-hoc workflow_dispatch.
# Also on PRs touching the engine. The test asserts exact defect counts at
# 400k rows, grain-correct totals, and a wall-clock budget; it prints timings.

on:
  schedule:
    # Sunday 04:00 UTC — outside the Actions concurrency peak
    - cron: "0 4 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "checks/runner.py"
      - "checks/frames.py"
      - "checks/base.py"
      - "sap/dictionaries/joins.yaml"
      - "checks/types/**"
      - "tests/checks/test_perf_400k.py"
      - ".github/workflows/perf-400k.yml"

jobs:
  perf-400k:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        # Check engine imports transitively pull in pydantic + fuzzy-match
        # libs via api.config / checks.types — install them too so pytest
        # can actually collect the module.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "pandas>=2.2.0" \
            "numpy" \
            "pyyaml>=6.0.0" \
            "pytest>=8.0.0" \
            "pyarrow>=15.0.0" \
            "pydantic>=2.0.0" \
            "pydantic-settings>=2.7.0" \
            "jellyfish>=1.0.0" \
            "thefuzz>=0.22.0"

      - name: Run perf test (400k rows)
        # -s so the print() line with the timings shows up in the log.
        # -m perf opts into the marker the perf test uses.
        run: |
          pytest -v -s -m perf tests/checks/test_perf_400k.py

      - name: Summary
        if: success()
        run: |
          echo "### 400k perf — passing" >> "$GITHUB_STEP_SUMMARY"
          echo "See \`Run perf test\` step log for timings." >> "$GITHUB_STEP_SUMMARY"
