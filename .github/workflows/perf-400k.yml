name: 400k rows perf check

# Weekly scheduled run of the 400k-row perf test + ad-hoc workflow_dispatch.
# Deliberately NOT on every PR — the synthetic frame generator + both engines
# takes 1-2 min on a warm runner, and a per-PR cost buys little (perf
# regressions usually show up in a Polars/pandas version bump, not a refactor).
#
# Signal routing: the test prints its pandas/polars timings and the speedup.
# CI surfaces the stdout of the run in the job log; a regression trips the
# floor assertion in tests/checks/test_perf_400k.py (polars must not be
# slower than pandas) and fails the job.

on:
  schedule:
    # Sunday 04:00 UTC — outside the Actions concurrency peak
    - cron: "0 4 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "checks/polars_engine.py"
      - "checks/runner.py"
      - "checks/types/**"
      - "tests/checks/test_perf_400k.py"
      - ".github/workflows/perf-400k.yml"

jobs:
  perf-400k:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        # Check engine imports transitively pull in pydantic + fuzzy-match
        # libs via api.config / checks.types — install them too so pytest
        # can actually collect the module.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "pandas>=2.2.0" \
            "polars>=1.0.0" \
            "numpy" \
            "pyyaml>=6.0.0" \
            "pytest>=8.0.0" \
            "pyarrow>=15.0.0" \
            "pydantic>=2.0.0" \
            "pydantic-settings>=2.7.0" \
            "jellyfish>=1.0.0" \
            "thefuzz>=0.22.0"

      - name: Run perf test (400k rows)
        # -s so the print() line with the timings shows up in the log.
        # -m perf opts into the marker the perf test uses.
        run: |
          pytest -v -s -m perf tests/checks/test_perf_400k.py

      - name: Summary
        if: success()
        run: |
          echo "### 400k perf — passing" >> "$GITHUB_STEP_SUMMARY"
          echo "See \`Run perf test\` step log for pandas vs polars timings." >> "$GITHUB_STEP_SUMMARY"
