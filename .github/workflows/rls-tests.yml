name: RLS integration tests

on:
  pull_request:
    paths:
      - "db/migrations/**"
      - "db/schema.py"
      - "api/middleware/tenant.py"
      - "api/deps.py"
      - "tests/test_rls_integration.py"
      - ".github/workflows/rls-tests.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: meridian_test
          POSTGRES_DB: meridian_test
          POSTGRES_USER: meridian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MERIDIAN_TEST_DB_URL: postgresql://meridian_test:meridian_test@localhost:5432/meridian_test
      DATABASE_URL: postgresql://meridian_test:meridian_test@localhost:5432/meridian_test
      DATABASE_URL_SYNC: postgresql://meridian_test:meridian_test@localhost:5432/meridian_test
      # Alembic env.py reads these; give it what it needs to connect.
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Install only what's required for migrations + tests — keeps the CI
          # fast and avoids pulling LLM wheels for an RLS check.
          pip install \
            "sqlalchemy[asyncio]>=2.0.36" \
            "alembic>=1.14.0" \
            "psycopg2-binary>=2.9.10" \
            "pytest>=8.0.0" \
            "pytest-asyncio>=0.24.0" \
            "pydantic-settings>=2.7.0" \
            "pyyaml>=6.0.0"

      - name: Run RLS tests
        run: pytest -v tests/test_rls_integration.py
