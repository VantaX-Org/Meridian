# Coverage for .github/workflows/unit-tests.yml (PC-8). Not a workflow on its own: merge it by hand.
#
# 1. In job `pytest`, step "Install dependencies": add pytest-cov to the pip line
#
#          pip install -r requirements.txt "pytest>=8.0.0" "pytest-asyncio>=0.24.0" "pytest-cov==7.1.0" -c requirements.lock
#
# 2. In job `pytest`, replace step "Run tests" with these two steps (each shard writes its own data file):

      - name: Run tests
        env:
          PYTEST_SHARD: ${{ matrix.shard }}/6
          COVERAGE_FILE: .coverage.shard${{ matrix.shard }}
        run: pytest tests/ -q --cov=api --cov=workers --cov=checks --cov=sap --cov-report=term

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: .coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 7

# 3. Add this job beside `pytest` (same indentation as `pytest:` under `jobs:`): it combines the six shards into
#    the whole-suite number, publishes coverage.xml and fails below the floor in tests/coverage_floor.py.

  coverage:
    needs: pytest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: pip install "coverage==7.17.0"

      - name: Download shard data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          merge-multiple: true

      - name: Combine and report
        run: |
          coverage combine .coverage.shard*
          coverage xml -o coverage.xml
          coverage report --sort=cover | tail -40

      - name: Publish coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Coverage floor
        run: python tests/coverage_floor.py coverage.xml
