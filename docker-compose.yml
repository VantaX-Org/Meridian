networks:
  meridian-net:
    driver: bridge

volumes:
  db_data:
  redis_data:
  storage_data:
  ollama_data:

# Container log rotation (json-file): at most 5 files of 50 MB per container, so logs cannot fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    logging: *default-logging
    image: postgres:16-alpine
    container_name: meridian-db
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: meridian
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - meridian-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    logging: *default-logging
    image: redis:7.2-alpine  # 7.4 and later are not open source (RSALv2/SSPLv1)
    container_name: meridian-redis
    volumes:
      - redis_data:/data
    networks:
      - meridian-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Object storage: Garage (S3-compatible), single node, configured on first
  # start by docker/garage/entrypoint.sh. The stack reaches it as minio:9000.
  storage:
    logging: *default-logging
    image: ghcr.io/vantax-org/meridian-garage:${MERIDIAN_VERSION:-latest}  # docker/Dockerfile.garage
    container_name: meridian-storage
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_PASSWORD=${MINIO_PASSWORD}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
      - MINIO_BUCKET_UPLOADS=${MINIO_BUCKET_UPLOADS:-meridian-uploads}
      - MINIO_BUCKET_REPORTS=${MINIO_BUCKET_REPORTS:-meridian-reports}
    volumes:
      - storage_data:/var/lib/garage
    networks:
      meridian-net:
        aliases: [minio]  # S3 endpoint stays minio:9000 for existing .env files
    restart: unless-stopped
    healthcheck:
      # ready only after keys and buckets are set up
      test: ["CMD-SHELL", "test -f /tmp/storage-ready && curl -fsS http://127.0.0.1:3903/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Standard Ollama image — bundled Tier-2 LLM. Only starts under the
  # "llm-bundled" compose profile so Tier-0 (LLM-less) and Tier-1 (cloud LLM)
  # deployments don't pay the RAM/disk cost of a local Ollama instance.
  #   docker compose --profile llm-bundled up -d    # Tier 2
  #   docker compose up -d                          # Tier 0 / 1 / 1.5 / 3
  ollama:
    logging: *default-logging
    image: ollama/ollama:0.40.12
    container_name: meridian-ollama
    profiles: ["llm-bundled"]
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - meridian-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    logging: *default-logging
    image: ghcr.io/vantax-org/meridian-api:${MERIDIAN_VERSION:-latest}
    platform: linux/amd64
    container_name: meridian-api
    env_file: .env
    # No ports exposed — API is only reachable via internal Docker network (http://api:8000)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meridian-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    logging: *default-logging
    image: ghcr.io/vantax-org/meridian-worker:${MERIDIAN_VERSION:-latest}
    platform: linux/amd64
    container_name: meridian-worker
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meridian-net
    restart: unless-stopped

  beat:
    logging: *default-logging
    image: ghcr.io/vantax-org/meridian-worker:${MERIDIAN_VERSION:-latest}
    platform: linux/amd64
    container_name: meridian-beat
    command: ["celery", "-A", "workers.celery_app", "beat", "--loglevel=info"]
    env_file: .env
    depends_on:
      - redis
    networks:
      - meridian-net
    restart: unless-stopped

  frontend:
    logging: *default-logging
    image: ghcr.io/vantax-org/meridian-frontend:${MERIDIAN_VERSION:-latest}
    platform: linux/amd64
    container_name: meridian-frontend
    env_file: .env
    environment:
      - INTERNAL_API_URL=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - meridian-net
    restart: unless-stopped
