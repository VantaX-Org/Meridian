[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    perf: benchmark tests, opt-in via `pytest -m perf`, not run by default
    session_revocation: runs LocalAuthMiddleware's real users.token_version lookup (tests/conftest.py stubs it otherwise)
addopts = -m "not perf"
