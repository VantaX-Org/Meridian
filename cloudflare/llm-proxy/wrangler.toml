name = "meridian-llm-proxy"
main = "src/index.ts"
compatibility_date = "2024-12-01"
node_compat = true

# Secrets (set via wrangler secret put):
# OLLAMA_API_KEY
# JWT_SECRET

# Variables (can be set in wrangler.toml)
[vars]
OLLAMA_BASE_URL = "https://ollama.com"
RATE_LIMIT_PER_HOUR = "100"

# KV namespace for rate limiting (optional, falls back to in-memory)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"

# D1 database for usage logging (optional)
# [[d1_databases]]
# binding = "USAGE_DB"
# database_name = "meridian-usage"
# database_id = "your-d1-database-id"