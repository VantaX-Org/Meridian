name = "vantax-portal"
main = ".open-next/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Admin portal — apex hostname. wrangler provisions DNS + edge cert on deploy
# (zone vantax.co.za on this account). The licence API lives on the sibling
# host licence.meridian.vantax.co.za (licence-worker).
[[routes]]
pattern = "meridian.vantax.co.za"
custom_domain = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXTJS_ENV = "production"
# Server-side admin/licence calls go to the licence worker's custom domain.
LICENCE_WORKER_URL = "https://licence.meridian.vantax.co.za"

# Secret — set via: wrangler secret put LICENCE_ADMIN_SECRET
# Must match the licence worker's LICENCE_ADMIN_SECRET (X-Admin-Secret header).
