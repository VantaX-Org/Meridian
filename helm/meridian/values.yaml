replicaCount:
  api: 2
  worker: 3
  frontend: 1

image:
  api: ghcr.io/vantax-org/meridian-api:latest
  frontend: ghcr.io/vantax-org/meridian-frontend:latest
  pullPolicy: IfNotPresent

llm:
  provider: ollama
  model: llama3.1:70b
  image: ollama/ollama:latest
  gpu:
    enabled: true
    count: 1
  resources:
    requests:
      memory: "16Gi"
    limits:
      memory: "64Gi"

postgres:
  enabled: true
  image: postgres:16-alpine
  storageSize: 50Gi
  user: meridian
  database: meridian

redis:
  enabled: true
  image: redis:7-alpine
  storageSize: 5Gi

storage:  # Garage object storage (docker/Dockerfile.garage)
  enabled: true
  image: ghcr.io/vantax-org/meridian-garage:latest
  storageSize: 100Gi
  capacity: 100G  # Garage node capacity (Garage size units)

ingress:
  enabled: false
  className: ""
  host: ""
  tls: []

licence:
  key: ""
  serverUrl: https://licence.meridian.meridian.co.za
  file: ""

auth:
  mode: local
  clerkSecretKey: ""

# Address people open Meridian at; links in digests, webhooks, invitations and resets start with it.
appUrl: ""

# Email for digests, invitations and password resets (the password goes in secrets.smtpPassword).
smtp:
  host: ""
  port: 587
  user: ""
  from: noreply@meridian.local

# Meridian 2 settings (steps 8 to 10). SCIM, the brand theme, webhooks, digests, sandbox mode and the
# run cost model are tenant settings made in Administration, not chart values.
features:
  nlLlm: false             # MERIDIAN_NL_LLM: the LLM maps only unknown words of a plain-words question
  statusQueues: celery     # MERIDIAN_STATUS_QUEUES: Celery queues the status page watches
  statusQueueWarn: 100     # MERIDIAN_STATUS_QUEUE_WARN: backlog that turns a queue amber
  simulationTtl: 86400     # MERIDIAN_SIMULATION_TTL: seconds a fix simulation result is kept
  simulationTimeLimit: 3600  # MERIDIAN_SIMULATION_TIME_LIMIT: ceiling for one simulation task
  deltaFullDays: 7         # MERIDIAN_DELTA_FULL_DAYS: full extraction when the last full one is older

secrets:
  dbPassword: ""
  minioPassword: ""
  resendApiKey: ""
  ollamaApiKey: ""
  anthropicApiKey: ""
  licenceSecret: ""
  smtpPassword: ""

api:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

worker:
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 60

frontend:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
