<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<link rel="stylesheet" href="assets/report.css">
<style>
@page {
    /* ponytail: WeasyPrint has no element()/running(); the mark is the same
       inline SVG as the cover, written straight into the margin-box content. */
    @top-left { content: url("assets/brand/mark-light.svg") {{ (" Meridian") | css_str }} {{ (" " ~ title) | css_str }}; }
    @top-right { content: {{ scope_label | css_str }}; }
    @bottom-left { content: {{ ("Generated " ~ generated_sast ~ " SAST. Confidential.") | css_str }}; }
}
@page cover {
    margin: 0;
    @top-left { content: none; }
    @top-right { content: none; }
    @bottom-left { content: none; }
    @bottom-right { content: none; }
}
</style>
</head>
<body>

{% if cover %}
<section class="cover">
    <img class="cover-mark" src="assets/brand/mark-light.svg" alt="Meridian">
    <div class="cover-word">Meridian</div>
    <h1 class="cover-title">{{ title }}</h1>
    <table class="meta cover-meta">
    {% for k, v in meta %}<tr><td class="k">{{ k }}</td><td{% if k == "Run ID" %} class="mono"{% endif %}>{{ v }}</td></tr>{% endfor %}
    <tr><td class="k">Scope</td><td>{{ scope_label }}</td></tr>
    </table>
    {% if headline %}<p class="cover-verdict">{{ headline }}</p>{% endif %}
</section>
{% endif %}

<header class="doc-head">
    <h1>{{ title }}</h1>
    <table class="meta">
    {% for k, v in meta[:3] %}<tr><td class="k">{{ k }}</td><td>{{ v }}</td></tr>{% endfor %}
    </table>
</header>

{% block body %}{% endblock %}
</body>
</html>
