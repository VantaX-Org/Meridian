<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Meridian. SAP data quality, measured.">
  <defs>
    <linearGradient id="glow" x1="900" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B4BE0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2B4BE0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8DA3FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8DA3FF"/>
      <stop offset="1" stop-color="#8DA3FF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0C0D11"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- the meridian line: a single hairline across the card -->
  <rect x="0" y="314" width="1200" height="2" fill="url(#line)"/>

  <!-- large mark, right side: gauge arc and meridian at 12x -->
  <g transform="translate(780 123) scale(12)">
    <path d="M21.74 7.81A10 10 0 1 1 10.26 7.81" stroke="#F4F3EF" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M16 3V29" stroke="#8DA3FF" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- lockup, top-left, at 2x -->
  <g transform="translate(96 96) scale(2)">
    <path d="M21.74 7.81A10 10 0 1 1 10.26 7.81" stroke="#F4F3EF" stroke-width="3" stroke-linecap="round"/>
    <path d="M16 3V29" stroke="#8DA3FF" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(44 0)">
      <g stroke="#F4F3EF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 25V7L9 18L16 7V25"/>
        <path d="M33 7H21V25H33M21 16H31"/>
        <path d="M38 25V7H46A4.5 4.5 0 0 1 46 16H38M45 16L51 25"/>
        <path d="M63 7V25H69A9 9 0 0 0 69 7Z"/>
        <path d="M90 25L97 7L104 25M93 19H101"/>
        <path d="M109 25V7L122 25V7"/>
      </g>
      <g stroke="#8DA3FF" stroke-width="2.4" stroke-linecap="round">
        <path d="M56 7V25"/>
        <path d="M83 7V25"/>
      </g>
    </g>
  </g>

  <!-- tagline -->
  <text x="96" y="430" fill="#F4F3EF" font-family="'Instrument Serif', 'Iowan Old Style', Georgia, serif" font-size="64" letter-spacing="-1">SAP data quality, measured.</text>
  <text x="96" y="486" fill="#A3A6B1" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="26">Deterministic checks. Explained scores. S/4 readiness per object and wave.</text>
  <text x="96" y="556" fill="#8DA3FF" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="20" letter-spacing="2">SELF-HOSTED · DATA NEVER LEAVES YOUR SAP LANDSCAPE</text>
</svg>
