module: recruiting_onboarding
target_state: SUCCESSFACTORS
rules:
- id: REC001
  field: JOBAPPLICATION.CANDIDATE_ID
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Candidate ID is mandatory \u2014 primary key linking application to candidate profile"
  why_it_matters: CANDIDATE_ID is the primary key that associates a job application with a candidate record across the Recruiting
    module. Without it, the application is orphaned and cannot be linked to interview schedules, offer letters, or onboarding
    workflows.
  rule_authority: best_practice
  sap_impact: Application orphaned from candidate profile. Interview scheduling, offer generation, and onboarding handoff
    all fail for this record.
  fix_map:
    __blank__: Locate the candidate in Recruiting > Candidate Management and re-link the application. If the candidate record
      does not exist, create it first via Recruiting > Add New Candidate.
  record_fix_template: 'Application {JOBAPPLICATION.CANDIDATE_ID}: CANDIDATE_ID is missing. Re-link via Recruiting > Candidate
    Management.'
- id: REC003
  field: JOBAPPLICATION.JOB_REQ_ID
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Job Requisition ID is mandatory \u2014 links application to approved headcount"
  why_it_matters: JOB_REQ_ID links the application to an approved headcount requisition. Without this link, the application
    cannot proceed to the offer stage because SuccessFactors enforces requisition-based hiring. The offer approval workflow
    requires a valid requisition to validate budget and headcount availability.
  rule_authority: best_practice
  sap_impact: Cannot generate offer for this application. Budget validation and headcount check fail. Application blocked
    from progressing past interview stage.
  fix_map:
    __blank__: Link to the correct job requisition via Recruiting > Application Management > Edit Application. The requisition
      must be in Open or In Progress status.
  record_fix_template: 'Application {JOBAPPLICATION.CANDIDATE_ID}: JOB_REQ_ID is missing. Link to an approved requisition
    via Recruiting > Application Management.'
- id: REC004
  field: JOBAPPLICATION.APPLICATION_DATE
  check_class: null_check
  severity: high
  dimension: completeness
  message: Application date is required for time-to-hire metrics and SLA tracking
  why_it_matters: APPLICATION_DATE is the starting point for time-to-hire and time-to-fill KPI calculations. Without it, recruiting
    analytics cannot measure pipeline velocity and SLA compliance for this application.
  rule_authority: best_practice
  sap_impact: Time-to-hire KPI cannot be calculated. Recruiting funnel analytics show gaps. SLA compliance monitoring is incomplete.
  fix_map:
    __blank__: 'Set the application date to when the candidate originally applied. Update via Recruiting > Application Management.
      Format: YYYY-MM-DD.'
  record_fix_template: 'Application {JOBAPPLICATION.CANDIDATE_ID}: APPLICATION_DATE is missing. Set via Recruiting > Application
    Management. Format: YYYY-MM-DD.'
- id: REC005
  field: JOBAPPLICATION.SOURCE
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Application source is recommended for recruiting channel effectiveness analysis
  why_it_matters: SOURCE tracks which recruiting channel (job board, referral, career site, agency) generated the application.
    This data is critical for calculating cost-per-hire by channel and optimising recruiting spend allocation.
  rule_authority: best_practice
  sap_impact: Recruiting channel effectiveness reporting is incomplete. Cost-per-hire analysis cannot attribute this application
    to a channel.
  fix_map:
    __blank__: 'Assign the recruiting source based on how the candidate found the role. Common values include: career_site,
      linkedin, referral, agency, job_board. Update via Recruiting > Application Management.'
  record_fix_template: 'Application {JOBAPPLICATION.CANDIDATE_ID}: SOURCE is missing. Assign the recruiting channel via Recruiting
    > Application Management.'
- id: REC006
  field: JOBREQUISITION.TITLE
  check_class: null_check
  severity: high
  dimension: completeness
  message: Requisition title is required for job posting and candidate-facing communications
  why_it_matters: TITLE is displayed on the job posting, candidate portal, and all automated communications sent to applicants.
    A blank title makes the requisition unpublishable and produces confusing communications with no job name.
  rule_authority: best_practice
  sap_impact: Job posting cannot be published without a title. Candidate notifications reference a blank position. Recruiting
    reports show unnamed requisitions.
  fix_map:
    __blank__: Add the job title via Recruiting > Requisition Management > Edit Requisition. Should match the position title
      from the job catalogue.
  record_fix_template: 'Requisition {JOBREQUISITION.TITLE}: TITLE is missing. Add via Recruiting > Requisition Management.'
- id: REC008
  field: JOBREQUISITION.HIRING_MANAGER
  check_class: null_check
  severity: high
  dimension: completeness
  message: Hiring manager is required for interview scheduling and offer approval workflow
  why_it_matters: HIRING_MANAGER is the person who owns the hiring decision. Without this assignment, interview requests cannot
    be routed, offer approval workflows have no approver, and the requisition has no accountable owner.
  rule_authority: best_practice
  sap_impact: Interview scheduling cannot route to hiring manager. Offer approval workflow has no approver. Requisition ownership
    is undefined.
  fix_map:
    __blank__: Assign the hiring manager via Recruiting > Requisition Management > Edit Requisition. The manager must be an
      active employee in Employee Central.
  record_fix_template: 'Requisition {JOBREQUISITION.TITLE}: HIRING_MANAGER is missing. Assign via Recruiting > Requisition
    Management.'
- id: REC009
  field: JOBREQUISITION.OPEN_DATE
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Requisition open date is required for time-to-fill calculations
  why_it_matters: OPEN_DATE is the start point for time-to-fill KPI calculations. Without it, recruiting cannot measure how
    long positions take to fill, which is a key metric for workforce planning and recruiting efficiency assessment.
  rule_authority: best_practice
  sap_impact: Time-to-fill KPI cannot be calculated. Recruiting efficiency reports are incomplete for this requisition.
  fix_map:
    __blank__: 'Set the open date to when the requisition was approved and published. Update via Recruiting > Requisition
      Management. Format: YYYY-MM-DD.'
  record_fix_template: 'Requisition {JOBREQUISITION.TITLE}: OPEN_DATE is missing. Set via Recruiting > Requisition Management.
    Format: YYYY-MM-DD.'
- id: REC010
  field: JOBREQUISITION.OPEN_DATE
  check_class: cross_field_check
  severity: high
  dimension: consistency
  message: Requisition open date must not be after close date
  why_it_matters: When a CLOSE_DATE is present, OPEN_DATE must precede it. A requisition that closes before it opens
    indicates a data entry error that will produce negative time-to-fill values and corrupt recruiting analytics.
  rule_authority: best_practice
  sap_impact: Time-to-fill calculation returns negative value. Recruiting analytics dashboards show corrupted data
    for this requisition.
  fix_map: {__blank__: Review and correct the OPEN_DATE and CLOSE_DATE via Recruiting > Requisition Management.
      Ensure OPEN_DATE precedes CLOSE_DATE.}
  record_fix_template: 'Requisition {JOBREQUISITION.TITLE}: OPEN_DATE is after CLOSE_DATE. Correct dates via Recruiting
    > Requisition Management.'
  fail_when: '`JOBREQUISITION.OPEN_DATE` > `JOBREQUISITION.CLOSE_DATE`'
  require_populated: true
- id: REC011
  field: ONBOARDINGCANDIDATEINFO.USERID
  check_class: null_check
  severity: critical
  dimension: completeness
  message: User ID is mandatory for onboarding — used to create Employee Central record on hire
  why_it_matters: USERID in onboarding is the identifier that will be used to create the Employee Central record when the
    hire is finalised. Without it, the onboarding-to-EC handoff fails completely — no employee record is created, which means
    no payroll enrolment, no benefit assignment, and no position allocation for the new hire.
  rule_authority: best_practice
  sap_impact: Employee Central record not created on hire. Payroll enrolment blocked. Benefits, time management, and position
    assignment all fail for the new hire.
  fix_map:
    __blank__: Assign a unique USERID following your naming convention (firstname.lastname or employee number) via Onboarding
      > Candidate Management > Edit Candidate Info.
  record_fix_template: 'Onboarding candidate {ONBOARDINGCANDIDATEINFO.USERID}: USERID is missing. Assign via Onboarding >
    Candidate Management before hire date.'
  grain: ONBOARDINGCANDIDATEINFO
- id: REC012
  field: ONBOARDINGCANDIDATEINFO.HIRE_DATE
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Hire date is mandatory — triggers all onboarding workflows and IT provisioning
  why_it_matters: HIRE_DATE is the trigger date for the entire onboarding workflow chain — IT account provisioning, equipment
    ordering, day-1 task assignment, and the Employee Central record creation. Without a hire date, none of these time-sensitive
    processes can be scheduled.
  rule_authority: best_practice
  sap_impact: All onboarding workflows fail to trigger. IT provisioning not initiated. Day-1 tasks not assigned. EC record
    creation date unknown.
  fix_map:
    __blank__: Set the confirmed hire date via Onboarding > Candidate Management > Edit Candidate Info. Use ISO format YYYY-MM-DD.
  record_fix_template: 'Onboarding candidate {ONBOARDINGCANDIDATEINFO.USERID}: HIRE_DATE is missing. Set via Onboarding >
    Candidate Management. Format: YYYY-MM-DD.'
  grain: ONBOARDINGCANDIDATEINFO
- id: REC013
  field: ONBOARDINGCANDIDATEINFO.DEPARTMENT
  check_class: null_check
  severity: high
  dimension: completeness
  message: Department is required to pre-populate the Employee Central record
  why_it_matters: DEPARTMENT is used to pre-populate the Employee Central job information record when the hire is finalised.
    Missing department means the new hire's EC record will lack organisational assignment, causing them to appear as an orphan
    in the org chart.
  rule_authority: best_practice
  sap_impact: EC record created without department assignment. New hire appears as org chart orphan. Department-based approval
    workflows exclude this employee.
  fix_map:
    __blank__: Assign the correct department code via Onboarding > Candidate Management > Edit Candidate Info. Must match
      a valid department in your SF org structure.
  record_fix_template: 'Onboarding candidate {ONBOARDINGCANDIDATEINFO.USERID}: DEPARTMENT is missing. Assign via Onboarding
    > Candidate Management.'
  grain: ONBOARDINGCANDIDATEINFO
- id: REC014
  field: ONBOARDINGCANDIDATEINFO.MANAGER_ID
  check_class: null_check
  severity: high
  dimension: completeness
  message: Manager ID is required to route day-1 onboarding tasks to the hiring manager
  why_it_matters: MANAGER_ID determines which manager receives the day-1 onboarding task list — including equipment handover,
    team introduction scheduling, and probation review setup. Without it, all manager-routed onboarding tasks are unassigned.
  rule_authority: best_practice
  sap_impact: Day-1 onboarding tasks not routed to hiring manager. Equipment handover, team introductions, and probation setup
    not assigned.
  fix_map:
    __blank__: Assign the hiring manager's USERID via Onboarding > Candidate Management > Edit Candidate Info. The manager
      must already exist as an active employee in Employee Central.
  record_fix_template: 'Onboarding candidate {ONBOARDINGCANDIDATEINFO.USERID}: MANAGER_ID is missing. Assign hiring manager
    via Onboarding > Candidate Management.'
  grain: ONBOARDINGCANDIDATEINFO
- id: REC015
  field: ONBOARDINGCANDIDATEINFO.STATUS
  check_class: null_check
  severity: high
  dimension: completeness
  message: Onboarding status is required to track new hire progress through the onboarding process
  why_it_matters: STATUS tracks the new hire's progress through the onboarding workflow. Without it, HR cannot determine whether
    onboarding tasks have been completed, IT provisioning has been initiated, or the new hire is ready for their start date.
  rule_authority: best_practice
  sap_impact: Onboarding progress dashboard shows incomplete data. HR cannot determine new hire readiness. Escalation workflows
    for overdue onboarding tasks cannot trigger.
  fix_map:
    __blank__: Set the onboarding status to reflect the current state of the new hire's onboarding process via Onboarding
      > Candidate Management.
  record_fix_template: 'Onboarding candidate {ONBOARDINGCANDIDATEINFO.USERID}: STATUS is missing. Set via Onboarding > Candidate
    Management.'
  grain: ONBOARDINGCANDIDATEINFO
- id: REC017
  field: JOBREQUISITION.RECRUITER
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Assigned recruiter is missing
  why_it_matters: Assigned recruiter (JOBREQUISITION.RECRUITER) is not maintained. This field supports downstream processes
    and reporting accuracy. Missing data may result in incomplete records or processing gaps.
  rule_authority: best_practice
  sap_impact: Missing Assigned recruiter may cause incomplete data in related transactions and reports.
  fix_map:
    __blank__: Maintain via SuccessFactors Admin Center > Recruiting or Onboarding module.
  record_fix_template: Record is missing JOBREQUISITION.RECRUITER. Maintain via SuccessFactors Admin Center > Recruiting or
    Onboarding module.
- id: REC019
  field: JOBAPPLICATION.CANDIDATE_ID
  check_class: uniqueness_check
  fields: [JOBAPPLICATION.CANDIDATE_ID, JOBAPPLICATION.JOB_REQ_ID]
  severity: high
  dimension: uniqueness
  message: Duplicate candidate records detected — same candidate appears multiple times
  why_it_matters: Duplicate candidates cause fragmented application history, incorrect offer management, and compliance
    reporting errors for EEO/diversity tracking.
  rule_authority: best_practice
  sap_impact: Application history is split. Offer letters may be sent to wrong record. EEO reporting undercounts
    unique applicants.
  fix_map: {__blank__: Merge duplicate candidates in Recruiting > Candidate Management > Merge Candidates. Preserve
      the record with the most complete application history.}
  record_fix_template: "Candidate {JOBAPPLICATION.CANDIDATE_ID}: duplicate application for requisition {JOBAPPLICATION.JOB_REQ_ID}. Merge or remove the duplicate."

- id: REC020
  field: ONBOARDINGCANDIDATEINFO.HIRE_DATE
  check_class: cross_field_check
  fail_when: '`ONBOARDINGCANDIDATEINFO.HIRE_DATE` != `EMPEMPLOYMENT.START_DATE`'
  require_populated: true
  grain: ONBOARDINGCANDIDATEINFO
  severity: medium
  dimension: consistency
  message: Onboarding hire date differs from the employee's employment start date
  why_it_matters: Onboarding schedules day-one tasks, equipment, compliance forms and the new-hire welcome around the hire
    date. When the hire date in Employee Central was moved after onboarding started and the onboarding process was not updated,
    tasks fire on the wrong day and compliance forms (I-9, tax forms) carry the wrong start date.
  rule_authority: best_practice
  sap_impact: Onboarding and compliance tasks scheduled for the wrong day; statutory new-hire forms carry a start date that
    differs from payroll.
  fix_map:
    __blank__: 'Align the dates: correct the hire date in Employment Details or update the onboarding process hire date
      (Onboarding > Manage Pending Hires / Onboarding Dashboard).'
  record_fix_template: 'New hire {ONBOARDINGCANDIDATEINFO.USERID}: onboarding hire date {ONBOARDINGCANDIDATEINFO.HIRE_DATE}
    differs from employment start date {EMPEMPLOYMENT.START_DATE}.'
- id: REC021
  field: JOBAPPLICATION.APPLICATION_DATE
  check_class: cross_field_check
  fail_when: '`JOBAPPLICATION.APPLICATION_DATE` < `JOBREQUISITION.OPEN_DATE`'
  require_populated: true
  severity: medium
  dimension: consistency
  message: Application is dated before the job requisition was created
  why_it_matters: A candidate can only apply to a requisition that exists. An earlier date usually comes from a
    migration that kept the original application date but moved the application to a new requisition.
  rule_authority: best_practice
  sap_impact: Time-to-fill and time-to-hire are overstated; source and pipeline reports put the application in the wrong
    period.
  fix_map:
    __other__: Check the application history; if it was moved from another requisition, record the original requisition
      in a note and correct the reporting date where possible.
  record_fix_template: 'Application by candidate {JOBAPPLICATION.CANDIDATE_ID} on requisition {JOBAPPLICATION.JOB_REQ_ID}:
    applied {JOBAPPLICATION.APPLICATION_DATE}, requisition opened {JOBREQUISITION.OPEN_DATE}.'
- id: REC022
  field: JOBAPPLICATION.APPLICATION_DATE
  check_class: cross_field_check
  fail_when: '`JOBAPPLICATION.APPLICATION_DATE` > `JOBREQUISITION.CLOSE_DATE`'
  require_populated: true
  severity: low
  dimension: consistency
  message: Application is dated after the job requisition was closed
  why_it_matters: A closed requisition should not receive applications. Late applications mean the posting stayed live
    after closing, or a recruiter forwarded candidates to a closed requisition.
  rule_authority: best_practice
  sap_impact: Candidates wait on a job that is no longer open; pipeline reports count applications on closed jobs.
  fix_map:
    __other__: Remove the job postings of closed requisitions, and move the candidates to an open requisition or close
      their applications with a reason.
  record_fix_template: 'Application by candidate {JOBAPPLICATION.CANDIDATE_ID} on requisition {JOBAPPLICATION.JOB_REQ_ID}:
    applied {JOBAPPLICATION.APPLICATION_DATE}, requisition closed {JOBREQUISITION.CLOSE_DATE}.'
- id: REC023
  field: JOBREQUISITION.HIRING_MANAGER
  check_class: exists_check
  target_table: EMPEMPLOYMENT
  target_fields:
  - USERID
  severity: medium
  dimension: consistency
  message: Hiring manager of the requisition is not an employee
  why_it_matters: The hiring manager of a requisition must be an employee so approvals and the later hire can use the manager hierarchy.
  rule_authority: best_practice
  sap_impact: Approvals route to nobody and the hire cannot inherit the manager.
  fix_map:
    __other__: Assign an employee as hiring manager.
  record_fix_template: 'Requisition {JOBREQUISITION.JOB_REQ_ID}: hiring manager is not an employee. Correct the requisition.'
- id: REC024
  field: ONBOARDINGCANDIDATEINFO.MANAGER_ID
  check_class: exists_check
  target_table: EMPEMPLOYMENT
  target_fields:
  - USERID
  applies_when:
    ONBOARDINGCANDIDATEINFO.MANAGER_ID:
      populated: true
  severity: medium
  dimension: consistency
  message: Onboarding manager is not an employee
  why_it_matters: The manager of a new hire must exist as an employee so the hire can be placed in the reporting line.
  rule_authority: best_practice
  sap_impact: The new hire is created without a manager and workflow items go unassigned.
  fix_map:
    __other__: Assign an existing employee as manager.
  record_fix_template: 'Onboarding record {ONBOARDINGCANDIDATEINFO.USERID}: manager is not an employee. Correct the onboarding record.'
- id: REC025
  field: ONBOARDINGCANDIDATEINFO.DEPARTMENT
  check_class: exists_check
  target_table: FODEPARTMENT
  target_fields:
  - EXTERNAL_CODE
  applies_when:
    ONBOARDINGCANDIDATEINFO.DEPARTMENT:
      populated: true
  severity: medium
  dimension: consistency
  message: Onboarding department does not exist in the foundation data
  why_it_matters: The department of a new hire must be a valid foundation department, because it is copied to the employment and to the SAP organisation assignment.
  rule_authority: best_practice
  sap_impact: The hire is created with an invalid organisation assignment and the replication rejects it.
  fix_map:
    __other__: Select a valid department.
  record_fix_template: 'Onboarding record {ONBOARDINGCANDIDATEINFO.USERID}: department is not a foundation department. Correct the onboarding record.'
- id: REC026
  field: JOBREQUISITION.STATUS
  check_class: null_check
  severity: high
  dimension: completeness
  message: Requisition status is required to track where the requisition sits in its lifecycle
  why_it_matters: STATUS drives which requisitions are open for new applications, visible on the career site, and included
    in time-to-fill reporting. Without it, the requisition cannot be reliably included in or excluded from recruiting pipeline
    dashboards.
  rule_authority: best_practice
  sap_impact: Requisition lifecycle state is unknown. Career site publishing rules and pipeline dashboards cannot classify
    this requisition as open, closed, or on hold.
  fix_map:
    __blank__: Set the requisition status via Recruiting > Requisition Management > Edit Requisition.
  record_fix_template: 'Requisition {JOBREQUISITION.JOB_REQ_ID}: STATUS is missing. Set via Recruiting > Requisition Management.'
- id: REC027
  field: JOBREQUISITION.STATUS
  check_class: domain_value_check
  allowed_values:
  - Open
  - Closed
  - OnHold
  - Cancelled
  - Filled
  severity: medium
  dimension: accuracy
  message: Requisition status must be a recognised lifecycle value
  why_it_matters: Reporting and the career site posting rules branch on a fixed set of requisition statuses. A value outside
    this set is usually a free-text entry or a stale integration code that reporting cannot classify.
  rule_authority: best_practice
  sap_impact: Requisition is excluded from status-based dashboards and may stay published or hidden incorrectly on the career
    site.
  valid_values_with_labels:
    Open: Open — accepting applications
    Closed: Closed — filled or cancelled, no longer accepting applications
    OnHold: On hold — temporarily paused
    Cancelled: Cancelled — withdrawn before being filled
    Filled: Filled — hire completed, pending close
  fix_map:
    __blank__: Correct the requisition status to one of the recognised lifecycle values via Recruiting > Requisition Management.
  record_fix_template: 'Requisition {JOBREQUISITION.JOB_REQ_ID}: STATUS value is not recognised. Correct via Recruiting >
    Requisition Management.'
- id: REC028
  field: JOBREQUISITION.NUM_OPENINGS
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Number of openings is required for headcount and budget tracking
  why_it_matters: NUM_OPENINGS tells workforce planning how many hires a single requisition covers. Without it, headcount
    forecasts and approved-budget reconciliation cannot tell a single-hire requisition from a multi-hire one.
  rule_authority: best_practice
  sap_impact: Headcount forecast cannot allocate approved budget correctly against this requisition. Multi-hire requisitions
    may be under-counted in workforce planning.
  fix_map:
    __blank__: Set the number of openings via Recruiting > Requisition Management > Edit Requisition.
  record_fix_template: 'Requisition {JOBREQUISITION.JOB_REQ_ID}: NUM_OPENINGS is missing. Set via Recruiting > Requisition
    Management.'
- id: REC029
  field: JOBREQUISITION.NUM_OPENINGS
  check_class: cross_field_check
  fail_when: '`JOBREQUISITION.NUM_OPENINGS` <= 0'
  require_populated: true
  severity: medium
  dimension: accuracy
  message: Number of openings must be a positive count
  why_it_matters: A requisition with zero or negative openings should not be open for applications — it indicates the requisition
    was not closed when the headcount was filled or cancelled, or that the field was populated with a placeholder value.
  rule_authority: best_practice
  sap_impact: Headcount forecast overstates open positions. Career site may keep accepting applications for a requisition
    that should already be closed.
  fix_map:
    __other__: Correct the number of openings to a positive integer, or close the requisition if no openings remain.
  record_fix_template: 'Requisition {JOBREQUISITION.JOB_REQ_ID}: NUM_OPENINGS is zero or negative. Correct via Recruiting
    > Requisition Management.'
- id: REC030
  field: JOBREQUISITION.DEPARTMENT
  check_class: exists_check
  target_table: FODEPARTMENT
  target_fields:
  - EXTERNAL_CODE
  applies_when:
    JOBREQUISITION.DEPARTMENT:
      populated: true
  severity: medium
  dimension: consistency
  message: Requisition department does not exist in the foundation data
  why_it_matters: The department on a requisition must be a valid foundation department because it is copied to the Employee
    Central job information record of the hire made against it.
  rule_authority: best_practice
  sap_impact: The eventual hire inherits an invalid organisation assignment and the Employee Central replication rejects it.
  fix_map:
    __other__: Select a valid department.
  record_fix_template: 'Requisition {JOBREQUISITION.JOB_REQ_ID}: department is not a foundation department. Correct the
    requisition.'
- id: REC031
  field: JOBAPPLICATION.STATUS
  check_class: null_check
  severity: high
  dimension: completeness
  message: Application status is required to track pipeline stage
  why_it_matters: STATUS is the single field that places an application in the recruiting pipeline (applied, screening,
    interview, offer, hired, rejected, withdrawn). Without it, the application cannot appear on any pipeline or funnel
    report.
  rule_authority: best_practice
  sap_impact: Application does not appear on recruiter pipeline views. Funnel conversion reporting undercounts applications
    at every stage.
  fix_map:
    __blank__: Set the application status via Recruiting > Application Management > Edit Application.
  record_fix_template: 'Application {JOBAPPLICATION.CANDIDATE_ID}: STATUS is missing. Set via Recruiting > Application Management.'
- id: REC032
  field: JOBAPPLICATION.STATUS
  check_class: domain_value_check
  allowed_values:
  - Applied
  - Screening
  - Interview
  - Offer
  - Hired
  - Rejected
  - Withdrawn
  severity: medium
  dimension: accuracy
  message: Application status must be a recognised pipeline stage
  why_it_matters: Funnel and conversion reporting groups applications by a fixed set of pipeline stages. A status outside
    this set is usually a free-text note or a stale integration code that breaks the stage grouping.
  rule_authority: best_practice
  sap_impact: Application is excluded from funnel stage reporting or counted in an "unknown" bucket that masks true conversion
    rates.
  valid_values_with_labels:
    Applied: Applied — awaiting initial review
    Screening: Screening — under recruiter review
    Interview: Interview — in the interview process
    Offer: Offer — offer extended
    Hired: Hired — offer accepted and hire completed
    Rejected: Rejected — candidate declined
    Withdrawn: Withdrawn — candidate withdrew
  fix_map:
    __blank__: Correct the application status to one of the recognised pipeline stages via Recruiting > Application Management.
  record_fix_template: 'Application {JOBAPPLICATION.CANDIDATE_ID}: STATUS value is not recognised. Correct via Recruiting
    > Application Management.'
- id: REC033
  field: JOBAPPLICATION.RATING
  check_class: null_check
  applies_when:
    JOBAPPLICATION.STATUS:
    - Interview
    - Offer
    - Hired
  severity: medium
  dimension: completeness
  message: Average interview rating is required once an application reaches the interview stage
  why_it_matters: RATING records the average interviewer assessment and is used to compare candidates in the same pipeline.
    Once an application has progressed to interview, offer, or hire, a missing rating means the hiring decision cannot be
    justified against other candidates.
  rule_authority: best_practice
  sap_impact: Candidate comparison and offer justification reports show no rating for an application that has already been
    interviewed or hired.
  fix_map:
    __blank__: Record the average interview rating via Recruiting > Application Management > Interview Scorecards.
  record_fix_template: 'Application {JOBAPPLICATION.CANDIDATE_ID}: RATING is missing for an application past the interview
    stage. Record via Recruiting > Application Management.'
- id: REC034
  field: JOBAPPLICATION.RATING
  check_class: cross_field_check
  fail_when: '`JOBAPPLICATION.RATING` > 5'
  require_populated: true
  severity: low
  dimension: accuracy
  message: Average interview rating exceeds the configured 0-5 scale
  why_it_matters: RATING is an average of interviewer scores on a 0-5 scale. A value above 5 means the average was computed
    incorrectly or a scorecard was entered on a different scale, and will skew candidate comparison reports.
  rule_authority: best_practice
  sap_impact: Candidate comparison reports rank this application above every candidate rated on the correct scale.
  fix_map:
    __other__: Recalculate the average rating from the individual interview scorecards, each scored 0-5.
  record_fix_template: 'Application {JOBAPPLICATION.CANDIDATE_ID}: RATING is above the 0-5 scale. Recalculate from interview
    scorecards.'
- id: REC035
  field: JOBAPPLICATION.REJECT_REASON
  check_class: null_check
  applies_when:
    JOBAPPLICATION.STATUS:
    - Rejected
  severity: medium
  dimension: completeness
  message: Rejection reason is required when an application has been rejected
  why_it_matters: REJECT_REASON is required by EEO/diversity compliance reporting to explain why a candidate was not progressed.
    A rejected application without a reason cannot be included in adverse-impact analysis.
  rule_authority: best_practice
  sap_impact: Adverse-impact and EEO compliance reporting is missing the rejection reason for this application and may fail
    an audit.
  fix_map:
    __blank__: Record the rejection reason via Recruiting > Application Management > Edit Application before closing the
      application.
  record_fix_template: 'Application {JOBAPPLICATION.CANDIDATE_ID}: application is rejected but REJECT_REASON is missing.
    Record via Recruiting > Application Management.'
- id: REC036
  field: ONBOARDINGCANDIDATEINFO.TASK_COMPLETION
  check_class: cross_field_check
  fail_when: '`ONBOARDINGCANDIDATEINFO.TASK_COMPLETION` != "COMPLETED"'
  require_populated: true
  applies_when:
    ONBOARDINGCANDIDATEINFO.STATUS:
    - COMPLETED
  severity: medium
  dimension: consistency
  message: Onboarding status is completed but the task completion checklist state disagrees
  why_it_matters: When the overall onboarding STATUS has been marked COMPLETED, the underlying task checklist (TASK_COMPLETION)
    should also show COMPLETED. A mismatch means the checklist was not actually finished when the overall status was closed
    out, or the two fields were updated independently.
  rule_authority: best_practice
  sap_impact: Onboarding checklist progress dashboard reports this new hire as fully onboarded while required tasks remain
    outstanding on the checklist.
  fix_map:
    __other__: Reconcile the onboarding STATUS with the TASK_COMPLETION checklist state via Onboarding > Candidate Management.
  record_fix_template: 'Onboarding candidate {ONBOARDINGCANDIDATEINFO.USERID}: STATUS is COMPLETED but TASK_COMPLETION disagrees.
    Reconcile via Onboarding > Candidate Management.'
  grain: ONBOARDINGCANDIDATEINFO
- id: REC037
  field: ONBOARDINGCANDIDATEINFO.TASK_COMPLETION
  check_class: domain_value_check
  allowed_values:
  - NOT_STARTED
  - IN_PROGRESS
  - COMPLETED
  severity: low
  dimension: accuracy
  message: Onboarding task completion state must be a recognised value
  why_it_matters: The onboarding progress dashboard groups new hires by a fixed set of completion states. A value outside
    this set cannot be classified and is dropped from the manager-facing readiness view.
  rule_authority: best_practice
  sap_impact: New hire is dropped from the onboarding readiness dashboard that the hiring manager uses ahead of the start
    date.
  valid_values_with_labels:
    NOT_STARTED: Checklist not yet started
    IN_PROGRESS: Checklist in progress
    COMPLETED: Checklist completed
  fix_map:
    __blank__: Correct the task completion state to NOT_STARTED, IN_PROGRESS, or COMPLETED via Onboarding > Candidate Management.
  record_fix_template: 'Onboarding candidate {ONBOARDINGCANDIDATEINFO.USERID}: TASK_COMPLETION value is not recognised. Correct
    via Onboarding > Candidate Management.'
  grain: ONBOARDINGCANDIDATEINFO
- id: REC038
  field: ONBOARDINGCANDIDATEINFO.BACKGROUND_CHECK_STATUS
  check_class: null_check
  severity: high
  dimension: completeness
  message: Background check status is required before the new hire's start date
  why_it_matters: BACKGROUND_CHECK_STATUS gates whether a new hire is cleared to start. Without it, the onboarding workflow
    cannot tell a pending check from a cleared one, and IT provisioning may proceed for a candidate who has not been cleared.
  rule_authority: best_practice
  sap_impact: IT account provisioning and equipment ordering may proceed for a new hire whose background check has not been
    confirmed as cleared.
  fix_map:
    __blank__: Record the background check outcome via Onboarding > Candidate Management > Compliance Tasks.
  record_fix_template: 'Onboarding candidate {ONBOARDINGCANDIDATEINFO.USERID}: BACKGROUND_CHECK_STATUS is missing. Record
    via Onboarding > Candidate Management.'
  grain: ONBOARDINGCANDIDATEINFO
- id: REC039
  field: ONBOARDINGCANDIDATEINFO.BACKGROUND_CHECK_STATUS
  check_class: domain_value_check
  allowed_values:
  - Pending
  - Cleared
  - Failed
  - Waived
  severity: medium
  dimension: accuracy
  message: Background check status must be a recognised value
  why_it_matters: The onboarding compliance dashboard groups new hires by a fixed set of background check outcomes. A value
    outside this set cannot be classified as cleared or blocked, and compliance cannot confirm the new hire is cleared to
    start.
  rule_authority: best_practice
  sap_impact: Compliance dashboard cannot confirm this new hire is cleared to start. Start-date gating logic may default
    to blocking or, worse, allowing the hire to proceed.
  valid_values_with_labels:
    Pending: Check in progress
    Cleared: Check passed — cleared to start
    Failed: Check failed — hire should be blocked
    Waived: Check waived by HR/compliance
  fix_map:
    __blank__: Correct the background check status to Pending, Cleared, Failed, or Waived via Onboarding > Candidate Management.
  record_fix_template: 'Onboarding candidate {ONBOARDINGCANDIDATEINFO.USERID}: BACKGROUND_CHECK_STATUS value is not recognised.
    Correct via Onboarding > Candidate Management.'
  grain: ONBOARDINGCANDIDATEINFO
- id: REC040
  field: JOBOFFER.OFFER_STATUS
  check_class: null_check
  severity: high
  dimension: completeness
  message: Offer status is required to track the offer through extension, acceptance, or decline
  why_it_matters: OFFER_STATUS is the field that tells recruiting whether an offer is still open, has been accepted, or has
    been declined or rescinded. Without it, the offer cannot be excluded from open-offer ageing reports once it has been
    resolved.
  rule_authority: best_practice
  sap_impact: Open-offer ageing reports cannot determine whether this offer is still pending a candidate decision.
  fix_map:
    __blank__: Set the offer status via Recruiting > Offer Management > Edit Offer.
  record_fix_template: 'Offer {JOBOFFER.OFFER_ID}: OFFER_STATUS is missing. Set via Recruiting > Offer Management.'
- id: REC041
  field: JOBOFFER.OFFER_STATUS
  check_class: domain_value_check
  allowed_values:
  - Extended
  - Accepted
  - Declined
  - Rescinded
  severity: medium
  dimension: accuracy
  message: Offer status must be a recognised value
  why_it_matters: Offer acceptance-rate reporting groups offers by a fixed set of outcomes. A value outside this set cannot
    be classified as accepted, declined, or rescinded, and is dropped from the acceptance-rate calculation.
  rule_authority: best_practice
  sap_impact: Offer acceptance-rate reporting excludes this offer, understating or overstating the true acceptance rate for
    the requisition.
  valid_values_with_labels:
    Extended: Extended — awaiting candidate decision
    Accepted: Accepted — candidate accepted the offer
    Declined: Declined — candidate declined the offer
    Rescinded: Rescinded — offer withdrawn by the company
  fix_map:
    __blank__: Correct the offer status to Extended, Accepted, Declined, or Rescinded via Recruiting > Offer Management.
  record_fix_template: 'Offer {JOBOFFER.OFFER_ID}: OFFER_STATUS value is not recognised. Correct via Recruiting > Offer
    Management.'
- id: REC042
  field: JOBOFFER.START_DATE
  check_class: cross_field_check
  fail_when: '`JOBOFFER.START_DATE` < `JOBOFFER.OFFER_DATE`'
  require_populated: true
  severity: high
  dimension: consistency
  message: Offer start date must not be before the date the offer was extended
  why_it_matters: A proposed start date earlier than the offer date is not physically possible — the candidate cannot start
    a job before being offered it. This usually means the offer date was not updated when the offer was re-issued with a
    new start date.
  rule_authority: best_practice
  sap_impact: Onboarding workflow generation computes a negative lead time and either fails to schedule pre-boarding tasks
    or schedules them in the past.
  fix_map:
    __other__: Correct the offer date or the proposed start date via Recruiting > Offer Management so the start date follows
      the offer date.
  record_fix_template: 'Offer {JOBOFFER.OFFER_ID}: START_DATE is before OFFER_DATE. Correct via Recruiting > Offer Management.'
- id: REC043
  field: JOBOFFER.JOB_REQ_ID
  check_class: exists_check
  target_table: JOBREQUISITION
  target_fields:
  - JOB_REQ_ID
  severity: high
  dimension: consistency
  message: Offer does not reference an existing job requisition
  why_it_matters: Every offer must be issued against a requisition so headcount, budget, and the eventual hire can be reconciled
    back to the approved opening. An offer with no matching requisition is orphaned from budget and headcount controls.
  rule_authority: best_practice
  sap_impact: Offer cannot be reconciled against approved headcount or budget. The eventual hire has no requisition to close.
  fix_map:
    __other__: Correct the requisition reference on the offer, or create the missing requisition if the offer is legitimate.
  record_fix_template: 'Offer {JOBOFFER.OFFER_ID}: JOB_REQ_ID does not match an existing requisition. Correct the offer.'
- id: REC044
  field: JOBOFFER.CANDIDATE_ID
  check_class: exists_check
  target_table: JOBAPPLICATION
  target_fields:
  - CANDIDATE_ID
  severity: high
  dimension: consistency
  message: Offer does not reference a candidate who has an application on file
  why_it_matters: An offer should only be issued to a candidate who went through the application and interview pipeline.
    An offer with no matching application record is a sign of a bypassed process or a broken candidate ID link between
    the Recruiting application and offer objects.
  rule_authority: best_practice
  sap_impact: The offer cannot be traced back to its application, interview history, or EEO/diversity pipeline reporting
    for this hire.
  fix_map:
    __other__: Correct the candidate reference on the offer, or create the missing application record if the offer is legitimate.
  record_fix_template: 'Offer {JOBOFFER.OFFER_ID}: CANDIDATE_ID does not match an existing application. Correct the offer.'
