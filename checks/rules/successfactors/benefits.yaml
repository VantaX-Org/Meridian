  - id: BEN172
    field: BENEFITENROLLMENT.PLAN_TYPE
    check_class: domain_value_check
    allowed_values: [MEDICAL, DENTAL, VISION, LIFE, GAP, RETIREMENT, SAVINGS, PENSION, FSA, HSA]
    valid_values_with_labels:
      MEDICAL: 'Medical'
      DENTAL: 'Dental'
      VISION: 'Vision'
      LIFE: 'Life Insurance'
      GAP: 'Gap Insurance'
      RETIREMENT: 'Retirement'
      SAVINGS: 'Savings'
      PENSION: 'Pension'
      FSA: 'Flexible Spending Account'
      HSA: 'Health Savings Account'
    severity: medium
    dimension: validity
    message: 'Plan type is not one of the recognized benefit plan categories'
    why_it_matters: 'PLAN_TYPE drives nearly every plan-type-specific rule in this pack (required fields, cost plausibility, eligibility by worker class). A value outside the recognized set means none of those rules can classify the plan.'
    rule_authority: best_practice
    sap_impact: 'Plan-type-based reporting and carrier feed mapping cannot categorize the enrolment at all.'
    fix_map:
      __other__: 'Correct the plan type to one of the recognized categories via Admin Center > Benefits.'
    record_fix_template: 'Enrolment {BENEFITENROLLMENT.USERID}: plan type {BENEFITENROLLMENT.PLAN_TYPE} is not recognized. Correct it.'
    auto_fix:
      steps:
      - {op: 'strip'}
      - {op: 'upper'}
      confidence: medium
  - id: BEN173
    field: BENEFITENROLLMENT.EMPLOYEE_COST
    check_class: regex_check
    pattern: '^(?!-?\d+\.\d{3})-?\d+(\.\d{1,2})?$'
    severity: low
    dimension: accuracy
    message: 'Employee cost has more than two decimal places of precision'
    why_it_matters: 'Currency amounts should be stated to at most two decimal places. A value with finer precision usually comes from an unrounded calculation (e.g. an annual amount divided by an odd number of pay periods) rather than a genuine monetary amount.'
    rule_authority: best_practice
    sap_impact: 'Payroll deduction amounts carried at sub-cent precision can accumulate rounding discrepancies over a payroll year.'
    fix_map:
      __other__: 'Round the employee cost to two decimal places via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: employee cost {BENEFITENROLLMENT.EMPLOYEE_COST} has more than two decimal places. Round it.'
  - id: BEN174
    field: BENEFITENROLLMENT.EMPLOYER_COST
    check_class: regex_check
    pattern: '^(?!-?\d+\.\d{3})-?\d+(\.\d{1,2})?$'
    severity: low
    dimension: accuracy
    message: 'Employer cost has more than two decimal places of precision'
