  - id: BEN189
    field: DEPENDENT.START_DATE
    check_class: interval_check
    group_by: [DEPENDENT.PERSON_ID, DEPENDENT.RELATED_PERSON_ID]
    start: DEPENDENT.START_DATE
    end: DEPENDENT.END_DATE
    severity: medium
    dimension: consistency
    message: 'Same dependent has overlapping coverage-window records'
    why_it_matters: 'The same dependent (same sponsoring employee and same related person) should not have two coverage records with overlapping date ranges. An overlap usually means a correction record was added without closing out the one it replaces.'
    rule_authority: best_practice
    sap_impact: 'Carrier feed receives two concurrent coverage periods for the same dependent, which most carriers reject or double-bill.'
    fix_map:
      __other__: 'Close out the superseded dependent record before the replacement starts via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: overlapping coverage-window records for related person {DEPENDENT.RELATED_PERSON_ID}. Close out the superseded record.'
  - id: BEN190
    field: DEPENDENT.RELATIONSHIP_TYPE
    check_class: cross_field_check
    fail_when: '(`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == ''spouse'') & (`PERINFO.MARITAL_STATUS`.str.upper() == ''SINGLE'')'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Sponsoring employee has an active spouse dependent but is recorded as single'
    why_it_matters: 'A spouse dependent implies a married (or equivalent) marital status on the sponsoring employee''s personal record. A mismatch means one of the two records was not updated after a status change.'
    rule_authority: best_practice
    sap_impact: 'Marital-status-driven tax and benefit eligibility rules use the personal record''s status, which disagrees with the dependent record actually on file.'
    fix_map:
      __other__: 'Reconcile the employee''s marital status against the dependent record via Admin Center > Benefits.'
    record_fix_template: 'Employee {DEPENDENT.PERSON_ID}: has a spouse dependent but marital status is recorded as single. Reconcile the records.'
  - id: BEN191
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `POSITION.EFFECTIVE_END_DATE`.notna() & (`POSITION.EFFECTIVE_END_DATE` < @today)'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Active enrolment is tied to a position whose effective end date has already passed'
    why_it_matters: 'A position with a past EFFECTIVE_END_DATE has been closed out in Position Management. An active benefit enrolment still tied to it suggests the employee''s position was not re-pointed when the position was closed.'
    rule_authority: best_practice
    sap_impact: 'Benefit cost allocation and headcount reporting attribute this enrolment to a position that no longer exists as of today.'
    fix_map:
      __other__: 'Confirm the employee''s current position and update the record via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment tied to a position that ended on {POSITION.EFFECTIVE_END_DATE}. Confirm the current position.'
  - id: BEN192
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `EMPGLOBALASSIGNMENT.PLANNED_END_DATE`.notna() & (`EMPGLOBALASSIGNMENT.PLANNED_END_DATE` < @today)'
    require_populated: true
    severity: low
    dimension: consistency
    message: 'Active enrolment continues past the employee''s planned international assignment end date'
    why_it_matters: 'PLANNED_END_DATE is the scheduled end of a global assignment, set in advance of the actual end. An active enrolment that has already passed this planned date is worth a check to confirm whether the assignment was extended or the benefit should be transitioning to home-country coverage.'
    rule_authority: best_practice
    sap_impact: 'Home-country and host-country benefit coverage can overlap or lapse if the assignment end was not actioned when planned.'
    fix_map:
      __other__: 'Confirm whether the assignment was extended and update coverage accordingly via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment active past the planned assignment end date {EMPGLOBALASSIGNMENT.PLANNED_END_DATE}. Confirm the assignment status.'
  - id: BEN193
    field: BENEFITENROLLMENT.DEPENDENT_LINK
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & (`BENEFITENROLLMENT.PLAN_TYPE` == ''GAP'') & `BENEFITENROLLMENT.DEPENDENT_LINK`.notna()'
    severity: low
    dimension: consistency
    message: 'Gap insurance enrolment has a dependent linked, but gap plans are normally employee-only'
    why_it_matters: 'Gap insurance plans typically supplement the employee''s own medical coverage and do not carry dependents. A dependent link here is worth confirming against the actual plan design.'
    rule_authority: best_practice
    sap_impact: 'Carrier feed may reject a dependent record on a plan type that does not support dependent coverage.'
    fix_map:
      __blank__: 'Confirm whether this gap plan supports dependents via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: gap insurance enrolment has a dependent linked. Confirm the plan supports dependents.'
  - id: BEN194
    field: BENEFITENROLLMENT.EMPLOYER_COST
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `BENEFITENROLLMENT.PLAN_TYPE`.isin([''RETIREMENT'',''PENSION'',''SAVINGS'']) & `BENEFITENROLLMENT.EMPLOYEE_COST`.notna() & (`BENEFITENROLLMENT.EMPLOYEE_COST` > 0) & (`BENEFITENROLLMENT.EMPLOYER_COST`.isna() | (`BENEFITENROLLMENT.EMPLOYER_COST` == 0))'
    severity: medium
    dimension: consistency
    message: 'Employee contributes to a retirement, pension or savings plan with no employer match recorded'
    why_it_matters: 'These plan types normally carry an employer matching contribution alongside the employee''s own contribution. A zero or missing employer cost while the employee is contributing suggests the match was never loaded.'
    rule_authority: best_practice
    sap_impact: 'Employer contribution liability and matching reports understate the true employer commitment for this plan.'
    fix_map:
      __other__: 'Load the correct employer matching contribution via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: {BENEFITENROLLMENT.PLAN_TYPE} contribution has no employer match. Load the correct amount.'
  - id: BEN195
    field: BENEFITENROLLMENT.EMPLOYER_COST
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & (`BENEFITENROLLMENT.PLAN_TYPE` == ''FSA'') & `BENEFITENROLLMENT.EMPLOYER_COST`.notna() & (`BENEFITENROLLMENT.EMPLOYER_COST` > 0)'
    severity: low
    dimension: accuracy
    message: 'Flexible spending account enrolment shows an employer cost, verify the employer contribution policy'
    why_it_matters: 'FSA plans are usually funded entirely by employee salary deferral. An employer cost on this record is not necessarily wrong, but is unusual enough to warrant confirming against the plan''s funding rules.'
    rule_authority: best_practice
    sap_impact: 'Employer benefit cost reporting may overstate employer-funded spend if this is actually a data-entry mistake rather than a genuine employer contribution.'
    fix_map:
      __blank__: 'Confirm the FSA plan''s employer contribution policy via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: FSA enrolment shows an employer cost. Confirm the plan''s funding policy.'
  - id: BEN196
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & (`EMPEMPLOYMENT.IS_PRIMARY`.str.lower().isin([''false'',''0''])) & `BENEFITENROLLMENT.PLAN_TYPE`.isin([''MEDICAL'',''DENTAL'',''VISION'',''LIFE'',''RETIREMENT'',''PENSION''])'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Benefit enrolment is attached to a non-primary employment assignment'
    why_it_matters: 'Most core benefit plans attach to an employee''s primary assignment only. An active enrolment on a secondary (non-primary) assignment suggests the enrolment was keyed against the wrong assignment record.'
    rule_authority: best_practice
    sap_impact: 'Benefit cost and coverage could be duplicated or misallocated across an employee''s concurrent assignments.'
    fix_map:
      __other__: 'Confirm the enrolment is attached to the primary assignment via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: benefit enrolment attached to a non-primary assignment. Confirm the correct assignment.'
  - id: BEN197
    field: BENEFITENROLLMENT.PLAN_TYPE
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & (`EMPEMPLOYMENT.REGULAR_TEMP`.str.upper() == ''TEMP'') & `BENEFITENROLLMENT.PLAN_TYPE`.isin([''RETIREMENT'',''PENSION''])'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Temporary worker is enrolled in a retirement or pension plan'
    why_it_matters: 'Temporary workers are usually excluded from employer retirement and pension plans by plan design. An enrolment here suggests either a misclassification or a bypassed eligibility rule.'
    rule_authority: best_practice
    sap_impact: 'Plan administrator may reject the contribution, or the employer may incur unbudgeted employer contributions for an ineligible worker class.'
    fix_map:
      __other__: 'Confirm the worker classification and plan eligibility via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: temporary worker enrolled in {BENEFITENROLLMENT.PLAN_TYPE}. Confirm eligibility.'
  - id: BEN198
    field: BENEFITENROLLMENT.PLAN_TYPE
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & (`EMPEMPLOYMENT.EMPLOYEE_CLASS`.str.upper() == ''SEASONAL'') & (`BENEFITENROLLMENT.PLAN_TYPE` == ''MEDICAL'')'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Seasonal employee is enrolled in a medical plan'
    why_it_matters: 'Seasonal employees are usually excluded from employer medical coverage until they reach a minimum service threshold. An active medical enrolment here suggests either a misclassification or a bypassed eligibility rule.'
    rule_authority: best_practice
    sap_impact: 'Carrier may reject the enrolment or bill the employer for coverage on an ineligible worker class.'
    fix_map:
      __other__: 'Confirm the worker classification and plan eligibility via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: seasonal employee enrolled in a medical plan. Confirm eligibility.'
  - id: BEN199
    field: DEPENDENT.DEPENDENT_BIRTH
    check_class: null_check
    severity: medium
    dimension: completeness
    message: 'Dependent record has no date of birth recorded'
    why_it_matters: 'DEPENDENT_BIRTH underpins every age-based eligibility rule in this pack (age-out thresholds, minimum ages, implausible ages). Without it none of those checks can run for this dependent at all.'
    rule_authority: best_practice
    sap_impact: 'Age-banded dependent pricing and age-out processing cannot be evaluated for this dependent.'
    fix_map:
      __blank__: 'Load the dependent''s date of birth via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: no date of birth recorded. Load the date of birth.'
  - id: BEN200
    field: DEPENDENT.IS_BENEFICIARY
    check_class: null_check
    severity: low
    dimension: completeness
    message: 'Dependent record does not state whether the dependent is a beneficiary'
    why_it_matters: 'IS_BENEFICIARY is used to distinguish dependents carried for coverage purposes from those also named as a plan beneficiary. Leaving it blank means neither can be confirmed.'
    rule_authority: best_practice
    sap_impact: 'Beneficiary designation reporting for life and retirement plans cannot include this dependent.'
    fix_map:
      __blank__: 'Record whether this dependent is a designated beneficiary via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: beneficiary flag not recorded. Record true or false.'
  - id: BEN201
    field: BENEFITENROLLMENT.EMPLOYEE_COST
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.EMPLOYEE_COST`.notna() & (`BENEFITENROLLMENT.EMPLOYEE_COST` < 0)'
    severity: critical
    dimension: accuracy
    message: 'Employee cost is negative'
    why_it_matters: 'A negative premium amount is not a real monetary value for a cost field and will break any downstream sum or payroll deduction calculation.'
    rule_authority: best_practice
    sap_impact: 'Payroll deduction totals and benefit cost reports are corrupted by a negative line item.'
    fix_map:
      __other__: 'Correct the employee cost to a non-negative amount via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: employee cost {BENEFITENROLLMENT.EMPLOYEE_COST} is negative. Correct the amount.'
  - id: BEN202
    field: BENEFITENROLLMENT.EMPLOYER_COST
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.EMPLOYER_COST`.notna() & (`BENEFITENROLLMENT.EMPLOYER_COST` < 0)'
    severity: critical
    dimension: accuracy
    message: 'Employer cost is negative'
    why_it_matters: 'A negative premium amount is not a real monetary value for a cost field and will break any downstream sum or employer liability calculation.'
    rule_authority: best_practice
    sap_impact: 'Employer benefit cost reporting totals are corrupted by a negative line item.'
    fix_map:
      __other__: 'Correct the employer cost to a non-negative amount via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: employer cost {BENEFITENROLLMENT.EMPLOYER_COST} is negative. Correct the amount.'
  - id: BEN203
    field: BENEFITENROLLMENT.DEPENDENT_LINK
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.COVERAGE_LEVEL` == ''EMP_SPOUSE'') & `BENEFITENROLLMENT.DEPENDENT_LINK`.notna() & (`BENEFITENROLLMENT.DEPENDENT_LINK`.str.count('';'') > 0)'
    require_populated: true
    severity: low
    dimension: consistency
    message: 'Employee-plus-spouse coverage is linked to more than one dependent'
    why_it_matters: 'EMP_SPOUSE coverage is meant to cover exactly one spouse dependent. More than one linked dependent under this tier suggests either the tier or the linkage is wrong.'
    rule_authority: best_practice
    sap_impact: 'A second dependent priced and covered under a tier designed for a single spouse will not match what the carrier expects to bill for.'
    fix_map:
      __other__: 'Confirm the coverage tier and dependent linkage agree via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: employee-plus-spouse coverage links more than one dependent. Confirm the linkage.'
  - id: BEN204
    field: BENEFITENROLLMENT.DEPENDENT_LINK
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.COVERAGE_LEVEL` == ''EMP_SPOUSE_CHILD'') & (`BENEFITENROLLMENT.DEPENDENT_LINK`.isna() | (`BENEFITENROLLMENT.DEPENDENT_LINK`.str.count('';'') < 1))'
    severity: low
    dimension: consistency
    message: 'Employee-plus-spouse-plus-child coverage is linked to fewer than two dependents'
    why_it_matters: 'EMP_SPOUSE_CHILD coverage implies both a spouse and at least one child are covered. Fewer than two linked dependents means the linkage is incomplete for the elected tier.'
    rule_authority: best_practice
    sap_impact: 'The carrier feed will under-represent who is actually covered under this enrolment.'
    fix_map:
      __other__: 'Confirm all covered dependents are linked for this tier via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: employee-plus-spouse-plus-child coverage links fewer than two dependents. Confirm the linkage.'
  - id: BEN205
    field: BENEFITENROLLMENT.EMPLOYEE_COST
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''W'') & `BENEFITENROLLMENT.EMPLOYEE_COST`.notna() & (`BENEFITENROLLMENT.EMPLOYEE_COST` > 0)'
    severity: medium
    dimension: consistency
    message: 'Waived enrolment still carries a positive employee cost'
    why_it_matters: 'A waived (STATUS ''W'') enrolment means the employee declined the plan, so no employee deduction should be in effect. A positive employee cost on a waived record means the waiver was not fully actioned.'
    rule_authority: best_practice
    sap_impact: 'Payroll may continue to deduct a premium for coverage the employee explicitly declined.'
    fix_map:
      __other__: 'Zero out the employee cost on the waived enrolment via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: waived enrolment still has a positive employee cost. Zero it out.'
  - id: BEN206
    field: BENEFITENROLLMENT.EMPLOYER_COST
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''W'') & `BENEFITENROLLMENT.EMPLOYER_COST`.notna() & (`BENEFITENROLLMENT.EMPLOYER_COST` > 0)'
    severity: medium
    dimension: consistency
    message: 'Waived enrolment still carries a positive employer cost'
    why_it_matters: 'A waived (STATUS ''W'') enrolment means the employee declined the plan, so no employer contribution should be in effect. A positive employer cost on a waived record means the waiver was not fully actioned.'
    rule_authority: best_practice
    sap_impact: 'Employer benefit cost reporting includes a contribution for coverage the employee explicitly declined.'
    fix_map:
      __other__: 'Zero out the employer cost on the waived enrolment via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: waived enrolment still has a positive employer cost. Zero it out.'
  - id: BEN207
    field: DEPENDENT.RELATED_PERSON_ID
    check_class: cross_field_check
    fail_when: '`DEPENDENT.RELATED_PERSON_ID`.notna() & (`DEPENDENT.RELATED_PERSON_ID` == `DEPENDENT.PERSON_ID`)'
    severity: critical
    dimension: accuracy
    message: 'Dependent record links a person to themselves'
    why_it_matters: 'RELATED_PERSON_ID identifies the dependent, who must be a different person from the sponsoring employee in PERSON_ID. A record where the two match is a data integrity error, not a genuine dependent relationship.'
    rule_authority: best_practice
    sap_impact: 'Carrier feed would attempt to enrol the employee as their own dependent, which every carrier system rejects.'
    fix_map:
      __other__: 'Correct the dependent''s related person identifier via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: related person is the same as the sponsoring person. Correct the related person identifier.'
  - id: BEN208
    field: BENEFITENROLLMENT.DEPENDENT_LINK
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.DEPENDENT_LINK`.notna() & (`BENEFITENROLLMENT.DEPENDENT_LINK` == `BENEFITENROLLMENT.USERID`)'
    require_populated: true
    severity: critical
    dimension: accuracy
    message: 'Enrolled employee is listed as their own dependent'
    why_it_matters: 'DEPENDENT_LINK should only ever reference other people covered under the employee''s plan. The employee''s own identifier appearing in their own dependent linkage is a data integrity error.'
    rule_authority: best_practice
    sap_impact: 'Carrier feed would attempt to enrol the employee as their own dependent, which every carrier system rejects.'
    fix_map:
      __other__: 'Remove the employee''s own identifier from the dependent linkage via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: listed as their own dependent in DEPENDENT_LINK. Remove the self-reference.'
  - id: BEN209
    field: BENEFITENROLLMENT.PLAN_TYPE
    check_class: uniqueness_check
    fields:
    - BENEFITENROLLMENT.USERID
    - BENEFITENROLLMENT.PLAN_TYPE
    applies_when:
      BENEFITENROLLMENT.STATUS:
      - A
    severity: high
    dimension: uniqueness
    message: 'Employee has more than one active plan of the same plan type'
    why_it_matters: 'An employee should have at most one active plan per PLAN_TYPE at a time (e.g. only one active medical plan). More than one active plan of the same type usually means an old election was never terminated when a new one was elected.'
    rule_authority: best_practice
    sap_impact: 'Carrier feed receives two concurrent active plans of the same type, which is typically rejected or results in duplicate billing.'
    fix_map:
      __other__: 'Terminate the superseded plan of this type via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: more than one active {BENEFITENROLLMENT.PLAN_TYPE} plan. Terminate the superseded plan.'
  - id: BEN210
    field: DEPENDENT.IS_BENEFICIARY
    check_class: cross_field_check
    fail_when: '(`DEPENDENT.IS_BENEFICIARY`.str.lower() == ''true'') & `DEPENDENT.END_DATE`.notna() & (`DEPENDENT.END_DATE` < @today)'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Beneficiary designation remains on a dependent record that has already ended'
    why_it_matters: 'A dependent relationship that has ended should not still be relied on as an active beneficiary designation. This is worth flagging so the beneficiary election is reconfirmed rather than silently pointing at a lapsed relationship.'
    rule_authority: best_practice
    sap_impact: 'A life or retirement claim could be paid out based on a beneficiary relationship that is no longer current.'
    fix_map:
      __other__: 'Reconfirm the current beneficiary designation via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: beneficiary designation remains on a dependent record that ended on {DEPENDENT.END_DATE}. Reconfirm the designation.'
  - id: BEN211
    field: DEPENDENT.IS_BENEFICIARY
    check_class: cross_field_check
    fail_when: '(`DEPENDENT.IS_BENEFICIARY`.str.lower() == ''true'') & (`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == ''child'') & ((@today - `DEPENDENT.DEPENDENT_BIRTH`).dt.days < 6570)'
    require_populated: true
    severity: low
    dimension: consistency
    message: 'A minor child dependent is designated as a plan beneficiary'
    why_it_matters: 'Naming a minor directly as a beneficiary can create legal and plan-administration complications (payouts to minors are often restricted). This is worth a review, not necessarily a correction.'
    rule_authority: best_practice
    sap_impact: 'A claim payable to this beneficiary may be held up by the carrier pending a guardian or trust arrangement.'
    fix_map:
      __blank__: 'Confirm the beneficiary designation is handled per plan rules for minors via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: minor child designated as beneficiary. Confirm the designation follows plan rules for minors.'
  - id: BEN212
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `FOCOMPANY.CURRENCY`.isna()'
    severity: medium
    dimension: completeness
    message: 'Active enrolment''s company has no currency recorded'
    why_it_matters: 'BENEFITENROLLMENT carries no currency of its own; the employee''s company currency is the only way to interpret EMPLOYEE_COST and EMPLOYER_COST. A missing currency on the company means those amounts cannot be interpreted at all.'
    rule_authority: best_practice
    sap_impact: 'Benefit cost amounts cannot be reported in any currency, so cost-based analytics exclude this record.'
    fix_map:
      __other__: 'Load the currency for this company in Foundation Objects via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: company has no currency recorded. Load the currency.'
  - id: BEN213
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `FOCOMPANY.COUNTRY`.isna()'
    severity: low
    dimension: completeness
    message: 'Active enrolment''s company has no country recorded'
    why_it_matters: 'Country drives statutory benefit requirements and local plan rules. A company with no country on file means those rules cannot be applied for this enrolment.'
    rule_authority: best_practice
    sap_impact: 'Country-specific statutory benefit reporting excludes this enrolment.'
    fix_map:
      __other__: 'Load the country for this company in Foundation Objects via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: company has no country recorded. Load the country.'
  - id: BEN214
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `EMPEMPLOYMENT.COUNTRY_OF_COMPANY`.notna() & `FOCOMPANY.COUNTRY`.notna() & (`EMPEMPLOYMENT.COUNTRY_OF_COMPANY`.str.upper() != `FOCOMPANY.COUNTRY`.str.upper())'
    require_populated: true
    severity: low
    dimension: consistency
    message: 'Employment record''s company country disagrees with the Foundation Object company country'
    why_it_matters: 'COUNTRY_OF_COMPANY on the employment record and COUNTRY on the FOCOMPANY foundation object describe the same thing from two different sources. A mismatch means one of them is stale.'
    rule_authority: best_practice
    sap_impact: 'Statutory benefit rules keyed off country may be applied inconsistently depending on which source a given report reads from.'
    fix_map:
      __other__: 'Reconcile the company country between the employment record and Foundation Objects via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: employment record''s company country disagrees with the Foundation Object record. Reconcile the two.'
  - id: BEN215
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: freshness_check
    max_age_hours: 26280
    applies_when:
      BENEFITENROLLMENT.STATUS:
      - A
    severity: low
    dimension: timeliness
    message: 'Active enrolment has not been re-elected or confirmed in over three years'
    why_it_matters: 'Most benefit programmes expect an annual or multi-year re-election cycle. An active enrolment whose EFFECTIVE_DATE has not moved in over three years may simply be a stable long-term election, but it is worth confirming it was not missed during open enrolment.'
    rule_authority: best_practice
    sap_impact: 'A plan election that should have been re-confirmed during open enrolment may be running on stale terms (old coverage tier, old cost) without anyone having reviewed it.'
    fix_map:
      __blank__: 'Confirm the election is still current at the next open enrolment via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: active enrolment unchanged for over three years. Confirm it is still current.'
  - id: BEN216
    field: BENEFITENROLLMENT.ENROL_DATE
    check_class: freshness_check
    max_age_hours: 43800
    applies_when:
      BENEFITENROLLMENT.STATUS:
      - T
    severity: low
    dimension: timeliness
    message: 'Terminated enrolment record has been sitting unreviewed for over five years'
    why_it_matters: 'Long-terminated enrolment records are candidates for archiving once past the required retention window. Surfacing them lets the benefits team confirm they are safe to archive.'
    rule_authority: best_practice
    sap_impact: 'Historical enrolment tables continue to grow with records that could be archived, slowing reporting over the full history.'
    fix_map:
      __blank__: 'Confirm the record is eligible for archiving via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: terminated enrolment unreviewed for over five years. Confirm it is eligible for archiving.'
  - id: BEN217
    field: BENEFITENROLLMENT.PLAN_ID
    check_class: regex_check
    pattern: '^[A-Za-z0-9_-]+$'
    severity: low
    dimension: validity
    message: 'Plan identifier contains characters outside the expected alphanumeric set'
    why_it_matters: 'PLAN_ID is used as a lookup key against the carrier''s plan catalogue. Special characters outside letters, digits, hyphen and underscore are not valid in most carrier plan code formats.'
    rule_authority: best_practice
    sap_impact: 'Carrier feed may reject the enrolment record outright if the plan code fails their format validation.'
    fix_map:
      __other__: 'Correct the plan identifier to use only letters, digits, hyphen and underscore via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: plan identifier {BENEFITENROLLMENT.PLAN_ID} contains unexpected characters. Correct it.'
  - id: BEN218
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `FOJOBCODE.EMPLOYEE_CLASS`.notna() & `EMPEMPLOYMENT.EMPLOYEE_CLASS`.notna() & (`FOJOBCODE.EMPLOYEE_CLASS`.str.upper() != `EMPEMPLOYMENT.EMPLOYEE_CLASS`.str.upper())'
    require_populated: true
    severity: low
    dimension: consistency
    message: 'Active enrolment''s job code default employee class disagrees with the employee''s own record'
    why_it_matters: 'FOJOBCODE.EMPLOYEE_CLASS is the default classification configured for the job code; EMPEMPLOYMENT.EMPLOYEE_CLASS is what was actually recorded for this employee. A mismatch between the two is worth a check since several eligibility rules in this pack key off EMPLOYEE_CLASS.'
    rule_authority: best_practice
    sap_impact: 'Classification-driven eligibility logic may give a different answer depending on which source it reads.'
    fix_map:
      __other__: 'Reconcile the employee''s class against the job code default via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: employee class disagrees with the job code default. Reconcile the two.'
  - id: BEN219
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `FOJOBCODE.REGULAR_TEMP`.notna() & `EMPEMPLOYMENT.REGULAR_TEMP`.notna() & (`FOJOBCODE.REGULAR_TEMP`.str.upper() != `EMPEMPLOYMENT.REGULAR_TEMP`.str.upper())'
    require_populated: true
    severity: low
    dimension: consistency
    message: 'Active enrolment''s job code default regular/temp flag disagrees with the employee''s own record'
    why_it_matters: 'FOJOBCODE.REGULAR_TEMP is the default classification configured for the job code; EMPEMPLOYMENT.REGULAR_TEMP is what was actually recorded for this employee. Several eligibility rules in this pack key off REGULAR_TEMP, so a mismatch between the two sources is worth checking.'
    rule_authority: best_practice
    sap_impact: 'Eligibility logic that depends on regular-vs-temporary status may give a different answer depending on which source it reads.'
    fix_map:
      __other__: 'Reconcile the regular/temp classification against the job code default via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: regular/temp classification disagrees with the job code default. Reconcile the two.'
  - id: BEN220
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `BENEFITENROLLMENT.PLAN_TYPE`.isin([''MEDICAL'',''DENTAL'',''VISION'']) & `FOLOCATION.STANDARD_HOURS`.notna() & `EMPEMPLOYMENT.STANDARD_HOURS`.notna() & ((`FOLOCATION.STANDARD_HOURS` - `EMPEMPLOYMENT.STANDARD_HOURS`).abs() > 10)'
    require_populated: true
    severity: low
    dimension: consistency
    message: 'Health plan enrolment''s standard hours differ sharply from the work location''s standard hours'
    why_it_matters: 'EMPEMPLOYMENT.STANDARD_HOURS should normally track close to the work location''s configured standard, since health-plan FTE eligibility is based on actual hours. A large gap is worth confirming before relying on either value for eligibility.'
    rule_authority: best_practice
    sap_impact: 'Health-plan FTE eligibility rules may be evaluated against a standard-hours value that does not reflect the employee''s actual work pattern.'
    fix_map:
      __other__: 'Reconcile the employee''s standard hours against the work location''s standard via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: standard hours differ sharply from the work location''s standard. Reconcile the two.'
  - id: BEN221
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `BENEFITENROLLMENT.PLAN_TYPE`.isin([''MEDICAL'',''DENTAL'',''VISION'']) & `EMPEMPLOYMENT.PROBATION_END_DATE`.notna() & (`BENEFITENROLLMENT.EFFECTIVE_DATE` < `EMPEMPLOYMENT.PROBATION_END_DATE`)'
    require_populated: true
    severity: low
    dimension: consistency
    message: 'Health plan is effective before the employee''s probation period ends'
    why_it_matters: 'Health plans commonly carry a waiting period tied to the end of probation. An effective date earlier than PROBATION_END_DATE is worth confirming against the plan''s actual waiting-period rules.'
    rule_authority: best_practice
    sap_impact: 'Coverage may start before the employee is actually eligible under the plan''s waiting-period rules, exposing the employer to an unbudgeted early claim.'
    fix_map:
      __other__: 'Confirm the plan''s waiting period and correct the effective date if needed via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: health plan effective before probation ends on {EMPEMPLOYMENT.PROBATION_END_DATE}. Confirm the waiting period.'
  - id: BEN222
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & (`BENEFITENROLLMENT.PLAN_TYPE` == ''RETIREMENT'') & `EMPEMPLOYMENT.PAY_GROUP`.isna()'
    severity: low
    dimension: completeness
    message: 'Active retirement plan enrolment belongs to an employee with no pay group recorded'
    why_it_matters: 'PAY_GROUP determines which payroll run processes an employee''s retirement contribution. Without it, the contribution has no payroll run to be collected through.'
    rule_authority: best_practice
    sap_impact: 'Retirement contribution deductions cannot be scheduled for this employee.'
    fix_map:
      __blank__: 'Assign the employee to the correct pay group via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: active retirement enrolment but no pay group recorded. Assign a pay group.'
  - id: BEN223
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `EMPEMPLOYMENT.END_DATE`.notna() & (`EMPEMPLOYMENT.END_DATE` < @today)'
    require_populated: true
    severity: high
    dimension: consistency
    message: 'Active enrolment belongs to an employment record that has already ended'
    why_it_matters: 'EMPEMPLOYMENT.END_DATE marks when this employment assignment closed. An active enrolment against an assignment that has already ended is a different signal from STATUS-based termination checks: it catches assignments closed by date even when the status field was never updated.'
    rule_authority: best_practice
    sap_impact: 'Benefit coverage and cost continue to be carried for an assignment the system already considers closed.'
    fix_map:
      __other__: 'Terminate the enrolment in line with the employment end date via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: active enrolment but employment ended on {EMPEMPLOYMENT.END_DATE}. Terminate the enrolment.'
  - id: BEN224
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `FOCOSTCENTER.LEGAL_ENTITY`.isna()'
    severity: low
    dimension: completeness
    message: 'Active enrolment''s cost centre has no legal entity recorded'
    why_it_matters: 'LEGAL_ENTITY on the cost centre foundation object is needed to attribute the benefit cost to the correct legal entity for statutory and financial reporting. Without it, this enrolment''s cost cannot be attributed correctly.'
    rule_authority: best_practice
    sap_impact: 'Legal-entity-level benefit cost reporting excludes this enrolment.'
    fix_map:
      __other__: 'Load the legal entity for this cost centre in Foundation Objects via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: cost centre has no legal entity recorded. Load the legal entity.'
  - id: BEN225
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `FODEPARTMENT.COST_CENTER`.notna() & `EMPEMPLOYMENT.COST_CENTER`.notna() & (`FODEPARTMENT.COST_CENTER` != `EMPEMPLOYMENT.COST_CENTER`)'
    require_populated: true
    severity: low
    dimension: consistency
    message: 'Active enrolment''s department default cost centre disagrees with the employee''s own cost centre'
    why_it_matters: 'FODEPARTMENT.COST_CENTER is the department''s default cost centre; EMPEMPLOYMENT.COST_CENTER is what was actually recorded for this employee. A mismatch is worth checking since benefit cost allocation uses the employee''s own cost centre.'
    rule_authority: best_practice
    sap_impact: 'Benefit cost allocation may post to a cost centre that does not match the department''s own default, complicating departmental cost analysis.'
    fix_map:
      __other__: 'Reconcile the employee''s cost centre against the department default via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: cost centre disagrees with the department default. Reconcile the two.'
  - id: BEN226
    field: DEPENDENT.RELATIONSHIP_TYPE
    check_class: uniqueness_check
    fields:
    - DEPENDENT.PERSON_ID
    - DEPENDENT.RELATIONSHIP_TYPE
    applies_when:
      DEPENDENT.RELATIONSHIP_TYPE:
      - spouse
      - domestic_partner
    severity: high
    dimension: uniqueness
    message: 'Employee has more than one active spouse or domestic partner dependent'
    why_it_matters: 'An employee should have at most one active spouse or domestic partner at a time. More than one such dependent usually means a prior relationship was never closed out when a new one was added.'
    rule_authority: best_practice
    sap_impact: 'Carrier feed receives two concurrent spouse-level dependents, which is typically rejected or results in duplicate coverage billing.'
    fix_map:
      __other__: 'Close out the superseded spouse or domestic partner dependent via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: more than one active spouse or domestic partner dependent. Close out the superseded one.'
  - id: BEN227
    field: BENEFITENROLLMENT.EMPLOYEE_COST
    check_class: cross_field_check
    fail_when: '(`USERACCOUNT.STATUS` != ''A'') & `BENEFITENROLLMENT.EMPLOYEE_COST`.notna() & (`BENEFITENROLLMENT.EMPLOYEE_COST` > 0)'
    require_populated: true
    severity: high
    dimension: consistency
    message: 'Employee is still being charged a benefit premium on an inactive user account'
    why_it_matters: 'An inactive user account means the employee is no longer an active employee in the system. A positive EMPLOYEE_COST still attached to that account means a premium deduction could still be in effect for someone who should no longer be charged.'
    rule_authority: best_practice
    sap_impact: 'Payroll may continue to deduct a premium from an employee who is no longer active, creating a refund liability once discovered.'
    fix_map:
      __other__: 'Terminate the enrolment and stop the premium deduction via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: inactive user account still charged a positive employee cost. Terminate the enrolment.'
  - id: BEN228
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `BENEFITENROLLMENT.PLAN_TYPE`.isin([''MEDICAL'',''DENTAL'',''VISION'']) & `EMPEMPLOYMENT.JOB_END_DATE`.notna() & (`EMPEMPLOYMENT.JOB_END_DATE` < @today)'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Active health plan enrolment belongs to a job assignment that has already ended'
    why_it_matters: 'JOB_END_DATE marks when this specific job assignment closed, independent of the broader employment record. An active health plan tied to a job that has already ended is worth confirming against the employee''s current assignment.'
    rule_authority: best_practice
    sap_impact: 'Health coverage continues to be carried against a job assignment the system already considers closed.'
    fix_map:
      __other__: 'Confirm the employee''s current job assignment and update the enrolment via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: active health plan but job assignment ended on {EMPEMPLOYMENT.JOB_END_DATE}. Confirm the current assignment.'
  - id: BEN229
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `EMPEMPLOYMENT.CONTRACT_END_DATE`.notna() & (`EMPEMPLOYMENT.CONTRACT_END_DATE` < @today)'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Active enrolment belongs to an employee whose fixed-term contract has already ended'
    why_it_matters: 'CONTRACT_END_DATE marks when a fixed-term contract was scheduled to end. An active benefit enrolment past that date suggests either the contract was extended and the end date was not updated, or the enrolment should have been terminated.'
    rule_authority: best_practice
    sap_impact: 'Benefit coverage and cost continue to be carried for a contract the system shows as having already ended.'
    fix_map:
      __other__: 'Confirm whether the contract was extended and update the records accordingly via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: active enrolment but contract ended on {EMPEMPLOYMENT.CONTRACT_END_DATE}. Confirm the contract status.'
  - id: BEN230
    field: BENEFITENROLLMENT.ENROL_DATE
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.ENROL_DATE`.notna() & `BENEFITENROLLMENT.EFFECTIVE_DATE`.notna() & ((`BENEFITENROLLMENT.ENROL_DATE` - `BENEFITENROLLMENT.EFFECTIVE_DATE`).dt.days > 90)'
    require_populated: true
    severity: low
    dimension: plausibility
    message: 'Enrolment was recorded more than 90 days after its own effective date'
    why_it_matters: 'ENROL_DATE is when the election was captured; EFFECTIVE_DATE is when coverage starts. An election recorded more than 90 days after coverage was already effective suggests a late, retroactive data entry rather than a timely election and is worth confirming with the benefits team.'
    rule_authority: best_practice
    sap_impact: 'Retroactive premium adjustments may be needed for the gap between the effective date and when the election was actually entered.'
    fix_map:
      __other__: 'Confirm the true election date and correct ENROL_DATE or EFFECTIVE_DATE via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment recorded on {BENEFITENROLLMENT.ENROL_DATE}, more than 90 days after the effective date {BENEFITENROLLMENT.EFFECTIVE_DATE}. Confirm the correct dates.'
  - id: BEN231
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & ((`BENEFITENROLLMENT.EFFECTIVE_DATE` - @today).dt.days > 30)'
    severity: low
    dimension: plausibility
    message: 'Enrolment is already marked active more than 30 days before its effective date'
    why_it_matters: 'A plan should not be reported as active (STATUS = A) until its EFFECTIVE_DATE has actually arrived. An enrolment flagged active more than 30 days ahead of that date suggests the status was set prematurely, before the coverage genuinely starts.'
    rule_authority: best_practice
    sap_impact: 'Benefit coverage and cost may be reported as in force for a period before it is actually effective.'
    fix_map:
      __other__: 'Confirm the effective date or hold the status as pending until it arrives via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: marked active but effective date {BENEFITENROLLMENT.EFFECTIVE_DATE} is more than 30 days away. Confirm the status.'
  - id: BEN232
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''T'') & `BENEFITENROLLMENT.EFFECTIVE_DATE`.notna() & (`BENEFITENROLLMENT.EFFECTIVE_DATE` > @today)'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Enrolment is terminated but its effective date is still in the future'
    why_it_matters: 'A plan cannot be terminated before it has even started. STATUS = T with an EFFECTIVE_DATE still ahead of today means either the termination was entered against the wrong record or the effective date was never corrected when the plan was cancelled.'
    rule_authority: best_practice
    sap_impact: 'Benefit cost and coverage history shows a plan ending before it began, which carrier feeds and cost reporting cannot reconcile.'
    fix_map:
      __other__: 'Confirm whether the enrolment was cancelled before it started and correct the dates via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: terminated enrolment has a future effective date {BENEFITENROLLMENT.EFFECTIVE_DATE}. Confirm and correct the dates.'
  - id: BEN233
    field: BENEFITENROLLMENT.USERID
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `USERACCOUNT.DEPARTMENT`.notna() & `EMPEMPLOYMENT.DEPARTMENT`.notna() & (`USERACCOUNT.DEPARTMENT` != `EMPEMPLOYMENT.DEPARTMENT`)'
    require_populated: true
    severity: low
    dimension: consistency
    message: 'Active enrolment''s employee department disagrees between the user account and the employment record'
    why_it_matters: 'USERACCOUNT.DEPARTMENT comes from the SF User entity; EMPEMPLOYMENT.DEPARTMENT comes from the job/employment record. These two should stay in sync for the same employee. A mismatch usually means one side was updated (e.g. a transfer) and the other was not.'
    rule_authority: best_practice
    sap_impact: 'Department-based benefit eligibility and cost allocation may use whichever side a given report happens to read, giving inconsistent results across reports for the same employee.'
    fix_map:
      __other__: 'Reconcile the department on the user account against the employment record via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: user account department disagrees with the employment record department. Reconcile the two.'
