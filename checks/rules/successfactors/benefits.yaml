  - id: BEN152
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: '`EMPEMPLOYMENT.JOB_START_DATE`.notna() & (`BENEFITENROLLMENT.EFFECTIVE_DATE` < `EMPEMPLOYMENT.JOB_START_DATE`) & (`BENEFITENROLLMENT.STATUS` == ''A'')'
    require_populated: true
    severity: low
    dimension: accuracy
    message: 'Active enrolment is effective before the employee''s current job start date'
    why_it_matters: 'JOB_START_DATE reflects the start of the employee''s current job assignment (including rehires). An active enrolment effective before that date may be a stale election carried over from a prior spell of employment rather than a genuine current election.'
    rule_authority: best_practice
    sap_impact: 'Benefit history used for the current assignment is mixed with history from a prior assignment, distorting tenure-based eligibility calculations.'
    fix_map:
      __other__: 'Confirm whether the enrolment should be re-dated to the current job start via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment effective before the current job start date {EMPEMPLOYMENT.JOB_START_DATE}. Confirm the correct effective date.'
  - id: BEN153
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `EMPEMPLOYMENT.LAST_DATE_WORKED`.notna() & (`EMPEMPLOYMENT.LAST_DATE_WORKED` < @today)'
    require_populated: true
    severity: high
    dimension: consistency
    message: 'Active enrolment persists after the employee''s last date worked'
    why_it_matters: 'LAST_DATE_WORKED is set once an employee has physically stopped working. An active enrolment past that date usually means the offboarding process has not yet reached benefits.'
    rule_authority: best_practice
    sap_impact: 'Coverage and payroll deductions continue for someone who has already stopped working.'
    fix_map:
      __other__: 'Review the enrolment against the last date worked and terminate if appropriate via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment active after last date worked {EMPEMPLOYMENT.LAST_DATE_WORKED}. Review and terminate if applicable.'
  - id: BEN154
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `EMPEMPLOYMENT.PAYROLL_END_DATE`.notna() & (`EMPEMPLOYMENT.PAYROLL_END_DATE` < @today)'
    require_populated: true
    severity: high
    dimension: consistency
    message: 'Active enrolment persists after the employee''s payroll end date'
    why_it_matters: 'PAYROLL_END_DATE marks when payroll processing stopped for this employee. An active enrolment past that date cannot actually be deducted through payroll any more, even though it still shows as active.'
    rule_authority: best_practice
    sap_impact: 'Benefit provider continues to expect a premium that payroll has already stopped collecting, creating an employer-funded shortfall.'
    fix_map:
      __other__: 'Terminate the enrolment in line with the payroll end date via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment active after payroll end date {EMPEMPLOYMENT.PAYROLL_END_DATE}. Terminate the enrolment.'
  - id: BEN155
    field: BENEFITENROLLMENT.PLAN_TYPE
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `BENEFITENROLLMENT.PLAN_TYPE`.isin([''MEDICAL'',''DENTAL'',''VISION'']) & (`EMPEMPLOYMENT.IS_FULLTIME`.str.lower().isin([''false'',''0''])) & (`EMPEMPLOYMENT.FTE` < 0.5)'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Health plan enrolment belongs to a part-time employee working under half-time'
    why_it_matters: 'Most employer-sponsored health plans require a minimum FTE threshold, commonly half-time, to be eligible. An active enrolment for an employee working well under that threshold suggests either an eligibility rule was bypassed or the FTE value is wrong.'
    rule_authority: best_practice
    sap_impact: 'Enrolling an ineligible part-time employee in a health plan can expose the employer to carrier contract violations and unbudgeted premium cost.'
    fix_map:
      __other__: 'Confirm plan eligibility against the employee''s FTE and correct whichever is wrong via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: health plan enrolment on an employee below half-time FTE. Confirm eligibility.'
  - id: BEN156
    field: BENEFITENROLLMENT.PLAN_TYPE
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & (`EMPEMPLOYMENT.EMPLOYMENT_TYPE`.str.upper() == ''INTERN'') & `BENEFITENROLLMENT.PLAN_TYPE`.isin([''RETIREMENT'',''PENSION''])'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Intern is enrolled in a retirement or pension plan'
    why_it_matters: 'Interns are normally excluded from employer retirement and pension plans by plan design, similar to contingent workers. An enrolment here suggests either a misclassification or a bypassed eligibility rule.'
    rule_authority: best_practice
    sap_impact: 'Plan administrator may reject the contribution, or the employer may incur unbudgeted employer contributions for an ineligible worker class.'
    fix_map:
      __other__: 'Confirm the worker classification and plan eligibility via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: intern enrolled in {BENEFITENROLLMENT.PLAN_TYPE}. Confirm eligibility.'
  - id: BEN157
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `USERACCOUNT.EMAIL`.isna()'
    severity: low
    dimension: completeness
    message: 'Active enrolment belongs to a user account with no email address on file'
    why_it_matters: 'Plan confirmations, open-enrolment reminders and claim notices are delivered by email. An active enrolment with no email on the linked account means the employee cannot receive any of these communications.'
    rule_authority: best_practice
    sap_impact: 'Self-service benefits communications and required legal notices cannot reach the employee.'
    fix_map:
      __blank__: 'Record the employee''s email address on the user account via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: active enrolment but the linked account has no email address. Record the email address.'
  - id: BEN158
    field: BENEFITENROLLMENT.USERID
    check_class: exists_check
    target_table: PAYMENTINFO
    target_fields: [USERID]
    applies_when:
      BENEFITENROLLMENT.STATUS:
      - A
    severity: low
    dimension: completeness
    message: 'Active enrolment with a positive employee cost has no payment information record'
    why_it_matters: 'PAYMENTINFO holds the banking details payroll uses to action deductions. An active enrolment with a contribution due but no matching payment record means the deduction has nowhere to be collected from.'
    rule_authority: best_practice
    sap_impact: 'Payroll cannot action the employee deduction for this benefit, leaving the employer to cover the shortfall or the deduction to fail silently.'
    fix_map:
      __other__: 'Confirm payment information is on file for this employee via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: active enrolment but no PAYMENTINFO record found. Confirm payment details are on file.'
  - id: BEN159
    field: BENEFITENROLLMENT.USERID
    check_class: exists_check
    target_table: EMPJOBHIST
    target_fields: [USERID]
