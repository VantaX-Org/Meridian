  - id: BEN175
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''E'') & `BENEFITENROLLMENT.EMPLOYEE_COST`.notna() & (`BENEFITENROLLMENT.EMPLOYEE_COST` > 0)'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Enrolment flagged in error status still carries a positive employee cost'
    why_it_matters: 'An enrolment marked as an error (STATUS ''E'') should not be contributing to payroll deductions. A positive employee cost on an errored record means the error was not fully unwound.'
    rule_authority: best_practice
    sap_impact: 'Payroll may continue to deduct for an enrolment the system itself has flagged as erroneous.'
    fix_map:
      __other__: 'Zero out the employee cost on the errored enrolment via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: errored enrolment still has a positive employee cost. Zero it out.'
  - id: BEN176
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''E'') & `BENEFITENROLLMENT.EMPLOYER_COST`.notna() & (`BENEFITENROLLMENT.EMPLOYER_COST` > 0)'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Enrolment flagged in error status still carries a positive employer cost'
    why_it_matters: 'An enrolment marked as an error (STATUS ''E'') should not be contributing to employer-side cost reporting. A positive employer cost on an errored record means the error was not fully unwound.'
    rule_authority: best_practice
    sap_impact: 'Employer benefit cost reporting includes a contribution for an enrolment the system itself has flagged as erroneous.'
    fix_map:
