module: benefits
target_state: SUCCESSFACTORS
rules:

  - id: BEN001
    field: BENEFITENROLLMENT.USERID
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "User ID is mandatory — orphaned enrolment cannot generate payroll deductions"
    why_it_matters: >-
      USERID links the benefit enrolment to a specific employee. Without it, the
      enrolment record is orphaned and payroll cannot generate the corresponding premium
      deduction. The employee may lose coverage without notice.
    rule_authority: best_practice
    sap_impact: >-
      Payroll deduction not generated. Benefit provider receives no premium. Employee
      coverage may lapse due to non-payment.
    fix_map:
      __blank__: >-
        Assign the correct employee USERID via Admin Center > Benefits > Enrolment
        Import. Cross-reference with the employee master to identify the correct person.
    record_fix_template: >-
      Enrolment {BENEFITENROLLMENT.USERID}: USERID is missing. Assign the correct
      employee ID via Admin Center > Benefits > Enrolment Import.

  - id: BEN002
    field: BENEFITENROLLMENT.PLAN_ID
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Plan ID is mandatory — identifies the specific benefit plan for deduction and coverage"
    why_it_matters: >-
      PLAN_ID maps the enrolment to a specific benefit plan which defines the premium
      amount, coverage rules, and provider. Without it, the system cannot determine what
      the employee is enrolled in or how much to deduct.
    rule_authority: best_practice
    sap_impact: >-
      Deduction amount unknown. Benefit coverage details cannot be determined. Employee
      benefit statement shows incomplete enrolment.
    fix_map:
      __blank__: >-
        Assign the correct plan ID from the benefits catalogue via Admin Center >
        Benefits > Enrolment Import. Verify against the employee's original election
        form.
    record_fix_template: >-
      Enrolment {BENEFITENROLLMENT.USERID}: PLAN_ID is missing. Assign correct plan via
      Admin Center > Benefits > Enrolment Import.


  - id: BEN004
    field: BENEFITENROLLMENT.ENROL_DATE
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Enrolment date determines when deductions start and coverage begins"
    why_it_matters: >-
      ENROL_DATE establishes the effective start of benefit coverage and triggers the
      first payroll deduction. Without it, the system cannot determine when to begin
      premium deductions or when coverage became active.
    rule_authority: best_practice
    sap_impact: >-
      Payroll deduction start date undefined. Benefit coverage effective date unknown.
      Retroactive deduction calculation impossible.
    fix_map:
      __blank__: >-
        Set the enrolment effective date via Admin Center > Benefits > Enrolment Import.
        Use the employee's original election date or hire date if enrolment was
        automatic. Format: YYYY-MM-DD.
    record_fix_template: >-
      Enrolment {BENEFITENROLLMENT.USERID}: ENROL_DATE is missing. Set enrolment date
      via Admin Center > Benefits > Enrolment Import. Format: YYYY-MM-DD.



  - id: BEN007
    field: BENEFITENROLLMENT.EMPLOYEE_COST
    check_class: null_check
    severity: medium
    dimension: completeness
    message: Employee cost is required for payroll deduction calculation
    why_it_matters: EMPLOYEE_COST is the amount deducted from the employee's pay each period for their benefit premium. A missing
      value causes payroll to deduct zero, meaning the employee receives free coverage while the employer absorbs the full cost.
    rule_authority: best_practice
    sap_impact: Payroll deducts zero for this benefit. Employer absorbs full premium cost. Benefit cost reporting understates
      employee contributions.
    fix_map:
      __blank__: Set the employee cost based on the plan's premium structure and the employee's coverage level. Update via Admin
        Center > Benefits > Enrolment Import. If cost is genuinely zero (employer-paid), enter 0 explicitly.
    record_fix_template: 'Enrolment {BENEFITENROLLMENT.USERID}: EMPLOYEE_COST is missing for plan {BENEFITENROLLMENT.PLAN_ID}.
      Set via Admin Center > Benefits > Enrolment Import.'

  - id: BEN008
    field: BENEFITENROLLMENT.EMPLOYER_COST
    check_class: null_check
    severity: low
    dimension: completeness
    message: Employer cost is required for total compensation reporting and budget forecasting
    why_it_matters: EMPLOYER_COST represents the company's contribution to the employee's benefit premium. It is a key component
      of total compensation calculations and budget forecasting. Missing values understate the total compensation package and
      produce inaccurate budget projections.
    rule_authority: best_practice
    sap_impact: Total compensation statements understate employer contribution. Budget forecasting for benefit costs is inaccurate.
      Cost-per-employee calculations are incomplete.
    fix_map:
      __blank__: Set the employer cost based on the plan's cost-sharing structure. Update via Admin Center > Benefits > Enrolment
        Import. If there is no employer contribution, enter 0 explicitly.
    record_fix_template: 'Enrolment {BENEFITENROLLMENT.USERID}: EMPLOYER_COST is missing for plan {BENEFITENROLLMENT.PLAN_ID}.
      Set via Admin Center > Benefits > Enrolment Import.'

  - id: BEN009
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Effective date is required for benefit change audit trail"
    why_it_matters: >-
      EFFECTIVE_DATE records when a benefit change (enrolment, coverage change,
      termination) takes effect. Without it, the benefit history timeline is broken and
      the system cannot determine which enrolment record is current.
    rule_authority: best_practice
    sap_impact: >-
      Benefit history timeline broken. Current enrolment cannot be determined. Audit
      trail for benefit changes is incomplete.
    fix_map:
      __blank__: >-
        Set the effective date to when the benefit change was approved or the enrolment
        began. Update via Admin Center > Benefits > Enrolment Import. Format: YYYY-MM-DD.
    record_fix_template: >-
      Enrolment {BENEFITENROLLMENT.USERID}: EFFECTIVE_DATE is missing. Set via Admin
      Center > Benefits > Enrolment Import. Format: YYYY-MM-DD.


  - id: BEN011
    field: BENEFITENROLLMENT.USERID
    check_class: uniqueness_check
    fields:
    - BENEFITENROLLMENT.USERID
    - BENEFITENROLLMENT.PLAN_ID
    - BENEFITENROLLMENT.EFFECTIVE_DATE
    severity: high
    dimension: uniqueness
    message: Duplicate benefit enrollment records per employee — review for over-enrollment
    why_it_matters: Duplicate enrollment records can cause double premium deductions, incorrect coverage levels, and carrier
      file errors.
    rule_authority: best_practice
    sap_impact: Payroll deducts premiums twice. Carrier feeds contain duplicate enrollments. Benefits cost reports are overstated.
    fix_map:
      __blank__: Review duplicate enrollments in Admin Center > Benefits. End-date or delete the incorrect enrollment. Verify
        carrier feed after correction.
    record_fix_template: "Employee {BENEFITENROLLMENT.USERID}, plan {BENEFITENROLLMENT.PLAN_ID}: duplicate enrollment for the same effective date. Remove the extra record in Admin Center."

  - id: BEN012
    field: BENEFITENROLLMENT.EMPLOYEE_COST
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.EMPLOYEE_COST` < 0'
    require_populated: true
    severity: medium
    dimension: validity
    message: Employee contribution must not be negative
    why_it_matters: The employee contribution is deducted through payroll. A negative contribution turns the deduction into
      a payment to the employee and understates the employee's share in carrier and cost reporting.
    rule_authority: best_practice
    sap_impact: Payroll pays the contribution to the employee instead of deducting it; benefit cost reporting wrong.
    fix_map:
      __blank__: Correct the employee contribution on the enrolment via Benefits Administration; refunds are handled as separate
        claims, not negative contributions.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: Employee contribution must not be negative. Correct the record.'
  - id: BEN013
    field: BENEFITENROLLMENT.EMPLOYER_COST
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.EMPLOYER_COST` < 0'
    require_populated: true
    severity: medium
    dimension: validity
    message: Employer contribution must not be negative
    why_it_matters: A negative employer contribution reduces the recorded employer cost of the plan and, where the employer
      share is a taxable fringe benefit, the employee's taxable value.
    rule_authority: best_practice
    sap_impact: Employer benefit cost understated; taxable fringe-benefit value and carrier premium files wrong.
    fix_map:
      __blank__: Correct the employer contribution on the enrolment via Benefits Administration.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: Employer contribution must not be negative. Correct the record.'
  - id: BEN014
    field: BENEFITENROLLMENT.PLAN_TYPE
    check_class: null_check
    severity: high
    dimension: consistency
    message: Enrolment references a benefit whose type cannot be resolved (benefit missing or deleted)
    why_it_matters: Benefit type is mandatory on every Benefit object. An enrolment whose plan returns no benefit type points
      to a benefit that was deleted or never existed, so eligibility, contribution rules and the carrier feed cannot be determined
      for it.
    rule_authority: sap_hard_constraint
    sap_impact: Enrolment excluded from carrier files and benefit statements; payroll deduction has no plan rules behind it.
    fix_map:
      __blank__: Re-enrol the employee in an existing benefit via Benefits Administration, or restore the benefit definition
        in Manage Data > Benefit.
    record_fix_template: 'Enrolment {BENEFITENROLLMENT.USERID}: plan ''{BENEFITENROLLMENT.PLAN_ID}'' does not resolve to a
      benefit.'
    applies_when:
      BENEFITENROLLMENT.PLAN_ID:
        populated: true
  - id: BEN015
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.EFFECTIVE_DATE` < `EMPEMPLOYMENT.START_DATE`'
    require_populated: true
    severity: medium
    dimension: consistency
    message: Benefit enrolment takes effect before the employment started
    why_it_matters: Benefit coverage starts at or after the hire date. Coverage before hire is usually a typing error or a
      record copied from an earlier employment.
    rule_authority: best_practice
    sap_impact: The carrier is billed for coverage before hire; payroll may take deductions for periods the employee was
      not employed.
    fix_map:
      __other__: Correct the enrolment effective date to the hire date or the plan's eligibility date.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: plan {BENEFITENROLLMENT.PLAN_ID} from
      {BENEFITENROLLMENT.EFFECTIVE_DATE}, hired {EMPEMPLOYMENT.START_DATE}.'
  - id: BEN016
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.EFFECTIVE_DATE` > `EMPEMPLOYMENT.END_DATE`'
    require_populated: true
    severity: high
    dimension: consistency
    message: Benefit enrolment takes effect after the employment ended
    why_it_matters: A leaver should not start new benefit coverage (continuation cover such as COBRA is handled outside
      the active enrolment). An enrolment after the end date means the leaver was enrolled by mistake or the termination
      date is wrong.
    rule_authority: best_practice
    sap_impact: The company pays premiums for a leaver; carrier files report coverage that should not exist.
    fix_map:
      __other__: Cancel the enrolment and notify the carrier, or correct the termination date if the employee did not leave.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: plan {BENEFITENROLLMENT.PLAN_ID} from
      {BENEFITENROLLMENT.EFFECTIVE_DATE}, employment ended {EMPEMPLOYMENT.END_DATE}.'
  - id: BEN017
    field: BENEFITENROLLMENT.USERID
    check_class: exists_check
    target_table: EMPEMPLOYMENT
    target_fields:
    - USERID
    severity: medium
    dimension: consistency
    message: Benefit enrolment belongs to a user without employment
    why_it_matters: An enrolment must belong to an employee. Orphans cannot be loaded to the SAP benefits infotypes.
    rule_authority: best_practice
    sap_impact: Premiums are deducted or reported for nobody.
    fix_map:
      __other__: Link the enrolment to an employee or end it.
    record_fix_template: Benefit enrolment for user {BENEFITENROLLMENT.USERID} has no employment record. Review.
  - id: BEN018
    field: BENEFITENROLLMENT.ENROL_DATE
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.ENROL_DATE` > `BENEFITENROLLMENT.EFFECTIVE_DATE`'
    require_populated: true
    severity: low
    dimension: timeliness
    message: Enrolment was recorded after its effective date
    why_it_matters: An enrolment recorded after it became effective is retroactive. It needs retroactive payroll accounting and often a manual premium correction.
    rule_authority: best_practice
    sap_impact: Retroactive deductions or premiums are produced.
    fix_map:
      __other__: Review the enrolment and confirm that the retroactive effect is intended.
    record_fix_template: Benefit enrolment for user {BENEFITENROLLMENT.USERID} was recorded after its effective date. Review.
  - id: BEN019
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: (`BENEFITENROLLMENT.EFFECTIVE_DATE` - @today).dt.days > 365
    severity: medium
    dimension: timeliness
    message: Enrolment starts more than a year in the future
    why_it_matters: An enrolment effective more than a year ahead is nearly always a typed year.
    rule_authority: best_practice
    sap_impact: Coverage does not start when the employee expects.
    fix_map:
      __other__: Correct the effective date.
    record_fix_template: Benefit enrolment for user {BENEFITENROLLMENT.USERID} starts more than a year in the future. Correct the date.

  - id: BEN020
    field: BENEFITENROLLMENT.COVERAGE_LEVEL
    check_class: null_check
    severity: high
    dimension: completeness
    message: Coverage level is mandatory — determines dependent eligibility and premium tier
    why_it_matters: COVERAGE_LEVEL (employee only, employee+spouse, employee+child, family) drives which premium tier is
      charged and which dependents the carrier will cover. Without it the carrier feed cannot price or scope the enrolment.
    rule_authority: best_practice
    sap_impact: Carrier feed rejects or mis-prices the enrolment. Dependents may be left uncovered without the employee
      knowing.
    fix_map:
      __blank__: Set the coverage level via Admin Center > Benefits > Enrolment Import, matching the employee's election
        form.
    record_fix_template: 'Enrolment {BENEFITENROLLMENT.USERID}: COVERAGE_LEVEL is missing for plan {BENEFITENROLLMENT.PLAN_ID}.
      Set via Admin Center > Benefits > Enrolment Import.'

  - id: BEN021
    field: BENEFITENROLLMENT.COVERAGE_LEVEL
    check_class: domain_value_check
    allowed_values:
    - EMP_ONLY
    - EMP_SPOUSE
    - EMP_CHILD
    - EMP_SPOUSE_CHILD
    - FAMILY
    severity: medium
    dimension: accuracy
    message: 'Coverage level must be a valid tier code: EMP_ONLY, EMP_SPOUSE, EMP_CHILD, EMP_SPOUSE_CHILD or FAMILY'
    why_it_matters: An invalid coverage level cannot be mapped to a premium tier, so the carrier feed and payroll deduction
      cannot be priced for this enrolment.
    rule_authority: best_practice
    sap_impact: Carrier feed and payroll deduction cannot be priced. Benefit statement shows an unrecognised tier.
    valid_values_with_labels:
      EMP_ONLY: Employee only
      EMP_SPOUSE: Employee + spouse
      EMP_CHILD: Employee + child(ren)
      EMP_SPOUSE_CHILD: Employee + spouse + child(ren)
      FAMILY: Family
    fix_map:
      __blank__: Set the coverage level to one of EMP_ONLY, EMP_SPOUSE, EMP_CHILD, EMP_SPOUSE_CHILD, FAMILY via Admin
        Center > Benefits > Enrolment Import.
      __other__: Coverage level '{invalid_value}' is not valid. Use EMP_ONLY, EMP_SPOUSE, EMP_CHILD, EMP_SPOUSE_CHILD
        or FAMILY via Admin Center > Benefits > Enrolment Import.
    record_fix_template: 'Enrolment {BENEFITENROLLMENT.USERID}: COVERAGE_LEVEL ''{actual_value}'' is invalid. Set to
      EMP_ONLY, EMP_SPOUSE, EMP_CHILD, EMP_SPOUSE_CHILD or FAMILY via Admin Center > Benefits > Enrolment Import.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      - op: regex_replace
        pattern: '[\s-]+'
        repl: _
      confidence: high

  - id: BEN022
    field: BENEFITENROLLMENT.STATUS
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Enrolment status is mandatory — determines whether coverage and deductions are active
    why_it_matters: STATUS tells payroll and the carrier feed whether this enrolment is active, pending approval, terminated
      or waived. Without it, the system cannot decide whether to deduct a premium or report the enrolment to the carrier.
    rule_authority: best_practice
    sap_impact: Payroll cannot decide whether to deduct. Carrier feed may include or exclude the enrolment incorrectly.
    fix_map:
      __blank__: Set the enrolment status via Admin Center > Benefits > Enrolment Import, matching the employee's current
        election state.
    record_fix_template: 'Enrolment {BENEFITENROLLMENT.USERID}: STATUS is missing for plan {BENEFITENROLLMENT.PLAN_ID}.
      Set via Admin Center > Benefits > Enrolment Import.'

  - id: BEN023
    field: BENEFITENROLLMENT.STATUS
    check_class: domain_value_check
    allowed_values:
    - A
    - P
    - T
    - W
    - E
    severity: high
    dimension: accuracy
    message: 'Enrolment status must be a valid code: A (active), P (pending), T (terminated), W (waived), E (error)'
    why_it_matters: An unrecognised status code cannot be interpreted by payroll or the carrier feed, so the enrolment
      is silently dropped from processing rather than deducted, reported or waived as intended.
    rule_authority: best_practice
    sap_impact: Enrolment dropped from payroll and carrier processing. Benefit statement shows an unrecognised state.
    valid_values_with_labels:
      A: Active
      P: Pending approval
      T: Terminated
      W: Waived
      E: Error (flagged by source system)
    fix_map:
      __blank__: Set the status to A, P, T, W or E via Admin Center > Benefits > Enrolment Import.
      __other__: Status '{invalid_value}' is not valid. Use A, P, T, W or E via Admin Center > Benefits > Enrolment Import.
    record_fix_template: 'Enrolment {BENEFITENROLLMENT.USERID}: STATUS ''{actual_value}'' is invalid. Set to A, P, T, W
      or E via Admin Center > Benefits > Enrolment Import.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      - op: map
        values:
          ACTIVE: A
          A: A
          PENDING: P
          P: P
          TERMINATED: T
          T: T
          WAIVED: W
          W: W
          ERROR: E
          E: E
          __other__: null
      confidence: medium

  - id: BEN024
    field: BENEFITENROLLMENT.PLAN_TYPE
    check_class: dependency_check
    determinant: BENEFITENROLLMENT.PLAN_ID
    severity: medium
    dimension: consistency
    message: Plan ID resolves to a different benefit type than its other enrolment records
    why_it_matters: A given PLAN_ID should always resolve to the same benefit type (medical, life, retirement, etc). A
      plan ID that carries a different type than its own majority usually means the plan was recoded, merged with another
      plan, or the enrolment was tagged to the wrong plan.
    rule_authority: best_practice
    sap_impact: Carrier routing and tax treatment for this enrolment are based on the wrong benefit type.
    fix_map:
      __other__: Confirm the correct benefit type for this plan and correct the outlier enrolment, via Manage Data >
        Benefit or Admin Center > Benefits.
    record_fix_template: 'Enrolment {BENEFITENROLLMENT.USERID}: plan {BENEFITENROLLMENT.PLAN_ID} has benefit type {BENEFITENROLLMENT.PLAN_TYPE},
      inconsistent with this plan''s other enrolments. Correct the outlier.'

  - id: BEN025
    field: BENEFITENROLLMENT.EMPLOYEE_COST
    check_class: cross_field_check
    fail_when: (`BENEFITENROLLMENT.STATUS` == 'T') & (`BENEFITENROLLMENT.EMPLOYEE_COST` > 0)
    require_populated: true
    severity: medium
    dimension: consistency
    message: Terminated enrolment still carries an employee deduction
    why_it_matters: A terminated enrolment should no longer deduct a premium. A positive employee cost on a terminated
      record means the termination was not propagated to payroll before the next deduction cycle.
    rule_authority: best_practice
    sap_impact: Payroll keeps deducting premiums for coverage that no longer exists; the employee is overcharged.
    fix_map:
      __other__: Zero out the employee cost on the terminated enrolment or confirm the termination date, via Admin Center
        > Benefits.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: terminated enrolment still has a positive employee cost.
      Correct the record.'

  - id: BEN026
    field: BENEFITENROLLMENT.EMPLOYER_COST
    check_class: cross_field_check
    fail_when: (`BENEFITENROLLMENT.STATUS` == 'T') & (`BENEFITENROLLMENT.EMPLOYER_COST` > 0)
    require_populated: true
    severity: low
    dimension: consistency
    message: Terminated enrolment still carries an employer contribution
    why_it_matters: A terminated enrolment should no longer carry an employer contribution. A positive value means the
      termination has not been reflected in the cost record.
    rule_authority: best_practice
    sap_impact: Benefit cost reporting continues to accrue an employer contribution for coverage that no longer exists.
    fix_map:
      __other__: Zero out the employer cost on the terminated enrolment via Admin Center > Benefits.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: terminated enrolment still has a positive employer cost.
      Correct the record.'

  - id: BEN027
    field: BENEFITENROLLMENT.EMPLOYEE_COST
    check_class: cross_field_check
    fail_when: (`BENEFITENROLLMENT.STATUS` == 'W') & (`BENEFITENROLLMENT.EMPLOYEE_COST` > 0)
    require_populated: true
    severity: medium
    dimension: consistency
    message: Waived enrolment carries an employee deduction
    why_it_matters: A waived benefit means the employee declined coverage. A positive employee cost on a waived record
      means payroll will deduct a premium for coverage the employee opted out of.
    rule_authority: best_practice
    sap_impact: Payroll deducts a premium the employee never agreed to; likely to trigger a payroll dispute.
    fix_map:
      __other__: Zero out the employee cost on the waived enrolment via Admin Center > Benefits.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: waived enrolment still has a positive employee cost. Correct
      the record.'

  - id: BEN028
    field: BENEFITENROLLMENT.EMPLOYER_COST
    check_class: cross_field_check
    fail_when: (`BENEFITENROLLMENT.STATUS` == 'W') & (`BENEFITENROLLMENT.EMPLOYER_COST` > 0)
    require_populated: true
    severity: low
    dimension: consistency
    message: Waived enrolment carries an employer contribution
    why_it_matters: A waived benefit has no coverage to fund. A positive employer cost on a waived record overstates
      the employer's benefit spend for coverage that was declined.
    rule_authority: best_practice
    sap_impact: Benefit cost reporting and budget forecasting overstate employer spend.
    fix_map:
      __other__: Zero out the employer cost on the waived enrolment via Admin Center > Benefits.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: waived enrolment still has a positive employer cost. Correct
      the record.'

  - id: BEN029
    field: BENEFITENROLLMENT.DEPENDENT_LINK
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.COVERAGE_LEVEL`.isin([''EMP_SPOUSE'',''EMP_CHILD'',''EMP_SPOUSE_CHILD'',''FAMILY''])
      & `BENEFITENROLLMENT.DEPENDENT_LINK`.isna()'
    severity: medium
    dimension: consistency
    message: Coverage level implies dependents but none are linked
    why_it_matters: A coverage level of employee+spouse, employee+child or family implies at least one dependent is covered.
      Without a linked dependent, the carrier feed has nobody to add to the policy.
    rule_authority: best_practice
    sap_impact: Carrier feed enrols the tier but has no dependent to cover; dependent claims are rejected at the carrier.
    fix_map:
      __blank__: Link the covered dependent(s) via Admin Center > Benefits > Enrolment Import, or correct the coverage
        level to EMP_ONLY if there are no dependents.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: coverage level {BENEFITENROLLMENT.COVERAGE_LEVEL} implies
      dependents but DEPENDENT_LINK is blank. Link the dependent or correct the coverage level.'

  - id: BEN030
    field: BENEFITENROLLMENT.DEPENDENT_LINK
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.COVERAGE_LEVEL` == ''EMP_ONLY'') & `BENEFITENROLLMENT.DEPENDENT_LINK`.notna()'
    severity: low
    dimension: consistency
    message: Employee-only coverage has a dependent linked
    why_it_matters: Employee-only coverage should have no dependent on the policy. A linked dependent on an employee-only
      enrolment means either the dependent link is stale or the coverage level was not updated when a dependent was added.
    rule_authority: best_practice
    sap_impact: Carrier feed may enrol a dependent the coverage tier was never priced for, creating a billing dispute.
    fix_map:
      __other__: Remove the stale dependent link, or correct the coverage level to match the dependents actually covered,
        via Admin Center > Benefits.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: coverage level EMP_ONLY has a dependent linked. Remove
      the link or correct the coverage level.'

  - id: BEN031
    field: BENEFITENROLLMENT.USERID
    check_class: uniqueness_check
    fields:
    - BENEFITENROLLMENT.USERID
    - BENEFITENROLLMENT.PLAN_TYPE
    applies_when:
      BENEFITENROLLMENT.STATUS:
      - A
    severity: high
    dimension: uniqueness
    message: Employee has more than one active enrolment of the same benefit type
    why_it_matters: An employee should have at most one active enrolment per benefit type (e.g. one active medical plan).
      Two simultaneous active enrolments of the same type usually means an old plan was never terminated when the employee
      switched plans.
    rule_authority: best_practice
    sap_impact: Payroll deducts two premiums for overlapping coverage of the same type; the carrier feed reports conflicting
      enrolments.
    fix_map:
      __other__: End-date or terminate the superseded enrolment in Admin Center > Benefits so only one active enrolment
        remains per benefit type.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: more than one active enrolment for benefit type {BENEFITENROLLMENT.PLAN_TYPE}.
      Terminate the superseded enrolment.'

  - id: BEN032
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: (`BENEFITENROLLMENT.STATUS` == 'A') & (`EMPEMPLOYMENT.END_DATE` < @today)
    severity: high
    dimension: consistency
    message: Enrolment is still active after the employee's employment ended
    why_it_matters: An employee who has left should have their benefit enrolments terminated, not left active. An active
      enrolment past the employment end date means offboarding did not reach the benefits module.
    rule_authority: best_practice
    sap_impact: The carrier continues to bill for a leaver; payroll may keep deducting premiums from final pay runs.
    fix_map:
      __other__: Terminate the enrolment effective the employment end date via Admin Center > Benefits.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment still active after employment ended on {EMPEMPLOYMENT.END_DATE}.
      Terminate the enrolment.'

  - id: BEN033
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: (`BENEFITENROLLMENT.STATUS` == 'A') & (`BENEFITENROLLMENT.EFFECTIVE_DATE` > @today)
    severity: medium
    dimension: consistency
    message: Enrolment is marked active before its effective date has arrived
    why_it_matters: An enrolment cannot be active before its coverage has started. A status of active with a future effective
      date usually means the status was set too early or the effective date is wrong.
    rule_authority: best_practice
    sap_impact: Carrier feed and payroll may treat coverage as live before the premium or eligibility window actually
      begins.
    fix_map:
      __other__: Set the status to pending until the effective date arrives, or correct the effective date, via Admin
        Center > Benefits.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: status is active but effective date {BENEFITENROLLMENT.EFFECTIVE_DATE}
      is in the future. Correct the status or the date.'

  - id: BEN034
    field: BENEFITENROLLMENT.ENROL_DATE
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.ENROL_DATE` > @today'
    severity: low
    dimension: timeliness
    message: Enrolment was recorded with a future date
    why_it_matters: ENROL_DATE records when the election was made and should never be later than today. A future enrolment
      date is almost always a typed year or a system clock issue on import.
    rule_authority: best_practice
    sap_impact: Audit trail of when the election was made is unreliable.
    fix_map:
      __other__: Correct the enrolment date to the actual election date.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment date {BENEFITENROLLMENT.ENROL_DATE} is in the
      future. Correct the date.'

  - id: BEN035
    field: BENEFITENROLLMENT.EMPLOYEE_COST
    check_class: cross_field_check
    fail_when: (`BENEFITENROLLMENT.STATUS` == 'A') & (`BENEFITENROLLMENT.EMPLOYEE_COST` == 0) & (`BENEFITENROLLMENT.EMPLOYER_COST`
      == 0)
    require_populated: true
    severity: low
    dimension: validity
    message: Active enrolment carries no premium on either side
    why_it_matters: An active enrolment with both employee and employer cost at zero usually means the contribution amounts
      were never loaded, rather than a genuinely free benefit. It should be confirmed rather than assumed correct.
    rule_authority: best_practice
    sap_impact: Benefit cost reporting and total compensation statements show zero cost for coverage that may actually
      carry a premium.
    fix_map:
      __other__: Confirm whether the plan is genuinely fully subsidised; if not, load the correct employee and employer
        cost via Admin Center > Benefits.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: active enrolment has zero employee and employer cost. Confirm
      or correct.'

  - id: BEN036
    field: BENEFITENROLLMENT.EMPLOYER_COST
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.PLAN_TYPE`.isin([''FSA'',''HSA'']) & (`BENEFITENROLLMENT.EMPLOYER_COST` > 0)'
    require_populated: true
    severity: low
    dimension: consistency
    message: Employee-funded account shows an employer contribution — confirm it is a genuine employer match
    why_it_matters: FSA and HSA balances are normally employee-funded through salary deferral. An employer cost on these
      plan types is not necessarily wrong (some employers match HSA contributions) but is uncommon enough to warrant review
      before it is relied on for tax reporting.
    rule_authority: best_practice
    sap_impact: Tax-advantaged account reporting may misclassify an employer match, affecting contribution-limit tracking.
    fix_map:
      __other__: Confirm the employer contribution is a genuine match; if not, correct it via Admin Center > Benefits.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: plan type {BENEFITENROLLMENT.PLAN_TYPE} has an employer
      cost. Confirm it is a genuine contribution.'

  - id: BEN037
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: (`BENEFITENROLLMENT.STATUS` == 'P') & (`BENEFITENROLLMENT.EFFECTIVE_DATE` < @today)
    severity: medium
    dimension: timeliness
    message: Enrolment is still pending after its effective date has passed
    why_it_matters: A pending enrolment whose effective date has already passed means the approval workflow stalled.
      Coverage that should be active or declined by now is stuck in limbo.
    rule_authority: best_practice
    sap_impact: Carrier feed cannot determine whether to add this person to the policy; the employee may be uncovered
      despite believing they elected coverage.
    fix_map:
      __other__: Complete or reject the pending enrolment via Admin Center > Benefits so the status reflects reality.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment is still pending past its effective date {BENEFITENROLLMENT.EFFECTIVE_DATE}.
      Complete or reject the enrolment.'

  - id: BEN038
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.STATUS` == ''E'''
    severity: high
    dimension: validity
    message: Enrolment is flagged with an error status by the source system
    why_it_matters: An error status means SuccessFactors itself could not process the enrolment (e.g. a failed carrier
      acknowledgement or a validation failure). It needs to be resolved at source, not just re-reported here.
    rule_authority: best_practice
    sap_impact: The enrolment is excluded from downstream processing until the source error is resolved; coverage may
      not exist despite the employee believing it does.
    fix_map:
      __other__: Investigate and resolve the error in Admin Center > Benefits, then re-run the enrolment.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment is flagged with an error status. Investigate
      and resolve at source.'

  - id: BEN039
    field: BENEFITENROLLMENT.ENROL_DATE
    check_class: freshness_check
    max_age_hours: 17520
    applies_when:
      BENEFITENROLLMENT.STATUS:
      - A
    severity: low
    dimension: timeliness
    message: Active enrolment has not been re-confirmed in over two years
    why_it_matters: Benefit elections are normally re-confirmed at least annually during open enrolment. An active enrolment
      whose last recorded election is more than two years old may no longer reflect the employee's actual coverage choice
      or dependents.
    rule_authority: best_practice
    sap_impact: Carrier feed and payroll continue to use an election that was never re-confirmed through a recent open
      enrolment cycle.
    fix_map:
      __blank__: Confirm the enrolment at the next open enrolment cycle, or re-elect via Admin Center > Benefits if it
        has lapsed.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: active enrolment last confirmed on {BENEFITENROLLMENT.ENROL_DATE},
      over two years ago. Re-confirm at next open enrolment.'

  - id: BEN040
    field: BENEFITENROLLMENT.COVERAGE_LEVEL
    check_class: cross_field_check
    applies_when:
      BENEFITENROLLMENT.PLAN_TYPE:
      - LIFE
      - AD_D
      - DISABILITY_STD
      - DISABILITY_LTD
      - RETIREMENT
      - FSA
      - HSA
      - COMMUTER
    fail_when: '`BENEFITENROLLMENT.COVERAGE_LEVEL`.isin([''EMP_SPOUSE'',''EMP_CHILD'',''EMP_SPOUSE_CHILD'',''FAMILY''])'
    severity: medium
    dimension: consistency
    message: Non-health benefit type carries a dependent coverage tier
    why_it_matters: Dependent coverage tiers (employee+spouse, employee+child, family) apply to health-type benefits such
      as medical, dental and vision. Life, disability, retirement, FSA, HSA and commuter benefits are employee-only and
      should not carry a dependent tier.
    rule_authority: best_practice
    sap_impact: Carrier or plan administrator feed receives a dependent tier it cannot apply, and may reject or mis-price
      the enrolment.
    fix_map:
      __other__: Correct the coverage level to EMP_ONLY for this plan type, via Admin Center > Benefits.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: plan type {BENEFITENROLLMENT.PLAN_TYPE} has dependent coverage
      level {BENEFITENROLLMENT.COVERAGE_LEVEL}. Correct to EMP_ONLY.'

  - id: BEN041
    field: BENEFITENROLLMENT.DEPENDENT_LINK
    check_class: regex_check
    pattern: ^[a-zA-Z0-9._@-]+(;[a-zA-Z0-9._@-]+)*$
    severity: medium
    dimension: validity
    message: Dependent link must contain only valid identifiers, semicolon-separated for multiple dependents
    why_it_matters: DEPENDENT_LINK is used as a key to resolve the covered dependent(s) in the carrier feed. Free text,
      names or special characters outside the allowed identifier format cannot be resolved to a dependent record.
    rule_authority: best_practice
    sap_impact: Carrier feed cannot resolve the dependent; the dependent is dropped from the policy rather than covered.
    fix_map:
      __other__: Replace the dependent link with the dependent's identifier(s), semicolon-separated for multiple dependents
        (not a name or free text), via Admin Center > Benefits > Enrolment Import.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: DEPENDENT_LINK ''{actual_value}'' contains invalid characters.
      Replace with the dependent identifier(s).'
    auto_fix:
      steps:
      - op: regex_replace
        pattern: \s+
        repl: ''
      - op: regex_replace
        pattern: '[,|]+'
        repl: ;
      confidence: medium

  - id: BEN042
    field: BENEFITENROLLMENT.DEPENDENT_LINK
    check_class: uniqueness_check
    fields:
    - BENEFITENROLLMENT.USERID
    - BENEFITENROLLMENT.DEPENDENT_LINK
    - BENEFITENROLLMENT.PLAN_ID
    - BENEFITENROLLMENT.EFFECTIVE_DATE
    applies_when:
      BENEFITENROLLMENT.DEPENDENT_LINK:
        populated: true
    severity: medium
    dimension: uniqueness
    message: Same dependent enrolled more than once on the same plan and effective date
    why_it_matters: A dependent should appear once per plan per effective date. A duplicate dependent line usually comes
      from a repeated import rather than a genuine second enrolment.
    rule_authority: best_practice
    sap_impact: Carrier feed may bill or cover the same dependent twice under the same plan.
    fix_map:
      __other__: Remove the duplicate dependent line via Admin Center > Benefits.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: dependent {BENEFITENROLLMENT.DEPENDENT_LINK} is enrolled
      more than once on plan {BENEFITENROLLMENT.PLAN_ID} for the same effective date. Remove the duplicate.'

  - id: BEN043
    field: BENEFITENROLLMENT.ENROL_DATE
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.ENROL_DATE` < `EMPEMPLOYMENT.START_DATE`'
    require_populated: true
    severity: medium
    dimension: consistency
    message: Enrolment was recorded before the employee's employment started
    why_it_matters: ENROL_DATE is when the election was made. An election recorded before the hire date usually means
      the record was copied from a prior employment or the hire date is wrong.
    rule_authority: best_practice
    sap_impact: Benefit election audit trail predates the employee's employment, which will not pass an audit of enrolment
      timing.
    fix_map:
      __other__: Correct the enrolment date or the employment start date, whichever is wrong.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment recorded on {BENEFITENROLLMENT.ENROL_DATE}, before
      employment started on {EMPEMPLOYMENT.START_DATE}.'

  - id: BEN044
    field: BENEFITENROLLMENT.ENROL_DATE
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.ENROL_DATE` > `EMPEMPLOYMENT.END_DATE`'
    require_populated: true
    severity: medium
    dimension: consistency
    message: Enrolment was recorded after the employee's employment ended
    why_it_matters: An election recorded after the employment end date means a leaver's benefits were changed after they
      left, which is usually a processing error rather than a genuine election.
    rule_authority: best_practice
    sap_impact: The carrier and payroll may act on an election made for someone no longer employed.
    fix_map:
      __other__: Review and, if the election is not genuine, remove or correct the enrolment via Admin Center > Benefits.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment recorded on {BENEFITENROLLMENT.ENROL_DATE}, after
      employment ended on {EMPEMPLOYMENT.END_DATE}.'
  - id: BEN045
    field: DEPENDENT.PERSON_ID
    check_class: null_check
    severity: high
    dimension: completeness
    message: Dependent record has no employee person ID
    why_it_matters: The person ID links the dependent to the employee. Without it the dependent belongs to nobody.
    rule_authority: best_practice
    sap_impact: The dependent cannot be enrolled or replicated to infotype 0021.
    fix_map:
      __blank__: Link the dependent to the employee or delete the record.
      __other__: Link the dependent to the employee or delete the record.
    record_fix_template: 'Dependent {DEPENDENT.RELATED_PERSON_ID}: has no employee person ID. Link or delete.'
  - id: BEN046
    field: DEPENDENT.RELATED_PERSON_ID
    check_class: null_check
    severity: high
    dimension: completeness
    message: Dependent record has no related person ID
    why_it_matters: The related person ID identifies the dependent. Without it the relationship has no person to cover.
    rule_authority: best_practice
    sap_impact: Benefit enrolments cannot reference the dependent.
    fix_map:
      __blank__: Create the dependent person and link it.
      __other__: Create the dependent person and link it.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}: dependent relationship has no related person. Link the dependent.'
  - id: BEN047
    field: DEPENDENT.RELATIONSHIP_TYPE
    check_class: null_check
    severity: high
    dimension: completeness
    message: Dependent has no relationship type
    why_it_matters: The relationship type (spouse, child, parent) drives eligibility for each coverage level.
    rule_authority: best_practice
    sap_impact: The dependent cannot be enrolled; infotype 0021 subtype cannot be derived.
    fix_map:
      __blank__: Maintain the relationship type in Dependents.
      __other__: Maintain the relationship type in Dependents.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: has no relationship type. Maintain it.'
  - id: BEN048
    field: DEPENDENT.START_DATE
    check_class: null_check
    severity: medium
    dimension: completeness
    message: Dependent relationship has no start date
    why_it_matters: The start date decides from when the dependent can be covered.
    rule_authority: best_practice
    sap_impact: Coverage effective dates cannot be validated against the relationship.
    fix_map:
      __blank__: Maintain the relationship start date.
      __other__: Maintain the relationship start date.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: relationship has no start date. Maintain it.'
  - id: BEN049
    field: DEPENDENT.RELATED_PERSON_ID
    check_class: cross_field_check
    fail_when: '`DEPENDENT.PERSON_ID` == `DEPENDENT.RELATED_PERSON_ID`'
    require_populated: true
    severity: high
    dimension: validity
    message: Employee is recorded as their own dependent
    why_it_matters: A person cannot be their own dependent. The record was created by linking the wrong person.
    rule_authority: best_practice
    sap_impact: The employee is double-covered and premiums are charged twice.
    fix_map:
      __other__: Link the correct dependent person.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}: is recorded as their own dependent. Link the correct person.'
  - id: BEN050
    field: DEPENDENT.END_DATE
    check_class: cross_field_check
    fail_when: '`DEPENDENT.END_DATE` < `DEPENDENT.START_DATE`'
    require_populated: true
    severity: high
    dimension: consistency
    message: Dependent relationship ends before it starts
    why_it_matters: A negative validity period means the relationship never existed in the system.
    rule_authority: best_practice
    sap_impact: The dependent is never eligible; infotype 0021 replication fails.
    fix_map:
      __other__: Correct the start or end date.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: relationship ends {DEPENDENT.END_DATE}, before it starts {DEPENDENT.START_DATE}. Correct the dates.'
  - id: BEN051
    field: DEPENDENT.DEPENDENT_BIRTH
    check_class: cross_field_check
    fail_when: '`DEPENDENT.DEPENDENT_BIRTH` > @today'
    require_populated: true
    severity: high
    dimension: validity
    message: Dependent date of birth is in the future
    why_it_matters: A birth date in the future is impossible; unborn children are not dependents until born.
    rule_authority: best_practice
    sap_impact: Age-based eligibility and premiums cannot be calculated.
    fix_map:
      __other__: Correct the dependent's date of birth.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: has a date of birth in the future. Correct it.'
  - id: BEN052
    field: DEPENDENT.START_DATE
    check_class: cross_field_check
    fail_when: '`DEPENDENT.START_DATE` < `DEPENDENT.DEPENDENT_BIRTH`'
    require_populated: true
    severity: high
    dimension: consistency
    message: Dependent relationship starts before the dependent was born
    why_it_matters: A relationship cannot start before the dependent exists.
    rule_authority: best_practice
    sap_impact: Coverage could be backdated to before birth; carriers reject the enrolment.
    fix_map:
      __other__: Set the relationship start to on or after the date of birth.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: relationship starts {DEPENDENT.START_DATE}, before the dependent''s birth. Correct the start date.'
  - id: BEN053
    field: DEPENDENT.START_DATE
    check_class: interval_check
    group_by:
    - DEPENDENT.PERSON_ID
    - DEPENDENT.RELATED_PERSON_ID
    start: DEPENDENT.START_DATE
    end: DEPENDENT.END_DATE
    severity: medium
    dimension: consistency
    message: Dependent relationship periods overlap
    why_it_matters: One relationship between the same two people must have one validity at a time. Overlaps come from loads that did not delimit the previous record.
    rule_authority: best_practice
    sap_impact: The dependent appears twice for the overlap and may be enrolled twice.
    fix_map:
      __other__: Delimit the earlier relationship record.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: has overlapping relationship records. Delimit the earlier one.'
  - id: BEN054
    field: DEPENDENT.IS_BENEFICIARY
    check_class: domain_value_check
    allowed_values:
    - 'true'
    - 'false'
    valid_values_with_labels:
      'true': Beneficiary
      'false': Not a beneficiary
    severity: medium
    dimension: validity
    message: Beneficiary flag is not true or false
    why_it_matters: The beneficiary flag decides who receives life cover and pension death benefits. Other values make the designation unclear.
    rule_authority: best_practice
    sap_impact: Beneficiary nominations cannot be confirmed with the carrier.
    fix_map:
      __other__: Set the beneficiary flag to true or false.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: beneficiary flag ''{actual_value}'' is not true/false. Correct it.'
    auto_fix:
      steps:
      - op: strip
      - op: lower
      confidence: high
  - id: BEN055
    field: DEPENDENT.IS_BENEFICIARY
    check_class: null_check
    severity: low
    dimension: completeness
    message: Beneficiary flag is not maintained
    why_it_matters: Life and pension plans need an explicit beneficiary designation for every dependent. A blank flag means the nomination was never captured.
    rule_authority: best_practice
    sap_impact: Death benefits go to the estate or are delayed while beneficiaries are traced.
    fix_map:
      __blank__: Ask the employee to confirm the beneficiary designation.
      __other__: Ask the employee to confirm the beneficiary designation.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: beneficiary designation is not maintained. Confirm with the employee.'
  - id: BEN056
    field: DEPENDENT.DEPENDENT_BIRTH
    check_class: cross_field_check
    fail_when: (`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == 'child') & `DEPENDENT.DEPENDENT_BIRTH`.isna()
    severity: high
    dimension: completeness
    message: Child dependent has no date of birth
    why_it_matters: Child eligibility ends at an age limit. Without a birth date the age-out cannot be applied.
    rule_authority: best_practice
    sap_impact: Children stay covered beyond the age limit; the carrier bills for ineligible dependents.
    fix_map:
      __other__: Maintain the child's date of birth.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: child has no date of birth. Maintain it.'
  - id: BEN057
    field: DEPENDENT.DEPENDENT_BIRTH
    check_class: cross_field_check
    fail_when: (`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == 'spouse') & `DEPENDENT.DEPENDENT_BIRTH`.isna()
    severity: medium
    dimension: completeness
    message: Spouse dependent has no date of birth
    why_it_matters: Spouse life cover and medical premiums are age-rated. Without the birth date the premium cannot be priced.
    rule_authority: best_practice
    sap_impact: Carriers reject the enrolment or apply a default age band.
    fix_map:
      __other__: Maintain the spouse's date of birth.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: spouse has no date of birth. Maintain it.'
  - id: BEN058
    field: DEPENDENT.END_DATE
    check_class: cross_field_check
    fail_when: (`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == 'child') & ((@today - `DEPENDENT.DEPENDENT_BIRTH`).dt.days > 9497) & `DEPENDENT.END_DATE`.isna()
    severity: low
    dimension: timeliness
    message: Child dependent older than 26 has no end date
    why_it_matters: Most plans end child cover at 21 to 26 unless the child is a student or disabled. An open child relationship for someone over 26 should be reviewed.
    rule_authority: best_practice
    sap_impact: Ineligible dependents stay on the carrier feed and are billed.
    fix_map:
      __other__: Confirm continued eligibility (student/disabled) or end the dependent coverage.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: child is over 26 with no end date. Confirm eligibility.'
  - id: BEN059
    field: DEPENDENT.DEPENDENT_BIRTH
    check_class: cross_field_check
    fail_when: (`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == 'child') & ((`DEPENDENT.DEPENDENT_BIRTH` - `PERINFO.DATE_OF_BIRTH`).dt.days < 4383)
    require_populated: true
    severity: high
    dimension: accuracy
    message: Child dependent is less than 12 years younger than the employee
    why_it_matters: A biological or adopted child younger by less than 12 years is implausible. The birth date was usually typed with the wrong year or the relationship type is wrong.
    rule_authority: best_practice
    sap_impact: Age-based eligibility is wrong and the dependent may age out early or never.
    fix_map:
      __other__: Correct the child's birth date or the relationship type.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: child is less than 12 years younger than the employee. Check birth date and relationship.'
  - id: BEN060
    field: DEPENDENT.DEPENDENT_BIRTH
    check_class: cross_field_check
    fail_when: (`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == 'child') & (`DEPENDENT.DEPENDENT_BIRTH` == `PERINFO.DATE_OF_BIRTH`)
    require_populated: true
    severity: high
    dimension: accuracy
    message: Child dependent has the employee's date of birth
    why_it_matters: A child with exactly the employee's date of birth is a copy error from the employee record.
    rule_authority: best_practice
    sap_impact: Child age is wrong for eligibility and premiums.
    fix_map:
      __other__: Correct the child's date of birth.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: child has the same date of birth as the employee. Correct it.'
  - id: BEN061
    field: DEPENDENT.DEPENDENT_BIRTH
    check_class: cross_field_check
    fail_when: (`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == 'parent') & (`DEPENDENT.DEPENDENT_BIRTH` >= `PERINFO.DATE_OF_BIRTH`)
    require_populated: true
    severity: high
    dimension: accuracy
    message: Parent dependent is not older than the employee
    why_it_matters: A parent must be born before the employee. The birth date or relationship type is wrong.
    rule_authority: best_practice
    sap_impact: Parent cover (common for extended family medical plans) is priced on the wrong age.
    fix_map:
      __other__: Correct the parent's birth date or the relationship type.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: parent is not older than the employee. Check birth date and relationship.'
  - id: BEN062
    field: DEPENDENT.START_DATE
    check_class: cross_field_check
    fail_when: (`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == 'spouse') & ((`DEPENDENT.START_DATE` - `DEPENDENT.DEPENDENT_BIRTH`).dt.days < 5844)
    require_populated: true
    severity: medium
    dimension: accuracy
    message: Spouse relationship starts before the spouse is 16
    why_it_matters: Marriage below 16 is not legally possible in the jurisdictions SuccessFactors serves. The birth date or start date is wrong.
    rule_authority: best_practice
    sap_impact: Spouse age band and eligibility are wrong.
    fix_map:
      __other__: Correct the spouse's birth date or the relationship start date.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: spouse relationship starts before the spouse is 16. Check the dates.'
  - id: BEN063
    field: DEPENDENT.START_DATE
    check_class: cross_field_check
    fail_when: (`DEPENDENT.START_DATE` - @today).dt.days > 365
    require_populated: true
    severity: medium
    dimension: validity
    message: Dependent relationship starts more than a year ahead
    why_it_matters: Relationships are recorded when they exist. A start date more than a year ahead is usually a wrong year.
    rule_authority: best_practice
    sap_impact: The dependent cannot be enrolled until the date is reached.
    fix_map:
      __other__: Correct the start date.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: relationship starts more than a year in the future. Correct the year.'
  - id: BEN064
    field: DEPENDENT.PERSON_ID
    check_class: exists_check
    target_table: PERINFO
    target_fields:
    - PERSON_ID
    severity: high
    dimension: consistency
    message: Dependent belongs to an employee person that does not exist
    why_it_matters: The person ID must exist in Personal Information. Orphaned dependents come from purged or merged employees.
    rule_authority: best_practice
    sap_impact: The dependent cannot be enrolled and is dropped in migration.
    fix_map:
      __other__: Link the dependent to an existing employee person or delete it.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: employee person does not exist. Link or delete.'
  - id: BEN065
    field: DEPENDENT.RELATED_PERSON_ID
    check_class: exists_check
    fields:
    - DEPENDENT.RELATED_PERSON_ID
    target_table: PERINFO
    target_fields:
    - PERSON_ID
    severity: high
    dimension: consistency
    message: Dependent person has no personal information record
    why_it_matters: Every dependent is a person with name and birth date in Personal Information. Without it the carrier feed has no data for the dependent.
    rule_authority: best_practice
    sap_impact: Carrier enrolment for the dependent fails.
    fix_map:
      __other__: Create the dependent's personal information.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: dependent has no personal information record. Create it.'
  - id: BEN066
    field: DEPENDENT.PERSON_ID
    check_class: exists_check
    target_table: EMPEMPLOYMENT
    target_fields:
    - PERSON_ID
    severity: medium
    dimension: consistency
    message: Dependent belongs to a person with no employment
    why_it_matters: Dependents are covered through the employee's employment. A person without employment has no benefits to extend.
    rule_authority: best_practice
    sap_impact: The dependent is migrated without an eligible employee.
    fix_map:
      __other__: Archive the dependent or link it to the employee person.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: employee person has no employment. Review.'
  - id: BEN067
    field: DEPENDENT.IS_BENEFICIARY
    check_class: cross_field_check
    fail_when: (`DEPENDENT.IS_BENEFICIARY`.str.lower() == 'true') & (`DEPENDENT.END_DATE` < @today)
    require_populated: true
    severity: high
    dimension: consistency
    message: Ended dependent is still a beneficiary
    why_it_matters: When a relationship ends (divorce, death) the beneficiary nomination must be reviewed. An ended relationship still nominated means death benefits may go to a former spouse.
    rule_authority: best_practice
    sap_impact: Life and pension payouts go to the wrong person.
    fix_map:
      __other__: Ask the employee to update the beneficiary nomination.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: relationship ended {DEPENDENT.END_DATE} but is still a beneficiary. Review the nomination.'
  - id: BEN068
    field: DEPENDENT.RELATIONSHIP_TYPE
    check_class: regex_check
    pattern: ^\S+$
    severity: low
    dimension: validity
    message: Relationship type code contains spaces
    why_it_matters: Relationship type is a picklist code such as spouse or child. A code with embedded spaces is free text typed instead of a picklist value and does not match the eligibility rules.
    rule_authority: best_practice
    sap_impact: Eligibility rules skip the dependent.
    fix_map:
      __other__: Select the relationship type from the picklist.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: relationship type ''{actual_value}'' is not a picklist code. Select the picklist value.'
  - id: BEN069
    field: DEPENDENT.PERSON_ID
    check_class: uniqueness_check
    fields:
    - DEPENDENT.PERSON_ID
    - DEPENDENT.RELATED_PERSON_ID
    - DEPENDENT.START_DATE
    severity: medium
    dimension: uniqueness
    message: Duplicate dependent relationship
    why_it_matters: The same relationship with the same start date was loaded twice.
    rule_authority: best_practice
    sap_impact: The dependent is enrolled twice.
    fix_map:
      __other__: Delete the duplicate.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: duplicate relationship record. Delete one.'
  - id: BEN070
    field: BENEFITENROLLMENT.DEPENDENT_LINK
    check_class: cross_field_check
    fail_when: (`BENEFITENROLLMENT.COVERAGE_LEVEL` == 'EMP_SPOUSE') & (`BENEFITENROLLMENT.DEPENDENT_LINK`.str.count(';') > 0)
    severity: medium
    dimension: consistency
    message: Employee + spouse coverage has more than one dependent
    why_it_matters: EMP_SPOUSE covers one spouse. Several linked dependents mean children were added without upgrading the tier.
    rule_authority: best_practice
    sap_impact: Children are covered without premium, or the carrier rejects the extra dependents.
    fix_map:
      __other__: Upgrade the coverage level or remove the extra dependents.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: EMP_SPOUSE coverage on plan {BENEFITENROLLMENT.PLAN_ID} has more than one dependent. Review the tier.'
  - id: BEN071
    field: BENEFITENROLLMENT.DEPENDENT_LINK
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.COVERAGE_LEVEL`.isin([''EMP_SPOUSE_CHILD'',''FAMILY'']) & `BENEFITENROLLMENT.DEPENDENT_LINK`.notna() & (`BENEFITENROLLMENT.DEPENDENT_LINK`.str.count('';'') == 0)'
    severity: medium
    dimension: consistency
    message: Family coverage has only one dependent
    why_it_matters: Spouse-and-child or family coverage needs at least two dependents. With one, the tier is too high.
    rule_authority: best_practice
    sap_impact: The employee pays a family premium for single-dependent cover.
    fix_map:
      __other__: Downgrade the coverage level or link the missing dependents.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: {BENEFITENROLLMENT.COVERAGE_LEVEL} coverage on plan {BENEFITENROLLMENT.PLAN_ID} has one dependent. Review the tier.'
  - id: BEN072
    field: BENEFITENROLLMENT.ENROL_DATE
    check_class: cross_field_check
    fail_when: (`BENEFITENROLLMENT.EFFECTIVE_DATE` - `BENEFITENROLLMENT.ENROL_DATE`).dt.days > 400
    require_populated: true
    severity: medium
    dimension: timeliness
    message: Enrolment was made more than 400 days before coverage starts
    why_it_matters: Open enrolment runs a few months before the plan year. An election more than 400 days ahead is a wrong year.
    rule_authority: best_practice
    sap_impact: The election applies to the wrong plan year.
    fix_map:
      __other__: Correct the enrolment date or the effective date.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment on plan {BENEFITENROLLMENT.PLAN_ID} is more than 400 days before coverage. Check the dates.'
  - id: BEN073
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: (`BENEFITENROLLMENT.STATUS`.isin(['A','P'])) & (`FOCOMPANY.STATUS` == 'I')
    severity: high
    dimension: consistency
    message: Active benefit enrolment in an inactive company
    why_it_matters: A company marked inactive no longer employs anyone. Active or pending enrolments there are left over from a restructuring.
    rule_authority: best_practice
    sap_impact: Premiums are paid for a closed legal entity.
    fix_map:
      __other__: Move the enrolment to the new company or terminate it.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment on plan {BENEFITENROLLMENT.PLAN_ID} is active in an inactive company. Review.'
  - id: BEN074
    field: BENEFITENROLLMENT.DEPENDENT_LINK
    check_class: cross_field_check
    fail_when: (`BENEFITENROLLMENT.STATUS` == 'W') & `BENEFITENROLLMENT.DEPENDENT_LINK`.notna()
    severity: low
    dimension: consistency
    message: Waived enrolment still has dependents linked
    why_it_matters: A waived plan covers nobody. Linked dependents are stale and may be picked up by the carrier feed.
    rule_authority: best_practice
    sap_impact: The carrier may continue dependent cover after the waiver.
    fix_map:
      __other__: Remove the dependent links from the waived enrolment.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: waived enrolment on plan {BENEFITENROLLMENT.PLAN_ID} still has dependents. Remove them.'
  - id: BEN075
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: (`BENEFITENROLLMENT.STATUS` == 'P') & ((@today - `BENEFITENROLLMENT.ENROL_DATE`).dt.days > 90)
    require_populated: true
    severity: medium
    dimension: timeliness
    message: Enrolment pending for more than 90 days
    why_it_matters: Pending elections wait for evidence of insurability or approval. After 90 days the request is stalled.
    rule_authority: best_practice
    sap_impact: Coverage is not in force and the employee may be uninsured.
    fix_map:
      __other__: Approve, decline or chase the evidence for the pending enrolment.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment on plan {BENEFITENROLLMENT.PLAN_ID} pending since {BENEFITENROLLMENT.ENROL_DATE}. Resolve.'
  - id: BEN076
    field: BENEFITENROLLMENT.EMPLOYEE_COST
    check_class: cross_field_check
    fail_when: (`BENEFITENROLLMENT.STATUS` == 'P') & (`BENEFITENROLLMENT.EMPLOYEE_COST` > 0)
    require_populated: true
    severity: medium
    dimension: consistency
    message: Pending enrolment already carries an employee cost
    why_it_matters: Employee contributions start when coverage is approved. A pending enrolment with a cost may be deducted in payroll before cover exists.
    rule_authority: best_practice
    sap_impact: Payroll deducts premiums for cover that is not in force.
    fix_map:
      __other__: Hold the deduction until approval, or approve the enrolment.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: pending enrolment on plan {BENEFITENROLLMENT.PLAN_ID} has an employee cost. Review.'
  - id: BEN077
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.EFFECTIVE_DATE` < `PERINFO.DATE_OF_BIRTH`'
    require_populated: true
    severity: high
    dimension: validity
    message: Coverage starts before the employee was born
    why_it_matters: Coverage dated before birth is a wrong date, usually a date-of-birth or century error.
    rule_authority: best_practice
    sap_impact: Carrier enrolment is rejected.
    fix_map:
      __other__: Correct the coverage effective date.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: coverage on plan {BENEFITENROLLMENT.PLAN_ID} starts before the employee''s birth. Correct the date.'
  - id: BEN078
    field: BENEFITENROLLMENT.PLAN_ID
    check_class: regex_check
    pattern: ^\S+$
    severity: medium
    dimension: validity
    message: Plan ID contains spaces
    why_it_matters: Plan IDs are codes. Spaces stop the enrolment from matching the plan definition and the carrier feed.
    rule_authority: best_practice
    sap_impact: The enrolment is not linked to its plan; premiums are not calculated.
    fix_map:
      __other__: Remove the spaces from the plan ID.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: plan ID ''{actual_value}'' contains spaces. Correct it.'
    auto_fix:
      steps:
      - op: regex_replace
        pattern: \s+
        repl: ''
      confidence: medium
  - id: BEN079
    field: BENEFITENROLLMENT.DEPENDENT_LINK
    check_class: regex_check
    pattern: ^(?!(?:[^;]*;){10}).*$
    severity: low
    dimension: validity
    message: More than 10 dependents on one enrolment
    why_it_matters: Carrier files limit dependents per member. More than 10 is almost always a concatenation error.
    rule_authority: best_practice
    sap_impact: The carrier rejects the member record.
    fix_map:
      __other__: Review the dependent list.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment on plan {BENEFITENROLLMENT.PLAN_ID} has more than 10 dependents. Review.'
  - id: BEN080
    field: BENEFITENROLLMENT.DEPENDENT_LINK
    check_class: regex_check
    pattern: ^(?!(?:.*;)?([^;]+);(?:.*;)?\1(?:;|$)).*$
    severity: medium
    dimension: validity
    message: Same dependent linked twice on one enrolment
    why_it_matters: Each dependent is covered once per plan. A repeated ID doubles the dependent count and the tier.
    rule_authority: best_practice
    sap_impact: The carrier receives a duplicate dependent.
    fix_map:
      __other__: Remove the repeated dependent ID.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment on plan {BENEFITENROLLMENT.PLAN_ID} lists the same dependent twice. Remove the repeat.'
  - id: BEN081
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: (`BENEFITENROLLMENT.PLAN_TYPE` == 'MEDICAL') & (`BENEFITENROLLMENT.EFFECTIVE_DATE`.dt.day != 1)
    require_populated: true
    severity: low
    dimension: validity
    message: Medical coverage does not start on the first of a month
    why_it_matters: Medical schemes bill whole months and membership starts on the first of a month. A mid-month start is a date error.
    rule_authority: best_practice
    sap_impact: The first premium is pro-rated by payroll but billed in full by the scheme.
    fix_map:
      __other__: Move the coverage start to the first of the month.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: medical coverage on plan {BENEFITENROLLMENT.PLAN_ID} starts mid-month. Use the first of the month.'
  - id: BEN082
    field: DEPENDENT.START_DATE
    check_class: cross_field_check
    fail_when: '`DEPENDENT.START_DATE` < `PERINFO.DATE_OF_BIRTH`'
    require_populated: true
    severity: high
    dimension: consistency
    message: Dependent relationship starts before the employee was born
    why_it_matters: No relationship can start before the employee exists. The start date or the employee birth date has a wrong century.
    rule_authority: best_practice
    sap_impact: Coverage dates validated against the relationship are wrong.
    fix_map:
      __other__: Correct the relationship start date.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: relationship starts before the employee''s birth. Correct the start date.'
  - id: BEN083
    field: DEPENDENT.DEPENDENT_BIRTH
    check_class: cross_field_check
    fail_when: '`DEPENDENT.DEPENDENT_BIRTH` > `DEPENDENT.END_DATE`'
    require_populated: true
    severity: high
    dimension: consistency
    message: Dependent was born after the relationship ended
    why_it_matters: A relationship cannot end before the dependent exists.
    rule_authority: best_practice
    sap_impact: The dependent record is unusable for eligibility and is dropped by carriers.
    fix_map:
      __other__: Correct the dependent's birth date or the relationship end date.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}, dependent {DEPENDENT.RELATED_PERSON_ID}: dependent was born after the relationship ended. Correct the dates.'
  - id: BEN084
    field: BENEFITENROLLMENT.ENROL_DATE
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.ENROL_DATE` < `PERINFO.DATE_OF_BIRTH`'
    require_populated: true
    severity: high
    dimension: validity
    message: Enrolment was recorded before the employee was born
    why_it_matters: An election dated before birth is a wrong date, usually a century error.
    rule_authority: best_practice
    sap_impact: Enrolment windows and life-event deadlines are evaluated on a wrong date.
    fix_map:
      __other__: Correct the enrolment date.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment on plan {BENEFITENROLLMENT.PLAN_ID} is dated before the employee''s birth. Correct the date.'
  - id: BEN085
    field: DEPENDENT.RELATED_PERSON_ID
    check_class: regex_check
    pattern: ^\S+$
    severity: low
    dimension: validity
    message: Dependent person ID contains spaces
    why_it_matters: Person IDs are keys. Spaces stop the dependent from matching Personal Information and the enrolment dependent links.
    rule_authority: best_practice
    sap_impact: The dependent cannot be linked to enrolments.
    fix_map:
      __other__: Remove the spaces from the person ID.
    record_fix_template: 'Employee person {DEPENDENT.PERSON_ID}: dependent person ID ''{actual_value}'' contains spaces. Correct it.'
    auto_fix:
      steps:
      - op: regex_replace
        pattern: \s+
        repl: ''
      confidence: medium
  - id: BEN086
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & (`BENEFITENROLLMENT.EFFECTIVE_DATE` < `EMPEMPLOYMENT.PROBATION_END_DATE`) & (`BENEFITENROLLMENT.PLAN_TYPE` == ''RETIREMENT'')'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Retirement plan is effective before the employee''s probation period ends'
    why_it_matters: 'Retirement plans typically only become available once probation is complete. An effective date inside the probation window suggests the eligibility rule was not applied when the enrolment was created.'
    rule_authority: best_practice
    sap_impact: 'Payroll may start retirement contributions before the employee is contractually eligible, creating a reconciliation issue with the plan administrator.'
    fix_map:
      __other__: 'Confirm retirement eligibility and correct EFFECTIVE_DATE via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: retirement plan effective {BENEFITENROLLMENT.EFFECTIVE_DATE} is before the probation end date. Confirm eligibility.'
  - id: BEN087
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.STATUS`.isin([''T'',''W'']) & (`EMPEMPLOYMENT.END_DATE`.isna() | (`EMPEMPLOYMENT.END_DATE`.dt.year >= 9999)) & (`EMPEMPLOYMENT.STATUS` == ''A'')'
    severity: medium
    dimension: consistency
    message: 'Enrolment is terminated or waived while the employee remains actively employed'
    why_it_matters: 'A terminated or waived enrolment for a still-active employee is only valid when the employee made an explicit election change (e.g. open enrolment, qualifying life event). Without that context the termination may be an error.'
    rule_authority: best_practice
    sap_impact: 'Employee may unexpectedly lose coverage; HR cannot tell from the record alone whether this was a deliberate election change.'
    fix_map:
      __other__: 'Confirm with the employee or HR whether the termination was a deliberate election change; correct STATUS if not via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment status {BENEFITENROLLMENT.STATUS} while employment remains active. Confirm this was a deliberate election change.'
  - id: BEN088
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & (`EMPEMPLOYMENT.EVENT`.str.lower() == ''termination'')'
    require_populated: true
    severity: high
    dimension: consistency
    message: 'Enrolment is active while the latest employment event is a termination'
    why_it_matters: 'EMPEMPLOYMENT.EVENT reflects the most recent HR action. A termination event with a still-active benefit enrolment means offboarding has not propagated to benefits, risking continued coverage and billing.'
    rule_authority: best_practice
    sap_impact: 'Carrier continues to bill for coverage that should have ended with the termination event.'
    fix_map:
      __other__: 'Terminate the enrolment to align with the termination event via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment active but latest employment event is termination. Terminate the enrolment.'
  - id: BEN089
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: '`EMPEMPLOYMENT.IS_CONTINGENT_WORKER`.str.lower().isin([''true'',''x'',''1'']) & `BENEFITENROLLMENT.PLAN_TYPE`.isin([''RETIREMENT'',''PENSION'']) & `BENEFITENROLLMENT.EFFECTIVE_DATE`.notna()'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Contingent worker is enrolled in a retirement or pension plan'
    why_it_matters: 'Contingent (non-permanent) workers are typically excluded from employer-sponsored retirement plans by plan design. An enrolment on a contingent worker record suggests either a misclassification or an eligibility rule that was bypassed.'
    rule_authority: best_practice
    sap_impact: 'Plan administrator may reject the contribution file or the employer may incur a compliance exposure for enrolling an ineligible worker class.'
    fix_map:
      __other__: 'Confirm the worker classification and plan eligibility; correct whichever is wrong via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: contingent worker enrolled in {BENEFITENROLLMENT.PLAN_TYPE}. Confirm eligibility.'
  - id: BEN090
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & (`EMPEMPLOYMENT.CONTRACT_END_DATE` < @today) & `EMPEMPLOYMENT.CONTRACT_END_DATE`.notna() & `BENEFITENROLLMENT.EFFECTIVE_DATE`.notna()'
    require_populated: true
    severity: high
    dimension: consistency
    message: 'Enrolment is active after the employee''s fixed-term contract has ended'
    why_it_matters: 'A fixed-term contract that has already ended should normally trigger a benefits offboarding review. An active enrolment past the contract end date means that review has not happened yet or was missed.'
    rule_authority: best_practice
    sap_impact: 'Coverage and payroll deductions continue past the contractual relationship, creating a billing and compliance exposure.'
    fix_map:
      __other__: 'Review the contract status and terminate the enrolment if the contract genuinely ended via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment active after contract end date {EMPEMPLOYMENT.CONTRACT_END_DATE}. Review and terminate if applicable.'
  - id: BEN091
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & (`USERACCOUNT.STATUS`.str.upper() == ''I'')'
    require_populated: true
    severity: high
    dimension: consistency
    message: 'Active benefit enrolment belongs to a user account that is not active'
    why_it_matters: 'If the login account behind the enrolment is not active, the employee record it belongs to is likely inactive too. An active enrolment on an inactive account points to an offboarding step that was missed.'
    rule_authority: best_practice
    sap_impact: 'Benefit provider continues to bill for an employee whose system access has already been revoked.'
    fix_map:
      __other__: 'Confirm the account status and terminate the enrolment if the employee has left via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: active enrolment on a non-active user account. Confirm and terminate if the employee has left.'
  - id: BEN092
    field: BENEFITENROLLMENT.USERID
    check_class: exists_check
    target_table: USERACCOUNT
    target_fields: [USER_ID]
    severity: high
    dimension: consistency
    message: 'Enrolled user has no matching user account record'
    why_it_matters: 'Every benefit enrolment should trace to a known login account. A USERID with no matching USERACCOUNT record means either the account was deleted without cleaning up benefits, or the USERID was mistyped.'
    rule_authority: best_practice
    sap_impact: 'Self-service benefit elections and statements cannot be delivered because there is no account to deliver them to.'
    fix_map:
      __other__: 'Correct the USERID or create the missing user account record via Admin Center > Benefits.'
    record_fix_template: 'Enrolment {BENEFITENROLLMENT.USERID}: no matching USERACCOUNT record found. Correct the USERID or restore the account.'
  - id: BEN093
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & (`USERACCOUNT.HIRE_DATE` > `BENEFITENROLLMENT.EFFECTIVE_DATE`)'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Enrolment is effective before the user account''s recorded hire date'
    why_it_matters: 'A benefit cannot genuinely be effective before the employee was hired. This usually indicates the hire date on the account was corrected after the enrolment was created, or the effective date is wrong.'
    rule_authority: best_practice
    sap_impact: 'Benefit tenure calculations and eligibility waiting-period checks use an inconsistent anchor date.'
    fix_map:
      __other__: 'Reconcile the hire date and enrolment effective date via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment effective {BENEFITENROLLMENT.EFFECTIVE_DATE} is before the account hire date {USERACCOUNT.HIRE_DATE}. Reconcile the dates.'
  - id: BEN094
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS`.isin([''A'',''P''])) & (`FODEPARTMENT.STATUS` == ''I'')'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Enrolment references the employee''s department, which is flagged inactive in foundation data'
    why_it_matters: 'FODEPARTMENT status drives organizational reporting and eligibility rules. An active or pending enrolment tied to an inactive FODEPARTMENT record means the organizational structure data is stale relative to the enrolment.'
    rule_authority: best_practice
    sap_impact: 'Organizational reporting built on foundation objects undercounts or misattributes active enrolments tied to an inactive object.'
    fix_map:
      __other__: 'Reactivate the FODEPARTMENT record if it is still in use, or correct the employee''s assignment via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment references a FODEPARTMENT record flagged inactive. Reconcile the foundation object status.'
  - id: BEN095
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS`.isin([''A'',''P''])) & (`FOLOCATION.STATUS` == ''I'')'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Enrolment references the employee''s work location, which is flagged inactive in foundation data'
    why_it_matters: 'FOLOCATION status drives organizational reporting and eligibility rules. An active or pending enrolment tied to an inactive FOLOCATION record means the organizational structure data is stale relative to the enrolment.'
    rule_authority: best_practice
    sap_impact: 'Organizational reporting built on foundation objects undercounts or misattributes active enrolments tied to an inactive object.'
    fix_map:
      __other__: 'Reactivate the FOLOCATION record if it is still in use, or correct the employee''s assignment via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment references a FOLOCATION record flagged inactive. Reconcile the foundation object status.'
  - id: BEN096
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS`.isin([''A'',''P''])) & (`FOJOBCODE.STATUS` == ''I'')'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Enrolment references the employee''s job code, which is flagged inactive in foundation data'
    why_it_matters: 'FOJOBCODE status drives organizational reporting and eligibility rules. An active or pending enrolment tied to an inactive FOJOBCODE record means the organizational structure data is stale relative to the enrolment.'
    rule_authority: best_practice
    sap_impact: 'Organizational reporting built on foundation objects undercounts or misattributes active enrolments tied to an inactive object.'
    fix_map:
      __other__: 'Reactivate the FOJOBCODE record if it is still in use, or correct the employee''s assignment via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment references a FOJOBCODE record flagged inactive. Reconcile the foundation object status.'
  - id: BEN097
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS`.isin([''A'',''P''])) & (`FODIVISION.STATUS` == ''I'')'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Enrolment references the employee''s division, which is flagged inactive in foundation data'
    why_it_matters: 'FODIVISION status drives organizational reporting and eligibility rules. An active or pending enrolment tied to an inactive FODIVISION record means the organizational structure data is stale relative to the enrolment.'
    rule_authority: best_practice
    sap_impact: 'Organizational reporting built on foundation objects undercounts or misattributes active enrolments tied to an inactive object.'
    fix_map:
      __other__: 'Reactivate the FODIVISION record if it is still in use, or correct the employee''s assignment via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment references a FODIVISION record flagged inactive. Reconcile the foundation object status.'
  - id: BEN098
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS`.isin([''A'',''P''])) & (`FOBUSINESSUNIT.STATUS` == ''I'')'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Enrolment references the employee''s business unit, which is flagged inactive in foundation data'
    why_it_matters: 'FOBUSINESSUNIT status drives organizational reporting and eligibility rules. An active or pending enrolment tied to an inactive FOBUSINESSUNIT record means the organizational structure data is stale relative to the enrolment.'
    rule_authority: best_practice
    sap_impact: 'Organizational reporting built on foundation objects undercounts or misattributes active enrolments tied to an inactive object.'
    fix_map:
      __other__: 'Reactivate the FOBUSINESSUNIT record if it is still in use, or correct the employee''s assignment via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment references a FOBUSINESSUNIT record flagged inactive. Reconcile the foundation object status.'
  - id: BEN099
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS`.isin([''A'',''P''])) & (`FOCOSTCENTER.STATUS` == ''I'')'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Enrolment references the employee''s cost center, which is flagged inactive in foundation data'
    why_it_matters: 'FOCOSTCENTER status drives organizational reporting and eligibility rules. An active or pending enrolment tied to an inactive FOCOSTCENTER record means the organizational structure data is stale relative to the enrolment.'
    rule_authority: best_practice
    sap_impact: 'Organizational reporting built on foundation objects undercounts or misattributes active enrolments tied to an inactive object.'
    fix_map:
      __other__: 'Reactivate the FOCOSTCENTER record if it is still in use, or correct the employee''s assignment via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment references a FOCOSTCENTER record flagged inactive. Reconcile the foundation object status.'
  - id: BEN100
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & (`POSITION.VACANT`.str.lower().isin([''true'',''x'',''1'']))'
    require_populated: true
    severity: low
    dimension: consistency
    message: 'Active enrolment is tied to a position marked vacant'
    why_it_matters: 'A position marked vacant should have no incumbent, and therefore no active benefit enrolment tied to it through the employee''s assignment. This usually means the position record was not updated when the employee moved or left.'
    rule_authority: best_practice
    sap_impact: 'Workforce and position reporting double counts headcount against a position that reporting treats as unoccupied.'
    fix_map:
      __other__: 'Correct the position''s vacancy flag or the employee''s position assignment via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: active enrolment tied to a position flagged vacant. Reconcile the position assignment.'
  - id: BEN101
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & (`POSITION.EFFECTIVE_STATUS` == ''I'')'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Active enrolment is tied to a position that is no longer effective'
    why_it_matters: 'POSITION.EFFECTIVE_STATUS reflects whether the position itself is still in use. An active enrolment against an inactive position usually means the employee''s position assignment was not updated when the position was closed.'
    rule_authority: best_practice
    sap_impact: 'Position-based org charts and cost allocations misstate which positions are actually staffed.'
    fix_map:
      __other__: 'Reassign the employee to a current position via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: active enrolment tied to a non-effective position. Reassign to a current position.'
  - id: BEN102
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `EMPGLOBALASSIGNMENT.END_DATE`.notna() & (`EMPGLOBALASSIGNMENT.END_DATE` < @today)'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Active enrolment persists after the employee''s global assignment has ended'
    why_it_matters: 'When an international assignment ends, home- or host-country benefit elections tied to that assignment should be reviewed. An active enrolment past the assignment end date may reflect coverage that should have switched or ended with repatriation.'
    rule_authority: best_practice
    sap_impact: 'Expatriate benefit billing may continue in the wrong country or currency after repatriation.'
    fix_map:
      __other__: 'Review the enrolment against the assignment end date and update it via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: active enrolment after global assignment end date {EMPGLOBALASSIGNMENT.END_DATE}. Review the enrolment.'
  - id: BEN103
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS`.isin([''A'',''P''])) & (`FOEVENTREASON.STATUS` == ''I'')'
    require_populated: true
    severity: low
    dimension: consistency
    message: 'Enrolment traces to an employment event whose reason code is flagged inactive'
    why_it_matters: 'FOEVENTREASON status indicates whether an event reason code is still valid for use. An enrolment linked (via the employee''s latest event) to a retired reason code suggests the organizational reference data and the transactional event history have drifted apart.'
    rule_authority: best_practice
    sap_impact: 'Event-reason-based reporting (e.g. new hire vs rehire enrolment analysis) is built on a code that configuration says should no longer be used.'
    fix_map:
      __other__: 'Confirm the correct, currently valid event reason code via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: linked employment event reason is flagged inactive in foundation data. Confirm the correct reason code.'
  - id: BEN104
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `PERINFO.DATE_OF_DEATH`.notna()'
    require_populated: true
    severity: critical
    dimension: accuracy
    message: 'Active benefit enrolment belongs to a person recorded as deceased'
    why_it_matters: 'An active enrolment for a person with a recorded date of death is a critical accuracy failure — it exposes the organization to continued premium payments and incorrect beneficiary processing.'
    rule_authority: best_practice
    sap_impact: 'Continued payroll deduction and carrier billing for a deceased person; beneficiary and survivor benefit processing may be delayed or missed entirely.'
    fix_map:
      __other__: 'Terminate the enrolment immediately and route to survivor benefit processing via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: active enrolment but PERINFO records a date of death. Terminate the enrolment and initiate survivor benefit processing.'
  - id: BEN105
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.EFFECTIVE_DATE`.notna() & ((`PERINFO.DATE_OF_BIRTH` - @today).dt.days > -5844)'
    require_populated: true
    severity: high
    dimension: accuracy
    message: 'Enrolled employee''s recorded age is under 16 years'
    why_it_matters: 'A benefit enrolment for an employee under the legal minimum working age is implausible and almost always reflects an incorrect date of birth.'
    rule_authority: best_practice
    sap_impact: 'Statutory minimum-age payroll and benefit controls cannot be relied on while the underlying date of birth is wrong.'
    fix_map:
      __other__: 'Verify and correct the date of birth via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: recorded age under 16 years. Verify the date of birth.'
  - id: BEN106
    field: BENEFITENROLLMENT.EMPLOYEE_COST
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.EMPLOYEE_COST` > 50000'
    severity: medium
    dimension: accuracy
    message: 'Employee contribution amount is implausibly high for a single enrolment'
    why_it_matters: 'Per-period employee contributions above this threshold are far outside normal benefit pricing and usually indicate a unit error (e.g. annual amount entered where a per-period amount was expected).'
    rule_authority: customer_configured
    sap_impact: 'Payroll deduction calculated from this value would be materially wrong, risking a large incorrect deduction from the employee''s pay.'
    fix_map:
      __other__: 'Verify the contribution amount and unit against the plan rate table via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: employee cost {BENEFITENROLLMENT.EMPLOYEE_COST} is implausibly high. Verify against the plan rate table.'
  - id: BEN107
    field: BENEFITENROLLMENT.EMPLOYER_COST
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.EMPLOYER_COST` > 50000'
    severity: medium
    dimension: accuracy
    message: 'Employer contribution amount is implausibly high for a single enrolment'
    why_it_matters: 'Per-period employer contributions above this threshold are far outside normal benefit pricing and usually indicate a unit error.'
    rule_authority: customer_configured
    sap_impact: 'Benefit cost reporting and budget forecasting would materially overstate employer spend.'
    fix_map:
      __other__: 'Verify the contribution amount and unit against the plan rate table via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: employer cost {BENEFITENROLLMENT.EMPLOYER_COST} is implausibly high. Verify against the plan rate table.'
  - id: BEN108
    field: BENEFITENROLLMENT.EMPLOYER_COST
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & (`BENEFITENROLLMENT.EMPLOYER_COST` > 0) & (`BENEFITENROLLMENT.EMPLOYEE_COST` > 0) & (`BENEFITENROLLMENT.EMPLOYER_COST` > (`BENEFITENROLLMENT.EMPLOYEE_COST` * 50))'
    require_populated: true
    severity: low
    dimension: accuracy
    message: 'Employer cost is more than fifty times the employee cost on the same enrolment'
    why_it_matters: 'A cost-share ratio this extreme is outside typical employer/employee contribution splits and is worth a plausibility check, even though some plans are fully employer-paid at EMPLOYEE_COST of zero.'
    rule_authority: best_practice
    sap_impact: 'Cost-share reporting used for total-rewards statements may be built on a mis-keyed amount.'
    fix_map:
      __other__: 'Verify both cost amounts against the plan''s contribution split via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: employer cost is far larger than employee cost on the same plan. Verify the contribution split.'
  - id: BEN109
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''P'') & ((@today - `BENEFITENROLLMENT.EFFECTIVE_DATE`).dt.days > 180)'
    severity: medium
    dimension: timeliness
    message: 'Pending enrolment has an effective date more than 180 days in the past'
    why_it_matters: 'A pending enrolment should be confirmed or rejected well before its effective date passes. One still pending six months after the date it was meant to take effect indicates the approval workflow stalled.'
    rule_authority: best_practice
    sap_impact: 'Coverage that should already be in force, or already rejected, remains in limbo and is not fed to the carrier either way.'
    fix_map:
      __other__: 'Resolve the pending approval and move the enrolment to active or terminated via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: pending enrolment effective {BENEFITENROLLMENT.EFFECTIVE_DATE} is more than 180 days stale. Resolve the pending approval.'
  - id: BEN110
    field: BENEFITENROLLMENT.DEPENDENT_LINK
    check_class: regex_check
    pattern: '^(?!;)[^;]+(;[^;]+)*$'
    severity: low
    dimension: validity
    message: 'Dependent link list has an empty entry between separators'
    why_it_matters: 'DEPENDENT_LINK stores one or more dependent identifiers separated by semicolons. An empty entry (e.g. a double semicolon or a trailing separator) means the list cannot be split into a clean set of dependent references.'
    rule_authority: best_practice
    sap_impact: 'Carrier feed enrolment of dependents under this coverage silently drops or misreads an entry.'
    fix_map:
      __other__: 'Remove the empty entry from the dependent link list via Admin Center > Benefits.'
    record_fix_template: 'Enrolment {BENEFITENROLLMENT.USERID}: dependent link list has an empty entry. Remove it.'
    auto_fix:
      steps:
      - {op: 'regex_replace', pattern: ';;+', repl: ';'}
      - {op: 'regex_replace', pattern: '^;|;$', repl: ''}
      confidence: medium
  - id: BEN111
    field: BENEFITENROLLMENT.EMPLOYEE_COST
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.PLAN_TYPE`.isin([''FSA'',''HSA'']) & (`BENEFITENROLLMENT.EMPLOYEE_COST` == 0) & (`BENEFITENROLLMENT.STATUS` == ''A'')'
    require_populated: true
    severity: medium
    dimension: completeness
    message: 'Active FSA or HSA enrolment has no employee contribution amount'
    why_it_matters: 'FSA and HSA accounts are funded by employee election; an active enrolment with no employee contribution amount is not a usable account. This is the completeness counterpart to the existing employer cost check on these plan types.'
    rule_authority: best_practice
    sap_impact: 'Payroll has nothing to deduct into the account, so the account is never actually funded despite being shown as active.'
    fix_map:
      __blank__: 'Load the employee''s elected contribution amount via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: active {BENEFITENROLLMENT.PLAN_TYPE} enrolment has no employee contribution. Load the elected amount.'
  - id: BEN112
    field: DEPENDENT.END_DATE
    check_class: cross_field_check
    fail_when: '`DEPENDENT.END_DATE`.notna() & (`DEPENDENT.END_DATE`.dt.year < 9999) & (`DEPENDENT.END_DATE` > @today) & ((`DEPENDENT.END_DATE` - @today).dt.days > 36500)'
    severity: low
    dimension: accuracy
    message: 'Dependent coverage end date is more than 100 years in the future'
    why_it_matters: 'An end date a century or more away is not a genuine open-ended coverage record; it is almost always a placeholder or data-entry error rather than a deliberately far-future end date.'
    rule_authority: best_practice
    sap_impact: 'Reporting that treats END_DATE literally (e.g. time-to-expiry dashboards) produces nonsensical values.'
    fix_map:
      __other__: 'Clear the placeholder end date or set it to the true coverage end via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: end date {DEPENDENT.END_DATE} is implausibly far in the future. Correct or clear it.'
  - id: BEN113
    field: DEPENDENT.START_DATE
    check_class: uniqueness_check
    fields:
    - DEPENDENT.PERSON_ID
    - DEPENDENT.RELATIONSHIP_TYPE
    applies_when:
      DEPENDENT.RELATIONSHIP_TYPE:
      - spouse
    severity: medium
    dimension: uniqueness
    message: 'Employee has more than one dependent recorded as spouse'
    why_it_matters: 'An employee should have at most one active spouse dependent at a time. More than one spouse record for the same employee usually means a prior spouse was never end-dated after a divorce or death.'
    rule_authority: best_practice
    sap_impact: 'Carrier feed may enrol two spouses for family coverage pricing, overstating the dependent count and the premium.'
    fix_map:
      __other__: 'End-date the superseded spouse dependent record via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: more than one spouse dependent recorded. End-date the superseded record.'
  - id: BEN114
    field: DEPENDENT.DEPENDENT_BIRTH
    check_class: cross_field_check
    fail_when: '(`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == ''domestic_partner'') & ((`DEPENDENT.DEPENDENT_BIRTH` - `PERINFO.DATE_OF_BIRTH`).dt.days > 4383)'
    require_populated: true
    severity: low
    dimension: accuracy
    message: 'Domestic partner dependent is recorded as more than 12 years younger than the employee'
    why_it_matters: 'A partner age gap this large is not impossible, but it is uncommon enough to warrant a plausibility check for a mis-keyed date of birth, mirroring the existing spouse age-gap check.'
    rule_authority: best_practice
    sap_impact: 'Age-banded dependent pricing for the domestic partner tier may be calculated from an incorrect date of birth.'
    fix_map:
      __other__: 'Verify the domestic partner''s date of birth via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: domestic partner recorded more than 12 years younger than the employee. Verify the date of birth.'
  - id: BEN115
    field: DEPENDENT.DEPENDENT_BIRTH
    check_class: cross_field_check
    fail_when: '(`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == ''domestic_partner'') & (`DEPENDENT.DEPENDENT_BIRTH` > `PERINFO.DATE_OF_BIRTH`) & ((`DEPENDENT.DEPENDENT_BIRTH` - `PERINFO.DATE_OF_BIRTH`).dt.days > 21915)'
    require_populated: true
    severity: low
    dimension: accuracy
    message: 'Domestic partner dependent is recorded as more than 60 years younger than the employee'
    why_it_matters: 'An age gap of this size the other direction is equally implausible and points to the same kind of mis-keyed date of birth.'
    rule_authority: best_practice
    sap_impact: 'Age-banded dependent pricing for the domestic partner tier may be calculated from an incorrect date of birth.'
    fix_map:
      __other__: 'Verify the domestic partner''s date of birth via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: domestic partner recorded far older than the employee. Verify the date of birth.'
  - id: BEN116
    field: DEPENDENT.DEPENDENT_BIRTH
    check_class: cross_field_check
    fail_when: '(`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == ''child'') & (((@today - `DEPENDENT.DEPENDENT_BIRTH`).dt.days > 7670) & ((@today - `DEPENDENT.DEPENDENT_BIRTH`).dt.days <= 9497) | ((@today - `DEPENDENT.DEPENDENT_BIRTH`).dt.days < 0)) & (`DEPENDENT.END_DATE`.isna() | (`DEPENDENT.END_DATE`.dt.year >= 9999))'
    severity: low
    dimension: timeliness
    message: 'Child dependent is approaching the standard dependent age-out limit, or has a future birth date, with no end date planned'
    why_it_matters: 'A child dependent between 21 and 26 years old is approaching the typical age-out limit enforced elsewhere in this pack; a future birth date is a separate data entry error. Surfacing either earlier gives the benefits team time to plan the age-out, or correct the birth date, rather than discovering the problem only once the hard limit is already breached.'
    rule_authority: best_practice
    sap_impact: 'Without advance planning, the carrier feed continues coverage past the plan''s age-out date before anyone notices.'
    fix_map:
      __blank__: 'Plan the dependent''s age-out end date ahead of the plan''s limit via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: child dependent approaching the standard age-out limit. Plan the end date.'
  - id: BEN117
    field: DEPENDENT.RELATED_PERSON_ID
    check_class: uniqueness_check
    fields:
    - DEPENDENT.RELATED_PERSON_ID
    - DEPENDENT.PERSON_ID
    applies_when:
      DEPENDENT.RELATIONSHIP_TYPE:
      - child
    severity: low
    dimension: uniqueness
    message: 'Same child dependent identifier is linked to the same employee more than once as a child relationship'
    why_it_matters: 'A repeated RELATED_PERSON_ID under the same employee and relationship type represents the same child being recorded twice, which fragments that child''s coverage history across two rows.'
    rule_authority: best_practice
    sap_impact: 'Dependent coverage history for the child is split, so continuity-of-coverage checks and age-out tracking give an incomplete picture.'
    fix_map:
      __other__: 'Merge the duplicate child dependent rows into one continuous record via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: same child linked more than once. Merge the duplicate rows.'
  - id: BEN118
    field: BENEFITENROLLMENT.COVERAGE_LEVEL
    check_class: regex_check
    pattern: '^\S+$'
    severity: low
    dimension: validity
    message: 'Coverage level contains embedded whitespace'
    why_it_matters: 'COVERAGE_LEVEL is matched against a fixed domain of coded values. Embedded whitespace prevents an otherwise-correct value from matching that domain.'
    rule_authority: best_practice
    sap_impact: 'Coverage-tier reporting and the carrier feed cannot classify the enrolment''s tier.'
    fix_map:
