    rule_authority: best_practice
    sap_impact: 'Tenure-based benefit eligibility (e.g. waiting periods, vesting) cannot be verified for this employee.'
    fix_map:
      __other__: 'Confirm job history has been loaded for this employee via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: active enrolment but no EMPJOBHIST record found. Confirm job history is loaded.'
  - id: BEN160
    field: DEPENDENT.PERSON_ID
    check_class: exists_check
    target_table: EMPEMPLOYMENT
    target_fields: [PERSON_ID]
    severity: medium
    dimension: consistency
    message: 'Dependent''s sponsoring person has no employment record'
    why_it_matters: 'A dependent should trace to a sponsoring employee who has an actual employment assignment. A PERSON_ID present in PERINFO but with no EMPEMPLOYMENT record means the sponsor cannot be verified as an active (or ever-active) employee.'
    rule_authority: best_practice
    sap_impact: 'The dependent''s eligibility cannot be tied to any employment record, which most carriers require for enrolment.'
    fix_map:
      __other__: 'Confirm the sponsoring employee''s employment record exists via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: sponsoring person has no employment record. Confirm the employment record exists.'
  - id: BEN161
    field: DEPENDENT.DEPENDENT_BIRTH
    check_class: cross_field_check
    fail_when: '(`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == ''spouse'') & (((@today - `DEPENDENT.DEPENDENT_BIRTH`).dt.days > 36500) | ((@today - `DEPENDENT.DEPENDENT_BIRTH`).dt.days < 0))'
    require_populated: true
    severity: low
    dimension: accuracy
    message: 'Spouse dependent''s recorded age exceeds 100 years or the birth date is in the future'
    why_it_matters: 'An age over 100 years, or a birth date recorded in the future, is not physically plausible for a living dependent of this relationship type and points to a date-of-birth entry error.'
    rule_authority: best_practice
    sap_impact: 'Age-banded dependent pricing for this relationship tier is calculated from an implausible age.'
    fix_map:
      __other__: 'Verify and correct the dependent''s date of birth via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: spouse dependent''s recorded age exceeds 100 years. Verify the date of birth.'
  - id: BEN162
    field: DEPENDENT.DEPENDENT_BIRTH
    check_class: cross_field_check
    fail_when: '(`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == ''domestic_partner'') & (((@today - `DEPENDENT.DEPENDENT_BIRTH`).dt.days > 36500) | ((@today - `DEPENDENT.DEPENDENT_BIRTH`).dt.days < 0))'
    require_populated: true
    severity: low
