    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: domestic_partner dependent''s recorded age is under 16 years. Verify the date of birth.'
  - id: BEN166
    field: DEPENDENT.END_DATE
    check_class: cross_field_check
    fail_when: '`DEPENDENT.END_DATE`.notna() & (`DEPENDENT.END_DATE` > @today) & (`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == ''spouse'')'
    require_populated: true
    severity: low
    dimension: timeliness
    message: 'Spouse dependent has a future-dated end date already scheduled'
    why_it_matters: 'A future end date on a spouse dependent is unusual outside a known life event (e.g. a planned divorce date agreed in a settlement). Surfacing it prompts confirmation that the scheduled end is correct and intentional.'
    rule_authority: best_practice
    sap_impact: 'Coverage may end unexpectedly for a dependent whose scheduled end date was set in error.'
    fix_map:
      __blank__: 'Confirm the scheduled end date is correct and intentional via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: spouse dependent has a future end date {DEPENDENT.END_DATE} already scheduled. Confirm it is correct.'
  - id: BEN167
    field: DEPENDENT.START_DATE
    check_class: cross_field_check
    fail_when: '`DEPENDENT.START_DATE` > @today'
    severity: medium
    dimension: accuracy
    message: 'Dependent coverage start date is in the future'
    why_it_matters: 'A dependent coverage record should start on or before today once it has been entered as current; a future start date that was never intended as a scheduled future addition is usually a data-entry date error.'
    rule_authority: best_practice
    sap_impact: 'The dependent appears uncovered today even though the record exists, which can delay claim processing if the start date is wrong.'
    fix_map:
      __other__: 'Confirm whether the future start date is a planned addition or a data entry error via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: coverage start date {DEPENDENT.START_DATE} is in the future. Confirm it is correct.'
  - id: BEN168
    field: DEPENDENT.END_DATE
    check_class: cross_field_check
    fail_when: '`DEPENDENT.END_DATE`.notna() & (`DEPENDENT.END_DATE` - `DEPENDENT.START_DATE`).dt.days < 1'
    require_populated: true
    severity: low
    dimension: accuracy
    message: 'Dependent coverage window is less than a day long'
    why_it_matters: 'A coverage window of zero or negative length (beyond the already-checked end-before-start case) means the record was effectively never in force, which is itself worth flagging as a likely data entry mistake rather than a deliberate same-day add/remove.'
    rule_authority: best_practice
    sap_impact: 'Carrier feed would enrol and immediately un-enrol the dependent in the same cycle, which many carrier systems reject as an invalid transaction.'
    fix_map:
      __other__: 'Confirm the intended coverage window and correct the dates via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: coverage window is less than a day long. Confirm the intended dates.'
  - id: BEN169
    field: BENEFITENROLLMENT.USERID
    check_class: regex_check
    pattern: '^\S+$'
    severity: low
    dimension: validity
    message: 'USERID contains embedded whitespace'
    why_it_matters: 'USERID is used as a join key against other tables. Embedded whitespace defeats exact-match joins even though the value displays correctly.'
    rule_authority: best_practice
    sap_impact: 'Join-based lookups and referential checks using this key silently fail to match.'
    fix_map:
      __other__: 'Remove the embedded whitespace from USERID via Admin Center > Benefits.'
    record_fix_template: 'Record {BENEFITENROLLMENT.USERID}: USERID contains whitespace. Remove it.'
    auto_fix:
      steps:
      - {op: 'regex_replace', pattern: '\s+', repl: ''}
      confidence: medium
