    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: temporary worker enrolled in {BENEFITENROLLMENT.PLAN_TYPE}. Confirm eligibility.'
  - id: BEN144
    field: BENEFITENROLLMENT.PLAN_TYPE
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & (`EMPEMPLOYMENT.EMPLOYEE_CLASS`.str.upper() == ''SEASONAL'') & (`BENEFITENROLLMENT.PLAN_TYPE` == ''MEDICAL'')'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Seasonal employee is enrolled in a medical plan'
    why_it_matters: 'Seasonal employees are usually excluded from employer medical coverage until they reach a minimum service threshold. An active medical enrolment here suggests either a misclassification or a bypassed eligibility rule.'
    rule_authority: customer_configured
    sap_impact: 'Carrier may reject the enrolment or bill the employer for coverage on an ineligible worker class.'
    fix_map:
      __other__: 'Confirm the worker classification and plan eligibility via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: seasonal employee enrolled in a medical plan. Confirm eligibility.'
  - id: BEN145
    field: DEPENDENT.DEPENDENT_BIRTH
    check_class: null_check
    severity: medium
    dimension: completeness
    message: 'Dependent record has no date of birth recorded'
    why_it_matters: 'DEPENDENT_BIRTH underpins every age-based eligibility rule in this pack (age-out thresholds, minimum ages, implausible ages). Without it none of those checks can run for this dependent at all.'
    rule_authority: best_practice
    sap_impact: 'Age-banded dependent pricing and age-out processing cannot be evaluated for this dependent.'
    fix_map:
      __blank__: 'Load the dependent''s date of birth via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: no date of birth recorded. Load the date of birth.'
  - id: BEN146
    field: BENEFITENROLLMENT.DEPENDENT_LINK
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.COVERAGE_LEVEL` == ''EMP_SPOUSE_CHILD'') & (`BENEFITENROLLMENT.DEPENDENT_LINK`.isna() | (`BENEFITENROLLMENT.DEPENDENT_LINK`.str.count('';'') < 1))'
    severity: low
    dimension: consistency
    message: 'Employee-plus-spouse-plus-child coverage is linked to fewer than two dependents'
    why_it_matters: 'EMP_SPOUSE_CHILD coverage implies both a spouse and at least one child are covered. Fewer than two linked dependents means the linkage is incomplete for the elected tier.'
    rule_authority: best_practice
    sap_impact: 'The carrier feed will under-represent who is actually covered under this enrolment.'
    fix_map:
      __other__: 'Confirm all covered dependents are linked for this tier via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: employee-plus-spouse-plus-child coverage links fewer than two dependents. Confirm the linkage.'
  - id: BEN147
    field: BENEFITENROLLMENT.DEPENDENT_LINK
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.DEPENDENT_LINK`.notna() & (`BENEFITENROLLMENT.DEPENDENT_LINK` == `BENEFITENROLLMENT.USERID`)'
    require_populated: true
    severity: critical
    dimension: accuracy
    message: 'Enrolled employee is listed as their own dependent'
    why_it_matters: 'DEPENDENT_LINK should only ever reference other people covered under the employee''s plan. The employee''s own identifier appearing in their own dependent linkage is a data integrity error.'
    rule_authority: best_practice
    sap_impact: 'Carrier feed would attempt to enrol the employee as their own dependent, which every carrier system rejects.'
    fix_map:
      __other__: 'Remove the employee''s own identifier from the dependent linkage via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: listed as their own dependent in DEPENDENT_LINK. Remove the self-reference.'
  - id: BEN148
    field: DEPENDENT.IS_BENEFICIARY
    check_class: cross_field_check
    fail_when: '(`DEPENDENT.IS_BENEFICIARY`.str.lower() == ''true'') & (`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == ''child'') & ((@today - `DEPENDENT.DEPENDENT_BIRTH`).dt.days < 6570)'
    require_populated: true
    severity: low
    dimension: consistency
    message: 'A minor child dependent is designated as a plan beneficiary'
    why_it_matters: 'Naming a minor directly as a beneficiary can create legal and plan-administration complications (payouts to minors are often restricted). This is worth a review, not necessarily a correction.'
    rule_authority: best_practice
    sap_impact: 'A claim payable to this beneficiary may be held up by the carrier pending a guardian or trust arrangement.'
    fix_map:
      __blank__: 'Confirm the beneficiary designation is handled per plan rules for minors via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: minor child designated as beneficiary. Confirm the designation follows plan rules for minors.'
  - id: BEN149
    field: BENEFITENROLLMENT.ENROL_DATE
    check_class: freshness_check
    max_age_hours: 43800
    applies_when:
      BENEFITENROLLMENT.STATUS:
      - T
    severity: low
    dimension: timeliness
    message: 'Terminated enrolment record has been sitting unreviewed for over five years'
    why_it_matters: 'Long-terminated enrolment records are candidates for archiving once past the required retention window. Surfacing them lets the benefits team confirm they are safe to archive.'
    rule_authority: best_practice
    sap_impact: 'Historical enrolment tables continue to grow with records that could be archived, slowing reporting over the full history.'
    fix_map:
      __blank__: 'Confirm the record is eligible for archiving via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: terminated enrolment unreviewed for over five years. Confirm it is eligible for archiving.'
  - id: BEN150
    field: DEPENDENT.RELATIONSHIP_TYPE
    check_class: uniqueness_check
    fields:
    - DEPENDENT.PERSON_ID
    - DEPENDENT.RELATIONSHIP_TYPE
    applies_when:
      DEPENDENT.RELATIONSHIP_TYPE:
      - spouse
      - domestic_partner
    severity: high
    dimension: uniqueness
    message: 'Employee has more than one active spouse or domestic partner dependent'
    why_it_matters: 'An employee should have at most one active spouse or domestic partner at a time. More than one such dependent usually means a prior relationship was never closed out when a new one was added.'
    rule_authority: best_practice
    sap_impact: 'Carrier feed receives two concurrent spouse-level dependents, which is typically rejected or results in duplicate coverage billing.'
    fix_map:
      __other__: 'Close out the superseded spouse or domestic partner dependent via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: more than one active spouse or domestic partner dependent. Close out the superseded one.'
  - id: BEN151
    field: BENEFITENROLLMENT.EMPLOYEE_COST
    check_class: cross_field_check
    fail_when: '(`USERACCOUNT.STATUS`.str.upper() == ''I'') & `BENEFITENROLLMENT.EMPLOYEE_COST`.notna() & (`BENEFITENROLLMENT.EMPLOYEE_COST` > 0)'
    require_populated: true
    severity: high
    dimension: consistency
    message: 'Employee is still being charged a benefit premium on an inactive user account'
    why_it_matters: 'An inactive user account means the employee is no longer an active employee in the system. A positive EMPLOYEE_COST still attached to that account means a premium deduction could still be in effect for someone who should no longer be charged.'
    rule_authority: best_practice
    sap_impact: 'Payroll may continue to deduct a premium from an employee who is no longer active, creating a refund liability once discovered.'
    fix_map:
      __other__: 'Terminate the enrolment and stop the premium deduction via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: inactive user account still charged a positive employee cost. Terminate the enrolment.'
  - id: BEN152
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & `BENEFITENROLLMENT.PLAN_TYPE`.isin([''MEDICAL'',''DENTAL'',''VISION'']) & `EMPEMPLOYMENT.JOB_END_DATE`.notna() & (`EMPEMPLOYMENT.JOB_END_DATE` < @today)'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Active health plan enrolment belongs to a job assignment that has already ended'
    why_it_matters: 'JOB_END_DATE marks when this specific job assignment closed, independent of the broader employment record. An active health plan tied to a job that has already ended is worth confirming against the employee''s current assignment.'
    rule_authority: best_practice
    sap_impact: 'Health coverage continues to be carried against a job assignment the system already considers closed.'
    fix_map:
      __other__: 'Confirm the employee''s current job assignment and update the enrolment via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: active health plan but job assignment ended on {EMPEMPLOYMENT.JOB_END_DATE}. Confirm the current assignment.'
  - id: BEN153
    field: BENEFITENROLLMENT.ENROL_DATE
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.ENROL_DATE`.notna() & `BENEFITENROLLMENT.EFFECTIVE_DATE`.notna() & ((`BENEFITENROLLMENT.ENROL_DATE` - `BENEFITENROLLMENT.EFFECTIVE_DATE`).dt.days > 90)'
    require_populated: true
    severity: low
    dimension: plausibility
    message: 'Enrolment was recorded more than 90 days after its own effective date'
    why_it_matters: 'ENROL_DATE is when the election was captured; EFFECTIVE_DATE is when coverage starts. An election recorded more than 90 days after coverage was already effective suggests a late, retroactive data entry rather than a timely election and is worth confirming with the benefits team.'
    rule_authority: best_practice
    sap_impact: 'Retroactive premium adjustments may be needed for the gap between the effective date and when the election was actually entered.'
    fix_map:
      __other__: 'Confirm the true election date and correct ENROL_DATE or EFFECTIVE_DATE via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment recorded on {BENEFITENROLLMENT.ENROL_DATE}, more than 90 days after the effective date {BENEFITENROLLMENT.EFFECTIVE_DATE}. Confirm the correct dates.'
  - id: BEN154
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''A'') & ((`BENEFITENROLLMENT.EFFECTIVE_DATE` - @today).dt.days > 30)'
    severity: low
    dimension: plausibility
    message: 'Enrolment is already marked active more than 30 days before its effective date'
    why_it_matters: 'A plan should not be reported as active (STATUS = A) until its EFFECTIVE_DATE has actually arrived. An enrolment flagged active more than 30 days ahead of that date suggests the status was set prematurely, before the coverage genuinely starts.'
    rule_authority: best_practice
    sap_impact: 'Benefit coverage and cost may be reported as in force for a period before it is actually effective.'
    fix_map:
      __other__: 'Confirm the effective date or hold the status as pending until it arrives via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: marked active but effective date {BENEFITENROLLMENT.EFFECTIVE_DATE} is more than 30 days away. Confirm the status.'
  - id: BEN155
    field: BENEFITENROLLMENT.STATUS
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.STATUS` == ''T'') & `BENEFITENROLLMENT.EFFECTIVE_DATE`.notna() & (`BENEFITENROLLMENT.EFFECTIVE_DATE` > @today)'
    require_populated: true
    severity: medium
    dimension: consistency
    message: 'Enrolment is terminated but its effective date is still in the future'
    why_it_matters: 'A plan cannot be terminated before it has even started. STATUS = T with an EFFECTIVE_DATE still ahead of today means either the termination was entered against the wrong record or the effective date was never corrected when the plan was cancelled.'
    rule_authority: best_practice
    sap_impact: 'Benefit cost and coverage history shows a plan ending before it began, which carrier feeds and cost reporting cannot reconcile.'
    fix_map:
      __other__: 'Confirm whether the enrolment was cancelled before it started and correct the dates via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: terminated enrolment has a future effective date {BENEFITENROLLMENT.EFFECTIVE_DATE}. Confirm and correct the dates.'
