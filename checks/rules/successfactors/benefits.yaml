module: benefits
target_state: SUCCESSFACTORS
rules:

  - id: BEN001
    field: BENEFITENROLLMENT.USERID
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "User ID is mandatory — orphaned enrolment cannot generate payroll deductions"
    why_it_matters: >-
      USERID links the benefit enrolment to a specific employee. Without it, the
      enrolment record is orphaned and payroll cannot generate the corresponding premium
      deduction. The employee may lose coverage without notice.
    rule_authority: best_practice
    sap_impact: >-
      Payroll deduction not generated. Benefit provider receives no premium. Employee
      coverage may lapse due to non-payment.
    fix_map:
      __blank__: >-
        Assign the correct employee USERID via Admin Center > Benefits > Enrolment
        Import. Cross-reference with the employee master to identify the correct person.
    record_fix_template: >-
      Enrolment {BENEFITENROLLMENT.USERID}: USERID is missing. Assign the correct
      employee ID via Admin Center > Benefits > Enrolment Import.

  - id: BEN002
    field: BENEFITENROLLMENT.PLAN_ID
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Plan ID is mandatory — identifies the specific benefit plan for deduction and coverage"
    why_it_matters: >-
      PLAN_ID maps the enrolment to a specific benefit plan which defines the premium
      amount, coverage rules, and provider. Without it, the system cannot determine what
      the employee is enrolled in or how much to deduct.
    rule_authority: best_practice
    sap_impact: >-
      Deduction amount unknown. Benefit coverage details cannot be determined. Employee
      benefit statement shows incomplete enrolment.
    fix_map:
      __blank__: >-
        Assign the correct plan ID from the benefits catalogue via Admin Center >
        Benefits > Enrolment Import. Verify against the employee's original election
        form.
    record_fix_template: >-
      Enrolment {BENEFITENROLLMENT.USERID}: PLAN_ID is missing. Assign correct plan via
      Admin Center > Benefits > Enrolment Import.


  - id: BEN004
    field: BENEFITENROLLMENT.ENROL_DATE
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Enrolment date determines when deductions start and coverage begins"
    why_it_matters: >-
      ENROL_DATE establishes the effective start of benefit coverage and triggers the
      first payroll deduction. Without it, the system cannot determine when to begin
      premium deductions or when coverage became active.
    rule_authority: best_practice
    sap_impact: >-
      Payroll deduction start date undefined. Benefit coverage effective date unknown.
      Retroactive deduction calculation impossible.
    fix_map:
      __blank__: >-
        Set the enrolment effective date via Admin Center > Benefits > Enrolment Import.
        Use the employee's original election date or hire date if enrolment was
        automatic. Format: YYYY-MM-DD.
    record_fix_template: >-
      Enrolment {BENEFITENROLLMENT.USERID}: ENROL_DATE is missing. Set enrolment date
      via Admin Center > Benefits > Enrolment Import. Format: YYYY-MM-DD.



  - id: BEN007
    field: BENEFITENROLLMENT.EMPLOYEE_COST
    check_class: null_check
    severity: medium
    dimension: completeness
    message: Employee cost is required for payroll deduction calculation
    why_it_matters: EMPLOYEE_COST is the amount deducted from the employee's pay each period for their benefit premium. A missing
      value causes payroll to deduct zero, meaning the employee receives free coverage while the employer absorbs the full cost.
    rule_authority: best_practice
    sap_impact: Payroll deducts zero for this benefit. Employer absorbs full premium cost. Benefit cost reporting understates
      employee contributions.
    fix_map:
      __blank__: Set the employee cost based on the plan's premium structure and the employee's coverage level. Update via Admin
        Center > Benefits > Enrolment Import. If cost is genuinely zero (employer-paid), enter 0 explicitly.
    record_fix_template: 'Enrolment {BENEFITENROLLMENT.USERID}: EMPLOYEE_COST is missing for plan {BENEFITENROLLMENT.PLAN_ID}.
      Set via Admin Center > Benefits > Enrolment Import.'

  - id: BEN008
    field: BENEFITENROLLMENT.EMPLOYER_COST
    check_class: null_check
    severity: low
    dimension: completeness
    message: Employer cost is required for total compensation reporting and budget forecasting
    why_it_matters: EMPLOYER_COST represents the company's contribution to the employee's benefit premium. It is a key component
      of total compensation calculations and budget forecasting. Missing values understate the total compensation package and
      produce inaccurate budget projections.
    rule_authority: best_practice
    sap_impact: Total compensation statements understate employer contribution. Budget forecasting for benefit costs is inaccurate.
      Cost-per-employee calculations are incomplete.
    fix_map:
      __blank__: Set the employer cost based on the plan's cost-sharing structure. Update via Admin Center > Benefits > Enrolment
        Import. If there is no employer contribution, enter 0 explicitly.
    record_fix_template: 'Enrolment {BENEFITENROLLMENT.USERID}: EMPLOYER_COST is missing for plan {BENEFITENROLLMENT.PLAN_ID}.
      Set via Admin Center > Benefits > Enrolment Import.'

  - id: BEN009
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Effective date is required for benefit change audit trail"
    why_it_matters: >-
      EFFECTIVE_DATE records when a benefit change (enrolment, coverage change,
      termination) takes effect. Without it, the benefit history timeline is broken and
      the system cannot determine which enrolment record is current.
    rule_authority: best_practice
    sap_impact: >-
      Benefit history timeline broken. Current enrolment cannot be determined. Audit
      trail for benefit changes is incomplete.
    fix_map:
      __blank__: >-
        Set the effective date to when the benefit change was approved or the enrolment
        began. Update via Admin Center > Benefits > Enrolment Import. Format: YYYY-MM-DD.
    record_fix_template: >-
      Enrolment {BENEFITENROLLMENT.USERID}: EFFECTIVE_DATE is missing. Set via Admin
      Center > Benefits > Enrolment Import. Format: YYYY-MM-DD.


  - id: BEN011
    field: BENEFITENROLLMENT.USERID
    check_class: uniqueness_check
    fields:
    - BENEFITENROLLMENT.USERID
    - BENEFITENROLLMENT.PLAN_ID
    - BENEFITENROLLMENT.EFFECTIVE_DATE
    severity: high
    dimension: uniqueness
    message: Duplicate benefit enrollment records per employee — review for over-enrollment
    why_it_matters: Duplicate enrollment records can cause double premium deductions, incorrect coverage levels, and carrier
      file errors.
    rule_authority: best_practice
    sap_impact: Payroll deducts premiums twice. Carrier feeds contain duplicate enrollments. Benefits cost reports are overstated.
    fix_map:
      __blank__: Review duplicate enrollments in Admin Center > Benefits. End-date or delete the incorrect enrollment. Verify
        carrier feed after correction.

  - id: BEN012
    field: BENEFITENROLLMENT.EMPLOYEE_COST
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.EMPLOYEE_COST` < 0'
    require_populated: true
    severity: medium
    dimension: validity
    message: Employee contribution must not be negative
    why_it_matters: The employee contribution is deducted through payroll. A negative contribution turns the deduction into
      a payment to the employee and understates the employee's share in carrier and cost reporting.
    rule_authority: best_practice
    sap_impact: Payroll pays the contribution to the employee instead of deducting it; benefit cost reporting wrong.
    fix_map:
      __blank__: Correct the employee contribution on the enrolment via Benefits Administration; refunds are handled as separate
        claims, not negative contributions.
    record_fix_template: 'Enrolment {BENEFITENROLLMENT.USERID}/{BENEFITENROLLMENT.PLAN_ID}: employee contribution {BENEFITENROLLMENT.EMPLOYEE_COST}
      is negative.'
  - id: BEN013
    field: BENEFITENROLLMENT.EMPLOYER_COST
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.EMPLOYER_COST` < 0'
    require_populated: true
    severity: medium
    dimension: validity
    message: Employer contribution must not be negative
    why_it_matters: A negative employer contribution reduces the recorded employer cost of the plan and, where the employer
      share is a taxable fringe benefit, the employee's taxable value.
    rule_authority: best_practice
    sap_impact: Employer benefit cost understated; taxable fringe-benefit value and carrier premium files wrong.
    fix_map:
      __blank__: Correct the employer contribution on the enrolment via Benefits Administration.
    record_fix_template: 'Enrolment {BENEFITENROLLMENT.USERID}/{BENEFITENROLLMENT.PLAN_ID}: employer contribution {BENEFITENROLLMENT.EMPLOYER_COST}
      is negative.'
  - id: BEN014
    field: BENEFITENROLLMENT.PLAN_TYPE
    check_class: null_check
    severity: high
    dimension: consistency
    message: Enrolment references a benefit whose type cannot be resolved (benefit missing or deleted)
    why_it_matters: Benefit type is mandatory on every Benefit object. An enrolment whose plan returns no benefit type points
      to a benefit that was deleted or never existed, so eligibility, contribution rules and the carrier feed cannot be determined
      for it.
    rule_authority: sap_hard_constraint
    sap_impact: Enrolment excluded from carrier files and benefit statements; payroll deduction has no plan rules behind it.
    fix_map:
      __blank__: Re-enrol the employee in an existing benefit via Benefits Administration, or restore the benefit definition
        in Manage Data > Benefit.
    record_fix_template: 'Enrolment {BENEFITENROLLMENT.USERID}: plan ''{BENEFITENROLLMENT.PLAN_ID}'' does not resolve to a
      benefit.'
    applies_when:
      BENEFITENROLLMENT.PLAN_ID:
        populated: true
  - id: BEN015
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.EFFECTIVE_DATE` < `EMPEMPLOYMENT.START_DATE`'
    require_populated: true
    severity: medium
    dimension: consistency
    message: Benefit enrolment takes effect before the employment started
    why_it_matters: Benefit coverage starts at or after the hire date. Coverage before hire is usually a typing error or a
      record copied from an earlier employment.
    rule_authority: best_practice
    sap_impact: The carrier is billed for coverage before hire; payroll may take deductions for periods the employee was
      not employed.
    fix_map:
      __other__: Correct the enrolment effective date to the hire date or the plan's eligibility date.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: plan {BENEFITENROLLMENT.PLAN_ID} from
      {BENEFITENROLLMENT.EFFECTIVE_DATE}, hired {EMPEMPLOYMENT.START_DATE}.'
  - id: BEN016
    field: BENEFITENROLLMENT.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.EFFECTIVE_DATE` > `EMPEMPLOYMENT.END_DATE`'
    require_populated: true
    severity: high
    dimension: consistency
    message: Benefit enrolment takes effect after the employment ended
    why_it_matters: A leaver should not start new benefit coverage (continuation cover such as COBRA is handled outside
      the active enrolment). An enrolment after the end date means the leaver was enrolled by mistake or the termination
      date is wrong.
    rule_authority: best_practice
    sap_impact: The company pays premiums for a leaver; carrier files report coverage that should not exist.
    fix_map:
      __other__: Cancel the enrolment and notify the carrier, or correct the termination date if the employee did not leave.
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: plan {BENEFITENROLLMENT.PLAN_ID} from
      {BENEFITENROLLMENT.EFFECTIVE_DATE}, employment ended {EMPEMPLOYMENT.END_DATE}.'
