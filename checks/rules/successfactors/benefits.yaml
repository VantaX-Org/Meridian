    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: errored enrolment still has a positive employer cost. Zero it out.'
  - id: BEN177
    field: BENEFITENROLLMENT.DEPENDENT_LINK
    check_class: cross_field_check
    fail_when: '(`BENEFITENROLLMENT.COVERAGE_LEVEL` == ''EMP_CHILD'') & `BENEFITENROLLMENT.DEPENDENT_LINK`.notna() & (`BENEFITENROLLMENT.DEPENDENT_LINK`.str.count('';'') > 0)'
    require_populated: true
    severity: low
    dimension: consistency
    message: 'Employee-plus-child coverage is linked to more than one dependent without a child count check'
    why_it_matters: 'EMP_CHILD coverage covers the employee plus any number of children, so multiple linked dependents is not inherently wrong — but it is worth flagging so the benefits team confirms every linked dependent is genuinely a child, not a spouse mistakenly included under this tier.'
    rule_authority: best_practice
    sap_impact: 'A spouse linked under an EMP_CHILD tier would be priced and covered incorrectly relative to the coverage the employee actually elected.'
    fix_map:
      __blank__: 'Confirm every linked dependent under this tier is a child via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: employee-plus-child coverage links multiple dependents. Confirm all are children.'
  - id: BEN178
    field: BENEFITENROLLMENT.ENROL_DATE
    check_class: cross_field_check
    fail_when: '`BENEFITENROLLMENT.ENROL_DATE`.notna() & `EMPEMPLOYMENT.CREATED_DATE`.notna() & (`BENEFITENROLLMENT.ENROL_DATE` < `EMPEMPLOYMENT.CREATED_DATE`)'
    require_populated: true
    severity: low
    dimension: accuracy
    message: 'Enrolment date predates the creation of the employee''s employment record'
    why_it_matters: 'An enrolment cannot genuinely have been elected before the employment record that it depends on even existed in the system. This usually means one of the two dates was back-dated incorrectly during migration.'
    rule_authority: best_practice
    sap_impact: 'Historical benefit timelines built from these two dates will show an impossible sequence of events.'
    fix_map:
      __other__: 'Reconcile the enrolment date against the employment record creation date via Admin Center > Benefits.'
    record_fix_template: 'Employee {BENEFITENROLLMENT.USERID}: enrolment date {BENEFITENROLLMENT.ENROL_DATE} predates the employment record creation date. Reconcile the dates.'
  - id: BEN179
    field: BENEFITENROLLMENT.EMPLOYER_COST
    check_class: null_check
    applies_when:
      BENEFITENROLLMENT.STATUS:
      - A
      BENEFITENROLLMENT.PLAN_TYPE:
      - MEDICAL
    severity: medium
    dimension: completeness
    message: 'Active MEDICAL enrolment has no employer cost value recorded'
    why_it_matters: 'Every active MEDICAL enrolment needs an EMPLOYER_COST value, even if it is legitimately zero. A missing (null) value is different from a verified zero and means the employer contribution was never loaded for this record.'
