  - id: BEN164
    field: DEPENDENT.DEPENDENT_BIRTH
    check_class: cross_field_check
    fail_when: '(`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == ''spouse'') & ((@today - `DEPENDENT.DEPENDENT_BIRTH`).dt.days < 5844)'
    require_populated: true
    severity: medium
    dimension: accuracy
    message: 'Spouse dependent''s recorded age is under 16 years'
    why_it_matters: 'A spouse dependent under 16 years is implausible and almost always reflects an incorrect date of birth rather than a genuine dependent of this type.'
    rule_authority: best_practice
    sap_impact: 'Age-banded dependent pricing for this relationship tier is calculated from an implausible age.'
    fix_map:
      __other__: 'Verify and correct the dependent''s date of birth via Admin Center > Benefits.'
    record_fix_template: 'Dependent of {DEPENDENT.PERSON_ID}: spouse dependent''s recorded age is under 16 years. Verify the date of birth.'
  - id: BEN165
    field: DEPENDENT.DEPENDENT_BIRTH
    check_class: cross_field_check
    fail_when: '(`DEPENDENT.RELATIONSHIP_TYPE`.str.lower() == ''domestic_partner'') & ((@today - `DEPENDENT.DEPENDENT_BIRTH`).dt.days < 5844)'
    require_populated: true
    severity: medium
    dimension: accuracy
