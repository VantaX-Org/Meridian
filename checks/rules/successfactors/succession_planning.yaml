module: succession_planning
target_state: SUCCESSFACTORS
rules:

  - id: SUC001
    field: SUCCESSIONCANDIDATE.NOMINEE_ID
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Nominee ID is mandatory — identifies the successor candidate in the plan"
    why_it_matters: >-
      NOMINEE_ID is the primary identifier linking a succession candidate to their
      employee record. Without it, the succession plan has an empty nominee slot, and
      talent review reports cannot be generated because the system cannot resolve who
      the candidate is.
    rule_authority: best_practice
    sap_impact: >-
      Succession plan shows empty nominee slot. Talent review reports fail to generate.
      Bench strength analytics exclude this candidate.
    fix_map:
      __blank__: >-
        Identify the intended nominee from the succession plan nomination history or HR
        records. Populate NOMINEE_ID with the correct employee ID from Employee Central.
    record_fix_template: >-
      Succession candidate for position {SUCCESSIONCANDIDATE.POSITION_ID}: NOMINEE_ID
      is missing. Identify the intended nominee and populate NOMINEE_ID.

  - id: SUC002
    field: SUCCESSIONCANDIDATE.POSITION_ID
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Position ID is mandatory — links nominee to the target role in the succession chart"
    why_it_matters: >-
      POSITION_ID links the nominee to the specific position they are being considered
      for. Without it, the nominee is not associated with any role in the succession
      chart, meaning bench strength cannot be calculated for that position.
    rule_authority: best_practice
    sap_impact: >-
      Succession chart shows empty nodes for this candidate. Bench strength reporting
      excludes the position. Talent review cannot display the candidate for the target
      role.
    fix_map:
      __blank__: >-
        Identify the target position from the succession plan configuration or the
        nominating manager's records. Populate POSITION_ID with the correct position
        code from the position management module.
    record_fix_template: >-
      Succession candidate {SUCCESSIONCANDIDATE.NOMINEE_ID}: POSITION_ID is missing.
      Assign the target position via the succession planning module.


  - id: SUC004
    field: SUCCESSIONCANDIDATE.RANKING
    check_class: null_check
    severity: low
    dimension: completeness
    message: Ranking is required to prioritise candidates for the same position
    why_it_matters: RANKING determines the order of preference among multiple nominees for the same position. Without it, the
      succession chart cannot indicate which candidate is the primary successor versus a backup, which is critical information
      for emergency succession scenarios.
    rule_authority: best_practice
    sap_impact: Succession chart shows unranked candidates. Priority order unknown for emergency succession. Talent review discussions
      lack prioritisation data.
    fix_map:
      __blank__: Assign a ranking (1 = primary successor, 2 = secondary, etc.) via the succession planning module. Rankings
        should be unique per position.
    record_fix_template: 'Succession candidate {SUCCESSIONCANDIDATE.NOMINEE_ID} for position {SUCCESSIONCANDIDATE.POSITION_ID}:
      RANKING is missing. Assign a priority ranking.'

  - id: SUC005
    field: SUCCESSIONCANDIDATE.NOMINATED_DATE
    check_class: null_check
    severity: medium
    dimension: completeness
    message: "Nomination date is required to track when the candidate was added to the plan"
    why_it_matters: >-
      NOMINATED_DATE provides the audit trail for when a succession candidate was
      identified. It is used to measure how long candidates have been in the pipeline
      and whether readiness assessments are being updated regularly. Stale nominations
      may indicate outdated succession plans.
    rule_authority: best_practice
    sap_impact: >-
      Succession plan freshness cannot be assessed. Audit trail for nomination is
      incomplete. Stale candidate detection is not possible.
    fix_map:
      __blank__: >-
        Set the nomination date to when the candidate was originally nominated. Update
        via the succession planning module. Format: YYYY-MM-DD.
    record_fix_template: >-
      Succession candidate {SUCCESSIONCANDIDATE.NOMINEE_ID} for position
      {SUCCESSIONCANDIDATE.POSITION_ID}: NOMINATED_DATE is missing. Set via succession
      planning module. Format: YYYY-MM-DD.



  - id: SUC008
    field: SUCCESSIONCANDIDATE.NOMINEE_ID
    check_class: regex_check
    pattern: "^[a-zA-Z0-9._@-]{1,100}$"
    severity: high
    dimension: validity
    message: "Nominee ID must contain only valid characters matching Employee Central USERID format"
    why_it_matters: >-
      NOMINEE_ID must match the USERID format in Employee Central for the succession
      plan to correctly link to the employee record. Invalid characters will prevent the
      join, causing the nominee to appear as an unknown candidate in talent reviews.
    rule_authority: best_practice
    sap_impact: >-
      Nominee cannot be resolved to an Employee Central record. Talent review shows
      unknown candidate. Development plan assignment fails.
    fix_map:
      __other__: >-
        Nominee ID '{invalid_value}' contains invalid characters. Must match Employee
        Central USERID format. Correct via the succession planning module.
    record_fix_template: >-
      Succession candidate {SUCCESSIONCANDIDATE.NOMINEE_ID}: NOMINEE_ID format invalid
      (value: {actual_value}). Correct to match Employee Central USERID format.


  - id: SUC010
    field: SUCCESSIONCANDIDATE.NOMINATED_DATE
    check_class: freshness_check
    max_age_hours: 17520
    severity: low
    dimension: timeliness
    message: "Succession nomination is older than 2 years — readiness assessment may be stale"
    why_it_matters: >-
      Succession nominations older than 2 years likely have outdated readiness
      assessments. The nominee's skills, role, and career aspirations may have changed
      significantly, making the succession plan unreliable for emergency use.
    rule_authority: best_practice
    sap_impact: >-
      Succession plan may be based on outdated information. Emergency succession may
      activate an unprepared or unwilling candidate. Talent review uses stale data.
    fix_map:
      __blank__: >-
        Review and update the succession nomination. Reassess readiness, risk of loss,
        and impact of loss. If the nominee is no longer suitable, replace with a current
        candidate. Update via the succession planning module.
    record_fix_template: >-
      Succession candidate {SUCCESSIONCANDIDATE.NOMINEE_ID} for position
      {SUCCESSIONCANDIDATE.POSITION_ID}: nomination is over 2 years old. Review and
      update readiness assessment.

  - id: SUC011
    field: SUCCESSIONCANDIDATE.NOMINEE_ID
    check_class: uniqueness_check
    fields: [SUCCESSIONCANDIDATE.NOMINEE_ID, SUCCESSIONCANDIDATE.POSITION_ID]
    severity: medium
    dimension: uniqueness
    message: Duplicate succession nominations detected — same nominee appears multiple times for same position
    why_it_matters: Duplicate nominations inflate the succession bench strength and distort readiness reporting. Each
      nominee should appear once per position.
    rule_authority: best_practice
    sap_impact: Bench strength reports are overstated. Talent review calibration is skewed. Development plan resources
      are wasted on duplicates.
    fix_map: {__blank__: Review duplicate nominations in Succession > Talent Pool. Remove the duplicate entry and
        verify readiness rating on the surviving record.}
    record_fix_template: "Nominee {SUCCESSIONCANDIDATE.NOMINEE_ID}: nominated more than once for position {SUCCESSIONCANDIDATE.POSITION_ID}. Remove the duplicate nomination."

  - id: SUC012
    field: SUCCESSIONCANDIDATE.RANKING
    check_class: cross_field_check
    fail_when: '`SUCCESSIONCANDIDATE.RANKING` < 0'
    require_populated: true
    severity: low
    dimension: validity
    message: Successor ranking must not be negative
    why_it_matters: The ranking orders the successors of a position on the succession org chart and in talent reports. A negative
      rank cannot be a position in that order and sorts the nominee ahead of the real first successor.
    rule_authority: best_practice
    sap_impact: Succession org chart and bench-strength reports show successors in the wrong order.
    fix_map:
      __blank__: Re-order the successors of the position on the succession org chart / Position Tile.
    record_fix_template: 'Nominee {SUCCESSIONCANDIDATE.NOMINEE_ID} for {SUCCESSIONCANDIDATE.POSITION_ID}: rank {SUCCESSIONCANDIDATE.RANKING}
      is negative.'
  - id: SUC013
    field: SUCCESSIONCANDIDATE.POSITION_ID
    check_class: exists_check
    target_table: POSITION
    target_fields:
    - CODE
    target_when:
      EFFECTIVE_STATUS:
      - A
    severity: medium
    dimension: consistency
    message: Successor is nominated for a position that is inactive or does not exist
    why_it_matters: Succession plans are built on positions. A nomination on an inactive or deleted position is left over
      from a reorganisation and no longer covers a real role.
    rule_authority: best_practice
    sap_impact: Succession org chart and bench-strength reports count nominations for roles that no longer exist, and the
      real successor positions look better covered than they are.
    fix_map:
      __other__: Move the nomination to the successor position in the Succession Org Chart, or remove it.
    record_fix_template: 'Nominee {SUCCESSIONCANDIDATE.NOMINEE_ID}: position {SUCCESSIONCANDIDATE.POSITION_ID} is not
      active.'
  - id: SUC014
    field: SUCCESSIONCANDIDATE.NOMINEE_ID
    check_class: exists_check
    target_table: EMPEMPLOYMENT
    target_fields:
    - USERID
    target_when:
      STATUS:
      - A
      - U
      - P
      - S
    severity: medium
    dimension: consistency
    message: Nominated successor is not an active employee
    why_it_matters: Only current employees can succeed into a role. A successor who has left still counts as cover in the
      plan, so the real risk to the position is hidden. External candidates are not employees and also fail; confirm before
      removing them.
    rule_authority: best_practice
    sap_impact: Bench-strength and readiness reports overstate cover; talent reviews discuss people who have left.
    fix_map:
      __other__: Remove the nomination in the Succession Org Chart and nominate an active employee.
    record_fix_template: 'Nominee {SUCCESSIONCANDIDATE.NOMINEE_ID} for position {SUCCESSIONCANDIDATE.POSITION_ID} is not an
      active employee.'
  - id: SUC015
    field: SUCCESSIONCANDIDATE.POSITION_ID
    check_class: regex_check
    pattern: ^\d{1,8}$
    severity: medium
    dimension: validity
    message: Succession position does not fit the 8 digits of the SAP object ID
    why_it_matters: The position is mapped to an HR object ID (HRP1000.OBJID, 8 digits).
    rule_authority: best_practice
    sap_impact: The succession link to the SAP position is lost in the replication.
    fix_map:
      __other__: Use a position code of at most 8 digits or add a mapping.
    record_fix_template: 'Succession nomination for position {SUCCESSIONCANDIDATE.POSITION_ID}: position does not fit the SAP object ID. Correct the nomination.'
  - id: SUC016
    field: SUCCESSIONCANDIDATE.NOMINATED_DATE
    check_class: cross_field_check
    fail_when: '`SUCCESSIONCANDIDATE.NOMINATED_DATE` > @today'
    severity: low
    dimension: validity
    message: Nomination date lies in the future
    why_it_matters: A nomination cannot be dated after today.
    rule_authority: best_practice
    sap_impact: Nomination ageing reports are wrong.
    fix_map:
      __other__: Correct the nomination date.
    record_fix_template: 'Succession nomination for position {SUCCESSIONCANDIDATE.POSITION_ID}: nomination date is in the future. Correct the date.'
  - id: SUC017
    field: SUCCESSIONCANDIDATE.NOMINEE_ID
    check_class: cross_field_check
    fail_when: '`EMPEMPLOYMENT.STATUS`.isin([''T'',''R''])'
    severity: high
    dimension: consistency
    message: Nominee has already left the company
    why_it_matters: A succession slate that names a terminated or retired employee leaves the position without a real successor.
    rule_authority: best_practice
    sap_impact: Succession coverage and bench strength are overstated.
    fix_map:
      __other__: Remove the nominee and nominate an active employee.
    record_fix_template: 'Succession nomination for position {SUCCESSIONCANDIDATE.POSITION_ID}: the nominee has left. Remove the nominee.'
