  severity: high
  dimension: consistency
  message: Tax treatment must exist in the picklist TAXTREATMENT
  why_it_matters: TAX_TREATMENT (Tax treatment) is a SuccessFactors picklist field (picklist TAXTREATMENT). Its permitted
    values are tenant configuration, so a value outside the configured set is not one the tenant's own system recognises.
  rule_authority: sap_hard_constraint
