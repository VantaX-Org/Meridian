  dimension: validity
  message: Service date lies in the future
  why_it_matters: The service date is the date from which length of service is counted (hire or recognised prior
    service, moved later by unpaid breaks). A date after today means a typing error in the year.
  rule_authority: best_practice
  sap_impact: Service awards, service-based leave entitlement and notice periods treat the employee as having no
    service.
  fix_map:
    __other__: Correct the service date in Employment Details.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: service date {EMPEMPLOYMENT.SERVICE_DATE} is in the future.'
- id: EC592
  field: EMPEMPLOYMENT.SERVICE_DATE
  check_class: cross_field_check
  fail_when: '`EMPEMPLOYMENT.SERVICE_DATE` > `EMPEMPLOYMENT.END_DATE`'
  severity: medium
  dimension: consistency
  message: Service date is after the employment end date
  why_it_matters: Service is counted from the service date until the employment ends. A service date after the termination
    date gives a negative length of service; one of the two dates was changed alone.
  rule_authority: best_practice
  sap_impact: Severance, long-service payouts and final leave entitlement are calculated on a negative service length.
  fix_map:
    __other__: Correct the service date or the termination date.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: service date {EMPEMPLOYMENT.SERVICE_DATE} is after the
    end date {EMPEMPLOYMENT.END_DATE}.'
- id: EC593
  field: EMPEMPLOYMENT.SENIORITY_DATE
  check_class: cross_field_check
  fail_when: '`EMPEMPLOYMENT.SENIORITY_DATE` > `EMPEMPLOYMENT.END_DATE`'
  severity: medium
  dimension: consistency
  message: Seniority date is after the employment end date
  why_it_matters: Seniority counts from the seniority date until the employment ends. A seniority date after the
    termination date gives negative seniority; one of the two dates was changed alone.
  rule_authority: best_practice
  sap_impact: Seniority-based severance and layoff ranking use a negative seniority for the leaver.
  fix_map:
    __other__: Correct the seniority date or the termination date.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: seniority date {EMPEMPLOYMENT.SENIORITY_DATE} is after
    the end date {EMPEMPLOYMENT.END_DATE}.'
- id: EC594
  field: EMPEMPLOYMENT.ORIGINAL_START_DATE
  check_class: cross_field_check
  fail_when: '`EMPEMPLOYMENT.ORIGINAL_START_DATE` <= `PERINFO.DATE_OF_BIRTH`'
  severity: high
  dimension: consistency
  message: Original start date is on or before the person's date of birth
  why_it_matters: Original start date marks the start of the person's working relationship with the company. It
    cannot fall on or before the day the person was born; the year was mistyped or a default date was loaded. The
    employment start date has its own check (EC059).
  rule_authority: best_practice
  sap_impact: Service and seniority based entitlements (leave, awards, severance, pension vesting) are calculated
    from an impossible date.
  fix_map:
    __other__: Correct the original start date from the employment history, or correct the date of birth from the
      identity document.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: original start date {EMPEMPLOYMENT.ORIGINAL_START_DATE}
    is on or before the date of birth.'
- id: EC595
  field: EMPEMPLOYMENT.SERVICE_DATE
  check_class: cross_field_check
  fail_when: '`EMPEMPLOYMENT.SERVICE_DATE` <= `PERINFO.DATE_OF_BIRTH`'
  severity: high
  dimension: consistency
  message: Service date is on or before the person's date of birth
  why_it_matters: Service date marks the start of the person's working relationship with the company. It cannot
    fall on or before the day the person was born; the year was mistyped or a default date was loaded. The employment
    start date has its own check (EC059).
  rule_authority: best_practice
  sap_impact: Service and seniority based entitlements (leave, awards, severance, pension vesting) are calculated
    from an impossible date.
  fix_map:
    __other__: Correct the service date from the employment history, or correct the date of birth from the identity
      document.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: service date {EMPEMPLOYMENT.SERVICE_DATE} is on or before
    the date of birth.'
- id: EC596
  field: EMPEMPLOYMENT.SENIORITY_DATE
  check_class: cross_field_check
  fail_when: '`EMPEMPLOYMENT.SENIORITY_DATE` <= `PERINFO.DATE_OF_BIRTH`'
  severity: high
  dimension: consistency
  message: Seniority date is on or before the person's date of birth
  why_it_matters: Seniority date marks the start of the person's working relationship with the company. It cannot
    fall on or before the day the person was born; the year was mistyped or a default date was loaded. The employment
    start date has its own check (EC059).
  rule_authority: best_practice
  sap_impact: Service and seniority based entitlements (leave, awards, severance, pension vesting) are calculated
    from an impossible date.
  fix_map:
    __other__: Correct the seniority date from the employment history, or correct the date of birth from the identity
      document.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: seniority date {EMPEMPLOYMENT.SENIORITY_DATE} is on or
    before the date of birth.'
- id: EC597
  field: EMPEMPLOYMENT.LAST_DATE_WORKED
  check_class: cross_field_check
  fail_when: '`EMPEMPLOYMENT.LAST_DATE_WORKED` < `EMPEMPLOYMENT.START_DATE`'
  severity: medium
  dimension: validity
  message: Last date worked is before the employment start date
  why_it_matters: The last date worked lies inside the employment, between the start and the end date. A date before
    the start date is a typing error in the termination.
  rule_authority: best_practice
  sap_impact: Final pay and leave payout are calculated for a negative working period.
  fix_map:
    __other__: Correct the last date worked in the termination details.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: last date worked {EMPEMPLOYMENT.LAST_DATE_WORKED} is before
    the start date {EMPEMPLOYMENT.START_DATE}.'
- id: EC598
  field: EMPEMPLOYMENT.PAYROLL_END_DATE
  check_class: cross_field_check
  fail_when: '`EMPEMPLOYMENT.PAYROLL_END_DATE` < `EMPEMPLOYMENT.START_DATE`'
  severity: medium
  dimension: validity
  message: Payroll end date is before the employment start date
  why_it_matters: Payroll runs from the start of the employment to the payroll end date. A payroll end date before
    the start date stops payroll before the first day of work.
  rule_authority: best_practice
  sap_impact: The employee is excluded from every payroll run; payroll (Employee Central Payroll) does not pay any
    period.
  fix_map:
    __other__: Correct the payroll end date in the termination details.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: payroll end date {EMPEMPLOYMENT.PAYROLL_END_DATE} is before
    the start date {EMPEMPLOYMENT.START_DATE}.'
- id: EC599
  field: EMPEMPLOYMENT.PAYROLL_END_DATE
  check_class: cross_field_check
  fail_when: '`EMPEMPLOYMENT.PAYROLL_END_DATE`.notna()'
  applies_when:
    EMPEMPLOYMENT.STATUS:
    - A
    - U
    - P
    - S
  severity: medium
  dimension: consistency
  message: Active employee has a payroll end date
  why_it_matters: The payroll end date is captured on termination. On an active employee it is a leftover of a cancelled
    termination or a rehire, and payroll stops paying the employee after that date.
  rule_authority: best_practice
  sap_impact: Payroll stops at the payroll end date although the employee still works; pay is missed from then on.
  fix_map:
    __other__: Clear the payroll end date, or complete the termination.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: active but has a payroll end date {EMPEMPLOYMENT.PAYROLL_END_DATE}.'
- id: EC600
  field: EMPEMPLOYMENT.END_DATE
  check_class: cross_field_check
  fail_when: '`EMPEMPLOYMENT.END_DATE` > `PERINFO.DATE_OF_DEATH`'
  severity: medium
  dimension: consistency
  message: Employment ends after the person's date of death
  why_it_matters: Employment ends at the latest on the date of death (termination with a death event reason). An
    end date after the date of death keeps the employment, payroll and benefits open for a deceased person.
  rule_authority: best_practice
  sap_impact: Pay, benefits and system access continue after death and must be recovered from the estate.
  fix_map:
    __other__: Verify the date of death and set the termination date to it, or remove a wrongly entered date of
      death.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: employment ends {EMPEMPLOYMENT.END_DATE}, after the recorded
    date of death.'
- id: EC601
  field: EMPEMPLOYMENT.OK_TO_REHIRE
  check_class: null_check
  applies_when:
    EMPEMPLOYMENT.STATUS:
    - T
  severity: medium
  dimension: completeness
  message: Terminated employee has no rehire eligibility recorded
  why_it_matters: The OK to rehire flag is captured on termination. SuccessFactors uses it to warn recruiters and
    HR when a former employee is rehired or applies again; blank means the decision was never recorded.
  rule_authority: best_practice
  sap_impact: A former employee who must not be rehired can be rehired without any warning.
  fix_map:
    __other__: Record whether the employee is eligible for rehire in the termination details.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: terminated without a rehire eligibility decision.'
- id: EC602
  field: EMPEMPLOYMENT.OK_TO_REHIRE
  check_class: cross_field_check
  fail_when: '`EMPEMPLOYMENT.OK_TO_REHIRE`.notna()'
  applies_when:
    EMPEMPLOYMENT.STATUS:
    - A
    - U
    - P
    - S
  severity: low
  dimension: consistency
  message: Active employee has a rehire eligibility flag
  why_it_matters: The OK to rehire flag belongs to the termination details. On an active employee it is a leftover
    of a cancelled termination and is carried forward into the next real termination unchecked.
  rule_authority: best_practice
  sap_impact: A later termination keeps the old rehire decision instead of a new one.
  fix_map:
    __other__: Clear the rehire flag, or complete the termination.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: active but has a rehire eligibility flag.'
- id: EC603
  field: EMPEMPLOYMENT.JOB_END_DATE
  check_class: cross_field_check
  fail_when: '`EMPEMPLOYMENT.JOB_END_DATE` < `EMPEMPLOYMENT.JOB_START_DATE`'
  severity: high
  dimension: validity
  message: Current job record ends before it starts
  why_it_matters: An EmpJob record is valid from its start date to its end date. An end date before the start date
    gives the record no valid day, so the employee has no job data for that slice.
  rule_authority: sap_hard_constraint
  sap_impact: Org, pay and time data for the employee resolve to no record; payroll replication and reports skip
    the employee.
  fix_map:
    __other__: Correct the job record dates in Job History.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: job record from {EMPEMPLOYMENT.JOB_START_DATE} ends on
    {EMPEMPLOYMENT.JOB_END_DATE}.'
- id: EC604
  field: EMPEMPLOYMENT.CREATED_DATE
  check_class: cross_field_check
  fail_when: '`EMPEMPLOYMENT.CREATED_DATE` > @today'
  severity: medium
  dimension: validity
  message: Employment record creation time lies in the future
  why_it_matters: createdDateTime is stamped by the system when the employment is saved. A future value means the
    record was loaded with a wrong audit date or a server clock was wrong.
  rule_authority: best_practice
  sap_impact: Audit trails, delta extraction and data-retention purges ordered by creation time handle the record
    wrongly.
  fix_map:
    __other__: Report the record to the SuccessFactors administrator; correct the source of the load.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: employment created on {EMPEMPLOYMENT.CREATED_DATE}, which
    is in the future.'
- id: EC605
  field: PERINFO.SECOND_NATIONALITY
  check_class: cross_field_check
  fail_when: '`PERINFO.SECOND_NATIONALITY` == `PERINFO.NATIONALITY`'
  severity: low
  dimension: consistency
  message: Second nationality is the same as the first nationality
  why_it_matters: The second nationality records an additional citizenship. Repeating the first nationality adds
    nothing and usually means the real second nationality was not entered.
  rule_authority: best_practice
  sap_impact: Work-permit and tax-treaty checks miss the person's real second citizenship.
  fix_map:
    __other__: Enter the real second nationality or clear the field.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: second nationality {PERINFO.SECOND_NATIONALITY} repeats the
    first nationality.'
- id: EC606
  field: PERINFO.PLACE_OF_BIRTH
  check_class: regex_check
  pattern: ^[^0-9]*$
  severity: low
  dimension: accuracy
  message: Place of birth contains digits
  why_it_matters: A place of birth is a town or city name. Digits mean a date, postal code or ID was typed into
    the field.
  rule_authority: best_practice
  sap_impact: Identity documents and statutory forms that print the place of birth (for example social insurance
    registration) carry a wrong value.
  fix_map:
    __other__: Correct the place of birth from the identity document.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: place of birth contains digits.'
- id: EC607
  field: PERINFO.COUNTRY_OF_BIRTH
  check_class: null_check
  applies_when:
    PERINFO.PLACE_OF_BIRTH:
      populated: true
  severity: low
  dimension: completeness
  message: Place of birth is recorded but the country of birth is blank
  why_it_matters: A place name alone is ambiguous (many towns share a name). Statutory registrations that ask for
    the place of birth also ask for its country.
  rule_authority: best_practice
  sap_impact: Social insurance and tax registrations that need the country of birth are returned for completion.
  fix_map:
    __other__: Enter the country of birth.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: place of birth recorded without a country of birth.'
- id: EC608
  field: PERINFO.MIDDLENAME
  check_class: regex_check
  pattern: ^[^0-9!@#$%^&*()_+=\[\]{};:"\\|<>/?~]*$
  severity: medium
  dimension: accuracy
  message: Middle name contains digits or symbols
  why_it_matters: 'Personal names contain letters, spaces, hyphens, apostrophes and periods. Digits or symbols such
    as @ # / mean an ID, an e-mail or a note was typed into the name field.'
  rule_authority: best_practice
  sap_impact: Letters, org charts and directory entries show the wrong name.
  fix_map:
    __other__: Correct the name and move any other information to its own field.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: middle name contains digits or symbols.'
- id: EC609
  field: PERINFO.MIDDLENAME
  check_class: regex_check
  pattern: ^(?!.*\s{2}).*$
  auto_fix:
    steps:
    - op: collapse_spaces
    - op: strip
    confidence: high
  severity: low
  dimension: validity
  message: Middle name contains repeated spaces
  why_it_matters: Double spaces inside a name come from concatenated legacy fields or copy-paste. Searches, duplicate
    checks and generated documents treat the name as different from the clean spelling.
  rule_authority: best_practice
  sap_impact: Duplicate-person detection misses the record; generated letters show the extra space.
  fix_map:
    __other__: Collapse the repeated spaces to one.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: middle name contains repeated spaces.'
- id: EC610
  field: PERINFO.PREFERRED_NAME
  check_class: regex_check
  pattern: ^[^0-9!@#$%^&*()_+=\[\]{};:"\\|<>/?~]*$
  severity: medium
  dimension: accuracy
  message: Preferred name contains digits or symbols
  why_it_matters: 'Personal names contain letters, spaces, hyphens, apostrophes and periods. Digits or symbols such
    as @ # / mean an ID, an e-mail or a note was typed into the name field.'
  rule_authority: best_practice
  sap_impact: Letters, org charts and directory entries show the wrong name.
  fix_map:
    __other__: Correct the name and move any other information to its own field.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: preferred name contains digits or symbols.'
- id: EC611
  field: PERINFO.PREFERRED_NAME
  check_class: regex_check
  pattern: ^(?!.*\s{2}).*$
  auto_fix:
    steps:
    - op: collapse_spaces
    - op: strip
    confidence: high
  severity: low
  dimension: validity
  message: Preferred name contains repeated spaces
  why_it_matters: Double spaces inside a name come from concatenated legacy fields or copy-paste. Searches, duplicate
    checks and generated documents treat the name as different from the clean spelling.
  rule_authority: best_practice
  sap_impact: Duplicate-person detection misses the record; generated letters show the extra space.
  fix_map:
    __other__: Collapse the repeated spaces to one.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: preferred name contains repeated spaces.'
- id: EC612
  field: PERINFO.MIDDLENAME
  check_class: cross_field_check
  fail_when: '`PERINFO.MIDDLENAME`.str.strip().str.lower().isin([''nmn'', ''nmi'', ''none'', ''n/a'', ''na'', ''-'',
    ''.'', ''unknown'', ''test'', ''xxx''])'
  severity: low
  dimension: accuracy
  message: Middle name is a placeholder (NMN, NMI, NONE, N/A ...)
  why_it_matters: Placeholders such as NMN (no middle name), NMI (no middle initial), NONE or a single dash are
    typed to get past a required field in a legacy system. In SuccessFactors the middle name is optional and is
    left blank when the person has none.
  rule_authority: best_practice
  sap_impact: Letters, payslips and tax certificates print the placeholder as part of the person's name.
  fix_map:
    __other__: Clear the middle name.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: middle name is a placeholder.'
- id: EC613
  field: PERINFO.PREFERRED_NAME
  check_class: cross_field_check
  fail_when: '`PERINFO.PREFERRED_NAME`.str.strip().str.lower().isin([''test'', ''dummy'', ''xxx'', ''unknown'',
    ''tbd'', ''n/a'', ''na'', ''none'', ''-'', ''.''])'
  severity: medium
  dimension: accuracy
  message: Preferred name is a placeholder (TEST, UNKNOWN, N/A ...)
  why_it_matters: The preferred name is the name shown in the people profile, org chart and e-mails. A placeholder
    is shown to everyone instead of the person's real name.
  rule_authority: best_practice
  sap_impact: The org chart, directory and notifications display the placeholder as the person's name.
  fix_map:
    __other__: Clear the preferred name or enter the name the person wants to be called.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: preferred name is a placeholder.'
- id: EC614
  field: PERINFO.PERSON_UUID
  check_class: uniqueness_check
  fields:
  - PERINFO.PERSON_UUID
  applies_when:
    PERINFO.PERSON_UUID:
      populated: true
  severity: high
  dimension: uniqueness
  message: Person UUID is shared by more than one person
  why_it_matters: perPersonUuid is the system-generated surrogate key of PerPerson and is unique per person. The
    same UUID on two person IDs means rows were copied between persons in a load or an integration mapped two people
    to one key.
  rule_authority: sap_hard_constraint
  sap_impact: Integrations keyed on the person UUID (Employee Central Payroll, identity provisioning) merge two
    people into one record.
  fix_map:
    __other__: Find which person the UUID really belongs to and have the SuccessFactors administrator correct the
      other person record.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: person UUID is also held by another person.'
- id: EC615
  field: PERADDRESS.ADDRESS_LINE2
  check_class: cross_field_check
  fail_when: '`PERADDRESS.ADDRESS_LINE2`.str.strip().str.lower() == `PERADDRESS.ADDRESS_LINE1`.str.strip().str.lower()'
  severity: low
  dimension: accuracy
  message: Address line 2 repeats address line 1
  why_it_matters: The second address line holds extra detail (building, floor, suburb). A copy of the first line
    prints the street twice on every letter and payslip.
  rule_authority: best_practice
  sap_impact: Printed address labels carry the street twice; postal address validation in payroll and benefits interfaces
    may reject the address.
  fix_map:
    __other__: Clear address line 2 or enter the real additional detail.
  record_fix_template: 'Person {PERADDRESS.PERSON_ID}: address line 2 repeats address line 1.'
- id: EC616
  field: PERADDRESS.ADDRESS_LINE2
  check_class: cross_field_check
  fail_when: '`PERADDRESS.ADDRESS_LINE2`.str.strip().str.lower() == `PERADDRESS.CITY`.str.strip().str.lower()'
  severity: low
  dimension: accuracy
  message: Address line 2 repeats the city
  why_it_matters: The city has its own field. Putting it again into address line 2 prints the city twice and is
    a sign of a legacy address mapped line by line into SuccessFactors.
  rule_authority: best_practice
  sap_impact: Printed address labels carry the city twice; address matching in downstream interfaces fails.
  fix_map:
    __other__: Clear address line 2 or enter the real additional detail.
  record_fix_template: 'Person {PERADDRESS.PERSON_ID}: address line 2 repeats the city.'
- id: EC617
  field: COMPINFO.USERID
  check_class: exists_check
  target_table: EMPEMPLOYMENT
  target_fields:
  - USERID
  severity: high
  dimension: consistency
  message: Compensation record belongs to a user with no employment
  why_it_matters: Compensation Information (EmpCompensation) hangs off an employment. A compensation row whose user
    ID has no EmpEmployment record is an orphan left by a deleted or mis-keyed employment or a migration that loaded
    pay before the hire.
  rule_authority: sap_hard_constraint
  sap_impact: The pay row is never replicated to payroll and distorts salary totals in compensation reporting.
  fix_map:
    __other__: Find the employment the pay belongs to and correct the user ID, or delete the orphaned compensation row.
  record_fix_template: 'Compensation row for user {COMPINFO.USERID} effective {COMPINFO.EFFECTIVE_DATE}: no employment
    exists for this user.'
- id: EC618
  field: COMPINFO.EFFECTIVE_DATE
  check_class: cross_field_check
  fail_when: '(`COMPINFO.EFFECTIVE_DATE` < `EMPEMPLOYMENT.START_DATE`) & (`EMPEMPLOYMENT.ORIGINAL_START_DATE`.isna()
    | (`COMPINFO.EFFECTIVE_DATE` < `EMPEMPLOYMENT.ORIGINAL_START_DATE`))'
  grain: COMPINFO
  severity: medium
  dimension: consistency
  message: Compensation takes effect before the employee was hired
  why_it_matters: Pay belongs to an employment and cannot take effect before the hire. The check uses the original
    start date when one is held, so pay kept from an earlier employment of a rehire is not flagged.
  rule_authority: best_practice
  sap_impact: Retroactive payroll may pay for days before the hire; salary history starts too early.
  fix_map:
    __other__: Move the compensation effective date to the hire date or later, or correct the hire date.
  record_fix_template: 'Employee {COMPINFO.USERID}: compensation effective {COMPINFO.EFFECTIVE_DATE} is before the
    hire date {EMPEMPLOYMENT.START_DATE}.'
- id: EC619
  field: COMPINFO.END_DATE
  check_class: cross_field_check
  fail_when: '`COMPINFO.END_DATE`.notna() & (`COMPINFO.END_DATE` < `COMPINFO.EFFECTIVE_DATE`)'
  severity: high
  dimension: validity
  message: Compensation record ends before it starts
  why_it_matters: An effective-dated compensation record must end on or after its own effective date. An end date
    before the start comes from a manual edit or a load that swapped the two dates.
  rule_authority: sap_hard_constraint
  sap_impact: The record has no valid period, so payroll replication and salary history skip or misplace it.
  fix_map:
    __other__: Correct the end date or the effective date so the period is valid.
  record_fix_template: 'Employee {COMPINFO.USERID}: compensation from {COMPINFO.EFFECTIVE_DATE} ends earlier, on
    {COMPINFO.END_DATE}.'
- id: EC620
  field: COMPINFO.PAYCOMP_END_DATE
  check_class: cross_field_check
  fail_when: '`COMPINFO.PAYCOMP_END_DATE`.notna() & (`COMPINFO.PAYCOMP_END_DATE` < `COMPINFO.EFFECTIVE_DATE_COMP`)'
  severity: high
  dimension: validity
  message: Recurring pay component ends before it starts
  why_it_matters: A recurring pay component (EmpPayCompRecurring) must end on or after its own start date. A reversed
    period means the component is either never paid or paid for a period that does not exist.
  rule_authority: sap_hard_constraint
  sap_impact: The pay component is dropped or mis-dated in the replication to payroll (infotype 0008).
  fix_map:
    __other__: Correct the pay component start or end date so the period is valid.
  record_fix_template: 'Employee {COMPINFO.USERID}: pay component {COMPINFO.PAY_TYPE} starts {COMPINFO.EFFECTIVE_DATE_COMP}
    but ends {COMPINFO.PAYCOMP_END_DATE}.'
- id: EC621
  field: COMPINFO.PAY_TYPE
  check_class: null_check
  applies_when:
    COMPINFO.SALARY:
      populated: true
  severity: high
  dimension: completeness
  message: Pay amount has no pay component
  why_it_matters: Every recurring amount is held against a pay component that says what the money is (base salary,
    allowance). An amount without a pay component cannot be classified, taxed or replicated.
  rule_authority: sap_hard_constraint
  sap_impact: Payroll replication cannot map the amount to a wage type, so the employee is under- or over-paid.
  fix_map:
    __blank__: Assign the pay component the amount belongs to.
  record_fix_template: 'Employee {COMPINFO.USERID}: compensation record effective {COMPINFO.EFFECTIVE_DATE} has
    no pay component.'
- id: EC622
  field: COMPINFO.CURRENCY
  check_class: regex_check
  pattern: ^[A-Z]{3}$
  severity: high
  dimension: validity
  message: Pay component currency is not a 3-letter ISO currency code
  why_it_matters: SuccessFactors currencies are ISO 4217 codes. Any other value cannot be converted or mapped to the
    payroll currency.
  rule_authority: sap_hard_constraint
  sap_impact: Currency conversion and payroll replication fail for the pay component.
  fix_map:
    __other__: Enter the ISO 4217 currency code of the pay component.
  record_fix_template: 'Employee {COMPINFO.USERID}: pay component {COMPINFO.PAY_TYPE} has currency {COMPINFO.CURRENCY}.'
- id: EC623
  field: COMPINFO.COMP_FREQUENCY
  check_class: null_check
  applies_when:
    COMPINFO.SALARY:
      populated: true
  severity: high
  dimension: completeness
  message: Pay amount has no frequency
  why_it_matters: The frequency says whether an amount is per year, month or hour. Without it the amount cannot be
    annualised or compared with the pay range.
  rule_authority: sap_hard_constraint
  sap_impact: Annual salary, compa-ratio and range penetration cannot be calculated; payroll cannot prorate the amount.
  fix_map:
    __blank__: Enter the frequency of the pay component.
  record_fix_template: 'Employee {COMPINFO.USERID}: pay component {COMPINFO.PAY_TYPE} amount has
    no frequency.'
- id: EC624
  field: COMPINFO.PAY_GROUP
  check_class: null_check
  applies_when:
    COMPINFO.PAYROLL_SYSTEM_ID:
      populated: true
  severity: high
  dimension: completeness
  message: Employee assigned to a payroll system has no pay group
  why_it_matters: The pay group decides which payroll run pays the employee. A payroll system without a pay group
    leaves the employee outside every run.
  rule_authority: best_practice
  sap_impact: The employee is replicated to payroll without a payroll area and is not paid.
  fix_map:
    __blank__: Assign the pay group for the employee's payroll system.
  record_fix_template: 'Employee {COMPINFO.USERID}: payroll system {COMPINFO.PAYROLL_SYSTEM_ID} but no pay group.'
- id: EC625
  field: COMPINFO.PAY_RANGE_MID
  check_class: cross_field_check
  fail_when: (`COMPINFO.PAY_RANGE_MID` < `COMPINFO.PAY_RANGE_MIN`) | (`COMPINFO.PAY_RANGE_MID` > `COMPINFO.PAY_RANGE_MAX`)
    | (`COMPINFO.PAY_RANGE_MIN` > `COMPINFO.PAY_RANGE_MAX`)
  severity: high
  dimension: validity
  message: Pay range minimum, midpoint and maximum are out of order
  why_it_matters: A pay range runs minimum up to midpoint up to maximum. Any other order breaks every measure built
    on the range.
  rule_authority: sap_hard_constraint
  sap_impact: Compa-ratio, range penetration and merit guidelines give wrong results for everyone in the range.
  fix_map:
    __other__: Correct the pay range in the pay range foundation object.
  record_fix_template: 'Employee {COMPINFO.USERID}: pay range min {COMPINFO.PAY_RANGE_MIN}, mid {COMPINFO.PAY_RANGE_MID},
    max {COMPINFO.PAY_RANGE_MAX} are out of order.'
- id: EC626
  field: COMPINFO.ANNUAL_SALARY
  check_class: cross_field_check
  fail_when: (`COMPINFO.PAY_RANGE_FREQUENCY` == 'ANN') & (`COMPINFO.PAY_RANGE_CURRENCY` == `COMPINFO.CURRENCY`) &
    ((`COMPINFO.ANNUAL_SALARY` < `COMPINFO.PAY_RANGE_MIN`) | (`COMPINFO.ANNUAL_SALARY` > `COMPINFO.PAY_RANGE_MAX`))
  severity: low
  dimension: consistency
  message: Annual salary lies outside the employee's pay range
  why_it_matters: Pay below the minimum or above the maximum is green- or red-circled pay that needs a reason. Only
    annual ranges in the same currency as the pay are compared, so no conversion is assumed.
  rule_authority: best_practice
  sap_impact: Merit guidelines give zero or catch-up increases; pay-equity reporting shows the employee as an outlier.
  fix_map:
    __other__: Review the salary or the pay grade, or record why the employee is outside the range.
  record_fix_template: 'Employee {COMPINFO.USERID}: annual salary {COMPINFO.ANNUAL_SALARY} is outside the range {COMPINFO.PAY_RANGE_MIN}
    to {COMPINFO.PAY_RANGE_MAX}.'
- id: EC627
  field: COMPINFO.COMPA_RATIO
  check_class: cross_field_check
  fail_when: (`COMPINFO.PAY_RANGE_FREQUENCY` == 'ANN') & (`COMPINFO.PAY_RANGE_CURRENCY` == `COMPINFO.CURRENCY`) &
    (`COMPINFO.PAY_RANGE_MID` > 0) & ((`COMPINFO.COMPA_RATIO` - `COMPINFO.ANNUAL_SALARY` / `COMPINFO.PAY_RANGE_MID`).abs()
    > 0.02)
  severity: medium
  dimension: accuracy
  message: Stored compa-ratio differs from annual salary over range midpoint by more than 0.02
  why_it_matters: Compa-ratio is annual salary divided by the pay range midpoint. Tolerance is 0.02 (absolute) to
    allow for rounding; a larger gap means the stored value was not recalculated. Only annual ranges in the pay currency
    are compared.
  rule_authority: best_practice
  sap_impact: Merit matrices and pay-equity analysis use a stale compa-ratio.
  fix_map:
    __other__: Recalculate the compa-ratio from the current annual salary and range midpoint.
  record_fix_template: 'Employee {COMPINFO.USERID}: compa-ratio {COMPINFO.COMPA_RATIO} but annual salary {COMPINFO.ANNUAL_SALARY}
    over midpoint {COMPINFO.PAY_RANGE_MID} gives a different value.'
- id: EC628
  field: COMPINFO.RANGE_PENETRATION
  check_class: cross_field_check
  fail_when: (`COMPINFO.PAY_RANGE_FREQUENCY` == 'ANN') & (`COMPINFO.PAY_RANGE_CURRENCY` == `COMPINFO.CURRENCY`) &
    (`COMPINFO.PAY_RANGE_MAX` > `COMPINFO.PAY_RANGE_MIN`) & (((`COMPINFO.ANNUAL_SALARY` - `COMPINFO.PAY_RANGE_MIN`)
    / (`COMPINFO.PAY_RANGE_MAX` - `COMPINFO.PAY_RANGE_MIN`) - `COMPINFO.RANGE_PENETRATION`).abs() > 0.02)
  severity: medium
  dimension: accuracy
  message: Stored range penetration differs from the recalculated position in range by more than 0.02
  why_it_matters: Range penetration is (annual salary - minimum) / (maximum - minimum), 0 at the minimum and 1 at
    the maximum. Tolerance is 0.02 (absolute) to allow for rounding; a larger gap means the stored value is stale.
    Only annual ranges in the pay currency are compared.
  rule_authority: best_practice
  sap_impact: Merit guidelines keyed on range position give the wrong increase.
  fix_map:
    __other__: Recalculate range penetration from the current annual salary and pay range.
  record_fix_template: 'Employee {COMPINFO.USERID}: range penetration {COMPINFO.RANGE_PENETRATION} does not match
    salary {COMPINFO.ANNUAL_SALARY} in range {COMPINFO.PAY_RANGE_MIN} to {COMPINFO.PAY_RANGE_MAX}.'
- id: EC629
  field: COMPINFO.EVENT_REASON
  check_class: exists_check
  target_table: FOEVENTREASON
  target_fields:
  - EXTERNAL_CODE
  severity: medium
  dimension: consistency
  message: Compensation change uses an event reason that does not exist
  why_it_matters: Every compensation change carries an event reason from the FOEventReason foundation object. A code
    that is not there was loaded from a legacy system or belongs to a deleted reason.
  rule_authority: sap_hard_constraint
  sap_impact: Pay-change reporting cannot classify the change and payroll replication cannot map the action reason.
  fix_map:
    __other__: Replace the event reason with a valid code from the event reason foundation object.
  record_fix_template: 'Employee {COMPINFO.USERID}: compensation effective {COMPINFO.EFFECTIVE_DATE} uses unknown
    event reason {COMPINFO.EVENT_REASON}.'
- id: EC630
  field: COMPINFO.PAY_SCALE_LEVEL
  check_class: cross_field_check
  fail_when: (`COMPINFO.PAY_SCALE_TYPE`.notna() | `COMPINFO.PAY_SCALE_AREA`.notna() | `COMPINFO.PAY_SCALE_LEVEL`.notna())
    & (`COMPINFO.PAY_SCALE_TYPE`.isna() | `COMPINFO.PAY_SCALE_AREA`.isna())
  severity: medium
  dimension: completeness
  message: Compensation pay scale is incomplete
  why_it_matters: Pay scale type and area are set together in SAP basic pay (infotype 0008, TRFAR and TRFGB), and
    a pay scale level needs both. A partial pay scale cannot be valued.
  rule_authority: sap_hard_constraint
  sap_impact: Infotype 0008 replication fails or the collective agreement amount cannot be read for the employee.
  fix_map:
    __other__: Complete the pay scale type and area, or clear the partial pay scale.
  record_fix_template: 'Employee {COMPINFO.USERID}: pay scale type {COMPINFO.PAY_SCALE_TYPE}, area {COMPINFO.PAY_SCALE_AREA},
    level {COMPINFO.PAY_SCALE_LEVEL} is incomplete.'
- id: EC631
  field: COMPINFO.PAY_GRADE_STATUS
  check_class: cross_field_check
  fail_when: '`COMPINFO.PAY_GRADE`.notna() & (`COMPINFO.PAY_GRADE_STATUS` == ''I'')'
  applies_when:
    EMPEMPLOYMENT.STATUS:
    - A
    - U
    - P
    - S
    COMPINFO.END_DATE:
      open_ended: true
  severity: medium
  dimension: consistency
  message: Current compensation of an active employee uses an inactive pay grade
  why_it_matters: Foundation objects are set inactive (status I) when they are retired. Current pay of an active employee
    that still points at a retired pay grade has not been moved to the replacement.
  rule_authority: best_practice
  sap_impact: The next compensation change fails validation; merit planning and payroll mapping use retired values.
  fix_map:
    __other__: Move the employee to the active pay grade that replaced the inactive one.
  record_fix_template: 'Employee {COMPINFO.USERID}: current pay uses inactive pay grade {COMPINFO.PAY_GRADE}.'
- id: EC632
  field: COMPINFO.PAY_COMPONENT_TYPE
  check_class: domain_value_check
  allowed_values:
  - AMOUNT
  - PERCENTAGE
  - NUMBER
  valid_values_with_labels:
    AMOUNT: Amount
    PERCENTAGE: Percentage
    NUMBER: Number
  severity: medium
  dimension: validity
  message: Pay component type is not amount, percentage or number
  why_it_matters: The pay component type says how the value is read. Any other value cannot be interpreted.
  rule_authority: sap_hard_constraint
  sap_impact: The pay component value cannot be annualised or replicated to payroll.
  fix_map:
    __other__: Correct the pay component type in the pay component foundation object.
  record_fix_template: 'Employee {COMPINFO.USERID}: pay component {COMPINFO.PAY_TYPE} has type {COMPINFO.PAY_COMPONENT_TYPE}.'
- id: EC633
  field: COMPINFO.PAY_COMPONENT_RECURRING
  check_class: cross_field_check
  fail_when: '`COMPINFO.PAY_COMPONENT_RECURRING`.str.lower() == ''false'''
  severity: medium
  dimension: consistency
  message: Non-recurring pay component is held as recurring pay
  why_it_matters: Compensation Information holds recurring pay components. A component defined as non-recurring belongs
    in spot bonus or one-time payments, not in recurring pay.
  rule_authority: sap_hard_constraint
  sap_impact: A one-time payment is paid every period and inflates annual salary.
  fix_map:
    __other__: Remove the component from recurring pay and enter it as a one-time payment.
  record_fix_template: 'Employee {COMPINFO.USERID}: non-recurring pay component {COMPINFO.PAY_TYPE} is held as recurring
    pay.'
- id: EC634
  field: COMPINFO.PAY_COMPONENT_DEFAULT
  check_class: cross_field_check
  fail_when: (`COMPINFO.PAY_COMPONENT_CAN_OVERRIDE`.str.lower() == 'false') & (`COMPINFO.SALARY` != `COMPINFO.PAY_COMPONENT_DEFAULT`)
  require_populated: true
  severity: medium
  dimension: consistency
  message: Pay component amount was changed although its default may not be overridden
  why_it_matters: A pay component that cannot be overridden must carry its default value. A different amount came in
    through an import or API that bypassed the UI lock.
  rule_authority: best_practice
  sap_impact: The employee is paid a value the pay component configuration forbids.
  fix_map:
    __other__: Reset the amount to the pay component default, or allow overrides on the pay component if intended.
  record_fix_template: 'Employee {COMPINFO.USERID}: pay component {COMPINFO.PAY_TYPE} amount differs
    from fixed default {COMPINFO.PAY_COMPONENT_DEFAULT}.'
- id: EC635
  field: COMPINFO.ANNUALIZATION_FACTOR
  check_class: cross_field_check
  fail_when: '`COMPINFO.ANNUALIZATION_FACTOR` <= 0'
  severity: high
  dimension: validity
  message: Pay frequency annualisation factor is zero or negative
  why_it_matters: The annualisation factor is the number of pay periods per year of the frequency. Zero or a negative
    number makes every annual figure built on it zero or negative.
  rule_authority: sap_hard_constraint
  sap_impact: Annual salary, compa-ratio and range penetration are wrong for every employee paid at this frequency.
  fix_map:
    __other__: Correct the annualisation factor on the frequency foundation object.
  record_fix_template: 'Employee {COMPINFO.USERID}: frequency {COMPINFO.COMP_FREQUENCY} has annualisation factor {COMPINFO.ANNUALIZATION_FACTOR}.'
- id: EC636
  field: PAYMENTINFO.EFFECTIVE_DATE
  check_class: cross_field_check
  fail_when: '(`PAYMENTINFO.EFFECTIVE_DATE` < `EMPEMPLOYMENT.START_DATE`) & (`EMPEMPLOYMENT.ORIGINAL_START_DATE`.isna()
    | (`PAYMENTINFO.EFFECTIVE_DATE` < `EMPEMPLOYMENT.ORIGINAL_START_DATE`))'
  grain: PAYMENTINFO
  severity: low
  dimension: consistency
  message: Payment information takes effect before the employee was hired
  why_it_matters: Bank details are captured at or after hire. An earlier date points to a migration default date.
    The original start date is honoured when held, so bank details kept from a rehire's earlier employment are not
    flagged.
  rule_authority: best_practice
  sap_impact: Bank details replicated to payroll (infotype 0009) carry a validity start before the employment.
  fix_map:
    __other__: Move the payment information effective date to the hire date or later.
  record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment information effective {PAYMENTINFO.EFFECTIVE_DATE}
    is before the hire date {EMPEMPLOYMENT.START_DATE}.'
- id: EC637
  field: PAYMENTINFO.EXTERNAL_CODE
  check_class: null_check
  severity: high
  dimension: completeness
  message: Payment information detail has no external code
  why_it_matters: The external code is part of the key of a payment information detail. A detail without it cannot
    be updated or deleted through the API.
  rule_authority: sap_hard_constraint
  sap_impact: Upserts of bank details create duplicates instead of updating the record.
  fix_map:
    __blank__: Reload the payment information detail with its external code.
  record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment information effective {PAYMENTINFO.EFFECTIVE_DATE}
    has no external code.'
- id: EC638
  field: PAYMENTINFO.PAYMENT_METHOD
  check_class: cross_field_check
  fail_when: '`PAYMENTINFO.PAYMENT_METHOD`.isna() & (`PAYMENTINFO.IBAN`.notna() | `PAYMENTINFO.ACCOUNT_NUMBER`.notna())'
  severity: high
  dimension: completeness
  message: Bank account is held without a payment method
  why_it_matters: The payment method says how the employee is paid (bank transfer, cheque). Bank details without one
    cannot be used by payroll.
  rule_authority: sap_hard_constraint
  sap_impact: Bank details replicate to infotype 0009 without a payment method, so the payment run skips the employee.
  fix_map:
    __other__: Set the payment method on the payment information detail.
  record_fix_template: 'Employee {PAYMENTINFO.USERID}: bank account held without a payment method.'
- id: EC639
  field: PAYMENTINFO.CURRENCY
  check_class: regex_check
  pattern: ^[A-Z]{3}$
  severity: high
  dimension: validity
  message: Payment currency is not a 3-letter ISO currency code
  why_it_matters: The payment currency is an ISO 4217 code. Any other value cannot be mapped to the bank transfer
    currency.
  rule_authority: sap_hard_constraint
  sap_impact: Bank details replication or the payment run fails for the employee.
  fix_map:
    __other__: Enter the ISO 4217 currency code of the payment.
  record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment currency {PAYMENTINFO.CURRENCY} is not an ISO code.'
- id: EC640
  field: PERINFO.NATIONAL_ID_CARD_TYPE
  check_class: null_check
  applies_when:
    PERINFO.NATIONAL_ID:
      populated: true
  severity: high
  dimension: completeness
  message: National ID is held without a card type
  why_it_matters: The card type is part of the key of a national ID (PerNationalId) and says which document the number
    comes from. A number without it cannot be validated or reported.
  rule_authority: sap_hard_constraint
  sap_impact: National ID upserts fail or create duplicates; tax and social-security interfaces cannot pick the right
    number.
  fix_map:
    __blank__: Enter the card type of the national ID.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: national ID held without a card type.'
- id: EC641
  field: EMPEMPLOYMENT.SEQ_NUMBER
  check_class: exists_check
  fields:
  - EMPEMPLOYMENT.USERID
  - EMPEMPLOYMENT.JOB_START_DATE
  - EMPEMPLOYMENT.SEQ_NUMBER
  target_table: EMPJOBHIST
  target_fields:
  - USERID
  - START_DATE
  - SEQ_NUMBER
  severity: medium
  dimension: consistency
  message: Current job record is missing from job history
  why_it_matters: The current job record (start date and sequence number) is one row of the job history. If job history
    has no row with that start date and sequence number, the two were loaded or changed separately.
  rule_authority: best_practice
  sap_impact: Reports on current job and on job history disagree; the job record cannot be found by its key.
  fix_map:
    __other__: Reconcile the current job record with job history.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: current job from {EMPEMPLOYMENT.JOB_START_DATE} sequence {EMPEMPLOYMENT.SEQ_NUMBER}
    is not in job history.'
- id: EC642
  field: EMPEMPLOYMENT.PAY_GRADE
  check_class: cross_field_check
  fail_when: '`EMPJOBHIST.PAY_GRADE`.notna() & `EMPEMPLOYMENT.PAY_GRADE`.notna() & (`EMPJOBHIST.PAY_GRADE` != `EMPEMPLOYMENT.PAY_GRADE`)'
  grain: EMPJOBHIST
  applies_when:
    EMPJOBHIST.END_DATE:
      open_ended: true
    EMPEMPLOYMENT.STATUS:
    - A
    - U
    - P
    - S
  severity: medium
  dimension: consistency
  message: Current employment pay grade does not match the latest job history record
  why_it_matters: Compensation reads the pay grade of the current job to pick the pay range. A pay grade that differs
    from the latest job history row means pay is measured against the wrong range.
  rule_authority: best_practice
  sap_impact: Compa-ratio, range penetration and merit guidelines use the wrong pay range.
  fix_map:
    __other__: Reconcile the pay grade between the current employment record and the job history.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: current pay grade {EMPEMPLOYMENT.PAY_GRADE} differs from
    the latest job history record.'
- id: EC643
  field: COMPINFO.PAY_RANGE_STATUS
  check_class: cross_field_check
  fail_when: '`COMPINFO.PAY_RANGE_STATUS` == ''I'''
  applies_when:
    EMPEMPLOYMENT.STATUS:
    - A
    - U
    - P
    - S
    COMPINFO.END_DATE:
      open_ended: true
  severity: medium
  dimension: consistency
  message: Current compensation of an active employee uses an inactive pay range
  why_it_matters: Foundation objects are set inactive (status I) when they are retired. Current pay of an active employee
    that still points at a retired pay range is measured against minimum, midpoint and maximum values nobody maintains.
  rule_authority: best_practice
  sap_impact: Compa-ratio, range penetration and merit guidelines are calculated against a retired range.
  fix_map:
    __other__: Re-derive the pay range (grade, country, pay group) so the active range is picked up.
  record_fix_template: 'Employee {COMPINFO.USERID}: current pay uses an inactive pay range.'
- id: EC644
  field: COMPINFO.PAY_COMPONENT_STATUS
  check_class: cross_field_check
  fail_when: '`COMPINFO.PAY_COMPONENT_STATUS` == ''I'''
  applies_when:
    EMPEMPLOYMENT.STATUS:
    - A
    - U
    - P
    - S
    COMPINFO.END_DATE:
      open_ended: true
  severity: high
  dimension: consistency
  message: Current compensation of an active employee uses an inactive pay component
  why_it_matters: Foundation objects are set inactive (status I) when they are retired. A current pay component row of an
    active employee that still points at a retired pay component cannot be edited and is usually no longer mapped to a
    wage type.
  rule_authority: best_practice
  sap_impact: Replication to payroll fails because the pay component has no active wage type mapping.
  fix_map:
    __other__: Replace the inactive pay component with its successor in Compensation Information.
  record_fix_template: 'Employee {COMPINFO.USERID}: current pay component {COMPINFO.PAY_TYPE} is inactive.'
- id: EC645
  field: EMPJOBHIST.USERID
  check_class: exists_check
  target_table: EMPEMPLOYMENT
  target_fields:
  - USERID
  severity: high
  dimension: consistency
  message: Job history row belongs to an employee with no employment record
  why_it_matters: Every job information row hangs below an employment. A job row whose userId has no employment is an
    orphan left by a partial load, a deleted employment or a scoped extract, and no Employee Central screen can reach it.
  rule_authority: sap_hard_constraint
  sap_impact: The orphan row is invisible in the employee's job history but still counts in extracts, headcount history
    and migrations.
  fix_map:
    __other__: Restore the employment for this userId, or delete the orphan job row after review.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}, job row from {EMPJOBHIST.START_DATE}: no employment record exists.'
- id: EC646
  field: PERINFO.PERSON_ID
  check_class: exists_check
  target_table: EMPEMPLOYMENT
  target_fields:
  - PERSON_ID
  severity: medium
  dimension: consistency
  message: Person record has no employment at all
  why_it_matters: A person is created for an employee, so a person with no employment of any status is a stray left by
    a failed hire, a deleted employment or a partial load.
  rule_authority: best_practice
  sap_impact: The person still holds personal data with no employment to justify it, which inflates person counts and
    personal-data retention.
  fix_map:
    __other__: Create the missing employment, or delete the stray person record after review.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: no employment record exists.'
- id: EC647
  field: PERINFO.PERSON_ID
  check_class: exists_check
  target_table: PERADDRESS
  target_fields:
  - PERSON_ID
  applies_when:
    EMPEMPLOYMENT.STATUS:
    - A
    - U
    - P
    - S
  severity: medium
  dimension: completeness
  message: Active employee has no address
  why_it_matters: Payslips, tax certificates and statutory filings are addressed from the person's address. An active
    employee with no address row at all cannot be reached by post and fails statutory reporting.
  rule_authority: best_practice
  sap_impact: Year-end certificates and statutory returns for the employee are produced without an address or rejected.
  fix_map:
    __other__: Add the home address in Personal Information (Employee Central > Personal Information > Addresses).
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: person {PERINFO.PERSON_ID} has no address.'
- id: EC648
  field: EMPJOBHIST.MANAGER_ID
  check_class: exists_check
  target_table: EMPEMPLOYMENT
  target_fields:
  - USERID
  applies_when:
    EMPJOBHIST.MANAGER_ID:
      not_in:
      - NO_MANAGER
  severity: high
  dimension: consistency
  message: Job row names a manager who has no employment record
  why_it_matters: The job row drives approvals and the org chart. A manager userId that matches no employment cannot
    receive workflows, so the employee's approvals have nobody to route to.
  rule_authority: best_practice
  sap_impact: Leave, goal and pay-change approvals stall; the employee drops out of every manager's team view.
  fix_map:
    __other__: Assign an existing manager in Job Information (Take Action > Change Job and Compensation Info).
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: manager {EMPJOBHIST.MANAGER_ID} has no employment record.'
- id: EC649
  field: EMPJOBRELATIONSHIPS.RELATED_USER_ID
  check_class: exists_check
  target_table: EMPEMPLOYMENT
  target_fields:
  - USERID
  applies_when:
    EMPJOBRELATIONSHIPS.RELATED_USER_ID:
      populated: true
  severity: medium
  dimension: consistency
  message: Job relationship points at a user who has no employment record
  why_it_matters: Job relationships such as HR manager or matrix manager feed workflows and permission groups. A related
    userId that matches no employment leaves those workflows without a recipient.
  rule_authority: best_practice
  sap_impact: Workflows and role-based permissions that use the relationship route to a missing user.
  fix_map:
    __other__: Replace the related user in Job Relationships, or delete the relationship.
  record_fix_template: 'Employee {EMPJOBRELATIONSHIPS.USERID}: related user {EMPJOBRELATIONSHIPS.RELATED_USER_ID} has no
    employment record.'
- id: EC650
  field: EMPJOBRELATIONSHIPS.END_DATE
  check_class: null_check
  applies_when:
    EMPEMPLOYMENT.STATUS:
    - T
    - R
  severity: medium
  dimension: consistency
  message: Terminated employee still has an open job relationship
  why_it_matters: When the employment ends, the employee's job relationships must be ended too, otherwise the leaver
    still appears as someone's report or relation.
  rule_authority: best_practice
  sap_impact: The leaver stays on HR manager and matrix team lists and keeps receiving workflow items.
  fix_map:
    __blank__: End the job relationship on the employment end date.
  record_fix_template: 'Employee {EMPJOBRELATIONSHIPS.USERID}: relationship to {EMPJOBRELATIONSHIPS.RELATED_USER_ID} is
    still open although the employment ended.'
- id: EC651
  field: EMPJOBHIST.STATUS
  check_class: cross_field_check
  grain: EMPJOBHIST
  fail_when: '`EMPEMPLOYMENT.STATUS`.isin([''T'', ''R''])'
  applies_when:
    EMPJOBHIST.STATUS:
    - A
    - U
    - P
    - S
    EMPJOBHIST.END_DATE:
      open_ended: true
  severity: high
  dimension: consistency
  message: Employment is terminated but the latest job record still shows an active status
  why_it_matters: A termination sets the status on the employment and on its latest job row together. A leaver whose
    open job row is still active is a half-applied termination.
  rule_authority: best_practice
  sap_impact: Job-history based headcount and cost reports still count the leaver as active.
  fix_map:
    __other__: Re-run the termination so the latest job row carries the terminated status.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: employment is terminated but job row from {EMPJOBHIST.START_DATE} is
    still active.'
- id: EC652
  field: EMPEMPLOYMENT.USERID
  check_class: exists_check
  target_table: EMPJOBHIST
  target_fields:
  - USERID
  applies_when:
    EMPEMPLOYMENT.STATUS:
    - A
    - U
    - P
    - S
  severity: high
  dimension: completeness
  message: Active employment has no job history row
  why_it_matters: An employment is described by its job information rows. An active employee with none has no position,
    manager, department or pay group history to read.
  rule_authority: sap_hard_constraint
  sap_impact: Org charts, headcount history and payroll replication cannot place the employee.
  fix_map:
    __other__: Reload the job information for the employee, or correct the employment status.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: no job history row exists.'
