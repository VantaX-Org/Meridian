- field: FOCOMPANY.CURRENCY
  check_class: regex_check
  pattern: ^[A-Z]{3}$
  severity: medium
  dimension: validity
  message: Legal entity currency is not a 3-letter ISO currency code
  why_it_matters: SAP expects a 3-letter ISO 4217 currency code for the legal entity's default currency.
  rule_authority: sap_hard_constraint
  sap_impact: Replication to SAP company code configuration (T001) rejects a currency that is not a valid 3-letter
    code.
  fix_map:
    __other__: Correct the currency to a 3-letter ISO 4217 code.
  auto_fix:
    steps:
    - op: strip
    - op: upper
    confidence: medium
  record_fix_template: 'Legal entity {FOCOMPANY.EXTERNAL_CODE}: currency {FOCOMPANY.CURRENCY} is not a valid 3-letter
    code.'
  id: EC350
- field: FOCOMPANY.COUNTRY
  check_class: regex_check
  pattern: ^[A-Z]{3}$
  severity: medium
  dimension: validity
  message: Legal entity country is not a 3-letter ISO country code
  why_it_matters: The country drives statutory and tax configuration for the legal entity and must be a valid 3-letter
    code.
  rule_authority: best_practice
  sap_impact: Replication to SAP company code configuration (T001) rejects or mis-maps a country that is not a valid
    3-letter code.
  fix_map:
    __other__: Correct the country to a 3-letter ISO code.
  auto_fix:
    steps:
    - op: strip
    - op: upper
    confidence: medium
  record_fix_template: 'Legal entity {FOCOMPANY.EXTERNAL_CODE}: country {FOCOMPANY.COUNTRY} is not a valid 3-letter
    code.'
