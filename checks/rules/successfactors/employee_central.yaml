- field: EMPJOBRELATIONSHIPS.RELATIONSHIP_TYPE
  check_class: null_check
  severity: high
  dimension: completeness
  message: Job relationship record has no relationship type
  why_it_matters: The relationship type (e.g. matrix manager, HR partner) defines what the related user's role is
    to the employee.
