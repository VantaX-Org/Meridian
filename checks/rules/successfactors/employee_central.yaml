- id: HCM009
  field: PA0001.PLANS
  check_class: cross_field_check
  grain: PA0001
  fail_when: '`PA0001.PLANS` == ''99999999'''
  applies_when:
    PA0001.ENDDA:
    - '99991231'
    PA0000.STAT2:   # the leaving action moves a withdrawn employee to 99999999
      not_in:
      - '0'
  severity: medium
  dimension: consistency
  message: Employee sits on the default position 99999999
  why_it_matters: With organisational-management integration active, 99999999 is SAP's placeholder for 'no position'. An employee
    left there has no manager, no org unit and no job.
  rule_authority: best_practice
  sap_impact: Workflow approvals, ESS/MSS and org reporting skip the employee.
  fix_map:
    __other__: Assign the employee to a real position (PA40 organisational reassignment / PPOME).
  record_fix_template: 'Employee {PA0001.PERNR} ({PA0001.BEGDA}-{PA0001.ENDDA}): employee sits on the default position 99999999.'
