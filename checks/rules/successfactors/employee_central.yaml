  id: EC267
- field: EMPJOBHIST.HOLIDAY_CALENDAR
  check_class: null_check
  severity: low
  dimension: completeness
  applies_when:
    EMPJOBHIST.STATUS: *id002
  message: Active job history record has no holiday calendar
  why_it_matters: The holiday calendar drives which days are excluded from time evaluation for the period the record
    covers.
  rule_authority: best_practice
  sap_impact: Time evaluation for the historical period cannot exclude public holidays correctly, over- or under-counting
    expected hours.
  fix_map:
    __blank__: Set the holiday calendar on the job history record.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: job history record on {EMPJOBHIST.START_DATE} has no holiday
    calendar.'
  id: EC268
- field: EMPJOBHIST.TIME_TYPE_PROFILE
  check_class: null_check
  severity: low
  dimension: completeness
  applies_when:
    EMPJOBHIST.STATUS: *id002
  message: Active job history record has no time type profile
  why_it_matters: The time type profile drives which absence and attendance types are valid for the employee in
    the period.
  rule_authority: best_practice
  sap_impact: Time management for the historical period cannot validate absence and attendance entries against a
    profile.
  fix_map:
    __blank__: Set the time type profile on the job history record.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: job history record on {EMPJOBHIST.START_DATE} has no time
    type profile.'
  id: EC269
- field: EMPJOBHIST.TIMEZONE
  check_class: null_check
  severity: low
  dimension: completeness
  applies_when:
    EMPJOBHIST.STATUS: *id002
  message: Active job history record has no time zone
  why_it_matters: The time zone on the job record is used to localise time-stamped events (clock-in/out) for the
    period.
  rule_authority: best_practice
  sap_impact: Time events for the historical period are localised to the wrong zone, shifting reported clock times.
  fix_map:
    __blank__: Set the time zone on the job history record.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: job history record on {EMPJOBHIST.START_DATE} has no time
    zone.'
  id: EC270
  auto_fix:
    steps:
    - op: lookup
      table: FOLOCATION
      match:
        EXTERNAL_CODE: EMPJOBHIST.LOCATION
      value: TIMEZONE
    confidence: medium
- field: EMPJOBHIST.START_DATE
  check_class: interval_check
  group_by:
  - EMPJOBHIST.USERID
  start: EMPJOBHIST.START_DATE
  end: EMPJOBHIST.END_DATE
  open_ended: true
  severity: medium
  dimension: consistency
  message: Employee's job history does not end with an open-ended record
  why_it_matters: The current job history record for an active employee should have no end date (or a far-future
    end date) so it stays effective going forward.
  rule_authority: best_practice
  sap_impact: Replication infers the employee's current record closed on a specific date, which can make the employee
    appear terminated in SAP.
  fix_map:
    __other__: Clear the end date on the employee's most recent job history record, or extend it to the statutory
      far-future date.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: most recent job history record is not open-ended.'
  id: EC271
