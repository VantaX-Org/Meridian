- field: EMPJOBHIST.USERID
  check_class: uniqueness_check
  fields:
  - EMPJOBHIST.USERID
  - EMPJOBHIST.START_DATE
  - EMPJOBHIST.SEQ_NUMBER
  severity: high
  dimension: uniqueness
  message: Duplicate job history record for the same employee, date and sequence
  why_it_matters: The (userId, startDate, seqNumber) triple is the job history key. A duplicate means the same change
    was recorded twice or the sequence was not advanced.
  rule_authority: sap_hard_constraint
  sap_impact: Replication to SAP infotype 0000/0001 fails on the duplicate key or silently overwrites one of the
    records.
  fix_map:
    __other__: Remove the duplicate job history record, or correct the sequence number.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: duplicate job history record on {EMPJOBHIST.START_DATE}.'
  id: EC247
- field: EMPJOBHIST.MANAGER_ID
  check_class: exists_check
  target_table: EMPEMPLOYMENT
  target_fields:
  - USERID
  severity: high
  dimension: consistency
  message: Job history manager does not exist as an employee
  why_it_matters: The manager on a historical job record must be a real employee, so the historical reporting line
    can be reconstructed.
  rule_authority: best_practice
  sap_impact: Historical org-chart and headcount-under-manager reports cannot resolve the manager.
  fix_map:
    __other__: Correct the manager ID on the job history record, or add the manager as an employee.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: manager {EMPJOBHIST.MANAGER_ID} on {EMPJOBHIST.START_DATE}
    does not exist.'
  id: EC248
- field: EMPJOBHIST.MANAGER_ID
  check_class: hierarchy_check
  id_field: EMPJOBHIST.USERID
  max_depth: 50
  severity: medium
  dimension: consistency
  message: Job history reporting line contains a cycle
  why_it_matters: A manager chain that loops back on itself cannot be flattened into levels for org-chart or headcount
