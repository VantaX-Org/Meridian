  id: EC266
- field: EMPJOBHIST.WORK_SCHEDULE
  check_class: null_check
  severity: low
  dimension: completeness
  applies_when:
    EMPJOBHIST.STATUS: *id002
  message: Active job history record has no work schedule
  why_it_matters: The work schedule drives time evaluation (expected hours per day) for the period the record covers.
  rule_authority: best_practice
  sap_impact: Time evaluation for the historical period has no expected-hours baseline to compare clocked time against.
  fix_map:
    __blank__: Set the work schedule on the job history record.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: job history record on {EMPJOBHIST.START_DATE} has no work
