- field: EMPJOBHIST.EVENT_REASON
  check_class: cross_field_check
  fail_when: '`FOEVENTREASON.EMPL_STATUS`.notna() & (`EMPJOBHIST.STATUS` != `FOEVENTREASON.EMPL_STATUS`)'
  severity: medium
  dimension: consistency
  message: Job history employee status does not match the event reason's configured status
  why_it_matters: Each event reason is configured in SF to set a specific employee status. A mismatch means the
    wrong reason was picked, or the status was edited after the fact.
  rule_authority: best_practice
  sap_impact: Infotype 0000 (Actions) replicates with a status that does not match SAP's own mapping for the same
    reason, breaking status-based reports.
  fix_map:
    __other__: Pick the event reason that matches the recorded employee status, or correct the status.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: status {EMPJOBHIST.STATUS} on {EMPJOBHIST.START_DATE} does
    not match event reason {EMPJOBHIST.EVENT_REASON}.'
  id: EC258
- field: EMPJOBHIST.END_DATE
  check_class: cross_field_check
  fail_when: '`EMPJOBHIST.END_DATE`.notna() & (`EMPJOBHIST.END_DATE` == `EMPJOBHIST.START_DATE`)'
  severity: low
  dimension: validity
  message: Job history record has a zero-length effective period
  why_it_matters: An end date equal to the start date leaves no day on which the record is actually effective.
  rule_authority: best_practice
  sap_impact: The record cannot be mapped to a valid SAP infotype time slice; replication either rejects it or silently
    drops it.
  fix_map:
    __other__: Correct the end date so the record covers at least one day, or remove the record.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: job history record on {EMPJOBHIST.START_DATE} ends the same
    day it starts.'
  id: EC259
- field: EMPJOBHIST.FTE
  check_class: cross_field_check
  fail_when: '`EMPJOBHIST.FTE`.notna() & (`EMPJOBHIST.FTE` <= 0)'
  applies_when:
    EMPJOBHIST.STATUS: *id002
  severity: high
  dimension: validity
  message: Job history FTE is zero or negative for an active record
  why_it_matters: An active job record must carry a positive FTE; zero or negative FTE is not a valid headcount
    fraction.
  rule_authority: best_practice
  sap_impact: Headcount and FTE-based cost reports for the historical period undercount or produce negative FTE.
  fix_map:
    __other__: Correct the FTE on the job history record to a positive value.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: FTE on {EMPJOBHIST.START_DATE} is {EMPJOBHIST.FTE}.'
  id: EC260
- field: EMPJOBHIST.FTE
  check_class: cross_field_check
  fail_when: '`EMPJOBHIST.FTE`.notna() & (`EMPJOBHIST.FTE` > 1)'
  applies_when:
    EMPJOBHIST.STATUS: *id002
  severity: medium
  dimension: validity
  message: Job history FTE exceeds 1.0 for a single assignment
  why_it_matters: A single job assignment's FTE should not exceed full-time (1.0) unless the role is explicitly
    configured for overtime capacity.
  rule_authority: best_practice
  sap_impact: Headcount and FTE-based cost reports for the historical period overcount capacity.
  fix_map:
    __other__: Correct the FTE on the job history record, or split the assignment if more than full-time capacity
      is genuinely worked.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: FTE on {EMPJOBHIST.START_DATE} is {EMPJOBHIST.FTE}.'
  id: EC261
- field: EMPJOBHIST.STANDARD_HOURS
  check_class: cross_field_check
  fail_when: '`EMPJOBHIST.STANDARD_HOURS`.notna() & ((`EMPJOBHIST.STANDARD_HOURS` <= 0) | (`EMPJOBHIST.STANDARD_HOURS`
    > 168))'
  applies_when:
    EMPJOBHIST.STATUS: *id002
  severity: medium
  dimension: validity
  message: Job history standard hours are not a plausible weekly value
  why_it_matters: Standard weekly hours must be positive and cannot exceed the 168 hours in a week.
  rule_authority: best_practice
  sap_impact: Time and payroll calculations for the historical period use an implausible divisor.
  fix_map:
    __other__: Correct the standard hours on the job history record to a plausible weekly value.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: standard hours on {EMPJOBHIST.START_DATE} are {EMPJOBHIST.STANDARD_HOURS}.'
  id: EC262
- field: EMPJOBHIST.IS_FULLTIME
  check_class: cross_field_check
  fail_when: (`EMPJOBHIST.IS_FULLTIME`.str.lower() == 'true') & `EMPJOBHIST.FTE`.notna() & (`EMPJOBHIST.FTE` < 1)
  severity: medium
  dimension: consistency
  message: Job history record is flagged full-time but FTE is below 1.0
  why_it_matters: A full-time flag with a part-time FTE is contradictory and leads to inconsistent benefits and
    pay calculations for the period.
  rule_authority: best_practice
  sap_impact: Benefits eligibility and pay proration for the historical period are computed on contradictory inputs.
  fix_map:
    __other__: Set the full-time flag to match the FTE, or correct the FTE.
  auto_fix:
    steps:
    - op: set
      value: 'false'
    confidence: medium
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: full-time flag on {EMPJOBHIST.START_DATE} does not match FTE
    {EMPJOBHIST.FTE}.'
  id: EC263
- field: EMPJOBHIST.IS_FULLTIME
  check_class: cross_field_check
  fail_when: (`EMPJOBHIST.IS_FULLTIME`.str.lower() == 'false') & `EMPJOBHIST.FTE`.notna() & (`EMPJOBHIST.FTE` >= 1)
  severity: medium
  dimension: consistency
  message: Job history record is flagged part-time but FTE is 1.0 or more
  why_it_matters: A part-time flag with a full FTE is contradictory and leads to inconsistent benefits and pay calculations
    for the period.
  rule_authority: best_practice
  sap_impact: Benefits eligibility and pay proration for the historical period are computed on contradictory inputs.
  fix_map:
    __other__: Set the full-time flag to match the FTE, or correct the FTE.
  auto_fix:
    steps:
    - op: set
      value: 'true'
    confidence: medium
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: full-time flag on {EMPJOBHIST.START_DATE} does not match FTE
    {EMPJOBHIST.FTE}.'
  id: EC264
- field: EMPJOBHIST.PAY_GROUP
  check_class: null_check
  severity: medium
  dimension: completeness
  applies_when:
    EMPJOBHIST.STATUS: *id002
  message: Active job history record has no pay group
  why_it_matters: Pay group drives which payroll process picks up the employee for the period the record covers.
  rule_authority: best_practice
  sap_impact: Payroll for the historical period cannot determine which pay run should have included the employee.
  fix_map:
    __blank__: Set the pay group on the job history record.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: job history record on {EMPJOBHIST.START_DATE} has no pay group.'
  id: EC265
- field: EMPJOBHIST.EMPLOYEE_CLASS
