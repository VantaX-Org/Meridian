  why_it_matters: The hire date is required to identify and manage the login account.
  rule_authority: best_practice
  sap_impact: The login account cannot be provisioned or matched to its employee without a hire date.
  fix_map:
    __blank__: Set the hire date on the user account.
  record_fix_template: User account {USERACCOUNT.USER_ID} has no hire date.
  id: EC279
- field: USERACCOUNT.USERNAME
  grain: USERACCOUNT
  check_class: uniqueness_check
  fields:
  - USERACCOUNT.USERNAME
  severity: high
  dimension: uniqueness
  message: Duplicate login username across user accounts
  why_it_matters: Usernames must be unique; two accounts with the same username cannot both authenticate reliably.
  rule_authority: sap_hard_constraint
  sap_impact: SSO and provisioning cannot determine which account the username belongs to.
  fix_map:
    __other__: Make the username unique across all user accounts.
  record_fix_template: 'User account {USERACCOUNT.USER_ID}: username {USERACCOUNT.USERNAME} is used by more than
    one account.'
  id: EC280
- field: USERACCOUNT.EMAIL
  grain: USERACCOUNT
  check_class: uniqueness_check
  fields:
  - USERACCOUNT.EMAIL
  severity: medium
  dimension: uniqueness
  message: Duplicate email address across user accounts
  why_it_matters: A shared email address between two accounts means notifications and password resets cannot be
    reliably delivered to the right person.
  rule_authority: best_practice
  sap_impact: Password resets and system notifications may be delivered to or actioned by the wrong account holder.
  fix_map:
    __other__: Correct the email address so it is unique to one account.
  record_fix_template: 'User account {USERACCOUNT.USER_ID}: the email address on this account is used by more than one account.'
  id: EC281
- field: USERACCOUNT.USER_ID
  grain: USERACCOUNT
  check_class: uniqueness_check
  fields:
  - USERACCOUNT.USER_ID
  severity: critical
  dimension: uniqueness
  message: Duplicate user ID in the User extract
  why_it_matters: The user ID is the account's primary key; a duplicate means the extract contains two conflicting
    versions of the same account.
  rule_authority: sap_hard_constraint
  sap_impact: Downstream processing cannot determine which version of the account record is authoritative.
  fix_map:
    __other__: Remove or merge the duplicate user account record.
  record_fix_template: User account {USERACCOUNT.USER_ID} appears more than once in the extract.
  id: EC282
- field: USERACCOUNT.EMAIL
  grain: USERACCOUNT
  check_class: regex_check
  pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
  severity: medium
  dimension: validity
  message: User account email is not a valid email format
  why_it_matters: An invalid email format means notifications, password resets and SSO cannot reach the account
    holder.
  rule_authority: best_practice
  sap_impact: Automated account communications bounce or fail to send.
  fix_map:
    __other__: Correct the email address to a valid format.
  auto_fix:
    steps:
    - op: strip
    - op: lower
    confidence: low
  record_fix_template: 'User account {USERACCOUNT.USER_ID}: the email address on this account is not a valid format.'
  id: EC283
- field: USERACCOUNT.USERNAME
  grain: USERACCOUNT
  check_class: regex_check
  pattern: ^[A-Za-z0-9_.@-]+$
  severity: low
  dimension: validity
  message: User account username contains characters outside the supported login character set
  why_it_matters: Usernames with spaces or unsupported symbols can fail SSO or SAP user-ID mapping.
  rule_authority: best_practice
  sap_impact: SSO and SAP user mapping may reject the username or truncate it unpredictably.
  fix_map:
    __other__: Remove unsupported characters from the username.
  record_fix_template: 'User account {USERACCOUNT.USER_ID}: username {USERACCOUNT.USERNAME} contains unsupported
    characters.'
  id: EC284
- field: USERACCOUNT.DEFAULT_LOCALE
  grain: USERACCOUNT
  check_class: regex_check
  pattern: ^[a-z]{2}([_-][A-Z]{2})?$
  severity: low
  dimension: validity
  message: User account default locale is not a valid locale code
  why_it_matters: The default locale must be a language code (optionally with a country), e.g. en_US, to drive correct
    UI localisation.
  rule_authority: best_practice
  sap_impact: The UI and generated documents render in the wrong language or fail to localise dates and numbers.
  fix_map:
    __other__: Correct the default locale to a valid language or language_COUNTRY code.
  record_fix_template: 'User account {USERACCOUNT.USER_ID}: default locale {USERACCOUNT.DEFAULT_LOCALE} is not valid.'
  id: EC285
- field: USERACCOUNT.TIMEZONE
  grain: USERACCOUNT
  check_class: null_check
  severity: low
  dimension: completeness
  message: User account has no time zone
  why_it_matters: The account time zone is used to localise timestamps shown to the user and in notifications.
  rule_authority: best_practice
  sap_impact: Timestamps in the UI and notification emails are shown in the wrong time zone for the user.
  fix_map:
    __blank__: Set the time zone on the user account.
  record_fix_template: User account {USERACCOUNT.USER_ID} has no time zone.
  id: EC286
  auto_fix:
    when: '`EMPJOBHIST.TIMEZONE`.notna()'
    steps:
    - op: copy
      from: EMPJOBHIST.TIMEZONE
    confidence: medium
- field: USERACCOUNT.DEFAULT_LOCALE
  grain: USERACCOUNT
  check_class: null_check
  severity: low
  dimension: completeness
  message: User account has no default locale
  why_it_matters: Without a default locale the UI falls back to a system default that may not match the user's language.
  rule_authority: best_practice
  sap_impact: The UI renders in a default language that may not be the user's own.
  fix_map:
    __blank__: Set the default locale on the user account.
  record_fix_template: User account {USERACCOUNT.USER_ID} has no default locale.
  id: EC287
- field: USERACCOUNT.DEPARTMENT
  grain: USERACCOUNT
  check_class: exists_check
  target_table: FODEPARTMENT
  target_fields:
  - EXTERNAL_CODE
  target_when:
    STATUS:
    - A
  severity: low
  dimension: consistency
  message: User account department is not an active department
  why_it_matters: The department on the user account should match a real, active foundation object.
  rule_authority: best_practice
  sap_impact: Directory and org-chart listings for the user show an inactive or unknown department.
  fix_map:
    __other__: Correct the department on the user account.
  record_fix_template: 'User account {USERACCOUNT.USER_ID}: department {USERACCOUNT.DEPARTMENT} is not active.'
  id: EC288
- field: USERACCOUNT.DIVISION
  grain: USERACCOUNT
  check_class: exists_check
  target_table: FODIVISION
  target_fields:
  - EXTERNAL_CODE
  target_when:
    STATUS:
    - A
  severity: low
  dimension: consistency
  message: User account division is not an active division
  why_it_matters: The division on the user account should match a real, active foundation object.
  rule_authority: best_practice
  sap_impact: Directory and org-chart listings for the user show an inactive or unknown division.
  fix_map:
    __other__: Correct the division on the user account.
  record_fix_template: 'User account {USERACCOUNT.USER_ID}: division {USERACCOUNT.DIVISION} is not active.'
  id: EC289
- field: USERACCOUNT.LOCATION
  grain: USERACCOUNT
  check_class: exists_check
  target_table: FOLOCATION
  target_fields:
  - EXTERNAL_CODE
  target_when:
    STATUS:
    - A
  severity: low
  dimension: consistency
  message: User account location is not an active location
  why_it_matters: The location on the user account should match a real, active foundation object.
  rule_authority: best_practice
  sap_impact: Directory listings and location-based reports for the user show an inactive or unknown location.
  fix_map:
    __other__: Correct the location on the user account.
  record_fix_template: 'User account {USERACCOUNT.USER_ID}: location {USERACCOUNT.LOCATION} is not active.'
  id: EC290
- field: USERACCOUNT.USER_ID
  grain: USERACCOUNT
  check_class: exists_check
  target_table: EMPEMPLOYMENT
  target_fields:
  - USERID
  severity: high
  dimension: consistency
  message: User account has no employment record
  why_it_matters: Every user account should correspond to an employment record; an account with none is an orphan
    login with no HR record behind it.
  rule_authority: best_practice
  sap_impact: The account cannot be linked to payroll, time or benefits, since there is no employment to attach
    to.
  fix_map:
    __other__: Create the missing employment record for the user, or deactivate the orphan account.
  record_fix_template: User account {USERACCOUNT.USER_ID} has no corresponding employment record.
  id: EC291
- field: USERACCOUNT.EMP_ID
  grain: USERACCOUNT
  check_class: exists_check
  target_table: EMPEMPLOYMENT
  target_fields:
  - USERID
  severity: medium
  dimension: consistency
  message: User account's linked employee ID does not match a real employment record
  why_it_matters: The empId on the account should point at a real employment; a mismatch means the account and the
    employee record have drifted apart.
  rule_authority: best_practice
  sap_impact: Integrations keying off empId attach the account's data to the wrong employee or to no employee at
    all.
  fix_map:
    __other__: Correct the linked employee ID on the user account.
  record_fix_template: 'User account {USERACCOUNT.USER_ID}: linked employee {USERACCOUNT.EMP_ID} does not exist.'
  id: EC292
- field: USERACCOUNT.USER_ID
  grain: USERACCOUNT
  check_class: exists_check
  target_table: EMPEMPLOYMENT
  target_fields:
  - USERID
  target_when:
    STATUS: *id002
  applies_when:
    USERACCOUNT.STATUS:
    - A
  severity: high
  dimension: consistency
  message: Active user account has no active employment
  why_it_matters: A login account left active after the employee's last employment record was closed is a security
    and licensing exposure.
  rule_authority: best_practice
  sap_impact: A terminated employee retains an active login with access to SAP-connected systems.
  fix_map:
    __other__: Deactivate the user account, or correct the employment status if the employee is still active.
  record_fix_template: User account {USERACCOUNT.USER_ID} is active but has no active employment.
  id: EC293
- field: EMPEMPLOYMENT.USERID
  check_class: exists_check
  target_table: USERACCOUNT
  target_fields:
  - USER_ID
  applies_when:
    EMPEMPLOYMENT.STATUS: *id002
  severity: medium
  dimension: consistency
  message: Active employment has no user account
  why_it_matters: An active employee with no login account cannot use self-service, time entry or any SF-connected
    system.
  rule_authority: best_practice
  sap_impact: The employee cannot be provisioned into downstream systems that rely on the user account as the identity
    record.
  fix_map:
    __other__: Create the missing user account for the employee.
  record_fix_template: Employee {EMPEMPLOYMENT.USERID} is active but has no user account.
  id: EC294
- field: USERACCOUNT.HIRE_DATE
  grain: USERACCOUNT
  check_class: cross_field_check
  fail_when: '`USERACCOUNT.HIRE_DATE`.notna() & ((`USERACCOUNT.HIRE_DATE` - @today).dt.days > 400)'
  severity: low
  dimension: validity
  message: User account hire date is implausibly far in the future
  why_it_matters: A hire date far beyond any reasonable onboarding horizon usually signals a data entry error (wrong
    year, swapped day/month).
  rule_authority: best_practice
  sap_impact: Reports counting new hires by date include a record that will not actually be onboarded for over a
    year.
  fix_map:
    __other__: Correct the hire date on the user account.
  record_fix_template: 'User account {USERACCOUNT.USER_ID}: hire date {USERACCOUNT.HIRE_DATE} is implausibly far
    in the future.'
  id: EC295
- field: USERACCOUNT.FIRST_NAME
  grain: USERACCOUNT
  check_class: regex_check
  pattern: ^[^0-9]+$
  severity: low
  dimension: validity
  message: User account first name contains digits
  why_it_matters: A first name with digits usually indicates a data entry error or a placeholder value.
  rule_authority: best_practice
  sap_impact: Name fields with digits print incorrectly on official correspondence and ID badges.
  fix_map:
    __other__: Correct the first name so it contains no digits.
  record_fix_template: 'User account {USERACCOUNT.USER_ID}: first name {USERACCOUNT.FIRST_NAME} contains digits.'
  id: EC296
- field: USERACCOUNT.LAST_NAME
  grain: USERACCOUNT
  check_class: regex_check
  pattern: ^[^0-9]+$
  severity: low
  dimension: validity
  message: User account last name contains digits
  why_it_matters: A last name with digits usually indicates a data entry error or a placeholder value.
  rule_authority: best_practice
  sap_impact: Name fields with digits print incorrectly on official correspondence and ID badges.
  fix_map:
    __other__: Correct the last name so it contains no digits.
  record_fix_template: 'User account {USERACCOUNT.USER_ID}: last name {USERACCOUNT.LAST_NAME} contains digits.'
  id: EC297
- field: POSITION.CODE
  grain: POSITION
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Position has no code
  why_it_matters: The position code is the key that links incumbents, requisitions and the org chart to this position.
  rule_authority: sap_hard_constraint
  sap_impact: The position record cannot be loaded or linked to any employment.
  fix_map:
    __blank__: Set the position code.
  record_fix_template: Position record has no code.
  id: EC298
- field: POSITION.CODE
  grain: POSITION
  check_class: uniqueness_check
  fields:
  - POSITION.CODE
  severity: critical
  dimension: uniqueness
  message: Duplicate position code
  why_it_matters: The position code must be unique; a duplicate means two conflicting position records share the
    same key.
  rule_authority: sap_hard_constraint
  sap_impact: Replication to SAP HRP1000 fails on the duplicate object ID, or one record silently overwrites the
    other.
  fix_map:
    __other__: Remove or renumber the duplicate position record.
  record_fix_template: Position {POSITION.CODE} appears more than once in the extract.
  id: EC299
- field: POSITION.EFFECTIVE_STATUS
  grain: POSITION
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Position has no effective status
  why_it_matters: The effective status tells whether the position is active or retired as of its current record.
  rule_authority: best_practice
  sap_impact: Vacancy and headcount-by-position reports cannot tell whether the position should be counted.
  fix_map:
    __blank__: Set the effective status on the position.
  record_fix_template: Position {POSITION.CODE} has no effective status.
  id: EC300
- field: POSITION.CRITICALITY
  grain: POSITION
  check_class: null_check
  severity: low
  dimension: completeness
  applies_when:
    POSITION.EFFECTIVE_STATUS:
    - A
  message: Active position has no criticality rating
  why_it_matters: Criticality (key position indicator) drives succession-planning coverage targets.
  rule_authority: best_practice
  sap_impact: Succession planning cannot prioritise coverage for this position without a criticality rating.
  fix_map:
    __blank__: Set the criticality rating on the position.
  record_fix_template: Position {POSITION.CODE} is active but has no criticality rating.
  id: EC301
- field: POSITION.TARGET_FTE
  grain: POSITION
  check_class: cross_field_check
  fail_when: '`POSITION.TARGET_FTE`.notna() & (`POSITION.TARGET_FTE` <= 0)'
  applies_when:
    POSITION.EFFECTIVE_STATUS:
    - A
  severity: medium
  dimension: validity
  message: Active position has a target FTE of zero or less
  why_it_matters: An active position must plan for a positive FTE; zero or negative target capacity is not meaningful.
  rule_authority: best_practice
  sap_impact: Headcount planning and budget allocation for the position use an invalid capacity figure.
  fix_map:
    __other__: Correct the target FTE on the position to a positive value.
  record_fix_template: 'Position {POSITION.CODE}: target FTE is {POSITION.TARGET_FTE}.'
  id: EC302
- field: POSITION.TARGET_FTE
  grain: POSITION
  check_class: cross_field_check
  fail_when: (`POSITION.MULTIPLE_INCUMBENTS`.str.lower() != 'true') & `POSITION.TARGET_FTE`.notna() & (`POSITION.TARGET_FTE`
    > 1)
  applies_when:
    POSITION.EFFECTIVE_STATUS:
    - A
  severity: medium
  dimension: consistency
  message: Position targets more than one FTE but does not allow multiple incumbents
  why_it_matters: A target FTE above 1.0 implies more than one incumbent will fill the position, which requires
    the multiple-incumbents flag to be set.
  rule_authority: best_practice
  sap_impact: SF blocks hiring a second incumbent into the position, so planned headcount cannot actually be filled.
  fix_map:
    __other__: Enable multiple incumbents on the position, or lower the target FTE to 1.0 or less.
  auto_fix:
    steps:
    - op: set
      value: 'true'
    confidence: low
  record_fix_template: 'Position {POSITION.CODE}: target FTE {POSITION.TARGET_FTE} exceeds 1.0 without multiple
    incumbents allowed.'
  id: EC303
- field: POSITION.STANDARD_HOURS
  grain: POSITION
  check_class: cross_field_check
  fail_when: '`POSITION.STANDARD_HOURS`.notna() & ((`POSITION.STANDARD_HOURS` <= 0) | (`POSITION.STANDARD_HOURS`
    > 168))'
  severity: low
  dimension: validity
  message: Position standard hours are not a plausible weekly value
  why_it_matters: Standard weekly hours on a position must be positive and cannot exceed the 168 hours in a week.
  rule_authority: best_practice
  sap_impact: Time and headcount calculations driven by the position's standard hours use an implausible divisor.
  fix_map:
    __other__: Correct the standard hours on the position to a plausible weekly value.
  record_fix_template: 'Position {POSITION.CODE}: standard hours are {POSITION.STANDARD_HOURS}.'
  id: EC304
- field: POSITION.EFFECTIVE_END_DATE
  grain: POSITION
  check_class: cross_field_check
  fail_when: '`POSITION.EFFECTIVE_END_DATE`.notna() & (`POSITION.EFFECTIVE_END_DATE` < `POSITION.EFFECTIVE_START_DATE`)'
  severity: high
  dimension: validity
  message: Position record ends before it starts
  why_it_matters: The effective end date of a position record must not be earlier than its own start date.
  rule_authority: sap_hard_constraint
  sap_impact: Replication to SAP HRP1000 rejects the record; the validity period is not resolvable.
  fix_map:
    __other__: Correct the effective end date so it is on or after the effective start date.
  record_fix_template: 'Position {POSITION.CODE}: effective end date {POSITION.EFFECTIVE_END_DATE} is before start
    date {POSITION.EFFECTIVE_START_DATE}.'
  id: EC305
- field: POSITION.EFFECTIVE_START_DATE
  grain: POSITION
  check_class: interval_check
  group_by:
  - POSITION.CODE
  start: POSITION.EFFECTIVE_START_DATE
  end: POSITION.EFFECTIVE_END_DATE
  severity: medium
  dimension: consistency
  message: Position has overlapping effective-dated records
  why_it_matters: A position's own effective-dated records must not overlap; two records covering the same day make
    its attributes ambiguous on that day.
  rule_authority: best_practice
  sap_impact: Replication to SAP HRP1000 cannot determine which record's attributes apply on the overlapping day.
  fix_map:
    __other__: Correct the effective dates so the position's records do not overlap.
  record_fix_template: 'Position {POSITION.CODE}: effective-dated records overlap.'
  id: EC306
- field: POSITION.BUSINESS_UNIT
  grain: POSITION
  check_class: exists_check
  target_table: FOBUSINESSUNIT
  target_fields:
  - EXTERNAL_CODE
  target_when:
    STATUS:
    - A
  applies_when:
    POSITION.EFFECTIVE_STATUS:
    - A
  severity: medium
  dimension: consistency
  message: Active position is assigned to an inactive or unknown business unit
  why_it_matters: Positions default the business unit to their incumbents. A position on a retired business unit
    pushes the inactive value into every new hire and transfer.
  rule_authority: best_practice
  sap_impact: Hires and transfers into the position fail validation or inherit an inactive business unit.
  fix_map:
    __other__: Move the position to an active business unit.
  record_fix_template: 'Position {POSITION.CODE}: business unit {POSITION.BUSINESS_UNIT} is not active.'
  id: EC307
- field: POSITION.DIVISION
  grain: POSITION
  check_class: exists_check
  target_table: FODIVISION
  target_fields:
  - EXTERNAL_CODE
  target_when:
    STATUS:
    - A
  applies_when:
    POSITION.EFFECTIVE_STATUS:
    - A
  severity: medium
  dimension: consistency
  message: Active position is assigned to an inactive or unknown division
  why_it_matters: Positions default the division to their incumbents. A position on a retired division pushes the
    inactive value into every new hire and transfer.
  rule_authority: best_practice
  sap_impact: Hires and transfers into the position fail validation or inherit an inactive division.
  fix_map:
    __other__: Move the position to an active division.
  record_fix_template: 'Position {POSITION.CODE}: division {POSITION.DIVISION} is not active.'
  id: EC308
- field: POSITION.LOCATION
  grain: POSITION
  check_class: exists_check
  target_table: FOLOCATION
  target_fields:
  - EXTERNAL_CODE
  target_when:
    STATUS:
    - A
  applies_when:
    POSITION.EFFECTIVE_STATUS:
    - A
  severity: medium
  dimension: consistency
  message: Active position is assigned to an inactive or unknown location
  why_it_matters: Positions default the location to their incumbents. A position on a retired location pushes the
    inactive value into every new hire and transfer.
  rule_authority: best_practice
  sap_impact: Hires and transfers into the position fail validation or inherit an inactive location.
  fix_map:
    __other__: Move the position to an active location.
  record_fix_template: 'Position {POSITION.CODE}: location {POSITION.LOCATION} is not active.'
  id: EC309
- field: POSITION.DEPARTMENT
  grain: POSITION
  check_class: exists_check
  target_table: FODEPARTMENT
  target_fields:
  - EXTERNAL_CODE
  target_when:
    STATUS:
    - A
  applies_when:
    POSITION.EFFECTIVE_STATUS:
    - A
  severity: medium
  dimension: consistency
  message: Active position is assigned to an inactive or unknown department
  why_it_matters: Positions default the department to their incumbents. A position on a retired department pushes
    the inactive value into every new hire and transfer.
  rule_authority: best_practice
  sap_impact: Hires and transfers into the position fail validation or inherit an inactive department.
  fix_map:
    __other__: Move the position to an active department.
  record_fix_template: 'Position {POSITION.CODE}: department {POSITION.DEPARTMENT} is not active.'
  id: EC310
- field: POSITION.COST_CENTER
  grain: POSITION
  check_class: exists_check
  target_table: FOCOSTCENTER
  target_fields:
  - EXTERNAL_CODE
  target_when:
    STATUS:
    - A
  applies_when:
    POSITION.EFFECTIVE_STATUS:
    - A
  severity: medium
  dimension: consistency
  message: Active position is assigned to an inactive or unknown cost centre
  why_it_matters: Positions default the cost centre to their incumbents. A position on a retired cost centre pushes
    the inactive value into every new hire and transfer.
  rule_authority: best_practice
  sap_impact: Hires and transfers into the position fail validation or inherit an inactive cost centre.
  fix_map:
    __other__: Move the position to an active cost centre.
  record_fix_template: 'Position {POSITION.CODE}: cost centre {POSITION.COST_CENTER} is not active.'
  id: EC311
- field: POSITION.CODE
  grain: POSITION
  check_class: exists_check
  target_table: EMPEMPLOYMENT
  target_fields:
  - POSITION
  target_when:
    STATUS:
    - A
    - U
    - P
    - S
  applies_when:
    POSITION.EFFECTIVE_STATUS:
    - A
    POSITION.VACANT:
    - 'false'
  severity: low
  dimension: consistency
  message: Position is flagged not vacant but has no active incumbent
  why_it_matters: A position marked as filled should have at least one active employee currently assigned to it.
  rule_authority: best_practice
  sap_impact: Headcount-by-position reports show the position as filled while vacancy reports show it as not recruitable,
    giving conflicting counts.
  fix_map:
    __other__: Flag the position as vacant, or assign an active employee to it.
  record_fix_template: Position {POSITION.CODE} is flagged as filled but has no active incumbent.
  id: EC313
- field: POSITION.CODE
  grain: POSITION
  check_class: uniqueness_check
  fields:
  - POSITION.CODE
  - POSITION.EFFECTIVE_STATUS
  applies_when:
    POSITION.EFFECTIVE_STATUS:
    - A
    POSITION.MULTIPLE_INCUMBENTS:
      not_in:
      - 'true'
  severity: low
  dimension: uniqueness
  message: Position without multiple incumbents allowed has more than one active record
  why_it_matters: A single-incumbent position should carry exactly one active effective-dated record at a time,
    not several competing active rows.
  rule_authority: best_practice
  sap_impact: Reports picking an arbitrary active row for the position show inconsistent attributes depending on
    which row they pick.
  fix_map:
    __other__: Close or merge the duplicate active position record.
  record_fix_template: 'Position {POSITION.CODE}: more than one active record exists and multiple incumbents are
    not allowed.'
  id: EC314
- field: EMPJOBRELATIONSHIPS.USERID
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Job relationship record has no employee reference
  why_it_matters: Every relationship row must point at the employee it describes (e.g. matrix manager, HR partner).
  rule_authority: sap_hard_constraint
  sap_impact: The relationship record cannot be loaded or attributed to any employee.
  fix_map:
    __blank__: Set the employee (userId) on the job relationship record.
  record_fix_template: Job relationship record has no employee reference.
