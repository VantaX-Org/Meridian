  message: Employment percentage is not between 0 and 100
  why_it_matters: Employment percentage scales salary and leave entitlement for part-timers; it cannot be zero or above 100.
  rule_authority: sap_hard_constraint
  sap_impact: Part-time pay and leave quotas are wrong.
  fix_map:
