- id: HCM001
  field: PA0000.MASSN
  check_class: null_check
  grain: PA0000
  severity: high
  dimension: completeness
  message: Action type is missing
  why_it_matters: The action (hire, transfer, leave) explains every change of employment status.
  rule_authority: sap_hard_constraint
  sap_impact: Employment history cannot be reconstructed; status-driven processes (payroll, benefits) see no reason.
  fix_map:
    __blank__: Maintain action type in the infotype record (PA30, infotype 0000).
  record_fix_template: 'Employee {PA0000.PERNR} ({PA0000.BEGDA}-{PA0000.ENDDA}): action type is missing.'
- id: HCM002
  field: PA0000.MASSN
  check_class: referential_check
  grain: PA0000
  severity: high
  dimension: validity
  message: Action type is not defined in configuration (T529A)
  why_it_matters: Infotype values are checked against T529A on entry; a value that is not there was loaded around the check
    or its configuration was deleted afterwards.
  rule_authority: sap_hard_constraint
  sap_impact: Payroll, time evaluation and HR reporting cannot interpret the value; the employee drops out of every selection
    on it.
  fix_map:
    __other__: Replace the value with one defined in T529A, or configure it.
  record_fix_template: 'Employee {PA0000.PERNR} ({PA0000.BEGDA}-{PA0000.ENDDA}): action type is not defined in configuration
    (T529A).'
