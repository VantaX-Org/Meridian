- field: EMPJOBHIST.START_DATE
  check_class: cross_field_check
  fail_when: '`EMPJOBHIST.START_DATE`.notna() & ((`EMPJOBHIST.START_DATE` - @today).dt.days > 365)'
  severity: medium
  dimension: validity
  message: Job history record is dated more than a year in the future
  why_it_matters: A job history change should not be effective more than a year ahead; such a far future date is
    usually a data entry error.
  rule_authority: best_practice
  sap_impact: Forward-dated changes this far out distort upcoming headcount and payroll planning reports.
  fix_map:
    __other__: Correct the start date on the job history record.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: job history record starts {EMPJOBHIST.START_DATE}, more than
    a year in the future.'
  id: EC377
- field: EMPJOBHIST.SEQ_NUMBER
  check_class: cross_field_check
  fail_when: '`EMPJOBHIST.SEQ_NUMBER`.notna() & (`EMPJOBHIST.SEQ_NUMBER` < 0)'
  severity: medium
  dimension: validity
  message: Job history record has a negative sequence number
  why_it_matters: The sequence number orders same-day records and must not be negative.
  rule_authority: best_practice
  sap_impact: Same-day ordering during replication becomes unpredictable.
  fix_map:
    __other__: Correct the sequence number to a non-negative value.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: job history record on {EMPJOBHIST.START_DATE} has negative
    sequence number {EMPJOBHIST.SEQ_NUMBER}.'
  id: EC378
- field: EMPJOBHIST.START_DATE
  check_class: interval_check
  group_by:
  - EMPJOBHIST.USERID
  start: EMPJOBHIST.START_DATE
  end: EMPJOBHIST.END_DATE
  mode: continuous
  severity: high
  dimension: consistency
  message: Employee has a gap or overlap in job history coverage
  why_it_matters: An employee's job history records should form a continuous timeline with no gaps and no overlaps
    between consecutive assignments.
  rule_authority: sap_hard_constraint
  sap_impact: Replication to SAP infotype 0000/0001 produces inconsistent validity periods, and point-in-time reports
    for the gap period show no job data.
  fix_map:
    __other__: Close the gap or overlap between consecutive job history records.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: job history has a gap or overlap around {EMPJOBHIST.START_DATE}.'
  id: EC379
# EC380 DELETED (fix round 3, NEW-3): was `STATUS=='T' & EMPL_STATUS notna & !='T'`, an exact strict
# subset of EC258 (`EMPL_STATUS.notna() & STATUS != EMPL_STATUS`). Every EC380 finding was already an
# EC258 finding, double-counting the same defect. EC258 alone covers this. ID retired, never reused.
# EC381 DELETED (fix round 3, NEW-3): was `EMPL_STATUS=='A' & STATUS notna & STATUS!='A'`, also a strict
# subset of EC258 for the same reason. ID retired, never reused.
- field: EMPJOBHIST.EMPLOYMENT_TYPE
  check_class: null_check
  grain: EMPJOBHIST
  applies_when:
    EMPJOBHIST.STATUS:
      not_in: *id002
  message: Job history record has no employment type
  severity: medium
  dimension: completeness
  why_it_matters: The employment type (e.g. full-time, part-time, contingent) is needed to classify the employee's
    contract. Scoped to statuses outside A/U/P/S (EC245 already covers those) to avoid double-flagging the same
    record under two rules.
  rule_authority: best_practice
  sap_impact: Replication to SAP infotype 0001 (org assignment) and headcount-by-contract-type reporting cannot
    classify the employee.
  fix_map:
    __blank__: Set the employment type on the job history record.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: job history record on {EMPJOBHIST.START_DATE} has no employment
    type.'
  id: EC383
- field: EMPJOBHIST.COUNTRY_OF_COMPANY
  check_class: null_check
  grain: EMPJOBHIST
  applies_when:
    EMPJOBHIST.STATUS: *id003
  message: Active job history record has no country of company
  severity: medium
  dimension: completeness
  why_it_matters: The country of the employing company drives statutory, tax and localisation rules for the employment.
  rule_authority: best_practice
  sap_impact: Country-specific infotype replication and statutory reporting cannot determine which country's rules
    apply.
  fix_map:
    __blank__: Set the country of company on the job history record.
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: active job history record has no country of company.'
  id: EC384
  auto_fix:
    steps:
    - op: lookup
      table: FOCOMPANY
      match:
        EXTERNAL_CODE: EMPJOBHIST.COMPANY
      value: COUNTRY
    confidence: high
- field: EMPJOBHIST.COUNTRY_OF_COMPANY
  check_class: regex_check
  pattern: ^[A-Z]{3}$
  severity: low
  dimension: validity
  message: Country of company is not a 3-letter ISO country code
  why_it_matters: The country of company must be a valid 3-letter ISO code for downstream localisation logic to
    apply correctly.
  rule_authority: best_practice
  sap_impact: Country-specific infotype replication cannot map an invalid country code to SAP's T005 country table.
  fix_map:
    __other__: Correct the country of company to a 3-letter ISO code.
  auto_fix:
    steps:
    - op: strip
    - op: upper
    confidence: medium
  record_fix_template: 'Employee {EMPJOBHIST.USERID}: country of company {EMPJOBHIST.COUNTRY_OF_COMPANY} is not
    a valid 3-letter code.'
  id: EC385
- field: EMPJOBHIST.EVENT
  check_class: exists_check
  target_table: FOEVENTREASON
  target_fields:
  - EVENT
  severity: low
  dimension: consistency
  message: Job history event has no corresponding configured event reason set
  why_it_matters: Every event used on a job history record should be configured with at least one event reason in
    Foundation Objects.
  rule_authority: best_practice
  sap_impact: Action-type reporting that groups by event cannot find a matching configured reason for this event.
