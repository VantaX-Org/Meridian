    - IRL
  severity: medium
  dimension: validity
  message: IRL postal code is not an Eircode (A65 F4E2)
  why_it_matters: Postal codes in IRL are an Eircode (A65 F4E2). Other values do not pass postal validation and cannot be
    used for tax-jurisdiction or region lookups.
  rule_authority: sap_hard_constraint
  sap_impact: Mail is undeliverable; regional tax and statutory reporting by postal code fail.
  fix_map:
