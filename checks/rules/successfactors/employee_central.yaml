- id: EC166
  field: PERADDRESS.ZIPCODE
  check_class: regex_check
  pattern: ^([AC-FHKNPRTV-Y]\d{2}|D6W) ?[0-9AC-FHKNPRTV-Y]{4}$
  applies_when:
