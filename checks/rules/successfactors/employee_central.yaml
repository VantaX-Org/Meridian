- field: EMPJOBRELATIONSHIPS.USERID
  check_class: uniqueness_check
  fields:
  - EMPJOBRELATIONSHIPS.USERID
  - EMPJOBRELATIONSHIPS.RELATIONSHIP_TYPE
  - EMPJOBRELATIONSHIPS.START_DATE
  severity: medium
  dimension: uniqueness
  message: Duplicate job relationship record for the same employee, type and start date
  why_it_matters: The (userId, relationshipType, startDate) triple is the relationship's key. A duplicate means
    the same relationship was recorded twice.
  rule_authority: sap_hard_constraint
  sap_impact: Replication fails on the duplicate key, or one of the records silently overwrites the other.
  fix_map:
    __other__: Remove the duplicate job relationship record.
  record_fix_template: 'Employee {EMPJOBRELATIONSHIPS.USERID}: duplicate job relationship record of type {EMPJOBRELATIONSHIPS.RELATIONSHIP_TYPE}
    starting {EMPJOBRELATIONSHIPS.START_DATE}.'
  id: EC321
- field: EMPJOBRELATIONSHIPS.END_DATE
  check_class: cross_field_check
  fail_when: '`EMPJOBRELATIONSHIPS.END_DATE`.notna() & (`EMPJOBRELATIONSHIPS.END_DATE` < `EMPJOBRELATIONSHIPS.START_DATE`)'
  severity: high
  dimension: validity
  message: Job relationship record ends before it starts
  why_it_matters: The end date of a relationship must not be earlier than its own start date.
  rule_authority: sap_hard_constraint
  sap_impact: The relationship's validity period is not resolvable; replication rejects or mishandles the record.
  fix_map:
    __other__: Correct the end date so it is on or after the start date.
  record_fix_template: 'Employee {EMPJOBRELATIONSHIPS.USERID}: relationship ends {EMPJOBRELATIONSHIPS.END_DATE}
    before it starts {EMPJOBRELATIONSHIPS.START_DATE}.'
  id: EC322
