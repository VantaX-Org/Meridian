    - op: strip
    - op: regex_replace
      pattern: ^(\d{2})\s*(\d{3})$
      repl: \1-\2
    confidence: high
- id: EC165
  field: PERADDRESS.ZIPCODE
  check_class: regex_check
  pattern: ^\d{4}-\d{3}$
  applies_when:
    PERADDRESS.COUNTRY:
    - PRT
  severity: medium
  dimension: validity
  message: PRT postal code is not NNNN-NNN
  why_it_matters: Postal codes in PRT are NNNN-NNN. Other values do not pass postal validation and cannot be used for tax-jurisdiction
