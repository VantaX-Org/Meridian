  rule_authority: best_practice
  sap_impact: The replication or migration load rejects the record or links it to the wrong object in the SAP system.
  fix_map:
    __other__: Change the value in Employee Central so that it fits an 8-digit object ID (HRP1000.OBJID), or add
      a conversion in the integration mapping.
  record_fix_template: 'Department {FODEPARTMENT.EXTERNAL_CODE}: department code does not fit an 8-digit object
    ID (HRP1000.OBJID) of the SAP target field. Correct in Employee Central.'
- id: EC113
  field: FODEPARTMENT.COST_CENTER
  check_class: regex_check
  pattern: ^[A-Za-z0-9]{1,10}$
  severity: medium
  dimension: validity
  message: Department cost centre does not fit a cost centre of at most 10 characters (KOSTL) of the SAP target
    field
  why_it_matters: Replication to the SAP HCM or S/4HANA system maps this value into a field with a cost centre of
    at most 10 characters (KOSTL). A value outside that format is rejected or truncated, which breaks the key that
    links the employee to the SAP organisation.
  rule_authority: best_practice
  sap_impact: The replication or migration load rejects the record or links it to the wrong object in the SAP system.
  fix_map:
    __other__: Change the value in Employee Central so that it fits a cost centre of at most 10 characters (KOSTL),
      or add a conversion in the integration mapping.
  record_fix_template: 'Department {FODEPARTMENT.EXTERNAL_CODE}: department cost centre does not fit a cost centre
    of at most 10 characters (KOSTL) of the SAP target field. Correct in Employee Central.'
- id: EC114
  field: POSITION.CODE
  check_class: regex_check
  pattern: ^\d{1,8}$
  severity: medium
  dimension: validity
  message: Position code does not fit an 8-digit object ID (HRP1000.OBJID) of the SAP target field
  why_it_matters: Replication to the SAP HCM or S/4HANA system maps this value into a field with an 8-digit object
    ID (HRP1000.OBJID). A value outside that format is rejected or truncated, which breaks the key that links the
    employee to the SAP organisation.
  rule_authority: best_practice
  sap_impact: The replication or migration load rejects the record or links it to the wrong object in the SAP system.
  fix_map:
    __other__: Change the value in Employee Central so that it fits an 8-digit object ID (HRP1000.OBJID), or add
      a conversion in the integration mapping.
  record_fix_template: 'Position {POSITION.CODE}: position code does not fit an 8-digit object ID (HRP1000.OBJID)
    of the SAP target field. Correct in Employee Central.'
- id: EC115
  field: EMPEMPLOYMENT.POSITION
  check_class: cross_field_check
  fail_when: '`EMPEMPLOYMENT.POSITION`.notna() & ((@today - `EMPEMPLOYMENT.END_DATE`).dt.days > 90)'
  applies_when:
    EMPEMPLOYMENT.STATUS:
    - T
    - R
  severity: medium
  dimension: timeliness
  message: Leaver still sits on a position more than 90 days after leaving
  why_it_matters: A terminated or retired employee must be removed from the position. Staying on it keeps the position
    counted as filled and carries a stale relationship into the replication to SAP.
  rule_authority: best_practice
  sap_impact: Vacancy and headcount reports show the position as occupied; the SAP organisation keeps a holder relationship
    for a person who has left.
  fix_map:
    __other__: Remove the leaver from the position (Position Org Chart) or correct the termination.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: left more than 90 days ago but is still assigned to a position.
    Correct in Position Org Chart.'
- id: EC116
  field: EMPEMPLOYMENT.MANAGER_ID
  check_class: cross_field_check
  fail_when: '`EMPEMPLOYMENT.MANAGER_ID` == `EMPEMPLOYMENT.USERID`'
  applies_when:
    EMPEMPLOYMENT.STATUS: &id001
    - A
    - U
    - P
    - S
  severity: high
  dimension: consistency
  message: Active employee is their own manager
  why_it_matters: The manager relationship must point to another person. A self reference makes the approval and
    reporting hierarchy loop.
  rule_authority: best_practice
  sap_impact: Workflow approvals, organisation charts and manager self service cannot resolve the employee.
  fix_map:
    __other__: Assign the correct manager in Employment Details.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: manager is the employee. Correct in Employment Details.'
- id: EC117
  field: EMPEMPLOYMENT.EVENT_REASON
  check_class: null_check
  applies_when:
    EMPEMPLOYMENT.STATUS:
    - T
    - R
  severity: medium
  dimension: completeness
  message: Terminated employee has no event reason
  why_it_matters: The event reason of the termination drives leaver reporting, notice handling and the mapping to
    the SAP action reason (PA0000.MASSG).
  rule_authority: best_practice
  sap_impact: The replication cannot derive the action reason; turnover analysis cannot split voluntary from involuntary
    exits.
  fix_map:
    __blank__: Enter the termination reason on the employment record.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: terminated without an event reason. Correct the termination
    record.'
- id: EC118
  field: EMPEMPLOYMENT.END_DATE
  check_class: cross_field_check
  fail_when: (@today - `EMPEMPLOYMENT.END_DATE`).dt.days > 3650
  applies_when:
    EMPEMPLOYMENT.STATUS:
    - T
    - R
  severity: low
  dimension: timeliness
  message: Employee left more than 10 years ago and is still held in the system
  why_it_matters: Employment records that ended more than ten years ago are candidates to archive. Carrying them
    into a conversion or replication adds volume and legacy keys without business value.
  rule_authority: best_practice
  sap_impact: Larger migration volume and longer load times; obsolete persons appear in reports and in person searches.
  fix_map:
    __other__: Confirm the retention period, then archive or exclude the record from the migration scope.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: left more than 10 years ago. Archive or exclude from the
    migration.'
- id: EC119
  field: PERINFO.GENDER
  check_class: null_check
  grain: EMPEMPLOYMENT
  applies_when:
    EMPEMPLOYMENT.STATUS: *id001
  severity: medium
  dimension: completeness
  message: Active employee has no gender
  why_it_matters: The gender of a person is a standard field of the business partner that the employee becomes in
    S/4HANA, and it selects the salutation and statutory reporting.
  rule_authority: best_practice
  sap_impact: The person is created without gender in the SAP system; the salutation is derived wrongly and statutory
    reports fall back to unknown.
  fix_map:
    __blank__: Enter the gender in Personal Information.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: active employee has no gender. Correct in Personal Information.'
- id: EC120
  field: PERADDRESS.ADDRESS_LINE1
  check_class: null_check
  applies_when:
    PERADDRESS.CITY:
      populated: true
  severity: medium
  dimension: completeness
  message: Person address has no street line
  why_it_matters: The business partner address in S/4HANA is built from the street, city and country. An address
    with a country but no street cannot be used for correspondence.
  rule_authority: best_practice
  sap_impact: The address is replicated incomplete and mail to the person cannot be delivered.
  fix_map:
    __blank__: Complete the address in Personal Information.
  record_fix_template: 'Person {PERADDRESS.PERSON_ID}: address has a city but no street. Correct in Personal Information.'
- id: EC121
  field: PERINFO.DATE_OF_BIRTH
  check_class: cross_field_check
  fail_when: '`PERINFO.DATE_OF_BIRTH` > @today'
  severity: high
  dimension: validity
  message: Date of birth lies in the future
  why_it_matters: A birth date after today cannot be true. It is usually a typing error in the year or a day/month
    swap on import.
  rule_authority: best_practice
  sap_impact: Age-based eligibility (benefits, pension, minimum working age) and statutory reporting compute a negative
    age.
  fix_map:
    __other__: Correct the date of birth from the identity document in Personal Information.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: date of birth is in the future.'
- id: EC122
  field: PERINFO.DATE_OF_BIRTH
  check_class: cross_field_check
  fail_when: '`PERINFO.DATE_OF_BIRTH` <= ''1900-01-01'''
  severity: medium
  dimension: accuracy
  message: Date of birth is on or before 1 January 1900 (placeholder date)
  why_it_matters: Legacy systems often load 1900-01-01 (or earlier) when the real birth date was unknown. No current
    employee was born then, so the value is a placeholder, not data.
  rule_authority: best_practice
  sap_impact: Age, retirement and pension calculations run on a 125-year-old person; age-band analytics are distorted.
  fix_map:
    __other__: Replace the placeholder with the real date of birth from the identity document.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: date of birth is a placeholder (on or before 1900-01-01).'
- id: EC123
  field: PERINFO.DATE_OF_DEATH
  check_class: cross_field_check
  fail_when: '`PERINFO.DATE_OF_DEATH`.notna()'
  applies_when:
    EMPEMPLOYMENT.STATUS:
    - A
    - U
    - P
    - S
  severity: high
  dimension: consistency
  message: Person has a date of death but the employment is still active
  why_it_matters: A deceased person's employment must be terminated (event Termination, reason Death). An active
    status with a date of death keeps the person in payroll and in every active-headcount report.
  rule_authority: best_practice
  sap_impact: Payroll continues to pay a deceased employee; benefits and access rights stay open.
  fix_map:
    __other__: Confirm the death and run the termination with the death event reason, or remove a wrongly entered
      date of death.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: person {PERINFO.PERSON_ID} has a date of death but the
    employment is still active.'
- id: EC124
  field: PERINFO.DATE_OF_DEATH
  check_class: cross_field_check
  fail_when: '`PERINFO.DATE_OF_DEATH` < `PERINFO.DATE_OF_BIRTH`'
  severity: high
  dimension: validity
  message: Date of death is before the date of birth
  why_it_matters: A person cannot die before being born; one of the two dates is wrong.
  rule_authority: best_practice
  sap_impact: Age and survivor-benefit calculations fail or produce negative values.
  fix_map:
    __other__: Check both dates against the source documents and correct the wrong one.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: date of death is before the date of birth.'
- id: EC125
  field: PERINFO.DATE_OF_DEATH
  check_class: cross_field_check
  fail_when: '`PERINFO.DATE_OF_DEATH` > @today'
  severity: high
  dimension: validity
  message: Date of death lies in the future
  why_it_matters: A date of death after today is impossible; it is usually a typing error in the year.
  rule_authority: best_practice
  sap_impact: Survivor benefits and termination processing are scheduled for a date that has not happened.
  fix_map:
    __other__: Correct the date of death from the death certificate.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: date of death is in the future.'
- id: EC126
  field: PERINFO.COUNTRY_OF_BIRTH
  check_class: regex_check
  pattern: ^[A-Z]{3}$
  severity: medium
  dimension: validity
  message: Country of birth is not a 3-letter ISO country code
  why_it_matters: SuccessFactors stores countries as ISO 3166-1 alpha-3 codes (ZAF, USA, DEU). Names or 2-letter
    codes do not resolve against the Country object.
  rule_authority: best_practice
  sap_impact: The value does not validate on save and is lost in a replication to Employee Central Payroll.
  fix_map:
    __other__: Replace the value with the ISO alpha-3 code of the country of birth.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: country of birth {PERINFO.COUNTRY_OF_BIRTH} is not an ISO alpha-3
    code.'
  auto_fix:
    steps:
    - op: strip
    - op: upper
    confidence: medium
- id: EC127
  field: PERINFO.FIRSTNAME
  check_class: regex_check
  pattern: ^(?!.*\s{2}).*$
  severity: low
  dimension: validity
  message: First name contains repeated spaces
  why_it_matters: Double spaces inside a name come from concatenated legacy fields or copy-paste. Searches, duplicate
    checks and badge or letter output treat the name as different from the clean spelling.
  rule_authority: best_practice
  sap_impact: Duplicate-person detection misses the record; generated letters and IDs show the extra space.
  fix_map:
    __other__: Collapse the repeated spaces to one.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: first name contains repeated spaces.'
  auto_fix:
    steps:
    - op: collapse_spaces
    - op: strip
    confidence: high
- id: EC128
  field: PERINFO.FIRSTNAME
  check_class: regex_check
  pattern: ^[^0-9!@#$%^&*()_+=\[\]{};:"\\|<>/?~]*$
  severity: medium
  dimension: accuracy
  message: First name contains digits or symbols
  why_it_matters: 'Personal names contain letters, spaces, hyphens, apostrophes and periods. Digits or symbols such
    as @ # / mean an ID, an e-mail or a note was typed into the name field.'
  rule_authority: best_practice
  sap_impact: Payslips, tax certificates and bank files carry the wrong name; bank name matching on payments can
    fail.
  fix_map:
    __other__: Correct the name from the identity document and move any other information to its own field.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: first name contains digits or symbols.'
- id: EC129
  field: PERINFO.FIRSTNAME
  check_class: cross_field_check
  fail_when: '`PERINFO.FIRSTNAME`.str.isupper() & (`PERINFO.FIRSTNAME`.str.len() > 1)'
  severity: low
  dimension: validity
  message: First name is in all capitals
  why_it_matters: Names loaded from mainframes or ID scans often arrive in capitals. SuccessFactors shows them as
    entered, so letters, org charts and e-mail signatures shout the name.
  rule_authority: best_practice
  sap_impact: Formal correspondence and generated documents show the name in capitals.
  fix_map:
    __other__: Rewrite the name in normal case, keeping particles such as 'van der' and prefixes such as 'Mc' as
      the person writes them.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: first name is in all capitals.'
  auto_fix:
    steps:
    - op: title
    confidence: low
- id: EC130
  field: PERINFO.LASTNAME
  check_class: regex_check
  pattern: ^(?!.*\s{2}).*$
  severity: low
  dimension: validity
  message: Last name contains repeated spaces
  why_it_matters: Double spaces inside a name come from concatenated legacy fields or copy-paste. Searches, duplicate
    checks and badge or letter output treat the name as different from the clean spelling.
  rule_authority: best_practice
  sap_impact: Duplicate-person detection misses the record; generated letters and IDs show the extra space.
  fix_map:
    __other__: Collapse the repeated spaces to one.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: last name contains repeated spaces.'
  auto_fix:
    steps:
    - op: collapse_spaces
    - op: strip
    confidence: high
- id: EC131
  field: PERINFO.LASTNAME
  check_class: regex_check
  pattern: ^[^0-9!@#$%^&*()_+=\[\]{};:"\\|<>/?~]*$
  severity: medium
  dimension: accuracy
  message: Last name contains digits or symbols
  why_it_matters: 'Personal names contain letters, spaces, hyphens, apostrophes and periods. Digits or symbols such
    as @ # / mean an ID, an e-mail or a note was typed into the name field.'
  rule_authority: best_practice
  sap_impact: Payslips, tax certificates and bank files carry the wrong name; bank name matching on payments can
    fail.
  fix_map:
    __other__: Correct the name from the identity document and move any other information to its own field.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: last name contains digits or symbols.'
- id: EC132
  field: PERINFO.LASTNAME
  check_class: cross_field_check
  fail_when: '`PERINFO.LASTNAME`.str.isupper() & (`PERINFO.LASTNAME`.str.len() > 1)'
  severity: low
  dimension: validity
  message: Last name is in all capitals
  why_it_matters: Names loaded from mainframes or ID scans often arrive in capitals. SuccessFactors shows them as
    entered, so letters, org charts and e-mail signatures shout the name.
  rule_authority: best_practice
  sap_impact: Formal correspondence and generated documents show the name in capitals.
  fix_map:
    __other__: Rewrite the name in normal case, keeping particles such as 'van der' and prefixes such as 'Mc' as
      the person writes them.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: last name is in all capitals.'
  auto_fix:
    steps:
    - op: title
    confidence: low
- id: EC133
  field: PERINFO.FIRSTNAME
  check_class: cross_field_check
  fail_when: '`PERINFO.FIRSTNAME`.str.lower().isin([''test'', ''dummy'', ''xxx'', ''unknown'', ''tbd'', ''n/a'',
    ''na'', ''none'']) | `PERINFO.LASTNAME`.str.lower().isin([''test'', ''dummy'', ''xxx'', ''unknown'', ''tbd'',
    ''n/a'', ''na'', ''none''])'
  severity: high
  dimension: accuracy
  message: Name is a placeholder (TEST, DUMMY, UNKNOWN, N/A ...)
  why_it_matters: Placeholder names come from test hires or from loads where the name was unknown. Test persons
    must not exist in production and real persons need their real name.
  rule_authority: best_practice
  sap_impact: Test persons are paid, counted in headcount and replicated to downstream systems.
  fix_map:
    __other__: Delete test persons, or replace the placeholder with the person's legal name.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: name is a placeholder value.'
- id: EC134
  field: PERINFO.LASTNAME
  check_class: cross_field_check
  fail_when: '`PERINFO.FIRSTNAME`.str.lower() == `PERINFO.LASTNAME`.str.lower()'
  severity: medium
  dimension: accuracy
  message: First name and last name are identical
  why_it_matters: The same value in both name fields usually means one field was copied into the other during a
    load.
  rule_authority: best_practice
  sap_impact: Letters, payslips and tax certificates show the wrong name; duplicate detection on name is weakened.
  fix_map:
    __other__: Correct the first or the last name from the identity document.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: first name and last name are identical.'
- id: EC135
  field: PERINFO.SALUTATION
  check_class: cross_field_check
  fail_when: ((`PERINFO.SALUTATION` == 'MR') & (`PERINFO.GENDER` == 'F')) | (`PERINFO.SALUTATION`.isin(['MS', 'MRS',
    'MISS']) & (`PERINFO.GENDER` == 'M'))
  severity: low
  dimension: consistency
  message: Salutation contradicts the gender (Mr for a woman, Ms/Mrs/Miss for a man)
  why_it_matters: Salutation and gender are maintained separately. A contradiction means one of them was entered
    for the wrong person or was defaulted on load.
  rule_authority: best_practice
  sap_impact: Letters and contracts address the person with the wrong form of address.
  fix_map:
    __other__: Confirm with the employee which value is wrong and correct it.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: salutation {PERINFO.SALUTATION} does not match gender {PERINFO.GENDER}.'
- id: EC136
  field: PERINFO.NATIONAL_ID_COUNTRY
  check_class: cross_field_check
  fail_when: '`PERINFO.NATIONAL_ID`.notna() & `PERINFO.NATIONAL_ID_COUNTRY`.isna()'
  severity: medium
  dimension: completeness
  message: National ID is recorded without the issuing country
  why_it_matters: Every PerNationalId record is keyed by country and card type. Without the country, the ID format
    cannot be validated and country-specific payroll and tax reporting cannot pick it up.
  rule_authority: best_practice
  sap_impact: Country payroll and statutory reports (tax certificates, social security) do not find the ID.
  fix_map:
    __other__: Set the issuing country on the national ID record.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: national ID has no issuing country.'
- id: EC137
  field: PERINFO.NATIONAL_ID_COUNTRY
  check_class: regex_check
  pattern: ^[A-Z]{3}$
  severity: medium
  dimension: validity
  message: National ID country is not a 3-letter ISO country code
  why_it_matters: PerNationalId.country uses ISO 3166-1 alpha-3 codes. Country-specific format validation depends
    on it.
  rule_authority: best_practice
  sap_impact: The ID is not validated against its country format and is not reported in country payroll.
  fix_map:
    __other__: Replace the value with the ISO alpha-3 code of the issuing country.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: national ID country {PERINFO.NATIONAL_ID_COUNTRY} is not an
    ISO alpha-3 code.'
  auto_fix:
    steps:
    - op: strip
    - op: upper
    confidence: medium
- id: EC138
  field: PERINFO.NATIONAL_ID
  check_class: regex_check
  pattern: ^(?!\d{2}(1[3-9]|[2-9]\d|00)\d{9}$|\d{4}(00|3[2-9]|[4-9]\d)\d{7}$)
  applies_when:
    PERINFO.NATIONAL_ID_COUNTRY:
    - ZAF
  severity: high
  dimension: validity
  message: South African ID number does not start with a valid birth date (YYMMDD)
  why_it_matters: The first six digits of a South African ID number are the holder's date of birth (YYMMDD). A month
    above 12 or a day above 31 means the number was mistyped.
  rule_authority: sap_hard_constraint
  sap_impact: Payroll tax and social-security reporting for the country reject the number; employer filings are
    returned.
  fix_map:
    __other__: Correct the number from the employee's ZAF identity document in National ID Information.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: ZAF national ID is not in the valid format. Correct it from
    the identity document.'
- id: EC139
  field: PERINFO.NATIONAL_ID
  check_class: regex_check
  pattern: ^(?!\d{10}[3-9]\d{2}$)
  applies_when:
    PERINFO.NATIONAL_ID_COUNTRY:
    - ZAF
  severity: high
  dimension: validity
  message: South African ID number has an invalid citizenship digit
  why_it_matters: Digit 11 of a South African ID number is 0 (citizen), 1 (permanent resident) or 2 (refugee). Any
    other value means the number was mistyped.
  rule_authority: sap_hard_constraint
  sap_impact: Payroll tax and social-security reporting for the country reject the number; employer filings are
    returned.
  fix_map:
    __other__: Correct the number from the employee's ZAF identity document in National ID Information.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: ZAF national ID is not in the valid format. Correct it from
    the identity document.'
- id: EC140
  field: PERINFO.NATIONAL_ID
  check_class: regex_check
  pattern: ^([A-Z]{5}[0-9]{4}[A-Z]|[2-9][0-9]{3} ?[0-9]{4} ?[0-9]{4})$
  applies_when:
    PERINFO.NATIONAL_ID_COUNTRY:
    - IND
  severity: high
  dimension: validity
  message: Indian national ID is neither a valid PAN nor a valid Aadhaar number
  why_it_matters: 'A PAN is 10 characters: five letters, four digits, one letter (AAAAA9999A). An Aadhaar number
    is 12 digits and never starts with 0 or 1.'
  rule_authority: sap_hard_constraint
  sap_impact: Payroll tax and social-security reporting for the country reject the number; employer filings are
    returned.
  fix_map:
    __other__: Correct the number from the employee's IND identity document in National ID Information.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: IND national ID is not in the valid format. Correct it from
    the identity document.'
  auto_fix:
    steps:
    - op: strip
    - op: upper
    confidence: medium
- id: EC141
  field: PERINFO.NATIONAL_ID
  check_class: regex_check
  pattern: ^[1-478]\d{2}(0[1-9]|1[0-2]|[2-9]\d)(\d{2}|2[AB])\d{6}(\d{2})?$
  applies_when:
    PERINFO.NATIONAL_ID_COUNTRY:
    - FRA
  severity: high
  dimension: validity
  message: French NIR (social security number) is not in the 13 or 15 character format
  why_it_matters: The NIR is sex (1 digit), birth year and month, department (2 digits or 2A/2B), commune, order
    number and an optional 2-digit key.
  rule_authority: sap_hard_constraint
  sap_impact: Payroll tax and social-security reporting for the country reject the number; employer filings are
    returned.
  fix_map:
    __other__: Correct the number from the employee's FRA identity document in National ID Information.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: FRA national ID is not in the valid format. Correct it from
    the identity document.'
  auto_fix:
    steps:
    - op: upper
    - op: regex_replace
      pattern: \s+
      repl: ''
    confidence: medium
- id: EC142
  field: PERINFO.NATIONAL_ID
  check_class: regex_check
  pattern: ^[A-Z]{6}[0-9LMNPQRSTUV]{2}[ABCDEHLMPRST][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$
  applies_when:
    PERINFO.NATIONAL_ID_COUNTRY:
    - ITA
  severity: high
  dimension: validity
  message: Italian codice fiscale is not in the 16-character format
  why_it_matters: The codice fiscale is 6 letters (surname, name), birth year, month letter, birth day (plus 40
    for women), municipality code and a check letter. Omocodia letters can replace digits.
  rule_authority: sap_hard_constraint
  sap_impact: Payroll tax and social-security reporting for the country reject the number; employer filings are
    returned.
  fix_map:
    __other__: Correct the number from the employee's ITA identity document in National ID Information.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: ITA national ID is not in the valid format. Correct it from
    the identity document.'
  auto_fix:
    steps:
    - op: upper
    - op: regex_replace
      pattern: \s+
      repl: ''
    confidence: medium
- id: EC143
  field: PERINFO.NATIONAL_ID
  check_class: regex_check
  pattern: ^\d{3} ?\d{3} ?\d{2,3}$
  applies_when:
    PERINFO.NATIONAL_ID_COUNTRY:
    - AUS
  severity: medium
  dimension: validity
  message: Australian Tax File Number is not 8 or 9 digits
  why_it_matters: A TFN has 9 digits (older ones 8). Letters or other lengths mean the number was mistyped.
  rule_authority: sap_hard_constraint
  sap_impact: Payroll tax and social-security reporting for the country reject the number; employer filings are
    returned.
  fix_map:
    __other__: Correct the number from the employee's AUS identity document in National ID Information.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: AUS national ID is not in the valid format. Correct it from
    the identity document.'
  auto_fix:
    steps:
    - op: regex_replace
      pattern: '[^0-9]'
      repl: ''
    confidence: medium
- id: EC144
  field: PERINFO.NATIONAL_ID
  check_class: regex_check
  pattern: ^[A-Z][AEIOUX][A-Z]{2}\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])[HMX](AS|BC|BS|CC|CL|CM|CS|CH|DF|DG|GT|GR|HG|JC|MC|MN|MS|NT|NL|OC|PL|QT|QR|SP|SL|SR|TC|TS|TL|VZ|YN|ZS|NE)[B-DF-HJ-NP-TV-Z]{3}[A-Z0-9]\d$
  applies_when:
    PERINFO.NATIONAL_ID_COUNTRY:
    - MEX
  severity: high
  dimension: validity
  message: Mexican CURP is not in the 18-character format
  why_it_matters: A CURP is 4 letters from the name, the birth date, sex, the state of birth, 3 internal consonants
    and two check characters.
  rule_authority: sap_hard_constraint
  sap_impact: Payroll tax and social-security reporting for the country reject the number; employer filings are
    returned.
  fix_map:
    __other__: Correct the number from the employee's MEX identity document in National ID Information.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: MEX national ID is not in the valid format. Correct it from
    the identity document.'
  auto_fix:
    steps:
    - op: strip
    - op: upper
    confidence: medium
- id: EC145
  field: PERINFO.NATIONAL_ID
  check_class: regex_check
  pattern: ^[STFGM]\d{7}[A-Z]$
  applies_when:
    PERINFO.NATIONAL_ID_COUNTRY:
    - SGP
  severity: medium
  dimension: validity
  message: Singapore NRIC/FIN is not in the format letter, 7 digits, letter
  why_it_matters: NRIC and FIN numbers start with S, T, F, G or M, then 7 digits and a check letter.
  rule_authority: sap_hard_constraint
  sap_impact: Payroll tax and social-security reporting for the country reject the number; employer filings are
    returned.
  fix_map:
    __other__: Correct the number from the employee's SGP identity document in National ID Information.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: SGP national ID is not in the valid format. Correct it from
    the identity document.'
  auto_fix:
    steps:
    - op: strip
    - op: upper
    confidence: medium
- id: EC146
  field: PERINFO.NATIONAL_ID
  check_class: cross_field_check
  fail_when: (`PERINFO.NATIONAL_ID`.str.slice(0, 6) != `PERINFO.DATE_OF_BIRTH`.dt.strftime('%y%m%d')) & `PERINFO.DATE_OF_BIRTH`.notna()
    & `PERINFO.NATIONAL_ID`.str.isdigit()
  applies_when:
    PERINFO.NATIONAL_ID_COUNTRY:
    - ZAF
  severity: high
  dimension: consistency
  message: South African ID number does not match the date of birth
  why_it_matters: The first six digits of a South African ID number are the date of birth (YYMMDD). A different
    date of birth means either the ID or the birth date belongs to someone else or was mistyped.
  rule_authority: sap_hard_constraint
  sap_impact: SARS IRP5 and UIF submissions are rejected when ID and birth date disagree; age-based benefits use
    the wrong age.
  fix_map:
    __other__: Compare both values with the identity document and correct the wrong one.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: South African ID number does not match the date of birth.'
- id: EC147
  field: PERINFO.NATIONAL_ID
  check_class: regex_check
  pattern: ^(?!\d{6}[5-9]\d{6}$)
  applies_when:
    PERINFO.NATIONAL_ID_COUNTRY:
    - ZAF
    PERINFO.GENDER:
    - F
  severity: medium
  dimension: consistency
  message: South African ID number encodes a male but the person is recorded as female
  why_it_matters: 'Digit 7 of a South African ID number encodes the sex at registration: 0-4 female, 5-9 male. A
    mismatch with the recorded gender means the ID or the gender was entered for the wrong person.'
  rule_authority: best_practice
  sap_impact: SARS and UIF submissions flag the mismatch; gender-based statutory reports (Employment Equity) are
    wrong.
  fix_map:
    __other__: Check the ID and the gender against the identity document and correct the wrong one.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: South African ID number sex digit does not match gender {PERINFO.GENDER}.'
- id: EC148
  field: PERINFO.NATIONAL_ID
  check_class: regex_check
  pattern: ^(?!\d{6}[0-4]\d{6}$)
  applies_when:
    PERINFO.NATIONAL_ID_COUNTRY:
    - ZAF
    PERINFO.GENDER:
    - M
  severity: medium
  dimension: consistency
  message: South African ID number encodes a female but the person is recorded as male
  why_it_matters: 'Digit 7 of a South African ID number encodes the sex at registration: 0-4 female, 5-9 male. A
    mismatch with the recorded gender means the ID or the gender was entered for the wrong person.'
  rule_authority: best_practice
  sap_impact: SARS and UIF submissions flag the mismatch; gender-based statutory reports (Employment Equity) are
    wrong.
  fix_map:
    __other__: Check the ID and the gender against the identity document and correct the wrong one.
  record_fix_template: 'Person {PERINFO.PERSON_ID}: South African ID number sex digit does not match gender {PERINFO.GENDER}.'
- id: EC149
  field: PEREMAIL.EMAIL_ADDRESS
  check_class: regex_check
  pattern: ^\S+$
  severity: medium
  dimension: validity
  message: E-mail address contains spaces
  why_it_matters: An e-mail address cannot contain spaces. Spaces come from copy-paste or from joining first and
    last name.
  rule_authority: best_practice
  sap_impact: Notifications, workflow approvals and SSO user provisioning fail for the address.
  fix_map:
    __other__: Remove the spaces from the address.
  record_fix_template: 'Person {PEREMAIL.PERSON_ID}: e-mail address contains spaces.'
  auto_fix:
    steps:
    - op: regex_replace
      pattern: \s+
      repl: ''
    confidence: high
- id: EC150
  field: PEREMAIL.EMAIL_ADDRESS
  check_class: regex_check
  pattern: ^(?!.*\.\.).*$
  severity: medium
  dimension: validity
  message: E-mail address contains consecutive dots
  why_it_matters: RFC 5321 does not allow two dots in a row in an e-mail address. It is a typing error.
  rule_authority: best_practice
  sap_impact: Mail servers reject the address; notifications and password resets never arrive.
  fix_map:
    __other__: Replace the double dot with a single dot.
  record_fix_template: 'Person {PEREMAIL.PERSON_ID}: e-mail address contains consecutive dots.'
  auto_fix:
    steps:
    - op: regex_replace
      pattern: \.{2,}
      repl: .
    confidence: medium
- id: EC151
  field: PEREMAIL.PERSON_ID
  check_class: uniqueness_check
  fields:
  - PEREMAIL.PERSON_ID
  - PEREMAIL.IS_PRIMARY
  applies_when:
    PEREMAIL.IS_PRIMARY:
    - 'true'
  severity: medium
  dimension: uniqueness
  message: Person has more than one primary e-mail address
  why_it_matters: SuccessFactors allows exactly one primary e-mail per person. Integrations (IAS/IPS, Microsoft
    Entra, payroll) pick 'the' primary address and take an arbitrary one when there are two.
  rule_authority: best_practice
  sap_impact: User provisioning and notifications go to the wrong mailbox; the e-mail address flips between syncs.
  fix_map:
    __other__: Keep the primary flag on one address only.
  record_fix_template: 'Person {PEREMAIL.PERSON_ID}: more than one e-mail address is flagged as primary.'
- id: EC152
  field: PERINFO.PERSON_ID
  check_class: exists_check
  target_table: PEREMAIL
  target_fields:
  - PERSON_ID
  target_when:
    IS_PRIMARY:
    - 'true'
  applies_when:
    EMPEMPLOYMENT.STATUS:
    - A
    - U
    - P
    - S
  severity: medium
  dimension: completeness
  message: Active employee has no primary e-mail address
  why_it_matters: Every person needs one e-mail flagged as primary. Identity provisioning and Employee Central notifications
    read the primary address only.
  rule_authority: best_practice
  sap_impact: The employee gets no workflow notifications and is not provisioned to IAS or the corporate directory.
  fix_map:
    __other__: Flag one of the person's e-mail addresses as primary, or add a business e-mail.
  record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: person {PERINFO.PERSON_ID} has no primary e-mail address.'
- id: EC153
  field: PERPHONE.PERSON_ID
  check_class: uniqueness_check
  fields:
  - PERPHONE.PERSON_ID
  - PERPHONE.IS_PRIMARY
  applies_when:
    PERPHONE.IS_PRIMARY:
    - 'true'
  severity: low
  dimension: uniqueness
  message: Person has more than one primary phone number
  why_it_matters: SuccessFactors allows one primary phone per person; integrations and the people profile take the
    primary one.
  rule_authority: best_practice
  sap_impact: Directory and emergency-call lists show an arbitrary number.
  fix_map:
    __other__: Keep the primary flag on one phone number only.
  record_fix_template: 'Person {PERPHONE.PERSON_ID}: more than one phone number is flagged as primary.'
- id: EC154
  field: PERPHONE.COUNTRY_CODE
  check_class: regex_check
  pattern: ^\+?[1-9]\d{0,2}$
  severity: medium
  dimension: validity
  message: Phone country code is not a 1 to 3 digit dialling code
  why_it_matters: PerPhone.countryCode holds the international dialling code (27, 1, 49), optionally with a leading
    +. Country names or ISO codes do not dial.
  rule_authority: best_practice
  sap_impact: Click-to-call, SMS notifications and MFA enrolment fail.
  fix_map:
    __other__: Replace the value with the international dialling code.
  record_fix_template: 'Person {PERPHONE.PERSON_ID}: phone country code {PERPHONE.COUNTRY_CODE} is not a dialling
    code.'
  auto_fix:
    steps:
    - op: regex_replace
      pattern: '[\s()-]'
      repl: ''
    - op: regex_replace
      pattern: ^00
      repl: +
    confidence: medium
- id: EC155
  field: PERPHONE.PHONE_NUMBER
  check_class: regex_check
  pattern: ^(?!.*(0000000|1111111|9999999|1234567|0123456)).*$
  severity: medium
  dimension: accuracy
  message: Phone number is a placeholder (0000000, 1234567, 9999999 ...)
  why_it_matters: Runs of the same digit or an ascending sequence are typed when the real number was not known.
  rule_authority: best_practice
  sap_impact: Emergency and MFA contact is impossible; the number looks valid in every format check.
  fix_map:
    __other__: Replace the placeholder with the employee's real number or remove it.
  record_fix_template: 'Person {PERPHONE.PERSON_ID}: phone number is a placeholder.'
- id: EC156
  field: PERADDRESS.CITY
  check_class: regex_check
  pattern: ^(?!.*\s{2}).*$
  severity: low
  dimension: validity
  message: City contains repeated spaces
  why_it_matters: Double spaces come from concatenated legacy fields. Address validation and duplicate checks treat
    the value as different from the clean spelling.
  rule_authority: best_practice
  sap_impact: Postal address validation fails or returns no match; printed letters show gaps.
  fix_map:
    __other__: Collapse the repeated spaces to one.
  record_fix_template: 'Person {PERADDRESS.PERSON_ID}: city on the {PERADDRESS.COUNTRY} address contains repeated
    spaces.'
  auto_fix:
    steps:
    - op: collapse_spaces
    - op: strip
    confidence: high
- id: EC157
  field: PERADDRESS.STATE
  check_class: regex_check
  pattern: ^(AL|AK|AZ|AR|CA|CO|CT|DE|DC|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY|AS|GU|MP|PR|VI)$
  applies_when:
    PERADDRESS.COUNTRY:
    - USA
  severity: medium
  dimension: validity
  message: US state is not a USPS state code
  why_it_matters: US addresses use the two-letter USPS state code (CA, NY, TX). State tax withholding is determined
    from it.
  rule_authority: sap_hard_constraint
  sap_impact: Tax jurisdiction and payroll tax assignment fail; postal validation rejects the address.
  fix_map:
