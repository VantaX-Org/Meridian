- id: HCM020
  field: PA0002.NACHN
  check_class: uniqueness_check
  grain: PA0002
  fields:
  - PA0002.NACHN
  - PA0002.VORNA
  - PA0002.GBDAT
  normalize: name
  applies_when:
    PA0002.ENDDA:
    - '99991231'
  severity: medium
  dimension: uniqueness
  message: 'Possible duplicate person: two personnel numbers with the same name and date of birth'
  why_it_matters: Rehires and transfers created as new hires leave one person under two personnel numbers. (Concurrent
    employment uses several personnel numbers on purpose; confirm before merging.)
  rule_authority: best_practice
  sap_impact: Duplicate payments, split year-to-date tax and leave balances.
  fix_map:
    __other__: Compare both personnel numbers; if they are one person, reactivate the original (rehire action) and
      leave the other.
  record_fix_template: 'Employee {PA0002.PERNR} ({PA0002.BEGDA}-{PA0002.ENDDA}): possible duplicate person: two
    personnel numbers with the same name and date of birth.'
- id: HCM021
  field: PA0002.PERID
  check_class: uniqueness_check
  grain: PA0002
  fields:
  - PA0002.PERID
  normalize: alnum
  applies_when:
    PA0002.ENDDA:
    - '99991231'
  severity: high
  dimension: uniqueness
  message: The same national ID number is held by two personnel numbers
  why_it_matters: A national identity number belongs to one person. Two current personnel numbers sharing it are
    a duplicate person or a keying error (concurrent employment excepted).
  rule_authority: best_practice
  sap_impact: Tax and social-security filings combine or reject the two employees.
  fix_map:
    __other__: Verify the ID against the employee's documents and correct the wrong record.
  record_fix_template: 'Employee {PA0002.PERNR} ({PA0002.BEGDA}-{PA0002.ENDDA}): the same national ID number is
    held by two personnel numbers.'
