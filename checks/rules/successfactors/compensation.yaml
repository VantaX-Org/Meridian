  - id: COMP191
    field: COMPINFO.PAY_RANGE_MIN
    check_class: cross_field_check
    fail_when: '`COMPINFO.PAY_RANGE_MIN` < 0'
    severity: high
    dimension: accuracy
    message: Pay range minimum is negative
    why_it_matters: A pay range minimum below zero is not a valid compensation bound and signals a data load or configuration error.
    rule_authority: sap_hard_constraint
    sap_impact: Range penetration and compa-ratio calculations are invalid when the range minimum is negative.
    fix_map:
      __other__: Correct the pay range minimum to a non-negative value from the pay grade configuration.
    record_fix_template: 'Employee {COMPINFO.USERID}: pay range minimum is negative. Correct it from the grade configuration.'
  - id: COMP192
    field: COMPINFO.PAY_RANGE_MID
    check_class: cross_field_check
    fail_when: '`COMPINFO.PAY_RANGE_MID` < 0'
    severity: high
    dimension: accuracy
    message: Pay range midpoint is negative
    why_it_matters: A pay range midpoint below zero is not a valid compensation bound and signals a data load or configuration error.
    rule_authority: sap_hard_constraint
    sap_impact: Compa-ratio, which divides by the range midpoint, is meaningless when the midpoint is negative.
    fix_map:
      __other__: Correct the pay range midpoint to a non-negative value from the pay grade configuration.
    record_fix_template: 'Employee {COMPINFO.USERID}: pay range midpoint is negative. Correct it from the grade configuration.'
  - id: COMP193
    field: COMPINFO.PAY_RANGE_MAX
    check_class: cross_field_check
    fail_when: '`COMPINFO.PAY_RANGE_MAX` < 0'
    severity: high
    dimension: accuracy
    message: Pay range maximum is negative
    why_it_matters: A pay range maximum below zero is not a valid compensation bound and signals a data load or configuration error.
    rule_authority: sap_hard_constraint
    sap_impact: Range penetration calculations are invalid when the range maximum is negative.
    fix_map:
      __other__: Correct the pay range maximum to a non-negative value from the pay grade configuration.
    record_fix_template: 'Employee {COMPINFO.USERID}: pay range maximum is negative. Correct it from the grade configuration.'
  - id: COMP194
    field: COMPINFO.PAY_RANGE_MIN
    check_class: cross_field_check
    fail_when: (`COMPINFO.PAY_RANGE_MIN` == 0) and (`COMPINFO.SALARY` > 0)
    severity: medium
    dimension: accuracy
    message: Pay range minimum is zero while the employee is paid a salary
    why_it_matters: A zero range minimum on a grade that is actively paying salary usually means the grade's range was never fully loaded, not that zero is really the floor.
    rule_authority: best_practice
    sap_impact: Range penetration reports a misleadingly high value when the minimum bound is zero instead of the grade's real floor.
    fix_map:
      __other__: Load the pay grade's real range minimum instead of zero.
    record_fix_template: 'Employee {COMPINFO.USERID}: pay range minimum is zero while salary is paid. Load the grade''s real minimum.'
  - id: COMP195
    field: COMPINFO.ANNUAL_SALARY
    check_class: cross_field_check
    fail_when: '`COMPINFO.ANNUAL_SALARY` < 0'
    severity: high
    dimension: accuracy
    message: Calculated annual salary is negative
    why_it_matters: An annual salary below zero is not valid and indicates a calculation or source-data error upstream of this field.
    rule_authority: sap_hard_constraint
    sap_impact: Every downstream compa-ratio and range-penetration calculation that uses this value is invalid.
    fix_map:
      __other__: Investigate the source pay component feeding this calculation and correct the negative amount.
    record_fix_template: 'Employee {COMPINFO.USERID}: calculated annual salary is negative. Investigate the source pay component feeding this calculation.'
  - id: COMP196
    field: COMPINFO.ANNUAL_SALARY
    check_class: cross_field_check
    fail_when: (`COMPINFO.ANNUAL_SALARY` == 0) and (`COMPINFO.SALARY` > 0)
    severity: medium
    dimension: accuracy
    message: Calculated annual salary is zero while a pay component amount is recorded
    why_it_matters: When a pay component amount is recorded but the calculated annual salary is zero, the annualisation calculation has not run or failed silently.
    rule_authority: best_practice
    sap_impact: Compensation benchmarking and range-penetration reporting treat this employee as unpaid.
    fix_map:
      __other__: Re-run the annual salary calculation for this employee.
    record_fix_template: 'Employee {COMPINFO.USERID}: calculated annual salary is zero despite a recorded pay amount. Re-run the calculation.'
  - id: COMP200
    field: PAYCOMPNONREC.NUMBER_OF_UNITS
    check_class: cross_field_check
    fail_when: (`PAYCOMPNONREC.NUMBER_OF_UNITS` == 0) and `PAYCOMPNONREC.UNIT_OF_MEASURE`.notna() and (`PAYCOMPNONREC.VALUE` > 0)
    severity: medium
    dimension: accuracy
    message: Units paid is zero while a unit of measure is recorded and the payment amount is positive
    why_it_matters: A units-based component with a recorded unit of measure and a positive payment amount should also carry a non-zero quantity; zero units with a real payment is inconsistent.
    rule_authority: best_practice
    sap_impact: Unit-rate reconciliation (amount divided by units) cannot be performed when the unit count is zero.
    fix_map:
      __other__: Investigate the source quantity feeding this component and correct the unit count.
    record_fix_template: 'Employee {PAYCOMPNONREC.USERID}: one-time payment has zero units recorded despite a unit of measure and a positive amount. Investigate the source quantity.'
  - id: COMP201
    field: PAYCOMPNONREC.VALUE
    check_class: cross_field_check
    fail_when: ((`PAYCOMPNONREC.VALUE` * 100) - (`PAYCOMPNONREC.VALUE` * 100).round(0)).abs() > 1e-6
    severity: low
    dimension: consistency
    message: One-time payment amount has more than two decimal places
    why_it_matters: Monetary amounts should be expressed to at most two decimal places; a higher-precision value usually reflects an unrounded calculation leaking through.
    rule_authority: best_practice
    sap_impact: Payroll export rounding rules can silently truncate or round an unexpected third decimal, producing a payment that does not match what was approved.
    fix_map:
      __other__: Confirm and round the amount.
    record_fix_template: 'Employee {PAYCOMPNONREC.USERID}: one-time payment amount has more than two decimal places. Confirm and round the amount.'
  - id: COMP205
    field: PAYCOMPNONREC.UNIT_OF_MEASURE
    check_class: dependency_check
    determinant: PAYCOMPNONREC.PAY_COMPONENT
    severity: low
    dimension: consistency
    message: Unit of measure is not consistent for all one-time payments of the same pay component
    why_it_matters: The same one-time pay component should always be paid in the same unit of measure; a different unit for the same component usually means the component's configuration was loaded inconsistently.
    rule_authority: best_practice
    sap_impact: Unit-rate reconciliation for this component compares quantities expressed in different units.
    fix_map:
      __other__: Correct the unit of measure so it is the same for every payment of this component.
    record_fix_template: 'Employee {PAYCOMPNONREC.USERID}: pay component {PAYCOMPNONREC.PAY_COMPONENT} has a unit of measure inconsistent with other payments of the same component. Correct it.'
  - id: COMP206
    field: PAYCOMPNONREC.CURRENCY
    check_class: dependency_check
    determinant: PAYCOMPNONREC.PAY_COMPONENT
    severity: low
    dimension: consistency
    message: Currency is not consistent for all one-time payments of the same pay component (informational; expected across multi-country tenants)
    why_it_matters: The same one-time pay component is usually paid in one currency across employees, but a multi-country or multi-entity tenant can legitimately pay the same component in different local currencies. Review before treating as an error.
    rule_authority: best_practice
    sap_impact: Component-level payout totals mix amounts in different currencies unless the mix reflects genuine multi-country pay.
    fix_map:
      __other__: Confirm whether the currency mix reflects genuine multi-country pay; correct it only if not.
    record_fix_template: 'Employee {PAYCOMPNONREC.USERID}: pay component {PAYCOMPNONREC.PAY_COMPONENT} has a currency inconsistent with other payments of the same component. Confirm whether this reflects genuine multi-country pay.'
  - id: COMP207
    field: PAYCOMPNONREC.ALT_COST_CENTER
    check_class: cross_field_check
    fail_when: '`PAYCOMPNONREC.ALT_COST_CENTER`.notna() and `FOCOSTCENTER.LEGAL_ENTITY`.notna() and `FOCOMPANY.EXTERNAL_CODE`.notna() and (`FOCOSTCENTER.LEGAL_ENTITY` != `FOCOMPANY.EXTERNAL_CODE`)'
    severity: medium
    dimension: consistency
    message: Alternative cost centre's legal entity does not match the employee's company
    why_it_matters: A charged cost centre belongs to a legal entity; charging a cost centre that belongs to a different legal entity than the employee's own company crosses a legal/statutory boundary that normally requires an intercompany posting, not a plain cost allocation.
    rule_authority: sap_hard_constraint
    sap_impact: Posting the one-time payment to this cost centre creates a cross-company cost allocation without the required intercompany documentation.
    fix_map:
      __other__: Alternative cost centre's legal entity does not match the employee's company
    record_fix_template: 'Employee {PAYCOMPNONREC.USERID}: alternative cost centre {PAYCOMPNONREC.ALT_COST_CENTER} belongs to a different legal entity than the employee''s company. Confirm the intercompany posting is intended.'
  - id: COMP208
    field: COMPINFO.SALARY
    check_class: cross_field_check
    fail_when: '`FODEPARTMENT.COST_CENTER`.notna() and `POSITION.COST_CENTER`.notna() and (`FODEPARTMENT.COST_CENTER` != `POSITION.COST_CENTER`) and (`COMPINFO.SALARY` > 0)'
    severity: medium
    dimension: consistency
    message: Employee's department cost centre does not match the position's cost centre while salary is paid
    why_it_matters: An employee's organisational department carries a cost centre, and so does the position they hold; when both are populated but disagree, salary is being planned against one cost centre while the org chart points at another.
    rule_authority: best_practice
    sap_impact: Headcount cost reporting by department and by position produce different totals for this employee's salary.
    fix_map:
      __other__: Confirm which cost centre is correct.
    record_fix_template: 'Employee {COMPINFO.USERID}: department cost centre and position cost centre disagree while salary is paid. Confirm which cost centre is correct.'
  - id: COMP209
    field: COMPINFO.PAY_COMPONENT_DEFAULT
    check_class: cross_field_check
    fail_when: '`COMPINFO.PAY_COMPONENT_DEFAULT`.notna() and (`COMPINFO.PAY_COMPONENT_DEFAULT` != 0) and (`COMPINFO.PAY_COMPONENT_TYPE` != ''AMOUNT'')'
    severity: low
    dimension: accuracy
    message: Pay component default value is set but the component type is not AMOUNT
    why_it_matters: A default monetary value only makes sense for an AMOUNT-type pay component; a default value populated on a PERCENTAGE or NUMBER component usually means the wrong default was configured.
    rule_authority: best_practice
    sap_impact: Compensation planning tools that pre-fill this component's default value apply a monetary default to a percentage or count field.
    fix_map:
      __other__: Confirm the default value's unit.
    record_fix_template: 'Employee {COMPINFO.USERID}: pay component default value is set but the component type is not AMOUNT. Confirm the default value''s unit.'
  - id: COMP210
    field: COMPINFO.EVENT_REASON
    check_class: cross_field_check
    fail_when: '`COMPINFO.EVENT_REASON`.isna() and `COMPINFO.PAY_COMPONENT_DEFAULT`.notna() and (`COMPINFO.PAY_COMPONENT_DEFAULT` != 0) and (`COMPINFO.SALARY` != `COMPINFO.PAY_COMPONENT_DEFAULT`)'
    severity: medium
    dimension: consistency
    message: Compensation change has no event reason while the amount differs from the component default
    why_it_matters: When the paid amount departs from the pay component's own default value, that departure should be explained by a recorded compensation event reason; a missing reason on an off-default amount is an unexplained manual override.
    rule_authority: best_practice
    sap_impact: Compensation audit cannot explain why this employee's pay differs from the component's default value.
    fix_map:
      __other__: Record the reason for the override.
    record_fix_template: 'Employee {COMPINFO.USERID}: compensation amount differs from the pay component default but no event reason is recorded. Record the reason for the override.'
  - id: COMP212
    field: PAYCOMPNONREC.VALUE
    check_class: cross_field_check
    fail_when: (`POSITION.TARGET_FTE` == 0) and (`PAYCOMPNONREC.VALUE` > 0)
    severity: medium
    dimension: consistency
    message: One-time payment recorded for a position with zero target FTE
    why_it_matters: A position with zero target FTE is not an active headcount; a one-time payment linked to such a position should not exist.
    rule_authority: best_practice
    sap_impact: One-time payroll disbursement is attributed to a position that organisational planning treats as having no headcount.
    fix_map:
      __other__: Confirm the position assignment.
    record_fix_template: 'Employee {PAYCOMPNONREC.USERID}: one-time payment recorded while the position''s target FTE is zero. Confirm the position assignment.'
  - id: COMP213
    field: COMPINFO.SALARY
    check_class: cross_field_check
    fail_when: (`COMPINFO.COMP_FREQUENCY` == 'HRL') and (`EMPEMPLOYMENT.STANDARD_HOURS` == 0) and (`COMPINFO.SALARY` > 0)
    severity: medium
    dimension: accuracy
    message: Hourly compensation frequency recorded with standard hours of zero
    why_it_matters: An hourly pay frequency annualises by multiplying the rate by standard hours; standard hours of zero on an hourly-paid employee makes the annualisation undefined rather than merely small.
    rule_authority: sap_hard_constraint
    sap_impact: The annual salary calculation divides or multiplies by zero standard hours and produces an invalid or zero result for an employee who is actually being paid.
    fix_map:
      __other__: Correct the standard hours on the employment record.
    record_fix_template: 'Employee {COMPINFO.USERID}: hourly pay frequency recorded with standard hours of zero. Correct the standard hours on the employment record.'
  - id: COMP214
    field: COMPINFO.PAYROLL_SYSTEM_ID
    check_class: cross_field_check
    fail_when: '`COMPINFO.PAYROLL_SYSTEM_ID`.notna() and `COMPINFO.PAYROLL_ID`.isna()'
    severity: low
    dimension: validity
    message: Payroll system ID is populated but the payroll ID (personnel number) is blank
    why_it_matters: A payroll system reference only makes sense alongside the personnel number it replicates; a payroll system ID with no corresponding personnel number is an incomplete payroll mapping.
    rule_authority: best_practice
    sap_impact: Payroll replication cannot route this employee's compensation to the named payroll system without a personnel number.
    fix_map:
      __other__: Complete the payroll mapping.
    record_fix_template: 'Employee {COMPINFO.USERID}: payroll system ID is set but the payroll personnel number is blank. Complete the payroll mapping.'
  - id: COMP215
    field: PAYCOMPNONREC.SEQUENCE_NUMBER
    check_class: cross_field_check
    fail_when: '`PAYCOMPNONREC.SEQUENCE_NUMBER`.notna() and ~`PAYCOMPNONREC.SEQUENCE_NUMBER`.str.match(r''^[0-9]+$'', na=False)'
    severity: low
    dimension: validity
    message: Sequence number is not numeric
    why_it_matters: The sequence number distinguishes multiple one-time payments of the same component on the same date and is expected to be a plain integer counter.
    rule_authority: best_practice
    sap_impact: A non-numeric sequence number cannot be used to order multiple same-day payments of the same component.
    fix_map:
      __other__: Correct it to a plain integer.
    record_fix_template: 'Employee {PAYCOMPNONREC.USERID}: sequence number is not numeric. Correct it to a plain integer.'
  - id: COMP217
    field: PAYCOMPNONREC.CURRENCY
    check_class: uniqueness_check
    fields:
    - PAYCOMPNONREC.USERID
    - PAYCOMPNONREC.PAY_COMPONENT
    - PAYCOMPNONREC.PAY_DATE
    - PAYCOMPNONREC.VALUE
    - PAYCOMPNONREC.CURRENCY
    - PAYCOMPNONREC.SEQUENCE_NUMBER
    severity: medium
    dimension: uniqueness
    message: Identical one-time payment (same employee, component, date, amount and currency) recorded more than once
    why_it_matters: When every identifying and monetary attribute of a one-time payment matches another row exactly, the row is a straightforward duplicate load rather than two distinguishable payments.
    rule_authority: best_practice
    sap_impact: Payroll pays the duplicated amount twice because nothing distinguishes the two rows.
    fix_map:
      __other__: Delete the duplicate.
    record_fix_template: 'Employee {PAYCOMPNONREC.USERID}: an identical one-time payment (same component, date, amount and currency) appears more than once. Delete the duplicate.'
  - id: COMP218
    field: COMPINFO.COMPA_RATIO
    check_class: cross_field_check
    fail_when: (`COMPINFO.COMPA_RATIO` == 1.0) and (`COMPINFO.SALARY` > 0) and (`COMPINFO.ANNUAL_SALARY` != `COMPINFO.PAY_RANGE_MID`)
    severity: low
    dimension: accuracy
    message: Compa-ratio is exactly 1.000 while annual salary does not equal the pay range midpoint
    why_it_matters: Compa-ratio is defined as annual salary divided by range midpoint; if the two values differ, the stored compa-ratio cannot genuinely be 1.000. The recorded value is inconsistent with its own inputs, whatever produced it.
    rule_authority: best_practice
    sap_impact: Compensation benchmarking uses a stored compa-ratio that does not match the salary and range-midpoint it should be derived from.
    fix_map:
      __other__: Recalculate the compa-ratio from annual salary and pay range midpoint.
    record_fix_template: 'Employee {COMPINFO.USERID}: compa-ratio is exactly 1.000 but annual salary does not equal the pay range midpoint. Recalculate it.'
  - id: COMP219
    field: PAYCOMPNONREC.PAY_DATE
    check_class: cross_field_check
    fail_when: (`EMPEMPLOYMENT.STATUS` == 'T') and `EMPEMPLOYMENT.END_DATE`.notna() and ((`PAYCOMPNONREC.PAY_DATE` - `EMPEMPLOYMENT.END_DATE`).dt.days > 180)
    severity: medium
    dimension: consistency
    message: One-time payment recorded while the employee's employment status is terminated and the termination predates the payment by more than the normal severance window
    why_it_matters: A one-time payment long after termination, beyond the ordinary final-pay or severance window, is unusual and worth confirming it is not a stale or erroneous late load.
    rule_authority: best_practice
    sap_impact: Finance cannot distinguish a legitimate late severance payment from a payroll error without this being flagged for review.
    fix_map:
      __other__: Confirm this is a legitimate late payment.
    record_fix_template: 'Employee {PAYCOMPNONREC.USERID}: one-time payment recorded more than 180 days after termination. Confirm this is a legitimate late payment.'
  - id: COMP220
    field: COMPINFO.PAY_SCALE_LEVEL
    check_class: cross_field_check
    fail_when: '`COMPINFO.PAY_SCALE_LEVEL`.notna() and (`COMPINFO.PAY_SCALE_TYPE`.isna() or `COMPINFO.PAY_SCALE_AREA`.isna())'
    severity: low
    dimension: consistency
    message: Pay scale level is populated without a pay scale type or area
    why_it_matters: A pay scale level only has meaning in the context of a pay scale type and area; a level recorded with no type or area is an incomplete SAP pay scale structure classification.
    rule_authority: sap_hard_constraint
    sap_impact: SAP payroll replication rejects a pay scale structure that has a level but no type or area to anchor it.
    fix_map:
      __other__: Complete the pay scale structure.
    record_fix_template: 'Employee {COMPINFO.USERID}: pay scale level is recorded without a pay scale type or area. Complete the pay scale structure.'
  - id: COMP222
    field: PAYCOMPNONREC.ALT_COST_CENTER
    check_class: cross_field_check
    fail_when: '`PAYCOMPNONREC.ALT_COST_CENTER`.notna() and `FOCOSTCENTER.LEGAL_ENTITY`.isna()'
    severity: medium
    dimension: consistency
    message: Alternative cost centre's legal entity is blank while the cost centre itself is populated
    why_it_matters: A cost centre record should carry its owning legal entity; a cost centre reference with no legal entity on its own master record is an incomplete configuration that blocks the cross-entity check this pack also runs.
    rule_authority: best_practice
    sap_impact: Intercompany posting validation cannot determine whether charging this cost centre crosses a legal entity boundary.
    fix_map:
      __other__: Alternative cost centre's legal entity is blank while the cost centre itself is populated
    record_fix_template: 'Employee {PAYCOMPNONREC.USERID}: alternative cost centre {PAYCOMPNONREC.ALT_COST_CENTER} has no legal entity recorded in its own master data. Complete the cost centre configuration.'
  - id: COMP223
    field: COMPINFO.PAY_RANGE_MIN
    check_class: cross_field_check
    fail_when: '`COMPINFO.PAY_RANGE_MIN`.notna() and `COMPINFO.PAY_RANGE_MID`.notna() and `COMPINFO.PAY_RANGE_MAX`.notna() and (`COMPINFO.PAY_RANGE_MAX` > `COMPINFO.PAY_RANGE_MIN`) and (((`COMPINFO.PAY_RANGE_MID` - `COMPINFO.PAY_RANGE_MIN`) / (`COMPINFO.PAY_RANGE_MAX` - `COMPINFO.PAY_RANGE_MIN`) < 0.33) or ((`COMPINFO.PAY_RANGE_MID` - `COMPINFO.PAY_RANGE_MIN`) / (`COMPINFO.PAY_RANGE_MAX` - `COMPINFO.PAY_RANGE_MIN`) > 0.67))'
    severity: low
    dimension: consistency
    message: Pay range minimum, midpoint and maximum are all populated but not evenly ordered around the midpoint by more than a token amount
    why_it_matters: A well-formed pay range normally has its midpoint closer to the middle of the min-max span; a midpoint that sits far outside the middle third of the range suggests the three bounds were not loaded from the same range revision.
    rule_authority: best_practice
    sap_impact: Range penetration calculated against a midpoint that is not actually central in its own min-max span is misleading.
    fix_map:
      __other__: Confirm the three bounds come from the same range revision.
    record_fix_template: 'Employee {COMPINFO.USERID}: pay range midpoint is not within the middle third of the min-max span. Confirm the three bounds come from the same range revision.'
  - id: COMP224
    field: PAYCOMPNONREC.NUMBER_OF_UNITS
    check_class: cross_field_check
    fail_when: '`PAYCOMPNONREC.NUMBER_OF_UNITS` < 0'
    severity: medium
    dimension: accuracy
    message: Number of units on a one-time payment is negative
    why_it_matters: A unit count below zero is not a valid quantity for a one-time payment and indicates a data load error.
    rule_authority: sap_hard_constraint
    sap_impact: Unit-rate reconciliation cannot be performed when the recorded unit count is negative.
    fix_map:
      __other__: Correct the recorded quantity.
    record_fix_template: 'Employee {PAYCOMPNONREC.USERID}: one-time payment has a negative number of units. Correct the recorded quantity.'
  - id: COMP226
    field: COMPINFO.EFFECTIVE_DATE_COMP
    check_class: cross_field_check
    fail_when: '`COMPINFO.EFFECTIVE_DATE_COMP`.notna() and `COMPINFO.EFFECTIVE_DATE`.notna() and (`COMPINFO.EFFECTIVE_DATE_COMP` < `COMPINFO.EFFECTIVE_DATE`)'
    severity: medium
    dimension: consistency
    message: Compensation-specific effective date is earlier than the record's own effective date
    why_it_matters: COMPINFO carries two effective dates, a general one and a compensation-specific one; the compensation-specific date is expected to be on or after the general effective date it refines, not before it.
    rule_authority: best_practice
    sap_impact: Effective-dated history built from the compensation-specific date runs backwards relative to the general record it belongs to.
    fix_map:
      __other__: Confirm the two dates.
    record_fix_template: 'Employee {COMPINFO.USERID}: compensation-specific effective date is earlier than the record''s general effective date. Confirm the two dates.'
  - id: COMP227
    field: COMPINFO.PAY_COMPONENT_RECURRING
    check_class: cross_field_check
    fail_when: (`COMPINFO.PAY_COMPONENT_RECURRING`.str.lower() == 'true') and (`COMPINFO.PAY_COMPONENT_IS_EARNING`.str.lower() == 'true') and (`COMPINFO.PAY_COMPONENT_CAN_OVERRIDE`.str.lower() == 'true') and `COMPINFO.PAY_COMPONENT_DEFAULT`.isna()
    severity: low
    dimension: consistency
    message: Pay component is flagged recurring but is also flagged as an earning that can be overridden with no default value set
    why_it_matters: A recurring component that can be freely overridden still needs a sensible default to fall back on; a recurring, overridable earning with no default value configured is an incomplete setup.
    rule_authority: best_practice
    sap_impact: Compensation planning templates that pre-fill this component have nothing to fall back on when no override is entered.
    fix_map:
      __other__: Pay component is flagged recurring but is also flagged as an earning that can be overridden with no default value set
    record_fix_template: 'Employee {COMPINFO.USERID}: pay component {COMPINFO.PAY_TYPE} is a recurring, overridable earning with no default value. Load a default value.'
  - id: COMP228
    field: COMPINFO.CURRENCY
    check_class: regex_check
    pattern: ^[A-Z]{3}$
    severity: medium
    dimension: validity
    message: Compensation currency code is not a 3-letter ISO currency code
    why_it_matters: SAP compensation currency fields hold a 3-letter ISO 4217 code; anything else is a typo or an unmapped currency value.
    rule_authority: sap_hard_constraint
    sap_impact: Payroll replication rejects a currency code that is not a valid 3-letter ISO code.
    fix_map:
      __other__: Correct the currency code.
    record_fix_template: 'Employee {COMPINFO.USERID}: compensation currency code is not a 3-letter ISO code. Correct the currency code.'
    auto_fix:
      confidence: medium
      steps:
        - op: strip
        - op: upper
  - id: COMP229
    field: PAYCOMPNONREC.CURRENCY
    check_class: regex_check
    pattern: ^[A-Z]{3}$
    severity: medium
    dimension: validity
    message: One-time payment currency code is not a 3-letter ISO currency code
    why_it_matters: SAP compensation currency fields hold a 3-letter ISO 4217 code; anything else is a typo or an unmapped currency value.
    rule_authority: sap_hard_constraint
    sap_impact: Payroll replication rejects a currency code that is not a valid 3-letter ISO code.
    fix_map:
      __other__: Correct the currency code.
    record_fix_template: 'Employee {PAYCOMPNONREC.USERID}: one-time payment currency code is not a 3-letter ISO code. Correct the currency code.'
    auto_fix:
      confidence: medium
      steps:
        - op: strip
        - op: upper
  - id: COMP230
    field: COMPINFO.PAY_GRADE
    check_class: regex_check
    pattern: ^[\x20-\x7E]{1,128}$
    severity: low
    dimension: validity
    message: Pay grade code contains characters outside the standard grade-code pattern
    why_it_matters: Pay grade codes are short alphanumeric identifiers; a value with unexpected characters usually comes from a corrupted load rather than a real grade.
    rule_authority: best_practice
    sap_impact: Compensation planning and range-penetration reporting cannot reliably group employees by a malformed grade code.
    fix_map:
      __other__: Correct the grade code.
    record_fix_template: 'Employee {COMPINFO.USERID}: pay grade code contains unexpected characters. Correct the grade code.'
  - id: COMP231
    field: COMPINFO.ANNUAL_SALARY
    check_class: cross_field_check
    fail_when: '`COMPINFO.PAY_RANGE_MIN`.notna() and (`COMPINFO.PAY_RANGE_MIN` > 0) and (`COMPINFO.PAY_RANGE_FREQUENCY` == `COMPINFO.COMP_FREQUENCY`) and (`COMPINFO.PAY_RANGE_CURRENCY` == `COMPINFO.CURRENCY`) and (`COMPINFO.ANNUAL_SALARY` < (`COMPINFO.PAY_RANGE_MIN` * 0.5))'
    severity: medium
    dimension: accuracy
    message: Annual salary is far below the pay range minimum for the employee's grade
    why_it_matters: An annual salary materially below the grade's own minimum bound suggests either the salary or the range bound was loaded incorrectly, beyond ordinary below-range exceptions.
    rule_authority: best_practice
    sap_impact: Compensation benchmarking flags this employee as severely underpaid against a range that may itself be wrong.
    fix_map:
      __other__: Confirm the salary or the range bound.
    record_fix_template: 'Employee {COMPINFO.USERID}: annual salary is less than half the pay range minimum for this grade. Confirm the salary or the range bound.'
  - id: COMP232
    field: COMPINFO.ANNUAL_SALARY
    check_class: cross_field_check
    fail_when: '`COMPINFO.PAY_RANGE_MAX`.notna() and (`COMPINFO.PAY_RANGE_MAX` > 0) and (`COMPINFO.PAY_RANGE_FREQUENCY` == `COMPINFO.COMP_FREQUENCY`) and (`COMPINFO.PAY_RANGE_CURRENCY` == `COMPINFO.CURRENCY`) and (`COMPINFO.ANNUAL_SALARY` > (`COMPINFO.PAY_RANGE_MAX` * 2))'
    severity: medium
    dimension: accuracy
    message: Annual salary is far above the pay range maximum for the employee's grade
    why_it_matters: An annual salary materially above the grade's own maximum bound suggests either the salary or the range bound was loaded incorrectly, beyond ordinary above-range exceptions.
    rule_authority: best_practice
    sap_impact: Compensation benchmarking flags this employee as severely overpaid against a range that may itself be wrong.
    fix_map:
      __other__: Confirm the salary or the range bound.
    record_fix_template: 'Employee {COMPINFO.USERID}: annual salary is more than double the pay range maximum for this grade. Confirm the salary or the range bound.'
  - id: COMP233
    field: COMPINFO.PAY_RANGE_CURRENCY
    check_class: cross_field_check
    fail_when: '`COMPINFO.PAY_RANGE_CURRENCY`.notna() and `COMPINFO.CURRENCY`.notna() and (`COMPINFO.PAY_RANGE_CURRENCY` != `COMPINFO.CURRENCY`)'
    severity: medium
    dimension: consistency
    message: Pay range currency differs from the compensation record's own currency
    why_it_matters: The pay range bounds and the compensation amount being compared against them should be expressed in the same currency; comparing across currencies without conversion produces a meaningless compa-ratio or range penetration.
    rule_authority: sap_hard_constraint
    sap_impact: Range penetration and compa-ratio are computed without a currency conversion and are therefore invalid.
    fix_map:
      __other__: Confirm which currency the range bounds use.
    record_fix_template: 'Employee {COMPINFO.USERID}: pay range currency differs from the compensation record''s own currency. Confirm which currency the range bounds use.'
  - id: COMP234
    field: COMPINFO.PAY_COMPONENT_IS_EARNING
    check_class: cross_field_check
    fail_when: (`COMPINFO.PAY_COMPONENT_IS_EARNING`.str.lower() == 'true') and (`COMPINFO.PAY_COMPONENT_CAN_OVERRIDE`.str.lower() == 'false') and `COMPINFO.PAY_COMPONENT_DEFAULT`.isna()
    severity: low
    dimension: consistency
    message: Pay component is flagged as an earning and also flagged as not eligible to be overridden while its default value is blank
    why_it_matters: A non-overridable earning component depends entirely on its configured default value; if that default is blank there is no value this component can ever take.
    rule_authority: best_practice
    sap_impact: This earning component can never be paid an amount because its default is blank and it cannot be overridden.
    fix_map:
      __other__: Pay component is flagged as an earning and also flagged as not eligible to be overridden while its default value is blank
    record_fix_template: 'Employee {COMPINFO.USERID}: pay component {COMPINFO.PAY_TYPE} is a non-overridable earning with a blank default value. Load a default value or allow overrides.'
  - id: COMP238
    field: PAYCOMPNONREC.VALUE
    check_class: cross_field_check
    fail_when: (`PAYCOMPNONREC.VALUE` > 0) and `PAYCOMPNONREC.CURRENCY`.isna()
    severity: low
    dimension: accuracy
    message: One-time payment value has no currency recorded
    why_it_matters: A monetary amount without a currency cannot be posted, benchmarked or converted; currency is required alongside any non-zero value.
    rule_authority: sap_hard_constraint
    sap_impact: Payroll replication cannot post a monetary amount that has no currency attached.
    fix_map:
      __other__: Assign the correct currency.
    record_fix_template: 'Employee {PAYCOMPNONREC.USERID}: one-time payment value is recorded but no currency is set. Assign the correct currency.'
  - id: COMP239
    field: COMPINFO.PAY_COMPONENT_TYPE
    check_class: domain_value_check
    allowed_values:
    - AMOUNT
    - PERCENTAGE
    - NUMBER
    valid_values_with_labels:
      AMOUNT: Amount
      PERCENTAGE: Percentage
      NUMBER: Number
    severity: low
    dimension: validity
    message: Pay component type is not one of the supported classifications
    why_it_matters: The pay component type classifies how a component's value should be interpreted; a value outside the supported set is not a type the engine or SAP payroll can process.
    rule_authority: sap_hard_constraint
    sap_impact: SAP payroll replication rejects a pay component type outside its supported set.
    fix_map:
      __other__: Correct it.
    record_fix_template: 'Employee {COMPINFO.USERID}: pay component type is not AMOUNT, PERCENTAGE or NUMBER. Correct it.'
  - id: COMP242
    field: COMPINFO.SALARY
    check_class: cross_field_check
    fail_when: (`COMPINFO.SALARY` > 0) and `COMPINFO.PAY_TYPE`.isna()
    severity: medium
    dimension: accuracy
    message: Salary is recorded but the pay component on the same row is blank
    why_it_matters: A compensation amount with no pay component attached cannot be classified as any specific element of pay.
    rule_authority: sap_hard_constraint
    sap_impact: Payroll replication cannot post this amount because it has no pay component to post it against.
    fix_map:
      __other__: Assign the correct pay component.
    record_fix_template: 'Employee {COMPINFO.USERID}: salary amount is recorded but the pay component field is blank. Assign the correct pay component.'
  - id: COMP243
    field: PAYCOMPNONREC.VALUE
    check_class: cross_field_check
    fail_when: (`PAYCOMPNONREC.VALUE` > 0) and `PAYCOMPNONREC.PAY_COMPONENT`.isna()
    severity: medium
    dimension: accuracy
    message: One-time payment amount is recorded but the pay component is blank
    why_it_matters: A one-time payment amount with no pay component attached cannot be classified as any specific element of pay.
    rule_authority: sap_hard_constraint
    sap_impact: Payroll replication cannot post this one-time payment because it has no pay component to post it against.
    fix_map:
      __other__: Assign the correct pay component.
    record_fix_template: 'Employee {PAYCOMPNONREC.USERID}: one-time payment amount is recorded but the pay component field is blank. Assign the correct pay component.'
  - id: COMP244
    field: COMPINFO.PAY_GROUP
    check_class: cross_field_check
    fail_when: '`COMPINFO.PAY_GROUP`.notna() and `COMPINFO.PAY_RANGE_CURRENCY`.isna() and `COMPINFO.PAY_RANGE_FREQUENCY`.isna()'
    severity: low
    dimension: consistency
    message: Pay group is recorded but no corresponding pay range currency or frequency is recorded
    why_it_matters: A pay group is normally loaded together with the pay range metadata it governs; a pay group with neither a range currency nor a range frequency recorded is an incomplete load.
    rule_authority: best_practice
    sap_impact: Range-based compensation planning for this employee's pay group has no currency or frequency to interpret the range bounds with.
    fix_map:
      __other__: Complete the pay range metadata.
    record_fix_template: 'Employee {COMPINFO.USERID}: pay group is recorded but neither pay range currency nor pay range frequency is recorded. Complete the pay range metadata.'
  - id: COMP245
    field: COMPINFO.EVENT_REASON
    check_class: exists_check
    target_table: FOEVENTREASON
    target_fields:
    - EXTERNAL_CODE
    severity: low
    dimension: referential
    message: Compensation event reason is not a configured event reason code
    why_it_matters: An event reason used on a compensation record should exist in the event reason configuration; one that does not usually means a typo or an unmapped reason code.
    rule_authority: best_practice
    sap_impact: Compensation change reporting grouped by event reason cannot classify this record.
    fix_map:
      __other__: Correct the reason code.
    record_fix_template: 'Employee {COMPINFO.USERID}: compensation event reason is not a configured event reason code. Correct the reason code.'
  - id: COMP246
    field: COMPINFO.PAY_TYPE
    check_class: regex_check
    pattern: ^[\x20-\x7E]{1,32}$
    severity: low
    dimension: validity
    message: Pay component code contains characters outside the standard component-code pattern
    why_it_matters: Pay component codes are short alphanumeric identifiers; a value with unexpected characters usually comes from a corrupted load rather than a real component.
    rule_authority: best_practice
    sap_impact: SAP payroll replication cannot resolve a malformed pay component code to an infotype wage type.
    fix_map:
      __other__: Correct the component code.
    record_fix_template: 'Employee {COMPINFO.USERID}: pay component code contains unexpected characters. Correct the component code.'
    auto_fix:
      confidence: medium
      steps:
        - op: strip
        - op: upper
  - id: COMP247
    field: PAYCOMPNONREC.PAY_COMPONENT
    check_class: regex_check
    pattern: ^[\x20-\x7E]{1,32}$
    severity: low
    dimension: validity
    message: One-time payment pay component code contains characters outside the standard component-code pattern
    why_it_matters: Pay component codes are short alphanumeric identifiers; a value with unexpected characters usually comes from a corrupted load rather than a real component.
    rule_authority: best_practice
    sap_impact: SAP payroll replication cannot resolve a malformed pay component code to an infotype wage type.
    fix_map:
      __other__: Correct the component code.
    record_fix_template: 'Employee {PAYCOMPNONREC.USERID}: one-time payment pay component code contains unexpected characters. Correct the component code.'
    auto_fix:
      confidence: medium
      steps:
        - op: strip
        - op: upper
  - id: COMP248
    field: COMPINFO.PAY_COMPONENT_TYPE
    check_class: dependency_check
    determinant: COMPINFO.PAY_TYPE
    severity: low
    dimension: consistency
    message: Pay component type is not consistent for all compensation rows sharing the same pay component code
    why_it_matters: A pay component code should carry one fixed classification wherever it is used; a different component type recorded for the same component code usually means the component's own master configuration was loaded inconsistently.
    rule_authority: best_practice
    sap_impact: Compensation reporting that groups by component type cannot tell which classification is correct for this component.
    fix_map:
      __other__: Correct the pay component type so it is the same for every row using this component code.
    record_fix_template: 'Employee {COMPINFO.USERID}: pay component {COMPINFO.PAY_TYPE} has a component type inconsistent with other rows using the same component code. Correct it.'
  - id: COMP249
    field: COMPINFO.EFFECTIVE_DATE
    check_class: interval_check
    start: COMPINFO.EFFECTIVE_DATE
    end: COMPINFO.END_DATE
    group_by:
    - COMPINFO.USERID
    - COMPINFO.PAY_TYPE
    mode: continuous
    severity: low
    dimension: consistency
    message: Compensation records for the same pay type have a gap between periods
    why_it_matters: A gap between one compensation record's end date and the next record's effective date for the same pay type means the employee has no compensation record covering that stretch, which is usually a missed delimitation or a missing row rather than a deliberate break in pay.
    rule_authority: best_practice
    sap_impact: Payroll replication has no salary record to use for the gap period.
    fix_map:
      __other__: Confirm whether the gap is intentional; if not, add or correct the missing compensation record.
    record_fix_template: 'Employee {COMPINFO.USERID}: has a gap between compensation records for pay type {COMPINFO.PAY_TYPE}. Confirm or fill the gap.'
  - id: COMP250
    field: COMPINFO.END_DATE
    check_class: interval_check
    start: COMPINFO.EFFECTIVE_DATE
    end: COMPINFO.END_DATE
    group_by:
    - COMPINFO.USERID
    - COMPINFO.PAY_TYPE
    open_ended: true
    applies_when:
      EMPEMPLOYMENT.STATUS:
      - A
      - U
      - P
      - S
    severity: medium
    dimension: consistency
    message: Active employee's most recent compensation record for this pay type is end-dated
    why_it_matters: An active employee's current compensation record should run open-ended (no end date); an end-dated most-recent record for an active employee means the next record was never loaded.
    rule_authority: best_practice
    sap_impact: Payroll replication has no open compensation record to use for the employee's current pay.
    fix_map:
      __other__: Load the missing current compensation record, or correct the end date if the employee has no active pay for this type.
    record_fix_template: 'Employee {COMPINFO.USERID}: is active but the most recent compensation record for pay type {COMPINFO.PAY_TYPE} is end-dated. Load the current record.'
  - id: COMP251
    field: EMPEMPLOYMENT.USERID
    check_class: exists_check
    target_table: COMPINFO
    target_fields:
    - USERID
    applies_when:
      EMPEMPLOYMENT.STATUS:
      - A
      - U
      - P
      - S
    severity: high
    dimension: completeness
    message: Active employee has no compensation record at all
    why_it_matters: Every active employee should have at least one compensation record. An active employee with none was never given a salary record, or the record failed to load.
    rule_authority: sap_hard_constraint
    sap_impact: Payroll replication has no base pay to replicate for this active employee.
    fix_map:
      __other__: Load a compensation record for this active employee, or correct their employment status if they should not be active.
    record_fix_template: 'Employee {actual_value}: is active but has no compensation record. Load one.'
