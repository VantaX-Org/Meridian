    severity: high
    dimension: consistency
    message: Employing company is inactive but the compensation record is still open with a positive salary
    why_it_matters: An inactive company configuration should not be the employer of record for an open, paid compensation record.
    rule_authority: best_practice
    sap_impact: The employee's cost is still reported against a company that configuration marks as inactive.
    fix_map:
      __other__: Close the compensation record, or reactivate the company if it is still trading.
    record_fix_template: 'Employee {COMPINFO.USERID}: employing company is inactive but compensation is still open with a positive salary. Close it or reactivate the company.'
  - id: COMP189
    field: PAYCOMPNONREC.VALUE
