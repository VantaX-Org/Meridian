  - id: COMP186
    field: COMPINFO.SALARY
    check_class: cross_field_check
    fail_when: (`USERACCOUNT.STATUS` == 'I') and (`COMPINFO.SALARY` > 0) and `COMPINFO.PAYCOMP_END_DATE`.isna()
    severity: high
    dimension: consistency
    message: User account is inactive but the compensation record is still open with a positive salary
    why_it_matters: An inactive user account usually means the employee's SuccessFactors access has been closed out; an open, paid compensation record after that point suggests offboarding was incomplete.
    rule_authority: best_practice
    sap_impact: The employee continues to accrue pay in the extract after their user account was deactivated.
    fix_map:
      __other__: Close the compensation record, or reactivate the user account if the employee is still active.
    record_fix_template: 'Employee {COMPINFO.USERID}: user account is inactive but compensation is still open with a positive salary. Close it or reactivate the account.'
  - id: COMP187
    field: PAYCOMPNONREC.VALUE
    check_class: cross_field_check
