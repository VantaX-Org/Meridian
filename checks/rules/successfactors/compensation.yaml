    rule_authority: best_practice
    sap_impact: The employee continues to receive pay in the extract after their user account was deactivated.
    fix_map:
      __other__: Confirm the payment is a legitimate final settlement, or reactivate the user account if the employee is still active.
    record_fix_template: 'Employee {PAYCOMPNONREC.USERID}: user account is inactive but receives a non-recurring payment. Confirm or reactivate the account.'
    applies_when:
      PAYCOMPNONREC.PAY_DATE:
        within_days: 365

  - id: COMP188
    field: COMPINFO.SALARY
