module: learning_management
target_state: SUCCESSFACTORS
rules:

  - id: LMS001
    field: LEARNINGASSIGNMENT.USERID
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "User ID is mandatory — orphaned assignments cannot be tracked for compliance"
    why_it_matters: >-
      USERID links a learning assignment to a specific employee. Without it, the
      assignment is orphaned and cannot appear on the employee's learning transcript.
      For compliance-critical training (health and safety, anti-bribery, data
      protection), an orphaned assignment means the organisation has no auditable
      evidence that the employee was assigned the required training.
    rule_authority: best_practice
    sap_impact: >-
      Assignment not visible on employee transcript. Compliance reports show training as
      unassigned. Audit trail for mandatory training is broken.
    fix_map:
      __blank__: >-
        Identify the correct employee and assign their USERID via Learning > Admin >
        Assignment Management. Cross-reference with EC employee records to find the
        correct USERID.
    record_fix_template: >-
      Assignment {LEARNINGASSIGNMENT.USERID}: USERID is missing. Link to correct
      employee via Learning > Admin > Assignment Management.

  - id: LMS002
    field: LEARNINGASSIGNMENT.COURSE_ID
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Course ID is mandatory — links assignment to course catalogue content"
    why_it_matters: >-
      COURSE_ID links the assignment to a specific course in the Learning catalogue.
      Without it, the learner sees an assignment with no content — they cannot launch the
      course, complete it, or receive credit. For compliance training, this means
      mandatory courses appear assigned but are impossible to complete.
    rule_authority: best_practice
    sap_impact: >-
      Learner cannot launch or complete the assigned course. Assignment appears in
      transcript but content is unavailable. Compliance training completion is blocked.
    fix_map:
      __blank__: >-
        Link to the correct course via Learning > Admin > Assignment Management. The
        course must exist and be active in the Learning catalogue.
    record_fix_template: >-
      Assignment for {LEARNINGASSIGNMENT.USERID}: COURSE_ID is missing. Link to a valid
      course via Learning > Admin > Assignment Management.

  - id: LMS003
    field: LEARNINGASSIGNMENT.DUE_DATE
    check_class: null_check
    severity: high
    dimension: completeness
    message: Due date is required for overdue alerts and compliance escalation
    why_it_matters: DUE_DATE drives the overdue alert engine and compliance escalation workflows. Without a due date, the system
      cannot generate overdue notifications to learners or escalate non-completion to managers. For compliance training with
      regulatory deadlines, missing due dates mean the organisation has no automated mechanism to enforce timely completion.
    rule_authority: best_practice
    sap_impact: No overdue alerts generated for this assignment. Manager escalation workflow cannot trigger. Compliance dashboard
      shows no deadline.
    fix_map:
      __blank__: Set an appropriate due date via Learning > Admin > Assignment Management. For compliance training, align with
        regulatory deadline. Use ISO format YYYY-MM-DD.
    record_fix_template: 'Assignment for {LEARNINGASSIGNMENT.USERID}: DUE_DATE is missing. Set deadline via Learning > Admin
      > Assignment Management. Format: YYYY-MM-DD.'
    applies_when:
      LEARNINGASSIGNMENT.REQUIRED:
      - 'True'
      - 'true'
      - 'TRUE'
      - Y
      - '1'


  - id: LMS005
    field: LEARNINGASSIGNMENT.COURSE_TITLE
    check_class: null_check
    severity: medium
    dimension: completeness
    message: "Course title is required for learner-facing display and reporting"
    why_it_matters: >-
      COURSE_TITLE is the human-readable name displayed on the learner's transcript and
      in compliance reports. A blank title makes it impossible for the learner to identify
      the training and produces unreadable compliance reports.
    rule_authority: best_practice
    sap_impact: >-
      Learner transcript shows blank course entry. Compliance reports list unnamed
      training assignments. Manager reports are unreadable.
    fix_map:
      __blank__: >-
        Populate the course title from the Learning catalogue. Should match the title
        configured in Learning > Admin > Course Management. Update via Assignment
        Management.
    record_fix_template: >-
      Assignment for {LEARNINGASSIGNMENT.USERID}: COURSE_TITLE is blank. Populate from
      the course catalogue via Learning > Admin > Assignment Management.

  - id: LMS006
    field: LEARNINGASSIGNMENT.REQUIRED
    check_class: domain_value_check
    allowed_values:
    - 'true'
    - 'false'
    - 'True'
    - 'False'
    - Y
    - N
    severity: medium
    dimension: accuracy
    message: Required flag must be Y (mandatory) or N (optional)
    why_it_matters: The REQUIRED flag determines whether the assignment is treated as mandatory compliance training or optional
      development. Incorrect values cause compliance reports to either miss mandatory training or incorrectly flag optional
      courses as compliance gaps.
    rule_authority: best_practice
    sap_impact: Compliance reporting incorrectly classifies this assignment. Mandatory training may be treated as optional or
      vice versa.
    valid_values_with_labels:
      'true': Required
      'false': Optional
      'True': Required
      'False': Optional
      Y: Required (legacy export)
      N: Optional (legacy export)
    fix_map:
      __blank__: Set the required flag to Y for mandatory training or N for optional. Update via Learning > Admin > Assignment
        Management.
      __other__: Required flag '{invalid_value}' is not valid. Use Y (mandatory) or N (optional). Update via Learning > Admin
        > Assignment Management.
    record_fix_template: 'Assignment for {LEARNINGASSIGNMENT.USERID}: REQUIRED flag ''{actual_value}'' is invalid. Set to Y
      or N via Learning > Admin > Assignment Management.'

  - id: LMS007
    field: LEARNINGASSIGNMENT.ASSIGNED_DATE
    check_class: null_check
    severity: medium
    dimension: completeness
    message: "Assigned date is required for tracking assignment lifecycle and SLA compliance"
    why_it_matters: >-
      ASSIGNED_DATE records when the training was assigned to the learner. It is used to
      calculate the time between assignment and completion, which is a key SLA metric for
      compliance training programmes.
    rule_authority: best_practice
    sap_impact: >-
      Assignment-to-completion time cannot be calculated. SLA compliance for training
      programmes cannot be measured.
    fix_map:
      __blank__: >-
        Set the assigned date to when the training was originally assigned. Update via
        Learning > Admin > Assignment Management. Format: YYYY-MM-DD.
    record_fix_template: >-
      Assignment for {LEARNINGASSIGNMENT.USERID}: ASSIGNED_DATE is missing. Set via
      Learning > Admin > Assignment Management. Format: YYYY-MM-DD.


  - id: LMS009
    field: LEARNINGCOMPLETION.COMPLETION_DATE
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Completion date is required as evidence for compliance audits"
    why_it_matters: >-
      COMPLETION_DATE is the timestamp that proves when an employee satisfied a training
      requirement. Without it, compliance auditors cannot verify that training was
      completed within the required timeframe. Recertification workflows also rely on
      this date to calculate when the next cycle of training is due.
    rule_authority: best_practice
    sap_impact: >-
      Compliance audit evidence incomplete — no proof of when training was completed.
      Recertification due date cannot be calculated. Training history has gaps.
    fix_map:
      __blank__: >-
        Set the actual completion date via Learning > Admin > Completion Management. Use
        ISO format YYYY-MM-DD. For historical records, use the date the learner finished
        the course.
    record_fix_template: >-
      Completion for {LEARNINGASSIGNMENT.USERID}: COMPLETION_DATE is missing. Set via
      Learning > Admin > Completion Management. Format: YYYY-MM-DD.




  - id: LMS013
    field: LEARNINGASSIGNMENT.USERID
    check_class: uniqueness_check
    fields: [LEARNINGASSIGNMENT.USERID, LEARNINGASSIGNMENT.COURSE_ID]
    severity: high
    dimension: uniqueness
    message: Duplicate learning assignment records per employee — same course assigned multiple times
    why_it_matters: Duplicate assignments inflate compliance completion metrics and may cause learners to be re-enrolled
      in completed courses.
    rule_authority: best_practice
    sap_impact: Compliance dashboards show incorrect completion rates. Learners receive duplicate notifications. Training
      cost reports are overstated.
    fix_map: {__blank__: Review duplicate assignments in Learning > Admin > Assignment Rules. Remove the duplicate
        assignment. Verify completion status on the surviving record.}
    record_fix_template: "Employee {LEARNINGASSIGNMENT.USERID}, course {LEARNINGASSIGNMENT.COURSE_ID}: assigned more than once. Remove the duplicate assignment in the LMS admin."

  - id: LMS014
    field: LEARNINGASSIGNMENT.DUE_DATE
    check_class: freshness_check
    max_age_hours: 24
    severity: high
    dimension: timeliness
    message: Learning assignment past due date — overdue mandatory training creates compliance risk
    rule_authority: best_practice
    why_it_matters: Learning assignments past their due date represent overdue mandatory training — a direct compliance and
      audit exposure, especially for regulated curricula.
    sap_impact: Compliance dashboards report false completion; audits flag overdue mandatory training; certifications lapse
      and access entitlements based on training become invalid.
    fix_map:
      __blank__: 'In SuccessFactors Learning: notify the assignee and manager, extend or reassign the item if appropriate, and
        escalate persistently overdue mandatory training to the compliance owner.'
    record_fix_template: Learning assignment {field} is overdue by {age_days} days. Notify assignee/manager, reassign or extend,
      and escalate if mandatory.
    applies_when:
      LEARNINGASSIGNMENT.REQUIRED:
      - 'True'
      - 'true'
      - 'TRUE'
      - Y
      - '1'

  - id: LMS015
    field: LEARNINGASSIGNMENT.STATUS
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Learning assignment status (LEARNINGASSIGNMENT.STATUS) is mandatory"
    why_it_matters: >-
      STATUS records whether a learning assignment is assigned, in progress,
      completed, or overdue. Without it, the assignment cannot be tracked on
      the employee transcript and compliance completion reporting is impossible
      — for mandatory training this breaks the auditable evidence trail.
    rule_authority: best_practice
    sap_impact: >-
      Assignment progress cannot be determined. Compliance dashboards report
      incorrect completion rates and the audit trail for mandatory training is
      incomplete.
    fix_map:
      __blank__: >-
        Set the correct assignment status via Learning > Admin > Assignment
        Management. Reconcile with the learner's actual completion record.
    record_fix_template: >-
      Assignment {LEARNINGASSIGNMENT.USERID}: status is missing. Set via
      Learning > Admin > Assignment Management.

  - id: LMS016
    field: LEARNINGASSIGNMENT.DUE_DATE
    check_class: cross_field_check
    fail_when: '`LEARNINGASSIGNMENT.DUE_DATE`.dt.normalize() < `LEARNINGASSIGNMENT.ASSIGNED_DATE`.dt.normalize()'
    require_populated: true
    severity: medium
    dimension: consistency
    message: Assignment is due before the day it was assigned
    why_it_matters: 'A required date before the assignment date makes the item overdue the moment it is assigned: the learner
      never had a compliant window, overdue notifications fire immediately and compliance reporting counts a breach that is
      a data error.'
    rule_authority: best_practice
    sap_impact: Item overdue on assignment; compliance KPIs and overdue escalations wrong for this learner.
    fix_map:
      __blank__: Correct the required date (or the assignment date) in Learning Administration > Users > Learning Plan.
    record_fix_template: 'Learner {LEARNINGASSIGNMENT.USERID}: {LEARNINGASSIGNMENT.COURSE_ID} due {LEARNINGASSIGNMENT.DUE_DATE},
      before it was assigned ({LEARNINGASSIGNMENT.ASSIGNED_DATE}).'
  - id: LMS017
    field: LEARNINGCOMPLETION.USERID
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Learning history record must identify the learner
    why_it_matters: 'A completion without a learner ID cannot be credited to anyone: the learner''s compliance status stays
      incomplete and the record is invisible to every report.'
    rule_authority: sap_hard_constraint
    sap_impact: Completion not credited; learner appears non-compliant; certification evidence lost.
    fix_map:
      __blank__: Re-record the learning event for the correct learner via Learning Administration > Record Learning.
    record_fix_template: 'Learning history {LEARNINGCOMPLETION.COURSE_ID}: learner ID is missing.'
  - id: LMS018
    field: LEARNINGCOMPLETION.COURSE_ID
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Learning history record must identify the learning item
    why_it_matters: 'A completion without an item ID cannot satisfy any requirement: assignments and curricula stay open and
      the record cannot be audited.'
    rule_authority: sap_hard_constraint
    sap_impact: Required assignment not closed; curriculum status wrong; audit evidence missing.
    fix_map:
      __blank__: Re-record the learning event against the correct item via Learning Administration > Record Learning.
    record_fix_template: 'Learning history {LEARNINGCOMPLETION.USERID}: item ID is missing.'
  - id: LMS019
    field: LEARNINGCOMPLETION.STATUS
    check_class: null_check
    severity: high
    dimension: completeness
    message: Learning history record must carry a completion status
    why_it_matters: The completion status decides whether a learning event satisfies the requirement (completed/passed) or
      not (failed, incomplete). Without it, SAP SuccessFactors Learning cannot decide whether the item is fulfilled.
    rule_authority: sap_hard_constraint
    sap_impact: Requirement not fulfilled; curriculum and compliance status cannot be computed for this record.
    fix_map:
      __blank__: Set the completion status on the learning event via Learning Administration > Learning History.
    record_fix_template: 'Learning history {LEARNINGCOMPLETION.USERID}/{LEARNINGCOMPLETION.COURSE_ID}: completion status missing.'
  - id: LMS020
    field: LEARNINGCOMPLETION.SCORE
    check_class: cross_field_check
    fail_when: '`LEARNINGCOMPLETION.SCORE` < 0'
    require_populated: true
    severity: low
    dimension: validity
    message: Learning score must not be negative
    why_it_matters: Scores are compared with the item's passing threshold. A negative score is a load or interface error and
      turns a pass into a fail (or hides a real result) in assessment reporting.
    rule_authority: best_practice
    sap_impact: Pass/fail determination and assessment analytics wrong for this record.
    fix_map:
      __blank__: Correct the score on the learning history record via Learning Administration.
    record_fix_template: 'Employee {LEARNINGCOMPLETION.USERID}: Learning score must not be negative. Correct the record.'
  - id: LMS021
    field: LEARNINGCOMPLETION.CREDIT_HOURS
    check_class: cross_field_check
    fail_when: '`LEARNINGCOMPLETION.CREDIT_HOURS` < 0'
    require_populated: true
    severity: low
    dimension: validity
    message: Credit hours must not be negative
    why_it_matters: Credit hours accumulate towards continuing-education and certification requirements. A negative value
      subtracts hours the learner earned elsewhere.
    rule_authority: best_practice
    sap_impact: Continuing-education and certification hour totals understated.
    fix_map:
      __blank__: Correct the credit hours on the learning history record via Learning Administration.
    record_fix_template: 'Learning history {LEARNINGCOMPLETION.USERID}/{LEARNINGCOMPLETION.COURSE_ID}: credit hours {LEARNINGCOMPLETION.CREDIT_HOURS}
      are negative.'
  - id: LMS022
    field: LEARNINGCOMPLETION.COMPLETION_DATE
    check_class: cross_field_check
    fail_when: '`LEARNINGCOMPLETION.COMPLETION_DATE`.dt.normalize() > @today'
    severity: medium
    dimension: validity
    message: Learning completion is dated in the future
    why_it_matters: A course can only be completed on or before today. A future completion date is a typing error or a
      record entered in advance.
    rule_authority: best_practice
    sap_impact: Compliance reports count training that has not happened; certification expiry dates are calculated from
      the wrong date.
    fix_map:
      __other__: Correct the completion date in the learning history (Record Learning).
    record_fix_template: 'Employee {LEARNINGCOMPLETION.USERID}: course {LEARNINGCOMPLETION.COURSE_ID} completed
      {LEARNINGCOMPLETION.COMPLETION_DATE}, which is in the future.'
  - id: LMS023
    field: LEARNINGCOMPLETION.USERID
    check_class: exists_check
    target_table: EMPEMPLOYMENT
    target_fields:
    - USERID
    severity: medium
    dimension: consistency
    message: Learning completion belongs to a user without employment
    why_it_matters: A completion must belong to an employee. A user that has no employment record cannot be linked to a person in a migration.
    rule_authority: best_practice
    sap_impact: The training history is orphaned and is dropped or cannot be loaded.
    fix_map:
      __other__: Link the completion to an existing employee or archive it.
    record_fix_template: Learning completion for user {LEARNINGCOMPLETION.USERID} has no employment record. Review.
  - id: LMS024
    field: LEARNINGASSIGNMENT.USERID
    check_class: exists_check
    target_table: EMPEMPLOYMENT
    target_fields:
    - USERID
    severity: medium
    dimension: consistency
    message: Learning assignment belongs to a user without employment
    why_it_matters: An assignment must belong to an employee. Assignments to users without employment are orphans.
    rule_authority: best_practice
    sap_impact: Open assignments are never completed and count against compliance reports.
    fix_map:
      __other__: Remove the assignment or link it to an employee.
    record_fix_template: Learning assignment for user {LEARNINGASSIGNMENT.USERID} has no employment record. Review.
  - id: LMS025
    field: LEARNINGCOMPLETION.COMPLETION_DATE
    check_class: cross_field_check
    fail_when: '`LEARNINGCOMPLETION.COMPLETION_DATE` < `EMPEMPLOYMENT.START_DATE`'
    severity: medium
    dimension: consistency
    message: Learning completed before the employment started
    why_it_matters: A completion before the start of employment points to a wrong date or a mix-up of persons, unless it is prior learning that was loaded on purpose.
    rule_authority: best_practice
    sap_impact: Training history and compliance status are wrong for the employee.
    fix_map:
      __other__: Correct the completion date or the employment start.
    record_fix_template: Learning completion for user {LEARNINGCOMPLETION.USERID} is dated before the employment started. Review.
  - id: LMS026
    field: LEARNINGASSIGNMENT.ASSIGNED_DATE
    check_class: cross_field_check
    fail_when: '`LEARNINGASSIGNMENT.ASSIGNED_DATE` > `EMPEMPLOYMENT.END_DATE`'
    severity: medium
    dimension: timeliness
    message: Learning assigned after the employment ended
    why_it_matters: Assigning training to a person who has left creates open items nobody can complete.
    rule_authority: best_practice
    sap_impact: Compliance reports show overdue learning for leavers.
    fix_map:
      __other__: Cancel the assignment.
    record_fix_template: Learning assignment for user {LEARNINGASSIGNMENT.USERID} is dated after the employment ended. Cancel it.
  - id: LMS027
    field: LEARNINGCOMPLETION.COMPLETION_DATE
    check_class: uniqueness_check
    fields:
    - LEARNINGCOMPLETION.USERID
    - LEARNINGCOMPLETION.COURSE_ID
    - LEARNINGCOMPLETION.COMPLETION_DATE
    severity: low
    dimension: uniqueness
    message: Learning completion is recorded more than once
    why_it_matters: The same course completed by the same user on the same date twice is a duplicate load.
    rule_authority: best_practice
    sap_impact: Credit hours are counted twice.
    fix_map:
      __other__: Delete the duplicate completion.
    record_fix_template: Learning completion for user {LEARNINGCOMPLETION.USERID} is recorded more than once. Remove the duplicate.
  - id: LMS028
    field: LEARNINGASSIGNMENT.STATUS
    check_class: domain_value_check
    allowed_values:
    - Assigned
    - Not Started
    - In Progress
    - Completed
    - Overdue
    - Withdrawn
    - Registered
    severity: medium
    dimension: validity
    message: Learning assignment status is not one of the recognised lifecycle values
    why_it_matters: The assignment STATUS drives the learner transcript and the overdue/escalation workflow. A value outside
      the known lifecycle (e.g. a free-text status from an interface error) is not recognised by any downstream report and
      the assignment effectively disappears from compliance dashboards.
    rule_authority: best_practice
    sap_impact: Compliance dashboard and transcript cannot classify this assignment; it is silently excluded from completion
      and overdue metrics.
    valid_values_with_labels:
      Assigned: Assigned, not yet started
      Not Started: Assigned, not yet started
      In Progress: Learner has started the item
      Completed: Learner has finished the item
      Overdue: Past due date, not completed
      Withdrawn: Assignment cancelled/withdrawn
      Registered: Registered for a scheduled offering
    fix_map:
      __other__: "Assignment status '{invalid_value}' is not recognised. Set to one of Assigned, Not Started, In Progress,\
        \ Completed, Overdue, Withdrawn or Registered via Learning > Admin > Assignment Management."
    record_fix_template: 'Assignment for {LEARNINGASSIGNMENT.USERID}: STATUS ''{actual_value}'' is not a recognised value.
      Correct via Learning > Admin > Assignment Management.'
  - id: LMS029
    field: LEARNINGCOMPLETION.STATUS
    check_class: domain_value_check
    allowed_values:
    - COMPLETE
    - FAILED
    - INCOMPLETE
    - WITHDRAWN
    - IN_PROGRESS
    severity: medium
    dimension: validity
    message: Learning history completion status is not one of the recognised values
    why_it_matters: The completion STATUS determines whether a learning history record satisfies a requirement. A value
      outside the recognised set cannot be interpreted by the compliance or curriculum engine, so the record is treated
      as neither passed nor failed.
    rule_authority: best_practice
    sap_impact: Curriculum and compliance status cannot be computed for this completion; the learner may appear incomplete
      despite having finished the course.
    valid_values_with_labels:
      COMPLETE: Satisfied the requirement
      FAILED: Attempted but did not pass
      INCOMPLETE: Started but not finished
      WITHDRAWN: Learner withdrew from the item
      IN_PROGRESS: Still in progress at time of export
    fix_map:
      __other__: Learning history status '{invalid_value}' is not recognised. Correct via Learning Administration > Learning
        History to one of COMPLETE, FAILED, INCOMPLETE, WITHDRAWN or IN_PROGRESS.
    record_fix_template: 'Learning history {LEARNINGCOMPLETION.USERID}/{LEARNINGCOMPLETION.COURSE_ID}: completion status
      ''{actual_value}'' is not recognised.'
  - id: LMS030
    field: LEARNINGCOMPLETION.SCORE
    check_class: cross_field_check
    fail_when: '`LEARNINGCOMPLETION.SCORE` > 100'
    require_populated: true
    severity: low
    dimension: validity
    message: Learning score exceeds the maximum possible value of 100
    why_it_matters: Scores are expressed on a 0-100 scale. A value above 100 is a load or interface error and distorts
      assessment analytics and pass/fail comparisons against the passing threshold.
    rule_authority: best_practice
    sap_impact: Assessment analytics and pass/fail determination are wrong for this record.
    fix_map:
      __other__: Correct the score on the learning history record via Learning Administration.
    record_fix_template: 'Employee {LEARNINGCOMPLETION.USERID}: learning score {LEARNINGCOMPLETION.SCORE} exceeds 100.
      Correct the record.'
  - id: LMS031
    field: LEARNINGASSIGNMENT.ASSIGNED_DATE
    check_class: cross_field_check
    fail_when: '`LEARNINGASSIGNMENT.ASSIGNED_DATE`.dt.normalize() > @today'
    severity: medium
    dimension: validity
    message: Learning assignment is dated in the future
    why_it_matters: An assignment can only be created on or before today. A future assigned date is a typing error or a
      record loaded in advance, and skews assignment-to-completion SLA metrics.
    rule_authority: best_practice
    sap_impact: Assignment-to-completion SLA metrics and overdue calculations are wrong for this record.
    fix_map:
      __other__: Correct the assigned date in Learning Administration > Users > Learning Plan.
    record_fix_template: 'Assignment for {LEARNINGASSIGNMENT.USERID}: ASSIGNED_DATE {LEARNINGASSIGNMENT.ASSIGNED_DATE}
      is in the future.'
  - id: LMS032
    field: LEARNINGASSIGNMENT.USERID
    check_class: regex_check
    pattern: ^[a-zA-Z0-9._@-]{1,90}$
    severity: high
    dimension: validity
    message: Learning assignment User ID must contain only valid characters
    why_it_matters: USERID on a learning assignment must match the format used in Employee Central. Invalid characters
      prevent the join between the assignment and the employee master, orphaning the assignment during migration.
    rule_authority: best_practice
    sap_impact: Assignment cannot be matched to the employee record. Transcript and compliance reporting drop the record.
    fix_map:
      __other__: User ID '{invalid_value}' contains invalid characters. Correct to match the Employee Central USERID format
        via Learning > Admin > Assignment Management.
    record_fix_template: 'Assignment USERID ''{actual_value}'' has an invalid format. Correct via Learning > Admin >
      Assignment Management.'
  - id: LMS033
    field: LEARNINGCOMPLETION.CREDIT_HOURS
    check_class: cross_field_check
    fail_when: '`LEARNINGCOMPLETION.CREDIT_HOURS` > 80'
    require_populated: true
    severity: low
    dimension: validity
    message: Credit hours for a single learning item are implausibly high
    why_it_matters: A single course or event rarely awards more than a couple of weeks' worth of continuing-education
      hours. A value above 80 is almost always a unit error (e.g. minutes entered as hours) rather than a real credit award.
    rule_authority: best_practice
    sap_impact: Continuing-education and certification hour totals are overstated for this employee.
    fix_map:
      __other__: Verify the unit and correct the credit hours on the learning history record via Learning Administration.
    record_fix_template: 'Learning history {LEARNINGCOMPLETION.USERID}/{LEARNINGCOMPLETION.COURSE_ID}: credit hours
      {LEARNINGCOMPLETION.CREDIT_HOURS} are implausibly high. Verify the unit.'
  - id: LMS034
    field: LEARNINGASSIGNMENT.CURRICULUM_ID
    check_class: regex_check
    pattern: ^[A-Za-z0-9._-]{1,90}$
    severity: low
    dimension: validity
    message: Curriculum ID contains characters outside the expected identifier format
    why_it_matters: Curriculum IDs flow into completion and certification records downstream. An ID with stray whitespace
      or punctuation breaks exact-match lookups against the curriculum catalog and can silently drop a learner from
      curriculum-level compliance reporting.
    rule_authority: best_practice
    sap_impact: Curriculum-level compliance roll-ups and certification tracking cannot match this assignment to its catalog entry.
    fix_map:
      __other__: Correct the curriculum ID to use only letters, numbers, periods, underscores and hyphens, matching the
        Learning curriculum catalog entry.
    record_fix_template: Assignment for {LEARNINGASSIGNMENT.USERID} references curriculum ID '{invalid_value}' which does
      not match the expected format. Correct it to match the catalog entry.
  - id: LMS035
    field: LEARNINGASSIGNMENT.STATUS
    check_class: exists_check
    fields:
    - LEARNINGASSIGNMENT.USERID
    - LEARNINGASSIGNMENT.COURSE_ID
    target_table: LEARNINGCOMPLETION
    target_fields:
    - USERID
    - COURSE_ID
    severity: high
    dimension: consistency
    message: Assignment marked completed has no completion evidence in learning history
    why_it_matters: An assignment STATUS of Completed with no corresponding learning history record means there is no
      auditable evidence that the training actually happened. For compliance training this is exactly the gap an auditor
      will flag.
    rule_authority: best_practice
    sap_impact: Compliance audit evidence is missing for a learner marked as compliant. Certification cannot be substantiated.
    fix_map:
      __other__: Record the completion event via Learning Administration > Record Learning, or correct the assignment
        status if it was marked complete in error.
    record_fix_template: Assignment for {LEARNINGASSIGNMENT.USERID}, course {LEARNINGASSIGNMENT.COURSE_ID} is marked
      Completed but has no completion record in learning history.
    applies_when:
      LEARNINGASSIGNMENT.STATUS:
      - Completed
  - id: LMS036
    field: LEARNINGASSIGNMENT.ITEM_TYPE
    check_class: domain_value_check
    allowed_values:
    - ONLINE
    - CLASSROOM
    - CURRICULUM
    - OJT
    - EXTERNAL
    severity: medium
    dimension: accuracy
    message: Learning item type is not one of the recognised delivery methods
    why_it_matters: ITEM_TYPE determines which rules and workflows apply to the assignment (e.g. classroom scheduling,
      curriculum roll-up, external evidence capture). An unrecognised type means the wrong workflow — or none — applies.
    rule_authority: best_practice
    sap_impact: The assignment is not picked up by the delivery-method-specific workflow (session reminders, curriculum
      roll-up, external approval) it should follow.
    valid_values_with_labels:
      ONLINE: Self-paced online course
      CLASSROOM: Instructor-led classroom session
      CURRICULUM: Grouped curriculum/program item
      OJT: On-the-job training
      EXTERNAL: External training recorded for credit
    fix_map:
      __other__: Item type '{invalid_value}' is not recognised. Set to ONLINE, CLASSROOM, CURRICULUM, OJT or EXTERNAL via
        Learning > Admin > Course Management.
    record_fix_template: 'Assignment for {LEARNINGASSIGNMENT.USERID}: ITEM_TYPE ''{actual_value}'' is not recognised.'
  - id: LMS037
    field: LEARNINGASSIGNMENT.APPROVAL_STATUS
    check_class: domain_value_check
    allowed_values:
    - Approved
    - Pending
    - Rejected
    severity: medium
    dimension: accuracy
    message: Learning assignment approval status is not one of the recognised values
    why_it_matters: APPROVAL_STATUS gates whether a self-requested or external item is treated as authorised training.
      An unrecognised value cannot be evaluated by the approval workflow, leaving the request stuck.
    rule_authority: best_practice
    sap_impact: The approval workflow cannot process this assignment; it remains indefinitely unresolved in the manager
      queue.
    valid_values_with_labels:
      Approved: Authorised by the approver
      Pending: Awaiting approver action
      Rejected: Declined by the approver
    fix_map:
      __other__: Approval status '{invalid_value}' is not recognised. Set to Approved, Pending or Rejected via Learning
        > Admin > Assignment Management.
    record_fix_template: 'Assignment for {LEARNINGASSIGNMENT.USERID}: APPROVAL_STATUS ''{actual_value}'' is not recognised.'
  - id: LMS038
    field: LEARNINGCOMPLETION.SCORE
    check_class: cross_field_check
    fail_when: '`LEARNINGCOMPLETION.STATUS` == "COMPLETE" and `LEARNINGCOMPLETION.SCORE` < `LEARNINGCOMPLETION.PASSING_SCORE`'
    require_populated: true
    severity: high
    dimension: consistency
    message: Learning history marked complete but the recorded score is below the passing threshold
    why_it_matters: A record marked COMPLETE should mean the learner satisfied the requirement, including any minimum
      score. A COMPLETE status alongside a score below the item's own passing threshold means someone is being credited
      with training they did not actually pass — a direct compliance and audit risk.
    rule_authority: best_practice
    sap_impact: Compliance reporting certifies a learner who did not meet the passing score; the audit trail is false.
    fix_map:
      __other__: Reconcile the score and status in Learning Administration > Learning History. Either correct the status
        to FAILED or correct the recorded score.
    record_fix_template: 'Learning history {LEARNINGCOMPLETION.USERID}/{LEARNINGCOMPLETION.COURSE_ID}: marked COMPLETE
      with score {LEARNINGCOMPLETION.SCORE} below the passing score {LEARNINGCOMPLETION.PASSING_SCORE}.'
  - id: LMS039
    field: LEARNINGASSIGNMENT.CURRICULUM_ID
    check_class: null_check
    severity: medium
    dimension: completeness
    message: Curriculum item is missing its curriculum ID
    why_it_matters: A CURRICULUM item is, by definition, part of a curriculum/program. Without CURRICULUM_ID it cannot
      be rolled up into the curriculum's overall completion status, so the programme appears incomplete even when its
      items are being completed.
    rule_authority: best_practice
    sap_impact: Curriculum roll-up completion status cannot include this item. Programme-level compliance reporting is
      understated.
    fix_map:
      __blank__: Set the curriculum ID via Learning > Admin > Course Management, linking the item to its parent curriculum.
    record_fix_template: 'Assignment for {LEARNINGASSIGNMENT.USERID}: item is type CURRICULUM but CURRICULUM_ID is missing.'
    applies_when:
      LEARNINGASSIGNMENT.ITEM_TYPE:
      - CURRICULUM
  - id: LMS040
    field: LEARNINGASSIGNMENT.CLASS_START_DATE
    check_class: null_check
    severity: medium
    dimension: completeness
    message: Classroom item is missing its scheduled start date
    why_it_matters: A CLASSROOM item is delivered in a scheduled session. Without CLASS_START_DATE the learner has no
      session to attend and the system cannot send scheduling reminders.
    rule_authority: best_practice
    sap_impact: No session reminder is generated. Learner has no visible session to attend for mandatory classroom training.
    fix_map:
      __blank__: Set the scheduled session start date via Learning > Admin > Offering Management.
    record_fix_template: 'Assignment for {LEARNINGASSIGNMENT.USERID}: item is type CLASSROOM but CLASS_START_DATE is
      missing.'
    applies_when:
      LEARNINGASSIGNMENT.ITEM_TYPE:
      - CLASSROOM
  - id: LMS041
    field: LEARNINGASSIGNMENT.CLASS_END_DATE
    check_class: cross_field_check
    fail_when: '`LEARNINGASSIGNMENT.CLASS_END_DATE`.dt.normalize() < `LEARNINGASSIGNMENT.CLASS_START_DATE`.dt.normalize()'
    require_populated: true
    severity: medium
    dimension: consistency
    message: Classroom session end date is before its start date
    why_it_matters: A session that ends before it starts is a scheduling data error. Downstream calendar invites and
      attendance capture cannot be generated from an inverted date range.
    rule_authority: best_practice
    sap_impact: Session invite and attendance capture for this offering cannot be generated correctly.
    fix_map:
      __other__: Correct the session start or end date via Learning > Admin > Offering Management.
    record_fix_template: 'Assignment for {LEARNINGASSIGNMENT.USERID}: CLASS_END_DATE {LEARNINGASSIGNMENT.CLASS_END_DATE}
      is before CLASS_START_DATE {LEARNINGASSIGNMENT.CLASS_START_DATE}.'
  - id: LMS042
    field: LEARNINGASSIGNMENT.APPROVAL_STATUS
    check_class: null_check
    severity: medium
    dimension: completeness
    message: External training item is missing its approval status
    why_it_matters: EXTERNAL training is only valid for credit once it has been through the approval workflow. Without
      APPROVAL_STATUS there is no record of whether the external training was ever authorised.
    rule_authority: best_practice
    sap_impact: External training is credited without evidence it was ever approved — an audit exposure for external
      certification claims.
    fix_map:
      __blank__: Route the item through the approval workflow and set APPROVAL_STATUS via Learning > Admin > Assignment
        Management.
    record_fix_template: 'Assignment for {LEARNINGASSIGNMENT.USERID}: item is type EXTERNAL but APPROVAL_STATUS is missing.'
    applies_when:
      LEARNINGASSIGNMENT.ITEM_TYPE:
      - EXTERNAL
  - id: LMS043
    field: LEARNINGASSIGNMENT.COURSE_ID
    check_class: regex_check
    pattern: ^[A-Za-z0-9._-]{1,90}$
    severity: medium
    dimension: validity
    message: Learning assignment course ID must contain only valid characters
    why_it_matters: COURSE_ID must match the format of the component ID in the Learning catalogue. Invalid characters
      (e.g. embedded delimiters from a bad export) break the join to the catalogue and to learning history.
    rule_authority: best_practice
    sap_impact: Assignment cannot be matched to its catalogue item or to completion records with the same course ID.
    fix_map:
      __other__: Course ID '{invalid_value}' contains invalid characters. Correct via Learning > Admin > Assignment
        Management.
    record_fix_template: 'Assignment for {LEARNINGASSIGNMENT.USERID}: COURSE_ID ''{actual_value}'' has an invalid format.'
  - id: LMS044
    field: LEARNINGCOMPLETION.SCORE
    check_class: cross_field_check
    fail_when: '`LEARNINGCOMPLETION.STATUS` == "FAILED" and `LEARNINGCOMPLETION.SCORE` >= `LEARNINGCOMPLETION.PASSING_SCORE`'
    require_populated: true
    severity: medium
    dimension: consistency
    message: Learning history marked failed despite a score at or above the passing threshold
    why_it_matters: A record marked FAILED alongside a score that actually meets the passing threshold understates the
      learner's real completion status and may force an unnecessary retake of compliance training.
    rule_authority: best_practice
    sap_impact: Learner is incorrectly shown as non-compliant and may be required to repeat training they already passed.
    fix_map:
      __other__: Reconcile the score and status in Learning Administration > Learning History.
    record_fix_template: 'Learning history {LEARNINGCOMPLETION.USERID}/{LEARNINGCOMPLETION.COURSE_ID}: marked FAILED
      with score {LEARNINGCOMPLETION.SCORE} at or above the passing score {LEARNINGCOMPLETION.PASSING_SCORE}.'
  - id: LMS045
    field: LEARNINGCOMPLETION.PASSING_SCORE
    check_class: null_check
    severity: low
    dimension: completeness
    message: Failed learning history record is missing the passing score it was measured against
    why_it_matters: When a record is marked FAILED, auditors and managers need to see the bar the learner missed.
      Without PASSING_SCORE there is no way to verify the fail determination was correct.
    rule_authority: best_practice
    sap_impact: Fail determination cannot be independently verified during a compliance audit or a learner appeal.
    fix_map:
      __blank__: Populate the passing score from the course configuration via Learning Administration > Learning History.
    record_fix_template: 'Learning history {LEARNINGCOMPLETION.USERID}/{LEARNINGCOMPLETION.COURSE_ID}: marked FAILED
      but PASSING_SCORE is missing.'
    applies_when:
      LEARNINGCOMPLETION.STATUS:
      - FAILED
