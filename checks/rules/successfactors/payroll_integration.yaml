    why_it_matters: IN bank routing identifiers follow a fixed format (11-character IFSC code). A routing number outside that shape points the payment at the wrong bank or branch, or is rejected outright.
    rule_authority: best_practice
    sap_impact: Bank transfer is misrouted to the wrong branch or rejected by the clearing system.
    fix_map:
      __other__: Obtain the correct routing/branch code from the employee's bank details and correct it.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: routing number ''{PAYMENTINFO.ROUTING_NUMBER}'' is not a valid IN routing code.'
  - id: PAY122
    field: PAYMENTINFO.ROUTING_NUMBER
    check_class: regex_check
    pattern: ^\d{2,3}$
    applies_when:
      PAYMENTINFO.BANK_COUNTRY:
      - MYS
      PAYMENTINFO.IBAN:
        blank: true
    severity: medium
    dimension: validity
    message: Routing number is not a valid MY routing/branch code (2 or 3-digit bank code)
    why_it_matters: MY bank routing identifiers follow a fixed format (2 or 3-digit bank code). A routing number outside that shape points the payment at the wrong bank or branch, or is rejected outright.
    rule_authority: best_practice
    sap_impact: Bank transfer is misrouted to the wrong branch or rejected by the clearing system.
    fix_map:
      __other__: Obtain the correct routing/branch code from the employee's bank details and correct it.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: routing number ''{PAYMENTINFO.ROUTING_NUMBER}'' is not a valid MY routing code.'
  - id: PAY123
    field: PAYMENTINFO.ROUTING_NUMBER
    check_class: regex_check
    pattern: ^\d{6}$
    applies_when:
      PAYMENTINFO.BANK_COUNTRY:
      - NZL
      PAYMENTINFO.IBAN:
        blank: true
    severity: medium
