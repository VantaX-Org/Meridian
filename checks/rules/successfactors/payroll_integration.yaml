    check_class: cross_field_check
    fail_when: '`PA0003.KOABR` == ''X'''
    grain: PA0003
    severity: medium
    dimension: timeliness
    message: Employee is flagged for a correction run
    why_it_matters: KOABR is set when payroll rejected the employee. Payroll stays blocked until the error is fixed and the correction run completes.
    rule_authority: best_practice
    sap_impact: The employee is not paid in the regular run.
    fix_map:
      __other__: Fix the payroll error and run the correction run.
    record_fix_template: 'Employee {PA0003.PERNR}: is flagged for a payroll correction run. Fix the error and rerun.'
  - id: HPY057
    field: PA0003.ABRDT
    check_class: cross_field_check
    fail_when: (`PA0003.ABRDT` - @today).dt.days > 62
    require_populated: true
    grain: PA0003
    severity: medium
    dimension: validity
    message: Accounted-to date is more than two months ahead
    why_it_matters: ABRDT is the end of the last period paid. More than two months ahead means payroll was run for a future period or the date was set manually.
    rule_authority: best_practice
    sap_impact: Changes for the skipped periods are not picked up by retro accounting.
    fix_map:
      __other__: Correct the accounted-to date in PU03.
    record_fix_template: 'Employee {PA0003.PERNR}: accounted-to date is more than two months ahead. Correct in PU03.'
  - id: PAY054
    field: PAYMENTINFO.IBAN
    check_class: regex_check
    pattern: ^AD\d{2}[A-Z0-9]{20}$
    applies_when:
      PAYMENTINFO.BANK_COUNTRY:
      - AND
    severity: high
    dimension: validity
    message: IBAN is not a valid AD IBAN (expected 24 characters, country prefix AD)
    why_it_matters: 'A AD IBAN must be exactly 24 characters: the AD country code, two check digits, then 20 characters of bank/branch/account (BBAN). An IBAN of the wrong shape for its stated bank country is rejected by the bank or, worse, routed to the wrong account.'
    rule_authority: best_practice
    sap_impact: Bank transfer file is rejected by the bank or the payment is misdirected.
    fix_map:
      __other__: Obtain the correct IBAN from the employee's bank details and correct infotype 0009 / the SuccessFactors payment information.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: IBAN is not a valid AD IBAN.'
    auto_fix:
      steps:
      - op: regex_replace
        pattern: \s+
        repl: ''
      - op: upper
      confidence: low
