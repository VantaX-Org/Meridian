    require_populated: true
    grain: PA0009
    severity: medium
    dimension: consistency
    message: Main bank details carry a fixed amount
    why_it_matters: Subtype 0 (main bank) receives the remainder of net pay. A fixed amount belongs on an other-bank subtype.
    rule_authority: best_practice
    sap_impact: Part of net pay is unpaid or paid twice.
    fix_map:
      __other__: Move the fixed amount to an other-bank record (subtype 1).
    record_fix_template: 'Employee {PA0009.PERNR}: main bank details have a fixed amount. Move it to subtype 1.'
