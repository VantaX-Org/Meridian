    message: Routing number is not a valid NZ routing/branch code (6-digit bank-branch number)
    why_it_matters: NZ bank routing identifiers follow a fixed format (6-digit bank-branch number). A routing number outside that shape points the payment at the wrong bank or branch, or is rejected outright.
    rule_authority: best_practice
    sap_impact: Bank transfer is misrouted to the wrong branch or rejected by the clearing system.
    fix_map:
      __other__: Obtain the correct routing/branch code from the employee's bank details and correct it.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: routing number ''{PAYMENTINFO.ROUTING_NUMBER}'' is not a valid NZ routing code.'
  - id: PAY124
    field: PAYMENTINFO.ROUTING_NUMBER
    check_class: regex_check
    pattern: ^\d{7}$
    applies_when:
      PAYMENTINFO.BANK_COUNTRY:
      - SGP
      PAYMENTINFO.IBAN:
        blank: true
    severity: medium
    dimension: validity
    message: Routing number is not a valid SG routing/branch code (7-digit bank+branch code)
    why_it_matters: SG bank routing identifiers follow a fixed format (7-digit bank+branch code). A routing number outside that shape points the payment at the wrong bank or branch, or is rejected outright.
    rule_authority: best_practice
    sap_impact: Bank transfer is misrouted to the wrong branch or rejected by the clearing system.
    fix_map:
      __other__: Obtain the correct routing/branch code from the employee's bank details and correct it.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: routing number ''{PAYMENTINFO.ROUTING_NUMBER}'' is not a valid SG routing code.'
  - id: PAY125
    field: PAYMENTINFO.ROUTING_NUMBER
    check_class: regex_check
    pattern: ^\d{9}$
    applies_when:
      PAYMENTINFO.BANK_COUNTRY:
      - USA
      PAYMENTINFO.IBAN:
        blank: true
    severity: medium
    dimension: validity
    message: Routing number is not a valid US routing/branch code (9-digit ABA routing number)
    why_it_matters: US bank routing identifiers follow a fixed format (9-digit ABA routing number). A routing number outside that shape points the payment at the wrong bank or branch, or is rejected outright.
    rule_authority: best_practice
    sap_impact: Bank transfer is misrouted to the wrong branch or rejected by the clearing system.
    fix_map:
      __other__: Obtain the correct routing/branch code from the employee's bank details and correct it.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: routing number ''{PAYMENTINFO.ROUTING_NUMBER}'' is not a valid US routing code.'
  - id: PAY126
    field: PAYMENTINFO.ROUTING_NUMBER
    check_class: regex_check
    pattern: ^\d{6}$
    applies_when:
      PAYMENTINFO.BANK_COUNTRY:
      - ZAF
      PAYMENTINFO.IBAN:
        blank: true
    severity: medium
    dimension: validity
    message: Routing number is not a valid ZA routing/branch code (6-digit branch code)
    why_it_matters: ZA bank routing identifiers follow a fixed format (6-digit branch code). A routing number outside that shape points the payment at the wrong bank or branch, or is rejected outright.
    rule_authority: best_practice
    sap_impact: Bank transfer is misrouted to the wrong branch or rejected by the clearing system.
    fix_map:
      __other__: Obtain the correct routing/branch code from the employee's bank details and correct it.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: routing number ''{PAYMENTINFO.ROUTING_NUMBER}'' is not a valid ZA routing code.'
  - id: PAY127
    field: PAYMENTINFO.BIC
    check_class: regex_check
    pattern: ^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$
    severity: high
    dimension: validity
    message: BIC/SWIFT code is not a valid 8 or 11-character BIC
    why_it_matters: A BIC/SWIFT code is 8 or 11 characters — a 4-letter bank code, a 2-letter ISO country code, a 2-character location code and an optional 3-character branch code. A value of the wrong shape is rejected by the clearing network or routed to the wrong bank.
    rule_authority: best_practice
    sap_impact: Bank transfer is rejected by the clearing network or misrouted.
    fix_map:
      __other__: Obtain the correct BIC/SWIFT code from the employee's bank details and correct it.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: BIC ''{PAYMENTINFO.BIC}'' is not a valid BIC/SWIFT code.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: low
  - id: PAY128
    field: PAYMENTINFO.ACCOUNT_OWNER
    check_class: null_check
    applies_when:
      PAYMENTINFO.ACCOUNT_NUMBER:
        populated: true
    severity: medium
    dimension: completeness
    message: Payment record has an account number but no account owner name
    why_it_matters: The bank validates the beneficiary name against the account. Without a recorded account owner, a mismatch between the employee and the actual account holder cannot be checked before the transfer is sent.
    rule_authority: best_practice
    sap_impact: Bank rejects the transfer under beneficiary-name matching, or pays an account the employee no longer controls.
    fix_map:
      __blank__: Enter the account owner name as held by the bank in the SuccessFactors payment information.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: has a ACCOUNT_NUMBER but no account owner name.'
  - id: PAY129
    field: PAYMENTINFO.ACCOUNT_OWNER
    check_class: null_check
    applies_when:
      PAYMENTINFO.IBAN:
        populated: true
      PAYMENTINFO.ACCOUNT_NUMBER:
        blank: true
    severity: medium
    dimension: completeness
    message: Payment record has an IBAN but no account owner name
    why_it_matters: The bank validates the beneficiary name against the account. Without a recorded account owner, a mismatch between the employee and the actual account holder cannot be checked before the transfer is sent.
    rule_authority: best_practice
    sap_impact: Bank rejects the transfer under beneficiary-name matching, or pays an account the employee no longer controls.
    fix_map:
      __blank__: Enter the account owner name as held by the bank in the SuccessFactors payment information.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: has a IBAN but no account owner name.'
  - id: PAY130
    field: PAYMENTINFO.EXTERNAL_CODE
    check_class: null_check
    severity: medium
    dimension: completeness
    message: Payment information record has no external code
    why_it_matters: The external code is the key SuccessFactors and the payroll/banking interface use to match a payment record across systems. Without it, the record cannot be reconciled after extraction.
    rule_authority: best_practice
    sap_impact: Payment record cannot be matched back to its source during reconciliation.
    fix_map:
      __blank__: Investigate why the payment information record has no external code in SuccessFactors.
    record_fix_template: Payment record for {PAYMENTINFO.USERID} has no external code.
  - id: PAY131
    field: PAYMENTINFO.EFFECTIVE_DATE
    check_class: null_check
    severity: high
    dimension: completeness
    message: Payment information record has no effective date
    why_it_matters: The effective date determines which payment instruction applies to a given pay period. Without it, payroll cannot tell which bank details are current.
    rule_authority: best_practice
    sap_impact: Payroll cannot determine which payment instruction is current; pay may go to the wrong account.
    fix_map:
      __blank__: Enter the effective date for the payment information record in SuccessFactors.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment information record has no effective date.'
  - id: PAY132
    field: PAYMENTINFO.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: (`PAYMENTINFO.EFFECTIVE_DATE` - @today).dt.days > 365
    require_populated: true
    severity: low
    dimension: validity
    message: Payment information effective date is more than a year in the future
    why_it_matters: A payment instruction effective more than a year ahead is unusual and is often a keying error (wrong century, swapped day/month) rather than a planned future change.
    rule_authority: best_practice
    sap_impact: The current payment instruction may be misidentified as not yet effective, and pay is sent to stale bank details.
    fix_map:
      __other__: Confirm the intended effective date with the employee/HR and correct it in SuccessFactors.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment information effective date {PAYMENTINFO.EFFECTIVE_DATE} is more than a year in the future.'
  - id: PAY133
    field: PAYMENTINFO.ACCOUNT_NUMBER
    check_class: uniqueness_check
    fields:
    - PAYMENTINFO.USERID
    - PAYMENTINFO.EFFECTIVE_DATE
    - PAYMENTINFO.ACCOUNT_NUMBER
    applies_when:
      PAYMENTINFO.ACCOUNT_NUMBER:
        populated: true
    severity: medium
    dimension: uniqueness
    message: Employee has more than one payment instruction with the same effective date and account number
    why_it_matters: The same employee, effective date and account number should appear once. A duplicate is usually a double load of the same payment instruction.
    rule_authority: best_practice
    sap_impact: Duplicate payment instructions confuse which record is authoritative and can cause a double transfer.
    fix_map:
      __other__: Identify and remove the duplicate payment information record in SuccessFactors.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: duplicate payment instruction for effective date {PAYMENTINFO.EFFECTIVE_DATE}.'
  - id: PAY134
    field: PAYMENTINFO.ACCOUNT_OWNER
    check_class: regex_check
    pattern: ^(?!\d+$).+$
    severity: low
    dimension: validity
    message: Account owner name is purely numeric
    why_it_matters: The account owner is a person or company name. A value made only of digits is almost always a different field (an account or ID number) copied into the wrong column.
    rule_authority: best_practice
    sap_impact: Beneficiary-name matching at the bank fails and the transfer is rejected.
    fix_map:
      __other__: Correct the account owner name in the SuccessFactors payment information record.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: account owner ''{PAYMENTINFO.ACCOUNT_OWNER}'' is purely numeric.'
  - id: PAY135
    field: PAYMENTINFO.EFFECTIVE_DATE
    check_class: cross_field_check
    grain: PAYMENTINFO
    fail_when: (`PAYMENTINFO.EFFECTIVE_DATE` - `EMPEMPLOYMENT.END_DATE`).dt.days > 90
    require_populated: true
    severity: medium
    dimension: consistency
    message: Payment instruction becomes effective more than 90 days after the employment ended
    why_it_matters: A new payment instruction set up long after an employee left is unexpected; it usually means the employment end date is wrong or the record belongs to a rehire that was not linked correctly.
    rule_authority: best_practice
    sap_impact: Payments may be directed by a stale or incorrectly-linked payment record after termination.
    fix_map:
      __other__: Confirm the employment end date and the payment record's effective date with HR; correct the wrong one.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment instruction effective {PAYMENTINFO.EFFECTIVE_DATE}, employment ended {EMPEMPLOYMENT.END_DATE}.'
  - id: PAY136
    field: PAYMENTINFO.ACCOUNT_NUMBER
    check_class: uniqueness_check
    fields:
    - PAYMENTINFO.ACCOUNT_NUMBER
    unique_across: PAYMENTINFO.USERID
    applies_when:
      PAYMENTINFO.ACCOUNT_NUMBER:
        populated: true
    severity: high
    dimension: uniqueness
    message: The same account number is used by more than one employee
    why_it_matters: A bank account normally belongs to one employee. The same account number used by two different employees is either a shared/household account that needs review, or a sign that pay is being redirected. An employee's own repeated effective-dated history for the same account is not a duplicate and is excluded.
    rule_authority: best_practice
    sap_impact: Pay for one employee may be deposited into another employee's account.
    fix_map:
      __other__: Confirm with both employees and HR whether the shared account is legitimate; correct the record that is wrong.
    record_fix_template: Payment account {PAYMENTINFO.ACCOUNT_NUMBER} is shared by more than one employee.
  - id: PAY137
    field: PAYMENTINFO.IBAN
    check_class: uniqueness_check
    fields:
    - PAYMENTINFO.IBAN
    unique_across: PAYMENTINFO.USERID
    applies_when:
      PAYMENTINFO.IBAN:
        populated: true
    severity: high
    dimension: uniqueness
    message: The same iban is used by more than one employee
    why_it_matters: A bank account normally belongs to one employee. The same account number used by two different employees is either a shared/household account that needs review, or a sign that pay is being redirected. An employee's own repeated effective-dated history for the same IBAN is not a duplicate and is excluded.
    rule_authority: best_practice
    sap_impact: Pay for one employee may be deposited into another employee's account.
    fix_map:
      __other__: Confirm with both employees and HR whether the shared account is legitimate; correct the record that is wrong.
    record_fix_template: Payment account held by employee {PAYMENTINFO.USERID} is shared by more than one employee.
  - id: PAY138
    field: PERINFO.NATIONAL_ID
    check_class: null_check
    grain: PAYRESULT
    severity: high
    dimension: completeness
    message: Employee with a payroll result has no national ID on file
    why_it_matters: Statutory payroll reporting (tax, social insurance) requires the employee's national ID. Without it, filings for this employee cannot be produced.
    rule_authority: best_practice
    sap_impact: Statutory tax/social-insurance filings for the employee are blocked or rejected by the authority.
    fix_map:
      __blank__: Obtain and enter the employee's national ID in SuccessFactors Personal Information.
    record_fix_template: 'Employee {PAYRESULT.USERID}: no national ID on file despite having a payroll result.'
  - id: PAY139
    field: PERINFO.NATIONAL_ID_COUNTRY
    check_class: null_check
    applies_when:
      PERINFO.NATIONAL_ID:
        populated: true
    severity: medium
    dimension: completeness
    message: National ID is recorded but its issuing country is blank
    why_it_matters: A national ID is only meaningful together with the country that issued it; the same digits mean different things in different countries.
    rule_authority: best_practice
    sap_impact: Tax/social-insurance filings cannot determine which country's authority the ID belongs to.
    fix_map:
      __blank__: Enter the issuing country for the national ID in SuccessFactors Personal Information.
    record_fix_template: Employee has a national ID but no issuing country recorded.
  - id: PAY140
    field: PERINFO.DATE_OF_DEATH
    check_class: cross_field_check
    grain: PAYRESULT
    fail_when: '`PERINFO.DATE_OF_DEATH`.notna() & (`PAYRESULT.PAY_DATE` > `PERINFO.DATE_OF_DEATH`)'
    severity: critical
    dimension: consistency
    message: Employee was paid after their recorded date of death
    why_it_matters: A payroll result dated after the recorded date of death is either a data error in the date of death or a fraudulent/erroneous payment that must stop immediately.
    rule_authority: sap_hard_constraint
    sap_impact: Payment is made to a deceased employee's account; recovery and compliance exposure.
    fix_map:
      __other__: Stop payment immediately and verify the date of death and the payroll result with HR/payroll.
    record_fix_template: 'Employee {PAYRESULT.USERID}: paid on {PAYRESULT.PAY_DATE}, after recorded date of death {PERINFO.DATE_OF_DEATH}.'
  - id: PAY141
    field: PERINFO.DATE_OF_DEATH
    check_class: cross_field_check
    grain: PAYMENTINFO
    fail_when: '`PERINFO.DATE_OF_DEATH`.notna() & (`PAYMENTINFO.EFFECTIVE_DATE` > `PERINFO.DATE_OF_DEATH`)'
    severity: critical
    dimension: consistency
    message: Payment instruction becomes effective after the employee's recorded date of death
    why_it_matters: A payment instruction set up to take effect after the recorded date of death points to either a wrong date of death or an attempt to redirect pay after the employee has died.
    rule_authority: sap_hard_constraint
    sap_impact: Payment is made to a deceased employee's account; recovery and compliance exposure.
    fix_map:
      __other__: Stop payment immediately and verify the date of death and the payment instruction with HR/payroll.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment instruction effective {PAYMENTINFO.EFFECTIVE_DATE}, after recorded date of death {PERINFO.DATE_OF_DEATH}.'
  - id: PAY142
    field: PERINFO.NATIONAL_ID_COUNTRY
    check_class: cross_field_check
    grain: PAYMENTINFO
    fail_when: '`PERINFO.NATIONAL_ID_COUNTRY` != `PAYMENTINFO.BANK_COUNTRY`'
    require_populated: true
    severity: low
    dimension: consistency
    message: National ID issuing country differs from the bank country used for payment
    why_it_matters: This is not necessarily wrong (expatriates and cross-border workers exist), but it is unusual enough to be worth a tax-residency / banking review.
    rule_authority: best_practice
    sap_impact: Potential tax-residency or withholding mismatch that only surfaces at year-end reporting.
    fix_map:
      __other__: Confirm the employee's tax residency and banking arrangement with HR/payroll; no automatic correction.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: national ID country {PERINFO.NATIONAL_ID_COUNTRY} differs from bank country {PAYMENTINFO.BANK_COUNTRY}.'
  - id: PAY143
    field: PAYMENTINFO.BANK_COUNTRY
    check_class: cross_field_check
    grain: PAYMENTINFO
    fail_when: '`PAYMENTINFO.BANK_COUNTRY` != `FOCOMPANY.COUNTRY`'
    require_populated: true
    severity: low
    dimension: consistency
    message: Bank country differs from the employee's legal entity country
    why_it_matters: Most employees bank in the same country as their employing legal entity. A different bank country is not always wrong (cross-border payroll exists) but is worth confirming.
    rule_authority: best_practice
    sap_impact: Cross-border payment may incur extra bank fees or be blocked by foreign-exchange controls.
    fix_map:
      __other__: Confirm the cross-border payment arrangement with payroll; no automatic correction.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: bank country {PAYMENTINFO.BANK_COUNTRY} differs from legal entity country {FOCOMPANY.COUNTRY}.'
  - id: PAY144
    field: PAYMENTINFO.CURRENCY
    check_class: cross_field_check
    grain: PAYMENTINFO
    fail_when: '`PAYMENTINFO.CURRENCY` != `FOCOMPANY.CURRENCY`'
    require_populated: true
    severity: low
    dimension: consistency
    message: Payment instruction currency differs from the legal entity's default currency
    why_it_matters: A payment instruction normally pays out in the legal entity's currency. A different currency often means the employee's legal entity or the payment mapping is wrong.
    rule_authority: best_practice
    sap_impact: Payment is converted at an unplanned exchange rate, or the bank transfer fails currency validation.
    fix_map:
      __other__: Confirm the employee's legal entity and the payment currency mapping; correct the wrong one.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment currency {PAYMENTINFO.CURRENCY}, legal entity uses {FOCOMPANY.CURRENCY}.'
  - id: PAY145
    field: PERINFO.DATE_OF_BIRTH
    check_class: cross_field_check
    grain: PAYRESULT
    fail_when: (`PAYRESULT.PAY_DATE` - `PERINFO.DATE_OF_BIRTH`).dt.days < (16 * 365.25)
    require_populated: true
    severity: high
    dimension: consistency
    message: Employee was under 16 years old on the payroll result's pay date
    why_it_matters: Paying an employee who was under the statutory minimum working age at the time of payment is either a date-of-birth data error or a compliance breach.
    rule_authority: best_practice
    sap_impact: Minimum-working-age compliance exposure, or a wrong date of birth flows into statutory reporting.
    fix_map:
      __other__: Verify the employee's date of birth with HR and correct it, or escalate as a compliance issue.
    record_fix_template: 'Employee {PAYRESULT.USERID}: under 16 years old on pay date {PAYRESULT.PAY_DATE}.'
  - id: PAY146
    field: PERINFO.DATE_OF_BIRTH
    check_class: null_check
    grain: PAYRESULT
    severity: high
    dimension: completeness
    message: Employee with a payroll result has no date of birth on file
    why_it_matters: Date of birth drives statutory age-related payroll rules (minimum wage bands, pension auto-enrolment, retirement) in most countries.
    rule_authority: best_practice
    sap_impact: Age-related statutory payroll rules cannot be evaluated for this employee.
    fix_map:
      __blank__: Obtain and enter the employee's date of birth in SuccessFactors Personal Information.
    record_fix_template: 'Employee {PAYRESULT.USERID}: no date of birth on file despite having a payroll result.'
  - id: PAY147
    field: PERINFO.NATIONALITY
    check_class: null_check
    grain: PAYRESULT
    severity: medium
    dimension: completeness
    message: Employee with a payroll result has no nationality on file
    why_it_matters: Nationality is used for work-permit, tax-treaty and statutory reporting checks alongside payroll.
    rule_authority: best_practice
    sap_impact: Work-permit and tax-treaty checks for the employee cannot be evaluated.
    fix_map:
      __blank__: Obtain and enter the employee's nationality in SuccessFactors Personal Information.
    record_fix_template: 'Employee {PAYRESULT.USERID}: no nationality on file despite having a payroll result.'
  - id: PAY148
    field: PERINFO.NATIONAL_ID_CARD_TYPE
    check_class: null_check
    applies_when:
      PERINFO.NATIONAL_ID:
        populated: true
    severity: low
    dimension: completeness
    message: National ID is recorded but its card/document type is blank
    why_it_matters: The same ID value can be a passport, a national ID card or a tax number depending on the document type; without it the ID cannot be validated or classified correctly.
    rule_authority: best_practice
    sap_impact: The national ID cannot be validated or routed to the correct statutory filing.
    fix_map:
      __blank__: Enter the national ID document type in SuccessFactors Personal Information.
    record_fix_template: Employee has a national ID but no document type recorded.
  - id: PAY149
    field: PERINFO.NATIONAL_ID
    check_class: uniqueness_check
    grain: PERINFO
    fields:
    - PERINFO.NATIONAL_ID
    - PERINFO.NATIONAL_ID_COUNTRY
    applies_when:
      PERINFO.NATIONAL_ID:
        populated: true
    severity: high
    dimension: uniqueness
    message: The same national ID and country is recorded for more than one person
    why_it_matters: A national ID is unique to one person within its issuing country. The same value on more than one person record is a data-entry error or an identity-fraud indicator.
    rule_authority: best_practice
    sap_impact: Statutory filings and payroll tax calculations may be merged or misattributed between two different employees.
    fix_map:
      __other__: Investigate which person record has the correct national ID and correct the other.
    record_fix_template: National ID held by person {PERINFO.PERSON_ID} ({PERINFO.NATIONAL_ID_COUNTRY}) is recorded for more than one person.
  - id: PAY150
    field: USERACCOUNT.STATUS
    check_class: cross_field_check
    grain: PAYRESULT
    fail_when: (`USERACCOUNT.STATUS` == 'I') & (`PAYRESULT.GROSS_PAY` > 0) & (`EMPEMPLOYMENT.END_DATE`.isna() | ((`PAYRESULT.PAY_DATE` - `EMPEMPLOYMENT.END_DATE`).dt.days > 30))
    severity: high
    dimension: consistency
    message: Employee has a payroll result with gross pay although their user account is inactive
    why_it_matters: An inactive SuccessFactors user account normally means the employee has left or is suspended. A positive gross pay more than 30 days after their recorded employment end date (or with no end date recorded at all) suggests the account was deactivated without stopping pay, or pay continued after it should have stopped. A final pay run within 30 days of termination is excluded as expected final-pay processing.
    rule_authority: best_practice
    sap_impact: Overpayment to a leaver/suspended employee that must be recovered.
    fix_map:
      __other__: Confirm the employee's status with HR/payroll and stop pay if the account is correctly inactive.
    record_fix_template: 'Employee {PAYRESULT.USERID}: user account is inactive but has a nonzero gross pay.'
  - id: PAY151
    field: USERACCOUNT.STATUS
    check_class: cross_field_check
    grain: PAYMENTINFO
    fail_when: (`USERACCOUNT.STATUS` == 'I') & (`PAYMENTINFO.ACCOUNT_NUMBER`.notna() | `PAYMENTINFO.IBAN`.notna())
    severity: medium
    dimension: consistency
    message: Employee has a payment instruction on file although their user account is inactive
    why_it_matters: A payment instruction left on file for an inactive user account is a leaver whose bank details were never removed, creating risk of a payment being sent in error. (This check does not filter to the latest effective-dated record; it flags any payment instruction on file, current or historic.)
    rule_authority: best_practice
    sap_impact: Risk of a payment being sent to a leaver's account in error.
    fix_map:
      __other__: Confirm with HR whether the account should be inactive; if so, remove or delimit the payment instruction.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: user account is inactive but has a payment instruction on file.'
  - id: PAY152
    field: USERACCOUNT.HIRE_DATE
    check_class: cross_field_check
    grain: EMPEMPLOYMENT
    fail_when: '`USERACCOUNT.HIRE_DATE` != `EMPEMPLOYMENT.START_DATE`'
    require_populated: true
    severity: low
    dimension: consistency
    message: User account hire date differs from the employment start date
    why_it_matters: The SuccessFactors user account hire date and the employment record's start date should agree; a mismatch usually means one of them was not updated after a rehire or correction.
    rule_authority: best_practice
    sap_impact: Service-date-dependent calculations (seniority pay, leave accrual) may use the wrong start date.
    fix_map:
      __other__: Confirm the correct hire/start date with HR and align the two records.
    record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: user account hire date {USERACCOUNT.HIRE_DATE} differs from employment start date {EMPEMPLOYMENT.START_DATE}.'
  - id: PAY153
    field: USERACCOUNT.EMAIL
    check_class: null_check
    grain: PAYMENTINFO
    severity: low
    dimension: completeness
    message: Employee with a payment instruction has no email address on their user account
    why_it_matters: Payment and payslip notifications are sent to the employee's email address; without one, the employee cannot be notified of a payment or a problem with it.
    rule_authority: best_practice
    sap_impact: Payment/payslip notifications cannot be delivered to the employee.
    fix_map:
      __blank__: Obtain and enter the employee's email address in SuccessFactors.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: no email address on the user account.'
  - id: PAY154
    field: USERACCOUNT.STATUS
    check_class: cross_field_check
    fail_when: (`USERACCOUNT.STATUS` == 'A') & (`EMPEMPLOYMENT.END_DATE`.notna()) & (`EMPEMPLOYMENT.END_DATE` < @today)
    severity: medium
    dimension: consistency
    message: User account is still active although the employment end date has passed
    why_it_matters: Once the employment end date has passed, the SuccessFactors user account should normally be deactivated. An account left active is a security and payroll-continuity risk.
    rule_authority: best_practice
    sap_impact: A former employee may retain system access, and pay may continue past the intended leave date.
    fix_map:
      __other__: Confirm the termination with HR and deactivate the user account.
    record_fix_template: 'Employee {EMPEMPLOYMENT.USERID}: user account is still active, employment ended {EMPEMPLOYMENT.END_DATE}.'
  - id: PAY155
    field: POSITION.VACANT
    check_class: cross_field_check
    grain: PAYRESULT
    fail_when: (`POSITION.VACANT`.str.lower() == 'true') & (`PAYRESULT.GROSS_PAY` > 0) & ((@today - `PAYRESULT.PAY_DATE`).dt.days <= 45)
    require_populated: true
    severity: high
    dimension: consistency
    message: Recent payroll result has gross pay for a position marked vacant
    why_it_matters: A position marked vacant should have no incumbent being paid against it. Gross pay against a vacant position in the last 45 days means either the position was not updated after the employee moved/left, or the pay is against the wrong position. Scoped to recent pay results because ``POSITION.VACANT`` reflects current status, not the status as of the pay date, so older results are not reliably comparable.
    rule_authority: best_practice
    sap_impact: Headcount and vacancy reporting disagree with payroll cost; budget vs actual is wrong.
    fix_map:
      __other__: Confirm the position assignment with HR and correct the vacant flag or the payroll assignment.
    record_fix_template: 'Employee {PAYRESULT.USERID}: paid against position {POSITION.CODE}, which is marked vacant.'
  - id: PAY156
    field: POSITION.EFFECTIVE_STATUS
    check_class: cross_field_check
    grain: PAYRESULT
    fail_when: (`POSITION.EFFECTIVE_STATUS` == 'I') & (`PAYRESULT.GROSS_PAY` > 0) & ((@today - `PAYRESULT.PAY_DATE`).dt.days <= 45)
    require_populated: true
    severity: medium
    dimension: consistency
    message: Recent payroll result has gross pay for a position that is inactive
    why_it_matters: An inactive position should not be carrying an active, paid incumbent. This usually means the position was deactivated without reassigning the employee. Scoped to recent pay results because ``POSITION.EFFECTIVE_STATUS`` reflects current status, not the status as of the pay date, so older results are not reliably comparable.
    rule_authority: best_practice
    sap_impact: Organizational structure reporting is inconsistent with actual payroll cost.
    fix_map:
      __other__: Confirm the position status with HR and either reactivate the position or reassign the employee.
    record_fix_template: 'Employee {PAYRESULT.USERID}: paid against position {POSITION.CODE}, which is inactive.'
  - id: PAY159
    field: POSITION.VACANT
    check_class: cross_field_check
    grain: PAYMENTINFO
    fail_when: (`POSITION.VACANT`.str.lower() == 'true') & (`PAYMENTINFO.ACCOUNT_NUMBER`.notna() | `PAYMENTINFO.IBAN`.notna())
    severity: high
    dimension: consistency
    message: A payment instruction is on file for a position marked vacant
    why_it_matters: A vacant position should have no bank payment instruction on file tied to it. This is usually a leaver whose position was vacated but whose payment instruction was never removed. (This check does not filter to the latest effective-dated record; it flags any payment instruction on file, current or historic.)
    rule_authority: best_practice
    sap_impact: Risk of a payment being sent in error against a vacant position.
    fix_map:
      __other__: Confirm the position assignment with HR and remove or reassign the payment instruction.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: has a payment instruction on file against position {POSITION.CODE}, which is marked vacant.'
