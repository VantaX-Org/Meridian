  - id: PAY204
    field: PAYRESULT.NET_PAY
    check_class: cross_field_check
    fail_when: "`PAYRESULT.NET_PAY` < 0"
    require_populated: true
    severity: critical
    dimension: accuracy
    message: Net pay is negative — payroll result cannot be paid out as-is
    why_it_matters: >-
      NET_PAY is the amount actually disbursed to the employee. A negative value means
      deductions and tax exceeded gross pay, which is either a genuine over-deduction
      situation needing manual handling or a calculation error upstream. Either way it
      must not reach the bank payment file unchanged.
    rule_authority: best_practice
    sap_impact: >-
      Bank payment file cannot process a negative disbursement. GL posting for this
      payroll result is suspended pending manual review.
    fix_map:
      __other__: >-
        Net pay of {actual_value} is negative. Review the payroll calculation (gross pay,
        tax, deductions) via Payroll Control Center before releasing this result.
    record_fix_template: >-
      Payroll result {PAYRESULT.USERID}: NET_PAY is negative. Review calculation via
      Payroll Control Center before release.

  - id: PAY205
    field: PAYRESULT.GROSS_PAY
    check_class: cross_field_check
    fail_when: "abs(`PAYRESULT.GROSS_PAY` - (`PAYRESULT.NET_PAY` + `PAYRESULT.TAX_AMOUNT` + `PAYRESULT.DEDUCTIONS`)) > 0.01"
    require_populated: true
    severity: critical
    dimension: accuracy
    message: Gross pay does not reconcile with net pay plus tax plus deductions
    why_it_matters: >-
      GROSS_PAY must equal NET_PAY + TAX_AMOUNT + DEDUCTIONS. A mismatch means the
      payroll result is internally inconsistent, which corrupts GL posting splits and
      payslip totals and usually points to a missed component in the payroll export.
    rule_authority: best_practice
    sap_impact: >-
      GL posting split between net pay, tax and deductions does not balance. Payslip
      totals are inconsistent and reconciliation fails.
    fix_map:
      __other__: >-
        Gross pay {actual_value} does not equal net pay + tax + deductions. Re-run the
        payroll result export or correct the component breakdown via Payroll Control
        Center.
    record_fix_template: >-
      Payroll result {PAYRESULT.USERID}: GROSS_PAY does not reconcile with NET_PAY + TAX_AMOUNT +
      DEDUCTIONS. Re-run export via Payroll Control Center.

  - id: PAY206
    field: PAYMENTINFO.EFFECTIVE_DATE
    check_class: freshness_check
    max_age_hours: 26280
    severity: medium
    dimension: timeliness
    message: Payment information has not been updated in over 3 years
    why_it_matters: >-
      Bank account details rarely stay static for multi-year periods without any
      employee action. A payment record whose EFFECTIVE_DATE has not moved in 3+ years
      may indicate the employee's banking details are stale or were never re-verified
      after a bank/account change elsewhere.
    rule_authority: best_practice
    sap_impact: >-
      Payments may be sent to a bank account the employee no longer controls, risking
      misdirected funds and compliance exposure.
    fix_map:
      __other__: >-
        Payment information for this account has not been updated since
        {PAYMENTINFO.EFFECTIVE_DATE}. Ask the employee to re-verify bank details via
        Employee Central Payment Information.
    record_fix_template: >-
      Payment record {PAYMENTINFO.USERID}: EFFECTIVE_DATE {PAYMENTINFO.EFFECTIVE_DATE}
      is over 3 years old. Ask employee to re-verify bank details.

  - id: PAY207
    field: PAYMENTINFO.EFFECTIVE_DATE
    check_class: uniqueness_check
    fields:
    - PAYMENTINFO.USERID
    - PAYMENTINFO.PAY_TYPE
    - PAYMENTINFO.EFFECTIVE_DATE
    severity: high
    dimension: consistency
    message: More than one payment information record for the same employee, pay type and effective date
    why_it_matters: >-
      PAYMENTINFO has no end date — each record is effective from its EFFECTIVE_DATE
      until superseded. Two records for the same employee and pay type effective on the
      same date create an ambiguous split that the payroll engine cannot resolve to a
      single authoritative record for disbursement.
    rule_authority: best_practice
    sap_impact: >-
      Bank payment file may use the wrong account for this pay type, or the payment
      split percentage/amount calculation becomes indeterminate.
    fix_map:
      __other__: >-
        Duplicate effective-dated payment record for this employee and pay type. Correct
        or remove the superseded record via Employee Central Payment Information.
    record_fix_template: >-
      Payment record {PAYMENTINFO.USERID}: duplicate EFFECTIVE_DATE for pay type
      {PAYMENTINFO.PAY_TYPE}. Correct or remove the superseded record.

  - id: PAY208
    field: PAYMENTINFO.PERCENT
    check_class: cross_field_check
    fail_when: "(`PAYMENTINFO.PERCENT` < 0) | (`PAYMENTINFO.PERCENT` > 100)"
    require_populated: true
    severity: critical
    dimension: validity
    message: Payment split percent must be between 0 and 100
    why_it_matters: >-
      PERCENT expresses the share of net pay routed to this account. A value outside
      0-100 is not a valid proportion and causes the bank payment split calculation to
      produce a nonsensical disbursement amount.
    rule_authority: best_practice
    sap_impact: >-
      Bank payment file split calculation fails or produces an incorrect disbursement
      amount for this account.
    fix_map:
      __other__: >-
        Payment split percent {actual_value} is outside the valid 0-100 range. Correct
        via Employee Central Payment Information.
    record_fix_template: >-
      Payment record {PAYMENTINFO.USERID}: PERCENT {actual_value} is outside 0-100.
      Correct via Employee Central Payment Information.

  - id: PAY209
    field: PAYMENTINFO.BIC
    check_class: regex_check
    pattern: "^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$"
    severity: medium
    dimension: validity
    message: BIC/SWIFT code is not a valid 8 or 11-character format
    why_it_matters: >-
      BIC identifies the receiving bank for international payments. A malformed BIC
      causes the bank payment file to be rejected by the clearing network.
    rule_authority: best_practice
    sap_impact: >-
      International bank payment file is rejected by the clearing network — employee
      payment delayed.
    fix_map:
      __other__: >-
        BIC '{invalid_value}' is not a valid 8 or 11-character SWIFT/BIC code. Correct
        via Employee Central Payment Information.
    record_fix_template: >-
      Payment record {PAYMENTINFO.USERID}: BIC '{actual_value}' is invalid format.
      Correct via Employee Central Payment Information.

  - id: PAY210
    field: PAYMENTINFO.CURRENCY
    check_class: domain_value_check
    allowed_values: ["ZAR", "USD", "EUR", "GBP", "AUD", "CAD", "CHF", "JPY", "CNY", "INR", "SGD", "AED", "SAR", "NGN", "KES", "BRL", "MXN", "NZD", "SEK", "NOK", "DKK", "PLN", "HKD", "VND", "PHP", "THB", "IDR", "MYR", "KRW", "EGP"]
    severity: medium
    dimension: validity
    message: Payment currency is not a recognised ISO 4217 code
    why_it_matters: >-
      PAYMENTINFO.CURRENCY must be a real, actively-used ISO 4217 currency code, not
      merely 3 uppercase letters. A syntactically valid but non-existent code (e.g. ZZZ)
      passes format checks but is rejected by the bank's clearing system.
    rule_authority: best_practice
    sap_impact: >-
      Bank payment file rejected — currency code is not recognised by the payment
      clearing network.
    valid_values_with_labels:
      ZAR: South African Rand
      USD: US Dollar
      EUR: Euro
      GBP: British Pound
      AUD: Australian Dollar
      CAD: Canadian Dollar
      CHF: Swiss Franc
      JPY: Japanese Yen
      CNY: Chinese Yuan
      INR: Indian Rupee
      SGD: Singapore Dollar
      AED: UAE Dirham
      SAR: Saudi Riyal
      NGN: Nigerian Naira
      KES: Kenyan Shilling
      BRL: Brazilian Real
      MXN: Mexican Peso
      NZD: New Zealand Dollar
      SEK: Swedish Krona
      NOK: Norwegian Krone
      DKK: Danish Krone
      PLN: Polish Zloty
      HKD: Hong Kong Dollar
      VND: Vietnamese Dong
      PHP: Philippine Peso
      THB: Thai Baht
      IDR: Indonesian Rupiah
      MYR: Malaysian Ringgit
      KRW: South Korean Won
      EGP: Egyptian Pound
    fix_map:
      __other__: >-
        Currency '{invalid_value}' is not a recognised currency code for this payroll
        footprint. Correct via Employee Central Payment Information, or contact Meridian
        support if a legitimate new currency is needed.
    record_fix_template: >-
      Payment record {PAYMENTINFO.USERID}: CURRENCY '{actual_value}' is not recognised.
      Correct via Employee Central Payment Information.

  - id: PAY211
    field: PAYMENTINFO.PAYMENT_METHOD
    check_class: cross_field_check
    fail_when: "(`PAYMENTINFO.PAYMENT_METHOD`.str.strip().str.lower() == 'bank transfer') & `PAYMENTINFO.ACCOUNT_NUMBER`.isna() & `PAYMENTINFO.IBAN`.isna() & `PAYMENTINFO.BANK`.isna()"
    severity: critical
    dimension: completeness
    message: Payment method is bank transfer but no account number, IBAN or bank is populated
    why_it_matters: >-
      A payment record marked as bank transfer must carry at least one account
      identifier (account number or IBAN) and a receiving bank. Without any of these
      the bank payment file has no destination for the funds.
    rule_authority: best_practice
    sap_impact: >-
      Bank payment file has no destination account for this employee — payment cannot
      be disbursed.
    fix_map:
      __blank__: >-
        Payment method is bank transfer but ACCOUNT_NUMBER, IBAN and BANK are all blank.
        Capture the employee's bank details via Employee Central Payment Information.
    record_fix_template: >-
      Payment record {PAYMENTINFO.USERID}: bank transfer with no ACCOUNT_NUMBER, IBAN or
      BANK. Capture bank details via Employee Central Payment Information.

  - id: PAY212
    field: PAYRESULT.USERID
    check_class: exists_check
    target_table: EMPJOBHIST
    target_fields: [USERID]
    severity: high
    dimension: consistency
    message: Payroll result exists for an employee with no job history record
    why_it_matters: >-
      Every payroll result must correspond to an employee with a job history record in
      SuccessFactors Employee Central. A payroll result with no matching EMPJOBHIST
      record usually means the employee record was deleted or never synced, leaving an
      orphaned payroll result that cannot be reconciled to org assignment.
    rule_authority: best_practice
    sap_impact: >-
      Orphaned payroll result cannot be reconciled to cost centre, department or
      position for GL allocation and management reporting.
    fix_map:
      __other__: >-
        No EMPJOBHIST record exists for USERID {actual_value}. Confirm the employee
        exists in Employee Central and re-run the Employee Central to ECC sync.
    record_fix_template: >-
      Payroll result {PAYRESULT.USERID}: no matching EMPJOBHIST record. Confirm employee
      exists in Employee Central and re-sync.

  - id: PAY213
    field: EMPJOBHIST.START_DATE
    check_class: interval_check
    group_by: [EMPJOBHIST.USERID]
    start: EMPJOBHIST.START_DATE
    end: EMPJOBHIST.END_DATE
    open_ended: true
    severity: high
    dimension: consistency
    message: Overlapping job history records for the same employee
    why_it_matters: >-
      EMPJOBHIST records for one employee must not overlap in time — each date must map
      to exactly one job assignment. Overlapping records make it ambiguous which
      cost centre, position and pay group applies on a given payroll run date.
    rule_authority: best_practice
    sap_impact: >-
      Payroll cannot determine the authoritative cost centre/position for the overlap
      period — GL allocation and pay grade lookups become ambiguous.
    fix_map:
      __other__: >-
        Overlapping job history period for this employee. End-date the superseded
        EMPJOBHIST record via Employee Central Job Information.
    record_fix_template: >-
      Employee {EMPJOBHIST.USERID}: overlapping job history periods. End-date the
      superseded record via Employee Central Job Information.

  - id: PAY214
    field: PAYMENTINFO.ROUTING_NUMBER
    check_class: regex_check
    pattern: "^\\d{9}$"
    applies_when:
      PAYMENTINFO.BANK_COUNTRY:
      - USA
    severity: high
    dimension: validity
    message: Routing number is not a valid 9-digit US ABA routing number
    why_it_matters: >-
      US bank transfers require a 9-digit ABA routing number. A routing number of any
      other shape causes the bank payment file to be rejected for a US-domiciled
      account.
    rule_authority: best_practice
    sap_impact: >-
      US bank payment file rejected — invalid ABA routing number. Employee payment
      delayed.
    fix_map:
      __other__: >-
        Routing number '{invalid_value}' is not a valid 9-digit US ABA routing number.
        Correct via Employee Central Payment Information.
    record_fix_template: >-
      Payment record {PAYMENTINFO.USERID}: ROUTING_NUMBER '{actual_value}' is not a
      valid 9-digit US routing number. Correct via Employee Central Payment Information.

  - id: PAY215
    field: PAYRESULT.DELTA_FLAG
    check_class: cross_field_check
    fail_when: "(`PAYRESULT.DELTA_FLAG` == 'X') & (`PAYRESULT.PAY_DATE` > @today)"
    require_populated: true
    severity: medium
    dimension: accuracy
    message: Retroactive correction flagged with a future pay date
    why_it_matters: >-
      DELTA_FLAG = X marks a retroactive correction to an already-paid period. A delta
      result with a future PAY_DATE is contradictory — a correction cannot retroactively
      apply to a payment that has not happened yet, and usually indicates a data entry
      or export timing error.
    rule_authority: best_practice
    sap_impact: >-
      GL posting misclassifies a future-dated payment as a retroactive correction,
      causing reconciliation discrepancies between payroll and GL.
    fix_map:
      __other__: >-
        DELTA_FLAG is X but PAY_DATE {actual_value} is in the future. Confirm whether
        this is genuinely a retroactive correction or correct the DELTA_FLAG/PAY_DATE via
        Payroll Control Center.
    record_fix_template: >-
      Payroll result {PAYRESULT.USERID}: DELTA_FLAG is X with future PAY_DATE. Confirm
      correction validity via Payroll Control Center.
