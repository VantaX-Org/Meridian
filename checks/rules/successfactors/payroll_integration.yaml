module: payroll_integration
target_state: SUCCESSFACTORS
rules:

  - id: PAY001
    field: PAYRESULT.USERID
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "User ID is mandatory — orphaned payroll result cannot be posted to GL"
    why_it_matters: >-
      USERID links the payroll result to the employee who was paid. Without it, the GL
      posting cannot determine the cost centre, and the payment cannot be reconciled
      against the employee's compensation record.
    rule_authority: best_practice
    sap_impact: >-
      GL posting impossible — no cost centre derivation. Bank payment file cannot be
      generated. Payroll reconciliation fails.
    fix_map:
      __blank__: >-
        Assign the correct employee USERID by cross-referencing the payroll run log
        with the employee master. Update via Payroll Control Center > Payroll Result
        Import.
    record_fix_template: >-
      Payroll result {PAYRESULT.USERID}: USERID is missing. Assign via Payroll Control
      Center > Payroll Result Import.

  - id: PAY002
    field: PAYRESULT.NET_PAY
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Net pay is mandatory — null value means employee receives zero payment"
    why_it_matters: >-
      NET_PAY is the final amount transferred to the employee's bank account. A null
      value causes the bank payment file to either omit the employee entirely or generate
      a zero-value transfer, resulting in non-payment and legal non-compliance.
    rule_authority: best_practice
    sap_impact: >-
      Employee receives zero payment. Bank file generation fails or produces zero-value
      entry. Labour law non-compliance risk.
    fix_map:
      __blank__: >-
        Rerun payroll calculation for this employee via Payroll Control Center. If the
        issue persists, check gross pay components and deduction configuration.
    record_fix_template: >-
      Payroll result {PAYRESULT.USERID}: NET_PAY is missing. Rerun payroll calculation
      via Payroll Control Center.

  - id: PAY003
    field: PAYRESULT.PAY_DATE
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Pay date is mandatory — disbursement cannot be scheduled without it"
    why_it_matters: >-
      PAY_DATE determines when the bank payment is executed and when the GL posting is
      dated. Without it, the payment cannot be included in the bank file and the
      employee's payment is delayed indefinitely.
    rule_authority: best_practice
    sap_impact: >-
      Bank payment file excludes this employee. GL posting undated — rejected by
      finance. Employee payment delayed.
    fix_map:
      __blank__: >-
        Set the pay date to match the payroll period's scheduled payment date via
        Payroll Control Center > Payroll Result Import. Format: YYYY-MM-DD.
    record_fix_template: >-
      Payroll result {PAYRESULT.USERID}: PAY_DATE is missing. Set to payroll period
      payment date via Payroll Control Center. Format: YYYY-MM-DD.

  - id: PAY004
    field: PAYRESULT.CURRENCY
    check_class: regex_check
    pattern: "^[A-Z]{3}$"
    severity: critical
    dimension: validity
    message: "Currency must be a valid 3-letter ISO 4217 code (e.g. ZAR, USD, EUR)"
    why_it_matters: >-
      CURRENCY determines the denomination of the bank payment and GL posting. An invalid
      code causes the bank to reject the payment file and the GL posting to fail currency
      validation.
    rule_authority: best_practice
    sap_impact: >-
      Bank payment file rejected — invalid currency code. GL posting fails currency
      validation. Employee payment blocked.
    fix_map:
      __other__: >-
        Currency '{invalid_value}' is not a valid ISO 4217 code. Use the 3-letter
        uppercase code (e.g. ZAR, USD, EUR, GBP). Update via Payroll Control Center >
        Payroll Result Import.
    record_fix_template: >-
      Payroll result {PAYRESULT.USERID}: CURRENCY '{actual_value}' is invalid. Set to
      valid ISO 4217 code via Payroll Control Center.
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: high

  - id: PAY005
    field: PAYRESULT.COST_CENTRE
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Cost centre is required for GL cost allocation — missing value posts to suspense"
    why_it_matters: >-
      COST_CENTRE determines where in the GL the payroll expense is allocated. Without
      it, the entire payroll amount for this employee posts to a suspense account,
      requiring manual reallocation by finance.
    rule_authority: best_practice
    sap_impact: >-
      Payroll expense posts to suspense account. Management reporting by cost centre is
      incomplete. Finance must manually reallocate.
    fix_map:
      __blank__: >-
        Assign the correct cost centre from the employee's organisational assignment via
        Payroll Control Center > Payroll Result Import. Cross-reference with the
        employee's department and position.
    record_fix_template: >-
      Payroll result {PAYRESULT.USERID}: COST_CENTRE is missing. Assign via Payroll
      Control Center. Derive from employee org assignment.

  - id: PAY006
    field: PAYRESULT.DELTA_FLAG
    check_class: domain_value_check
    allowed_values: ["", "X"]
    severity: high
    dimension: accuracy
    message: "Delta flag must be blank (standard) or X (retroactive correction)"
    why_it_matters: >-
      DELTA_FLAG indicates whether a payroll result is a standard run or a retroactive
      correction. An invalid value causes the GL integration to misclassify the posting
      type, leading to incorrect GL balances and reconciliation failures.
    rule_authority: best_practice
    sap_impact: >-
      GL posting uses wrong posting type. Retroactive corrections not recognised.
      Payroll reconciliation discrepancies.
    valid_values_with_labels:
      "": "Standard — original payroll result for this period"
      "X": "Delta — retroactive correction to a previously posted result"
    fix_map:
      __blank__: >-
        Set to blank for standard payroll results or X for retroactive corrections.
        Update via Payroll Control Center > Payroll Result Import.
      __other__: >-
        Delta flag '{invalid_value}' is not valid. Use blank for standard results or X
        for retroactive corrections. Update via Payroll Control Center.
    record_fix_template: >-
      Payroll result {PAYRESULT.USERID}: DELTA_FLAG '{actual_value}' is invalid. Set to
      blank or X via Payroll Control Center.

  - id: PAY007
    field: PAYRESULT.GROSS_PAY
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Gross pay is mandatory — required for tax calculation and payslip generation"
    why_it_matters: >-
      GROSS_PAY is the total pre-deduction amount used to calculate tax withholding,
      social contributions, and benefit deductions. A null value causes all downstream
      calculations to fail, resulting in incorrect or zero deductions.
    rule_authority: best_practice
    sap_impact: >-
      Tax withholding cannot be calculated. Payslip shows no gross amount. Deduction
      calculations produce incorrect results.
    fix_map:
      __blank__: >-
        Rerun payroll calculation via Payroll Control Center. Verify that compensation
        records exist for this employee in the Compensation module.
    record_fix_template: >-
      Payroll result {PAYRESULT.USERID}: GROSS_PAY is missing. Rerun payroll
      calculation via Payroll Control Center.

  - id: PAY008
    field: PAYRESULT.PAY_PERIOD
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Pay period is required to assign result to the correct payroll cycle"
    why_it_matters: >-
      PAY_PERIOD determines which payroll cycle this result belongs to. Without it, the
      result cannot be reconciled against the payroll run and GL postings cannot be
      assigned to the correct accounting period.
    rule_authority: best_practice
    sap_impact: >-
      Payroll reconciliation cannot match this result to a run. GL posting assigned to
      wrong accounting period. Period-end reporting is incomplete.
    fix_map:
      __blank__: >-
        Assign the correct pay period identifier via Payroll Control Center > Payroll
        Result Import. Cross-reference with the payroll run schedule.
    record_fix_template: >-
      Payroll result {PAYRESULT.USERID}: PAY_PERIOD is missing. Assign via Payroll
      Control Center.

  - id: PAY009
    field: PAYRESULT.CURRENCY
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Currency is mandatory — payroll result cannot be processed without denomination"
    why_it_matters: >-
      CURRENCY is required to generate the bank payment file and perform any FX
      conversion for GL posting. Without it, the payment file generator cannot determine
      the denomination and the result is excluded from processing.
    rule_authority: best_practice
    sap_impact: >-
      Bank payment file excludes this result. GL posting cannot determine currency for
      multi-currency ledger. Employee payment blocked.
    fix_map:
      __blank__: >-
        Set the currency to match the employee's payroll company currency. Use ISO 4217
        format (e.g., ZAR, USD, EUR). Update via Payroll Control Center.
    record_fix_template: >-
      Payroll result {PAYRESULT.USERID}: CURRENCY is missing. Set to the correct ISO
      4217 code via Payroll Control Center.

  - id: PAY010
    field: PAYRESULT.GROSS_PAY
    check_class: cross_field_check
    severity: medium
    dimension: consistency
    message: Gross pay must be greater than or equal to net pay
    why_it_matters: Net pay is derived from gross pay minus deductions (tax, social contributions, benefits). If NET_PAY exceeds
      GROSS_PAY, it indicates a calculation error in payroll processing — deductions have been applied as additions, or the
      gross amount is understated.
    rule_authority: best_practice
    sap_impact: Payroll calculation error. Employee is overpaid relative to gross earnings. Tax withholding and deduction amounts
      are incorrect. GL postings out of balance.
    fix_map:
      __blank__: Review the payroll calculation for this employee. Verify that deductions are correctly applied and that gross
        pay includes all earnings components. Rerun payroll via Payroll Control Center.
    record_fix_template: 'Payroll result {PAYRESULT.USERID}: NET_PAY exceeds GROSS_PAY. Review payroll calculation via Payroll
      Control Center.'
    fail_when: '`PAYRESULT.GROSS_PAY` < `PAYRESULT.NET_PAY`'
    require_populated: true

  - id: PAY011
    field: PAYRESULT.TAX_AMOUNT
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Tax amount is required for regulatory reporting and employee payslip"
    why_it_matters: >-
      TAX_AMOUNT is the income tax withheld for this pay period. It must be reported to
      tax authorities and appears on the employee payslip. A missing value causes
      regulatory filing gaps and employee payslip errors.
    rule_authority: best_practice
    sap_impact: >-
      Tax authority filing incomplete. Employee payslip shows no tax withholding.
      Year-end tax certificates (W-2, IRP5) are incorrect.
    fix_map:
      __blank__: >-
        Verify tax calculation configuration and rerun payroll for this employee.
        If tax is genuinely zero (e.g., below threshold), enter 0 explicitly.
    record_fix_template: >-
      Payroll result {PAYRESULT.USERID}: TAX_AMOUNT is missing. Verify tax calculation
      and rerun payroll via Payroll Control Center.

  - id: PAY012
    field: PAYRESULT.COMPANY
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Company code is required to route payroll result to the correct legal entity"
    why_it_matters: >-
      COMPANY determines which legal entity the payroll expense is booked against. For
      multi-entity organisations, a missing company code causes the GL posting to default
      to the wrong entity or fail entirely.
    rule_authority: best_practice
    sap_impact: >-
      GL posting routed to wrong legal entity. Intercompany reconciliation fails.
      Statutory reporting for the correct entity is incomplete.
    fix_map:
      __blank__: >-
        Assign the correct company code from the employee's organisational assignment.
        Update via Payroll Control Center > Payroll Result Import.
    record_fix_template: >-
      Payroll result {PAYRESULT.USERID}: COMPANY is missing. Assign via Payroll Control
      Center.

  - id: PAY013
    field: PAYRESULT.PAYROLL_AREA
    check_class: null_check
    severity: medium
    dimension: completeness
    message: "Payroll area groups employees for payroll processing — missing value may cause exclusion"
    why_it_matters: >-
      PAYROLL_AREA groups employees by pay cycle (e.g., monthly salaried, bi-weekly
      hourly). Without it, the payroll run selector cannot include this employee in the
      correct processing group, potentially causing them to be skipped.
    rule_authority: best_practice
    sap_impact: >-
      Employee may be excluded from payroll run. Payroll processing group reports are
      incomplete.
    fix_map:
      __blank__: >-
        Assign the correct payroll area code based on the employee's pay frequency and
        location. Update via Payroll Control Center.
    record_fix_template: >-
      Payroll result {PAYRESULT.USERID}: PAYROLL_AREA is missing. Assign via Payroll
      Control Center.


  - id: PAY015
    field: PAYRESULT.DEDUCTIONS
    check_class: null_check
    severity: medium
    dimension: completeness
    message: "Total deductions should be recorded for payslip accuracy and reconciliation"
    why_it_matters: >-
      DEDUCTIONS captures the total amount withheld from gross pay (tax, benefits,
      pension, garnishments). A missing value makes it impossible to reconcile
      gross-to-net and produces incomplete payslips.
    rule_authority: best_practice
    sap_impact: >-
      Payslip shows no deduction breakdown. Gross-to-net reconciliation fails.
      Employee queries about pay discrepancies cannot be resolved.
    fix_map:
      __blank__: >-
        Verify payroll calculation includes all deduction wage types. If deductions are
        genuinely zero, enter 0 explicitly. Update via Payroll Control Center.
    record_fix_template: >-
      Payroll result {PAYRESULT.USERID}: DEDUCTIONS is missing. Verify payroll
      calculation via Payroll Control Center.

  - id: PAY016
    field: PAYRESULT.USERID_PAY
    check_class: uniqueness_check
    fields:
    - PAYRESULT.USERID_PAY
    - PAYRESULT.PAY_PERIOD
    - PAYRESULT.PAY_DATE
    severity: high
    dimension: uniqueness
    message: Duplicate payroll result records per employee per period — indicates replication error
    why_it_matters: Duplicate payroll results cause doubled payment amounts, incorrect tax withholding, and GL posting variances.
    rule_authority: best_practice
    sap_impact: Employee is paid twice. Tax withholding is doubled. Payroll-to-FI posting is overstated. Payroll reconciliation
      fails.
    fix_map:
      __blank__: Investigate the ECP replication log. Delete the duplicate payroll result via the Payroll Control Center. Re-run
        the replication for the affected period.
    applies_when:
      PAYRESULT.DELTA_FLAG:
        not_in:
        - X
    record_fix_template: "Employee {PAYRESULT.USERID_PAY}: more than one payroll result for the same period and pay date. Check the replication log and remove the duplicate."

  - id: PAY017
    field: PAYRESULT.PAY_PERIOD
    check_class: regex_check
    pattern: ^\d{4}(0[1-9]|[1-4][0-9]|5[0-3])$
    severity: high
    dimension: validity
    message: Payroll period must be YYYYPP (four-digit payroll year + period 01-53)
    why_it_matters: 'SAP payroll periods (FPPER) are the payroll year followed by the period number: 01-12 monthly, up to
      26 bi-weekly, up to 53 weekly. Any other value cannot be matched to a payroll control record, so the result cannot be
      reconciled, posted or reported by period.'
    rule_authority: sap_hard_constraint
    sap_impact: Result cannot be assigned to a payroll period; FI posting and period reconciliation exclude it.
    fix_map:
      __other__: Period '{invalid_value}' is not YYYYPP. Re-export the payroll result with the FPPER period (e.g. 202509).
    record_fix_template: 'Payroll result {PAYRESULT.USERID}: period ''{actual_value}'' is not a valid payroll period.'
  - id: PAY018
    field: PAYRESULT.PAYROLL_AREA
    check_class: regex_check
    pattern: ^[A-Z0-9]{1,2}$
    severity: low
    dimension: validity
    message: Payroll area must be a 1-2 character SAP payroll area code
    why_it_matters: The payroll area (ABKRS) is a two-character code that selects the payroll calendar and control record.
      A description or longer code ('Monthly', 'ZA_MONTHLY') in its place cannot be matched to a payroll calendar.
    rule_authority: sap_hard_constraint
    sap_impact: Result cannot be matched to a payroll calendar or control record; period reconciliation fails.
    fix_map:
      __other__: Payroll area '{invalid_value}' is not an ABKRS code. Export the two-character payroll area (e.g. Z1).
    record_fix_template: 'Payroll result {PAYRESULT.USERID}: payroll area ''{actual_value}'' is not a payroll area code.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: high
  - id: PAY019
    field: PAYRESULT.COMPANY
    check_class: regex_check
    pattern: ^[A-Z0-9]{1,4}$
    severity: medium
    dimension: validity
    message: Company code on the payroll result must be a 1-4 character SAP company code
    why_it_matters: Payroll posts to FI by company code (BUKRS, four characters, upper case). An Employee Central legal-entity
      code or name in this field cannot be posted and breaks the payroll-to-FI reconciliation.
    rule_authority: sap_hard_constraint
    sap_impact: Payroll posting to FI rejected for this result; company-level payroll reconciliation incomplete.
    fix_map:
      __other__: Company '{invalid_value}' is not a company code. Map the legal entity to its FI company code in the payroll
        export.
    record_fix_template: 'Payroll result {PAYRESULT.USERID}: company ''{actual_value}'' is not a company code.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: high
  - id: HPY001
    field: PA0008.BSGRD
    check_class: cross_field_check
    grain: PA0008
    fail_when: (`PA0008.BSGRD` <= 0) | (`PA0008.BSGRD` > 100)
    severity: high
    dimension: validity
    message: Capacity utilisation level is not between 0 and 100
    why_it_matters: The capacity utilisation level scales basic pay; 0 or more than 100 % pays nothing or more than full time.
    rule_authority: sap_hard_constraint
    sap_impact: Basic pay is wrong for every period of the record.
    fix_map:
      __other__: Correct the capacity utilisation (PA30, infotype 0008).
    record_fix_template: 'Employee {PA0008.PERNR} ({PA0008.BEGDA}-{PA0008.ENDDA}): capacity utilisation level is not between
      0 and 100.'
  - id: HPY002
    field: PA0008.TRFAR
    check_class: null_check
    grain: PA0008
    severity: medium
    dimension: completeness
    message: Pay scale type is missing
    why_it_matters: Pay scale type and area select the collective agreement and the indirect valuation of wage types.
    rule_authority: sap_hard_constraint
    sap_impact: Indirectly valuated wage types get no amount.
    fix_map:
      __blank__: Maintain pay scale type in the infotype record (PA30, infotype 0008).
    record_fix_template: 'Employee {PA0008.PERNR} ({PA0008.BEGDA}-{PA0008.ENDDA}): pay scale type is missing.'
  - id: HPY003
    field: PA0008.WAERS
    check_class: cross_field_check
    grain: PA0008
    fail_when: '`PA0008.WAERS`.isna() & (`PA0008.BET01` > 0)'
    severity: high
    dimension: completeness
    message: Basic pay has an amount but no currency
    why_it_matters: Wage-type amounts are meaningless without their currency.
    rule_authority: sap_hard_constraint
    sap_impact: Payroll cannot valuate the wage type.
    fix_map:
      __other__: Maintain the currency (PA30, infotype 0008).
    record_fix_template: 'Employee {PA0008.PERNR} ({PA0008.BEGDA}-{PA0008.ENDDA}): basic pay has an amount but no currency.'
  - id: HPY004
    field: PA0008.TRFAR
    check_class: referential_check
    grain: PA0008
    severity: medium
    dimension: validity
    message: Pay scale type is not defined in configuration (T510A)
    why_it_matters: Infotype values are checked against T510A on entry; a value that is not there was loaded around the check
      or its configuration was deleted afterwards.
    rule_authority: sap_hard_constraint
    sap_impact: Payroll, time evaluation and HR reporting cannot interpret the value; the employee drops out of every selection
      on it.
    fix_map:
      __other__: Replace the value with one defined in T510A, or configure it.
    record_fix_template: 'Employee {PA0008.PERNR} ({PA0008.BEGDA}-{PA0008.ENDDA}): pay scale type is not defined in configuration
      (T510A).'
  - id: HPY005
    field: PA0008.LGA01
    check_class: referential_check
    grain: PA0008
    severity: high
    dimension: validity
    message: Basic pay wage type is not defined in configuration (T512Z)
    why_it_matters: Infotype values are checked against T512Z on entry; a value that is not there was loaded around the check
      or its configuration was deleted afterwards.
    rule_authority: sap_hard_constraint
    sap_impact: Payroll, time evaluation and HR reporting cannot interpret the value; the employee drops out of every selection
      on it.
    fix_map:
      __other__: Replace the value with one defined in T512Z, or configure it.
    record_fix_template: 'Employee {PA0008.PERNR} ({PA0008.BEGDA}-{PA0008.ENDDA}): basic pay wage type is not defined in configuration
      (T512Z).'
  - id: HPY006
    field: PA0014.LGART
    check_class: null_check
    grain: PA0014
    severity: high
    dimension: completeness
    message: Wage type of the recurring payment/deduction is missing
    why_it_matters: The wage type decides how the amount is paid, taxed and posted.
    rule_authority: sap_hard_constraint
    sap_impact: The record is ignored by payroll.
    fix_map:
      __blank__: Maintain wage type of the recurring payment/deduction in the infotype record (PA30, infotype 0014).
    record_fix_template: 'Employee {PA0014.PERNR} ({PA0014.BEGDA}-{PA0014.ENDDA}): wage type of the recurring payment/deduction
      is missing.'
  - id: HPY007
    field: PA0015.LGART
    check_class: null_check
    grain: PA0015
    severity: high
    dimension: completeness
    message: Wage type of the additional payment is missing
    why_it_matters: The wage type decides how the amount is paid, taxed and posted.
    rule_authority: sap_hard_constraint
    sap_impact: The record is ignored by payroll.
    fix_map:
      __blank__: Maintain wage type of the additional payment in the infotype record (PA30, infotype 0015).
    record_fix_template: 'Employee {PA0015.PERNR} ({PA0015.BEGDA}-{PA0015.ENDDA}): wage type of the additional payment is missing.'
  - id: HPY008
    field: PA0014.WAERS
    check_class: cross_field_check
    grain: PA0014
    fail_when: '`PA0014.WAERS`.isna() & (`PA0014.BETRG` > 0)'
    severity: high
    dimension: completeness
    message: Recurring payment has an amount but no currency
    why_it_matters: Wage-type amounts are meaningless without their currency.
    rule_authority: sap_hard_constraint
    sap_impact: Payroll cannot valuate the wage type.
    fix_map:
      __other__: Maintain the currency (PA30, infotype 0014).
    record_fix_template: 'Employee {PA0014.PERNR} ({PA0014.BEGDA}-{PA0014.ENDDA}): recurring payment has an amount but no currency.'
  - id: HPY009
    field: PA0015.WAERS
    check_class: cross_field_check
    grain: PA0015
    fail_when: '`PA0015.WAERS`.isna() & (`PA0015.BETRG` > 0)'
    severity: high
    dimension: completeness
    message: Additional payment has an amount but no currency
    why_it_matters: Wage-type amounts are meaningless without their currency.
    rule_authority: sap_hard_constraint
    sap_impact: Payroll cannot valuate the wage type.
    fix_map:
      __other__: Maintain the currency (PA30, infotype 0015).
    record_fix_template: 'Employee {PA0015.PERNR} ({PA0015.BEGDA}-{PA0015.ENDDA}): additional payment has an amount but no currency.'
  - id: HPY010
    field: PA0014.LGART
    check_class: referential_check
    grain: PA0014
    severity: high
    dimension: validity
    message: Recurring wage type is not defined in configuration (T512Z)
    why_it_matters: Infotype values are checked against T512Z on entry; a value that is not there was loaded around the check
      or its configuration was deleted afterwards.
    rule_authority: sap_hard_constraint
    sap_impact: Payroll, time evaluation and HR reporting cannot interpret the value; the employee drops out of every selection
      on it.
    fix_map:
      __other__: Replace the value with one defined in T512Z, or configure it.
    record_fix_template: 'Employee {PA0014.PERNR} ({PA0014.BEGDA}-{PA0014.ENDDA}): recurring wage type is not defined in configuration
      (T512Z).'
  - id: HPY011
    field: PA0015.LGART
    check_class: referential_check
    grain: PA0015
    severity: high
    dimension: validity
    message: Additional-payment wage type is not defined in configuration (T512Z)
    why_it_matters: Infotype values are checked against T512Z on entry; a value that is not there was loaded around the check
      or its configuration was deleted afterwards.
    rule_authority: sap_hard_constraint
    sap_impact: Payroll, time evaluation and HR reporting cannot interpret the value; the employee drops out of every selection
      on it.
    fix_map:
      __other__: Replace the value with one defined in T512Z, or configure it.
    record_fix_template: 'Employee {PA0015.PERNR} ({PA0015.BEGDA}-{PA0015.ENDDA}): additional-payment wage type is not defined
      in configuration (T512Z).'
  - id: HPY012
    field: HRPY_RGDIR.FPBEG
    check_class: cross_field_check
    grain: HRPY_RGDIR
    fail_when: '`HRPY_RGDIR.FPBEG` > `HRPY_RGDIR.FPEND`'
    severity: high
    dimension: consistency
    message: Payroll result's for-period starts after it ends
    why_it_matters: A payroll period runs from its start to its end date; an inverted period cannot be valuated or reported.
    rule_authority: sap_hard_constraint
    sap_impact: Period-based payroll reporting and postings misplace the result.
    fix_map:
      __other__: 'Raise an SAP incident: payroll directories are never edited.'
    record_fix_template: 'Payroll result {HRPY_RGDIR.PERNR}/{HRPY_RGDIR.SEQNR}: period {HRPY_RGDIR.FPBEG}-{HRPY_RGDIR.FPEND}.'
  - id: HPY013
    field: HRPY_RGDIR.PAYDT
    check_class: null_check
    grain: HRPY_RGDIR
    applies_when:
      HRPY_RGDIR.VOID:
        blank: true
    severity: medium
    dimension: completeness
    message: Payroll result has no payment date
    why_it_matters: The payment date drives the bank transfer and the tax period of the payment.
    rule_authority: sap_hard_constraint
    sap_impact: Bank transfer and tax reporting date are unknown.
    fix_map:
      __blank__: Re-run payroll for the period, or raise an SAP incident.
    record_fix_template: 'Payroll result {HRPY_RGDIR.PERNR}/{HRPY_RGDIR.SEQNR}: no payment date.'
  - id: HPY014
    field: HRPY_RGDIR.FPPER
    check_class: uniqueness_check
    grain: HRPY_RGDIR
    fields:
    - HRPY_RGDIR.PERNR
    - HRPY_RGDIR.FPPER
    - HRPY_RGDIR.INPER
    applies_when:
      HRPY_RGDIR.SRTZA:
      - A
      HRPY_RGDIR.VOID:
        blank: true
      HRPY_RGDIR.PAYTY:
        blank: true
    severity: critical
    dimension: uniqueness
    message: Two current regular payroll results for the same employee and period
    why_it_matters: Each regular payroll period has exactly one current ('A') result per in-period. Two mean the period was
      paid twice or the directory is corrupt.
    rule_authority: sap_hard_constraint
    sap_impact: Double payment; year-to-date totals and tax are wrong.
    fix_map:
      __other__: Check the payroll log (PC_PAYRESULT); reverse the duplicate result (PU01) and recover the overpayment.
    record_fix_template: 'Employee {HRPY_RGDIR.PERNR}: period {HRPY_RGDIR.FPPER} (in {HRPY_RGDIR.INPER}) has two current results.'
  - id: HPY015
    field: ZMERIDIAN_PAYRT.BETRG
    check_class: cross_field_check
    grain: ZMERIDIAN_PAYRT
    fail_when: '`ZMERIDIAN_PAYRT.BETRG` < 0'
    applies_when:
      ZMERIDIAN_PAYRT.LGART:
      - /560
    severity: critical
    dimension: accuracy
    message: Amount paid (/560) is negative
    why_it_matters: When deductions exceed earnings, SAP payroll carries the shortfall forward as a claim (/561) and pays zero.
      A negative amount paid means the result was produced or changed outside the standard schema.
    rule_authority: sap_hard_constraint
    sap_impact: A negative bank transfer or a payment file the bank rejects.
    fix_map:
      __other__: Check the payroll schema / personal calculation rules for the employee's grouping; re-run payroll for the period.
    record_fix_template: 'Employee {ZMERIDIAN_PAYRT.PERNR} result {ZMERIDIAN_PAYRT.SEQNR} (period {ZMERIDIAN_PAYRT.FPPER}):
      /560 = {ZMERIDIAN_PAYRT.BETRG} {ZMERIDIAN_PAYRT.WAERS}.'
  - id: HPY016
    field: ZMERIDIAN_PAYRT.BETRG
    check_class: cross_field_check
    grain: ZMERIDIAN_PAYRT
    fail_when: '`ZMERIDIAN_PAYRT.BETRG` < 0'
    applies_when:
      ZMERIDIAN_PAYRT.LGART:
      - /101
    severity: high
    dimension: accuracy
    message: Total gross (/101) is negative
    why_it_matters: Total gross sums the employee's earnings; a negative gross means a reversal or retro correction exceeded
      the period's earnings, which normally points to a keying error in a recurring or additional payment.
    rule_authority: sap_hard_constraint
    sap_impact: Tax and social-security bases are negative; statutory reports for the period are wrong.
    fix_map:
      __other__: Review the period's infotype 0014 / 0015 / 2010 entries and retro changes; correct and re-run payroll.
    record_fix_template: 'Employee {ZMERIDIAN_PAYRT.PERNR} result {ZMERIDIAN_PAYRT.SEQNR} (period {ZMERIDIAN_PAYRT.FPPER}):
      /101 = {ZMERIDIAN_PAYRT.BETRG} {ZMERIDIAN_PAYRT.WAERS}.'
  - id: HPY017
    field: ZMERIDIAN_PAYRT.BETRG
    check_class: cross_field_check
    grain: ZMERIDIAN_PAYRT
    fail_when: '`ZMERIDIAN_PAYRT.BETRG` != 0'
    applies_when:
      ZMERIDIAN_PAYRT.LGART:
      - /561
    severity: medium
    dimension: accuracy
    message: 'Payroll result carries a claim (/561): the employee owes money'
    why_it_matters: A claim arises when deductions exceed earnings. It is recovered from later pay only while the employee keeps
      earning; for leavers it has to be recovered manually.
    rule_authority: best_practice
    sap_impact: Unrecovered overpayment; for leavers, a receivable nobody chases.
    fix_map:
      __other__: Agree recovery with the employee (infotype 0015 deduction or manual repayment) and document it.
    record_fix_template: 'Employee {ZMERIDIAN_PAYRT.PERNR} result {ZMERIDIAN_PAYRT.SEQNR} (period {ZMERIDIAN_PAYRT.FPPER}):
      /561 = {ZMERIDIAN_PAYRT.BETRG} {ZMERIDIAN_PAYRT.WAERS}.'
  - id: HPY018
    field: ZMERIDIAN_PAYRT.BETRG
    check_class: aggregate_check
    grain: ZMERIDIAN_PAYRT
    group_by:
    - ZMERIDIAN_PAYRT.PERNR
    - ZMERIDIAN_PAYRT.SEQNR
    amount: ZMERIDIAN_PAYRT.BETRG
    split_field: ZMERIDIAN_PAYRT.LGART
    left_values:
    - /559
    right_values:
    - /560
    compare: left_gt_right
    severity: high
    dimension: accuracy
    message: Bank transfer (/559) exceeds the amount paid (/560)
    why_it_matters: The bank transfer pays out (part of) the amount paid; it can never exceed it. More transferred than paid
      is a payment-split error in the bank-details infotype or the schema.
    rule_authority: sap_hard_constraint
    sap_impact: The employee is overpaid by the difference.
    fix_map:
      __other__: 'Check the employee''s bank details (infotype 0009: main and other banks, fixed amounts) and the result''s
        payment wage types; correct and re-run payroll.'
    record_fix_template: 'Employee {ZMERIDIAN_PAYRT.PERNR} result {ZMERIDIAN_PAYRT.SEQNR} (period {ZMERIDIAN_PAYRT.FPPER}):
      bank transfer exceeds amount paid.'
  - id: PAY020
    field: PAYRESULT.PAY_DATE
    check_class: cross_field_check
    fail_when: (`PAYRESULT.PAY_DATE` - `EMPEMPLOYMENT.END_DATE`).dt.days > 90
    require_populated: true
    applies_when:
      PAYRESULT.GROSS_PAY:
        gt: 0
    severity: high
    dimension: consistency
    message: Employee was paid more than 90 days after the employment ended
    why_it_matters: Final pay, leave payout and late bonuses are normally settled within a few pay periods of leaving.
      Gross pay more than 90 days later suggests the leaver is still on the payroll.
    rule_authority: best_practice
    sap_impact: Overpayment to a leaver that must be recovered; payroll cost and headcount reports include a leaver.
    fix_map:
      __other__: Confirm the payment with payroll. If it is not a planned late payment, stop pay for the employee and
        recover the overpayment.
    record_fix_template: 'Employee {PAYRESULT.USERID}: paid on {PAYRESULT.PAY_DATE}, employment ended
      {EMPEMPLOYMENT.END_DATE}.'
  - id: PAY021
    field: PAYRESULT.PAY_DATE
    check_class: cross_field_check
    fail_when: '`PAYRESULT.PAY_DATE` < `EMPEMPLOYMENT.START_DATE`'
    require_populated: true
    severity: medium
    dimension: consistency
    message: Payroll result is dated before the employment started
    why_it_matters: An employee cannot be paid for a period before the hire date. A pay date before hire means the hire
      date in Employee Central does not match payroll, or the result belongs to an earlier employment.
    rule_authority: best_practice
    sap_impact: Service dates, statutory year-to-date totals and payroll reconciliation are wrong.
    fix_map:
      __other__: Check the hire date in Employee Central against the payroll system and correct the wrong one.
    record_fix_template: 'Employee {PAYRESULT.USERID}: paid on {PAYRESULT.PAY_DATE}, hired {EMPEMPLOYMENT.START_DATE}.'
  - id: PAY022
    field: PAYRESULT.NET_PAY
    check_class: cross_field_check
    fail_when: '`PAYRESULT.NET_PAY` < 0'
    severity: medium
    dimension: validity
    message: Net pay is negative
    why_it_matters: Negative net pay means deductions are larger than gross pay. It happens after overpayment recovery or
      retroactive changes, but it creates a debt the employee owes and needs follow-up.
    rule_authority: best_practice
    sap_impact: Bank transfer cannot be made; the employee owes money that must be recovered in a later period.
    fix_map:
      __other__: Review the deductions and retroactive changes for the period with payroll and agree a recovery plan.
    record_fix_template: 'Employee {PAYRESULT.USERID}: Net pay is negative. Correct the record.'
  - id: PAY023
    field: PAYRESULT.CURRENCY
    check_class: cross_field_check
    fail_when: '`PAYRESULT.CURRENCY` != `FOCOMPANY.CURRENCY`'
    require_populated: true
    severity: low
    dimension: consistency
    message: Payroll result currency differs from the legal entity's default currency
    why_it_matters: Payroll normally runs in the currency of the legal entity. A different currency often means the
      employee is in the wrong legal entity in Employee Central or the payroll mapping is wrong.
    rule_authority: best_practice
    sap_impact: Payroll posting to finance and cost reports convert amounts at the wrong rate or fail.
    fix_map:
      __other__: Confirm the employee's legal entity and the payroll currency mapping; correct the wrong one.
    record_fix_template: 'Employee {PAYRESULT.USERID}: paid in {PAYRESULT.CURRENCY}, legal entity uses {FOCOMPANY.CURRENCY}.'
  - id: HPY019
    field: PA0008.TRFGR
    check_class: exists_check
    grain: PA0008
    fields:
    - PA0008.TRFAR
    - PA0008.TRFGB
    - PA0008.TRFGR
    - PA0008.TRFST
    target_table: T510
    target_fields:
    - TRFAR
    - TRFGB
    - TRFGR
    - TRFST
    applies_when:
      PA0008.ENDDA:
      - '99991231'
    severity: high
    dimension: validity
    message: Pay scale assignment is not defined in the pay scale tables
    why_it_matters: The combination of pay scale type, area, group and level on infotype 0008 must exist in T510. A combination that was never defined cannot be valued.
    rule_authority: sap_hard_constraint
    sap_impact: Payroll cannot determine the scale pay and stops with an error for the employee.
    fix_map:
      __other__: Correct the pay scale fields in PA30 infotype 0008 or create the pay scale in T510. Note that T510 is checked without the country grouping.
    record_fix_template: 'Employee {PA0008.PERNR}: pay scale type, area, group and level are not defined in T510. Correct in PA30 infotype 0008.'
  - id: HPY020
    field: PA0008.TRFGB
    check_class: null_check
    grain: PA0008
    applies_when:
      PA0008.ENDDA:
      - '99991231'
      PA0008.TRFGR:
        populated: true
    severity: high
    dimension: completeness
    message: Pay scale group is set but the pay scale area is blank
    why_it_matters: A pay scale group alone does not identify a pay scale. The pay scale area is part of the T510 key.
    rule_authority: best_practice
    sap_impact: Scale pay cannot be determined, so basic pay is not valued from the scale.
    fix_map:
      __blank__: Enter the pay scale area in PA30 infotype 0008.
    record_fix_template: 'Employee {PA0008.PERNR}: has a pay scale group but no pay scale area. Complete in PA30 infotype 0008.'
  - id: HPY021
    field: PA0008.TRFST
    check_class: null_check
    grain: PA0008
    applies_when:
      PA0008.ENDDA:
      - '99991231'
      PA0008.TRFGR:
        populated: true
    severity: high
    dimension: completeness
    message: Pay scale group is set but the pay scale level is blank
    why_it_matters: A pay scale group alone does not identify a pay scale. The pay scale level is part of the T510 key.
    rule_authority: best_practice
    sap_impact: Scale pay cannot be determined, so basic pay is not valued from the scale.
    fix_map:
      __blank__: Enter the pay scale level in PA30 infotype 0008.
    record_fix_template: 'Employee {PA0008.PERNR}: has a pay scale group but no pay scale level. Complete in PA30 infotype 0008.'
  - id: HPY022
    field: PA0008.LGA01
    check_class: cross_field_check
    grain: PA0008
    fail_when: '`PA0008.LGA01`.isna() & (`PA0008.BET01` > 0)'
    applies_when:
      PA0008.ENDDA:
      - '99991231'
    severity: high
    dimension: consistency
    message: Basic pay has an amount but no wage type
    why_it_matters: An amount in the first basic pay slot needs the wage type that tells payroll how to value and post it.
    rule_authority: best_practice
    sap_impact: The amount is ignored by payroll or raises an error.
    fix_map:
      __other__: Enter the wage type in PA30 infotype 0008.
    record_fix_template: 'Employee {PA0008.PERNR}: has a basic pay amount without a wage type. Correct in PA30 infotype 0008.'
  - id: HPY023
    field: PA0008.ANSAL
    check_class: cross_field_check
    grain: PA0008
    fail_when: '`PA0008.ANSAL` < 0'
    applies_when:
      PA0008.ENDDA:
      - '99991231'
    severity: high
    dimension: validity
    message: Annual salary is negative
    why_it_matters: An annual salary below zero is impossible and usually a sign reversal.
    rule_authority: best_practice
    sap_impact: Annual salary reports and compensation planning take a negative base.
    fix_map:
      __other__: Correct the annual salary in PA30 infotype 0008.
    record_fix_template: 'Employee {PA0008.PERNR}: has a negative annual salary. Correct in PA30 infotype 0008.'
  - id: HPY024
    field: PA0008.ANCUR
    check_class: cross_field_check
    grain: PA0008
    fail_when: '`PA0008.ANCUR` != `PA0008.WAERS`'
    require_populated: true
    applies_when:
      PA0008.ENDDA:
      - '99991231'
    severity: medium
    dimension: consistency
    message: Annual salary currency differs from the pay currency
    why_it_matters: The annual salary is stated in a currency that differs from the pay currency of the same record. One of the two is wrong.
    rule_authority: best_practice
    sap_impact: Compensation reports convert at the wrong rate or mix currencies.
    fix_map:
      __other__: Align the currencies in PA30 infotype 0008.
    record_fix_template: 'Employee {PA0008.PERNR}: has an annual salary currency that differs from the pay currency. Correct in PA30 infotype 0008.'
    auto_fix:
      steps:
      - op: copy
        from: PA0008.WAERS
      confidence: medium
  - id: HPY025
    field: PA0008.LGA01
    check_class: exists_check
    grain: PA0008
    target_table: T512Z
    target_fields:
    - LGA01
    target_when:
      INFTY:
      - 0008
    applies_when:
      PA0008.ENDDA:
      - '99991231'
      PA0008.LGA01:
        populated: true
    severity: high
    dimension: validity
    message: Wage type is not permitted for infotype 0008
    why_it_matters: Table T512Z lists the wage types that may be entered in infotype 0008. A wage type outside the list is rejected by dialog maintenance, so it arrived through a load or a configuration change.
    rule_authority: best_practice
    sap_impact: Payroll evaluates the wage type without the permissibility rules that normally protect it.
    fix_map:
      __other__: Remove the wage type or add it to T512Z for infotype 0008. T512Z is checked without the country grouping.
    record_fix_template: 'Employee {PA0008.PERNR}: uses a wage type that is not permitted for infotype 0008. Correct in PA30.'
  - id: HPY026
    field: PA0014.LGART
    check_class: exists_check
    grain: PA0014
    target_table: T512Z
    target_fields:
    - LGART
    target_when:
      INFTY:
      - '0014'
    applies_when:
      PA0014.ENDDA:
      - '99991231'
      PA0014.LGART:
        populated: true
    severity: high
    dimension: validity
    message: Wage type is not permitted for infotype 0014
    why_it_matters: Table T512Z lists the wage types that may be entered in infotype 0014. A wage type outside the list is rejected by dialog maintenance, so it arrived through a load or a configuration change.
    rule_authority: best_practice
    sap_impact: Payroll evaluates the wage type without the permissibility rules that normally protect it.
    fix_map:
      __other__: Remove the wage type or add it to T512Z for infotype 0014. T512Z is checked without the country grouping.
    record_fix_template: 'Employee {PA0014.PERNR}: uses a wage type that is not permitted for infotype 0014. Correct in PA30.'
  - id: HPY027
    field: PA0015.LGART
    check_class: exists_check
    grain: PA0015
    target_table: T512Z
    target_fields:
    - LGART
    target_when:
      INFTY:
      - '0015'
    applies_when:
      PA0015.ENDDA:
      - '99991231'
      PA0015.LGART:
        populated: true
    severity: high
    dimension: validity
    message: Wage type is not permitted for infotype 0015
    why_it_matters: Table T512Z lists the wage types that may be entered in infotype 0015. A wage type outside the list is rejected by dialog maintenance, so it arrived through a load or a configuration change.
    rule_authority: best_practice
    sap_impact: Payroll evaluates the wage type without the permissibility rules that normally protect it.
    fix_map:
      __other__: Remove the wage type or add it to T512Z for infotype 0015. T512Z is checked without the country grouping.
    record_fix_template: 'Employee {PA0015.PERNR}: uses a wage type that is not permitted for infotype 0015. Correct in PA30.'
  - id: HPY028
    field: PA0014.BEGDA
    check_class: interval_check
    grain: PA0014
    group_by:
    - PA0014.PERNR
    - PA0014.LGART
    start: PA0014.BEGDA
    end: PA0014.ENDDA
    severity: high
    dimension: consistency
    message: Recurring payment of the same wage type overlaps itself
    why_it_matters: Two recurring payments for one wage type with overlapping validity are paid twice for the overlap period.
    rule_authority: sap_hard_constraint
    sap_impact: The employee is paid twice for the overlap and retroactive accounting corrects it later.
    fix_map:
      __other__: Delimit one of the records in PA30 infotype 0014.
    record_fix_template: 'Employee {PA0014.PERNR}: has overlapping recurring payments for one wage type. Delimit in PA30 infotype 0014.'
  - id: HPY029
    field: HRPY_RGDIR.VOIDD
    check_class: null_check
    grain: HRPY_RGDIR
    applies_when:
      HRPY_RGDIR.VOID:
      - X
    severity: medium
    dimension: completeness
    message: Voided payroll result has no void date
    why_it_matters: A voided payroll result must record when it was voided so reversals and audit trails can be reconstructed.
    rule_authority: best_practice
    sap_impact: The audit trail of the void is incomplete.
    fix_map:
      __blank__: Review the result in the payroll cluster directory (PC_PAYRESULT) and correct the void.
    record_fix_template: Payroll result {HRPY_RGDIR.PERNR}/{HRPY_RGDIR.SEQNR} is voided without a void date. Review the result directory.
  - id: HPY030
    field: HRPY_RGDIR.FPBEG
    check_class: cross_field_check
    grain: HRPY_RGDIR
    fail_when: (`HRPY_RGDIR.FPBEG` - `PA0000.BEGDA`).dt.days > 31
    require_populated: true
    applies_when:
      PA0000.STAT2:
      - '0'
      HRPY_RGDIR.VOID:
        blank: true
    severity: high
    dimension: consistency
    message: Payroll was run for a leaver for a period starting more than a month after leaving
    why_it_matters: A payroll result whose period begins more than 31 days after the leaving date means payroll kept running for a person who left.
    rule_authority: best_practice
    sap_impact: The leaver is paid or is shown on payroll reports for periods after employment.
    fix_map:
      __other__: Review the personnel number control record (PA03) and void the result with the payroll void function.
    record_fix_template: Payroll result {HRPY_RGDIR.PERNR}/{HRPY_RGDIR.SEQNR} is for a period after the employee left. Review the result.
  - id: PAY024
    field: PAYRESULT.GROSS_PAY
    check_class: cross_field_check
    fail_when: '`PAYRESULT.GROSS_PAY` < 0'
    applies_when:
      PAYRESULT.DELTA_FLAG:
        not_in:
        - X
    severity: medium
    dimension: validity
    message: Payroll result has a negative gross pay
    why_it_matters: The gross pay of a payroll result is a positive quantity; a negative value is a sign error or an unflagged reversal.
    rule_authority: best_practice
    sap_impact: Posting to the general ledger reverses the intended direction.
    fix_map:
      __other__: Check the payroll run; if the result is a reversal it must carry the delta flag.
    record_fix_template: Payroll result for employee {PAYRESULT.USERID} has a negative gross pay. Review the run.
  - id: PAY025
    field: PAYRESULT.TAX_AMOUNT
    check_class: cross_field_check
    fail_when: '`PAYRESULT.TAX_AMOUNT` < 0'
    applies_when:
      PAYRESULT.DELTA_FLAG:
        not_in:
        - X
    severity: medium
    dimension: validity
    message: Payroll result has a negative tax amount
    why_it_matters: The tax amount of a payroll result is a positive quantity; a negative value is a sign error or an unflagged reversal.
    rule_authority: best_practice
    sap_impact: Posting to the general ledger reverses the intended direction.
    fix_map:
      __other__: Check the payroll run; if the result is a reversal it must carry the delta flag.
    record_fix_template: Payroll result for employee {PAYRESULT.USERID} has a negative tax amount. Review the run.
  - id: PAY026
    field: PAYRESULT.DEDUCTIONS
    check_class: cross_field_check
    fail_when: '`PAYRESULT.DEDUCTIONS` < 0'
    applies_when:
      PAYRESULT.DELTA_FLAG:
        not_in:
        - X
    severity: medium
    dimension: validity
    message: Payroll result has a negative deductions
    why_it_matters: The deductions of a payroll result is a positive quantity; a negative value is a sign error or an unflagged reversal.
    rule_authority: best_practice
    sap_impact: Posting to the general ledger reverses the intended direction.
    fix_map:
      __other__: Check the payroll run; if the result is a reversal it must carry the delta flag.
    record_fix_template: Payroll result for employee {PAYRESULT.USERID} has a negative deductions. Review the run.
  - id: PAY027
    field: PAYRESULT.NET_PAY
    check_class: cross_field_check
    fail_when: (`PAYRESULT.GROSS_PAY` - `PAYRESULT.TAX_AMOUNT` - `PAYRESULT.DEDUCTIONS` - `PAYRESULT.NET_PAY`).abs() > 0.01
    require_populated: true
    severity: high
    dimension: consistency
    message: Net pay does not equal gross pay less tax and deductions
    why_it_matters: Net pay must reconcile to gross pay less tax and deductions. A difference above one cent means a component is missing from the extract or the posting.
    rule_authority: best_practice
    sap_impact: The posted payroll cost and the bank transfer disagree.
    fix_map:
      __other__: Reconcile the payroll result components and re-extract the run.
    record_fix_template: Payroll result for employee {PAYRESULT.USERID} does not reconcile. Review the run.
  - id: PAY028
    field: PAYRESULT.COMPANY
    check_class: cross_field_check
    fail_when: '`PAYRESULT.COMPANY` != `EMPEMPLOYMENT.COMPANY`'
    require_populated: true
    severity: high
    dimension: consistency
    message: Payroll result company differs from the employee company
    why_it_matters: The company on the payroll result must be the company of the employee. A difference posts the personnel cost to the wrong legal entity.
    rule_authority: best_practice
    sap_impact: Intercompany differences and wrong legal-entity cost.
    fix_map:
      __other__: Correct the company assignment on the employment or re-run the payroll for the correct company.
    record_fix_template: Payroll result for employee {PAYRESULT.USERID} has a company that differs from the employment. Review.
  - id: PAY029
    field: PAYRESULT.COST_CENTRE
    check_class: cross_field_check
    fail_when: '`PAYRESULT.COST_CENTRE` != `EMPEMPLOYMENT.COST_CENTER`'
    require_populated: true
    severity: low
    dimension: consistency
    message: Payroll result cost centre differs from the employment cost centre
    why_it_matters: The payroll cost centre normally equals the employment cost centre. A difference can be valid (split assignment) but is mostly a stale transfer.
    rule_authority: best_practice
    sap_impact: Personnel cost is posted to a cost centre other than the one the manager owns.
    fix_map:
      __other__: Confirm the assignment with finance.
    record_fix_template: Payroll result for employee {PAYRESULT.USERID} uses a cost centre that differs from the employment. Review.
  - id: PAY030
    field: PAYRESULT.NET_PAY
    check_class: cross_field_check
    fail_when: (`PAYRESULT.NET_PAY` == 0) & (`PAYRESULT.GROSS_PAY` > 0)
    require_populated: true
    severity: medium
    dimension: consistency
    message: Payroll result pays nothing although gross pay is positive
    why_it_matters: Net pay of zero with positive gross pay means deductions consumed everything or the result is incomplete.
    rule_authority: best_practice
    sap_impact: The employee receives no transfer; garnishments and advances may not be recovered correctly.
    fix_map:
      __other__: Review the payroll result for the employee.
    record_fix_template: Payroll result for employee {PAYRESULT.USERID} has zero net pay with positive gross pay. Review the run.
  - id: PAY031
    field: PAYRESULT.TAX_AMOUNT
    check_class: cross_field_check
    fail_when: '`PAYRESULT.TAX_AMOUNT` > `PAYRESULT.GROSS_PAY`'
    require_populated: true
    severity: high
    dimension: accuracy
    message: Tax exceeds gross pay
    why_it_matters: Income tax is a share of gross pay. Tax above gross means the amounts were swapped or tax was loaded in another currency.
    rule_authority: best_practice
    sap_impact: Year-end tax certificates and reconciliation are wrong.
    fix_map:
      __other__: Check the payroll result amounts at source.
    record_fix_template: 'Payroll result for employee {PAYRESULT.USERID} period {PAYRESULT.PAY_PERIOD}: tax exceeds gross pay. Check the source result.'
  - id: PAY032
    field: PAYRESULT.DEDUCTIONS
    check_class: cross_field_check
    fail_when: '`PAYRESULT.DEDUCTIONS` > `PAYRESULT.GROSS_PAY`'
    require_populated: true
    severity: high
    dimension: accuracy
    message: Deductions exceed gross pay
    why_it_matters: Deductions above gross mean negative net pay or a mis-mapped amount.
    rule_authority: best_practice
    sap_impact: Statutory minimum net pay rules are breached; recoveries are misstated.
    fix_map:
      __other__: Check the payroll result amounts at source.
    record_fix_template: 'Payroll result for employee {PAYRESULT.USERID} period {PAYRESULT.PAY_PERIOD}: deductions exceed gross pay. Check the source result.'
  - id: PAY033
    field: PAYRESULT.PAY_DATE
    check_class: cross_field_check
    fail_when: (`PAYRESULT.PAY_DATE` - @today).dt.days > 365
    require_populated: true
    severity: medium
    dimension: validity
    message: Payroll result pay date is more than a year in the future
    why_it_matters: Payroll results are produced for current or past periods. A pay date over a year ahead is a wrong year.
    rule_authority: best_practice
    sap_impact: Results appear in the wrong tax year.
    fix_map:
      __other__: Correct the pay date at source.
    record_fix_template: 'Payroll result for employee {PAYRESULT.USERID} period {PAYRESULT.PAY_PERIOD}: pay date {PAYRESULT.PAY_DATE} is more than a year ahead. Check the source.'
  - id: PAY034
    field: PAYRESULT.USERID
    check_class: exists_check
    target_table: EMPEMPLOYMENT
    target_fields:
    - USERID
    severity: high
    dimension: consistency
    message: Payroll result belongs to a user without employment
    why_it_matters: Every payroll result must belong to an employment. Orphans come from purged or re-keyed users.
    rule_authority: best_practice
    sap_impact: Cost and tax history cannot be linked to an employee.
    fix_map:
      __other__: Link the result to the correct user.
    record_fix_template: 'Payroll result for employee {PAYRESULT.USERID} period {PAYRESULT.PAY_PERIOD}: user has no employment record. Review.'
  - id: PAY035
    field: PAYMENTINFO.PAYMENT_METHOD
    check_class: null_check
    severity: high
    dimension: completeness
    message: Payment information has no payment method
    why_it_matters: The payment method (bank transfer, cheque, cash) drives infotype 0009 ZLSCH and the payment run.
    rule_authority: best_practice
    sap_impact: The employee is excluded from the DME file.
    fix_map:
      __blank__: Maintain the payment method.
      __other__: Maintain the payment method.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment information has no payment method. Maintain it.'
  - id: PAY036
    field: PAYMENTINFO.CURRENCY
    check_class: null_check
    severity: high
    dimension: completeness
    message: Payment information has no currency
    why_it_matters: The payment currency is infotype 0009 WAERS. Without it a fixed amount cannot be paid.
    rule_authority: best_practice
    sap_impact: The bank transfer is rejected.
    fix_map:
      __blank__: Maintain the payment currency.
      __other__: Maintain the payment currency.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment information has no currency. Maintain it.'
  - id: PAY037
    field: PAYMENTINFO.BANK_COUNTRY
    check_class: null_check
    applies_when:
      PAYMENTINFO.ACCOUNT_NUMBER:
        populated: true
    severity: high
    dimension: completeness
    message: Bank account has no bank country
    why_it_matters: The bank country is the first key of the bank in BNKA and decides the account format checks.
    rule_authority: best_practice
    sap_impact: Infotype 0009 BANKS is blank and the record is rejected.
    fix_map:
      __blank__: Maintain the bank country.
      __other__: Maintain the bank country.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: bank account has no bank country. Maintain it.'
  - id: PAY038
    field: PAYMENTINFO.BANK
    check_class: null_check
    applies_when:
      PAYMENTINFO.ACCOUNT_NUMBER:
        populated: true
    severity: high
    dimension: completeness
    message: Bank account has no bank
    why_it_matters: The bank key identifies the branch. An account number without a bank cannot be paid.
    rule_authority: best_practice
    sap_impact: Infotype 0009 BANKL is blank and the transfer fails.
    fix_map:
      __blank__: Maintain the bank.
      __other__: Maintain the bank.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: bank account has no bank. Maintain it.'
  - id: PAY039
    field: PAYMENTINFO.ACCOUNT_NUMBER
    check_class: cross_field_check
    fail_when: '`PAYMENTINFO.BANK`.notna() & `PAYMENTINFO.ACCOUNT_NUMBER`.isna() & `PAYMENTINFO.IBAN`.isna()'
    severity: high
    dimension: completeness
    message: Bank given but no account number or IBAN
    why_it_matters: A bank without an account number or IBAN cannot receive a transfer.
    rule_authority: best_practice
    sap_impact: The employee is not paid by transfer.
    fix_map:
      __other__: Maintain the account number or IBAN.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment information has a bank but no account. Maintain it.'
  - id: PAY040
    field: PAYMENTINFO.PERCENT
    check_class: cross_field_check
    fail_when: (`PAYMENTINFO.PERCENT` < 0) | (`PAYMENTINFO.PERCENT` > 100)
    require_populated: true
    severity: high
    dimension: validity
    message: Payment split percentage is outside 0 to 100
    why_it_matters: A payment split percentage is a share of net pay and must lie between 0 and 100.
    rule_authority: best_practice
    sap_impact: The payment run pays more or less than net pay.
    fix_map:
      __other__: Correct the percentage.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment split percentage is outside 0-100. Correct it.'
  - id: PAY041
    field: PAYMENTINFO.AMOUNT
    check_class: cross_field_check
    fail_when: '`PAYMENTINFO.AMOUNT` < 0'
    require_populated: true
    severity: high
    dimension: validity
    message: Payment split amount is negative
    why_it_matters: A fixed payment amount is paid to the account. A negative amount cannot be transferred.
    rule_authority: best_practice
    sap_impact: The payment run fails for the employee.
    fix_map:
      __other__: Correct the amount.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment split amount is negative. Correct it.'
  - id: PAY042
    field: PAYMENTINFO.AMOUNT
    check_class: cross_field_check
    fail_when: '`PAYMENTINFO.AMOUNT`.notna() & `PAYMENTINFO.PERCENT`.notna() & (`PAYMENTINFO.AMOUNT` != 0) & (`PAYMENTINFO.PERCENT` != 0)'
    severity: medium
    dimension: consistency
    message: Payment split has both an amount and a percentage
    why_it_matters: A split is either a fixed amount or a percentage. Both together make the split ambiguous.
    rule_authority: best_practice
    sap_impact: Infotype 0009 takes BETRG or ANZHL depending on mapping; the result is unpredictable.
    fix_map:
      __other__: Keep either the amount or the percentage.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment split has both an amount and a percentage. Keep one.'
  - id: PAY043
    field: PAYMENTINFO.BIC
    check_class: regex_check
    pattern: ^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$
    severity: medium
    dimension: validity
    message: BIC/SWIFT code is not 8 or 11 characters in the ISO 9362 format
    why_it_matters: The BIC identifies the bank for cross-border and SEPA transfers. A wrong format is rejected by the bank.
    rule_authority: best_practice
    sap_impact: Infotype 0009 SWIFT fails the format check; payments are returned.
    fix_map:
      __other__: Correct the BIC.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: BIC has an invalid format. Correct it.'
    auto_fix:
      steps:
      - op: regex_replace
        pattern: \s+
        repl: ''
      - op: upper
      confidence: high
  - id: PAY044
    field: PAYMENTINFO.IBAN
    check_class: regex_check
    pattern: ^[A-Z]{2}\d{2}[A-Z0-9]{11,30}$
    severity: high
    dimension: validity
    message: IBAN does not follow the ISO 13616 structure
    why_it_matters: An IBAN is two letters, two check digits and up to 30 alphanumeric characters, stored without spaces.
    rule_authority: best_practice
    sap_impact: The bank rejects the transfer and the employee is not paid.
    fix_map:
      __other__: Correct the IBAN; store it without spaces.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: IBAN has an invalid structure. Correct it.'
    auto_fix:
      steps:
      - op: regex_replace
        pattern: \s+
        repl: ''
      - op: upper
      confidence: high
  - id: PAY045
    field: PAYMENTINFO.CURRENCY
    check_class: regex_check
    pattern: ^[A-Z]{3}$
    severity: medium
    dimension: validity
    message: Payment currency is not a 3-letter ISO 4217 code
    why_it_matters: The currency is replicated to infotype 0009 WAERS, checked against TCURC.
    rule_authority: best_practice
    sap_impact: The payment information is rejected.
    fix_map:
      __other__: Use the uppercase ISO code.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment currency ''{actual_value}'' is not an ISO code. Correct it.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: high
  - id: PAY046
    field: PAYMENTINFO.BANK_COUNTRY
    check_class: regex_check
    pattern: ^[A-Z]{2}$
    severity: medium
    dimension: validity
    message: Bank country is not a 2-letter ISO 3166 code
    why_it_matters: Bank country is BNKA BANKS, a 2-letter ISO code.
    rule_authority: best_practice
    sap_impact: The bank lookup fails and infotype 0009 is rejected.
    fix_map:
      __other__: Use the uppercase ISO country code.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: bank country ''{actual_value}'' is not an ISO code. Correct it.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: high
  - id: PAY047
    field: PAYMENTINFO.BANK_COUNTRY
    check_class: exists_check
    target_table: T005
    target_fields:
    - LAND1
    applies_when:
      PAYMENTINFO.BANK_COUNTRY:
        populated: true
    severity: medium
    dimension: consistency
    message: Bank country does not exist in the country table
    why_it_matters: The bank country must exist in T005 for the bank and account checks to run.
    rule_authority: best_practice
    sap_impact: Infotype 0009 is rejected.
    fix_map:
      __other__: Use a country code that exists in T005.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: bank country {PAYMENTINFO.BANK_COUNTRY} is not in T005. Correct it.'
  - id: PAY048
    field: PAYMENTINFO.IBAN
    check_class: cross_field_check
    fail_when: '`PAYMENTINFO.IBAN`.str.slice(0, 2) != `PAYMENTINFO.BANK_COUNTRY`'
    require_populated: true
    severity: high
    dimension: consistency
    message: IBAN country prefix differs from the bank country
    why_it_matters: The first two characters of an IBAN are the country of the account. They must equal the bank country.
    rule_authority: best_practice
    sap_impact: The bank lookup uses the wrong country and the transfer is rejected.
    fix_map:
      __other__: Correct the IBAN or the bank country.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: IBAN country prefix differs from bank country {PAYMENTINFO.BANK_COUNTRY}. Correct one.'
  - id: PAY049
    field: PAYMENTINFO.PAY_TYPE
    check_class: null_check
    severity: medium
    dimension: completeness
    message: Payment information line has no pay type
    why_it_matters: The pay type separates the main salary account from expense or bonus accounts. Without it the line cannot be mapped to an infotype 0009 subtype (main bank, other bank, travel expenses).
    rule_authority: best_practice
    sap_impact: Infotype 0009 subtype cannot be derived, so the bank line is not replicated.
    fix_map:
      __blank__: Maintain the pay type on the payment information line.
      __other__: Maintain the pay type on the payment information line.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment information line effective {PAYMENTINFO.EFFECTIVE_DATE} has no pay type. Maintain it.'
  - id: PAY050
    field: PAYMENTINFO.CURRENCY
    check_class: cross_field_check
    fail_when: '`PAYMENTINFO.CURRENCY` != `FOCOMPANY.CURRENCY`'
    require_populated: true
    severity: low
    dimension: consistency
    message: Payment currency differs from the company currency
    why_it_matters: Net pay is normally paid in the company currency. A foreign-currency payment needs a conversion and is often a copy error.
    rule_authority: best_practice
    sap_impact: The payment run converts net pay or rejects the record.
    fix_map:
      __other__: Confirm the payment currency.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment currency {PAYMENTINFO.CURRENCY} differs from company currency {FOCOMPANY.CURRENCY}. Review.'
  - id: PAY051
    field: PAYMENTINFO.EFFECTIVE_DATE
    check_class: cross_field_check
    fail_when: (`PAYMENTINFO.EFFECTIVE_DATE` - `EMPEMPLOYMENT.START_DATE`).dt.days > 31
    require_populated: true
    severity: medium
    dimension: timeliness
    message: Payment information starts more than a month after hire
    why_it_matters: Bank details are captured at hire. If the first record starts more than 31 days after hire, the first salary has no account.
    rule_authority: best_practice
    sap_impact: The first payroll cannot pay by transfer; a manual cheque is needed.
    fix_map:
      __other__: Back-date the payment information to the hire date.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment information starts {PAYMENTINFO.EFFECTIVE_DATE}, more than a month after hire. Review.'
  - id: PAY052
    field: PAYMENTINFO.USERID
    check_class: uniqueness_check
    fields:
    - PAYMENTINFO.USERID
    - PAYMENTINFO.EFFECTIVE_DATE
    - PAYMENTINFO.PAY_TYPE
    - PAYMENTINFO.ACCOUNT_NUMBER
    severity: high
    dimension: uniqueness
    message: Same bank account entered twice for one pay type
    why_it_matters: The same account entered twice on one effective date splits net pay into the same account twice.
    rule_authority: best_practice
    sap_impact: The payment run pays the employee twice or rejects the split.
    fix_map:
      __other__: Delete the duplicate account line.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: the same bank account is entered twice for one pay type. Delete one.'
  - id: PAY053
    field: PAYMENTINFO.USERID
    check_class: exists_check
    target_table: EMPEMPLOYMENT
    target_fields:
    - USERID
    severity: high
    dimension: consistency
    message: Payment information belongs to a user without employment
    why_it_matters: Bank details must belong to an employment. Orphans are usually from deleted users.
    rule_authority: best_practice
    sap_impact: Orphaned bank data is migrated without an owner.
    fix_map:
      __other__: Delete the orphan record.
    record_fix_template: 'Employee {PAYMENTINFO.USERID}: payment information for a user with no employment. Review.'
  - id: HPY031
    field: HRPY_RGDIR.ABKRS
    check_class: exists_check
    target_table: T549A
    target_fields:
    - ABKRS
    applies_when:
      HRPY_RGDIR.ABKRS:
        populated: true
    grain: HRPY_RGDIR
    severity: high
    dimension: consistency
    message: Payroll result payroll area does not exist
    why_it_matters: Every payroll result belongs to a payroll area in T549A. A missing area means the area was deleted after results exist.
    rule_authority: sap_hard_constraint
    sap_impact: Retro accounting and posting cannot read the period control.
    fix_map:
      __other__: Restore the payroll area or correct the configuration.
    record_fix_template: 'Employee {HRPY_RGDIR.PERNR} sequence {HRPY_RGDIR.SEQNR}: payroll area {HRPY_RGDIR.ABKRS} is not in T549A. Review.'
  - id: HPY032
    field: HRPY_RGDIR.FPPER
    check_class: regex_check
    pattern: ^\d{4}(0[1-9]|[1-4]\d|5[0-3])$
    applies_when:
      HRPY_RGDIR.PAYTY:
        blank: true
    grain: HRPY_RGDIR
    severity: high
    dimension: validity
    message: For-period is not in YYYYPP format
    why_it_matters: 'FPPER is the for-period: a 4-digit year and a 2-digit period of up to 53.'
    rule_authority: sap_hard_constraint
    sap_impact: Retro and evaluation reports cannot sort the result.
    fix_map:
      __other__: Investigate the corrupt directory entry.
    record_fix_template: 'Employee {HRPY_RGDIR.PERNR} sequence {HRPY_RGDIR.SEQNR}: for-period {HRPY_RGDIR.FPPER} is not YYYYPP. Investigate.'
  - id: HPY033
    field: HRPY_RGDIR.INPER
    check_class: cross_field_check
    fail_when: '`HRPY_RGDIR.INPER` < `HRPY_RGDIR.FPPER`'
    require_populated: true
    applies_when:
      HRPY_RGDIR.PAYTY:
        blank: true
    grain: HRPY_RGDIR
    severity: high
    dimension: consistency
    message: In-period is earlier than for-period
    why_it_matters: A result is calculated in the in-period for the for-period. Retro runs recalculate older for-periods, so INPER is never earlier than FPPER.
    rule_authority: sap_hard_constraint
    sap_impact: Cluster reads order results wrongly and retro differences are lost.
    fix_map:
      __other__: Investigate the directory entry.
    record_fix_template: 'Employee {HRPY_RGDIR.PERNR} sequence {HRPY_RGDIR.SEQNR}: in-period {HRPY_RGDIR.INPER} is before for-period {HRPY_RGDIR.FPPER}. Investigate.'
  - id: HPY034
    field: HRPY_RGDIR.PAYDT
    check_class: cross_field_check
    fail_when: (`HRPY_RGDIR.FPBEG` - `HRPY_RGDIR.PAYDT`).dt.days > 31
    require_populated: true
    grain: HRPY_RGDIR
    severity: medium
    dimension: consistency
    message: Pay date is more than a month before the period starts
    why_it_matters: Pay date falls in or shortly after the period. More than 31 days before the period begins is a wrong period control.
    rule_authority: best_practice
    sap_impact: Tax is assigned to the wrong tax period.
    fix_map:
      __other__: Check the pay date in the period control (T549S).
    record_fix_template: 'Employee {HRPY_RGDIR.PERNR} sequence {HRPY_RGDIR.SEQNR}: pay date {HRPY_RGDIR.PAYDT} is more than a month before the period. Check T549S.'
  - id: HPY035
    field: HRPY_RGDIR.MOLGA
    check_class: null_check
    grain: HRPY_RGDIR
    severity: medium
    dimension: completeness
    message: Payroll result has no country grouping
    why_it_matters: MOLGA selects the country-specific cluster (RX for ZA, RU for US). Without it the result cannot be read.
    rule_authority: best_practice
    sap_impact: Payroll results cannot be read by country reports and migration.
    fix_map:
      __blank__: Investigate the directory entry.
      __other__: Investigate the directory entry.
    record_fix_template: 'Employee {HRPY_RGDIR.PERNR} sequence {HRPY_RGDIR.SEQNR}: payroll result has no country grouping. Investigate.'
  - id: HPY036
    field: HRPY_RGDIR.VOIDR
    check_class: null_check
    applies_when:
      HRPY_RGDIR.VOID:
      - X
    grain: HRPY_RGDIR
    severity: low
    dimension: completeness
    message: Voided payroll result has no void reason
    why_it_matters: 'A void must carry a reason for audit: why a paid result was cancelled.'
    rule_authority: best_practice
    sap_impact: Audit cannot explain why a paid result was cancelled.
    fix_map:
      __blank__: Maintain the void reason via PUOC.
      __other__: Maintain the void reason via PUOC.
    record_fix_template: 'Employee {HRPY_RGDIR.PERNR} sequence {HRPY_RGDIR.SEQNR}: voided result has no reason. Maintain the void reason.'
  - id: HPY037
    field: HRPY_RGDIR.OOSDATE
    check_class: null_check
    applies_when:
      HRPY_RGDIR.OUTOFSEQ:
      - X
    grain: HRPY_RGDIR
    severity: low
    dimension: completeness
    message: Out-of-sequence result has no out-of-sequence date
    why_it_matters: An out-of-sequence check must carry the date it was issued.
    rule_authority: best_practice
    sap_impact: The out-of-sequence result cannot be reconciled with the bank.
    fix_map:
      __blank__: Investigate the out-of-sequence result.
      __other__: Investigate the out-of-sequence result.
    record_fix_template: 'Employee {HRPY_RGDIR.PERNR} sequence {HRPY_RGDIR.SEQNR}: out-of-sequence result has no date. Investigate.'
  - id: HPY038
    field: PA0008.WAERS
    check_class: exists_check
    target_table: TCURC
    target_fields:
    - WAERS
    applies_when:
      PA0008.WAERS:
        populated: true
    grain: PA0008
    severity: high
    dimension: validity
    message: Basic pay currency does not exist
    why_it_matters: WAERS on infotype 0008 must exist in TCURC.
    rule_authority: sap_hard_constraint
    sap_impact: Payroll cannot valuate the wage types.
    fix_map:
      __other__: Correct the currency in PA30 infotype 0008.
    record_fix_template: 'Employee {PA0008.PERNR}: basic pay currency {PA0008.WAERS} is not in TCURC. Correct it.'
  - id: HPY039
    field: PA0008.TRFGB
    check_class: exists_check
    fields:
    - PA0008.TRFAR
    - PA0008.TRFGB
    target_table: T510F
    target_fields:
    - TRFAR
    - TRFGB
    applies_when:
      PA0008.ENDDA:
      - '99991231'
      PA0008.TRFGB:
        populated: true
    grain: PA0008
    severity: high
    dimension: consistency
    message: Pay scale type and area combination does not exist
    why_it_matters: The pay scale type and area pair must exist in T510F for the pay scale tables to be read.
    rule_authority: sap_hard_constraint
    sap_impact: Indirect valuation and pay scale reclassification fail.
    fix_map:
      __other__: Correct the pay scale type or area in PA30 infotype 0008.
    record_fix_template: 'Employee {PA0008.PERNR}: pay scale type {PA0008.TRFAR} with area {PA0008.TRFGB} is not in T510F. Correct it.'
  - id: HPY040
    field: PA0008.DIVGV
    check_class: cross_field_check
    fail_when: '`PA0008.DIVGV` <= 0'
    require_populated: true
    applies_when:
      PA0008.ENDDA:
      - '99991231'
    grain: PA0008
    severity: high
    dimension: validity
    message: Working hours per payroll period is zero or negative
    why_it_matters: DIVGV divides monthly pay to derive the hourly rate. Zero or negative gives an invalid rate.
    rule_authority: best_practice
    sap_impact: Overtime and unpaid-leave deductions are valued at zero or fail.
    fix_map:
      __other__: Re-derive working hours from infotype 0007 or correct in infotype 0008.
    record_fix_template: 'Employee {PA0008.PERNR}: working hours per period is zero or negative. Correct it.'
  - id: HPY041
    field: PA0008.EIN01
    check_class: cross_field_check
    fail_when: (`PA0008.ANZ01` > 0) & `PA0008.EIN01`.isna()
    grain: PA0008
    severity: medium
    dimension: completeness
    message: First wage type has a number but no unit
    why_it_matters: A number without a unit cannot be valuated.
    rule_authority: best_practice
    sap_impact: Valuation uses the wrong rate.
    fix_map:
      __other__: Maintain the unit in PA30 infotype 0008.
    record_fix_template: 'Employee {PA0008.PERNR}: first wage type has a number but no unit. Maintain it.'
  - id: HPY042
    field: PA0009.ZLSCH
    check_class: exists_check
    fields:
    - PA0009.BANKS
    - PA0009.ZLSCH
    target_table: T042Z
    target_fields:
    - LAND1
    - ZLSCH
    applies_when:
      PA0009.ZLSCH:
        populated: true
    grain: PA0009
    severity: high
    dimension: consistency
    message: Payment method is not valid for the bank country
    why_it_matters: The payment method must be defined for the bank country in T042Z.
    rule_authority: sap_hard_constraint
    sap_impact: The DME run excludes the employee.
    fix_map:
      __other__: Correct the payment method in PA30 infotype 0009.
    record_fix_template: 'Employee {PA0009.PERNR}: payment method {PA0009.ZLSCH} is not defined for the bank country. Correct it.'
  - id: HPY043
    field: PA0009.SWIFT
    check_class: regex_check
    pattern: ^[A-Z]{6}[A-Z0-9]{2}([A-Z0-9]{3})?$
    grain: PA0009
    severity: medium
    dimension: validity
    message: SWIFT/BIC code has an invalid format
    why_it_matters: The SWIFT/BIC is 8 or 11 characters in the ISO 9362 format.
    rule_authority: best_practice
    sap_impact: Cross-border payments are rejected.
    fix_map:
      __other__: Correct the SWIFT code in PA30 infotype 0009.
    record_fix_template: 'Employee {PA0009.PERNR}: SWIFT/BIC has an invalid format. Correct it.'
