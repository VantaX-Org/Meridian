module: cross_system_integration
target_state: ECC_AND_S4HANA
rules:

  - id: XSYS001
    field: XSYS.MATNR
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Material number is mandatory for cross-system material data consistency
    why_it_matters: MATNR is the primary identifier for materials across all integrated SAP systems (ECC, S/4HANA, MDG, Ariba,
      EWM). Without it, cross-system reconciliation cannot identify the material, procurement matching fails, and inventory
      is fragmented across systems.
    rule_authority: sap_hard_constraint
    sap_impact: Cross-system material reconciliation impossible. Procurement matching fails. Inventory fragmented across different
      identifiers.
    fix_map:
      __blank__: 'In ECC: assign material number via MM01/MM02. In S/4HANA: use Fiori app F0842 (Manage Product Master Data).
        Ensure the number format matches across all integrated systems.'
    record_fix_template: 'Cross-system record: MATNR is {actual_value}. Assign a consistent material number via MM02 (ECC) or
      Fiori app F0842 (S/4HANA).'
    applies_when:
      XSYS.OBJECT_TYPE:
      - MATERIAL

  - id: XSYS002
    field: XSYS.MATNR
    check_class: regex_check
    pattern: "^[A-Z0-9\\-_/\\.]{1,40}$"
    severity: high
    dimension: validity
    message: "Material number must conform to S/4HANA extended format for cross-system compatibility"
    why_it_matters: >-
      In S/4HANA, MATNR has been extended to 40 characters. For cross-system consistency,
      all integrated systems must use the same format. Non-conforming values will cause
      lookup failures during integration, goods receipt matching, and inventory reconciliation.
    rule_authority: best_practice
    sap_impact: >-
      Cross-system material lookup fails. Integration middleware rejects non-standard
      formats. Goods receipt matching cannot find the material.
    fix_map:
      __other__: >-
        Material number '{invalid_value}' does not match the expected format. In ECC:
        correct via MM02. In S/4HANA: use Fiori app F0842. Ensure format is consistent
        across all integrated systems.
    record_fix_template: >-
      Cross-system record: MATNR '{actual_value}' has non-standard format. Correct via
      MM02 (ECC) or Fiori app F0842 (S/4HANA).

  - id: XSYS003
    field: XSYS.LIFNR
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Vendor number is mandatory for cross-system procurement data consistency
    why_it_matters: LIFNR identifies the vendor across ECC, S/4HANA, Ariba, and MDG. Without it, purchase orders cannot be matched
      to vendor masters across systems, invoice verification fails, and vendor analytics are fragmented.
    rule_authority: sap_hard_constraint
    sap_impact: Cross-system vendor matching fails. PO-to-invoice matching breaks. Vendor spend analytics fragmented across
      systems.
    fix_map:
      __blank__: 'In ECC: assign vendor number via XK01/XK02. In S/4HANA: use Fiori app F0843 (Display Supplier) or BP transaction
        for business partner.'
    record_fix_template: 'Cross-system record: LIFNR is {actual_value}. Assign a consistent vendor number via XK02 (ECC) or
      BP transaction (S/4HANA).'
    applies_when:
      XSYS.OBJECT_TYPE:
      - VENDOR

  - id: XSYS004
    field: XSYS.KUNNR
    check_class: null_check
    severity: high
    dimension: completeness
    message: Customer number must be consistent across ECC, CRM, and MDG systems
    why_it_matters: KUNNR identifies the customer across integrated systems. Inconsistent or missing customer numbers cause
      order-to-cash process breaks — sales orders cannot match customer masters, credit checks fail, and billing documents reference
      a customer that does not exist in the target system.
    rule_authority: best_practice
    sap_impact: Sales order creation fails customer validation. Credit check references wrong customer. Billing and accounts
      receivable postings mismatch.
    fix_map:
      __blank__: 'In ECC: assign customer number via XD01/XD02. In S/4HANA: use BP transaction (business partner with customer
        role) or Fiori app F0843.'
    record_fix_template: 'Cross-system record: KUNNR is {actual_value}. Assign a consistent customer number via XD02 (ECC) or
      BP (S/4HANA).'
    applies_when:
      XSYS.OBJECT_TYPE:
      - CUSTOMER



  - id: XSYS007
    field: XSYS.WAERS
    check_class: regex_check
    pattern: "^[A-Z]{3}$"
    severity: high
    dimension: validity
    message: "Currency code must be a valid 3-letter ISO 4217 code"
    why_it_matters: >-
      Currency codes must follow the ISO 4217 standard (exactly 3 uppercase letters) across
      all integrated systems. Non-conforming codes cause exchange rate lookup failures,
      incorrect financial postings, and reconciliation breaks between systems.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Exchange rate lookup fails. Financial postings use wrong currency. Cross-system
      reconciliation breaks for affected transactions.
    fix_map:
      __other__: >-
        Currency code '{invalid_value}' is not a valid ISO 4217 format. In ECC: verify
        via OY01. In S/4HANA: use Fiori app F3917 (Manage Currency Codes) or OY01.
    record_fix_template: >-
      Cross-system record: WAERS '{actual_value}' is not valid ISO 4217. Correct via
      OY01 (ECC) or Fiori app F3917 (S/4HANA).



  - id: XSYS010
    field: XSYS.GJAHR
    check_class: regex_check
    pattern: "^[0-9]{4}$"
    severity: high
    dimension: validity
    message: "Fiscal year must be a valid 4-digit year"
    why_it_matters: >-
      GJAHR (fiscal year) must be exactly 4 numeric digits. Non-conforming values cause
      financial posting failures, period determination errors, and cross-system
      reconciliation breaks during year-end close and consolidation.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Financial posting fails for invalid fiscal year. Period determination errors.
      Year-end close and consolidation exclude affected documents.
    fix_map:
      __other__: >-
        Fiscal year '{invalid_value}' is not a valid 4-digit format. In ECC: correct
        the posting document. In S/4HANA: verify via Fiori app F0717 (Display Journal
        Entries).
    record_fix_template: >-
      Cross-system record: GJAHR '{actual_value}' is invalid. Correct the fiscal year
      on the source document.



  - id: XSYS013
    field: XSYS.MATNR
    check_class: uniqueness_check
    fields:
    - XSYS.SOURCE_SYSTEM
    - XSYS.MATNR
    severity: high
    dimension: uniqueness
    message: Duplicate cross-system material records detected — same material appears multiple times
    why_it_matters: Duplicate cross-system records cause incorrect reconciliation between ECC/S4 and satellite systems. Each
      material should have one mapping record per target system.
    rule_authority: best_practice
    sap_impact: Cross-system reconciliation shows false differences. Material sync creates duplicates in target system. Stock
      reports disagree between systems.
    fix_map:
      __blank__: De-duplicate the cross-system mapping extract. Verify the material number mapping table between source and
        target systems.
    applies_when:
      XSYS.OBJECT_TYPE:
      - MATERIAL


