module: cross_system_integration
target_state: ECC_AND_S4HANA
rules:

  - id: XSYS001
    field: XSYS.MATNR
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Material number is mandatory for cross-system material data consistency
    why_it_matters: MATNR is the primary identifier for materials across all integrated SAP systems (ECC, S/4HANA, MDG, Ariba,
      EWM). Without it, cross-system reconciliation cannot identify the material, procurement matching fails, and inventory
      is fragmented across systems.
    rule_authority: sap_hard_constraint
    sap_impact: Cross-system material reconciliation impossible. Procurement matching fails. Inventory fragmented across different
      identifiers.
    fix_map:
      __blank__: 'In ECC: assign material number via MM01/MM02. In S/4HANA: use Fiori app F0842 (Manage Product Master Data).
        Ensure the number format matches across all integrated systems.'
    record_fix_template: 'Cross-system record: MATNR is {actual_value}. Assign a consistent material number via MM02 (ECC) or
      Fiori app F0842 (S/4HANA).'
    applies_when:
      XSYS.OBJECT_TYPE:
      - MATERIAL

  - id: XSYS002
    field: XSYS.MATNR
    check_class: regex_check
    pattern: "^[A-Z0-9\\-_/\\.]{1,40}$"
    severity: high
    dimension: validity
    message: "Material number must conform to S/4HANA extended format for cross-system compatibility"
    why_it_matters: >-
      In S/4HANA, MATNR has been extended to 40 characters. For cross-system consistency,
      all integrated systems must use the same format. Non-conforming values will cause
      lookup failures during integration, goods receipt matching, and inventory reconciliation.
    rule_authority: best_practice
    sap_impact: >-
      Cross-system material lookup fails. Integration middleware rejects non-standard
      formats. Goods receipt matching cannot find the material.
    fix_map:
      __other__: >-
        Material number '{invalid_value}' does not match the expected format. In ECC:
        correct via MM02. In S/4HANA: use Fiori app F0842. Ensure format is consistent
        across all integrated systems.
    record_fix_template: >-
      Cross-system record: MATNR '{actual_value}' has non-standard format. Correct via
      MM02 (ECC) or Fiori app F0842 (S/4HANA).

  - id: XSYS003
    field: XSYS.LIFNR
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Vendor number is mandatory for cross-system procurement data consistency
    why_it_matters: LIFNR identifies the vendor across ECC, S/4HANA, Ariba, and MDG. Without it, purchase orders cannot be matched
      to vendor masters across systems, invoice verification fails, and vendor analytics are fragmented.
    rule_authority: sap_hard_constraint
    sap_impact: Cross-system vendor matching fails. PO-to-invoice matching breaks. Vendor spend analytics fragmented across
      systems.
    fix_map:
      __blank__: 'In ECC: assign vendor number via XK01/XK02. In S/4HANA: use Fiori app F0843 (Display Supplier) or BP transaction
        for business partner.'
    record_fix_template: 'Cross-system record: LIFNR is {actual_value}. Assign a consistent vendor number via XK02 (ECC) or
      BP transaction (S/4HANA).'
    applies_when:
      XSYS.OBJECT_TYPE:
      - VENDOR

  - id: XSYS004
    field: XSYS.KUNNR
    check_class: null_check
    severity: high
    dimension: completeness
    message: Customer number must be consistent across ECC, CRM, and MDG systems
    why_it_matters: KUNNR identifies the customer across integrated systems. Inconsistent or missing customer numbers cause
      order-to-cash process breaks — sales orders cannot match customer masters, credit checks fail, and billing documents reference
      a customer that does not exist in the target system.
    rule_authority: best_practice
    sap_impact: Sales order creation fails customer validation. Credit check references wrong customer. Billing and accounts
      receivable postings mismatch.
    fix_map:
      __blank__: 'In ECC: assign customer number via XD01/XD02. In S/4HANA: use BP transaction (business partner with customer
        role) or Fiori app F0843.'
    record_fix_template: 'Cross-system record: KUNNR is {actual_value}. Assign a consistent customer number via XD02 (ECC) or
      BP (S/4HANA).'
    applies_when:
      XSYS.OBJECT_TYPE:
      - CUSTOMER



  - id: XSYS007
    field: XSYS.WAERS
    check_class: regex_check
    pattern: "^[A-Z]{3}$"
    severity: high
    dimension: validity
    message: "Currency code must be a valid 3-letter ISO 4217 code"
    why_it_matters: >-
      Currency codes must follow the ISO 4217 standard (exactly 3 uppercase letters) across
      all integrated systems. Non-conforming codes cause exchange rate lookup failures,
      incorrect financial postings, and reconciliation breaks between systems.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Exchange rate lookup fails. Financial postings use wrong currency. Cross-system
      reconciliation breaks for affected transactions.
    fix_map:
      __other__: >-
        Currency code '{invalid_value}' is not a valid ISO 4217 format. In ECC: verify
        via OY01. In S/4HANA: use Fiori app F3917 (Manage Currency Codes) or OY01.
    record_fix_template: >-
      Cross-system record: WAERS '{actual_value}' is not valid ISO 4217. Correct via
      OY01 (ECC) or Fiori app F3917 (S/4HANA).



  - id: XSYS010
    field: XSYS.GJAHR
    check_class: regex_check
    pattern: "^[0-9]{4}$"
    severity: high
    dimension: validity
    message: "Fiscal year must be a valid 4-digit year"
    why_it_matters: >-
      GJAHR (fiscal year) must be exactly 4 numeric digits. Non-conforming values cause
      financial posting failures, period determination errors, and cross-system
      reconciliation breaks during year-end close and consolidation.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Financial posting fails for invalid fiscal year. Period determination errors.
      Year-end close and consolidation exclude affected documents.
    fix_map:
      __other__: >-
        Fiscal year '{invalid_value}' is not a valid 4-digit format. In ECC: correct
        the posting document. In S/4HANA: verify via Fiori app F0717 (Display Journal
        Entries).
    record_fix_template: >-
      Cross-system record: GJAHR '{actual_value}' is invalid. Correct the fiscal year
      on the source document.



  - id: XSYS013
    field: XSYS.MATNR
    check_class: uniqueness_check
    fields:
    - XSYS.SOURCE_SYSTEM
    - XSYS.MATNR
    severity: high
    dimension: uniqueness
    message: Duplicate cross-system material records detected — same material appears multiple times
    why_it_matters: Duplicate cross-system records cause incorrect reconciliation between ECC/S4 and satellite systems. Each
      material should have one mapping record per target system.
    rule_authority: best_practice
    sap_impact: Cross-system reconciliation shows false differences. Material sync creates duplicates in target system. Stock
      reports disagree between systems.
    fix_map:
      __blank__: De-duplicate the cross-system mapping extract. Verify the material number mapping table between source and
        target systems.
    applies_when:
      XSYS.OBJECT_TYPE:
      - MATERIAL

  # ── Breadth: accounting document keys, internal key format, duplicate business identifiers ──

  - id: XSYS014
    field: XSYS.BUKRS
    check_class: null_check
    applies_when:
      XSYS.OBJECT_TYPE: ['FI_DOCUMENT']
    severity: critical
    dimension: completeness
    message: Accounting document has no company code
    why_it_matters: An SAP accounting document is identified by company code, document number and fiscal year. Without
      the company code the document cannot be matched to its counterpart in the other system, so the reconciliation
      reports it as missing on both sides.
    rule_authority: sap_hard_constraint
    sap_impact: The document cannot be reconciled across systems; posting gaps go undetected.
    fix_map:
      __blank__: Correct the extract or interface mapping so the company code (BKPF-BUKRS) is carried with every
        accounting document.
    record_fix_template: 'Accounting document {XSYS.OBJECT_KEY} ({XSYS.SOURCE_SYSTEM}): no company code.'

  - id: XSYS015
    field: XSYS.GJAHR
    check_class: null_check
    applies_when:
      XSYS.OBJECT_TYPE: ['FI_DOCUMENT']
    severity: critical
    dimension: completeness
    message: Accounting document has no fiscal year
    why_it_matters: Document numbers restart every fiscal year; without the fiscal year (BKPF-GJAHR) a document number
      is ambiguous and can be matched to the wrong year's document.
    rule_authority: sap_hard_constraint
    sap_impact: Documents are matched to the wrong year or not at all during reconciliation.
    fix_map:
      __blank__: Correct the extract or interface mapping so the fiscal year is carried with every accounting document.
    record_fix_template: 'Accounting document {XSYS.OBJECT_KEY} ({XSYS.SOURCE_SYSTEM}): no fiscal year.'

  - id: XSYS016
    field: XSYS.BELNR
    check_class: null_check
    applies_when:
      XSYS.OBJECT_TYPE: ['FI_DOCUMENT']
    severity: critical
    dimension: completeness
    message: Accounting document has no document number
    why_it_matters: The accounting document number (BKPF-BELNR) is the business identifier both systems share. Without
      it the document cannot be matched or traced back to the ledger.
    rule_authority: sap_hard_constraint
    sap_impact: The document cannot be reconciled or audited across systems.
    fix_map:
      __blank__: Correct the extract or interface mapping so the document number is carried with every accounting
        document.
    record_fix_template: 'Accounting document {XSYS.OBJECT_KEY} ({XSYS.SOURCE_SYSTEM}): no document number.'

  - id: XSYS017
    field: XSYS.BUDAT
    check_class: null_check
    applies_when:
      XSYS.OBJECT_TYPE: ['FI_DOCUMENT']
    severity: high
    dimension: completeness
    message: Accounting document has no posting date
    why_it_matters: The posting date (BKPF-BUDAT) decides the period a document belongs to. SAP never posts without it;
      a document without posting date cannot be placed in a period, so period-level reconciliation between systems
      is impossible.
    rule_authority: sap_hard_constraint
    sap_impact: Period totals cannot be reconciled across systems.
    fix_map:
      __blank__: Correct the extract or interface mapping so the posting date is carried with every accounting document.
    record_fix_template: 'Accounting document {XSYS.OBJECT_KEY} ({XSYS.SOURCE_SYSTEM}): no posting date.'

  - id: XSYS018
    field: XSYS.BLDAT
    check_class: null_check
    applies_when:
      XSYS.OBJECT_TYPE: ['FI_DOCUMENT']
    severity: medium
    dimension: completeness
    message: Accounting document has no document date
    why_it_matters: The document date (BKPF-BLDAT) is mandatory in every SAP posting and is the date of the original
      business document (invoice date). Without it, cash discount, ageing and duplicate-invoice checks across systems
      cannot be performed.
    rule_authority: sap_hard_constraint
    sap_impact: Duplicate invoice detection and ageing comparison across systems fail for this document.
    fix_map:
      __blank__: Correct the extract or interface mapping so the document date is carried with every accounting
        document.
    record_fix_template: 'Accounting document {XSYS.OBJECT_KEY} ({XSYS.SOURCE_SYSTEM}): no document date.'

  - id: XSYS019
    field: XSYS.WAERS
    check_class: null_check
    applies_when:
      XSYS.OBJECT_TYPE: ['FI_DOCUMENT']
    severity: high
    dimension: completeness
    message: Accounting document has no currency
    why_it_matters: Every SAP accounting document carries its document currency (BKPF-WAERS). Amounts compared across
      systems without a currency can match by number while differing in value.
    rule_authority: sap_hard_constraint
    sap_impact: Amount reconciliation across systems is meaningless for this document.
    fix_map:
      __blank__: Correct the extract or interface mapping so the document currency is carried with every accounting
        document.
    record_fix_template: 'Accounting document {XSYS.OBJECT_KEY} ({XSYS.SOURCE_SYSTEM}): no currency.'

  - id: XSYS020
    field: XSYS.LIFNR
    check_class: regex_check
    pattern: '^(\d{10}|[A-Z0-9\-_/\.]*[A-Z\-_/\.][A-Z0-9\-_/\.]*)$'
    severity: medium
    dimension: validity
    message: Vendor number is not in SAP's internal format (numeric numbers must carry leading zeros)
    why_it_matters: SAP stores numeric vendor numbers with leading zeros (ALPHA conversion — '100200' is stored as
      '0000100200') and alphanumeric numbers in upper case. A vendor number in another format never matches the same
      vendor in the other system, so the reconciliation reports a false gap and hides the real one.
    rule_authority: sap_hard_constraint
    sap_impact: Cross-system vendor matching fails; duplicate or missing vendors are reported wrongly.
    fix_map:
      __other__: Apply the ALPHA conversion (CONVERSION_EXIT_ALPHA_INPUT) in the extract or interface mapping.
    record_fix_template: 'Record {XSYS.OBJECT_KEY} ({XSYS.SOURCE_SYSTEM}): vendor ''{actual_value}'' is not in internal
      format.'

  - id: XSYS021
    field: XSYS.KUNNR
    check_class: regex_check
    pattern: '^(\d{10}|[A-Z0-9\-_/\.]*[A-Z\-_/\.][A-Z0-9\-_/\.]*)$'
    severity: medium
    dimension: validity
    message: Customer number is not in SAP's internal format (numeric numbers must carry leading zeros)
    why_it_matters: SAP stores numeric customer numbers with leading zeros (ALPHA conversion — '200300' is stored as
      '0000200300') and alphanumeric numbers in upper case. A customer number in another format never matches the same
      customer in the other system.
    rule_authority: sap_hard_constraint
    sap_impact: Cross-system customer matching fails; duplicate or missing customers are reported wrongly.
    fix_map:
      __other__: Apply the ALPHA conversion (CONVERSION_EXIT_ALPHA_INPUT) in the extract or interface mapping.
    record_fix_template: 'Record {XSYS.OBJECT_KEY} ({XSYS.SOURCE_SYSTEM}): customer ''{actual_value}'' is not in
      internal format.'

  - id: XSYS022
    field: XSYS.PERNR
    check_class: regex_check
    pattern: '^\d{8}$'
    severity: medium
    dimension: validity
    message: Personnel number is not an 8-digit number
    why_it_matters: The SAP personnel number (PERNR) is an 8-digit numeric field stored with leading zeros. Any other
      form cannot be matched to the employee in HCM, payroll or SuccessFactors Employee Central replication.
    rule_authority: sap_hard_constraint
    sap_impact: Employee records cannot be matched across HR, payroll and finance systems.
    fix_map:
      __other__: Map the personnel number as 8 digits with leading zeros in the extract or replication mapping.
    record_fix_template: 'Record {XSYS.OBJECT_KEY} ({XSYS.SOURCE_SYSTEM}): personnel number ''{actual_value}''.'

  - id: XSYS023
    field: XSYS.BELNR
    check_class: uniqueness_check
    fields: [XSYS.SOURCE_SYSTEM, XSYS.BUKRS, XSYS.GJAHR, XSYS.BELNR]
    applies_when:
      XSYS.OBJECT_TYPE: ['FI_DOCUMENT']
    severity: high
    dimension: uniqueness
    message: The same accounting document appears more than once in one system
    why_it_matters: Company code, fiscal year and document number identify exactly one SAP accounting document. The
      same document twice in one system's extract (under different keys) is double-counted in every reconciliation
      total.
    rule_authority: sap_hard_constraint
    sap_impact: Reconciliation totals are overstated; a real missing document can be masked by the duplicate.
    fix_map:
      __other__: Remove the duplicate from the interface or extract; check the object key mapping for the document.
    record_fix_template: 'Accounting document {XSYS.BUKRS}/{XSYS.BELNR}/{XSYS.GJAHR} appears more than once in
      {XSYS.SOURCE_SYSTEM}.'

  - id: XSYS024
    field: XSYS.LIFNR
    check_class: uniqueness_check
    fields: [XSYS.SOURCE_SYSTEM, XSYS.LIFNR, XSYS.BUKRS]
    applies_when:
      XSYS.OBJECT_TYPE: ['VENDOR']
    severity: high
    dimension: uniqueness
    message: The same vendor and company code appear more than once in one system
    why_it_matters: A vendor's company-code data exists once per company code. The same vendor and company code twice
      in one system's extract means the extract or a key mapping duplicates it, so vendor counts and comparisons
      across systems are wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Cross-system vendor reconciliation double-counts the vendor; mismatches are hidden.
    fix_map:
      __other__: Remove the duplicate from the extract; check the object key mapping for the vendor.
    record_fix_template: 'Vendor {XSYS.LIFNR} / company code {XSYS.BUKRS} appears more than once in {XSYS.SOURCE_SYSTEM}.'

  - id: XSYS025
    field: XSYS.KUNNR
    check_class: uniqueness_check
    fields: [XSYS.SOURCE_SYSTEM, XSYS.KUNNR, XSYS.BUKRS]
    applies_when:
      XSYS.OBJECT_TYPE: ['CUSTOMER']
    severity: high
    dimension: uniqueness
    message: The same customer and company code appear more than once in one system
    why_it_matters: A customer's company-code data exists once per company code. The same customer and company code
      twice in one system's extract means the extract or a key mapping duplicates it, so customer comparisons across
      systems are wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Cross-system customer reconciliation double-counts the customer; mismatches are hidden.
    fix_map:
      __other__: Remove the duplicate from the extract; check the object key mapping for the customer.
    record_fix_template: 'Customer {XSYS.KUNNR} / company code {XSYS.BUKRS} appears more than once in
      {XSYS.SOURCE_SYSTEM}.'

  - id: XSYS026
    field: XSYS.OBJECT_KEY
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Cross-system record has no object key
    why_it_matters: The object key (XSYS.OBJECT_KEY) identifies the record in the system it was read from. Without it
      the record cannot be matched to its counterpart in another system or traced back to the source.
    rule_authority: sap_hard_constraint
    sap_impact: Reconciliation between systems cannot match the record; duplicates and gaps go undetected.
    fix_map:
      __blank__: Fix the extraction mapping so the source key is read for this object type.
    record_fix_template: '{XSYS.OBJECT_TYPE} from {XSYS.SOURCE_SYSTEM}: object key is blank.'

  - id: XSYS027
    field: XSYS.SOURCE_SYSTEM
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Cross-system record has no source system
    why_it_matters: The source system (XSYS.SOURCE_SYSTEM) tells which system the record came from. Keys such as
      material or vendor numbers are only unique within one system, so a record without a source cannot be compared.
    rule_authority: sap_hard_constraint
    sap_impact: Records from different systems are mixed; key comparisons give false matches.
    fix_map:
      __blank__: Fix the extraction so every record carries the system id it was read from.
    record_fix_template: '{XSYS.OBJECT_TYPE} {XSYS.OBJECT_KEY}: source system is blank.'
