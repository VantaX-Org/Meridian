module: mdg_master_data
target_state: ECC_AND_S4HANA
rules:

  - id: MDG001
    field: USMD120C.USMD_CREQUEST
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Change request ID is the primary key — mandatory for all MDG change requests"
    why_it_matters: >-
      CREQU_ID uniquely identifies the master data change request. Without it, the change
      request cannot be tracked through the governance workflow, linked to approvals,
      or referenced in audit reports. In S/4HANA, MDG change requests are managed via
      Fiori apps (e.g. F2596 for material, F2598 for business partner).
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Change request has no identity. Cannot be tracked in governance workflow. Audit
      trail broken.
    fix_map:
      __blank__: >-
        In ECC: CREQU_ID is system-assigned during change request creation via USMD_CREQU.
        A blank value indicates data corruption. In S/4HANA: verify via Fiori app F2596
        or MDG change request monitor.
    record_fix_template: >-
      Change request: CREQU_ID is {actual_value}. This is system-assigned — investigate
      the data source for corruption.

  - id: MDG002
    field: USMD1213.USMD_ENTITY
    check_class: referential_check
    severity: critical
    dimension: accuracy
    message: Change-request entity type must exist in the MDG data model
    valid_values_with_labels: {MM: Material — material master data governance, BP: Business Partner — customer/vendor/partner
        governance, FI: 'Financial — chart of accounts, cost elements governance', 0G: 'Organisational — org units,
        company codes governance'}
    why_it_matters: ENTITY_TYPE identifies whether the change request governs a material, business partner, financial
      object, or organisational unit. Without a valid type, the MDG workflow engine cannot route the request to the
      correct governance process, approval chain, or data model. The change request is effectively unprocessable.
    rule_authority: sap_hard_constraint
    sap_impact: Change request cannot be routed. Governance workflow cannot start. Master data change is blocked.
    fix_map: {__other__: 'Entity type ''{invalid_value}'' is not a valid MDG object type. Valid values: MM (material),
        BP (business partner), FI (financial), 0G (organisational). In ECC: correct via MDG change request maintenance.
        In S/4HANA: use the relevant Fiori MDG app.'}
    record_fix_template: 'Change request {USMD120C.USMD_CREQUEST}: ENTITY_TYPE is ''{actual_value}''. Set to a valid
      type (MM/BP/FI/0G) via MDG change request maintenance.'
    reference_values: []

  - id: MDG003
    field: USMD1213.USMD_VALUE
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Entity ID is mandatory — identifies which master data record is being changed"
    why_it_matters: >-
      ENTITY_ID identifies the specific master data record (e.g. the business partner number,
      material number) that the change request governs. Without it, the change request
      cannot be linked to a master data record and the change cannot be applied.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Change request has no target record. Cannot be activated or applied. Governance
      process has no subject.
    fix_map:
      __blank__: >-
        In ECC: assign entity ID via MDG change request maintenance. In S/4HANA: use
        Fiori app F2596 (material) or F2598 (business partner).
    record_fix_template: >-
      Change request {USMD120C.USMD_CREQUEST}: ENTITY_ID is {actual_value}. Assign the
      correct master data record identifier.

  - id: MDG004
    field: USMD120C.USMD_CREQ_STATUS
    check_class: referential_check
    severity: high
    dimension: accuracy
    message: Change-request status must exist in the MDG status configuration (USMD130C)
    valid_values_with_labels: {'01': New — change request created but not yet submitted, '02': Submitted — sent for
        review/approval, '03': Approved — change request approved and ready for activation, '04': Activated — master
        data change has been applied, '05': Rejected — change request rejected by approver}
    why_it_matters: The status field controls which actions are available on the change request and determines whether
      the master data change can be activated. An invalid status means the governance workflow is in an undefined
      state — approved changes may not activate, and rejected changes may appear as pending.
    rule_authority: sap_hard_constraint
    sap_impact: Governance workflow in undefined state. Approved changes may not activate. MDG cockpit displays unreliable.
      Process metrics inaccurate.
    fix_map: {__other__: 'Status ''{invalid_value}'' is not a valid MDG workflow state. Valid values: 01 (new), 02
        (submitted), 03 (approved), 04 (activated), 05 (rejected). In ECC: correct via MDG change request maintenance.
        In S/4HANA: use the Fiori MDG apps.'}
    record_fix_template: 'Change request {USMD120C.USMD_CREQUEST}: STATUS is ''{actual_value}''. Set to a valid state
      (01-05) via MDG change request maintenance.'
    reference_values: []

  - id: MDG005
    field: USMD120C.USMD_CREATED_BY
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Creator is required for audit trail and accountability"
    why_it_matters: >-
      CREATED_BY records who initiated the master data change request. Without it, the
      audit trail is broken — compliance teams cannot trace who requested the change,
      and the governance process loses accountability. This is especially critical for
      SOX-relevant master data changes.
    rule_authority: best_practice
    sap_impact: >-
      Audit trail incomplete. Cannot trace change request originator. SOX compliance
      finding for unattributed master data changes.
    fix_map:
      __blank__: >-
        In ECC: check the change request creation log for the original user. In S/4HANA:
        verify via the Fiori MDG app or the change request workflow log.
    record_fix_template: >-
      Change request {USMD120C.USMD_CREQUEST}: CREATED_BY is {actual_value}. Assign
      the correct creator from the creation log.

  - id: MDG006
    field: USMD120C.USMD_CREATED_AT
    check_class: null_check
    severity: medium
    dimension: completeness
    message: "Creation date is required for governance timeline tracking"
    why_it_matters: >-
      CREATED_DATE records when the change request was created. It is essential for
      measuring governance KPIs such as change request cycle time (creation to activation),
      identifying stale requests that may need follow-up, and audit timeline compliance.
    rule_authority: best_practice
    sap_impact: >-
      Change request cycle time cannot be calculated. Stale request identification
      impossible. Governance KPI reporting incomplete.
    fix_map:
      __blank__: >-
        In ECC: creation date is system-populated. If blank, check the data source. In
        S/4HANA: verify via the Fiori MDG app workflow log.
    record_fix_template: >-
      Change request {USMD120C.USMD_CREQUEST}: CREATED_DATE is {actual_value}. This is
      system-generated — investigate the data source.

  - id: MDG007
    field: USMD120C.USMD_RELEASED_BY
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Release user missing on change request
    why_it_matters: An approved change request without an approver means the governance process was bypassed. The audit trail
      is incomplete and the change cannot be traced back to an authorised person. This is a critical SOX finding.
    rule_authority: sap_hard_constraint
    sap_impact: Governance bypass. Change cannot be traced to an authorised approver. SOX critical finding. Master data change
      may need to be reversed and re-approved.
    fix_map:
      __blank__: 'In ECC: check the workflow log for the approving user. If none, re-submit for approval. In S/4HANA: verify
        via the Fiori MDG app workflow history.'
    record_fix_template: 'Change request {USMD120C.USMD_CREQUEST}: APPROVER is {actual_value}. Critical governance gap — identify
      from workflow logs or re-submit for approval.'
    applies_when:
      USMD120C.USMD_DATA_ACTIVE:
      - X

  - id: MDG008
    field: USMD120C.USMD_RELEASED_AT
    check_class: null_check
    severity: high
    dimension: completeness
    message: Release timestamp missing on change request
    why_it_matters: APPROVAL_DATE records when the change request was approved. For approved CRs, this is essential for the
      audit trail — it proves the change went through the governance process and when the approval was granted. Missing dates
      on approved CRs indicate a governance gap.
    rule_authority: best_practice
    sap_impact: Audit trail incomplete for approved changes. Cannot determine approval timeline. SOX compliance finding for
      undated approvals.
    fix_map:
      __blank__: 'In ECC: check the workflow log for the approval timestamp. In S/4HANA: verify via the Fiori MDG app workflow
        history.'
    record_fix_template: 'Change request {USMD120C.USMD_CREQUEST}: APPROVAL_DATE is {actual_value}. Set from the workflow approval
      log.'
    applies_when:
      USMD120C.USMD_DATA_ACTIVE:
      - X

  - id: MDG009
    field: CDPOS.FNAME
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Change document item has no field name
    why_it_matters: FIELD_NAME identifies which specific master data attribute is being created or changed in the
      change request. Without it, the change request records that something changed but not what — making the audit
      trail meaningless and preventing data stewards from reviewing the actual change.
    rule_authority: sap_hard_constraint
    sap_impact: Change audit trail is meaningless — no record of what was changed. Data steward review impossible.
      Compliance reporting has gaps.
    fix_map: {__blank__: 'In ECC: identify the field from the change request context and update via MDG maintenance.
        In S/4HANA: use the Fiori MDG app.'}
    record_fix_template: 'Change request value record: FIELD_NAME is {actual_value}. Identify and assign the correct
      field name via MDG maintenance.'



  - id: MDG012
    field: USMD1213.USMD_ENTITY
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Change-request object has no entity type
    why_it_matters: Without ENTITY_TYPE, the MDG system cannot determine which data model, governance workflow, or
      approval chain applies to the change request. Different entity types (material, business partner, financial)
      have completely different governance processes and data validation rules.
    rule_authority: sap_hard_constraint
    sap_impact: Change request cannot be routed to governance workflow. Data model unknown. Validation rules cannot
      be applied. Change request is unprocessable.
    fix_map: {__blank__: 'In ECC: assign entity type via MDG change request maintenance (USMD_MAINTAIN). In S/4HANA:
        use the relevant Fiori MDG app.'}
    record_fix_template: 'Change request {USMD120C.USMD_CREQUEST}: ENTITY_TYPE is {actual_value}. Set the correct
      type via MDG change request maintenance.'

  - id: MDG013
    field: USMD120C.USMD_CREQUEST
    check_class: regex_check
    pattern: "^[A-Z0-9]{1,20}$"
    severity: medium
    dimension: validity
    message: "Change request ID should follow alphanumeric format for system compatibility"
    why_it_matters: >-
      MDG change request IDs should be alphanumeric and within 20 characters. Non-standard
      formats may cause issues with MDG workflow processing, reporting queries, and
      integration with external governance tools.
    rule_authority: best_practice
    sap_impact: >-
      MDG workflow may not process non-standard IDs. Reporting queries may miss
      this record. Integration with external tools may fail.
    fix_map:
      __other__: >-
        Change request ID '{invalid_value}' does not match the expected format. In ECC:
        check the number range configuration for MDG change requests. In S/4HANA: verify
        the MDG number range settings.
    record_fix_template: >-
      Change request: CREQU_ID '{actual_value}' has non-standard format. Check the
      MDG number range configuration.

  - id: MDG014
    field: USMD120C.USMD_CREATED_BY
    check_class: regex_check
    pattern: ^[A-Z0-9_\-\.]{1,12}$
    severity: medium
    dimension: validity
    message: Creator user ID must follow SAP user naming convention
    why_it_matters: The CREATED_BY field should contain a valid SAP user ID (max 12 characters, alphanumeric with underscores
      and hyphens). Non-conforming values indicate that the change request may have been created by a batch process or external
      system without proper user mapping.
    rule_authority: best_practice
    sap_impact: Creator cannot be verified in SU01. Audit trail attribution is questionable. Access review cannot validate the
      creator's authorisation.
    fix_map:
      __other__: 'Creator ''{invalid_value}'' does not match SAP user ID format. In ECC: verify via SU01. In S/4HANA: check
        via Fiori app F1603.'
    record_fix_template: 'Change request {USMD120C.USMD_CREQUEST}: CREATED_BY ''{actual_value}'' has non-standard format. Verify
      via SU01 (ECC) or Fiori app F1603 (S/4HANA).'

  - id: MDG015
    field: USMD120C.USMD_RELEASED_BY
    check_class: regex_check
    pattern: ^[A-Z0-9_\-\.]{1,12}$
    severity: medium
    dimension: validity
    message: Approver user ID must follow SAP user naming convention
    why_it_matters: The APPROVER field should contain a valid SAP user ID. Non-conforming values mean the approver cannot be
      verified in the user management system, undermining the governance audit trail.
    rule_authority: best_practice
    sap_impact: Approver cannot be verified in SU01. Governance audit trail questionable. SOX compliance finding if approver
      identity cannot be confirmed.
    fix_map:
      __other__: 'Approver ''{invalid_value}'' does not match SAP user ID format. In ECC: verify via SU01. In S/4HANA: check
        via Fiori app F1603.'
    record_fix_template: 'Change request {USMD120C.USMD_CREQUEST}: APPROVER ''{actual_value}'' has non-standard format. Verify
      via SU01 (ECC) or Fiori app F1603 (S/4HANA).'


  - id: MDG017
    field: USMD120C.USMD_CREATED_AT
    check_class: freshness_check
    max_age_hours: 8760
    severity: low
    dimension: timeliness
    message: MDG change request older than 1 year — long-pending CRs should be reviewed, approved, or rejected
    rule_authority: best_practice
    why_it_matters: Change requests open for 1+ year are stalled governance items that hold master-data updates in limbo and
      clog the MDG workflow.
    sap_impact: Approved master-data changes never activate; the MDG worklist is cluttered with dormant CRs; data stewards lose
      visibility of real backlog.
    fix_map:
      __blank__: 'Review the change request in MDG: confirm whether it is still required, route it to the current approver to
        complete, or withdraw and close it if obsolete.'
    record_fix_template: Change request {field} open {age_days} days. Route to the current approver to complete, or withdraw
      and close if obsolete.
    applies_when:
      USMD120C.USMD_DATA_ACTIVE:
        not_in:
        - X
      USMD120C.USMD_CREQ_STATUS:
        not_in:
        - '05'
        - '06'

  # ── Breadth: change request type, timeline consistency, overdue, change document trail ──

  - id: MDG018
    field: USMD120C.USMD_CREQ_TYPE
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Change request has no change request type
    why_it_matters: The change request type decides the data model, the entity types allowed, the workflow and the
      approval steps (USMD110C). A change request without a type cannot be routed or processed.
    rule_authority: sap_hard_constraint
    sap_impact: The change request cannot be opened or processed in the MDG inbox; its objects stay locked.
    fix_map:
      __blank__: Investigate how the change request was created; withdraw it (USMD_REMOVE_CREQUEST / MDG cleanup) and
        recreate it with the correct type.
    record_fix_template: 'Change request {USMD120C.USMD_CREQUEST}: no change request type.'

  - id: MDG019
    field: USMD120C.USMD_CREQ_TYPE
    check_class: referential_check
    reference_values: []
    reference_table: USMD110C
    reference_field: USMD_CREQ_TYPE
    severity: high
    dimension: consistency
    message: Change request type does not exist in the MDG configuration (USMD110C)
    why_it_matters: Workflow, steps and permitted entity types are read from the change request type's
      configuration. A type that was deleted or never transported leaves the change request unprocessable.
    rule_authority: sap_hard_constraint
    sap_impact: The change request cannot be processed; objects in it remain locked for other change requests.
    fix_map:
      __other__: Change request type '{invalid_value}' is not configured. Transport the type (MDGIMG > General
        Settings > Process Modeling > Change Requests) or withdraw the change request.
    record_fix_template: 'Change request {USMD120C.USMD_CREQUEST}: type ''{actual_value}'' is not in USMD110C.'

  - id: MDG020
    field: USMD120C.USMD_RELEASED_AT
    check_class: cross_field_check
    fail_when: '`USMD120C.USMD_RELEASED_AT` < `USMD120C.USMD_CREATED_AT`'
    require_populated: true
    severity: high
    dimension: consistency
    message: Change request was released before it was created
    why_it_matters: Final approval (USMD_RELEASED_AT) always follows creation (USMD_CREATED_AT). A release before
      creation means the timestamps were loaded or changed wrongly, so governance cycle times and the audit trail of
      who approved what, when, cannot be trusted.
    rule_authority: sap_hard_constraint
    sap_impact: Governance SLA and audit reporting are wrong for this change request.
    fix_map:
      __other__: Investigate the migration or direct update that wrote the timestamps; document the gap for audit.
    record_fix_template: 'Change request {USMD120C.USMD_CREQUEST}: released {USMD120C.USMD_RELEASED_AT} before created
      {USMD120C.USMD_CREATED_AT}.'

  - id: MDG021
    field: USMD120C.USMD_CHANGED_AT
    check_class: cross_field_check
    fail_when: '`USMD120C.USMD_CHANGED_AT` < `USMD120C.USMD_CREATED_AT`'
    require_populated: true
    severity: medium
    dimension: consistency
    message: Change request was last changed before it was created
    why_it_matters: The last-change timestamp of a change request cannot precede its creation. The contradiction
      means the timestamps were loaded wrongly; ageing and cycle-time reports built on them are wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Change request ageing and processing-time reports are wrong.
    fix_map:
      __other__: Investigate the migration or direct update that wrote the timestamps.
    record_fix_template: 'Change request {USMD120C.USMD_CREQUEST}: changed {USMD120C.USMD_CHANGED_AT} before created
      {USMD120C.USMD_CREATED_AT}.'

  - id: MDG022
    field: USMD120C.USMD_DUE_DATE
    check_class: freshness_check
    max_age_hours: 0
    applies_when:
      USMD120C.USMD_DATA_ACTIVE: {not_in: ['X']}
      USMD120C.USMD_CREQ_STATUS: {not_in: ['05', '06']}
    severity: medium
    dimension: timeliness
    message: Open change request is past its due date
    why_it_matters: The due date (USMD_DUE_DATE) is the date the requester needs the master data by — a new
      material for a production start, a supplier for a first order. An open change request past its due date is
      blocking a business process right now.
    rule_authority: best_practice
    sap_impact: The business process waiting for the master data (purchasing, production, sales) is delayed; the
      objects in the change request stay locked.
    fix_map:
      __other__: Escalate the change request to its current processor (MDG inbox / workflow log) and complete or
        withdraw it.
    record_fix_template: 'Change request {USMD120C.USMD_CREQUEST}: due {actual_value}, still open.'

  - id: MDG023
    field: CDHDR.USERNAME
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Change document has no user name
    why_it_matters: The change document header (CDHDR) is the audit evidence of who changed master data. SAP always
      records the user; a change document without one breaks the audit trail required for ITGC and SOX change
      management.
    rule_authority: sap_hard_constraint
    sap_impact: Changes to master data cannot be attributed to a person; audit trail is incomplete.
    fix_map:
      __blank__: Investigate how the change document was written (migration or direct table update) and document the
        gap for audit.
    record_fix_template: 'Change document {CDHDR.OBJECTCLAS}/{CDHDR.OBJECTID}/{CDHDR.CHANGENR}: no user name.'

  - id: MDG024
    field: CDHDR.UDATE
    check_class: null_check
    severity: high
    dimension: completeness
    message: Change document has no change date
    why_it_matters: The change date in the change document header places a master data change in time. Without it,
      period-based change reviews and 'who changed bank details before this payment run' investigations miss the
      change.
    rule_authority: sap_hard_constraint
    sap_impact: The change is missing from date-based change reports (RSSCD100, MDG change analytics).
    fix_map:
      __blank__: Investigate how the change document was written and document the gap for audit.
    record_fix_template: 'Change document {CDHDR.OBJECTCLAS}/{CDHDR.OBJECTID}/{CDHDR.CHANGENR}: no change date.'

  - id: MDG025
    field: CDPOS.CHNGIND
    check_class: domain_value_check
    severity: medium
    dimension: validity
    message: Change document item has an invalid change type
    why_it_matters: The change type of a change document item is a fixed SAP domain (U update, I insert, E/J single
      field delete/insert, D delete). Any other value cannot be interpreted by change reports, so the change is
      shown wrongly or not at all.
    rule_authority: sap_hard_constraint
    sap_impact: Change reports misclassify or drop the change.
    fix_map:
      __other__: Investigate how the change document was written and document the gap for audit.
    record_fix_template: 'Change document {CDPOS.OBJECTCLAS}/{CDPOS.OBJECTID}/{CDPOS.CHANGENR}: change type
      ''{actual_value}'' is not valid.'

  - id: MDG026
    field: USMD120C.USMD_REASON_REJ
    check_class: null_check
    applies_when:
      USMD120C.USMD_CREQ_STATUS: ['06']
    severity: low
    dimension: completeness
    message: Rejected change request has no rejection reason
    why_it_matters: When a change request is rejected (status 06) the reason (USMD120C.USMD_REASON_REJ) tells the
      requester what to fix and gives governance a record of why the change was refused.
    rule_authority: best_practice
    sap_impact: Requesters resubmit the same change; the governance audit trail lacks the decision reason.
    fix_map:
      __blank__: Make the rejection reason mandatory in the change request step configuration (MDGIMG) and record
        reasons for future rejections.
    record_fix_template: 'Change request {USMD120C.USMD_CREQUEST}: rejected without a reason.'
