module: transport_management
target_state: ECC_AND_S4HANA
rules:

  - id: TM001
    field: VTTK.TKNUM
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Shipment number is the primary key — mandatory for all transport documents"
    why_it_matters: >-
      TKNUM is the shipment number and primary key for all transport management documents.
      Without it, the shipment cannot be tracked, costed, or linked to deliveries. The entire
      transport chain depends on this key. In S/4HANA, shipment management is available via
      Fiori app F1331 (Manage Shipments) in addition to classic VT01N/VT02N.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Shipment is untrackable. Freight costs cannot be calculated. Deliveries cannot be
      linked to transport. Carrier communication fails.
    fix_map:
      __blank__: >-
        In ECC: shipment numbers are assigned during creation via VT01N. A blank TKNUM
        indicates data corruption. In S/4HANA: create via Fiori app F1331 or VT01N.
    record_fix_template: >-
      Shipment: TKNUM is {actual_value}. This is system-assigned — investigate the
      data source or create via VT01N (ECC) or Fiori app F1331 (S/4HANA).

  - id: TM002
    field: VTTK.SHTYP
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Shipping type classifies the shipment for planning and cost calculation"
    why_it_matters: >-
      SHTYP provides classification of the shipment beyond the basic type. It influences
      route determination, carrier selection, and freight cost schemas. Without it, transport
      planning accuracy and freight costing are degraded.
    rule_authority: best_practice
    sap_impact: >-
      Route determination less accurate. Freight cost schema may default to generic
      rates. Carrier selection not optimised.
    fix_map:
      __blank__: >-
        In ECC: set shipping type via VT02N. In S/4HANA: update via Fiori app F1331
        or VT02N.
    record_fix_template: >-
      Shipment {VTTK.TKNUM}: SHTYP is {actual_value}. Set the shipping type via VT02N
      (ECC) or Fiori app F1331 (S/4HANA).

  - id: TM003
    field: VTTK.VSART
    check_class: null_check
    severity: medium
    dimension: completeness
    message: Shipping type (mode of transport) should be maintained on the shipment
    why_it_matters: VSART (shipment type) determines the transport mode (road, rail, sea, air), carrier selection rules, and
      freight cost calculation method. Without it, the system cannot determine how goods are transported, which carrier to use,
      or how to calculate freight.
    rule_authority: sap_hard_constraint
    sap_impact: Carrier selection fails. Freight cost calculation impossible. Transport mode undetermined — routing and scheduling
      cannot proceed.
    fix_map:
      __blank__: 'In ECC: set shipment type via VT02N (e.g. 0001 for road, 0002 for rail). In S/4HANA: use Fiori app F1331 or
        VT02N.'
    record_fix_template: 'Shipment {VTTK.TKNUM}: VSART is {actual_value}. Set the correct shipment type via VT02N (ECC) or Fiori
      app F1331 (S/4HANA).'

  - id: TM004
    field: VTTK.TDLNR
    check_class: null_check
    severity: high
    dimension: completeness
    message: Forwarding agent required for carrier integration and freight settlement
    why_it_matters: TDLNR identifies the forwarding agent (carrier/3PL). Without it, the system cannot route the shipment to
      a carrier for execution, cannot calculate carrier-specific freight rates, and freight settlement has no vendor to post
      costs against.
    rule_authority: best_practice
    sap_impact: Carrier assignment missing. Freight settlement cannot post to a vendor. 3PL integration (EDI/API) has no recipient.
      Shipment cannot be tendered.
    fix_map:
      __blank__: 'In ECC: assign forwarding agent via VT02N. The vendor must exist with the forwarding agent account group.
        In S/4HANA: use Fiori app F1331 or VT02N.'
    record_fix_template: 'Shipment {VTTK.TKNUM}: TDLNR is {actual_value}. Assign the forwarding agent vendor via VT02N (ECC)
      or Fiori app F1331 (S/4HANA).'
    applies_when:
      VTTK.STTRG:
        not_in:
        - '0'

  - id: TM005
    field: VTTK.ROUTE
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Route is required for freight cost calculation — missing means no freight charged"
    why_it_matters: >-
      The route determines distance, transit time, and freight cost calculation. Without
      a route, the system cannot calculate freight charges, leading to either zero freight
      cost (a revenue loss for the carrier) or manual freight entry that bypasses all
      automated costing and validation.
    rule_authority: best_practice
    sap_impact: >-
      Freight cost calculation returns zero or fails. Transit time unknown. Delivery
      scheduling cannot account for transport lead time.
    fix_map:
      __blank__: >-
        In ECC: maintain routes via T-code OVTC and assign to the shipment via VT02N.
        In S/4HANA: use Fiori app F1331 or VT02N.
    record_fix_template: >-
      Shipment {VTTK.TKNUM}: ROUTE is {actual_value}. Assign the correct route via
      VT02N (ECC) or Fiori app F1331 (S/4HANA).

  - id: TM006
    field: VTTK.DISTZ
    check_class: null_check
    severity: medium
    dimension: completeness
    message: "Distance required for freight costing and carbon emissions reporting"
    why_it_matters: >-
      DISTZ (distance) is used for distance-based freight cost calculation and for carbon
      emissions reporting. Without it, freight costs may be understated and sustainability
      reporting is incomplete for this shipment.
    rule_authority: best_practice
    sap_impact: >-
      Distance-based freight rates cannot be calculated. Carbon emissions for this
      shipment are unreported. Transport KPI dashboards have incomplete data.
    fix_map:
      __blank__: >-
        In ECC: enter distance via VT02N or configure automatic distance determination
        via OVTC. In S/4HANA: use Fiori app F1331 or VT02N.
    record_fix_template: >-
      Shipment {VTTK.TKNUM}: DISTZ is {actual_value}. Enter the distance via VT02N
      (ECC) or Fiori app F1331 (S/4HANA).

  - id: TM007
    field: VTTK.ERDAT
    check_class: null_check
    severity: medium
    dimension: completeness
    message: "Shipment creation date is required for transport KPI tracking"
    why_it_matters: >-
      ERDAT records when the shipment was created. It is essential for measuring transport
      KPIs such as lead time from shipment creation to goods issue, and for identifying
      aged shipments that may indicate process bottlenecks.
    rule_authority: best_practice
    sap_impact: >-
      Transport lead time KPIs cannot be calculated. Aged shipment reporting incomplete.
      Audit trail missing creation timestamp.
    fix_map:
      __blank__: >-
        In ECC: ERDAT is system-generated during shipment creation (VT01N). A blank
        value indicates data corruption. In S/4HANA: check via Fiori app F1331.
    record_fix_template: >-
      Shipment {VTTK.TKNUM}: ERDAT is {actual_value}. This is system-generated —
      investigate the data source.

  - id: TM008
    field: VTTK.STTRG
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Shipment status is required for transport monitoring and process control"
    why_it_matters: >-
      STTRG (shipment status) tracks the processing state of the transport document. It
      controls which follow-on actions are available (loading, goods issue, completion).
      Without a status, the transport monitoring cockpit cannot display the shipment
      correctly and supervisors lose visibility.
    rule_authority: best_practice
    sap_impact: >-
      Transport monitor displays incomplete. Follow-on actions may not be available.
      Shipment lifecycle tracking broken.
    fix_map:
      __blank__: >-
        In ECC: shipment status is system-maintained via VT02N during lifecycle
        transitions. In S/4HANA: check via Fiori app F1331.
    record_fix_template: >-
      Shipment {VTTK.TKNUM}: STTRG is {actual_value}. This is system-maintained —
      investigate the shipment processing history.

  - id: TM009
    field: VTTK.DPTBG
    check_class: cross_field_check
    severity: critical
    dimension: consistency
    message: Planned start date must be before planned end date
    why_it_matters: A planned start date (DPTBG) after the planned end date (DPTEN) is logically impossible and indicates
      a data entry error. This corrupts transport scheduling, causes negative transit time calculations, and prevents
      the transportation planning system from optimising vehicle and driver allocation.
    rule_authority: sap_hard_constraint
    sap_impact: Transit time calculation produces negative values. Transport scheduling is invalid. Vehicle and driver
      allocation cannot be planned.
    fix_map: {__blank__: 'In ECC: correct the dates via VT02N > Dates tab. In S/4HANA: use Fiori app F1331 > Dates
        section.'}
    record_fix_template: 'Shipment {VTTK.TKNUM}: DPTBG ({actual_value}) is after DPTEN. Correct the dates via VT02N
      (ECC) or Fiori app F1331 (S/4HANA).'
    fail_when: '`VTTK.DPTBG` > `VTTK.DPTEN`'
    require_populated: true

  - id: TM010
    field: VTTP.VBELN
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Delivery number links the shipment to the delivery document — mandatory"
    why_it_matters: >-
      VBELN links the shipment to the outbound delivery. Without it, the shipment has no
      deliveries to transport — it exists as an empty container with no goods movement.
      Proof of delivery, goods issue, and billing all depend on this link.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Shipment has no deliveries. Goods issue cannot post. Proof of delivery not possible.
      Billing for transport services has no reference.
    fix_map:
      __blank__: >-
        In ECC: assign delivery via VT02N > Deliveries tab. In S/4HANA: use Fiori app
        F1331 or VT02N > Deliveries tab.
    record_fix_template: >-
      Shipment {VTTK.TKNUM}: delivery VBELN is {actual_value}. Link the correct
      delivery via VT02N (ECC) or Fiori app F1331 (S/4HANA).

  - id: TM011
    field: VTTP.TPNUM
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Shipment item number provides line-level tracking within the shipment"
    why_it_matters: >-
      TPNUM is the shipment item number that provides line-level granularity within a
      shipment. Without it, individual delivery assignments within the shipment cannot
      be distinguished, making partial loading, split deliveries, and item-level freight
      cost allocation impossible.
    rule_authority: best_practice
    sap_impact: >-
      Individual delivery items within shipment indistinguishable. Partial loading not
      trackable. Item-level freight allocation not possible.
    fix_map:
      __blank__: >-
        In ECC: TPNUM is system-assigned when deliveries are added via VT02N. A blank
        value indicates data corruption. In S/4HANA: check via Fiori app F1331.
    record_fix_template: >-
      Shipment {VTTK.TKNUM}: TPNUM is {actual_value}. This is system-assigned —
      investigate the data source.

  - id: TM012
    field: VTTK.DATBG
    check_class: null_check
    severity: medium
    dimension: completeness
    message: Actual start date tracks when transport actually began
    why_it_matters: DATBG records the actual departure date/time. Comparing this with the planned date gives transport punctuality
      KPIs. Missing actual dates make it impossible to measure on-time departure performance and calculate actual transit times.
    rule_authority: best_practice
    sap_impact: Transport punctuality KPIs unavailable. Actual transit time cannot be calculated. Carrier performance measurement
      incomplete.
    fix_map:
      __blank__: 'In ECC: enter actual departure via VT02N > Dates tab or use the shipment completion transaction. In S/4HANA:
        use Fiori app F1331 > Dates section.'
    record_fix_template: 'Shipment {VTTK.TKNUM}: DATBG is {actual_value}. Enter the actual departure date via VT02N (ECC) or
      Fiori app F1331 (S/4HANA).'
    applies_when:
      VTTK.STTRG:
      - '6'
      - '7'

  - id: TM013
    field: VTTK.DATEN
    check_class: null_check
    severity: medium
    dimension: completeness
    message: Actual end date required for transit time measurement and carrier SLA tracking
    why_it_matters: DATEN records the actual arrival date/time. Together with DATBG, it enables actual transit time calculation
      and carrier SLA compliance measurement. Missing arrival dates break the complete transport lifecycle tracking.
    rule_authority: best_practice
    sap_impact: Actual transit time cannot be calculated. Carrier SLA compliance cannot be measured. Transport completion reporting
      incomplete.
    fix_map:
      __blank__: 'In ECC: enter actual arrival via VT02N > Dates tab. In S/4HANA: use Fiori app F1331 > Dates section.'
    record_fix_template: 'Shipment {VTTK.TKNUM}: DATEN is {actual_value}. Enter the actual arrival date via VT02N (ECC) or Fiori
      app F1331 (S/4HANA).'
    applies_when:
      VTTK.STTRG:
      - '7'

  - id: TM014
    field: TVRO.TRAZTD
    check_class: null_check
    severity: medium
    dimension: completeness
    message: Transit duration missing on the shipment route (TVRO.TRAZTD)
    why_it_matters: TRAZTD (planned transit duration) is used to calculate expected delivery dates from the shipment start date.
      Without it, delivery date promises cannot account for transport time and customers receive inaccurate delivery commitments.
    rule_authority: best_practice
    sap_impact: Delivery date calculation cannot include transport time. Customer delivery promises are inaccurate. Available-to-promise
      (ATP) results unreliable.
    fix_map:
      __blank__: 'In ECC: set transit duration via VT02N or configure via route maintenance (OVTC). In S/4HANA: use Fiori app
        F1331 or route configuration.'
    record_fix_template: 'Shipment {VTTK.TKNUM}: TRAZTD is {actual_value}. Set the transit duration via VT02N (ECC) or Fiori
      app F1331 (S/4HANA).'
    applies_when:
      VTTK.ROUTE:
        populated: true



  - id: TM017
    field: VTTK.ERDAT
    check_class: freshness_check
    max_age_hours: 2190
    severity: medium
    dimension: timeliness
    message: Shipment created 3+ months ago — long-open shipments should be reviewed for completion or cancellation
    rule_authority: best_practice
    why_it_matters: Shipments open 3+ months are usually completed-but-not-closed or abandoned, distorting freight cost accruals
      and on-time-delivery metrics.
    sap_impact: Freight accruals and settlement are overstated or stuck; transportation KPIs are skewed; carrier invoices cannot
      be matched and cleared.
    fix_map:
      __blank__: 'Review the shipment in the TM document: confirm execution status, complete the outstanding events and freight
        settlement, or cancel if the shipment did not occur.'
    record_fix_template: Shipment {field} open {age_days} days. Complete outstanding events and freight settlement, or cancel
      if it did not occur.
    applies_when:
      VTTK.STTRG:
        not_in:
        - '7'

  - id: TM018
    field: VTTK.TDLNR
    check_class: regex_check
    pattern: "^[A-Z0-9]{1,10}$"
    severity: medium
    dimension: accuracy
    message: Forwarding agent number format is invalid — should be alphanumeric vendor number
    why_it_matters: Invalid forwarding agent references cause freight cost settlement failures and carrier assignment errors.
    rule_authority: best_practice
    sap_impact: Freight cost cannot be settled to the carrier. Shipment tracking references are broken. Carrier performance reporting is unreliable.
    fix_map:
      __blank__: "Correct the forwarding agent number via VT02N. Ensure the carrier is maintained as a vendor in LFA1."

  # ── Breadth: organisational data, configuration references, status/date trail, units ──
    record_fix_template: "Shipment {VTTK.TKNUM}: forwarding agent '{actual_value}' is not a valid alphanumeric vendor number. Correct it in VT02N."

  - id: TM019
    field: VTTK.SHTYP
    check_class: referential_check
    reference_values: []
    reference_table: TVTK
    reference_field: SHTYP
    severity: high
    dimension: consistency
    message: Shipment type does not exist in the configuration (TVTK)
    why_it_matters: The shipment type controls number range, leg determination, completion type, shipment cost
      relevance and output. A shipment with an unconfigured type cannot be processed or costed.
    rule_authority: sap_hard_constraint
    sap_impact: The shipment cannot be changed, completed or settled (VT02N, VI01).
    fix_map:
      __other__: Shipment type '{invalid_value}' is not in TVTK. Configure it (SPRO > Logistics Execution >
        Transportation > Shipments > Define Shipment Types) or correct the interface that created the shipment.
    record_fix_template: 'Shipment {VTTK.TKNUM}: shipment type ''{actual_value}'' is not in TVTK.'

  - id: TM020
    field: VTTK.TPLST
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Shipment has no transportation planning point
    why_it_matters: The transportation planning point (VTTK.TPLST) is the organisational unit responsible for the
      shipment and is required when a shipment is created (VT01N). It drives the company code of shipment costs,
      authorisations and every transport worklist (VT11, VT70).
    rule_authority: sap_hard_constraint
    sap_impact: The shipment is invisible in planning worklists; shipment costs cannot be assigned to a company code.
    fix_map:
      __blank__: Investigate how the shipment was created (interface or migration) and recreate it with a
        transportation planning point (VT01N).
    record_fix_template: 'Shipment {VTTK.TKNUM}: transportation planning point is {actual_value}.'

  - id: TM021
    field: VTTK.TPLST
    check_class: referential_check
    reference_values: []
    reference_table: TTDS
    reference_field: TPLST
    severity: high
    dimension: consistency
    message: Transportation planning point does not exist in the configuration (TTDS)
    why_it_matters: The planning point is assigned to a company code (TTDS); shipment cost settlement and
      authorisation checks read it. An unconfigured planning point stops shipment cost processing.
    rule_authority: sap_hard_constraint
    sap_impact: Shipment cost documents cannot be created or settled for this shipment.
    fix_map:
      __other__: Planning point '{invalid_value}' is not in TTDS. Configure it (Enterprise Structure > Logistics
        Execution > Maintain Transportation Planning Point).
    record_fix_template: 'Shipment {VTTK.TKNUM}: planning point ''{actual_value}'' is not in TTDS.'

  - id: TM022
    field: VTTK.VSART
    check_class: referential_check
    reference_values: []
    reference_table: T173
    reference_field: VSART
    severity: medium
    dimension: consistency
    message: Shipping type of the shipment does not exist in the configuration (T173)
    why_it_matters: The shipping type (road, rail, sea, air, parcel) drives shipment cost calculation (pricing
      condition access) and foreign-trade mode of transport. An unconfigured type cannot be priced.
    rule_authority: sap_hard_constraint
    sap_impact: Freight cannot be calculated; Intrastat/customs mode of transport is missing.
    fix_map:
      __other__: Shipping type '{invalid_value}' is not in T173. Correct the shipment (VT02N) or configure the type.
    record_fix_template: 'Shipment {VTTK.TKNUM}: shipping type ''{actual_value}'' is not in T173.'

  - id: TM023
    field: VTTK.DATBG
    check_class: cross_field_check
    fail_when: '`VTTK.DATBG` > `VTTK.DATEN`'
    require_populated: true
    severity: high
    dimension: consistency
    message: Actual shipment start is after the actual shipment end
    why_it_matters: A shipment departs (VTTK.DATBG) before it arrives (VTTK.DATEN). Reversed actual dates give negative
      transit times, wrong carrier on-time performance and wrong time-dependent freight charges.
    rule_authority: sap_hard_constraint
    sap_impact: Carrier performance and transit-time reporting are wrong; time-based freight is mis-calculated.
    fix_map:
      __other__: Correct the actual dates on the shipment's deadlines tab (VT02N) from the carrier's proof of delivery.
    record_fix_template: 'Shipment {VTTK.TKNUM}: started {VTTK.DATBG}, ended {VTTK.DATEN}.'

  - id: TM024
    field: VTTK.DALBG
    check_class: cross_field_check
    fail_when: '`VTTK.DALBG` > `VTTK.DALEN`'
    require_populated: true
    severity: medium
    dimension: consistency
    message: Actual loading start is after the actual loading end
    why_it_matters: Loading starts (VTTK.DALBG) before it ends (VTTK.DALEN). Reversed dates corrupt dock and loading
      performance and the time-dependent waiting/loading charges of the carrier.
    rule_authority: sap_hard_constraint
    sap_impact: Dock scheduling and loading-time KPIs are wrong for this shipment.
    fix_map:
      __other__: Correct the loading dates on the shipment's deadlines tab (VT02N).
    record_fix_template: 'Shipment {VTTK.TKNUM}: loading started {VTTK.DALBG}, ended {VTTK.DALEN}.'

  - id: TM025
    field: VTTK.DPLBG
    check_class: cross_field_check
    fail_when: '`VTTK.DPLBG` > `VTTK.DPLEN`'
    require_populated: true
    severity: medium
    dimension: consistency
    message: Planned loading start is after the planned loading end
    why_it_matters: Planned loading dates schedule docks and warehouse picking waves. A planned start after the
      planned end makes the shipment unschedulable and pushes picking into the wrong wave.
    rule_authority: sap_hard_constraint
    sap_impact: Dock and wave planning for this shipment is wrong.
    fix_map:
      __other__: Correct the planned loading dates (VT02N > Deadlines) or the route/scheduling that proposed them.
    record_fix_template: 'Shipment {VTTK.TKNUM}: planned loading {VTTK.DPLBG} to {VTTK.DPLEN}.'

  - id: TM026
    field: VTTK.DALEN
    check_class: cross_field_check
    fail_when: '`VTTK.DALEN` > `VTTK.DATBG`'
    require_populated: true
    severity: medium
    dimension: consistency
    message: Loading ended after the shipment had already started
    why_it_matters: SAP sets shipment statuses in sequence — loading end before shipment start. A loading end dated
      after departure means one of the dates was entered wrongly, so loading, waiting and transit times are all wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Transit-time and loading-time reporting and time-based freight charges are wrong.
    fix_map:
      __other__: Correct the loading end or shipment start date on the deadlines tab (VT02N).
    record_fix_template: 'Shipment {VTTK.TKNUM}: loading ended {VTTK.DALEN}, shipment started {VTTK.DATBG}.'

  - id: TM027
    field: VTTK.DTDIS
    check_class: null_check
    applies_when:
      VTTK.STDIS: ['X']
    severity: medium
    dimension: completeness
    message: Shipment planning is complete but the planning end date is missing
    why_it_matters: Setting the 'planning' status (VTTK.STDIS) records the date planning was completed (DTDIS). It is
      the start point for transport lead-time measurement and the trigger date for carrier output.
    rule_authority: sap_hard_constraint
    sap_impact: Planning-to-departure lead time cannot be measured for this shipment.
    fix_map:
      __blank__: Enter the planning end date on the shipment's deadlines tab (VT02N).
    record_fix_template: 'Shipment {VTTK.TKNUM}: planning status set without planning end date.'

  - id: TM028
    field: VTTK.DAREG
    check_class: null_check
    applies_when:
      VTTK.STREG: ['X']
    severity: medium
    dimension: completeness
    message: Shipment is checked in but the check-in date is missing
    why_it_matters: The check-in status (VTTK.STREG) records when the vehicle arrived at the plant (DAREG). Waiting
      time and demurrage charges are calculated from it.
    rule_authority: sap_hard_constraint
    sap_impact: Waiting time and demurrage cannot be calculated or disputed with the carrier.
    fix_map:
      __blank__: Enter the actual check-in date on the shipment's deadlines tab (VT02N).
    record_fix_template: 'Shipment {VTTK.TKNUM}: checked in without check-in date.'

  - id: TM029
    field: VTTK.DALBG
    check_class: null_check
    applies_when:
      VTTK.STLBG: ['X']
    severity: medium
    dimension: completeness
    message: Loading has started but the loading start date is missing
    why_it_matters: The loading-start status (VTTK.STLBG) records when loading began (DALBG). Loading times and dock
      utilisation are measured from it.
    rule_authority: sap_hard_constraint
    sap_impact: Loading time and dock utilisation cannot be measured for this shipment.
    fix_map:
      __blank__: Enter the actual loading start date on the shipment's deadlines tab (VT02N).
    record_fix_template: 'Shipment {VTTK.TKNUM}: loading started without loading start date.'

  - id: TM030
    field: VTTK.DALEN
    check_class: null_check
    applies_when:
      VTTK.STLAD: ['X']
    severity: medium
    dimension: completeness
    message: Loading has ended but the loading end date is missing
    why_it_matters: The loading-end status (VTTK.STLAD) records when loading finished (DALEN). Goods issue timing and
      loading performance are measured from it.
    rule_authority: sap_hard_constraint
    sap_impact: Loading time cannot be measured; goods issue timing cannot be verified.
    fix_map:
      __blank__: Enter the actual loading end date on the shipment's deadlines tab (VT02N).
    record_fix_template: 'Shipment {VTTK.TKNUM}: loading ended without loading end date.'

  - id: TM031
    field: VTTK.DTABF
    check_class: null_check
    applies_when:
      VTTK.STABF: ['X']
    severity: medium
    dimension: completeness
    message: Shipment completion is set but the completion date is missing
    why_it_matters: The shipment-completion status (VTTK.STABF) records when shipping documents were completed
      (DTABF). It is the usual trigger for goods issue and for shipment cost document creation.
    rule_authority: sap_hard_constraint
    sap_impact: Shipment cost creation and goods issue timing cannot be traced for this shipment.
    fix_map:
      __blank__: Enter the shipment completion date on the shipment's deadlines tab (VT02N).
    record_fix_template: 'Shipment {VTTK.TKNUM}: completion status set without completion date.'

  - id: TM032
    field: VTTK.MEDST
    check_class: cross_field_check
    fail_when: '(`VTTK.DISTZ` > 0) & `VTTK.MEDST`.isna()'
    severity: medium
    dimension: consistency
    message: Shipment distance is maintained without a unit of measure
    why_it_matters: The distance (VTTK.DISTZ) is a quantity whose unit is VTTK.MEDST (KM, MI). Distance-based freight
      scales and emissions reporting cannot interpret a distance without its unit.
    rule_authority: sap_hard_constraint
    sap_impact: Distance-based shipment costs cannot be calculated; CO2 reporting is wrong.
    fix_map:
      __other__: Maintain the distance unit on the shipment (VT02N) or on the route (TVRO).
    record_fix_template: 'Shipment {VTTK.TKNUM}: distance {VTTK.DISTZ} without unit.'

  - id: TM033
    field: VTTK.MEIZT
    check_class: cross_field_check
    fail_when: '((`VTTK.FAHZT` > 0) | (`VTTK.GESZT` > 0)) & `VTTK.MEIZT`.isna()'
    severity: medium
    dimension: consistency
    message: Shipment travel time is maintained without a unit of measure
    why_it_matters: Travel times (VTTK.FAHZT / GESZT) are quantities whose unit is VTTK.MEIZT (hours, days).
      Scheduling and time-based freight cannot interpret a duration without its unit.
    rule_authority: sap_hard_constraint
    sap_impact: Shipment scheduling and time-based freight charges are wrong.
    fix_map:
      __other__: Maintain the time unit on the shipment (VT02N).
    record_fix_template: 'Shipment {VTTK.TKNUM}: travel time without unit.'

  - id: TM034
    field: VTTK.ABFER
    check_class: domain_value_check
    severity: high
    dimension: validity
    message: Shipment completion type is not a valid SAP value
    why_it_matters: The shipment completion type (loaded/empty, outbound/inbound) is a fixed SAP domain (ABFER, 1-4)
      copied from the shipment type. It decides whether the shipment carries deliveries and how shipment costs are
      determined.
    rule_authority: sap_hard_constraint
    sap_impact: Delivery assignment and shipment cost determination behave unpredictably for this shipment.
    fix_map:
      __other__: Correct the shipment type configuration (TVTK) and recreate the shipment.
    record_fix_template: 'Shipment {VTTK.TKNUM}: completion type ''{actual_value}'' is not valid.'

  - id: TM035
    field: VTTK.TKNUM
    check_class: exists_check
    fields:
    - VTTK.TKNUM
    target_table: VTTP
    target_fields:
    - TKNUM
    applies_when:
      VTTK.STTRG: {not_in: ['0', '1', '2']}
    severity: high
    dimension: consistency
    message: Shipment in loading or later status has no deliveries
    why_it_matters: Once loading has started (VTTK.STTRG 3 or higher) a shipment must carry the deliveries being
      transported (VTTP). A shipment without items has nothing to load, so freight costs and status updates cannot
      be tied to any delivery.
    rule_authority: best_practice
    sap_impact: Shipment cost settlement has no delivery to allocate to; delivery tracking shows no shipment.
    fix_map:
      __other__: Assign the deliveries in VT02N, or reset and delete the empty shipment.
    record_fix_template: 'Shipment {VTTK.TKNUM}: status {VTTK.STTRG} but no deliveries assigned.'

  - id: TM036
    field: VTTP.VBELN
    check_class: exists_check
    fields:
    - VTTP.VBELN
    target_table: LIKP
    target_fields:
    - VBELN
    severity: high
    dimension: consistency
    message: Shipment item points to a delivery that does not exist
    why_it_matters: Each shipment item (VTTP.VBELN) refers to a delivery header (LIKP). A reference to a missing
      delivery is an orphan left after deletion or archiving, and the shipment can no longer be completed or settled.
    rule_authority: sap_hard_constraint
    sap_impact: Shipment completion and cost settlement fail; transport reporting counts a delivery that is gone.
    fix_map:
      __other__: Remove the item from the shipment in VT02N, or recreate the delivery if it was deleted in error.
    record_fix_template: 'Shipment {VTTP.TKNUM} item {VTTP.TPNUM}: delivery {VTTP.VBELN} not found.'

  - id: TM037
    field: VTTK.TDLNR
    check_class: exists_check
    fields:
    - VTTK.TDLNR
    target_table: LFA1
    target_fields:
    - LIFNR
    target_when:
      LOEVM: {blank: true}
    severity: high
    dimension: consistency
    message: Shipment carrier does not exist or is flagged for deletion
    why_it_matters: The forwarding agent (VTTK.TDLNR) is a vendor account. A carrier that does not exist or is flagged
      for deletion centrally (LFA1.LOEVM) cannot receive freight purchase orders or payments.
    rule_authority: sap_hard_constraint
    sap_impact: Shipment cost documents cannot be transferred to purchasing; carrier invoices cannot be matched.
    fix_map:
      __other__: Assign an active carrier in VT02N, or remove the deletion flag on the vendor (XK06) if it is still
        used.
    record_fix_template: 'Shipment {VTTK.TKNUM}: carrier {VTTK.TDLNR} missing or flagged for deletion.'

  - id: TM038
    field: VTTK.ROUTE
    check_class: exists_check
    fields:
    - VTTK.ROUTE
    target_table: TVRO
    target_fields:
    - ROUTE
    applies_when:
      VTTK.ROUTE:
        populated: true
    severity: high
    dimension: consistency
    message: Shipment route does not exist
    why_it_matters: Route determines distance, transit times and the stages of the shipment.
    rule_authority: sap_hard_constraint
    sap_impact: Shipment cost and scheduling fall back to manual values.
    fix_map:
      __other__: Correct the route on the shipment or create the route (OVTC).
    record_fix_template: 'Shipment {VTTK.TKNUM}: route {VTTK.ROUTE} not in TVRO.'

  - id: TM039
    field: VTTK.STLBG
    check_class: cross_field_check
    fail_when: '`VTTK.STLAD`.notna() & `VTTK.STLBG`.isna()'
    severity: low
    dimension: completeness
    message: Loading end set without loading start
    why_it_matters: A completed loading with no start date cannot be measured for dwell time.
    rule_authority: best_practice
    sap_impact: Loading duration reports are wrong.
    fix_map:
      __other__: Enter the loading start date.
    record_fix_template: 'Shipment {VTTK.TKNUM}: loading end {VTTK.STLAD} with no start.'

  - id: TM040
    field: VTTK.STTBG
    check_class: cross_field_check
    fail_when: '`VTTK.STTEN`.notna() & `VTTK.STTBG`.isna()'
    severity: low
    dimension: completeness
    message: Shipment end set without shipment start
    why_it_matters: A completed shipment with no start date cannot be measured for transit time.
    rule_authority: best_practice
    sap_impact: Transit duration reports are wrong.
    fix_map:
      __other__: Enter the shipment start date.
    record_fix_template: 'Shipment {VTTK.TKNUM}: shipment end {VTTK.STTEN} with no start.'

  - id: TM041
    field: VTTK.DPTEN
    check_class: freshness_check
    max_age_hours: 24
    applies_when:
      VTTK.STTRG:
        not_in:
        - '7'
      VTTK.STTEN:
        blank: true
    severity: medium
    dimension: timeliness
    message: Planned shipment end date has passed and the shipment is not completed
    why_it_matters: A shipment past its planned end that is not complete is late or abandoned.
    rule_authority: best_practice
    sap_impact: Freight is not settled and the carrier is not rated on delivery.
    fix_map:
      __other__: Complete the shipment (VT02N) or cancel it.
    record_fix_template: 'Shipment {VTTK.TKNUM}: planned end was {actual_value}.'

  - id: TM042
    field: VTTK.SIGNI
    check_class: cross_field_check
    fail_when: (`VTTK.STTBG`.notna()) & `VTTK.SIGNI`.isna()
    severity: low
    dimension: completeness
    message: Started shipment has no vehicle identification
    why_it_matters: A shipment that has started should name the vehicle or container.
    rule_authority: best_practice
    sap_impact: Gate and yard checks cannot match the vehicle.
    fix_map:
      __other__: Enter the vehicle or container identification.
    record_fix_template: Shipment {VTTK.TKNUM} started {VTTK.STTBG} with no vehicle identification.

  - id: TM043
    field: VTTK.ERDAT
    check_class: cross_field_check
    fail_when: '`VTTK.ERDAT` > @today'
    severity: medium
    dimension: validity
    message: Shipment creation date is in the future
    why_it_matters: A creation date later than today means the date was interfaced wrongly.
    rule_authority: sap_hard_constraint
    sap_impact: Ageing and cycle-time reports are wrong.
    fix_map:
      __other__: Correct the creation date at the source.
    record_fix_template: 'Shipment {VTTK.TKNUM}: created {actual_value}, in the future.'

  - id: TM044
    field: VTTK.AEDAT
    check_class: cross_field_check
    fail_when: '`VTTK.AEDAT` < `VTTK.ERDAT`'
    severity: low
    dimension: consistency
    message: Shipment changed before it was created
    why_it_matters: A change date earlier than the creation date points to a bad interface load.
    rule_authority: sap_hard_constraint
    sap_impact: Change history is unreliable.
    fix_map:
      __other__: Correct the dates at the source.
    record_fix_template: 'Shipment {VTTK.TKNUM}: changed {VTTK.AEDAT}, created {VTTK.ERDAT}.'

  - id: TM045
    field: VTTK.DISTZ
    check_class: cross_field_check
    fail_when: '`VTTK.DISTZ` < 0'
    severity: medium
    dimension: validity
    message: Shipment distance is negative
    why_it_matters: Distance cannot be below zero.
    rule_authority: sap_hard_constraint
    sap_impact: Freight cost based on distance is wrong.
    fix_map:
      __other__: Correct the distance.
    record_fix_template: 'Shipment {VTTK.TKNUM}: distance is {actual_value}.'

  - id: TM046
    field: VTTK.GESZT
    check_class: cross_field_check
    fail_when: (`VTTK.GESZT` > 0) & (`VTTK.FAHZT` > `VTTK.GESZT`)
    severity: low
    dimension: consistency
    message: Driving time exceeds total shipment time
    why_it_matters: Total time includes driving time. The driving time cannot be larger.
    rule_authority: sap_hard_constraint
    sap_impact: Scheduling and driver-hours checks are wrong.
    fix_map:
      __other__: Correct the times.
    record_fix_template: 'Shipment {VTTK.TKNUM}: driving {VTTK.FAHZT}, total {VTTK.GESZT}.'

  - id: TM047
    field: TVRO.TDLNR
    check_class: exists_check
    fields:
    - TVRO.TDLNR
    target_table: LFA1
    target_fields:
    - LIFNR
    applies_when:
      TVRO.TDLNR:
        populated: true
    severity: medium
    dimension: consistency
    message: Route default carrier does not exist
    why_it_matters: A default forwarding agent that is not a vendor cannot be paid.
    rule_authority: sap_hard_constraint
    sap_impact: Shipments on the route default to a vendor that cannot be invoiced.
    fix_map:
      __other__: Correct the forwarding agent on the route.
    record_fix_template: 'Route {TVRO.ROUTE}: carrier {TVRO.TDLNR} not in vendor master.'

  - id: TM048
    field: TVRO.MEDST
    check_class: cross_field_check
    fail_when: (`TVRO.DISTZ` > 0) & `TVRO.MEDST`.isna()
    severity: medium
    dimension: completeness
    message: Route distance has no unit
    why_it_matters: A distance without a unit cannot be converted.
    rule_authority: sap_hard_constraint
    sap_impact: Shipments on the route get unconvertible distances.
    fix_map:
      __other__: Enter the distance unit on the route.
    record_fix_template: 'Route {TVRO.ROUTE}: distance {TVRO.DISTZ} has no unit.'

  - id: TM049
    field: VTTP.TKNUM
    check_class: uniqueness_check
    fields:
    - VTTP.TKNUM
    - VTTP.VBELN
    severity: high
    dimension: uniqueness
    message: Delivery is assigned twice to the same shipment
    why_it_matters: A delivery appears once per shipment. A duplicate double-counts weight and freight.
    rule_authority: sap_hard_constraint
    sap_impact: Freight cost and load planning double-count the delivery.
    fix_map:
      __other__: Remove the duplicate assignment (VT02N).
    record_fix_template: 'Shipment {VTTP.TKNUM}: delivery {VTTP.VBELN} assigned more than once.'

  - id: TM050
    field: VTTK.VBTYP
    check_class: domain_value_check
    allowed_values:
    - '8'
    valid_values_with_labels:
      '8': Shipment
    severity: medium
    dimension: validity
    message: Shipment has an unexpected document category
    why_it_matters: Shipments carry category 8. Another value means a foreign document sits in the shipment table.
    rule_authority: sap_hard_constraint
    sap_impact: Shipment processing treats the document as a different type.
    fix_map:
      __other__: Review and correct the document category.
    record_fix_template: 'Shipment {VTTK.TKNUM}: category {actual_value}.'
