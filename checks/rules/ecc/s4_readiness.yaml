    - '99991231'
  severity: medium
  dimension: completeness
  message: 'S/4HANA readiness: active employee has no e-mail address (infotype 0105 subtype 0010) - simplification item Business Partner Approach (SAP Note 2265093)'
  why_it_matters: The Business Partner and the SAP Fiori and workflow notifications take the employee e-mail from infotype 0105.
  rule_authority: s4hana_migration
  sap_impact: Notifications and the employee Business Partner communication data are empty after the conversion.
  fix_map:
