# S/4HANA conversion readiness: ECC data judged against what an S/4HANA
# conversion requires (baseline s4_target). Each rule names the SAP
# Simplification Item it comes from; a note number is cited only where certain.
#
# overlay: the pack reads tables other modules already extract. The worker does
# not generate value-placement / country / config rules, profile fields or run
# cleaning, dedup, mining or golden records for it, so nothing is reported twice.
#
# areas: the readiness roll-up (GET /api/v1/findings/s4-readiness) groups the
# rules below by `s4_area` and adds the existing rules of other modules that an
# S/4HANA conversion depends on (`related`), each tagged blocking or warning.
module: s4_readiness
target_state: S4HANA
overlay: true
areas:
  business_partner:
    label: Business Partner / CVI
    simplification_item: Business Partner Approach (SAP Note 2265093)
    related:
      blocking: [S4-CVI-LFA1, S4-CVI-KNA1, S4-CVI-KNVK-VEND, S4-CVI-KNVK-CUST, S4-CVI-KTOKK-NUM, S4-CVI-KTOKK-ROLE,
                 S4-CVI-KTOKD-NUM, S4-CVI-KTOKD-ROLE, AP003, AP005, AR003, AR005,
                 BP201, BP202, BP206, BP207, BP227, BP228, BP229, BP230, BP233, BP234, BP237, BP238, BP239, BP240]
      warning: [AP026, AR059, AR071, AP075, AP092, AP233, XLNK001, XDUP002, CF-LFA1-STCD1, CF-LFA1-STCD2, CF-KNA1-STCD1, CF-KNA1-STCD2,
                CF-LFA1-PSTLZ, CF-KNA1-PSTLZ, CR-LFA1-PSTLZ, CR-KNA1-PSTLZ,
                BP203, BP204, BP205, BP208, BP209, BP210, BP221, BP222,
                BP231, BP232, BP235, BP236, BP243, BP244, BP246, BP248]
  quality_management:
    label: Quality management
    simplification_item: Business Partner Approach (SAP Note 2265093)
    related:
      blocking: [QM090, QM100]
      warning: [QM105]
  project_system:
    label: Project system
    simplification_item: Business Partner Approach (SAP Note 2265093)
    related:
      blocking: [PS112]
      warning: [PS100, PS102]
  material:
    label: Material master
    simplification_item: Material Number Field Length Extension
    related:
      blocking: [MM001, MM002]
  mrp:
    label: MRP areas
    simplification_item: Storage Location MRP
    related: {}
  material_ledger:
    label: Material Ledger
    simplification_item: Material Ledger Obligatory for Material Valuation
    related:
      warning: [MM043]
  purchasing:
    label: Purchasing info records and source lists
    simplification_item: Business Partner Approach (SAP Note 2265093)
    related:
      warning: [PUR131, PUR132]
  credit_management:
    label: Credit Management (FSCM)
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    related:
      blocking: [S4-CRM-KKBER, AR070, AR044, SDSO202, SDSO310, SDSO311, SDCM039]
      warning: [AR045, AR046, AR019, AR047, AR048, AR073, AR074, AR201, AR209, AR222, AR250, SDSO209, SDCM222]
  sales:
    label: Sales and pricing
    simplification_item: SD Rebate Processing replaced by Settlement Management
    related:
      warning: [SDSO046, SDSO047, SDSO048, SDSO049, SDSO050, SDSO051, SDSO052, SDSO053, SDSO054, SDSO280, SDSO309]
  output_management:
    label: Output management
    simplification_item: Output Management - NAST output control replaced by S/4HANA Output Management
    related: {}
  foreign_trade:
    label: Foreign trade
    simplification_item: SD Foreign Trade replaced by SAP Global Trade Services
    related: {}
  revenue_recognition:
    label: Revenue recognition
    simplification_item: SD Revenue Recognition replaced by Revenue Accounting and Reporting
    related: {}
  finance:
    label: Universal Journal / General Ledger
    simplification_item: Data Model Changes in Financials - Universal Journal
    related:
      blocking: [S4-CE-PRIMARY-GL, S4-CE-SECONDARY-CLASH, S4-CE-PRIMARY-BS]
      warning: [AR058, AP074, S4-CE-GL-DELETED, S4-CE-NO-COMPANY-CODE, S4-CO-PRCTR-SEGMENT, S4-CO-ORDER-PRCTR,
                GL259, CO091, CO092]
  asset_accounting:
    label: New Asset Accounting
    simplification_item: Asset Accounting - new data structures
    related:
      blocking: [S4-AA-PERIODIC-APC, S4-AA-CLASS-KTOGR, AA221, AA224, AA234, AA241]
      warning: [AA229, AA233, AA235, AA244, AA245, AA246]
  production:
    label: Production planning
    simplification_item: Production version mandatory for BOM selection
    related: {}
  warehouse_ewm:
    label: Warehouse Management to EWM
    simplification_item: Warehouse Management (LE-WM) in Compatibility Scope, replaced by SAP EWM
    related:
      blocking: [EWMS113, EWMS114, EWMS115, EWMS116, EWMS117, EWMS118, EWMS119, EWMS129, EWMS130, EWTO110, EWTO111,
                 EWTO112, EWTO113, EWTO114, WMI022, WMI024, WMI025, WMI032, WMI033, WMI034, WMI035, WMI036, BATCH025,
                 BATCH026, BATCH038]
      warning: [EWMS120, EWMS121, EWMS122, EWMS123, EWMS124, EWMS125, EWMS128, EWTO109, EWTO116, EWTO117, EWTO118,
                BATCH020, BATCH021, BATCH023, BATCH027, BATCH031, BATCH034, BATCH040, WMI023, WMI026, WMI027]
  ariba_integration:
