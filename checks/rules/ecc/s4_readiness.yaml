  message: 'S/4HANA readiness: equipment names a vendor with no Business Partner link'
  why_it_matters: In S/4HANA vendors exist only as Business Partners; the CVI link table connects each vendor number to its
    BP. A document that names a vendor without a link cannot be converted, and the conversion pre-checks stop at the vendor.
  rule_authority: s4hana_migration
  sap_impact: The vendor of the equipment is not found as BP after the conversion and warranty claims lose their reference.
  fix_map:
    __other__: Synchronise the vendor to a Business Partner with the CVI cockpit (MDS_LOAD_COCKPIT), or move the document
      to a vendor that has a link.
  record_fix_template: 'Equipment {EQUI.EQUNR}: vendor {EQUI.ELIEF} has no Business Partner link.'
- id: S4R-PM-EQUZ-ILOA-PLANT
  field: EQUZ.IWERK
  check_class: cross_field_check
  fail_when: '`EQUZ.IWERK`.notna() & `ILOA.SWERK`.notna() & (`EQUZ.IWERK` != `ILOA.SWERK`)'
  s4_area: plant_maintenance
  s4_impact: warning
  simplification_item: Migration cockpit load objects for logistics master and transaction data
  baseline: s4_target
  severity: low
  dimension: consistency
  message: 'S/4HANA readiness: equipment planning plant differs from the maintenance plant of its location record'
  why_it_matters: The migration builds the equipment from the time segment and its location record. A planning plant that
    differs from the maintenance plant of the location is loaded with two different plants.
  rule_authority: s4hana_migration
  sap_impact: Orders for the equipment are planned in one plant and executed in another, with split work centres and planner
    groups.
  fix_map:
    __other__: Align the planning plant and the maintenance plant (IE02, location tab).
  record_fix_template: 'Equipment {EQUZ.EQUNR}: planning plant differs from the maintenance plant of the location record.'
