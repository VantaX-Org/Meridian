  why_it_matters: In S/4HANA the routing is found through the production version. The assignment of the routing to the material
    alone no longer selects it.
  rule_authority: s4hana_migration
  sap_impact: Planned order conversion and production order creation find no routing for the material.
  fix_map:
    __other__: Create a production version that names the routing (C223 or MM02, MRP 4 view).
  record_fix_template: Material {MAPL.MATNR} in plant {MAPL.WERKS} has a routing assignment but no production version.
- id: S4R-PP-PV-EXPIRED
  field: MKAL.BDATU
  check_class: cross_field_check
  fail_when: (`MKAL.BDATU` - @today).dt.days < 0 & `MKAL.MKSP`.isna()
  s4_area: production
  s4_impact: warning
  simplification_item: Production version mandatory for BOM selection
  baseline: s4_target
  severity: low
  dimension: consistency
  message: 'S/4HANA readiness: production version is past its validity and still unlocked'
  why_it_matters: The production version is the only way to select BOM and routing in S/4HANA. An expired version that is
    not locked clutters the selection and is migrated with no use.
  rule_authority: s4hana_migration
  sap_impact: MRP raises errors for the material because no valid version exists on the planning date, or the expired version
    is loaded for nothing.
  fix_map:
    __other__: Lock the expired version (C202) and create a current one.
  record_fix_template: Production version {MKAL.VERID} of material {MKAL.MATNR} in plant {MKAL.WERKS} is past its validity.
