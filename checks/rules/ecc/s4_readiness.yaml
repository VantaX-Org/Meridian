  simplification_item: Data volume reduction before conversion (archiving)
  baseline: s4_target
  severity: low
  dimension: timeliness
  message: 'S/4HANA readiness: order was technically completed more than two years ago and is not archived'
  why_it_matters: Data that is flagged for deletion or inactive for years is converted with the rest unless it is archived
    first, which lengthens the downtime and carries dead records into the new system.
  rule_authority: s4hana_migration
  sap_impact: The order and its cost history are converted although they are closed.
  fix_map:
    __other__: Archive the order after the business-completion step.
  record_fix_template: Order {AUFK.AUFNR} was technically completed over two years ago.
