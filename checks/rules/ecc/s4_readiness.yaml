- id: S4R-BATCH-MCHB-NOMCHA
  field: MCHB.CHARG
  fields:
  - MCHB.MATNR
  - MCHB.WERKS
  - MCHB.CHARG
  check_class: exists_check
  target_table: MCHA
  target_fields:
  - MATNR
  - WERKS
  - CHARG
  s4_area: batch_serial
  s4_impact: warning
  simplification_item: Migration cockpit load objects for logistics master and transaction data
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: batch stock exists without a plant batch master record'
  why_it_matters: Batch stock is loaded together with the batch master of the plant. Stock without its master record cannot
    be assigned to a batch.
  rule_authority: s4hana_migration
  sap_impact: The stock is rejected by the migration cockpit and the batch inventory does not reconcile.
  fix_map:
    __other__: Recreate the batch master (MSC1N) or move the stock to a valid batch.
  record_fix_template: Material {MCHB.MATNR} batch {MCHB.CHARG} in plant {MCHB.WERKS} has stock but no batch master.
- id: S4R-BATCH-MCHA-NOMARC
  field: MCHA.MATNR
  fields:
  - MCHA.MATNR
  - MCHA.WERKS
  check_class: exists_check
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  s4_area: batch_serial
  s4_impact: warning
  simplification_item: Migration cockpit load objects for logistics master and transaction data
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: plant batch exists for a material that is not extended to the plant'
  why_it_matters: Batch masters are loaded below the plant view of the material. A batch for a plant the material is not extended
    to cannot be attached.
  rule_authority: s4hana_migration
  sap_impact: The batch is rejected by the load.
  fix_map:
    __other__: Extend the material to the plant or delete the batch.
  record_fix_template: Batch {MCHA.CHARG} of material {MCHA.MATNR} exists in plant {MCHA.WERKS} without a plant view.
- id: S4R-BATCH-MARC-NOMCHA
  field: MARC.MATNR
  fields:
  - MARC.MATNR
  - MARC.WERKS
  check_class: exists_check
  applies_when:
    MARC.XCHPF:
    - X
    MARC.LVORM:
      blank: true
  target_table: MCHA
  target_fields:
  - MATNR
  - WERKS
  s4_area: batch_serial
  s4_impact: warning
  simplification_item: Migration cockpit load objects for logistics master and transaction data
  baseline: s4_target
  severity: low
  dimension: consistency
  message: 'S/4HANA readiness: batch-managed plant view has no batches and no stock record'
  why_it_matters: A batch-managed material with a plant view but no batch is a configuration with nothing to migrate and is
    a candidate to remove the batch flag.
  rule_authority: s4hana_migration
  sap_impact: The batch management flag is carried over although no batch exists.
  fix_map:
    __other__: Remove the batch management flag (MSC2N) if no batch will be used, or create the batches.
  record_fix_template: Material {MARC.MATNR} in plant {MARC.WERKS} is batch-managed but has no batch.
- id: S4R-BATCH-SERNP-BATCH
  field: MARC.SERNP
  check_class: cross_field_check
  fail_when: '`MARC.SERNP`.notna() & `MARC.XCHPF` == "X"'
  s4_area: batch_serial
  s4_impact: warning
  simplification_item: Migration cockpit load objects for logistics master and transaction data
  baseline: s4_target
  severity: low
  dimension: consistency
  message: 'S/4HANA readiness: material is both serial-number managed and batch managed in the plant'
  why_it_matters: Both together mean the same unit is tracked by serial number and by batch; the migration cockpit loads the
    serial numbers with the batch of the plant.
  rule_authority: s4hana_migration
  sap_impact: Serial number records are rejected when the batch cannot be derived.
  fix_map:
    __other__: Confirm that both tracking levels are intended.
  record_fix_template: Material {MARC.MATNR} in plant {MARC.WERKS} has a serial number profile and is batch managed.
- id: S4R-WM-QUANT-NEG
  field: LQUA.GESME
  check_class: cross_field_check
  fail_when: '`LQUA.GESME` < 0'
  severity: high
  dimension: accuracy
  message: 'S/4HANA readiness: quant has negative stock (LQUA.GESME) - simplification item Warehouse Management (LE-WM) in
    Compatibility Scope'
  why_it_matters: The migration of WM stock to EWM creates one stock record per quant. A negative quant has no valid EWM equivalent
    and stops the stock load.
  rule_authority: s4hana_migration
  sap_impact: The WM stock reconciliation fails for the bin and the quant cannot be migrated until the stock is corrected.
  fix_map:
    __other__: Post a stock correction (LI21 or a goods movement) to clear the negative quant before the migration.
  record_fix_template: Quant {LQUA.LQNUM} in {LQUA.LGNUM}/{LQUA.LGTYP}/{LQUA.LGPLA} has stock {actual_value}.
  s4_area: warehouse_ewm
  s4_impact: blocking
  simplification_item: Warehouse Management (LE-WM) in Compatibility Scope, replaced by SAP EWM
  baseline: s4_target
- id: S4R-WM-TO-OPEN
  field: LTAP.PQUIT
  check_class: cross_field_check
  fail_when: '`LTAP.PQUIT`.isna()'
  applies_when:
    LTAP.KZQUI:
    - X
  severity: high
  dimension: completeness
  message: 'S/4HANA readiness: transfer order item that needs confirmation is still open - simplification item Warehouse Management
    (LE-WM) in Compatibility Scope'
  why_it_matters: Open transfer orders cannot be moved to EWM. They must be confirmed or cancelled before the cutover so that
    no stock is in transit.
  rule_authority: s4hana_migration
  sap_impact: Stock stays in the interim storage type and the warehouse cutover cannot be completed.
  fix_map:
    __other__: Confirm the transfer order (LT12) or cancel it (LT15) before the cutover.
  record_fix_template: Transfer order {LTAP.TANUM} item {LTAP.TAPOS} in warehouse {LTAP.LGNUM} is not confirmed.
  s4_area: warehouse_ewm
  s4_impact: blocking
  simplification_item: Warehouse Management (LE-WM) in Compatibility Scope, replaced by SAP EWM
  baseline: s4_target
- id: S4R-WM-INV-QUANT
  field: LQUA.IVNUM
  check_class: cross_field_check
  fail_when: '`LQUA.IVNUM`.notna()'
  severity: high
  dimension: completeness
  message: 'S/4HANA readiness: quant is in an open physical inventory document - simplification item Warehouse Management
    (LE-WM) in Compatibility Scope'
  why_it_matters: An open WM inventory document freezes the quant. The migration needs counted and posted stock with no inventory
    in progress.
  rule_authority: s4hana_migration
  sap_impact: The quant is locked by the inventory and its stock figure may change after the count, which breaks reconciliation.
  fix_map:
    __other__: Complete and post the physical inventory (LI11N, LI20) or cancel the inventory document before the migration.
  record_fix_template: Quant {LQUA.LQNUM} in {LQUA.LGNUM}/{LQUA.LGPLA} is in inventory document {LQUA.IVNUM}.
  s4_area: warehouse_ewm
  s4_impact: blocking
  simplification_item: Warehouse Management (LE-WM) in Compatibility Scope, replaced by SAP EWM
  baseline: s4_target
- id: S4R-WM-INV-BIN
  field: LAGP.KZINV
  check_class: cross_field_check
  fail_when: '`LAGP.KZINV`.notna()'
  severity: medium
  dimension: completeness
  message: 'S/4HANA readiness: storage bin has an active inventory indicator - simplification item Warehouse Management (LE-WM)
    in Compatibility Scope'
  why_it_matters: A bin with an inventory in progress cannot be migrated as a stable location. The indicator must be cleared
    by posting or cancelling the count.
  rule_authority: s4hana_migration
  sap_impact: The bin is blocked for movements until the inventory ends and its stock is not reconciled for the migration.
  fix_map:
    __other__: Finish the inventory for the bin (LI20) or reset the indicator by cancelling the inventory document.
  record_fix_template: Bin {LAGP.LGPLA} in {LAGP.LGNUM}/{LAGP.LGTYP} has an active inventory indicator.
  s4_area: warehouse_ewm
  s4_impact: blocking
  simplification_item: Warehouse Management (LE-WM) in Compatibility Scope, replaced by SAP EWM
  baseline: s4_target
- id: S4R-WM-QUANT-EXPIRED
  field: LQUA.VFDAT
  check_class: cross_field_check
  fail_when: '`LQUA.VFDAT` < @today'
  severity: low
  dimension: timeliness
  message: 'S/4HANA readiness: quant past its shelf-life date still in the warehouse (archive or scrap candidate)'
  why_it_matters: Expired stock migrated into EWM adds quants that cannot be picked. Scrap or return it first so that the
    migration moves only usable stock.
  rule_authority: s4hana_migration
  sap_impact: Expired quants inflate the migrated stock volume and the reconciliation, and block FEFO picking after the migration.
  fix_map:
    __other__: Scrap or return the expired stock (movement type 551) and clear the quant before the migration.
  record_fix_template: Quant {LQUA.LQNUM} in {LQUA.LGNUM}/{LQUA.LGPLA} is past its shelf-life date.
  s4_area: warehouse_ewm
  s4_impact: warning
  simplification_item: Warehouse Management (LE-WM) in Compatibility Scope, replaced by SAP EWM
  baseline: s4_target
- id: S4R-WM-LEIN-EMPTY
  field: LEIN.LGNUM
  check_class: exists_check
  fields:
  - LEIN.LGNUM
  - LEIN.LENUM
  target_table: LQUA
  target_fields:
  - LGNUM
  - LENUM
  severity: low
  dimension: consistency
  message: 'S/4HANA readiness: storage unit has no quant (archive candidate)'
  why_it_matters: A storage unit with no stock is left over from a past movement. The migration builds handling units from
    storage units, so an empty one creates a handling unit with no content.
  rule_authority: s4hana_migration
  sap_impact: The migration produces empty handling units that must be deleted again in EWM.
  fix_map:
    __other__: Delete the empty storage unit (LS32 or LT09 clean-up) before the migration.
  record_fix_template: Storage unit {LEIN.LENUM} in {LEIN.LGNUM} holds no quant.
  s4_area: warehouse_ewm
  s4_impact: warning
  simplification_item: Warehouse Management (LE-WM) in Compatibility Scope, replaced by SAP EWM
  baseline: s4_target
- id: S4R-WM-MLGT-BIN
  field: MLGT.LGNUM
  check_class: exists_check
  fields:
  - MLGT.LGNUM
  - MLGT.LGTYP
  - MLGT.LGPLA
  target_table: LAGP
  target_fields:
  - LGNUM
  - LGTYP
  - LGPLA
  applies_when:
    MLGT.LGPLA:
      populated: true
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: fixed bin of the material does not exist as a storage bin - simplification item Warehouse Management
    (LE-WM) in Compatibility Scope'
  why_it_matters: The fixed bin assignment is migrated to EWM as a product-specific bin assignment. A bin that does not exist
    cannot be loaded.
  rule_authority: s4hana_migration
  sap_impact: The storage type data of the material is rejected in the migration load.
  fix_map:
    __other__: Create the bin (LS01N) or correct the fixed bin in the material warehouse data (MM02).
  record_fix_template: Material {MLGT.MATNR} in {MLGT.LGNUM}/{MLGT.LGTYP} has fixed bin {MLGT.LGPLA} with no bin master.
  s4_area: warehouse_ewm
  s4_impact: blocking
  simplification_item: Warehouse Management (LE-WM) in Compatibility Scope, replaced by SAP EWM
  baseline: s4_target
- id: S4R-WM-QUANT-BLOCKED
  field: LQUA.GESME
  check_class: cross_field_check
  fail_when: ((`LQUA.SKZSA` == 'X') | (`LQUA.SKZSE` == 'X')) & (`LQUA.GESME` > 0)
  severity: medium
  dimension: completeness
  message: 'S/4HANA readiness: quant with stock is blocked for removal or putaway - simplification item Warehouse Management
    (LE-WM) in Compatibility Scope'
  why_it_matters: Stock blocks must be resolved or mapped to an EWM stock type before the load. A blocked quant with stock
    needs a decision on its target status.
  rule_authority: s4hana_migration
  sap_impact: Blocked stock is migrated as restricted stock and can distort availability after the cutover.
  fix_map:
    __other__: Release the block (LS02N or LQ02) or decide the EWM stock type for the blocked stock before the migration.
  record_fix_template: Quant {LQUA.LQNUM} in {LQUA.LGNUM}/{LQUA.LGPLA} is blocked and holds stock.
  s4_area: warehouse_ewm
  s4_impact: warning
  simplification_item: Warehouse Management (LE-WM) in Compatibility Scope, replaced by SAP EWM
  baseline: s4_target
- id: S4R-HCM-NACHN
  field: PA0002.NACHN
  check_class: null_check
  grain: PA0002
  s4_area: hcm
  s4_impact: blocking
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  applies_when:
    PA0002.ENDDA:
    - '99991231'
  severity: critical
  dimension: completeness
  message: 'S/4HANA readiness: employee has no last name, which the employee Business Partner requires - simplification item Business Partner Approach (SAP Note 2265093)'
  why_it_matters: Synchronising employees to Business Partners (HR integration to BP) builds the BP name from infotype 0002; a BP person needs a last name.
  rule_authority: s4hana_migration
  sap_impact: The employee Business Partner cannot be created, so employee vendor and travel integrations that depend on it fail.
  fix_map:
    __other__: Maintain the last name in PA30 infotype 0002 before the conversion.
  record_fix_template: Personnel number {PA0002.PERNR} has no last name. Maintain it in PA30 infotype 0002.
- id: S4R-HCM-LAND1
  field: PA0006.LAND1
  check_class: null_check
  grain: PA0006
  s4_area: hcm
  s4_impact: blocking
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  applies_when:
    PA0006.ENDDA:
    - '99991231'
    PA0006.SUBTY:
    - '1'
  severity: high
  dimension: completeness
  message: 'S/4HANA readiness: employee address has no country, which the Business Partner address requires - simplification item Business Partner Approach (SAP Note 2265093)'
  why_it_matters: The Business Partner address needs a country; the HR to BP synchronisation takes it from infotype 0006.
  rule_authority: s4hana_migration
  sap_impact: The employee Business Partner address cannot be created and synchronisation reports an error for the employee.
  fix_map:
    __other__: Maintain the country in PA30 infotype 0006.
  record_fix_template: Personnel number {PA0006.PERNR} has an address without a country. Maintain it in PA30 infotype 0006.
- id: S4R-HCM-ORT01
  field: PA0006.ORT01
  check_class: null_check
  grain: PA0006
  s4_area: hcm
  s4_impact: warning
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  applies_when:
    PA0006.ENDDA:
    - '99991231'
    PA0006.SUBTY:
    - '1'
  severity: medium
  dimension: completeness
  message: 'S/4HANA readiness: employee address has no city - simplification item Business Partner Approach (SAP Note 2265093)'
  why_it_matters: The Business Partner address carries a city; a blank city is accepted only with a warning by the synchronisation.
  rule_authority: s4hana_migration
  sap_impact: The employee Business Partner address is incomplete in the target.
  fix_map:
    __other__: Maintain the city in PA30 infotype 0006.
  record_fix_template: Personnel number {PA0006.PERNR} has an address without a city. Maintain it in PA30 infotype 0006.
- id: S4R-HCM-BANKS
  field: PA0009.BANKS
  check_class: null_check
  grain: PA0009
  s4_area: hcm
  s4_impact: blocking
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  applies_when:
    PA0009.ENDDA:
    - '99991231'
    PA0009.BANKN:
      populated: true
  severity: high
  dimension: completeness
  message: 'S/4HANA readiness: bank account has no bank country, which the Business Partner bank detail requires - simplification item Business Partner Approach (SAP Note 2265093)'
  why_it_matters: Bank details of the employee Business Partner are keyed by bank country and bank key.
  rule_authority: s4hana_migration
  sap_impact: The bank detail of the employee Business Partner cannot be created, so payments to the employee through the vendor side fail.
  fix_map:
    __blank__: Maintain the bank country in PA30 infotype 0009.
  record_fix_template: Personnel number {PA0009.PERNR} has an account number but no bank country. Maintain it in PA30 infotype 0009.
- id: S4R-HCM-SPRSL
  field: PA0002.SPRSL
  check_class: null_check
  grain: PA0002
  s4_area: hcm
  s4_impact: warning
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  applies_when:
    PA0002.ENDDA:
    - '99991231'
  severity: low
  dimension: completeness
  message: 'S/4HANA readiness: employee has no communication language - simplification item Business Partner Approach (SAP Note 2265093)'
  why_it_matters: The Business Partner correspondence language defaults from infotype 0002.
  rule_authority: s4hana_migration
  sap_impact: The employee Business Partner gets a default language, which can send correspondence in the wrong language.
  fix_map:
    __other__: Maintain the communication language in PA30 infotype 0002.
  record_fix_template: Personnel number {PA0002.PERNR} has no communication language. Maintain it in PA30 infotype 0002.
- id: S4R-HCM-GESCH
  field: PA0002.GESCH
  check_class: null_check
  grain: PA0002
  s4_area: hcm
  s4_impact: warning
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  applies_when:
    PA0002.ENDDA:
    - '99991231'
  severity: low
  dimension: completeness
  message: 'S/4HANA readiness: employee has no gender key - simplification item Business Partner Approach (SAP Note 2265093)'
  why_it_matters: The Business Partner person record maps the gender from infotype 0002.
  rule_authority: s4hana_migration
  sap_impact: The employee Business Partner is created with an unknown sex, which can fail statutory reporting that relies on it.
  fix_map:
    __other__: Maintain the gender key in PA30 infotype 0002.
  record_fix_template: Personnel number {PA0002.PERNR} has no gender key. Maintain it in PA30 infotype 0002.
- id: S4R-HCM-EMAIL
  field: PA0001.PERNR
  check_class: exists_check
  grain: PA0001
  s4_area: hcm
  s4_impact: warning
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  target_table: PA0105
  target_fields:
  - PERNR
  applies_when:
    PA0001.ENDDA:
    - '99991231'
