    related:
      warning: [MM043, MM518, MM519, MM520, MM180, MM035]
  purchasing:
    label: Purchasing info records and source lists
    simplification_item: Business Partner Approach (SAP Note 2265093)
    related:
      warning: [PUR131, PUR132, PUR306, PUR320, PUR319, PUR133, PUR130, PUR137, PUR138]
  credit_management:
