  fix_map:
    __other__: Synchronise the vendor to a Business Partner with the CVI cockpit (MDS_LOAD_COCKPIT), or move the document
      to a vendor that has a link.
  record_fix_template: 'Purchase order {EKKO.EBELN}: vendor {EKKO.LIFNR} has no Business Partner link.'
- id: S4R-PUR-EKKO-CONTRACT-NOBP
  field: EKKO.LIFNR
  check_class: exists_check
  applies_when:
    EKKO.BSTYP:
    - K
    EKKO.LOEKZ:
      blank: true
  target_table: CVI_VEND_LINK
  target_fields:
  - VENDOR
  s4_area: purchasing
  s4_impact: blocking
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: open contract names a vendor with no Business Partner link'
  why_it_matters: In S/4HANA vendors exist only as Business Partners; the CVI link table connects each vendor number to its
    BP. A document that names a vendor without a link cannot be converted, and the conversion pre-checks stop at the vendor.
  rule_authority: s4hana_migration
  sap_impact: Call-offs against the contract cannot find the vendor after the conversion.
  fix_map:
    __other__: Synchronise the vendor to a Business Partner with the CVI cockpit (MDS_LOAD_COCKPIT), or move the document
      to a vendor that has a link.
  record_fix_template: 'Contract {EKKO.EBELN}: vendor {EKKO.LIFNR} has no Business Partner link.'
- id: S4R-PUR-EKKO-SA-NOBP
  field: EKKO.LIFNR
  check_class: exists_check
  applies_when:
    EKKO.BSTYP:
    - L
