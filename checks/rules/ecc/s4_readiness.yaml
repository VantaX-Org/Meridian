      warning: [PA035, PA057, PA106, PA110, PA112, PA113, EC118]
rules:
- id: S4R-BP-KNA1-ADRNR
  field: KNA1.ADRNR
  check_class: null_check
  s4_area: business_partner
  s4_impact: warning
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  severity: medium
  dimension: completeness
  message: 'S/4HANA readiness: active customer has no central address (KNA1.ADRNR) - simplification item S4TWL Business
    Partner Approach, SAP Note 2265093'
  why_it_matters: Customer/Vendor Integration builds the Business Partner address from the customer's central address
    (business address services). A customer record without an address number carries its address only in the old KNA1
    fields, which the Business Partner does not use.
  rule_authority: s4hana_migration
  sap_impact: The customer is reported by the CVI pre-checks and synchronises without a usable address, so documents,
    output and tax determination for the customer have no address after the conversion.
  fix_map:
    __other__: Open the customer in XD02 and save it so that the address is created in central address management, then
      re-run the CVI synchronisation for the customer.
  record_fix_template: 'Customer {KNA1.KUNNR} has no central address number (KNA1.ADRNR).'
- id: S4R-BP-KNVK-NAME
  field: KNVK.NAME1
  check_class: null_check
  applies_when:
    KNVK.LOEVM:
      blank: true
  s4_area: business_partner
  s4_impact: blocking
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  severity: high
  dimension: completeness
  message: 'S/4HANA readiness: contact person has no last name (KNVK.NAME1) - simplification item S4TWL Business Partner
    Approach, SAP Note 2265093'
  why_it_matters: Contact persons become Business Partners of category person in S/4HANA, and a person Business Partner
    cannot be created without a last name. CVI takes the last name from KNVK.NAME1.
  rule_authority: s4hana_migration
  sap_impact: The contact person cannot be synchronised to a Business Partner, so the customer or vendor it belongs to is
    reported as not fully synchronised and the contact is lost in the conversion.
  fix_map:
    __other__: Enter the contact person's last name in the customer or vendor master (contact person screen), or flag
      the obsolete contact for deletion.
  record_fix_template: 'Contact person {KNVK.PARNR} has no last name.'
- id: S4R-BP-NUM-OVERLAP
  field: LFA1.LIFNR
  check_class: exists_check
  negate: true
  applies_when:
    LFA1.KUNNR:
      blank: true
  target_table: KNA1
  target_fields:
  - KUNNR
  target_when:
    LIFNR:
      blank: true
  s4_area: business_partner
  s4_impact: warning
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: vendor number is also used by an unrelated customer - simplification item S4TWL Business
    Partner Approach, SAP Note 2265093'
  why_it_matters: Customers and vendors share one Business Partner number range in S/4HANA. When the conversion keeps
    the existing numbers (same number for Business Partner and account), a vendor and an unlinked customer with the same
    number cannot both get that Business Partner number.
  rule_authority: s4hana_migration
  sap_impact: One of the two records must take a different Business Partner number, which breaks a same-number CVI
    number assignment and every interface or report that relies on the numbers matching.
  fix_map:
    __other__: If the vendor and the customer are the same legal entity, link them (customer in the vendor master and
      vendor in the customer master) so they become one Business Partner; otherwise plan an internal Business Partner
      number range for one of the two account groups.
  record_fix_template: 'Vendor {LFA1.LIFNR} has the same number as an unlinked customer.'
- id: S4R-BP-DUP-TAX
  field: LFA1.STCD1
  fields:
  - LFA1.LAND1
  - LFA1.STCD1
  check_class: exists_check
  negate: true
  applies_when:
    LFA1.KUNNR:
      blank: true
  target_table: KNA1
  target_fields:
  - LAND1
  - STCD1
  target_when:
    LIFNR:
      blank: true
  s4_area: business_partner
  s4_impact: warning
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  severity: medium
  dimension: uniqueness
  message: 'S/4HANA readiness: vendor has the same country and tax number as an unlinked customer and should become one
    Business Partner - simplification item Business Partner Approach (SAP Note 2265093)'
  why_it_matters: In S/4HANA one legal entity is one Business Partner with a customer role and a supplier role. A vendor
    and a customer with the same tax number that are not linked are converted into two Business Partners for the same
    entity.
  rule_authority: s4hana_migration
  sap_impact: Duplicate Business Partners for one legal entity split credit exposure, netting of receivables and
    payables, tax reporting and screening across two records after the conversion.
  fix_map:
    __other__: Confirm the vendor and the customer are the same entity, then link them (customer in the vendor master and
      vendor in the customer master) before the CVI synchronisation so they are converted into one Business Partner.
  record_fix_template: 'Vendor {LFA1.LIFNR} shares its tax number with an unlinked customer.'
- id: S4R-BP-KNA1-LIFNR
  field: KNA1.LIFNR
  check_class: exists_check
  target_table: LFA1
  target_fields:
  - LIFNR
  s4_area: business_partner
  s4_impact: warning
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: customer is linked to a vendor that does not exist (KNA1.LIFNR) - simplification item
    Business Partner Approach (SAP Note 2265093)'
  why_it_matters: The vendor entered in the customer master is the link CVI uses to treat a customer and a vendor as one
    Business Partner. A link to a vendor that does not exist cannot be converted.
  rule_authority: s4hana_migration
  sap_impact: The customer is converted without its supplier role, and clearing between the customer and the vendor
    stops working after the conversion.
  fix_map:
    __other__: Correct the vendor number in the customer master (XD02, control data) or remove the link if the vendor no
      longer exists.
  record_fix_template: 'Customer {KNA1.KUNNR} is linked to vendor {KNA1.LIFNR}, which does not exist.'
- id: S4R-MRP-MARD-DISKZ
  field: MARD.DISKZ
  check_class: cross_field_check
  fail_when: '`MARD.DISKZ`.notna()'
  s4_area: mrp
  s4_impact: warning
  simplification_item: Storage Location MRP
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: storage location is planned separately with storage location MRP (MARD.DISKZ) - simplification
    item Storage Location MRP'
  why_it_matters: S/4HANA does not support planning a storage location separately through the storage location MRP
    indicator. Separate planning of a storage location must be set up as an MRP area.
  rule_authority: s4hana_migration
  sap_impact: After the conversion MRP no longer plans the storage location separately and its stock is planned with the
    plant until the MRP area is set up.
  fix_map:
    __other__: Define a storage location MRP area for the plant and storage location, assign the material to it in the
      MRP views, then clear the storage location MRP indicator.
  record_fix_template: 'Material {MARD.MATNR} in plant {MARD.WERKS}, storage location {MARD.LGORT} uses storage location MRP.'
- id: S4R-ML-T001K-MLBWA
  field: T001K.MLBWA
  check_class: null_check
  s4_area: material_ledger
  s4_impact: warning
  simplification_item: Material Ledger Obligatory for Material Valuation
  baseline: s4_target
  severity: low
  dimension: completeness
  message: 'S/4HANA readiness: material ledger is not active in the valuation area (T001K.MLBWA) - simplification item
    Material Ledger Obligatory for Material Valuation'
  why_it_matters: The material ledger is mandatory for inventory valuation in S/4HANA. Valuation areas without it are
    activated during the conversion, which migrates their stock values into the material ledger.
  rule_authority: s4hana_migration
  sap_impact: The material ledger migration of this valuation area adds conversion work and must be reconciled; stock
    value inconsistencies in it stop the migration.
  fix_map:
    __other__: Plan the material ledger migration for the valuation area (currencies and valuation of the material
      ledger) and reconcile stock values before the conversion.
  record_fix_template: 'Valuation area {T001K.BWKEY} has no material ledger.'
- id: S4R-CRM-KNKLI-KKBER
  field: KNKK.KNKLI
  fields:
  - KNKK.KNKLI
  - KNKK.KKBER
  check_class: exists_check
  target_table: KNKK
  target_fields:
  - KUNNR
  - KKBER
  s4_area: credit_management
  s4_impact: warning
  simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: credit account of the customer has no credit data in the same credit control area - simplification
    item Credit Management - FI-AR-CR replaced by FIN-FSCM-CR'
  why_it_matters: SAP Credit Management (FSCM) replaces FI-AR credit management in S/4HANA. The migration turns each
    customer's credit account into a credit segment of the credit account's Business Partner, using that account's
    limit in the same credit control area.
  rule_authority: s4hana_migration
  sap_impact: The customer's credit exposure is migrated to a credit account with no credit limit, so credit checks for
    the customer block or pass orders incorrectly after the conversion.
  fix_map:
    __other__: Create credit data for the credit account in this credit control area (FD32), or point the customer at a
      credit account that has it.
  record_fix_template: 'Customer {KNKK.KUNNR} uses credit account {KNKK.KNKLI}, which has no credit data in credit control
    area {KNKK.KKBER}.'
- id: S4R-SD-REBATE-AGREEMENT
  field: KONH.KNUMA_BO
  check_class: cross_field_check
  fail_when: '`KONH.KNUMA_BO`.notna()'
  applies_when:
    KONH.KAPPL:
    - V
  s4_area: sales
  s4_impact: warning
  simplification_item: SD Rebate Processing replaced by Settlement Management
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: valid sales condition belongs to an SD rebate agreement - simplification item SD Rebate
    Processing replaced by Settlement Management'
  why_it_matters: S/4HANA replaces SD rebate agreements with condition contracts in Settlement Management. Existing rebate
    agreements can only be settled and closed; new ones cannot be created.
  rule_authority: s4hana_migration
  sap_impact: The rebate agreement has to be settled before or after the conversion and its follow-on period set up as a
    condition contract, or rebate accruals stop for the customer.
  fix_map:
    __other__: Settle and close the rebate agreement before the conversion where possible, and model the next period as a
      condition contract in Settlement Management.
  record_fix_template: 'Condition record {KONH.KNUMH} belongs to rebate agreement {KONH.KNUMA_BO}.'
- id: S4R-MM-REBATE-ARRANGEMENT
  field: KONH.KNUMA_BO
  check_class: cross_field_check
  fail_when: '`KONH.KNUMA_BO`.notna()'
  applies_when:
    KONH.KAPPL:
    - M
  s4_area: purchasing
  s4_impact: warning
  simplification_item: Subsequent Settlement - Vendor Rebate Arrangements replaced by Settlement Management
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: valid purchasing condition belongs to a vendor rebate arrangement - simplification item
    Subsequent Settlement (vendor rebate arrangements) replaced by Settlement Management'
  why_it_matters: S/4HANA replaces subsequent settlement with vendor rebate arrangements by condition contracts in
    Settlement Management. Existing arrangements can only be settled and closed.
  rule_authority: s4hana_migration
  sap_impact: The arrangement has to be settled and its follow-on period set up as a condition contract, or vendor rebate
    income is no longer accrued after the conversion.
  fix_map:
    __other__: Settle and close the rebate arrangement before the conversion where possible, and model the next period as a
      condition contract in Settlement Management.
  record_fix_template: 'Condition record {KONH.KNUMH} belongs to rebate arrangement {KONH.KNUMA_BO}.'
- id: S4R-FI-CSKS-PRCTR
  field: CSKS.PRCTR
  check_class: null_check
  s4_area: finance
  s4_impact: warning
  simplification_item: Data Model Changes in Financials - Universal Journal
  baseline: s4_target
  severity: low
  dimension: completeness
  message: 'S/4HANA readiness: cost centre has no profit centre (CSKS.PRCTR) - simplification item Data Model Changes in
    Financials - Universal Journal'
  why_it_matters: In S/4HANA profit centre accounting is part of the Universal Journal, and every journal line derives
    its profit centre from the account assignment. Postings to a cost centre without a profit centre land on the dummy
    profit centre or none.
  rule_authority: s4hana_migration
  sap_impact: Profit centre reporting and any document splitting by profit centre are incomplete for the cost centre's
    postings after the conversion.
  fix_map:
    __other__: Assign the profit centre to the cost centre (KS02) for every validity period.
  record_fix_template: 'Cost centre {CSKS.KOSTL} has no profit centre.'
- id: S4R-AA-KTOGR
  field: ANLA.KTOGR
  check_class: exists_check
  target_table: T095
  target_fields:
  - KTOGR
  s4_area: asset_accounting
  s4_impact: blocking
  simplification_item: Asset Accounting - new data structures
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: asset uses an account determination with no G/L accounts (T095) - simplification item
    Asset Accounting - new data structures'
  why_it_matters: New Asset Accounting posts every depreciation area that is managed in the general ledger in real time
    through the account determination of the asset. An account determination without G/L accounts cannot post the
    asset's values.
  rule_authority: s4hana_migration
  sap_impact: The asset's balances cannot be migrated or posted in new Asset Accounting, which stops the Asset
    Accounting migration and period-end depreciation runs.
  fix_map:
    __other__: Maintain the G/L accounts for the account determination (AO90) in every chart of accounts the asset's
      company code uses, or move the asset to an asset class with complete account determination.
  record_fix_template: 'Asset {ANLA.ANLN1} uses account determination {ANLA.KTOGR}, which has no G/L accounts.'
- id: S4R-PP-PRODVER
  field: MARC.MATNR
  fields:
  - MARC.MATNR
  - MARC.WERKS
  check_class: exists_check
  negate: true
  applies_when:
    MARC.BESKZ:
    - E
    - X
    MARC.VERKZ:
      blank: true
  target_table: MAST
  target_fields:
  - MATNR
  - WERKS
  s4_area: production
  s4_impact: warning
  simplification_item: Production version mandatory for BOM selection
  baseline: s4_target
  severity: medium
  dimension: completeness
  message: 'S/4HANA readiness: in-house produced material has a BOM but no production version'
  why_it_matters: S/4HANA selects the BOM and routing for planning and production orders through the production version;
    the alternative BOM selection methods of the material master are not used.
  rule_authority: s4hana_migration
  sap_impact: MRP and production order creation cannot select the material's BOM and routing until a production version
    exists, which stops planned order explosion for the material.
  fix_map:
    __other__: Create a production version for the material and plant (C223 or MM02, MRP 4 view) that names the BOM
      alternative and the routing, before the conversion.
  record_fix_template: 'Material {MARC.MATNR} in plant {MARC.WERKS} has a BOM but no production version.'
- id: S4R-MM-MARA-NOPLANT
  field: MARA.MATNR
  check_class: exists_check
  applies_when:
    MARA.LVORM:
      blank: true
  target_table: MARC
  target_fields:
  - MATNR
  s4_area: material
  s4_impact: warning
  simplification_item: Migration cockpit load objects for logistics master and transaction data
  baseline: s4_target
  severity: low
  dimension: completeness
  message: 'S/4HANA readiness: active material is not extended to any plant'
  why_it_matters: The migration cockpit loads the product master with its plant data. A material without any plant row has
    no MRP, purchasing, valuation or storage data to migrate and is a candidate to exclude or to flag for deletion.
  rule_authority: s4hana_migration
  sap_impact: The material is loaded as a bare client-level record that no process can use, or is dropped from the load.
  fix_map:
    __other__: Extend the material to its plants (MM01 or MM02), or flag it for deletion (MM06) and exclude it from the migration.
  record_fix_template: Material {MARA.MATNR} is active but has no plant data.
- id: S4R-MM-MARM-NOMARA
  field: MARM.MATNR
  check_class: exists_check
  target_table: MARA
  target_fields:
  - MATNR
  s4_area: material
  s4_impact: warning
  simplification_item: Migration cockpit load objects for logistics master and transaction data
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: unit of measure row belongs to a material that does not exist'
  why_it_matters: The alternative unit rows are loaded as part of the product master. A row without its material header cannot
    be loaded.
  rule_authority: s4hana_migration
  sap_impact: The unit conversion row is rejected and every document that uses the unit fails after the load.
  fix_map:
    __other__: Delete the orphan unit row or restore the material header.
  record_fix_template: Unit row {MARM.MEINH} refers to material {MARM.MATNR}, which does not exist.
- id: S4R-MM-MARD-NOMARC
  field: MARD.MATNR
  fields:
  - MARD.MATNR
  - MARD.WERKS
  check_class: exists_check
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  s4_area: material
  s4_impact: warning
  simplification_item: Migration cockpit load objects for logistics master and transaction data
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: storage location stock record has no plant view'
  why_it_matters: Stock is loaded per plant and storage location below the plant view of the material. A storage row without
    the plant row cannot be assigned.
  rule_authority: s4hana_migration
  sap_impact: The stock quantity is rejected by the load and the inventory does not reconcile with the ledger.
  fix_map:
    __other__: Extend the material to the plant, or clear the orphan storage row after checking that it holds no stock.
  record_fix_template: Material {MARD.MATNR} has storage location {MARD.LGORT} in plant {MARD.WERKS} without a plant view.
- id: S4R-MM-MARC-NOMBEW
  field: MARC.MATNR
  fields:
  - MARC.MATNR
  - MARC.WERKS
  check_class: exists_check
  applies_when:
    MARC.LVORM:
      blank: true
  target_table: MBEW
  target_fields:
  - MATNR
  - BWKEY
  s4_area: material
  s4_impact: warning
  simplification_item: Material Ledger Obligatory for Material Valuation
  baseline: s4_target
  severity: medium
  dimension: completeness
  message: 'S/4HANA readiness: plant view has no valuation record in the plant'
  why_it_matters: With the material ledger obligatory, every stock-keeping material needs valuation data in its valuation
    area to open a material ledger record. This check assumes valuation at plant level.
  rule_authority: s4hana_migration
  sap_impact: The material cannot receive stock postings or goods movements; the conversion of the material ledger skips or
    rejects the material.
  fix_map:
    __other__: Create the accounting view of the material for the valuation area (MM01 or MM02), or flag the plant view for
      deletion.
  record_fix_template: Material {MARC.MATNR} in plant {MARC.WERKS} has no valuation record.
- id: S4R-MM-MARA-MBRSH-MTYPE
  field: MARA.MTART
  check_class: exists_check
  target_table: T134
  target_fields:
  - MTART
  s4_area: material
  s4_impact: blocking
  simplification_item: Migration cockpit load objects for logistics master and transaction data
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: material type is not defined in the material type table'
  why_it_matters: The material type decides the number range, field selection and valuation behaviour and is mapped to a product
    type in the migration. An undefined type has no mapping.
  rule_authority: s4hana_migration
  sap_impact: The material is rejected by the migration cockpit because its type has no customising.
  fix_map:
    __other__: Correct the material type with MMAM or define the type in customising before the load.
  record_fix_template: Material {MARA.MATNR} has a material type that is not defined.
- id: S4R-ML-MLAST-INACTIVE
  field: MBEW.BWKEY
  fields:
  - MBEW.BWKEY
  check_class: exists_check
  applies_when:
    MBEW.MLAST:
      populated: true
  target_table: T001K
  target_fields:
  - BWKEY
  target_when:
    MLBWA:
      blank: true
  negate: true
  s4_area: material_ledger
  s4_impact: warning
  simplification_item: Material Ledger Obligatory for Material Valuation
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: price determination is set in a valuation area where the material ledger is not active'
  why_it_matters: A price determination indicator is only meaningful with an active material ledger. In S/4HANA the material
    ledger is active everywhere, so the indicator must hold a defined value in every valuation area.
  rule_authority: s4hana_migration
  sap_impact: The conversion of the material ledger starts from an inconsistent record and the price determination of the
    material is undefined after it.
  fix_map:
    __other__: Activate the material ledger in the valuation area, or clear the price determination of the material.
  record_fix_template: Material {MBEW.MATNR} in {MBEW.BWKEY} has a price determination but the material ledger is not active.
- id: S4R-ML-NEG-VALUE
  field: MBEW.SALK3
  check_class: cross_field_check
  fail_when: '`MBEW.LBKUM` > 0 & `MBEW.SALK3` < 0'
  s4_area: material_ledger
  s4_impact: blocking
  simplification_item: Material Ledger Obligatory for Material Valuation
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: material has a positive stock quantity but a negative stock value'
  why_it_matters: The material ledger opening balance of the conversion is the stock quantity and the stock value per material.
    A negative value on positive stock produces a negative price and stops the period closing of the ledger.
  rule_authority: s4hana_migration
  sap_impact: The ML conversion cannot determine a valid price for the material and posts the difference to price difference
    accounts.
  fix_map:
    __other__: Revalue the material (MR21) or correct the stock before the conversion.
  record_fix_template: Material {MBEW.MATNR} in {MBEW.BWKEY} has positive stock and a negative stock value.
- id: S4R-ML-VALUE-NOQTY
  field: MBEW.SALK3
  check_class: cross_field_check
  fail_when: '`MBEW.LBKUM` == 0 & `MBEW.SALK3` != 0'
  s4_area: material_ledger
  s4_impact: blocking
  simplification_item: Material Ledger Obligatory for Material Valuation
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: material has a stock value but no stock quantity'
  why_it_matters: A stock value without quantity cannot be carried into the material ledger as quantity times price, so the
    value is orphaned at the conversion.
  rule_authority: s4hana_migration
  sap_impact: The stock value stays on the stock account without material backing and distorts the reconciliation after the
    conversion.
  fix_map:
    __other__: Write off or revalue the residual stock value (MR21) to zero before the conversion.
  record_fix_template: Material {MBEW.MATNR} in {MBEW.BWKEY} has a stock value but zero stock quantity.
- id: S4R-ML-VPRSV-BLANK-STOCK
  field: MBEW.VPRSV
  check_class: cross_field_check
  fail_when: '`MBEW.VPRSV`.isna() & `MBEW.SALK3` != 0'
  s4_area: material_ledger
  s4_impact: warning
  simplification_item: Material Ledger Obligatory for Material Valuation
  baseline: s4_target
  severity: high
  dimension: completeness
  message: 'S/4HANA readiness: material with stock value has no price control'
  why_it_matters: Price control decides how the material ledger values movements. A valuated material without it cannot be
    opened in the ledger.
  rule_authority: s4hana_migration
  sap_impact: The material is rejected by the migration of the valuation data.
  fix_map:
    __other__: Set the price control (MM02, accounting view) after review of the current price.
  record_fix_template: Material {MBEW.MATNR} in {MBEW.BWKEY} has stock value and no price control.
- id: S4R-ML-BKLAS-BLANK-STOCK
  field: MBEW.BKLAS
  check_class: cross_field_check
  fail_when: '`MBEW.BKLAS`.isna() & `MBEW.SALK3` != 0'
  s4_area: material_ledger
  s4_impact: blocking
  simplification_item: Material Ledger Obligatory for Material Valuation
  baseline: s4_target
  severity: high
  dimension: completeness
  message: 'S/4HANA readiness: material with stock value has no valuation class'
  why_it_matters: In S/4HANA the valuation class determines the G/L account of every stock posting through the material ledger.
    Stock without a class cannot be assigned to an account at the conversion.
  rule_authority: s4hana_migration
  sap_impact: The stock value cannot be reconciled to a G/L account and the conversion of the material ledger reports an error
    for the material.
  fix_map:
    __other__: Set the valuation class that matches the material type (MM02, accounting view).
  record_fix_template: Material {MBEW.MATNR} in {MBEW.BWKEY} has stock value and no valuation class.
- id: S4R-ML-MLAST-INVALID-VPRSV
  field: MBEW.MLAST
  check_class: cross_field_check
  fail_when: '`MBEW.MLAST`.notna() & `MBEW.VPRSV`.isna()'
  s4_area: material_ledger
  s4_impact: warning
  simplification_item: Material Ledger Obligatory for Material Valuation
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: material ledger price determination is set on a material without a price control'
  why_it_matters: Price determination and price control work together in the material ledger. A price determination on a record
    without price control cannot be interpreted.
  rule_authority: s4hana_migration
  sap_impact: The material gets an undefined valuation procedure in the ledger after the conversion.
  fix_map:
    __other__: Set the price control and a valid price determination together (MM02, accounting view).
  record_fix_template: Material {MBEW.MATNR} in {MBEW.BWKEY} has a price determination and no price control.
- id: S4R-MRP-MARD-LSOBS
  field: MARD.LSOBS
  check_class: cross_field_check
  fail_when: '`MARD.LSOBS`.notna()'
  s4_area: mrp
  s4_impact: warning
  simplification_item: Storage Location MRP
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: storage location carries a special procurement type at storage location level (MARD.LSOBS)'
  why_it_matters: The special procurement type at storage location level exists only for storage location MRP. S/4HANA plans
    separate storage locations through MRP areas and does not read the storage location parameters.
  rule_authority: s4hana_migration
  sap_impact: The special procurement type is ignored after the conversion, so the storage location is replenished with the
    plant requirement instead of its own.
  fix_map:
    __other__: Create an MRP area for the storage location, maintain the planning parameters there, then clear the storage
      location values.
  record_fix_template: Material {MARD.MATNR} in plant {MARD.WERKS}, storage location {MARD.LGORT} carries storage location
    MRP parameters.
- id: S4R-MRP-MARD-LBSTF
  field: MARD.LBSTF
  check_class: cross_field_check
  fail_when: '`MARD.LBSTF`.notna() & `MARD.LBSTF` > 0'
  s4_area: mrp
  s4_impact: warning
  simplification_item: Storage Location MRP
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: storage location carries a replenishment quantity at storage location level (MARD.LBSTF)'
  why_it_matters: The replenishment quantity at storage location level exists only for storage location MRP. S/4HANA plans
    separate storage locations through MRP areas and does not read the storage location parameters.
  rule_authority: s4hana_migration
  sap_impact: The replenishment quantity is ignored after the conversion, so the storage location is replenished with the
    plant requirement instead of its own.
  fix_map:
    __other__: Create an MRP area for the storage location, maintain the planning parameters there, then clear the storage
      location values.
  record_fix_template: Material {MARD.MATNR} in plant {MARD.WERKS}, storage location {MARD.LGORT} carries storage location
    MRP parameters.
- id: S4R-MRP-MARD-LMINB
  field: MARD.LMINB
  check_class: cross_field_check
  fail_when: '`MARD.LMINB`.notna() & `MARD.LMINB` > 0'
  s4_area: mrp
  s4_impact: warning
  simplification_item: Storage Location MRP
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: storage location carries a reorder point at storage location level (MARD.LMINB)'
  why_it_matters: The reorder point at storage location level exists only for storage location MRP. S/4HANA plans separate
    storage locations through MRP areas and does not read the storage location parameters.
  rule_authority: s4hana_migration
  sap_impact: The reorder point is ignored after the conversion, so the storage location is replenished with the plant requirement
    instead of its own.
  fix_map:
    __other__: Create an MRP area for the storage location, maintain the planning parameters there, then clear the storage
      location values.
  record_fix_template: Material {MARD.MATNR} in plant {MARD.WERKS}, storage location {MARD.LGORT} carries storage location
    MRP parameters.
- id: S4R-MRP-MARD-ND
  field: MARD.DISKZ
  check_class: cross_field_check
  fail_when: '`MARD.DISKZ`.notna() & `MARC.DISMM` == "ND"'
  s4_area: mrp
  s4_impact: warning
  simplification_item: Storage Location MRP
  baseline: s4_target
  severity: low
  dimension: consistency
  message: 'S/4HANA readiness: storage location MRP is set for a material that is excluded from planning in the plant'
  why_it_matters: Storage location MRP only works on a material that MRP plans in the plant. With MRP type ND the setting
    has no effect today and no counterpart in an MRP area.
  rule_authority: s4hana_migration
  sap_impact: The setting survives as dead data and misleads the MRP area design.
  fix_map:
    __other__: Clear the storage location MRP indicator, or plan the material in the plant.
  record_fix_template: Material {MARD.MATNR} in plant {MARD.WERKS}, storage location {MARD.LGORT} uses storage location MRP
    but the plant MRP type is ND.
- id: S4R-MRP-MARD-NOPLANNED
  field: MARD.MATNR
  fields:
  - MARD.MATNR
  - MARD.WERKS
  check_class: exists_check
  applies_when:
    MARD.DISKZ:
      populated: true
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    DISPO:
      blank: true
  negate: true
  s4_area: mrp
  s4_impact: warning
  simplification_item: Storage Location MRP
  baseline: s4_target
  severity: low
  dimension: completeness
  message: 'S/4HANA readiness: storage location MRP is set on a material with no MRP controller in the plant'
  why_it_matters: A storage location that is planned separately needs an MRP controller on the plant view. Without one the
    MRP area built from it has no planner.
  rule_authority: s4hana_migration
  sap_impact: The MRP area created for the storage location has no responsible planner and its exceptions go unread.
  fix_map:
    __other__: Maintain an MRP controller on the plant view of the material (MM02, MRP 1 view).
  record_fix_template: Material {MARD.MATNR} in plant {MARD.WERKS} uses storage location MRP but has no MRP controller.
- id: S4R-MRP-T001L-DISKZ
  field: T001L.DISKZ
  check_class: cross_field_check
  fail_when: '`T001L.DISKZ`.notna()'
  s4_area: mrp
  s4_impact: blocking
  simplification_item: Storage Location MRP
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: storage location is customised for storage location MRP (T001L.DISKZ)'
  why_it_matters: The storage location master switches storage location MRP on for the location. S/4HANA replaces it with
    an MRP area per storage location.
  rule_authority: s4hana_migration
  sap_impact: Every material stored in the location is planned separately in ECC; after the conversion the setting has no
    effect and the location is planned with the plant.
  fix_map:
    __other__: Define an MRP area of type storage location for the plant and storage location (OMIA) and clear T001L.DISKZ.
  record_fix_template: Plant {T001L.WERKS}, storage location {T001L.LGORT} is flagged for storage location MRP.
- id: S4R-MRP-MARC-DISMM-CUSTOM
  field: MARC.DISMM
  check_class: cross_field_check
  fail_when: '`MARC.DISMM`.str.match("^[XYZ]", na=False)'
  s4_area: mrp
  s4_impact: warning
  simplification_item: MRP Live (MRP run on SAP HANA)
  baseline: s4_target
  severity: low
  dimension: validity
  message: 'S/4HANA readiness: MRP type is a customer-defined key (MARC.DISMM)'
  why_it_matters: A MRP type defined by the customer is not part of the standard SAP configuration delivered with S/4HANA.
    It is carried over only if the customising is transported, and MRP Live evaluates it with its own logic.
  rule_authority: s4hana_migration
  sap_impact: The planning result for the material changes if the key is dropped or behaves differently under MRP Live.
  fix_map:
    __other__: Check the key against the S/4HANA planning parameters, map it to a standard MRP type, then change the plant
      view.
  record_fix_template: Material {MARC.MATNR} in plant {MARC.WERKS} uses a customer-defined MRP type.
- id: S4R-MRP-MARC-DISLS-CUSTOM
  field: MARC.DISLS
  check_class: cross_field_check
  fail_when: '`MARC.DISLS`.str.match("^[XYZ]", na=False)'
  s4_area: mrp
  s4_impact: warning
  simplification_item: MRP Live (MRP run on SAP HANA)
  baseline: s4_target
  severity: low
  dimension: validity
  message: 'S/4HANA readiness: lot-sizing procedure is a customer-defined key (MARC.DISLS)'
  why_it_matters: A lot-sizing procedure defined by the customer is not part of the standard SAP configuration delivered with
    S/4HANA. It is carried over only if the customising is transported, and MRP Live evaluates it with its own logic.
  rule_authority: s4hana_migration
  sap_impact: The planning result for the material changes if the key is dropped or behaves differently under MRP Live.
  fix_map:
    __other__: Check the key against the S/4HANA planning parameters, map it to a standard lot-sizing procedure, then change
      the plant view.
  record_fix_template: Material {MARC.MATNR} in plant {MARC.WERKS} uses a customer-defined lot-sizing procedure.
- id: S4R-MRP-MDMA-NOMARC
  field: MDMA.MATNR
  fields:
  - MDMA.MATNR
  - MDMA.WERKS
  check_class: exists_check
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  s4_area: mrp
  s4_impact: warning
  simplification_item: Storage Location MRP
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: MRP area data exists for a material that is not extended to the plant'
  why_it_matters: MRP areas are the S/4HANA successor of storage location MRP. Area data is loaded below the plant view; area
    data without it cannot be loaded.
  rule_authority: s4hana_migration
  sap_impact: The MRP area record is rejected by the migration of the planning data.
  fix_map:
    __other__: Extend the material to the plant or delete the MRP area data (MD_MRP_AREA).
  record_fix_template: Material {MDMA.MATNR} has MRP area {MDMA.BERID} in plant {MDMA.WERKS} without a plant view.
- id: S4R-MRP-MDMA-NOPLANNING
  field: MDMA.MATNR
  fields:
  - MDMA.MATNR
  - MDMA.WERKS
  check_class: exists_check
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    DISMM:
    - ND
    - ''
  negate: true
  s4_area: mrp
  s4_impact: warning
  simplification_item: MRP Live (MRP run on SAP HANA)
  baseline: s4_target
  severity: low
  dimension: consistency
  message: 'S/4HANA readiness: material has MRP area data but is not planned in the plant'
  why_it_matters: A material that is not planned by MRP (type ND or blank) does not use the MRP area data. It is dead planning
    data.
  rule_authority: s4hana_migration
  sap_impact: The MRP area built from the data would plan a material that the plant excludes.
  fix_map:
    __other__: Clear the MRP area data or plan the material in the plant.
  record_fix_template: Material {MDMA.MATNR} has MRP area {MDMA.BERID} in plant {MDMA.WERKS} but the plant does not plan it.
- id: S4R-PUR-EINA-NOBP
  field: EINA.LIFNR
  check_class: exists_check
  applies_when:
    EINA.LOEKZ:
      blank: true
  target_table: CVI_VEND_LINK
  target_fields:
  - VENDOR
  s4_area: purchasing
  s4_impact: blocking
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: active info record names a vendor with no Business Partner link'
  why_it_matters: In S/4HANA vendors exist only as Business Partners; the CVI link table connects each vendor number to its
    BP. A document that names a vendor without a link cannot be converted, and the conversion pre-checks stop at the vendor.
  rule_authority: s4hana_migration
  sap_impact: The info record keeps a vendor that does not exist as a BP after the conversion, so source determination fails
    for it.
  fix_map:
    __other__: Synchronise the vendor to a Business Partner with the CVI cockpit (MDS_LOAD_COCKPIT), or move the document
      to a vendor that has a link.
  record_fix_template: 'Info record {EINA.INFNR}: vendor {EINA.LIFNR} has no Business Partner link.'
- id: S4R-PUR-EORD-NOBP
  field: EORD.LIFNR
  check_class: exists_check
  applies_when:
    EORD.LIFNR:
      populated: true
  target_table: CVI_VEND_LINK
  target_fields:
  - VENDOR
  s4_area: purchasing
  s4_impact: warning
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: active source list record names a vendor with no Business Partner link'
  why_it_matters: In S/4HANA vendors exist only as Business Partners; the CVI link table connects each vendor number to its
    BP. A document that names a vendor without a link cannot be converted, and the conversion pre-checks stop at the vendor.
  rule_authority: s4hana_migration
  sap_impact: Automatic source determination proposes a vendor that is not a BP after the conversion.
  fix_map:
    __other__: Synchronise the vendor to a Business Partner with the CVI cockpit (MDS_LOAD_COCKPIT), or move the document
      to a vendor that has a link.
  record_fix_template: 'Source list record for material {EORD.MATNR} in plant {EORD.WERKS}: vendor {EORD.LIFNR} has no Business
    Partner link.'
- id: S4R-PUR-LFM1-NOBP
  field: LFM1.LIFNR
  check_class: exists_check
  applies_when:
    LFM1.LOEVM:
      blank: true
  target_table: CVI_VEND_LINK
  target_fields:
  - VENDOR
  s4_area: purchasing
  s4_impact: blocking
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: vendor purchasing-organisation data belongs to a vendor with no Business Partner link'
  why_it_matters: In S/4HANA vendors exist only as Business Partners; the CVI link table connects each vendor number to its
    BP. A document that names a vendor without a link cannot be converted, and the conversion pre-checks stop at the vendor.
  rule_authority: s4hana_migration
  sap_impact: The purchasing role of the BP cannot be created, so the vendor cannot be ordered from.
  fix_map:
    __other__: Synchronise the vendor to a Business Partner with the CVI cockpit (MDS_LOAD_COCKPIT), or move the document
      to a vendor that has a link.
  record_fix_template: Vendor {LFM1.LIFNR} in purchasing organisation {LFM1.EKORG} has no Business Partner link.
- id: S4R-PUR-EKKO-PO-NOBP
  field: EKKO.LIFNR
  check_class: exists_check
  applies_when:
    EKKO.BSTYP:
    - F
    EKKO.LOEKZ:
      blank: true
  target_table: CVI_VEND_LINK
  target_fields:
  - VENDOR
  s4_area: purchasing
  s4_impact: blocking
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: open purchase order names a vendor with no Business Partner link'
  why_it_matters: In S/4HANA vendors exist only as Business Partners; the CVI link table connects each vendor number to its
    BP. A document that names a vendor without a link cannot be converted, and the conversion pre-checks stop at the vendor.
  rule_authority: s4hana_migration
  sap_impact: Open orders reference the vendor number; the vendor is not found as BP after the conversion and goods receipt
