  severity: low
  dimension: timeliness
  message: 'S/4HANA readiness: order is flagged for deletion and not archived'
  why_it_matters: Data that is flagged for deletion or inactive for years is converted with the rest unless it is archived
    first, which lengthens the downtime and carries dead records into the new system.
  rule_authority: s4hana_migration
  sap_impact: The order and its cost history are converted.
  fix_map:
    __other__: Archive the order (SARA, object PP_ORDER, CO_ORDER).
  record_fix_template: Order {AUFK.AUFNR} is flagged for deletion.
