      blocking: [CNE003, CNE004, CNU007, CNU010, CNU012]
      warning: [CNE029, CNU011, CNU013, CNE028]
  hcm:
    label: HCM compatibility pack and employee Business Partner
    simplification_item: Business Partner Approach (SAP Note 2265093)
    related:
      blocking: [PA015, PA036, PA060, PA084, PA111, EC046, EC108, EC109, EC110, EC111, EC112, EC113, EC114]
      warning: [PA035, PA057, PA106, PA110, PA112, PA113, EC118]
rules:
- id: S4R-BP-KNA1-ADRNR
  field: KNA1.ADRNR
  check_class: null_check
  s4_area: business_partner
  s4_impact: warning
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  severity: medium
  dimension: completeness
  message: 'S/4HANA readiness: active customer has no central address (KNA1.ADRNR) - simplification item S4TWL Business
    Partner Approach, SAP Note 2265093'
  why_it_matters: Customer/Vendor Integration builds the Business Partner address from the customer's central address
    (business address services). A customer record without an address number carries its address only in the old KNA1
    fields, which the Business Partner does not use.
  rule_authority: s4hana_migration
  sap_impact: The customer is reported by the CVI pre-checks and synchronises without a usable address, so documents,
    output and tax determination for the customer have no address after the conversion.
  fix_map:
    __other__: Open the customer in XD02 and save it so that the address is created in central address management, then
      re-run the CVI synchronisation for the customer.
  record_fix_template: 'Customer {KNA1.KUNNR} has no central address number (KNA1.ADRNR).'
- id: S4R-BP-KNVK-NAME
  field: KNVK.NAME1
  check_class: null_check
  applies_when:
    KNVK.LOEVM:
      blank: true
  s4_area: business_partner
  s4_impact: blocking
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  severity: high
  dimension: completeness
  message: 'S/4HANA readiness: contact person has no last name (KNVK.NAME1) - simplification item S4TWL Business Partner
    Approach, SAP Note 2265093'
  why_it_matters: Contact persons become Business Partners of category person in S/4HANA, and a person Business Partner
    cannot be created without a last name. CVI takes the last name from KNVK.NAME1.
  rule_authority: s4hana_migration
  sap_impact: The contact person cannot be synchronised to a Business Partner, so the customer or vendor it belongs to is
    reported as not fully synchronised and the contact is lost in the conversion.
  fix_map:
    __other__: Enter the contact person's last name in the customer or vendor master (contact person screen), or flag
      the obsolete contact for deletion.
  record_fix_template: 'Contact person {KNVK.PARNR} has no last name.'
- id: S4R-BP-NUM-OVERLAP
  field: LFA1.LIFNR
  check_class: exists_check
  negate: true
  applies_when:
    LFA1.KUNNR:
      blank: true
  target_table: KNA1
  target_fields:
  - KUNNR
  target_when:
    LIFNR:
      blank: true
  s4_area: business_partner
  s4_impact: warning
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: vendor number is also used by an unrelated customer - simplification item S4TWL Business
    Partner Approach, SAP Note 2265093'
  why_it_matters: Customers and vendors share one Business Partner number range in S/4HANA. When the conversion keeps
    the existing numbers (same number for Business Partner and account), a vendor and an unlinked customer with the same
    number cannot both get that Business Partner number.
  rule_authority: s4hana_migration
  sap_impact: One of the two records must take a different Business Partner number, which breaks a same-number CVI
    number assignment and every interface or report that relies on the numbers matching.
  fix_map:
    __other__: If the vendor and the customer are the same legal entity, link them (customer in the vendor master and
      vendor in the customer master) so they become one Business Partner; otherwise plan an internal Business Partner
      number range for one of the two account groups.
  record_fix_template: 'Vendor {LFA1.LIFNR} has the same number as an unlinked customer.'
- id: S4R-BP-DUP-TAX
  field: LFA1.STCD1
  fields:
  - LFA1.LAND1
  - LFA1.STCD1
  check_class: exists_check
  negate: true
  applies_when:
    LFA1.KUNNR:
      blank: true
  target_table: KNA1
  target_fields:
  - LAND1
  - STCD1
  target_when:
    LIFNR:
      blank: true
  s4_area: business_partner
  s4_impact: warning
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  severity: medium
  dimension: uniqueness
  message: 'S/4HANA readiness: vendor has the same country and tax number as an unlinked customer and should become one
    Business Partner - simplification item Business Partner Approach (SAP Note 2265093)'
  why_it_matters: In S/4HANA one legal entity is one Business Partner with a customer role and a supplier role. A vendor
    and a customer with the same tax number that are not linked are converted into two Business Partners for the same
    entity.
  rule_authority: s4hana_migration
  sap_impact: Duplicate Business Partners for one legal entity split credit exposure, netting of receivables and
    payables, tax reporting and screening across two records after the conversion.
  fix_map:
    __other__: Confirm the vendor and the customer are the same entity, then link them (customer in the vendor master and
      vendor in the customer master) before the CVI synchronisation so they are converted into one Business Partner.
  record_fix_template: 'Vendor {LFA1.LIFNR} shares its tax number with an unlinked customer.'
- id: S4R-BP-KNA1-LIFNR
  field: KNA1.LIFNR
  check_class: exists_check
  target_table: LFA1
  target_fields:
  - LIFNR
  s4_area: business_partner
  s4_impact: warning
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: customer is linked to a vendor that does not exist (KNA1.LIFNR) - simplification item
    Business Partner Approach (SAP Note 2265093)'
  why_it_matters: The vendor entered in the customer master is the link CVI uses to treat a customer and a vendor as one
    Business Partner. A link to a vendor that does not exist cannot be converted.
  rule_authority: s4hana_migration
  sap_impact: The customer is converted without its supplier role, and clearing between the customer and the vendor
    stops working after the conversion.
  fix_map:
    __other__: Correct the vendor number in the customer master (XD02, control data) or remove the link if the vendor no
      longer exists.
  record_fix_template: 'Customer {KNA1.KUNNR} is linked to vendor {KNA1.LIFNR}, which does not exist.'
- id: S4R-MRP-MARD-DISKZ
  field: MARD.DISKZ
  check_class: cross_field_check
  fail_when: '`MARD.DISKZ`.notna()'
  s4_area: mrp
  s4_impact: warning
  simplification_item: Storage Location MRP
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: storage location is planned separately with storage location MRP (MARD.DISKZ) - simplification
    item Storage Location MRP'
  why_it_matters: S/4HANA does not support planning a storage location separately through the storage location MRP
    indicator. Separate planning of a storage location must be set up as an MRP area.
  rule_authority: s4hana_migration
  sap_impact: After the conversion MRP no longer plans the storage location separately and its stock is planned with the
    plant until the MRP area is set up.
  fix_map:
    __other__: Define a storage location MRP area for the plant and storage location, assign the material to it in the
      MRP views, then clear the storage location MRP indicator.
  record_fix_template: 'Material {MARD.MATNR} in plant {MARD.WERKS}, storage location {MARD.LGORT} uses storage location MRP.'
- id: S4R-ML-T001K-MLBWA
  field: T001K.MLBWA
  check_class: null_check
  s4_area: material_ledger
  s4_impact: warning
  simplification_item: Material Ledger Obligatory for Material Valuation
  baseline: s4_target
  severity: low
  dimension: completeness
  message: 'S/4HANA readiness: material ledger is not active in the valuation area (T001K.MLBWA) - simplification item
    Material Ledger Obligatory for Material Valuation'
  why_it_matters: The material ledger is mandatory for inventory valuation in S/4HANA. Valuation areas without it are
    activated during the conversion, which migrates their stock values into the material ledger.
  rule_authority: s4hana_migration
  sap_impact: The material ledger migration of this valuation area adds conversion work and must be reconciled; stock
    value inconsistencies in it stop the migration.
  fix_map:
    __other__: Plan the material ledger migration for the valuation area (currencies and valuation of the material
      ledger) and reconcile stock values before the conversion.
  record_fix_template: 'Valuation area {T001K.BWKEY} has no material ledger.'
- id: S4R-CRM-KNKLI-KKBER
  field: KNKK.KNKLI
  fields:
  - KNKK.KNKLI
  - KNKK.KKBER
  check_class: exists_check
  target_table: KNKK
  target_fields:
  - KUNNR
  - KKBER
  s4_area: credit_management
  s4_impact: warning
  simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: credit account of the customer has no credit data in the same credit control area - simplification
    item Credit Management - FI-AR-CR replaced by FIN-FSCM-CR'
  why_it_matters: SAP Credit Management (FSCM) replaces FI-AR credit management in S/4HANA. The migration turns each
    customer's credit account into a credit segment of the credit account's Business Partner, using that account's
    limit in the same credit control area.
  rule_authority: s4hana_migration
  sap_impact: The customer's credit exposure is migrated to a credit account with no credit limit, so credit checks for
    the customer block or pass orders incorrectly after the conversion.
  fix_map:
    __other__: Create credit data for the credit account in this credit control area (FD32), or point the customer at a
      credit account that has it.
  record_fix_template: 'Customer {KNKK.KUNNR} uses credit account {KNKK.KNKLI}, which has no credit data in credit control
    area {KNKK.KKBER}.'
- id: S4R-SD-REBATE-AGREEMENT
  field: KONH.KNUMA_BO
  check_class: cross_field_check
  fail_when: '`KONH.KNUMA_BO`.notna()'
  applies_when:
    KONH.KAPPL:
    - V
  s4_area: sales
  s4_impact: warning
  simplification_item: SD Rebate Processing replaced by Settlement Management
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: valid sales condition belongs to an SD rebate agreement - simplification item SD Rebate
    Processing replaced by Settlement Management'
  why_it_matters: S/4HANA replaces SD rebate agreements with condition contracts in Settlement Management. Existing rebate
    agreements can only be settled and closed; new ones cannot be created.
  rule_authority: s4hana_migration
  sap_impact: The rebate agreement has to be settled before or after the conversion and its follow-on period set up as a
    condition contract, or rebate accruals stop for the customer.
  fix_map:
    __other__: Settle and close the rebate agreement before the conversion where possible, and model the next period as a
      condition contract in Settlement Management.
  record_fix_template: 'Condition record {KONH.KNUMH} belongs to rebate agreement {KONH.KNUMA_BO}.'
- id: S4R-MM-REBATE-ARRANGEMENT
  field: KONH.KNUMA_BO
  check_class: cross_field_check
  fail_when: '`KONH.KNUMA_BO`.notna()'
  applies_when:
    KONH.KAPPL:
    - M
  s4_area: purchasing
  s4_impact: warning
  simplification_item: Subsequent Settlement - Vendor Rebate Arrangements replaced by Settlement Management
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: 'S/4HANA readiness: valid purchasing condition belongs to a vendor rebate arrangement - simplification item
    Subsequent Settlement (vendor rebate arrangements) replaced by Settlement Management'
  why_it_matters: S/4HANA replaces subsequent settlement with vendor rebate arrangements by condition contracts in
    Settlement Management. Existing arrangements can only be settled and closed.
  rule_authority: s4hana_migration
  sap_impact: The arrangement has to be settled and its follow-on period set up as a condition contract, or vendor rebate
    income is no longer accrued after the conversion.
  fix_map:
    __other__: Settle and close the rebate arrangement before the conversion where possible, and model the next period as a
      condition contract in Settlement Management.
  record_fix_template: 'Condition record {KONH.KNUMH} belongs to rebate arrangement {KONH.KNUMA_BO}.'
- id: S4R-FI-CSKS-PRCTR
  field: CSKS.PRCTR
  check_class: null_check
  s4_area: finance
  s4_impact: warning
  simplification_item: Data Model Changes in Financials - Universal Journal
  baseline: s4_target
  severity: low
  dimension: completeness
  message: 'S/4HANA readiness: cost centre has no profit centre (CSKS.PRCTR) - simplification item Data Model Changes in
    Financials - Universal Journal'
  why_it_matters: In S/4HANA profit centre accounting is part of the Universal Journal, and every journal line derives
    its profit centre from the account assignment. Postings to a cost centre without a profit centre land on the dummy
    profit centre or none.
  rule_authority: s4hana_migration
  sap_impact: Profit centre reporting and any document splitting by profit centre are incomplete for the cost centre's
    postings after the conversion.
  fix_map:
    __other__: Assign the profit centre to the cost centre (KS02) for every validity period.
  record_fix_template: 'Cost centre {CSKS.KOSTL} has no profit centre.'
- id: S4R-AA-KTOGR
  field: ANLA.KTOGR
  check_class: exists_check
  target_table: T095
  target_fields:
  - KTOGR
  s4_area: asset_accounting
  s4_impact: blocking
  simplification_item: Asset Accounting - new data structures
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: asset uses an account determination with no G/L accounts (T095) - simplification item
    Asset Accounting - new data structures'
  why_it_matters: New Asset Accounting posts every depreciation area that is managed in the general ledger in real time
    through the account determination of the asset. An account determination without G/L accounts cannot post the
    asset's values.
  rule_authority: s4hana_migration
  sap_impact: The asset's balances cannot be migrated or posted in new Asset Accounting, which stops the Asset
    Accounting migration and period-end depreciation runs.
  fix_map:
    __other__: Maintain the G/L accounts for the account determination (AO90) in every chart of accounts the asset's
      company code uses, or move the asset to an asset class with complete account determination.
  record_fix_template: 'Asset {ANLA.ANLN1} uses account determination {ANLA.KTOGR}, which has no G/L accounts.'
- id: S4R-PP-PRODVER
  field: MARC.MATNR
  fields:
  - MARC.MATNR
  - MARC.WERKS
  check_class: exists_check
  negate: true
  applies_when:
    MARC.BESKZ:
    - E
    - X
    MARC.VERKZ:
      blank: true
  target_table: MAST
  target_fields:
  - MATNR
  - WERKS
  s4_area: production
  s4_impact: warning
  simplification_item: Production version mandatory for BOM selection
  baseline: s4_target
  severity: medium
  dimension: completeness
  message: 'S/4HANA readiness: in-house produced material has a BOM but no production version'
  why_it_matters: S/4HANA selects the BOM and routing for planning and production orders through the production version;
    the alternative BOM selection methods of the material master are not used.
  rule_authority: s4hana_migration
  sap_impact: MRP and production order creation cannot select the material's BOM and routing until a production version
    exists, which stops planned order explosion for the material.
  fix_map:
    __other__: Create a production version for the material and plant (C223 or MM02, MRP 4 view) that names the BOM
      alternative and the routing, before the conversion.
  record_fix_template: 'Material {MARC.MATNR} in plant {MARC.WERKS} has a BOM but no production version.'
- id: S4R-WM-QUANT-NEG
  field: LQUA.GESME
  check_class: cross_field_check
  fail_when: '`LQUA.GESME` < 0'
  severity: high
  dimension: accuracy
  message: 'S/4HANA readiness: quant has negative stock (LQUA.GESME) - simplification item Warehouse Management (LE-WM) in
    Compatibility Scope'
  why_it_matters: The migration of WM stock to EWM creates one stock record per quant. A negative quant has no valid EWM equivalent
    and stops the stock load.
  rule_authority: s4hana_migration
  sap_impact: The WM stock reconciliation fails for the bin and the quant cannot be migrated until the stock is corrected.
  fix_map:
    __other__: Post a stock correction (LI21 or a goods movement) to clear the negative quant before the migration.
  record_fix_template: Quant {LQUA.LQNUM} in {LQUA.LGNUM}/{LQUA.LGTYP}/{LQUA.LGPLA} has stock {actual_value}.
  s4_area: warehouse_ewm
  s4_impact: blocking
  simplification_item: Warehouse Management (LE-WM) in Compatibility Scope, replaced by SAP EWM
  baseline: s4_target
- id: S4R-WM-TO-OPEN
  field: LTAP.PQUIT
  check_class: cross_field_check
  fail_when: '`LTAP.PQUIT`.isna()'
  applies_when:
    LTAP.KZQUI:
    - X
  severity: high
  dimension: completeness
  message: 'S/4HANA readiness: transfer order item that needs confirmation is still open - simplification item Warehouse Management
    (LE-WM) in Compatibility Scope'
  why_it_matters: Open transfer orders cannot be moved to EWM. They must be confirmed or cancelled before the cutover so that
    no stock is in transit.
  rule_authority: s4hana_migration
  sap_impact: Stock stays in the interim storage type and the warehouse cutover cannot be completed.
  fix_map:
    __other__: Confirm the transfer order (LT12) or cancel it (LT15) before the cutover.
  record_fix_template: Transfer order {LTAP.TANUM} item {LTAP.TAPOS} in warehouse {LTAP.LGNUM} is not confirmed.
  s4_area: warehouse_ewm
  s4_impact: blocking
  simplification_item: Warehouse Management (LE-WM) in Compatibility Scope, replaced by SAP EWM
  baseline: s4_target
- id: S4R-WM-INV-QUANT
  field: LQUA.IVNUM
  check_class: cross_field_check
  fail_when: '`LQUA.IVNUM`.notna()'
  severity: high
  dimension: completeness
  message: 'S/4HANA readiness: quant is in an open physical inventory document - simplification item Warehouse Management
    (LE-WM) in Compatibility Scope'
  why_it_matters: An open WM inventory document freezes the quant. The migration needs counted and posted stock with no inventory
    in progress.
  rule_authority: s4hana_migration
  sap_impact: The quant is locked by the inventory and its stock figure may change after the count, which breaks reconciliation.
  fix_map:
    __other__: Complete and post the physical inventory (LI11N, LI20) or cancel the inventory document before the migration.
  record_fix_template: Quant {LQUA.LQNUM} in {LQUA.LGNUM}/{LQUA.LGPLA} is in inventory document {LQUA.IVNUM}.
  s4_area: warehouse_ewm
  s4_impact: blocking
  simplification_item: Warehouse Management (LE-WM) in Compatibility Scope, replaced by SAP EWM
  baseline: s4_target
- id: S4R-WM-INV-BIN
  field: LAGP.KZINV
  check_class: cross_field_check
  fail_when: '`LAGP.KZINV`.notna()'
  severity: medium
  dimension: completeness
  message: 'S/4HANA readiness: storage bin has an active inventory indicator - simplification item Warehouse Management (LE-WM)
    in Compatibility Scope'
  why_it_matters: A bin with an inventory in progress cannot be migrated as a stable location. The indicator must be cleared
    by posting or cancelling the count.
  rule_authority: s4hana_migration
  sap_impact: The bin is blocked for movements until the inventory ends and its stock is not reconciled for the migration.
  fix_map:
    __other__: Finish the inventory for the bin (LI20) or reset the indicator by cancelling the inventory document.
  record_fix_template: Bin {LAGP.LGPLA} in {LAGP.LGNUM}/{LAGP.LGTYP} has an active inventory indicator.
  s4_area: warehouse_ewm
  s4_impact: blocking
  simplification_item: Warehouse Management (LE-WM) in Compatibility Scope, replaced by SAP EWM
  baseline: s4_target
- id: S4R-WM-QUANT-EXPIRED
  field: LQUA.VFDAT
  check_class: cross_field_check
  fail_when: '`LQUA.VFDAT` < @today'
  severity: low
  dimension: timeliness
  message: 'S/4HANA readiness: quant past its shelf-life date still in the warehouse (archive or scrap candidate)'
  why_it_matters: Expired stock migrated into EWM adds quants that cannot be picked. Scrap or return it first so that the
    migration moves only usable stock.
  rule_authority: s4hana_migration
  sap_impact: Expired quants inflate the migrated stock volume and the reconciliation, and block FEFO picking after the migration.
  fix_map:
    __other__: Scrap or return the expired stock (movement type 551) and clear the quant before the migration.
  record_fix_template: Quant {LQUA.LQNUM} in {LQUA.LGNUM}/{LQUA.LGPLA} is past its shelf-life date.
  s4_area: warehouse_ewm
  s4_impact: warning
  simplification_item: Warehouse Management (LE-WM) in Compatibility Scope, replaced by SAP EWM
  baseline: s4_target
- id: S4R-WM-LEIN-EMPTY
  field: LEIN.LGNUM
  check_class: exists_check
  fields:
  - LEIN.LGNUM
  - LEIN.LENUM
  target_table: LQUA
  target_fields:
  - LGNUM
  - LENUM
  severity: low
  dimension: consistency
  message: 'S/4HANA readiness: storage unit has no quant (archive candidate)'
  why_it_matters: A storage unit with no stock is left over from a past movement. The migration builds handling units from
    storage units, so an empty one creates a handling unit with no content.
  rule_authority: s4hana_migration
  sap_impact: The migration produces empty handling units that must be deleted again in EWM.
  fix_map:
    __other__: Delete the empty storage unit (LS32 or LT09 clean-up) before the migration.
  record_fix_template: Storage unit {LEIN.LENUM} in {LEIN.LGNUM} holds no quant.
  s4_area: warehouse_ewm
  s4_impact: warning
  simplification_item: Warehouse Management (LE-WM) in Compatibility Scope, replaced by SAP EWM
  baseline: s4_target
- id: S4R-WM-MLGT-BIN
  field: MLGT.LGNUM
  check_class: exists_check
  fields:
  - MLGT.LGNUM
  - MLGT.LGTYP
  - MLGT.LGPLA
  target_table: LAGP
  target_fields:
  - LGNUM
  - LGTYP
  - LGPLA
  applies_when:
    MLGT.LGPLA:
      populated: true
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: fixed bin of the material does not exist as a storage bin - simplification item Warehouse Management
    (LE-WM) in Compatibility Scope'
  why_it_matters: The fixed bin assignment is migrated to EWM as a product-specific bin assignment. A bin that does not exist
    cannot be loaded.
  rule_authority: s4hana_migration
  sap_impact: The storage type data of the material is rejected in the migration load.
  fix_map:
    __other__: Create the bin (LS01N) or correct the fixed bin in the material warehouse data (MM02).
  record_fix_template: Material {MLGT.MATNR} in {MLGT.LGNUM}/{MLGT.LGTYP} has fixed bin {MLGT.LGPLA} with no bin master.
  s4_area: warehouse_ewm
  s4_impact: blocking
  simplification_item: Warehouse Management (LE-WM) in Compatibility Scope, replaced by SAP EWM
  baseline: s4_target
- id: S4R-WM-QUANT-BLOCKED
  field: LQUA.GESME
  check_class: cross_field_check
  fail_when: ((`LQUA.SKZSA` == 'X') | (`LQUA.SKZSE` == 'X')) & (`LQUA.GESME` > 0)
  severity: medium
  dimension: completeness
  message: 'S/4HANA readiness: quant with stock is blocked for removal or putaway - simplification item Warehouse Management
    (LE-WM) in Compatibility Scope'
  why_it_matters: Stock blocks must be resolved or mapped to an EWM stock type before the load. A blocked quant with stock
    needs a decision on its target status.
  rule_authority: s4hana_migration
  sap_impact: Blocked stock is migrated as restricted stock and can distort availability after the cutover.
  fix_map:
    __other__: Release the block (LS02N or LQ02) or decide the EWM stock type for the blocked stock before the migration.
  record_fix_template: Quant {LQUA.LQNUM} in {LQUA.LGNUM}/{LQUA.LGPLA} is blocked and holds stock.
  s4_area: warehouse_ewm
  s4_impact: warning
  simplification_item: Warehouse Management (LE-WM) in Compatibility Scope, replaced by SAP EWM
  baseline: s4_target
- id: S4R-HCM-NACHN
  field: PA0002.NACHN
  check_class: null_check
  grain: PA0002
  s4_area: hcm
  s4_impact: blocking
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  applies_when:
    PA0002.ENDDA:
    - '99991231'
  severity: critical
  dimension: completeness
  message: 'S/4HANA readiness: employee has no last name, which the employee Business Partner requires - simplification item Business Partner Approach (SAP Note 2265093)'
  why_it_matters: Synchronising employees to Business Partners (HR integration to BP) builds the BP name from infotype 0002; a BP person needs a last name.
  rule_authority: s4hana_migration
  sap_impact: The employee Business Partner cannot be created, so employee vendor and travel integrations that depend on it fail.
  fix_map:
    __other__: Maintain the last name in PA30 infotype 0002 before the conversion.
  record_fix_template: Personnel number {PA0002.PERNR} has no last name. Maintain it in PA30 infotype 0002.
- id: S4R-HCM-LAND1
  field: PA0006.LAND1
  check_class: null_check
  grain: PA0006
  s4_area: hcm
  s4_impact: blocking
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  applies_when:
    PA0006.ENDDA:
    - '99991231'
    PA0006.SUBTY:
    - '1'
  severity: high
  dimension: completeness
  message: 'S/4HANA readiness: employee address has no country, which the Business Partner address requires - simplification item Business Partner Approach (SAP Note 2265093)'
  why_it_matters: The Business Partner address needs a country; the HR to BP synchronisation takes it from infotype 0006.
  rule_authority: s4hana_migration
  sap_impact: The employee Business Partner address cannot be created and synchronisation reports an error for the employee.
  fix_map:
    __other__: Maintain the country in PA30 infotype 0006.
  record_fix_template: Personnel number {PA0006.PERNR} has an address without a country. Maintain it in PA30 infotype 0006.
- id: S4R-HCM-ORT01
  field: PA0006.ORT01
  check_class: null_check
  grain: PA0006
  s4_area: hcm
  s4_impact: warning
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  applies_when:
    PA0006.ENDDA:
    - '99991231'
    PA0006.SUBTY:
    - '1'
  severity: medium
  dimension: completeness
  message: 'S/4HANA readiness: employee address has no city - simplification item Business Partner Approach (SAP Note 2265093)'
  why_it_matters: The Business Partner address carries a city; a blank city is accepted only with a warning by the synchronisation.
  rule_authority: s4hana_migration
  sap_impact: The employee Business Partner address is incomplete in the target.
  fix_map:
    __other__: Maintain the city in PA30 infotype 0006.
  record_fix_template: Personnel number {PA0006.PERNR} has an address without a city. Maintain it in PA30 infotype 0006.
- id: S4R-HCM-BANKS
  field: PA0009.BANKS
  check_class: null_check
  grain: PA0009
  s4_area: hcm
  s4_impact: blocking
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  applies_when:
    PA0009.ENDDA:
    - '99991231'
    PA0009.BANKN:
      populated: true
  severity: high
  dimension: completeness
  message: 'S/4HANA readiness: bank account has no bank country, which the Business Partner bank detail requires - simplification item Business Partner Approach (SAP Note 2265093)'
  why_it_matters: Bank details of the employee Business Partner are keyed by bank country and bank key.
  rule_authority: s4hana_migration
  sap_impact: The bank detail of the employee Business Partner cannot be created, so payments to the employee through the vendor side fail.
  fix_map:
    __blank__: Maintain the bank country in PA30 infotype 0009.
  record_fix_template: Personnel number {PA0009.PERNR} has an account number but no bank country. Maintain it in PA30 infotype 0009.
- id: S4R-HCM-SPRSL
  field: PA0002.SPRSL
  check_class: null_check
  grain: PA0002
  s4_area: hcm
  s4_impact: warning
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  applies_when:
    PA0002.ENDDA:
    - '99991231'
  severity: low
  dimension: completeness
  message: 'S/4HANA readiness: employee has no communication language - simplification item Business Partner Approach (SAP Note 2265093)'
  why_it_matters: The Business Partner correspondence language defaults from infotype 0002.
  rule_authority: s4hana_migration
  sap_impact: The employee Business Partner gets a default language, which can send correspondence in the wrong language.
  fix_map:
    __other__: Maintain the communication language in PA30 infotype 0002.
  record_fix_template: Personnel number {PA0002.PERNR} has no communication language. Maintain it in PA30 infotype 0002.
- id: S4R-HCM-GESCH
  field: PA0002.GESCH
  check_class: null_check
  grain: PA0002
  s4_area: hcm
  s4_impact: warning
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  applies_when:
    PA0002.ENDDA:
    - '99991231'
  severity: low
  dimension: completeness
  message: 'S/4HANA readiness: employee has no gender key - simplification item Business Partner Approach (SAP Note 2265093)'
  why_it_matters: The Business Partner person record maps the gender from infotype 0002.
  rule_authority: s4hana_migration
  sap_impact: The employee Business Partner is created with an unknown sex, which can fail statutory reporting that relies on it.
  fix_map:
