  record_fix_template: Personnel number {PA0001.PERNR} has no e-mail address in infotype 0105. Maintain it in PA30.
- id: S4R-HCM-ARCHIVE
  field: PA0001.PERNR
  check_class: cross_field_check
  grain: PA0001
  s4_area: hcm
  s4_impact: warning
  simplification_item: HCM compatibility pack (S4TWL HCM)
  baseline: s4_target
  fail_when: (@today - `PA0000.BEGDA`).dt.days > 3650
  require_populated: true
  applies_when:
    PA0001.ENDDA:
    - '99991231'
    PA0000.STAT2:
    - '0'
  severity: low
  dimension: timeliness
  message: 'S/4HANA readiness: employee left more than 10 years ago and is still in the live HR data - simplification item HCM compatibility pack (S4TWL HCM)'
  why_it_matters: Converting old leavers into S/4HANA HCM compatibility pack and the employee Business Partner adds records that no process uses.
  rule_authority: s4hana_migration
  sap_impact: Conversion and migration runtime grow and obsolete employee Business Partners are created; archive or exclude them first.
  fix_map:
    __other__: Archive the personnel number with the HR archiving objects (PA_CALC, PA_LDOC, PA_PIDX) or exclude it from the load.
  record_fix_template: Personnel number {PA0001.PERNR} left more than 10 years ago. Archive or exclude it before the conversion.
