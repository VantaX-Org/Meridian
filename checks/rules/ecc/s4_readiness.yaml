  field: PA0001.PERNR
  check_class: exists_check
  grain: PA0001
  s4_area: hcm
  s4_impact: warning
  simplification_item: Business Partner Approach (SAP Note 2265093)
  baseline: s4_target
  target_table: PA0105
  target_fields:
  - PERNR
  applies_when:
