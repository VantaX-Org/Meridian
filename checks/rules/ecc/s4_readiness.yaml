      warning: [AR045, AR046, AR019, AR047, AR048, AR073, AR074, AR201, AR209, AR222, AR250, SDSO209, SDCM222]
  sales:
    label: Sales and pricing
    simplification_item: SD Rebate Processing replaced by Settlement Management
    related:
      warning: [SDSO046, SDSO047, SDSO048, SDSO049, SDSO050, SDSO051, SDSO052, SDSO053, SDSO054, SDSO280, SDSO309]
  output_management:
    label: Output management
    simplification_item: Output Management - NAST output control replaced by S/4HANA Output Management
    related: {}
  foreign_trade:
    label: Foreign trade
    simplification_item: SD Foreign Trade replaced by SAP Global Trade Services
    related:
      warning: [MM369, MM376, MM377, MM092]
