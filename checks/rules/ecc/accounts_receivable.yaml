module: accounts_receivable
target_state: ECC_AND_S4HANA
rules:
  - id: AR001
    field: KNA1.KUNNR
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Customer number is mandatory — primary key for all customer transactions"
    why_it_matters: >-
      KUNNR is the primary key for all customer master records and every
      customer transaction in SAP. Without it, no sales orders (VA01),
      deliveries (VL01N), billing documents (VF01), or incoming payments
      (F-28) can be processed. In S/4HANA, customer records are mapped to
      Business Partners via CVI — records without KUNNR are rejected.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Customer cannot be used in VA01, VL01N, VF01, or any AR sub-ledger
      transaction. Migration conversion rejects the record. All downstream
      SD and FI-AR processes are blocked.
    fix_map:
      __blank__: >-
        In ECC: assign a customer number via T-code FD01 (create customer)
        or investigate the data source for the missing key. In S/4HANA:
        create via Fiori app F3893 (Manage Business Partner) using the
        customer role.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: KUNNR is {actual_value}. Assign a valid customer
      number via FD01 / Fiori app F3893 or correct the source data load.

  - id: AR002
    field: KNA1.KUNNR
    check_class: regex_check
    pattern: "^[A-Z0-9]{1,10}$"
    severity: critical
    dimension: validity
    message: "Customer number must be 1-10 alphanumeric characters"
    why_it_matters: >-
      Customer numbers must conform to the number range configuration (table
      TNRO, object DEBITOR). Non-conforming formats are rejected by the system
      and by the S/4HANA migration program. In S/4HANA, customer numbers are
      mapped to Business Partner numbers via CVI.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Customer rejected by number range validation. Unusable in VA01, VL01N,
      VF01, and automatic dunning program F150.
    fix_map:
      __other__: >-
        Customer number '{invalid_value}' does not match the required format.
        In ECC: use LSMW or a conversion program to reformat before migration.
        Coordinate with the basis team on number range configuration (T-code
        SNRO, object DEBITOR). In S/4HANA: use Fiori app F4596.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: number format is invalid (value: '{actual_value}').
      Reformat or assign a new number via SNRO / Fiori app F4596.

  - id: AR003
    field: KNA1.NAME1
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Customer name is mandatory — displayed on all sales and billing documents"
    why_it_matters: >-
      NAME1 is the primary customer name displayed on sales orders, delivery
      notes, invoices, and all printed correspondence. It is a mandatory field
      in both ECC and S/4HANA — the customer master cannot be saved without it.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Customer master cannot be saved. Sales orders, invoices, and dunning
      notices display blank customer name. Audit trail is broken for AR
      transactions.
    fix_map:
      __blank__: >-
        In ECC: obtain the legal entity name from the customer's business
        registration or existing contracts and set via T-code FD02 > Address
        tab. In S/4HANA: use Fiori app F3893 (Manage Business Partner).
    record_fix_template: >-
      Customer {KNA1.KUNNR}: NAME1 is {actual_value}. Set the customer name
      via FD02 / Fiori app F3893.


  - id: AR005
    field: KNA1.LAND1
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Country is mandatory — drives tax determination and output formatting"
    why_it_matters: >-
      LAND1 (country code) is a mandatory address field that drives tax
      determination, output language, postal formatting, and is required for
      all partner functions in SD and FI-AR. SAP rejects customer records
      without a country code on save.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Customer cannot be saved. Tax determination (FTXP) fails. Output
      determination (NACE) and all address-dependent processes produce errors.
    fix_map:
      __blank__: >-
        In ECC: determine the ISO country code from the customer's registered
        address and set via T-code FD02 > Address tab. In S/4HANA: use Fiori
        app F3893 (Manage Business Partner).
    record_fix_template: >-
      Customer {KNA1.KUNNR}: LAND1 is {actual_value}. Set the ISO country
      code via FD02 / Fiori app F3893.

  - id: AR006
    field: KNA1.LAND1
    check_class: regex_check
    pattern: "^[A-Z]{2}$"
    severity: critical
    dimension: validity
    message: "Country code must be a valid 2-letter ISO code"
    why_it_matters: >-
      Country codes must conform to ISO 3166-1 alpha-2 format (e.g., ZA, US,
      DE). Invalid country codes cause tax determination failures, incorrect
      output formatting, and are rejected by address validation.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Tax determination fails. Output determination produces errors. Address
      validation rejects the record.
    fix_map:
      __other__: >-
        Country code '{invalid_value}' is not a valid ISO 3166-1 alpha-2 code.
        In ECC: correct via T-code FD02 > Address tab. Valid codes are
        configured in table T005. In S/4HANA: use Fiori app F3893.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: LAND1 is '{actual_value}'. Set a valid 2-letter
      ISO country code via FD02 / Fiori app F3893.

  - id: AR007
    field: KNA1.STCD1
    check_class: cross_field_check
    severity: low
    dimension: completeness
    message: Customer has no tax identification (neither tax number 1 nor VAT registration number)
    why_it_matters: STCD1 (tax number 1) is required for VAT reporting, output tax calculation, and tax authority submissions.
      Without it, tax reports are incomplete and the company may face compliance penalties. Many jurisdictions require the customer's
      tax ID on invoices.
    rule_authority: best_practice
    sap_impact: VAT returns show incomplete customer tax data. Tax invoices cannot include the customer's tax registration number.
      Tax audit trail is incomplete.
    fix_map:
      __blank__: 'In ECC: obtain the customer''s VAT registration number or tax ID and set via T-code FD02 > General Data >
        Control tab. In S/4HANA: use Fiori app F3893 > Tax Numbers section.'
    record_fix_template: 'Customer {KNA1.KUNNR}: STCD1 is {actual_value}. Set the tax number via FD02 / Fiori app F3893.'
    fail_when: '`KNA1.STCD1`.isna() & `KNA1.STCEG`.isna()'
    applies_when:
      KNA1.STKZN:
        not_in:
        - X

  - id: AR008
    field: ADR6.SMTP_ADDR
    check_class: null_check
    severity: medium
    dimension: completeness
    message: "Email required for e-invoicing and automated statement delivery"
    why_it_matters: >-
      Email address is required for electronic invoicing, automated statement
      delivery, and customer communication. Without it, invoices and statements
      must be sent manually and e-invoicing workflows cannot be activated.
    rule_authority: best_practice
    sap_impact: >-
      Customer statements and invoices cannot be sent electronically. Dunning
      notices (F150 output) fall back to paper. E-invoicing integration is
      not possible.
    fix_map:
      __blank__: >-
        In ECC: obtain email from the customer or sales team and add via
        T-code FD02 > Address tab > Communication. In S/4HANA: use Fiori
        app F3893 > Address section.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: SMTP_ADDR is {actual_value}. Set the email
      address via FD02 / Fiori app F3893.

  - id: AR009
    field: KNA1.KTOKD
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Customer account group is mandatory — controls field status and number range"
    why_it_matters: >-
      KTOKD (account group) controls which fields are required, optional, or
      suppressed in the customer master and which number ranges apply. It
      determines the customer category (e.g., sold-to, ship-to, payer).
      Without it, the customer master record is structurally incomplete.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Customer master structure is undefined. Number range assignment fails.
      Field status rules cannot be applied. The record cannot be saved.
    fix_map:
      __blank__: >-
        In ECC: assign the account group via T-code FD02 > General Data.
        Common groups: KUND (sold-to), KUWE (ship-to), KURE (payer). In
        S/4HANA: use Fiori app F3893 via BP grouping.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: KTOKD is {actual_value}. Assign the customer
      account group via FD02 / Fiori app F3893.

  - id: AR010
    field: KNA1.LOEVM
    check_class: domain_value_check
    allowed_values: ["X", ""]
    severity: high
    dimension: validity
    message: "Central deletion flag must be X (marked) or empty (active)"
    why_it_matters: >-
      LOEVM flags the customer for central deletion. Customers marked for
      deletion should not receive new sales orders or billing documents.
      Incorrect flagging can cause active customers to be blocked from
      sales processing.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Customers flagged for deletion are excluded from sales processes (VA01).
      If incorrectly flagged, legitimate orders and invoices are blocked.
    valid_values_with_labels:
      "X": "Marked for deletion at central level"
      "": "Active — not marked for deletion"
    fix_map:
      __other__: >-
        Value '{invalid_value}' is not valid. Must be X (marked) or empty
        (active). In ECC: correct via T-code FD02 > General Data. In S/4HANA:
        use Fiori app F3893.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: LOEVM is '{actual_value}'. Set to X or empty
      via FD02 / Fiori app F3893.

  - id: AR011
    field: KNA1.SPERR
    check_class: domain_value_check
    allowed_values: ["X", ""]
    severity: high
    dimension: validity
    message: "Central posting block must be X (blocked) or empty (open)"
    why_it_matters: >-
      SPERR blocks all financial postings to this customer at the central
      level. When set, no invoices can be posted via VF01 and no incoming
      payments can be applied via F-28. This is used for customers under
      dispute or compliance review.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      All billing postings (VF01) and incoming payments (F-28) are blocked.
      If incorrectly set, legitimate AR processing is stopped.
    valid_values_with_labels:
      "X": "Central posting block active"
      "": "No posting block"
    fix_map:
      __other__: >-
        Value '{invalid_value}' is not valid. Must be X (blocked) or empty
        (open). In ECC: correct via T-code FD02 > General Data. In S/4HANA:
        use Fiori app F3893.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: SPERR is '{actual_value}'. Set to X or empty
      via FD02 / Fiori app F3893.

  - id: AR012
    field: KNA1.AUFSD
    check_class: domain_value_check
    severity: medium
    dimension: validity
    message: Order block must be a valid block code or empty
    why_it_matters: AUFSD controls order entry blocks at the customer level. When set, no new sales orders can be created for
      this customer in VA01. Valid values represent different block reasons (e.g., credit, delivery, general). Invalid values
      cause unpredictable blocking behaviour.
    rule_authority: sap_hard_constraint
    sap_impact: Sales order creation (VA01) is blocked. If the value is invalid, the system may reject the customer record or
      produce unpredictable results during order processing.
    valid_values_with_labels:
      ? ''
      : No order block
      '01': General order block
      '02': Credit block
      '03': Delivery block
    fix_map:
      __other__: 'Value ''{invalid_value}'' is not a valid order block code. Must be empty, 01, 02, or 03. In ECC: correct via
        T-code FD02 > Sales Data. In S/4HANA: use Fiori app F3893.'
    record_fix_template: 'Customer {KNA1.KUNNR}: AUFSD is ''{actual_value}''. Set to a valid block code or empty via FD02 /
      Fiori app F3893.'

  - id: AR013
    field: KNA1.LIFSD
    check_class: domain_value_check
    severity: medium
    dimension: validity
    message: Delivery block must be a valid block code or empty
    why_it_matters: LIFSD controls delivery blocks at the customer level. When set, no deliveries can be created for this customer
      in VL01N. Valid values represent different block reasons. Invalid values cause unpredictable delivery processing behaviour.
    rule_authority: sap_hard_constraint
    sap_impact: Delivery creation (VL01N) is blocked for this customer. Existing sales orders cannot be fulfilled.
    valid_values_with_labels:
      ? ''
      : No delivery block
      '01': General delivery block
      '02': Credit delivery block
    fix_map:
      __other__: 'Value ''{invalid_value}'' is not a valid delivery block code. Must be empty, 01, or 02. In ECC: correct via
        T-code FD02 > Sales Data. In S/4HANA: use Fiori app F3893.'
    record_fix_template: 'Customer {KNA1.KUNNR}: LIFSD is ''{actual_value}''. Set to a valid block code or empty via FD02 /
      Fiori app F3893.'

  - id: AR014
    field: KNA1.FAKSD
    check_class: domain_value_check
    severity: medium
    dimension: validity
    message: Billing block must be a valid block code or empty
    why_it_matters: FAKSD controls billing blocks at the customer level. When set, no billing documents can be created for this
      customer in VF01. Valid values represent different block reasons. Invalid values cause unpredictable billing behaviour.
    rule_authority: sap_hard_constraint
    sap_impact: Billing document creation (VF01) is blocked. Revenue recognition for this customer is delayed.
    valid_values_with_labels:
      ? ''
      : No billing block
      '01': General billing block
      '02': Credit billing block
    fix_map:
      __other__: 'Value ''{invalid_value}'' is not a valid billing block code. Must be empty, 01, or 02. In ECC: correct via
        T-code FD02 > Sales Data. In S/4HANA: use Fiori app F3893.'
    record_fix_template: 'Customer {KNA1.KUNNR}: FAKSD is ''{actual_value}''. Set to a valid block code or empty via FD02 /
      Fiori app F3893.'

  - id: AR015
    field: KNA1.SPRAS
    check_class: null_check
    severity: low
    dimension: completeness
    message: "Language key is recommended for output determination"
    why_it_matters: >-
      SPRAS (language key) determines the language for all customer
      correspondence including invoices, dunning notices, and order
      confirmations. Without it, output defaults to the system language,
      which may not be appropriate for international customers.
    rule_authority: best_practice
    sap_impact: >-
      Customer correspondence is generated in the system default language.
      International customers receive documents in the wrong language.
    fix_map:
      __blank__: >-
        In ECC: set the language key via T-code FD02 > General Data. In
        S/4HANA: use Fiori app F3893.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: SPRAS is {actual_value}. Set the language key
      via FD02 / Fiori app F3893.

  - id: AR016
    field: KNA1.TELF1
    check_class: null_check
    severity: low
    dimension: completeness
    message: "Telephone number is recommended for customer communication"
    why_it_matters: >-
      TELF1 (telephone number) supports customer communication for invoice
      queries, delivery coordination, and payment follow-up. Without it,
      sales and collections teams cannot contact the customer efficiently.
    rule_authority: best_practice
    sap_impact: >-
      No telephone contact available for customer queries. Collections
      follow-up and delivery coordination are slower.
    fix_map:
      __blank__: >-
        In ECC: set the telephone number via T-code FD02 > Address tab >
        Communication. In S/4HANA: use Fiori app F3893 > Address section.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: TELF1 is {actual_value}. Set the telephone
      number via FD02 / Fiori app F3893.

  - id: AR017
    field: KNA1.ERDAT
    check_class: null_check
    severity: low
    dimension: completeness
    message: "Creation date is missing — audit trail incomplete"
    why_it_matters: >-
      ERDAT (creation date) provides the audit trail for when the customer
      master was created. Missing creation dates make it impossible to
      determine the age of the record for data governance reviews.
    rule_authority: best_practice
    sap_impact: >-
      Audit trail is incomplete. Customer lifecycle reports cannot determine
      record age. Data governance reviews lack temporal context.
    fix_map:
      __blank__: >-
        Creation date is typically system-generated and should not be blank.
        This may indicate a data migration issue. In ECC: review the record
        via T-code FD03 (display customer). In S/4HANA: check via Fiori app
        F3893.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: ERDAT is {actual_value}. Review the record
      creation history via FD03 / Fiori app F3893.

  - id: AR018
    field: KNB1.AKONT
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Reconciliation account is mandatory — links AR sub-ledger to the general ledger"
    why_it_matters: >-
      AKONT (reconciliation account) is the GL account that receives all
      customer postings. Without it, the AR sub-ledger cannot be reconciled
      to the GL and all invoice postings for this customer will fail. This
      is the single most critical field in the customer company code segment.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      All postings to this customer fail in VF01 (billing) and F-28
      (incoming payment). AR sub-ledger cannot be reconciled. Period-end
      close for AR is blocked until corrected.
    fix_map:
      __blank__: >-
        In ECC: assign reconciliation account via T-code FD02 > Company Code
        Data > Account Management. Account must be a customer reconciliation
        account (MITKZ = D in FS00). In S/4HANA: use Fiori app F3893 >
        Company Code Data.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: AKONT is {actual_value}. Assign a customer
      reconciliation account via FD02 / Fiori app F3893.

  - id: AR019
    field: KNKK.KLIMK
    check_class: null_check
    severity: medium
    dimension: completeness
    message: Credit limit missing — customer has effectively unlimited credit exposure
    why_it_matters: KLIMK sets the maximum credit exposure allowed for this customer. Missing credit limit means the customer
      has effectively unlimited credit — a significant financial risk that will not be caught by the credit management check
      in VA01. The credit exposure report (S_ALR_87012215) shows no limit for this customer.
    rule_authority: best_practice
    sap_impact: Credit management check in VA01/VA02 always passes — no credit block is triggered regardless of outstanding
      receivables. FD32 credit overview is incomplete.
    fix_map:
      __blank__: 'In ECC: determine the appropriate credit limit based on the customer''s payment history and risk profile,
        and set via T-code FD32 (credit management) or FD02 > Company Code Data. In S/4HANA: use Fiori app F2712 (Manage Customer
        Credit Exposure) or F3893.'
    record_fix_template: 'Customer {KNA1.KUNNR}: KLIMK is {actual_value} — no credit limit set. Assign a credit limit via FD32
      / Fiori app F2712.'

  - id: AR020
    field: KNB5.MAHNA
    check_class: null_check
    severity: low
    dimension: completeness
    message: Dunning procedure missing — overdue invoices will not be automatically chased
    why_it_matters: MAHNS (dunning procedure) controls how overdue invoices are escalated through dunning levels. Without a
      dunning procedure, the customer is excluded from the automatic dunning run (F150) and overdue invoices are never systematically
      chased, increasing DSO.
    rule_authority: best_practice
    sap_impact: Customer excluded from dunning run F150. Overdue invoices are not automatically escalated. Days Sales Outstanding
      (DSO) increases.
    fix_map:
      __blank__: 'In ECC: set the appropriate dunning procedure via T-code FD02 > Company Code Data > Correspondence tab. Common
        values: 0001 (standard 4-level), 0002 (simplified 2-level). In S/4HANA: use Fiori app F3893.'
    record_fix_template: 'Customer {KNA1.KUNNR}: MAHNS is {actual_value}. Assign a dunning procedure via FD02 / Fiori app F3893.'

  - id: AR021
    field: KNB1.ZTERM
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Payment terms missing — affects invoice due date and dunning trigger"
    why_it_matters: >-
      ZTERM (payment terms) determines when a customer invoice is due and
      when dunning notices are triggered. Without payment terms, invoices
      have no defined due date, dunning cannot be executed, and cash flow
      forecasting is inaccurate.
    rule_authority: best_practice
    sap_impact: >-
      Invoice due date is undefined. Dunning program F150 cannot calculate
      overdue status. Cash flow forecasting in FF7A is inaccurate.
    fix_map:
      __blank__: >-
        In ECC: obtain the agreed payment terms from the sales contract and
        set via T-code FD02 > Company Code Data > Payment Transactions.
        Common values: 0001 (immediate), ZB30 (30 days net). In S/4HANA:
        use Fiori app F3893.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: ZTERM is {actual_value}. Set payment terms
      via FD02 / Fiori app F3893.



  - id: AR024
    field: KNA1.KUNNR
    check_class: cross_field_check
    severity: low
    dimension: consistency
    message: Customer with credit limit must have a dunning procedure assigned
    why_it_matters: When a customer has a credit limit (KLIMK) set, it indicates that credit risk is being managed. However,
      without a dunning procedure (MAHNS), overdue invoices for this customer are never systematically chased, undermining the
      purpose of the credit limit. Both fields should be maintained together for effective credit management.
    rule_authority: best_practice
    sap_impact: Credit limit is set but overdue invoices are not dunned. Credit exposure may exceed the limit without any automated
      follow-up. DSO increases for this customer.
    fix_map:
      __other__: 'Customer has a credit limit but no dunning procedure. In ECC: assign a dunning procedure via T-code FD02 >
        Company Code Data > Correspondence tab. In S/4HANA: use Fiori app F3893.'
    record_fix_template: 'Customer {KNA1.KUNNR}: credit limit is set but MAHNS is missing. Assign a dunning procedure via FD02
      / Fiori app F3893.'
    fail_when: (`KNKK.KLIMK` > 0) & `KNB5.MAHNA`.isna()

  - id: AR025
    field: KNA1.KUNNR
    check_class: uniqueness_check
    fields: [KNA1.KUNNR]
    severity: critical
    dimension: uniqueness
    message: Duplicate customer numbers detected — each customer must be unique
    why_it_matters: Duplicate customer numbers violate the primary key constraint. The migration program will reject
      duplicates, and any that slip through cause incorrect AR postings, double billing, and broken customer reporting.
      This typically indicates a data extraction or consolidation error.
    rule_authority: sap_hard_constraint
    sap_impact: Migration fails on duplicate key insert. Post-migration, duplicate customers cause double billing,
      incorrect AR aging, and broken customer reporting.
    fix_map: {__other__: 'Duplicate customer number detected. Identify the canonical record and merge or deactivate
        the duplicate. In ECC: review both records via T-code FD03 and merge outstanding items. In S/4HANA: use Fiori
        app F3893 and BP merge tools to consolidate.'}
    record_fix_template: 'Customer {KNA1.KUNNR}: duplicate detected. Review and merge via FD03 / Fiori app F3893.'


  - id: AR027
    field: KNA1.STCEG
    check_class: regex_check
    pattern: ^[A-Z]{2}[0-9A-Z]{5,15}$
    severity: high
    dimension: accuracy
    message: Customer VAT/tax registration number format is invalid
    why_it_matters: Invalid customer VAT numbers cause output tax reporting errors, rejected e-invoices, and audit findings.
    rule_authority: best_practice
    sap_impact: Output tax reports include invalid numbers. E-invoicing rejected. Audit flags non-compliant customer tax data.
    fix_map:
      __blank__: Correct the customer tax number via XD02 > Tax Information. Validate against the VIES or SARS database.
    applies_when:
      KNA1.LAND1:
      - AT
      - BE
      - BG
      - CY
      - CZ
      - DE
      - DK
      - EE
      - ES
      - FI
      - FR
      - GR
      - HR
      - HU
      - IE
      - IT
      - LT
      - LU
      - LV
      - MT
      - NL
      - PL
      - PT
      - RO
      - SE
      - SI
      - SK
    record_fix_template: "Customer {KNA1.KUNNR}: VAT registration number '{actual_value}' is not valid. Start with the 2-letter country code and correct it in XD02 > Control data."

  - id: AR028
    field: KNA1.KTOKD
    check_class: referential_check
    severity: critical
    dimension: consistency
    message: Customer account group KTOKD must reference a valid entry in T077D
    why_it_matters: KTOKD (customer account group) controls field selection, number range, and reconciliation account for a
      customer record. A KTOKD that isn't in T077D means the customer was created bypassing config or the group was deleted
      — XD02 cannot open the record and credit-management runs skip it. In S/4HANA, CVI migration rejects BPs whose customer
      role has an unknown KTOKD.
    rule_authority: best_practice
    sap_impact: Customer cannot be maintained (XD02), invoiced (VF01), or collected against. Migration conversion rejects the
      record. Account-group reporting shows gaps.
    fix_map:
      __blank__: Assign a valid customer account group via XD02 > General Data. For new customers the account group is mandatory
        at FD01 creation.
      __other__: Customer account group '{invalid_value}' is not defined in T077D. Reassign via XD02 or configure in SPRO >
        Financial Accounting > AR/AP > Customer Accounts > Master Data > Account Groups.
    record_fix_template: 'Customer {KNA1.KUNNR}: account group ''{actual_value}'' is not in T077D.'

  - id: XREC002
    field: KNB1.AKONT
    check_class: cross_field_check
    grain: KNB1
    fail_when: "`SKB1.MITKZ`.isna() | (`SKB1.MITKZ` != 'D')"
    applies_when:
      KNB1.AKONT: {populated: true}
    severity: critical
    dimension: consistency
    message: Reconciliation account is not a customer reconciliation account in this company code
    why_it_matters: Every posting to the customer is mirrored to KNB1.AKONT in the general ledger. SAP checks the
      account type on entry, but loaded or migrated records can point to an account that is missing in the company
      code or is not a customer reconciliation account (SKB1.MITKZ = 'D'), so the sub-ledger no longer reconciles.
    rule_authority: sap_hard_constraint
    sap_impact: Postings fail or land on the wrong G/L account; the customer sub-ledger does not reconcile to the G/L.
    fix_map:
      __other__: Set a valid customer reconciliation account (XD02, company code data; BP in S/4HANA), or correct the
        account's 'reconciliation account for account type' in FS00.
    record_fix_template: 'Customer company-code record {KNB1.BUKRS}: reconciliation account {KNB1.AKONT} is not a customer reconciliation account.'
  - id: XDUP004
    field: KNA1.STCEG
    check_class: uniqueness_check
    fields:
    - KNA1.STCEG
    - KNB1.BUKRS
    normalize: alnum
    severity: high
    dimension: uniqueness
    message: Several customers share the same VAT registration number
    why_it_matters: 'Two customer accounts with one VAT registration number are almost always the same legal entity created
      twice: credit exposure, dunning and sales history split across both.'
    rule_authority: best_practice
    sap_impact: Credit limit bypassed across accounts; duplicate customer masters.
    fix_map:
      __other__: Merge the duplicate customers or correct the VAT number.
    record_fix_template: Record {KNA1.STCEG} shares KNA1.STCEG with another record.
    grain: KNB1
    applies_when:
      KNB1.KNRZE:
        blank: true
  - id: XDUP005
    field: KNA1.STCD1
    check_class: uniqueness_check
    fields:
    - KNA1.STCD1
    - KNB1.BUKRS
    normalize: alnum
    severity: medium
    dimension: uniqueness
    message: Several customers share the same tax number 1
    why_it_matters: Two customer accounts with one tax number are almost always the same legal entity created twice.
    rule_authority: best_practice
    sap_impact: Duplicate customer masters; credit exposure split.
    fix_map:
      __other__: Merge the duplicate customers or correct the tax number.
    record_fix_template: Record {KNA1.STCD1} shares KNA1.STCD1 with another record.
    grain: KNB1
    applies_when:
      KNB1.KNRZE:
        blank: true
  - id: AR029
    field: KNB1.BUKRS
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Customer company code KNB1.BUKRS must exist in T001
    why_it_matters: Customer company-code data can only be posted in a company code that exists. Data kept for a company code
      that was removed from the configuration contradicts the organisational structure.
    rule_authority: best_practice
    sap_impact: The customer's company-code data is unreachable; open-item, dunning and credit reports show a non-existent
      company code.
    fix_map:
      __other__: Company code '{invalid_value}' is not defined in T001. Remove the obsolete company-code data.
    record_fix_template: 'Customer {KNB1.KUNNR}: company code ''{actual_value}'' does not exist in T001.'
  - id: AR030
    field: KNB1.ZTERM
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Customer payment terms KNB1.ZTERM must exist in T052
    why_it_matters: KNB1.ZTERM sets baseline date, cash discount and net due date of every FI invoice to the customer and
      the due date used by dunning. Terms that are not defined in T052 leave the items without a due date.
    rule_authority: best_practice
    sap_impact: Items fall due immediately; dunning, cash-discount handling and ageing are wrong for this customer.
    fix_map:
      __other__: Payment terms '{invalid_value}' are not defined in T052. Correct them in XD02/FD02 > Payment transactions
        or create the terms (OBB8).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: payment terms ''{actual_value}'' not in T052.'
  - id: AR031
    field: KNB1.ZWELS
    check_class: referential_check
    multi_value: chars
    severity: medium
    dimension: consistency
    message: Every payment method in KNB1.ZWELS must exist in T042Z
    why_it_matters: KNB1.ZWELS lists the payment methods the payment program may use for the customer (direct debit, refunds).
      Every character must be a payment method defined for the country in T042Z.
    rule_authority: best_practice
    sap_impact: F110 skips the customer's items for an undefined method; direct debits and refunds are not executed.
    fix_map:
      __other__: Payment method '{invalid_value}' is not defined in T042Z. Correct the list in XD02/FD02 > Payment transactions.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: payment methods ''{actual_value}'' contain a method
      not in T042Z.'
  - id: AR032
    field: KNB1.ZAHLS
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Customer payment block KNB1.ZAHLS must exist in T008
    why_it_matters: The payment block key decides whether F110 may collect (direct debit) or refund the customer's items.
      A key that is not defined in T008 has no meaning to the payment program.
    rule_authority: best_practice
    sap_impact: Direct debits or refunds are stopped without a documented reason, or released although a block was intended.
    fix_map:
      __other__: Payment block '{invalid_value}' is not defined in T008. Correct it in XD02/FD02 > Payment transactions.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: payment block ''{actual_value}'' not in T008.'
  - id: AR033
    field: KNB1.HBKID
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer house bank KNB1.HBKID must exist in T012
    why_it_matters: The house bank in the customer master tells the payment program which of the company's bank accounts collects
      direct debits from this customer. A house bank that is not defined cannot be used.
    rule_authority: best_practice
    sap_impact: Direct debits for the customer are left as exceptions in the payment run.
    fix_map:
      __other__: House bank '{invalid_value}' is not defined in T012. Correct it in XD02/FD02 > Payment transactions or remove
        it to let bank determination (FBZP) decide.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: house bank ''{actual_value}'' not in T012.'
  - id: AR034
    field: KNB1.FDGRV
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer planning group KNB1.FDGRV must exist in T035
    why_it_matters: The planning group places the customer's open items in cash management and the liquidity forecast. A group
      that is not defined drops the items out of the forecast.
    rule_authority: best_practice
    sap_impact: Cash position and liquidity forecast (FF7A/FF7B) understate incoming payments.
    fix_map:
      __other__: Planning group '{invalid_value}' is not defined in T035. Correct it in XD02/FD02 > Account management.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: planning group ''{actual_value}'' not in T035.'
  - id: AR035
    field: KNB1.SPERR
    check_class: domain_value_check
    allowed_values:
    - ''
    - X
    valid_values_with_labels:
      ? ''
      : No posting block in this company code
      X: Posting blocked in this company code
    severity: high
    dimension: validity
    message: Company-code posting block must be X (blocked) or empty (open)
    why_it_matters: KNB1.SPERR blocks postings to the customer in one company code. SAP only recognises X; any other value
      leaves the block state undefined.
    rule_authority: best_practice
    sap_impact: Invoices and payments may post to a customer the business meant to block, or be rejected for one it did not.
    fix_map:
      __other__: Set or clear the block in XD05/FD05 (BP company-code data in S/4HANA); never write other values by load.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: posting block ''{actual_value}'' is invalid.'
  - id: AR036
    field: KNB1.LOEVM
    check_class: domain_value_check
    allowed_values:
    - ''
    - X
    valid_values_with_labels:
      ? ''
      : Active in this company code
      X: Flagged for deletion in this company code
    severity: high
    dimension: validity
    message: Company-code deletion flag must be X (flagged) or empty
    why_it_matters: The company-code deletion flag queues the customer's company-code data for archiving. SAP only recognises
      X.
    rule_authority: best_practice
    sap_impact: Archiving and posting checks behave unpredictably for this company code.
    fix_map:
      __other__: Set or remove the flag in XD06/FD06; never write other values by load.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: deletion flag ''{actual_value}'' is invalid.'
  - id: AR037
    field: KNB1.XVERR
    check_class: cross_field_check
    grain: KNB1
    fail_when: '`KNA1.LIFNR`.isna()'
    applies_when:
      KNB1.XVERR:
      - X
    severity: medium
    dimension: consistency
    message: Clearing with vendor is switched on but the customer is not linked to a vendor
    why_it_matters: Offsetting a customer's receivables against the same partner's payables (F110, dunning) needs both the
      'clearing with vendor' indicator (KNB1.XVERR) and the vendor number in the customer's control data (KNA1.LIFNR). With
      the indicator alone nothing is offset.
    rule_authority: best_practice
    sap_impact: Receivables are dunned and payables paid in full although netting with the partner was agreed.
    fix_map:
      __other__: Enter the vendor number in XD02 > Control data (BP customer/vendor roles in S/4HANA), or remove the clearing
        indicator if no netting is agreed.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: clearing with vendor is set but no vendor is linked.'
  - id: AR038
    field: KNB1.KNRZE
    check_class: cross_field_check
    grain: KNB1
    fail_when: '`KNB1.KNRZE` == `KNB1.KUNNR`'
    applies_when:
      KNB1.KNRZE:
        populated: true
    severity: medium
    dimension: consistency
    message: Customer is entered as its own head office
    why_it_matters: KNB1.KNRZE turns the account into a branch whose items are posted to the head office. A customer that
      is its own head office is a self-reference with no meaning; it typically arrives by load and breaks the head office/branch
      logic for dunning, credit exposure and payment allocation.
    rule_authority: best_practice
    sap_impact: Branch items are not consolidated at a real head office; dunning and credit exposure run on the branch.
    fix_map:
      __other__: Clear the head office field or enter the real head office account in XD02 > Account management.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: head office is the customer itself.'
  - id: AR039
    field: KNB1.KNRZB
    check_class: cross_field_check
    grain: KNB1
    fail_when: '`KNB1.KNRZB` == `KNB1.KUNNR`'
    applies_when:
      KNB1.KNRZB:
        populated: true
    severity: low
    dimension: consistency
    message: Customer is entered as its own alternative payer in the company code
    why_it_matters: The alternative payer (KNB1.KNRZB) pays or is debited for the customer. Naming the customer itself is
      meaningless and usually hides a loading error in which the real payer was lost.
    rule_authority: best_practice
    sap_impact: Direct debits and payment advices are addressed to the customer although another payer was intended.
    fix_map:
      __other__: Enter the real alternative payer or clear the field in XD02 > Payment transactions.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: alternative payer is the customer itself.'
  - id: AR040
    field: KNA1.KNRZA
    check_class: cross_field_check
    fail_when: '`KNA1.KNRZA` == `KNA1.KUNNR`'
    applies_when:
      KNA1.KNRZA:
        populated: true
    severity: low
    dimension: consistency
    message: Customer is entered as its own alternative payer
    why_it_matters: The alternative payer (KNA1.KNRZA) pays or is debited for the customer in every company code. Naming the
      customer itself is meaningless and usually hides a loading error in which the real payer was lost.
    rule_authority: best_practice
    sap_impact: Direct debits and payment advices are addressed to the customer although another payer was intended.
    fix_map:
      __other__: Enter the real alternative payer or clear the field in XD02 > Payment transactions.
    record_fix_template: 'Customer {KNA1.KUNNR}: alternative payer is the customer itself.'
  - id: AR041
    field: KNB1.AKONT
    check_class: cross_field_check
    grain: KNB1
    fail_when: (`SKB1.XSPEB` == 'X') | (`SKB1.XLOEB` == 'X')
    applies_when:
      KNB1.AKONT:
        populated: true
    severity: high
    dimension: consistency
    message: Customer reconciliation account is blocked for posting or flagged for deletion in the company code
    why_it_matters: Every posting to the customer is also posted to its reconciliation account. When that G/L account is blocked
      for posting (SKB1.XSPEB) or flagged for deletion (SKB1.XLOEB) in the company code, SAP rejects every invoice, credit
      memo and incoming payment for the customer.
    rule_authority: sap_hard_constraint
    sap_impact: Billing documents are not released to accounting (VFX3); FB70, F-28 and lockbox postings fail with 'account
      blocked for posting'.
    fix_map:
      __other__: Assign an active customer reconciliation account (XD02, company code data; BP in S/4HANA), or lift the block
        on the G/L account in FS00 if it was set by mistake.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: reconciliation account {KNB1.AKONT} is blocked
      or flagged for deletion.'
  - id: AR042
    field: KNB5.MAHNA
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Customer dunning procedure KNB5.MAHNA must exist in T047A
    why_it_matters: The dunning procedure decides intervals, levels, charges and forms of every dunning run (F150). A procedure
      that is not defined in T047A is skipped by the dunning program.
    rule_authority: best_practice
    sap_impact: Overdue items are never dunned; DSO rises unnoticed.
    fix_map:
      __other__: Dunning procedure '{invalid_value}' is not defined in T047A. Correct it in XD02/FD02 > Correspondence.
    record_fix_template: 'Customer {KNB5.KUNNR}, company code {KNB5.BUKRS}: dunning procedure ''{actual_value}'' not in T047A.'
  - id: AR043
    field: KNB5.MANSP
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer dunning block KNB5.MANSP must exist in T040S
    why_it_matters: The dunning block key excludes the customer from dunning runs. A key that is not defined in T040S is not
      recognised by the dunning program.
    rule_authority: best_practice
    sap_impact: Overdue items are dunned or not dunned contrary to the intention.
    fix_map:
      __other__: Dunning block '{invalid_value}' is not defined in T040S. Correct it in XD02/FD02 > Correspondence.
    record_fix_template: 'Customer {KNB5.KUNNR}, company code {KNB5.BUKRS}: dunning block ''{actual_value}'' not in T040S.'
  - id: AR044
    field: KNKK.KKBER
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Credit control area KNKK.KKBER must exist in T014
    why_it_matters: Credit limits are kept per credit control area. Credit data for an area that does not exist is never read
      by the credit check of sales orders and deliveries.
    rule_authority: best_practice
    sap_impact: The customer's credit limit is not checked; orders release without credit control.
    fix_map:
      __other__: Credit control area '{invalid_value}' is not defined in T014. Re-create the credit data in the right area
        (FD32) and delete the obsolete record.
    record_fix_template: 'Customer {KNKK.KUNNR}: credit control area ''{actual_value}'' does not exist in T014.'
  - id: AR045
    field: KNKK.CTLPC
    check_class: null_check
    applies_when:
      KNKK.KLIMK:
        gt: 0
    severity: medium
    dimension: completeness
    message: Customer has a credit limit but no risk category
    why_it_matters: Automatic credit control (OVA8) is defined per credit control area, risk category and credit group. A
      customer with a credit limit but no risk category matches no credit-check rule, so the limit is never enforced on sales
      orders or deliveries.
    rule_authority: best_practice
    sap_impact: Sales orders and deliveries are not credit-checked; exposure can exceed the limit without a block.
    fix_map:
      __blank__: Assign the risk category in FD32 > Status (UKM_BP in S/4HANA credit management).
    record_fix_template: 'Customer {KNA1.KUNNR}: credit limit {KNKK.KLIMK} without a risk category.'
  - id: AR046
    field: KNKK.CTLPC
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Credit risk category KNKK.CTLPC must exist in T691A
    why_it_matters: The risk category selects the automatic credit-check rule (OVA8). A category that is not defined in T691A
      matches no rule, so the credit limit is not enforced.
    rule_authority: best_practice
    sap_impact: Sales orders and deliveries are not credit-checked for this customer.
    fix_map:
      __other__: Risk category '{invalid_value}' is not defined in T691A. Correct it in FD32 > Status.
    record_fix_template: 'Customer {KNA1.KUNNR}: risk category ''{actual_value}'' not in T691A.'
  - id: AR047
    field: KNKK.NXTRV
    check_class: cross_field_check
    fail_when: '`KNKK.NXTRV` < `KNKK.DTREV`'
    require_populated: true
    severity: low
    dimension: consistency
    message: Next internal credit review is dated before the last internal review
    why_it_matters: After a credit review (DTREV) the next review date (NXTRV) is set into the future. A next review before
      the last one means the review cycle was not maintained, and the 'next review date' credit check in OVA8 blocks orders
      against a date that has already passed.
    rule_authority: best_practice
    sap_impact: Orders are blocked by the review-date check, or reviews are not scheduled at all.
    fix_map:
      __other__: Set the next internal review date after the last review in FD32 > Status.
    record_fix_template: 'Customer {KNA1.KUNNR}: next review {KNKK.NXTRV} is before last review {KNKK.DTREV}.'
  - id: AR048
    field: KNKK.CRBLB
    check_class: domain_value_check
    allowed_values:
    - ''
    - X
    valid_values_with_labels:
      ? ''
      : Not blocked by credit management
      X: Blocked by credit management
    severity: medium
    dimension: validity
    message: Credit management block indicator must be X or empty
    why_it_matters: KNKK.CRBLB blocks the customer in credit management. SAP only recognises X; any other value leaves the
      block state undefined.
    rule_authority: best_practice
    sap_impact: Orders may be released for a customer credit management meant to block.
    fix_map:
      __other__: Set or clear the block in FD32 > Status; never write other values by load.
    record_fix_template: 'Customer {KNA1.KUNNR}: credit block indicator ''{actual_value}'' is invalid.'
  - id: AR049
    field: KNBK.BANKL
    check_class: cross_field_check
    fail_when: '`KNBK.BANKS`.notna() & (`KNBK.BANKL`.isna() | `KNBK.BANKN`.isna())'
    severity: high
    dimension: consistency
    message: Customer bank details are incomplete (bank country without bank key or account number)
    why_it_matters: Bank details are identified by bank country, bank key and account number. Without all three the payment
      program cannot create direct debits or refunds for the customer.
    rule_authority: best_practice
    sap_impact: Direct debits and refunds to this customer cannot be executed by F110.
    fix_map:
      __other__: Complete the bank details in XD02 > Payment transactions (BP bank details in S/4HANA).
    record_fix_template: 'Customer {KNA1.KUNNR}: bank details {KNBK.BANKS}/{KNBK.BANKL}/{KNBK.BANKN} are incomplete.'
  - id: AR050
    field: KNBK.BANKS
    check_class: referential_check
    grain: KNBK
    severity: medium
    dimension: consistency
    message: Customer bank country KNBK.BANKS must exist in T005
    why_it_matters: The bank country, with the bank key, identifies the customer's bank. A country that is not in T005 cannot
      be resolved to a bank directory entry or a payment format.
    rule_authority: best_practice
    sap_impact: Direct debits and refunds cannot be created for this bank account.
    fix_map:
      __other__: Bank country '{invalid_value}' is not defined in T005. Correct the bank details in XD02 > Payment transactions.
    record_fix_template: 'Customer {KNBK.KUNNR}: bank country ''{actual_value}'' not in T005.'
  - id: AR051
    field: KNBK.KOVON
    check_class: cross_field_check
    grain: KNBK
    fail_when: '`KNBK.KOVON` > `KNBK.KOBIS`'
    require_populated: true
    severity: medium
    dimension: consistency
    message: Bank details validity starts after it ends
    why_it_matters: Bank details are used for payment only inside their validity period (KOVON-KOBIS). A period that ends
      before it starts is never valid, so the bank account is silently unusable.
    rule_authority: best_practice
    sap_impact: Direct debits and refunds find no valid bank details for the customer.
    fix_map:
      __other__: Correct the validity dates of the bank details in XD02 > Payment transactions (BP in S/4HANA).
    record_fix_template: 'Customer {KNBK.KUNNR}: bank details valid from {KNBK.KOVON} to {KNBK.KOBIS}.'
  - id: AR052
    field: KNA1.LAND1
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Customer country KNA1.LAND1 must exist in T005
    why_it_matters: The customer's country drives tax determination, EC sales list, payment methods and address format. A
      country key that is not defined in T005 resolves none of them.
    rule_authority: best_practice
    sap_impact: Tax determination and statutory reporting fail; invoices carry an invalid address.
    fix_map:
      __other__: Country '{invalid_value}' is not defined in T005. Correct the customer address in XD02 (BP address in S/4HANA).
    record_fix_template: 'Customer {KNA1.KUNNR}: country ''{actual_value}'' not in T005.'
  - id: AR053
    field: KNA1.REGIO
    check_class: null_check
    applies_when:
      KNA1.LAND1:
      - US
      - CA
      - BR
      - IN
    severity: medium
    dimension: completeness
    message: Region (state/province) is missing for a customer in a country that requires it
    why_it_matters: 'In the United States, Canada, Brazil and India the region is part of every postal address and the key
      for tax: US/CA jurisdiction codes, Brazilian ICMS by state (UF) and Indian GST place of supply are all determined from
      it.'
    rule_authority: best_practice
    sap_impact: Output tax is determined with the wrong rate or not at all; invoices and e-invoicing (NF-e, GST e-invoice)
      are rejected.
    fix_map:
      __blank__: Maintain the region in XD02 > Address (BP address in S/4HANA).
    record_fix_template: 'Customer {KNA1.KUNNR}: region is {actual_value} for country {KNA1.LAND1}.'
  - id: AR054
    field: KNA1.REGIO
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Customer region KNA1.REGIO must exist in T005S
    why_it_matters: Regions are defined per country in T005S. A region code that does not exist cannot drive tax jurisdiction
      or address formatting.
    rule_authority: best_practice
    sap_impact: State-level tax determination and reporting fail for the customer.
    fix_map:
      __other__: Region '{invalid_value}' is not defined in T005S. Correct the customer address in XD02 (BP in S/4HANA).
    record_fix_template: 'Customer {KNA1.KUNNR}: region ''{actual_value}'' not in T005S.'
  - id: AR055
    field: KNA1.XCPDK
    check_class: domain_value_check
    allowed_values:
    - ''
    - X
    valid_values_with_labels:
      ? ''
      : Normal account
      X: One-time account
    severity: low
    dimension: validity
    message: One-time account indicator must be X or empty
    why_it_matters: KNA1.XCPDK marks an account whose name, address and bank data are entered per document (BSEC). SAP only
      recognises X; any other value leaves it unclear where the customer data lives.
    rule_authority: best_practice
    sap_impact: Invoices to one-time customers may use master data that does not exist, or ask for document data that is never
      entered.
    fix_map:
      __other__: Correct the indicator via the account group (XD02); one-time customers must use a one-time account group.
    record_fix_template: 'Customer {KNA1.KUNNR}: one-time indicator ''{actual_value}'' is invalid.'
  - id: AR056
    field: BSID.AUGBL
    check_class: cross_field_check
    grain: BSID
    fail_when: '`BSID.AUGBL`.notna() | `BSID.AUGDT`.notna()'
    severity: high
    dimension: consistency
    message: Open customer item carries a clearing document or clearing date
    why_it_matters: BSID is the secondary index of OPEN customer items; when an item is cleared SAP moves it to BSAD. An open-item
      row with clearing data means the index and the line item disagree, so the open-item list (FBL5N) and the account balance
      no longer match.
    rule_authority: sap_hard_constraint
    sap_impact: The item can be paid or dunned again although it is cleared, or never shows in FBL5N.
    fix_map:
      __other__: Run the FI comparative analysis (SAPF190) for the company code and fiscal year; if it reports differences,
        raise an SAP incident — secondary indexes are never edited by hand.
    record_fix_template: Open item {BSID.BUKRS}/{BSID.KUNNR} document {BSID.BELNR}/{BSID.GJAHR} item {BSID.BUZEI} carries clearing
      data.
  - id: AR057
    field: BSID.DMBTR
    check_class: cross_field_check
    grain: BSID
    fail_when: (`BSID.DMBTR` == 0) & (`BSID.WRBTR` != 0)
    severity: high
    dimension: accuracy
    message: Open customer item has a document-currency amount but zero in company-code currency
    why_it_matters: Every posted line item is translated into company-code currency. A zero local amount against a non-zero
      document amount means the translation failed (missing exchange rate, manual override), so the item is worth nothing in
      the ledger.
    rule_authority: sap_hard_constraint
    sap_impact: The sub-ledger and G/L balance in local currency understate the item; foreign-currency valuation (FAGL_FCV)
      and payment proposal amounts are wrong.
    fix_map:
      __other__: Check the exchange rate type and rate on the posting date (OB08); reverse and re-post the document with the
        correct translation.
    record_fix_template: 'Open item {BSID.BUKRS}/{BSID.KUNNR} document {BSID.BELNR}/{BSID.GJAHR} item {BSID.BUZEI}: amount {BSID.WRBTR}
      {BSID.WAERS} translates to 0.'
  - id: AR058
    field: BSID.HKONT
    check_class: cross_field_check
    grain: BSID
    fail_when: '`BSID.HKONT`.notna() & `KNB1.AKONT`.notna() & (`BSID.HKONT` != `KNB1.AKONT`)'
    applies_when:
      BSID.UMSKZ:
        blank: true
      BSID.BSTAT:
        not_in:
        - S
    severity: medium
    dimension: consistency
    message: Open customer item sits on a reconciliation account other than the customer's current one
    why_it_matters: Normal customer items post to the reconciliation account in the company-code master (KNB1.AKONT). When that
      account is changed, items posted before keep the old one, so the customer balance is split across reconciliation accounts
      until they are cleared or reposted.
    rule_authority: best_practice
    sap_impact: Balance-sheet reporting and the sub-ledger/G/L reconciliation (FAGLF03) show the balance under the wrong account;
      regrouping (FAGLF101) uses the wrong account.
    fix_map:
      __other__: 'Either restore the reconciliation account in the customer master or repost the open items to the new reconciliation
        account (SAP note ''Changing reconciliation account with open items'': program FAGL_MM_RECON / clear and re-post).'
    record_fix_template: Open item {BSID.BUKRS}/{BSID.KUNNR} document {BSID.BELNR}/{BSID.GJAHR} item {BSID.BUZEI} is on account
      {BSID.HKONT}; master says {KNB1.AKONT}.
  - id: AR059
    field: KNA1.LOEVM
    check_class: cross_field_check
    grain: BSID
    fail_when: (`KNA1.LOEVM` == 'X') | (`KNB1.LOEVM` == 'X')
    severity: high
    dimension: consistency
    message: Open item on a customer flagged for deletion
    why_it_matters: 'A customer marked for deletion is meant to be finished with. Open items on it are still owed or receivable:
      they will not be archived, are easily overlooked in reviews of active accounts, and payments or dunning may be blocked
      by the deletion flag.'
    rule_authority: best_practice
    sap_impact: Archiving of the customer fails; outstanding liabilities or receivables sit on a dead account.
    fix_map:
      __other__: Clear or settle the open items, or remove the deletion flag (XD06) until they are settled.
    record_fix_template: 'Open item {BSID.BUKRS}/{BSID.KUNNR} document {BSID.BELNR}/{BSID.GJAHR} item {BSID.BUZEI}: the customer
      is flagged for deletion.'
  - id: AR060
    field: BSID.ZFBDT
    check_class: null_check
    grain: BSID
    severity: medium
    dimension: completeness
    message: Open customer item has no baseline date for payment
    why_it_matters: The due date and every cash-discount date are computed from the baseline date. Without it the item has no
      due date.
    rule_authority: sap_hard_constraint
    sap_impact: Payment run (F110) and dunning (F150) cannot schedule the item; ageing reports misplace it.
    fix_map:
      __blank__: Maintain the baseline date on the item (FB02 / FBL1N-FBL5N change line items).
    record_fix_template: Open item {BSID.BUKRS}/{BSID.KUNNR} document {BSID.BELNR}/{BSID.GJAHR} item {BSID.BUZEI} has no baseline
      date.
  - id: AR061
    field: BSID.DMBTR
    check_class: cross_field_check
    grain: BSID
    fail_when: (`BSID.DMBTR` < 0) | (`BSID.WRBTR` < 0)
    severity: high
    dimension: validity
    message: Open customer item stores a negative amount
    why_it_matters: SAP stores line-item amounts unsigned; the debit/credit indicator (SHKZG) carries the sign. A negative stored
      amount double-negates the item in every total.
    rule_authority: sap_hard_constraint
    sap_impact: Balances, payment proposals and ageing net the item the wrong way.
    fix_map:
      __other__: 'The item was written outside the posting logic: raise an SAP incident and reverse / re-post the document.'
    record_fix_template: Open item {BSID.BUKRS}/{BSID.KUNNR} document {BSID.BELNR}/{BSID.GJAHR} item {BSID.BUZEI} stores a negative
      amount.
  - id: AR062
    field: BSID.ZBD2T
    check_class: cross_field_check
    grain: BSID
    fail_when: ((`BSID.ZBD2T` > 0) & (`BSID.ZBD2T` < `BSID.ZBD1T`)) | ((`BSID.ZBD3T` > 0) & (`BSID.ZBD3T` < `BSID.ZBD2T`))
    severity: medium
    dimension: consistency
    message: Open customer item's payment-term days are out of order
    why_it_matters: 'Cash-discount days 1 < days 2 < net days: each later period must be longer than the one before. Out-of-order
      days make the net due date fall before a discount date.'
    rule_authority: sap_hard_constraint
    sap_impact: Discount is taken after the net due date or the item is paid late; due-date analysis is wrong.
    fix_map:
      __other__: Correct the payment-term days on the item (FB02) or re-apply the payment term.
    record_fix_template: 'Open item {BSID.BUKRS}/{BSID.KUNNR} document {BSID.BELNR}/{BSID.GJAHR} item {BSID.BUZEI}: days {BSID.ZBD1T}
      / {BSID.ZBD2T} / {BSID.ZBD3T}.'
  - id: AR063
    field: BSID.ZLSPR
    check_class: referential_check
    grain: BSID
    severity: medium
    dimension: validity
    message: Open customer item's payment block reason is not defined (T008)
    why_it_matters: A payment block reason that is not configured cannot be released through the normal workflow and is not
      explained to whoever reviews the block.
    rule_authority: sap_hard_constraint
    sap_impact: The item is excluded from every payment run until someone notices and edits it.
    fix_map:
      __other__: Replace the block reason with one defined in T008 (OB27), or release the block.
    record_fix_template: 'Open item {BSID.BUKRS}/{BSID.KUNNR} document {BSID.BELNR}/{BSID.GJAHR} item {BSID.BUZEI}: payment
      block ''{actual_value}'' is not defined.'
  - id: AR064
    field: BSID.UMSKZ
    check_class: referential_check
    grain: BSID
    severity: medium
    dimension: validity
    message: Open customer item's special G/L indicator is not defined (T074U)
    why_it_matters: The special G/L indicator decides the alternative reconciliation account (down payments, guarantees, bills
      of exchange). One that is not configured has no account determination.
    rule_authority: sap_hard_constraint
    sap_impact: The item cannot be cleared through the special G/L transactions; balance-sheet classification is wrong.
    fix_map:
      __other__: Configure the indicator (OBYR / T074U) or repost the item without it.
    record_fix_template: 'Open item {BSID.BUKRS}/{BSID.KUNNR} document {BSID.BELNR}/{BSID.GJAHR} item {BSID.BUZEI}: special
      G/L indicator ''{actual_value}'' is not defined.'
  - id: AR065
    field: BSAD.AUGDT
    check_class: cross_field_check
    grain: BSAD
    fail_when: '`BSAD.AUGDT` < `BSAD.BUDAT`'
    severity: high
    dimension: consistency
    message: Cleared customer item was cleared before it was posted
    why_it_matters: An item can only be cleared on or after its posting date. A clearing date before the posting date means
      the clearing was back-dated incorrectly or the item data is corrupt.
    rule_authority: sap_hard_constraint
    sap_impact: Key-date open-item lists (as of a date between the two) omit an item that was open; ageing and payment-behaviour
      analysis are wrong.
    fix_map:
      __other__: Reset the clearing (FBRA) and clear again with a valid clearing date.
    record_fix_template: 'Cleared item {BSAD.BUKRS}/{BSAD.KUNNR} document {BSAD.BELNR}/{BSAD.GJAHR} item {BSAD.BUZEI}: cleared
      {BSAD.AUGDT}, posted {BSAD.BUDAT}.'
  - id: AR066
    field: BSAD.AUGBL
    check_class: cross_field_check
    grain: BSAD
    fail_when: '`BSAD.AUGBL`.isna() | `BSAD.AUGDT`.isna()'
    severity: high
    dimension: completeness
    message: Cleared customer item has no clearing document or clearing date
    why_it_matters: BSAD holds CLEARED items only; each carries the clearing document and date. A row without them cannot be
      traced to the payment or clearing that settled it.
    rule_authority: sap_hard_constraint
    sap_impact: 'The item is neither open nor traceably cleared: the audit trail from invoice to payment breaks.'
    fix_map:
      __other__: Run SAPF190 for the company code / year; raise an SAP incident if it reports differences.
    record_fix_template: Cleared item {BSAD.BUKRS}/{BSAD.KUNNR} document {BSAD.BELNR}/{BSAD.GJAHR} item {BSAD.BUZEI} has no
      clearing reference.
  - id: AR067
    field: BSID.MANSP
    check_class: referential_check
    grain: BSID
    severity: medium
    dimension: validity
    message: Open customer item's dunning block reason is not defined (T040S)
    why_it_matters: A dunning block reason that is not configured is not explained to collections and cannot be managed through
      the normal dunning-block reports.
    rule_authority: sap_hard_constraint
    sap_impact: The item is silently left out of every dunning run.
    fix_map:
      __other__: Replace the block with a reason defined in T040S, or release it.
    record_fix_template: 'Open item {BSID.BUKRS}/{BSID.KUNNR} document {BSID.BELNR}/{BSID.GJAHR}: dunning block ''{actual_value}''
      is not defined.'
  - id: AR068
    field: KNB1.KNRZE
    check_class: exists_check
    target_table: KNA1
    target_fields:
    - KUNNR
    target_when:
      LOEVM:
        blank: true
    severity: high
    dimension: consistency
    message: Head office account does not exist or is flagged for deletion
    why_it_matters: Branch accounts post their receivables to the head office account. A head office that is missing or flagged
      for deletion receives items nobody collects.
    rule_authority: sap_hard_constraint
    sap_impact: Dunning and payment allocation run against a dead account.
    fix_map:
      __other__: Point the branch to the current head office (XD02 > Company code > Account management), or remove the deletion
        flag.
    record_fix_template: 'Customer {KNB1.KUNNR} in company code {KNB1.BUKRS}: head office {KNB1.KNRZE} does not exist or is
      deleted.'
  - id: AR069
    field: KNA1.KNRZA
    check_class: exists_check
    target_table: KNA1
    target_fields:
    - KUNNR
    target_when:
      LOEVM:
        blank: true
    severity: high
    dimension: consistency
    message: Alternative payer does not exist or is flagged for deletion
    why_it_matters: Direct debits and incoming payments are drawn from the alternative payer; it must be a live customer account.
    rule_authority: sap_hard_constraint
    sap_impact: Direct debits fail or are drawn from an account that should no longer be charged.
    fix_map:
      __other__: Maintain a current alternative payer (XD02 > Payment transactions) or remove it.
    record_fix_template: 'Customer {KNA1.KUNNR}: alternative payer {KNA1.KNRZA} does not exist or is deleted.'
  - id: AR070
    field: KNKK.KNKLI
    check_class: exists_check
    grain: KNKK
    target_table: KNA1
    target_fields:
    - KUNNR
    target_when:
      LOEVM:
        blank: true
    severity: high
    dimension: consistency
    message: Credit account does not exist or is flagged for deletion
    why_it_matters: Credit exposure of several customers is pooled on the credit account; a missing or deleted credit account
      pools exposure on nothing.
    rule_authority: sap_hard_constraint
    sap_impact: Credit checks pass orders that exceed the group's real limit.
    fix_map:
      __other__: Assign a current credit account (FD32) or make the customer its own credit account.
    record_fix_template: 'Customer {KNKK.KUNNR} (credit area {KNKK.KKBER}): credit account {KNKK.KNKLI} does not exist or is
      deleted.'
  - id: S4-CVI-KNA1
    field: KNA1.KUNNR
    check_class: exists_check
    grain: KNA1
    applies_when:
      KNA1.LOEVM:
        blank: true
    target_table: CVI_CUST_LINK
    target_fields:
    - CUSTOMER
    baseline: s4_target
    severity: high
    dimension: consistency
    message: 'S/4HANA readiness: active customer has no Business Partner link (CVI_CUST_LINK) - simplification item S4TWL
      Business Partner Approach, SAP Note 2265093'
    why_it_matters: In S/4HANA the Business Partner is the only maintenance object for customers; KNA1 is kept in sync through
      Customer/Vendor Integration. The conversion pre-checks stop the system conversion while an active customer has no BP
      assigned in CVI_CUST_LINK.
    rule_authority: sap_hard_constraint
    sap_impact: The S/4HANA conversion is blocked until every active customer is synchronised to a Business Partner (MDS_LOAD_COCKPIT).
    fix_map:
      __other__: Synchronise the customer to a Business Partner with the CVI synchronisation cockpit (MDS_LOAD_COCKPIT), or
        flag it for deletion if it is no longer used.
    record_fix_template: 'Customer {KNA1.KUNNR} has no Business Partner in CVI_CUST_LINK.'
  - id: AR073
    field: KNKK.SKFOR
    check_class: cross_field_check
    grain: KNA1
    fail_when: (`KNKK.KLIMK` > 0) & ((`KNKK.SKFOR`.fillna(0) + `KNKK.SSOBL`.fillna(0)) > `KNKK.KLIMK`)
    require_populated: false
    applies_when:
      KNKK.KLIMK: {gt: 0}
    severity: high
    dimension: consistency
    message: Customer receivables plus special liabilities exceed the credit limit
    why_it_matters: >-
      Credit management blocks new orders when exposure exceeds the limit. Receivables already above
      the limit mean the limit was raised or bypassed after the fact, or deliveries were released
      manually. Either way the customer carries more unsecured risk than approved.
    rule_authority: best_practice
    sap_impact: Orders go onto credit block (VKM1); bad-debt provisioning understates the exposure.
    fix_map:
      __other__: Review exposure in FD32 / F.31 (S/4 FSCM UKM_BP / Manage Credit Accounts F4596); raise the limit with approval or stop shipments.
    record_fix_template: 'Customer {KNA1.KUNNR} (credit area {KNKK.KKBER}): exposure exceeds limit {KNKK.KLIMK}.'

  - id: AR071
    field: BSID.BELNR
    check_class: cross_field_check
    grain: BSID
    fail_when: (`KNA1.SPERR` == 'X') | (`KNB1.SPERR` == 'X')
    severity: medium
    dimension: consistency
    message: Customer is blocked for posting but still has open items
    why_it_matters: >-
      Incoming payments and clearing need a posting to the customer. With the account blocked, open
      receivables cannot be cleared and lock-box or bank-statement matching fails. The items age until
      written off.
    rule_authority: best_practice
    sap_impact: FF_5 / FEBAN cannot post the payment to the account; dunning still runs on the open items.
    fix_map:
      __other__: Review the items in FBL5N (S/4 Manage Customer Line Items F0711); clear, write off, or lift the block (XD05).
    record_fix_template: 'Customer {BSID.KUNNR} (company code {BSID.BUKRS}) is posting-blocked with open item {BSID.BELNR}/{BSID.GJAHR}.'

  - id: AR072
    field: BSID.BUDAT
    check_class: freshness_check
    max_age_hours: 8760
    applies_when:
      BSID.SHKZG: [H]
      BSID.UMSKZ: {blank: true}
    severity: medium
    dimension: timeliness
    message: Customer credit item (unapplied payment / credit memo) open for more than 12 months
    why_it_matters: >-
      A credit on a customer account is money owed to the customer, or a payment never matched to its
      invoice. Credits that are a year old understate receivables and, in many jurisdictions, become
      unclaimed property that must be reported.
    rule_authority: best_practice
    sap_impact: Receivables and dunning are distorted (invoices dunned although paid); escheatment obligations missed.
    fix_map:
      __other__: Match the credit to its invoices in F-32 (S/4 Clear Incoming Payments F0773) or refund it.
    record_fix_template: 'Customer {BSID.KUNNR} (company code {BSID.BUKRS}): credit item {BSID.BELNR}/{BSID.GJAHR} posted {BSID.BUDAT} is still open.'

  - id: AR075
    field: KNB1.XVERR
    check_class: cross_field_check
    grain: KNB1
    fail_when: '`KNB1.XVERR`.isna()'
    applies_when:
      KNA1.LIFNR: {populated: true}
    severity: low
    dimension: consistency
    message: Customer is linked to a vendor but clearing with the vendor is off
    why_it_matters: >-
      With the vendor link but no KNB1.XVERR, dunning and the payment run ignore the vendor balance.
      The customer is dunned for an amount the company itself owes them.
    rule_authority: best_practice
    sap_impact: Dunning letters and automatic debits ignore payables to the same party.
    fix_map:
      __blank__: Set "Clrg with vend." in XD02 > Company code > Payment transactions, or remove the link.
    record_fix_template: 'Customer {KNB1.KUNNR} in company code {KNB1.BUKRS} is linked to vendor {KNA1.LIFNR} but clearing is off.'

  - id: AR074
    field: KNKK.NXTRV
    check_class: freshness_check
    max_age_hours: 720
    applies_when:
      KNKK.KLIMK: {gt: 0}
    severity: low
    dimension: timeliness
    message: Credit limit's next review date passed more than 30 days ago
    why_it_matters: >-
      Credit limits are approved for a review cycle. A limit past its review date keeps granting
      credit on an assessment nobody has renewed.
    rule_authority: best_practice
    sap_impact: Credit checks (VKM1) pass against an outdated limit.
    fix_map:
      __other__: Review the customer in FD32 (S/4 F4596) and set the next review date.
    record_fix_template: 'Customer {KNA1.KUNNR} (credit area {KNKK.KKBER}): credit review was due {KNKK.NXTRV}.'
  - id: AR201
    field: KNKK.DTREV
    check_class: freshness_check
    max_age_hours: 17520
    applies_when:
      KNKK.KLIMK:
        gt: 0
    severity: low
    dimension: timeliness
    message: Customer credit limit has not been reviewed for more than two years
    why_it_matters: Credit policies require periodic review of limits. A limit whose last review is older than two years no
      longer reflects the customer's current financial position.
    rule_authority: best_practice
    sap_impact: Credit exposure is approved against an outdated assessment; bad-debt risk is understated.
    fix_map:
      __other__: Review the credit limit and update the last review date in FD32 > Status.
    record_fix_template: 'Customer {KNKK.KUNNR} (credit area {KNKK.KKBER}): last credit review {age_days} days ago.'
  - id: AR202
    field: BSID.ZFBDT
    check_class: freshness_check
    max_age_hours: 8760
    grain: BSID
    applies_when:
      BSID.UMSKZ:
        blank: true
    severity: medium
    dimension: timeliness
    message: Customer item has been open for more than a year
    why_it_matters: An invoice or payment still open a year after its baseline date is a doubtful receivable or an unapplied
      cash receipt. Auditors expect a bad-debt allowance or clearing for such items.
    rule_authority: best_practice
    sap_impact: Receivables and DSO are overstated; unapplied payments hide real overdue balances.
    fix_map:
      __other__: Clear the item with the matching payment (F-32), write it off, or provide for it as a doubtful receivable.
    record_fix_template: 'Open item {BSID.BUKRS}/{BSID.KUNNR} document {BSID.BELNR}/{BSID.GJAHR}: open for {age_days} days.'
  - id: AR203
    field: BSID.ZFBDT
    check_class: freshness_check
    max_age_hours: 2160
    grain: BSID
    applies_when:
      BSID.MANSP:
        populated: true
    severity: medium
    dimension: timeliness
    message: Customer item has been blocked for dunning for more than 90 days
    why_it_matters: A dunning block on an item is meant for a short dispute. Blocks that stay for months stop collection on
      overdue receivables without anyone following up.
    rule_authority: best_practice
    sap_impact: Overdue items are never dunned; cash collection is delayed and bad-debt risk grows.
    fix_map:
      __other__: Resolve the dispute and remove the dunning block from the item (FB02 > Dunning block).
    record_fix_template: 'Open item {BSID.BUKRS}/{BSID.KUNNR} document {BSID.BELNR}/{BSID.GJAHR}: dunning block {BSID.MANSP}
      for {age_days} days.'
  - id: AR204
    field: KNB1.LOEVM
    check_class: cross_field_check
    fail_when: (`KNB1.LOEVM` == 'X') & `KNB1.SPERR`.isna()
    severity: medium
    dimension: consistency
    message: Customer company code is flagged for deletion but not blocked for posting
    why_it_matters: The deletion flag only marks the account for archiving. Without a posting block, invoices and payments can
      still be posted to a customer the business has retired.
    rule_authority: best_practice
    sap_impact: Postings to retired customers; archiving fails because new documents keep appearing.
    fix_map:
      __other__: Set the company-code posting block (XD05) together with the deletion flag.
    record_fix_template: 'Customer {KNB1.KUNNR} in company code {KNB1.BUKRS}: flagged for deletion but not blocked for posting.'
  - id: AR205
    field: KNBK.BANKL
    check_class: exists_check
    fields:
    - KNBK.BANKS
    - KNBK.BANKL
    target_table: BNKA
    target_fields:
    - BANKS
    - BANKL
    target_when:
      LOEVM:
        blank: true
    severity: medium
    dimension: consistency
    message: Customer bank key does not exist in the bank directory or the bank is flagged for deletion
    why_it_matters: Direct debits and refunds read the bank data from the bank directory (BNKA). A customer bank key without
      a live BNKA entry produces payment files without a routable bank.
    rule_authority: sap_hard_constraint
    sap_impact: Direct debits and refunds to the customer fail or are rejected by the bank.
    fix_map:
      __other__: Create or reactivate the bank in FI01/FI02, or correct the customer bank key (XD02 > Payment transactions).
    record_fix_template: 'Customer {KNBK.KUNNR}: bank {KNBK.BANKS}/{KNBK.BANKL} is missing from the bank directory or deleted.'
  - id: AR206
    field: KNBK.KOBIS
    check_class: freshness_check
    max_age_hours: 0
    severity: low
    dimension: timeliness
    message: Customer bank details have expired (valid-to date in the past)
    why_it_matters: Bank details with a validity end date are ignored after that date. An expired entry is either dead data
      or a bank change that was never completed.
    rule_authority: best_practice
    sap_impact: Direct debit collection finds no valid bank and the receivable stays open.
    fix_map:
      __other__: Delete the expired bank details or maintain the replacement account (XD02 > Payment transactions).
    record_fix_template: 'Customer {KNBK.KUNNR}: bank details {KNBK.BANKS}/{KNBK.BANKL} expired {age_days} days ago.'
  - id: AR207
    field: BSID.WRBTR
    check_class: cross_field_check
    grain: BSID
    fail_when: (`BSID.WRBTR` == 0) & (`BSID.DMBTR` == 0)
    severity: low
    dimension: validity
    message: Open customer item has a zero amount
    why_it_matters: A zero line item settles nothing. It is typically left over from a reversed or split posting and clutters
      open item lists, dunning and the ageing report.
    rule_authority: best_practice
    sap_impact: Dead lines in open item lists and ageing reports.
    fix_map:
      __other__: Clear the zero item against itself (F-32) or with the related document.
    record_fix_template: 'Open item {BSID.BUKRS}/{BSID.KUNNR} document {BSID.BELNR}/{BSID.GJAHR}: zero amount.'
  - id: AR208
    field: KNB5.MAHNA
    check_class: cross_field_check
    fail_when: '`KNB5.MANSP`.notna() & `KNB5.MAHNA`.isna()'
    severity: low
    dimension: consistency
    message: Customer dunning block is set without a dunning procedure
    why_it_matters: A dunning block only means something together with a dunning procedure. A block on a customer that is never
      dunned points to incomplete or copied dunning data.
    rule_authority: best_practice
    sap_impact: The customer is never dunned and the block hides that dunning was never set up.
    fix_map:
      __other__: Maintain the dunning procedure or remove the dunning block (XD02 > Company code > Correspondence).
    record_fix_template: 'Customer {KNB5.KUNNR} in company code {KNB5.BUKRS}: dunning block {KNB5.MANSP} without procedure.'
  - id: AR209
    field: KNKK.KLIMK
    check_class: cross_field_check
    fail_when: (`KNKK.KLIMK` > 0) & `KNKK.NXTRV`.isna() & `KNKK.DTREV`.isna()
    severity: low
    dimension: completeness
    message: Customer has a credit limit that was never reviewed and has no review scheduled
    why_it_matters: A credit limit should be backed by a review (last review date) or at least a scheduled one. A limit with
      neither date was entered without a documented assessment.
    rule_authority: best_practice
    sap_impact: Credit is extended without an assessment trail; the credit review worklist never picks the customer up.
    fix_map:
      __other__: Record the review and schedule the next one in FD32 > Status.
    record_fix_template: 'Customer {KNKK.KUNNR} (credit area {KNKK.KKBER}): credit limit {KNKK.KLIMK} without any review date.'
  - id: S4-CVI-KNVK-CUST
    field: KNVK.PARNR
    check_class: exists_check
    grain: KNVK
    applies_when:
      KNVK.KUNNR:
        populated: true
      KNA1.LOEVM:
        blank: true
    target_table: CVI_CUST_CT_LINK
    target_fields:
    - CUSTOMER_CONT
    baseline: s4_target
    severity: high
    dimension: consistency
    message: 'S/4HANA readiness: contact person of an active customer has no Business Partner relationship (CVI_CUST_CT_LINK) - simplification item S4TWL Business Partner Approach, SAP Note 2265093'
    why_it_matters: In S/4HANA contact persons are Business Partners in a contact-person relationship with the customer's Business
      Partner. Customer/Vendor Integration converts KNVK contacts and records the link in CVI_CUST_CT_LINK; a contact without the link is
      not carried over.
    rule_authority: sap_hard_constraint
    sap_impact: The contact person is lost or must be recreated by hand after the S/4HANA conversion; the CVI pre-checks report
      the customer as not fully synchronised.
    fix_map:
      __other__: Activate contact-person synchronisation for the customer direction in CVI customizing and synchronise the customer
        with MDS_LOAD_COCKPIT, or delete the obsolete contact.
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR} has no Business Partner relationship in CVI_CUST_CT_LINK.'
  - id: S4-CVI-KTOKD-NUM
    field: KNA1.KTOKD
    check_class: exists_check
    grain: KNA1
    applies_when:
      KNA1.LOEVM:
        blank: true
    target_table: CVIC_CUST_TO_BP1
    target_fields:
    - ACCOUNT_GROUP
    baseline: s4_target
    severity: high
    dimension: consistency
    message: 'S/4HANA readiness: account group of an active customer has no Business Partner grouping (number assignment) assigned in CVI customizing (CVIC_CUST_TO_BP1) - simplification item S4TWL Business Partner Approach, SAP Note 2265093'
    why_it_matters: Customer/Vendor Integration derives each customer's Business Partner from its account group. Without an
      entry in CVIC_CUST_TO_BP1 for the account group, the synchronisation cannot create a Business Partner number and the customer cannot be converted.
    rule_authority: sap_hard_constraint
    sap_impact: The CVI synchronisation of every customer in this account group fails, which blocks the S/4HANA conversion.
    fix_map:
      __other__: Assign a Business Partner grouping (number assignment) to the account group in CVI customizing (SPRO > Cross-Application Components > Master Data Synchronization > Customer/Vendor Integration > Business Partner Settings > Settings for Customer Integration) before synchronising.
    record_fix_template: 'Customer {KNA1.KUNNR}: account group {KNA1.KTOKD} has no Business Partner grouping (number assignment) in CVIC_CUST_TO_BP1.'
  - id: S4-CVI-KTOKD-ROLE
    field: KNA1.KTOKD
    check_class: exists_check
    grain: KNA1
    applies_when:
      KNA1.LOEVM:
        blank: true
    target_table: CVIC_CUST_TO_BP2
    target_fields:
    - ACCOUNT_GROUP
    baseline: s4_target
    severity: high
    dimension: consistency
    message: 'S/4HANA readiness: account group of an active customer has no Business Partner role assigned in CVI customizing (CVIC_CUST_TO_BP2) - simplification item S4TWL Business Partner Approach, SAP Note 2265093'
    why_it_matters: Customer/Vendor Integration derives each customer's Business Partner from its account group. Without an
      entry in CVIC_CUST_TO_BP2 for the account group, the synchronisation cannot create the Business Partner in its role and the customer cannot be converted.
    rule_authority: sap_hard_constraint
    sap_impact: The CVI synchronisation of every customer in this account group fails, which blocks the S/4HANA conversion.
    fix_map:
      __other__: Assign a Business Partner role to the account group in CVI customizing (SPRO > Cross-Application Components > Master Data Synchronization > Customer/Vendor Integration > Business Partner Settings > Settings for Customer Integration) before synchronising.
    record_fix_template: 'Customer {KNA1.KUNNR}: account group {KNA1.KTOKD} has no Business Partner role in CVIC_CUST_TO_BP2.'
  - id: S4-CRM-KKBER
    field: KNKK.KKBER
    check_class: exists_check
    grain: KNKK
    applies_when:
      KNKK.KLIMK:
        gt: 0
    target_table: UKM_KKBER2SGM
    target_fields:
    - KKBER
    baseline: s4_target
    severity: high
    dimension: consistency
    message: 'S/4HANA readiness: credit control area with credit limits has no credit segment assigned (UKM_KKBER2SGM) -
      simplification item S4TWL Credit Management, SAP Note 2270544'
    why_it_matters: S/4HANA replaces FI-AR credit management (KNKK) with SAP Credit Management (FIN-FSCM-CR). The credit
      limits of each credit control area are migrated into the credit segment assigned to it; a credit control area without
      that assignment has nowhere to migrate to.
    rule_authority: sap_hard_constraint
    sap_impact: The credit master data migration of the S/4HANA conversion cannot carry the credit limit over; credit checks
      on sales orders stop after the conversion.
    fix_map:
      __other__: Define the credit segment and assign the credit control area to it (SPRO > Financial Supply Chain Management
        > Credit Management > Integration with Accounts Receivable Accounting and Sales and Distribution > Assign Credit
        Control Area and Credit Segment) before migrating credit data.
    record_fix_template: 'Customer {KNKK.KUNNR}: credit limit in credit control area {KNKK.KKBER}, which has no credit segment
      in UKM_KKBER2SGM.'
  - id: AR210
    field: KNA1.BRSCH
    check_class: referential_check
    severity: low
    dimension: validity
    message: Customer industry KNA1.BRSCH must exist in T016
    why_it_matters: The industry key classifies the customer for sales statistics (LIS/BW), pricing by industry and credit risk
      segmentation. A key that is not defined in T016 is ignored by every report that groups by industry.
    rule_authority: sap_hard_constraint
    sap_impact: Customers drop out of industry analyses and of condition records keyed by industry.
    fix_map:
      __other__: Choose a defined industry (XD02 > General data > Control data) or define the key in customising (Financial
        Accounting > AR/AP > Customer Accounts > Master Data > Industries).
    record_fix_template: 'Customer {KNA1.KUNNR}: industry key is not defined in T016.'
  - id: AR211
    field: KNA1.VBUND
    check_class: referential_check
    severity: high
    dimension: validity
    message: Customer trading partner KNA1.VBUND must exist in T880
    why_it_matters: The trading partner is copied into every receivable posted to an affiliated company and drives the intercompany
      elimination in consolidation. A company ID that is not defined in T880 cannot be eliminated.
    rule_authority: sap_hard_constraint
    sap_impact: Intercompany receivables are not eliminated in consolidation (EC-CS, BCS, Group Reporting); intercompany reconciliation
      (F.2B/ICR) leaves open differences.
    fix_map:
      __other__: Enter the correct company ID of the affiliated company (XD02 > Control data > Trading partner), or create it
        in T880 (transaction OX15).
    record_fix_template: 'Customer {KNA1.KUNNR}: trading partner {KNA1.VBUND} is not a company in T880.'
  - id: AR212
    field: KNA1.KUKLA
    check_class: referential_check
    severity: low
    dimension: validity
    message: Customer classification KNA1.KUKLA must exist in TKUKL
    why_it_matters: The customer classification (ABC customer, key account) is used in sales statistics, rebate and credit groupings.
      A value missing from TKUKL is not offered in any selection.
    rule_authority: best_practice
    sap_impact: The customer is missing from classification-based statistics and selections.
    fix_map:
      __other__: Choose a defined classification in XD02 > Sales area > Sales, or define it in customising (OVFH).
    record_fix_template: 'Customer {KNA1.KUNNR}: customer classification is not defined in TKUKL.'
  - id: AR213
    field: KNA1.TXJCD
    check_class: null_check
    applies_when:
      KNA1.LAND1:
      - US
      - CA
      KNA1.XCPDK:
        blank: true
    severity: high
    dimension: completeness
    message: Tax jurisdiction code is missing for a US or Canadian customer
    why_it_matters: In the US and Canada sales and use tax is calculated per jurisdiction (state, county, city). With an external
      tax system (Vertex, Sabrix, Avalara) or a jurisdiction-based tax procedure (TAXUSJ, TAXCAJ) SAP needs the customer's jurisdiction
      code to calculate tax on orders and invoices.
    rule_authority: regulatory
    sap_impact: Pricing in VA01 and billing in VF01 stop with a tax jurisdiction error, or tax is calculated for the wrong jurisdiction.
    fix_map:
      __other__: Determine the jurisdiction code from the address (XD02 > Address > Tax jurisdiction; the external tax system
        proposes it).
    record_fix_template: 'Customer {KNA1.KUNNR}: no tax jurisdiction code for country {KNA1.LAND1}.'
  - id: AR214
    field: KNA1.TXJCD
    check_class: referential_check
    severity: high
    dimension: validity
    message: Customer tax jurisdiction KNA1.TXJCD must exist in TTXJ
    why_it_matters: A jurisdiction code that is not defined for the country's tax procedure (TTXJ) cannot be passed to the tax
      calculation, so every taxable item for the customer errors out or is taxed at zero.
    rule_authority: sap_hard_constraint
    sap_impact: Billing documents fail tax determination or carry no sales tax.
    fix_map:
      __other__: Correct the jurisdiction code in XD02 > Address, or define it in customising (OBCP / external tax system).
    record_fix_template: 'Customer {KNA1.KUNNR}: tax jurisdiction code is not defined in TTXJ.'
  - id: AR215
    field: KNA1.FISKN
    check_class: exists_check
    grain: KNA1
    target_table: KNA1
    target_fields:
    - KUNNR
    target_when:
      LOEVM:
        blank: true
    severity: medium
    dimension: consistency
    message: Fiscal address account does not exist or is flagged for deletion
    why_it_matters: KNA1.FISKN points to the customer that holds the fiscal (tax) address used on tax returns and EC sales lists.
      If that account is missing or deleted, tax reports fall back to the customer's own address.
    rule_authority: sap_hard_constraint
    sap_impact: EC sales lists and VAT returns report the wrong address or tax number for the customer.
    fix_map:
      __other__: Point the fiscal address to an active account (XD02 > Control data > Fiscal address), or remove it.
    record_fix_template: 'Customer {KNA1.KUNNR}: fiscal address account {KNA1.FISKN} does not exist or is deleted.'
  - id: AR216
    field: KNA1.FISKN
    check_class: cross_field_check
    fail_when: '`KNA1.FISKN` == `KNA1.KUNNR`'
    applies_when:
      KNA1.FISKN:
        populated: true
    severity: low
    dimension: consistency
    message: Customer names itself as its own fiscal address account
    why_it_matters: The fiscal address field is only meaningful when it points to another account. A self-reference is a load
      artefact and hides a missing link to the real fiscal account.
    rule_authority: best_practice
    sap_impact: Tax reports cannot tell which account holds the fiscal address.
    fix_map:
      __other__: Clear the field or enter the account that really holds the fiscal address (XD02 > Control data).
    record_fix_template: 'Customer {KNA1.KUNNR}: fiscal address account points to itself.'
  - id: AR217
    field: KNA1.XCPDK
    check_class: exists_check
    fields:
    - KNA1.KTOKD
    applies_when:
      KNA1.XCPDK:
      - X
    target_table: T077D
    target_fields:
    - KTOKD
    target_when:
      XCPDS:
        populated: true
    negate: true
    severity: high
    dimension: consistency
    message: One-time indicator is set but the account group is not a one-time account group
    why_it_matters: 'SAP sets KNA1.XCPDK from the account group (T077D.XCPDS). A one-time flag under a normal account group
      means the record was loaded around the master data transaction: SAP asks for address data per document for an account
      that also carries master address data.'
    rule_authority: sap_hard_constraint
    sap_impact: Invoices and payments prompt for one-time data (BSEC) or ignore it; dunning and correspondence go to the wrong
      address.
    fix_map:
      __other__: Move the customer to a one-time account group (XD07) or clear the one-time flag through the account group.
    record_fix_template: 'Customer {KNA1.KUNNR}: one-time indicator set under account group {KNA1.KTOKD}, which is not a one-time
      group.'
  - id: AR218
    field: KNA1.XCPDK
    check_class: exists_check
    fields:
    - KNA1.KTOKD
    applies_when:
      KNA1.XCPDK:
        blank: true
    target_table: T077D
    target_fields:
    - KTOKD
    target_when:
      XCPDS:
        populated: true
    severity: high
    dimension: consistency
    message: Account group is a one-time account group but the one-time indicator is not set
    why_it_matters: Accounts in a one-time account group (T077D.XCPDS) must carry KNA1.XCPDK. Without it SAP treats the account
      as a normal customer and does not ask for name, address and bank data per document.
    rule_authority: sap_hard_constraint
    sap_impact: One-time invoices are posted without the customer's name and address (BSEC); payment and dunning cannot reach
      the customer.
    fix_map:
      __other__: Set the one-time indicator through the account group (XD07 / XD02), or move the account to a normal group.
    record_fix_template: 'Customer {KNA1.KUNNR}: account group {KNA1.KTOKD} is a one-time group but the one-time indicator is
      blank.'
  - id: AR219
    field: KNA1.XCPDK
    check_class: cross_field_check
    fail_when: (`KNA1.XCPDK` == 'X') & (`KNKK.KLIMK` > 0)
    severity: medium
    dimension: consistency
    message: One-time customer account has a credit limit
    why_it_matters: A one-time account collects many unrelated customers. A credit limit on it is shared by all of them, so
      credit management says nothing about any single customer.
    rule_authority: best_practice
    sap_impact: Credit checks on one-time orders pass or block every one-time customer together.
    fix_map:
      __other__: Remove the credit limit from the one-time account (FD32) and sell to recurring customers on their own accounts.
    record_fix_template: 'One-time customer {KNA1.KUNNR}: carries a credit limit in credit control area {KNKK.KKBER}.'
  - id: AR220
    field: KNA1.XCPDK
    check_class: exists_check
    fields:
    - KNA1.KUNNR
    applies_when:
      KNA1.XCPDK:
      - X
    target_table: KNBK
    target_fields:
    - KUNNR
    negate: true
    grain: KNA1
    severity: medium
    dimension: consistency
    message: One-time customer account has bank details in the master record
    why_it_matters: For one-time accounts the bank details are entered per document (BSEC). Bank details on the master record
      are used for every one-time customer, so direct debits and refunds go to one stored account.
    rule_authority: best_practice
    sap_impact: Refunds and direct debits for one-time customers use a bank account that belongs to somebody else.
    fix_map:
      __other__: Delete the bank details from the one-time account (XD02 > Payment transactions).
    record_fix_template: 'One-time customer {KNA1.KUNNR}: has bank details in the master record.'
  - id: AR221
    field: KNA1.LOEVM
    check_class: cross_field_check
    fail_when: (`KNA1.LOEVM` == 'X') & `KNA1.SPERR`.isna()
    severity: medium
    dimension: consistency
    message: Customer is flagged for deletion centrally but not blocked for posting centrally
    why_it_matters: The central deletion flag only marks the account for archiving. Without the central posting block (KNA1.SPERR)
      invoices and payments can still be posted in every company code.
    rule_authority: best_practice
    sap_impact: Postings to retired customers; archiving (FI_ACCRECV) fails because new documents keep appearing.
    fix_map:
      __other__: Set the central posting block together with the deletion flag (XD05, XD06).
    record_fix_template: 'Customer {KNA1.KUNNR}: flagged for deletion centrally but not blocked for posting.'
  - id: AR222
    field: KNA1.LOEVM
    check_class: cross_field_check
    fail_when: (`KNA1.LOEVM` == 'X') & (`KNKK.KLIMK` > 0)
    severity: medium
    dimension: consistency
    message: Customer is flagged for deletion but still has a credit limit
    why_it_matters: A retired customer keeps its credit limit in KNKK. The limit still counts in credit exposure reports and
      can be inherited when the credit account is reused for another customer.
    rule_authority: best_practice
    sap_impact: Credit reports (F.31, FD33) overstate the credit granted; the deleted account blocks credit master archiving.
    fix_map:
      __other__: Set the credit limit to zero (FD32) before flagging the customer for deletion.
    record_fix_template: 'Customer {KNA1.KUNNR}: flagged for deletion, credit limit still set in credit control area {KNKK.KKBER}.'
  - id: AR223
    field: KNA1.NODEL
    check_class: cross_field_check
    fail_when: (`KNA1.NODEL` == 'X') & (`KNA1.LOEVM` == 'X')
    severity: high
    dimension: consistency
    message: Customer has the central deletion block and is also flagged for deletion
    why_it_matters: 'KNA1.NODEL forbids deletion of the account; KNA1.LOEVM requests it. Both together cannot be processed:
      archiving rejects the account and the business intent is unclear.'
    rule_authority: sap_hard_constraint
    sap_impact: The account can never be archived; the deletion flag gives a false picture of the active customer base.
    fix_map:
      __other__: 'Decide which is right: remove the deletion block or the deletion flag (XD06).'
    record_fix_template: 'Customer {KNA1.KUNNR}: deletion block and deletion flag are both set centrally.'
  - id: AR224
    field: KNB1.NODEL
    check_class: cross_field_check
    fail_when: (`KNB1.NODEL` == 'X') & (`KNB1.LOEVM` == 'X')
    severity: high
    dimension: consistency
    message: Customer company code has the deletion block and is also flagged for deletion
    why_it_matters: KNB1.NODEL forbids deletion of the company code data; KNB1.LOEVM requests it. The two flags contradict each
      other, so archiving rejects the account in the company code.
    rule_authority: sap_hard_constraint
    sap_impact: Company code data can never be archived; the deletion flag misstates the active customer base in the company
      code.
    fix_map:
      __other__: Remove either the deletion block or the deletion flag in the company code (XD06).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: deletion block and deletion flag are both set.'
  - id: AR225
    field: KNB1.LOEVM
    check_class: cross_field_check
    fail_when: (`KNA1.LOEVM` == 'X') & `KNB1.LOEVM`.isna()
    grain: KNB1
    severity: medium
    dimension: consistency
    message: Customer is flagged for deletion centrally but the company code data is not
    why_it_matters: XD06 with 'all areas' sets the deletion flag on every company code. A central flag with an unflagged company
      code means the flags were set or loaded piecemeal; FI reports that read KNB1 still treat the customer as active.
    rule_authority: best_practice
    sap_impact: Archiving of the customer (FI_ACCRECV) skips the company code; open-item and dunning selections keep the retired
      customer.
    fix_map:
      __other__: Flag the company code data for deletion as well (XD06), or remove the central flag if it was set in error.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: deleted centrally but not in the company code.'
  - id: AR226
    field: KNB1.SPERR
    check_class: cross_field_check
    fail_when: (`KNA1.SPERR` == 'X') & `KNB1.SPERR`.isna()
    grain: KNB1
    severity: low
    dimension: consistency
    message: Customer is blocked for posting centrally but not in the company code
    why_it_matters: The central posting block (KNA1.SPERR) already stops postings in every company code. A company code without
      its own block shows the account as open in KNB1-based reports and interfaces (lockbox, middleware, MDG replication).
    rule_authority: best_practice
    sap_impact: Collectors and interfaces that read the company code block keep working a blocked customer.
    fix_map:
      __other__: Set the posting block for the company codes as well (XD05 > all company codes).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: blocked centrally but not in the company code.'
  - id: AR227
    field: KNA1.ADRNR
    check_class: exists_check
    grain: KNA1
    target_table: ADRC
    target_fields:
    - ADDRNUMBER
    severity: high
    dimension: consistency
    message: Customer address number does not exist in central address management (ADRC)
    why_it_matters: 'Since release 4.0 the customer address lives in ADRC; KNA1 only keeps a copy. A KNA1.ADRNR without an ADRC
      record means the customer has no maintainable address: XD03 shows it empty and output, tax and CVI conversion read nothing.'
    rule_authority: sap_hard_constraint
    sap_impact: Invoices and dunning letters print without an address; CVI synchronisation to the business partner fails on
      the address.
    fix_map:
      __other__: Re-create the address in XD02 (the transaction writes ADRC), or repair it with report RSADRLSM02 / address
        consistency tools.
    record_fix_template: 'Customer {KNA1.KUNNR}: address number {KNA1.ADRNR} has no record in ADRC.'
  - id: AR228
    field: KNA1.LAND1
    check_class: cross_field_check
    fail_when: '`KNA1.LAND1` != `ADRC.COUNTRY`'
    require_populated: true
    severity: high
    dimension: consistency
    message: Customer country in KNA1 differs from the central address (ADRC)
    why_it_matters: KNA1.LAND1 is a redundant copy of ADRC.COUNTRY, written by the customer transactions. A difference means
      one side was loaded or changed directly in the tables. Output and the address screen read ADRC, while tax, reporting and
      many interfaces read KNA1.
    rule_authority: sap_hard_constraint
    sap_impact: Documents print one country while tax determination, statistics and interfaces use another; CVI conversion carries
      the ADRC value into the business partner.
    fix_map:
      __other__: Re-save the address in XD02 so KNA1 and ADRC are written together, after confirming which value is right.
    record_fix_template: 'Customer {KNA1.KUNNR}: country in KNA1 differs from the central address {KNA1.ADRNR}.'
  - id: AR229
    field: KNA1.PSTLZ
    check_class: cross_field_check
    fail_when: '`KNA1.PSTLZ` != `ADRC.POST_CODE1`'
    require_populated: true
    severity: medium
    dimension: consistency
    message: Customer postal code in KNA1 differs from the central address (ADRC)
    why_it_matters: KNA1.PSTLZ is a redundant copy of ADRC.POST_CODE1, written by the customer transactions. A difference means
      one side was loaded or changed directly in the tables. Output and the address screen read ADRC, while tax, reporting and
      many interfaces read KNA1.
    rule_authority: sap_hard_constraint
    sap_impact: Documents print one postal code while tax determination, statistics and interfaces use another; CVI conversion
      carries the ADRC value into the business partner.
    fix_map:
      __other__: Re-save the address in XD02 so KNA1 and ADRC are written together, after confirming which value is right.
    record_fix_template: 'Customer {KNA1.KUNNR}: postal code in KNA1 differs from the central address {KNA1.ADRNR}.'
  - id: AR230
    field: KNA1.ORT01
    check_class: cross_field_check
    fail_when: '`KNA1.ORT01` != `ADRC.CITY1`'
    require_populated: true
    severity: medium
    dimension: consistency
    message: Customer city in KNA1 differs from the central address (ADRC)
    why_it_matters: KNA1.ORT01 is a redundant copy of ADRC.CITY1, written by the customer transactions. A difference means one
      side was loaded or changed directly in the tables. Output and the address screen read ADRC, while tax, reporting and many
      interfaces read KNA1.
    rule_authority: sap_hard_constraint
    sap_impact: Documents print one city while tax determination, statistics and interfaces use another; CVI conversion carries
      the ADRC value into the business partner.
    fix_map:
      __other__: Re-save the address in XD02 so KNA1 and ADRC are written together, after confirming which value is right.
    record_fix_template: 'Customer {KNA1.KUNNR}: city in KNA1 differs from the central address {KNA1.ADRNR}.'
  - id: AR231
    field: KNA1.REGIO
    check_class: cross_field_check
    fail_when: '`KNA1.REGIO` != `ADRC.REGION`'
    require_populated: true
    severity: medium
    dimension: consistency
    message: Customer region in KNA1 differs from the central address (ADRC)
    why_it_matters: KNA1.REGIO is a redundant copy of ADRC.REGION, written by the customer transactions. A difference means
      one side was loaded or changed directly in the tables. Output and the address screen read ADRC, while tax, reporting and
      many interfaces read KNA1.
    rule_authority: sap_hard_constraint
    sap_impact: Documents print one region while tax determination, statistics and interfaces use another; CVI conversion carries
      the ADRC value into the business partner.
    fix_map:
      __other__: Re-save the address in XD02 so KNA1 and ADRC are written together, after confirming which value is right.
    record_fix_template: 'Customer {KNA1.KUNNR}: region in KNA1 differs from the central address {KNA1.ADRNR}.'
  - id: AR232
    field: KNA1.PFACH
    check_class: cross_field_check
    fail_when: '`KNA1.PFACH`.notna() & `KNA1.PSTL2`.isna()'
    severity: low
    dimension: completeness
    message: Customer has a PO box but no PO box postal code
    why_it_matters: In most countries a PO box has its own postal code (KNA1.PSTL2). Without it the PO box address cannot be
      validated and postal software rejects it; SAP's postal code check (T005) does not run on it.
    rule_authority: best_practice
    sap_impact: Payment advices, statements and dunning letters sent to the PO box are returned.
    fix_map:
      __other__: Enter the PO box postal code in XD02 > Address, or remove the PO box if it is not used.
    record_fix_template: 'Customer {KNA1.KUNNR}: PO box without a PO box postal code.'
  - id: AR233
    field: KNA1.STCD3
    check_class: regex_check
    pattern: ^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$
    applies_when:
      KNA1.LAND1:
      - IN
    severity: high
    dimension: validity
    message: Indian GSTIN in tax number 3 has the wrong format
    why_it_matters: Under Indian GST the 15-character GSTIN (state code, PAN, entity number, Z, check character) is stored in
      tax number 3. E-invoicing (IRN), e-way bills and GSTR-1 reject an invoice whose buyer GSTIN is malformed.
    rule_authority: regulatory
    sap_impact: E-invoices are rejected by the invoice registration portal; the customer cannot claim input tax credit.
    fix_map:
      __other__: Correct the GSTIN in XD02 > Control data > Tax number 3.
    record_fix_template: 'Customer {KNA1.KUNNR}: tax number 3 is not a valid GSTIN.'
  - id: AR234
    field: KNA1.STCD2
    check_class: uniqueness_check
    fields:
    - KNA1.LAND1
    - KNA1.STCD2
    normalize: alnum
    grain: KNA1
    applies_when:
      KNA1.LOEVM:
        blank: true
    severity: medium
    dimension: uniqueness
    message: Several customers share the same tax number 2 in the same country
    why_it_matters: Tax number 2 identifies the legal entity (for example a VAT or GST registration). Two accounts with the
      same number in one country are almost always the same customer created twice.
    rule_authority: best_practice
    sap_impact: Credit exposure and open items are split across duplicate accounts; tax reports list one registration under
      two customers.
    fix_map:
      __other__: Merge the duplicate customers (block and flag the redundant one, move open items) or correct the number.
    record_fix_template: 'Customer {KNA1.KUNNR}: tax number 2 is shared with another customer in the same country.'
  - id: AR235
    field: KNA1.STCD3
    check_class: uniqueness_check
    fields:
    - KNA1.LAND1
    - KNA1.STCD3
    normalize: alnum
    grain: KNA1
    applies_when:
      KNA1.LOEVM:
        blank: true
    severity: medium
    dimension: uniqueness
    message: Several customers share the same tax number 3 in the same country
    why_it_matters: Tax number 3 identifies the legal entity (for example a VAT or GST registration). Two accounts with the
      same number in one country are almost always the same customer created twice.
    rule_authority: best_practice
    sap_impact: Credit exposure and open items are split across duplicate accounts; tax reports list one registration under
      two customers.
    fix_map:
      __other__: Merge the duplicate customers (block and flag the redundant one, move open items) or correct the number.
    record_fix_template: 'Customer {KNA1.KUNNR}: tax number 3 is shared with another customer in the same country.'
  - id: AR236
    field: KNA1.NAME1
    check_class: similarity_check
    block_by:
    - KNA1.LAND1
    - KNA1.ORT01
    threshold: 0.9
    exact_rule: false
    evidence_key: KNA1.KUNNR
    grain: KNA1
    applies_when:
      KNA1.LOEVM:
        blank: true
    severity: medium
    dimension: uniqueness
    message: 'Possible duplicate customer: near-identical name in the same country and city'
    why_it_matters: Customers created twice under different postal codes or with a typo escape the exact name and postal code
      check. Comparing names within one city finds them. Only account numbers are reported.
    rule_authority: best_practice
    sap_impact: Two accounts for one customer split credit exposure, open items, rebates and sales history.
    fix_map:
      __other__: Compare the pair in XD03; merge by blocking and flagging the redundant account and moving its open items.
    record_fix_template: 'Customer {KNA1.KUNNR}: name is near-identical to another customer in the same city.'
  - id: AR237
    field: KNB1.AKONT
    check_class: exists_check
    fields:
    - KNB1.BUKRS
    - KNB1.AKONT
    target_table: SKB1
    target_fields:
    - BUKRS
    - SAKNR
    grain: KNB1
    severity: critical
    dimension: consistency
    message: Customer reconciliation account does not exist in the company code's G/L master (SKB1)
    why_it_matters: Every customer posting is also posted to the reconciliation account. If the account has no company code
      segment in SKB1, SAP cannot post any document for the customer in that company code.
    rule_authority: sap_hard_constraint
    sap_impact: FB70, VF01 release to accounting, F-28 and lockbox fail for the customer.
    fix_map:
      __other__: Create the G/L account in the company code (FS00) as a customer reconciliation account, or assign an existing
        one in XD02 > Company code data.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: reconciliation account {KNB1.AKONT} does not exist
      in SKB1.'
  - id: AR238
    field: KNB1.BUSAB
    check_class: referential_check
    severity: low
    dimension: validity
    message: Accounting clerk KNB1.BUSAB must exist in T001S
    why_it_matters: The accounting clerk prints on dunning letters and statements as the contact person and is a selection and
      grouping criterion in the dunning run (F150) and open-item lists.
    rule_authority: best_practice
    sap_impact: Dunning letters print no contact; worklists by clerk miss the customer.
    fix_map:
      __other__: Assign a clerk defined for the company code (XD02 > Correspondence; customising OB25).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: accounting clerk {KNB1.BUSAB} is not defined in
      T001S.'
  - id: AR239
    field: KNB1.VZSKZ
    check_class: referential_check
    severity: low
    dimension: validity
    message: Interest calculation indicator KNB1.VZSKZ must exist in T056
    why_it_matters: The indicator selects the interest terms used by the arrears interest run (F.2A/F.24). A key missing from
      T056 stops interest calculation for the customer.
    rule_authority: best_practice
    sap_impact: Arrears interest is not calculated or posted for the customer.
    fix_map:
      __other__: Choose a defined interest indicator (XD02 > Account management; customising OB46).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: interest calculation indicator {KNB1.VZSKZ} is not
      defined in T056.'
  - id: AR240
    field: KNB1.TOGRU
    check_class: referential_check
    severity: low
    dimension: validity
    message: Tolerance group KNB1.TOGRU must exist in T043G
    why_it_matters: The customer tolerance group sets the payment differences and cash discount tolerances accepted when incoming
      payments are cleared. A group not defined in T043G falls back to the blank group.
    rule_authority: best_practice
    sap_impact: Payment differences are written off or rejected with the wrong tolerance.
    fix_map:
      __other__: Choose a tolerance group defined for the company code (XD02 > Payment transactions; customising OBA3).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: tolerance group {KNB1.TOGRU} is not defined in T043G.'
  - id: AR241
    field: KNB1.LOCKB
    check_class: referential_check
    severity: medium
    dimension: validity
    message: Lockbox KNB1.LOCKB must exist in T049L
    why_it_matters: The lockbox key tells the customer which bank lockbox to pay into and is printed on invoices. A key not
      defined in T049L for the company code cannot be printed or processed.
    rule_authority: best_practice
    sap_impact: Customers pay to the wrong lockbox; lockbox files (FLB2) cannot match the payments.
    fix_map:
      __other__: Choose a lockbox defined for the company code (XD02 > Payment transactions; customising OBAX).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: lockbox {KNB1.LOCKB} is not defined in T049L.'
  - id: AR242
    field: KNB1.ZUAWA
    check_class: referential_check
    severity: low
    dimension: validity
    message: Sort key KNB1.ZUAWA must exist in TZUN
    why_it_matters: The sort key fills the assignment field (ZUONR) of every customer line item and drives the sort order of
      open items and automatic clearing.
    rule_authority: best_practice
    sap_impact: Line items carry an empty or wrong assignment; automatic clearing (F.13) does not match items.
    fix_map:
      __other__: Choose a defined sort key (XD02 > Account management; customising OB16).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: sort key {KNB1.ZUAWA} is not defined in TZUN.'
  - id: AR243
    field: KNB1.UZAWE
    check_class: referential_check
    severity: low
    dimension: validity
    message: Payment method supplement KNB1.UZAWE must exist in T042F
    why_it_matters: The payment method supplement groups payments and selects forms in the payment program. A supplement not
      defined in T042F is rejected when the payment run proposal is built.
    rule_authority: best_practice
    sap_impact: Direct debits and refunds are not grouped or printed as intended.
    fix_map:
      __other__: Choose a defined supplement (XD02 > Payment transactions; customising OBCU).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: payment method supplement {KNB1.UZAWE} is not defined
      in T042F.'
  - id: AR244
    field: KNB1.XAUSZ
    check_class: referential_check
    severity: low
    dimension: validity
    message: Account statement indicator KNB1.XAUSZ must exist in T048K
    why_it_matters: The indicator decides whether and how often the customer receives account statements (F.27). A value not
      defined in T048K produces no statements.
    rule_authority: best_practice
    sap_impact: Customers do not receive the periodic statements they are set up for.
    fix_map:
      __other__: Choose a defined statement indicator (XD02 > Correspondence; customising OB10).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: account statement indicator {KNB1.XAUSZ} is not
      defined in T048K.'
  - id: AR245
    field: KNB1.ZUAWA
    check_class: null_check
    applies_when:
      KNB1.LOEVM:
        blank: true
    severity: low
    dimension: completeness
    message: Customer company code data has no sort key
    why_it_matters: Without a sort key the assignment field of customer line items stays empty, so open items cannot be sorted
      or cleared automatically by reference.
    rule_authority: best_practice
    sap_impact: Automatic clearing (F.13) and open-item processing by reference do not work for the customer.
    fix_map:
      __other__: Set the sort key (usually 009 external document number or 001 posting date) in XD02 > Account management.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: no sort key.'
  - id: AR246
    field: KNB1.BUSAB
    check_class: null_check
    applies_when:
      KNB1.LOEVM:
        blank: true
    severity: low
    dimension: completeness
    message: Customer company code data has no accounting clerk
    why_it_matters: The accounting clerk is the contact on dunning letters and the main way collections work is split between
      people. Customers without a clerk fall outside every clerk's worklist.
    rule_authority: best_practice
    sap_impact: Nobody owns collections for the customer; dunning letters print no contact.
    fix_map:
      __other__: Assign an accounting clerk in XD02 > Correspondence.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: no accounting clerk.'
  - id: AR247
    field: KNB1.KNRZE
    check_class: exists_check
    fields:
    - KNB1.KNRZE
    - KNB1.BUKRS
    target_table: KNB1
    target_fields:
    - KUNNR
    - BUKRS
    target_when:
      KNRZE:
        blank: true
    grain: KNB1
    severity: high
    dimension: consistency
    message: Head office does not exist in the company code or is itself a branch
    why_it_matters: 'SAP supports one level of head office and branch: the head office must be a customer in the same company
      code, and XD02 rejects a head office that has its own head office. A missing head office or a chain means postings are
      routed to an account that is not where open items are managed.'
    rule_authority: sap_hard_constraint
    sap_impact: Branch postings land on an intermediate account; dunning and payment run by head office miss them.
    fix_map:
      __other__: Point the branch to a head office that is extended to the company code and has no head office of its own (XD02
        > Account management > Head office).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: head office {KNB1.KNRZE} is missing or is itself
      a branch.'
  - id: AR248
    field: KNB1.KNRZB
    check_class: exists_check
    grain: KNB1
    target_table: KNA1
    target_fields:
    - KUNNR
    target_when:
      LOEVM:
        blank: true
    severity: medium
    dimension: consistency
    message: Alternative payer in the company code does not exist or is flagged for deletion
    why_it_matters: The alternative payer (KNB1.KNRZB) pays or is debited for the customer in the payment program. If it is
      missing or deleted, direct debits and refunds cannot be created.
    rule_authority: sap_hard_constraint
    sap_impact: Payment run (F110) exceptions for the customer; incoming payments are applied to the wrong account.
    fix_map:
      __other__: Enter an active alternative payer in XD02 > Payment transactions, or remove the field.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: alternative payer {KNB1.KNRZB} does not exist or
      is deleted.'
  - id: AR249
    field: KNB5.MAHNS
    check_class: cross_field_check
    fail_when: '`KNB5.MAHNS`.notna() & (`KNB5.MAHNS` != ''0'') & `KNB5.MADAT`.isna()'
    severity: low
    dimension: consistency
    message: Customer has a dunning level but no date of last dunning notice
    why_it_matters: The dunning run sets the level (KNB5.MAHNS) and the date (KNB5.MADAT) together. A level without a date was
      loaded, and the next run calculates the dunning interval from nothing.
    rule_authority: best_practice
    sap_impact: The next dunning run escalates or skips the customer incorrectly.
    fix_map:
      __other__: Reset the dunning data (XD02 > Correspondence) or load the date of the last dunning notice.
    record_fix_template: 'Customer {KNB5.KUNNR}, company code {KNB5.BUKRS}: dunning level set without a last dunning date.'
  - id: AR250
    field: KNKK.SBGRP
    check_class: referential_check
    severity: low
    dimension: validity
    message: Credit representative group KNKK.SBGRP must exist in T024B
    why_it_matters: The credit representative group routes blocked orders to the right credit team (VKM1) and selects credit
      reports. A group not defined for the credit control area receives no work.
    rule_authority: best_practice
    sap_impact: Orders blocked for credit sit in no team's worklist.
    fix_map:
      __other__: Assign a group defined for the credit control area (FD32; customising OB02).
    record_fix_template: 'Customer {KNKK.KUNNR}, credit control area {KNKK.KKBER}: credit representative group is not defined
      in T024B.'
  - id: AR251
    field: KNKK.GRUPP
    check_class: referential_check
    severity: low
    dimension: validity
    message: Customer credit group KNKK.GRUPP must exist in T691B
    why_it_matters: The customer credit group is used with the risk category to select credit checks and reports. A group not
      defined in T691B is ignored.
    rule_authority: best_practice
    sap_impact: Credit analyses and selections by credit group miss the customer.
    fix_map:
      __other__: Choose a defined credit group (FD32 > Status; customising OB12).
    record_fix_template: 'Customer {KNKK.KUNNR}, credit control area {KNKK.KKBER}: customer credit group is not defined in T691B.'
  - id: AR252
    field: KNKK.SBGRP
    check_class: null_check
    applies_when:
      KNKK.KLIMK:
        gt: 0
    grain: KNKK
    severity: low
    dimension: completeness
    message: Customer with a credit limit has no credit representative group
    why_it_matters: When an order is blocked for credit, the release worklist (VKM1) and the notification e-mail are driven
      by the credit representative group. Without it nobody is notified.
    rule_authority: best_practice
    sap_impact: Credit-blocked orders wait unseen and deliveries are late.
    fix_map:
      __other__: Assign a credit representative group in FD32 > Status.
    record_fix_template: 'Customer {KNKK.KUNNR}, credit control area {KNKK.KKBER}: credit limit without credit representative
      group.'
  - id: AR253
    field: KNKK.CASHD
    check_class: cross_field_check
    fail_when: (`KNKK.KLIMK` > 0) & ((@today - `KNKK.CASHD`).dt.days > 730)
    grain: KNKK
    severity: low
    dimension: timeliness
    message: Customer has a credit limit but has not paid for more than two years
    why_it_matters: 'A credit limit is an open commitment. A customer whose last payment is more than two years old is dormant:
      the limit is stale and should be reviewed or withdrawn before the account is used again.'
    rule_authority: best_practice
    sap_impact: Dormant accounts can place orders up to an outdated limit without a fresh credit review.
    fix_map:
      __other__: Review the credit limit (FD32) and reduce it to zero, or block the customer if the relationship has ended.
    record_fix_template: 'Customer {KNKK.KUNNR}, credit control area {KNKK.KKBER}: credit limit set, last payment over two years
      ago.'
  - id: AR254
    field: KNBK.BKONT
    check_class: null_check
    applies_when:
      KNBK.BANKS:
      - ES
      - FR
      - IT
    grain: KNBK
    severity: medium
    dimension: completeness
    message: Bank control key is missing for a Spanish, French or Italian bank account
    why_it_matters: In Spain (DC digits), France (clé RIB) and Italy (CIN) the bank control key is part of the national account
      number and of the IBAN. SAP's country check (OY17) and the SEPA direct debit formats need it.
    rule_authority: iso_standard
    sap_impact: IBAN generation fails; SEPA direct debits and refunds to the account are rejected.
    fix_map:
      __other__: Enter the control key from the customer's bank details (XD02 > Payment transactions) or maintain the IBAN.
    record_fix_template: 'Customer {KNBK.KUNNR}: bank account in {KNBK.BANKS} has no control key.'
