  - id: SDCM423
    field: KNA1.TELF1
    check_class: cross_field_check
    fail_when: '`KNA1.TELF1` != `ADRC.TEL_NUMBER`.str.slice(0, 16)'
    require_populated: true
    grain: KNA1
    severity: low
    dimension: consistency
    message: Telephone in the customer master differs from the central address
    why_it_matters: KNA1 keeps copies of the central address (ADRC) for programs that do not read Business Address Services.
      KNA1.TELF1 is the default telephone ADRC.TEL_NUMBER cut to 16 characters. A difference means one side was changed by a
      direct table update or a load, so reports, interfaces and the BP conversion, which takes ADRC, show different data for
      the same customer.
    rule_authority: sap_hard_constraint
    sap_impact: Telephone differs between reports that read KNA1 and the BP created from ADRC.
    fix_map:
      __other__: Re-save the address in XD02 so Business Address Services rewrites the KNA1 copy, or correct ADRC.
