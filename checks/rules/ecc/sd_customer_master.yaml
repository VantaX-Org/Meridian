  - id: SDCM540
    field: KNBK.KUNNR
    check_class: exists_check
    fields:
    - KNBK.KUNNR
    target_table: KNA1
    target_fields:
    - KUNNR
    grain: KNBK
    severity: high
    dimension: consistency
    message: Customer bank details has no parent record in KNA1
    why_it_matters: KNBK rows hang off KNA1. A row whose key (KNBK.KUNNR) has no KNA1 record is an orphan left by a deletion,
      archiving or a partial legacy load; SAP transactions never show it, but extracts, the CVI synchronisation and migration
      objects still read it.
    rule_authority: sap_hard_constraint
    sap_impact: The orphan is converted or reported as live data although no master record carries it.
    fix_map:
      __other__: Delete the orphan bank details or create the customer.
    record_fix_template: 'Customer {KNBK.KUNNR}: bank details without customer general data.'
  - id: SDCM541
    field: TIBAN.IBAN
    check_class: regex_check
    pattern: ^AD\d{2}\d{8}[A-Z0-9]{12}$
    applies_when:
      TIBAN.BANKS:
      - AD
      TIBAN.TABNAME:
      - KNBK
    grain: TIBAN
    severity: high
    dimension: validity
    message: Customer IBAN is not a valid AD IBAN (expected 24 characters in the AD structure)
    why_it_matters: 'ISO 13616 fixes the length and character structure of the IBAN per country. A AD IBAN is exactly 24 characters:
      AD, two check digits, then a 20-character BBAN with digits and letters in fixed positions. The mod-97 check digits can
      still balance on an IBAN of the wrong shape, so this structural check catches truncated, padded and wrong-country IBANs
      that the checksum misses.'
    rule_authority: iso_standard
    sap_impact: SEPA direct debits and refunds to the customer are rejected by the bank, or the payment medium program refuses
      the IBAN.
    fix_map:
      __other__: Obtain the IBAN from the customer's bank confirmation and correct it (XD02 > Payment transactions > IBAN).
    record_fix_template: 'Customer bank account KNBK.BANKL in TIBAN.BANKS: IBAN does not match the AD structure.'
    auto_fix:
      steps:
      - op: regex_replace
        pattern: \s+
        repl: ''
      - op: upper
      confidence: low
