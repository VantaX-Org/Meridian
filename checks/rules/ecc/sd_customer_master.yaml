  - id: SDCM422
    field: KNA1.SORTL
    check_class: cross_field_check
    fail_when: '`KNA1.SORTL`.str.upper() != `ADRC.SORT1`.str.upper().str.slice(0, 10)'
    require_populated: true
    grain: KNA1
    severity: low
    dimension: consistency
    message: Search term in the customer master differs from the central address
    why_it_matters: KNA1 keeps copies of the central address (ADRC) for programs that do not read Business Address Services.
      KNA1.SORTL is the first search term ADRC.SORT1 cut to 10 characters. A difference means one side was changed by a direct
