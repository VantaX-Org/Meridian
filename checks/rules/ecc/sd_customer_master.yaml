      - SE
      - FI
    grain: KNA1
    severity: low
    dimension: validity
    message: PO box postal code does not have the national numeric format
    why_it_matters: In these countries a PO box postal code (PSTL2) has the same four or five digits as a street postal code.
      Letters, separators or the wrong length mean the box number or the town was typed into the field, so correspondence and
      dunning letters sent to the PO box address are returned.
    rule_authority: iso_standard
    sap_impact: Correspondence sent to the PO box address is undeliverable.
    fix_map:
