    severity: medium
    dimension: consistency
    message: Canadian province does not match the first letter of the postal code
    why_it_matters: The first letter of a Canadian postal code identifies the province (A Newfoundland, B Nova Scotia, G/H/J
      Quebec, K-P Ontario, R Manitoba, S Saskatchewan, T Alberta, V British Columbia, X Northwest Territories and Nunavut, Y
