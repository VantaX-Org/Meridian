  - id: SDCM381
    field: KNA1.STKZN
    check_class: cross_field_check
    fail_when: '`KNA1.NAME1`.str.upper().str.replace(''[.]'', '''', regex=True).str.contains(''(^| |[(])(GMBH|LTD|LIMITED|PLC|LLC|INC|CORP|CORPORATION|BV|NV|SARL|SAS|SPA|SRL|PTY|KG|OHG|OY|AB|AS|APS|SP
      Z OO|SRO|KFT|LTDA|SA DE CV)([ ,)]|$)'')'
    applies_when:
      KNA1.STKZN:
      - X
      KNA1.NAME1:
        contains_any:
        - GmbH
        - GMBH
        - Ltd
        - LTD
        - Limited
        - LIMITED
        - PLC
        - Plc
        - LLC
        - Inc
        - INC
        - Corp
        - CORP
        - BV
        - B.V.
        - NV
        - N.V.
        - SARL
        - SAS
        - SpA
        - SPA
        - S.p.A.
        - Srl
        - SRL
        - S.r.l.
        - Pty
        - PTY
        - KG
        - OHG
        - Oy
        - OY
        - AB
        - AS
        - ApS
        - APS
        - Sp. z o.o.
        - SP Z OO
        - s.r.o.
        - SRO
        - Kft
        - KFT
        - Ltda
        - LTDA
        - de C.V.
        - DE CV
    grain: KNA1
    severity: medium
    dimension: consistency
    message: Customer marked as a natural person has a company legal form in its name
    why_it_matters: A name ending in GmbH, Ltd, (Pty) Ltd, Inc, SpA or another legal form identifies a company, but the natural-person
      indicator tells SAP the customer is a private individual. Country localisations then expect a personal tax ID, withholding
      treats the customer as a person, and the BP conversion creates a person with the company name as first and last name.
    rule_authority: best_practice
    sap_impact: The BP conversion creates a person instead of an organisation and tax treatment follows the wrong party type.
    fix_map:
      __other__: Clear the natural-person indicator in XD02 > Control data, or correct the name.
    record_fix_template: 'Customer {KNA1.KUNNR}: marked as a natural person but the name has a company legal form.'
  - id: SDCM382
    field: KNA1.TELF1
    check_class: regex_check
    pattern: ^[+]?[(]?[0-9][0-9 ()./-]{3,}[0-9]$
    grain: KNA1
    severity: low
    dimension: validity
    message: First telephone number contains text or is too short to dial
    why_it_matters: The first telephone number is dialled by people, CTI and the S/4HANA business partner, which normalises
      it into TELNR_LONG. Letters, words or fewer than five digits ('see e-mail', 'ext 12', '011') cannot be dialled or normalised;
      extensions belong in the extension field.
    rule_authority: best_practice
    sap_impact: Calls, faxes and CTI lookups fail; the number is migrated unnormalised to the BP.
    fix_map:
      __other__: Enter only digits, spaces and the separators ( ) - / . with an optional leading +; move extensions to the extension
        field (XD02 > Address > Communication).
    record_fix_template: 'Customer {KNA1.KUNNR}: telephone 1 cannot be dialled.'
