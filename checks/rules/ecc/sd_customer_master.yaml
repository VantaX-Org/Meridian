  - id: SDCM425
    field: KNA1.STRAS
    check_class: cross_field_check
    fail_when: '`ADRC.ADDRNUMBER`.notna() & (`KNA1.STRAS`.isna() != `ADRC.STREET`.isna())'
    grain: KNA1
    severity: medium
    dimension: consistency
    message: Street is filled in only one of the customer master and the central address
    why_it_matters: KNA1 keeps copies of the central address (ADRC) for programs that do not read Business Address Services.
      KNA1.STRAS is derived from ADRC.STREET; one being empty while the other is filled is the clearest sign the copies drifted
      apart. A difference means one side was changed by a direct table update or a load, so reports, interfaces and the BP conversion,
      which takes ADRC, show different data for the same customer.
    rule_authority: sap_hard_constraint
    sap_impact: Street is lost in the BP conversion or missing in KNA1-based reports.
    fix_map:
      __other__: Re-save the address in XD02 so Business Address Services rewrites the KNA1 copy, or correct ADRC.
    record_fix_template: 'Customer {KNA1.KUNNR}: street filled on one side only.'
  - id: SDCM426
    field: KNA1.TELF1
    check_class: cross_field_check
    fail_when: '`ADRC.ADDRNUMBER`.notna() & (`KNA1.TELF1`.isna() != `ADRC.TEL_NUMBER`.isna())'
    grain: KNA1
    severity: medium
    dimension: consistency
    message: Telephone is filled in only one of the customer master and the central address
    why_it_matters: KNA1 keeps copies of the central address (ADRC) for programs that do not read Business Address Services.
      KNA1.TELF1 is derived from ADRC.TEL_NUMBER; one being empty while the other is filled is the clearest sign the copies
