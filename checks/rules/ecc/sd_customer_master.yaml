  - id: SDCM042
    field: KNVV.VKBUR
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer sales office KNVV.VKBUR must exist in TVBUR
    why_it_matters: The sales office is proposed into sales documents and drives responsibility, output and statistics. An
      office that is not defined in TVBUR cannot be copied into the order.
    rule_authority: best_practice
    sap_impact: Orders are created without a valid sales office; reporting and output by office are wrong.
    fix_map:
      __other__: Sales office '{invalid_value}' is not defined in TVBUR. Correct it in VD02/XD02 > Sales area > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: sales office ''{actual_value}''
      not in TVBUR.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM043
    field: KNVV.VKGRP
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer sales group KNVV.VKGRP must exist in TVBVK
    why_it_matters: The sales group is proposed into sales documents. Only sales groups assigned to a sales office (TVBVK)
      are valid.
    rule_authority: best_practice
    sap_impact: Orders are created without a valid sales group; reporting by sales group is wrong.
    fix_map:
      __other__: Sales group '{invalid_value}' is not assigned to a sales office (TVBVK). Correct it in VD02/XD02 > Sales
        area > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: sales group ''{actual_value}''
      not in TVBVK.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM044
    field: KNVV.AUFSD
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Sales-area order block KNVV.AUFSD must exist in TVAST
    why_it_matters: A sales-area order block stops order processing by the reason defined in TVAST. A block code that is not
      defined has no rule attached, so the intended block is not applied consistently.
    rule_authority: best_practice
    sap_impact: Orders are blocked without a recognised reason, or not blocked although the business intended it.
    fix_map:
      __other__: Order block '{invalid_value}' is not defined in TVAST. Set the correct block in VD05/XD05 or clear it.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: order block ''{actual_value}''
      not in TVAST.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM045
    field: KNVV.LIFSD
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Sales-area delivery block KNVV.LIFSD must exist in TVLS
    why_it_matters: A sales-area delivery block stops deliveries by the reason defined in TVLS. A block code that is not defined
      has no rule attached, so the intended block is not applied consistently.
    rule_authority: best_practice
    sap_impact: Deliveries are blocked without a recognised reason, or not blocked although the business intended it.
    fix_map:
      __other__: Delivery block '{invalid_value}' is not defined in TVLS. Set the correct block in VD05/XD05 or clear it.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: delivery block ''{actual_value}''
      not in TVLS.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM046
    field: KNVV.FAKSD
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Sales-area billing block KNVV.FAKSD must exist in TVFS
    why_it_matters: A sales-area billing block stops billing by the reason defined in TVFS. A block code that is not defined
      has no rule attached, so the intended block is not applied consistently.
    rule_authority: best_practice
    sap_impact: Billing is blocked without a recognised reason, or not blocked although the business intended it.
    fix_map:
      __other__: Billing block '{invalid_value}' is not defined in TVFS. Set the correct block in VD05/XD05 or clear it.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: billing block ''{actual_value}''
      not in TVFS.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM047
    field: KNVV.LOEVM
    check_class: domain_value_check
    allowed_values:
    - ''
    - X
    valid_values_with_labels:
      ? ''
      : Active in this sales area
      X: Flagged for deletion in this sales area
    severity: medium
    dimension: validity
    message: Sales-area deletion flag must be X (flagged) or empty
    why_it_matters: The sales-level deletion flag stops new sales documents in the sales area and queues the data for archiving.
      SAP only recognises X.
    rule_authority: best_practice
    sap_impact: Orders may still be created in a sales area the business meant to close, or archiving skips it.
    fix_map:
      __other__: Set or remove the flag in VD06/XD06; never write other values by load.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: deletion flag ''{actual_value}''
      is invalid.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: high
  - id: SDCM048
    field: KNVV.KZTLF
    check_class: domain_value_check
    allowed_values:
    - ''
    - A
    - B
    - C
    - D
    valid_values_with_labels:
      ? ''
      : Partial delivery allowed
      A: Create delivery with quantity greater than zero
      B: Create only one delivery, even if quantity is zero
      C: Only complete delivery allowed
      D: No limit to subsequent deliveries
    severity: low
    dimension: validity
    message: Partial delivery control must be one of SAP's fixed values (blank, A, B, C, D)
    why_it_matters: KNVV.KZTLF is copied into every order item and controls whether and how partial deliveries are created.
      SAP only interprets its fixed values.
    rule_authority: best_practice
    sap_impact: Deliveries are split or held back contrary to the agreement with the customer.
    fix_map:
      __other__: Correct the partial delivery control in VD02/XD02 > Sales area > Shipping.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: partial delivery control
      ''{actual_value}'' is invalid.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: high
  - id: SDCM049
    field: KNVV.AUTLF
    check_class: domain_value_check
    allowed_values:
    - ''
    - X
    valid_values_with_labels:
      ? ''
      : Partial delivery of the order allowed
      X: Complete delivery of the order required
    severity: low
    dimension: validity
    message: Complete delivery indicator must be X or empty
    why_it_matters: KNVV.AUTLF is copied into the order header and forces the whole order to ship in one delivery. SAP only
      recognises X.
    rule_authority: best_practice
    sap_impact: Orders ship partially although the customer requires complete delivery, or wait unnecessarily.
    fix_map:
      __other__: Correct the complete delivery indicator in VD02/XD02 > Sales area > Shipping.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: complete delivery indicator
      ''{actual_value}'' is invalid.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: high
  - id: SDCM050
    field: KNA1.LAND1
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Customer country KNA1.LAND1 must exist in T005
    why_it_matters: The customer's country drives output tax determination, export control, route determination and the address
      on every order, delivery note and invoice. A country key that is not in T005 resolves none of them.
    rule_authority: best_practice
    sap_impact: Tax determination fails on sales orders; deliveries cannot be routed; invoices carry an invalid address.
    fix_map:
      __other__: Country '{invalid_value}' is not defined in T005. Correct the customer address in XD02/VD02 (BP address in
        S/4HANA).
    record_fix_template: 'Customer {KNA1.KUNNR}: country ''{actual_value}'' not in T005.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM051
    field: KNVP.KUNN2
    check_class: exists_check
    grain: KNVP
    target_table: KNA1
    target_fields:
    - KUNNR
    target_when:
      LOEVM:
        blank: true
    severity: high
    dimension: consistency
    message: Partner (ship-to, bill-to, payer) does not exist or is flagged for deletion
    why_it_matters: Sales documents copy the customer's partners from the sales-area partner functions; a partner that is missing
      or flagged for deletion is copied into every new order.
    rule_authority: sap_hard_constraint
    sap_impact: Orders ship to, bill or charge an account that should no longer be used; billing to a deleted payer fails.
    fix_map:
      __other__: Replace the partner in the customer's sales-area partner functions (XD02 > Partner functions).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): partner {KNVP.PARVW} {KNVP.KUNN2}
      does not exist or is deleted.'
  - id: SDCM052
    fields:
    - KNVP.KUNNR
    - KNVP.VKORG
    - KNVP.VTWEG
    - KNVP.SPART
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.PARVW: [AG]
    target_table: KNVP
    target_fields:
    - KUNNR
    - VKORG
    - VTWEG
    - SPART
    target_when:
      PARVW: [RG]
    severity: high
    dimension: completeness
    message: Sold-to party has no payer in this sales area
    why_it_matters: Sales documents copy their partners from the sold-to's sales-area partner functions. Without a payer (RG)
      the order is incomplete for billing; whoever enters it must pick a payer by hand, and the receivable can land on the
      wrong account.
    rule_authority: sap_hard_constraint
    sap_impact: The payer is on the incompletion log (V.02), and the order cannot be billed until a payer is entered. Credit
      checks run against the payer, so exposure is not checked.
    fix_map:
      __other__: Add the payer partner function to the sales area (XD02 > Sales area data > Partner functions; BP > Customer
        roles in S/4HANA).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}) is a sold-to party but has no payer
      partner.'
  - id: SDCM053
    fields:
    - KNVP.KUNNR
    - KNVP.VKORG
    - KNVP.VTWEG
    - KNVP.SPART
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.PARVW: [AG]
    target_table: KNVP
    target_fields:
    - KUNNR
    - VKORG
    - VTWEG
    - SPART
    target_when:
      PARVW: [RE]
    severity: high
    dimension: completeness
    message: Sold-to party has no bill-to party in this sales area
    why_it_matters: The bill-to party decides the invoice address and output. Without one, every order needs a bill-to entered
      by hand, or it stays incomplete for billing.
    rule_authority: sap_hard_constraint
    sap_impact: The order is on the incompletion log for billing. Invoices cannot be printed or sent until a bill-to is maintained.
    fix_map:
      __other__: Add the bill-to partner function to the sales area (XD02 > Sales area data > Partner functions).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}) is a sold-to party but has no bill-to
      partner.'
  - id: SDCM054
    field: KNVP.KUNN2
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.PARVW: [RG]
    target_table: KNB1
    target_fields:
    - KUNNR
    target_when:
      LOEVM:
        blank: true
    severity: high
    dimension: consistency
    message: Payer has no company-code data (or it is flagged for deletion)
    why_it_matters: The payer is the account that billing posts the receivable to. A payer that exists only in sales and has
      no company-code data, or only deleted company-code data, cannot carry a receivable.
    rule_authority: sap_hard_constraint
    sap_impact: The billing document is saved but not released to accounting (VFX3, "customer not created in company code").
      Revenue and the receivable are not posted.
    fix_map:
      __other__: Extend the payer to the company code of the sales organisation (XD01/XD07 > Company code data; BP role FLCU00
        in S/4HANA), or replace the payer in the partner functions.
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): payer {KNVP.KUNN2} has no active
      company-code data.'
  - id: SDCM055
    check_class: exists_check
    fields:
    - KNA1.LIFNR
    - KNA1.KUNNR
    target_table: LFA1
    target_fields:
    - LIFNR
    - KUNNR
    target_when:
      LOEVM:
        blank: true
    severity: medium
    dimension: consistency
    message: Customer is linked to a vendor that does not point back to it (or the vendor is missing or deleted)
    why_it_matters: Netting a customer against a vendor (KNB1.XVERR / LFB1.XVERR) reads both directions of the link. A link
      that is one-sided, points to a deleted vendor, or points to a vendor linked to another customer nets the wrong balances.
    rule_authority: sap_hard_constraint
    sap_impact: The payment run (F110) and dunning (F150) offset open items against the wrong account, or skip offsetting.
      In S/4HANA the CVI conversion reports an inconsistent customer-vendor link.
    fix_map:
      __other__: Make the link mutual (XD02 > Control data > Vendor and XK02 > Control data > Customer), or remove it.
    record_fix_template: 'Customer {KNA1.KUNNR} points to vendor {KNA1.LIFNR}, but that vendor does not exist, is deleted, or
      does not point back to this customer.'
  - id: SDCM057
    field: KNA1.ORT01
    check_class: cross_field_check
    fail_when: '`KNA1.ORT01`.isna() | (`KNA1.STRAS`.isna() & `KNA1.PFACH`.isna())'
    applies_when:
      KNA1.XCPDK:
        blank: true
    severity: medium
    dimension: completeness
    message: Customer address is incomplete (no city, or neither a street nor a PO box)
    why_it_matters: The address prints on delivery notes and invoices, and drives tax jurisdiction and route determination.
      Without a city, or without a street or PO box, deliveries and invoices cannot be addressed.
    rule_authority: best_practice
    sap_impact: Invoices may be rejected under e-invoicing and VAT rules. Carriers cannot deliver, and US tax jurisdiction
      (TXJCD) cannot be determined.
    fix_map:
      __other__: Complete the address (XD02 > Address).
    record_fix_template: 'Customer {KNA1.KUNNR}: address incomplete (city KNA1.ORT01, street KNA1.STRAS, PO box KNA1.PFACH).'
  - id: SDCM200
    field: KNVP.KUNNR
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.PARVW:
      - AG
    fields:
    - KNVP.KUNNR
    - KNVP.VKORG
    - KNVP.VTWEG
    - KNVP.SPART
    target_table: KNVP
    target_fields:
    - KUNNR
    - VKORG
    - VTWEG
    - SPART
    target_when:
      PARVW:
      - WE
    severity: high
    dimension: completeness
    message: Sold-to party has no ship-to partner function in the sales area
    why_it_matters: The partner determination procedure for a sold-to party requires a ship-to (WE). Without it in the sales
      area, VA01 stops at partner determination and the order cannot be saved or delivered.
    rule_authority: sap_hard_constraint
    sap_impact: Sales orders for the customer stay incomplete (no ship-to), so no delivery can be created.
    fix_map:
      __other__: Maintain partner function WE for the sales area (XD02 > Sales area data > Partner functions).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): no ship-to partner function.'
  - id: SDCM203
    field: KNVP.KUNN2
    check_class: uniqueness_check
    grain: KNVP
    applies_when:
      KNVP.PARVW:
      - AG
      - RG
    fields:
    - KNVP.KUNNR
    - KNVP.VKORG
    - KNVP.VTWEG
    - KNVP.SPART
    - KNVP.PARVW
    severity: medium
    dimension: uniqueness
    message: Customer has more than one sold-to or payer partner in the same sales area
    why_it_matters: Sold-to and payer are unique partner functions in the standard partner procedure. Several entries trigger
      a selection pop-up in VA01 and lead to orders charged to the wrong payer.
    rule_authority: best_practice
    sap_impact: Order entry stops for a manual partner choice; receivables land on the wrong payer.
    fix_map:
      __other__: Keep one sold-to and one payer per sales area (XD02 > Partner functions) and delete the extra entries.
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): partner function {KNVP.PARVW} is maintained
      more than once.'
  - id: SDCM204
    field: KNVP.KUNN2
    check_class: cross_field_check
    grain: KNVP
    applies_when:
      KNVP.PARVW:
      - AG
    fail_when: '`KNVP.KUNN2` != `KNVP.KUNNR`'
    require_populated: true
    severity: high
    dimension: consistency
    message: Sold-to partner function points to another customer
    why_it_matters: The sold-to partner of a customer is the customer itself. A sold-to entry pointing to a different account
      means the account was copied from another customer and orders entered for it are booked to someone else.
    rule_authority: sap_hard_constraint
    sap_impact: Orders, pricing and statistics are recorded against the wrong sold-to party.
    fix_map:
      __other__: Correct the sold-to partner to the customer itself (XD02 > Partner functions).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): sold-to partner is {KNVP.KUNN2}.'
    auto_fix:
      steps:
      - op: copy
        from: KNVP.KUNNR
      confidence: medium
  - id: SDCM205
    field: KNVP.KUNN2
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.PARVW:
      - WE
      - RE
      - RG
    fields:
    - KNVP.KUNN2
    - KNVP.VKORG
    - KNVP.VTWEG
    - KNVP.SPART
    target_table: KNVV
    target_fields:
    - KUNNR
    - VKORG
    - VTWEG
    - SPART
    target_when:
      LOEVM:
        blank: true
    severity: high
    dimension: consistency
    message: Ship-to, bill-to or payer is not extended to the sales area, or is flagged for deletion there
    why_it_matters: A partner used in a sales area must have its own sales-area data (KNVV) there. Without it SAP rejects the
      partner in the order ("not defined for sales area") and billing to a payer without sales data fails.
    rule_authority: sap_hard_constraint
    sap_impact: Order entry errors at partner determination; the payer has no billing or credit data in the sales area.
    fix_map:
      __other__: Extend the partner customer to the sales area (XD01 with reference) or replace the partner.
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): partner {KNVP.PARVW} {KNVP.KUNN2}
      has no active data in the sales area.'
  - id: SDCM206
    field: KNVV.VWERK
    check_class: null_check
    severity: low
    dimension: completeness
    message: Delivering plant is missing in the customer sales-area data
    why_it_matters: The delivering plant proposed into order items comes from the customer-material info, the customer (KNVV-VWERK)
      or the material. Without a customer default, items fall back to the material and often pick the wrong plant.
    rule_authority: best_practice
    sap_impact: Order items without plant cannot be checked for availability or delivered until a plant is entered.
    fix_map:
      __other__: Maintain the delivering plant in XD02 > Sales area data > Shipping.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): no delivering plant.'
  - id: SDCM207
    field: KNVV.LOEVM
    check_class: cross_field_check
    fail_when: (`KNVV.LOEVM` == 'X') & `KNVV.AUFSD`.isna() & `KNVV.LIFSD`.isna() & `KNVV.FAKSD`.isna()
    severity: medium
    dimension: consistency
    message: Sales area flagged for deletion is not blocked for orders, deliveries or billing
    why_it_matters: The deletion flag only marks the sales area for archiving; it does not stop new business. SAP's deletion
      check (and MDG's block-before-delete validation) expects the sales area to carry an order, delivery or billing block first,
      otherwise orders keep arriving on an account the business has retired.
    rule_authority: best_practice
    sap_impact: Orders, deliveries and invoices can still be created for a customer the business considers deleted, and archiving
      fails because new documents keep appearing.
    fix_map:
      __other__: Set a sales-area order block (VD05 or XD05) before or together with the deletion flag.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): flagged for deletion but not blocked.'
  - id: SDCM208
    field: KNVV.LOEVM
    check_class: cross_field_check
    fail_when: (`KNA1.LOEVM` == 'X') & `KNVV.LOEVM`.isna()
    grain: KNVV
    severity: medium
    dimension: consistency
    message: Customer is flagged for deletion centrally but the sales area is not
    why_it_matters: XD06 with 'all areas' sets the deletion flag in every sales area. A sales area without the flag stays selectable
      in order entry help and in SD reports that read KNVV.
    rule_authority: best_practice
    sap_impact: Orders can still be created for a retired customer; SD archiving skips the sales area.
    fix_map:
      __other__: Flag the sales area for deletion too (XD06 / VD06), or remove the central flag if set in error.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): deleted centrally but not in the sales
      area.'
  - id: SDCM209
    field: KNVV.AUFSD
    check_class: cross_field_check
    fail_when: '`KNA1.AUFSD`.notna() & `KNVV.AUFSD`.isna()'
    grain: KNVV
    severity: low
    dimension: consistency
    message: Customer has a central order block but the sales area has none
    why_it_matters: The central order block (KNA1.AUFSD) applies in every sales area. Reports, MDG and CRM replication that
      read KNVV.AUFSD still show the sales area as open, so the block is invisible to the people who work it.
    rule_authority: best_practice
    sap_impact: Sales and service users do not see the order block until a document stops on it.
    fix_map:
      __other__: Set the order block for the sales areas too (VD05 / XD05), or lift the central block if it is obsolete.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): central order block not mirrored in
      the sales area.'
  - id: SDCM210
    field: KNVV.LIFSD
    check_class: cross_field_check
    fail_when: '`KNA1.LIFSD`.notna() & `KNVV.LIFSD`.isna()'
    grain: KNVV
    severity: low
    dimension: consistency
    message: Customer has a central delivery block but the sales area has none
    why_it_matters: The central delivery block (KNA1.LIFSD) applies in every sales area. Reports, MDG and CRM replication that
      read KNVV.LIFSD still show the sales area as open, so the block is invisible to the people who work it.
    rule_authority: best_practice
    sap_impact: Sales and service users do not see the delivery block until a document stops on it.
    fix_map:
      __other__: Set the delivery block for the sales areas too (VD05 / XD05), or lift the central block if it is obsolete.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): central delivery block not mirrored
      in the sales area.'
  - id: SDCM211
    field: KNVV.FAKSD
    check_class: cross_field_check
    fail_when: '`KNA1.FAKSD`.notna() & `KNVV.FAKSD`.isna()'
    grain: KNVV
    severity: low
    dimension: consistency
    message: Customer has a central billing block but the sales area has none
    why_it_matters: The central billing block (KNA1.FAKSD) applies in every sales area. Reports, MDG and CRM replication that
      read KNVV.FAKSD still show the sales area as open, so the block is invisible to the people who work it.
    rule_authority: best_practice
    sap_impact: Sales and service users do not see the billing block until a document stops on it.
    fix_map:
      __other__: Set the billing block for the sales areas too (VD05 / XD05), or lift the central block if it is obsolete.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): central billing block not mirrored
      in the sales area.'
  - id: SDCM212
    field: KNVV.AUFSD
    check_class: cross_field_check
    fail_when: (`KNA1.SPERR` == 'X') & `KNVV.AUFSD`.isna() & `KNVV.LOEVM`.isna()
    grain: KNVV
    severity: medium
    dimension: consistency
    message: Customer is blocked for posting centrally but the sales area accepts orders
    why_it_matters: A central posting block (KNA1.SPERR) stops all FI postings. Orders and deliveries in an open sales area
      still go through, and only the billing document fails when it is released to accounting.
    rule_authority: best_practice
    sap_impact: 'Goods are shipped and then cannot be invoiced: billing documents stay in VFX3 with ''account blocked for posting''.'
    fix_map:
      __other__: Set an order block in the sales areas (VD05) or lift the posting block if the customer is active.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): blocked for posting but open for orders.'
  - id: SDCM213
    field: KNVV.ZTERM
    check_class: exists_check
    fields:
    - KNVV.KUNNR
    - KNVV.ZTERM
    target_table: KNB1
    target_fields:
    - KUNNR
    - ZTERM
    grain: KNVV
    severity: low
    dimension: consistency
    message: Sales payment terms are not used in any company code of the customer
    why_it_matters: Orders take the payment terms from the sales area (KNVV.ZTERM); manual FI invoices take them from the company
      code (KNB1.ZTERM). Terms that differ everywhere mean the customer pays SD invoices on other terms than were agreed in
      finance.
    rule_authority: best_practice
    sap_impact: Due dates, cash discount and dunning differ between SD and FI invoices for one customer.
    fix_map:
      __other__: Align the payment terms in the sales area (VD02) and the company code (FD02) with the contract.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): payment terms {KNVV.ZTERM} differ
      from every company code.'
  - id: SDCM214
    field: KNVV.WAERS
    check_class: referential_check
    severity: high
    dimension: validity
    message: Customer currency KNVV.WAERS must exist in TCURC
    why_it_matters: The sales area currency is the document currency of orders and the currency of pricing. A code not defined
      in TCURC (ISO 4217) cannot be used in any document.
    rule_authority: iso_standard
    sap_impact: VA01 rejects the currency; pricing and billing cannot run.
    fix_map:
      __other__: Choose a defined currency in VD02 > Sales; define new ISO codes in OY03.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): currency is not defined in TCURC.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM215
    field: KNVV.KURST
    check_class: referential_check
    severity: low
    dimension: validity
    message: Exchange rate type KNVV.KURST must exist in TCURV
    why_it_matters: The exchange rate type translates document currency to local currency in orders and billing. A type not
      defined in TCURV makes the translation fail.
    rule_authority: sap_hard_constraint
    sap_impact: Orders in foreign currency stop with an exchange rate error.
    fix_map:
      __other__: Choose a defined exchange rate type (VD02 > Sales; customising OB07).
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): exchange rate type not defined in
      TCURV.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM216
    field: KNVV.KVGR1
    check_class: referential_check
    severity: low
    dimension: validity
    message: Customer group 1 KNVV.KVGR1 must exist in TVV1
    why_it_matters: Customer group 1 is a free classification used in pricing, statistics (LIS/BW) and output. A value not defined
      in TVV1 is ignored by every selection and condition table keyed on it.
    rule_authority: best_practice
    sap_impact: Prices and statistics keyed on customer group 1 miss the customer.
    fix_map:
      __other__: 'Choose a defined customer group 1 (VD02 > Additional data; customising: Sales and Distribution > Master Data
        > Business Partners > Customers > Additional data).'
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): customer group 1 not defined in TVV1.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM217
    field: KNVV.KVGR2
    check_class: referential_check
    severity: low
    dimension: validity
    message: Customer group 2 KNVV.KVGR2 must exist in TVV2
    why_it_matters: Customer group 2 is a free classification used in pricing, statistics (LIS/BW) and output. A value not defined
      in TVV2 is ignored by every selection and condition table keyed on it.
    rule_authority: best_practice
    sap_impact: Prices and statistics keyed on customer group 2 miss the customer.
    fix_map:
      __other__: 'Choose a defined customer group 2 (VD02 > Additional data; customising: Sales and Distribution > Master Data
        > Business Partners > Customers > Additional data).'
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): customer group 2 not defined in TVV2.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM218
    field: KNVV.KVGR3
    check_class: referential_check
    severity: low
    dimension: validity
    message: Customer group 3 KNVV.KVGR3 must exist in TVV3
    why_it_matters: Customer group 3 is a free classification used in pricing, statistics (LIS/BW) and output. A value not defined
      in TVV3 is ignored by every selection and condition table keyed on it.
    rule_authority: best_practice
    sap_impact: Prices and statistics keyed on customer group 3 miss the customer.
    fix_map:
      __other__: 'Choose a defined customer group 3 (VD02 > Additional data; customising: Sales and Distribution > Master Data
        > Business Partners > Customers > Additional data).'
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): customer group 3 not defined in TVV3.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM219
    field: KNVV.KVGR4
    check_class: referential_check
    severity: low
    dimension: validity
    message: Customer group 4 KNVV.KVGR4 must exist in TVV4
    why_it_matters: Customer group 4 is a free classification used in pricing, statistics (LIS/BW) and output. A value not defined
      in TVV4 is ignored by every selection and condition table keyed on it.
    rule_authority: best_practice
    sap_impact: Prices and statistics keyed on customer group 4 miss the customer.
    fix_map:
      __other__: 'Choose a defined customer group 4 (VD02 > Additional data; customising: Sales and Distribution > Master Data
        > Business Partners > Customers > Additional data).'
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): customer group 4 not defined in TVV4.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM220
    field: KNVV.KVGR5
    check_class: referential_check
    severity: low
    dimension: validity
    message: Customer group 5 KNVV.KVGR5 must exist in TVV5
    why_it_matters: Customer group 5 is a free classification used in pricing, statistics (LIS/BW) and output. A value not defined
      in TVV5 is ignored by every selection and condition table keyed on it.
    rule_authority: best_practice
    sap_impact: Prices and statistics keyed on customer group 5 miss the customer.
    fix_map:
      __other__: 'Choose a defined customer group 5 (VD02 > Additional data; customising: Sales and Distribution > Master Data
        > Business Partners > Customers > Additional data).'
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): customer group 5 not defined in TVV5.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM221
    field: KNVV.UEBTK
    check_class: cross_field_check
    fail_when: (`KNVV.UEBTK` == 'X') & (`KNVV.UEBTO` > 0)
    severity: low
    dimension: consistency
    message: Unlimited overdelivery is allowed and an overdelivery tolerance is also set
    why_it_matters: With unlimited overdelivery (KNVV.UEBTK) the tolerance (KNVV.UEBTO) is ignored. Both together means the
      intended limit is not enforced on deliveries.
    rule_authority: best_practice
    sap_impact: Deliveries exceed the order quantity without the tolerance warning the business expects.
    fix_map:
      __other__: Remove the unlimited flag or the tolerance in VD02 > Shipping, whichever does not reflect the agreement.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): unlimited overdelivery with a tolerance.'
  - id: SDCM222
    field: KNVV.KKBER
    check_class: exists_check
    fields:
    - KNVV.KUNNR
    - KNVV.KKBER
    target_table: KNKK
    target_fields:
    - KUNNR
    - KKBER
    grain: KNVV
    severity: medium
    dimension: consistency
    message: Sales area credit control area has no credit master for the customer
    why_it_matters: When KNVV.KKBER is set, orders in the sales area are checked in that credit control area. Without a KNKK
      record there the customer has no limit, so automatic credit control either blocks every order or uses the risk category
      default.
    rule_authority: sap_hard_constraint
    sap_impact: Orders are blocked for credit (VKM1) or pass without a real credit check.
    fix_map:
      __other__: Create the credit master for the credit control area (FD32), or remove the sales area override.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): no credit master in credit control
      area {KNVV.KKBER}.'
  - id: SDCM223
    field: KNVV.KUNNR
    check_class: exists_check
    fields:
    - KNVV.KUNNR
    target_table: KNVI
    target_fields:
    - KUNNR
    grain: KNVV
    severity: high
    dimension: completeness
    message: Customer with sales data has no tax classification for any country
    why_it_matters: Output tax in SD is found from the customer's tax classification (KNVI.TAXKD) per departure country and
      tax category. A customer with sales areas but no KNVI row gets no tax condition on orders and invoices.
    rule_authority: regulatory
    sap_impact: Invoices are issued without VAT or sales tax, or billing stops with a missing tax condition.
    fix_map:
      __other__: Maintain the tax classification for each departure country in XD02 > Sales area > Billing documents.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): no tax classification.'
  - id: SDCM224
    field: KNVI.TAXKD
    check_class: null_check
    grain: KNVI
    severity: medium
    dimension: completeness
    message: Tax classification row has no tax classification value
    why_it_matters: 'A KNVI row for a country and tax category without a classification is treated like a missing row: the tax
      condition record cannot be found for the customer.'
    rule_authority: regulatory
    sap_impact: Orders and invoices for the country are created without tax or stop in pricing.
    fix_map:
      __other__: Enter the tax classification in XD02 > Sales area > Billing documents > Taxes.
    record_fix_template: 'Customer {KNVI.KUNNR}: country {KNVI.ALAND}, tax category {KNVI.TATYP} has no tax classification.'
  - id: SDCM225
    field: KNVI.TAXKD
    check_class: referential_check
    severity: medium
    dimension: validity
    message: Customer tax classification KNVI.TAXKD must exist in TSKD
    why_it_matters: The classification must be defined for the tax category (TSKD); otherwise the tax condition records keyed
      on it are never found.
    rule_authority: sap_hard_constraint
    sap_impact: Pricing finds no tax condition; invoices carry no or wrong tax.
    fix_map:
      __other__: Choose a classification defined for the tax category (customising OVK3).
    record_fix_template: 'Customer {KNVI.KUNNR}: tax classification for country {KNVI.ALAND}, category {KNVI.TATYP} is not in
      TSKD.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM226
    field: KNVI.TATYP
    check_class: referential_check
    severity: low
    dimension: validity
    message: Tax category KNVI.TATYP must exist as a condition type in T685A
    why_it_matters: The tax category is a pricing condition type (MWST, UTXJ...). A category that is not a condition type is
      never read by pricing, so the classification next to it has no effect.
    rule_authority: sap_hard_constraint
    sap_impact: Tax is not determined for the category the customer was classified under.
    fix_map:
      __other__: Use the tax categories assigned to the country (customising OVK1) and remove the others.
    record_fix_template: 'Customer {KNVI.KUNNR}: tax category {KNVI.TATYP} for country {KNVI.ALAND} is not a condition type.'
  - id: SDCM227
    field: KNVP.PARVW
    check_class: referential_check
    severity: medium
    dimension: validity
    message: Partner function KNVP.PARVW must exist in TPAR
    why_it_matters: The partner function decides how the partner is copied into documents. A function not defined in TPAR is
      never determined.
    rule_authority: sap_hard_constraint
    sap_impact: The partner is not copied into orders, deliveries or invoices.
    fix_map:
      __other__: Replace the function with a defined one (customising VOPA).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): partner function {KNVP.PARVW} is not
      in TPAR.'
  - id: SDCM228
    field: KNVP.KUNN2
    check_class: exists_check
    grain: KNVP
    target_table: KNA1
    target_fields:
    - KUNNR
    target_when:
      AUFSD:
        populated: true
    negate: true
    severity: medium
    dimension: consistency
    message: Partner customer is blocked for orders centrally
    why_it_matters: Partner functions are copied into every new order. A ship-to, bill-to or payer with a central order block
      stops order entry for the sold-to as well.
    rule_authority: sap_hard_constraint
    sap_impact: Order entry stops with 'partner is blocked' for every order of the sold-to.
    fix_map:
      __other__: Replace the blocked partner in XD02 > Partner functions, or lift the block if it is obsolete.
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): partner {KNVP.PARVW} {KNVP.KUNN2}
      is blocked for orders.'
  - id: SDCM229
    field: KNVP.KUNN2
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.PARVW:
      - RG
    target_table: KNA1
    target_fields:
    - KUNNR
    target_when:
      SPERR:
        populated: true
    negate: true
    severity: high
    dimension: consistency
    message: Payer is blocked for posting centrally
    why_it_matters: The payer receives the receivable when an invoice is released to accounting. A payer blocked for posting
      makes every invoice for the sold-to fail in accounting.
    rule_authority: sap_hard_constraint
    sap_impact: Billing documents stay in VFX3 with 'account blocked for posting'; revenue is not posted.
    fix_map:
      __other__: Replace the payer in XD02 > Partner functions or lift the posting block (XD05).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): payer {KNVP.KUNN2} is blocked for
      posting.'
  - id: SDCM230
    field: KNVP.PARNR
    check_class: exists_check
    grain: KNVP
    target_table: KNVK
    target_fields:
    - PARNR
    target_when:
      LOEVM:
        blank: true
    severity: medium
    dimension: consistency
    message: Contact person in the partner functions does not exist or is flagged for deletion
    why_it_matters: A contact person partner (AP) refers to a KNVK record. If that record is missing or deleted, output and
      CRM replication address documents to nobody.
    rule_authority: sap_hard_constraint
    sap_impact: Order confirmations and invoices addressed to the contact cannot be sent.
    fix_map:
      __other__: Replace the contact person in XD02 > Partner functions or re-create the contact (XD02 > Contact persons).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): contact person {KNVP.PARNR} does not
      exist or is deleted.'
  - id: SDCM231
    field: KNVP.LIFNR
    check_class: exists_check
    grain: KNVP
    target_table: LFA1
    target_fields:
    - LIFNR
    target_when:
      LOEVM:
        blank: true
    severity: medium
    dimension: consistency
    message: Vendor partner (forwarding agent) does not exist or is flagged for deletion
    why_it_matters: Partner functions such as forwarding agent (SP) point to a vendor. A missing or deleted vendor is copied
      into deliveries and shipments, where freight cost settlement fails.
    rule_authority: sap_hard_constraint
    sap_impact: Shipment cost documents (VI01) cannot be settled to the carrier.
    fix_map:
      __other__: Replace the vendor in XD02 > Partner functions or reactivate the vendor.
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): vendor partner {KNVP.LIFNR} does not
      exist or is deleted.'
  - id: SDCM232
    field: KNVP.PARVW
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.KUNN2:
        blank: true
    target_table: TPAR
    target_fields:
    - PARVW
    target_when:
      NRART:
      - KU
    negate: true
    severity: high
    dimension: completeness
    message: Customer-type partner function has no partner customer
    why_it_matters: 'Partner functions of type customer (TPAR.NRART = KU: sold-to, ship-to, bill-to, payer and their custom
      copies) must name a customer in KNVP.KUNN2. An empty partner is copied into documents as a gap.'
    rule_authority: sap_hard_constraint
    sap_impact: Partner determination in VA01 fails or leaves the function empty; delivery or billing cannot be created.
    fix_map:
      __other__: Enter the partner customer in XD02 > Partner functions or delete the empty line.
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): partner function {KNVP.PARVW} has
      no customer.'
  - id: SDCM233
    field: KNVV.KUNNR
    check_class: exists_check
    fields:
    - KNVV.KUNNR
    - KNVV.VKORG
    - KNVV.VTWEG
    - KNVV.SPART
    target_table: KNVP
    target_fields:
    - KUNNR
    - VKORG
    - VTWEG
    - SPART
    target_when:
      PARVW:
      - AG
    grain: KNVV
    applies_when:
      KNVV.LOEVM:
        blank: true
    severity: critical
    dimension: completeness
    message: Sales area has no sold-to party partner function
    why_it_matters: Every sales area of a customer that buys needs the sold-to (AG) partner function; SAP creates it with the
      sales area. Without it the customer cannot be entered as sold-to in that sales area.
    rule_authority: sap_hard_constraint
    sap_impact: VA01 rejects the customer in the sales area; partner determination has nothing to copy.
    fix_map:
      __other__: Add the sold-to function (normally the customer itself) in XD02 > Partner functions.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): no sold-to partner function.'
  - id: SDCM234
    field: KNVK.KUNNR
    check_class: exists_check
    grain: KNVK
    target_table: KNA1
    target_fields:
    - KUNNR
    severity: medium
    dimension: consistency
    message: Contact person belongs to a customer that does not exist
    why_it_matters: 'KNVK rows hang off the customer number. A contact person whose customer is missing is an orphan: it appears
      in contact searches and CVI conversion but no transaction can maintain it.'
    rule_authority: sap_hard_constraint
    sap_impact: CVI conversion of contact persons (CVI_CUST_CT_LINK) fails; orphan personal data is kept without a purpose.
    fix_map:
      __other__: Delete the orphan contact (report or table maintenance after approval) or re-create the customer link.
    record_fix_template: 'Contact person {KNVK.PARNR}: customer {KNVK.KUNNR} does not exist.'
  - id: SDCM235
    field: KNVK.ABTNR
    check_class: referential_check
    severity: low
    dimension: validity
    message: Contact person department KNVK.ABTNR must exist in TSAB
    why_it_matters: The contact person department is used to select contacts for output, marketing and CRM replication. A value
      not defined in TSAB is dropped by every selection on it.
    rule_authority: best_practice
    sap_impact: The contact is missed by selections and output by department.
    fix_map:
      __other__: Choose a defined value in XD02 > Contact persons (customising OVPA).
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR}: department is not defined in TSAB.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM236
    field: KNVK.PAFKT
    check_class: referential_check
    severity: low
    dimension: validity
    message: Contact person function KNVK.PAFKT must exist in TPFK
    why_it_matters: The contact person function is used to select contacts for output, marketing and CRM replication. A value
      not defined in TPFK is dropped by every selection on it.
    rule_authority: best_practice
    sap_impact: The contact is missed by selections and output by function.
    fix_map:
      __other__: Choose a defined value in XD02 > Contact persons (customising OVPA).
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR}: function is not defined in TPFK.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM237
    field: KNVK.PARVO
    check_class: referential_check
    severity: low
    dimension: validity
    message: Contact person VIP indicator KNVK.PARVO must exist in TVPV
    why_it_matters: The contact person VIP indicator is used to select contacts for output, marketing and CRM replication. A
      value not defined in TVPV is dropped by every selection on it.
    rule_authority: best_practice
    sap_impact: The contact is missed by selections and output by VIP indicator.
    fix_map:
      __other__: Choose a defined value in XD02 > Contact persons (customising OVPV).
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR}: VIP indicator is not defined in TVPV.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM238
    field: KNVK.PARLA
    check_class: referential_check
    severity: low
    dimension: validity
    message: Contact person language KNVK.PARLA must exist in T002
    why_it_matters: The contact person language is used to select contacts for output, marketing and CRM replication. A value
      not defined in T002 is dropped by every selection on it.
    rule_authority: best_practice
    sap_impact: The contact is missed by selections and output by language.
    fix_map:
      __other__: Choose a defined value in XD02 > Contact persons (customising SPRAS).
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR}: language is not defined in T002.'
  - id: SDCM239
    field: KNVK.LOEVM
    check_class: cross_field_check
    fail_when: (`KNA1.LOEVM` == 'X') & `KNVK.LOEVM`.isna()
    grain: KNVK
    severity: low
    dimension: consistency
    message: Contact person is active on a customer flagged for deletion
    why_it_matters: When a customer is retired its contact persons should be retired too. Active contacts on a deleted customer
      keep personal data without a business purpose and are still replicated.
    rule_authority: regulatory
    sap_impact: Personal data is retained beyond its purpose (GDPR / POPIA); contacts still receive output.
    fix_map:
      __other__: Flag the contact persons for deletion with the customer and plan their archiving or ILM blocking.
    record_fix_template: 'Contact person {KNVK.PARNR}: customer {KNVK.KUNNR} is flagged for deletion, the contact is not.'
    auto_fix:
      steps:
      - op: set
        value: X
      confidence: medium
  - id: SDCM240
    field: KNVA.KUNNR
    check_class: exists_check
    grain: KNVA
    target_table: KNA1
    target_fields:
    - KUNNR
    severity: low
    dimension: consistency
    message: Unloading point belongs to a customer that does not exist
    why_it_matters: Unloading points (KNVA) hang off the customer number. An orphan row is never offered in deliveries and shows
      a load or deletion that went wrong.
    rule_authority: sap_hard_constraint
    sap_impact: None in documents; the orphan rows blur migration reconciliations.
    fix_map:
      __other__: Delete the orphan unloading point or re-create the customer link.
    record_fix_template: 'Unloading point of customer {KNVA.KUNNR}: the customer does not exist.'
  - id: SDCM241
    field: KNVA.KNFAK
    check_class: referential_check
    severity: medium
    dimension: validity
    message: Unloading point calendar KNVA.KNFAK must exist in TFACD
    why_it_matters: The customer calendar of the unloading point moves delivery dates to the customer's working days in scheduling.
      A calendar not defined in TFACD makes delivery scheduling fail.
    rule_authority: sap_hard_constraint
    sap_impact: Delivery dates are scheduled on days the customer does not receive goods, or scheduling errors.
    fix_map:
      __other__: Choose a defined factory calendar for the unloading point (XD02 > Unloading points; customising SCAL).
    record_fix_template: 'Customer {KNVA.KUNNR}: unloading point calendar is not defined in TFACD.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM242
    field: KNVA.WANID
    check_class: referential_check
    severity: low
    dimension: validity
    message: Goods receiving hours KNVA.WANID must exist in TVWA
    why_it_matters: Goods receiving hours restrict delivery scheduling to the customer's receiving times. An ID not defined
      in TVWA is ignored.
    rule_authority: best_practice
    sap_impact: Deliveries are planned outside the customer's receiving hours.
    fix_map:
      __other__: Choose defined goods receiving hours (XD02 > Unloading points; customising OVL4).
    record_fix_template: 'Customer {KNVA.KUNNR}: goods receiving hours ID is not defined in TVWA.'
    auto_fix:
      steps:
      - op: strip
      - op: upper
      confidence: medium
  - id: SDCM243
    field: KNVV.KKBER
    check_class: exists_check
    target_table: UKM_KKBER2SGM
    target_fields:
    - KKBER
    grain: KNVV
    s4_area: credit_management
    s4_impact: blocking
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: high
    dimension: consistency
    message: Sales area credit control area has no credit segment assigned in SAP Credit Management
    why_it_matters: The credit control area of the sales area decides which credit segment the sales documents check against.
      Without a segment assignment the check has no target after the conversion.
    rule_authority: s4hana_migration
    sap_impact: Sales orders for the customer fail or skip the credit check after the conversion.
    fix_map:
      __other__: Assign the credit control area to a credit segment (SPRO > Credit Management) or correct the sales area data
        (XD02 > Sales).
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: credit control area {KNVV.KKBER}
      has no credit segment.'
  - id: SDCM244
    field: KNVD.KUNNR
    check_class: exists_check
    target_table: KNA1
    target_fields:
    - KUNNR
    grain: KNVD
    s4_area: output_management
    s4_impact: warning
    simplification_item: Output Management - NAST output control replaced by S/4HANA Output Management
    baseline: s4_target
    severity: medium
    dimension: consistency
    message: Customer output master data belongs to a customer that does not exist
    why_it_matters: Document output settings (KNVD) are keyed by customer. Rows for a customer that is gone are never read and
      are not migrated to the output management of the business partner.
    rule_authority: s4hana_migration
    sap_impact: Orphan output settings stay behind and confuse the output migration.
    fix_map:
      __other__: Delete the orphan rows or recreate the customer.
    record_fix_template: 'Customer {KNVD.KUNNR}: output master row for a customer that does not exist.'
  - id: SDCM245
    field: KNVD.KUNNR
    check_class: exists_check
    fields:
    - KNVD.KUNNR
    - KNVD.VKORG
    - KNVD.VTWEG
    - KNVD.SPART
    target_table: KNVV
    target_fields:
    - KUNNR
    - VKORG
    - VTWEG
    - SPART
    grain: KNVD
    s4_area: output_management
    s4_impact: warning
    simplification_item: Output Management - NAST output control replaced by S/4HANA Output Management
    baseline: s4_target
    severity: medium
    dimension: consistency
    message: Customer output master data has no matching sales area
    why_it_matters: Customer output settings are valid for one sales area. Without a customer sales area record they never apply.
    rule_authority: s4hana_migration
    sap_impact: Output settings are not used and are not migrated.
    fix_map:
      __other__: Create the sales area data (XD01 > Sales) or delete the output settings.
    record_fix_template: 'Customer {KNVD.KUNNR}, sales area {KNVD.VKORG}/{KNVD.VTWEG}/{KNVD.SPART}: no sales area data.'
  - id: SDCM246
    field: KNVD.KUNNR
    check_class: exists_check
    target_table: KNA1
    target_fields:
    - KUNNR
    target_when:
      LOEVM: X
    negate: true
    grain: KNVD
    s4_area: output_management
    s4_impact: warning
    simplification_item: Output Management - NAST output control replaced by S/4HANA Output Management
    baseline: s4_target
    severity: medium
    dimension: consistency
    message: Customer output master data belongs to a customer flagged for deletion
    why_it_matters: Output settings of a customer flagged for deletion are dead weight; the output migration should not carry
      them to the new output management.
    rule_authority: s4hana_migration
    sap_impact: Settings of dead customers are migrated.
    fix_map:
      __other__: Delete the output settings or remove the deletion flag of the customer.
    record_fix_template: 'Customer {KNVD.KUNNR}: output master data for a customer flagged for deletion.'
  - id: SDCM247
    field: KNVD.NACHA
    check_class: cross_field_check
    fail_when: '`KNVD.NACHA` == ''4'''
    grain: KNVD
    s4_area: output_management
    s4_impact: warning
    simplification_item: Output Management - NAST output control replaced by S/4HANA Output Management
    baseline: s4_target
    severity: medium
    dimension: validity
    message: Customer output master data uses telex
    why_it_matters: Telex is not a channel of S/4HANA Output Management (print, e-mail and XML only).
    rule_authority: s4hana_migration
    sap_impact: Output to this customer has no channel after the conversion.
    fix_map:
      __other__: Change the transmission medium to e-mail or print (XD02 > Sales > Output).
    record_fix_template: 'Customer {KNVD.KUNNR}, sales area {KNVD.VKORG}: output via telex.'
  - id: SDCM248
    field: KNVD.NACHA
    check_class: cross_field_check
    fail_when: '`KNVD.NACHA` == ''2'''
    grain: KNVD
    s4_area: output_management
    s4_impact: warning
    simplification_item: Output Management - NAST output control replaced by S/4HANA Output Management
    baseline: s4_target
    severity: low
    dimension: validity
    message: Customer output master data uses fax
    why_it_matters: Fax is not a channel of S/4HANA Output Management; fax output needs a third party fax server through print
      or e-mail.
    rule_authority: s4hana_migration
    sap_impact: Output to this customer has no standard channel after the conversion.
    fix_map:
      __other__: Change the transmission medium to e-mail or print, or plan the fax gateway (XD02 > Sales > Output).
    record_fix_template: 'Customer {KNVD.KUNNR}, sales area {KNVD.VKORG}: output via fax.'
  - id: SDCM249
    field: KNVD.NACHA
    check_class: null_check
    applies_when:
      KNVD.DOANZ:
        gt: 0
    grain: KNVD
    s4_area: output_management
    s4_impact: warning
    simplification_item: Output Management - NAST output control replaced by S/4HANA Output Management
    baseline: s4_target
    severity: medium
    dimension: completeness
    message: Customer output master data asks for copies but names no transmission medium
    why_it_matters: An output quantity above zero without a transmission medium produces no output and cannot be mapped to an
      output channel.
    rule_authority: s4hana_migration
    sap_impact: The customer never receives the document.
    fix_map:
      __other__: Enter the transmission medium (XD02 > Sales > Output) or reset the number of copies.
    record_fix_template: 'Customer {KNVD.KUNNR}, sales area {KNVD.VKORG}: copies requested, no transmission medium.'
  - id: SDCM099
    field: KNVV.WAERS
    check_class: exists_check
    fields:
    - KNVV.WAERS
    target_table: TCURC
    target_fields:
    - WAERS
    severity: high
    dimension: accuracy
    message: Sales-area currency of the customer is not a defined currency
    why_it_matters: KNVV.WAERS is the currency the sales area prices and invoices the customer in. A code
      with no TCURC entry has no decimal places, no exchange rate and no rounding rules, so the sales
      order, the pricing procedure and the invoice all fail or post amounts the size of the smallest
      difference between two defined currencies.
    rule_authority: sap_hard_constraint
    sap_impact: Sales orders and billing documents for the customer cannot be priced or posted.
    fix_map:
      __other__: Correct the currency in VD02/XK02 (sales area data) to a currency defined in SPRO >
        SAP NetWeaver > General Settings > Currencies, or create the missing currency.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}:
      currency {KNVV.WAERS} is not defined.'
  - id: SDCM100
    field: KNVV.ERDAT
    check_class: cross_field_check
    fail_when: '`KNVV.ERDAT`.notna() & (`KNVV.ERDAT`.astype(''string'').str.strip() != '''') & (`KNVV.ERDAT` > @today)'
    severity: high
    dimension: timeliness
    message: Customer sales-area record was created in the future
    why_it_matters: ERDAT is the date the sales-area record was created. A date after the day the check runs
      means the record carries a timestamp from a different clock, or was written by an interface that
      misread the date, so every age and last-changed figure derived from it is wrong.
    rule_authority: sap_hard_constraint
    sap_impact: The record's creation date cannot be trusted, so staleness and change reporting on the
      customer sales area is wrong for this record.
    fix_map:
      __other__: Correct the creation date in the source system or interface and re-extract. A creation
        date cannot be later than the day it is read.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}:
      creation date {actual_value} is in the future.'
  - id: SDCM500
    field: KNB1.ZTERM
    check_class: exists_check
    target_table: T052
    target_fields:
    - ZTERM
    target_when:
      KOART:
        not_in:
        - K
    grain: KNB1
    severity: high
    dimension: validity
    message: Payment terms of the customer company code are not defined for customer accounts
    why_it_matters: KNB1.ZTERM must name a T052 payment term whose account type (T052.KOART) is blank (all accounts) or D (customers).
      A term defined only for vendors (KOART = K) is rejected by XD02 and FB70, so a value that is missing from T052 or restricted
      to vendors came in through a load that bypassed the check.
    rule_authority: sap_hard_constraint
    sap_impact: Invoice and credit memo postings stop with a payment-terms error or derive no due date, so dunning and the cash
      forecast ignore the items.
    fix_map:
      __other__: Replace KNB1.ZTERM with payment terms defined for customers (OBB8, account type blank or D) in XD02 > Company
        code data > Payment transactions.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: payment terms {actual_value} not defined for customers
      in T052.'
  - id: SDCM501
    field: KNB1.GUZTE
    check_class: exists_check
    target_table: T052
    target_fields:
    - ZTERM
    target_when:
      KOART:
        not_in:
        - K
    grain: KNB1
    severity: medium
    dimension: validity
    message: Payment terms for credit memos of the customer company code are not defined for customer accounts
    why_it_matters: KNB1.GUZTE must name a T052 payment term whose account type (T052.KOART) is blank (all accounts) or D (customers).
      A term defined only for vendors (KOART = K) is rejected by XD02 and FB70, so a value that is missing from T052 or restricted
      to vendors came in through a load that bypassed the check.
    rule_authority: sap_hard_constraint
    sap_impact: Invoice and credit memo postings stop with a payment-terms error or derive no due date, so dunning and the cash
      forecast ignore the items.
    fix_map:
      __other__: Replace KNB1.GUZTE with payment terms defined for customers (OBB8, account type blank or D) in XD02 > Company
        code data > Payment transactions.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: payment terms for credit memos {actual_value} not
      defined for customers in T052.'
  - id: SDCM502
    field: KNB1.WAKON
    check_class: exists_check
    target_table: T052
    target_fields:
    - ZTERM
    target_when:
      KOART:
        not_in:
        - K
    grain: KNB1
    severity: medium
    dimension: validity
    message: Payment terms for bill of exchange charges of the customer company code are not defined for customer accounts
    why_it_matters: KNB1.WAKON must name a T052 payment term whose account type (T052.KOART) is blank (all accounts) or D (customers).
      A term defined only for vendors (KOART = K) is rejected by XD02 and FB70, so a value that is missing from T052 or restricted
      to vendors came in through a load that bypassed the check.
    rule_authority: sap_hard_constraint
    sap_impact: Invoice and credit memo postings stop with a payment-terms error or derive no due date, so dunning and the cash
      forecast ignore the items.
    fix_map:
      __other__: Replace KNB1.WAKON with payment terms defined for customers (OBB8, account type blank or D) in XD02 > Company
        code data > Payment transactions.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: payment terms for bill of exchange charges {actual_value}
      not defined for customers in T052.'
  - id: SDCM503
    field: KNB1.XDEZV
    check_class: cross_field_check
    fail_when: (`KNB1.XDEZV` == 'X') & `KNB1.KNRZE`.isna()
    grain: KNB1
    severity: low
    dimension: consistency
    message: Decentralised processing is set but the customer has no head office
    why_it_matters: KNB1.XDEZV makes a branch account process its own dunning and payments instead of the head office (KNB1.KNRZE).
      On an account without a head office the flag has no meaning and shows a branch structure that was removed or never built.
    rule_authority: best_practice
    sap_impact: Dunning and payment programs behave as for a normal account; the head office set-up the flag suggests does not
      exist.
    fix_map:
      __other__: Remove the decentralised processing flag or enter the head office (XD02 > Company code data > Account management).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: decentralised processing set without a head office.'
  - id: SDCM504
    field: KNB1.VERDT
    check_class: freshness_check
    max_age_hours: 0
    applies_when:
      KNB1.VLIBB:
        gt: 0
    grain: KNB1
    severity: medium
    dimension: timeliness
    message: Export credit insurance of the customer has expired
    why_it_matters: KNB1.VLIBB is the amount insured by export credit insurance and KNB1.VERDT the date the cover ends. After
      that date the receivables are uninsured, but the master record still shows an insured amount.
    rule_authority: best_practice
    sap_impact: Credit decisions and risk reporting count insurance cover that no longer exists.
    fix_map:
      __other__: Renew the policy and update the validity date, or remove the insured amount (XD02 > Company code data > Correspondence
        > Export credit insurance).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: export credit insurance expired {age_days} days
      ago.'
  - id: SDCM505
    field: KNB1.VERDT
    check_class: cross_field_check
    fail_when: '`KNB1.VERDT`.notna() & (`KNB1.VLIBB`.isna() | (`KNB1.VLIBB` <= 0))'
    grain: KNB1
    severity: low
    dimension: consistency
    message: Export credit insurance has a validity date but no insured amount
    why_it_matters: 'A validity date (KNB1.VERDT) without an insured amount (KNB1.VLIBB) is half-maintained insurance data:
      either the amount was dropped or the date is left over from a cancelled policy.'
    rule_authority: best_practice
    sap_impact: Reports on insured receivables show no cover for this customer although a policy date exists.
    fix_map:
      __other__: Enter the insured amount or delete the validity date (XD02 > Company code data > Correspondence).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: insurance validity date without insured amount.'
  - id: SDCM506
    field: KNB1.VRSNR
    check_class: null_check
    applies_when:
      KNB1.VLIBB:
        gt: 0
    grain: KNB1
    severity: low
    dimension: completeness
    message: Export credit insurance amount is set but the insurance policy number is missing
    why_it_matters: An insured amount (KNB1.VLIBB) must be traceable to the policy that covers it. Without the insurance policy
      number (KNB1.VRSNR) a claim cannot be raised against the insurer when the customer defaults.
    rule_authority: best_practice
    sap_impact: A default on insured receivables cannot be claimed in time.
    fix_map:
      __other__: Enter the insurance policy number (XD02 > Company code data > Correspondence > Export credit insurance).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: insured amount without insurance policy number.'
  - id: SDCM507
    field: KNB1.VRBKZ
    check_class: null_check
    applies_when:
      KNB1.VLIBB:
        gt: 0
    grain: KNB1
    severity: low
    dimension: completeness
    message: Export credit insurance amount is set but the insurance institution number is missing
    why_it_matters: An insured amount (KNB1.VLIBB) must be traceable to the policy that covers it. Without the insurance institution
      number (KNB1.VRBKZ) a claim cannot be raised against the insurer when the customer defaults.
    rule_authority: best_practice
    sap_impact: A default on insured receivables cannot be claimed in time.
    fix_map:
      __other__: Enter the insurance institution number (XD02 > Company code data > Correspondence > Export credit insurance).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: insured amount without insurance institution number.'
  - id: SDCM508
    field: KNB1.VRSPR
    check_class: cross_field_check
    fail_when: '`KNB1.VRSPR`.notna() & ((`KNB1.VRSPR` > 100) | (`KNB1.VRSPR` < 0))'
    grain: KNB1
    severity: medium
    dimension: validity
    message: Export credit insurance deductible is outside 0 to 100 percent
    why_it_matters: KNB1.VRSPR is the percentage of a loss the company bears itself. A value below 0 or above 100 percent is
      not a possible deductible and comes from a mis-mapped amount or a decimal shift.
    rule_authority: best_practice
    sap_impact: Insured exposure is computed wrongly for this customer.
    fix_map:
      __other__: Correct the deductible percentage (XD02 > Company code data > Correspondence).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: deductible {actual_value} percent.'
  - id: SDCM509
    field: KNB1.ZINRT
    check_class: cross_field_check
    fail_when: '`KNB1.ZINRT`.notna() & (`KNB1.ZINRT` != ''00'') & (`KNB1.ZINRT` != ''0'') & `KNB1.VZSKZ`.isna()'
    grain: KNB1
    severity: low
    dimension: consistency
    message: Interest calculation frequency is set but the customer has no interest indicator
    why_it_matters: 'The account-balance interest run (F.26) selects customers by interest indicator (KNB1.VZSKZ) and then uses
      the frequency in months (KNB1.ZINRT). A frequency without an indicator is never used: the customer is outside every interest
      run although someone meant to charge interest.'
    rule_authority: best_practice
    sap_impact: Interest on overdue balances is never calculated for the customer.
    fix_map:
      __other__: Enter the interest indicator or clear the frequency (XD02 > Company code data > Account management).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: interest frequency {actual_value} without interest
      indicator.'
  - id: SDCM510
    field: KNB1.ZINDT
    check_class: cross_field_check
    fail_when: '`KNB1.ZINDT`.notna() & (`KNB1.ZINDT` > @today)'
    grain: KNB1
    severity: medium
    dimension: timeliness
    message: Key date of the last interest calculation is dated in the future
    why_it_matters: KNB1.ZINDT records a date that has already happened. A value after the day the check runs comes from a wrong
      system clock, a mis-mapped legacy load or an interface that swapped day and month, so every figure derived from it is
      wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Reports and programs that age or select on KNB1.ZINDT treat the interest history wrongly.
    fix_map:
      __other__: Correct the key date of the last interest calculation; it is set by the interest run (F.26) and cannot be later
        than today.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: KNB1.ZINDT {actual_value} is in the future.'
  - id: SDCM511
    field: KNB1.DATLZ
    check_class: cross_field_check
    fail_when: '`KNB1.DATLZ`.notna() & (`KNB1.DATLZ` > @today)'
    grain: KNB1
    severity: medium
    dimension: timeliness
    message: Date of the last interest calculation run is dated in the future
    why_it_matters: KNB1.DATLZ records a date that has already happened. A value after the day the check runs comes from a wrong
      system clock, a mis-mapped legacy load or an interface that swapped day and month, so every figure derived from it is
      wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Reports and programs that age or select on KNB1.DATLZ treat the interest history wrongly.
    fix_map:
      __other__: Correct the date of the last interest run; the interest program sets it and it cannot be later than today.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: KNB1.DATLZ {actual_value} is in the future.'
  - id: SDCM512
    field: KNB1.ERDAT
    check_class: cross_field_check
    fail_when: '`KNB1.ERDAT`.notna() & (`KNB1.ERDAT` > @today)'
    grain: KNB1
    severity: medium
    dimension: timeliness
    message: Customer company code record creation date is dated in the future
    why_it_matters: KNB1.ERDAT records a date that has already happened. A value after the day the check runs comes from a wrong
      system clock, a mis-mapped legacy load or an interface that swapped day and month, so every figure derived from it is
      wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Reports and programs that age or select on KNB1.ERDAT treat the record age wrongly.
    fix_map:
      __other__: Correct the creation date in the legacy load or interface and re-extract.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: KNB1.ERDAT {actual_value} is in the future.'
  - id: SDCM513
    field: KNB1.UPDAT
    check_class: cross_field_check
    fail_when: '`KNB1.UPDAT`.notna() & (`KNB1.UPDAT` > @today)'
    grain: KNB1
    severity: low
    dimension: timeliness
    message: Date of the last confirmed change to the customer company code is dated in the future
    why_it_matters: KNB1.UPDAT records a date that has already happened. A value after the day the check runs comes from a wrong
      system clock, a mis-mapped legacy load or an interface that swapped day and month, so every figure derived from it is
      wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Reports and programs that age or select on KNB1.UPDAT treat the change history wrongly.
    fix_map:
      __other__: Correct the change date in the interface that writes it and re-extract.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: KNB1.UPDAT {actual_value} is in the future.'
  - id: SDCM514
    field: KNB1.UPDAT
    check_class: cross_field_check
    fail_when: '`KNB1.UPDAT`.notna() & `KNB1.ERDAT`.notna() & (`KNB1.UPDAT` < `KNB1.ERDAT`)'
    grain: KNB1
    severity: low
    dimension: consistency
    message: Customer company code record was last changed before it was created
    why_it_matters: KNB1.UPDAT is the date of the last confirmed change. A record cannot be changed before it exists, so a change
      date earlier than the creation date (KNB1.ERDAT) means one of the two dates was loaded wrongly.
    rule_authority: sap_hard_constraint
    sap_impact: Change and dual-control audits on the record are unreliable.
    fix_map:
      __other__: Correct the creation or change date in the source and re-extract.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: changed {actual_value} before creation.'
  - id: SDCM515
    field: KNB1.CONFS
    check_class: cross_field_check
    fail_when: '`KNB1.CONFS`.notna()'
    grain: KNB1
    severity: high
    dimension: validity
    message: Sensitive-field changes to the customer company code are not confirmed
    why_it_matters: When a field defined as sensitive (T055F, for example the payment method or house bank) changes, SAP sets
      KNB1.CONFS until a second person confirms the change in FD08 or FD09. Blank means confirmed; any value means the change
      is waiting or was rejected. This is the dual-control fraud safeguard for customer payments.
    rule_authority: best_practice
    sap_impact: The automatic payment program F110 does not process the customer (direct debits and refunds stop), and an unreviewed
      change to payment data stays on the account.
    fix_map:
      __other__: Have a second user review and confirm or reject the change in FD08 (single) or FD09 (list).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: sensitive-field change not confirmed (status {actual_value}).'
  - id: SDCM516
    field: KNB1.INTAD
    check_class: regex_check
    pattern: ^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$
    grain: KNB1
    severity: medium
    dimension: validity
    message: E-mail address of the customer's accounting clerk is not a valid address
    why_it_matters: KNB1.INTAD holds the e-mail address of the clerk at the customer. Correspondence (account statements, dunning
      by e-mail, payment advices) is sent to it; a value without a single @ and a domain cannot be delivered.
    rule_authority: best_practice
    sap_impact: E-mailed dunning notices and statements bounce, and receivables age without the customer being told.
    fix_map:
      __other__: Correct the clerk's internet address (XD02 > Company code data > Correspondence).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: clerk''s e-mail address is not valid.'
  - id: SDCM517
    field: KNB1.TLFNS
    check_class: regex_check
    pattern: ^\+?[0-9][0-9 ()/.-]{4,}$
    grain: KNB1
    severity: low
    dimension: validity
    message: Telephone number of the customer's accounting clerk is not a number
    why_it_matters: KNB1.TLFNS is the telephone number of the clerk at the customer that collections staff call. Letters, fewer
      than five digits or text such as 'see contact' cannot be dialled.
    rule_authority: best_practice
    sap_impact: Collections cannot reach the customer's accounts department from the master record.
    fix_map:
      __other__: Enter the clerk's telephone number in international form (XD02 > Company code data > Correspondence).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: clerk''s telephone number is not a valid number.'
  - id: SDCM518
    field: KNB1.TLFXS
    check_class: regex_check
    pattern: ^\+?[0-9][0-9 ()/.-]{4,}$
    grain: KNB1
    severity: low
    dimension: validity
    message: Fax number of the customer's accounting clerk is not a number
    why_it_matters: KNB1.TLFXS is the fax number of the clerk at the customer that collections staff call. Letters, fewer than
      five digits or text such as 'see contact' cannot be dialled.
    rule_authority: best_practice
    sap_impact: Collections cannot reach the customer's accounts department from the master record.
    fix_map:
      __other__: Enter the clerk's fax number in international form (XD02 > Company code data > Correspondence).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: clerk''s fax number is not a valid number.'
  - id: SDCM519
    field: KNB1.ALTKN
    check_class: uniqueness_check
    fields:
    - KNB1.BUKRS
    - KNB1.ALTKN
    grain: KNB1
    severity: medium
    dimension: uniqueness
    message: Previous account number is held by more than one customer in the company code
    why_it_matters: KNB1.ALTKN carries the customer number in the legacy system. Two customers with the same previous number
      in one company code were created twice from one legacy account, or a legacy merge was mapped wrongly.
    rule_authority: best_practice
    sap_impact: Open items and balances from the legacy account are split across two customers; dunning and credit exposure
      are understated for each.
    fix_map:
      __other__: Merge the duplicate accounts (block one and post its items to the other), or correct the previous account number
        (XD02 > Company code data > Account management).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: previous account number shared with another customer.'
  - id: SDCM520
    field: KNB1.TOGRU
    check_class: exists_check
    fields:
    - KNB1.BUKRS
    - KNB1.TOGRU
    target_table: T043G
    target_fields:
    - BUKRS
    - TOGRU
    grain: KNB1
    severity: medium
    dimension: consistency
    message: Tolerance group of the customer is not defined for its company code
    why_it_matters: 'T043G is keyed by company code: a tolerance group defined in one company code does not exist in another.
      A value valid somewhere in the client but missing for the customer''s own company code passes a client-wide value check
      and still fails every transaction posted in that company code.'
    rule_authority: sap_hard_constraint
    sap_impact: Postings, payment runs or dunning in the company code stop with a configuration error for this customer.
    fix_map:
      __other__: Define the tolerance group for the company code (OBA3) or replace it in XD02 > Company code data.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: tolerance group {KNB1.TOGRU} is not defined for
      the company code.'
  - id: SDCM521
    field: KNB1.LOCKB
    check_class: exists_check
    fields:
    - KNB1.BUKRS
    - KNB1.LOCKB
    target_table: T049L
    target_fields:
    - BUKRS
    - LOCKB
    grain: KNB1
    severity: medium
    dimension: consistency
    message: Lockbox of the customer is not defined for its company code
    why_it_matters: 'T049L is keyed by company code: a lockbox defined in one company code does not exist in another. A value
      valid somewhere in the client but missing for the customer''s own company code passes a client-wide value check and still
      fails every transaction posted in that company code.'
    rule_authority: sap_hard_constraint
    sap_impact: Postings, payment runs or dunning in the company code stop with a configuration error for this customer.
    fix_map:
      __other__: Define the lockbox for the company code (OB10) or replace it in XD02 > Company code data.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: lockbox {KNB1.LOCKB} is not defined for the company
      code.'
  - id: SDCM522
    field: KNB1.BUSAB
    check_class: exists_check
    fields:
    - KNB1.BUKRS
    - KNB1.BUSAB
    target_table: T001S
    target_fields:
    - BUKRS
    - BUSAB
    grain: KNB1
    severity: medium
    dimension: consistency
    message: Accounting clerk of the customer is not defined for its company code
    why_it_matters: 'T001S is keyed by company code: a accounting clerk defined in one company code does not exist in another.
      A value valid somewhere in the client but missing for the customer''s own company code passes a client-wide value check
      and still fails every transaction posted in that company code.'
    rule_authority: sap_hard_constraint
    sap_impact: Postings, payment runs or dunning in the company code stop with a configuration error for this customer.
    fix_map:
      __other__: Define the accounting clerk for the company code (OB25) or replace it in XD02 > Company code data.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: accounting clerk {KNB1.BUSAB} is not defined for
      the company code.'
  - id: SDCM523
    field: KNB1.HBKID
    check_class: exists_check
    fields:
    - KNB1.BUKRS
    - KNB1.HBKID
    target_table: T012
    target_fields:
    - BUKRS
    - HBKID
    grain: KNB1
    severity: medium
    dimension: consistency
    message: House bank of the customer is not defined for its company code
    why_it_matters: 'T012 is keyed by company code: a house bank defined in one company code does not exist in another. A value
      valid somewhere in the client but missing for the customer''s own company code passes a client-wide value check and still
      fails every transaction posted in that company code.'
    rule_authority: sap_hard_constraint
    sap_impact: Postings, payment runs or dunning in the company code stop with a configuration error for this customer.
    fix_map:
      __other__: Define the house bank for the company code (FI12) or replace it in XD02 > Company code data.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: house bank {KNB1.HBKID} is not defined for the company
      code.'
  - id: SDCM524
    field: KNB1.CESSION_KZ
    check_class: exists_check
    fields:
    - KNB1.BUKRS
    - KNB1.CESSION_KZ
    target_table: TCESSION
    target_fields:
    - COMPANY
    - CESSION_KZ
    grain: KNB1
    severity: medium
    dimension: consistency
    message: Accounts receivable pledging indicator of the customer is not defined for its company code
    why_it_matters: 'TCESSION is keyed by company code: a accounts receivable pledging indicator defined in one company code
      does not exist in another. A value valid somewhere in the client but missing for the customer''s own company code passes
      a client-wide value check and still fails every transaction posted in that company code.'
    rule_authority: sap_hard_constraint
    sap_impact: Postings, payment runs or dunning in the company code stop with a configuration error for this customer.
    fix_map:
      __other__: Define the accounts receivable pledging indicator for the company code (OBAY) or replace it in XD02 > Company
        code data.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: accounts receivable pledging indicator {KNB1.CESSION_KZ}
      is not defined for the company code.'
  - id: SDCM525
    field: KNB1.KNRZB
    check_class: exists_check
    fields:
    - KNB1.KNRZB
    - KNB1.BUKRS
    target_table: KNB1
    target_fields:
    - KUNNR
    - BUKRS
    grain: KNB1
    severity: medium
    dimension: consistency
    message: Alternative payer of the customer is not created in the company code
    why_it_matters: The alternative payer (KNB1.KNRZB) receives the direct debits and refunds the payment program makes for
      the customer in that company code. A payer without company code data in the same company code cannot be paid or debited
      there.
    rule_authority: sap_hard_constraint
    sap_impact: F110 stops with an error for the customer's items, so direct debits are not collected.
    fix_map:
      __other__: Extend the alternative payer to the company code (XD01/BP) or change the payer in XD02.
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: alternative payer {KNB1.KNRZB} not created in the
      company code.'
  - id: SDCM526
    field: KNB1.XZVER
    check_class: null_check
    applies_when:
      KNB1.LOEVM:
        blank: true
    grain: KNB1
    severity: low
    dimension: completeness
    message: Payment history is not recorded for the customer
    why_it_matters: KNB1.XZVER records the customer's payment history (days of arrears, cash discount taken) that the credit
      management key figures, the DSO analysis and FIN-FSCM-CR payment behaviour scoring are built from. Without it the customer
      has no history to score.
    rule_authority: best_practice
    sap_impact: Credit scoring and the payment history (FD10N/F.2C) are empty for the customer.
    fix_map:
      __other__: Set Record payment history (XD02 > Company code data > Payment transactions).
    record_fix_template: 'Customer {KNB1.KUNNR}, company code {KNB1.BUKRS}: payment history not recorded.'
  - id: SDCM527
    field: KNB4.AUFZD
    check_class: cross_field_check
    fail_when: '`KNB4.AUFZD`.notna() & (`KNB4.AUFZD` > @today)'
    grain: KNB4
    severity: low
    dimension: timeliness
    message: Payment history recording date is dated in the future
    why_it_matters: KNB4.AUFZD records a date that has already happened. A value after the day the check runs comes from a wrong
      system clock, a mis-mapped legacy load or an interface that swapped day and month, so every figure derived from it is
      wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Reports and programs that age or select on KNB4.AUFZD treat the payment history wrongly.
    fix_map:
      __other__: Correct the payment history date in the source; the payment history program sets it.
    record_fix_template: 'Customer {KNB4.KUNNR}, company code {KNB4.BUKRS}: KNB4.AUFZD {actual_value} is in the future.'
  - id: SDCM528
    field: KNB4.KUNNR
    check_class: exists_check
    fields:
    - KNB4.KUNNR
    - KNB4.BUKRS
    target_table: KNB1
    target_fields:
    - KUNNR
    - BUKRS
    grain: KNB4
    severity: low
    dimension: consistency
    message: Customer payment history has no parent record in KNB1
    why_it_matters: KNB4 rows hang off KNB1. A row whose key (KNB4.KUNNR, KNB4.BUKRS) has no KNB1 record is an orphan left by
      a deletion, archiving or a partial legacy load; SAP transactions never show it, but extracts, the CVI synchronisation
      and migration objects still read it.
    rule_authority: sap_hard_constraint
    sap_impact: The orphan is converted or reported as live data although no master record carries it.
    fix_map:
      __other__: Delete or archive the orphan payment history (FI_ACCRECV) or create the company code data.
    record_fix_template: 'Customer {KNB4.KUNNR}, company code {KNB4.BUKRS}: payment history without company code data.'
  - id: SDCM529
    field: KNB5.KUNNR
    check_class: exists_check
    fields:
    - KNB5.KUNNR
    - KNB5.BUKRS
    target_table: KNB1
    target_fields:
    - KUNNR
    - BUKRS
    grain: KNB5
    severity: high
    dimension: consistency
    message: Customer dunning data has no parent record in KNB1
    why_it_matters: KNB5 rows hang off KNB1. A row whose key (KNB5.KUNNR, KNB5.BUKRS) has no KNB1 record is an orphan left by
      a deletion, archiving or a partial legacy load; SAP transactions never show it, but extracts, the CVI synchronisation
      and migration objects still read it.
    rule_authority: sap_hard_constraint
    sap_impact: The orphan is converted or reported as live data although no master record carries it.
    fix_map:
      __other__: Delete the orphan dunning record or create the customer's company code data.
