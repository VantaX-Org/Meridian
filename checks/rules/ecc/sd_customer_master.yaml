  - id: SDCM730
    field: KNVP.VKORG
    check_class: exists_check
    grain: KNVP
    fields:
    - KNVP.KUNNR
    - KNVP.VKORG
    - KNVP.VTWEG
    - KNVP.SPART
    target_table: KNVV
    target_fields:
    - KUNNR
    - VKORG
    - VTWEG
    - SPART
    s4_area: business_partner
    s4_impact: warning
    simplification_item: Business Partner Approach (SAP Note 2265093)
    baseline: s4_target
    severity: high
    dimension: consistency
    message: Partner functions are maintained for a sales area in which the customer has no sales data
    why_it_matters: KNVP is maintained per customer and sales area from the sales data screen of VD02. Partner rows for a
      sales area that has no KNVV record cannot be displayed or changed, cannot be used in a sales document, and are dropped
      by the Business Partner conversion, which converts partners only as part of the sales area role data.
    rule_authority: sap_hard_constraint
    sap_impact: Orphan partner functions are never used and are lost in the BP conversion.
    fix_map:
      __other__: Create the sales area data for the customer if the partners are needed, otherwise delete the orphan partner
        rows and correct the load that created them.
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}), partner function {KNVP.PARVW}: the
      customer has no sales data in this sales area.'
  - id: SDCM731
    field: KNVP.DEFPA
    check_class: uniqueness_check
    grain: KNVP
    applies_when:
      KNVP.DEFPA:
      - X
    fields:
    - KNVP.KUNNR
    - KNVP.VKORG
    - KNVP.VTWEG
    - KNVP.SPART
    - KNVP.PARVW
    severity: medium
    dimension: uniqueness
    message: More than one default partner is flagged for the same partner function
    why_it_matters: 'When a partner function has several partners (for example several ship-to parties), KNVP.DEFPA marks
      the one that is proposed in the sales order without a selection dialog. Two defaults for the same function make the
      proposal arbitrary: the order takes whichever row is read first.'
    rule_authority: sap_hard_constraint
    sap_impact: Sales orders propose an arbitrary default partner; goods or invoices can go to the wrong party.
    fix_map:
      __other__: Keep the default partner flag on exactly one partner per function in VD02 (Partner functions).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}), partner function {KNVP.PARVW}: more
      than one partner is flagged as default.'
  - id: SDCM732
