  - id: SDCM530
    field: KNB5.MABER
    check_class: exists_check
    fields:
    - KNB5.BUKRS
    - KNB5.MABER
    target_table: T047M
    target_fields:
    - BUKRS
    - MABER
    grain: KNB5
    severity: medium
    dimension: consistency
    message: Dunning area in the customer dunning data is not defined for the company code
    why_it_matters: T047M is keyed by company code. A dunning area that exists only in another company code passes a client-wide
      check but the dunning run (F150) for this company code cannot use it.
    rule_authority: sap_hard_constraint
    sap_impact: The dunning run skips or rejects the customer's items for this area.
    fix_map:
