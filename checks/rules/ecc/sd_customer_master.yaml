      - GD
      - GY
      - KN
      - SR
      - SC
      - ZW
    grain: KNA1
    severity: low
    dimension: validity
    message: Postal code entered for a country that has no postal code system
    why_it_matters: The United Arab Emirates, Qatar, Hong Kong, Macao, Botswana, Zimbabwe and several Caribbean states have
      no national postal code. A value in the field is a placeholder (00000), a PO box number or a code from another country,
