    require_populated: true
    applies_when:
      KNA1.LAND1:
      - ES
    grain: KNA1
    severity: medium
    dimension: consistency
    message: Spanish province does not match the first two digits of the postal code
    why_it_matters: In Spain the first two digits of the postal code are the INE province code (28 Madrid, 08 Barcelona), and
      the SAP regions for Spain (T005S) use the same two-digit code. A mismatch means one of the two is wrong; the province
      is reported on the Modelo 347 and SII and drives Canary Islands, Ceuta and Melilla tax treatment.
    rule_authority: iso_standard
    sap_impact: Tax reports carry the wrong province and Canary Islands/Ceuta/Melilla customers can be taxed as mainland Spain.
    fix_map:
