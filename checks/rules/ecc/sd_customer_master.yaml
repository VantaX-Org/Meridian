      14) != `TIBAN.BANKL`)'
    applies_when:
      TIBAN.BANKS:
      - FR
      TIBAN.TABNAME:
      - KNBK
    grain: TIBAN
    severity: high
    dimension: consistency
    message: FR customer IBAN does not contain the bank and branch code (code banque, code guichet) held for the account
    why_it_matters: A FR IBAN carries the domestic bank and branch code (code banque, code guichet) in positions 5-14 (ISO 13616
      national BBAN format). SAP pays and collects with the IBAN but clears, matches bank statements and checks the bank master
      with TIBAN.BANKL. When the two disagree one of them belongs to another account.
    rule_authority: iso_standard
    sap_impact: Direct debits go to the account in the IBAN while statements and the bank master point at another, or the bank
      rejects the mandate; electronic bank statement matching fails.
    fix_map:
      __other__: Confirm the account with the customer and regenerate the IBAN from the bank details, or correct the bank details
        to match the IBAN (XD02 > Payment transactions).
    record_fix_template: 'Customer IBAN in TIBAN.BANKS: bank and branch code (code banque, code guichet) in the IBAN differs
      from TIBAN.BANKL.'
