    grain: KNA1
    severity: medium
    dimension: consistency
    message: Australian state does not match the postcode range
    why_it_matters: Australia Post allocates postcode ranges by state (NSW 1000-2599, VIC 3000-3999, QLD 4000-4999, SA 5000-5999,
      WA 6000-6999, TAS 7000-7999, NT 0800-0999, ACT 0200-0299/2600-2618/2900-2920). A state outside its range means the region
