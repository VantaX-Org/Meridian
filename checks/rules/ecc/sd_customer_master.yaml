  - id: SDCM635
    field: KNBW.KUNNR
    check_class: exists_check
    fields:
    - KNBW.KUNNR
    - KNBW.BUKRS
    target_table: KNB1
    target_fields:
    - KUNNR
    - BUKRS
    grain: KNBW
    severity: high
    dimension: consistency
    message: Customer withholding tax data has no parent record in KNB1
    why_it_matters: KNBW rows hang off KNB1. A row whose key (KNBW.KUNNR, KNBW.BUKRS) has no KNB1 record is an orphan left by
      a deletion, archiving or a partial legacy load; SAP transactions never show it, but extracts, the CVI synchronisation
      and migration objects still read it.
    rule_authority: sap_hard_constraint
    sap_impact: The orphan is converted or reported as live data although no master record carries it.
    fix_map:
      __other__: Delete the orphan withholding tax record or create the company code data.
    record_fix_template: 'Customer {KNBW.KUNNR}, company code {KNBW.BUKRS}, withholding tax type {KNBW.WITHT}: no company code
      data.'
  - id: SDCM636
    field: KNBW.WITHT
    check_class: exists_check
    fields:
    - KNBW.BUKRS
    - KNBW.WITHT
    target_table: T001WT
    target_fields:
    - BUKRS
    - WITHT
    grain: KNBW
    severity: high
    dimension: consistency
    message: Withholding tax type of the customer is not assigned to the company code
    why_it_matters: Extended withholding tax types are activated per company code in T001WT. A type on the customer that the
      company code does not use is ignored or rejected at posting, so tax that should be withheld is not.
    rule_authority: sap_hard_constraint
    sap_impact: Withholding tax is not calculated on incoming payments; certificates and returns are incomplete.
    fix_map:
      __other__: Assign the withholding tax type to the company code (SPRO > Financial Accounting > Withholding Tax > Company
        Code > Assign Withholding Tax Types) or remove it from the customer.
    record_fix_template: 'Customer {KNBW.KUNNR}, company code {KNBW.BUKRS}, withholding tax type {KNBW.WITHT}: type not assigned
      to the company code.'
  - id: SDCM637
    field: KNBW.WT_WITHCD
    check_class: exists_check
    fields:
    - KNBW.WITHT
    - KNBW.WT_WITHCD
    target_table: T059Z
    target_fields:
    - WITHT
    - WT_WITHCD
    grain: KNBW
    severity: high
    dimension: consistency
    message: Withholding tax code does not belong to the customer's withholding tax type
    why_it_matters: A withholding tax code (T059Z) is defined under one withholding tax type. A code that exists only under
      a different type cannot be used with this type, so rate and base cannot be determined.
    rule_authority: sap_hard_constraint
    sap_impact: The payment posting stops or withholds at the wrong rate.
    fix_map:
      __other__: Choose a code defined for the type (SPRO > Withholding Tax > Calculation > Withholding Tax Codes) in XD02 >
        Company code data > Withholding tax.
    record_fix_template: 'Customer {KNBW.KUNNR}, company code {KNBW.BUKRS}, withholding tax type {KNBW.WITHT}: code {KNBW.WT_WITHCD}
      not defined for the type.'
  - id: SDCM638
    field: KNBW.WT_WITHCD
    check_class: null_check
    applies_when:
      KNBW.WT_AGENT:
      - X
    grain: KNBW
    severity: high
    dimension: completeness
    message: Customer is liable to withholding tax but has no withholding tax code
    why_it_matters: KNBW.WT_AGENT says the customer withholds tax on what it pays. Without a withholding tax code (WT_WITHCD)
      SAP cannot compute the amount withheld, so the incoming payment does not clear the invoice.
    rule_authority: best_practice
    sap_impact: Customer payments net of withholding tax leave residual items and the withheld tax is never recorded.
    fix_map:
      __other__: Enter the withholding tax code (XD02 > Company code data > Withholding tax).
    record_fix_template: 'Customer {KNBW.KUNNR}, company code {KNBW.BUKRS}, withholding tax type {KNBW.WITHT}: liable without
      a withholding tax code.'
  - id: SDCM639
    field: KNBW.WT_AGTDF
    check_class: cross_field_check
    fail_when: '`KNBW.WT_AGTDF`.notna() & `KNBW.WT_AGTDT`.notna() & (`KNBW.WT_AGTDF` > `KNBW.WT_AGTDT`)'
    grain: KNBW
    severity: medium
    dimension: consistency
    message: Customer withholding tax obligation starts after it ends
    why_it_matters: KNBW.WT_AGTDF and KNBW.WT_AGTDT bound the period of the withholding tax obligation. A start after the end
      leaves no valid day, so SAP never applies it.
    rule_authority: sap_hard_constraint
    sap_impact: The withholding tax obligation is never applied, so withholding tax is calculated wrongly on every payment.
    fix_map:
      __other__: Correct the validity dates (XD02 > Company code data > Withholding tax).
    record_fix_template: 'Customer {KNBW.KUNNR}, company code {KNBW.BUKRS}, withholding tax type {KNBW.WITHT}: withholding tax
      obligation from {KNBW.WT_AGTDF} is after the end date.'
  - id: SDCM640
    field: KNBW.WT_EXDF
    check_class: cross_field_check
    fail_when: '`KNBW.WT_EXDF`.notna() & `KNBW.WT_EXDT`.notna() & (`KNBW.WT_EXDF` > `KNBW.WT_EXDT`)'
    grain: KNBW
    severity: medium
    dimension: consistency
    message: Customer exemption starts after it ends
    why_it_matters: KNBW.WT_EXDF and KNBW.WT_EXDT bound the period of the exemption. A start after the end leaves no valid day,
      so SAP never applies it.
    rule_authority: sap_hard_constraint
    sap_impact: The exemption is never applied, so withholding tax is calculated wrongly on every payment.
    fix_map:
      __other__: Correct the validity dates (XD02 > Company code data > Withholding tax).
    record_fix_template: 'Customer {KNBW.KUNNR}, company code {KNBW.BUKRS}, withholding tax type {KNBW.WITHT}: exemption from
      {KNBW.WT_EXDF} is after the end date.'
  - id: SDCM641
    field: KNBW.WT_EXDT
    check_class: freshness_check
    max_age_hours: 0
    applies_when:
      KNBW.WT_EXRT:
        gt: 0
    grain: KNBW
    severity: medium
    dimension: timeliness
    message: Customer withholding tax exemption has expired
    why_it_matters: An exemption certificate is valid until KNBW.WT_EXDT. After that date SAP withholds at the full rate, but
      the record still shows the exemption, so the certificate was not renewed or the rate should be removed.
    rule_authority: best_practice
    sap_impact: Payments are withheld at the full rate or, where the date is ignored by custom logic, exempted without a valid
      certificate.
    fix_map:
      __other__: Record the renewed certificate (number, rate, dates) or remove the exemption in XD02 > Withholding tax.
    record_fix_template: 'Customer {KNBW.KUNNR}, company code {KNBW.BUKRS}, withholding tax type {KNBW.WITHT}: exemption expired
      {age_days} days ago.'
  - id: SDCM642
    field: KNBW.WT_EXRT
    check_class: cross_field_check
    fail_when: '`KNBW.WT_EXRT`.notna() & ((`KNBW.WT_EXRT` > 100) | (`KNBW.WT_EXRT` < 0))'
    grain: KNBW
    severity: high
    dimension: validity
    message: Withholding tax exemption rate is outside 0 to 100 percent
    why_it_matters: KNBW.WT_EXRT is the percentage of withholding tax the customer is exempt from. Below 0 or above 100 percent
      is not a possible exemption.
    rule_authority: sap_hard_constraint
    sap_impact: Withholding tax is computed with a negative or more than full exemption.
    fix_map:
      __other__: Correct the exemption rate (XD02 > Withholding tax).
    record_fix_template: 'Customer {KNBW.KUNNR}, company code {KNBW.BUKRS}, withholding tax type {KNBW.WITHT}: exemption rate
      {actual_value}.'
  - id: SDCM643
    field: KNBW.WT_EXNR
    check_class: null_check
    applies_when:
      KNBW.WT_EXRT:
        gt: 0
    grain: KNBW
    severity: medium
    dimension: completeness
    message: Withholding tax exemption has no certificate number
    why_it_matters: An exemption must be backed by a certificate from the tax authority. Without the certificate number (KNBW.WT_EXNR)
      the exemption cannot be shown in an audit or printed on the withholding tax return.
    rule_authority: best_practice
    sap_impact: Tax audits disallow the exemption and assess the tax not withheld.
    fix_map:
      __other__: Enter the exemption certificate number (XD02 > Withholding tax).
    record_fix_template: 'Customer {KNBW.KUNNR}, company code {KNBW.BUKRS}, withholding tax type {KNBW.WITHT}: exemption without
      certificate.'
  - id: SDCM644
    field: KNBW.WT_EXDT
    check_class: cross_field_check
    fail_when: (`KNBW.WT_EXRT` > 0) & `KNBW.WT_EXDF`.isna() & `KNBW.WT_EXDT`.isna()
    grain: KNBW
    severity: medium
    dimension: completeness
    message: Withholding tax exemption has no validity period
    why_it_matters: Exemption certificates are issued for a period. An exemption rate without from and to dates applies for
      ever and is never prompted for renewal.
    rule_authority: best_practice
    sap_impact: The customer stays exempt after the certificate lapses.
    fix_map:
      __other__: Enter the exemption validity dates from the certificate (XD02 > Withholding tax).
    record_fix_template: 'Customer {KNBW.KUNNR}, company code {KNBW.BUKRS}, withholding tax type {KNBW.WITHT}: exemption without
      validity dates.'
  - id: SDCM645
    field: KNBW.WT_WTEXRS
    check_class: cross_field_check
    fail_when: '`KNBW.WT_WTEXRS`.notna() & (`KNBW.WT_EXRT`.isna() | (`KNBW.WT_EXRT` <= 0))'
    grain: KNBW
    severity: low
    dimension: consistency
    message: Withholding tax exemption reason is set without an exemption rate
    why_it_matters: 'The exemption reason (KNBW.WT_WTEXRS) explains an exemption. With no exemption rate there is nothing to
      explain: the rate was removed or never entered.'
    rule_authority: best_practice
    sap_impact: Returns and certificates report an exemption reason for a customer that is fully taxed.
    fix_map:
      __other__: Enter the exemption rate or clear the reason (XD02 > Withholding tax).
    record_fix_template: 'Customer {KNBW.KUNNR}, company code {KNBW.BUKRS}, withholding tax type {KNBW.WITHT}: exemption reason
      {actual_value} without a rate.'
  - id: SDCM646
    field: KNBW.WT_AGTDT
    check_class: freshness_check
    max_age_hours: 0
    applies_when:
      KNBW.WT_AGENT:
      - X
    grain: KNBW
    severity: low
    dimension: timeliness
    message: Customer's withholding tax obligation has ended but is still flagged
    why_it_matters: KNBW.WT_AGTDT ends the period in which the customer withholds tax. After it the flag no longer applies,
      so the record either needs a new period or the obligation flag removed.
    rule_authority: best_practice
    sap_impact: Incoming payments are no longer matched with withholding tax, leaving residual items.
    fix_map:
      __other__: Extend the obligation period or remove the indicator (XD02 > Withholding tax).
    record_fix_template: 'Customer {KNBW.KUNNR}, company code {KNBW.BUKRS}, withholding tax type {KNBW.WITHT}: obligation ended
      {age_days} days ago.'
  - id: SDCM647
    field: KNBW.WT_AGENT
    check_class: cross_field_check
    fail_when: '`KNBW.WT_AGENT`.isna() & (`KNBW.WT_AGTDF`.notna() | `KNBW.WT_AGTDT`.notna())'
    grain: KNBW
    severity: low
    dimension: consistency
    message: Withholding tax obligation dates are set but the customer is not liable
    why_it_matters: Obligation dates (WT_AGTDF, WT_AGTDT) only apply when the liability indicator (WT_AGENT) is set. Dates without
      the indicator mean the indicator was lost or the dates are left over.
    rule_authority: best_practice
    sap_impact: No tax is withheld although an obligation period is recorded.
    fix_map:
      __other__: Set the liability indicator or clear the dates (XD02 > Withholding tax).
    record_fix_template: 'Customer {KNBW.KUNNR}, company code {KNBW.BUKRS}, withholding tax type {KNBW.WITHT}: obligation dates
      without liability indicator.'
  - id: SDCM648
    field: KNKK.CTLPC
    check_class: exists_check
    fields:
    - KNKK.CTLPC
    - KNKK.KKBER
    target_table: T691A
    target_fields:
    - CTLPC
    - KKBER
    grain: KNKK
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: medium
    dimension: consistency
    message: Risk category is not defined for the customer's credit control area
    why_it_matters: T691A is keyed by credit control area. A risk category defined in another area passes a client-wide check
      but has no settings in this one. FIN-FSCM-CR migration maps it per area to a risk class, check rule or credit group, so
      an undefined combination has no target.
    rule_authority: sap_hard_constraint
    sap_impact: Automatic credit checks find no settings, and the credit migration (UKM_MIGRATION) has no mapping.
    fix_map:
      __other__: Define the risk category for the credit control area (OB01) or correct it in FD32.
    record_fix_template: 'Customer {KNKK.KUNNR}, credit control area {KNKK.KKBER}: risk category {KNKK.CTLPC} not defined for
      the area.'
  - id: SDCM649
    field: KNKK.SBGRP
    check_class: exists_check
    fields:
    - KNKK.SBGRP
    - KNKK.KKBER
    target_table: T024B
    target_fields:
    - SBGRP
    - KKBER
    grain: KNKK
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: medium
    dimension: consistency
    message: Credit representative group is not defined for the customer's credit control area
    why_it_matters: T024B is keyed by credit control area. A credit representative group defined in another area passes a client-wide
      check but has no settings in this one. FIN-FSCM-CR migration maps it per area to a risk class, check rule or credit group,
      so an undefined combination has no target.
    rule_authority: sap_hard_constraint
    sap_impact: Automatic credit checks find no settings, and the credit migration (UKM_MIGRATION) has no mapping.
    fix_map:
      __other__: Define the credit representative group for the credit control area (OB02) or correct it in FD32.
    record_fix_template: 'Customer {KNKK.KUNNR}, credit control area {KNKK.KKBER}: credit representative group {KNKK.SBGRP}
      not defined for the area.'
  - id: SDCM650
    field: KNKK.GRUPP
    check_class: exists_check
    fields:
    - KNKK.GRUPP
    - KNKK.KKBER
    target_table: T691B
    target_fields:
    - GRUPP
    - KKBER
    grain: KNKK
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: medium
    dimension: consistency
    message: Customer credit group is not defined for the customer's credit control area
    why_it_matters: T691B is keyed by credit control area. A customer credit group defined in another area passes a client-wide
      check but has no settings in this one. FIN-FSCM-CR migration maps it per area to a risk class, check rule or credit group,
      so an undefined combination has no target.
    rule_authority: sap_hard_constraint
    sap_impact: Automatic credit checks find no settings, and the credit migration (UKM_MIGRATION) has no mapping.
    fix_map:
      __other__: Define the customer credit group for the credit control area (OB12) or correct it in FD32.
    record_fix_template: 'Customer {KNKK.KUNNR}, credit control area {KNKK.KKBER}: customer credit group {KNKK.GRUPP} not defined
      for the area.'
  - id: SDCM651
    field: KNKK.KUNNR
    check_class: exists_check
    fields:
    - KNKK.KUNNR
    target_table: KNA1
    target_fields:
    - KUNNR
    grain: KNKK
    s4_area: credit_management
    s4_impact: blocking
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: high
    dimension: consistency
    message: Customer credit control area data has no parent record in KNA1
    why_it_matters: KNKK rows hang off KNA1. A row whose key (KNKK.KUNNR) has no KNA1 record is an orphan left by a deletion,
      archiving or a partial legacy load; SAP transactions never show it, but extracts, the CVI synchronisation and migration
      objects still read it.
    rule_authority: sap_hard_constraint
    sap_impact: The orphan is converted or reported as live data although no master record carries it.
    fix_map:
      __other__: Delete the orphan credit data (FD32) or create the customer.
    record_fix_template: 'Customer {KNKK.KUNNR}, credit control area {KNKK.KKBER}: no customer general data.'
  - id: SDCM652
    field: KNKK.ERDAT
    check_class: cross_field_check
    fail_when: '`KNKK.ERDAT`.notna() & (`KNKK.ERDAT` > @today)'
    grain: KNKK
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: low
    dimension: timeliness
    message: Credit data creation date is dated in the future
    why_it_matters: KNKK.ERDAT records a date that has already happened. A value after the day the check runs comes from a wrong
      system clock, a mis-mapped legacy load or an interface that swapped day and month, so every figure derived from it is
      wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Reports and programs that age or select on KNKK.ERDAT treat the credit history wrongly.
    fix_map:
      __other__: Correct credit data creation date in FD32 or the source and re-extract.
    record_fix_template: 'Customer {KNKK.KUNNR}, credit control area {KNKK.KKBER}: KNKK.ERDAT {actual_value} is in the future.'
