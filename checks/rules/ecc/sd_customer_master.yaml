  - id: SDCM330
    field: KNA1.REGIO
    check_class: cross_field_check
    fail_when: '`KNA1.PSTLZ`.str.slice(0, 1).str.upper().isin([''A'', ''B'', ''C'', ''E'', ''G'', ''H'', ''J'', ''K'', ''L'',
      ''M'', ''N'', ''P'', ''R'', ''S'', ''T'', ''V'', ''X'', ''Y'']) & ~(((`KNA1.PSTLZ`.str.slice(0, 1).str.upper() == ''A'')
