  - id: SDCM666
    field: KNKA.KUNNR
    check_class: exists_check
    fields:
    - KNKA.KUNNR
    target_table: KNA1
    target_fields:
    - KUNNR
    grain: KNKA
    s4_area: credit_management
    s4_impact: blocking
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: high
    dimension: consistency
    message: Customer central credit data has no parent record in KNA1
    why_it_matters: KNKA rows hang off KNA1. A row whose key (KNKA.KUNNR) has no KNA1 record is an orphan left by a deletion,
      archiving or a partial legacy load; SAP transactions never show it, but extracts, the CVI synchronisation and migration
      objects still read it.
    rule_authority: sap_hard_constraint
    sap_impact: The orphan is converted or reported as live data although no master record carries it.
    fix_map:
      __other__: Delete the orphan central credit data or create the customer.
    record_fix_template: 'Customer {KNKA.KUNNR}: central credit data without a customer.'
  - id: SDCM667
    field: UKMBP_CMS.RISK_CLASS
    check_class: null_check
    grain: UKMBP_CMS
    s4_area: credit_management
    s4_impact: blocking
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: high
    dimension: completeness
    message: Credit profile of the business partner has no risk class
    why_it_matters: The risk class steers the credit check, limit calculation and FSCM workflow. Without it SAP Credit Management
      applies no risk-dependent rule and reports the partner as unclassified.
    rule_authority: s4hana_migration
    sap_impact: Orders for the partner are not credit checked as intended.
    fix_map:
      __other__: Assign the risk class in the credit profile (UKM_BP, role UKM000).
    record_fix_template: 'Business partner {UKMBP_CMS.PARTNER}: credit profile without risk class.'
  - id: SDCM668
    field: UKMBP_CMS.CHECK_RULE
    check_class: null_check
    grain: UKMBP_CMS
    s4_area: credit_management
    s4_impact: blocking
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: high
    dimension: completeness
    message: Credit profile of the business partner has no check rule
    why_it_matters: The check rule decides which credit checks run in the order. Without one the partner falls back to no or
      default checks, so orders pass unchecked.
    rule_authority: s4hana_migration
    sap_impact: Orders for the partner are not credit checked as intended.
    fix_map:
      __other__: Assign the check rule in the credit profile (UKM_BP, role UKM000).
    record_fix_template: 'Business partner {UKMBP_CMS.PARTNER}: credit profile without check rule.'
  - id: SDCM669
    field: UKMBP_CMS.RISK_CLASS
    check_class: exists_check
    target_table: UKM_RISK_CL
    target_fields:
    - RISK_CLASS
    grain: UKMBP_CMS
    s4_area: credit_management
    s4_impact: blocking
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: high
    dimension: consistency
    message: Risk class of the credit profile is not configured
    why_it_matters: UKM_RISK_CL holds the configured values. A value missing there was migrated or loaded without its configuration
      and cannot be evaluated by SAP Credit Management.
    rule_authority: sap_hard_constraint
    sap_impact: Scoring, limit calculation or the credit check fail for the partner.
    fix_map:
      __other__: Configure the value (SPRO > Financial Supply Chain Management > Credit Management) or correct the credit profile
        in UKM_BP.
    record_fix_template: 'Business partner {UKMBP_CMS.PARTNER}: risk class {actual_value} not configured.'
  - id: SDCM670
    field: UKMBP_CMS.LIMIT_RULE
    check_class: exists_check
    target_table: UKM_LIMIT_RULES
    target_fields:
    - LIMIT_RULE
    grain: UKMBP_CMS
    s4_area: credit_management
    s4_impact: blocking
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: high
    dimension: consistency
    message: Rule for scoring and credit limit of the credit profile is not configured
    why_it_matters: UKM_LIMIT_RULES holds the configured values. A value missing there was migrated or loaded without its configuration
      and cannot be evaluated by SAP Credit Management.
    rule_authority: sap_hard_constraint
    sap_impact: Scoring, limit calculation or the credit check fail for the partner.
    fix_map:
      __other__: Configure the value (SPRO > Financial Supply Chain Management > Credit Management) or correct the credit profile
        in UKM_BP.
    record_fix_template: 'Business partner {UKMBP_CMS.PARTNER}: rule for scoring and credit limit {actual_value} not configured.'
  - id: SDCM671
    field: UKMBP_CMS.RATING_VAL_DATE
    check_class: freshness_check
    max_age_hours: 0
    applies_when:
      UKMBP_CMS.OWN_RATING:
        populated: true
    grain: UKMBP_CMS
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: medium
    dimension: timeliness
    message: Business partner's credit score has expired
    why_it_matters: The score (OWN_RATING) is valid until RATING_VAL_DATE. After that SAP Credit Management treats it as out
      of date and, depending on the check rule, blocks orders or ignores the score.
    rule_authority: best_practice
    sap_impact: Orders are blocked or credit decisions rely on an outdated score.
    fix_map:
      __other__: Recalculate the score (UKM_BP or mass recalculation UKM_MASS_UPD) or extend its validity.
    record_fix_template: 'Business partner {UKMBP_CMS.PARTNER}: score expired {age_days} days ago.'
  - id: SDCM672
    field: UKMBP_CMS.RATING_CHG_DATE
    check_class: cross_field_check
    fail_when: '`UKMBP_CMS.RATING_CHG_DATE`.notna() & (`UKMBP_CMS.RATING_CHG_DATE` > @today)'
    grain: UKMBP_CMS
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: low
    dimension: timeliness
    message: Score change date is dated in the future
    why_it_matters: UKMBP_CMS.RATING_CHG_DATE records a date that has already happened. A value after the day the check runs
      comes from a wrong system clock, a mis-mapped legacy load or an interface that swapped day and month, so every figure
      derived from it is wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Reports and programs that age or select on UKMBP_CMS.RATING_CHG_DATE treat the credit history wrongly.
    fix_map:
      __other__: Correct the date in the source and re-extract.
    record_fix_template: 'Business partner {UKMBP_CMS.PARTNER}: UKMBP_CMS.RATING_CHG_DATE {actual_value} is in the future.'
  - id: SDCM673
    field: UKMBP_CMS.RISK_CLASS_CHGDT
    check_class: cross_field_check
    fail_when: '`UKMBP_CMS.RISK_CLASS_CHGDT`.notna() & (`UKMBP_CMS.RISK_CLASS_CHGDT` > @today)'
    grain: UKMBP_CMS
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: low
    dimension: timeliness
    message: Risk class change date is dated in the future
    why_it_matters: UKMBP_CMS.RISK_CLASS_CHGDT records a date that has already happened. A value after the day the check runs
      comes from a wrong system clock, a mis-mapped legacy load or an interface that swapped day and month, so every figure
      derived from it is wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Reports and programs that age or select on UKMBP_CMS.RISK_CLASS_CHGDT treat the credit history wrongly.
    fix_map:
      __other__: Correct the date in the source and re-extract.
    record_fix_template: 'Business partner {UKMBP_CMS.PARTNER}: UKMBP_CMS.RISK_CLASS_CHGDT {actual_value} is in the future.'
  - id: SDCM674
    field: UKMBP_CMS.ALTERNATE_BP
    check_class: cross_field_check
    fail_when: '`UKMBP_CMS.ALTERNATE_BP` == `UKMBP_CMS.PARTNER`'
    grain: UKMBP_CMS
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: low
    dimension: consistency
    message: Business partner is its own alternative business partner for credit
    why_it_matters: The alternative business partner takes over the credit data of another partner. Pointing at itself adds
      nothing and usually means the intended partner was overwritten.
    rule_authority: best_practice
    sap_impact: The intended credit hierarchy does not apply.
    fix_map:
      __other__: Clear the alternative partner or enter the intended one (UKM_BP).
    record_fix_template: 'Business partner {UKMBP_CMS.PARTNER}: alternative partner is itself.'
  - id: SDCM675
    field: UKMBP_CMS.ALTERNATE_BP
    check_class: exists_check
    target_table: BUT000
    target_fields:
    - PARTNER
    target_when:
      XDELE:
        blank: true
    grain: UKMBP_CMS
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: medium
    dimension: consistency
    message: Alternative business partner for credit does not exist or is flagged for deletion
    why_it_matters: Credit data is taken from the alternative partner. A missing or archived partner breaks that link.
    rule_authority: sap_hard_constraint
    sap_impact: Credit exposure and limits of the partner are evaluated against a dead record.
    fix_map:
      __other__: Replace the alternative partner with an active one (UKM_BP).
    record_fix_template: 'Business partner {UKMBP_CMS.PARTNER}: alternative partner {actual_value} missing or deleted.'
  - id: SDCM676
    field: UKMBP_CMS.RISK_CLASS
    check_class: cross_field_check
    fail_when: '`UKMBP_CMS.RISK_CLASS_CALC`.notna() & `UKMBP_CMS.RISK_CLASS`.notna() & (`UKMBP_CMS.RISK_CLASS` != `UKMBP_CMS.RISK_CLASS_CALC`)'
    grain: UKMBP_CMS
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: low
    dimension: consistency
    message: Risk class of the business partner differs from the calculated risk class
    why_it_matters: SAP Credit Management calculates a risk class from the score (RISK_CLASS_CALC). A manual override is allowed
      but each one is a credit decision that should be reviewed; unreviewed overrides hide changed risk.
    rule_authority: best_practice
    sap_impact: Orders are checked with a risk class that the current score does not support.
    fix_map:
      __other__: Review the override and either accept the calculated class or document the manual class (UKM_BP).
    record_fix_template: 'Business partner {UKMBP_CMS.PARTNER}: risk class {actual_value} differs from calculated {UKMBP_CMS.RISK_CLASS_CALC}.'
  - id: SDCM677
    field: UKMBP_CMS.PARTNER
    check_class: exists_check
    fields:
    - UKMBP_CMS.PARTNER
    target_table: BUT000
    target_fields:
    - PARTNER
    grain: UKMBP_CMS
    s4_area: credit_management
    s4_impact: blocking
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: high
    dimension: consistency
    message: Credit profile has no parent record in BUT000
    why_it_matters: UKMBP_CMS rows hang off BUT000. A row whose key (UKMBP_CMS.PARTNER) has no BUT000 record is an orphan left
      by a deletion, archiving or a partial legacy load; SAP transactions never show it, but extracts, the CVI synchronisation
      and migration objects still read it.
    rule_authority: sap_hard_constraint
    sap_impact: The orphan is converted or reported as live data although no master record carries it.
    fix_map:
      __other__: Delete the orphan credit profile or create the business partner.
    record_fix_template: 'Business partner {UKMBP_CMS.PARTNER}: credit profile without a business partner.'
  - id: SDCM678
    field: UKMBP_CMS_SGM.PARTNER
    check_class: exists_check
    fields:
    - UKMBP_CMS_SGM.PARTNER
    target_table: UKMBP_CMS
    target_fields:
    - PARTNER
    grain: UKMBP_CMS_SGM
    s4_area: credit_management
    s4_impact: blocking
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: high
    dimension: consistency
    message: Credit segment data has no parent record in UKMBP_CMS
    why_it_matters: UKMBP_CMS_SGM rows hang off UKMBP_CMS. A row whose key (UKMBP_CMS_SGM.PARTNER) has no UKMBP_CMS record is
      an orphan left by a deletion, archiving or a partial legacy load; SAP transactions never show it, but extracts, the CVI
      synchronisation and migration objects still read it.
    rule_authority: sap_hard_constraint
    sap_impact: The orphan is converted or reported as live data although no master record carries it.
    fix_map:
      __other__: Create the credit profile (UKM_BP) or delete the orphan segment data.
    record_fix_template: 'Business partner {UKMBP_CMS_SGM.PARTNER}, credit segment {UKMBP_CMS_SGM.CREDIT_SGMNT}: no credit profile.'
  - id: SDCM679
    field: UKMBP_CMS_SGM.CREDIT_SGMNT
    check_class: exists_check
    target_table: UKMCRED_SGM0C
    target_fields:
    - CREDIT_SGMNT
    grain: UKMBP_CMS_SGM
    s4_area: credit_management
    s4_impact: blocking
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: high
    dimension: consistency
    message: Credit segment of the business partner is not configured
    why_it_matters: UKMCRED_SGM0C defines the credit segments with their currency. Segment data for a segment not defined there
      has no currency and is never read by the credit check.
    rule_authority: sap_hard_constraint
    sap_impact: The partner's limit in this segment is ignored.
    fix_map:
      __other__: Define the credit segment (SPRO > Credit Management > Define Credit Segments) or move the data.
    record_fix_template: 'Business partner {UKMBP_CMS_SGM.PARTNER}, credit segment {UKMBP_CMS_SGM.CREDIT_SGMNT}: segment not
      configured.'
  - id: SDCM680
    field: UKMBP_CMS_SGM.LIMIT_VALID_DATE
    check_class: freshness_check
    max_age_hours: 0
    applies_when:
      UKMBP_CMS_SGM.CREDIT_LIMIT:
        gt: 0
    grain: UKMBP_CMS_SGM
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: high
    dimension: timeliness
    message: Credit limit of the business partner has expired
    why_it_matters: A credit limit is valid until LIMIT_VALID_DATE. After that, when the segment checks validity, SAP treats
      the limit as zero and blocks every order.
    rule_authority: best_practice
    sap_impact: Orders for the partner are credit blocked.
    fix_map:
      __other__: Review and extend the limit (UKM_BP) or remove the validity date.
    record_fix_template: 'Business partner {UKMBP_CMS_SGM.PARTNER}, credit segment {UKMBP_CMS_SGM.CREDIT_SGMNT}: limit expired
      {age_days} days ago.'
  - id: SDCM681
    field: UKMBP_CMS_SGM.BLOCK_REASON
    check_class: null_check
    applies_when:
      UKMBP_CMS_SGM.XBLOCKED:
      - X
    grain: UKMBP_CMS_SGM
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: medium
    dimension: completeness
    message: Business partner is blocked in credit management without a reason
    why_it_matters: A credit block stops every order. Without a block reason nobody can tell why it was set or when to lift
      it.
    rule_authority: best_practice
    sap_impact: Orders stay blocked and the block cannot be reviewed.
    fix_map:
      __other__: Enter the block reason or lift the block (UKM_BP > Credit segment data).
    record_fix_template: 'Business partner {UKMBP_CMS_SGM.PARTNER}, credit segment {UKMBP_CMS_SGM.CREDIT_SGMNT}: blocked without
      reason.'
  - id: SDCM682
    field: UKMBP_CMS_SGM.XBLOCKED
    check_class: cross_field_check
    fail_when: '`UKMBP_CMS_SGM.BLOCK_REASON`.notna() & `UKMBP_CMS_SGM.XBLOCKED`.isna()'
    grain: UKMBP_CMS_SGM
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: low
    dimension: consistency
    message: Credit block reason is set but the business partner is not blocked
    why_it_matters: The block reason documents a credit block. A reason without the block was left behind when the block was
      lifted, or the block was lost.
    rule_authority: best_practice
    sap_impact: Reports on blocked partners and their reasons disagree.
    fix_map:
      __other__: Remove the reason or set the block (UKM_BP).
    record_fix_template: 'Business partner {UKMBP_CMS_SGM.PARTNER}, credit segment {UKMBP_CMS_SGM.CREDIT_SGMNT}: block reason
      without a block.'
  - id: SDCM683
    field: UKMBP_CMS_SGM.X_LIMIT_ZERO
    check_class: cross_field_check
    fail_when: (`UKMBP_CMS_SGM.X_LIMIT_ZERO` == 'X') & (`UKMBP_CMS_SGM.CREDIT_LIMIT` > 0)
    grain: UKMBP_CMS_SGM
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: medium
    dimension: consistency
    message: Credit limit is set although the limit is flagged as zero
    why_it_matters: X_LIMIT_ZERO says the partner is to have no credit. A limit above zero contradicts it; one of the two is
      wrong.
    rule_authority: best_practice
    sap_impact: Orders are checked against a limit that should not exist, or blocked against a limit that should.
    fix_map:
      __other__: Clear the flag or the limit (UKM_BP).
    record_fix_template: 'Business partner {UKMBP_CMS_SGM.PARTNER}, credit segment {UKMBP_CMS_SGM.CREDIT_SGMNT}: limit set although
      flagged zero.'
  - id: SDCM684
    field: UKMBP_CMS_SGM.CREDIT_LIMIT
    check_class: cross_field_check
    fail_when: '`UKMBP_CMS_SGM.CREDIT_LIMIT` < 0'
    grain: UKMBP_CMS_SGM
    s4_area: credit_management
    s4_impact: blocking
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: high
    dimension: validity
    message: Credit limit of the business partner is negative
    why_it_matters: A credit limit cannot be negative; UKM_BP rejects it. A negative value was loaded around the API.
    rule_authority: sap_hard_constraint
    sap_impact: Every order fails the credit check.
    fix_map:
      __other__: Correct the limit (UKM_BP).
    record_fix_template: 'Business partner {UKMBP_CMS_SGM.PARTNER}, credit segment {UKMBP_CMS_SGM.CREDIT_SGMNT}: limit {actual_value}.'
  - id: SDCM685
    field: UKMBP_CMS_SGM.ITEM_ERROR
    check_class: cross_field_check
    fail_when: '`UKMBP_CMS_SGM.ITEM_ERROR` == ''X'''
    grain: UKMBP_CMS_SGM
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: medium
    dimension: validity
    message: Credit segment data of the business partner has an error
    why_it_matters: ITEM_ERROR is set when SAP Credit Management could not process the segment, for example a failed limit calculation
      or credit exposure update. The application log (LOG_HNDL) holds the cause.
    rule_authority: best_practice
    sap_impact: Credit exposure or limit for the segment is not current.
    fix_map:
      __other__: Read the application log for the segment (UKM_BP > Logs) and reprocess.
    record_fix_template: 'Business partner {UKMBP_CMS_SGM.PARTNER}, credit segment {UKMBP_CMS_SGM.CREDIT_SGMNT}: segment in
      error.'
  - id: SDCM686
    field: UKMBP_CMS_SGM.LIMIT_CHG_DATE
    check_class: cross_field_check
    fail_when: '`UKMBP_CMS_SGM.LIMIT_CHG_DATE`.notna() & (`UKMBP_CMS_SGM.LIMIT_CHG_DATE` > @today)'
    grain: UKMBP_CMS_SGM
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: low
    dimension: timeliness
    message: Credit limit change date is dated in the future
    why_it_matters: UKMBP_CMS_SGM.LIMIT_CHG_DATE records a date that has already happened. A value after the day the check runs
      comes from a wrong system clock, a mis-mapped legacy load or an interface that swapped day and month, so every figure
      derived from it is wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Reports and programs that age or select on UKMBP_CMS_SGM.LIMIT_CHG_DATE treat the credit history wrongly.
    fix_map:
      __other__: Correct the date in the source and re-extract.
    record_fix_template: 'Business partner {UKMBP_CMS_SGM.PARTNER}, credit segment {UKMBP_CMS_SGM.CREDIT_SGMNT}: UKMBP_CMS_SGM.LIMIT_CHG_DATE
      {actual_value} is in the future.'
  - id: SDCM687
    field: UKMBP_CMS_SGM.FOLLOW_UP_DT
    check_class: freshness_check
    max_age_hours: 0
    grain: UKMBP_CMS_SGM
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: low
    dimension: timeliness
    message: Credit resubmission date of the business partner has passed
    why_it_matters: The resubmission date (FOLLOW_UP_DT) schedules the next credit review. A past date means the review is overdue.
    rule_authority: best_practice
    sap_impact: Credit limits are not reviewed as scheduled.
    fix_map:
      __other__: Review the partner's credit and set a new resubmission date (UKM_BP).
    record_fix_template: 'Business partner {UKMBP_CMS_SGM.PARTNER}, credit segment {UKMBP_CMS_SGM.CREDIT_SGMNT}: review overdue
      {age_days} days.'
  - id: SDCM688
    field: UKMBP_CMS_SGM.REQ_DATE
    check_class: freshness_check
    max_age_hours: 720
    applies_when:
      UKMBP_CMS_SGM.CRED_LIM_REQ:
        gt: 0
    grain: UKMBP_CMS_SGM
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: low
    dimension: timeliness
    message: Credit limit request of the business partner has been open for more than 30 days
    why_it_matters: A requested limit (CRED_LIM_REQ) waits for approval from the request date (REQ_DATE). A request open for
      over a month means the approval workflow stalled.
    rule_authority: best_practice
    sap_impact: The customer keeps the old limit and orders stay blocked while the request waits.
    fix_map:
      __other__: Approve or reject the credit limit request (UKM_BP or the credit limit request workflow).
    record_fix_template: 'Business partner {UKMBP_CMS_SGM.PARTNER}, credit segment {UKMBP_CMS_SGM.CREDIT_SGMNT}: limit request
      open {age_days} days.'
  - id: SDCM689
    field: UKMBP_CMS_SGM.LIM_VAL_DATE_REQ
    check_class: cross_field_check
    fail_when: '`UKMBP_CMS_SGM.LIM_VAL_DATE_REQ`.notna() & `UKMBP_CMS_SGM.REQ_DATE`.notna() & (`UKMBP_CMS_SGM.LIM_VAL_DATE_REQ`
      < `UKMBP_CMS_SGM.REQ_DATE`)'
    grain: UKMBP_CMS_SGM
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: low
    dimension: consistency
    message: Requested credit limit would expire before it was requested
    why_it_matters: The requested validity date (LIM_VAL_DATE_REQ) cannot be before the request date. Approving it creates an
      already expired limit.
    rule_authority: sap_hard_constraint
    sap_impact: An approved request produces an expired limit and orders stay blocked.
    fix_map:
      __other__: Correct the requested validity date before approval (UKM_BP).
    record_fix_template: 'Business partner {UKMBP_CMS_SGM.PARTNER}, credit segment {UKMBP_CMS_SGM.CREDIT_SGMNT}: requested validity
      before request date.'
  - id: SDCM700
    field: KNVV.VKORG
    check_class: exists_check
    grain: KNVV
    fields:
    - KNVV.VKORG
    - KNVV.VTWEG
    - KNVV.SPART
    target_table: TVTA
    target_fields:
    - VKORG
    - VTWEG
    - SPART
    s4_area: organisational
    s4_impact: blocking
    simplification_item: Organisational data
    baseline: s4_target
    severity: high
    dimension: consistency
    message: Customer sales area is not a defined sales area (TVTA)
    why_it_matters: 'A sales area is the combination of sales organisation, distribution channel and division maintained in
      TVTA. Each of the three codes can exist on its own while the combination was never defined, or was removed from the
      enterprise structure. Sales data kept for such a combination can never be used: VA01 only accepts sales areas that exist
      in TVTA, and the S/4HANA Business Partner sales-area role cannot be created for it.'
    rule_authority: sap_hard_constraint
    sap_impact: Sales documents cannot be created for the customer in this sales area; CVI rejects the sales data during BP
      conversion.
    fix_map:
      __other__: Either define the sales area in SPRO > Enterprise Structure > Assignment > Sales and Distribution > Set up
        sales area, or flag the customer sales data for deletion (VD06) if the combination is not used.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: the sales area is not defined
      in TVTA.'
  - id: SDCM701
    field: KNVV.VTWEG
    check_class: exists_check
    grain: KNVV
    fields:
    - KNVV.VKORG
    - KNVV.VTWEG
    - KNVV.SPART
    target_table: TVTA
    target_fields:
    - VKORG
    - VTWKU
    - SPAKU
    severity: medium
    dimension: consistency
    message: Customer sales data is maintained in a sales area that refers to another sales area for master data
    why_it_matters: 'TVTA.VTWKU and TVTA.SPAKU name the reference distribution channel and reference division whose customer
      master data a sales area uses. When a sales area points to a different reference, SAP reads the customer data of the
      reference area and ignores the data maintained directly in this one. Data stored here is dead: it is never used, it
      drifts from the data that is used, and it doubles the volume to convert to the Business Partner.'
    rule_authority: sap_hard_constraint
    sap_impact: Pricing, shipping and billing use the reference sales area data, not the values stored in this sales area.
    fix_map:
      __other__: Maintain the customer only in the reference sales area (TVTA.VTWKU / SPAKU) and flag the sales data in this
        non-reference area for deletion, or remove the reference in SPRO if this area should hold its own data.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: this sales area takes customer
      master data from another reference sales area.'
  - id: SDCM702
    field: KNVV.VWERK
    check_class: exists_check
    grain: KNVV
    applies_when:
      KNVV.VWERK:
        populated: true
    fields:
    - KNVV.VWERK
    - KNVV.VKORG
    - KNVV.VTWEG
    target_table: TVKWZ
    target_fields:
    - WERKS
    - VKORG
    - VTWEG
    severity: medium
    dimension: consistency
    message: Delivering plant of the customer is not assigned to the sales organisation and distribution channel (TVKWZ)
    why_it_matters: Plants are assigned to the combination of sales organisation and distribution channel in TVKWZ. The delivering
      plant proposed from KNVV.VWERK is only valid in a sales order if that assignment exists. A plant that exists in T001W
      but is not assigned to the sales organisation is proposed into every order and then rejected, so the order item has
      no plant and no availability check.
    rule_authority: sap_hard_constraint
    sap_impact: 'Sales order items get an invalid delivering plant: no availability check, no delivery, no shipping point.'
    fix_map:
      __other__: Change the delivering plant in VD02 to a plant assigned to the sales organisation and distribution channel,
        or add the assignment in SPRO > Enterprise Structure > Assignment > Sales and Distribution > Assign sales organisation
        - distribution channel - plant.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: delivering plant {KNVV.VWERK}
      is not assigned to sales organisation and distribution channel.'
  - id: SDCM703
    field: KNVV.VKGRP
    check_class: exists_check
    grain: KNVV
    applies_when:
      KNVV.VKGRP:
        populated: true
      KNVV.VKBUR:
        populated: true
    fields:
    - KNVV.VKBUR
    - KNVV.VKGRP
    target_table: TVBVK
    target_fields:
    - VKBUR
    - VKGRP
    severity: medium
    dimension: consistency
    message: Sales group of the customer is not assigned to its sales office (TVBVK)
    why_it_matters: Sales groups are assigned to sales offices in TVBVK. KNVV.VKBUR and KNVV.VKGRP are copied into every sales
      document as the responsible office and group. A group that does not belong to the office splits sales statistics and
      commission reports between two organisational lines and is rejected when the document is checked against the enterprise
      structure.
    rule_authority: sap_hard_constraint
    sap_impact: Sales documents carry an office and group that do not belong together; sales reporting by office is wrong.
    fix_map:
      __other__: Correct the sales group or sales office in VD02 so the pair exists in SPRO > Enterprise Structure > Assignment
        > Sales and Distribution > Assign sales group to sales office.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: sales group {KNVV.VKGRP}
      is not assigned to sales office {KNVV.VKBUR}.'
  - id: SDCM704
    field: KNVV.VKBUR
    check_class: null_check
    grain: KNVV
    applies_when:
      KNVV.VKGRP:
        populated: true
    severity: low
    dimension: completeness
    message: Customer sales area has a sales group but no sales office
    why_it_matters: 'A sales group is an organisational unit below a sales office: SAP assigns groups to offices (TVBVK),
      not to sales areas. A sales group without its sales office cannot be validated, and sales documents created from this
      record carry a group with no office, which breaks every report and authorisation that is organised by sales office.'
    rule_authority: best_practice
    sap_impact: Sales documents carry a sales group without its sales office; office-based reporting and authorisation miss
      them.
    fix_map:
      __other__: Enter the sales office to which the sales group belongs in VD02 (Sales tab).
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: sales group {KNVV.VKGRP}
      is maintained without a sales office.'
  - id: SDCM705
    field: KNVV.KUNNR
    check_class: exists_check
    grain: KNVV
    target_table: KNA1
    target_fields:
    - KUNNR
    s4_area: business_partner
    s4_impact: blocking
    simplification_item: Business Partner Approach (SAP Note 2265093)
    baseline: s4_target
    severity: high
    dimension: consistency
    message: Customer sales area data exists without a general customer record (KNA1)
    why_it_matters: 'KNVV is a dependent table of KNA1: sales area data can only be created for a customer number that exists
      in the general data. A KNVV row without a KNA1 parent is an orphan left by a deletion, a client copy or a direct table
      load. No transaction can display or maintain it and CVI has no customer to convert it with.'
    rule_authority: sap_hard_constraint
    sap_impact: Orphan sales data cannot be maintained in VD02 and is dropped or rejected in the Business Partner conversion.
    fix_map:
      __other__: Delete the orphan rows with the archiving object FI_ACCRECV or recreate the general data, and correct the
        load that created them.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: no general customer record
      exists in KNA1.'
  - id: SDCM706
    field: KNVV.ERNAM
    check_class: null_check
    grain: KNVV
    severity: low
    dimension: completeness
    message: Customer sales area record has no creator (ERNAM)
    why_it_matters: ERNAM is filled by VD01/XD01 with the user who created the sales area data. A blank creator means the
      record was inserted outside the standard transactions (direct load, client copy without user data), so the audit trail
      of who created the customer in this sales area is lost and the record bypassed the field checks of the transaction.
    rule_authority: best_practice
    sap_impact: No audit trail for the creation of the sales area data.
    fix_map:
      __other__: Identify the load that created the record, verify its data with the transactions, and correct the load program
        so it fills ERNAM.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: the creating user is blank.'
  - id: SDCM707
    field: KNVV.ERDAT
    check_class: null_check
    grain: KNVV
    severity: low
    dimension: completeness
    message: Customer sales area record has no creation date (ERDAT)
    why_it_matters: ERDAT is set by VD01/XD01 to the date the sales area data was created. A blank creation date means the
      record was written outside the standard transactions, and every age, change and aging analysis of the customer in this
      sales area has no starting point.
    rule_authority: best_practice
    sap_impact: Ageing and change reporting for the sales area cannot be computed for this record.
    fix_map:
      __other__: Correct the load program so it fills ERDAT, and set the date from the change documents (CDHDR) where possible.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: the creation date is blank.'
  - id: SDCM708
    field: KNVV.ERDAT
    check_class: cross_field_check
    grain: KNVV
    fail_when: '`KNVV.ERDAT` < `KNA1.ERDAT`'
    severity: low
    dimension: consistency
    message: Customer sales area was created before the customer itself
    why_it_matters: Sales area data (KNVV) can only be created for an existing customer (KNA1). A KNVV creation date earlier
      than the KNA1 creation date is impossible in the standard transactions and shows that one of the two dates was written
      by a load or migration with the wrong value, so age and creation reporting of the customer is wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Customer age, creation and change reporting are inconsistent between general and sales data.
    fix_map:
      __other__: Correct the creation date of the general data or of the sales area data in the source of the migration and
        re-load.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: created {KNVV.ERDAT}, before
      the customer itself ({KNA1.ERDAT}).'
  - id: SDCM709
    field: KNVV.PERRL
    check_class: referential_check
    grain: KNVV
    severity: medium
    dimension: validity
    message: Invoice list schedule of the customer is not a defined factory calendar (TFACD)
    why_it_matters: KNVV.PERRL is the calendar that sets the dates on which invoice lists are created for the customer, and
      its check table is the factory calendar TFACD. A calendar ID that does not exist means VF21/VF24 can never find an invoice
      list date, so billing documents that should be collected in an invoice list are never listed.
    rule_authority: sap_hard_constraint
    sap_impact: Invoice lists are not created for the customer; the billing documents stay outside the list.
    fix_map:
      __other__: Change the invoice list schedule in VD02 (Billing tab) to a factory calendar defined in SCAL, or create the
        calendar.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: invoice list schedule {KNVV.PERRL}
      is not a defined calendar.'
  - id: SDCM710
    field: KNVV.PERFK
    check_class: cross_field_check
    grain: KNVV
    fail_when: '`KNVV.PERRL`.notna() & `KNVV.PERFK`.isna()'
    severity: low
    dimension: consistency
    message: Customer has an invoice list schedule but no invoice dates calendar
    why_it_matters: Invoice lists (KNVV.PERRL) collect billing documents that were already created. SAP sets the billing date
      of a document that goes into an invoice list from the invoice dates calendar KNVV.PERFK. With a list schedule but no
      invoice dates calendar, each billing document is created on its own date while the list collects them on another schedule,
      which is the opposite of what invoice lists are configured for.
    rule_authority: best_practice
    sap_impact: Billing documents are created daily instead of on the dates the invoice list is meant to collect.
    fix_map:
      __other__: Maintain the invoice dates calendar (Billing tab, field Invoice dates) together with the invoice list schedule
        in VD02, or remove the invoice list schedule.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: invoice list schedule {KNVV.PERRL}
      is set but no invoice dates calendar.'
  - id: SDCM711
    field: KNVV.INCO1
    check_class: null_check
    grain: KNVV
    applies_when:
      KNVV.LOEVM:
        blank: true
    severity: medium
    dimension: completeness
    message: Customer sales area has no Incoterms
    why_it_matters: KNVV.INCO1 is copied into every sales order header and decides where risk and cost pass from seller to
      buyer. Without it each order must be completed by hand, freight conditions that depend on the Incoterm are not found,
      and export declarations and intrastat reports have no delivery terms.
    rule_authority: best_practice
    sap_impact: Sales orders are created without delivery terms; freight pricing and foreign trade data are incomplete.
    fix_map:
      __other__: Enter the Incoterms and their location in VD02 (Billing tab) for the sales area.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: no Incoterms are maintained.'
  - id: SDCM712
    field: KNVV.INCO1
    check_class: cross_field_check
    grain: KNVV
    fail_when: '`KNVV.INCO1`.isin([''DAF'', ''DES'', ''DEQ'', ''DDU''])'
    severity: low
    dimension: validity
    message: Customer uses an Incoterms 2000 term that was withdrawn in Incoterms 2010 (DAF, DES, DEQ, DDU)
    why_it_matters: The ICC withdrew DAF, DES, DEQ and DDU from Incoterms 2010 and replaced them with DAP (and DAT, later
      DPU). The codes stay in SAP table TINC for old documents, so SAP accepts them, but contracts, letters of credit and
      customs declarations issued today under Incoterms 2010 or 2020 cannot refer to them.
    rule_authority: iso_standard
    sap_impact: Sales orders and export documents carry delivery terms that are no longer defined by the ICC.
    fix_map:
      __other__: Replace the term in VD02 with its current equivalent (normally DAP; DDP where the seller pays duty) after
        agreeing it with the customer.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: Incoterms {KNVV.INCO1}
      were withdrawn in Incoterms 2010.'
  - id: SDCM713
    field: KNVV.INCO1
    check_class: cross_field_check
    grain: KNVV
    fail_when: '`KNVV.INCO1` == ''DAT'''
    severity: low
    dimension: validity
    message: Customer uses Incoterm DAT, which Incoterms 2020 replaced with DPU
    why_it_matters: Incoterms 2020 renamed DAT (Delivered at Terminal) to DPU (Delivered at Place Unloaded) so the place of
      delivery is no longer limited to a terminal. DAT stays in TINC for old documents, but new contracts and customs documents
      issued under Incoterms 2020 use DPU.
    rule_authority: iso_standard
    sap_impact: Sales orders and export documents carry an Incoterms 2010 term in place of its Incoterms 2020 replacement.
    fix_map:
      __other__: Change the Incoterms in VD02 from DAT to DPU (create DPU in SPRO > Sales and Distribution > Master Data >
        Business Partners > Customers > Shipping > Define Incoterms if missing).
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: Incoterms DAT should be
      DPU under Incoterms 2020.'
  - id: SDCM714
    field: KNVV.ANTLF
    check_class: cross_field_check
    grain: KNVV
    fail_when: '`KNVV.KZTLF`.isin([''B'', ''C'']) & (`KNVV.ANTLF` > 1)'
    severity: low
    dimension: consistency
    message: Customer allows more than one partial delivery but its partial delivery rule permits only one delivery
    why_it_matters: KNVV.KZTLF values B (create only one delivery, even with quantity zero) and C (only complete delivery)
      both mean an order item is delivered once. KNVV.ANTLF is the maximum number of partial deliveries per item. A maximum
      above 1 contradicts a rule that allows a single delivery, so one of the two settings does not reflect what was agreed
      with the customer.
    rule_authority: best_practice
    sap_impact: Delivery behaviour for the customer depends on which of the contradicting settings the order uses.
    fix_map:
      __other__: Decide whether the customer accepts partial deliveries and align KZTLF and the maximum partial deliveries
        in VD02 (Shipping tab).
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: partial delivery rule {KNVV.KZTLF}
      allows one delivery but the maximum is {KNVV.ANTLF}.'
  - id: SDCM715
    field: KNVV.AUTLF
    check_class: cross_field_check
    grain: KNVV
    fail_when: (`KNVV.AUTLF` == 'X') & `KNVV.KZTLF`.isin(['A', 'D'])
    severity: low
    dimension: consistency
    message: Customer requires complete delivery but its partial delivery rule allows partial deliveries
    why_it_matters: 'KNVV.AUTLF = X requires each order to be delivered complete in one delivery. KNVV.KZTLF A (deliver whatever
      quantity is available) and D (no limit to subsequent deliveries) explicitly allow partial deliveries per item. The two
      settings contradict each other: the order header forbids what the item rule allows.'
    rule_authority: best_practice
    sap_impact: Delivery creation for the customer follows the order header flag, while the item rule promises partial deliveries.
    fix_map:
      __other__: Clear the complete delivery flag or set the partial delivery rule to C (only complete delivery) in VD02.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: complete delivery is required
      but partial delivery rule {KNVV.KZTLF} allows partial deliveries.'
  - id: SDCM716
    field: KNVV.ANTLF
    check_class: cross_field_check
    grain: KNVV
    fail_when: (`KNVV.AUTLF` == 'X') & (`KNVV.ANTLF` > 1)
    severity: low
    dimension: consistency
    message: Customer requires complete delivery but allows more than one partial delivery
    why_it_matters: With KNVV.AUTLF = X the whole order is delivered once. A maximum number of partial deliveries (ANTLF)
      above 1 has no effect and contradicts the complete delivery requirement, which shows that one of the two settings was
      copied from a template and not agreed with the customer.
    rule_authority: best_practice
    sap_impact: The maximum partial delivery setting is ignored; delivery behaviour is not what the record suggests.
    fix_map:
      __other__: Clear the maximum partial deliveries or the complete delivery flag in VD02 (Shipping tab).
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: complete delivery is required
      but up to {KNVV.ANTLF} partial deliveries are allowed.'
  - id: SDCM717
    field: KNVV.PODTG
    check_class: cross_field_check
    grain: KNVV
    fail_when: (`KNVV.PODTG` > 0) & `KNVV.PODKZ`.isna()
    severity: low
    dimension: consistency
    message: Customer has a proof-of-delivery timeframe but is not relevant for proof of delivery
    why_it_matters: KNVV.PODTG is the number of days after goods issue within which the customer must confirm proof of delivery.
      SAP only uses it when KNVV.PODKZ marks the customer as POD relevant. A timeframe without the flag is never applied,
      so the business expects POD-based billing that SAP does not perform.
    rule_authority: best_practice
    sap_impact: Billing is not held for proof of delivery although a POD timeframe is maintained.
    fix_map:
      __other__: Set the POD relevance flag in VD02 (Shipping tab) or clear the timeframe.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: POD timeframe {KNVV.PODTG}
      days is set but the customer is not POD relevant.'
  - id: SDCM718
    field: KNVV.AWAHR
    check_class: regex_check
    grain: KNVV
    pattern: ^(100|0?[0-9]{1,2})$
    severity: low
    dimension: validity
    message: Order probability of the customer is not a percentage between 0 and 100
    why_it_matters: KNVV.AWAHR is the probability, in percent, that a quotation or inquiry for the customer becomes an order.
      SAP copies it into sales documents and uses it to weight expected order values. A value above 100 percent inflates the
      order pipeline and cannot be a probability.
    rule_authority: sap_hard_constraint
    sap_impact: Expected order value in quotations and the sales pipeline is overstated.
    fix_map:
      __other__: Enter a probability from 0 to 100 in VD02 (Sales tab).
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: order probability {actual_value}
      percent is outside 0 to 100.'
  - id: SDCM719
    field: KNVV.BOKRE
    check_class: cross_field_check
    grain: KNVV
    fail_when: (`KNVV.BOKRE` == 'X') & `KNVV.AGREL`.isna()
    s4_area: sales
    s4_impact: warning
    simplification_item: SD Rebate Processing replaced by Settlement Management
    baseline: s4_target
    severity: medium
    dimension: consistency
    message: Customer is relevant for SD rebates but not for Settlement Management
    why_it_matters: S/4HANA no longer supports new SD rebate agreements (VBO1); rebates move to condition contracts in Settlement
      Management. A customer can only be used in a condition contract when its sales area is flagged as relevant for settlement
      management (KNVV.AGREL). Customers that take part in rebates today (KNVV.BOKRE = X) without that flag cannot be moved
      to condition contracts.
    rule_authority: s4hana_migration
    sap_impact: Rebate agreements of the customer cannot be replaced with condition contracts after the S/4HANA conversion.
    fix_map:
      __other__: Set the Settlement Management relevance flag in VD02 (Billing tab) for every sales area that is rebate relevant,
        once condition contract settlement is configured.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: rebate relevant but not
      relevant for Settlement Management.'
  - id: SDCM720
    field: KNVV.PODKZ
    check_class: domain_value_check
    grain: KNVV
    allowed_values:
    - ''
    - X
    severity: low
    dimension: validity
    message: POD relevance (KNVV.PODKZ) must be X or empty
    why_it_matters: 'KNVV.PODKZ is a checkbox on domain XFELD: SAP only reads the value X as set and treats anything else
      as not set. When set, billing waits until the customer confirms proof of delivery. A value such as x, 1 or Y is written
      by a load program or interface, never by the transaction, and the field then looks set in reports while SAP behaves
      as if it were empty.'
    rule_authority: sap_hard_constraint
    sap_impact: The pod relevance setting behaves differently from what the stored value suggests.
    valid_values_with_labels:
      X: Set
      ? ''
      : Not set
    fix_map:
      __other__: Set KNVV.PODKZ to X or clear it in the customer master and correct the interface that wrote the value.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: pod relevance flag holds
      {actual_value}, which is neither X nor empty.'
