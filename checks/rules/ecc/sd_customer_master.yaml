  - id: SDCM428
    field: KNA1.MCOD1
    check_class: cross_field_check
    fail_when: '`KNA1.NAME1`.str.match(''^[ -~]+$'') & (`KNA1.MCOD1` != `KNA1.NAME1`.str.upper().str.slice(0, 25))'
    require_populated: true
    grain: KNA1
    severity: low
    dimension: consistency
    message: Match-code name does not match name 1
    why_it_matters: SAP fills MCOD1 with NAME1 in capitals (25 characters) on every save; the customer search helps and duplicate
      checks read it. A mismatch means NAME1 was changed by a direct table update, so the customer is not found under its current
      name.
    rule_authority: sap_hard_constraint
    sap_impact: Searches and duplicate checks by name miss the customer.
    fix_map:
      __other__: Re-save the customer in XD02 so the match-code fields are rebuilt.
    record_fix_template: 'Customer {KNA1.KUNNR}: match-code name out of step with name 1.'
  - id: SDCM429
    field: KNA1.MCOD3
    check_class: cross_field_check
    fail_when: '`KNA1.ORT01`.str.match(''^[ -~]+$'') & (`KNA1.MCOD3` != `KNA1.ORT01`.str.upper().str.slice(0, 25))'
    require_populated: true
    grain: KNA1
    severity: low
    dimension: consistency
    message: Match-code city does not match the city
    why_it_matters: SAP fills MCOD3 with ORT01 in capitals (25 characters) on every save; the search helps by city read it.
      A mismatch means the city was changed by a direct table update, so the customer is not found by its city.
    rule_authority: sap_hard_constraint
    sap_impact: Searches by city miss the customer.
    fix_map:
      __other__: Re-save the customer in XD02 so the match-code fields are rebuilt.
    record_fix_template: 'Customer {KNA1.KUNNR}: match-code city out of step with the city.'
  - id: SDCM430
    field: ADRC.DATE_TO
    check_class: cross_field_check
    fail_when: '`ADRC.DATE_TO` < `ADRC.DATE_FROM`'
    require_populated: true
    grain: KNA1
    severity: medium
    dimension: consistency
    message: Central address version ends before it starts
    why_it_matters: DATE_FROM and DATE_TO bound an address version. An end before the start makes the version never valid; Business
      Address Services then has no valid address for the customer on any date.
    rule_authority: sap_hard_constraint
    sap_impact: Forms and the BP conversion find no valid address for the customer.
    fix_map:
      __other__: Correct the address validity in XD02 or reload the address with a valid period.
    record_fix_template: 'Customer {KNA1.KUNNR}: address version ends before it starts.'
  - id: SDCM431
    field: ADRC.DATE_TO
    check_class: cross_field_check
    fail_when: '`ADRC.DATE_TO` < @today'
    require_populated: true
    applies_when:
      KNA1.LOEVM:
        blank: true
    grain: KNA1
    severity: medium
    dimension: timeliness
    message: Active customer's central address has expired
    why_it_matters: An address version whose DATE_TO has passed is no longer valid. An active customer whose only address version
      expired prints no or an outdated address on invoices and delivery notes, and the BP conversion migrates an expired address.
    rule_authority: sap_hard_constraint
    sap_impact: Documents print an expired address and the BP conversion carries an invalid address version.
    fix_map:
      __other__: Create a current address version or extend the validity in XD02.
    record_fix_template: 'Customer {KNA1.KUNNR}: central address expired.'
  - id: SDCM432
    field: ADRC.DEFLT_COMM
    check_class: cross_field_check
    fail_when: ((`ADRC.DEFLT_COMM` == 'TEL') & `ADRC.TEL_NUMBER`.isna()) | ((`ADRC.DEFLT_COMM` == 'FAX') & `ADRC.FAX_NUMBER`.isna())
      | ((`ADRC.DEFLT_COMM` == 'INT') & `ADR6.SMTP_ADDR`.isna())
    grain: KNA1
    severity: medium
    dimension: completeness
    message: Standard communication method has no number or address behind it
    why_it_matters: The standard communication method (TEL, FAX, INT for e-mail) tells output determination how to send documents.
      If the matching telephone, fax or e-mail address is missing, every output that follows the default fails.
    rule_authority: best_practice
    sap_impact: Invoices, order confirmations and dunning letters sent by the default method are never delivered.
    fix_map:
      __other__: Enter the missing number or e-mail address, or change the standard communication method in XD02.
    record_fix_template: 'Customer {KNA1.KUNNR}: standard communication method {ADRC.DEFLT_COMM} has no number or address.'
  - id: SDCM433
    field: ADRC.HOUSE_NUM1
    check_class: cross_field_check
    fail_when: '`ADRC.STREET`.isna()'
    applies_when:
      ADRC.HOUSE_NUM1:
        populated: true
    grain: KNA1
    severity: medium
    dimension: completeness
    message: House number entered without a street
    why_it_matters: 'A house number only locates a building together with its street. Without the street the address is incomplete:
      carriers cannot deliver and the address check cannot validate it.'
    rule_authority: best_practice
    sap_impact: Deliveries and mail to the address fail; address validation rejects it.
    fix_map:
      __other__: Enter the street in XD02 > Address, or move the value to the right field.
    record_fix_template: 'Customer {KNA1.KUNNR}: house number without a street.'
  - id: SDCM434
    field: ADRC.STREET
    check_class: cross_field_check
    fail_when: '`ADRC.HOUSE_NUM1`.isna() & `ADRC.STREET`.str.slice(-1).str.isdigit()'
    applies_when:
      ADRC.COUNTRY:
      - DE
      - AT
      - CH
      - NL
      - BE
      - DK
      - 'NO'
      - SE
      - FI
      - PL
      - CZ
      - IT
      - ES
      - PT
    grain: KNA1
    severity: low
    dimension: validity
    message: House number typed into the street field
    why_it_matters: In continental Europe the house number follows the street name and Business Address Services keeps it in
      its own field (HOUSE_NUM1) so the address can be validated, sorted for routes and printed in the national order. A number
      at the end of the street with an empty house-number field defeats the address check and the postal validation services.
    rule_authority: best_practice
    sap_impact: Address validation and route sequencing cannot read the house number.
    fix_map:
      __other__: Move the house number from the street to the house-number field (XD02 > Address).
    record_fix_template: 'Customer {KNA1.KUNNR} in {ADRC.COUNTRY}: house number is in the street field.'
  - id: SDCM435
    field: KNA1.PFACH
    check_class: cross_field_check
    fail_when: '`KNA1.PFACH`.str.upper().str.contains(''BOX|POSTFACH|POSTBUS|APARTADO|CASILLA|CAIXA|BP |P[.]O[.]'')'
    grain: KNA1
    severity: low
    dimension: validity
    message: PO box field repeats the words 'PO Box' instead of only the box number
    why_it_matters: SAP prints the PO box with the country's own label ('PO Box', 'Postfach', 'Apartado') from the address format.
      Typing the label into the field prints it twice and stops the postal validation from reading the number.
    rule_authority: best_practice
    sap_impact: Address labels print 'PO Box PO Box 123' and postal validation fails.
    fix_map:
      __other__: Keep only the box number in the PO box field (XD02 > Address > PO box address).
    record_fix_template: 'Customer {KNA1.KUNNR}: PO box field contains the PO box label.'
  - id: SDCM436
    field: KNA1.PFORT
    check_class: cross_field_check
    fail_when: '`KNA1.PFACH`.isna() & `KNA1.PSTL2`.isna()'
    applies_when:
      KNA1.PFORT:
        populated: true
    grain: KNA1
    severity: low
    dimension: completeness
    message: PO box city entered without a PO box or PO box postal code
    why_it_matters: The PO box city is printed only as part of a PO box address. Without the box number or its postal code the
      PO box address is incomplete and mail is returned.
    rule_authority: best_practice
    sap_impact: Correspondence sent to the PO box address is undeliverable.
    fix_map:
      __other__: Enter the PO box and its postal code or clear the PO box city (XD02 > Address).
    record_fix_template: 'Customer {KNA1.KUNNR}: PO box city without a PO box.'
  - id: SDCM437
    field: KNA1.ORT02
    check_class: cross_field_check
    fail_when: '`KNA1.ORT02`.str.upper() == `KNA1.ORT01`.str.upper()'
    require_populated: true
    grain: KNA1
    severity: low
    dimension: validity
    message: District repeats the city
    why_it_matters: The district (ORT02) refines the city; repeating the city prints it twice on every label and makes the address
      check treat the city as a district of itself.
    rule_authority: best_practice
    sap_impact: Address labels print the city twice and address validation may reject the address.
    fix_map:
      __other__: Clear the district or enter the real district (XD02 > Address).
    record_fix_template: 'Customer {KNA1.KUNNR}: district repeats the city.'
  - id: SDCM438
    field: KNA1.NAME2
    check_class: cross_field_check
    fail_when: '`KNA1.NAME2`.str.upper() == `KNA1.NAME1`.str.upper()'
    require_populated: true
    grain: KNA1
    severity: low
    dimension: validity
    message: Name 2 repeats name 1
    why_it_matters: Name 2 continues the customer name. Repeating name 1 prints the name twice on every document and makes fuzzy
      duplicate checks compare a doubled name.
    rule_authority: best_practice
    sap_impact: Documents print the name twice; duplicate detection scores are distorted.
    fix_map:
      __other__: Clear name 2 or enter the continuation of the name (XD02 > Address).
    record_fix_template: 'Customer {KNA1.KUNNR}: name 2 repeats name 1.'
  - id: SDCM439
    field: KNA1.NAME1
    check_class: cross_field_check
    fail_when: '`KNA1.NAME1`.str.islower()'
    grain: KNA1
    severity: low
    dimension: validity
    message: Name is written entirely in lower case
    why_it_matters: Customer names are printed on invoices, contracts and tax documents exactly as stored. An all-lower-case
      name was typed carelessly or loaded from an unformatted source and looks wrong on every legal document.
    rule_authority: best_practice
    sap_impact: Legal documents print an unformatted customer name.
    fix_map:
      __other__: Correct the capitalisation of the name in XD02 > Address.
    record_fix_template: 'Customer {KNA1.KUNNR}: name is all lower case.'
  - id: SDCM440
    field: KNA1.ORT01
    check_class: cross_field_check
    fail_when: '`KNA1.ORT01`.str.islower()'
    grain: KNA1
    severity: low
    dimension: validity
    message: City is written entirely in lower case
    why_it_matters: The city is printed on address labels and compared by the address check and the match code. An all-lower-case
      city was loaded unformatted and does not match the city file.
    rule_authority: best_practice
    sap_impact: Labels print an unformatted city and the city-file check fails.
    fix_map:
      __other__: Correct the capitalisation of the city in XD02 > Address.
    record_fix_template: 'Customer {KNA1.KUNNR}: city is all lower case.'
  - id: SDCM441
    field: KNA1.KNURL
    check_class: regex_check
    pattern: ^((https?://)?[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?([.][A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*[.][A-Za-z]{2,}(:[0-9]{1,5})?([/?#][^
      ]*)?)$
    grain: KNA1
    severity: low
    dimension: validity
    message: Website is not a valid web address
    why_it_matters: KNURL is the customer's homepage, opened from XD03 and passed to CRM and the BP. A value without a domain,
      with spaces or with a typo in the scheme cannot be opened and is migrated as a broken URI.
    rule_authority: best_practice
    sap_impact: The website link fails and is migrated as an invalid URI to the BP.
    fix_map:
      __other__: Enter the full web address (www.example.com or https://www.example.com) in XD02 > Control data.
    record_fix_template: 'Customer {KNA1.KUNNR}: website is not a valid web address.'
  - id: SDCM442
    field: KNA1.TELF2
    check_class: cross_field_check
    fail_when: '`KNA1.TELF2`.str.replace(''[^0-9]'', '''', regex=True) == `KNA1.TELF1`.str.replace(''[^0-9]'', '''', regex=True)'
    require_populated: true
    grain: KNA1
    severity: low
    dimension: validity
    message: Second telephone number repeats the first
    why_it_matters: Telephone 2 is an alternative number. Repeating telephone 1 gives no fallback and doubles the number in
      the BP conversion, which creates one communication entry per number.
    rule_authority: best_practice
    sap_impact: The BP gets the same telephone number twice.
    fix_map:
      __other__: Clear telephone 2 or enter the real alternative number (XD02 > Address > Communication).
    record_fix_template: 'Customer {KNA1.KUNNR}: telephone 2 repeats telephone 1.'
  - id: SDCM443
    field: KNA1.TELFX
    check_class: cross_field_check
    fail_when: '`KNA1.TELFX`.str.replace(''[^0-9]'', '''', regex=True) == `KNA1.TELF1`.str.replace(''[^0-9]'', '''', regex=True)'
    require_populated: true
    grain: KNA1
    severity: low
    dimension: validity
    message: Fax number repeats the telephone number
    why_it_matters: Fax output dials the fax number. When it is the voice telephone number, fax output rings a person's telephone
      and fails, and the BP gets a fax entry that is not a fax.
    rule_authority: best_practice
    sap_impact: Fax output to the customer fails.
    fix_map:
      __other__: Enter the real fax number or clear it (XD02 > Address > Communication).
    record_fix_template: 'Customer {KNA1.KUNNR}: fax number repeats the telephone number.'
  - id: SDCM444
    field: KNA1.CIVVE
    check_class: cross_field_check
    fail_when: '`KNA1.MILVE` == ''X'''
    applies_when:
      KNA1.CIVVE:
      - X
    grain: KNA1
    severity: low
    dimension: consistency
    message: Customer is marked for both civilian and military use
    why_it_matters: The ID for mainly civilian usage (CIVVE) and mainly military usage (MILVE) are alternatives used by export
      control (SAP GTS / legal control) to classify the end use. Both set at once leaves the end-use classification undetermined,
      so export licence determination cannot decide.
    rule_authority: sap_hard_constraint
    sap_impact: Export control screening cannot classify the end use and may block or wrongly release deliveries.
    fix_map:
      __other__: Keep only the correct usage indicator in XD02 > Control data > Export data.
    record_fix_template: 'Customer {KNA1.KUNNR}: marked for both civilian and military use.'
  - id: SDCM445
    field: KNA1.BRAN2
    check_class: cross_field_check
    fail_when: (`KNA1.BRAN2` == `KNA1.BRAN1`)
    require_populated: false
    applies_when:
      KNA1.BRAN2:
        populated: true
    grain: KNA1
    severity: low
    dimension: validity
    message: Industry code 2 repeats an earlier industry code
    why_it_matters: Industry codes 1-5 classify the customer for statistics, pricing and the BP industry sectors. A repeated
      code adds no classification and the BP conversion creates the same industry twice in one industry system, which the BP
      rejects.
    rule_authority: best_practice
    sap_impact: The BP industry assignment fails or carries duplicates.
    fix_map:
      __other__: Remove the duplicate industry code in XD02 > Marketing.
    record_fix_template: 'Customer {KNA1.KUNNR}: industry code 2 repeats an earlier one.'
  - id: SDCM446
    field: KNA1.BRAN3
    check_class: cross_field_check
    fail_when: (`KNA1.BRAN3` == `KNA1.BRAN1`) | (`KNA1.BRAN3` == `KNA1.BRAN2`)
    require_populated: false
    applies_when:
      KNA1.BRAN3:
        populated: true
    grain: KNA1
    severity: low
    dimension: validity
    message: Industry code 3 repeats an earlier industry code
    why_it_matters: Industry codes 1-5 classify the customer for statistics, pricing and the BP industry sectors. A repeated
      code adds no classification and the BP conversion creates the same industry twice in one industry system, which the BP
      rejects.
    rule_authority: best_practice
    sap_impact: The BP industry assignment fails or carries duplicates.
    fix_map:
      __other__: Remove the duplicate industry code in XD02 > Marketing.
    record_fix_template: 'Customer {KNA1.KUNNR}: industry code 3 repeats an earlier one.'
  - id: SDCM447
    field: KNA1.BRAN4
    check_class: cross_field_check
    fail_when: (`KNA1.BRAN4` == `KNA1.BRAN1`) | (`KNA1.BRAN4` == `KNA1.BRAN2`) | (`KNA1.BRAN4` == `KNA1.BRAN3`)
    require_populated: false
    applies_when:
      KNA1.BRAN4:
        populated: true
    grain: KNA1
    severity: low
    dimension: validity
    message: Industry code 4 repeats an earlier industry code
    why_it_matters: Industry codes 1-5 classify the customer for statistics, pricing and the BP industry sectors. A repeated
      code adds no classification and the BP conversion creates the same industry twice in one industry system, which the BP
      rejects.
    rule_authority: best_practice
    sap_impact: The BP industry assignment fails or carries duplicates.
    fix_map:
      __other__: Remove the duplicate industry code in XD02 > Marketing.
    record_fix_template: 'Customer {KNA1.KUNNR}: industry code 4 repeats an earlier one.'
  - id: SDCM448
    field: KNA1.BRAN5
    check_class: cross_field_check
    fail_when: (`KNA1.BRAN5` == `KNA1.BRAN1`) | (`KNA1.BRAN5` == `KNA1.BRAN2`) | (`KNA1.BRAN5` == `KNA1.BRAN3`) | (`KNA1.BRAN5`
      == `KNA1.BRAN4`)
    require_populated: false
    applies_when:
      KNA1.BRAN5:
        populated: true
    grain: KNA1
    severity: low
    dimension: validity
    message: Industry code 5 repeats an earlier industry code
    why_it_matters: Industry codes 1-5 classify the customer for statistics, pricing and the BP industry sectors. A repeated
      code adds no classification and the BP conversion creates the same industry twice in one industry system, which the BP
      rejects.
    rule_authority: best_practice
    sap_impact: The BP industry assignment fails or carries duplicates.
    fix_map:
      __other__: Remove the duplicate industry code in XD02 > Marketing.
    record_fix_template: 'Customer {KNA1.KUNNR}: industry code 5 repeats an earlier one.'
  - id: SDCM449
    field: KNVI.KUNNR
    check_class: exists_check
    fields:
    - KNVI.KUNNR
    target_table: KNA1
    target_fields:
    - KUNNR
    grain: KNVI
    severity: medium
    dimension: consistency
    message: Tax classification belongs to a customer that does not exist
    why_it_matters: KNVI rows hang off the customer master. A row without its customer is an orphan from an incomplete deletion
      or load; extracts and the BP tax classification migration still read it.
    rule_authority: sap_hard_constraint
    sap_impact: The orphan is migrated or reported for a customer that does not exist.
    fix_map:
      __other__: Delete the orphan KNVI rows or create the missing customer.
    record_fix_template: 'Customer {KNVI.KUNNR}, country {KNVI.ALAND}: customer does not exist.'
  - id: SDCM450
    field: KNVI.ALAND
    check_class: exists_check
    fields:
    - KNVI.ALAND
    target_table: T005
    target_fields:
    - LAND1
    grain: KNVI
    severity: medium
    dimension: validity
    message: Tax classification is maintained for a country that is not defined
    why_it_matters: KNVI.ALAND is the departure country whose tax categories the classification feeds. An undefined country
      never matches a delivering plant's country, so pricing never reads the classification.
    rule_authority: sap_hard_constraint
    sap_impact: Output tax is determined without the customer's tax classification.
    fix_map:
      __other__: Correct the country of the tax classification in VD02 > Billing > Taxes.
    record_fix_template: 'Customer {KNVI.KUNNR}: tax classification country {KNVI.ALAND} is not defined.'
  - id: SDCM451
    field: KNVK.NAMEV
    check_class: null_check
    applies_when:
      KNVK.LOEVM:
        blank: true
    grain: KNVK
    severity: low
    dimension: completeness
    message: Contact person has no first name
    why_it_matters: The CVI converts each contact person into a BP of category person with a relationship to the customer. Without
      a first name salutations print only the surname and duplicate checks on persons are weaker.
    rule_authority: best_practice
    sap_impact: Letters address the contact by surname only; person duplicates are harder to detect.
    fix_map:
      __other__: Enter the first name in XD02 > Contact persons.
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR}: no first name.'
  - id: SDCM452
    field: KNVK.GBDAT
    check_class: cross_field_check
    fail_when: (`KNVK.GBDAT`.dt.year < 1900) | (`KNVK.GBDAT` > @today)
    grain: KNVK
    severity: low
    dimension: validity
    message: Contact person's date of birth is before 1900 or in the future
    why_it_matters: A birth date in the future or before 1900 is a load default or typing error. The BP conversion copies it
      to the person's birth date, where age-based checks and GDPR retention logic read it.
    rule_authority: best_practice
    sap_impact: The BP person carries an impossible birth date.
    fix_map:
      __other__: Correct or clear the date of birth in XD02 > Contact persons.
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR}: date of birth is impossible.'
  - id: SDCM453
    field: KNVK.MOBI1
    check_class: cross_field_check
    fail_when: (`KNVK.MOBI1` < `KNVK.MOAB1`) | (`KNVK.MOBI2` < `KNVK.MOAB2`) | (`KNVK.DIBI1` < `KNVK.DIAB1`) | (`KNVK.DIBI2`
      < `KNVK.DIAB2`) | (`KNVK.MIBI1` < `KNVK.MIAB1`) | (`KNVK.MIBI2` < `KNVK.MIAB2`) | (`KNVK.DOBI1` < `KNVK.DOAB1`) | (`KNVK.DOBI2`
      < `KNVK.DOAB2`) | (`KNVK.FRBI1` < `KNVK.FRAB1`) | (`KNVK.FRBI2` < `KNVK.FRAB2`) | (`KNVK.SABI1` < `KNVK.SAAB1`) | (`KNVK.SABI2`
      < `KNVK.SAAB2`) | (`KNVK.SOBI1` < `KNVK.SOAB1`) | (`KNVK.SOBI2` < `KNVK.SOAB2`)
    grain: KNVK
    severity: low
    dimension: consistency
    message: Contact person's visiting hours end before they start
    why_it_matters: Visiting hours are pairs of from (..AB) and until (..BI) times per weekday, used by sales reps and the call-planning
      functions. An until time before the from time is a typing error and makes the window impossible.
    rule_authority: best_practice
    sap_impact: Visit and call planning uses an impossible time window.
    fix_map:
      __other__: Correct the visiting hours in XD02 > Contact persons > Visiting hours.
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR}: visiting hours end before they start.'
  - id: SDCM454
    field: KNVK.UEPAR
    check_class: cross_field_check
    fail_when: '`KNVK.UEPAR` == `KNVK.PARNR`'
    require_populated: true
    grain: KNVK
    severity: low
    dimension: consistency
    message: Contact person is its own higher-level contact
    why_it_matters: UEPAR links a contact to their superior contact person. Pointing at itself creates a loop in the contact
      hierarchy that hierarchy reports and the CVI relationship conversion cannot resolve.
    rule_authority: sap_hard_constraint
    sap_impact: Contact hierarchy reports loop and the BP relationship conversion fails for the contact.
    fix_map:
      __other__: Clear or correct the higher-level partner in XD02 > Contact persons.
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR}: higher-level contact is itself.'
  - id: SDCM455
    field: KNVK.UEPAR
    check_class: exists_check
    fields:
    - KNVK.UEPAR
    target_table: KNVK
    target_fields:
    - PARNR
    applies_when:
      KNVK.UEPAR:
        populated: true
        not_in:
        - '0000000000'
    grain: KNVK
    severity: low
    dimension: consistency
    message: Higher-level contact person does not exist
    why_it_matters: UEPAR must point to another contact person. A number with no KNVK row was deleted or never loaded, so the
      contact hierarchy is broken and the relationship cannot be migrated.
    rule_authority: best_practice
    sap_impact: The contact hierarchy is broken and the relationship is lost in the BP conversion.
    fix_map:
      __other__: Correct or clear the higher-level partner in XD02 > Contact persons.
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR}: higher-level contact {KNVK.UEPAR} does not exist.'
  - id: SDCM456
    field: KNVK.KUNNR
    check_class: cross_field_check
    fail_when: '`KNVK.KUNNR`.isna() & `KNVK.LIFNR`.isna()'
    grain: KNVK
    severity: medium
    dimension: completeness
    message: Contact person belongs to neither a customer nor a vendor
    why_it_matters: A KNVK row is always a contact of a customer (KUNNR) or a vendor (LIFNR). A row with neither is an orphan
      from an incomplete deletion or load; no transaction shows it, but the CVI contact person conversion fails on it.
    rule_authority: sap_hard_constraint
    sap_impact: The CVI contact person conversion stops on an orphan contact.
    fix_map:
      __other__: Delete the orphan contact person rows (KNVK) after checking that they are not needed.
    record_fix_template: 'Contact person {KNVK.PARNR}: assigned to neither a customer nor a vendor.'
  - id: SDCM457
    field: KNVK.NAME1
    check_class: uniqueness_check
    fields:
    - KNVK.KUNNR
    - KNVK.NAMEV
    - KNVK.NAME1
    normalize: name
    applies_when:
      KNVK.LOEVM:
        blank: true
      KNVK.KUNNR:
        populated: true
    grain: KNVK
    severity: low
    dimension: uniqueness
    message: Same contact person entered twice for one customer
    why_it_matters: Each contact person becomes its own BP person and relationship in the CVI conversion. The same first and
      last name twice on one customer creates duplicate persons, and their communication data and roles diverge.
    rule_authority: best_practice
    sap_impact: Duplicate BP persons and relationships are created for the customer.
    fix_map:
      __other__: Merge the duplicate contact persons and flag the extra one for deletion (XD02 > Contact persons).
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR}: duplicate contact person.'
  - id: SDCM458
    field: KNVK.NAME1
    check_class: cross_field_check
    fail_when: '`KNVK.NAME1`.str.contains(''[0-9]'')'
    grain: KNVK
    severity: low
    dimension: validity
    message: Contact person's last name contains digits
    why_it_matters: A person's surname does not contain digits. Digits mean a telephone number, extension or reference was typed
      into the name, which then becomes the BP person's last name.
    rule_authority: best_practice
    sap_impact: The BP person gets a last name with a number in it.
    fix_map:
      __other__: Move the number to the communication fields and correct the name (XD02 > Contact persons).
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR}: last name contains digits.'
  - id: SDCM459
    field: KNVK.NAME1
    check_class: cross_field_check
    fail_when: '`KNVK.NAME1`.str.upper() == `KNA1.NAME1`.str.upper()'
    require_populated: true
    grain: KNVK
    severity: low
    dimension: validity
    message: Contact person's last name is the customer's company name
    why_it_matters: A contact person is a named individual. When the 'last name' is the customer's own name, a generic company
      contact was created instead of a person, and the CVI turns it into a BP person named like the company.
    rule_authority: best_practice
    sap_impact: The BP conversion creates a person named after the company.
    fix_map:
      __other__: Replace the contact with the real person, or keep company communication data on the customer address.
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR}: last name is the company name.'
  - id: SDCM460
    field: KNVK.ERDAT
    check_class: cross_field_check
    fail_when: '`KNVK.ERDAT` < `KNA1.ERDAT`'
    require_populated: true
    grain: KNVK
    severity: low
    dimension: consistency
    message: Contact person was created before its customer
    why_it_matters: A contact person can only be created on an existing customer. An earlier creation date means one of the
      two dates was loaded wrongly, so audit trails and data-retention calculations are unreliable.
    rule_authority: best_practice
    sap_impact: Creation-date based retention and audit reports are wrong for the contact.
    fix_map:
      __other__: Check the legacy load and correct the creation dates if the source holds the real ones.
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR}: created before the customer.'
