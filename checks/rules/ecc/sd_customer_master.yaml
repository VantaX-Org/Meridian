module: sd_customer_master
target_state: ECC_AND_S4HANA
rules:
  - id: SDCM001
    field: KNA1.KUNNR
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Customer number is mandatory — primary key for all SD customer transactions"
    why_it_matters: >-
      KUNNR is the primary key for the SD customer master. Without it, no
      sales area data can be maintained and the customer cannot be used in
      any SD transaction including sales orders (VA01), deliveries (VL01N),
      and billing (VF01). In S/4HANA, KNA1 is a compatibility view — the
      primary master is Business Partner (BUT000) via CVI mapping.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Customer cannot be used in any SD process. VA01, VL01N, VF01 all fail.
      Migration conversion rejects the record.
    fix_map:
      __blank__: >-
        In ECC: assign a valid customer number via T-code VD01 (create SD
        customer) or XD01 (create customer with all views). In S/4HANA:
        create via Fiori app F3893 (Manage Business Partner) with the
        customer role and sales area data.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: KUNNR is {actual_value}. Assign a valid customer
      number via VD01 / Fiori app F3893 or correct the source data.

  - id: SDCM002
    field: KNA1.KUNNR
    check_class: regex_check
    pattern: "^[A-Z0-9]{1,10}$"
    severity: critical
    dimension: validity
    message: "Customer number must be 1-10 alphanumeric characters"
    why_it_matters: >-
      Customer numbers must conform to the number range configuration (table
      TNRO, object DEBITOR). Non-conforming formats are rejected by the
      system and break the customer-vendor integration (CVI) mapping to
      Business Partner in S/4HANA.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Customer rejected by number range validation. CVI mapping to Business
      Partner fails. Customer unusable in any SD or FI-AR transaction.
    fix_map:
      __other__: >-
        Customer number '{invalid_value}' does not match the required format.
        In ECC: use LSMW or a conversion program to reformat. Coordinate with
        the basis team on number range configuration (T-code SNRO, object
        DEBITOR). In S/4HANA: use Fiori app F4596 for number ranges.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: number format is invalid (value: '{actual_value}').
      Reformat or assign a new number via SNRO / Fiori app F4596.

  - id: SDCM003
    field: KNA1.NAME1
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Customer name is mandatory — displayed on all SD documents"
    why_it_matters: >-
      NAME1 is the primary customer name displayed on sales orders, delivery
      notes, invoices, pro forma invoices, and all printed SD correspondence.
      It is a mandatory field — the customer master cannot be saved without it
      in either ECC or S/4HANA.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Customer master cannot be saved. Sales orders, delivery notes, and
      invoices display blank customer name. Partner function determination
      in SD fails.
    fix_map:
      __blank__: >-
        In ECC: obtain the legal entity name and set via T-code VD02 >
        Address tab or XD02 > Address tab. In S/4HANA: use Fiori app F3893
        (Manage Business Partner).
    record_fix_template: >-
      Customer {KNA1.KUNNR}: KNA1.NAME1 is missing or invalid. Set the customer name
      via VD02 / Fiori app F3893.


  - id: SDCM005
    field: KNA1.LAND1
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Country is mandatory — drives tax determination and shipping route calculation"
    why_it_matters: >-
      LAND1 (country code) is mandatory for all SD customers. It drives tax
      determination, output determination, incoterms validation, shipping
      route calculation, and export/import control. Without it, no SD
      transactions can be processed.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Customer cannot be saved. Tax determination (FTXP) fails. Shipping
      route determination (VT01N) produces errors. Export control checks
      cannot be executed.
    fix_map:
      __blank__: >-
        In ECC: determine the ISO country code from the customer's address
        and set via T-code VD02 > Address tab. In S/4HANA: use Fiori app
        F3893 (Manage Business Partner).
    record_fix_template: >-
      Customer {KNA1.KUNNR}: LAND1 is {actual_value}. Set the ISO country
      code via VD02 / Fiori app F3893.

  - id: SDCM006
    field: KNA1.STCD1
    check_class: cross_field_check
    severity: low
    dimension: completeness
    message: Customer has no tax identification (neither tax number 1 nor VAT registration number)
    why_it_matters: STCD1 (tax number) is required for generating tax-compliant invoices. Many jurisdictions require the customer's
      tax registration number on invoices for VAT deduction. Missing tax number results in non-compliant billing documents from
      VF01.
    rule_authority: best_practice
    sap_impact: Billing documents (VF01) do not include customer tax number. Tax invoices are non-compliant in jurisdictions
      requiring tax ID on invoices. E-invoicing mandates may reject the document.
    fix_map:
      __blank__: 'In ECC: obtain the customer''s VAT number or tax ID and set via T-code VD02 > General Data > Control tab or
        XD02. In S/4HANA: use Fiori app F3893 > Tax Numbers section.'
    record_fix_template: 'Customer {KNA1.KUNNR}: KNA1.STCD1 is missing or invalid. Set the tax number via VD02 / Fiori app F3893.'
    fail_when: '`KNA1.STCD1`.isna() & `KNA1.STCEG`.isna()'
    applies_when:
      KNA1.STKZN:
        not_in:
        - X

  - id: SDCM007
    field: ADR6.SMTP_ADDR
    check_class: null_check
    severity: medium
    dimension: completeness
    message: "Email required for electronic order confirmations and invoice delivery"
    why_it_matters: >-
      Email address is required for sending order confirmations, delivery
      notifications, invoices, and credit/debit memos electronically. Without
      it, all SD output falls back to paper or fax, increasing cost and
      reducing delivery speed.
    rule_authority: best_practice
    sap_impact: >-
      Order confirmations, shipping notifications, and invoices cannot be
      sent electronically. Output determination (NACE) falls back to print.
    fix_map:
      __blank__: >-
        In ECC: obtain email from the customer or sales team and set via
        T-code VD02 > Address tab > Communication. In S/4HANA: use Fiori
        app F3893 > Address section.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: ADR6.SMTP_ADDR is missing or invalid. Set the email
      address via VD02 / Fiori app F3893.

  - id: SDCM008
    field: KNA1.KTOKD
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Customer account group is mandatory — controls SD field status"
    why_it_matters: >-
      KTOKD (account group) controls which fields are required, optional, or
      suppressed in the customer master including the sales area data. It
      determines whether the customer is a sold-to, ship-to, bill-to, or
      payer partner. Without it, the customer master structure is undefined.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Customer master structure is undefined. Partner function determination
      fails. The record cannot be saved.
    fix_map:
      __blank__: >-
        In ECC: assign the account group via T-code VD02 or XD02. Common
        SD groups: KUND (sold-to), KUWE (ship-to), KURE (payer), KUWZ
        (bill-to). In S/4HANA: use Fiori app F3893 via BP grouping.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: KTOKD is {actual_value}. Assign the customer
      account group via VD02 / Fiori app F3893.

  - id: SDCM012
    field: KNVV.KDGRP
    check_class: null_check
    severity: medium
    dimension: completeness
    message: Customer group missing — affects pricing and reporting segmentation
    why_it_matters: KDGRP (customer group) is used in pricing condition records, reporting, and customer segmentation. Without
      it, group-specific pricing cannot be applied and sales reports cannot segment by customer category. Rebate agreements
      based on customer group are not triggered.
    rule_authority: best_practice
    sap_impact: Customer group-specific pricing conditions are not applied. Sales analysis reports (MC+E) cannot segment by
      customer group. Rebate agreements based on customer group are not triggered.
    fix_map:
      __blank__: 'In ECC: assign the correct group based on customer classification (e.g., 01=domestic, 02=export, 03=key account)
        via T-code VD02 > Sales Area Data > Sales tab. In S/4HANA: use Fiori app F3893.'
    record_fix_template: 'Customer {KNA1.KUNNR}: KDGRP is {actual_value}. Assign the customer group via VD02 / Fiori app F3893.'

  - id: SDCM013
    field: KNVV.KALKS
    check_class: null_check
    severity: high
    dimension: completeness
    message: Pricing procedure missing — no prices determined on sales orders
    why_it_matters: KALKS (customer pricing procedure) determines which pricing conditions (base price, discounts, surcharges,
      taxes) are applied when creating a sales order. Without it, no automatic pricing occurs in VA01 and every order must be
      priced manually, creating significant revenue risk.
    rule_authority: best_practice
    sap_impact: Sales orders (VA01) have no automatic pricing. All conditions must be entered manually. Pricing analysis (V/LD)
      shows no procedure assignment. Revenue recognition may be incorrect.
    fix_map:
      __blank__: 'In ECC: assign the customer pricing procedure via T-code VD02 > Sales Area Data > Sales tab. This works with
        the sales org pricing procedure (OVKK) and document pricing procedure to determine the final pricing procedure. In S/4HANA:
        use Fiori app F3893.'
    record_fix_template: 'Customer {KNA1.KUNNR}: KALKS is {actual_value}. Assign the pricing procedure via VD02 / Fiori app
      F3893.'

  - id: SDCM014
    field: KNVV.ZTERM
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Payment terms missing in sales area — no default for sales orders"
    why_it_matters: >-
      ZTERM in the sales area data provides the default payment terms for
      sales orders and billing documents. Without it, every sales order
      requires manual entry of payment terms, slowing order processing and
      increasing error risk. These terms override the FI company code terms.
    rule_authority: best_practice
    sap_impact: >-
      No default payment terms on sales orders (VA01). Manual entry required
      for every order. Billing documents (VF01) have no payment baseline.
      Cash flow forecasting is inaccurate.
    fix_map:
      __blank__: >-
        In ECC: obtain the agreed terms from the sales contract and set via
        T-code VD02 > Sales Area Data > Billing tab. Common values: ZB30
        (30 days net), ZB60 (60 days net). In S/4HANA: use Fiori app F3893.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: ZTERM is {actual_value}. Set payment terms
      via VD02 / Fiori app F3893 > Sales Area Data.

  - id: SDCM015
    field: KNVV.INCO1
    check_class: domain_value_check
    allowed_values:
    - EXW
    - FCA
    - CPT
    - CIP
    - DAP
    - DPU
    - DDP
    - FAS
    - FOB
    - CFR
    - CIF
    - DAT
    - DAF
    - DDU
    - DEQ
    - DES
    - FH
    - UN
    - ''
    severity: medium
    dimension: validity
    message: Incoterms must be a valid Incoterms 2020 code or empty
    why_it_matters: INCO1 (incoterms) defines the shipping terms and determines who bears transport risk and cost. Invalid incoterms
      cause freight cost miscalculation, incorrect export documentation, and disputes over delivery responsibility. Incoterms
      2020 defines 11 standard terms.
    rule_authority: sap_hard_constraint
    sap_impact: Sales orders (VA01) have invalid shipping terms. Freight cost determination is incorrect. Export documentation
      is non-compliant.
    valid_values_with_labels:
      EXW: Ex Works — buyer bears all transport risk and cost
      FCA: Free Carrier — seller delivers to carrier at named place
      CPT: Carriage Paid To — seller pays freight to destination
      CIP: Carriage and Insurance Paid To — seller pays freight and insurance
      DAP: Delivered at Place — seller delivers to named place
      DPU: Delivered at Place Unloaded — seller delivers and unloads
      DDP: Delivered Duty Paid — seller bears all cost including import duty
      FAS: Free Alongside Ship — sea freight, seller delivers alongside vessel
      FOB: Free on Board — sea freight, seller delivers on board vessel
      CFR: Cost and Freight — sea freight, seller pays freight to port
      CIF: Cost Insurance Freight — sea freight, seller pays freight and insurance
      ? ''
      : No incoterms assigned
    fix_map:
      __other__: 'Value ''{invalid_value}'' is not a valid Incoterms 2020 code. In ECC: correct via T-code VD02 > Sales Area
        Data > Shipping tab. Valid codes are configured in table TINC. In S/4HANA: use Fiori app F3893.'
    record_fix_template: 'Customer {KNA1.KUNNR}: INCO1 is ''{actual_value}''. Set to a valid Incoterms 2020 code via VD02 /
      Fiori app F3893.'


  - id: SDCM017
    field: KNVV.KZAZU
    check_class: domain_value_check
    allowed_values: ["X", ""]
    severity: medium
    dimension: validity
    message: "Order combination flag must be X (enabled) or empty (disabled)"
    why_it_matters: >-
      KZAZU controls whether multiple sales orders for this customer can be
      combined into a single delivery. When enabled, the delivery creation
      process (VL01N) can consolidate items from multiple orders into one
      shipment, reducing logistics cost. An invalid value disrupts delivery
      processing.
    rule_authority: best_practice
    sap_impact: >-
      Delivery consolidation in VL01N may behave unpredictably. Logistics
      cost optimisation through order combination is not possible if the
      flag is incorrectly set.
    valid_values_with_labels:
      "X": "Order combination enabled — multiple orders can be combined"
      "": "Order combination disabled — separate delivery per order"
    fix_map:
      __other__: >-
        Value '{invalid_value}' is not valid. Must be X (enabled) or empty
        (disabled). In ECC: correct via T-code VD02 > Sales Area Data >
        Shipping tab. In S/4HANA: use Fiori app F3893.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: KZAZU is '{actual_value}'. Set to X or empty
      via VD02 / Fiori app F3893.

  - id: SDCM018
    field: KNVV.WAERS
    check_class: regex_check
    pattern: "^[A-Z]{3}$"
    severity: critical
    dimension: validity
    message: "Sales area currency must be a valid 3-letter ISO currency code"
    why_it_matters: >-
      WAERS in the sales area determines the default currency for all sales
      orders and billing documents for this customer. It must be a valid
      ISO 4217 code. Invalid currencies cause pricing determination failures
      and billing document errors.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Pricing determination in VA01 fails. Billing documents (VF01) cannot
      be created. Currency conversion errors occur throughout the SD process.
    fix_map:
      __other__: >-
        Currency '{invalid_value}' is not a valid ISO 4217 code. In ECC:
        correct via T-code VD02 > Sales Area Data > Sales tab. The currency
        must be configured in the system (T-code OY03). In S/4HANA: use
        Fiori app F3893.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: WAERS is '{actual_value}'. Set to a valid ISO
      currency code via VD02 / Fiori app F3893.

  - id: SDCM019
    field: KNVV.VERSG
    check_class: null_check
    severity: low
    dimension: completeness
    message: Statistics group is recommended for sales reporting and analysis
    why_it_matters: VERSG (statistics group) controls how this customer is represented in the Logistics Information System (LIS)
      and sales statistics. Without it, the customer may be excluded from standard sales reports and analysis tools (MC+E, MC+I).
    rule_authority: best_practice
    sap_impact: Customer excluded from LIS sales statistics. Standard analysis reports (MC+E) may not include this customer's
      sales data.
    fix_map:
      __blank__: 'In ECC: assign the statistics group via T-code VD02 > Sales Area Data > Sales tab. In S/4HANA: use Fiori app
        F3893.'
    record_fix_template: 'Customer {KNA1.KUNNR}: VERSG is {actual_value}. Assign the statistics group via VD02 / Fiori app F3893.'

  - id: SDCM020
    field: KNVV.LPRIO
    check_class: domain_value_check
    severity: medium
    dimension: validity
    message: Delivery priority must be 01 (high), 02 (normal), 03 (low), or empty
    why_it_matters: LPRIO (delivery priority) determines the order in which deliveries are processed during delivery creation
      and shipping. It affects warehouse picking sequence and transport scheduling. Invalid values disrupt delivery sequencing.
    rule_authority: best_practice
    sap_impact: Delivery sequencing in VL01N/VL06 may be incorrect. Warehouse picking priorities are not properly assigned.
      High-priority customers may not receive preferential treatment.
    valid_values_with_labels:
      '01': High priority — processed first
      '02': Normal priority
      '03': Low priority — processed last
      ? ''
      : No priority assigned — defaults to normal
    fix_map:
      __other__: 'Value ''{invalid_value}'' is not a valid delivery priority. Must be 01 (high), 02 (normal), 03 (low), or empty.
        In ECC: correct via T-code VD02 > Sales Area Data > Shipping tab. In S/4HANA: use Fiori app F3893.'
    record_fix_template: 'Customer {KNA1.KUNNR}: LPRIO is ''{actual_value}''. Set to 01, 02, 03, or empty via VD02 / Fiori app
      F3893.'

  - id: SDCM021
    field: KNVV.VSBED
    check_class: null_check
    severity: medium
    dimension: completeness
    message: "Shipping conditions missing — affects route and shipping point determination"
    why_it_matters: >-
      VSBED (shipping conditions) is used in shipping point determination
      and route determination during delivery creation. Without it, the
      system cannot automatically determine the correct shipping point or
      route, requiring manual intervention for every delivery.
    rule_authority: best_practice
    sap_impact: >-
      Shipping point determination in VL01N requires manual override. Route
      determination fails. Freight cost calculation may be incorrect.
    fix_map:
      __blank__: >-
        In ECC: assign shipping conditions via T-code VD02 > Sales Area
        Data > Shipping tab. Common values: 01 (standard), 02 (express).
        In S/4HANA: use Fiori app F3893.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: VSBED is {actual_value}. Assign shipping
      conditions via VD02 / Fiori app F3893.

  - id: SDCM022
    field: KNA1.KUNNR
    check_class: cross_field_check
    severity: high
    dimension: consistency
    message: Incoterms code and location must both be filled or both be blank
    why_it_matters: INCO1 (incoterms code) and INCO2 (incoterms location) form a pair that must be maintained together.
      An incoterms code without a location is ambiguous (e.g., "FOB" without a port name), while a location without
      a code is meaningless. Incomplete incoterms cause disputes over delivery responsibility and may result in non-compliant
      export documentation.
    rule_authority: sap_hard_constraint
    sap_impact: Sales orders have incomplete shipping terms. Export documentation is non-compliant. Freight cost allocation
      may be disputed. Incoterms validation in VA01 may produce warnings or errors depending on configuration.
    fix_map: {__other__: 'Incoterms code and location are not both filled. In ECC: set both fields together via T-code
        VD02 > Sales Area Data > Shipping tab. In S/4HANA: use Fiori app F3893. Both INCO1 and INCO2 must be maintained
        as a pair.'}
    record_fix_template: 'Customer {KNA1.KUNNR}: INCO1 and INCO2 are inconsistent — one is filled and the other is
      blank. Set both via VD02 / Fiori app F3893.'
    fail_when: '`KNVV.INCO1`.notna() != `KNVV.INCO2`.notna()'

  - id: SDCM024
    field: KNA1.KUNNR
    check_class: uniqueness_check
    fields: [KNA1.KUNNR]
    severity: critical
    dimension: uniqueness
    message: Duplicate SD customer numbers detected — each customer must be unique
    why_it_matters: Duplicate customer numbers violate the primary key constraint. The migration program will reject
      duplicates, and any that slip through cause incorrect SD document assignment, double billing, and broken customer
      reporting. This typically indicates a data extraction or consolidation error.
    rule_authority: sap_hard_constraint
    sap_impact: Migration fails on duplicate key insert. Post-migration, duplicate customers cause double billing,
      incorrect delivery assignment, and broken sales reporting.
    fix_map: {__other__: 'Duplicate SD customer number detected. Identify the canonical record and merge or deactivate
        the duplicate. In ECC: review both records via T-code VD03 and merge outstanding items. In S/4HANA: use Fiori
        app F3893 and BP merge tools to consolidate.'}
    record_fix_template: 'Customer {KNA1.KUNNR}: duplicate detected. Review and merge via VD03 / Fiori app F3893.'

  - id: SDCM025
    field: KNVV.WAERS
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Sales area currency is required — determines pricing and billing currency"
    why_it_matters: >-
      WAERS in the sales area determines the default document currency for
      all sales orders and billing documents. Without it, the system cannot
      determine the pricing currency, causing pricing determination to fail
      in VA01 and billing document creation to fail in VF01.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Pricing determination in VA01 fails — no prices are calculated.
      Billing documents cannot be created in VF01. The customer is
      commercially inactive without a currency assignment.
    fix_map:
      __blank__: >-
        In ECC: assign the document currency via T-code VD02 > Sales Area
        Data > Sales tab. In S/4HANA: use Fiori app F3893. The currency
        should match the customer's trading currency.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: WAERS is {actual_value}. Assign the sales area
      currency via VD02 / Fiori app F3893.

  - id: SDCM026
    field: KNVV.VKORG
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Customer sales organisation KNVV.VKORG must exist in TVKO
    why_it_matters: Sales-area data can only be used in a sales organisation that exists. Data kept for a sales organisation
      that was removed from the configuration contradicts the organisational structure.
    rule_authority: best_practice
    sap_impact: The sales area is unreachable in VA01; reporting shows a non-existent sales organisation.
    fix_map:
      __other__: Sales organisation '{invalid_value}' is not defined in TVKO. Delete the obsolete sales-area data or extend
        the customer to the right sales area (VD01/XD01).
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: sales organisation ''{actual_value}''
      does not exist in TVKO.'
  - id: SDCM027
    field: KNVV.VTWEG
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Customer distribution channel KNVV.VTWEG must exist in TVTW
    why_it_matters: The distribution channel is part of the sales area every sales document is created in. A channel that
      is not defined makes the sales area unusable.
    rule_authority: best_practice
    sap_impact: Sales documents cannot be created in this sales area.
    fix_map:
      __other__: Distribution channel '{invalid_value}' is not defined in TVTW. Delete the obsolete sales-area data or extend
        the customer to the right sales area.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: distribution channel ''{actual_value}''
      does not exist in TVTW.'
  - id: SDCM028
    field: KNVV.SPART
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Customer division KNVV.SPART must exist in TSPA
    why_it_matters: The division is part of the sales area every sales document is created in. A division that is not defined
      makes the sales area unusable.
    rule_authority: best_practice
    sap_impact: Sales documents cannot be created in this sales area.
    fix_map:
      __other__: Division '{invalid_value}' is not defined in TSPA. Delete the obsolete sales-area data or extend the customer
        to the right sales area.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: division ''{actual_value}''
      does not exist in TSPA.'
  - id: SDCM029
    field: KNVV.KALKS
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Customer pricing procedure KNVV.KALKS must exist in TVKD
    why_it_matters: The customer pricing procedure key (KALKS) is one of the three keys of pricing procedure determination
      (OVKK). A key that is not defined in TVKD determines no pricing procedure.
    rule_authority: best_practice
    sap_impact: 'Sales orders get no pricing procedure: no prices, no taxes, the order is incomplete and cannot be billed.'
    fix_map:
      __other__: Customer pricing procedure '{invalid_value}' is not defined in TVKD. Correct it in VD02/XD02 > Sales area
        > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: customer pricing procedure
      ''{actual_value}'' not in TVKD.'
  - id: SDCM030
    field: KNVV.KDGRP
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Customer group KNVV.KDGRP must exist in T151
    why_it_matters: The customer group is a key of pricing conditions, statistics and often revenue account determination.
      A group that is not defined in T151 matches no condition record.
    rule_authority: best_practice
    sap_impact: Group-based prices and discounts are not found; sales statistics by customer group are wrong.
    fix_map:
      __other__: Customer group '{invalid_value}' is not defined in T151. Correct it in VD02/XD02 > Sales area > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: customer group ''{actual_value}''
      not in T151.'
  - id: SDCM031
    field: KNVV.KTGRD
    check_class: null_check
    severity: medium
    dimension: completeness
    message: Account assignment group is missing in the sales area
    why_it_matters: Revenue account determination (VKOA, condition type KOFI) reads the customer's account assignment group
      from the sales area. Without it the billing document only finds a revenue account if a generic fallback entry exists;
      otherwise the document is not released to accounting.
    rule_authority: best_practice
    sap_impact: Billing documents stop with 'account determination error' (VFX3 backlog); revenue is posted late or to a generic
      account.
    fix_map:
      __blank__: Maintain the account assignment group in VD02/XD02 > Sales area > Billing documents.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: account assignment group
      is missing.'
  - id: SDCM032
    field: KNVV.KTGRD
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Customer account assignment group KNVV.KTGRD must exist in TVKT
    why_it_matters: Revenue account determination (VKOA) reads the account assignment group of the customer. A group that
      is not defined in TVKT matches no account determination record.
    rule_authority: best_practice
    sap_impact: Billing documents are not released to accounting ('account determination error').
    fix_map:
      __other__: Account assignment group '{invalid_value}' is not defined in TVKT. Correct it in VD02/XD02 > Sales area >
        Billing documents.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: account assignment group
      ''{actual_value}'' not in TVKT.'
  - id: SDCM033
    field: KNVV.VSBED
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Customer shipping conditions KNVV.VSBED must exist in TVSB
    why_it_matters: Shipping conditions drive shipping point and route determination for every order item. A condition that
      is not defined in TVSB determines neither.
    rule_authority: best_practice
    sap_impact: Order items get no shipping point or route; deliveries cannot be created.
    fix_map:
      __other__: Shipping condition '{invalid_value}' is not defined in TVSB. Correct it in VD02/XD02 > Sales area > Shipping.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: shipping condition ''{actual_value}''
      not in TVSB.'
  - id: SDCM034
    field: KNVV.ZTERM
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Sales-area payment terms KNVV.ZTERM must exist in T052
    why_it_matters: Sales-area payment terms are copied into every sales order and billing document and from there into the
      receivable. Terms that are not defined in T052 leave the invoice without a due date.
    rule_authority: best_practice
    sap_impact: Billing documents carry undefined terms; receivables fall due immediately and dunning is wrong.
    fix_map:
      __other__: Payment terms '{invalid_value}' are not defined in T052. Correct them in VD02/XD02 > Sales area > Billing
        documents.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: payment terms ''{actual_value}''
      not in T052.'
  - id: SDCM035
    field: KNVV.VERSG
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer statistics group KNVV.VERSG must exist in TVSD
    why_it_matters: The customer statistics group decides whether sales documents update the sales information system (LIS).
      A group that is not defined in TVSD is not evaluated.
    rule_authority: best_practice
    sap_impact: The customer's sales are missing from or mis-assigned in LIS/S4 sales statistics.
    fix_map:
      __other__: Statistics group '{invalid_value}' is not defined in TVSD. Correct it in VD02/XD02 > Sales area > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: statistics group ''{actual_value}''
      not in TVSD.'
  - id: SDCM036
    field: KNVV.PLTYP
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer price list type KNVV.PLTYP must exist in T189
    why_it_matters: The price list type selects price-list condition records for the customer. A type that is not defined
      in T189 matches no price list.
    rule_authority: best_practice
    sap_impact: Price-list prices are not found; orders fall back to other prices or are incomplete.
    fix_map:
      __other__: Price list type '{invalid_value}' is not defined in T189. Correct it in VD02/XD02 > Sales area > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: price list type ''{actual_value}''
      not in T189.'
  - id: SDCM037
    field: KNVV.KONDA
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer price group KNVV.KONDA must exist in T188
    why_it_matters: The price group selects group-specific discounts and surcharges for the customer. A group that is not
      defined in T188 matches no condition record.
    rule_authority: best_practice
    sap_impact: Agreed group discounts or surcharges are not applied to the customer's orders.
    fix_map:
      __other__: Price group '{invalid_value}' is not defined in T188. Correct it in VD02/XD02 > Sales area > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: price group ''{actual_value}''
      not in T188.'
  - id: SDCM038
    field: KNVV.PERFK
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer invoice dates calendar KNVV.PERFK must exist in TFACD
    why_it_matters: The invoice dates calendar schedules periodic (collective) billing for the customer. A calendar that does
      not exist yields no billing date.
    rule_authority: best_practice
    sap_impact: Deliveries are not picked up by periodic billing runs; invoices are not created on schedule.
    fix_map:
      __other__: Calendar '{invalid_value}' does not exist (TFACD). Correct the invoice dates in VD02/XD02 > Sales area >
        Billing documents.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: invoice dates calendar
      ''{actual_value}'' does not exist in TFACD.'
  - id: SDCM039
    field: KNVV.KKBER
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Sales-area credit control area KNVV.KKBER must exist in T014
    why_it_matters: A credit control area in the sales area overrides the one derived from the company code for credit checks.
      An area that is not defined in T014 has no credit limits.
    rule_authority: best_practice
    sap_impact: Sales orders in this sales area are credit-checked against nothing.
    fix_map:
      __other__: Credit control area '{invalid_value}' is not defined in T014. Correct it in VD02/XD02 > Sales area > Billing
        documents.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: credit control area ''{actual_value}''
      not in T014.'
  - id: SDCM040
    field: KNVV.VWERK
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Customer delivering plant KNVV.VWERK must be a plant assigned to sales (TVKWZ)
    why_it_matters: The delivering plant is proposed into every order item. Only plants assigned to a sales organisation and
      distribution channel (TVKWZ) can deliver.
    rule_authority: best_practice
    sap_impact: Order items get a plant that cannot deliver for the sales area; availability check and delivery fail.
    fix_map:
      __other__: Plant '{invalid_value}' is not assigned to any sales organisation/distribution channel (TVKWZ). Correct the
        delivering plant in VD02/XD02 > Sales area > Shipping.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: delivering plant ''{actual_value}''
      not allowed in TVKWZ.'
  - id: SDCM041
    field: KNVV.BZIRK
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer sales district KNVV.BZIRK must exist in T171
    why_it_matters: The sales district is a key of pricing and sales statistics. A district that is not defined in T171 matches
      no condition record or statistic.
    rule_authority: best_practice
    sap_impact: District prices are not found; sales statistics by district are wrong.
    fix_map:
      __other__: Sales district '{invalid_value}' is not defined in T171. Correct it in VD02/XD02 > Sales area > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: sales district ''{actual_value}''
      not in T171.'
  - id: SDCM042
    field: KNVV.VKBUR
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer sales office KNVV.VKBUR must exist in TVBUR
    why_it_matters: The sales office is proposed into sales documents and drives responsibility, output and statistics. An
      office that is not defined in TVBUR cannot be copied into the order.
    rule_authority: best_practice
    sap_impact: Orders are created without a valid sales office; reporting and output by office are wrong.
    fix_map:
      __other__: Sales office '{invalid_value}' is not defined in TVBUR. Correct it in VD02/XD02 > Sales area > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: sales office ''{actual_value}''
      not in TVBUR.'
  - id: SDCM043
    field: KNVV.VKGRP
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer sales group KNVV.VKGRP must exist in TVBVK
    why_it_matters: The sales group is proposed into sales documents. Only sales groups assigned to a sales office (TVBVK)
      are valid.
    rule_authority: best_practice
    sap_impact: Orders are created without a valid sales group; reporting by sales group is wrong.
    fix_map:
      __other__: Sales group '{invalid_value}' is not assigned to a sales office (TVBVK). Correct it in VD02/XD02 > Sales
        area > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: sales group ''{actual_value}''
      not in TVBVK.'
  - id: SDCM044
    field: KNVV.AUFSD
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Sales-area order block KNVV.AUFSD must exist in TVAST
    why_it_matters: A sales-area order block stops order processing by the reason defined in TVAST. A block code that is not
      defined has no rule attached, so the intended block is not applied consistently.
    rule_authority: best_practice
    sap_impact: Orders are blocked without a recognised reason, or not blocked although the business intended it.
    fix_map:
      __other__: Order block '{invalid_value}' is not defined in TVAST. Set the correct block in VD05/XD05 or clear it.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: order block ''{actual_value}''
      not in TVAST.'
  - id: SDCM045
    field: KNVV.LIFSD
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Sales-area delivery block KNVV.LIFSD must exist in TVLS
    why_it_matters: A sales-area delivery block stops deliveries by the reason defined in TVLS. A block code that is not defined
      has no rule attached, so the intended block is not applied consistently.
    rule_authority: best_practice
    sap_impact: Deliveries are blocked without a recognised reason, or not blocked although the business intended it.
    fix_map:
      __other__: Delivery block '{invalid_value}' is not defined in TVLS. Set the correct block in VD05/XD05 or clear it.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: delivery block ''{actual_value}''
      not in TVLS.'
  - id: SDCM046
    field: KNVV.FAKSD
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Sales-area billing block KNVV.FAKSD must exist in TVFS
    why_it_matters: A sales-area billing block stops billing by the reason defined in TVFS. A block code that is not defined
      has no rule attached, so the intended block is not applied consistently.
    rule_authority: best_practice
    sap_impact: Billing is blocked without a recognised reason, or not blocked although the business intended it.
    fix_map:
      __other__: Billing block '{invalid_value}' is not defined in TVFS. Set the correct block in VD05/XD05 or clear it.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: billing block ''{actual_value}''
      not in TVFS.'
  - id: SDCM047
    field: KNVV.LOEVM
    check_class: domain_value_check
    allowed_values:
    - ''
    - X
    valid_values_with_labels:
      ? ''
      : Active in this sales area
      X: Flagged for deletion in this sales area
    severity: medium
    dimension: validity
    message: Sales-area deletion flag must be X (flagged) or empty
    why_it_matters: The sales-level deletion flag stops new sales documents in the sales area and queues the data for archiving.
      SAP only recognises X.
    rule_authority: best_practice
    sap_impact: Orders may still be created in a sales area the business meant to close, or archiving skips it.
    fix_map:
      __other__: Set or remove the flag in VD06/XD06; never write other values by load.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: deletion flag ''{actual_value}''
      is invalid.'
  - id: SDCM048
    field: KNVV.KZTLF
    check_class: domain_value_check
    allowed_values:
    - ''
    - A
    - B
    - C
    - D
    valid_values_with_labels:
      ? ''
      : Partial delivery allowed
      A: Create delivery with quantity greater than zero
      B: Create only one delivery, even if quantity is zero
      C: Only complete delivery allowed
      D: No limit to subsequent deliveries
    severity: low
    dimension: validity
    message: Partial delivery control must be one of SAP's fixed values (blank, A, B, C, D)
    why_it_matters: KNVV.KZTLF is copied into every order item and controls whether and how partial deliveries are created.
      SAP only interprets its fixed values.
    rule_authority: best_practice
    sap_impact: Deliveries are split or held back contrary to the agreement with the customer.
    fix_map:
      __other__: Correct the partial delivery control in VD02/XD02 > Sales area > Shipping.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: partial delivery control
      ''{actual_value}'' is invalid.'
  - id: SDCM049
    field: KNVV.AUTLF
    check_class: domain_value_check
    allowed_values:
    - ''
    - X
    valid_values_with_labels:
      ? ''
      : Partial delivery of the order allowed
      X: Complete delivery of the order required
    severity: low
    dimension: validity
    message: Complete delivery indicator must be X or empty
    why_it_matters: KNVV.AUTLF is copied into the order header and forces the whole order to ship in one delivery. SAP only
      recognises X.
    rule_authority: best_practice
    sap_impact: Orders ship partially although the customer requires complete delivery, or wait unnecessarily.
    fix_map:
      __other__: Correct the complete delivery indicator in VD02/XD02 > Sales area > Shipping.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: complete delivery indicator
      ''{actual_value}'' is invalid.'
  - id: SDCM050
    field: KNA1.LAND1
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Customer country KNA1.LAND1 must exist in T005
    why_it_matters: The customer's country drives output tax determination, export control, route determination and the address
      on every order, delivery note and invoice. A country key that is not in T005 resolves none of them.
    rule_authority: best_practice
    sap_impact: Tax determination fails on sales orders; deliveries cannot be routed; invoices carry an invalid address.
    fix_map:
      __other__: Country '{invalid_value}' is not defined in T005. Correct the customer address in XD02/VD02 (BP address in
        S/4HANA).
    record_fix_template: 'Customer {KNA1.KUNNR}: country ''{actual_value}'' not in T005.'
  - id: SDCM051
    field: KNVP.KUNN2
    check_class: exists_check
    grain: KNVP
    target_table: KNA1
    target_fields:
    - KUNNR
    target_when:
      LOEVM:
        blank: true
    severity: high
    dimension: consistency
    message: Partner (ship-to, bill-to, payer) does not exist or is flagged for deletion
    why_it_matters: Sales documents copy the customer's partners from the sales-area partner functions; a partner that is missing
      or flagged for deletion is copied into every new order.
    rule_authority: sap_hard_constraint
    sap_impact: Orders ship to, bill or charge an account that should no longer be used; billing to a deleted payer fails.
    fix_map:
      __other__: Replace the partner in the customer's sales-area partner functions (XD02 > Partner functions).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): partner {KNVP.PARVW} {KNVP.KUNN2}
      does not exist or is deleted.'
  - id: SDCM052
    fields:
    - KNVP.KUNNR
    - KNVP.VKORG
    - KNVP.VTWEG
    - KNVP.SPART
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.PARVW: [AG]
    target_table: KNVP
    target_fields:
    - KUNNR
    - VKORG
    - VTWEG
    - SPART
    target_when:
      PARVW: [RG]
    severity: high
    dimension: completeness
    message: Sold-to party has no payer in this sales area
    why_it_matters: Sales documents copy their partners from the sold-to's sales-area partner functions. Without a payer (RG)
      the order is incomplete for billing; whoever enters it must pick a payer by hand, and the receivable can land on the
      wrong account.
    rule_authority: sap_hard_constraint
    sap_impact: The payer is on the incompletion log (V.02), and the order cannot be billed until a payer is entered. Credit
      checks run against the payer, so exposure is not checked.
    fix_map:
      __other__: Add the payer partner function to the sales area (XD02 > Sales area data > Partner functions; BP > Customer
        roles in S/4HANA).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}) is a sold-to party but has no payer
      partner.'
  - id: SDCM053
    fields:
    - KNVP.KUNNR
    - KNVP.VKORG
    - KNVP.VTWEG
    - KNVP.SPART
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.PARVW: [AG]
    target_table: KNVP
    target_fields:
    - KUNNR
    - VKORG
    - VTWEG
    - SPART
    target_when:
      PARVW: [RE]
    severity: high
    dimension: completeness
    message: Sold-to party has no bill-to party in this sales area
    why_it_matters: The bill-to party decides the invoice address and output. Without one, every order needs a bill-to entered
      by hand, or it stays incomplete for billing.
    rule_authority: sap_hard_constraint
    sap_impact: The order is on the incompletion log for billing. Invoices cannot be printed or sent until a bill-to is maintained.
    fix_map:
      __other__: Add the bill-to partner function to the sales area (XD02 > Sales area data > Partner functions).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}) is a sold-to party but has no bill-to
      partner.'
  - id: SDCM054
    field: KNVP.KUNN2
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.PARVW: [RG]
    target_table: KNB1
    target_fields:
    - KUNNR
    target_when:
      LOEVM:
        blank: true
    severity: high
    dimension: consistency
    message: Payer has no company-code data (or it is flagged for deletion)
    why_it_matters: The payer is the account that billing posts the receivable to. A payer that exists only in sales and has
      no company-code data, or only deleted company-code data, cannot carry a receivable.
    rule_authority: sap_hard_constraint
    sap_impact: The billing document is saved but not released to accounting (VFX3, "customer not created in company code").
      Revenue and the receivable are not posted.
    fix_map:
      __other__: Extend the payer to the company code of the sales organisation (XD01/XD07 > Company code data; BP role FLCU00
        in S/4HANA), or replace the payer in the partner functions.
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): payer {KNVP.KUNN2} has no active
      company-code data.'
  - id: SDCM055
    check_class: exists_check
    fields:
    - KNA1.LIFNR
    - KNA1.KUNNR
    target_table: LFA1
    target_fields:
    - LIFNR
    - KUNNR
    target_when:
      LOEVM:
        blank: true
    severity: medium
    dimension: consistency
    message: Customer is linked to a vendor that does not point back to it (or the vendor is missing or deleted)
    why_it_matters: Netting a customer against a vendor (KNB1.XVERR / LFB1.XVERR) reads both directions of the link. A link
      that is one-sided, points to a deleted vendor, or points to a vendor linked to another customer nets the wrong balances.
    rule_authority: sap_hard_constraint
    sap_impact: The payment run (F110) and dunning (F150) offset open items against the wrong account, or skip offsetting.
      In S/4HANA the CVI conversion reports an inconsistent customer-vendor link.
    fix_map:
      __other__: Make the link mutual (XD02 > Control data > Vendor and XK02 > Control data > Customer), or remove it.
    record_fix_template: 'Customer {KNA1.KUNNR} points to vendor {KNA1.LIFNR}, but that vendor does not exist, is deleted, or
      does not point back to this customer.'
  - id: SDCM057
    field: KNA1.ORT01
    check_class: cross_field_check
    fail_when: '`KNA1.ORT01`.isna() | (`KNA1.STRAS`.isna() & `KNA1.PFACH`.isna())'
    applies_when:
      KNA1.XCPDK:
        blank: true
    severity: medium
    dimension: completeness
    message: Customer address is incomplete (no city, or neither a street nor a PO box)
    why_it_matters: The address prints on delivery notes and invoices, and drives tax jurisdiction and route determination.
      Without a city, or without a street or PO box, deliveries and invoices cannot be addressed.
    rule_authority: best_practice
    sap_impact: Invoices may be rejected under e-invoicing and VAT rules. Carriers cannot deliver, and US tax jurisdiction
      (TXJCD) cannot be determined.
    fix_map:
      __other__: Complete the address (XD02 > Address).
    record_fix_template: 'Customer {KNA1.KUNNR}: address incomplete (city KNA1.ORT01, street KNA1.STRAS, PO box KNA1.PFACH).'
  - id: SDCM200
    field: KNVP.KUNNR
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.PARVW:
      - AG
    fields:
    - KNVP.KUNNR
    - KNVP.VKORG
    - KNVP.VTWEG
    - KNVP.SPART
    target_table: KNVP
    target_fields:
    - KUNNR
    - VKORG
    - VTWEG
    - SPART
    target_when:
      PARVW:
      - WE
    severity: high
    dimension: completeness
    message: Sold-to party has no ship-to partner function in the sales area
    why_it_matters: The partner determination procedure for a sold-to party requires a ship-to (WE). Without it in the sales
      area, VA01 stops at partner determination and the order cannot be saved or delivered.
    rule_authority: sap_hard_constraint
    sap_impact: Sales orders for the customer stay incomplete (no ship-to), so no delivery can be created.
    fix_map:
      __other__: Maintain partner function WE for the sales area (XD02 > Sales area data > Partner functions).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): no ship-to partner function.'
  - id: SDCM203
    field: KNVP.KUNN2
    check_class: uniqueness_check
    grain: KNVP
    applies_when:
      KNVP.PARVW:
      - AG
      - RG
    fields:
    - KNVP.KUNNR
    - KNVP.VKORG
    - KNVP.VTWEG
    - KNVP.SPART
    - KNVP.PARVW
    severity: medium
    dimension: uniqueness
    message: Customer has more than one sold-to or payer partner in the same sales area
    why_it_matters: Sold-to and payer are unique partner functions in the standard partner procedure. Several entries trigger
      a selection pop-up in VA01 and lead to orders charged to the wrong payer.
    rule_authority: best_practice
    sap_impact: Order entry stops for a manual partner choice; receivables land on the wrong payer.
    fix_map:
      __other__: Keep one sold-to and one payer per sales area (XD02 > Partner functions) and delete the extra entries.
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): partner function {KNVP.PARVW} is maintained
      more than once.'
  - id: SDCM204
    field: KNVP.KUNN2
    check_class: cross_field_check
    grain: KNVP
    applies_when:
      KNVP.PARVW:
      - AG
    fail_when: '`KNVP.KUNN2` != `KNVP.KUNNR`'
    require_populated: true
    severity: high
    dimension: consistency
    message: Sold-to partner function points to another customer
    why_it_matters: The sold-to partner of a customer is the customer itself. A sold-to entry pointing to a different account
      means the account was copied from another customer and orders entered for it are booked to someone else.
    rule_authority: sap_hard_constraint
    sap_impact: Orders, pricing and statistics are recorded against the wrong sold-to party.
    fix_map:
      __other__: Correct the sold-to partner to the customer itself (XD02 > Partner functions).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): sold-to partner is {KNVP.KUNN2}.'
  - id: SDCM205
    field: KNVP.KUNN2
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.PARVW:
      - WE
      - RE
      - RG
    fields:
    - KNVP.KUNN2
    - KNVP.VKORG
    - KNVP.VTWEG
    - KNVP.SPART
    target_table: KNVV
    target_fields:
    - KUNNR
    - VKORG
    - VTWEG
    - SPART
    target_when:
      LOEVM:
        blank: true
    severity: high
    dimension: consistency
    message: Ship-to, bill-to or payer is not extended to the sales area, or is flagged for deletion there
    why_it_matters: A partner used in a sales area must have its own sales-area data (KNVV) there. Without it SAP rejects the
      partner in the order ("not defined for sales area") and billing to a payer without sales data fails.
    rule_authority: sap_hard_constraint
    sap_impact: Order entry errors at partner determination; the payer has no billing or credit data in the sales area.
    fix_map:
      __other__: Extend the partner customer to the sales area (XD01 with reference) or replace the partner.
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): partner {KNVP.PARVW} {KNVP.KUNN2}
      has no active data in the sales area.'
  - id: SDCM206
    field: KNVV.VWERK
    check_class: null_check
    severity: low
    dimension: completeness
    message: Delivering plant is missing in the customer sales-area data
    why_it_matters: The delivering plant proposed into order items comes from the customer-material info, the customer (KNVV-VWERK)
      or the material. Without a customer default, items fall back to the material and often pick the wrong plant.
    rule_authority: best_practice
    sap_impact: Order items without plant cannot be checked for availability or delivered until a plant is entered.
    fix_map:
      __other__: Maintain the delivering plant in XD02 > Sales area data > Shipping.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): no delivering plant.'
  - id: SDCM207
    field: KNVV.LOEVM
    check_class: cross_field_check
    fail_when: (`KNVV.LOEVM` == 'X') & `KNVV.AUFSD`.isna() & `KNVV.LIFSD`.isna() & `KNVV.FAKSD`.isna()
    severity: medium
    dimension: consistency
    message: Sales area flagged for deletion is not blocked for orders, deliveries or billing
    why_it_matters: The deletion flag only marks the sales area for archiving; it does not stop new business. SAP's deletion
      check (and MDG's block-before-delete validation) expects the sales area to carry an order, delivery or billing block first,
      otherwise orders keep arriving on an account the business has retired.
    rule_authority: best_practice
    sap_impact: Orders, deliveries and invoices can still be created for a customer the business considers deleted, and archiving
      fails because new documents keep appearing.
    fix_map:
      __other__: Set a sales-area order block (VD05 or XD05) before or together with the deletion flag.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): flagged for deletion but not blocked.'
  - id: SDCM208
    field: KNVV.LOEVM
    check_class: cross_field_check
    fail_when: (`KNA1.LOEVM` == 'X') & `KNVV.LOEVM`.isna()
    grain: KNVV
    severity: medium
    dimension: consistency
    message: Customer is flagged for deletion centrally but the sales area is not
    why_it_matters: XD06 with 'all areas' sets the deletion flag in every sales area. A sales area without the flag stays selectable
      in order entry help and in SD reports that read KNVV.
    rule_authority: best_practice
    sap_impact: Orders can still be created for a retired customer; SD archiving skips the sales area.
    fix_map:
      __other__: Flag the sales area for deletion too (XD06 / VD06), or remove the central flag if set in error.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): deleted centrally but not in the sales
      area.'
  - id: SDCM209
    field: KNVV.AUFSD
    check_class: cross_field_check
    fail_when: '`KNA1.AUFSD`.notna() & `KNVV.AUFSD`.isna()'
    grain: KNVV
    severity: low
    dimension: consistency
    message: Customer has a central order block but the sales area has none
    why_it_matters: The central order block (KNA1.AUFSD) applies in every sales area. Reports, MDG and CRM replication that
      read KNVV.AUFSD still show the sales area as open, so the block is invisible to the people who work it.
    rule_authority: best_practice
    sap_impact: Sales and service users do not see the order block until a document stops on it.
    fix_map:
      __other__: Set the order block for the sales areas too (VD05 / XD05), or lift the central block if it is obsolete.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): central order block not mirrored in
      the sales area.'
  - id: SDCM210
    field: KNVV.LIFSD
    check_class: cross_field_check
    fail_when: '`KNA1.LIFSD`.notna() & `KNVV.LIFSD`.isna()'
    grain: KNVV
    severity: low
    dimension: consistency
    message: Customer has a central delivery block but the sales area has none
    why_it_matters: The central delivery block (KNA1.LIFSD) applies in every sales area. Reports, MDG and CRM replication that
      read KNVV.LIFSD still show the sales area as open, so the block is invisible to the people who work it.
    rule_authority: best_practice
    sap_impact: Sales and service users do not see the delivery block until a document stops on it.
    fix_map:
      __other__: Set the delivery block for the sales areas too (VD05 / XD05), or lift the central block if it is obsolete.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): central delivery block not mirrored
      in the sales area.'
  - id: SDCM211
    field: KNVV.FAKSD
    check_class: cross_field_check
    fail_when: '`KNA1.FAKSD`.notna() & `KNVV.FAKSD`.isna()'
    grain: KNVV
    severity: low
    dimension: consistency
    message: Customer has a central billing block but the sales area has none
    why_it_matters: The central billing block (KNA1.FAKSD) applies in every sales area. Reports, MDG and CRM replication that
      read KNVV.FAKSD still show the sales area as open, so the block is invisible to the people who work it.
    rule_authority: best_practice
    sap_impact: Sales and service users do not see the billing block until a document stops on it.
    fix_map:
      __other__: Set the billing block for the sales areas too (VD05 / XD05), or lift the central block if it is obsolete.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): central billing block not mirrored
      in the sales area.'
  - id: SDCM212
    field: KNVV.AUFSD
    check_class: cross_field_check
    fail_when: (`KNA1.SPERR` == 'X') & `KNVV.AUFSD`.isna() & `KNVV.LOEVM`.isna()
    grain: KNVV
    severity: medium
    dimension: consistency
    message: Customer is blocked for posting centrally but the sales area accepts orders
    why_it_matters: A central posting block (KNA1.SPERR) stops all FI postings. Orders and deliveries in an open sales area
      still go through, and only the billing document fails when it is released to accounting.
    rule_authority: best_practice
    sap_impact: 'Goods are shipped and then cannot be invoiced: billing documents stay in VFX3 with ''account blocked for posting''.'
    fix_map:
      __other__: Set an order block in the sales areas (VD05) or lift the posting block if the customer is active.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): blocked for posting but open for orders.'
  - id: SDCM213
    field: KNVV.ZTERM
    check_class: exists_check
    fields:
    - KNVV.KUNNR
    - KNVV.ZTERM
    target_table: KNB1
    target_fields:
    - KUNNR
    - ZTERM
    grain: KNVV
    severity: low
    dimension: consistency
    message: Sales payment terms are not used in any company code of the customer
    why_it_matters: Orders take the payment terms from the sales area (KNVV.ZTERM); manual FI invoices take them from the company
      code (KNB1.ZTERM). Terms that differ everywhere mean the customer pays SD invoices on other terms than were agreed in
      finance.
    rule_authority: best_practice
    sap_impact: Due dates, cash discount and dunning differ between SD and FI invoices for one customer.
    fix_map:
      __other__: Align the payment terms in the sales area (VD02) and the company code (FD02) with the contract.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): payment terms {KNVV.ZTERM} differ
      from every company code.'
  - id: SDCM214
    field: KNVV.WAERS
    check_class: referential_check
    severity: high
    dimension: validity
    message: Customer currency KNVV.WAERS must exist in TCURC
    why_it_matters: The sales area currency is the document currency of orders and the currency of pricing. A code not defined
      in TCURC (ISO 4217) cannot be used in any document.
    rule_authority: iso_standard
    sap_impact: VA01 rejects the currency; pricing and billing cannot run.
    fix_map:
      __other__: Choose a defined currency in VD02 > Sales; define new ISO codes in OY03.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): currency is not defined in TCURC.'
  - id: SDCM215
    field: KNVV.KURST
    check_class: referential_check
    severity: low
    dimension: validity
    message: Exchange rate type KNVV.KURST must exist in TCURV
    why_it_matters: The exchange rate type translates document currency to local currency in orders and billing. A type not
      defined in TCURV makes the translation fail.
    rule_authority: sap_hard_constraint
    sap_impact: Orders in foreign currency stop with an exchange rate error.
    fix_map:
      __other__: Choose a defined exchange rate type (VD02 > Sales; customising OB07).
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): exchange rate type not defined in
      TCURV.'
  - id: SDCM216
    field: KNVV.KVGR1
    check_class: referential_check
    severity: low
    dimension: validity
    message: Customer group 1 KNVV.KVGR1 must exist in TVV1
    why_it_matters: Customer group 1 is a free classification used in pricing, statistics (LIS/BW) and output. A value not defined
      in TVV1 is ignored by every selection and condition table keyed on it.
    rule_authority: best_practice
    sap_impact: Prices and statistics keyed on customer group 1 miss the customer.
    fix_map:
      __other__: 'Choose a defined customer group 1 (VD02 > Additional data; customising: Sales and Distribution > Master Data
        > Business Partners > Customers > Additional data).'
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): customer group 1 not defined in TVV1.'
  - id: SDCM217
    field: KNVV.KVGR2
    check_class: referential_check
    severity: low
    dimension: validity
    message: Customer group 2 KNVV.KVGR2 must exist in TVV2
    why_it_matters: Customer group 2 is a free classification used in pricing, statistics (LIS/BW) and output. A value not defined
      in TVV2 is ignored by every selection and condition table keyed on it.
    rule_authority: best_practice
    sap_impact: Prices and statistics keyed on customer group 2 miss the customer.
    fix_map:
      __other__: 'Choose a defined customer group 2 (VD02 > Additional data; customising: Sales and Distribution > Master Data
        > Business Partners > Customers > Additional data).'
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): customer group 2 not defined in TVV2.'
  - id: SDCM218
    field: KNVV.KVGR3
    check_class: referential_check
    severity: low
    dimension: validity
    message: Customer group 3 KNVV.KVGR3 must exist in TVV3
    why_it_matters: Customer group 3 is a free classification used in pricing, statistics (LIS/BW) and output. A value not defined
      in TVV3 is ignored by every selection and condition table keyed on it.
    rule_authority: best_practice
    sap_impact: Prices and statistics keyed on customer group 3 miss the customer.
    fix_map:
      __other__: 'Choose a defined customer group 3 (VD02 > Additional data; customising: Sales and Distribution > Master Data
        > Business Partners > Customers > Additional data).'
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): customer group 3 not defined in TVV3.'
  - id: SDCM219
    field: KNVV.KVGR4
    check_class: referential_check
    severity: low
    dimension: validity
    message: Customer group 4 KNVV.KVGR4 must exist in TVV4
    why_it_matters: Customer group 4 is a free classification used in pricing, statistics (LIS/BW) and output. A value not defined
      in TVV4 is ignored by every selection and condition table keyed on it.
    rule_authority: best_practice
    sap_impact: Prices and statistics keyed on customer group 4 miss the customer.
    fix_map:
      __other__: 'Choose a defined customer group 4 (VD02 > Additional data; customising: Sales and Distribution > Master Data
        > Business Partners > Customers > Additional data).'
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): customer group 4 not defined in TVV4.'
  - id: SDCM220
    field: KNVV.KVGR5
    check_class: referential_check
    severity: low
    dimension: validity
    message: Customer group 5 KNVV.KVGR5 must exist in TVV5
    why_it_matters: Customer group 5 is a free classification used in pricing, statistics (LIS/BW) and output. A value not defined
      in TVV5 is ignored by every selection and condition table keyed on it.
    rule_authority: best_practice
    sap_impact: Prices and statistics keyed on customer group 5 miss the customer.
    fix_map:
      __other__: 'Choose a defined customer group 5 (VD02 > Additional data; customising: Sales and Distribution > Master Data
        > Business Partners > Customers > Additional data).'
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): customer group 5 not defined in TVV5.'
  - id: SDCM221
    field: KNVV.UEBTK
    check_class: cross_field_check
    fail_when: (`KNVV.UEBTK` == 'X') & (`KNVV.UEBTO` > 0)
    severity: low
    dimension: consistency
    message: Unlimited overdelivery is allowed and an overdelivery tolerance is also set
    why_it_matters: With unlimited overdelivery (KNVV.UEBTK) the tolerance (KNVV.UEBTO) is ignored. Both together means the
      intended limit is not enforced on deliveries.
    rule_authority: best_practice
    sap_impact: Deliveries exceed the order quantity without the tolerance warning the business expects.
    fix_map:
      __other__: Remove the unlimited flag or the tolerance in VD02 > Shipping, whichever does not reflect the agreement.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): unlimited overdelivery with a tolerance.'
  - id: SDCM222
    field: KNVV.KKBER
    check_class: exists_check
    fields:
    - KNVV.KUNNR
    - KNVV.KKBER
    target_table: KNKK
    target_fields:
    - KUNNR
    - KKBER
    grain: KNVV
    severity: medium
    dimension: consistency
    message: Sales area credit control area has no credit master for the customer
    why_it_matters: When KNVV.KKBER is set, orders in the sales area are checked in that credit control area. Without a KNKK
      record there the customer has no limit, so automatic credit control either blocks every order or uses the risk category
      default.
    rule_authority: sap_hard_constraint
    sap_impact: Orders are blocked for credit (VKM1) or pass without a real credit check.
    fix_map:
      __other__: Create the credit master for the credit control area (FD32), or remove the sales area override.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): no credit master in credit control
      area {KNVV.KKBER}.'
  - id: SDCM223
    field: KNVV.KUNNR
    check_class: exists_check
    fields:
    - KNVV.KUNNR
    target_table: KNVI
    target_fields:
    - KUNNR
    grain: KNVV
    severity: high
    dimension: completeness
    message: Customer with sales data has no tax classification for any country
    why_it_matters: Output tax in SD is found from the customer's tax classification (KNVI.TAXKD) per departure country and
      tax category. A customer with sales areas but no KNVI row gets no tax condition on orders and invoices.
    rule_authority: regulatory
    sap_impact: Invoices are issued without VAT or sales tax, or billing stops with a missing tax condition.
    fix_map:
      __other__: Maintain the tax classification for each departure country in XD02 > Sales area > Billing documents.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): no tax classification.'
  - id: SDCM224
    field: KNVI.TAXKD
    check_class: null_check
    grain: KNVI
    severity: medium
    dimension: completeness
    message: Tax classification row has no tax classification value
    why_it_matters: 'A KNVI row for a country and tax category without a classification is treated like a missing row: the tax
      condition record cannot be found for the customer.'
    rule_authority: regulatory
    sap_impact: Orders and invoices for the country are created without tax or stop in pricing.
    fix_map:
      __other__: Enter the tax classification in XD02 > Sales area > Billing documents > Taxes.
    record_fix_template: 'Customer {KNVI.KUNNR}: country {KNVI.ALAND}, tax category {KNVI.TATYP} has no tax classification.'
  - id: SDCM225
    field: KNVI.TAXKD
    check_class: referential_check
    severity: medium
    dimension: validity
    message: Customer tax classification KNVI.TAXKD must exist in TSKD
    why_it_matters: The classification must be defined for the tax category (TSKD); otherwise the tax condition records keyed
      on it are never found.
    rule_authority: sap_hard_constraint
    sap_impact: Pricing finds no tax condition; invoices carry no or wrong tax.
    fix_map:
      __other__: Choose a classification defined for the tax category (customising OVK3).
    record_fix_template: 'Customer {KNVI.KUNNR}: tax classification for country {KNVI.ALAND}, category {KNVI.TATYP} is not in
      TSKD.'
  - id: SDCM226
    field: KNVI.TATYP
    check_class: referential_check
    severity: low
    dimension: validity
    message: Tax category KNVI.TATYP must exist as a condition type in T685A
    why_it_matters: The tax category is a pricing condition type (MWST, UTXJ...). A category that is not a condition type is
      never read by pricing, so the classification next to it has no effect.
    rule_authority: sap_hard_constraint
    sap_impact: Tax is not determined for the category the customer was classified under.
    fix_map:
      __other__: Use the tax categories assigned to the country (customising OVK1) and remove the others.
    record_fix_template: 'Customer {KNVI.KUNNR}: tax category {KNVI.TATYP} for country {KNVI.ALAND} is not a condition type.'
  - id: SDCM227
    field: KNVP.PARVW
    check_class: referential_check
    severity: medium
    dimension: validity
    message: Partner function KNVP.PARVW must exist in TPAR
    why_it_matters: The partner function decides how the partner is copied into documents. A function not defined in TPAR is
      never determined.
    rule_authority: sap_hard_constraint
    sap_impact: The partner is not copied into orders, deliveries or invoices.
    fix_map:
      __other__: Replace the function with a defined one (customising VOPA).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): partner function {KNVP.PARVW} is not
      in TPAR.'
  - id: SDCM228
    field: KNVP.KUNN2
    check_class: exists_check
    grain: KNVP
    target_table: KNA1
    target_fields:
    - KUNNR
    target_when:
      AUFSD:
        populated: true
    negate: true
    severity: medium
    dimension: consistency
    message: Partner customer is blocked for orders centrally
    why_it_matters: Partner functions are copied into every new order. A ship-to, bill-to or payer with a central order block
      stops order entry for the sold-to as well.
    rule_authority: sap_hard_constraint
    sap_impact: Order entry stops with 'partner is blocked' for every order of the sold-to.
    fix_map:
      __other__: Replace the blocked partner in XD02 > Partner functions, or lift the block if it is obsolete.
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): partner {KNVP.PARVW} {KNVP.KUNN2}
      is blocked for orders.'
  - id: SDCM229
    field: KNVP.KUNN2
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.PARVW:
      - RG
    target_table: KNA1
    target_fields:
    - KUNNR
    target_when:
      SPERR:
        populated: true
    negate: true
    severity: high
    dimension: consistency
    message: Payer is blocked for posting centrally
    why_it_matters: The payer receives the receivable when an invoice is released to accounting. A payer blocked for posting
      makes every invoice for the sold-to fail in accounting.
    rule_authority: sap_hard_constraint
    sap_impact: Billing documents stay in VFX3 with 'account blocked for posting'; revenue is not posted.
    fix_map:
      __other__: Replace the payer in XD02 > Partner functions or lift the posting block (XD05).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): payer {KNVP.KUNN2} is blocked for
      posting.'
  - id: SDCM230
    field: KNVP.PARNR
    check_class: exists_check
    grain: KNVP
    target_table: KNVK
    target_fields:
    - PARNR
    target_when:
      LOEVM:
        blank: true
    severity: medium
    dimension: consistency
    message: Contact person in the partner functions does not exist or is flagged for deletion
    why_it_matters: A contact person partner (AP) refers to a KNVK record. If that record is missing or deleted, output and
      CRM replication address documents to nobody.
    rule_authority: sap_hard_constraint
    sap_impact: Order confirmations and invoices addressed to the contact cannot be sent.
    fix_map:
      __other__: Replace the contact person in XD02 > Partner functions or re-create the contact (XD02 > Contact persons).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): contact person {KNVP.PARNR} does not
      exist or is deleted.'
  - id: SDCM231
    field: KNVP.LIFNR
    check_class: exists_check
    grain: KNVP
    target_table: LFA1
    target_fields:
    - LIFNR
    target_when:
      LOEVM:
        blank: true
    severity: medium
    dimension: consistency
    message: Vendor partner (forwarding agent) does not exist or is flagged for deletion
    why_it_matters: Partner functions such as forwarding agent (SP) point to a vendor. A missing or deleted vendor is copied
      into deliveries and shipments, where freight cost settlement fails.
    rule_authority: sap_hard_constraint
    sap_impact: Shipment cost documents (VI01) cannot be settled to the carrier.
    fix_map:
      __other__: Replace the vendor in XD02 > Partner functions or reactivate the vendor.
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): vendor partner {KNVP.LIFNR} does not
      exist or is deleted.'
  - id: SDCM232
    field: KNVP.PARVW
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.KUNN2:
        blank: true
    target_table: TPAR
    target_fields:
    - PARVW
    target_when:
      NRART:
      - KU
    negate: true
    severity: high
    dimension: completeness
    message: Customer-type partner function has no partner customer
    why_it_matters: 'Partner functions of type customer (TPAR.NRART = KU: sold-to, ship-to, bill-to, payer and their custom
      copies) must name a customer in KNVP.KUNN2. An empty partner is copied into documents as a gap.'
    rule_authority: sap_hard_constraint
    sap_impact: Partner determination in VA01 fails or leaves the function empty; delivery or billing cannot be created.
    fix_map:
      __other__: Enter the partner customer in XD02 > Partner functions or delete the empty line.
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): partner function {KNVP.PARVW} has
      no customer.'
  - id: SDCM233
    field: KNVV.KUNNR
    check_class: exists_check
    fields:
    - KNVV.KUNNR
    - KNVV.VKORG
    - KNVV.VTWEG
    - KNVV.SPART
    target_table: KNVP
    target_fields:
    - KUNNR
    - VKORG
    - VTWEG
    - SPART
    target_when:
      PARVW:
      - AG
    grain: KNVV
    applies_when:
      KNVV.LOEVM:
        blank: true
    severity: critical
    dimension: completeness
    message: Sales area has no sold-to party partner function
    why_it_matters: Every sales area of a customer that buys needs the sold-to (AG) partner function; SAP creates it with the
      sales area. Without it the customer cannot be entered as sold-to in that sales area.
    rule_authority: sap_hard_constraint
    sap_impact: VA01 rejects the customer in the sales area; partner determination has nothing to copy.
    fix_map:
      __other__: Add the sold-to function (normally the customer itself) in XD02 > Partner functions.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): no sold-to partner function.'
  - id: SDCM234
    field: KNVK.KUNNR
    check_class: exists_check
    grain: KNVK
    target_table: KNA1
    target_fields:
    - KUNNR
    severity: medium
    dimension: consistency
    message: Contact person belongs to a customer that does not exist
    why_it_matters: 'KNVK rows hang off the customer number. A contact person whose customer is missing is an orphan: it appears
      in contact searches and CVI conversion but no transaction can maintain it.'
    rule_authority: sap_hard_constraint
    sap_impact: CVI conversion of contact persons (CVI_CUST_CT_LINK) fails; orphan personal data is kept without a purpose.
    fix_map:
      __other__: Delete the orphan contact (report or table maintenance after approval) or re-create the customer link.
    record_fix_template: 'Contact person {KNVK.PARNR}: customer {KNVK.KUNNR} does not exist.'
  - id: SDCM235
    field: KNVK.ABTNR
    check_class: referential_check
    severity: low
    dimension: validity
    message: Contact person department KNVK.ABTNR must exist in TSAB
    why_it_matters: The contact person department is used to select contacts for output, marketing and CRM replication. A value
      not defined in TSAB is dropped by every selection on it.
    rule_authority: best_practice
    sap_impact: The contact is missed by selections and output by department.
    fix_map:
      __other__: Choose a defined value in XD02 > Contact persons (customising OVPA).
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR}: department is not defined in TSAB.'
  - id: SDCM236
    field: KNVK.PAFKT
    check_class: referential_check
    severity: low
    dimension: validity
    message: Contact person function KNVK.PAFKT must exist in TPFK
    why_it_matters: The contact person function is used to select contacts for output, marketing and CRM replication. A value
      not defined in TPFK is dropped by every selection on it.
    rule_authority: best_practice
    sap_impact: The contact is missed by selections and output by function.
    fix_map:
      __other__: Choose a defined value in XD02 > Contact persons (customising OVPA).
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR}: function is not defined in TPFK.'
  - id: SDCM237
    field: KNVK.PARVO
    check_class: referential_check
    severity: low
    dimension: validity
    message: Contact person VIP indicator KNVK.PARVO must exist in TVPV
    why_it_matters: The contact person VIP indicator is used to select contacts for output, marketing and CRM replication. A
      value not defined in TVPV is dropped by every selection on it.
    rule_authority: best_practice
    sap_impact: The contact is missed by selections and output by VIP indicator.
    fix_map:
      __other__: Choose a defined value in XD02 > Contact persons (customising OVPV).
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR}: VIP indicator is not defined in TVPV.'
  - id: SDCM238
    field: KNVK.PARLA
    check_class: referential_check
    severity: low
    dimension: validity
    message: Contact person language KNVK.PARLA must exist in T002
    why_it_matters: The contact person language is used to select contacts for output, marketing and CRM replication. A value
      not defined in T002 is dropped by every selection on it.
    rule_authority: best_practice
    sap_impact: The contact is missed by selections and output by language.
    fix_map:
      __other__: Choose a defined value in XD02 > Contact persons (customising SPRAS).
    record_fix_template: 'Contact person {KNVK.PARNR} of customer {KNVK.KUNNR}: language is not defined in T002.'
  - id: SDCM239
    field: KNVK.LOEVM
    check_class: cross_field_check
    fail_when: (`KNA1.LOEVM` == 'X') & `KNVK.LOEVM`.isna()
    grain: KNVK
    severity: low
    dimension: consistency
    message: Contact person is active on a customer flagged for deletion
    why_it_matters: When a customer is retired its contact persons should be retired too. Active contacts on a deleted customer
      keep personal data without a business purpose and are still replicated.
    rule_authority: regulatory
    sap_impact: Personal data is retained beyond its purpose (GDPR / POPIA); contacts still receive output.
    fix_map:
      __other__: Flag the contact persons for deletion with the customer and plan their archiving or ILM blocking.
    record_fix_template: 'Contact person {KNVK.PARNR}: customer {KNVK.KUNNR} is flagged for deletion, the contact is not.'
  - id: SDCM240
    field: KNVA.KUNNR
    check_class: exists_check
    grain: KNVA
    target_table: KNA1
    target_fields:
    - KUNNR
    severity: low
    dimension: consistency
    message: Unloading point belongs to a customer that does not exist
    why_it_matters: Unloading points (KNVA) hang off the customer number. An orphan row is never offered in deliveries and shows
      a load or deletion that went wrong.
    rule_authority: sap_hard_constraint
    sap_impact: None in documents; the orphan rows blur migration reconciliations.
    fix_map:
      __other__: Delete the orphan unloading point or re-create the customer link.
    record_fix_template: 'Unloading point of customer {KNVA.KUNNR}: the customer does not exist.'
  - id: SDCM241
    field: KNVA.KNFAK
    check_class: referential_check
    severity: medium
    dimension: validity
    message: Unloading point calendar KNVA.KNFAK must exist in TFACD
    why_it_matters: The customer calendar of the unloading point moves delivery dates to the customer's working days in scheduling.
      A calendar not defined in TFACD makes delivery scheduling fail.
    rule_authority: sap_hard_constraint
    sap_impact: Delivery dates are scheduled on days the customer does not receive goods, or scheduling errors.
    fix_map:
      __other__: Choose a defined factory calendar for the unloading point (XD02 > Unloading points; customising SCAL).
    record_fix_template: 'Customer {KNVA.KUNNR}: unloading point calendar is not defined in TFACD.'
  - id: SDCM242
    field: KNVA.WANID
    check_class: referential_check
    severity: low
    dimension: validity
    message: Goods receiving hours KNVA.WANID must exist in TVWA
    why_it_matters: Goods receiving hours restrict delivery scheduling to the customer's receiving times. An ID not defined
      in TVWA is ignored.
    rule_authority: best_practice
    sap_impact: Deliveries are planned outside the customer's receiving hours.
    fix_map:
      __other__: Choose defined goods receiving hours (XD02 > Unloading points; customising OVL4).
    record_fix_template: 'Customer {KNVA.KUNNR}: goods receiving hours ID is not defined in TVWA.'
  - id: SDCM243
    field: KNVV.KKBER
    check_class: exists_check
    target_table: UKM_KKBER2SGM
    target_fields:
    - KKBER
    grain: KNVV
    s4_area: credit_management
    s4_impact: blocking
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: high
    dimension: consistency
    message: Sales area credit control area has no credit segment assigned in SAP Credit Management
    why_it_matters: The credit control area of the sales area decides which credit segment the sales documents check against.
      Without a segment assignment the check has no target after the conversion.
    rule_authority: s4hana_migration
    sap_impact: Sales orders for the customer fail or skip the credit check after the conversion.
    fix_map:
      __other__: Assign the credit control area to a credit segment (SPRO > Credit Management) or correct the sales area data
        (XD02 > Sales).
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: credit control area {KNVV.KKBER}
      has no credit segment.'
  - id: SDCM244
    field: KNVD.KUNNR
    check_class: exists_check
    target_table: KNA1
    target_fields:
    - KUNNR
    grain: KNVD
    s4_area: output_management
    s4_impact: warning
    simplification_item: Output Management - NAST output control replaced by S/4HANA Output Management
    baseline: s4_target
    severity: medium
    dimension: consistency
    message: Customer output master data belongs to a customer that does not exist
    why_it_matters: Document output settings (KNVD) are keyed by customer. Rows for a customer that is gone are never read and
      are not migrated to the output management of the business partner.
    rule_authority: s4hana_migration
    sap_impact: Orphan output settings stay behind and confuse the output migration.
    fix_map:
      __other__: Delete the orphan rows or recreate the customer.
    record_fix_template: 'Customer {KNVD.KUNNR}: output master row for a customer that does not exist.'
  - id: SDCM245
    field: KNVD.KUNNR
    check_class: exists_check
    fields:
    - KNVD.KUNNR
    - KNVD.VKORG
    - KNVD.VTWEG
    - KNVD.SPART
    target_table: KNVV
    target_fields:
    - KUNNR
    - VKORG
    - VTWEG
    - SPART
    grain: KNVD
    s4_area: output_management
    s4_impact: warning
    simplification_item: Output Management - NAST output control replaced by S/4HANA Output Management
    baseline: s4_target
    severity: medium
    dimension: consistency
    message: Customer output master data has no matching sales area
    why_it_matters: Customer output settings are valid for one sales area. Without a customer sales area record they never apply.
    rule_authority: s4hana_migration
    sap_impact: Output settings are not used and are not migrated.
    fix_map:
      __other__: Create the sales area data (XD01 > Sales) or delete the output settings.
    record_fix_template: 'Customer {KNVD.KUNNR}, sales area {KNVD.VKORG}/{KNVD.VTWEG}/{KNVD.SPART}: no sales area data.'
  - id: SDCM246
    field: KNVD.KUNNR
    check_class: exists_check
    target_table: KNA1
    target_fields:
    - KUNNR
    target_when:
      LOEVM: X
    negate: true
    grain: KNVD
    s4_area: output_management
    s4_impact: warning
    simplification_item: Output Management - NAST output control replaced by S/4HANA Output Management
    baseline: s4_target
    severity: medium
    dimension: consistency
    message: Customer output master data belongs to a customer flagged for deletion
    why_it_matters: Output settings of a customer flagged for deletion are dead weight; the output migration should not carry
      them to the new output management.
    rule_authority: s4hana_migration
    sap_impact: Settings of dead customers are migrated.
    fix_map:
      __other__: Delete the output settings or remove the deletion flag of the customer.
    record_fix_template: 'Customer {KNVD.KUNNR}: output master data for a customer flagged for deletion.'
  - id: SDCM247
    field: KNVD.NACHA
    check_class: cross_field_check
    fail_when: '`KNVD.NACHA` == ''4'''
    grain: KNVD
    s4_area: output_management
    s4_impact: warning
    simplification_item: Output Management - NAST output control replaced by S/4HANA Output Management
    baseline: s4_target
    severity: medium
    dimension: validity
    message: Customer output master data uses telex
    why_it_matters: Telex is not a channel of S/4HANA Output Management (print, e-mail and XML only).
    rule_authority: s4hana_migration
    sap_impact: Output to this customer has no channel after the conversion.
    fix_map:
      __other__: Change the transmission medium to e-mail or print (XD02 > Sales > Output).
    record_fix_template: 'Customer {KNVD.KUNNR}, sales area {KNVD.VKORG}: output via telex.'
  - id: SDCM248
    field: KNVD.NACHA
    check_class: cross_field_check
    fail_when: '`KNVD.NACHA` == ''2'''
    grain: KNVD
    s4_area: output_management
    s4_impact: warning
    simplification_item: Output Management - NAST output control replaced by S/4HANA Output Management
    baseline: s4_target
    severity: low
    dimension: validity
    message: Customer output master data uses fax
    why_it_matters: Fax is not a channel of S/4HANA Output Management; fax output needs a third party fax server through print
      or e-mail.
    rule_authority: s4hana_migration
    sap_impact: Output to this customer has no standard channel after the conversion.
    fix_map:
      __other__: Change the transmission medium to e-mail or print, or plan the fax gateway (XD02 > Sales > Output).
    record_fix_template: 'Customer {KNVD.KUNNR}, sales area {KNVD.VKORG}: output via fax.'
  - id: SDCM249
    field: KNVD.NACHA
    check_class: null_check
    applies_when:
      KNVD.DOANZ:
        gt: 0
    grain: KNVD
    s4_area: output_management
    s4_impact: warning
    simplification_item: Output Management - NAST output control replaced by S/4HANA Output Management
    baseline: s4_target
    severity: medium
    dimension: completeness
    message: Customer output master data asks for copies but names no transmission medium
    why_it_matters: An output quantity above zero without a transmission medium produces no output and cannot be mapped to an
      output channel.
    rule_authority: s4hana_migration
    sap_impact: The customer never receives the document.
    fix_map:
      __other__: Enter the transmission medium (XD02 > Sales > Output) or reset the number of copies.
    record_fix_template: 'Customer {KNVD.KUNNR}, sales area {KNVD.VKORG}: copies requested, no transmission medium.'
  - id: SDCM099
    field: KNVV.WAERS
    check_class: exists_check
    fields:
    - KNVV.WAERS
    target_table: TCURC
    target_fields:
    - WAERS
    severity: high
    dimension: accuracy
    message: Sales-area currency of the customer is not a defined currency
    why_it_matters: KNVV.WAERS is the currency the sales area prices and invoices the customer in. A code
      with no TCURC entry has no decimal places, no exchange rate and no rounding rules, so the sales
      order, the pricing procedure and the invoice all fail or post amounts the size of the smallest
      difference between two defined currencies.
    rule_authority: sap_hard_constraint
    sap_impact: Sales orders and billing documents for the customer cannot be priced or posted.
    fix_map:
      __other__: Correct the currency in VD02/XK02 (sales area data) to a currency defined in SPRO >
        SAP NetWeaver > General Settings > Currencies, or create the missing currency.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}:
      currency {KNVV.WAERS} is not defined.'
  - id: SDCM100
    field: KNVV.ERDAT
    check_class: cross_field_check
    fail_when: '`KNVV.ERDAT`.notna() & (`KNVV.ERDAT`.astype(''string'').str.strip() != '''') & (`KNVV.ERDAT` > @today)'
    severity: high
    dimension: timeliness
    message: Customer sales-area record was created in the future
    why_it_matters: ERDAT is the date the sales-area record was created. A date after the day the check runs
      means the record carries a timestamp from a different clock, or was written by an interface that
      misread the date, so every age and last-changed figure derived from it is wrong.
    rule_authority: sap_hard_constraint
    sap_impact: The record's creation date cannot be trusted, so staleness and change reporting on the
      customer sales area is wrong for this record.
    fix_map:
      __other__: Correct the creation date in the source system or interface and re-extract. A creation
        date cannot be later than the day it is read.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}:
      creation date {actual_value} is in the future.'
  - id: SDCM700
    field: KNVV.VKORG
    check_class: exists_check
    grain: KNVV
    fields:
    - KNVV.VKORG
    - KNVV.VTWEG
    - KNVV.SPART
    target_table: TVTA
    target_fields:
    - VKORG
    - VTWEG
    - SPART
    s4_area: organisational
    s4_impact: blocking
    simplification_item: Organisational data
    baseline: s4_target
    severity: high
    dimension: consistency
    message: Customer sales area is not a defined sales area (TVTA)
    why_it_matters: 'A sales area is the combination of sales organisation, distribution channel and division maintained in
      TVTA. Each of the three codes can exist on its own while the combination was never defined, or was removed from the
      enterprise structure. Sales data kept for such a combination can never be used: VA01 only accepts sales areas that exist
      in TVTA, and the S/4HANA Business Partner sales-area role cannot be created for it.'
    rule_authority: sap_hard_constraint
    sap_impact: Sales documents cannot be created for the customer in this sales area; CVI rejects the sales data during BP
      conversion.
    fix_map:
      __other__: Either define the sales area in SPRO > Enterprise Structure > Assignment > Sales and Distribution > Set up
        sales area, or flag the customer sales data for deletion (VD06) if the combination is not used.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: the sales area is not defined
      in TVTA.'
  - id: SDCM701
    field: KNVV.VTWEG
    check_class: exists_check
    grain: KNVV
    fields:
    - KNVV.VKORG
    - KNVV.VTWEG
    - KNVV.SPART
    target_table: TVTA
    target_fields:
    - VKORG
    - VTWKU
    - SPAKU
    severity: medium
    dimension: consistency
    message: Customer sales data is maintained in a sales area that refers to another sales area for master data
    why_it_matters: 'TVTA.VTWKU and TVTA.SPAKU name the reference distribution channel and reference division whose customer
      master data a sales area uses. When a sales area points to a different reference, SAP reads the customer data of the
      reference area and ignores the data maintained directly in this one. Data stored here is dead: it is never used, it
      drifts from the data that is used, and it doubles the volume to convert to the Business Partner.'
    rule_authority: sap_hard_constraint
    sap_impact: Pricing, shipping and billing use the reference sales area data, not the values stored in this sales area.
    fix_map:
      __other__: Maintain the customer only in the reference sales area (TVTA.VTWKU / SPAKU) and flag the sales data in this
        non-reference area for deletion, or remove the reference in SPRO if this area should hold its own data.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: this sales area takes customer
      master data from another reference sales area.'
  - id: SDCM702
    field: KNVV.VWERK
    check_class: exists_check
    grain: KNVV
    applies_when:
      KNVV.VWERK:
        populated: true
    fields:
    - KNVV.VWERK
    - KNVV.VKORG
    - KNVV.VTWEG
    target_table: TVKWZ
    target_fields:
    - WERKS
    - VKORG
    - VTWEG
    severity: medium
    dimension: consistency
    message: Delivering plant of the customer is not assigned to the sales organisation and distribution channel (TVKWZ)
    why_it_matters: Plants are assigned to the combination of sales organisation and distribution channel in TVKWZ. The delivering
      plant proposed from KNVV.VWERK is only valid in a sales order if that assignment exists. A plant that exists in T001W
      but is not assigned to the sales organisation is proposed into every order and then rejected, so the order item has
      no plant and no availability check.
    rule_authority: sap_hard_constraint
    sap_impact: 'Sales order items get an invalid delivering plant: no availability check, no delivery, no shipping point.'
    fix_map:
      __other__: Change the delivering plant in VD02 to a plant assigned to the sales organisation and distribution channel,
        or add the assignment in SPRO > Enterprise Structure > Assignment > Sales and Distribution > Assign sales organisation
        - distribution channel - plant.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: delivering plant {KNVV.VWERK}
      is not assigned to sales organisation and distribution channel.'
  - id: SDCM703
    field: KNVV.VKGRP
    check_class: exists_check
    grain: KNVV
    applies_when:
      KNVV.VKGRP:
        populated: true
      KNVV.VKBUR:
        populated: true
    fields:
    - KNVV.VKBUR
    - KNVV.VKGRP
    target_table: TVBVK
    target_fields:
    - VKBUR
    - VKGRP
    severity: medium
    dimension: consistency
    message: Sales group of the customer is not assigned to its sales office (TVBVK)
    why_it_matters: Sales groups are assigned to sales offices in TVBVK. KNVV.VKBUR and KNVV.VKGRP are copied into every sales
      document as the responsible office and group. A group that does not belong to the office splits sales statistics and
      commission reports between two organisational lines and is rejected when the document is checked against the enterprise
      structure.
    rule_authority: sap_hard_constraint
    sap_impact: Sales documents carry an office and group that do not belong together; sales reporting by office is wrong.
    fix_map:
      __other__: Correct the sales group or sales office in VD02 so the pair exists in SPRO > Enterprise Structure > Assignment
        > Sales and Distribution > Assign sales group to sales office.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: sales group {KNVV.VKGRP}
      is not assigned to sales office {KNVV.VKBUR}.'
  - id: SDCM704
    field: KNVV.VKBUR
    check_class: null_check
    grain: KNVV
    applies_when:
      KNVV.VKGRP:
        populated: true
    severity: low
    dimension: completeness
    message: Customer sales area has a sales group but no sales office
    why_it_matters: 'A sales group is an organisational unit below a sales office: SAP assigns groups to offices (TVBVK),
      not to sales areas. A sales group without its sales office cannot be validated, and sales documents created from this
      record carry a group with no office, which breaks every report and authorisation that is organised by sales office.'
    rule_authority: best_practice
    sap_impact: Sales documents carry a sales group without its sales office; office-based reporting and authorisation miss
      them.
    fix_map:
      __other__: Enter the sales office to which the sales group belongs in VD02 (Sales tab).
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: sales group {KNVV.VKGRP}
      is maintained without a sales office.'
  - id: SDCM705
    field: KNVV.KUNNR
    check_class: exists_check
    grain: KNVV
    target_table: KNA1
    target_fields:
    - KUNNR
    s4_area: business_partner
    s4_impact: blocking
    simplification_item: Business Partner Approach (SAP Note 2265093)
    baseline: s4_target
    severity: high
    dimension: consistency
    message: Customer sales area data exists without a general customer record (KNA1)
    why_it_matters: 'KNVV is a dependent table of KNA1: sales area data can only be created for a customer number that exists
      in the general data. A KNVV row without a KNA1 parent is an orphan left by a deletion, a client copy or a direct table
      load. No transaction can display or maintain it and CVI has no customer to convert it with.'
    rule_authority: sap_hard_constraint
    sap_impact: Orphan sales data cannot be maintained in VD02 and is dropped or rejected in the Business Partner conversion.
    fix_map:
      __other__: Delete the orphan rows with the archiving object FI_ACCRECV or recreate the general data, and correct the
        load that created them.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: no general customer record
      exists in KNA1.'
  - id: SDCM706
    field: KNVV.ERNAM
    check_class: null_check
    grain: KNVV
    severity: low
    dimension: completeness
    message: Customer sales area record has no creator (ERNAM)
    why_it_matters: ERNAM is filled by VD01/XD01 with the user who created the sales area data. A blank creator means the
      record was inserted outside the standard transactions (direct load, client copy without user data), so the audit trail
      of who created the customer in this sales area is lost and the record bypassed the field checks of the transaction.
    rule_authority: best_practice
    sap_impact: No audit trail for the creation of the sales area data.
    fix_map:
      __other__: Identify the load that created the record, verify its data with the transactions, and correct the load program
        so it fills ERNAM.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: the creating user is blank.'
  - id: SDCM707
    field: KNVV.ERDAT
    check_class: null_check
    grain: KNVV
    severity: low
    dimension: completeness
    message: Customer sales area record has no creation date (ERDAT)
    why_it_matters: ERDAT is set by VD01/XD01 to the date the sales area data was created. A blank creation date means the
      record was written outside the standard transactions, and every age, change and aging analysis of the customer in this
      sales area has no starting point.
    rule_authority: best_practice
    sap_impact: Ageing and change reporting for the sales area cannot be computed for this record.
    fix_map:
      __other__: Correct the load program so it fills ERDAT, and set the date from the change documents (CDHDR) where possible.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: the creation date is blank.'
  - id: SDCM708
    field: KNVV.ERDAT
    check_class: cross_field_check
    grain: KNVV
    fail_when: '`KNVV.ERDAT` < `KNA1.ERDAT`'
    severity: low
    dimension: consistency
    message: Customer sales area was created before the customer itself
    why_it_matters: Sales area data (KNVV) can only be created for an existing customer (KNA1). A KNVV creation date earlier
      than the KNA1 creation date is impossible in the standard transactions and shows that one of the two dates was written
      by a load or migration with the wrong value, so age and creation reporting of the customer is wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Customer age, creation and change reporting are inconsistent between general and sales data.
    fix_map:
      __other__: Correct the creation date of the general data or of the sales area data in the source of the migration and
        re-load.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: created {KNVV.ERDAT}, before
      the customer itself ({KNA1.ERDAT}).'
  - id: SDCM709
    field: KNVV.PERRL
    check_class: referential_check
    grain: KNVV
    severity: medium
    dimension: validity
    message: Invoice list schedule of the customer is not a defined factory calendar (TFACD)
    why_it_matters: KNVV.PERRL is the calendar that sets the dates on which invoice lists are created for the customer, and
      its check table is the factory calendar TFACD. A calendar ID that does not exist means VF21/VF24 can never find an invoice
      list date, so billing documents that should be collected in an invoice list are never listed.
    rule_authority: sap_hard_constraint
    sap_impact: Invoice lists are not created for the customer; the billing documents stay outside the list.
    fix_map:
      __other__: Change the invoice list schedule in VD02 (Billing tab) to a factory calendar defined in SCAL, or create the
        calendar.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: invoice list schedule {KNVV.PERRL}
      is not a defined calendar.'
  - id: SDCM710
    field: KNVV.PERFK
    check_class: cross_field_check
    grain: KNVV
    fail_when: '`KNVV.PERRL`.notna() & `KNVV.PERFK`.isna()'
    severity: low
    dimension: consistency
    message: Customer has an invoice list schedule but no invoice dates calendar
    why_it_matters: Invoice lists (KNVV.PERRL) collect billing documents that were already created. SAP sets the billing date
      of a document that goes into an invoice list from the invoice dates calendar KNVV.PERFK. With a list schedule but no
      invoice dates calendar, each billing document is created on its own date while the list collects them on another schedule,
      which is the opposite of what invoice lists are configured for.
    rule_authority: best_practice
    sap_impact: Billing documents are created daily instead of on the dates the invoice list is meant to collect.
    fix_map:
      __other__: Maintain the invoice dates calendar (Billing tab, field Invoice dates) together with the invoice list schedule
        in VD02, or remove the invoice list schedule.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: invoice list schedule {KNVV.PERRL}
      is set but no invoice dates calendar.'
  - id: SDCM711
    field: KNVV.INCO1
    check_class: null_check
    grain: KNVV
    applies_when:
      KNVV.LOEVM:
        blank: true
    severity: medium
    dimension: completeness
    message: Customer sales area has no Incoterms
    why_it_matters: KNVV.INCO1 is copied into every sales order header and decides where risk and cost pass from seller to
      buyer. Without it each order must be completed by hand, freight conditions that depend on the Incoterm are not found,
      and export declarations and intrastat reports have no delivery terms.
    rule_authority: best_practice
    sap_impact: Sales orders are created without delivery terms; freight pricing and foreign trade data are incomplete.
    fix_map:
      __other__: Enter the Incoterms and their location in VD02 (Billing tab) for the sales area.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: no Incoterms are maintained.'
  - id: SDCM712
    field: KNVV.INCO1
    check_class: cross_field_check
    grain: KNVV
    fail_when: '`KNVV.INCO1`.isin([''DAF'', ''DES'', ''DEQ'', ''DDU''])'
    severity: low
    dimension: validity
    message: Customer uses an Incoterms 2000 term that was withdrawn in Incoterms 2010 (DAF, DES, DEQ, DDU)
    why_it_matters: The ICC withdrew DAF, DES, DEQ and DDU from Incoterms 2010 and replaced them with DAP (and DAT, later
      DPU). The codes stay in SAP table TINC for old documents, so SAP accepts them, but contracts, letters of credit and
      customs declarations issued today under Incoterms 2010 or 2020 cannot refer to them.
    rule_authority: iso_standard
    sap_impact: Sales orders and export documents carry delivery terms that are no longer defined by the ICC.
    fix_map:
      __other__: Replace the term in VD02 with its current equivalent (normally DAP; DDP where the seller pays duty) after
        agreeing it with the customer.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: Incoterms {KNVV.INCO1}
      were withdrawn in Incoterms 2010.'
  - id: SDCM713
    field: KNVV.INCO1
    check_class: cross_field_check
    grain: KNVV
    fail_when: '`KNVV.INCO1` == ''DAT'''
    severity: low
    dimension: validity
    message: Customer uses Incoterm DAT, which Incoterms 2020 replaced with DPU
    why_it_matters: Incoterms 2020 renamed DAT (Delivered at Terminal) to DPU (Delivered at Place Unloaded) so the place of
      delivery is no longer limited to a terminal. DAT stays in TINC for old documents, but new contracts and customs documents
      issued under Incoterms 2020 use DPU.
    rule_authority: iso_standard
    sap_impact: Sales orders and export documents carry an Incoterms 2010 term in place of its Incoterms 2020 replacement.
    fix_map:
      __other__: Change the Incoterms in VD02 from DAT to DPU (create DPU in SPRO > Sales and Distribution > Master Data >
        Business Partners > Customers > Shipping > Define Incoterms if missing).
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: Incoterms DAT should be
      DPU under Incoterms 2020.'
  - id: SDCM714
    field: KNVV.ANTLF
    check_class: cross_field_check
    grain: KNVV
    fail_when: '`KNVV.KZTLF`.isin([''B'', ''C'']) & (`KNVV.ANTLF` > 1)'
    severity: low
    dimension: consistency
    message: Customer allows more than one partial delivery but its partial delivery rule permits only one delivery
    why_it_matters: KNVV.KZTLF values B (create only one delivery, even with quantity zero) and C (only complete delivery)
      both mean an order item is delivered once. KNVV.ANTLF is the maximum number of partial deliveries per item. A maximum
      above 1 contradicts a rule that allows a single delivery, so one of the two settings does not reflect what was agreed
      with the customer.
    rule_authority: best_practice
    sap_impact: Delivery behaviour for the customer depends on which of the contradicting settings the order uses.
    fix_map:
      __other__: Decide whether the customer accepts partial deliveries and align KZTLF and the maximum partial deliveries
        in VD02 (Shipping tab).
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: partial delivery rule {KNVV.KZTLF}
      allows one delivery but the maximum is {KNVV.ANTLF}.'
  - id: SDCM715
    field: KNVV.AUTLF
    check_class: cross_field_check
    grain: KNVV
    fail_when: (`KNVV.AUTLF` == 'X') & `KNVV.KZTLF`.isin(['A', 'D'])
    severity: low
    dimension: consistency
    message: Customer requires complete delivery but its partial delivery rule allows partial deliveries
    why_it_matters: 'KNVV.AUTLF = X requires each order to be delivered complete in one delivery. KNVV.KZTLF A (deliver whatever
      quantity is available) and D (no limit to subsequent deliveries) explicitly allow partial deliveries per item. The two
      settings contradict each other: the order header forbids what the item rule allows.'
    rule_authority: best_practice
    sap_impact: Delivery creation for the customer follows the order header flag, while the item rule promises partial deliveries.
    fix_map:
      __other__: Clear the complete delivery flag or set the partial delivery rule to C (only complete delivery) in VD02.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: complete delivery is required
      but partial delivery rule {KNVV.KZTLF} allows partial deliveries.'
  - id: SDCM716
    field: KNVV.ANTLF
    check_class: cross_field_check
    grain: KNVV
    fail_when: (`KNVV.AUTLF` == 'X') & (`KNVV.ANTLF` > 1)
    severity: low
    dimension: consistency
    message: Customer requires complete delivery but allows more than one partial delivery
    why_it_matters: With KNVV.AUTLF = X the whole order is delivered once. A maximum number of partial deliveries (ANTLF)
      above 1 has no effect and contradicts the complete delivery requirement, which shows that one of the two settings was
      copied from a template and not agreed with the customer.
    rule_authority: best_practice
    sap_impact: The maximum partial delivery setting is ignored; delivery behaviour is not what the record suggests.
    fix_map:
      __other__: Clear the maximum partial deliveries or the complete delivery flag in VD02 (Shipping tab).
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: complete delivery is required
      but up to {KNVV.ANTLF} partial deliveries are allowed.'
  - id: SDCM717
    field: KNVV.PODTG
    check_class: cross_field_check
    grain: KNVV
    fail_when: (`KNVV.PODTG` > 0) & `KNVV.PODKZ`.isna()
    severity: low
    dimension: consistency
    message: Customer has a proof-of-delivery timeframe but is not relevant for proof of delivery
    why_it_matters: KNVV.PODTG is the number of days after goods issue within which the customer must confirm proof of delivery.
      SAP only uses it when KNVV.PODKZ marks the customer as POD relevant. A timeframe without the flag is never applied,
      so the business expects POD-based billing that SAP does not perform.
    rule_authority: best_practice
    sap_impact: Billing is not held for proof of delivery although a POD timeframe is maintained.
    fix_map:
      __other__: Set the POD relevance flag in VD02 (Shipping tab) or clear the timeframe.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: POD timeframe {KNVV.PODTG}
      days is set but the customer is not POD relevant.'
  - id: SDCM718
    field: KNVV.AWAHR
    check_class: regex_check
    grain: KNVV
    pattern: ^(100|0?[0-9]{1,2})$
    severity: low
    dimension: validity
    message: Order probability of the customer is not a percentage between 0 and 100
    why_it_matters: KNVV.AWAHR is the probability, in percent, that a quotation or inquiry for the customer becomes an order.
      SAP copies it into sales documents and uses it to weight expected order values. A value above 100 percent inflates the
      order pipeline and cannot be a probability.
    rule_authority: sap_hard_constraint
    sap_impact: Expected order value in quotations and the sales pipeline is overstated.
    fix_map:
      __other__: Enter a probability from 0 to 100 in VD02 (Sales tab).
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: order probability {actual_value}
      percent is outside 0 to 100.'
  - id: SDCM719
    field: KNVV.BOKRE
    check_class: cross_field_check
    grain: KNVV
    fail_when: (`KNVV.BOKRE` == 'X') & `KNVV.AGREL`.isna()
    s4_area: sales
    s4_impact: warning
    simplification_item: SD Rebate Processing replaced by Settlement Management
    baseline: s4_target
    severity: medium
    dimension: consistency
    message: Customer is relevant for SD rebates but not for Settlement Management
    why_it_matters: S/4HANA no longer supports new SD rebate agreements (VBO1); rebates move to condition contracts in Settlement
      Management. A customer can only be used in a condition contract when its sales area is flagged as relevant for settlement
      management (KNVV.AGREL). Customers that take part in rebates today (KNVV.BOKRE = X) without that flag cannot be moved
      to condition contracts.
    rule_authority: s4hana_migration
    sap_impact: Rebate agreements of the customer cannot be replaced with condition contracts after the S/4HANA conversion.
    fix_map:
      __other__: Set the Settlement Management relevance flag in VD02 (Billing tab) for every sales area that is rebate relevant,
        once condition contract settlement is configured.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: rebate relevant but not
      relevant for Settlement Management.'
  - id: SDCM720
    field: KNVV.PODKZ
    check_class: domain_value_check
    grain: KNVV
    allowed_values:
    - ''
    - X
    severity: low
    dimension: validity
    message: POD relevance (KNVV.PODKZ) must be X or empty
    why_it_matters: 'KNVV.PODKZ is a checkbox on domain XFELD: SAP only reads the value X as set and treats anything else
      as not set. When set, billing waits until the customer confirms proof of delivery. A value such as x, 1 or Y is written
      by a load program or interface, never by the transaction, and the field then looks set in reports while SAP behaves
      as if it were empty.'
    rule_authority: sap_hard_constraint
    sap_impact: The pod relevance setting behaves differently from what the stored value suggests.
    valid_values_with_labels:
      X: Set
      ? ''
      : Not set
    fix_map:
      __other__: Set KNVV.PODKZ to X or clear it in the customer master and correct the interface that wrote the value.
    record_fix_template: 'Customer {KNVV.KUNNR} sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: pod relevance flag holds
      {actual_value}, which is neither X nor empty.'
