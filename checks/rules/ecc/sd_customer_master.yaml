  - id: SDCM328
    field: KNA1.PSTLZ
    check_class: cross_field_check
    fail_when: '`KNA1.PSTLZ`.notna()'
    applies_when:
      KNA1.LAND1:
      - AE
      - QA
      - HK
      - MO
      - AG
      - BS
      - BZ
      - BW
      - DM
      - FJ
      - GD
      - GY
      - KN
      - SR
      - SC
      - ZW
    grain: KNA1
    severity: low
    dimension: validity
    message: Postal code entered for a country that has no postal code system
    why_it_matters: The United Arab Emirates, Qatar, Hong Kong, Macao, Botswana, Zimbabwe and several Caribbean states have
      no national postal code. A value in the field is a placeholder (00000), a PO box number or a code from another country,
      and it is printed on the address label where the post office does not expect it.
    rule_authority: best_practice
    sap_impact: Address labels carry a meaningless code and duplicate checks that compare postal codes miss matches.
    fix_map:
      __other__: Clear the postal code in XD02 and move a PO box number to the PO box field.
    record_fix_template: 'Customer {KNA1.KUNNR} in {KNA1.LAND1}: postal code entered although the country has none.'
  - id: SDCM329
    field: KNA1.PSTL2
    check_class: regex_check
