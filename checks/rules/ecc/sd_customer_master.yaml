  - id: SDCM427
    field: KNA1.TELFX
    check_class: cross_field_check
    fail_when: '`ADRC.ADDRNUMBER`.notna() & (`KNA1.TELFX`.isna() != `ADRC.FAX_NUMBER`.isna())'
    grain: KNA1
    severity: medium
    dimension: consistency
    message: Fax number is filled in only one of the customer master and the central address
    why_it_matters: KNA1 keeps copies of the central address (ADRC) for programs that do not read Business Address Services.
      KNA1.TELFX is derived from ADRC.FAX_NUMBER; one being empty while the other is filled is the clearest sign the copies
