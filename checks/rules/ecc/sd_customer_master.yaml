  - id: SDCM334
    field: KNA1.STCEG
    check_class: regex_check
    pattern: ^(DE|EE|EL|PT)[0-9]{9}$
    applies_when:
      KNA1.STCEG:
        startswith:
        - DE
        - EE
        - EL
        - PT
    grain: KNA1
    severity: high
    dimension: validity
    message: VAT registration number with prefix DE/EE/EL/PT does not have the national length and structure (nine digits)
    why_it_matters: 'Each tax authority issues VAT numbers in a fixed structure; for DE/EE/EL/PT it is nine digits. A number
      of another length or with letters where digits belong is not a registration: VIES rejects it, the EC sales list and the
      intra-community supply exemption citing it are invalid, and the check-digit test cannot even run.'
    rule_authority: regulatory
    sap_impact: Tax-exempt intra-community or export invoices cite an invalid VAT number, the EC sales list is rejected and
      the exemption can be denied in an audit.
    fix_map:
      __other__: Correct the VAT registration number in XD02 > Control data (no spaces, dots or dashes unless the national format
        requires them) and check it in VIES. Activate the country's tax number check (T005 > Set country-specific checks) so
        wrong formats are rejected on entry.
    record_fix_template: 'Customer {KNA1.KUNNR}: VAT registration number does not have the national format.'
