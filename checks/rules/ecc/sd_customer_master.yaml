  - id: SDCM532
    field: KNB5.KNRMA
    check_class: exists_check
    target_table: KNA1
    target_fields:
    - KUNNR
    target_when:
      LOEVM:
        blank: true
    grain: KNB5
    severity: medium
    dimension: consistency
    message: Dunning recipient does not exist or is flagged for deletion
    why_it_matters: KNB5.KNRMA sends the customer's dunning notices to another account. A recipient that is missing or flagged
      for deletion receives notices nobody reads, or none at all.
    rule_authority: sap_hard_constraint
    sap_impact: Overdue items are dunned to a dead address and collection stalls.
    fix_map:
      __other__: Replace the dunning recipient with an active customer (XD02 > Company code data > Correspondence).
    record_fix_template: 'Customer {KNB5.KUNNR}, company code {KNB5.BUKRS}, dunning area {KNB5.MABER}: dunning recipient {KNB5.KNRMA}
      missing or deleted.'
  - id: SDCM533
    field: KNB5.KNRMA
    check_class: cross_field_check
    fail_when: '`KNB5.KNRMA` == `KNB5.KUNNR`'
    grain: KNB5
    severity: low
    dimension: consistency
    message: Customer is entered as its own dunning recipient
    why_it_matters: A dunning recipient is only needed when notices go to a different account. Pointing at itself adds nothing
      and usually means the real recipient was overwritten.
    rule_authority: best_practice
    sap_impact: Notices meant for a central recipient go to the customer itself.
    fix_map:
      __other__: Clear the dunning recipient or enter the intended account (XD02 > Correspondence).
    record_fix_template: 'Customer {KNB5.KUNNR}, company code {KNB5.BUKRS}, dunning area {KNB5.MABER}: dunning recipient is
      the customer itself.'
  - id: SDCM534
    field: KNB5.MAHNS
    check_class: cross_field_check
    fail_when: '`KNB5.MAHNS`.notna() & (`KNB5.MAHNS` != ''0'') & `KNB5.MAHNA`.isna()'
    grain: KNB5
    severity: medium
    dimension: consistency
    message: Customer has a dunning level but no dunning procedure
    why_it_matters: KNB5.MAHNS is the highest level the dunning run reached, which it can only set under a dunning procedure
      (KNB5.MAHNA). A level without a procedure means the procedure was removed while items were in dunning.
    rule_authority: best_practice
    sap_impact: The next dunning run does not continue the escalation; overdue items stop being chased.
    fix_map:
      __other__: Re-assign the dunning procedure or reset the dunning level (XD02 > Correspondence).
    record_fix_template: 'Customer {KNB5.KUNNR}, company code {KNB5.BUKRS}, dunning area {KNB5.MABER}: dunning level {actual_value}
      without a dunning procedure.'
  - id: SDCM535
    field: KNB5.MADAT
    check_class: cross_field_check
    fail_when: '`KNB5.MADAT`.notna() & (`KNB5.MADAT` > @today)'
    grain: KNB5
    severity: medium
    dimension: timeliness
    message: Last dunning notice is dated in the future
    why_it_matters: KNB5.MADAT records a date that has already happened. A value after the day the check runs comes from a wrong
      system clock, a mis-mapped legacy load or an interface that swapped day and month, so every figure derived from it is
      wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Reports and programs that age or select on KNB5.MADAT treat the dunning history wrongly.
    fix_map:
      __other__: Correct the last dunning date; the dunning run sets it and it cannot be later than today.
    record_fix_template: 'Customer {KNB5.KUNNR}, company code {KNB5.BUKRS}, dunning area {KNB5.MABER}: KNB5.MADAT {actual_value}
      is in the future.'
  - id: SDCM536
    field: KNB5.GMVDT
    check_class: cross_field_check
    fail_when: '`KNB5.GMVDT`.notna() & (`KNB5.GMVDT` > @today)'
    grain: KNB5
    severity: medium
    dimension: timeliness
    message: Date of legal dunning proceedings is dated in the future
    why_it_matters: KNB5.GMVDT records a date that has already happened. A value after the day the check runs comes from a wrong
      system clock, a mis-mapped legacy load or an interface that swapped day and month, so every figure derived from it is
      wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Reports and programs that age or select on KNB5.GMVDT treat the legal dunning status wrongly.
    fix_map:
      __other__: Correct the legal dunning date (XD02 > Correspondence); it records proceedings already started.
    record_fix_template: 'Customer {KNB5.KUNNR}, company code {KNB5.BUKRS}, dunning area {KNB5.MABER}: KNB5.GMVDT {actual_value}
      is in the future.'
  - id: SDCM537
    field: KNBK.BKONT
    check_class: regex_check
    pattern: ^\d{2}$
    applies_when:
      KNBK.BANKS:
      - FR
      - MC
    grain: KNBK
    severity: medium
    dimension: validity
    message: Bank control key is not a two-digit RIB key for a FR/MC bank account
    why_it_matters: 'For FR/MC accounts SAP stores the national check part of the account in the bank control key (KNBK.BKONT):
      a two-digit RIB key. It is part of the BBAN and of the IBAN SAP generates; any other shape produces a wrong IBAN.'
    rule_authority: iso_standard
    sap_impact: The generated IBAN fails the bank's check and SEPA direct debits are rejected.
    fix_map:
      __other__: Correct the control key from the customer's bank statement (XD02 > Payment transactions).
    record_fix_template: 'Customer {KNBK.KUNNR}: bank control key of the KNBK.BANKS account is not valid.'
