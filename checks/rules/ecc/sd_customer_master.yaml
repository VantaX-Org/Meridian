module: sd_customer_master
target_state: ECC_AND_S4HANA
rules:
  - id: SDCM001
    field: KNA1.KUNNR
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Customer number is mandatory — primary key for all SD customer transactions"
    why_it_matters: >-
      KUNNR is the primary key for the SD customer master. Without it, no
      sales area data can be maintained and the customer cannot be used in
      any SD transaction including sales orders (VA01), deliveries (VL01N),
      and billing (VF01). In S/4HANA, KNA1 is a compatibility view — the
      primary master is Business Partner (BUT000) via CVI mapping.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Customer cannot be used in any SD process. VA01, VL01N, VF01 all fail.
      Migration conversion rejects the record.
    fix_map:
      __blank__: >-
        In ECC: assign a valid customer number via T-code VD01 (create SD
        customer) or XD01 (create customer with all views). In S/4HANA:
        create via Fiori app F3893 (Manage Business Partner) with the
        customer role and sales area data.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: KUNNR is {actual_value}. Assign a valid customer
      number via VD01 / Fiori app F3893 or correct the source data.

  - id: SDCM002
    field: KNA1.KUNNR
    check_class: regex_check
    pattern: "^[A-Z0-9]{1,10}$"
    severity: critical
    dimension: validity
    message: "Customer number must be 1-10 alphanumeric characters"
    why_it_matters: >-
      Customer numbers must conform to the number range configuration (table
      TNRO, object DEBITOR). Non-conforming formats are rejected by the
      system and break the customer-vendor integration (CVI) mapping to
      Business Partner in S/4HANA.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Customer rejected by number range validation. CVI mapping to Business
      Partner fails. Customer unusable in any SD or FI-AR transaction.
    fix_map:
      __other__: >-
        Customer number '{invalid_value}' does not match the required format.
        In ECC: use LSMW or a conversion program to reformat. Coordinate with
        the basis team on number range configuration (T-code SNRO, object
        DEBITOR). In S/4HANA: use Fiori app F4596 for number ranges.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: number format is invalid (value: '{actual_value}').
      Reformat or assign a new number via SNRO / Fiori app F4596.

  - id: SDCM003
    field: KNA1.NAME1
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Customer name is mandatory — displayed on all SD documents"
    why_it_matters: >-
      NAME1 is the primary customer name displayed on sales orders, delivery
      notes, invoices, pro forma invoices, and all printed SD correspondence.
      It is a mandatory field — the customer master cannot be saved without it
      in either ECC or S/4HANA.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Customer master cannot be saved. Sales orders, delivery notes, and
      invoices display blank customer name. Partner function determination
      in SD fails.
    fix_map:
      __blank__: >-
        In ECC: obtain the legal entity name and set via T-code VD02 >
        Address tab or XD02 > Address tab. In S/4HANA: use Fiori app F3893
        (Manage Business Partner).
    record_fix_template: >-
      Customer {KNA1.KUNNR}: NAME1 is {actual_value}. Set the customer name
      via VD02 / Fiori app F3893.


  - id: SDCM005
    field: KNA1.LAND1
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Country is mandatory — drives tax determination and shipping route calculation"
    why_it_matters: >-
      LAND1 (country code) is mandatory for all SD customers. It drives tax
      determination, output determination, incoterms validation, shipping
      route calculation, and export/import control. Without it, no SD
      transactions can be processed.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Customer cannot be saved. Tax determination (FTXP) fails. Shipping
      route determination (VT01N) produces errors. Export control checks
      cannot be executed.
    fix_map:
      __blank__: >-
        In ECC: determine the ISO country code from the customer's address
        and set via T-code VD02 > Address tab. In S/4HANA: use Fiori app
        F3893 (Manage Business Partner).
    record_fix_template: >-
      Customer {KNA1.KUNNR}: LAND1 is {actual_value}. Set the ISO country
      code via VD02 / Fiori app F3893.

  - id: SDCM006
    field: KNA1.STCD1
    check_class: cross_field_check
    severity: low
    dimension: completeness
    message: Customer has no tax identification (neither tax number 1 nor VAT registration number)
    why_it_matters: STCD1 (tax number) is required for generating tax-compliant invoices. Many jurisdictions require the customer's
      tax registration number on invoices for VAT deduction. Missing tax number results in non-compliant billing documents from
      VF01.
    rule_authority: best_practice
    sap_impact: Billing documents (VF01) do not include customer tax number. Tax invoices are non-compliant in jurisdictions
      requiring tax ID on invoices. E-invoicing mandates may reject the document.
    fix_map:
      __blank__: 'In ECC: obtain the customer''s VAT number or tax ID and set via T-code VD02 > General Data > Control tab or
        XD02. In S/4HANA: use Fiori app F3893 > Tax Numbers section.'
    record_fix_template: 'Customer {KNA1.KUNNR}: STCD1 is {actual_value}. Set the tax number via VD02 / Fiori app F3893.'
    fail_when: '`KNA1.STCD1`.isna() & `KNA1.STCEG`.isna()'
    applies_when:
      KNA1.STKZN:
        not_in:
        - X

  - id: SDCM007
    field: ADR6.SMTP_ADDR
    check_class: null_check
    severity: medium
    dimension: completeness
    message: "Email required for electronic order confirmations and invoice delivery"
    why_it_matters: >-
      Email address is required for sending order confirmations, delivery
      notifications, invoices, and credit/debit memos electronically. Without
      it, all SD output falls back to paper or fax, increasing cost and
      reducing delivery speed.
    rule_authority: best_practice
    sap_impact: >-
      Order confirmations, shipping notifications, and invoices cannot be
      sent electronically. Output determination (NACE) falls back to print.
    fix_map:
      __blank__: >-
        In ECC: obtain email from the customer or sales team and set via
        T-code VD02 > Address tab > Communication. In S/4HANA: use Fiori
        app F3893 > Address section.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: SMTP_ADDR is {actual_value}. Set the email
      address via VD02 / Fiori app F3893.

  - id: SDCM008
    field: KNA1.KTOKD
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Customer account group is mandatory — controls SD field status"
    why_it_matters: >-
      KTOKD (account group) controls which fields are required, optional, or
      suppressed in the customer master including the sales area data. It
      determines whether the customer is a sold-to, ship-to, bill-to, or
      payer partner. Without it, the customer master structure is undefined.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Customer master structure is undefined. Partner function determination
      fails. The record cannot be saved.
    fix_map:
      __blank__: >-
        In ECC: assign the account group via T-code VD02 or XD02. Common
        SD groups: KUND (sold-to), KUWE (ship-to), KURE (payer), KUWZ
        (bill-to). In S/4HANA: use Fiori app F3893 via BP grouping.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: KTOKD is {actual_value}. Assign the customer
      account group via VD02 / Fiori app F3893.

  - id: SDCM009
    field: KNVV.VKORG
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Sales organisation is mandatory — part of the required sales area triple"
    why_it_matters: >-
      VKORG (sales organisation) is the first element of the sales area
      triple (sales org / distribution channel / division) that defines a
      customer's commercial relationship. Without it, no sales area data
      exists and the customer cannot be used in any SD transaction. The
      sales org must be valid in the enterprise structure (T-code OVXB).
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Customer cannot be used in VA01. No sales area = no sales orders
      possible. Pricing, shipping, and billing cannot be determined.
    fix_map:
      __blank__: >-
        In ECC: assign the correct sales organisation via T-code VD02 >
        Sales Area Data tab. In S/4HANA: use Fiori app F3893 (Manage
        Business Partner) and add the sales area assignment.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: VKORG is {actual_value}. Assign the sales
      organisation via VD02 / Fiori app F3893.

  - id: SDCM010
    field: KNVV.VTWEG
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Distribution channel is mandatory — required for sales area definition"
    why_it_matters: >-
      VTWEG (distribution channel) is the second element of the sales area
      triple. It defines how products reach the customer (e.g., direct sales,
      wholesale, internet). Without it, the sales area is incomplete and no
      SD transactions can be created.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Sales area is incomplete — VA01 rejects the customer. Pricing procedure
      determination fails. Material determination and listing/exclusion
      cannot be evaluated.
    fix_map:
      __blank__: >-
        In ECC: assign the correct distribution channel via T-code VD02 >
        Sales Area Data tab. Common values: 10 (direct), 20 (wholesale),
        30 (internet). In S/4HANA: use Fiori app F3893.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: VTWEG is {actual_value}. Assign the distribution
      channel via VD02 / Fiori app F3893.

  - id: SDCM011
    field: KNVV.SPART
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Division is mandatory — completes the sales area triple"
    why_it_matters: >-
      SPART (division) is the third element of the sales area triple. It
      segments the product range (e.g., pumps, electronics, services). All
      three elements must be present for any SD transaction to be created.
      The division must be valid in the enterprise structure.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Sales area is incomplete — customer cannot be used in VA01.
      Product-specific pricing and output determination fail.
    fix_map:
      __blank__: >-
        In ECC: assign the correct division via T-code VD02 > Sales Area
        Data tab. In S/4HANA: use Fiori app F3893.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: SPART is {actual_value}. Assign the division
      via VD02 / Fiori app F3893.

  - id: SDCM012
    field: KNVV.KDGRP
    check_class: null_check
    severity: medium
    dimension: completeness
    message: Customer group missing — affects pricing and reporting segmentation
    why_it_matters: KDGRP (customer group) is used in pricing condition records, reporting, and customer segmentation. Without
      it, group-specific pricing cannot be applied and sales reports cannot segment by customer category. Rebate agreements
      based on customer group are not triggered.
    rule_authority: best_practice
    sap_impact: Customer group-specific pricing conditions are not applied. Sales analysis reports (MC+E) cannot segment by
      customer group. Rebate agreements based on customer group are not triggered.
    fix_map:
      __blank__: 'In ECC: assign the correct group based on customer classification (e.g., 01=domestic, 02=export, 03=key account)
        via T-code VD02 > Sales Area Data > Sales tab. In S/4HANA: use Fiori app F3893.'
    record_fix_template: 'Customer {KNA1.KUNNR}: KDGRP is {actual_value}. Assign the customer group via VD02 / Fiori app F3893.'

  - id: SDCM013
    field: KNVV.KALKS
    check_class: null_check
    severity: high
    dimension: completeness
    message: Pricing procedure missing — no prices determined on sales orders
    why_it_matters: KALKS (customer pricing procedure) determines which pricing conditions (base price, discounts, surcharges,
      taxes) are applied when creating a sales order. Without it, no automatic pricing occurs in VA01 and every order must be
      priced manually, creating significant revenue risk.
    rule_authority: best_practice
    sap_impact: Sales orders (VA01) have no automatic pricing. All conditions must be entered manually. Pricing analysis (V/LD)
      shows no procedure assignment. Revenue recognition may be incorrect.
    fix_map:
      __blank__: 'In ECC: assign the customer pricing procedure via T-code VD02 > Sales Area Data > Sales tab. This works with
        the sales org pricing procedure (OVKK) and document pricing procedure to determine the final pricing procedure. In S/4HANA:
        use Fiori app F3893.'
    record_fix_template: 'Customer {KNA1.KUNNR}: KALKS is {actual_value}. Assign the pricing procedure via VD02 / Fiori app
      F3893.'

  - id: SDCM014
    field: KNVV.ZTERM
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Payment terms missing in sales area — no default for sales orders"
    why_it_matters: >-
      ZTERM in the sales area data provides the default payment terms for
      sales orders and billing documents. Without it, every sales order
      requires manual entry of payment terms, slowing order processing and
      increasing error risk. These terms override the FI company code terms.
    rule_authority: best_practice
    sap_impact: >-
      No default payment terms on sales orders (VA01). Manual entry required
      for every order. Billing documents (VF01) have no payment baseline.
      Cash flow forecasting is inaccurate.
    fix_map:
      __blank__: >-
        In ECC: obtain the agreed terms from the sales contract and set via
        T-code VD02 > Sales Area Data > Billing tab. Common values: ZB30
        (30 days net), ZB60 (60 days net). In S/4HANA: use Fiori app F3893.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: ZTERM is {actual_value}. Set payment terms
      via VD02 / Fiori app F3893 > Sales Area Data.

  - id: SDCM015
    field: KNVV.INCO1
    check_class: domain_value_check
    allowed_values:
    - EXW
    - FCA
    - CPT
    - CIP
    - DAP
    - DPU
    - DDP
    - FAS
    - FOB
    - CFR
    - CIF
    - DAT
    - DAF
    - DDU
    - DEQ
    - DES
    - FH
    - UN
    - ''
    severity: medium
    dimension: validity
    message: Incoterms must be a valid Incoterms 2020 code or empty
    why_it_matters: INCO1 (incoterms) defines the shipping terms and determines who bears transport risk and cost. Invalid incoterms
      cause freight cost miscalculation, incorrect export documentation, and disputes over delivery responsibility. Incoterms
      2020 defines 11 standard terms.
    rule_authority: sap_hard_constraint
    sap_impact: Sales orders (VA01) have invalid shipping terms. Freight cost determination is incorrect. Export documentation
      is non-compliant.
    valid_values_with_labels:
      EXW: Ex Works — buyer bears all transport risk and cost
      FCA: Free Carrier — seller delivers to carrier at named place
      CPT: Carriage Paid To — seller pays freight to destination
      CIP: Carriage and Insurance Paid To — seller pays freight and insurance
      DAP: Delivered at Place — seller delivers to named place
      DPU: Delivered at Place Unloaded — seller delivers and unloads
      DDP: Delivered Duty Paid — seller bears all cost including import duty
      FAS: Free Alongside Ship — sea freight, seller delivers alongside vessel
      FOB: Free on Board — sea freight, seller delivers on board vessel
      CFR: Cost and Freight — sea freight, seller pays freight to port
      CIF: Cost Insurance Freight — sea freight, seller pays freight and insurance
      ? ''
      : No incoterms assigned
    fix_map:
      __other__: 'Value ''{invalid_value}'' is not a valid Incoterms 2020 code. In ECC: correct via T-code VD02 > Sales Area
        Data > Shipping tab. Valid codes are configured in table TINC. In S/4HANA: use Fiori app F3893.'
    record_fix_template: 'Customer {KNA1.KUNNR}: INCO1 is ''{actual_value}''. Set to a valid Incoterms 2020 code via VD02 /
      Fiori app F3893.'


  - id: SDCM017
    field: KNVV.KZAZU
    check_class: domain_value_check
    allowed_values: ["X", ""]
    severity: medium
    dimension: validity
    message: "Order combination flag must be X (enabled) or empty (disabled)"
    why_it_matters: >-
      KZAZU controls whether multiple sales orders for this customer can be
      combined into a single delivery. When enabled, the delivery creation
      process (VL01N) can consolidate items from multiple orders into one
      shipment, reducing logistics cost. An invalid value disrupts delivery
      processing.
    rule_authority: best_practice
    sap_impact: >-
      Delivery consolidation in VL01N may behave unpredictably. Logistics
      cost optimisation through order combination is not possible if the
      flag is incorrectly set.
    valid_values_with_labels:
      "X": "Order combination enabled — multiple orders can be combined"
      "": "Order combination disabled — separate delivery per order"
    fix_map:
      __other__: >-
        Value '{invalid_value}' is not valid. Must be X (enabled) or empty
        (disabled). In ECC: correct via T-code VD02 > Sales Area Data >
        Shipping tab. In S/4HANA: use Fiori app F3893.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: KZAZU is '{actual_value}'. Set to X or empty
      via VD02 / Fiori app F3893.

  - id: SDCM018
    field: KNVV.WAERS
    check_class: regex_check
    pattern: "^[A-Z]{3}$"
    severity: critical
    dimension: validity
    message: "Sales area currency must be a valid 3-letter ISO currency code"
    why_it_matters: >-
      WAERS in the sales area determines the default currency for all sales
      orders and billing documents for this customer. It must be a valid
      ISO 4217 code. Invalid currencies cause pricing determination failures
      and billing document errors.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Pricing determination in VA01 fails. Billing documents (VF01) cannot
      be created. Currency conversion errors occur throughout the SD process.
    fix_map:
      __other__: >-
        Currency '{invalid_value}' is not a valid ISO 4217 code. In ECC:
        correct via T-code VD02 > Sales Area Data > Sales tab. The currency
        must be configured in the system (T-code OY03). In S/4HANA: use
        Fiori app F3893.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: WAERS is '{actual_value}'. Set to a valid ISO
      currency code via VD02 / Fiori app F3893.

  - id: SDCM019
    field: KNVV.VERSG
    check_class: null_check
    severity: low
    dimension: completeness
    message: Statistics group is recommended for sales reporting and analysis
    why_it_matters: VERSG (statistics group) controls how this customer is represented in the Logistics Information System (LIS)
      and sales statistics. Without it, the customer may be excluded from standard sales reports and analysis tools (MC+E, MC+I).
    rule_authority: best_practice
    sap_impact: Customer excluded from LIS sales statistics. Standard analysis reports (MC+E) may not include this customer's
      sales data.
    fix_map:
      __blank__: 'In ECC: assign the statistics group via T-code VD02 > Sales Area Data > Sales tab. In S/4HANA: use Fiori app
        F3893.'
    record_fix_template: 'Customer {KNA1.KUNNR}: VERSG is {actual_value}. Assign the statistics group via VD02 / Fiori app F3893.'

  - id: SDCM020
    field: KNVV.LPRIO
    check_class: domain_value_check
    severity: medium
    dimension: validity
    message: Delivery priority must be 01 (high), 02 (normal), 03 (low), or empty
    why_it_matters: LPRIO (delivery priority) determines the order in which deliveries are processed during delivery creation
      and shipping. It affects warehouse picking sequence and transport scheduling. Invalid values disrupt delivery sequencing.
    rule_authority: best_practice
    sap_impact: Delivery sequencing in VL01N/VL06 may be incorrect. Warehouse picking priorities are not properly assigned.
      High-priority customers may not receive preferential treatment.
    valid_values_with_labels:
      '01': High priority — processed first
      '02': Normal priority
      '03': Low priority — processed last
      ? ''
      : No priority assigned — defaults to normal
    fix_map:
      __other__: 'Value ''{invalid_value}'' is not a valid delivery priority. Must be 01 (high), 02 (normal), 03 (low), or empty.
        In ECC: correct via T-code VD02 > Sales Area Data > Shipping tab. In S/4HANA: use Fiori app F3893.'
    record_fix_template: 'Customer {KNA1.KUNNR}: LPRIO is ''{actual_value}''. Set to 01, 02, 03, or empty via VD02 / Fiori app
      F3893.'

  - id: SDCM021
    field: KNVV.VSBED
    check_class: null_check
    severity: medium
    dimension: completeness
    message: "Shipping conditions missing — affects route and shipping point determination"
    why_it_matters: >-
      VSBED (shipping conditions) is used in shipping point determination
      and route determination during delivery creation. Without it, the
      system cannot automatically determine the correct shipping point or
      route, requiring manual intervention for every delivery.
    rule_authority: best_practice
    sap_impact: >-
      Shipping point determination in VL01N requires manual override. Route
      determination fails. Freight cost calculation may be incorrect.
    fix_map:
      __blank__: >-
        In ECC: assign shipping conditions via T-code VD02 > Sales Area
        Data > Shipping tab. Common values: 01 (standard), 02 (express).
        In S/4HANA: use Fiori app F3893.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: VSBED is {actual_value}. Assign shipping
      conditions via VD02 / Fiori app F3893.

  - id: SDCM022
    field: KNA1.KUNNR
    check_class: cross_field_check
    severity: high
    dimension: consistency
    message: Incoterms code and location must both be filled or both be blank
    why_it_matters: INCO1 (incoterms code) and INCO2 (incoterms location) form a pair that must be maintained together.
      An incoterms code without a location is ambiguous (e.g., "FOB" without a port name), while a location without
      a code is meaningless. Incomplete incoterms cause disputes over delivery responsibility and may result in non-compliant
      export documentation.
    rule_authority: sap_hard_constraint
    sap_impact: Sales orders have incomplete shipping terms. Export documentation is non-compliant. Freight cost allocation
      may be disputed. Incoterms validation in VA01 may produce warnings or errors depending on configuration.
    fix_map: {__other__: 'Incoterms code and location are not both filled. In ECC: set both fields together via T-code
        VD02 > Sales Area Data > Shipping tab. In S/4HANA: use Fiori app F3893. Both INCO1 and INCO2 must be maintained
        as a pair.'}
    record_fix_template: 'Customer {KNA1.KUNNR}: INCO1 and INCO2 are inconsistent — one is filled and the other is
      blank. Set both via VD02 / Fiori app F3893.'
    fail_when: '`KNVV.INCO1`.notna() != `KNVV.INCO2`.notna()'

  - id: SDCM023
    field: KNA1.KUNNR
    check_class: cross_field_check
    severity: critical
    dimension: consistency
    message: Sales area triple must be complete — VKORG, VTWEG, and SPART all required
    why_it_matters: 'The sales area is defined by three fields: sales organisation (VKORG), distribution channel (VTWEG),
      and division (SPART). All three must be populated for the sales area to be valid. A partial sales area renders
      the customer unusable in all SD transactions and causes errors in partner function determination and pricing.'
    rule_authority: sap_hard_constraint
    sap_impact: Customer cannot be used in VA01. Sales area validation fails. Pricing, shipping, and billing determination
      all produce errors. The customer is commercially inactive.
    fix_map: {__other__: 'Sales area is partially filled. In ECC: complete all three fields (VKORG, VTWEG, SPART)
        via T-code VD02 > Sales Area Data tab. In S/4HANA: use Fiori app F3893 and ensure the full sales area is assigned.'}
    record_fix_template: 'Customer {KNA1.KUNNR}: sales area triple is incomplete. Complete all three fields (VKORG,
      VTWEG, SPART) via VD02 / Fiori app F3893.'
    fail_when: '`KNVV.VKORG`.notna() & (`KNVV.VTWEG`.isna() | `KNVV.SPART`.isna())'

  - id: SDCM024
    field: KNA1.KUNNR
    check_class: uniqueness_check
    fields: [KNA1.KUNNR]
    severity: critical
    dimension: uniqueness
    message: Duplicate SD customer numbers detected — each customer must be unique
    why_it_matters: Duplicate customer numbers violate the primary key constraint. The migration program will reject
      duplicates, and any that slip through cause incorrect SD document assignment, double billing, and broken customer
      reporting. This typically indicates a data extraction or consolidation error.
    rule_authority: sap_hard_constraint
    sap_impact: Migration fails on duplicate key insert. Post-migration, duplicate customers cause double billing,
      incorrect delivery assignment, and broken sales reporting.
    fix_map: {__other__: 'Duplicate SD customer number detected. Identify the canonical record and merge or deactivate
        the duplicate. In ECC: review both records via T-code VD03 and merge outstanding items. In S/4HANA: use Fiori
        app F3893 and BP merge tools to consolidate.'}
    record_fix_template: 'Customer {KNA1.KUNNR}: duplicate detected. Review and merge via VD03 / Fiori app F3893.'

  - id: SDCM025
    field: KNVV.WAERS
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Sales area currency is required — determines pricing and billing currency"
    why_it_matters: >-
      WAERS in the sales area determines the default document currency for
      all sales orders and billing documents. Without it, the system cannot
      determine the pricing currency, causing pricing determination to fail
      in VA01 and billing document creation to fail in VF01.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Pricing determination in VA01 fails — no prices are calculated.
      Billing documents cannot be created in VF01. The customer is
      commercially inactive without a currency assignment.
    fix_map:
      __blank__: >-
        In ECC: assign the document currency via T-code VD02 > Sales Area
        Data > Sales tab. In S/4HANA: use Fiori app F3893. The currency
        should match the customer's trading currency.
    record_fix_template: >-
      Customer {KNA1.KUNNR}: WAERS is {actual_value}. Assign the sales area
      currency via VD02 / Fiori app F3893.

  - id: SDCM026
    field: KNVV.VKORG
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Customer sales organisation KNVV.VKORG must exist in TVKO
    why_it_matters: Sales-area data can only be used in a sales organisation that exists. Data kept for a sales organisation
      that was removed from the configuration contradicts the organisational structure.
    rule_authority: best_practice
    sap_impact: The sales area is unreachable in VA01; reporting shows a non-existent sales organisation.
    fix_map:
      __other__: Sales organisation '{invalid_value}' is not defined in TVKO. Delete the obsolete sales-area data or extend
        the customer to the right sales area (VD01/XD01).
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: sales organisation ''{actual_value}''
      does not exist in TVKO.'
  - id: SDCM027
    field: KNVV.VTWEG
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Customer distribution channel KNVV.VTWEG must exist in TVTW
    why_it_matters: The distribution channel is part of the sales area every sales document is created in. A channel that
      is not defined makes the sales area unusable.
    rule_authority: best_practice
    sap_impact: Sales documents cannot be created in this sales area.
    fix_map:
      __other__: Distribution channel '{invalid_value}' is not defined in TVTW. Delete the obsolete sales-area data or extend
        the customer to the right sales area.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: distribution channel ''{actual_value}''
      does not exist in TVTW.'
  - id: SDCM028
    field: KNVV.SPART
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Customer division KNVV.SPART must exist in TSPA
    why_it_matters: The division is part of the sales area every sales document is created in. A division that is not defined
      makes the sales area unusable.
    rule_authority: best_practice
    sap_impact: Sales documents cannot be created in this sales area.
    fix_map:
      __other__: Division '{invalid_value}' is not defined in TSPA. Delete the obsolete sales-area data or extend the customer
        to the right sales area.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: division ''{actual_value}''
      does not exist in TSPA.'
  - id: SDCM029
    field: KNVV.KALKS
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Customer pricing procedure KNVV.KALKS must exist in TVKD
    why_it_matters: The customer pricing procedure key (KALKS) is one of the three keys of pricing procedure determination
      (OVKK). A key that is not defined in TVKD determines no pricing procedure.
    rule_authority: best_practice
    sap_impact: 'Sales orders get no pricing procedure: no prices, no taxes, the order is incomplete and cannot be billed.'
    fix_map:
      __other__: Customer pricing procedure '{invalid_value}' is not defined in TVKD. Correct it in VD02/XD02 > Sales area
        > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: customer pricing procedure
      ''{actual_value}'' not in TVKD.'
  - id: SDCM030
    field: KNVV.KDGRP
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Customer group KNVV.KDGRP must exist in T151
    why_it_matters: The customer group is a key of pricing conditions, statistics and often revenue account determination.
      A group that is not defined in T151 matches no condition record.
    rule_authority: best_practice
    sap_impact: Group-based prices and discounts are not found; sales statistics by customer group are wrong.
    fix_map:
      __other__: Customer group '{invalid_value}' is not defined in T151. Correct it in VD02/XD02 > Sales area > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: customer group ''{actual_value}''
      not in T151.'
  - id: SDCM031
    field: KNVV.KTGRD
    check_class: null_check
    severity: medium
    dimension: completeness
    message: Account assignment group is missing in the sales area
    why_it_matters: Revenue account determination (VKOA, condition type KOFI) reads the customer's account assignment group
      from the sales area. Without it the billing document only finds a revenue account if a generic fallback entry exists;
      otherwise the document is not released to accounting.
    rule_authority: best_practice
    sap_impact: Billing documents stop with 'account determination error' (VFX3 backlog); revenue is posted late or to a generic
      account.
    fix_map:
      __blank__: Maintain the account assignment group in VD02/XD02 > Sales area > Billing documents.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: account assignment group
      is missing.'
  - id: SDCM032
    field: KNVV.KTGRD
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Customer account assignment group KNVV.KTGRD must exist in TVKT
    why_it_matters: Revenue account determination (VKOA) reads the account assignment group of the customer. A group that
      is not defined in TVKT matches no account determination record.
    rule_authority: best_practice
    sap_impact: Billing documents are not released to accounting ('account determination error').
    fix_map:
      __other__: Account assignment group '{invalid_value}' is not defined in TVKT. Correct it in VD02/XD02 > Sales area >
        Billing documents.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: account assignment group
      ''{actual_value}'' not in TVKT.'
  - id: SDCM033
    field: KNVV.VSBED
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Customer shipping conditions KNVV.VSBED must exist in TVSB
    why_it_matters: Shipping conditions drive shipping point and route determination for every order item. A condition that
      is not defined in TVSB determines neither.
    rule_authority: best_practice
    sap_impact: Order items get no shipping point or route; deliveries cannot be created.
    fix_map:
      __other__: Shipping condition '{invalid_value}' is not defined in TVSB. Correct it in VD02/XD02 > Sales area > Shipping.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: shipping condition ''{actual_value}''
      not in TVSB.'
  - id: SDCM034
    field: KNVV.ZTERM
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Sales-area payment terms KNVV.ZTERM must exist in T052
    why_it_matters: Sales-area payment terms are copied into every sales order and billing document and from there into the
      receivable. Terms that are not defined in T052 leave the invoice without a due date.
    rule_authority: best_practice
    sap_impact: Billing documents carry undefined terms; receivables fall due immediately and dunning is wrong.
    fix_map:
      __other__: Payment terms '{invalid_value}' are not defined in T052. Correct them in VD02/XD02 > Sales area > Billing
        documents.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: payment terms ''{actual_value}''
      not in T052.'
  - id: SDCM035
    field: KNVV.VERSG
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer statistics group KNVV.VERSG must exist in TVSD
    why_it_matters: The customer statistics group decides whether sales documents update the sales information system (LIS).
      A group that is not defined in TVSD is not evaluated.
    rule_authority: best_practice
    sap_impact: The customer's sales are missing from or mis-assigned in LIS/S4 sales statistics.
    fix_map:
      __other__: Statistics group '{invalid_value}' is not defined in TVSD. Correct it in VD02/XD02 > Sales area > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: statistics group ''{actual_value}''
      not in TVSD.'
  - id: SDCM036
    field: KNVV.PLTYP
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer price list type KNVV.PLTYP must exist in T189
    why_it_matters: The price list type selects price-list condition records for the customer. A type that is not defined
      in T189 matches no price list.
    rule_authority: best_practice
    sap_impact: Price-list prices are not found; orders fall back to other prices or are incomplete.
    fix_map:
      __other__: Price list type '{invalid_value}' is not defined in T189. Correct it in VD02/XD02 > Sales area > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: price list type ''{actual_value}''
      not in T189.'
  - id: SDCM037
    field: KNVV.KONDA
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer price group KNVV.KONDA must exist in T188
    why_it_matters: The price group selects group-specific discounts and surcharges for the customer. A group that is not
      defined in T188 matches no condition record.
    rule_authority: best_practice
    sap_impact: Agreed group discounts or surcharges are not applied to the customer's orders.
    fix_map:
      __other__: Price group '{invalid_value}' is not defined in T188. Correct it in VD02/XD02 > Sales area > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: price group ''{actual_value}''
      not in T188.'
  - id: SDCM038
    field: KNVV.PERFK
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer invoice dates calendar KNVV.PERFK must exist in TFACD
    why_it_matters: The invoice dates calendar schedules periodic (collective) billing for the customer. A calendar that does
      not exist yields no billing date.
    rule_authority: best_practice
    sap_impact: Deliveries are not picked up by periodic billing runs; invoices are not created on schedule.
    fix_map:
      __other__: Calendar '{invalid_value}' does not exist (TFACD). Correct the invoice dates in VD02/XD02 > Sales area >
        Billing documents.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: invoice dates calendar
      ''{actual_value}'' does not exist in TFACD.'
  - id: SDCM039
    field: KNVV.KKBER
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Sales-area credit control area KNVV.KKBER must exist in T014
    why_it_matters: A credit control area in the sales area overrides the one derived from the company code for credit checks.
      An area that is not defined in T014 has no credit limits.
    rule_authority: best_practice
    sap_impact: Sales orders in this sales area are credit-checked against nothing.
    fix_map:
      __other__: Credit control area '{invalid_value}' is not defined in T014. Correct it in VD02/XD02 > Sales area > Billing
        documents.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: credit control area ''{actual_value}''
      not in T014.'
  - id: SDCM040
    field: KNVV.VWERK
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Customer delivering plant KNVV.VWERK must be a plant assigned to sales (TVKWZ)
    why_it_matters: The delivering plant is proposed into every order item. Only plants assigned to a sales organisation and
      distribution channel (TVKWZ) can deliver.
    rule_authority: best_practice
    sap_impact: Order items get a plant that cannot deliver for the sales area; availability check and delivery fail.
    fix_map:
      __other__: Plant '{invalid_value}' is not assigned to any sales organisation/distribution channel (TVKWZ). Correct the
        delivering plant in VD02/XD02 > Sales area > Shipping.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: delivering plant ''{actual_value}''
      not allowed in TVKWZ.'
  - id: SDCM041
    field: KNVV.BZIRK
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer sales district KNVV.BZIRK must exist in T171
    why_it_matters: The sales district is a key of pricing and sales statistics. A district that is not defined in T171 matches
      no condition record or statistic.
    rule_authority: best_practice
    sap_impact: District prices are not found; sales statistics by district are wrong.
    fix_map:
      __other__: Sales district '{invalid_value}' is not defined in T171. Correct it in VD02/XD02 > Sales area > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: sales district ''{actual_value}''
      not in T171.'
  - id: SDCM042
    field: KNVV.VKBUR
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer sales office KNVV.VKBUR must exist in TVBUR
    why_it_matters: The sales office is proposed into sales documents and drives responsibility, output and statistics. An
      office that is not defined in TVBUR cannot be copied into the order.
    rule_authority: best_practice
    sap_impact: Orders are created without a valid sales office; reporting and output by office are wrong.
    fix_map:
      __other__: Sales office '{invalid_value}' is not defined in TVBUR. Correct it in VD02/XD02 > Sales area > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: sales office ''{actual_value}''
      not in TVBUR.'
  - id: SDCM043
    field: KNVV.VKGRP
    check_class: referential_check
    severity: low
    dimension: consistency
    message: Customer sales group KNVV.VKGRP must exist in TVBVK
    why_it_matters: The sales group is proposed into sales documents. Only sales groups assigned to a sales office (TVBVK)
      are valid.
    rule_authority: best_practice
    sap_impact: Orders are created without a valid sales group; reporting by sales group is wrong.
    fix_map:
      __other__: Sales group '{invalid_value}' is not assigned to a sales office (TVBVK). Correct it in VD02/XD02 > Sales
        area > Sales.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: sales group ''{actual_value}''
      not in TVBVK.'
  - id: SDCM044
    field: KNVV.AUFSD
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Sales-area order block KNVV.AUFSD must exist in TVAST
    why_it_matters: A sales-area order block stops order processing by the reason defined in TVAST. A block code that is not
      defined has no rule attached, so the intended block is not applied consistently.
    rule_authority: best_practice
    sap_impact: Orders are blocked without a recognised reason, or not blocked although the business intended it.
    fix_map:
      __other__: Order block '{invalid_value}' is not defined in TVAST. Set the correct block in VD05/XD05 or clear it.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: order block ''{actual_value}''
      not in TVAST.'
  - id: SDCM045
    field: KNVV.LIFSD
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Sales-area delivery block KNVV.LIFSD must exist in TVLS
    why_it_matters: A sales-area delivery block stops deliveries by the reason defined in TVLS. A block code that is not defined
      has no rule attached, so the intended block is not applied consistently.
    rule_authority: best_practice
    sap_impact: Deliveries are blocked without a recognised reason, or not blocked although the business intended it.
    fix_map:
      __other__: Delivery block '{invalid_value}' is not defined in TVLS. Set the correct block in VD05/XD05 or clear it.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: delivery block ''{actual_value}''
      not in TVLS.'
  - id: SDCM046
    field: KNVV.FAKSD
    check_class: referential_check
    severity: medium
    dimension: consistency
    message: Sales-area billing block KNVV.FAKSD must exist in TVFS
    why_it_matters: A sales-area billing block stops billing by the reason defined in TVFS. A block code that is not defined
      has no rule attached, so the intended block is not applied consistently.
    rule_authority: best_practice
    sap_impact: Billing is blocked without a recognised reason, or not blocked although the business intended it.
    fix_map:
      __other__: Billing block '{invalid_value}' is not defined in TVFS. Set the correct block in VD05/XD05 or clear it.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: billing block ''{actual_value}''
      not in TVFS.'
  - id: SDCM047
    field: KNVV.LOEVM
    check_class: domain_value_check
    allowed_values:
    - ''
    - X
    valid_values_with_labels:
      ? ''
      : Active in this sales area
      X: Flagged for deletion in this sales area
    severity: medium
    dimension: validity
    message: Sales-area deletion flag must be X (flagged) or empty
    why_it_matters: The sales-level deletion flag stops new sales documents in the sales area and queues the data for archiving.
      SAP only recognises X.
    rule_authority: best_practice
    sap_impact: Orders may still be created in a sales area the business meant to close, or archiving skips it.
    fix_map:
      __other__: Set or remove the flag in VD06/XD06; never write other values by load.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: deletion flag ''{actual_value}''
      is invalid.'
  - id: SDCM048
    field: KNVV.KZTLF
    check_class: domain_value_check
    allowed_values:
    - ''
    - A
    - B
    - C
    - D
    valid_values_with_labels:
      ? ''
      : Partial delivery allowed
      A: Create delivery with quantity greater than zero
      B: Create only one delivery, even if quantity is zero
      C: Only complete delivery allowed
      D: No limit to subsequent deliveries
    severity: low
    dimension: validity
    message: Partial delivery control must be one of SAP's fixed values (blank, A, B, C, D)
    why_it_matters: KNVV.KZTLF is copied into every order item and controls whether and how partial deliveries are created.
      SAP only interprets its fixed values.
    rule_authority: best_practice
    sap_impact: Deliveries are split or held back contrary to the agreement with the customer.
    fix_map:
      __other__: Correct the partial delivery control in VD02/XD02 > Sales area > Shipping.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: partial delivery control
      ''{actual_value}'' is invalid.'
  - id: SDCM049
    field: KNVV.AUTLF
    check_class: domain_value_check
    allowed_values:
    - ''
    - X
    valid_values_with_labels:
      ? ''
      : Partial delivery of the order allowed
      X: Complete delivery of the order required
    severity: low
    dimension: validity
    message: Complete delivery indicator must be X or empty
    why_it_matters: KNVV.AUTLF is copied into the order header and forces the whole order to ship in one delivery. SAP only
      recognises X.
    rule_authority: best_practice
    sap_impact: Orders ship partially although the customer requires complete delivery, or wait unnecessarily.
    fix_map:
      __other__: Correct the complete delivery indicator in VD02/XD02 > Sales area > Shipping.
    record_fix_template: 'Customer {KNVV.KUNNR}, sales area {KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}: complete delivery indicator
      ''{actual_value}'' is invalid.'
  - id: SDCM050
    field: KNA1.LAND1
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Customer country KNA1.LAND1 must exist in T005
    why_it_matters: The customer's country drives output tax determination, export control, route determination and the address
      on every order, delivery note and invoice. A country key that is not in T005 resolves none of them.
    rule_authority: best_practice
    sap_impact: Tax determination fails on sales orders; deliveries cannot be routed; invoices carry an invalid address.
    fix_map:
      __other__: Country '{invalid_value}' is not defined in T005. Correct the customer address in XD02/VD02 (BP address in
        S/4HANA).
    record_fix_template: 'Customer {KNA1.KUNNR}: country ''{actual_value}'' not in T005.'
  - id: SDCM051
    field: KNVP.KUNN2
    check_class: exists_check
    grain: KNVP
    target_table: KNA1
    target_fields:
    - KUNNR
    target_when:
      LOEVM:
        blank: true
    severity: high
    dimension: consistency
    message: Partner (ship-to, bill-to, payer) does not exist or is flagged for deletion
    why_it_matters: Sales documents copy the customer's partners from the sales-area partner functions; a partner that is missing
      or flagged for deletion is copied into every new order.
    rule_authority: sap_hard_constraint
    sap_impact: Orders ship to, bill or charge an account that should no longer be used; billing to a deleted payer fails.
    fix_map:
      __other__: Replace the partner in the customer's sales-area partner functions (XD02 > Partner functions).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): partner {KNVP.PARVW} {KNVP.KUNN2}
      does not exist or is deleted.'
  - id: SDCM200
    field: KNVP.KUNNR
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.PARVW:
      - AG
    fields:
    - KNVP.KUNNR
    - KNVP.VKORG
    - KNVP.VTWEG
    - KNVP.SPART
    target_table: KNVP
    target_fields:
    - KUNNR
    - VKORG
    - VTWEG
    - SPART
    target_when:
      PARVW:
      - WE
    severity: high
    dimension: completeness
    message: Sold-to party has no ship-to partner function in the sales area
    why_it_matters: The partner determination procedure for a sold-to party requires a ship-to (WE). Without it in the sales
      area, VA01 stops at partner determination and the order cannot be saved or delivered.
    rule_authority: sap_hard_constraint
    sap_impact: Sales orders for the customer stay incomplete (no ship-to), so no delivery can be created.
    fix_map:
      __other__: Maintain partner function WE for the sales area (XD02 > Sales area data > Partner functions).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): no ship-to partner function.'
  - id: SDCM201
    field: KNVP.KUNNR
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.PARVW:
      - AG
    fields:
    - KNVP.KUNNR
    - KNVP.VKORG
    - KNVP.VTWEG
    - KNVP.SPART
    target_table: KNVP
    target_fields:
    - KUNNR
    - VKORG
    - VTWEG
    - SPART
    target_when:
      PARVW:
      - RE
    severity: high
    dimension: completeness
    message: Sold-to party has no bill-to partner function in the sales area
    why_it_matters: Billing copies the bill-to party (RE) from the order. A sold-to party without a bill-to in the sales area
      makes the order incomplete for billing and the invoice address cannot be determined.
    rule_authority: sap_hard_constraint
    sap_impact: Orders and deliveries cannot be billed until the partner is added manually.
    fix_map:
      __other__: Maintain partner function RE for the sales area (XD02 > Sales area data > Partner functions).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): no bill-to partner function.'
  - id: SDCM202
    field: KNVP.KUNNR
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.PARVW:
      - AG
    fields:
    - KNVP.KUNNR
    - KNVP.VKORG
    - KNVP.VTWEG
    - KNVP.SPART
    target_table: KNVP
    target_fields:
    - KUNNR
    - VKORG
    - VTWEG
    - SPART
    target_when:
      PARVW:
      - RG
    severity: high
    dimension: completeness
    message: Sold-to party has no payer partner function in the sales area
    why_it_matters: The payer (RG) carries the receivable, the credit check and the payment terms. A sold-to party without a
      payer in the sales area cannot be invoiced or credit-checked.
    rule_authority: sap_hard_constraint
    sap_impact: Billing documents cannot be posted to FI; credit management has no account to check against.
    fix_map:
      __other__: Maintain partner function RG for the sales area (XD02 > Sales area data > Partner functions).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): no payer partner function.'
  - id: SDCM203
    field: KNVP.KUNN2
    check_class: uniqueness_check
    grain: KNVP
    applies_when:
      KNVP.PARVW:
      - AG
      - RG
    fields:
    - KNVP.KUNNR
    - KNVP.VKORG
    - KNVP.VTWEG
    - KNVP.SPART
    - KNVP.PARVW
    severity: medium
    dimension: uniqueness
    message: Customer has more than one sold-to or payer partner in the same sales area
    why_it_matters: Sold-to and payer are unique partner functions in the standard partner procedure. Several entries trigger
      a selection pop-up in VA01 and lead to orders charged to the wrong payer.
    rule_authority: best_practice
    sap_impact: Order entry stops for a manual partner choice; receivables land on the wrong payer.
    fix_map:
      __other__: Keep one sold-to and one payer per sales area (XD02 > Partner functions) and delete the extra entries.
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): partner function {KNVP.PARVW} is maintained
      more than once.'
  - id: SDCM204
    field: KNVP.KUNN2
    check_class: cross_field_check
    grain: KNVP
    applies_when:
      KNVP.PARVW:
      - AG
    fail_when: '`KNVP.KUNN2` != `KNVP.KUNNR`'
    require_populated: true
    severity: high
    dimension: consistency
    message: Sold-to partner function points to another customer
    why_it_matters: The sold-to partner of a customer is the customer itself. A sold-to entry pointing to a different account
      means the account was copied from another customer and orders entered for it are booked to someone else.
    rule_authority: sap_hard_constraint
    sap_impact: Orders, pricing and statistics are recorded against the wrong sold-to party.
    fix_map:
      __other__: Correct the sold-to partner to the customer itself (XD02 > Partner functions).
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): sold-to partner is {KNVP.KUNN2}.'
  - id: SDCM205
    field: KNVP.KUNN2
    check_class: exists_check
    grain: KNVP
    applies_when:
      KNVP.PARVW:
      - WE
      - RE
      - RG
    fields:
    - KNVP.KUNN2
    - KNVP.VKORG
    - KNVP.VTWEG
    - KNVP.SPART
    target_table: KNVV
    target_fields:
    - KUNNR
    - VKORG
    - VTWEG
    - SPART
    target_when:
      LOEVM:
        blank: true
    severity: high
    dimension: consistency
    message: Ship-to, bill-to or payer is not extended to the sales area, or is flagged for deletion there
    why_it_matters: A partner used in a sales area must have its own sales-area data (KNVV) there. Without it SAP rejects the
      partner in the order ("not defined for sales area") and billing to a payer without sales data fails.
    rule_authority: sap_hard_constraint
    sap_impact: Order entry errors at partner determination; the payer has no billing or credit data in the sales area.
    fix_map:
      __other__: Extend the partner customer to the sales area (XD01 with reference) or replace the partner.
    record_fix_template: 'Customer {KNVP.KUNNR} ({KNVP.VKORG}/{KNVP.VTWEG}/{KNVP.SPART}): partner {KNVP.PARVW} {KNVP.KUNN2}
      has no active data in the sales area.'
  - id: SDCM206
    field: KNVV.VWERK
    check_class: null_check
    severity: low
    dimension: completeness
    message: Delivering plant is missing in the customer sales-area data
    why_it_matters: The delivering plant proposed into order items comes from the customer-material info, the customer (KNVV-VWERK)
      or the material. Without a customer default, items fall back to the material and often pick the wrong plant.
    rule_authority: best_practice
    sap_impact: Order items without plant cannot be checked for availability or delivered until a plant is entered.
    fix_map:
      __other__: Maintain the delivering plant in XD02 > Sales area data > Shipping.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): no delivering plant.'
  - id: SDCM207
    field: KNVV.LOEVM
    check_class: cross_field_check
    fail_when: (`KNVV.LOEVM` == 'X') & `KNVV.AUFSD`.isna() & `KNVV.LIFSD`.isna() & `KNVV.FAKSD`.isna()
    severity: medium
    dimension: consistency
    message: Sales area flagged for deletion is not blocked for orders, deliveries or billing
    why_it_matters: The deletion flag only marks the sales area for archiving; it does not stop new business. SAP's deletion
      check (and MDG's block-before-delete validation) expects the sales area to carry an order, delivery or billing block first,
      otherwise orders keep arriving on an account the business has retired.
    rule_authority: best_practice
    sap_impact: Orders, deliveries and invoices can still be created for a customer the business considers deleted, and archiving
      fails because new documents keep appearing.
    fix_map:
      __other__: Set a sales-area order block (VD05 or XD05) before or together with the deletion flag.
    record_fix_template: 'Customer {KNVV.KUNNR} ({KNVV.VKORG}/{KNVV.VTWEG}/{KNVV.SPART}): flagged for deletion but not blocked.'
