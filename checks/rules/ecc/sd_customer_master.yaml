      extension) is a typing error, a code from another country or a city name in the wrong field, so mail, invoices and deliveries
      go astray and the S/4HANA business partner conversion rejects the address once the country check is active.
    rule_authority: iso_standard
    sap_impact: Address validation, tax jurisdiction and transportation zone determination fail or pick the wrong value; the
      BP conversion rejects the address when the country's postal code check is active.
    fix_map:
      __other__: Correct the postal code in XD02/FD02 > Address. Activate the country's postal code check in SPRO > SAP NetWeaver
        > General Settings > Set Countries > Set country-specific checks (T005) so new entries are validated.
    record_fix_template: 'Customer {KNA1.KUNNR} in {KNA1.LAND1}: postal code does not have the national format.'
