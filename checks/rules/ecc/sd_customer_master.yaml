  - id: SDCM658
    field: KNKK.AEDAT
    check_class: cross_field_check
    fail_when: '`KNKK.AEDAT`.notna() & `KNKK.ERDAT`.notna() & (`KNKK.AEDAT` < `KNKK.ERDAT`)'
    grain: KNKK
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: low
    dimension: consistency
    message: Customer credit data was changed before it was created
    why_it_matters: KNKK.AEDAT is the last change and KNKK.ERDAT the creation date. A change before creation means one date
      was loaded wrongly, so the credit limit's change history is unreliable.
    rule_authority: sap_hard_constraint
    sap_impact: Credit limit audits (FD24) cannot be trusted for the customer.
    fix_map:
      __other__: Correct the creation or change date in the source and re-extract.
    record_fix_template: 'Customer {KNKK.KUNNR}, credit control area {KNKK.KKBER}: changed {actual_value} before creation.'
  - id: SDCM659
    field: KNKK.KLIMK
    check_class: cross_field_check
    fail_when: '`KNKK.KLIMK` < 0'
    grain: KNKK
    s4_area: credit_management
    s4_impact: blocking
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: high
    dimension: validity
    message: Customer credit limit is negative
    why_it_matters: A credit limit is an amount of exposure allowed. FD32 does not accept a negative limit; one in the data
      was loaded directly and blocks every order, and the FIN-FSCM-CR migration rejects it.
    rule_authority: sap_hard_constraint
    sap_impact: All orders fail the credit check; the credit limit migration to UKMBP_CMS_SGM fails.
    fix_map:
      __other__: Set the limit to zero or the approved amount in FD32.
    record_fix_template: 'Customer {KNKK.KUNNR}, credit control area {KNKK.KKBER}: credit limit {actual_value}.'
  - id: SDCM660
    field: KNKK.DBWAE
    check_class: null_check
    applies_when:
      KNKK.DBEKR:
        gt: 0
    grain: KNKK
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: low
    dimension: completeness
    message: Customer external recommended credit limit has no currency
    why_it_matters: KNKK.DBEKR is an amount in currency KNKK.DBWAE. Without the currency the amount cannot be compared with
      the credit limit or translated into the credit segment currency.
    rule_authority: best_practice
    sap_impact: The external recommended credit limit cannot be used in credit decisions or migrated.
    fix_map:
      __other__: Enter the currency for the external recommended credit limit in FD32 or the rating interface.
    record_fix_template: 'Customer {KNKK.KUNNR}, credit control area {KNKK.KKBER}: external recommended credit limit without
      currency.'
  - id: SDCM661
    field: KNKK.CASHC
    check_class: null_check
    applies_when:
      KNKK.CASHA:
        gt: 0
    grain: KNKK
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: low
    dimension: completeness
    message: Customer last payment amount has no currency
    why_it_matters: KNKK.CASHA is an amount in currency KNKK.CASHC. Without the currency the amount cannot be compared with
      the credit limit or translated into the credit segment currency.
    rule_authority: best_practice
    sap_impact: The last payment amount cannot be used in credit decisions or migrated.
    fix_map:
      __other__: Enter the currency for the last payment amount in FD32 or the rating interface.
    record_fix_template: 'Customer {KNKK.KUNNR}, credit control area {KNKK.KKBER}: last payment amount without currency.'
  - id: SDCM662
    field: KNKK.KLIMK
    check_class: cross_field_check
    fail_when: '`KNKK.KNKLI`.notna() & (`KNKK.KNKLI` != `KNKK.KUNNR`) & (`KNKK.KLIMK` > 0)'
    grain: KNKK
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: medium
    dimension: consistency
    message: Credit limit is held on a customer whose credit account is another customer
    why_it_matters: When KNKK.KNKLI names a different customer, the credit check uses that credit account's limit and exposure.
      A limit kept on the dependent customer is never used, misleads credit staff and is migrated to FSCM as a separate limit.
    rule_authority: best_practice
    sap_impact: Credit staff read a limit that does not govern orders, and FSCM migration creates a second limit.
    fix_map:
      __other__: Remove the limit from the dependent customer or make it its own credit account (FD32).
    record_fix_template: 'Customer {KNKK.KUNNR}, credit control area {KNKK.KKBER}: credit limit held although credit account
      is {KNKK.KNKLI}.'
  - id: SDCM663
    field: KNKA.KLIME
    check_class: cross_field_check
    fail_when: (`KNKA.KLIMG` > 0) & (`KNKA.KLIME` > `KNKA.KLIMG`)
    grain: KNKA
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: medium
    dimension: consistency
    message: Maximum individual credit limit is higher than the customer's total credit limit
    why_it_matters: KNKA.KLIMG is the total limit across all credit control areas and KNKA.KLIME the most any single area may
      grant. An individual maximum above the total cannot be reached and shows one of the two was mis-keyed.
    rule_authority: sap_hard_constraint
    sap_impact: FD32 enforces the wrong ceiling on area limits.
    fix_map:
      __other__: Correct the total or individual maximum in FD32 > Central data.
    record_fix_template: 'Customer {KNKA.KUNNR}: individual maximum {actual_value} above the total limit.'
  - id: SDCM664
    field: KNKA.KLIMG
    check_class: cross_field_check
    fail_when: (`KNKA.KLIMG` < 0) | (`KNKA.KLIME` < 0)
    grain: KNKA
    s4_area: credit_management
    s4_impact: warning
    simplification_item: Credit Management - FI-AR-CR replaced by FIN-FSCM-CR
    baseline: s4_target
    severity: high
    dimension: validity
    message: Customer central credit limit is negative
    why_it_matters: Credit limits are allowed exposure and cannot be negative. A negative total or individual maximum was loaded
      outside FD32.
    rule_authority: sap_hard_constraint
    sap_impact: Area limits cannot be maintained and the migration rejects the limit.
    fix_map:
      __other__: Correct the central limits in FD32.
    record_fix_template: 'Customer {KNKA.KUNNR}: negative central credit limit.'
  - id: SDCM665
    field: KNKA.DLAUS
