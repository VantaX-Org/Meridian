      1).str.upper() == ''C'') & (`KNA1.REGIO` == ''PE'')) | ((`KNA1.PSTLZ`.str.slice(0, 1).str.upper() == ''E'') & (`KNA1.REGIO`
      == ''NB'')) | (`KNA1.PSTLZ`.str.slice(0, 1).str.upper().isin([''G'', ''H'', ''J'']) & (`KNA1.REGIO` == ''QC'')) | (`KNA1.PSTLZ`.str.slice(0,
      1).str.upper().isin([''K'', ''L'', ''M'', ''N'', ''P'']) & (`KNA1.REGIO` == ''ON'')) | ((`KNA1.PSTLZ`.str.slice(0, 1).str.upper()
      == ''R'') & (`KNA1.REGIO` == ''MB'')) | ((`KNA1.PSTLZ`.str.slice(0, 1).str.upper() == ''S'') & (`KNA1.REGIO` == ''SK''))
      | ((`KNA1.PSTLZ`.str.slice(0, 1).str.upper() == ''T'') & (`KNA1.REGIO` == ''AB'')) | ((`KNA1.PSTLZ`.str.slice(0, 1).str.upper()
      == ''V'') & (`KNA1.REGIO` == ''BC'')) | ((`KNA1.PSTLZ`.str.slice(0, 1).str.upper() == ''X'') & `KNA1.REGIO`.isin([''NT'',
      ''NU''])) | ((`KNA1.PSTLZ`.str.slice(0, 1).str.upper() == ''Y'') & (`KNA1.REGIO` == ''YT'')))'
    require_populated: true
    applies_when:
      KNA1.LAND1:
      - CA
    grain: KNA1
    severity: medium
    dimension: consistency
    message: Canadian province does not match the first letter of the postal code
    why_it_matters: The first letter of a Canadian postal code identifies the province (A Newfoundland, B Nova Scotia, G/H/J
      Quebec, K-P Ontario, R Manitoba, S Saskatchewan, T Alberta, V British Columbia, X Northwest Territories and Nunavut, Y
      Yukon). A mismatch means either the region or the postal code is wrong, and the region determines GST/HST/PST/QST.
    rule_authority: iso_standard
    sap_impact: Sales tax is calculated for the wrong province and delivery routing uses the wrong region.
    fix_map:
      __other__: Check the address with the customer and correct the region or the postal code in XD02.
    record_fix_template: 'Customer {KNA1.KUNNR}: province {KNA1.REGIO} does not match the postal code.'
  - id: SDCM331
    field: KNA1.REGIO
    check_class: cross_field_check
    fail_when: (`KNA1.REGIO` == 'NSW') & ~(((`KNA1.PSTLZ` >= '1000') & (`KNA1.PSTLZ` <= '2599')) | ((`KNA1.PSTLZ` >= '2619')
      & (`KNA1.PSTLZ` <= '2899')) | ((`KNA1.PSTLZ` >= '2921') & (`KNA1.PSTLZ` <= '2999'))) | (`KNA1.REGIO` == 'VIC') & ~(((`KNA1.PSTLZ`
