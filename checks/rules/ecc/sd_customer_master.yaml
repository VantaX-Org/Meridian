  - id: SDCM353
    field: KNA1.STCEG
    check_class: cross_field_check
    fail_when: '`KNA1.STCEG`.str.startswith(''GR'')'
    grain: KNA1
    severity: high
    dimension: validity
    message: Greek VAT registration number uses the ISO prefix GR instead of EL
    why_it_matters: Greece's VAT numbers carry the prefix EL in the EU VAT system, not the ISO country code GR. VIES does not
      know GR numbers, so every validation, EC sales list line and intra-community invoice citing it fails.
    rule_authority: regulatory
    sap_impact: VIES validation and the EC sales list reject the number.
    fix_map:
      __other__: Replace the prefix GR with EL in XD02 > Control data > VAT registration number.
    record_fix_template: 'Customer {KNA1.KUNNR}: Greek VAT number starts with GR instead of EL.'
  - id: SDCM354
    field: KNA1.STCEG
    check_class: regex_check
    pattern: ^[A-Z]{2,3}[-.0-9A-Z+*]*$
    grain: KNA1
    severity: medium
    dimension: validity
    message: VAT registration number contains spaces, lower-case letters or characters VIES does not accept
    why_it_matters: VIES and the EC sales list accept the country prefix and the number without spaces or lower-case letters.
      Blanks, slashes or lower-case prefixes stop SAP's duplicate check and the external validation from matching the number,
      so the same registration is created twice and the electronic return is rejected.
    rule_authority: regulatory
    sap_impact: The EC sales list file and VIES checks reject the number; duplicates are not detected.
    fix_map:
      __other__: Remove the spaces and special characters and write the prefix in capitals (XD02 > Control data).
    record_fix_template: 'Customer {KNA1.KUNNR}: VAT registration number contains spaces or invalid characters.'
  - id: SDCM355
    field: KNA1.STCEG
    check_class: cross_field_check
    fail_when: '`KNA1.STCEG`.str.slice(2).str.replace(''[^0-9]'', '''', regex=True) != `KNA1.STCD2`.str.replace(''[^0-9]'',
      '''', regex=True)'
    require_populated: true
    applies_when:
      KNA1.LAND1:
      - IT
      KNA1.STCEG:
        startswith:
        - IT
    grain: KNA1
    severity: medium
    dimension: consistency
    message: Italian VAT number differs from the partita IVA in tax number 2
    why_it_matters: An Italian VAT registration number is IT followed by the eleven-digit partita IVA, which SAP's Italian localisation
      stores in tax number 2. Two different numbers mean one belongs to another company; the FatturaPA e-invoice and the esterometro
      read both.
    rule_authority: regulatory
    sap_impact: Electronic invoices to SDI carry conflicting identifiers and are rejected.
    fix_map:
      __other__: Verify the partita IVA with the customer and correct tax number 2 or the VAT number in XD02.
    record_fix_template: 'Customer {KNA1.KUNNR}: VAT number and partita IVA (tax number 2) differ.'
  - id: SDCM356
    field: KNA1.STCEG
    check_class: cross_field_check
    fail_when: '`KNA1.STCEG`.str.slice(2) != `KNA1.STCD1`.str.replace(''[^0-9A-Z]'', '''', regex=True)'
    require_populated: true
    applies_when:
      KNA1.LAND1:
      - ES
      KNA1.STCEG:
        startswith:
        - ES
    grain: KNA1
    severity: medium
    dimension: consistency
    message: Spanish VAT number differs from the NIF in tax number 1
    why_it_matters: A Spanish VAT registration number is ES followed by the NIF, which the Spanish localisation stores in tax
      number 1. Different numbers mean one belongs to another party; SII and Modelo 347/349 report both.
    rule_authority: regulatory
    sap_impact: SII submissions and Modelo 347/349 carry conflicting identifiers and are rejected.
    fix_map:
      __other__: Verify the NIF and correct tax number 1 or the VAT number in XD02.
    record_fix_template: 'Customer {KNA1.KUNNR}: VAT number and NIF (tax number 1) differ.'
  - id: SDCM357
    field: KNA1.STCEG
    check_class: cross_field_check
    fail_when: '`KNA1.STCEG`.str.slice(2) != `KNA1.STCD1`.str.replace(''[^0-9]'', '''', regex=True)'
    require_populated: true
    applies_when:
      KNA1.LAND1:
      - PT
      KNA1.STCEG:
        startswith:
        - PT
    grain: KNA1
    severity: medium
    dimension: consistency
    message: Portuguese VAT number differs from the NIF in tax number 1
    why_it_matters: A Portuguese VAT registration number is PT followed by the nine-digit NIF stored in tax number 1. Different
      numbers mean one belongs to another party; SAF-T PT and the certified invoice carry the NIF.
    rule_authority: regulatory
    sap_impact: SAF-T PT and certified invoices carry a NIF that does not match the VAT registration.
    fix_map:
      __other__: Verify the NIF and correct tax number 1 or the VAT number in XD02.
    record_fix_template: 'Customer {KNA1.KUNNR}: VAT number and NIF (tax number 1) differ.'
  - id: SDCM358
    field: KNAS.KUNNR
    check_class: exists_check
    fields:
    - KNAS.KUNNR
    target_table: KNA1
    target_fields:
    - KUNNR
    grain: KNAS
    severity: medium
    dimension: consistency
    message: Foreign VAT registration belongs to a customer that does not exist
    why_it_matters: KNAS holds a customer's VAT numbers in other EU states and hangs off KNA1. A row without its customer is
      an orphan from an incomplete deletion or legacy load; the CVI synchronisation and the BP tax number migration still read
      it.
    rule_authority: sap_hard_constraint
    sap_impact: The orphan VAT number is migrated or reported for a customer that does not exist.
    fix_map:
      __other__: Delete the orphan KNAS rows or create the missing customer.
    record_fix_template: 'Customer {KNAS.KUNNR}, country {KNAS.LAND1}: customer does not exist.'
  - id: SDCM359
    field: KNAS.STCEG
    check_class: null_check
    grain: KNAS
    severity: medium
    dimension: completeness
    message: Foreign VAT registration row has no VAT number
    why_it_matters: A KNAS row says the customer is VAT-registered in another EU state; without the number SAP cannot print
      it on invoices for deliveries taxed there, and tax determination by destination country has nothing to report.
    rule_authority: best_practice
    sap_impact: Invoices and EC sales list lines for that country lack the customer's local VAT number.
    fix_map:
      __other__: Enter the VAT number in XD02 > Control data > Other VAT numbers, or delete the row.
    record_fix_template: 'Customer {KNAS.KUNNR}, country {KNAS.LAND1}: no VAT number.'
  - id: SDCM360
    field: KNAS.STCEG
    check_class: cross_field_check
    fail_when: (`KNAS.STCEG`.str.slice(0, 2).str.upper() != `KNAS.LAND1`) & ~((`KNAS.LAND1` == 'GR') & (`KNAS.STCEG`.str.slice(0,
      2).str.upper() == 'EL')) & ~((`KNAS.LAND1` == 'GB') & (`KNAS.STCEG`.str.slice(0, 2).str.upper() == 'XI'))
    require_populated: true
    grain: KNAS
    severity: high
    dimension: consistency
    message: Foreign VAT number prefix does not match the country of the registration
    why_it_matters: Every VAT number starts with the code of the issuing member state (EL for Greece, XI for Northern Ireland).
      A number filed under another country is either a wrong number or a wrong country, and SAP prints it on invoices for deliveries
      into that country.
    rule_authority: regulatory
    sap_impact: Invoices and the EC sales list cite a VAT number of another country.
    fix_map:
      __other__: Move the VAT number to the right country or correct it (XD02 > Control data > Other VAT numbers).
    record_fix_template: 'Customer {KNAS.KUNNR}, country {KNAS.LAND1}: VAT number prefix does not match the country.'
  - id: SDCM361
    field: KNAS.STCEG
    check_class: regex_check
    pattern: ^[A-Z]{2}[0-9A-Z+*]{2,13}$
    grain: KNAS
    severity: medium
    dimension: validity
    message: Foreign VAT registration number is not a two-letter prefix followed by the national number
    why_it_matters: An EU VAT number is the two-letter member-state prefix and two to thirteen letters or digits, without spaces
      or punctuation. Anything else is not accepted by VIES or the EC sales list.
    rule_authority: regulatory
    sap_impact: VIES validation and the EC sales list reject the number.
    fix_map:
      __other__: Correct the VAT number in XD02 > Control data > Other VAT numbers.
    record_fix_template: 'Customer {KNAS.KUNNR}, country {KNAS.LAND1}: VAT number has the wrong format.'
  - id: SDCM362
    field: KNAS.STCEG
    check_class: uniqueness_check
    fields:
    - KNAS.LAND1
    - KNAS.STCEG
    normalize: alnum
    grain: KNAS
    severity: medium
    dimension: uniqueness
    message: Several customers carry the same foreign VAT registration number
    why_it_matters: A VAT number identifies one taxable person. The same foreign VAT number on several customers means duplicate
      customers or a number copied onto the wrong account; credit exposure and the EC sales list are split across them.
    rule_authority: regulatory
    sap_impact: Duplicate customers survive into the BP conversion and EC sales list totals are split.
    fix_map:
      __other__: Merge the duplicates or correct the wrong VAT number (XD02 > Control data > Other VAT numbers).
    record_fix_template: 'Customer {KNAS.KUNNR}, country {KNAS.LAND1}: VAT number shared with another customer.'
  - id: SDCM363
    field: KNAS.LAND1
    check_class: exists_check
    fields:
    - KNAS.LAND1
    target_table: T005
    target_fields:
    - LAND1
    grain: KNAS
    severity: medium
    dimension: validity
    message: Foreign VAT registration is filed under a country that is not defined
    why_it_matters: KNAS.LAND1 must be a country in T005. An undefined country cannot be matched to a delivery country, so the
      number is never printed and cannot be migrated to the BP tax numbers.
    rule_authority: sap_hard_constraint
    sap_impact: The VAT number is never used and fails the BP tax number migration.
