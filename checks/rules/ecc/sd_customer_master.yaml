  - id: SDCM617
    field: TIBAN.IBAN
    check_class: cross_field_check
    fail_when: '`TIBAN.IBAN`.str.startswith(''DE'') & (`TIBAN.IBAN`.str.len() == 22) & `TIBAN.BANKL`.notna() & (`TIBAN.IBAN`.str.slice(4,
      12) != `TIBAN.BANKL`)'
    applies_when:
      TIBAN.BANKS:
      - DE
      TIBAN.TABNAME:
      - KNBK
    grain: TIBAN
    severity: high
    dimension: consistency
    message: DE customer IBAN does not contain the bank code (Bankleitzahl) held for the account
    why_it_matters: A DE IBAN carries the domestic bank code (Bankleitzahl) in positions 5-12 (ISO 13616 national BBAN format).
      SAP pays and collects with the IBAN but clears, matches bank statements and checks the bank master with TIBAN.BANKL. When
      the two disagree one of them belongs to another account.
    rule_authority: iso_standard
    sap_impact: Direct debits go to the account in the IBAN while statements and the bank master point at another, or the bank
      rejects the mandate; electronic bank statement matching fails.
    fix_map:
      __other__: Confirm the account with the customer and regenerate the IBAN from the bank details, or correct the bank details
        to match the IBAN (XD02 > Payment transactions).
    record_fix_template: 'Customer IBAN in TIBAN.BANKS: bank code (Bankleitzahl) in the IBAN differs from TIBAN.BANKL.'
