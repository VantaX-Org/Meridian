    message: Telephone number of the address contains text or is too short to dial
    why_it_matters: The telephone number of the address is dialled by people, CTI and the S/4HANA business partner, which normalises
      it into TELNR_LONG. Letters, words or fewer than five digits ('see e-mail', 'ext 12', '011') cannot be dialled or normalised;
      extensions belong in the extension field.
    rule_authority: best_practice
    sap_impact: Calls, faxes and CTI lookups fail; the number is migrated unnormalised to the BP.
    fix_map:
      __other__: Enter only digits, spaces and the separators ( ) - / . with an optional leading +; move extensions to the extension
        field (XD02 > Address > Communication).
    record_fix_template: 'Address {ADR2.ADDRNUMBER}, number {ADR2.CONSNUMBER}: telephone cannot be dialled.'
  - id: SDCM387
    field: ADR3.FAX_NUMBER
    check_class: regex_check
    pattern: ^[+]?[(]?[0-9][0-9 ()./-]{3,}[0-9]$
    grain: ADR3
    severity: low
    dimension: validity
    message: Fax number of the address contains text or is too short to dial
    why_it_matters: The fax number of the address is dialled by people, CTI and the S/4HANA business partner, which normalises
      it into TELNR_LONG. Letters, words or fewer than five digits ('see e-mail', 'ext 12', '011') cannot be dialled or normalised;
      extensions belong in the extension field.
    rule_authority: best_practice
    sap_impact: Calls, faxes and CTI lookups fail; the number is migrated unnormalised to the BP.
    fix_map:
      __other__: Enter only digits, spaces and the separators ( ) - / . with an optional leading +; move extensions to the extension
        field (XD02 > Address > Communication).
    record_fix_template: 'Address {ADR3.ADDRNUMBER}, number {ADR3.CONSNUMBER}: fax number cannot be dialled.'
  - id: SDCM388
    field: ADR2.TEL_EXTENS
    check_class: regex_check
    pattern: ^[0-9]{1,10}$
    grain: ADR2
    severity: low
    dimension: validity
    message: Telephone extension contains characters other than digits
    why_it_matters: SAP appends the telephone extension to the number to build the dialable long number. Words such as 'ext.',
      names or a second number in the field make the long number undialable.
    rule_authority: best_practice
    sap_impact: The normalised long number cannot be dialled or matched.
    fix_map:
      __other__: Keep only the extension digits; move a second number to its own communication entry.
    record_fix_template: 'Address {ADR2.ADDRNUMBER}, number {ADR2.CONSNUMBER}: extension is not numeric.'
  - id: SDCM389
    field: ADR3.FAX_EXTENS
    check_class: regex_check
    pattern: ^[0-9]{1,10}$
    grain: ADR3
    severity: low
    dimension: validity
    message: Fax extension contains characters other than digits
    why_it_matters: SAP appends the fax extension to the number to build the dialable long number. Words such as 'ext.', names
      or a second number in the field make the long number undialable.
    rule_authority: best_practice
    sap_impact: The normalised long number cannot be dialled or matched.
    fix_map:
      __other__: Keep only the extension digits; move a second number to its own communication entry.
    record_fix_template: 'Address {ADR3.ADDRNUMBER}, number {ADR3.CONSNUMBER}: extension is not numeric.'
  - id: SDCM390
    field: ADR2.TEL_EXTENS
    check_class: cross_field_check
    fail_when: '`ADR2.TEL_NUMBER`.isna()'
    applies_when:
      ADR2.TEL_EXTENS:
        populated: true
    grain: ADR2
    severity: low
    dimension: completeness
    message: Telephone extension recorded without a telephone number
    why_it_matters: An extension is only reachable through its main number. Without TEL_NUMBER the communication entry cannot
      be dialled and SAP cannot build the long number.
    rule_authority: best_practice
    sap_impact: The entry is useless for calls and is migrated as an empty phone number.
    fix_map:
      __other__: Enter the main number or delete the entry (XD02 > Address > Communication > Telephone).
    record_fix_template: 'Address {ADR2.ADDRNUMBER}, number {ADR2.CONSNUMBER}: extension without a telephone number.'
  - id: SDCM391
    field: ADR3.FAX_EXTENS
    check_class: cross_field_check
    fail_when: '`ADR3.FAX_NUMBER`.isna()'
    applies_when:
      ADR3.FAX_EXTENS:
        populated: true
    grain: ADR3
    severity: low
    dimension: completeness
    message: Fax extension recorded without a fax number
    why_it_matters: An extension is only reachable through its main number. Without FAX_NUMBER the fax entry cannot be used
      for output and SAP cannot build the long number.
    rule_authority: best_practice
    sap_impact: Fax output for the customer fails.
    fix_map:
      __other__: Enter the fax number or delete the entry (XD02 > Address > Communication > Fax).
    record_fix_template: 'Address {ADR3.ADDRNUMBER}, number {ADR3.CONSNUMBER}: extension without a fax number.'
  - id: SDCM392
    field: ADR3.FAX_NUMBER
    check_class: null_check
    grain: ADR3
    severity: medium
    dimension: completeness
    message: Fax communication entry has no fax number
    why_it_matters: An ADR3 row exists only to hold a fax number. A row without it is an empty communication entry; if it is
      the default, output determination picks fax and sends nothing.
    rule_authority: best_practice
    sap_impact: Fax output for the address fails silently.
    fix_map:
      __other__: Enter the fax number or delete the entry (XD02 > Address > Communication > Fax).
    record_fix_template: 'Address {ADR3.ADDRNUMBER}, number {ADR3.CONSNUMBER}: no fax number.'
  - id: SDCM393
    field: ADR3.COUNTRY
    check_class: null_check
    applies_when:
      ADR3.FAX_NUMBER:
        populated: true
    grain: ADR3
    severity: low
    dimension: completeness
    message: Fax number has no country for the dialling code
    why_it_matters: SAP derives the international dialling code from the fax entry's country to build FAXNR_LONG. Without it
      the fax server cannot dial the number internationally.
    rule_authority: best_practice
    sap_impact: Faxes to the number cannot be dialled from another country and the long number stays empty.
    fix_map:
      __other__: Enter the country on the fax entry (XD02 > Address > Communication > Fax).
    record_fix_template: 'Address {ADR3.ADDRNUMBER}, number {ADR3.CONSNUMBER}: fax number has no country.'
  - id: SDCM394
    field: ADR2.COUNTRY
    check_class: null_check
    applies_when:
      ADR2.TEL_NUMBER:
        populated: true
    grain: ADR2
    severity: low
    dimension: completeness
    message: Telephone number has no country for the dialling code
    why_it_matters: SAP derives the international dialling code from the telephone entry's country to build TELNR_LONG. Without
      it the number cannot be normalised or dialled from abroad.
    rule_authority: best_practice
    sap_impact: The normalised long number stays empty and CTI matching fails.
    fix_map:
      __other__: Enter the country on the telephone entry (XD02 > Address > Communication > Telephone).
    record_fix_template: 'Address {ADR2.ADDRNUMBER}, number {ADR2.CONSNUMBER}: telephone number has no country.'
  - id: SDCM395
    field: ADR2.TELNR_LONG
    check_class: cross_field_check
    fail_when: '`ADR2.TELNR_LONG`.isna()'
    applies_when:
      ADR2.TEL_NUMBER:
        populated: true
    grain: ADR2
    severity: low
    dimension: completeness
    message: Telephone number was never normalised into the complete international number
    why_it_matters: Business Address Services fills TELNR_LONG (+country code, number and extension) whenever a number is saved
      through the address dialog. An empty long number means the row was written directly by a load program; CTI, telephony
      integration and the BP search by number do not find it.
    rule_authority: best_practice
    sap_impact: Inbound calls are not matched to the customer and the number is migrated unnormalised.
    fix_map:
      __other__: Re-save the address in XD02 or run report RSADRLSM02 / ADDR_NORMALIZE to normalise the numbers.
    record_fix_template: 'Address {ADR2.ADDRNUMBER}, number {ADR2.CONSNUMBER}: no normalised long number.'
  - id: SDCM396
    field: ADR3.FAXNR_LONG
    check_class: cross_field_check
    fail_when: '`ADR3.FAXNR_LONG`.isna()'
    applies_when:
      ADR3.FAX_NUMBER:
        populated: true
    grain: ADR3
    severity: low
    dimension: completeness
    message: Fax number was never normalised into the complete international number
    why_it_matters: Business Address Services fills FAXNR_LONG whenever a fax number is saved through the address dialog. An
      empty long number means a load program wrote the row directly; the fax server dials the long number.
    rule_authority: best_practice
    sap_impact: Fax output to the customer cannot be dialled.
    fix_map:
      __other__: Re-save the address in XD02 or run the address normalisation report.
    record_fix_template: 'Address {ADR3.ADDRNUMBER}, number {ADR3.CONSNUMBER}: no normalised long fax number.'
  - id: SDCM397
    field: ADR2.TELNR_LONG
    check_class: regex_check
    pattern: ^[+][0-9]
    grain: ADR2
    severity: low
    dimension: validity
    message: Normalised telephone number does not start with + and the country code
    why_it_matters: TELNR_LONG is the international form of the number (+27 16 973 4400). A value without the leading + and
      country code was written by a load program, so CTI matching and dialling from another country fail.
    rule_authority: best_practice
    sap_impact: Inbound calls are not matched and outbound dialling from other countries fails.
    fix_map:
      __other__: Re-save the address in XD02 or run the address normalisation report.
    record_fix_template: 'Address {ADR2.ADDRNUMBER}, number {ADR2.CONSNUMBER}: long number is not in international form.'
  - id: SDCM398
    field: ADR3.FAXNR_LONG
    check_class: regex_check
    pattern: ^[+][0-9]
    grain: ADR3
    severity: low
    dimension: validity
    message: Normalised fax number does not start with + and the country code
    why_it_matters: FAXNR_LONG is the international form the fax server dials. A value without + and country code was written
      by a load program and cannot be dialled across borders.
    rule_authority: best_practice
    sap_impact: Fax output to the customer from another country fails.
    fix_map:
      __other__: Re-save the address in XD02 or run the address normalisation report.
    record_fix_template: 'Address {ADR3.ADDRNUMBER}, number {ADR3.CONSNUMBER}: long fax number is not in international form.'
  - id: SDCM399
    field: ADR2.VALID_TO
    check_class: cross_field_check
    fail_when: '`ADR2.VALID_TO` < `ADR2.VALID_FROM`'
    require_populated: true
    grain: ADR2
    severity: low
    dimension: consistency
    message: Validity of the telephone number ends before it starts
    why_it_matters: VALID_FROM and VALID_TO bound the period the telephone number may be used. An end before the start makes
      the entry never valid, so it is silently skipped by output and the BP conversion carries an impossible period.
    rule_authority: sap_hard_constraint
    sap_impact: The telephone number is never used although it looks maintained.
    fix_map:
      __other__: Correct the validity period of the telephone number (XD02 > Communication > validity).
    record_fix_template: 'Address {ADR2.ADDRNUMBER}, number {ADR2.CONSNUMBER}: validity ends before it starts.'
  - id: SDCM400
    field: ADR2.ADDRNUMBER
    check_class: uniqueness_check
    fields:
    - ADR2.ADDRNUMBER
    - ADR2.DATE_FROM
    - ADR2.FLGDEFAULT
    applies_when:
      ADR2.FLGDEFAULT:
      - X
      ADR2.PERSNUMBER:
        blank: true
    grain: ADR2
    severity: medium
    dimension: uniqueness
    message: Address has more than one default telephone number
    why_it_matters: Business Address Services allows exactly one default telephone number per address; output, the KNA1 shadow
      fields and the BP conversion read the default. Several defaults come from direct table loads, and which one is used is
      undefined.
    rule_authority: sap_hard_constraint
    sap_impact: Output and the BP conversion pick an arbitrary telephone number.
    fix_map:
      __other__: Keep one default telephone number per address (XD02 > Communication) and clear the flag on the others.
    record_fix_template: 'Address {ADR2.ADDRNUMBER}: several default telephone numbers.'
  - id: SDCM401
    field: ADR2.TEL_NUMBER
    check_class: uniqueness_check
    fields:
    - ADR2.ADDRNUMBER
    - ADR2.DATE_FROM
    - ADR2.TEL_NUMBER
    normalize: alnum
    applies_when:
      ADR2.PERSNUMBER:
        blank: true
      ADR2.TEL_EXTENS:
        blank: true
    grain: ADR2
    severity: low
    dimension: uniqueness
    message: Same telephone number entered twice on one address
    why_it_matters: Duplicate communication entries arise from repeated loads and merges. They double every telephone number
      in output and in the BP conversion, and only one of them carries the default and usage flags.
    rule_authority: best_practice
    sap_impact: Output and contact lists show the same telephone number twice; flags diverge between the copies.
    fix_map:
      __other__: Delete the duplicate telephone number (XD02 > Communication).
    record_fix_template: 'Address {ADR2.ADDRNUMBER}: duplicate telephone number.'
  - id: SDCM402
    field: ADR3.FLGDEFAULT
    check_class: cross_field_check
    fail_when: '`ADR3.FLG_NOUSE` == ''X'''
    applies_when:
      ADR3.FLGDEFAULT:
      - X
    grain: ADR3
    severity: medium
    dimension: consistency
    message: Default fax number is flagged as not to be used
    why_it_matters: The default fax number is the one output determination sends to. Flagging it 'do not use' at the same time
      leaves the customer with no usable default, and fax output fails or picks an arbitrary other number.
    rule_authority: sap_hard_constraint
    sap_impact: Fax output for the customer fails or goes to a non-default number.
    fix_map:
      __other__: Make another fax number the default or clear the 'do not use' flag (XD02 > Communication).
    record_fix_template: 'Address {ADR3.ADDRNUMBER}, number {ADR3.CONSNUMBER}: default fax flagged do-not-use.'
  - id: SDCM403
    field: ADR3.VALID_TO
    check_class: cross_field_check
    fail_when: '`ADR3.VALID_TO` < `ADR3.VALID_FROM`'
    require_populated: true
    grain: ADR3
    severity: low
    dimension: consistency
    message: Validity of the fax number ends before it starts
    why_it_matters: VALID_FROM and VALID_TO bound the period the fax number may be used. An end before the start makes the entry
      never valid, so it is silently skipped by output and the BP conversion carries an impossible period.
    rule_authority: sap_hard_constraint
    sap_impact: The fax number is never used although it looks maintained.
    fix_map:
      __other__: Correct the validity period of the fax number (XD02 > Communication > validity).
    record_fix_template: 'Address {ADR3.ADDRNUMBER}, number {ADR3.CONSNUMBER}: validity ends before it starts.'
  - id: SDCM404
    field: ADR3.ADDRNUMBER
    check_class: uniqueness_check
    fields:
    - ADR3.ADDRNUMBER
    - ADR3.DATE_FROM
    - ADR3.FLGDEFAULT
    applies_when:
      ADR3.FLGDEFAULT:
      - X
      ADR3.PERSNUMBER:
        blank: true
    grain: ADR3
    severity: medium
    dimension: uniqueness
    message: Address has more than one default fax number
    why_it_matters: Business Address Services allows exactly one default fax number per address; output, the KNA1 shadow fields
      and the BP conversion read the default. Several defaults come from direct table loads, and which one is used is undefined.
    rule_authority: sap_hard_constraint
    sap_impact: Output and the BP conversion pick an arbitrary fax number.
    fix_map:
      __other__: Keep one default fax number per address (XD02 > Communication) and clear the flag on the others.
    record_fix_template: 'Address {ADR3.ADDRNUMBER}: several default fax numbers.'
  - id: SDCM405
    field: ADR3.FAX_NUMBER
    check_class: uniqueness_check
    fields:
    - ADR3.ADDRNUMBER
    - ADR3.DATE_FROM
    - ADR3.FAX_NUMBER
    normalize: alnum
    applies_when:
      ADR3.PERSNUMBER:
        blank: true
      ADR3.FAX_EXTENS:
        blank: true
    grain: ADR3
    severity: low
    dimension: uniqueness
    message: Same fax number entered twice on one address
    why_it_matters: Duplicate communication entries arise from repeated loads and merges. They double every fax number in output
      and in the BP conversion, and only one of them carries the default and usage flags.
    rule_authority: best_practice
    sap_impact: Output and contact lists show the same fax number twice; flags diverge between the copies.
    fix_map:
      __other__: Delete the duplicate fax number (XD02 > Communication).
    record_fix_template: 'Address {ADR3.ADDRNUMBER}: duplicate fax number.'
  - id: SDCM406
    field: ADR6.VALID_TO
    check_class: cross_field_check
    fail_when: '`ADR6.VALID_TO` < `ADR6.VALID_FROM`'
    require_populated: true
    grain: ADR6
    severity: low
    dimension: consistency
    message: Validity of the e-mail address ends before it starts
    why_it_matters: VALID_FROM and VALID_TO bound the period the e-mail address may be used. An end before the start makes the
      entry never valid, so it is silently skipped by output and the BP conversion carries an impossible period.
    rule_authority: sap_hard_constraint
    sap_impact: The e-mail address is never used although it looks maintained.
    fix_map:
      __other__: Correct the validity period of the e-mail address (XD02 > Communication > validity).
    record_fix_template: 'Address {ADR6.ADDRNUMBER}, number {ADR6.CONSNUMBER}: validity ends before it starts.'
  - id: SDCM407
    field: ADR6.ADDRNUMBER
    check_class: uniqueness_check
    fields:
    - ADR6.ADDRNUMBER
    - ADR6.DATE_FROM
    - ADR6.FLGDEFAULT
    applies_when:
      ADR6.FLGDEFAULT:
      - X
      ADR6.PERSNUMBER:
        blank: true
    grain: ADR6
    severity: medium
    dimension: uniqueness
    message: Address has more than one default e-mail address
    why_it_matters: Business Address Services allows exactly one default e-mail address per address; output, the KNA1 shadow
      fields and the BP conversion read the default. Several defaults come from direct table loads, and which one is used is
      undefined.
    rule_authority: sap_hard_constraint
    sap_impact: Output and the BP conversion pick an arbitrary e-mail address.
    fix_map:
      __other__: Keep one default e-mail address per address (XD02 > Communication) and clear the flag on the others.
    record_fix_template: 'Address {ADR6.ADDRNUMBER}: several default e-mail addresss.'
  - id: SDCM408
    field: ADR6.SMTP_ADDR
    check_class: uniqueness_check
    fields:
    - ADR6.ADDRNUMBER
    - ADR6.DATE_FROM
    - ADR6.SMTP_ADDR
    case_insensitive: true
    applies_when:
      ADR6.PERSNUMBER:
        blank: true
    grain: ADR6
    severity: low
    dimension: uniqueness
    message: Same e-mail address entered twice on one address
    why_it_matters: Duplicate communication entries arise from repeated loads and merges. They double every e-mail address in
      output and in the BP conversion, and only one of them carries the default and usage flags.
    rule_authority: best_practice
    sap_impact: Output and contact lists show the same e-mail address twice; flags diverge between the copies.
    fix_map:
      __other__: Delete the duplicate e-mail address (XD02 > Communication).
    record_fix_template: 'Address {ADR6.ADDRNUMBER}: duplicate e-mail address.'
  - id: SDCM409
    field: ADR6.SMTP_SRCH
    check_class: cross_field_check
    fail_when: '`ADR6.SMTP_SRCH` != `ADR6.SMTP_ADDR`.str.upper().str.slice(0, 20)'
    require_populated: true
    grain: ADR6
    severity: low
    dimension: consistency
    message: E-mail search field does not match the e-mail address
    why_it_matters: Business Address Services stores the first 20 characters of the e-mail address in capitals in SMTP_SRCH,
      and every search for a customer by e-mail (XD03, the BP search help, inbound e-mail assignment) reads that field. A mismatch
      means the address was changed by a direct table update, so searches by the real address miss the customer.
    rule_authority: sap_hard_constraint
    sap_impact: Customers are not found by e-mail and inbound e-mails are not assigned.
    fix_map:
      __other__: Re-save the e-mail address in XD02 or run the address search-field regeneration.
    record_fix_template: 'Address {ADR6.ADDRNUMBER}, number {ADR6.CONSNUMBER}: e-mail search field is out of step.'
  - id: SDCM410
    field: ADR6.SMTP_SRCH
    check_class: cross_field_check
    fail_when: '`ADR6.SMTP_SRCH`.isna()'
    applies_when:
      ADR6.SMTP_ADDR:
        populated: true
    grain: ADR6
    severity: low
    dimension: completeness
    message: E-mail address has no search field
    why_it_matters: SMTP_SRCH (the address in capitals, first 20 characters) is the field every search by e-mail reads. An empty
      search field means the row was loaded directly and the customer cannot be found by its e-mail.
    rule_authority: best_practice
    sap_impact: Customers are not found by e-mail and inbound e-mails are not assigned.
    fix_map:
      __other__: Re-save the e-mail address in XD02 or run the address search-field regeneration.
    record_fix_template: 'Address {ADR6.ADDRNUMBER}, number {ADR6.CONSNUMBER}: e-mail search field is empty.'
  - id: SDCM411
    field: ADR6.SMTP_ADDR
    check_class: null_check
    grain: ADR6
    severity: medium
    dimension: completeness
    message: E-mail communication entry has no e-mail address
    why_it_matters: An ADR6 row exists only to hold an e-mail address. An empty row is a leftover of a deletion or load; if
      it is the default, e-mail output (invoices, order confirmations, dunning) is sent to nobody.
    rule_authority: best_practice
    sap_impact: E-mail output fails silently for the address.
    fix_map:
      __other__: Enter the e-mail address or delete the entry (XD02 > Communication > E-mail).
    record_fix_template: 'Address {ADR6.ADDRNUMBER}, number {ADR6.CONSNUMBER}: no e-mail address.'
  - id: SDCM412
    field: ADR6.SMTP_ADDR
    check_class: cross_field_check
    fail_when: '`ADR6.SMTP_ADDR`.str.contains(''[ ,;]'')'
    grain: ADR6
    severity: medium
    dimension: validity
    message: E-mail field holds several addresses or contains spaces
    why_it_matters: Each ADR6 entry is one e-mail address. Several addresses separated by commas or semicolons, or an address
      with blanks, are rejected by the mail server (SAPconnect), so invoices and dunning notices are never sent.
    rule_authority: best_practice
    sap_impact: E-mail output to the customer is rejected by SAPconnect.
    fix_map:
      __other__: Split the addresses into separate e-mail entries and remove the spaces (XD02 > Communication > E-mail).
    record_fix_template: 'Address {ADR6.ADDRNUMBER}, number {ADR6.CONSNUMBER}: e-mail field holds several addresses or spaces.'
  - id: SDCM413
    field: KNA1.NAME1
    check_class: cross_field_check
    fail_when: '`KNA1.NAME1` != `ADRC.NAME1`.str.slice(0, 35)'
    require_populated: true
    grain: KNA1
    severity: high
    dimension: consistency
    message: Name 1 in the customer master differs from the central address
    why_it_matters: KNA1 keeps copies of the central address (ADRC) for programs that do not read Business Address Services.
      KNA1.NAME1 is ADRC.NAME1 cut to 35 characters. A difference means one side was changed by a direct table update or a load,
      so reports, interfaces and the BP conversion, which takes ADRC, show different data for the same customer.
    rule_authority: sap_hard_constraint
    sap_impact: Name 1 differs between reports that read KNA1 and the BP created from ADRC.
    fix_map:
      __other__: Re-save the address in XD02 so Business Address Services rewrites the KNA1 copy, or correct ADRC.
    record_fix_template: 'Customer {KNA1.KUNNR}: name 1 differs from the central address.'
  - id: SDCM414
    field: KNA1.NAME2
    check_class: cross_field_check
    fail_when: '`KNA1.NAME2` != `ADRC.NAME2`.str.slice(0, 35)'
    require_populated: true
    grain: KNA1
    severity: medium
    dimension: consistency
    message: Name 2 in the customer master differs from the central address
    why_it_matters: KNA1 keeps copies of the central address (ADRC) for programs that do not read Business Address Services.
      KNA1.NAME2 is ADRC.NAME2 cut to 35 characters. A difference means one side was changed by a direct table update or a load,
      so reports, interfaces and the BP conversion, which takes ADRC, show different data for the same customer.
    rule_authority: sap_hard_constraint
    sap_impact: Name 2 differs between reports that read KNA1 and the BP created from ADRC.
    fix_map:
      __other__: Re-save the address in XD02 so Business Address Services rewrites the KNA1 copy, or correct ADRC.
    record_fix_template: 'Customer {KNA1.KUNNR}: name 2 differs from the central address.'
  - id: SDCM415
    field: KNA1.ORT02
    check_class: cross_field_check
    fail_when: '`KNA1.ORT02` != `ADRC.CITY2`.str.slice(0, 35)'
    require_populated: true
    grain: KNA1
    severity: low
    dimension: consistency
    message: District in the customer master differs from the central address
    why_it_matters: KNA1 keeps copies of the central address (ADRC) for programs that do not read Business Address Services.
      KNA1.ORT02 is the district ADRC.CITY2. A difference means one side was changed by a direct table update or a load, so
      reports, interfaces and the BP conversion, which takes ADRC, show different data for the same customer.
    rule_authority: sap_hard_constraint
