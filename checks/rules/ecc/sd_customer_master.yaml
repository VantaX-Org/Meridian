  - id: SDCM375
    field: KNA1.STCD1
    check_class: regex_check
    pattern: ^[A-ZÑ&]{4}[0-9]{6}[A-Z0-9]{3}$
    applies_when:
      KNA1.LAND1:
      - MX
      KNA1.STKZN:
      - X
    grain: KNA1
    severity: medium
    dimension: consistency
    message: Customer is marked as a natural person but the RFC is not a person's RFC
    why_it_matters: The natural-person indicator (STKZN) tells the Mexican localisation which tax identifier the customer must
      have and how CFDI e-invoicing treats it. A person's RFC has four letters and 13 characters; a company RFC has three letters
      and 12 characters. A mismatch means either the indicator or the RFC is wrong, and the BP conversion creates the wrong
      partner category (person vs organisation).
    rule_authority: regulatory
    sap_impact: Withholding tax, e-invoicing and the BP category are determined for the wrong kind of party.
    fix_map:
      __other__: Correct the natural-person indicator or the RFC in XD02 > Control data.
    record_fix_template: 'Customer {KNA1.KUNNR}: marked as a natural person but the RFC is not a person''s RFC.'
