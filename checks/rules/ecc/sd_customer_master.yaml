      & ~(((`KNA1.PSTLZ` >= '4000') & (`KNA1.PSTLZ` <= '4999')) | ((`KNA1.PSTLZ` >= '9000') & (`KNA1.PSTLZ` <= '9999'))) | (`KNA1.REGIO`
      == 'SA') & ~((`KNA1.PSTLZ` >= '5000') & (`KNA1.PSTLZ` <= '5999')) | (`KNA1.REGIO` == 'WA') & ~((`KNA1.PSTLZ` >= '6000')
      & (`KNA1.PSTLZ` <= '6999')) | (`KNA1.REGIO` == 'TAS') & ~((`KNA1.PSTLZ` >= '7000') & (`KNA1.PSTLZ` <= '7999')) | (`KNA1.REGIO`
      == 'NT') & ~((`KNA1.PSTLZ` >= '0800') & (`KNA1.PSTLZ` <= '0999')) | (`KNA1.REGIO` == 'ACT') & ~(((`KNA1.PSTLZ` >= '0200')
      & (`KNA1.PSTLZ` <= '0299')) | ((`KNA1.PSTLZ` >= '2600') & (`KNA1.PSTLZ` <= '2618')) | ((`KNA1.PSTLZ` >= '2900') & (`KNA1.PSTLZ`
