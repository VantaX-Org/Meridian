- id: BKT093
  field: T007A.EGRKZ
  check_class: cross_field_check
  severity: medium
  dimension: consistency
  fail_when: '`T007A.EGRKZ`.notna() & `T007A.MWART`.isna()'
  message: Tax code carries an EU code but no tax type
  why_it_matters: The EU code controls the EC sales list; a code without a tax type (input, output) is not picked up by the
    report.
  rule_authority: regulatory
  sap_impact: Intra-community supplies are missing from the EC sales list (S_ALR_87012357).
  fix_map:
    __other__: Set the tax type in FTXP.
  record_fix_template: 'Tax procedure {T007A.KALSM} code {T007A.MWSKZ}: EU code {T007A.EGRKZ} without tax type.'
- id: BKT094
  field: T007A.ZMWSK
  check_class: cross_field_check
  severity: medium
  dimension: consistency
  fail_when: '`T007A.ZMWSK` == `T007A.MWSKZ`'
  require_populated: true
  message: Tax code refers to itself as target tax code
  why_it_matters: A target code that equals the code is a loop with no effect; the intended substitution never happens.
  rule_authority: best_practice
  sap_impact: Tax substitution does not apply.
  fix_map:
    __other__: Correct the target code in FTXP.
  record_fix_template: 'Tax procedure {T007A.KALSM} code {T007A.MWSKZ}: target code is itself.'
