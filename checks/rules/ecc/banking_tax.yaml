- id: BKT080
  field: LFA1.STCEG
  check_class: cross_field_check
  severity: medium
  dimension: consistency
  fail_when: (`LFA1.STCEG`.str.slice(0, 2).str.upper() != `LFA1.LAND1`) & ~((`LFA1.LAND1` == 'GR') & (`LFA1.STCEG`.str.slice(0,
    2).str.upper() == 'EL')) & ~((`LFA1.LAND1` == 'GB') & (`LFA1.STCEG`.str.slice(0, 2).str.upper() == 'XI'))
  require_populated: true
  message: Vendor VAT number prefix does not match the vendor country
  why_it_matters: A VAT number starts with the issuing country code. A different prefix means the number belongs to another
    country or was keyed on the wrong record; the exception is EL for Greece and XI for Northern Ireland.
  rule_authority: regulatory
  sap_impact: Intra-EU reporting (ZM/EC lists) and input VAT claims are rejected.
  fix_map:
    __other__: Correct the VAT number or the country in XK02.
  record_fix_template: 'Vendor {LFA1.LIFNR}: VAT number {LFA1.STCEG} does not match country {LFA1.LAND1}.'
- id: BKT081
  field: KNA1.STCEG
  check_class: cross_field_check
  severity: medium
  dimension: consistency
  fail_when: (`KNA1.STCEG`.str.slice(0, 2).str.upper() != `KNA1.LAND1`) & ~((`KNA1.LAND1` == 'GR') & (`KNA1.STCEG`.str.slice(0,
    2).str.upper() == 'EL')) & ~((`KNA1.LAND1` == 'GB') & (`KNA1.STCEG`.str.slice(0, 2).str.upper() == 'XI'))
  require_populated: true
  message: Customer VAT number prefix does not match the customer country
  why_it_matters: A VAT number starts with the issuing country code. A different prefix means the number belongs to another
    country or was keyed on the wrong record; the exception is EL for Greece and XI for Northern Ireland.
  rule_authority: regulatory
  sap_impact: Zero-rated intra-EU deliveries are not supported; VIES validation fails.
  fix_map:
    __other__: Correct the VAT number or the country in XD02.
  record_fix_template: 'Customer {KNA1.KUNNR}: VAT number {KNA1.STCEG} does not match country {KNA1.LAND1}.'
- id: BKT082
  field: LFA1.STCD1
  check_class: regex_check
  severity: high
  dimension: validity
  pattern: ^[0-9]{10}$
  applies_when:
    LFA1.LAND1:
    - ZA
  message: 'Vendor tax number 1: South African income tax reference is not 10 digits'
  why_it_matters: Tax number 1 is the national business identifier. A malformed value is rejected by the tax authority portals
    and the e-invoicing and withholding processes that read it.
  rule_authority: regulatory
  sap_impact: Tax reports and e-invoices carrying the number are rejected.
  fix_map:
    __other__: Correct the tax number in XK02 > Control data.
  record_fix_template: 'Vendor {LFA1.LIFNR}: tax number {LFA1.STCD1} is malformed for country ZA.'
