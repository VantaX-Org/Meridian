  record_fix_template: 'Tax procedure {T007A.KALSM} code {T007A.MWSKZ}: ZMWSK_ESA {T007A.ZMWSK_ESA} is not defined.'
- id: BKT092
  field: T007A.ZMWSK_ESE
  check_class: exists_check
  severity: high
  dimension: consistency
