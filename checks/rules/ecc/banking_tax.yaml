- id: BKT090
  field: T007A.ZMWSK
  check_class: exists_check
  severity: high
  dimension: consistency
  fields:
  - T007A.KALSM
  - T007A.ZMWSK
  target_table: T007A
  target_fields:
  - KALSM
  - MWSKZ
  message: Tax code target tax code (tax code for tax-exempt processing) does not exist in the same tax procedure
  why_it_matters: Tax codes that point to another code (target code, EU service substitution) fail at posting if the target
    is missing; the invoice cannot be posted or the wrong tax is computed.
  rule_authority: sap_hard_constraint
  sap_impact: FB60/MIRO error 'tax code does not exist'; document cannot be posted.
  fix_map:
    __other__: Create the target code in FTXP or correct the reference.
  record_fix_template: 'Tax procedure {T007A.KALSM} code {T007A.MWSKZ}: ZMWSK {T007A.ZMWSK} is not defined.'
- id: BKT091
  field: T007A.ZMWSK_ESA
  check_class: exists_check
  severity: high
  dimension: consistency
  fields:
  - T007A.KALSM
  - T007A.ZMWSK_ESA
  target_table: T007A
  target_fields:
  - KALSM
  - MWSKZ
  message: Tax code sales tax code for the EU service rule does not exist in the same tax procedure
  why_it_matters: Tax codes that point to another code (target code, EU service substitution) fail at posting if the target
    is missing; the invoice cannot be posted or the wrong tax is computed.
  rule_authority: sap_hard_constraint
  sap_impact: FB60/MIRO error 'tax code does not exist'; document cannot be posted.
  fix_map:
