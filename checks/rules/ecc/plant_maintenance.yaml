  rule_authority: best_practice
  sap_impact: Missing Planning plant (FL) may cause incomplete data in related transactions and reports.
  fix_map: {__blank__: 'In ECC: Set via IE02/IL02. In S/4HANA: Use Fiori app F4283 (Manage Equipment) or F4284 (Manage
      Functional Location).'}
  record_fix_template: 'Record is missing ILOA.SWERK. In ECC: Set via IE02/IL02. In S/4HANA: Use Fiori app F4283
    (Manage Equipment) or F4284 (Manage Functional Location).'
  grain: IFLOT
- id: PM033
  field: EQUI.EQUNR
  check_class: uniqueness_check
  fields: [EQUI.EQUNR]
  severity: critical
  dimension: uniqueness
  message: Duplicate equipment numbers detected — each equipment must be unique
  why_it_matters: Duplicate equipment records cause doubled maintenance costs, incorrect failure analysis, and ambiguous
    work order references. Each equipment must have a unique EQUNR.
  rule_authority: sap_hard_constraint
  sap_impact: Maintenance orders reference the wrong equipment. Failure history is split. Warranty tracking is unreliable.
    Cost reporting doubles up.
  fix_map: {__blank__: Identify and merge duplicate equipment via IE02 or archive duplicates via OIEA. Reassign
      maintenance orders and notifications to the surviving record.}
  record_fix_template: "Equipment {EQUI.EQUNR} appears more than once. Keep one record and flag the duplicate for deletion in IE02 after moving its history."


- id: PM035
  field: EQUI.BAUJJ
  check_class: regex_check
  pattern: '^(19|20)\d{2}$'
  severity: medium
  dimension: accuracy
  message: Equipment construction year is invalid — must be a 4-digit year between 1900 and 2099
  why_it_matters: Invalid construction years cause incorrect age-based maintenance calculations, wrong warranty determinations, and unreliable asset lifecycle reporting.
  rule_authority: best_practice
  sap_impact: Warranty validation fails. Age-based maintenance triggers are wrong. Asset lifecycle reports are unreliable.
  fix_map:
    __blank__: "Correct the equipment construction year via IE02 > General tab."

# ── Internal consistency: dates, units, construction data ───────────────────
  record_fix_template: "Equipment {EQUI.EQUNR}: construction year '{actual_value}' is invalid. Enter a 4-digit year between 1900 and 2099 in IE02 > Location/General data."
- id: PM036
  field: EQUZ.DATAB
  check_class: cross_field_check
  grain: EQUZ
  fail_when: (`EQUZ.DATAB` > `EQUZ.DATBI`)
  severity: medium
  dimension: consistency
  message: Equipment time segment starts after it ends (EQUZ valid-from after valid-to)
  why_it_matters: >-
    Installation location, planning plant, work centre and account assignment of an equipment are
    kept in time segments. A segment whose valid-from date is after its valid-to date covers no day,
    so the equipment's location and cost assignment for that period are undefined.
  rule_authority: sap_hard_constraint
  sap_impact: Installation history (IE03 > Structure > Usage list) and orders settled for the period
    pick up no or the wrong cost centre and location.
  fix_map:
    __other__: Review the usage periods in IE03 (Structure > Usage list) and correct the installation /
      dismantling dates through IE02 or IE4N; table entries must not be edited directly.
  record_fix_template: 'Equipment {EQUZ.EQUNR}: time segment valid from {EQUZ.DATAB} to {EQUZ.DATBI}.'

- id: PM037
  field: EQUI.BAUJJ
  check_class: cross_field_check
  fail_when: (`EQUI.BAUJJ` > `EQUI.INBDT`.dt.year.astype('Int64').astype('string')) & (`EQUI.BAUJJ` >= '1900') & (`EQUI.BAUJJ` <= '2099')
  severity: medium
  dimension: accuracy
  message: Equipment construction year is after its start-up date
  why_it_matters: >-
    An object cannot be started up before it was built. A construction year after the start-up year
    means one of the two dates is wrong, and age-based maintenance strategies, warranty and
    replacement planning start from the wrong date.
  rule_authority: best_practice
  sap_impact: Age-based maintenance plans, reliability (MTBF) and replacement analyses use a wrong
    equipment age.
  fix_map:
    __other__: Check the nameplate and commissioning records; correct the construction year or the
      start-up date in IE02 > General tab (S/4HANA Fiori app F4283).
  record_fix_template: 'Equipment {EQUI.EQUNR}: built {EQUI.BAUJJ}, started up {EQUI.INBDT}.'

- id: PM038
  field: IFLOT.BAUJJ
  check_class: cross_field_check
  fail_when: (`IFLOT.BAUJJ` > `IFLOT.DATAB`.dt.year.astype('Int64').astype('string')) & (`IFLOT.BAUJJ` >= '1900') & (`IFLOT.BAUJJ` <= '2099')
  severity: medium
  dimension: accuracy
  message: Functional location construction year is after its start-up date
  why_it_matters: >-
    A plant section cannot be started up before it was built. A construction year after the start-up
    year means one of the two dates is wrong, and age-based maintenance and replacement planning for
    the location start from the wrong date.
  rule_authority: best_practice
  sap_impact: Age-based maintenance plans and asset-condition reporting by functional location use a
    wrong age.
  fix_map:
    __other__: Correct the construction year or the start-up date in IL02 > General tab (S/4HANA Fiori
      app F4284).
  record_fix_template: 'Functional location {IFLOT.TPLNR}: built {IFLOT.BAUJJ}, started up {IFLOT.DATAB}.'

- id: PM039
  field: IFLOT.BAUJJ
  check_class: regex_check
  pattern: '^(19|20)\d{2}$'
  severity: medium
  dimension: accuracy
  message: Functional location construction year is invalid — must be a 4-digit year between 1900 and 2099
  why_it_matters: The construction year feeds age-based maintenance strategies and replacement planning; a
    2-digit or garbled year cannot be used and makes the location's age unknown.
  rule_authority: best_practice
  sap_impact: Age-based maintenance triggers and asset lifecycle reports for the location are unreliable.
  fix_map:
    __other__: Correct the construction year in IL02 > General tab (S/4HANA Fiori app F4284).
  record_fix_template: 'Functional location {IFLOT.TPLNR}: construction year ''{actual_value}'' is not a 4-digit year.'

- id: PM040
  field: EQUI.BAUMM
  check_class: regex_check
  pattern: '^(0[0-9]|1[0-2])$'
  severity: low
  dimension: validity
  message: Equipment construction month must be 01-12 (00 when unknown)
  why_it_matters: The construction month refines the equipment age for warranty and age-based maintenance; a
    value outside 01-12 is not a month and comes from a migration or interface.
  rule_authority: sap_hard_constraint
  sap_impact: Warranty and age calculations that use the construction month fail or are wrong.
  fix_map:
    __other__: Correct the construction month in IE02 > General tab (S/4HANA Fiori app F4283).
  record_fix_template: 'Equipment {EQUI.EQUNR}: construction month ''{actual_value}'' is not 01-12.'

- id: PM041
  field: IFLOT.BAUMM
  check_class: regex_check
  pattern: '^(0[0-9]|1[0-2])$'
  severity: low
  dimension: validity
  message: Functional location construction month must be 01-12 (00 when unknown)
  why_it_matters: The construction month refines the age of the location for age-based maintenance; a value
    outside 01-12 is not a month and comes from a migration or interface.
  rule_authority: sap_hard_constraint
  sap_impact: Age calculations that use the construction month fail or are wrong.
  fix_map:
    __other__: Correct the construction month in IL02 > General tab (S/4HANA Fiori app F4284).
  record_fix_template: 'Functional location {IFLOT.TPLNR}: construction month ''{actual_value}'' is not 01-12.'

- id: PM042
  field: EQUI.WAERS
  check_class: cross_field_check
  fail_when: ((`EQUI.ANSWT` > 0) & `EQUI.WAERS`.isna()) | ((`EQUI.BRGEW` > 0) & `EQUI.GEWEI`.isna())
  severity: medium
  dimension: consistency
  message: Equipment acquisition value without currency, or weight without unit
  why_it_matters: >-
    An amount without its currency or a weight without its unit cannot be read or totalled — 185 000
    could be rand or euro, 12 could be kilograms or tonnes. SAP stores the unit with the value; a
    missing one comes from a migration or an interface.
  rule_authority: sap_hard_constraint
  sap_impact: Equipment value and weight reports (IH08 list fields), insurance valuations and lifting /
    transport planning use undefined units.
  fix_map:
    __other__: Enter the currency next to the acquisition value and the unit next to the weight in IE02 >
      General tab (S/4HANA Fiori app F4283).
  record_fix_template: 'Equipment {EQUI.EQUNR}: acquisition value {EQUI.ANSWT} {EQUI.WAERS}, weight {EQUI.BRGEW}
    {EQUI.GEWEI}.'

- id: PM043
  field: IFLOT.WAERS
  check_class: cross_field_check
  fail_when: ((`IFLOT.ANSWT` > 0) & `IFLOT.WAERS`.isna()) | ((`IFLOT.BRGEW` > 0) & `IFLOT.GEWEI`.isna())
  severity: medium
  dimension: consistency
  message: Functional location acquisition value without currency, or weight without unit
  why_it_matters: >-
    An amount without its currency or a weight without its unit cannot be read or totalled. SAP stores
    the unit with the value; a missing one comes from a migration or an interface.
  rule_authority: sap_hard_constraint
  sap_impact: Value and weight reporting by functional location (IH06 list fields) uses undefined units.
  fix_map:
    __other__: Enter the currency next to the acquisition value and the unit next to the weight in IL02 >
      General tab (S/4HANA Fiori app F4284).
  record_fix_template: 'Functional location {IFLOT.TPLNR}: acquisition value {IFLOT.ANSWT} {IFLOT.WAERS},
    weight {IFLOT.BRGEW} {IFLOT.GEWEI}.'

- id: PM044
  field: ILOA.KOKRS
  check_class: cross_field_check
  grain: ILOA
  fail_when: '`ILOA.KOSTL`.notna() & `ILOA.KOKRS`.isna()'
  severity: high
  dimension: consistency
  message: Location data carry a cost centre without a controlling area
  why_it_matters: >-
    A cost centre is only unique within its controlling area. Location / account assignment data
    (ILOA) with a cost centre but no controlling area cannot identify the cost centre, so orders
    created for the object inherit an assignment that cannot be settled.
  rule_authority: sap_hard_constraint
  sap_impact: Maintenance orders for the equipment or functional location cannot derive their
    settlement receiver; costs stay on the order (KO88 / IW38 settlement errors).
  fix_map:
    __other__: Re-enter the company code / cost centre on the Organisation tab (IE02 or IL02) so that the
      controlling area is derived again.
  record_fix_template: 'Location data {ILOA.ILOAN} (functional location {ILOA.TPLNR}): cost centre {ILOA.KOSTL}
    without controlling area.'

- id: PM045
  field: CRHD.ENDDA
  check_class: cross_field_check
  fail_when: (`CRHD.ENDDA` < `CRHD.BEGDA`)
  severity: medium
  dimension: consistency
  message: Work centre is valid to a date before it is valid from
  why_it_matters: >-
    A work centre can only be used in orders, task lists and maintenance plans within its validity
    period. An end date before the start date gives it no validity at all.
  rule_authority: sap_hard_constraint
  sap_impact: Orders and task lists referencing the work centre fail scheduling and capacity planning;
    confirmations against it are rejected.
  fix_map:
    __other__: Correct the validity period of the work centre in IR02 (S/4HANA Fiori app Manage Work Centers).
  record_fix_template: 'Work centre {CRHD.ARBPL} (plant {CRHD.WERKS}): valid from {CRHD.BEGDA} to {CRHD.ENDDA}.'

# ── Structure: status and hierarchy consistency ────────────────────────────
- id: PM046
  field: JEST.STAT
  check_class: cross_field_check
  grain: EQUI
  fail_when: (`JEST.STAT` == 'I0100') & `ILOA.TPLNR`.isna() & `EQUZ.HEQUI`.isna()
  severity: high
  dimension: consistency
  message: Equipment has system status INST (installed) but no installation location
  why_it_matters: >-
    Status INST is set when an equipment is installed at a functional location or in a superior
    equipment, and removed when it is dismantled. Installed with neither means the installation data
    were lost (migration, direct table change): the equipment is missing from the plant structure,
    while status-based selections treat it as installed.
  rule_authority: sap_hard_constraint
  sap_impact: The equipment is missing from the structure list (IH01) and from orders and notifications
    created on the functional location; installed-base and spare-parts reporting disagree.
  fix_map:
    __other__: Install the equipment at its functional location or superior equipment in IE02 (Structure
      > Change installation location) or IE4N; if it is not installed, dismantle it so the status changes
      to AVLB.
  record_fix_template: 'Equipment {EQUI.EQUNR}: status INST without functional location or superior equipment.'

- id: PM047
  field: IFLOT.TPLMA
  check_class: cross_field_check
  fail_when: (`IFLOT.TPLMA` == `IFLOT.TPLNR`)
  severity: high
  dimension: consistency
  message: Functional location is its own superior functional location
  why_it_matters: >-
    The functional location hierarchy must be a tree. A location that is its own superior creates a
    loop: structure displays and hierarchy-based cost roll-ups never reach a top node.
  rule_authority: sap_hard_constraint
  sap_impact: Structure list (IH01), hierarchy reporting and cost roll-up (IW39 by structure) break or
    loop for the location and everything below it.
  fix_map:
    __other__: Assign the correct superior functional location in IL02 > Structure tab (S/4HANA Fiori app F4284).
  record_fix_template: 'Functional location {IFLOT.TPLNR}: superior functional location is itself.'

- id: PM048
  field: EQUZ.HEQUI
  check_class: cross_field_check
  grain: EQUZ
  fail_when: (`EQUZ.HEQUI` == `EQUZ.EQUNR`)
  severity: high
  dimension: consistency
  message: Equipment is installed in itself (superior equipment = the equipment)
  why_it_matters: >-
    An equipment hierarchy must be a tree. An equipment installed in itself creates a loop that no
    structure display or cost roll-up can resolve, and it hides where the equipment really is.
  rule_authority: sap_hard_constraint
  sap_impact: Structure list (IH03), installed-base reporting and order cost roll-up loop or omit the
    equipment.
  fix_map:
    __other__: Dismantle the equipment and install it in the correct superior equipment or functional
      location (IE02 > Structure, or IE4N).
  record_fix_template: 'Equipment {EQUZ.EQUNR}: superior equipment is itself.'

# ── Uniqueness of business identifiers ─────────────────────────────────────
- id: PM049
  field: EQUI.SERNR
  check_class: uniqueness_check
  fields: [EQUI.MATNR, EQUI.SERNR]
  severity: high
  dimension: uniqueness
  message: The same material / serial number combination is used by more than one equipment
  why_it_matters: >-
    A serial number identifies one physical unit of a material; SAP keeps exactly one equipment per
    material and serial number. Two equipment records for one unit split its history, so goods
    movements, service and warranty go to either record at random.
  rule_authority: sap_hard_constraint
  sap_impact: Serial-number checks in goods movements and deliveries (IQ09, MIGO) fail or update the wrong
    record; maintenance and warranty history is split.
  fix_map:
    __other__: Keep the record with the movement and maintenance history; change or delete the serial number
      of the duplicate (IQ02) and archive it.
  record_fix_template: 'Equipment {EQUI.EQUNR}: material {EQUI.MATNR} serial number {EQUI.SERNR} is also used
    by another equipment.'

- id: PM050
  field: EQUI.SERGE
  check_class: uniqueness_check
  fields: [EQUI.HERST, EQUI.TYPBZ, EQUI.SERGE]
  normalize: alnum
  severity: medium
  dimension: uniqueness
  message: Two equipment records carry the same manufacturer, model and manufacturer serial number
  why_it_matters: >-
    Manufacturer, model number and manufacturer serial number together identify one physical unit.
    Two equipment records with the same combination are the same machine registered twice: its
    maintenance history, costs and warranty claims are split between them.
  rule_authority: best_practice
  sap_impact: Failure analysis (MTBF/MTTR), warranty claims and maintenance cost per machine are split
    across two records; maintenance plans may schedule the same work twice.
  fix_map:
    __other__: Compare both records in IE03; keep the installed one with the history, move open orders and
      notifications to it, and flag the duplicate for deletion (IE02 > Edit > Set deletion flag).
  record_fix_template: 'Equipment {EQUI.EQUNR}: {EQUI.HERST} {EQUI.TYPBZ} serial {EQUI.SERGE} is also
    registered on another equipment.'

- id: PM051
  field: CRHD.ARBPL
  check_class: uniqueness_check
  fields: [CRHD.OBJTY, CRHD.WERKS, CRHD.ARBPL]
  severity: high
  dimension: uniqueness
  message: The same work centre name exists twice in a plant
  why_it_matters: >-
    Orders, task lists, maintenance plans and confirmations refer to a work centre by plant and name;
    SAP allows each name only once per plant. Two records with the same name make every reference
    ambiguous.
  rule_authority: sap_hard_constraint
  sap_impact: Orders and task lists resolve the work centre to either record; capacity planning and
    activity-type costing are split.
  fix_map:
    __other__: Keep the work centre that orders and task lists use; rename or delete the duplicate (IR02).
  record_fix_template: 'Work centre {CRHD.ARBPL} in plant {CRHD.WERKS} exists more than once.'

# ── Validity against the system's configuration ────────────────────────────
- id: PM052
  field: EQUI.EQTYP
  check_class: referential_check
  severity: high
  dimension: validity
  message: Equipment category EQUI.EQTYP must exist in the system's equipment categories (T370T)
  why_it_matters: >-
    The equipment category controls the number range, the views, history and change documents and
    whether the equipment can be installed or serialised. An equipment whose category is not defined
    cannot be opened or changed.
  rule_authority: sap_hard_constraint
  sap_impact: IE02/IE03 fail for the equipment; orders and notifications cannot be created on it.
  fix_map:
    __other__: Equipment category '{invalid_value}' is not defined. Define it (OIEN) or change the
      equipment's category (IE02 > Edit > Change equipment category).
  record_fix_template: 'Equipment {EQUI.EQUNR}: equipment category ''{actual_value}'' is not defined in T370T.'

- id: PM053
  field: EQUI.EQART
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Object type EQUI.EQART must exist in the system's technical object types (T370K)
  why_it_matters: >-
    The object type classifies the equipment for catalog profiles, reporting and maintenance
    strategies. An undefined type is a migration mapping gap: the equipment drops out of every
    analysis by object type.
  rule_authority: sap_hard_constraint
  sap_impact: Reliability and cost analyses by object type (PMIS, MCI1) omit the equipment; catalog
    profile determination for notifications fails.
  fix_map:
    __other__: Object type '{invalid_value}' is not defined. Define it (customizing Technical object types,
      OI08) or assign a valid type in IE02 > General tab.
  record_fix_template: 'Equipment {EQUI.EQUNR}: object type ''{actual_value}'' is not defined in T370K.'

- id: PM054
  field: IFLOT.FLTYP
  check_class: referential_check
  severity: high
  dimension: validity
  message: Functional location category IFLOT.FLTYP must exist in the system's categories (T370F)
  why_it_matters: >-
    The functional location category controls views, history and change documents of the location.
    An undefined category cannot be processed and points to a migration mapping gap.
  rule_authority: sap_hard_constraint
  sap_impact: IL02/IL03 fail for the location; orders and notifications cannot be created on it.
  fix_map:
    __other__: Functional location category '{invalid_value}' is not defined. Define it in customizing or
      correct the location's category.
  record_fix_template: 'Functional location {IFLOT.TPLNR}: category ''{actual_value}'' is not defined in T370F.'

- id: PM055
  field: ILOA.ABCKZ
  check_class: referential_check
  grain: ILOA
  severity: medium
  dimension: validity
  message: ABC indicator ILOA.ABCKZ must exist in the system's ABC indicators (T370C)
  why_it_matters: >-
    The ABC indicator ranks technical objects by criticality and drives order priorities, maintenance
    strategies and reporting. An undefined indicator ranks the object nowhere.
  rule_authority: sap_hard_constraint
  sap_impact: Criticality-based scheduling and reporting by ABC indicator omit the object.
  fix_map:
    __other__: ABC indicator '{invalid_value}' is not defined. Define it in customizing (Maintain ABC
      indicator) or assign a valid indicator on the Organisation tab (IE02 / IL02).
  record_fix_template: 'Location data {ILOA.ILOAN} (functional location {ILOA.TPLNR}): ABC indicator
    ''{actual_value}'' is not defined in T370C.'
- id: PM056
  field: EQUZ.HEQUI
  check_class: exists_check
  target_table: EQUI
  target_fields:
  - EQUNR
  applies_when:
    EQUZ.DATBI: ['99991231']
  severity: high
  dimension: consistency
  message: Superior equipment does not exist
  why_it_matters: An equipment installed in a superior equipment inherits its location and appears in its structure; a superior
    that does not exist breaks the hierarchy.
  rule_authority: sap_hard_constraint
  sap_impact: The equipment disappears from structure lists (IH03) and cost roll-ups.
  fix_map:
    __other__: Install the equipment in an existing superior equipment (IE02 > Structure) or dismantle it.
  record_fix_template: 'Equipment {EQUZ.EQUNR}: superior equipment {EQUZ.HEQUI} does not exist.'
- id: PM057
  field: IFLOT.TPLMA
  check_class: exists_check
  target_table: IFLOT
  target_fields:
  - TPLNR
  severity: high
  dimension: consistency
  message: Superior functional location does not exist
  why_it_matters: A functional location's superior defines the technical structure; a missing superior leaves the location
    orphaned.
  rule_authority: sap_hard_constraint
  sap_impact: The location is missing from the structure display and from cost and notification roll-ups.
  fix_map:
    __other__: Assign an existing superior functional location (IL02) or create it.
  record_fix_template: 'Functional location {IFLOT.TPLNR}: superior {IFLOT.TPLMA} does not exist.'
- id: PM058
  field: EQUZ.GEWRK
  check_class: exists_check
  target_table: CRHD
  target_fields:
  - OBJID
  target_when:
    OBJTY:
    - A
    LVORM:
      blank: true
  applies_when:
    EQUZ.DATBI: ['99991231']
  severity: high
  dimension: consistency
  message: Equipment's main work centre does not exist or is flagged for deletion
  why_it_matters: Maintenance orders and notifications take the main work centre from the equipment for planning and costing.
  rule_authority: sap_hard_constraint
  sap_impact: Orders get no responsible work centre; capacity and cost planning skip them.
  fix_map:
    __other__: Assign an existing work centre (IE02 > Organisation).
  record_fix_template: 'Equipment {EQUZ.EQUNR}: main work centre {EQUZ.GEWRK} does not exist or is deleted.'

# ── Measuring points and counters ──────────────────────────────────────────
- id: PM059
  field: IMPTT.PYEAR
  check_class: cross_field_check
  fail_when: '`IMPTT.PYEAR`.isna() | (`IMPTT.PYEAR` <= 0)'
  applies_when:
    IMPTT.INDCT: [X]
  severity: high
  dimension: completeness
  message: Counter has no annual estimate
  why_it_matters: >-
    Performance-based and multiple-counter maintenance plans (service intervals by SMU hours or
    kilometres) convert the counter interval into a date using the counter's annual estimate. A counter
    without one cannot be scheduled, so interval services on haul trucks, loaders and drills are never
    called or are called on the wrong date.
  rule_authority: sap_hard_constraint
  sap_impact: Scheduling of performance-based plans (IP10, IP30 deadline monitoring) stops for plans on this
    counter or calculates no planned date; the service order is not generated.
  fix_map:
    __other__: Enter the expected yearly usage (for example 6000 H) in IK02 > Annual estimate, then reschedule
      the plans that use the counter (IP10).
  record_fix_template: 'Measuring point {IMPTT.POINT} ({IMPTT.PTTXT}): counter has no annual estimate.'

- id: PM060
  field: IMPTT.MPOBJ
  check_class: exists_check
  target_table: EQUI
  target_fields:
  - OBJNR
  applies_when:
    IMPTT.MPOBJ: {contains_any: [IE]}
  severity: high
  dimension: consistency
  message: Active measuring point belongs to an equipment that does not exist
  why_it_matters: >-
    Hour meters, oil-analysis points and condition points hang off an equipment. A point whose equipment
    is gone (archived, deleted by direct table change, or migration with re-keyed equipment) still
    collects readings, but no plan, notification or history can use them.
  rule_authority: sap_hard_constraint
  sap_impact: Readings (IK11, IK22, mobile uploads) post to an orphan point; performance-based plans and
    condition-based notifications for the machine never trigger.
  fix_map:
    __other__: Flag the orphan point for deletion (IK02) and create the point on the correct equipment
      (IK01), transferring the last counter reading.
  record_fix_template: 'Measuring point {IMPTT.POINT}: object {IMPTT.MPOBJ} is not an existing equipment.'

- id: PM061
  field: IMPTT.MRMIN
  check_class: cross_field_check
  fail_when: '`IMPTT.MRMIN` > `IMPTT.MRMAX`'
  applies_when:
    IMPTT.MRMINI: [X]
    IMPTT.MRMAXI: [X]
  severity: high
  dimension: validity
  message: Measuring point lower limit is above its upper limit
  why_it_matters: >-
    The limits define the normal band of a condition point (temperature, vibration, wear) or the valid
    range of a counter. An inverted band classes every reading as out of range, or none, so condition
    monitoring alarms are meaningless (ISO 17359 alert limits).
  rule_authority: sap_hard_constraint
  sap_impact: Condition-based notifications and maintenance calls fire on every reading or never; counter
    readings may be rejected.
  fix_map:
    __other__: Correct the lower and upper range limits in IK02 (swap if transposed).
  record_fix_template: 'Measuring point {IMPTT.POINT}: lower limit {IMPTT.MRMIN} is above upper limit {IMPTT.MRMAX}.'

- id: PM072
  field: IMPTT.MPOBJ
  check_class: exists_check
  target_table: IFLOT
  target_fields:
  - OBJNR
  applies_when:
    IMPTT.MPOBJ: {contains_any: [IF]}
  severity: high
  dimension: consistency
  message: Active measuring point belongs to a functional location that does not exist
  why_it_matters: Readings on a functional location measuring point that has no location cannot drive plans,
    notifications or location history.
  rule_authority: sap_hard_constraint
  sap_impact: Performance-based and condition-based plans on the location never trigger.
  fix_map:
    __other__: Flag the point for deletion (IK02) and recreate it on the correct functional location (IK01).
  record_fix_template: 'Measuring point {IMPTT.POINT}: object {IMPTT.MPOBJ} is not an existing functional location.'

# ── Machine identity and serialisation ─────────────────────────────────────
- id: PM062
  field: EQUI.SERGE
  check_class: uniqueness_check
  fields: [EQUI.HERST, EQUI.EQART, EQUI.SERGE]
  normalize: alnum
  case_insensitive: true
  severity: high
  dimension: uniqueness
  message: Two equipment records of the same object type carry the same manufacturer and manufacturer serial number
  why_it_matters: >-
    For a dealer the OEM serial (PIN) is the machine's identity for warranty, product-support and
    campaign claims. PM050 needs the free-text model to match exactly, so "793F" against "793 F" or "CAT
    793F" slips through. Keying on the configured object type instead catches the same machine
    registered twice.
  rule_authority: best_practice
  sap_impact: Service history, warranty claims and component life are split across two records; the
    same service is planned twice and OEM campaign coverage is reported wrong.
  fix_map:
    __other__: Compare both records (IE03); keep the one with history and open orders, move notifications
      and plans to it, and set the deletion flag on the duplicate (IE02).
  record_fix_template: 'Equipment {EQUI.EQUNR}: {EQUI.HERST} serial {EQUI.SERGE} (type {EQUI.EQART}) is also
    registered on another equipment.'

- id: PM063
  field: EQUI.SERNR
  check_class: cross_field_check
  fail_when: '`EQUI.SERNR`.notna() & `EQUI.MATNR`.isna()'
  severity: high
  dimension: consistency
  message: Equipment carries a serial number without a material
  why_it_matters: >-
    An SAP serial number identifies a unit of a material: material and serial number form the key of
    the serial number master. A serial without its material was written past the IE01/IQ01 checks
    (legacy load), and no goods movement, delivery or stock check can find the unit.
  rule_authority: sap_hard_constraint
  sap_impact: The machine cannot be found by serial number in deliveries, goods movements (MIGO) or IQ09; serial
    stock and sales history are disconnected from the equipment.
  fix_map:
    __other__: Enter the machine's material in IE02 > Serial data, or clear the stray serial number.
  record_fix_template: 'Equipment {EQUI.EQUNR}: serial number {EQUI.SERNR} has no material.'

- id: PM064
  field: EQUI.MATNR
  check_class: exists_check
  target_table: MARC
  target_fields:
  - MATNR
  target_when:
    SERNP: {populated: true}
  applies_when:
    EQUI.SERNR: {populated: true}
  severity: high
  dimension: consistency
  message: Serialised equipment's material has no serial number profile in any plant
  why_it_matters: >-
    The serial number profile on the material/plant (MARC.SERNP) makes deliveries, goods receipts and
    issues ask for the serial number and keep the equipment's stock status. Without a profile, units are
    sold, returned and rented without serial capture, so the installed base and warranty registration
    drift from reality.
  rule_authority: best_practice
  sap_impact: Outbound deliveries and goods movements of the machine do not record the serial; the
    equipment's stock and customer status (EQBS, OBJK) are never updated.
  fix_map:
    __other__: Assign the serial number profile in MM02 (Plant data / Sales general) for every plant that
      stocks or sells the material.
  record_fix_template: 'Equipment {EQUI.EQUNR}: material {EQUI.MATNR} (serial {EQUI.SERNR}) has no serial number
    profile.'

- id: PM067
  field: EQUI.TYPBZ
  check_class: null_check
  applies_when:
    EQUI.HERST: {populated: true}
  severity: high
  dimension: completeness
  message: Equipment has a manufacturer but no manufacturer model number
  why_it_matters: >-
    ISO 14224 identifies equipment by manufacturer, model and serial number. Parts interchangeability,
    OEM service bulletins, failure benchmarking (MTBF by model) and warranty claims are all keyed on the
    model, and the manufacturer alone is not enough.
  rule_authority: iso_standard
  sap_impact: Reliability reporting by model (MCI-series, PMIS) and parts lookups by model return nothing for the
    machine.
  fix_map:
    __blank__: Enter the manufacturer model number (IE02 > General > Manufacturer data).
  record_fix_template: 'Equipment {EQUI.EQUNR}: manufacturer {EQUI.HERST} but no model number.'

- id: PM068
  field: EQUI.MATNR
  check_class: exists_check
  target_table: MARA
  target_fields:
  - MATNR
  target_when:
    LVORM: {blank: true}
  severity: medium
  dimension: consistency
  message: Equipment's material is flagged for deletion
  why_it_matters: The material behind a serialised machine drives parts lists, pricing and sales; an equipment
    pointing at a deleted material cannot be sold, returned or re-stocked.
  rule_authority: best_practice
  sap_impact: Deliveries, returns and goods movements of the unit fail on the deleted material.
  fix_map:
    __other__: Point the equipment at the successor material (IE02 > Serial data) or remove the deletion flag.
  record_fix_template: 'Equipment {EQUI.EQUNR}: material {EQUI.MATNR} does not exist or is flagged for deletion.'

# ── Installation, structure and asset link (evaluated per equipment) ───────
- id: PM065
  field: ILOA.ANLNR
  check_class: exists_check
  grain: EQUI
  fields:
  - ILOA.BUKRS
  - ILOA.ANLNR
  target_table: ANLA
  target_fields:
  - BUKRS
  - ANLN1
  target_when:
    XLOEV: {blank: true}
    DEAKT: {blank: true}
  severity: high
  dimension: consistency
  message: Equipment is linked to a fixed asset that does not exist, is deleted or is retired
  why_it_matters: >-
    ISO 55000 requires the technical register and the financial register to reconcile. An active machine
    whose asset is retired is either sold (and should be deactivated) or capitalised on the wrong asset,
    which affects rental-fleet depreciation and insurance values.
  rule_authority: iso_standard
  sap_impact: Asset-to-equipment synchronisation (AS02 / IE02) and fleet valuation reports disagree; cost
    settlement to the asset fails.
  fix_map:
    __other__: Link the correct active asset in IE02 > Organisation, or set the equipment to inactive or
      deleted if the machine was sold or scrapped.
  record_fix_template: 'Equipment {EQUI.EQUNR}: asset {ILOA.BUKRS}/{ILOA.ANLNR} does not exist or is retired.'

- id: PM066
  field: ILOA.TPLNR
  check_class: exists_check
  grain: EQUI
  target_table: IFLOT
  target_fields:
  - TPLNR
  target_when:
    IEQUI: [X]
  severity: high
  dimension: consistency
  message: Equipment is installed at a functional location that does not allow equipment installation
  why_it_matters: >-
    Only functional locations flagged "installation allowed" may hold equipment; SAP blocks the install
    in IE02 and IE4N. A machine sitting at a location without the flag came from a load or from the flag
    being removed afterwards, so the structure is not what the planners see.
  rule_authority: sap_hard_constraint
  sap_impact: Dismantle and re-install of the machine (IE4N) fails; structure lists and location-based
    plans and reporting omit or misplace it.
  fix_map:
    __other__: Set "Equipment installation allowed" on the location (IL02 > Structure), or install the
      machine at the correct location (IE4N).
  record_fix_template: 'Equipment {EQUI.EQUNR}: functional location {ILOA.TPLNR} does not exist or does not allow
    installation.'

- id: PM071
  field: EQUZ.HEQUI
  check_class: exists_check
  fields:
  - EQUZ.HEQUI
  - EQUZ.IWERK
  target_table: EQUZ
  target_fields:
  - EQUNR
  - IWERK
  target_when:
    DATBI: ['99991231']
  applies_when:
    EQUZ.DATBI: ['99991231']
  severity: medium
  dimension: consistency
  message: Installed component's planning plant differs from its superior equipment's
  why_it_matters: >-
    Engines, transmissions and final drives installed in a truck are planned with the truck. A different
    planning plant sends component orders and plans to another planner group and storeroom, which
    splits the machine's cost and history.
  rule_authority: best_practice
  sap_impact: Component orders are planned and costed in another plant; machine-level cost reports (IW39,
    MCI8) miss them.
  fix_map:
    __other__: Align the planning plant on the component with its superior equipment (IE02 > Organisation),
      or check whether the installation is wrong.
  record_fix_template: 'Equipment {EQUZ.EQUNR}: planning plant {EQUZ.IWERK} differs from superior equipment
    {EQUZ.HEQUI}.'

- id: PM073
  field: EQUZ.INGRP
  check_class: null_check
  applies_when:
    EQUZ.DATBI: ['99991231']
  severity: medium
  dimension: completeness
  message: Equipment has no planner group
  why_it_matters: The planner group routes notifications and orders to the responsible planning team; without
    it the work lands in no one's worklist.
  rule_authority: best_practice
  sap_impact: Worklists (IW28, IW38) filtered by planner group miss the machine's notifications and orders.
  fix_map:
    __blank__: Assign the planner group in IE02 > Organisation.
  record_fix_template: 'Equipment {EQUZ.EQUNR}: no planner group.'

- id: PM069
  field: IFLOT.LGWID
  check_class: exists_check
  target_table: CRHD
  target_fields:
  - OBJID
  target_when:
    OBJTY: [A]
    LVORM: {blank: true}
  severity: high
  dimension: consistency
  message: Functional location's main work centre does not exist or is flagged for deletion
  why_it_matters: Orders and notifications on the location take its main work centre for planning and costing.
  rule_authority: sap_hard_constraint
  sap_impact: Orders get no responsible work centre; capacity and cost planning skip them.
  fix_map:
    __other__: Assign an existing work centre (IL02 > Organisation).
  record_fix_template: 'Functional location {IFLOT.TPLNR}: main work centre {IFLOT.LGWID} does not exist or is deleted.'

- id: PM070
  field: IFLOT.TPLKZ
  check_class: null_check
  severity: high
  dimension: completeness
  message: Functional location has no structure indicator
  why_it_matters: The structure indicator defines the edit mask and hierarchy levels; SAP derives the superior
    location from it. A location without one was loaded past IL01 and cannot be placed in the hierarchy
    consistently.
  rule_authority: sap_hard_constraint
  sap_impact: Superior locations are not derived; new sub-locations cannot be created under it in the same mask.
  fix_map:
    __blank__: Assign the structure indicator used by the site hierarchy (IL02; changeable only in limited cases,
      otherwise recreate via IL01 and migrate).
  record_fix_template: 'Functional location {IFLOT.TPLNR}: no structure indicator.'

- id: PM074
  field: IFLOT.TPLMA
  check_class: exists_check
  fields:
  - IFLOT.TPLMA
  - IFLOT.IWERK
  target_table: IFLOT
  target_fields:
  - TPLNR
  - IWERK
  severity: low
  dimension: consistency
  message: Functional location's planning plant differs from its superior's
  why_it_matters: Sub-locations normally inherit the planning plant; a mismatch inside one site hierarchy sends
    work to a different planning team.
  rule_authority: best_practice
  sap_impact: Orders on the location are planned in another plant; hierarchy cost roll-ups cross plants.
  fix_map:
    __other__: Align the planning plant with the superior location (IL02 > Organisation), or confirm the split is
      intended.
  record_fix_template: 'Functional location {IFLOT.TPLNR}: planning plant {IFLOT.IWERK} differs from superior
    {IFLOT.TPLMA}.'
- id: PM200
  field: EQUI.EQUNR
  check_class: exists_check
  target_table: EQUZ
  target_fields:
  - EQUNR
  target_when:
    DATBI:
    - '99991231'
  severity: high
  dimension: completeness
  message: Equipment has no current time segment (no EQUZ record valid to 31.12.9999)
  why_it_matters: The current EQUZ time segment holds the planning plant, main work centre and the link to the location and
    account assignment data (ILOA). Equipment without it has no current organisational data at all.
  rule_authority: sap_hard_constraint
  sap_impact: Maintenance orders and notifications cannot derive planning plant, work centre or cost centre for the equipment;
    it drops out of plant-based worklists.
  fix_map:
    __other__: Display the equipment in IE03 and save it again in IE02 with the organisational data, or reload the time segment.
  record_fix_template: 'Equipment {EQUI.EQUNR}: no current time segment.'
- id: PM201
  field: EQUZ.ILOAN
  check_class: exists_check
  target_table: ILOA
  target_fields:
  - ILOAN
  severity: high
  dimension: consistency
  message: Equipment points to a location and account assignment record (ILOA) that does not exist
  why_it_matters: EQUZ.ILOAN links the equipment to its maintenance plant, cost centre, business area and functional location.
    A dangling link means none of that data can be read.
  rule_authority: sap_hard_constraint
  sap_impact: Orders for the equipment receive no settlement cost centre; location-based reporting omits it.
  fix_map:
    __other__: Re-enter the location and organisation data in IE02 so a new ILOA record is created.
  record_fix_template: 'Equipment {EQUZ.EQUNR}: location record {EQUZ.ILOAN} does not exist.'
  applies_when:
    EQUZ.ILOAN:
      populated: true
- id: PM202
  field: EQUZ.HEQUI
  check_class: exists_check
  severity: high
  dimension: consistency
  message: Superior equipment is flagged for deletion
  why_it_matters: A superior equipment marked for deletion is archived or deleted in the next reorganisation; its sub-equipment
    would lose the installation hierarchy.
  rule_authority: sap_hard_constraint
  sap_impact: Hierarchy reports and cost roll-ups drop the sub-equipment; deletion run is blocked or orphans the subtree.
  fix_map:
    __other__: Reinstall the sub-equipment elsewhere (IE4N) or remove the deletion flag on the superior (IE05).
  record_fix_template: 'Equipment {EQUZ.EQUNR}: superior {EQUZ.HEQUI} is flagged for deletion.'
  target_table: EQUI
  target_fields:
  - EQUNR
  target_when:
    LVORM:
    - X
  negate: true
  applies_when:
    EQUZ.DATBI:
    - '99991231'
- id: PM203
  field: MPLA.EQUNR
  check_class: exists_check
  severity: high
  dimension: consistency
  message: Active maintenance plan refers to equipment flagged for deletion
  why_it_matters: Scheduled calls keep generating orders for an object that is being retired.
  rule_authority: sap_hard_constraint
  sap_impact: Orders are created for deleted equipment and fail on release or settlement.
  fix_map:
    __other__: Lock or deactivate the plan (IP02) or replace the equipment on the plan.
  record_fix_template: 'Maintenance plan {MPLA.WARPL}: equipment {MPLA.EQUNR} is flagged for deletion.'
  target_table: EQUI
  target_fields:
  - EQUNR
  target_when:
    LVORM:
    - X
  negate: true
  applies_when:
    MPLA.LVORM:
      blank: true
- id: PM204
  field: EQUI.GWLEN
  check_class: cross_field_check
  severity: medium
  dimension: consistency
  message: Warranty ends before it starts
  why_it_matters: The warranty end date must not precede the guarantee start date.
  rule_authority: sap_hard_constraint
  sap_impact: Warranty checks on notifications evaluate wrongly; claims against the vendor are missed.
  fix_map:
    __other__: Correct the warranty dates in IE02 (Location tab > Warranty).
  record_fix_template: 'Equipment {EQUI.EQUNR}: warranty ends {EQUI.GWLEN} before it starts {EQUI.GWLDT}.'
  fail_when: '`EQUI.GWLEN`.notna() & `EQUI.GWLDT`.notna() & (`EQUI.GWLEN` < `EQUI.GWLDT`)'
- id: PM205
  field: EQUI.ANSDT
  check_class: cross_field_check
  severity: low
  dimension: consistency
  message: Acquisition date is after the start-up date
  why_it_matters: Equipment cannot be put into operation before it is acquired.
  rule_authority: best_practice
  sap_impact: Asset age and depreciation-driven replacement planning are distorted.
  fix_map:
    __other__: Correct acquisition or start-up date in IE02.
  record_fix_template: 'Equipment {EQUI.EQUNR}: acquired {EQUI.ANSDT} after start-up {EQUI.INBDT}.'
  fail_when: '`EQUI.ANSDT`.notna() & `EQUI.INBDT`.notna() & (`EQUI.ANSDT` > `EQUI.INBDT`)'
- id: PM206
  field: EQUI.INBDT
  check_class: cross_field_check
  severity: low
  dimension: validity
  message: Start-up date lies in the future
  why_it_matters: A start-up date ahead of today for equipment already in the system usually means a typing error in the year.
  rule_authority: best_practice
  sap_impact: Age-based reporting and warranty logic see the equipment as not yet in operation.
  fix_map:
    __other__: Correct the start-up date in IE02.
  record_fix_template: 'Equipment {EQUI.EQUNR}: start-up date {EQUI.INBDT} is in the future.'
  fail_when: '`EQUI.INBDT` > @today'
- id: PM207
  field: EQUI.ANSWT
  check_class: cross_field_check
  severity: low
  dimension: completeness
  message: Acquisition value has no acquisition date
  why_it_matters: A value without a date cannot be placed in time for depreciation or replacement analysis.
  rule_authority: best_practice
  sap_impact: Value history cannot be used for lifecycle analysis.
  fix_map:
    __other__: Enter the acquisition date in IE02.
  record_fix_template: 'Equipment {EQUI.EQUNR}: acquisition value {EQUI.ANSWT} without acquisition date.'
  fail_when: '`EQUI.ANSWT` > 0 & `EQUI.ANSDT`.isna()'
- id: PM208
  field: EQUI.WDBWT
  check_class: cross_field_check
  severity: medium
  dimension: consistency
  message: Replacement value has no currency
  why_it_matters: Replacement value is a currency amount; without a currency it cannot be read or summed.
  rule_authority: sap_hard_constraint
  sap_impact: Insurance and replacement-cost reports cannot convert the amount.
  fix_map:
    __other__: Enter the currency in IE02 (General data).
  record_fix_template: 'Equipment {EQUI.EQUNR}: replacement value {EQUI.WDBWT} has no currency.'
  fail_when: '`EQUI.WDBWT` > 0 & `EQUI.WAERS`.isna()'
- id: PM209
  field: EQUI.ELIEF
  check_class: exists_check
  severity: medium
  dimension: consistency
  message: Equipment vendor does not exist
  why_it_matters: Vendor on the equipment must exist in the vendor master for warranty and service contacts.
  rule_authority: sap_hard_constraint
  sap_impact: Warranty and service notifications cannot reach the vendor.
  fix_map:
    __other__: Correct the vendor number in IE02 or create the vendor (XK01).
  record_fix_template: 'Equipment {EQUI.EQUNR}: vendor {EQUI.ELIEF} does not exist.'
  target_table: LFA1
  target_fields:
  - LIFNR
- id: PM210
  field: EQUI.KUNDE
  check_class: exists_check
  severity: medium
  dimension: consistency
  message: Customer the equipment was delivered to does not exist
  why_it_matters: Customer on a serialised equipment must exist in the customer master.
  rule_authority: sap_hard_constraint
  sap_impact: Service orders and warranty claims for the customer cannot be processed.
  fix_map:
    __other__: Correct the customer number in IE02 (Serial data) or create the customer (XD01).
  record_fix_template: 'Equipment {EQUI.EQUNR}: delivered-to customer {EQUI.KUNDE} does not exist.'
  target_table: KNA1
  target_fields:
  - KUNNR
- id: PM211
  field: EQUI.WERK
  check_class: exists_check
  severity: high
  dimension: consistency
  message: Equipment plant does not exist
  why_it_matters: The plant on the equipment must be a defined plant.
  rule_authority: sap_hard_constraint
  sap_impact: Stock and serial number logic for the equipment fails.
  fix_map:
    __other__: Correct the plant in IE02 (Serial data).
  record_fix_template: 'Equipment {EQUI.EQUNR}: plant {EQUI.WERK} does not exist.'
  target_table: T001W
  target_fields:
  - WERKS
- id: PM212
  field: EQUI.LAGER
  check_class: exists_check
  severity: medium
  dimension: consistency
  message: Equipment storage location does not exist in its plant
  why_it_matters: Storage location must be defined for the plant of the equipment.
  rule_authority: sap_hard_constraint
  sap_impact: Goods movements for the equipment fail.
  fix_map:
    __other__: Correct the storage location in IE02 (Serial data).
  record_fix_template: 'Equipment {EQUI.EQUNR}: storage location {EQUI.LAGER} does not exist in plant {EQUI.WERK}.'
  target_table: T001L
  target_fields:
  - WERKS
  - LGORT
  fields:
  - EQUI.WERK
  - EQUI.LAGER
- id: PM213
  field: EQUI.INVNR
  check_class: uniqueness_check
  severity: medium
  dimension: uniqueness
  message: Inventory number is used by more than one equipment
  why_it_matters: The inventory number identifies the physical item during stocktaking.
  rule_authority: best_practice
  sap_impact: Physical inventory counts cannot match the item to one equipment.
  fix_map:
    __other__: Give each equipment its own inventory number (IE02).
  record_fix_template: 'Equipment {EQUI.EQUNR}: inventory number {EQUI.INVNR} is duplicated.'
  fields:
  - EQUI.INVNR
  normalize: alnum
  case_insensitive: true
- id: PM214
  field: EQUZ.IWERK
  check_class: exists_check
  severity: high
  dimension: consistency
  message: Equipment planning plant is not a maintenance planning plant
  why_it_matters: Planning plant must be defined in T399I.
  rule_authority: sap_hard_constraint
  sap_impact: Orders and notifications cannot be planned in that plant.
  fix_map:
    __other__: Correct the planning plant in IE02 (Organisation) or define it (OIOA).
  record_fix_template: 'Equipment {EQUZ.EQUNR}: planning plant {EQUZ.IWERK} is not defined for maintenance.'
  target_table: T399I
  target_fields:
  - IWERK
  applies_when:
    EQUZ.DATBI:
    - '99991231'
- id: PM215
  field: EQUZ.SUBMT
  check_class: exists_check
  severity: medium
  dimension: consistency
  message: Equipment construction-type material does not exist
  why_it_matters: The construction type links the equipment to a material for BOM and spare parts.
  rule_authority: sap_hard_constraint
  sap_impact: Spare-part determination from the material BOM fails.
  fix_map:
    __other__: Correct the construction type in IE02 (General > Construction type).
  record_fix_template: 'Equipment {EQUZ.EQUNR}: construction type {EQUZ.SUBMT} does not exist in the material master.'
  target_table: MARA
  target_fields:
  - MATNR
  applies_when:
    EQUZ.DATBI:
    - '99991231'
- id: PM216
  field: EQUZ.ILOAN
  check_class: null_check
  severity: high
  dimension: completeness
  message: Current equipment segment has no location and account assignment
  why_it_matters: Without ILOAN the equipment has no maintenance plant, cost centre or location.
  rule_authority: sap_hard_constraint
  sap_impact: Orders get no settlement cost centre; location reporting omits the equipment.
  fix_map:
    __blank__: Enter location and account data in IE02.
  record_fix_template: 'Equipment {EQUZ.EQUNR}: no location and account assignment.'
  applies_when:
    EQUZ.DATBI:
    - '99991231'
- id: PM217
  field: EQUZ.GEWRK
  check_class: cross_field_check
  severity: medium
  dimension: consistency
  message: Main work centre without planning plant
  why_it_matters: A work centre is plant specific; without the planning plant its assignment cannot be validated.
  rule_authority: best_practice
  sap_impact: Order planning cannot resolve the work centre plant.
  fix_map:
    __other__: Enter the planning plant in IE02 (Organisation).
  record_fix_template: 'Equipment {EQUZ.EQUNR}: work centre {EQUZ.GEWRK} without planning plant.'
  fail_when: '`EQUZ.GEWRK`.notna() & `EQUZ.IWERK`.isna()'
  grain: EQUZ
- id: PM218
  field: EQUZ.INGRP
  check_class: cross_field_check
  severity: medium
  dimension: consistency
  message: Planner group without planning plant
  why_it_matters: Planner groups are defined per planning plant.
  rule_authority: best_practice
  sap_impact: Planner group cannot be validated; worklists by planner miss the equipment.
  fix_map:
    __other__: Enter the planning plant in IE02.
  record_fix_template: 'Equipment {EQUZ.EQUNR}: planner group {EQUZ.INGRP} without planning plant.'
