  field: MMPT.OPERATOR
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: Comparison operator for maint. package cycle duration must be a value of domain VERGL (e.g. <, <=, =, >, >=, EQ,
    GE, GT, LE, LT)
  why_it_matters: Domain VERGL fixes the permitted values of OPERATOR (Comparison operator for maint. package cycle duration)
    in the SAP Data Dictionary. Any other non-blank value is outside SAP's own domain definition and is read inconsistently
    by the programs that consume the field.
  rule_authority: sap_hard_constraint
  sap_impact: OPERATOR will not evaluate correctly wherever SAP branches on its value.
  allowed_values:
  - <
  - <=
  - '='
  - '>'
  - '>='
  - EQ
  - GE
  - GT
  - LE
  - LT
  fix_map:
    __other__: 'MMPT.OPERATOR ''{invalid_value}'' is not in domain VERGL. Set it to one of: <, <=, =, >, >=, EQ, GE, GT, LE,
      LT.'
  record_fix_template: 'MMPT.OPERATOR is {actual_value}; expected one of: <, <=, =, >, >=, EQ, GE, GT, LE, LT.'
