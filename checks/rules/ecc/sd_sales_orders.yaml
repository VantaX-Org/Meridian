module: sd_sales_orders
target_state: ECC_AND_S4HANA
rules:
- id: SDSO001
  field: VBAK.VBELN
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Sales order number is mandatory \u2014 primary key for all SD order transactions"
  why_it_matters: VBELN is the sales order document number and primary key for all order processing. Without it, no deliveries
    (VL01N), billing documents (VF01), or order status tracking can be maintained. The record is orphaned from the entire
    order-to-cash cycle.
  rule_authority: sap_hard_constraint
  sap_impact: Sales order cannot be referenced in VL01N, VF01, or any SD workflow. Delivery creation and billing are impossible.
    The record is orphaned.
  fix_map:
    __blank__: "Sales order number is empty. This record cannot exist without VBELN. Investigate the data source \u2014 this\
      \ is likely a data load error. In ECC: create a valid order via VA01. In S/4HANA: use Fiori app F6588 (Create Sales\
      \ Order) or correct the source data."
  record_fix_template: 'SO {VBAK.VBELN}: VBELN is {actual_value}. Create a valid sales order via VA01 (ECC) or Fiori app F6588
    (S/4HANA).'
- id: SDSO002
  field: VBAK.KUNNR
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Sold-to customer is mandatory \u2014 required for billing and AR posting"
  why_it_matters: KUNNR (sold-to party) is the customer who ordered the goods and to whom the invoice is addressed. Without
    it, billing cannot be created, AR postings cannot be generated, and the order has no commercial counterparty. This is
    a mandatory field enforced by SAP at order creation time.
  rule_authority: sap_hard_constraint
  sap_impact: "Billing document (VF01) cannot be created \u2014 no sold-to party for the invoice. AR posting has no customer\
    \ to debit. Revenue recognition is impossible."
  fix_map:
    __blank__: 'Sold-to customer is empty. In ECC: assign the correct customer number via VA02 > Header > Partners tab. In
      S/4HANA: use Fiori app F6588 or VA02. The customer must exist and have a valid sales area.'
  record_fix_template: 'SO {VBAK.VBELN}: KUNNR is {actual_value}. Assign the sold-to customer via VA02 > Header > Partners
    tab or Fiori app F6588.'
- id: SDSO003
  field: VBAK.AUART
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Sales document type is mandatory \u2014 controls entire order processing flow"
  why_it_matters: 'AUART (sales document type) determines the entire processing behaviour of the order: number range, item
    category determination, delivery type, billing type, and copy control. Without it, SAP cannot determine how to process
    the order through delivery, billing, or returns.'
  rule_authority: sap_hard_constraint
  sap_impact: Order processing flow is undefined. Item category determination, delivery type, and billing type all fail. The
    order is stuck and cannot progress through the order-to-cash cycle.
  fix_map:
    __blank__: 'Sales document type is empty. In ECC: set via VA02 or recreate via VA01 with the correct document type. In
      S/4HANA: use Fiori app F6588. Common types: OR (standard order), SO (rush order), RE (return).'
  record_fix_template: 'SO {VBAK.VBELN}: AUART is {actual_value}. Set the document type via VA02 or Fiori app F6588.'
- id: SDSO004
  field: VBAK.AUART
  check_class: domain_value_check
  severity: high
  dimension: validity
  message: Sales document type must be a valid SD document type code
  why_it_matters: AUART must be one of the configured sales document types. Invalid values prevent item category determination
    (VOV4/VOV5), delivery type determination, and billing type assignment. The order cannot be processed through any standard
    SD workflow.
  rule_authority: sap_hard_constraint
  sap_impact: Item category determination fails. Delivery and billing types cannot be resolved. Copy control for subsequent
    documents is not configured for the invalid type.
  valid_values_with_labels:
    OR: Standard Order — normal sales order
    SO: Rush Order — expedited processing
    ZOR: Custom Standard Order — company-specific variant
    RE: Return — customer return of goods
    CR: Credit Memo Request
    DR: Debit Memo Request
    RO: Return Order — with reference to billing
  fix_map:
    __other__: 'Sales document type ''{invalid_value}'' is not a recognised value. Valid types: OR (standard), SO (rush),
      ZOR (custom standard), RE (return), CR (credit memo), DR (debit memo), RO (return order). In ECC: correct via VA02 or
      recreate via VA01. In S/4HANA: use Fiori app F6588.'
  record_fix_template: 'SO {VBAK.VBELN}: AUART is ''{actual_value}''. Set to a valid document type via VA02 or Fiori app F6588.'
- id: SDSO005
  field: VBAK.VKORG
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Sales organisation is mandatory \u2014 determines pricing, output, and org context"
  why_it_matters: VKORG (sales organisation) on the order header determines which pricing conditions, output types, and organisational
    settings apply. Without it, the order has no organisational context and cannot be processed through any SD workflow. It
    is part of the sales area (VKORG/VTWEG/SPART).
  rule_authority: sap_hard_constraint
  sap_impact: "Order cannot be processed \u2014 no sales area context. Pricing, output determination, and delivery plant determination\
    \ all fail. The order is stuck in an incomplete state."
  fix_map:
    __blank__: 'Sales organisation is empty. In ECC: verify the customer master has a valid sales area and recreate the order
      via VA01. In S/4HANA: use Fiori app F6588. This is typically set automatically from the customer''s sales area.'
  record_fix_template: 'SO {VBAK.VBELN}: VKORG is {actual_value}. Verify the customer''s sales area and correct via VA02 or
    Fiori app F6588.'
- id: SDSO006
  field: VBAK.VTWEG
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Distribution channel is mandatory \u2014 part of the sales area key"
  why_it_matters: VTWEG (distribution channel) is part of the three-part sales area key (VKORG/VTWEG/SPART). It determines
    which pricing conditions, customer agreements, and material listings apply. Without it, the sales area is incomplete and
    the order cannot be processed.
  rule_authority: sap_hard_constraint
  sap_impact: Sales area is incomplete. Pricing condition records cannot be found. Customer-material info records are not
    accessible. Output determination fails.
  fix_map:
    __blank__: 'Distribution channel is empty. In ECC: set via VA02 or recreate via VA01 with a valid sales area. In S/4HANA:
      use Fiori app F6588. The distribution channel must be assigned to the sales organisation in the enterprise structure.'
  record_fix_template: 'SO {VBAK.VBELN}: VTWEG is {actual_value}. Set the distribution channel via VA02 or Fiori app F6588.'
- id: SDSO007
  field: VBAK.SPART
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Division is mandatory \u2014 part of the sales area key"
  why_it_matters: SPART (division) is the third part of the sales area key (VKORG/VTWEG/SPART). It enables product-line specific
    configuration for pricing, output, and partner determination. Without it, the sales area is incomplete and the order cannot
    be processed through standard SD flows.
  rule_authority: sap_hard_constraint
  sap_impact: Sales area is incomplete. Pricing and output determination fail. Partner determination rules cannot resolve.
    The order is stuck.
  fix_map:
    __blank__: 'Division is empty. In ECC: set via VA02 or recreate via VA01 with a valid sales area. In S/4HANA: use Fiori
      app F6588. The division must be assigned to the sales organisation in the enterprise structure.'
  record_fix_template: 'SO {VBAK.VBELN}: SPART is {actual_value}. Set the division via VA02 or Fiori app F6588.'
- id: SDSO008
  field: VBAK.WAERK
  check_class: null_check
  severity: high
  dimension: completeness
  message: "Currency code missing \u2014 all order values are meaningless without currency"
  why_it_matters: WAERK (document currency) defines the currency for all monetary values on the sales order. Without it, prices
    and totals have no currency context, exchange rate determination fails in billing, and financial postings cannot be generated.
    This is inherited from the customer master or sales organisation.
  rule_authority: sap_hard_constraint
  sap_impact: Order values have no currency context. Billing document (VF01) cannot determine exchange rates. Financial postings
    generate errors. Revenue reporting by currency is inaccurate.
  fix_map:
    __blank__: 'Currency code is empty. In ECC: set the correct ISO currency code via VA02 > Header > Sales tab. In S/4HANA:
      use Fiori app F6588 or VA02. This is typically inherited from the customer master or sales organisation.'
  record_fix_template: 'SO {VBAK.VBELN}: WAERK is {actual_value}. Set the currency code via VA02 > Header > Sales tab or Fiori
    app F6588.'
- id: SDSO009
  field: VBAK.ERDAT
  check_class: null_check
  severity: medium
  dimension: completeness
  message: "Order creation date missing \u2014 affects order aging and reporting"
  why_it_matters: ERDAT (creation date) records when the sales order was created. Without it, order aging analysis, backlog
    reporting by period, and SLA tracking cannot include this order. It is also used for credit management date checks and
    order history queries.
  rule_authority: best_practice
  sap_impact: Order aging reports are inaccurate. Backlog analysis by period excludes this order. Credit management date-based
    checks may fail. VA05 (list of sales orders) cannot filter by creation date.
  fix_map:
    __blank__: "Creation date is empty. In ECC: this is normally set automatically by VA01. If missing, it indicates a data\
      \ load issue \u2014 correct in the source data. In S/4HANA: verify via Fiori app F6588."
  record_fix_template: "SO {VBAK.VBELN}: ERDAT is {actual_value}. Investigate the data source \u2014 creation date should\
    \ be set automatically."
- id: SDSO010
  field: VBAK.VDATU
  check_class: null_check
  applies_when:
    VBAK.VBTYP:
    - C
  severity: medium
  dimension: completeness
  message: "Requested delivery date missing \u2014 delivery scheduling cannot be performed"
  why_it_matters: VDATU (requested delivery date) is the customer's desired delivery date. It drives delivery scheduling,
    ATP check, and route determination. Without it, the system cannot schedule the delivery and the order may never appear
    on the delivery due list (VL04).
  rule_authority: best_practice
  sap_impact: Delivery scheduling cannot determine a delivery date. ATP check (CO09) has no target date. VL04 delivery due
    list may not pick up this order. Customer service level tracking is impossible.
  fix_map:
    __blank__: 'Requested delivery date is empty. In ECC: set via VA02 > Header > Shipping tab. In S/4HANA: use Fiori app
      F6588. Obtain the date from the customer purchase order or commercial agreement.'
  record_fix_template: 'SO {VBAK.VBELN}: VDATU is {actual_value}. Set the requested delivery date via VA02 > Shipping tab
    or Fiori app F6588.'
- id: SDSO012
  field: VBAK.BSTNK
  check_class: null_check
  applies_when:
    VBAK.VBTYP:
    - C
  severity: low
  dimension: completeness
  message: Customer PO number missing — external reference for order tracking
  why_it_matters: BSTNK (customer purchase order number) is the customer's external reference for the sales order. Without
    it, customer enquiries about order status cannot be matched, invoice verification on the customer side is difficult, and
    audit trails between customer and supplier systems are broken.
  rule_authority: best_practice
  sap_impact: Customer order reference is missing. VA05 search by PO number returns nothing. Customer-side invoice verification
    is delayed. Dispute resolution lacks the cross-reference.
  fix_map:
    __blank__: 'Customer PO number is empty. In ECC: enter via VA02 > Header > PO Number field. In S/4HANA: use Fiori app
      F6588. Obtain from the customer''s purchase order document.'
  record_fix_template: 'SO {VBAK.VBELN}: BSTNK is {actual_value}. Enter the customer PO number via VA02 or Fiori app F6588.'
- id: SDSO013
  field: VBAK.LIFSK
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: Delivery block must be a valid code or blank (unblocked)
  why_it_matters: LIFSK (delivery block) controls whether the order can proceed to delivery. Invalid block codes cause processing
    errors — the system cannot determine how to handle the block and the order may be stuck in an undefined state with no
    valid release path configured.
  rule_authority: best_practice
  sap_impact: Invalid delivery block code causes errors in delivery creation (VL01N). Order may be permanently blocked with
    no valid release path. Delivery due list (VL04) cannot process the order.
  valid_values_with_labels:
    ? ''
    : No block — order is free for delivery
    '01': Credit block — pending credit check release
    '02': General delivery block — manual release required
    ZL: Custom logistics block — warehouse approval required
    ZC: Custom compliance block — export control review
  fix_map:
    __other__: 'Delivery block code ''{invalid_value}'' is not a recognised value. Valid codes: blank (no block), 01 (credit
      block), 02 (general block), ZL (logistics block), ZC (compliance block). In ECC: correct via VA02 > Header > Shipping
      tab. In S/4HANA: use VA02 or Fiori app F6588.'
  record_fix_template: 'SO {VBAK.VBELN}: LIFSK is ''{actual_value}''. Set to a valid delivery block code or blank via VA02
    > Shipping tab or Fiori app F6588.'
- id: SDSO014
  field: VBAK.FAKSK
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: Billing block must be a valid code or blank (unblocked)
  why_it_matters: FAKSK (billing block) prevents the order from being billed. Invalid block codes mean the billing due list
    (VF04) cannot process the order and there is no configured release workflow for the invalid code. Revenue recognition
    is delayed indefinitely.
  rule_authority: best_practice
  sap_impact: Billing document (VF01) cannot be created. VF04 billing due list skips the order. Revenue recognition is delayed.
    AR posting is not generated.
  valid_values_with_labels:
    ? ''
    : No block — order is free for billing
    '01': General billing block — manual release required
    '02': Price verification block — pricing must be confirmed
    ZB: Custom billing block — finance approval required
    ZF: Custom block — free of charge confirmation needed
  fix_map:
    __other__: 'Billing block code ''{invalid_value}'' is not a recognised value. Valid codes: blank (no block), 01 (general),
      02 (price verification), ZB (finance approval), ZF (FOC confirmation). In ECC: correct via VA02 > Header > Billing tab.
      In S/4HANA: use VA02 or Fiori app F6588.'
  record_fix_template: 'SO {VBAK.VBELN}: FAKSK is ''{actual_value}''. Set to a valid billing block code or blank via VA02
    > Billing tab or Fiori app F6588.'
- id: SDSO015
  field: VBAP.MATNR
  check_class: null_check
  severity: high
  dimension: completeness
  message: Material number missing — order line cannot be matched to inventory
  why_it_matters: MATNR on a sales order line links the order to the material master. Without it, availability check (ATP)
    cannot be performed, delivery cannot pick stock, and the line cannot be properly priced from condition records. For service
    items, material may be intentionally blank.
  rule_authority: sap_hard_constraint
  sap_impact: ATP check (CO09) cannot be performed. Delivery (VL01N) cannot pick stock. Material-based pricing conditions
    are not found. The line may be skipped in delivery processing.
  fix_map:
    __blank__: 'Material number is empty. In ECC: assign the correct material via VA02 > Item > Material field. In S/4HANA:
      use Fiori app F6588. For service items, material may be intentionally blank — verify the item category (PSTYV).'
  record_fix_template: 'SO {VBAK.VBELN} item {VBAP.POSNR}: MATNR is {actual_value}. Assign the material number via VA02 or
    Fiori app F6588 if this is a stock item.'
  applies_when:
    VBAP.PSTYV:
      not_in:
      - TATX
- id: SDSO016
  field: VBAP.MATNR
  check_class: regex_check
  pattern: ^[A-Z0-9\-_/\.]{1,40}$
  severity: high
  dimension: validity
  message: "Material number format is invalid \u2014 must be alphanumeric up to 40 characters"
  why_it_matters: In S/4HANA, material numbers are extended to 40 characters and must follow the alphanumeric format. Invalid
    characters or excessively long material numbers cause errors in order processing, delivery creation, and billing. Leading
    zeros are managed by conversion exits.
  rule_authority: sap_hard_constraint
  sap_impact: Material cannot be found in the material master (MM03). Order line processing fails. Delivery and billing reference
    an invalid material.
  fix_map:
    __other__: 'Material number ''{invalid_value}'' does not match the required format. Must be alphanumeric (A-Z, 0-9, hyphens,
      underscores, slashes, dots), up to 40 characters. In ECC: correct via VA02. In S/4HANA: use Fiori app F6588. Verify
      the material exists in MM03.'
  record_fix_template: 'SO {VBAK.VBELN} item {VBAP.POSNR}: MATNR ''{actual_value}'' is invalid. Correct the material number
    format via VA02 or Fiori app F6588.'
- id: SDSO017
  field: VBAP.KWMENG
  check_class: null_check
  applies_when:
    VBAK.VBTYP:
    - C
  severity: critical
  dimension: completeness
  message: "Order quantity is mandatory \u2014 zero means order line cannot be delivered or invoiced"
  why_it_matters: "KWMENG is the cumulative order quantity on the sales order line. Zero or blank means no delivery can be\
    \ created and no billing document can be generated. The line is effectively dead \u2014 it appears on the order but produces\
    \ no output through the order-to-cash cycle."
  rule_authority: sap_hard_constraint
  sap_impact: Delivery (VL01N) creates no delivery quantity. Billing (VF01) has no quantity to invoice. Revenue is zero. Backlog
    reporting is incorrect.
  fix_map:
    __blank__: 'Order quantity is zero or blank. In ECC: set the correct quantity via VA02 > Item > Quantity field. In S/4HANA:
      use Fiori app F6588. Verify the sales unit of measure (VRKME) is also correct.'
  record_fix_template: 'SO {VBAK.VBELN} item {VBAP.POSNR}: KWMENG is {actual_value}. Set the correct order quantity via VA02
    or Fiori app F6588.'
- id: SDSO018
  field: VBAP.NETWR
  check_class: null_check
  severity: high
  dimension: completeness
  message: "Item net value missing \u2014 order line has no financial value"
  why_it_matters: "NETWR at the item level is the net value after all pricing conditions are applied. Zero or blank means\
    \ the line has no revenue value \u2014 billing will produce a zero-value invoice line and revenue recognition records\
    \ nothing for this item."
  rule_authority: sap_hard_constraint
  sap_impact: Billing document (VF01) shows zero value for this line. Revenue recognition is zero. Profitability analysis
    (CO-PA) records no contribution. Sales reporting understates revenue.
  fix_map:
    __blank__: 'Net value is zero or blank. In ECC: check pricing conditions via VA02 > Item > Conditions tab. In S/4HANA:
      use Fiori app F6588. Verify the pricing procedure is assigned and condition records exist.'
  record_fix_template: 'SO {VBAK.VBELN} item {VBAP.POSNR}: NETWR is {actual_value}. Review pricing conditions via VA02 > Conditions
    tab or Fiori app F6588.'
- id: SDSO019
  field: VBAP.PSTYV
  check_class: null_check
  severity: high
  dimension: completeness
  message: "Item category missing \u2014 controls delivery, billing, and revenue relevance"
  why_it_matters: "PSTYV (item category) controls whether the order line is relevant for delivery, billing, and revenue recognition.\
    \ Missing means the line's processing behaviour is undefined \u2014 it may be skipped entirely in delivery and billing\
    \ processing."
  rule_authority: sap_hard_constraint
  sap_impact: "Delivery relevance is undefined \u2014 VL01N may skip this line. Billing relevance is undefined \u2014 VF01\
    \ may not invoice it. Revenue recognition and CO-PA posting may be incorrect."
  fix_map:
    __blank__: 'Item category is empty. This is normally determined automatically from the sales document type, item category
      group, and usage. In ECC: check VOV4/VOV5 configuration and the material master. In S/4HANA: verify via Fiori app F6588.
      Set manually via VA02 if needed.'
  record_fix_template: 'SO {VBAK.VBELN} item {VBAP.POSNR}: PSTYV is {actual_value}. Verify item category determination and
    correct via VA02 or Fiori app F6588.'
- id: SDSO020
  field: VBAP.PSTYV
  check_class: domain_value_check
  severity: high
  dimension: validity
  message: Item category must be a valid SD item category code
  why_it_matters: PSTYV must be a configured item category that determines delivery relevance, billing relevance, pricing,
    and schedule line category determination. Invalid values cause the entire item processing logic to fail — no delivery,
    no billing, no revenue posting.
  rule_authority: sap_hard_constraint
  sap_impact: Item processing logic is undefined. Delivery and billing relevance cannot be determined. Schedule line category
    determination fails.
  valid_values_with_labels:
    TAN: Standard Item — delivery and billing relevant
    TAX: Text Item — no delivery, no billing
    TAPS: Sub-Item — subordinate to a main item
    TAB: Individual Purchase Order — third-party processing
    TAC: Cash Sale Item — immediate delivery and billing
    TAD: Service Item — no delivery, billing relevant
    TAS: Third-Party Item — shipped directly by vendor
  fix_map:
    __other__: 'Item category ''{invalid_value}'' is not a recognised value. Valid categories: TAN (standard), TAX (text),
      TAPS (sub-item), TAB (individual PO), TAC (cash sale), TAD (service), TAS (third-party). In ECC: correct via VA02. In
      S/4HANA: use Fiori app F6588.'
  record_fix_template: 'SO {VBAK.VBELN} item {VBAP.POSNR}: PSTYV is ''{actual_value}''. Set to a valid item category via VA02
    or Fiori app F6588.'
- id: SDSO021
  field: VBAP.WERKS
  check_class: null_check
  severity: high
  dimension: completeness
  message: Delivering plant missing — delivery cannot determine source of goods
  why_it_matters: WERKS (delivering plant) on the order item determines where goods are shipped from. Without it, delivery
    creation (VL01N) cannot determine the source plant, warehouse, or storage location. ATP check also requires a plant to
    check available stock.
  rule_authority: sap_hard_constraint
  sap_impact: Delivery (VL01N) cannot determine the source plant. ATP check cannot verify stock availability. Picking and
    shipping cannot be executed. The item is stuck in the order.
  fix_map:
    __blank__: 'Delivering plant is empty. In ECC: assign the correct plant via VA02 > Item > Shipping tab. In S/4HANA: use
      Fiori app F6588. The plant is normally determined from the customer-material info record or customer master.'
  record_fix_template: 'SO {VBAK.VBELN} item {VBAP.POSNR}: WERKS is {actual_value}. Assign the delivering plant via VA02 >
    Shipping tab or Fiori app F6588.'
  applies_when:
    VBAK.VBTYP:
    - C
    VBAP.PSTYV:
      not_in:
      - TATX
- id: SDSO022
  field: VBAP.VRKME
  check_class: null_check
  applies_when:
    VBAK.VBTYP:
    - C
  severity: medium
  dimension: completeness
  message: "Sales unit of measure missing \u2014 quantity has no unit context"
  why_it_matters: VRKME (sales unit of measure) defines the unit in which the order quantity is expressed. Without it, quantity
    conversion between sales and base units cannot be performed, and the delivery quantity may be incorrectly calculated if
    the sales UoM differs from the base UoM.
  rule_authority: best_practice
  sap_impact: Quantity conversion fails if sales UoM differs from base UoM. Delivery quantity may be incorrect. Billing quantity
    is ambiguous.
  fix_map:
    __blank__: 'Sales unit of measure is empty. In ECC: set via VA02 > Item > Sales Unit field. In S/4HANA: use Fiori app
      F6588. This is normally inherited from the material master.'
  record_fix_template: 'SO {VBAK.VBELN} item {VBAP.POSNR}: VRKME is {actual_value}. Set the sales unit via VA02 or Fiori app
    F6588.'
- id: SDSO023
  field: VBAK.VBELN
  check_class: regex_check
  pattern: ^[0-9]{1,10}$
  severity: high
  dimension: validity
  message: Sales order number must be numeric, up to 10 digits
  why_it_matters: Sales order numbers in SAP must be numeric and up to 10 digits. Non-numeric or oversized values indicate
    data corruption or incorrect data loading. Such values cannot be used as foreign keys in delivery (LIKP.VGBEL) or billing
    (VBRK.AUBEL) documents.
  rule_authority: sap_hard_constraint
  sap_impact: Foreign key references from delivery and billing documents fail. Order status tracking across the document flow
    is broken.
  fix_map:
    __other__: "Sales order number '{invalid_value}' does not match the required numeric format (up to 10 digits). In ECC:\
      \ this indicates data corruption \u2014 recreate the order via VA01. In S/4HANA: use Fiori app F6588. Verify number\
      \ range configuration in SNRO."
  record_fix_template: 'SO {VBAK.VBELN}: VBELN ''{actual_value}'' is not valid. Must be numeric, up to 10 digits. Recreate
    via VA01 or Fiori app F6588.'
- id: SDSO025
  field: VBAK.ABSTK
  check_class: cross_field_check
  severity: high
  dimension: consistency
  message: Order is fully rejected (VBAK.ABSTK = C) but the item has no reason for rejection
  why_it_matters: When the overall rejection status (ABSTK) indicates the order is rejected but individual line
    items have no rejection reason (ABGRU), there is an inconsistency. Every rejected order should have documented
    rejection reasons at the item level for proper rejection analysis and audit compliance.
  rule_authority: best_practice
  sap_impact: Rejection analysis is inconsistent — header says rejected but items show no reason. VA05 rejection
    reports are incomplete. Lost-sales KPIs are unreliable.
  fix_map: {__blank__: 'Order rejection status (ABSTK) is set but item rejection reason (ABGRU) is blank. In ECC:
      set the rejection reason on each item via VA02 > Item > Reason for Rejection. In S/4HANA: use Fiori app F6588.'}
  record_fix_template: 'SO {VBAK.VBELN}: ABSTK is ''{actual_value}'' but ABGRU is blank. Set the rejection reason
    on each item via VA02 or Fiori app F6588.'
  fail_when: (`VBAK.ABSTK` == 'C') & `VBAP.ABGRU`.isna()
- id: SDSO027
  field: VBAK.ERNAM
  check_class: null_check
  severity: low
  dimension: completeness
  message: "Created-by user missing \u2014 audit trail for order creation is incomplete"
  why_it_matters: "ERNAM records the user who created the sales order. Without it, audit trails are incomplete \u2014 it is\
    \ impossible to determine who created the order for segregation of duties checks, fraud investigation, or process compliance."
  rule_authority: best_practice
  sap_impact: Audit trail is incomplete. Segregation of duties analysis cannot identify the order creator. VA05 search by
    created-by user returns nothing for this order.
  fix_map:
    __blank__: "Created-by user is empty. This is normally set automatically by SAP at order creation time. If missing, it\
      \ indicates a data load issue \u2014 this field cannot be manually set. Document the gap in the data migration log."
  record_fix_template: "SO {VBAK.VBELN}: ERNAM is {actual_value}. This field is system-set \u2014 investigate the data source\
    \ for the missing audit trail."
- id: SDSO028
  field: VBAK.GBSTK
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Overall status is missing
  why_it_matters: Overall status (VBAK.GBSTK) is not maintained. This field supports downstream processes and reporting accuracy.
    Missing data may result in incomplete records or processing gaps.
  rule_authority: best_practice
  sap_impact: Missing Overall status may cause incomplete data in related transactions and reports.
  fix_map:
    __blank__: 'In ECC: Set via VA02. In S/4HANA: Use Fiori app F6588 (Create Sales Order).'
  record_fix_template: 'Record is missing VBAK.GBSTK. In ECC: Set via VA02. In S/4HANA: Use Fiori app F6588 (Create Sales
    Order).'
- id: SDSO029
  field: VBAP.ARKTX
  check_class: null_check
  severity: high
  dimension: completeness
  message: Item description is missing
  why_it_matters: Item description (VBAP.ARKTX) is not maintained. This field supports downstream processes and reporting
    accuracy. Missing data may result in incomplete records or processing gaps.
  rule_authority: best_practice
  sap_impact: Missing Item description may cause incomplete data in related transactions and reports.
  fix_map:
    __blank__: 'In ECC: Set via VA02. In S/4HANA: Use Fiori app F6588 (Create Sales Order).'
  record_fix_template: 'Record is missing VBAP.ARKTX. In ECC: Set via VA02. In S/4HANA: Use Fiori app F6588 (Create Sales
    Order).'
- id: SDSO032
  field: VBAP.POSNR
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Item number is missing
  why_it_matters: Item number (VBAP.POSNR) is not maintained. This field supports downstream processes and reporting accuracy.
    Missing data may result in incomplete records or processing gaps.
  rule_authority: best_practice
  sap_impact: Missing Item number may cause incomplete data in related transactions and reports.
  fix_map:
    __blank__: 'In ECC: Set via VA02. In S/4HANA: Use Fiori app F6588 (Create Sales Order).'
  record_fix_template: 'Record is missing VBAP.POSNR. In ECC: Set via VA02. In S/4HANA: Use Fiori app F6588 (Create Sales
    Order).'
- id: SDSO033
  field: VBAK.VBELN
  check_class: uniqueness_check
  fields: [VBAK.VBELN]
  severity: critical
  dimension: uniqueness
  message: Duplicate sales order numbers detected — each sales order must be unique
  why_it_matters: Duplicate sales order numbers indicate a data extract issue (e.g. header-item join). Each VBELN
    must be unique at header level. Duplicates distort order volume reports and revenue analytics.
  rule_authority: sap_hard_constraint
  sap_impact: Order volume and revenue reports are overstated. Delivery creation references ambiguous orders. Billing
    may process the same order twice.
  fix_map: {__blank__: 'This is typically a data extract issue — ensure the extract is at header level (VBAK) not
      header-item (VBAK+VBAP). If genuine duplicates exist, escalate to Basis.'}
  record_fix_template: "Sales order {VBAK.VBELN} appears more than once. Investigate the load or interface that created it; keep one document and reject or delete the other via VA02."

- id: SDSO034
  field: VBAK.ERDAT
  check_class: freshness_check
  max_age_hours: 8760
  severity: medium
  dimension: timeliness
  message: Open sales order older than 1 year — review for closure or rejection
  rule_authority: best_practice
  why_it_matters: Sales orders open beyond 12 months usually represent stuck or abandoned demand that inflates the
    order backlog and misleads revenue forecasting.
  sap_impact: Backlog and forecast figures are overstated; ATP and MRP plan against demand that will not convert;
    incomplete orders block billing.
  fix_map: {__blank__: 'Review the order in VA02 / VA05: confirm whether it will still be delivered; complete the
      open items, reject the lines (reason for rejection), or close the order.'}
  record_fix_template: Sales order {field} dated {age_days} days ago. Confirm in VA02 whether still valid; reject
    lines or close if abandoned.
  applies_when:
    VBAK.VBTYP:
    - C
    VBAK.GBSTK:
      not_in: [C]

- id: SDSO035
  field: VBAP.KWMENG
  check_class: cross_field_check
  severity: high
  dimension: accuracy
  message: Sales order line has zero or negative order quantity — indicates configuration or entry error
  why_it_matters: Zero or negative quantities on sales order lines cause delivery creation failures, incorrect revenue recognition,
    and pricing errors.
  rule_authority: best_practice
  sap_impact: Delivery cannot be created for zero-quantity line. Revenue is not recognised. Pricing conditions produce zero
    or negative amounts.
  fix_map:
    __blank__: Review the order line via VA02. If a returns order is intended, use the correct order type (RE). If data error,
      correct the quantity.
  fail_when: ~(`VBAP.KWMENG` > 0)
  require_populated: true
  applies_when:
    VBAK.VBTYP:
    - C
    VBAP.PSTYV:
      not_in:
      - TATX
  record_fix_template: "Sales order {VBAP.VBELN} item {VBAP.POSNR}: order quantity is {actual_value}. Enter a positive quantity in VA02, or reject the item with a reason."
- id: XO2C001
  field: VBAK.VBELN
  check_class: cross_field_check
  grain: VBAK
  fail_when: (`KNA1.LOEVM` == 'X')
  applies_when:
    VBAK.GBSTK: {not_in: [C]}
  severity: high
  dimension: consistency
  message: Open sales order for a customer flagged for deletion
  why_it_matters: The deletion flag does not stop existing orders — deliveries and invoices keep flowing to a customer
    the business has retired.
  rule_authority: best_practice
  sap_impact: Deliveries and billing continue for a retired customer; the customer cannot be archived.
  fix_map:
    __other__: Reject the open items (VA02, reason for rejection) or move them to the successor account; remove the
      deletion flag (VD06/XD06, BP in S/4HANA) if the customer is still active.
  record_fix_template: 'Sales order {VBAK.VBELN}: sold-to {VBAK.KUNNR} is flagged for deletion.'
- id: XO2C002
  field: VBAK.VBELN
  check_class: cross_field_check
  grain: VBAK
  fail_when: '`KNA1.AUFSD`.notna() & `VBAK.LIFSK`.isna()'
  applies_when:
    VBAK.GBSTK:
      not_in:
      - C
  severity: medium
  dimension: consistency
  message: Open sales order for a customer with a central order block
  why_it_matters: The order block was set after this order was created; the order still delivers unless it is reviewed. Either
    the block or the order is out of date.
  rule_authority: best_practice
  sap_impact: Goods ship to a customer the business has blocked (credit, legal, or commercial reasons).
  fix_map:
    __other__: Review the order with the owner of the block; set a delivery block on the order (VA02, header > Shipping >
      delivery block) or lift the customer block (XD05/VD05).
  record_fix_template: 'Sales order {VBAK.VBELN}: sold-to {VBAK.KUNNR} has order block ''{KNA1.AUFSD}''.'
- id: XO2C003
  field: VBAP.MATNR
  check_class: cross_field_check
  grain: VBAP
  fail_when: (`MARA.LVORM` == 'X')
  applies_when:
    VBAP.GBSTA:
      not_in:
      - C
    VBAP.MATNR:
      populated: true
  severity: high
  dimension: consistency
  message: Open sales order item for a material flagged for deletion
  why_it_matters: The item will still deliver and bill a material queued for archiving.
  rule_authority: best_practice
  sap_impact: Deliveries and revenue post against a material being retired; the material cannot be archived.
  fix_map:
    __other__: Reject the item (VA02, reason for rejection) or substitute the successor material; remove the deletion flag
      (MM06) if the material is still sold.
  record_fix_template: 'Sales order {VBAP.VBELN} item {VBAP.POSNR}: material {VBAP.MATNR} is flagged for deletion.'

# ── Item ↔ header consistency ──────────────────────────────────────────────
- id: SDSO036
  field: VBAP.WAERK
  check_class: cross_field_check
  grain: VBAP
  fail_when: (`VBAP.WAERK` != `VBAK.WAERK`)
  severity: high
  dimension: consistency
  message: Item currency differs from the sales document currency
  why_it_matters: >-
    A sales document has one document currency; SAP copies it into every item. An item in another
    currency was changed or loaded outside the order logic, so its net value is added into the order
    value, credit exposure and billing in the wrong currency.
  rule_authority: sap_hard_constraint
  sap_impact: Order value (VBAK.NETWR), credit exposure (FD32 / UKM) and the billing document add amounts
    in different currencies; revenue is misstated.
  fix_map:
    __other__: Display the order in VA03; if the item currency is wrong in the system, reject the item and
      re-enter it (VA02), or recreate the order. Re-extract if VA03 shows one currency.
  record_fix_template: 'Sales order {VBAP.VBELN} item {VBAP.POSNR}: item currency {VBAP.WAERK}, document currency
    {VBAK.WAERK}.'

- id: SDSO037
  field: VBAP.GBSTA
  check_class: cross_field_check
  grain: VBAP
  fail_when: (`VBAK.GBSTK` == 'C') & ((`VBAP.GBSTA` == 'A') | (`VBAP.GBSTA` == 'B'))
  severity: high
  dimension: consistency
  message: Sales order is completed at header level, but this item is still open
  why_it_matters: >-
    The header's overall processing status is derived from its items: the order is only completed
    when every item is completed or rejected. A completed header over an open item is a broken status
    update — the open item is invisible to every list that selects open orders by header status.
  rule_authority: sap_hard_constraint
  sap_impact: Backlog and delivery due lists (VA05, VL10) skip the open item; the item is never
    delivered or billed, or is delivered without anyone tracking it.
  fix_map:
    __other__: Recalculate the document status with report SDVBUK00, then deliver or reject the item (VA02).
  record_fix_template: 'Sales order {VBAP.VBELN} item {VBAP.POSNR}: item status ''{actual_value}'' under a completed
    header.'

- id: SDSO038
  field: VBAP.ERDAT
  check_class: cross_field_check
  grain: VBAP
  fail_when: (`VBAP.ERDAT` < `VBAK.ERDAT`)
  severity: low
  dimension: consistency
  message: Order item was created before its sales order
  why_it_matters: >-
    An item is created with or after its document; its creation date can never precede the header's.
    An earlier date means one of them was loaded or changed wrongly, and order-intake and cycle-time
    reporting by item date is distorted.
  rule_authority: sap_hard_constraint
  sap_impact: Order intake per period and order-to-delivery lead times are misreported.
  fix_map:
    __other__: Correct the creation dates in the migration source and reload, or document the gap; the
      dates cannot be changed in VA02.
  record_fix_template: 'Sales order {VBAP.VBELN} item {VBAP.POSNR}: item created {VBAP.ERDAT}, order created
    {VBAK.ERDAT}.'

# ── Header validity periods ───────────────────────────────────────────────
- id: SDSO039
  field: VBAK.BNDDT
  check_class: cross_field_check
  fail_when: (`VBAK.BNDDT` < `VBAK.ANGDT`)
  severity: medium
  dimension: consistency
  message: Quotation / inquiry is valid to a date before it is valid from
  why_it_matters: >-
    A quotation is binding from its valid-from date to its valid-to date. A valid-to date before the
    valid-from date covers no day: the quotation can never be referenced by an order, yet it stays
    open in the quotation lists.
  rule_authority: sap_hard_constraint
  sap_impact: Orders with reference to the quotation fail; quotation follow-up (VA25) and the
    quotation success rate are wrong.
  fix_map:
    __other__: Correct the validity period in VA22 (header > Sales tab), or reject the quotation if it
      has expired.
  record_fix_template: 'Quotation {VBAK.VBELN}: valid from {VBAK.ANGDT} to {VBAK.BNDDT}.'

- id: SDSO040
  field: VBAK.GUEEN
  check_class: cross_field_check
  fail_when: (`VBAK.GUEEN` < `VBAK.GUEBG`)
  severity: medium
  dimension: consistency
  message: Contract / scheduling agreement is valid to a date before it is valid from
  why_it_matters: >-
    Release orders and billing plans of an outline agreement are only possible within its validity
    period. An end date before the start date gives the agreement no validity at all.
  rule_authority: sap_hard_constraint
  sap_impact: Release orders against the contract are rejected; periodic billing plans and contract
    renewal lists (VA45) are wrong.
  fix_map:
    __other__: Correct the contract validity in VA42 (header > Contract data tab).
  record_fix_template: 'Contract {VBAK.VBELN}: valid from {VBAK.GUEBG} to {VBAK.GUEEN}.'

# ── Item quantities, units and weights ─────────────────────────────────────
- id: SDSO041
  field: VBAP.UMVKZ
  check_class: cross_field_check
  fail_when: >-
    ((`VBAP.VRKME` == `VBAP.MEINS`) & (`VBAP.UMVKZ` != `VBAP.UMVKN`))
    | (`VBAP.UMVKZ` <= 0) | (`VBAP.UMVKN` <= 0)
  applies_when:
    VBAP.MATNR:
      populated: true
  severity: high
  dimension: accuracy
  message: Conversion between sales unit and base unit is zero or contradicts identical units
  why_it_matters: >-
    The order quantity is converted into the base unit with the item's numerator/denominator
    (UMVKZ/UMVKN) for availability check, delivery and goods issue. A zero factor turns every quantity
    into zero or a division error; when sales and base unit are the same, the factor must be 1.
  rule_authority: sap_hard_constraint
  sap_impact: ATP, delivery quantities and goods issue (VL02N) post wrong stock quantities.
  fix_map:
    __other__: Check the alternative units of measure of the material (MM02 > Units of measure); re-enter
      the item (VA02) so the conversion is redetermined.
  record_fix_template: 'Sales order {VBAP.VBELN} item {VBAP.POSNR}: {VBAP.VRKME} → {VBAP.MEINS} converted
    {VBAP.UMVKZ}/{VBAP.UMVKN}.'

- id: SDSO042
  field: VBAP.MEINS
  check_class: cross_field_check
  grain: VBAP
  fail_when: (`VBAP.MEINS` != `MARA.MEINS`)
  applies_when:
    VBAP.GBSTA:
      not_in: [C]
    VBAP.MATNR:
      populated: true
  severity: medium
  dimension: consistency
  message: Open order item has a base unit that differs from the material's base unit
  why_it_matters: >-
    Delivery, picking and goods issue convert quantities into the material's base unit. An open item
    whose base unit no longer matches the material master (base unit changed while orders were open,
    or a migration mismatch) converts the order quantity with the wrong factor.
  rule_authority: sap_hard_constraint
  sap_impact: Deliveries and goods issues post the wrong stock quantity; availability check confirms
    quantities in the wrong unit.
  fix_map:
    __other__: Reject the item and re-enter it (VA02) so the material's current base unit is used, or
      correct the material's base unit (MM02) if it was changed in error.
  record_fix_template: 'Sales order {VBAP.VBELN} item {VBAP.POSNR}: base unit {VBAP.MEINS}, material
    {VBAP.MATNR} has {MARA.MEINS}.'

- id: SDSO043
  field: VBAP.NTGEW
  check_class: cross_field_check
  fail_when: (`VBAP.NTGEW` > `VBAP.BRGEW`)
  severity: medium
  dimension: accuracy
  message: Item net weight is greater than its gross weight
  why_it_matters: >-
    Gross weight includes packaging, so it can never be below the net weight; SAP rejects it in the
    material master and derives item weights from it. A higher net weight comes from a manual
    override or a migration error.
  rule_authority: sap_hard_constraint
  sap_impact: Shipment weights, freight cost calculation and export declarations use wrong weights.
  fix_map:
    __other__: Correct the weights on the item (VA02 > Item > Shipping) or in the material master (MM02 >
      Basic data) and redetermine the item weights.
  record_fix_template: 'Sales order {VBAP.VBELN} item {VBAP.POSNR}: net weight {VBAP.NTGEW} > gross weight
    {VBAP.BRGEW}.'

- id: SDSO044
  field: VBAP.GEWEI
  check_class: cross_field_check
  fail_when: ((`VBAP.BRGEW` > 0) & `VBAP.GEWEI`.isna()) | ((`VBAP.VOLUM` > 0) & `VBAP.VOLEH`.isna())
  severity: medium
  dimension: consistency
  message: Item weight or volume has no unit
  why_it_matters: >-
    A weight or volume without its unit cannot be totalled — 12 could be kilograms or tonnes. SAP
    always stores the unit with the value; a missing unit comes from an interface or a migration.
  rule_authority: sap_hard_constraint
  sap_impact: Delivery and shipment totals, freight costs and load planning use undefined units.
  fix_map:
    __other__: Redetermine the weights and volume on the item (VA02 > Item > Shipping) from the material
      master, which must carry the weight and volume units (MM02 > Basic data).
  record_fix_template: 'Sales order {VBAP.VBELN} item {VBAP.POSNR}: weight {VBAP.BRGEW} {VBAP.GEWEI}, volume
    {VBAP.VOLUM} {VBAP.VOLEH}.'

# ── Cross-object: open orders on blocked masters ──────────────────────────
- id: SDSO045
  field: VBAK.KUNNR
  check_class: cross_field_check
  grain: VBAK
  fail_when: (`KNA1.SPERR` == 'X')
  applies_when:
    VBAK.GBSTK:
      not_in: [C]
    KNA1.LOEVM:
      blank: true
  severity: high
  dimension: consistency
  message: Open sales order for a customer blocked for posting
  why_it_matters: >-
    A central posting block on the customer stops every accounting document for the account. The open
    order still delivers, but its billing document cannot be released to accounting — revenue and the
    receivable are never posted. (Customers also flagged for deletion are reported by XO2C001.)
  rule_authority: sap_hard_constraint
  sap_impact: Billing documents stay blocked for accounting (VFX3 shows the posting block error);
    revenue and receivables are understated while goods have left.
  fix_map:
    __other__: Review the order with the owner of the block; set a delivery block on the order (VA02) or
      lift the posting block (XD05 / BP in S/4HANA) if the customer is still active.
  record_fix_template: 'Sales order {VBAK.VBELN}: sold-to {VBAK.KUNNR} is blocked for posting.'
- id: SDSO046
  field: A004.DATAB
  check_class: interval_check
  grain: A004
  group_by:
  - A004.KAPPL
  - A004.KSCHL
  - A004.VKORG
  - A004.VTWEG
  - A004.MATNR
  start: A004.DATAB
  end: A004.DATBI
  severity: high
  dimension: consistency
  message: Condition records for the same key (sales org / channel / material) have overlapping validity periods
  why_it_matters: 'For one condition type and key SAP keeps at most one record valid on any day: maintaining a new record
    delimits the old one. Overlapping records were loaded around that logic (direct loads, interfaces, condition-table copies),
    and pricing then picks whichever record it reads first.'
  rule_authority: sap_hard_constraint
  sap_impact: Documents dated inside the overlap get an unpredictable price; the price shown in the condition maintenance
    screen may not be the one used.
  fix_map:
    __other__: Display the records for the key (VK13 / MEK3), keep the intended one and delimit or delete the other (VK12
      / MEK2).
  record_fix_template: Condition {A004.KAPPL}/{A004.KSCHL}/{A004.VKORG}/{A004.VTWEG}/{A004.MATNR} valid from {A004.DATAB}
    to {A004.DATBI} overlaps another record.
- id: SDSO047
  field: A005.DATAB
  check_class: interval_check
  grain: A005
  group_by:
  - A005.KAPPL
  - A005.KSCHL
  - A005.VKORG
  - A005.VTWEG
  - A005.KUNNR
  - A005.MATNR
  start: A005.DATAB
  end: A005.DATBI
  severity: high
  dimension: consistency
  message: Condition records for the same key (sales org / channel / customer / material) have overlapping validity periods
  why_it_matters: 'For one condition type and key SAP keeps at most one record valid on any day: maintaining a new record
    delimits the old one. Overlapping records were loaded around that logic (direct loads, interfaces, condition-table copies),
    and pricing then picks whichever record it reads first.'
  rule_authority: sap_hard_constraint
  sap_impact: Documents dated inside the overlap get an unpredictable price; the price shown in the condition maintenance
    screen may not be the one used.
  fix_map:
    __other__: Display the records for the key (VK13 / MEK3), keep the intended one and delimit or delete the other (VK12
      / MEK2).
  record_fix_template: Condition {A005.KAPPL}/{A005.KSCHL}/{A005.VKORG}/{A005.VTWEG}/{A005.KUNNR}/{A005.MATNR} valid from
    {A005.DATAB} to {A005.DATBI} overlaps another record.
- id: SDSO048
  field: A304.DATAB
  check_class: interval_check
  grain: A304
  group_by:
  - A304.KAPPL
  - A304.KSCHL
  - A304.VKORG
  - A304.VTWEG
  - A304.MATNR
  - A304.KFRST
  start: A304.DATAB
  end: A304.DATBI
  severity: high
  dimension: consistency
  message: Condition records for the same key (sales org / channel / material) have overlapping validity periods
  why_it_matters: 'For one condition type and key SAP keeps at most one record valid on any day: maintaining a new record
    delimits the old one. Overlapping records were loaded around that logic (direct loads, interfaces, condition-table copies),
    and pricing then picks whichever record it reads first.'
  rule_authority: sap_hard_constraint
  sap_impact: Documents dated inside the overlap get an unpredictable price; the price shown in the condition maintenance
    screen may not be the one used.
  fix_map:
    __other__: Display the records for the key (VK13 / MEK3), keep the intended one and delimit or delete the other (VK12
      / MEK2).
  record_fix_template: Condition {A304.KAPPL}/{A304.KSCHL}/{A304.VKORG}/{A304.VTWEG}/{A304.MATNR}/{A304.KFRST} valid from
    {A304.DATAB} to {A304.DATBI} overlaps another record.
- id: SDSO049
  field: A305.DATAB
  check_class: interval_check
  grain: A305
  group_by:
  - A305.KAPPL
  - A305.KSCHL
  - A305.VKORG
  - A305.VTWEG
  - A305.KUNNR
  - A305.MATNR
  - A305.KFRST
  start: A305.DATAB
  end: A305.DATBI
  severity: high
  dimension: consistency
  message: Condition records for the same key (sales org / channel / customer / material) have overlapping validity periods
  why_it_matters: 'For one condition type and key SAP keeps at most one record valid on any day: maintaining a new record
    delimits the old one. Overlapping records were loaded around that logic (direct loads, interfaces, condition-table copies),
    and pricing then picks whichever record it reads first.'
  rule_authority: sap_hard_constraint
  sap_impact: Documents dated inside the overlap get an unpredictable price; the price shown in the condition maintenance
    screen may not be the one used.
  fix_map:
    __other__: Display the records for the key (VK13 / MEK3), keep the intended one and delimit or delete the other (VK12
      / MEK2).
  record_fix_template: Condition {A305.KAPPL}/{A305.KSCHL}/{A305.VKORG}/{A305.VTWEG}/{A305.KUNNR}/{A305.MATNR}/{A305.KFRST}
    valid from {A305.DATAB} to {A305.DATBI} overlaps another record.
- id: SDSO050
  field: KONH.DATAB
  check_class: cross_field_check
  grain: KONH
  fail_when: '`KONH.DATAB` > `KONH.DATBI`'
  applies_when:
    KONH.KAPPL:
    - V
  severity: high
  dimension: consistency
  message: Sales condition record is valid to a date before it is valid from
  why_it_matters: A condition record whose validity ends before it starts is never valid; pricing never finds it.
  rule_authority: sap_hard_constraint
  sap_impact: Documents fall back to another record or get no price at all.
  fix_map:
    __other__: Correct the validity period (VK12 / MEK2) or delete the record.
  record_fix_template: Condition record {KONH.KNUMH} ({KONH.KSCHL}) is valid from {KONH.DATAB} to {KONH.DATBI}.
- id: SDSO051
  field: KONP.KPEIN
  check_class: cross_field_check
  grain: KONH
  fail_when: (`KONP.KRECH` == 'C') & ((`KONP.KPEIN` == 0) | `KONP.KPEIN`.isna())
  applies_when:
    KONH.KAPPL:
    - V
  severity: high
  dimension: validity
  message: Quantity-based sales condition has no pricing unit
  why_it_matters: A quantity-based rate is 'amount per pricing unit'. Without a pricing unit the condition value cannot be
    computed (division by zero).
  rule_authority: sap_hard_constraint
  sap_impact: Pricing errors or a zero condition value in every document that uses the record.
  fix_map:
    __other__: Maintain the pricing unit (for example 1 or 100) on the record (VK12 / MEK2).
  record_fix_template: Condition record {KONH.KNUMH} ({KONH.KSCHL}) has rate {KONP.KBETR} with pricing unit {KONP.KPEIN}.
- id: SDSO052
  field: KONP.KMEIN
  check_class: cross_field_check
  grain: KONH
  fail_when: (`KONP.KRECH` == 'C') & `KONP.KMEIN`.isna()
  applies_when:
    KONH.KAPPL:
    - V
  severity: high
  dimension: completeness
  message: Quantity-based sales condition has no unit of measure
  why_it_matters: '''Amount per pricing unit'' needs the unit it is quoted in; without it the document quantity cannot be
    converted to the condition''s unit.'
  rule_authority: sap_hard_constraint
  sap_impact: The condition is ignored or priced against the wrong unit.
  fix_map:
    __other__: Maintain the condition unit on the record (VK12 / MEK2).
  record_fix_template: Condition record {KONH.KNUMH} ({KONH.KSCHL}) has no condition unit.
- id: SDSO053
  field: KONP.KONWA
  check_class: cross_field_check
  grain: KONH
  fail_when: ((`KONP.KRECH` == 'B') | (`KONP.KRECH` == 'C')) & `KONP.KONWA`.isna()
  applies_when:
    KONH.KAPPL:
    - V
  severity: high
  dimension: completeness
  message: Amount-based sales condition has no currency
  why_it_matters: A fixed or quantity-based rate is an amount and needs its currency (percentages carry '%').
  rule_authority: sap_hard_constraint
  sap_impact: Currency translation of the condition is impossible; the document is priced wrongly.
  fix_map:
    __other__: Maintain the rate currency on the record (VK12 / MEK2).
  record_fix_template: Condition record {KONH.KNUMH} ({KONH.KSCHL}) has rate {KONP.KBETR} without a currency.
- id: SDSO054
  field: KONH.KSCHL
  check_class: referential_check
  grain: KONH
  applies_when:
    KONH.KAPPL:
    - V
  reference_table: T685
  reference_field: KSCHL
  severity: high
  dimension: validity
  message: Sales condition record uses a condition type that is not defined (T685)
  why_it_matters: A record for a condition type that no longer exists (or never existed in this client) is never read by a
    pricing procedure.
  rule_authority: sap_hard_constraint
  sap_impact: Dead price data that looks valid in reports and migrations.
  fix_map:
    __other__: Delete the record, or recreate it under a defined condition type.
  record_fix_template: 'Condition record {KONH.KNUMH} ({KONH.KSCHL}): condition type ''{actual_value}'' is not defined.'
- id: SDSO055
  check_class: exists_check
  fields:
  - VBAK.KUNNR
  - VBAK.VKORG
  - VBAK.VTWEG
  - VBAK.SPART
  grain: VBAK
  applies_when:
    VBAK.GBSTK:
      not_in: [C]
  target_table: KNVV
  target_fields:
  - KUNNR
  - VKORG
  - VTWEG
  - SPART
  target_when:
    LOEVM:
      blank: true
  severity: high
  dimension: consistency
  message: Open sales document for a sold-to that is not maintained (or is flagged for deletion) in the document's sales
    area
  why_it_matters: VA01 accepts a sold-to only in a sales area the customer is extended to; pricing procedure, payment terms,
    Incoterms and partners come from that extension. A document whose sales area does not match the customer's sales-area
    data was loaded or created before the extension was deleted.
  rule_authority: sap_hard_constraint
  sap_impact: Changing, copying or billing the document fails ("customer not defined for sales area"). Pricing and partner
    redetermination use no customer defaults.
  fix_map:
    __other__: Re-extend the customer to the sales area (XD01 / VD01; BP sales-area data in S/4HANA), or reject the open
      document (VA02 > Reason for rejection).
  record_fix_template: 'Sales document {VBAK.VBELN}: sold-to {VBAK.KUNNR} has no active sales-area data for {VBAK.VKORG}/{VBAK.VTWEG}/{VBAK.SPART}.'
- id: SDSO056
  field: VBAK.NETWR
  check_class: cross_field_check
  grain: VBAK
  fail_when: (`VBAK.NETWR` == 0)
  applies_when:
    VBAK.VBTYP: [C]
    VBAK.AUART:
      not_in: [KB, KA]
    VBAK.ABSTK:
      not_in: [C]
  severity: high
  dimension: accuracy
  message: Standard sales order has zero net value
  why_it_matters: A customer order (VBTYP C) that is not fully rejected should carry revenue. A zero header value means no
    item was priced, because condition records were missing, manual prices were zero, or every item was free of charge.
    Zero-price sales are a standard revenue-assurance and audit test.
  rule_authority: best_practice
  sap_impact: Goods ship and billing creates a zero invoice. Revenue is lost, credit exposure is understated, and value-based
    release strategies do not trigger.
  fix_map:
    __other__: Check pricing in VA02 > Conditions (header and items). Maintain the missing condition records (VK11) and
      run new pricing, or document the free-of-charge approval.
  record_fix_template: 'Sales order {VBAK.VBELN} ({VBAK.AUART}) has net value {actual_value}.'
- id: SDSO057
  field: VBAP.NETWR
  check_class: cross_field_check
  grain: VBAP
  fail_when: (`VBAP.NETWR` == 0) & (`VBAP.KWMENG` > 0)
  applies_when:
    VBAK.VBTYP: [C]
    VBAP.PSTYV:
      not_in: [TATX, TANN, KBN, KAN, TAE]
    VBAP.UEPOS:
      blank: true
  severity: high
  dimension: accuracy
  message: Chargeable order item has a quantity but zero net value
  why_it_matters: A main item with an order quantity and a chargeable item category should have a price. Zero means a missing
    condition record, a manual zero price, or 100% discount. Big-4 O2C analytics and Celonis report these as revenue leakage.
  rule_authority: best_practice
  sap_impact: The item delivers and bills at zero, so revenue is lost. Margin (VPRS against zero) shows full cost with no
    revenue.
  fix_map:
    __other__: Check the item's conditions (VA02 > Item > Conditions). Maintain the price (VK11) and run new pricing, or
      change the item category to a free-of-charge category with approval.
  record_fix_template: 'Sales order {VBAP.VBELN} item {VBAP.POSNR} ({VBAP.PSTYV}): quantity {VBAP.KWMENG}, net value 0.'
- id: SDSO058
  field: VBAK.ERDAT
  check_class: freshness_check
  max_age_hours: 168
  applies_when:
    VBAK.CMGST: [B, C]
    VBAK.GBSTK:
      not_in: [C]
  severity: high
  dimension: timeliness
  message: Sales document has been on credit block for more than 7 days
  why_it_matters: A credit block (status B/C) stops delivery until a credit representative releases or rejects the document.
    Blocks left open for weeks are lost or late revenue and unhappy customers. Credit-block ageing is a core Celonis O2C KPI.
  rule_authority: best_practice
  sap_impact: The document cannot be delivered, and confirmed ATP quantity stays reserved for it. VKM1/VKM3 (UKM_CASE in
    S/4HANA) backlogs grow.
  fix_map:
    __other__: Release or reject the document in VKM1 / VKM3 (S/4HANA, UKM_MY_DCDS), or reject the lines if the deal is dead.
  record_fix_template: 'Sales document {VBAK.VBELN} (created {VBAK.ERDAT}) is still credit blocked (status {VBAK.CMGST}).'
- id: SDSO059
  field: VBAK.BSTNK
  check_class: uniqueness_check
  fields:
  - VBAK.KUNNR
  - VBAK.BSTNK
  normalize: alnum
  grain: VBAK
  applies_when:
    VBAK.VBTYP: [C]
  severity: medium
  dimension: uniqueness
  message: The same customer purchase order number appears on more than one sales order for the sold-to
  why_it_matters: A customer PO is normally entered once. A repeat usually means a duplicate order (EDI resend, re-keyed fax).
    Duplicate-order detection by customer reference is a standard Big-4 O2C test, and SAP's own duplicate check (TVAK.VBKLT)
    only warns.
  rule_authority: best_practice
  sap_impact: Goods are shipped and billed twice. The customer short-pays or disputes, and credits and returns follow.
  fix_map:
    __other__: Compare the orders (VA05 by PO number). Reject the duplicate (VA02 > Reason for rejection), and switch on
      the PO duplicate check for the order type (VOV8 > Check purchase order no.).
  record_fix_template: 'Sales order {VBAK.VBELN}: PO "{VBAK.BSTNK}" of sold-to {VBAK.KUNNR} is also on another order.'
- id: SDSO060
  field: VBAK.ERDAT
  check_class: freshness_check
  max_age_hours: 1440
  applies_when:
    VBAK.LFSTK: [C]
    VBAK.FKSTK: [A, B]
  severity: high
  dimension: timeliness
  message: Sales document fully delivered but not (fully) billed more than 60 days after it was created
  why_it_matters: Goods have left, but the delivery-related invoice was never created. Delivered-not-invoiced is the core
    revenue-leakage and cut-off test in Big-4 O2C audits and a standard Celonis KPI.
  rule_authority: best_practice
  sap_impact: Revenue and receivables are understated, and the customer is never invoiced. Deliveries stay in the billing
    due list (VF04) indefinitely.
  fix_map:
    __other__: Bill the deliveries (VF04 / VF01). If a billing block holds them (VBAK.FAKSK), resolve the block. Recalculate
      status with SDVBUK00 if the document is actually billed.
  record_fix_template: 'Sales document {VBAK.VBELN} (created {VBAK.ERDAT}) is fully delivered, billing status {VBAK.FKSTK}.'
- id: SDSO061
  field: VBAK.ERDAT
  check_class: freshness_check
  max_age_hours: 720
  applies_when:
    VBAK.UVALL: [A, B]
    VBAK.GBSTK:
      not_in: [C]
  severity: medium
  dimension: completeness
  message: Sales document is still incomplete more than 30 days after it was created
  why_it_matters: The incompletion log lists data that the document type requires before delivery or billing. A document
    left incomplete for a month is stuck, and the data it lacks is usually missing from the master data too.
  rule_authority: sap_hard_constraint
  sap_impact: Depending on the incompletion procedure, the document cannot be delivered or billed (V.02 lists it). It inflates
    the backlog.
  fix_map:
    __other__: Complete the document (V.02 / VA02 > Edit > Incompletion log), or reject it.
  record_fix_template: 'Sales document {VBAK.VBELN} (created {VBAK.ERDAT}) is still incomplete (status {VBAK.UVALL}).'
- id: SDSO062
  field: VBAK.VDATU
  check_class: cross_field_check
  fail_when: (`VBAK.VDATU` < `VBAK.AUDAT`)
  applies_when:
    VBAK.VBTYP: [C]
  severity: medium
  dimension: consistency
  message: Requested delivery date is before the order date
  why_it_matters: A customer cannot request delivery before ordering. The date was keyed wrongly, or the document was back-dated
    or loaded. Scheduling, ATP and on-time-delivery KPIs all start from VDATU.
  rule_authority: best_practice
  sap_impact: Schedule lines are created in the past, so the order shows as late from day one. ATP backorder processing and
    OTIF reporting are distorted.
  fix_map:
    __other__: Correct the requested delivery date (VA02 > Header > Sales) and reschedule (V_V2).
  record_fix_template: 'Sales order {VBAK.VBELN}: requested delivery {VBAK.VDATU} is before order date {VBAK.AUDAT}.'
- id: SDSO063
  field: VBAK.AUDAT
  check_class: cross_field_check
  fail_when: ((`VBAK.ERDAT` - `VBAK.AUDAT`).dt.days > 30) | ((`VBAK.AUDAT` - `VBAK.ERDAT`).dt.days > 30)
  applies_when:
    VBAK.VBTYP: [C]
  severity: medium
  dimension: consistency
  message: Order date differs from the entry date by more than 30 days (back-dated or future-dated)
  why_it_matters: The document date defaults to the entry date. Moving it by more than a month back-dates or post-dates the
    order. This is a Big-4 cut-off and journal-integrity test, because the document date drives pricing date, period
    reporting and SLA ageing.
  rule_authority: best_practice
  sap_impact: Prices can be determined from an outdated pricing date, period sales reporting (S001/VA05) is misallocated,
    and order-age KPIs are wrong.
  fix_map:
    __other__: Confirm the date with the order owner. Correct the document date and pricing date (VA02 > Header > Sales),
      or restrict changes to AUDAT via the field selection.
  record_fix_template: 'Sales order {VBAK.VBELN}: order date {VBAK.AUDAT}, entered on {VBAK.ERDAT}.'
- id: SDSO064
  check_class: exists_check
  fields:
  - VBAP.MATNR
  - VBAP.WERKS
  grain: VBAP
  applies_when:
    VBAP.GBSTA:
      not_in: [C]
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    LVORM:
      blank: true
  severity: high
  dimension: consistency
  message: Open order item's delivering plant has no (active) plant data for the material
  why_it_matters: Delivery, ATP and costing read the material's plant view. An item whose plant has no MARC record, or one
    flagged for deletion at that plant, can neither be confirmed nor delivered.
  rule_authority: sap_hard_constraint
  sap_impact: ATP confirms nothing, and VL01N fails ("material not maintained in plant"). Cost (VPRS) is missing, so margin
    is wrong.
  fix_map:
    __other__: Change the item's plant to one where the material is extended (VA02), or extend the material to the plant
      (MM01) or remove its deletion flag (MM06).
  record_fix_template: 'Sales order {VBAP.VBELN} item {VBAP.POSNR}: material {VBAP.MATNR} has no active plant data in plant
    {VBAP.WERKS}.'
- id: SDSO065
  check_class: exists_check
  fields:
  - VBAP.MATNR
  - VBAK.VKORG
  - VBAK.VTWEG
  grain: VBAP
  applies_when:
    VBAP.GBSTA:
      not_in: [C]
  target_table: MVKE
  target_fields:
  - MATNR
  - VKORG
  - VTWEG
  target_when:
    VMSTA:
      blank: true
  severity: medium
  dimension: consistency
  message: Open order item's material is not released for sales in the order's sales organisation and channel
  why_it_matters: The material's sales view (MVKE) for the sales org and channel holds the delivering plant, item category
    group and sales status. An item whose material is not extended there, or has a distribution-chain status set, should
    not be open.
  rule_authority: sap_hard_constraint
  sap_impact: Copying, changing or delivering the item fails or warns, depending on the sales status configuration (TVMS).
    Pricing and item category determination run without the sales view.
  fix_map:
    __other__: Extend the material to the sales area (MM01 > Sales views), or review the distribution-chain status (MM02 >
      Sales org 1 > X-distr. chain status) and reject the item if the material is withdrawn.
  record_fix_template: 'Sales order {VBAP.VBELN} item {VBAP.POSNR}: material {VBAP.MATNR} is not released for sales in {VBAK.VKORG}/{VBAK.VTWEG}.'
- id: SDSO066
  field: VBAK.VDATU
  check_class: freshness_check
  max_age_hours: 720
  applies_when:
    VBAK.VBTYP: [C]
    VBAK.LFSTK: [A]
    VBAK.GBSTK:
      not_in: [C]
    VBAK.LIFSK:
      blank: true
    VBAK.CMGST:
      not_in: [B, C]
  severity: medium
  dimension: timeliness
  message: Unblocked sales order with nothing delivered, more than 30 days past its requested delivery date
  why_it_matters: The order is not blocked, so it should have shipped. Nothing delivered a month after the customer's date
    means stuck backlog, such as missing stock, a lost schedule line or an abandoned order. This is a Celonis late-order
    and backlog KPI.
  rule_authority: best_practice
  sap_impact: Customers wait, while backlog and revenue forecasts overstate demand. ATP and MRP keep planning against it.
  fix_map:
    __other__: Review the order with its owner. Deliver it (VL10), reschedule (V_V2), or reject the items (VA02 > Reason
      for rejection).
  record_fix_template: 'Sales order {VBAK.VBELN}: requested delivery {VBAK.VDATU}, nothing delivered, no block.'
- id: SDSO067
  field: VBAK.ERDAT
  check_class: freshness_check
  max_age_hours: 2160
  applies_when:
    VBAK.VBTYP: [C]
    VBAK.LIFSK:
      populated: true
    VBAK.GBSTK:
      not_in: [C]
  severity: medium
  dimension: timeliness
  message: Sales order has been on delivery block for more than 90 days
  why_it_matters: A delivery block is meant to be temporary, for example pending a check, prepayment or export licence. Orders
    blocked for a quarter are forgotten. They hold ATP quantity and inflate the backlog.
  rule_authority: best_practice
  sap_impact: Confirmed quantities stay reserved, so other customers are short. Backlog and forecasts overstate demand.
  fix_map:
    __other__: Release the block (VA02 > Header > Shipping > Delivery block) or reject the order.
  record_fix_template: 'Sales order {VBAK.VBELN} (created {VBAK.ERDAT}) is still on delivery block {VBAK.LIFSK}.'
- id: SDSO068
  field: VBAK.KUNNR
  check_class: cross_field_check
  fail_when: (`KNA1.XCPDK` == 'X')
  applies_when:
    VBAK.VBTYP: [C]
  severity: low
  dimension: consistency
  message: Sales order placed on a one-time (CPD) customer account
  why_it_matters: One-time accounts have no credit limit, no partner functions and no master data control. The name, address
    and bank details are typed into each document. Heavy use hides repeat customers outside credit control. The pass rate
    of this rule is the share of orders on one-time accounts.
  rule_authority: best_practice
  sap_impact: Credit checks, dunning by customer and sales analytics by customer do not work. Repeat customers are invisible,
    and address data is unvalidated.
  fix_map:
    __other__: Create a regular customer for repeat buyers (XD01) and use it on new orders. Restrict one-time accounts to
      genuine walk-in or single sales.
  record_fix_template: 'Sales order {VBAK.VBELN} uses one-time account {VBAK.KUNNR}.'
- id: SDSO069
  field: VBAK.VBELN
  check_class: uniqueness_check
  fields:
  - VBAK.KUNNR
  - VBAK.AUDAT
  - VBAK.NETWR
  - VBAK.WAERK
  grain: VBAK
  applies_when:
    VBAK.VBTYP: [C]
    VBAK.NETWR:
      gt: 0
  severity: low
  dimension: uniqueness
  message: Possible duplicate order (same sold-to, order date, net value and currency)
  why_it_matters: Two orders for the same customer on the same day with exactly the same value are a classic duplicate-entry
    pattern (double EDI processing, re-keyed orders). This is the Big-4 duplicate sales-order test, and it complements the
    PO-number duplicate check, which misses orders without a PO.
  rule_authority: best_practice
  sap_impact: Goods are shipped and invoiced twice, followed by disputes, returns and credit memos.
  fix_map:
    __other__: Compare the orders (VA05). Reject the duplicate (VA02 > Reason for rejection).
  record_fix_template: 'Sales order {VBAK.VBELN}: sold-to {VBAK.KUNNR}, {VBAK.AUDAT}, {VBAK.NETWR} {VBAK.WAERK} matches another
    order.'
- id: SDSO200
  field: VBAP.VRKME
  check_class: referential_check
  severity: high
  dimension: validity
  message: Order item sales unit (VBAP.VRKME) is not defined in the system's configuration (T006)
  why_it_matters: The sales unit is a key into the units of measure configuration (T006). A value that is not configured there
    cannot be converted or printed; SAP's own screens never accept it, so it comes from direct loads, interfaces or configuration
    deleted after the fact.
  rule_authority: sap_hard_constraint
  sap_impact: Delivery and billing cannot convert the quantity; output forms print an unknown unit.
  fix_map:
    __other__: '''{invalid_value}'' is not in T006. Correct the sales unit in VA02, or create the unit in customizing (CUNI)
      if it is genuinely needed.'
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: sales unit ''{actual_value}'' is not configured (T006).'
- id: SDSO201
  field: KONP.KBETR
  check_class: cross_field_check
  fail_when: (`KONP.KBETR` == 0) | `KONP.KBETR`.isna()
  applies_when:
    KONH.KAPPL:
    - V
    KONP.KRECH:
    - C
    KONP.LOEVM_KO:
      blank: true
  severity: medium
  dimension: accuracy
  message: Active quantity-based sales condition record has a zero rate
  why_it_matters: A quantity-dependent condition (calculation type C) with rate zero is found by pricing and contributes nothing.
    For a price condition this yields an order item with no price; for a surcharge it silently waives it. Real free-of-charge
    pricing is normally done with a 100% discount or a free-goods item, not a zero rate.
  rule_authority: best_practice
  sap_impact: Orders are priced at zero or miss a surcharge; the item may pass the incompletion check because a condition
    was found.
  fix_map:
    __other__: Maintain the correct rate in VK12, or set the deletion indicator on the condition record if it is no longer
      valid.
  record_fix_template: 'Condition record {KONP.KNUMH} ({KONP.KSCHL}): rate is zero.'
- id: SDSO202
  field: VBAK.KKBER
  check_class: referential_check
  severity: high
  dimension: validity
  message: Credit control area on the order is not defined in the system (T014)
  why_it_matters: The credit control area drives the limit check (OVA8) and the exposure update. A value that is not in T014
    cannot be checked, so the order is never held back by credit.
  rule_authority: sap_hard_constraint
  sap_impact: No credit check is run for the order; exposure is not updated and the credit block never triggers.
  fix_map:
    __other__: Correct the credit control area through the customer's credit data (FD32) or the sales area assignment (OVAK)
      and reprocess the order in VA02.
  record_fix_template: 'Order {VBAK.VBELN}: credit control area ''{actual_value}'' is not in T014.'
- id: SDSO203
  field: VBAK.KNKLI
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Credit account on the order is not a customer master record
  why_it_matters: The credit account is the customer whose limit is consumed. A number with no KNA1 record means exposure
    is booked against nobody.
  rule_authority: sap_hard_constraint
  sap_impact: The credit check cannot read a limit and passes the order, or fails every time with a system error.
  fix_map:
    __other__: Correct the credit account in the customer's credit data (FD32) so that it points to an existing customer,
      then reprocess the order.
  record_fix_template: 'Order {VBAK.VBELN}: credit account ''{actual_value}'' does not exist as a customer.'
- id: SDSO204
  field: VBAK.KNKLI
  check_class: exists_check
  fields:
  - VBAK.KNKLI
  - VBAK.KKBER
  grain: VBAK
  applies_when:
    VBUK.GBSTK:
      not_in:
      - C
  target_table: KNKK
  target_fields:
  - KUNNR
  - KKBER
  severity: medium
  dimension: consistency
  message: Open order is in a credit control area where the credit account has no credit master record (KNKK)
  why_it_matters: The limit check reads KNKK for the credit account and control area. Without that record SAP has no limit
    and treats the customer as unchecked (or blocks, depending on the risk category).
  rule_authority: best_practice
  sap_impact: Open orders are released without a limit, or credit-blocked with no way to release them from the credit master.
  fix_map:
    __other__: Create the credit master data for the credit account and control area (FD32), or move the order to the correct
      control area.
  record_fix_template: 'Order {VBAK.VBELN}: credit account {VBAK.KNKLI} has no credit record in area {VBAK.KKBER}.'
- id: SDSO205
  field: VBAK.CMWAE
  check_class: cross_field_check
  grain: VBAK
  applies_when:
    VBAK.CMWAE:
      populated: true
    VBAK.KKBER:
      populated: true
    T014.WAERS:
      populated: true
  fail_when: (`VBAK.CMWAE` != `T014.WAERS`)
  severity: medium
  dimension: consistency
  message: Credit currency on the order differs from the currency of the credit control area
  why_it_matters: The credit currency is copied from the control area (T014) when the order is saved. A different value means
    the exposure is converted with the wrong currency or the control area changed after the order.
  rule_authority: best_practice
  sap_impact: Open order value is added to the exposure in a currency other than the limit's currency; the limit comparison
    is wrong.
  fix_map:
    __other__: Display the control area (OB45) and the order's credit data. Re-determine the credit data by saving the order
      in VA02 after the control area is correct.
  record_fix_template: 'Order {VBAK.VBELN}: credit currency {VBAK.CMWAE} differs from control area {VBAK.KKBER} ({T014.WAERS}).'
- id: SDSO206
  field: VBAK.KKBER
  check_class: cross_field_check
  grain: VBAK
  applies_when:
    VBUK.GBSTK:
      not_in:
      - C
    TVTA.KKBER:
      populated: true
    VBAK.KKBER:
      populated: true
  fail_when: (`VBAK.KKBER` != `TVTA.KKBER`)
  severity: medium
  dimension: consistency
  message: Order credit control area differs from the one assigned to its sales area (TVTA)
  why_it_matters: When a credit control area is assigned to the sales area, SAP takes it over to the order. A different value
    on an open order means the assignment changed after entry or the order was loaded with a wrong area.
  rule_authority: best_practice
  sap_impact: The order is checked against another area's limit than the one the sales area is configured for.
  fix_map:
    __other__: Compare the sales area assignment (OVKK) with the order. Correct the order's credit data or the assignment.
  record_fix_template: 'Order {VBAK.VBELN}: control area {VBAK.KKBER}, sales area assigned to {TVTA.KKBER}.'
- id: SDSO207
  field: VBUK.CMGST
  check_class: cross_field_check
  grain: VBAK
  applies_when:
    VBUK.GBSTK:
      not_in:
      - C
  fail_when: '`VBUK.CMGST`.notna() & `VBAK.KKBER`.isna()'
  severity: high
  dimension: consistency
  message: Credit check ran on the order but the order carries no credit control area
  why_it_matters: A credit status other than blank means a check ran, and that needs a control area. A status without a control
    area comes from a load or a copied status.
  rule_authority: best_practice
  sap_impact: The status cannot be re-evaluated, so the credit release (VKM1) and the exposure update are unreliable for the
    order.
  fix_map:
    __other__: Fill the credit control area through the customer's credit data and let the order be rechecked in VA02, or
      reset the status with the credit release transaction.
  record_fix_template: 'Order {VBAK.VBELN}: credit status {VBUK.CMGST} but no credit control area.'
- id: SDSO208
  field: VBUK.CMGST
  check_class: cross_field_check
  grain: VBAK
  fail_when: '`VBUK.CMGST`.isin([''B'', ''C'']) & (`VBUK.LFSTK` == ''C'')'
  severity: high
  dimension: consistency
  message: Order is fully delivered although its credit status is still blocked
  why_it_matters: A credit-blocked order cannot be delivered. A blocked status together with a finished delivery means the
    block was set after the fact or the delivery was forced through.
  rule_authority: best_practice
  sap_impact: Exposure and open-item reports show a blocked order that has already left the warehouse; the release can never
    be completed.
  fix_map:
    __other__: Check the delivery and credit history of the order (VKM3). Release or reset the credit status so that the order
      can be billed.
  record_fix_template: 'Order {VBAK.VBELN}: credit status {VBUK.CMGST} with delivery status {VBUK.LFSTK}.'
- id: SDSO209
  field: VBAK.KNKLI
  check_class: exists_check
  fields:
  - VBAK.KNKLI
  - VBAK.KKBER
  grain: VBAK
  applies_when:
    VBUK.GBSTK:
      not_in:
      - C
    VBUK.CMGST:
      not_in:
      - B
      - C
      - D
  target_table: KNKK
  target_fields:
  - KUNNR
  - KKBER
  target_when:
    CRBLB:
    - X
  negate: true
  severity: high
  dimension: consistency
  message: Open order not credit-blocked although its credit account is blocked in credit management
  why_it_matters: A set credit block indicator (KNKK.CRBLB) must hold new orders back. An open order with a clean status for
    such an account got through without the check, usually because it was loaded or created before the block.
  rule_authority: sap_hard_constraint
  sap_impact: Goods are delivered to a customer whose credit account was blocked by credit management.
  fix_map:
    __other__: Run the credit check again on the order (VKM1) or confirm the release is intended, then update the status.
  record_fix_template: 'Order {VBAK.VBELN}: credit account {VBAK.KNKLI} is blocked in area {VBAK.KKBER} but the order is not.'
- id: SDSO210
  field: VBAK.KALSM
  check_class: null_check
  applies_when:
    VBUK.GBSTK:
      not_in:
      - C
  severity: high
  dimension: completeness
  message: Open order has no pricing procedure
  why_it_matters: The pricing procedure is determined from the sales area, document type and customer. Without it no condition
    is found and the order is priced at zero.
  rule_authority: sap_hard_constraint
  sap_impact: The order has no price, discount or tax; billing creates a zero-value invoice or is blocked.
  fix_map:
    __blank__: Check the pricing procedure determination (OVKK) and the customer's pricing indicator, then save the order
      again in VA02 to re-run pricing.
  record_fix_template: 'Order {VBAK.VBELN}: pricing procedure is empty.'
- id: SDSO211
  field: VBAK.KALSM
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Pricing procedure on the order is not defined in customizing (T683)
  why_it_matters: An unknown procedure cannot be executed, so pricing is skipped or ends in an error at the next pricing run.
  rule_authority: sap_hard_constraint
  sap_impact: New pricing (pricing type B/C), billing and rebate processing fail for the document.
  fix_map:
    __other__: Correct the pricing procedure determination (OVKK) or create the procedure (V/08), then re-run pricing in VA02.
  record_fix_template: 'Order {VBAK.VBELN}: pricing procedure ''{actual_value}'' is not in T683.'
- id: SDSO212
  field: VBAK.KALSM
  check_class: exists_check
  fields:
  - VBAK.KALSM
  grain: VBAK
  applies_when:
    VBUK.GBSTK:
      not_in:
      - C
  target_table: T683S
  target_fields:
  - KALSM
  severity: medium
  dimension: consistency
  message: Pricing procedure on the order has no steps (T683S)
  why_it_matters: A procedure with a header and no steps runs without error but finds no conditions.
  rule_authority: sap_hard_constraint
  sap_impact: Orders priced with it carry no price and the items fail the incompletion check or invoice at zero.
  fix_map:
    __other__: Maintain the procedure steps (V/08) or change the determination.
  record_fix_template: 'Order {VBAK.VBELN}: pricing procedure {VBAK.KALSM} has no steps.'
- id: SDSO213
  field: VBAK.KNUMV
  check_class: null_check
  applies_when:
    VBUK.GBSTK:
      not_in:
      - C
  severity: medium
  dimension: completeness
  message: Open order has no pricing document number
  why_it_matters: KNUMV links the order to its condition records. Without it the pricing result cannot be read back or recalculated.
  rule_authority: sap_hard_constraint
  sap_impact: Item values stay frozen; a price change or a rebate accrual cannot be recalculated for the order.
  fix_map:
    __blank__: Re-run pricing on the order in VA02 (Edit, New pricing); if the number stays empty, investigate the load that
      created the order.
  record_fix_template: 'Order {VBAK.VBELN}: no pricing document number.'
- id: SDSO214
  field: VBAK.VSBED
  check_class: referential_check
  severity: low
  dimension: validity
  message: Shipping condition on the order is not defined (TVSB)
  why_it_matters: The shipping condition drives shipping point and route determination.
  rule_authority: sap_hard_constraint
  sap_impact: Delivery creation falls back to a default shipping point or fails.
  fix_map:
    __other__: Correct the shipping condition in VA02 or create it in customizing (OVLS).
  record_fix_template: 'Order {VBAK.VBELN}: shipping condition ''{actual_value}'' is not in TVSB.'
- id: SDSO215
  field: VBAK.FKARA
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Proposed billing type on the order is not a defined billing type (TVFK)
  why_it_matters: The billing type proposed by the order is copied into the billing due list; an unknown type cannot be used.
  rule_authority: sap_hard_constraint
  sap_impact: Billing creation (VF04) fails or picks another type than the one intended.
  fix_map:
    __other__: Correct the billing type in the order header (VA02) or create it in customizing (VOFA).
  record_fix_template: 'Order {VBAK.VBELN}: billing type ''{actual_value}'' is not in TVFK.'
- id: SDSO216
  field: VBAK.VKBUR
  check_class: exists_check
  fields:
  - VBAK.VKBUR
  - VBAK.VKGRP
  grain: VBAK
  target_table: TVBVK
  target_fields:
  - VKBUR
  - VKGRP
  severity: medium
  dimension: consistency
  message: Sales office and sales group on the order are not a valid combination (TVBVK)
  why_it_matters: The sales office to sales group assignment is customizing. A combination outside it is rejected by the order
    screen, so it was loaded or the assignment was removed later.
  rule_authority: sap_hard_constraint
  sap_impact: Sales reports by office or group, and the partner determination for sales employees, misattribute the order.
  fix_map:
    __other__: Correct the office or group in VA02, or restore the assignment (OVX1).
  record_fix_template: 'Order {VBAK.VBELN}: sales office {VBAK.VKBUR} / group {VBAK.VKGRP} is not an allowed combination.'
- id: SDSO217
  field: VBAK.VKORG
  check_class: exists_check
  fields:
  - VBAK.VKORG
  - VBAK.VTWEG
  - VBAK.SPART
  grain: VBAK
  target_table: TVTA
  target_fields:
  - VKORG
  - VTWEG
  - SPART
  severity: high
  dimension: consistency
  message: Sales area of the order is not set up as a valid sales area (TVTA)
  why_it_matters: A sales area exists only when sales organisation, distribution channel and division are combined in TVTA.
    Orders in another combination cannot be priced, delivered or billed.
  rule_authority: sap_hard_constraint
  sap_impact: Pricing, output and billing determination find no data for the order; the order is incomplete from the start.
  fix_map:
    __other__: Create the sales area (OVXG, OVXK) if it is legitimate, otherwise correct the order's organisation data.
  record_fix_template: 'Order {VBAK.VBELN}: sales area {VBAK.VKORG}/{VBAK.VTWEG}/{VBAK.SPART} is not in TVTA.'
- id: SDSO218
  field: VBAK.BSTDK
  check_class: cross_field_check
  grain: VBAK
  fail_when: '`VBAK.BSTDK` > `VBAK.ERDAT`'
  severity: low
  dimension: accuracy
  message: Customer purchase order date is later than the order creation date
  why_it_matters: The customer's PO exists before the order is keyed. A later PO date is a keying error or a load default.
  rule_authority: best_practice
  sap_impact: Dunning, dispute and customer-service searches by PO date return the wrong documents.
  fix_map:
    __other__: Correct the PO date in the order header (VA02).
  record_fix_template: 'Order {VBAK.VBELN}: PO date {VBAK.BSTDK} is after creation date {VBAK.ERDAT}.'
- id: SDSO219
  field: VBAK.ERDAT
  check_class: cross_field_check
  grain: VBAK
  fail_when: '`VBAK.ERDAT` > @today'
  severity: medium
  dimension: timeliness
  message: Order creation date lies in the future
  why_it_matters: SAP stamps the date from the system clock. A future date comes from a load or an interface with a wrong
    clock.
  rule_authority: best_practice
  sap_impact: Ageing, backlog and period-end cut-offs treat the order as not yet existing.
  fix_map:
    __other__: Correct the date in the source of the load; if the order is genuine, check the application server clock.
  record_fix_template: 'Order {VBAK.VBELN}: created {VBAK.ERDAT}, which is in the future.'
- id: SDSO220
  field: VBAK.BNDDT
  check_class: cross_field_check
  grain: VBAK
  applies_when:
    VBUK.GBSTK:
      not_in:
      - C
    VBAK.VBTYP:
    - B
    VBAK.BNDDT:
      populated: true
  fail_when: '`VBAK.BNDDT` < @today'
  severity: low
  dimension: lifecycle
  message: Quotation is open and past its binding date
  why_it_matters: A quotation is valid until the binding date. After that the price offer has lapsed but the document still
    sits in the open list.
  rule_authority: best_practice
  sap_impact: Open quotation value overstates the pipeline; a follow-up order can copy a lapsed price.
  fix_map:
    __other__: Reject the quotation (VA22) or extend the validity date if the offer still holds.
  record_fix_template: 'Quotation {VBAK.VBELN}: binding date {VBAK.BNDDT} has passed and the quotation is still open.'
- id: SDSO221
  field: VBAK.GUEEN
  check_class: cross_field_check
  grain: VBAK
  applies_when:
    VBUK.GBSTK:
      not_in:
      - C
    VBAK.VBTYP:
    - G
    VBAK.GUEEN:
      populated: true
  fail_when: '`VBAK.GUEEN` < @today'
  severity: low
  dimension: lifecycle
  message: Contract is open and past its end of validity
  why_it_matters: A contract runs until its end date. After that, release orders can no longer be created against it.
  rule_authority: best_practice
  sap_impact: The open-contract value in reports is overstated and release orders are rejected.
  fix_map:
    __other__: Close the contract (VA42) with a rejection reason or extend its validity.
  record_fix_template: 'Contract {VBAK.VBELN}: valid to {VBAK.GUEEN}, still open.'
- id: SDSO222
  field: VBAP.WERKS
  check_class: exists_check
  fields:
  - VBAP.WERKS
  grain: VBAP
  applies_when:
    VBUP.GBSTA:
      not_in:
      - C
  target_table: T001W
  target_fields:
  - WERKS
  severity: high
  dimension: consistency
  message: Delivering plant of the order item is not a defined plant (T001W)
  why_it_matters: Every logistics step reads the plant. An unknown plant cannot be used for availability, delivery or costing.
  rule_authority: sap_hard_constraint
  sap_impact: The item is never confirmed or delivered.
  fix_map:
    __other__: Correct the plant in VA02 or create it in customizing (OX10).
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: plant ''{VBAP.WERKS}'' is not in T001W.'
- id: SDSO223
  field: VBAP.LGORT
  check_class: exists_check
  fields:
  - VBAP.WERKS
  - VBAP.LGORT
  grain: VBAP
  applies_when:
    VBUP.GBSTA:
      not_in:
      - C
  target_table: T001L
  target_fields:
  - WERKS
  - LGORT
  severity: medium
  dimension: consistency
  message: Storage location of the order item does not exist in its plant (T001L)
  why_it_matters: The storage location must belong to the item's plant. A location in another plant is rejected by the order
    screen.
  rule_authority: sap_hard_constraint
  sap_impact: ATP and picking look in a location with no stock.
  fix_map:
    __other__: Correct the storage location in VA02 or create it in customizing (OX09).
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: storage location {VBAP.LGORT} is not defined in plant {VBAP.WERKS}.'
- id: SDSO224
  field: VBAP.VSTEL
  check_class: null_check
  applies_when:
    VBUP.GBSTA:
      not_in:
      - C
    VBAP.LFREL:
      populated: true
    VBAP.ABGRU:
      blank: true
  severity: high
  dimension: completeness
  message: Open delivery-relevant item has no shipping point
  why_it_matters: The shipping point is determined from plant, shipping condition and loading group. Without it no delivery
    can be created.
  rule_authority: sap_hard_constraint
  sap_impact: The item never appears in the delivery due list (VL10).
  fix_map:
    __blank__: Maintain the shipping point determination (OVL2) and re-determine it in VA02.
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: no shipping point.'
- id: SDSO225
  field: VBAP.KBMENG
  check_class: cross_field_check
  grain: VBAP
  fail_when: '`VBAP.KBMENG` > `VBAP.KWMENG`'
  severity: medium
  dimension: consistency
  message: Confirmed quantity of the order item exceeds the ordered quantity
  why_it_matters: ATP confirms at most what was ordered. A larger confirmed quantity is a stale confirmation after a quantity
    reduction.
  rule_authority: best_practice
  sap_impact: Requirements and capacity planning reserve more than the customer wants.
  fix_map:
    __other__: Re-run availability check in VA02 for the item.
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: confirmed {VBAP.KBMENG} exceeds ordered {VBAP.KWMENG}.'
- id: SDSO226
  field: VBAP.ABGRU
  check_class: cross_field_check
  grain: VBAP
  applies_when:
    VBAP.ABGRU:
      populated: true
  fail_when: '`VBAP.KBMENG` > 0'
  severity: medium
  dimension: consistency
  message: Rejected order item still holds a confirmed quantity
  why_it_matters: Rejecting an item removes its requirement and confirmation. A confirmed quantity on a rejected item keeps
    stock reserved.
  rule_authority: best_practice
  sap_impact: Stock is blocked for an order the customer no longer wants.
  fix_map:
    __other__: Save the item again in VA02 so that the schedule lines are deleted, or reverse the rejection if the item is
      still wanted.
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: rejected ({VBAP.ABGRU}) but confirmed quantity is {VBAP.KBMENG}.'
- id: SDSO227
  field: VBAP.UEPOS
  check_class: exists_check
  fields:
  - VBAP.VBELN
  - VBAP.UEPOS
  grain: VBAP
  applies_when:
    VBAP.UEPOS:
      not_in:
      - '000000'
  target_table: VBAP
  target_fields:
  - VBELN
  - POSNR
  severity: high
  dimension: consistency
  message: Higher-level item of the order item does not exist on the order
  why_it_matters: Sub-items (bill of material components, free goods, batch splits) hang under a higher-level item. A reference
    to a missing item leaves an orphan whose value and delivery cannot be settled.
  rule_authority: sap_hard_constraint
  sap_impact: Pricing and delivery of the sub-item fail; the item cannot be copied to the delivery.
  fix_map:
    __other__: Restore the missing parent item or remove the sub-item in VA02.
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: higher-level item {VBAP.UEPOS} does not exist.'
- id: SDSO228
  field: VBAP.SPART
  check_class: cross_field_check
  grain: VBAP
  applies_when:
    VBAP.SPART:
      populated: true
  fail_when: '`VBAP.SPART` != `VBAK.SPART`'
  severity: medium
  dimension: consistency
  message: Division of the order item differs from the division of the order header
  why_it_matters: The item division is copied from the header (or from the material when cross-division is allowed). A difference
    outside that setup comes from a load.
  rule_authority: best_practice
  sap_impact: Sales statistics and billing split by division are wrong.
  fix_map:
    __other__: Correct the division on the item or the header in VA02.
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: division {VBAP.SPART}, header division {VBAK.SPART}.'
- id: SDSO229
  field: VBAP.MATKL
  check_class: cross_field_check
  grain: VBAP
  applies_when:
    VBAP.MATKL:
      populated: true
    MARA.MATKL:
      populated: true
  fail_when: '`VBAP.MATKL` != `MARA.MATKL`'
  severity: low
  dimension: consistency
  message: Material group on the order item differs from the material master
  why_it_matters: The item takes the material group from the master at entry. A difference means the master was changed later
    or the item was loaded with another value.
  rule_authority: best_practice
  sap_impact: Material-group based reporting, authorisations and pricing groups disagree with the master.
  fix_map:
    __other__: Decide which value is correct. Update the master (MM02) or save the order again.
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: material group {VBAP.MATKL}, master {MARA.MATKL}.'
- id: SDSO230
  field: VBAP.VBELN
  check_class: exists_check
  fields:
  - VBAP.VBELN
  - VBAP.POSNR
  grain: VBAP
  applies_when:
    VBUP.GBSTA:
      not_in:
      - C
    VBAP.LFREL:
      populated: true
    VBAP.ABGRU:
      blank: true
    VBAP.KWMENG:
      gt: 0
  target_table: VBEP
  target_fields:
  - VBELN
  - POSNR
  severity: high
  dimension: completeness
  message: Open delivery-relevant item has no schedule line
  why_it_matters: Delivery relevance is carried by the schedule line. An item flagged relevant but without a schedule line
    has nothing to confirm or deliver.
  rule_authority: sap_hard_constraint
  sap_impact: The item is never confirmed, never delivered and never billed.
  fix_map:
    __other__: Re-create the schedule line by changing the quantity in VA02, or set the item to not delivery relevant if that
      is intended.
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: delivery relevant, no schedule line.'
- id: SDSO231
  field: VBAP.KDMAT
  check_class: exists_check
  fields:
  - VBAK.VKORG
  - VBAK.VTWEG
  - VBAK.KUNNR
  - VBAP.MATNR
  grain: VBAP
  applies_when:
    VBAP.KDMAT:
      populated: true
  target_table: KNMT
  target_fields:
  - VKORG
  - VTWEG
  - KUNNR
  - MATNR
  severity: low
  dimension: consistency
  message: Customer material number on the order item has no customer-material info record (KNMT)
  why_it_matters: The customer material number normally comes from the info record and is printed on delivery notes and invoices.
    A number with no record was typed in or loaded.
  rule_authority: best_practice
  sap_impact: The number is not found when the customer's next order is created via EDI.
  fix_map:
    __other__: Create the info record (VD51) or clear the number on the item.
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: customer material ''{VBAP.KDMAT}'' has no info record for the
    sold-to.'
- id: SDSO232
  field: VBAP.MATNR
  check_class: cross_field_check
  grain: VBAP
  applies_when:
    VBUP.GBSTA:
      not_in:
      - C
    VBAP.ABGRU:
      blank: true
  fail_when: '`MARC.KZAUS`.notna()'
  severity: medium
  dimension: lifecycle
  message: Open order item is on a material flagged as discontinued at its plant
  why_it_matters: A discontinuation indicator (single or dependent parallel) tells sales that stock will run out. Orders still
    taken on the part need a decision about the follow-up part.
  rule_authority: best_practice
  sap_impact: Items cannot be fulfilled once stock is gone; the customer is not offered the successor.
  fix_map:
    __other__: Check the material in MM03 (MRP 4, discontinued parts). Replace the item with the successor or confirm the
      remaining stock.
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: material {VBAP.MATNR} is flagged discontinued in plant {VBAP.WERKS}.'
- id: SDSO233
  field: VBAP.MATNR
  check_class: cross_field_check
  grain: VBAP
  applies_when:
    VBUP.GBSTA:
      not_in:
      - C
    VBAP.ABGRU:
      blank: true
    MARC.AUSDT:
      populated: true
  fail_when: '`MARC.AUSDT` < @today'
  severity: high
  dimension: lifecycle
  message: Open order item is on a material whose effective-out date has passed
  why_it_matters: After the effective-out date the material is no longer supplied. An item still open for it will not be delivered.
  rule_authority: best_practice
  sap_impact: The item stays open for ever; backlog is overstated and the customer waits for a part that is not coming.
  fix_map:
    __other__: Replace the item with the follow-up material (VA02) or reject it with a reason.
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: material {VBAP.MATNR} went out on {MARC.AUSDT}.'
- id: SDSO234
  field: VBAP.MATNR
  check_class: cross_field_check
  grain: VBAP
  applies_when:
    VBUP.GBSTA:
      not_in:
      - C
    VBAP.ABGRU:
      blank: true
  fail_when: '`MARC.NFMAT`.notna()'
  severity: medium
  dimension: lifecycle
  message: Open order item is still on a material that has a follow-up material
  why_it_matters: The follow-up material (MARC.NFMAT) is the successor SAP proposes when the part is discontinued. An open
    item on the old part should move to the new one.
  rule_authority: best_practice
  sap_impact: The customer receives or waits for the superseded part and the successor's demand is understated.
  fix_map:
    __other__: Substitute the successor (VA02) or document why the old part is still wanted.
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: material {VBAP.MATNR} has follow-up material {MARC.NFMAT}.'
- id: SDSO235
  field: MARC.NFMAT
  check_class: exists_check
  fields:
  - MARC.NFMAT
  - VBAK.VKORG
  - VBAK.VTWEG
  grain: VBAP
  applies_when:
    VBUP.GBSTA:
      not_in:
      - C
    VBAP.ABGRU:
      blank: true
  target_table: MVKE
  target_fields:
  - MATNR
  - VKORG
  - VTWEG
  target_when:
    LVORM:
      blank: true
  severity: medium
  dimension: consistency
  message: Follow-up material of an ordered part is not sold in the order's sales area
  why_it_matters: A successor with no sales view in the sales area cannot be ordered there, so the supersession path is closed
    for the customer.
  rule_authority: sap_hard_constraint
  sap_impact: The replacement cannot be added to the order; the item is dead-ended.
  fix_map:
    __other__: Extend the successor to the sales area (MM01 sales views) or choose another successor.
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: follow-up {MARC.NFMAT} has no active sales data in {VBAK.VKORG}/{VBAK.VTWEG}.'
- id: SDSO236
  field: VBAP.MATNR
  check_class: cross_field_check
  grain: VBAP
  applies_when:
    VBUP.GBSTA:
      not_in:
      - C
    VBAP.ABGRU:
      blank: true
  fail_when: '`MARA.MSTAE`.notna()'
  severity: medium
  dimension: lifecycle
  message: Open order item is on a material with a cross-plant material status
  why_it_matters: A cross-plant status (MARA.MSTAE) restricts the material for purchasing, MRP or production. Open orders
    on it may not be fulfillable.
  rule_authority: best_practice
  sap_impact: Supply of the part is restricted; the order stays open without a plan.
  fix_map:
    __other__: Check the status in MM03 and decide with materials management whether the order can be served.
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: material {VBAP.MATNR} has status {MARA.MSTAE}.'
- id: SDSO237
  field: VBAP.MATNR
  check_class: cross_field_check
  grain: VBAP
  applies_when:
    VBUP.GBSTA:
      not_in:
      - C
    VBAP.ABGRU:
      blank: true
  fail_when: '`MARC.MMSTA`.notna()'
  severity: medium
  dimension: lifecycle
  message: Open order item is on a material with a plant-specific material status
  why_it_matters: A plant material status (MARC.MMSTA) restricts the part at the delivering plant. Orders for the plant may
    no longer be valid.
  rule_authority: best_practice
  sap_impact: The plant cannot supply, so the item is not confirmed.
  fix_map:
    __other__: Check the plant status in MM03 and move the item to another plant or reject it.
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: material {VBAP.MATNR} has plant status {MARC.MMSTA} in {VBAP.WERKS}.'
- id: SDSO238
  field: VBAP.MATNR
  check_class: cross_field_check
  grain: VBAP
  applies_when:
    VBUP.GBSTA:
      not_in:
      - C
    VBAP.ABGRU:
      blank: true
  fail_when: '`MARA.MSTAV`.notna()'
  severity: high
  dimension: lifecycle
  message: Open order item is on a material with a cross-distribution-chain sales status
  why_it_matters: The sales status (MARA.MSTAV) blocks or warns for sales documents depending on the TVMS settings. Open items
    on a status-restricted material need review.
  rule_authority: best_practice
  sap_impact: New documents on the material are blocked or warned about; open ones were created before the status.
  fix_map:
    __other__: Check the status in MM03 sales views. Replace or reject the item.
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: material {VBAP.MATNR} has sales status {MARA.MSTAV}.'
- id: SDSO239
  field: VBAP.MATNR
  check_class: exists_check
  fields:
  - VBAP.MATNR
  - VBAK.VKORG
  - VBAK.VTWEG
  grain: VBAP
  applies_when:
    VBUP.GBSTA:
      not_in:
      - C
    VBAP.ABGRU:
      blank: true
  target_table: MVKE
  target_fields:
  - MATNR
  - VKORG
  - VTWEG
  target_when:
    VMSTA:
      populated: true
  negate: true
  severity: medium
  dimension: lifecycle
  message: Open order item is on a material with a distribution-chain specific sales status in the order's sales area
  why_it_matters: The distribution-chain status (MVKE.VMSTA) is the more specific block. A status here restricts exactly the
    channel the order was placed in.
  rule_authority: best_practice
  sap_impact: Sales of the material in this channel are restricted or being phased out.
  fix_map:
    __other__: Check the status in MM03 and substitute the item if the status blocks it.
  record_fix_template: 'Order {VBAP.VBELN} item {VBAP.POSNR}: material {VBAP.MATNR} has a distribution-chain status in {VBAK.VKORG}/{VBAK.VTWEG}.'
- id: SDSO240
  field: VBEP.BMENG
  check_class: cross_field_check
  grain: VBEP
  fail_when: '`VBEP.BMENG` > `VBEP.WMENG`'
  severity: medium
  dimension: consistency
  message: Confirmed quantity of the schedule line exceeds its ordered quantity
  why_it_matters: The confirmed quantity cannot exceed the schedule line quantity. A larger value is a stale confirmation.
  rule_authority: best_practice
  sap_impact: Availability is reserved for more than is wanted.
  fix_map:
    __other__: Re-run the availability check in VA02.
  record_fix_template: 'Order {VBEP.VBELN} item {VBEP.POSNR} line {VBEP.ETENR}: confirmed {VBEP.BMENG} exceeds ordered {VBEP.WMENG}.'
- id: SDSO241
  field: VBEP.EDATU
  check_class: null_check
  applies_when:
    VBEP.WMENG:
      gt: 0
  severity: high
  dimension: completeness
  message: Schedule line with an ordered quantity has no delivery date
  why_it_matters: The delivery date is the basis for ATP, transport and goods-issue scheduling.
  rule_authority: sap_hard_constraint
  sap_impact: The line cannot be scheduled and drops out of the delivery due list.
  fix_map:
    __blank__: Enter the date on the schedule line in VA02.
  record_fix_template: 'Order {VBEP.VBELN} item {VBEP.POSNR} line {VBEP.ETENR}: no delivery date.'
- id: SDSO242
  field: VBEP.EDATU
  check_class: cross_field_check
  grain: VBEP
  fail_when: '`VBEP.EDATU` < `VBAK.AUDAT`'
  severity: low
  dimension: accuracy
  message: Schedule line delivery date is earlier than the order date
  why_it_matters: Delivery cannot precede the order. A date before the order date is a keying error or a load default.
  rule_authority: best_practice
  sap_impact: The line is overdue from creation and floods the backlog and late-delivery reports.
  fix_map:
    __other__: Correct the delivery date in VA02.
  record_fix_template: 'Order {VBEP.VBELN} item {VBEP.POSNR} line {VBEP.ETENR}: delivery {VBEP.EDATU} is before order date
    {VBAK.AUDAT}.'
- id: SDSO243
  field: VBEP.WADAT
  check_class: cross_field_check
  grain: VBEP
  fail_when: '`VBEP.WADAT` > `VBEP.EDATU`'
  severity: medium
  dimension: accuracy
  message: Goods issue date of the schedule line is later than the delivery date
  why_it_matters: Goods issue is scheduled backward from the delivery date by transport and loading time. A later issue date
    makes the delivery date unreachable.
  rule_authority: best_practice
  sap_impact: The delivery is created late and the customer date is missed.
  fix_map:
    __other__: Re-run scheduling by changing the line in VA02.
  record_fix_template: 'Order {VBEP.VBELN} item {VBEP.POSNR} line {VBEP.ETENR}: goods issue {VBEP.WADAT} after delivery {VBEP.EDATU}.'
- id: SDSO244
  field: VBEP.VRKME
  check_class: cross_field_check
  grain: VBEP
  applies_when:
    VBEP.VRKME:
      populated: true
  fail_when: '`VBEP.VRKME` != `VBAP.VRKME`'
  severity: medium
  dimension: consistency
  message: Schedule line sales unit differs from the item sales unit
  why_it_matters: Quantities of the schedule lines add up to the item quantity, so both use the item's sales unit.
  rule_authority: best_practice
  sap_impact: Totals of the lines no longer match the item and the delivery quantity is wrong.
  fix_map:
    __other__: Correct the unit in VA02.
  record_fix_template: 'Order {VBEP.VBELN} item {VBEP.POSNR} line {VBEP.ETENR}: unit {VBEP.VRKME}, item unit {VBAP.VRKME}.'
- id: SDSO245
  field: VBEP.MEINS
  check_class: cross_field_check
  grain: VBEP
  applies_when:
    VBEP.MEINS:
      populated: true
  fail_when: '`VBEP.MEINS` != `VBAP.MEINS`'
  severity: medium
  dimension: consistency
  message: Schedule line base unit differs from the item base unit
  why_it_matters: The base unit of the line is copied from the item. A different base unit makes the quantity conversion wrong.
  rule_authority: best_practice
  sap_impact: Stock and delivery quantities are converted with the wrong factor.
  fix_map:
    __other__: Correct the unit in VA02 or fix the load.
  record_fix_template: 'Order {VBEP.VBELN} item {VBEP.POSNR} line {VBEP.ETENR}: base unit {VBEP.MEINS}, item base unit {VBAP.MEINS}.'
- id: SDSO246
  field: VBEP.LIFSP
  check_class: referential_check
  severity: low
  dimension: validity
  message: Delivery block on the schedule line is not a defined block reason (TVLS)
  why_it_matters: An unknown block reason cannot be released by the normal transactions.
  rule_authority: sap_hard_constraint
  sap_impact: The line stays blocked.
  fix_map:
    __other__: Release the line in VA02 or create the reason in customizing (OVLS).
  record_fix_template: 'Order {VBEP.VBELN} item {VBEP.POSNR} line {VBEP.ETENR}: delivery block ''{actual_value}'' is not in
    TVLS.'
- id: SDSO247
  field: VBEP.LIFSP
  check_class: cross_field_check
  grain: VBEP
  applies_when:
    VBUP.GBSTA:
      not_in:
      - C
    VBEP.EDATU:
      older_than_days: 60
  fail_when: '`VBEP.LIFSP`.notna()'
  severity: medium
  dimension: timeliness
  message: Schedule line is still delivery blocked 60 days after its delivery date
  why_it_matters: A block normally clears within days. A line blocked two months past its date is forgotten.
  rule_authority: best_practice
  sap_impact: Backlog is overstated and the customer is not informed.
  fix_map:
    __other__: Release or reject the line in VA02.
  record_fix_template: 'Order {VBEP.VBELN} item {VBEP.POSNR} line {VBEP.ETENR}: blocked ({VBEP.LIFSP}), due {VBEP.EDATU}.'
- id: SDSO248
  field: VBKD.ZTERM
  check_class: exists_check
  fields:
  - VBKD.ZTERM
  grain: VBKD
  target_table: T052
  target_fields:
  - ZTERM
  severity: high
  dimension: validity
  message: Payment terms on the order are not defined (T052)
  why_it_matters: Terms drive the due date in billing. Terms that are not in T052 cannot be evaluated.
  rule_authority: sap_hard_constraint
  sap_impact: The invoice has no due date and cash planning and dunning ignore it.
  fix_map:
    __other__: Correct the payment terms in VA02 or create them in customizing (OBB8).
  record_fix_template: 'Order {VBKD.VBELN}: payment terms ''{VBKD.ZTERM}'' are not defined.'
- id: SDSO249
  field: VBKD.ZTERM
  check_class: exists_check
  fields:
  - VBKD.ZTERM
  grain: VBKD
  target_table: T052
  target_fields:
  - ZTERM
  target_when:
    KOART:
    - K
  negate: true
  severity: medium
  dimension: consistency
  message: Payment terms on the order are restricted to vendors (T052 vendor-only)
  why_it_matters: Terms marked for vendors only (KOART K) are not meant for customer documents.
  rule_authority: best_practice
  sap_impact: The invoice is rejected or posts with terms that dunning and cash discount logic do not expect.
  fix_map:
    __other__: Select customer terms (OBB8) in VA02.
  record_fix_template: 'Order {VBKD.VBELN}: payment terms {VBKD.ZTERM} are vendor-only.'
- id: SDSO250
  field: VBKD.KDGRP
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Customer group on the order is not defined (T151)
  why_it_matters: The customer group feeds pricing and statistics.
  rule_authority: sap_hard_constraint
  sap_impact: Pricing by customer group and sales statistics ignore the order.
  fix_map:
    __other__: Correct the group in VA02 or create it in customizing (OVRH).
  record_fix_template: 'Order {VBKD.VBELN}: customer group ''{actual_value}'' is not in T151.'
- id: SDSO251
  field: VBKD.INCO2
  check_class: cross_field_check
  grain: VBKD
  applies_when:
    VBKD.INCO1:
      populated: true
  fail_when: '`VBKD.INCO2`.isna()'
  severity: low
  dimension: completeness
  message: Incoterms are set without the second part (named place)
  why_it_matters: Incoterms are only complete with the named place. Without it the invoice and customs documents are vague.
  rule_authority: best_practice
  sap_impact: Customs and invoice documents show Incoterms without a place.
  fix_map:
    __other__: Fill the Incoterms location in VA02.
  record_fix_template: 'Order {VBKD.VBELN}: Incoterms {VBKD.INCO1} without location.'
- id: SDSO252
  field: VBKD.KURSK
  check_class: cross_field_check
  grain: VBKD
  applies_when:
    VBKD.KURSK:
      populated: true
  fail_when: '`VBKD.KURSK` <= 0'
  severity: high
  dimension: accuracy
  message: Exchange rate for pricing on the order is zero or negative
  why_it_matters: A rate of zero converts every condition value to zero.
  rule_authority: best_practice
  sap_impact: Item values and tax are calculated as zero.
  fix_map:
    __other__: Correct the rate (or set the rate type) in VA02 and re-price.
  record_fix_template: 'Order {VBKD.VBELN}: exchange rate for pricing is {VBKD.KURSK}.'
- id: SDSO253
  field: VBKD.KURRF
  check_class: cross_field_check
  grain: VBKD
  applies_when:
    VBKD.KURRF:
      populated: true
  fail_when: '`VBKD.KURRF` <= 0'
  severity: high
  dimension: accuracy
  message: Exchange rate for the accounting document on the order is zero or negative
  why_it_matters: The accounting rate converts the billing to local currency.
  rule_authority: best_practice
  sap_impact: The billing document posts to FI with zero local value.
  fix_map:
    __other__: Correct the rate in VA02.
  record_fix_template: 'Order {VBKD.VBELN}: exchange rate for accounting is {VBKD.KURRF}.'
- id: SDSO254
  field: VBKD.PRSDT
  check_class: cross_field_check
  grain: VBKD
  applies_when:
    VBKD.PRSDT:
      populated: true
  fail_when: (`VBAK.ERDAT` - `VBKD.PRSDT`).dt.days > 365
  severity: medium
  dimension: accuracy
  message: Pricing date is more than a year before the order creation date
  why_it_matters: The pricing date is normally the order or requested delivery date. A date a year old picks expired prices.
  rule_authority: best_practice
  sap_impact: The order is priced with a historic price list.
  fix_map:
    __other__: Set the pricing date in VA02 and re-price.
  record_fix_template: 'Order {VBKD.VBELN}: pricing date {VBKD.PRSDT}, created {VBAK.ERDAT}.'
- id: SDSO255
  field: VBKD.FKDAT
  check_class: cross_field_check
  grain: VBKD
  applies_when:
    VBKD.FKDAT:
      populated: true
  fail_when: '`VBKD.FKDAT` < `VBAK.AUDAT`'
  severity: medium
  dimension: accuracy
  message: Billing date is earlier than the order date
  why_it_matters: Billing cannot be due before the order exists.
  rule_authority: best_practice
  sap_impact: The item shows in the billing due list at once.
  fix_map:
    __other__: Correct the billing date in VA02.
  record_fix_template: 'Order {VBKD.VBELN}: billing date {VBKD.FKDAT} before order date {VBAK.AUDAT}.'
- id: SDSO256
  field: VBKD.BSTKD
  check_class: cross_field_check
  grain: VBKD
  applies_when:
    VBKD.POSNR:
    - '000000'
    VBKD.BSTKD:
      populated: true
    VBAK.BSTNK:
      populated: true
  fail_when: '`VBKD.BSTKD` != `VBAK.BSTNK`'
  severity: low
  dimension: consistency
  message: Purchase order number in the business data differs from the one in the order header
  why_it_matters: The header copy of the PO number is read for searches. A difference points to separate edits.
  rule_authority: best_practice
  sap_impact: Searches by PO number miss the order.
  fix_map:
    __other__: Correct the PO number in VA02.
  record_fix_template: 'Order {VBKD.VBELN}: PO number in business data differs from header ({VBAK.BSTNK}).'
- id: SDSO257
  field: VBPA.KUNNR
  check_class: referential_check
  severity: high
  dimension: validity
  message: Customer in a partner function does not exist in the customer master
  why_it_matters: A partner function must point to a customer master record. Otherwise address, tax and credit data cannot
    be read.
  rule_authority: sap_hard_constraint
  sap_impact: Delivery, billing and payment run on a partner SAP cannot find.
  fix_map:
    __other__: Correct the partner in VA02 or create the customer (XD01).
  record_fix_template: 'Order {VBPA.VBELN}: partner {VBPA.PARVW} ''{actual_value}'' does not exist.'
- id: SDSO258
  field: VBPA.PARVW
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Partner function is not defined in customizing (TPAR)
  why_it_matters: An unknown partner function cannot be processed in partner determination or output.
  rule_authority: sap_hard_constraint
  sap_impact: The partner is ignored by the logistics and billing processes.
  fix_map:
    __other__: Correct or create the function in customizing (VOPA).
  record_fix_template: 'Order {VBPA.VBELN}: partner function ''{actual_value}'' is not in TPAR.'
- id: SDSO259
  field: KNA1.LOEVM
  check_class: cross_field_check
  grain: VBPA
  applies_when:
    VBUK.GBSTK:
      not_in:
      - C
    VBPA.PARVW:
    - AG
    - WE
    - RE
    - RG
  fail_when: '`KNA1.LOEVM` == ''X'''
  severity: high
  dimension: consistency
  message: Open order partner (sold-to, ship-to, bill-to, payer) is flagged for deletion
  why_it_matters: A deletion-flagged customer should not receive new business.
  rule_authority: best_practice
  sap_impact: The order cannot be delivered or billed, or the partner is deleted with open documents.
  fix_map:
    __other__: Replace the partner (VA02) or remove the deletion flag (XD06).
  record_fix_template: 'Order {VBPA.VBELN}: partner {VBPA.PARVW} {VBPA.KUNNR} is flagged for deletion.'
- id: SDSO260
  field: KNA1.AUFSD
  check_class: cross_field_check
  grain: VBPA
  applies_when:
    VBUK.GBSTK:
      not_in:
      - C
    VBPA.PARVW:
    - WE
    - RE
    - RG
  fail_when: '`KNA1.AUFSD`.notna()'
  severity: medium
  dimension: consistency
  message: Open order ship-to, bill-to or payer has a central order block
  why_it_matters: The central order block on the customer stops new orders. Open orders created before it need review.
  rule_authority: best_practice
  sap_impact: Orders are shipped to a partner that sales blocked.
  fix_map:
    __other__: Lift or confirm the block (XD05) and update the order.
  record_fix_template: 'Order {VBPA.VBELN}: partner {VBPA.PARVW} {VBPA.KUNNR} has order block {KNA1.AUFSD}.'
- id: SDSO261
  field: KNA1.SPERR
  check_class: cross_field_check
  grain: VBPA
  applies_when:
    VBUK.GBSTK:
      not_in:
      - C
    VBPA.PARVW:
    - RE
    - RG
  fail_when: '`KNA1.SPERR` == ''X'''
  severity: high
  dimension: consistency
  message: Open order bill-to or payer is blocked for posting
  why_it_matters: A central posting block stops invoices and payments.
  rule_authority: best_practice
  sap_impact: Billing posts fail with a block message.
  fix_map:
    __other__: Lift the block (XD05) or replace the partner.
  record_fix_template: 'Order {VBPA.VBELN}: partner {VBPA.PARVW} {VBPA.KUNNR} is blocked for posting.'
- id: SDSO262
  field: VBPA.KUNNR
  check_class: cross_field_check
  grain: VBPA
  applies_when:
    VBPA.PARVW:
    - AG
    VBPA.POSNR:
    - '000000'
  fail_when: '`VBPA.KUNNR` != `VBAK.KUNNR`'
  severity: high
  dimension: consistency
  message: Sold-to partner differs from the sold-to of the order header
  why_it_matters: The sold-to is stored in the header and in the partner table.
  rule_authority: best_practice
  sap_impact: Billing and credit use one partner and delivery another.
  fix_map:
    __other__: Correct the partner in VA02.
  record_fix_template: 'Order {VBPA.VBELN}: partner sold-to {VBPA.KUNNR}, header {VBAK.KUNNR}.'
- id: SDSO263
  field: VBPA.ADRNR
  check_class: cross_field_check
  grain: VBPA
  applies_when:
    VBUK.GBSTK:
      not_in:
      - C
    VBPA.PARVW:
    - AG
    - WE
    - RE
    - RG
    VBPA.KUNNR:
      populated: true
  fail_when: (`KNA1.XCPDK` == 'X') & `VBPA.ADRNR`.isna()
  severity: high
  dimension: completeness
  message: Partner of a one-time customer has no own address
  why_it_matters: A one-time account holds no address. The document partner must carry it.
  rule_authority: best_practice
  sap_impact: Delivery notes and invoices have no address.
  fix_map:
    __other__: Maintain the one-time address in VA02.
  record_fix_template: 'Order {VBPA.VBELN}: one-time partner {VBPA.PARVW} {VBPA.KUNNR} has no address.'
- id: SDSO264
  field: LFA1.LOEVM
  check_class: cross_field_check
  grain: VBPA
  applies_when:
    VBUK.GBSTK:
      not_in:
      - C
    VBPA.LIFNR:
      populated: true
  fail_when: '`LFA1.LOEVM` == ''X'''
  severity: medium
  dimension: consistency
  message: Vendor partner (carrier, forwarder) on an open order is flagged for deletion
  why_it_matters: A vendor partner is used for shipping. A deletion flag means the vendor is going away.
  rule_authority: best_practice
  sap_impact: Transport costs cannot be posted.
  fix_map:
    __other__: Replace the partner (VA02).
  record_fix_template: 'Order {VBPA.VBELN}: vendor partner {VBPA.LIFNR} is flagged for deletion.'
- id: SDSO265
  field: VBPA.LIFNR
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Vendor in a partner function does not exist in the vendor master
  why_it_matters: A vendor partner must exist in LFA1.
  rule_authority: sap_hard_constraint
  sap_impact: Shipment cost and output run on an unknown vendor.
  fix_map:
    __other__: Correct the partner (VA02).
  record_fix_template: 'Order {VBPA.VBELN}: vendor partner ''{actual_value}'' does not exist.'
- id: SDSO266
  field: VBAK.VBELN
  check_class: exists_check
  fields:
