  simplification_item: SD Foreign Trade replaced by SAP Global Trade Services
  baseline: s4_target
  severity: low
  dimension: consistency
  message: Foreign trade document has a destination country that does not exist
  why_it_matters: GTS needs a valid destination country for customs declaration.
  rule_authority: s4hana_migration
  sap_impact: The foreign trade document cannot be migrated.
  fix_map:
    __other__: Correct the destination country (VX02).
  record_fix_template: 'Foreign trade document {EIKP.EXNUM}: destination country {EIKP.ALAND} does not exist.'
- id: SDSO335
  field: EIPO.EXNUM
  check_class: exists_check
  target_table: EIKP
  target_fields:
  - EXNUM
  grain: EIPO
  s4_area: foreign_trade
  s4_impact: warning
  simplification_item: SD Foreign Trade replaced by SAP Global Trade Services
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: Foreign trade item has no header
  why_it_matters: An item without header (EIKP) cannot be moved as part of a document.
  rule_authority: s4hana_migration
  sap_impact: The item is lost.
  fix_map:
    __other__: Delete the orphan item or recreate the header.
  record_fix_template: 'Foreign trade document {EIPO.EXNUM}: item {EIPO.EXPOS} has no header.'
- id: SDSO336
  field: EIPO.STAWN
  check_class: null_check
  grain: EIPO
  s4_area: foreign_trade
  s4_impact: warning
  simplification_item: SD Foreign Trade replaced by SAP Global Trade Services
  baseline: s4_target
  severity: medium
  dimension: completeness
  message: Foreign trade item has no commodity code
  why_it_matters: GTS declarations are built from the commodity code. An item without one cannot be declared.
  rule_authority: s4hana_migration
  sap_impact: The customs declaration cannot be created for the item.
  fix_map:
    __other__: Enter the commodity code (VX02).
  record_fix_template: 'Foreign trade document {EIPO.EXNUM}, item {EIPO.EXPOS}: no commodity code.'
- id: SDSO337
  field: EIPO.HERKL
  check_class: null_check
  grain: EIPO
  s4_area: foreign_trade
  s4_impact: warning
  simplification_item: SD Foreign Trade replaced by SAP Global Trade Services
  baseline: s4_target
  severity: medium
  dimension: completeness
  message: Foreign trade item has no country of origin
  why_it_matters: The country of origin is needed for the declaration and for preference.
  rule_authority: s4hana_migration
  sap_impact: The declaration cannot be created for the item.
  fix_map:
    __other__: Enter the country of origin (VX02).
  record_fix_template: 'Foreign trade document {EIPO.EXNUM}, item {EIPO.EXPOS}: no country of origin.'
- id: SDSO338
  field: LIKP.EXNUM
  check_class: exists_check
  target_table: EIKP
  target_fields:
  - EXNUM
  grain: LIKP
  s4_area: foreign_trade
  s4_impact: warning
  simplification_item: SD Foreign Trade replaced by SAP Global Trade Services
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: Delivery points to a foreign trade document that does not exist
  why_it_matters: The link from the delivery to its export document is lost when the document is gone.
  rule_authority: s4hana_migration
  sap_impact: The delivery loses its customs data.
  fix_map:
