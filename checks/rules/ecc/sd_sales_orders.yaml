- id: SDSO271
  field: KNMT.KUNNR
  check_class: referential_check
  severity: high
  dimension: validity
  message: Customer-material info record points to a customer that does not exist
  why_it_matters: The record is keyed on the customer. Without KNA1 the record is orphaned.
  rule_authority: sap_hard_constraint
  sap_impact: The record is never used and may block deletion.
  fix_map:
    __other__: Delete the record (VD52).
  record_fix_template: 'Info record for customer {KNMT.KUNNR}: customer does not exist.'
- id: SDSO272
  field: KNMT.MATNR
  check_class: referential_check
  severity: high
  dimension: validity
  message: Customer-material info record points to a material that does not exist
  why_it_matters: The record is keyed on the material.
  rule_authority: sap_hard_constraint
  sap_impact: The customer's number cannot be resolved.
  fix_map:
    __other__: Delete the record (VD52).
  record_fix_template: 'Info record for material {KNMT.MATNR}: material does not exist.'
- id: SDSO273
  field: KNMT.KDMAT
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Customer-material info record has no customer material number
  why_it_matters: Without the customer's number the record does no work.
  rule_authority: sap_hard_constraint
  sap_impact: Order entry and EDI cannot translate.
  fix_map:
    __blank__: Fill the number (VD52) or delete the record.
  record_fix_template: 'Info record {KNMT.KUNNR}/{KNMT.MATNR}: no customer material number.'
- id: SDSO274
  field: KNMT.MATNR
  check_class: cross_field_check
  grain: KNMT
  fail_when: '`MARA.LVORM` == ''X'''
  severity: medium
  dimension: lifecycle
  message: Customer-material info record is for a material flagged for deletion
  why_it_matters: The material is going away.
  rule_authority: best_practice
  sap_impact: The customer's number resolves to a dead part.
  fix_map:
    __other__: Delete the record or repoint it to the successor (VD52).
  record_fix_template: 'Info record {KNMT.KUNNR}/{KNMT.MATNR}: material is flagged for deletion.'
- id: SDSO275
  field: KNMT.KUNNR
  check_class: cross_field_check
  grain: KNMT
  fail_when: '`KNA1.LOEVM` == ''X'''
  severity: medium
  dimension: lifecycle
  message: Customer-material info record is for a customer flagged for deletion
  why_it_matters: The customer is going away.
  rule_authority: best_practice
  sap_impact: The record is never used again.
  fix_map:
    __other__: Delete the record (VD52).
  record_fix_template: 'Info record {KNMT.KUNNR}/{KNMT.MATNR}: customer is flagged for deletion.'
- id: SDSO276
  field: KNMT.WERKS
  check_class: exists_check
  fields:
  - KNMT.MATNR
  - KNMT.WERKS
  grain: KNMT
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    LVORM:
      blank: true
  severity: medium
  dimension: consistency
  message: Delivering plant on the customer-material info record has no active plant data for the material
  why_it_matters: The plant is proposed to the order item.
  rule_authority: sap_hard_constraint
  sap_impact: Items default to a plant that cannot supply.
  fix_map:
    __other__: Correct the plant (VD52).
  record_fix_template: 'Info record {KNMT.KUNNR}/{KNMT.MATNR}: plant {KNMT.WERKS} has no active plant data.'
- id: SDSO277
  field: KNMT.MATNR
  check_class: exists_check
  fields:
  - KNMT.MATNR
  - KNMT.VKORG
  - KNMT.VTWEG
  grain: KNMT
  target_table: MVKE
  target_fields:
  - MATNR
  - VKORG
  - VTWEG
  severity: medium
  dimension: consistency
  message: Customer-material info record is for a sales area where the material has no sales data
  why_it_matters: The record is only usable if the material is extended to the sales area.
  rule_authority: sap_hard_constraint
  sap_impact: The customer's number is not found at order entry.
  fix_map:
    __other__: Extend the material (MM01) or delete the record.
  record_fix_template: 'Info record {KNMT.KUNNR}/{KNMT.MATNR}: no sales data in {KNMT.VKORG}/{KNMT.VTWEG}.'
- id: SDSO278
  field: KNMT.KUNNR
  check_class: exists_check
  fields:
  - KNMT.KUNNR
  - KNMT.VKORG
  - KNMT.VTWEG
  grain: KNMT
  target_table: KNVV
  target_fields:
  - KUNNR
  - VKORG
  - VTWEG
  severity: medium
  dimension: consistency
  message: Customer-material info record is for a sales area where the customer has no sales data
  why_it_matters: The record is only usable if the customer is extended to the sales area.
  rule_authority: sap_hard_constraint
  sap_impact: The record is never found.
  fix_map:
    __other__: Extend the customer (XD01) or delete the record.
  record_fix_template: 'Info record {KNMT.KUNNR}/{KNMT.MATNR}: customer has no sales data in {KNMT.VKORG}/{KNMT.VTWEG}.'
- id: SDSO279
  field: KNMT.UNTTO
  check_class: cross_field_check
  grain: KNMT
  fail_when: '`KNMT.UNTTO` > 100'
  severity: low
  dimension: validity
  message: Under-delivery tolerance on the info record is above 100 percent
  why_it_matters: A tolerance above 100 percent allows a delivery of nothing.
  rule_authority: best_practice
  sap_impact: Items are closed without delivery.
  fix_map:
    __other__: Correct the tolerance (VD52).
  record_fix_template: 'Info record {KNMT.KUNNR}/{KNMT.MATNR}: under-delivery tolerance {KNMT.UNTTO}.'
- id: SDSO280
  field: KONP.KRECH
  check_class: domain_value_check
  valid_values_with_labels:
    A: Percentage
    B: Fixed amount
    C: Quantity
    D: Gross weight
    E: Net weight
    F: Volume
    G: Formula
    H: Percentage (in hundreds)
    I: Percentage (travel expenses)
    L: Points
    M: Quantity - monthly price
    N: Quantity - yearly price
    O: Quantity - daily price
    P: Quantity - weekly price
    Q: Reserved
    R: Distance-dependent
    S: Number of shipping units
    T: Multi-dimensional
  severity: medium
  dimension: validity
  message: Calculation type of the condition item is not a defined calculation type
  why_it_matters: Pricing can only compute the types in the domain.
  rule_authority: sap_hard_constraint
  sap_impact: Pricing ends in an error or ignores the condition.
  fix_map:
    __other__: Correct the type (VK12).
  record_fix_template: 'Condition {KONP.KNUMH}: calculation type ''{actual_value}'' is invalid.'
- id: SDSO281
  field: KONP.KONWA
  check_class: referential_check
  applies_when:
    KONP.KRECH:
      not_in:
      - A
      - H
      - I
  severity: high
  dimension: validity
  message: Condition currency is not a defined currency (TCURC)
  why_it_matters: A rate in an unknown currency cannot be converted.
  rule_authority: sap_hard_constraint
  sap_impact: Pricing fails for the item.
  fix_map:
    __other__: Correct the currency (VK12).
  record_fix_template: 'Condition {KONP.KNUMH}: currency ''{actual_value}'' is not in TCURC.'
- id: SDSO282
  field: KONP.KMEIN
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Condition unit is not a defined unit of measure (T006)
  why_it_matters: A unit that is not in T006 cannot be converted.
  rule_authority: sap_hard_constraint
  sap_impact: Pricing fails or applies the wrong scale.
  fix_map:
    __other__: Correct the unit (VK12).
  record_fix_template: 'Condition {KONP.KNUMH}: unit ''{actual_value}'' is not in T006.'
- id: SDSO283
  field: KONP.KUMZA
  check_class: cross_field_check
  grain: KONP
  applies_when:
    KONP.KRECH:
    - C
    KONP.KMEIN:
      populated: true
    KONP.KUMZA:
      populated: true
    KONP.KUMNE:
      populated: true
    KONP.LOEVM_KO:
      blank: true
  fail_when: (`KONP.KUMZA` <= 0) | (`KONP.KUMNE` <= 0)
  severity: medium
  dimension: accuracy
  message: Quantity-based condition has a zero or negative unit conversion factor
  why_it_matters: The conversion from the pricing unit to the base unit must be positive.
  rule_authority: best_practice
  sap_impact: The price is multiplied by zero.
  fix_map:
    __other__: Correct the factor (VK12).
  record_fix_template: 'Condition {KONP.KNUMH}: conversion {KONP.KUMZA}/{KONP.KUMNE}.'
- id: SDSO284
  field: KONP.MXWRT
  check_class: cross_field_check
  grain: KONP
  applies_when:
    KONP.KRECH:
    - B
    KONP.MXWRT:
      gt: 0
    KONP.LOEVM_KO:
      blank: true
  fail_when: '`KONP.KBETR`.abs() > `KONP.MXWRT`'
  severity: medium
  dimension: accuracy
  message: Fixed-amount condition rate exceeds its own upper limit
  why_it_matters: The upper limit caps the condition value.
  rule_authority: best_practice
  sap_impact: The cap hides the rate or pricing aborts.
  fix_map:
    __other__: Correct rate or limit (VK12).
  record_fix_template: 'Condition {KONP.KNUMH}: rate {KONP.KBETR} above limit {KONP.MXWRT}.'
- id: SDSO285
  field: KONP.KUNNR
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Customer on the condition item (rebate payee) does not exist
  why_it_matters: The payee is the customer who receives the rebate.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement cannot be posted.
  fix_map:
    __other__: Correct the customer (VK12).
  record_fix_template: 'Condition {KONP.KNUMH}: customer ''{actual_value}'' does not exist.'
- id: SDSO286
  field: KONP.LIFNR
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Vendor on the condition item does not exist
  why_it_matters: A vendor on a sales condition (freight, agent commission) must exist.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement cannot be posted.
  fix_map:
    __other__: Correct the vendor (VK12).
  record_fix_template: 'Condition {KONP.KNUMH}: vendor ''{actual_value}'' does not exist.'
- id: SDSO287
  field: KONP.ZTERM
  check_class: exists_check
  fields:
  - KONP.ZTERM
  grain: KONP
  target_table: T052
  target_fields:
  - ZTERM
  severity: medium
  dimension: validity
  message: Payment terms of a terms condition are not defined (T052)
  why_it_matters: A terms condition proposes the terms on the order.
  rule_authority: sap_hard_constraint
  sap_impact: The order carries unknown terms.
  fix_map:
    __other__: Correct the terms (VK12).
  record_fix_template: 'Condition {KONP.KNUMH}: terms ''{KONP.ZTERM}'' are not defined.'
- id: SDSO288
  field: KONP.KNUMH
  check_class: exists_check
  fields:
  - KONP.KNUMH
  grain: KONP
  target_table: KONH
  target_fields:
  - KNUMH
  severity: high
  dimension: consistency
  message: Condition item has no condition header (KONH)
  why_it_matters: Items hang under a header with validity and key.
  rule_authority: sap_hard_constraint
  sap_impact: The item is never found by pricing.
  fix_map:
    __other__: Delete the item or restore the header.
  record_fix_template: 'Condition item {KONP.KNUMH}/{KONP.KOPOS}: no header.'
- id: SDSO289
  field: KONH.KNUMH
  check_class: exists_check
  fields:
  - KONH.KNUMH
  grain: KONH
  target_table: KONP
  target_fields:
  - KNUMH
  severity: high
  dimension: completeness
  message: Condition header has no condition item (KONP)
  why_it_matters: Without an item no rate exists.
  rule_authority: sap_hard_constraint
  sap_impact: Pricing finds the record but no rate and prices the item at zero.
  fix_map:
    __other__: Delete the header or maintain the rate (VK12).
  record_fix_template: 'Condition {KONH.KNUMH} ({KONH.KSCHL}): no item.'
- id: SDSO290
  field: KONH.VAKEY
  check_class: null_check
  severity: high
  dimension: completeness
  message: Condition header has no variable key
  why_it_matters: The variable key identifies the combination the record is valid for.
  rule_authority: sap_hard_constraint
  sap_impact: The record cannot be selected or maintained by key.
  fix_map:
    __blank__: Delete and re-create the record (VK11).
  record_fix_template: 'Condition {KONH.KNUMH} ({KONH.KSCHL}): variable key is empty.'
- id: SDSO291
  field: KONP.KNUMH
  check_class: exists_check
  fields:
  - KONP.KNUMH
  - KONP.KOPOS
  grain: KONP
  applies_when:
    KONP.KZBZG:
    - B
    KONP.LOEVM_KO:
      blank: true
  target_table: KONM
  target_fields:
  - KNUMH
  - KOPOS
  severity: high
  dimension: consistency
  message: Quantity-scale condition has no scale lines (KONM)
  why_it_matters: A quantity scale needs its thresholds in the scale table.
  rule_authority: sap_hard_constraint
  sap_impact: Pricing finds no scale and prices at zero.
  fix_map:
    __other__: Maintain the scale (VK12).
  record_fix_template: 'Condition {KONP.KNUMH}/{KONP.KOPOS}: quantity scale has no scale lines.'
- id: SDSO292
  field: KONM.KSTBM
  check_class: uniqueness_check
  fields:
  - KONM.KNUMH
  - KONM.KOPOS
  - KONM.KSTBM
  grain: KONM
  severity: high
  dimension: uniqueness
  message: Quantity scale has the same threshold twice
  why_it_matters: A duplicate threshold makes the rate ambiguous.
  rule_authority: sap_hard_constraint
  sap_impact: Pricing picks one rate by chance.
  fix_map:
    __other__: Delete the duplicate (VK12).
  record_fix_template: 'Condition {KONM.KNUMH}/{KONM.KOPOS}: duplicate scale threshold {KONM.KSTBM}.'
- id: SDSO293
  field: KONH.KNUMH
  check_class: exists_check
  fields:
  - KONH.KNUMH
  grain: KONH
  applies_when:
    KONH.KOTABNR:
    - '004'
    KONH.KAPPL:
    - V
  target_table: A004
  target_fields:
  - KNUMH
  severity: high
  dimension: consistency
  message: Condition header for table 004 has no key record in A004
  why_it_matters: A header with table number 004 must have its key record in A004.
  rule_authority: sap_hard_constraint
  sap_impact: The record is never found by pricing.
  fix_map:
    __other__: Delete the header or re-create the record (VK11).
  record_fix_template: 'Condition {KONH.KNUMH} ({KONH.KSCHL}): no key record in A004.'
- id: SDSO294
  field: A004.KNUMH
  check_class: exists_check
  fields:
  - A004.KNUMH
  grain: A004
  target_table: KONH
  target_fields:
  - KNUMH
  severity: high
  dimension: consistency
  message: Key record in A004 has no condition header (KONH)
  why_it_matters: Each A004 record points to a header.
  rule_authority: sap_hard_constraint
  sap_impact: Pricing finds the key and no rate.
  fix_map:
    __other__: Delete the key record.
  record_fix_template: 'Condition key record A004 {A004.KNUMH}: no header.'
- id: SDSO295
  field: A004.DATAB
  check_class: cross_field_check
  grain: A004
  fail_when: (`A004.DATAB` != `KONH.DATAB`) | (`A004.DATBI` != `KONH.DATBI`)
  severity: high
  dimension: consistency
  message: Validity of the A004 key record differs from the condition header
  why_it_matters: A004 holds a copy of the header validity.
  rule_authority: best_practice
  sap_impact: Pricing and maintenance disagree on validity.
  fix_map:
    __other__: Re-save the record (VK12).
  record_fix_template: 'Condition A004 {A004.KNUMH}: validity {A004.DATAB}-{A004.DATBI} differs from header.'
- id: SDSO296
  field: A004.MATNR
  check_class: cross_field_check
  grain: A004
  applies_when:
    A004.DATBI:
      within_days: 36500
  fail_when: '`MARA.LVORM` == ''X'''
  severity: medium
  dimension: lifecycle
  message: Valid A004 price record is for a material flagged for deletion
  why_it_matters: A valid record on a deleted material is dead weight.
  rule_authority: best_practice
  sap_impact: Maintenance lists are cluttered.
  fix_map:
    __other__: Delimit the record (VK12).
  record_fix_template: 'Condition A004 {A004.KNUMH}: material {A004.MATNR} flagged for deletion.'
- id: SDSO297
  field: KONH.KNUMH
  check_class: exists_check
  fields:
  - KONH.KNUMH
  grain: KONH
  applies_when:
    KONH.KOTABNR:
    - '005'
    KONH.KAPPL:
    - V
  target_table: A005
  target_fields:
  - KNUMH
  severity: high
  dimension: consistency
  message: Condition header for table 005 has no key record in A005
  why_it_matters: A header with table number 005 must have its key record in A005.
  rule_authority: sap_hard_constraint
  sap_impact: The record is never found by pricing.
  fix_map:
    __other__: Delete the header or re-create the record (VK11).
  record_fix_template: 'Condition {KONH.KNUMH} ({KONH.KSCHL}): no key record in A005.'
- id: SDSO298
  field: A005.KNUMH
  check_class: exists_check
  fields:
  - A005.KNUMH
  grain: A005
  target_table: KONH
  target_fields:
  - KNUMH
  severity: high
  dimension: consistency
  message: Key record in A005 has no condition header (KONH)
  why_it_matters: Each A005 record points to a header.
  rule_authority: sap_hard_constraint
  sap_impact: Pricing finds the key and no rate.
  fix_map:
    __other__: Delete the key record.
  record_fix_template: 'Condition key record A005 {A005.KNUMH}: no header.'
- id: SDSO299
  field: A005.DATAB
  check_class: cross_field_check
  grain: A005
  fail_when: (`A005.DATAB` != `KONH.DATAB`) | (`A005.DATBI` != `KONH.DATBI`)
  severity: high
  dimension: consistency
  message: Validity of the A005 key record differs from the condition header
  why_it_matters: A005 holds a copy of the header validity.
  rule_authority: best_practice
  sap_impact: Pricing and maintenance disagree on validity.
  fix_map:
    __other__: Re-save the record (VK12).
  record_fix_template: 'Condition A005 {A005.KNUMH}: validity {A005.DATAB}-{A005.DATBI} differs from header.'
- id: SDSO300
  field: A005.KUNNR
  check_class: cross_field_check
  grain: A005
  applies_when:
    A005.DATBI:
      within_days: 36500
  fail_when: '`KNA1.LOEVM` == ''X'''
  severity: medium
  dimension: lifecycle
  message: Valid A005 price record is for a customer flagged for deletion
