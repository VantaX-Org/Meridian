- id: SDSO339
  field: VBKD.RRREL
  check_class: cross_field_check
  fail_when: '`VBKD.RRREL`.notna()'
  grain: VBKD
  s4_area: revenue_recognition
  s4_impact: blocking
  simplification_item: SD Revenue Recognition replaced by Revenue Accounting and Reporting
  baseline: s4_target
  severity: high
  dimension: consistency
  message: Sales document item uses classic revenue recognition
  why_it_matters: Revenue recognition in SD (VF44) is replaced by Revenue Accounting and Reporting. Items with a revenue recognition
    category must be migrated as RAR contracts.
  rule_authority: s4hana_migration
  sap_impact: Deferred revenue and unbilled receivables are not carried forward without a contract migration.
  fix_map:
    __other__: Plan the RAR contract migration; complete open revenue recognition (VF44) before cut-over.
  record_fix_template: 'Sales document {VBKD.VBELN}, item {VBKD.POSNR}: classic revenue recognition.'
- id: SDSO340
  field: VBKD.REVSP
  check_class: cross_field_check
  fail_when: '`VBKD.REVSP`.notna()'
  grain: VBKD
  s4_area: revenue_recognition
  s4_impact: warning
  simplification_item: SD Revenue Recognition replaced by Revenue Accounting and Reporting
  baseline: s4_target
  severity: medium
  dimension: consistency
  message: Sales document item has a revenue distribution type
  why_it_matters: A revenue distribution type steers the classic revenue recognition. It must be mapped to the RAR performance
    obligation.
  rule_authority: s4hana_migration
  sap_impact: The distribution of revenue differs after the conversion.
  fix_map:
    __other__: Map the distribution type in the RAR design.
  record_fix_template: 'Sales document {VBKD.VBELN}, item {VBKD.POSNR}: revenue distribution type set.'
