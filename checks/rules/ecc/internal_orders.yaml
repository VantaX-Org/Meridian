  target_table: T001
  target_fields:
  - BUKRS
  severity: critical
  dimension: accuracy
  message: Order company code does not exist in the company code master
  why_it_matters: AUFK.BUKRS must resolve to T001. Settlement posts to FI through this company code, and
    an orphan company code cannot post at all.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement cannot post; the order's costs are stranded.
  fix_map:
    __missing__: Create the company code or correct the order.
  record_fix_template: 'AUFK.BUKRS: ''{actual_value}'' has no T001 master record. Create the company code
    or correct the order.'
