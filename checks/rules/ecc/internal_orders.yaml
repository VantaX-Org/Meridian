module: internal_orders
target_state: ECC_AND_S4HANA
rules:
- id: IO001
  field: AUFK.AUFNR
  check_class: uniqueness_check
  fields:
  - AUFK.AUFNR
  severity: critical
  dimension: uniqueness
  message: Duplicate order numbers detected
  why_it_matters: AUFNR is the primary key of AUFK and the join to AFKO, the settlement rules and every
    CO line item.
  rule_authority: sap_hard_constraint
  sap_impact: Costs post to the wrong order; the migration rejects the duplicate.
  fix_map:
    __other__: Keep one order per number.
  record_fix_template: 'AUFK.AUFNR: duplicate key. Keep one order per number.'
- id: IO002
  field: AUFK.AUFNR
  check_class: regex_check
  pattern: ^[0-9]{1,12}$
  severity: high
  dimension: validity
  message: Order number must be numeric up to 12 digits
  why_it_matters: AUFNR is CHAR 12 assigned by an internal number range; external assignment uses the
    same numeric shape.
  rule_authority: sap_hard_constraint
  sap_impact: The order cannot be addressed by standard transactions.
  fix_map:
    __other__: Renumber the order from the SAP number range.
  record_fix_template: 'AUFK.AUFNR: ''{actual_value}'' has an invalid format. Renumber the order from
    the SAP number range.'
- id: IO003
  field: AUFK.AUART
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Order type is mandatory
  why_it_matters: AUART selects the number range, settlement profile, budget profile and required fields.
  rule_authority: sap_hard_constraint
  sap_impact: The order cannot be settled and its budget cannot be derived.
  fix_map:
    __blank__: Assign the order type in KO02.
  record_fix_template: 'AUFK.AUART: ''{actual_value}'' is blank. Assign the order type in KO02.'
- id: IO004
  field: AUFK.AUTYP
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Order category is mandatory
  why_it_matters: AUTYP distinguishes internal orders from production, maintenance and process orders
    and drives which transactions apply.
  rule_authority: sap_hard_constraint
  sap_impact: The order is processed by the wrong object logic.
  fix_map:
    __blank__: Assign the order category in KO02.
  record_fix_template: 'AUFK.AUTYP: ''{actual_value}'' is blank. Assign the order category in KO02.'
- id: IO005
  field: AUFK.BUKRS
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Company code is mandatory on an order
  why_it_matters: BUKRS is the legal entity the order's costs fall into and where settlement posts to
    FI.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement cannot post to FI; costs remain on the order.
  fix_map:
    __blank__: Assign the company code in KO02.
  record_fix_template: 'AUFK.BUKRS: ''{actual_value}'' is blank. Assign the company code in KO02.'
- id: IO006
  field: AUFK.KOKRS
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Controlling area is mandatory on an order
  why_it_matters: KOKRS is the controlling area all CO postings are read in.
  rule_authority: sap_hard_constraint
  sap_impact: The order is invisible to controlling.
  fix_map:
    __blank__: Assign the controlling area in KO02.
  record_fix_template: 'AUFK.KOKRS: ''{actual_value}'' is blank. Assign the controlling area in KO02.'
- id: IO007
  field: AUFK.WAERS
  check_class: null_check
  severity: high
  dimension: completeness
  message: Order currency is blank
  why_it_matters: WAERS is the currency the order's planned and actual costs are held in.
  rule_authority: sap_hard_constraint
  sap_impact: Order costs have no currency and cannot be translated.
  fix_map:
    __blank__: Assign the order currency in KO02.
  record_fix_template: 'AUFK.WAERS: ''{actual_value}'' is blank. Assign the order currency in KO02.'
- id: IO008
  field: AUFK.WERKS
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Plant is blank on a plant-related order
  why_it_matters: WERKS ties the order to the plant whose stock and capacity it consumes.
  rule_authority: sap_hard_constraint
  sap_impact: Plant availability and capacity checks cannot run for the order.
  fix_map:
    __blank__: Assign the plant in KO02.
  record_fix_template: 'AUFK.WERKS: ''{actual_value}'' is blank. Assign the plant in KO02.'
- id: IO009
  field: AUFK.KOSTV
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Responsible cost centre is blank
  why_it_matters: KOSTV is the cost centre responsible for the order's spend.
  rule_authority: sap_hard_constraint
  sap_impact: Spend cannot be attributed to a responsible manager.
  fix_map:
    __blank__: Assign the responsible cost centre in KO02.
  record_fix_template: 'AUFK.KOSTV: ''{actual_value}'' is blank. Assign the responsible cost centre in
    KO02.'
- id: IO010
  field: AUFK.KOSTL
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Cost centre is blank on a cost-collecting order
  why_it_matters: KOSTL receives the order's costs when the order is settled to a cost centre.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement has no receiver; costs stay on the order.
  fix_map:
    __blank__: Assign the cost centre in KO02.
  record_fix_template: 'AUFK.KOSTL: ''{actual_value}'' is blank. Assign the cost centre in KO02.'
- id: IO011
  field: AUFK.PRCTR
  check_class: null_check
  severity: low
  dimension: completeness
  message: Profit centre is blank
  why_it_matters: PRCTR routes the order's costs into the profit-centre P&L.
  rule_authority: sap_hard_constraint
  sap_impact: The order is missing from profit-centre reporting.
  fix_map:
    __blank__: Assign the profit centre in KO02.
  record_fix_template: 'AUFK.PRCTR: ''{actual_value}'' is blank. Assign the profit centre in KO02.'
- id: IO012
  field: AUFK.GSBER
  check_class: null_check
  severity: low
  dimension: completeness
  message: Business area is blank
  why_it_matters: GSBER is needed for business-area balance-sheet reporting in classic GL.
  rule_authority: sap_hard_constraint
  sap_impact: The order is missing from business-area reporting.
  fix_map:
    __blank__: Assign the business area in KO02.
  record_fix_template: 'AUFK.GSBER: ''{actual_value}'' is blank. Assign the business area in KO02.'
- id: IO013
  field: AUFK.ERDAT
  check_class: null_check
  severity: high
  dimension: completeness
  message: Creation date is blank
  why_it_matters: ERDAT is stamped by SAP at creation and drives order ageing and backlog reporting.
  rule_authority: sap_hard_constraint
  sap_impact: Order ageing and backlog reporting cannot place the order in time.
  fix_map:
    __blank__: Correct the creation date.
  record_fix_template: 'AUFK.ERDAT: ''{actual_value}'' is blank. Correct the creation date.'
- id: IO014
  field: AUFK.ERDAT
  check_class: cross_field_check
  fail_when: (`AUFK.ERDAT` - @today).dt.days > 0
  require_populated: true
  severity: low
  dimension: timeliness
  message: Order was created with a future date
  why_it_matters: ERDAT is stamped by SAP; a future date means a manipulated timestamp during the load.
  rule_authority: sap_business_convention
  sap_impact: Order ageing and backlog reporting are wrong.
  fix_map:
    __other__: Correct the creation date.
  record_fix_template: 'AUFK.ERDAT: ''{actual_value}'' is in the future. Correct the creation date.'
- id: IO015
  field: AUFK.AEDAT
  check_class: cross_field_check
  fail_when: (`AUFK.AEDAT` - @today).dt.days > 0
  require_populated: true
  severity: low
  dimension: timeliness
  message: Order was changed with a future date
  why_it_matters: AEDAT is stamped at the last change.
  rule_authority: sap_business_convention
  sap_impact: Change-audit reporting is wrong for the order.
  fix_map:
    __other__: Correct the change date.
  record_fix_template: 'AUFK.AEDAT: ''{actual_value}'' is in the future. Correct the change date.'
- id: IO016
  field: AUFK.OBJNR
  check_class: null_check
  severity: high
  dimension: completeness
  message: Object number is blank
  why_it_matters: OBJNR is the CO object every cost line item posts against; without it the order collects
    nothing.
  rule_authority: sap_hard_constraint
  sap_impact: Costs cannot post to the order; the CO object does not exist.
  fix_map:
    __blank__: Recreate the order so the object number is generated.
  record_fix_template: 'AUFK.OBJNR: ''{actual_value}'' is blank. Recreate the order so the object number
    is generated.'
- id: IO017
  field: AUFK.KTEXT
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Order description is blank
  why_it_matters: KTEXT is the short description users use to identify the order in every selection screen.
  rule_authority: sap_hard_constraint
  sap_impact: Users cannot identify the order; selections by description miss it.
  fix_map:
    __blank__: Enter the order description in KO02.
  record_fix_template: 'AUFK.KTEXT: ''{actual_value}'' is blank. Enter the order description in KO02.'
- id: IO018
  field: AUFK.LOEKZ
  check_class: domain_value_check
  allowed_values:
  - X
  severity: medium
  dimension: validity
  message: Deletion flag must be blank, X or L
  why_it_matters: LOEKZ marks the order for deletion or as locked for deletion.
  rule_authority: sap_hard_constraint
  sap_impact: The order's deletion state is ambiguous and it may be migrated when it should not be.
  fix_map:
    __other__: Set the deletion flag explicitly.
  record_fix_template: 'AUFK.LOEKZ: ''{actual_value}'' is not a permitted value. Set the deletion flag
    explicitly.'
- id: IO019
  field: AUFK.PHAS0
  check_class: domain_value_check
  allowed_values:
  - ''
  - X
  severity: low
  dimension: validity
  message: Phase 0 indicator must be blank or X
  why_it_matters: PHAS0 is a status flag set at order creation.
  rule_authority: sap_hard_constraint
  sap_impact: Order status reporting is unreliable for the record.
  fix_map:
    __other__: Set the flag explicitly.
  record_fix_template: 'AUFK.PHAS0: ''{actual_value}'' is not a permitted value. Set the flag explicitly.'
- id: IO020
  field: AUFK.KALSM
  check_class: null_check
  severity: low
  dimension: completeness
  message: Costing sheet is blank
  why_it_matters: KALSM determines the overhead surcharges applied to the order.
  rule_authority: sap_hard_constraint
  sap_impact: Overhead is not applied to the order's costs.
  fix_map:
    __blank__: Assign the costing sheet in KO02.
  record_fix_template: 'AUFK.KALSM: ''{actual_value}'' is blank. Assign the costing sheet in KO02.'
- id: IO021
  field: AUFK.STDAT
  check_class: cross_field_check
  fail_when: (`AUFK.STDAT` - @today).dt.days > 0
  require_populated: true
  severity: medium
  dimension: timeliness
  message: Order status date is in the future
  why_it_matters: STDAT is the date of the order's current status; it cannot be after today.
  rule_authority: sap_business_convention
  sap_impact: Order status reporting shows a future status change.
  fix_map:
    __other__: Correct the status date.
  record_fix_template: 'AUFK.STDAT: ''{actual_value}'' is in the future. Correct the status date.'
- id: IO022
  field: AUFK.ABKRS
  check_class: null_check
  severity: low
  dimension: completeness
  message: Processing group is blank
  why_it_matters: ABKRS groups orders for periodic processing and settlement runs.
  rule_authority: sap_hard_constraint
  sap_impact: The order may be skipped in the settlement run.
  fix_map:
    __blank__: Assign the processing group in KO02.
  record_fix_template: 'AUFK.ABKRS: ''{actual_value}'' is blank. Assign the processing group in KO02.'
- id: IO023
  field: AUFK.AUFEX
  check_class: null_check
  severity: low
  dimension: completeness
  message: External order number is blank
  why_it_matters: AUFEX carries the external reference used to reconcile the order to a legacy system.
  rule_authority: sap_hard_constraint
  sap_impact: The migrated order cannot be traced back to its legacy record.
  fix_map:
    __blank__: Populate the external order number.
  record_fix_template: 'AUFK.AUFEX: ''{actual_value}'' is blank. Populate the external order number.'
- id: IO024
  field: AFKO.AUFNR
  check_class: uniqueness_check
  fields:
  - AFKO.AUFNR
  severity: critical
  dimension: uniqueness
  message: Duplicate AFKO header keys detected
  why_it_matters: AUFNR is the primary key of AFKO; a duplicate header doubles the order's quantities.
  rule_authority: sap_hard_constraint
  sap_impact: Order quantities and costs are counted twice.
  fix_map:
    __other__: Keep one AFKO row per order.
  record_fix_template: 'AFKO.AUFNR: duplicate key. Keep one AFKO row per order.'
- id: IO025
  field: AFKO.GLTRP
  check_class: cross_field_check
  fail_when: '`AFKO.GLTRP` < `AFKO.GSTRP`'
  require_populated: true
  severity: high
  dimension: consistency
  message: Planned finish date is before the planned start
  why_it_matters: A planned schedule must finish on or after it starts.
  rule_authority: sap_hard_constraint
  sap_impact: Capacity load and lead-time are calculated as negative.
  fix_map:
    __other__: Correct the planned dates in CO02.
  record_fix_template: AFKO.GLTRP '{actual_value}' precedes AFKO.GSTRP. Correct the planned dates in CO02.
- id: IO026
  field: AFKO.GLTRS
  check_class: cross_field_check
  fail_when: '`AFKO.GLTRS` < `AFKO.GSTRS`'
  require_populated: true
  severity: high
  dimension: consistency
  message: Actual finish date is before the actual start
  why_it_matters: The actual execution interval cannot end before it began; SAP stamps these at confirmation.
  rule_authority: sap_hard_constraint
  sap_impact: Actual lead-time and work-centre efficiency are wrong.
  fix_map:
    __other__: Correct the actual dates in CO02.
  record_fix_template: AFKO.GLTRS '{actual_value}' precedes AFKO.GSTRS. Correct the actual dates in CO02.
- id: IO027
  field: AFKO.GLTRI
  check_class: cross_field_check
  fail_when: '`AFKO.GLTRI` < `AFKO.GSTRI`'
  require_populated: true
  severity: high
  dimension: consistency
  message: Confirmed finish date is before the confirmed start
  why_it_matters: The confirmation interval must be ordered.
  rule_authority: sap_hard_constraint
  sap_impact: Confirmation and capacity-consumption reporting are wrong.
  fix_map:
    __other__: Correct the confirmed dates.
  record_fix_template: AFKO.GLTRI '{actual_value}' precedes AFKO.GSTRI. Correct the confirmed dates.
- id: IO028
  field: AFKO.GLTPP
  check_class: cross_field_check
  fail_when: '`AFKO.GLTPP` < `AFKO.GSTPP`'
  require_populated: true
  severity: medium
  dimension: consistency
  message: Forecast finish date is before the forecast start
  why_it_matters: The forecast schedule must be ordered like the planned schedule.
  rule_authority: sap_hard_constraint
  sap_impact: Forecast dates and capacity levelling are wrong.
  fix_map:
    __other__: Correct the forecast dates in CO02.
  record_fix_template: AFKO.GLTPP '{actual_value}' precedes AFKO.GSTPP. Correct the forecast dates in
    CO02.
- id: IO029
  field: AFKO.GSTRP
  check_class: null_check
  severity: high
  dimension: completeness
  message: Planned start date is blank
  why_it_matters: GSTRP anchors the order's schedule and drives capacity requirements.
  rule_authority: sap_hard_constraint
  sap_impact: The order cannot be scheduled or loaded onto capacity.
  fix_map:
    __blank__: Enter the planned start date in CO02.
  record_fix_template: 'AFKO.GSTRP: ''{actual_value}'' is blank. Enter the planned start date in CO02.'
- id: IO030
  field: AFKO.GLTRP
  check_class: null_check
  severity: high
  dimension: completeness
  message: Planned finish date is blank
  why_it_matters: GLTRP closes the planned schedule.
  rule_authority: sap_hard_constraint
  sap_impact: The order's schedule is incomplete and capacity planning skips it.
  fix_map:
    __blank__: Enter the planned finish date in CO02.
  record_fix_template: 'AFKO.GLTRP: ''{actual_value}'' is blank. Enter the planned finish date in CO02.'
- id: IO031
  field: AFKO.GAMNG
  check_class: cross_field_check
  fail_when: '`AFKO.GAMNG` < 0'
  require_populated: true
  severity: high
  dimension: validity
  message: Total order quantity is negative
  why_it_matters: GAMNG is the quantity the order produces; a negative quantity inverts the goods movement.
  rule_authority: sap_hard_constraint
  sap_impact: Goods receipt moves stock the wrong way and production cost is negative.
  fix_map:
    __other__: Correct the order quantity in CO02.
  record_fix_template: 'AFKO.GAMNG: ''{actual_value}'' is negative. Correct the order quantity in CO02.'
- id: IO032
  field: AFKO.GASMG
  check_class: cross_field_check
  fail_when: '`AFKO.GASMG` < 0'
  require_populated: true
  severity: medium
  dimension: validity
  message: Total scrap quantity is negative
  why_it_matters: GASMG is the scrap quantity expected; it cannot be negative.
  rule_authority: sap_hard_constraint
  sap_impact: Scrap and yield reporting are wrong for the order.
  fix_map:
    __other__: Correct the scrap quantity.
  record_fix_template: 'AFKO.GASMG: ''{actual_value}'' is negative. Correct the scrap quantity.'
- id: IO033
  field: AFKO.GMEIN
  check_class: null_check
  severity: high
  dimension: completeness
  message: Unit of measure is blank on the order
  why_it_matters: GMEIN is the unit the order quantity is expressed in.
  rule_authority: sap_hard_constraint
  sap_impact: The order quantity has no unit and cannot be converted for costing.
  fix_map:
    __blank__: Assign the order unit of measure.
  record_fix_template: 'AFKO.GMEIN: ''{actual_value}'' is blank. Assign the order unit of measure.'
- id: IO034
  field: AFKO.PLNME
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Planned unit of measure is blank
  why_it_matters: PLNME is the unit the planned quantities are expressed in.
  rule_authority: sap_hard_constraint
  sap_impact: Planned-versus-actual quantity comparison fails.
  fix_map:
    __blank__: Assign the planned unit of measure.
  record_fix_template: 'AFKO.PLNME: ''{actual_value}'' is blank. Assign the planned unit of measure.'
- id: IO035
  field: AFKO.PLNBEZ
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Planned material is blank on a producing order
  why_it_matters: PLNBEZ is the material the order produces; without it goods receipt cannot post.
  rule_authority: sap_hard_constraint
  sap_impact: Goods receipt cannot post and cost of goods manufactured cannot be computed.
  fix_map:
    __blank__: Assign the planned material in CO02.
  record_fix_template: 'AFKO.PLNBEZ: ''{actual_value}'' is blank. Assign the planned material in CO02.'
- id: IO036
  field: AFKO.PLNNR
  check_class: null_check
  severity: low
  dimension: completeness
  message: Task list number is blank
  why_it_matters: PLNNR links the order to the routing or recipe that determines operations and costs.
  rule_authority: sap_hard_constraint
  sap_impact: The order has no operations and cannot confirm work.
  fix_map:
    __blank__: Assign the task list or remove the order quantity.
  record_fix_template: 'AFKO.PLNNR: ''{actual_value}'' is blank. Assign the task list or remove the order
    quantity.'
- id: IO037
  field: AFKO.STLNR
  check_class: null_check
  severity: low
  dimension: completeness
  message: BOM number is blank
  why_it_matters: STLNR links the order to the bill of material that determines component requirements.
  rule_authority: sap_hard_constraint
  sap_impact: Component requirements are not generated for the order.
  fix_map:
    __blank__: Assign the BOM.
  record_fix_template: 'AFKO.STLNR: ''{actual_value}'' is blank. Assign the BOM.'
- id: IO038
  field: AFKO.DISPO
  check_class: null_check
  severity: low
  dimension: completeness
  message: MRP controller is blank
  why_it_matters: DISPO is the MRP controller responsible for the order.
  rule_authority: sap_hard_constraint
  sap_impact: The order is missing from MRP controller workload reporting.
  fix_map:
    __blank__: Assign the MRP controller.
  record_fix_template: 'AFKO.DISPO: ''{actual_value}'' is blank. Assign the MRP controller.'
- id: IO039
  field: AFKO.FEVOR
  check_class: null_check
  severity: low
  dimension: completeness
  message: Production scheduler is blank
  why_it_matters: FEVOR is the production scheduler responsible for the order.
  rule_authority: sap_hard_constraint
  sap_impact: The order is missing from production-scheduler reporting.
  fix_map:
    __blank__: Assign the production scheduler.
  record_fix_template: 'AFKO.FEVOR: ''{actual_value}'' is blank. Assign the production scheduler.'
- id: IO040
  field: AFKO.PLAUF
  check_class: cross_field_check
  fail_when: (`AFKO.PLAUF` - @today).dt.days > 0
  require_populated: true
  severity: low
  dimension: timeliness
  message: Scheduling date is in the future
  why_it_matters: PLAUF is the date the order was last scheduled; it cannot be after today.
  rule_authority: sap_business_convention
  sap_impact: Scheduling history for the order is wrong.
  fix_map:
    __other__: Correct the scheduling date.
  record_fix_template: 'AFKO.PLAUF: ''{actual_value}'' is in the future. Correct the scheduling date.'
- id: IO041
  field: AFKO.PDATV
  check_class: cross_field_check
  fail_when: (`AFKO.PDATV` - @today).dt.days > 0
  require_populated: true
  severity: low
  dimension: timeliness
  message: Task list change date is in the future
  why_it_matters: PDATV is the change date of the assigned task list.
  rule_authority: sap_business_convention
  sap_impact: Task-list version traceability is wrong for the order.
  fix_map:
    __other__: Correct the task list change date.
  record_fix_template: 'AFKO.PDATV: ''{actual_value}'' is in the future. Correct the task list change
    date.'
- id: IO042
  field: AFKO.PLSVB
  check_class: cross_field_check
  fail_when: '`AFKO.PLSVB` < 0'
  require_populated: true
  severity: medium
  dimension: validity
  message: Planned scrap quantity is negative
  why_it_matters: PLSVB is the planned scrap quantity; it cannot be negative.
  rule_authority: sap_hard_constraint
  sap_impact: Planned yield and scrap reporting are wrong.
  fix_map:
    __other__: Correct the planned scrap quantity.
  record_fix_template: 'AFKO.PLSVB: ''{actual_value}'' is negative. Correct the planned scrap quantity.'
- id: IO043
  field: AFKO.LODIV
  check_class: cross_field_check
  fail_when: '`AFKO.LODIV` < 0'
  require_populated: true
  severity: low
  dimension: validity
  message: Lot-size-dependent quantity is negative
  why_it_matters: LODIV is the lot-size quantity used to scale the order; it cannot be negative.
  rule_authority: sap_hard_constraint
  sap_impact: Order scaling and costing are wrong.
  fix_map:
    __other__: Correct the lot-size quantity.
  record_fix_template: 'AFKO.LODIV: ''{actual_value}'' is negative. Correct the lot-size quantity.'
- id: IO044
  field: AFKO.AUFPL
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Routing number is blank
  why_it_matters: AUFPL links the order's operations to the sequence and work centres.
  rule_authority: sap_hard_constraint
  sap_impact: Operations cannot be confirmed against the order.
  fix_map:
    __blank__: Assign the routing number in CO02.
  record_fix_template: 'AFKO.AUFPL: ''{actual_value}'' is blank. Assign the routing number in CO02.'
- id: IO045
  field: AFKO.PRONR
  check_class: null_check
  severity: low
  dimension: completeness
  message: Product planning number is blank
  why_it_matters: PRONR groups orders for product planning and long-term planning.
  rule_authority: sap_hard_constraint
  sap_impact: The order is missing from product planning runs.
  fix_map:
    __blank__: Assign the product planning number.
  record_fix_template: 'AFKO.PRONR: ''{actual_value}'' is blank. Assign the product planning number.'
- id: IO046
  field: AFKO.NTZUE
  check_class: null_check
  severity: low
  dimension: completeness
  message: Network assignment is blank
  why_it_matters: NTZUE links the order to the project network when it is project-driven.
  rule_authority: sap_hard_constraint
  sap_impact: Project-driven order reporting cannot link the order to its network.
  fix_map:
