module: accounts_payable
target_state: ECC_AND_S4HANA
rules:
- id: AP001
  field: LFA1.LIFNR
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Vendor number is mandatory \u2014 primary key for all vendor transactions"
  why_it_matters: "LIFNR is the primary key for all vendor master records and every vendor transaction in SAP. Without it,\
    \ no purchasing (ME21N), invoice verification (MIRO), or payment (F-53) can be processed. In S/4HANA, vendor records are\
    \ mapped to Business Partners via CVI \u2014 records without LIFNR are rejected by the migration conversion program."
  rule_authority: sap_hard_constraint
  sap_impact: Vendor cannot be used in any procurement or payment process. ME21N, MIRO, F-53, and all AP sub-ledger transactions
    fail. Migration conversion rejects the record.
  fix_map:
    __blank__: 'In ECC: assign a vendor number via T-code FK01 (create vendor) or investigate the data source for the missing
      key. For bulk remediation use LSMW with object 0050. In S/4HANA: create via Fiori app F3893 (Manage Business Partner)
      using the vendor role.'
  record_fix_template: 'Vendor {LFA1.LIFNR}: LIFNR is {actual_value}. Assign a valid vendor number via FK01 / Fiori app F3893
    or correct the source data load.'
- id: AP002
  field: LFA1.LIFNR
  check_class: regex_check
  pattern: ^[A-Z0-9]{1,10}$
  severity: critical
  dimension: validity
  message: Vendor number must be 1-10 alphanumeric characters
  why_it_matters: Vendor numbers must conform to the number range configuration (table TNRO, object KREDITOR). Non-conforming
    formats are rejected by the system during vendor creation and by the S/4HANA migration program. In S/4HANA, vendor numbers
    are mapped to Business Partner numbers via CVI.
  rule_authority: sap_hard_constraint
  sap_impact: Vendor rejected by number range validation. Unusable in any ECC/S4 process including ME21N, MIRO, F-53, and
    automatic payment program F110.
  fix_map:
    __other__: 'Vendor number ''{invalid_value}'' does not match the required format. In ECC: use LSMW or a conversion program
      to reformat before migration. Coordinate with the basis team on number range configuration (T-code SNRO, object KREDITOR).
      In S/4HANA: number ranges are managed via Fiori app F4596.'
  record_fix_template: 'Vendor {LFA1.LIFNR}: number format is invalid (value: ''{actual_value}''). Reformat or assign a new
    number via SNRO / Fiori app F4596.'
- id: AP003
  field: LFA1.NAME1
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Vendor name is mandatory \u2014 displayed on all purchasing and payment documents"
  why_it_matters: "NAME1 is the primary vendor name displayed on purchase orders, invoices, payment advices, and all printed\
    \ correspondence. It is a mandatory field in both ECC and S/4HANA \u2014 the vendor master cannot be saved without it."
  rule_authority: sap_hard_constraint
  sap_impact: Vendor master cannot be saved. Purchase orders and payment advices display blank vendor name. Audit trail is
    broken for AP transactions.
  fix_map:
    __blank__: 'In ECC: obtain the legal entity name from the vendor''s business registration or existing contracts and set
      via T-code FK02 > Address tab. In S/4HANA: use Fiori app F3893 (Manage Business Partner).'
  record_fix_template: 'Vendor {LFA1.LIFNR}: LFA1.NAME1 is missing or invalid. Set the vendor name via FK02 / Fiori app F3893.'
- id: AP005
  field: LFA1.LAND1
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Country is mandatory \u2014 drives tax determination, payment method, and address format"
  why_it_matters: LAND1 (country code) is a mandatory address field that drives tax determination (withholding tax, VAT),
    payment method selection in F110, bank validation rules, and postal address formatting. Without it, the vendor master
    is incomplete and SAP rejects it on save.
  rule_authority: sap_hard_constraint
  sap_impact: Vendor cannot be saved. Tax determination (FTXP) fails. Automatic payment program F110 cannot select the correct
    payment method. Withholding tax calculation is impossible.
  fix_map:
    __blank__: 'In ECC: determine the ISO country code from the vendor''s registered address and set via T-code FK02 > Address
      tab. In S/4HANA: use Fiori app F3893 (Manage Business Partner).'
  record_fix_template: 'Vendor {LFA1.LIFNR}: LAND1 is {actual_value}. Set the ISO country code via FK02 / Fiori app F3893.'
- id: AP006
  field: LFA1.LAND1
  check_class: regex_check
  pattern: ^[A-Z]{2}$
  severity: critical
  dimension: validity
  message: Country code must be a valid 2-letter ISO code
  why_it_matters: Country codes must conform to ISO 3166-1 alpha-2 format (e.g., ZA, US, DE). Invalid country codes cause
    tax determination failures, incorrect payment method selection, and are rejected by address validation in S/4HANA.
  rule_authority: sap_hard_constraint
  sap_impact: Tax determination fails. Payment method selection in F110 is incorrect. Address validation rejects the record
    in S/4HANA.
  fix_map:
    __other__: 'Country code ''{invalid_value}'' is not a valid ISO 3166-1 alpha-2 code. In ECC: correct via T-code FK02 >
      Address tab. Valid codes are configured in table T005. In S/4HANA: use Fiori app F3893.'
  record_fix_template: 'Vendor {LFA1.LIFNR}: LAND1 is ''{actual_value}''. Set a valid 2-letter ISO country code via FK02 /
    Fiori app F3893.'
- id: AP007
  field: LFA1.STCD1
  check_class: cross_field_check
  severity: low
  dimension: completeness
  message: Vendor has no tax identification (neither tax number 1 nor VAT registration number)
  why_it_matters: STCD1 (tax number 1) is required for VAT reporting, withholding tax calculation, and tax authority submissions.
    Without it, tax reports are incomplete and the company may face compliance penalties during tax audits.
  rule_authority: best_practice
  sap_impact: VAT returns (S_ALR_87012357) show incomplete vendor tax data. Withholding tax certificates cannot be generated.
    Tax audit trail is incomplete.
  fix_map:
    __blank__: 'In ECC: obtain the vendor''s VAT registration number or tax ID and set via T-code FK02 > General Data > Control
      tab. In S/4HANA: use Fiori app F3893 (Manage Business Partner) > Tax Numbers section.'
  record_fix_template: 'Vendor {LFA1.LIFNR}: LFA1.STCD1 is missing or invalid. Set the tax number via FK02 / Fiori app F3893.'
  fail_when: '`LFA1.STCD1`.isna() & `LFA1.STCEG`.isna()'
- id: AP009
  field: ADR6.SMTP_ADDR
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Email required for e-invoicing and automated remittance advice
  why_it_matters: Email address is required for electronic invoicing, automated remittance advice delivery, and vendor communication.
    Without it, remittance advices must be sent manually and e-invoicing workflows cannot be activated.
  rule_authority: best_practice
  sap_impact: Remittance advice (F110 output) cannot be sent electronically. E-invoicing integration is not possible. Vendor
    correspondence falls back to paper.
  fix_map:
    __blank__: 'In ECC: obtain email from the vendor or accounts payable team and add via T-code FK02 > Address tab > Communication.
      In S/4HANA: use Fiori app F3893 (Manage Business Partner) > Address section.'
  record_fix_template: 'Vendor {LFA1.LIFNR}: ADR6.SMTP_ADDR is missing or invalid. Set the email address via FK02 / Fiori app F3893.'
- id: AP010
  field: LFA1.KTOKK
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Vendor account group is mandatory \u2014 controls field status and number range"
  why_it_matters: KTOKK (account group) controls which fields are required, optional, or suppressed in the vendor master and
    which number ranges apply. It also determines the vendor category (e.g., domestic, foreign, one-time). Without it, the
    vendor master record is structurally incomplete.
  rule_authority: sap_hard_constraint
  sap_impact: Vendor master structure is undefined. Number range assignment fails. Field status rules cannot be applied. The
    record cannot be saved in either ECC or S/4HANA.
  fix_map:
    __blank__: 'In ECC: assign the account group via T-code FK02 > General Data. Common groups: KRED (domestic vendor), KRAU
      (foreign vendor), CPD (one-time vendor). In S/4HANA: use Fiori app F3893 via BP grouping.'
  record_fix_template: 'Vendor {LFA1.LIFNR}: KTOKK is {actual_value}. Assign the vendor account group via FK02 / Fiori app
    F3893.'
- id: AP011
  field: LFA1.LOEVM
  check_class: domain_value_check
  allowed_values:
  - X
  - ''
  severity: high
  dimension: validity
  message: Central deletion flag must be X (marked) or empty (active)
  why_it_matters: LOEVM flags the vendor for central deletion. Vendors marked for deletion should not receive new purchase
    orders or invoice postings. Incorrect flagging can cause active vendors to be blocked from procurement, while missing
    flags on inactive vendors lead to data clutter and potential duplicate creation.
  rule_authority: sap_hard_constraint
  sap_impact: Vendors flagged for deletion are excluded from procurement processes (ME21N). If incorrectly flagged, legitimate
    purchase orders and invoices are blocked.
  valid_values_with_labels:
    X: Marked for deletion at central level
    ? ''
    : "Active \u2014 not marked for deletion"
  fix_map:
    __other__: 'Value ''{invalid_value}'' is not valid. Must be X (marked) or empty (active). In ECC: correct via T-code FK02
      > General Data. In S/4HANA: use Fiori app F3893.'
  record_fix_template: 'Vendor {LFA1.LIFNR}: LOEVM is ''{actual_value}''. Set to X or empty via FK02 / Fiori app F3893.'
- id: AP012
  field: LFA1.SPERR
  check_class: domain_value_check
  allowed_values:
  - X
  - ''
  severity: high
  dimension: validity
  message: Central posting block must be X (blocked) or empty (open)
  why_it_matters: SPERR blocks all financial postings to this vendor at the central level. When set, no invoices can be posted
    via MIRO and no payments can be made via F-53 or F110. This is used for vendors under dispute or compliance review.
  rule_authority: sap_hard_constraint
  sap_impact: All invoice postings (MIRO) and payments (F-53, F110) are blocked. If incorrectly set, legitimate AP processing
    is stopped.
  valid_values_with_labels:
    X: Central posting block active
    ? ''
    : No posting block
  fix_map:
    __other__: 'Value ''{invalid_value}'' is not valid. Must be X (blocked) or empty (open). In ECC: correct via T-code FK02
      > General Data. In S/4HANA: use Fiori app F3893.'
  record_fix_template: 'Vendor {LFA1.LIFNR}: SPERR is ''{actual_value}''. Set to X or empty via FK02 / Fiori app F3893.'
- id: AP013
  field: LFA1.SPERM
  check_class: domain_value_check
  allowed_values:
  - X
  - ''
  severity: high
  dimension: validity
  message: Purchasing block must be X (blocked) or empty (open)
  why_it_matters: SPERM blocks the vendor from being used in purchasing transactions. When set, no new purchase orders can
    be created for this vendor via ME21N. This is used for vendors under review, with quality issues, or pending deactivation.
  rule_authority: sap_hard_constraint
  sap_impact: Purchase order creation (ME21N) is blocked for this vendor. Existing POs remain but no new procurement activity
    is possible.
  valid_values_with_labels:
    X: Purchasing block active
    ? ''
    : No purchasing block
  fix_map:
    __other__: 'Value ''{invalid_value}'' is not valid. Must be X (blocked) or empty (open). In ECC: correct via T-code FK02
      > Purchasing Data. In S/4HANA: use Fiori app F3893.'
  record_fix_template: 'Vendor {LFA1.LIFNR}: SPERM is ''{actual_value}''. Set to X or empty via FK02 / Fiori app F3893.'
- id: AP014
  field: LFB1.AKONT
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Reconciliation account is mandatory \u2014 links AP sub-ledger to the general ledger"
  why_it_matters: AKONT (reconciliation account) is the GL account that receives all vendor postings. Without it, the AP sub-ledger
    cannot be reconciled to the GL and all invoice postings for this vendor will fail with a hard error. This is the single
    most critical field in the vendor company code segment.
  rule_authority: sap_hard_constraint
  sap_impact: All postings to this vendor fail in MIRO and F-53. AP sub-ledger cannot be reconciled. Period-end close for
    AP is blocked until corrected.
  fix_map:
    __blank__: 'In ECC: assign reconciliation account via T-code FK02 > Company Code Data > Account Management. Account must
      be a vendor reconciliation account (MITKZ = K in FS00). In S/4HANA: use Fiori app F3893 > Company Code Data.'
  record_fix_template: 'Vendor {LFA1.LIFNR}: AKONT is {actual_value}. Assign a vendor reconciliation account via FK02 / Fiori
    app F3893.'
- id: AP015
  field: LFB1.FDGRV
  check_class: null_check
  severity: low
  dimension: completeness
  message: "Cash management group missing \u2014 used for liquidity forecasting"
  why_it_matters: FDGRV (cash management group) is used in cash management and liquidity forecasting (FF7A). Without it, vendor
    payment obligations are excluded from cash position reports, reducing forecast accuracy for treasury planning.
  rule_authority: best_practice
  sap_impact: Vendor excluded from cash position reports in FF7A. Liquidity forecasting is incomplete. Treasury planning does
    not account for this vendor's payment obligations.
  fix_map:
    __blank__: 'In ECC: assign the appropriate group via T-code FK02 > Company Code Data > Payment Transactions. In S/4HANA:
      use Fiori app F3893 > Company Code Data.'
  record_fix_template: 'Vendor {LFA1.LIFNR}: FDGRV is {actual_value}. Assign a cash management group via FK02 / Fiori app
    F3893.'
- id: AP016
  field: LFB1.ZTERM
  check_class: null_check
  severity: high
  dimension: completeness
  message: "Payment terms missing \u2014 invoice due date defaults to immediate"
  why_it_matters: "ZTERM (payment terms) determines when an invoice is due and what early payment discounts are available.\
    \ Without payment terms, all invoices default to immediate payment \u2014 the vendor receives no standard payment period\
    \ and the company cannot capture early payment discounts via F110."
  rule_authority: best_practice
  sap_impact: Invoice due date defaults to immediate payment. Early payment discounts (cash discount conditions) are not captured.
    Cash flow forecasting in FF7A is inaccurate.
  fix_map:
    __blank__: 'In ECC: obtain the agreed payment terms from the vendor contract and set via T-code FK02 > Company Code Data
      > Payment Transactions. Common values: 0001 (immediate), ZB30 (30 days net), ZB60 (60 days net). In S/4HANA: use Fiori
      app F3893.'
  record_fix_template: 'Vendor {LFA1.LIFNR}: ZTERM is {actual_value}. Set payment terms via FK02 / Fiori app F3893.'
- id: AP017
  field: LFB1.ZWELS
  check_class: null_check
  severity: high
  dimension: completeness
  message: "Payment methods missing \u2014 automatic payment program cannot process this vendor"
  why_it_matters: ZWELS defines which payment methods (e.g., bank transfer, cheque, direct debit) are allowed for this vendor.
    Without it, the automatic payment program F110 cannot process payments for this vendor and all payments must be made manually.
  rule_authority: best_practice
  sap_impact: Automatic payment program F110 skips this vendor. Payments must be made manually via F-53, increasing processing
    time and error risk.
  fix_map:
    __blank__: 'In ECC: assign payment methods via T-code FK02 > Company Code Data > Payment Transactions. Common values:
      T (bank transfer), C (cheque), E (EFT). In S/4HANA: use Fiori app F3893.'
  record_fix_template: 'Vendor {LFA1.LIFNR}: ZWELS is {actual_value}. Assign payment methods via FK02 / Fiori app F3893.'
- id: AP018
  field: LFBK.BANKS
  check_class: null_check
  severity: high
  dimension: completeness
  message: Bank country is required for vendor bank details
  why_it_matters: BANKS (bank country) is the first of three mandatory bank detail fields (country, bank key, account number).
    Without the bank country, bank validation cannot be performed and the automatic payment program F110 cannot generate payment
    files with correct bank routing information.
  rule_authority: best_practice
  sap_impact: Bank details are incomplete. F110 cannot generate payment files. Manual payments via F-53 require bank details
    to be entered each time.
  fix_map:
    __blank__: 'In ECC: set the bank country via T-code FK02 > General Data > Payment Transactions > Bank Details. In S/4HANA:
      use Fiori app F3893 > Bank Details section.'
  record_fix_template: 'Vendor {LFA1.LIFNR}: BANKS is {actual_value}. Set the bank country via FK02 / Fiori app F3893.'
  applies_when:
    LFB1.ZWELS:
      contains_any:
      - T
      - U
      - E
- id: AP019
  field: LFBK.BANKL
  check_class: null_check
  severity: high
  dimension: completeness
  message: Bank key is required for payment routing
  why_it_matters: BANKL (bank key) identifies the vendor's bank for payment routing. Without it, the automatic payment program
    F110 cannot determine the correct bank for payment file generation. In South Africa, this is the branch code; internationally,
    it is the SWIFT/BIC or local routing number.
  rule_authority: best_practice
  sap_impact: Payment routing fails. F110 cannot generate correct payment files. Bank transfers to this vendor cannot be automated.
  fix_map:
    __blank__: 'In ECC: set the bank key via T-code FK02 > General Data > Payment Transactions > Bank Details. In S/4HANA:
      use Fiori app F3893.'
  record_fix_template: 'Vendor {LFA1.LIFNR}: LFBK.BANKL is missing or invalid. Set the bank key via FK02 / Fiori app F3893.'
  applies_when:
    LFB1.ZWELS:
      contains_any:
      - T
      - U
      - E
- id: AP022
  field: LFA1.TELF1
  check_class: null_check
  severity: low
  dimension: completeness
  message: Telephone number is recommended for vendor communication
  why_it_matters: TELF1 (telephone number) supports vendor communication for invoice queries, delivery issues, and payment
    disputes. Without it, procurement and accounts payable teams cannot contact the vendor efficiently.
  rule_authority: best_practice
  sap_impact: No telephone contact available for vendor queries. Invoice dispute resolution and delivery coordination are
    slower.
  fix_map:
    __blank__: 'In ECC: set the telephone number via T-code FK02 > Address tab > Communication. In S/4HANA: use Fiori app
      F3893 > Address section.'
  record_fix_template: 'Vendor {LFA1.LIFNR}: LFA1.TELF1 is missing or invalid. Set the telephone number via FK02 / Fiori app F3893.'
- id: AP023
  field: LFA1.ERDAT
  check_class: null_check
  severity: low
  dimension: completeness
  message: "Creation date is missing \u2014 audit trail incomplete"
  why_it_matters: ERDAT (creation date) provides the audit trail for when the vendor master was created. Missing creation
    dates make it impossible to determine the age of the record or perform time-based analysis for data governance reviews.
  rule_authority: best_practice
  sap_impact: Audit trail is incomplete. Vendor lifecycle reports cannot determine record age. Data governance reviews lack
    temporal context.
  fix_map:
    __blank__: 'Creation date is typically system-generated and should not be blank. This may indicate a data migration issue.
      In ECC: review the record via T-code FK03 (display vendor). In S/4HANA: check via Fiori app F3893.'
  record_fix_template: 'Vendor {LFA1.LIFNR}: ERDAT is {actual_value}. Review the record creation history via FK03 / Fiori
    app F3893.'
- id: AP024
  field: LFA1.LIFNR
  check_class: cross_field_check
  severity: critical
  dimension: consistency
  message: Vendor with bank country must have complete bank details (bank key + account number)
  why_it_matters: When a vendor has a bank country (BANKS) populated, it indicates that bank details are intended
    to be maintained. However, if the bank key (BANKL) or account number (BANKN) is missing, the bank details are
    incomplete and the automatic payment program F110 will fail to generate payment files for this vendor. All three
    fields must be populated together.
  rule_authority: sap_hard_constraint
  sap_impact: F110 payment file generation fails due to incomplete bank details. Manual intervention required for
    every payment to this vendor. Bank validation routines produce errors.
  fix_map: {__other__: 'Vendor has bank country but incomplete bank details. In ECC: complete all bank fields (BANKS,
      BANKL, BANKN) via T-code FK02 > General Data > Payment Transactions > Bank Details. In S/4HANA: use Fiori
      app F3893 > Bank Details section.'}
  record_fix_template: 'Vendor {LFA1.LIFNR}: bank country is set but bank key or account number is missing. Complete
    all bank details via FK02 / Fiori app F3893.'
  fail_when: '`LFBK.BANKS`.notna() & (`LFBK.BANKL`.isna() | `LFBK.BANKN`.isna())'
- id: AP025
  field: LFA1.LIFNR
  check_class: uniqueness_check
  fields: [LFA1.LIFNR]
  severity: critical
  dimension: uniqueness
  message: Duplicate vendor numbers detected — each vendor must be unique
  why_it_matters: Duplicate vendor numbers violate the primary key constraint. The migration program will reject
    duplicates, and any that slip through cause incorrect AP postings, double payments, and broken vendor reporting.
    This typically indicates a data extraction or consolidation error.
  rule_authority: sap_hard_constraint
  sap_impact: Migration fails on duplicate key insert. Post-migration, duplicate vendors cause double payments,
    incorrect AP aging, and broken vendor reporting.
  fix_map: {__other__: 'Duplicate vendor number detected. Identify the canonical record and merge or deactivate
      the duplicate. In ECC: review both records via T-code FK03 and merge outstanding items. In S/4HANA: use Fiori
      app F3893 to review and BP merge tools to consolidate.'}
  record_fix_template: 'Vendor {LFA1.LIFNR}: duplicate detected. Review and merge via FK03 / Fiori app F3893.'
- id: AP026
  field: LFA1.ADRNR
  check_class: null_check
  severity: low
  dimension: completeness
  message: Address number is missing
  why_it_matters: Address number (LFA1.ADRNR) is not maintained. This field supports downstream processes and reporting accuracy.
    Missing data may result in incomplete records or processing gaps.
  rule_authority: best_practice
  sap_impact: Missing Address number may cause incomplete data in related transactions and reports.
  fix_map:
    __blank__: 'In ECC: Set via FK02/XK02. In S/4HANA: Use Fiori app F3893 (Manage Business Partner).'
  record_fix_template: 'Record is missing LFA1.ADRNR. In ECC: Set via FK02/XK02. In S/4HANA: Use Fiori app F3893 (Manage Business
    Partner).'
- id: AP030
  field: LFB1.REPRF
  check_class: domain_value_check
  severity: low
  dimension: validity
  message: Double invoice check flag has an invalid value
  why_it_matters: Double invoice check flag (LFB1.REPRF) must contain a valid value. Invalid values may cause errors in downstream
    SAP processes and integrations.
  rule_authority: best_practice
  sap_impact: Invalid Double invoice check flag may cause transaction errors or incorrect processing.
  allowed_values:
  - ''
  - X
  valid_values_with_labels:
    ? ''
    : Not set
    X: X
  fix_map:
    __blank__: 'In ECC: Set via FK02/XK02. In S/4HANA: Use Fiori app F3893 (Manage Business Partner).'
    __other__: 'Value {invalid_value} is not valid for Double invoice check flag. Allowed values: ['''', ''X''].'
  record_fix_template: 'Record has invalid LFB1.REPRF value ''{actual_value}''. In ECC: Set via FK02/XK02. In S/4HANA: Use
    Fiori app F3893 (Manage Business Partner).'
- id: AP032
  field: LFB1.XPORE
  check_class: domain_value_check
  severity: low
  dimension: validity
  message: Pay-all-items-separately flag (LFB1.XPORE) has an invalid value
  why_it_matters: Auto payment flag (LFB1.XPORE) must contain a valid value. Invalid values may cause errors in downstream
    SAP processes and integrations.
  rule_authority: best_practice
  sap_impact: Invalid Auto payment flag may cause transaction errors or incorrect processing.
  allowed_values:
  - ''
  - X
  valid_values_with_labels:
    ? ''
    : Not set
    X: X
  fix_map:
    __blank__: 'In ECC: Set via FK02/XK02. In S/4HANA: Use Fiori app F3893 (Manage Business Partner).'
    __other__: 'Value {invalid_value} is not valid for Auto payment flag. Allowed values: ['''', ''X''].'
  record_fix_template: 'Record has invalid LFB1.XPORE value ''{actual_value}''. In ECC: Set via FK02/XK02. In S/4HANA: Use
    Fiori app F3893 (Manage Business Partner).'


- id: AP034
  field: LFA1.STCEG
  check_class: regex_check
  pattern: ^[A-Z]{2}[0-9A-Z]{5,15}$
  severity: high
  dimension: accuracy
  message: Vendor VAT/tax registration number format is invalid — must start with 2-letter country code followed by alphanumeric
    characters
  why_it_matters: Invalid VAT numbers cause tax reporting errors, rejected electronic invoices, and SARS/HMRC compliance failures.
  rule_authority: best_practice
  sap_impact: Tax reporting includes invalid VAT numbers. E-invoicing is rejected by tax authority. VAT reclaim is disallowed.
  fix_map:
    __blank__: Correct the vendor tax number via XK02 > Tax Information tab. Validate against the VIES or SARS database.
  applies_when:
    LFA1.LAND1:
    - AT
    - BE
    - BG
    - CY
    - CZ
    - DE
    - DK
    - EE
    - ES
    - FI
    - FR
    - GR
    - HR
    - HU
    - IE
    - IT
    - LT
    - LU
    - LV
    - MT
    - NL
    - PL
    - PT
    - RO
    - SE
    - SI
    - SK
  record_fix_template: "Vendor {LFA1.LIFNR}: VAT registration number LFA1.STCEG is not valid. Start with the 2-letter country code (e.g. ZA, DE) and correct it in XK02 > Control data."

- id: AP035
  field: LFA1.KTOKK
  check_class: referential_check
  severity: critical
  dimension: consistency
  message: Vendor account group KTOKK must reference a valid entry in T077K
  why_it_matters: 'KTOKK (vendor account group) drives field selection, number range, partner functions and reconciliation
    account for a vendor record. A KTOKK that isn''t in T077Y means the vendor was created bypassing config or the group was
    deleted — the record becomes orphaned: XK02 cannot open it and F110 payment runs skip it. In S/4HANA, CVI migration rejects
    BPs whose vendor role has an unknown KTOKK.'
  rule_authority: best_practice
  sap_impact: Vendor cannot be maintained (XK02), invoiced (MIRO), or paid (F110). Migration conversion rejects the record.
    Account-group reporting shows gaps.
  fix_map:
    __blank__: Assign a valid vendor account group via XK02 > General Data. For new vendors the account group is mandatory
      at FK01 creation.
    __other__: Vendor account group '{invalid_value}' is not defined in T077Y. Reassign via XK02 or configure the missing
      group in SPRO > Financial Accounting > AP/AR > Vendor Accounts > Master Data > Account Groups.
  record_fix_template: 'Vendor {LFA1.LIFNR}: account group ''{actual_value}'' is not in T077Y.'

- id: AP036
  field: LFB1.ZTERM
  check_class: referential_check
  severity: high
  dimension: consistency
  message: Payment terms LFB1.ZTERM must exist in T052
  why_it_matters: ZTERM determines baseline date, cash-discount windows, and net due date for every AP document. An invalid
    ZTERM breaks automatic payment (F110) — the program cannot calculate due date and falls back to immediate, potentially
    triggering overpayments or missed discounts.
  rule_authority: best_practice
  sap_impact: F110 cannot schedule correctly; cash-discount windows missed; payment-timing KPIs degraded.
  fix_map:
    __blank__: Assign the correct payment terms via XK02 > Payment Transactions. Default to negotiated vendor terms; if none,
      use '0003' (Net 30).
    __other__: Payment terms '{invalid_value}' not defined in T052. Reassign via XK02 or create the missing terms in SPRO
      via OBB8.
  record_fix_template: 'Vendor {LFA1.LIFNR}: payment terms ''{actual_value}'' not in T052.'

- id: AP037
  field: LFB1.ZWELS
  check_class: referential_check
  severity: medium
  dimension: consistency
  message: Every payment method in LFB1.ZWELS must exist in T042Z
  why_it_matters: ZLSCH drives which payment-medium program runs for the vendor at F110. An unknown method causes F110 to
    error ('payment method X not defined for country Y') or silently skip the vendor — the payment file (DMEE/PEXR) is not
    generated for that record.
  rule_authority: best_practice
  sap_impact: F110 cannot generate payment medium; vendor excluded from automatic payments; manual F-53 required.
  fix_map:
    __blank__: Assign payment method via XK02 > Payment Transactions. Domestic bank transfer = 'T'; check payment = 'C'.
    __other__: Payment method '{invalid_value}' not defined in T042Z. Reassign via XK02 or configure in FBZP.
  record_fix_template: 'Vendor {LFB1.LIFNR} / company code {LFB1.BUKRS}: payment methods ''{actual_value}'' include a method
    not in T042Z.'
  multi_value: chars

- id: AP038
  field: LFB5.MAHNA
  check_class: referential_check
  severity: low
  dimension: consistency
  message: Dunning procedure LFB5.MAHNA must exist in T047A
  why_it_matters: MAHNA determines the dunning cadence (levels, intervals, texts) for overdue vendor items (typically where
    the vendor is also a customer for netting). An invalid procedure means F150 cannot run dunning for the record.
  rule_authority: best_practice
  sap_impact: F150 excludes the vendor from dunning runs; netted items go undunned.
  fix_map:
    __blank__: Assign a dunning procedure via FK02 > Correspondence (only needed where the vendor is dunned for debit items).
    __other__: Dunning procedure '{invalid_value}' is not defined in T047A. Reassign via FK02 or define it in FBMP.
  record_fix_template: 'Vendor {LFB5.LIFNR} / company code {LFB5.BUKRS}: dunning procedure ''{actual_value}'' not in T047A.'

- id: AP039
  field: LFBK.BANKN
  check_class: null_check
  applies_when:
    LFB1.ZWELS:
      contains_any: [T, U, E]
  severity: critical
  dimension: completeness
  message: Bank account is mandatory for vendors paid by electronic transfer (LFB1.ZWELS contains T, U or E)
  why_it_matters: Payment method T (bank transfer), U (ACH/direct debit), and E (wire) all require a populated vendor
    bank account on LFBK. An invalid or missing BANKN causes F110 to error out ('no bank details for payment method
    X') and blocks the entire payment run for all vendors sharing that run. Check-paid vendors (ZLSCH=C) and other
    non-electronic methods don't need bank details — this rule correctly only applies to electronically-paid records.
  rule_authority: sap_hard_constraint
  sap_impact: F110 automatic-payment run errors; the vendor is excluded from the run, potentially delaying hundreds
    of payments in the same batch.
  fix_map: {__blank__: 'Populate bank details via XK02 > Payment Transactions > Bank Details, or change payment
      method to non-electronic (e.g. ZLSCH=C for check) via the same screen.'}
  record_fix_template: 'Vendor {LFA1.LIFNR} (payment method {LFB1.ZWELS}): bank account BANKN is missing. Add via
    XK02 > Bank Details.'

- id: XREC001
  field: LFB1.AKONT
  check_class: cross_field_check
  grain: LFB1
  fail_when: "`SKB1.MITKZ`.isna() | (`SKB1.MITKZ` != 'K')"
  applies_when:
    LFB1.AKONT: {populated: true}
  severity: critical
  dimension: consistency
  message: Reconciliation account is not a vendor reconciliation account in this company code
  why_it_matters: Every posting to the vendor is mirrored to LFB1.AKONT in the general ledger. SAP checks the
    account type on entry, but loaded or migrated records can point to an account that is missing in the company
    code or is not a vendor reconciliation account (SKB1.MITKZ = 'K'), so the sub-ledger no longer reconciles.
  rule_authority: sap_hard_constraint
  sap_impact: Postings fail or land on the wrong G/L account; the vendor sub-ledger does not reconcile to the G/L.
  fix_map:
    __other__: Set a valid vendor reconciliation account (XK02, company code data; BP in S/4HANA), or correct the
      account's 'reconciliation account for account type' in FS00.
  record_fix_template: 'Vendor company-code record {LFB1.BUKRS}: reconciliation account {LFB1.AKONT} is not a vendor reconciliation account.'
- id: XDUP001
  field: LFA1.STCEG
  check_class: uniqueness_check
  fields:
  - LFA1.STCEG
  - LFB1.BUKRS
  normalize: alnum
  severity: high
  dimension: uniqueness
  message: Several vendors share the same VAT registration number
  why_it_matters: 'Two vendor accounts with one VAT registration number are almost always the same legal entity created twice:
    invoices, payments and spend analytics split across both, duplicate-invoice checks miss cross-account duplicates, and
    a blocked account can be bypassed through the other.'
  rule_authority: best_practice
  sap_impact: Duplicate vendor masters; duplicate payments across accounts; fragmented spend.
  fix_map:
    __other__: Merge the duplicate vendors (block and flag the redundant account for deletion, move open items), or correct
      the VAT number.
  record_fix_template: Record shares LFA1.STCEG with another record.
  grain: LFB1
  applies_when:
    LFB1.LNRZE:
      blank: true
- id: XDUP002
  field: LFA1.STCD1
  check_class: uniqueness_check
  fields:
  - LFA1.STCD1
  - LFB1.BUKRS
  normalize: alnum
  severity: medium
  dimension: uniqueness
  message: Several vendors share the same tax number 1
  why_it_matters: Two vendor accounts with one tax number are almost always the same legal entity created twice.
  rule_authority: best_practice
  sap_impact: Duplicate vendor masters; tax reporting split across accounts.
  fix_map:
    __other__: Merge the duplicate vendors or correct the tax number.
  record_fix_template: Record shares LFA1.STCD1 with another record.
  grain: LFB1
  applies_when:
    LFB1.LNRZE:
      blank: true
- id: XDUP003
  field: LFBK.BANKN
  check_class: uniqueness_check
  fields: [LFBK.BANKS, LFBK.BANKL, LFBK.BANKN]
  grain: LFBK
  severity: high
  dimension: uniqueness
  message: The same bank account is maintained for several vendors
  why_it_matters: >-
    Payments to one bank account from several vendor accounts are either a duplicate vendor or a payment-fraud pattern (a changed bank account pointing to another vendor's or an employee's account). Every occurrence must be explained.
  rule_authority: best_practice
  sap_impact: Payments for different vendors land in one account; classic payment-redirection fraud pattern.
  fix_map:
    __other__: Verify each vendor's bank details with the supplier (call-back to a known number); remove the account from vendors it does not belong to (XK02 / BP).
  record_fix_template: 'Record {LFBK.BANKS} shares LFBK.BANKS, LFBK.BANKL, LFBK.BANKN with another record.'
- id: XLNK001
  field: LFA1.KUNNR
  check_class: cross_field_check
  grain: LFA1
  fail_when: '`KNA1.KUNNR`.isna() | `KNA1.LIFNR`.isna() | (`KNA1.LIFNR` != `LFA1.LIFNR`)'
  applies_when:
    LFA1.KUNNR: {populated: true}
  severity: medium
  dimension: consistency
  message: The vendor's linked customer does not exist or does not link back to this vendor
  why_it_matters: A vendor linked to a customer (LFA1.KUNNR) is offset against it in payment and dunning runs (with
    clearing flags LFB1.XVERR / KNB1.XVERR). A link to a customer that does not exist, or that points to a different
    vendor, makes that clearing act on the wrong account or not at all.
  rule_authority: best_practice
  sap_impact: Vendor/customer clearing in F110 and dunning offsets against the wrong account or silently not at all.
  fix_map:
    __other__: Maintain the link on both sides — customer in the vendor (XK02 > Control) and vendor in the customer
      (XD02 > Control) — or remove it (BP relationship in S/4HANA).
  record_fix_template: 'Vendor {LFA1.LIFNR}: linked customer {LFA1.KUNNR} is missing or links to vendor {KNA1.LIFNR}.'
- id: AP040
  field: LFM1.WAERS
  check_class: null_check
  severity: high
  dimension: completeness
  message: Order currency is missing in the vendor's purchasing-organisation data
  why_it_matters: 'LFM1.WAERS is a required entry of the vendor purchasing view (XK01/MK01; BP role FLVN01 in S/4HANA):
    every purchase order, contract and scheduling agreement for this purchasing organisation takes its currency from it.
    A record without it was loaded around the screen checks (LSMW, direct input, migration).'
  rule_authority: sap_hard_constraint
  sap_impact: ME21N proposes no currency for this vendor; automatic PO creation from requisitions (ME59N) fails for the
    purchasing organisation.
  fix_map:
    __blank__: 'Maintain the order currency in XK02/MK02 > Purchasing data (S/4HANA: BP, role FLVN01, purchasing organisation
      data).'
  record_fix_template: 'Vendor {LFM1.LIFNR}, purchasing organisation {LFM1.EKORG}: order currency is {actual_value}.'
- id: AP041
  field: LFM1.WAERS
  check_class: referential_check
  severity: medium
  dimension: consistency
  message: Vendor order currency LFM1.WAERS must exist in TCURC
  why_it_matters: The order currency is copied into every purchase order for this purchasing organisation. A currency key
    that is not defined in TCURC cannot be converted or posted.
  rule_authority: best_practice
  sap_impact: PO creation stops with an unknown-currency error; no exchange rate can be determined.
  fix_map:
    __other__: Currency '{invalid_value}' is not defined in TCURC. Correct the order currency in XK02/MK02 (BP role FLVN01
      in S/4HANA).
  record_fix_template: 'Vendor {LFM1.LIFNR}, purchasing organisation {LFM1.EKORG}: order currency ''{actual_value}'' is
    not in TCURC.'
- id: AP042
  field: LFM1.ZTERM
  check_class: referential_check
  severity: high
  dimension: consistency
  message: Purchasing payment terms LFM1.ZTERM must exist in T052
  why_it_matters: Purchasing payment terms are copied into every PO and from there into the invoice (MIRO). Terms that are
    not defined in T052 leave the invoice without a baseline date and due date.
  rule_authority: best_practice
  sap_impact: Invoices referencing these POs get no due date; F110 pays them immediately or not at all.
  fix_map:
    __other__: Payment terms '{invalid_value}' are not defined in T052. Correct them in XK02/MK02 or create the terms (OBB8).
  record_fix_template: 'Vendor {LFM1.LIFNR}, purchasing organisation {LFM1.EKORG}: payment terms ''{actual_value}'' not
    in T052.'
- id: AP043
  field: LFM1.INCO1
  check_class: referential_check
  severity: medium
  dimension: consistency
  message: Purchasing Incoterms LFM1.INCO1 must exist in TINC
  why_it_matters: Incoterms default into every purchase order and drive freight conditions, customs data and the transfer
    of risk. A code that is not in TINC cannot be copied into the PO.
  rule_authority: best_practice
  sap_impact: PO creation errors on the Incoterms; freight conditions and foreign-trade data are not determined.
  fix_map:
    __other__: Incoterm '{invalid_value}' is not defined in TINC. Correct it in XK02/MK02 (purchasing data).
  record_fix_template: 'Vendor {LFM1.LIFNR}, purchasing organisation {LFM1.EKORG}: Incoterm ''{actual_value}'' not in TINC.'
- id: AP044
  field: LFM1.INCO2
  check_class: cross_field_check
  fail_when: '`LFM1.INCO2`.notna() & `LFM1.INCO1`.isna()'
  severity: medium
  dimension: consistency
  message: Incoterms location is maintained without an Incoterm
  why_it_matters: INCO2 is the named place of the Incoterm in INCO1. A place without an Incoterm is never copied into the
    purchase order on its own, so the delivery terms the buyer agreed are silently lost.
  rule_authority: best_practice
  sap_impact: POs are created without delivery terms; freight and risk transfer are undefined.
  fix_map:
    __other__: Enter the agreed Incoterm in XK02/MK02 > Purchasing data, or remove the orphaned location.
  record_fix_template: 'Vendor {LFM1.LIFNR}, purchasing organisation {LFM1.EKORG}: Incoterms location ''{LFM1.INCO2}'' has
    no Incoterm.'
- id: AP045
  field: LFM1.EKORG
  check_class: referential_check
  severity: high
  dimension: consistency
  message: Vendor purchasing organisation LFM1.EKORG must exist in T024E
  why_it_matters: Purchasing data can only be used in a purchasing organisation that exists. Data kept for an organisation
    that was removed from the configuration contradicts the organisational structure.
  rule_authority: best_practice
  sap_impact: The vendor's purchasing data is unreachable; source determination and reporting show a non-existent purchasing
    organisation.
  fix_map:
    __other__: Purchasing organisation '{invalid_value}' is not defined in T024E. Delete the obsolete purchasing data or
      re-create the vendor in the right purchasing organisation (MK01).
  record_fix_template: 'Vendor {LFM1.LIFNR}: purchasing organisation ''{actual_value}'' does not exist in T024E.'
- id: AP046
  field: LFM1.EKGRP
  check_class: referential_check
  severity: medium
  dimension: consistency
  message: Vendor purchasing group LFM1.EKGRP must exist in T024
  why_it_matters: The purchasing group in the vendor's purchasing data is the default for automatically created purchase
    orders and the key for buyer-specific output and reporting.
  rule_authority: best_practice
  sap_impact: Automatic PO generation (ME59N, MRP) fails or assigns no buyer; spend analytics by buyer are wrong.
  fix_map:
    __other__: Purchasing group '{invalid_value}' is not defined in T024. Correct it in XK02/MK02 > Purchasing data.
  record_fix_template: 'Vendor {LFM1.LIFNR}, purchasing organisation {LFM1.EKORG}: purchasing group ''{actual_value}'' not
    in T024.'
- id: AP047
  field: LFM1.KALSK
  check_class: referential_check
  severity: medium
  dimension: consistency
  message: Vendor schema group LFM1.KALSK must exist in TMKK
  why_it_matters: The vendor schema group (KALSK) selects the purchasing calculation schema (pricing procedure) in every
    PO. A schema group that is not defined finds no calculation schema.
  rule_authority: best_practice
  sap_impact: PO pricing fails with 'no calculation schema determined'; conditions, freight and discounts are missing.
  fix_map:
    __other__: Schema group '{invalid_value}' is not defined in TMKK. Correct it in XK02/MK02 > Purchasing data.
  record_fix_template: 'Vendor {LFM1.LIFNR}, purchasing organisation {LFM1.EKORG}: schema group ''{actual_value}'' not in
    TMKK.'
- id: AP048
  field: LFM1.SPERM
  check_class: domain_value_check
  allowed_values:
  - ''
  - X
  valid_values_with_labels:
    ? ''
    : No purchasing block in this purchasing organisation
    X: Purchasing blocked in this purchasing organisation
  severity: high
  dimension: validity
  message: Purchasing block at purchasing-organisation level must be X (blocked) or empty (open)
  why_it_matters: 'LFM1.SPERM blocks new purchasing documents for the vendor in one purchasing organisation. Any other value
    is not interpreted by SAP: the block is neither reliably active nor reliably absent.'
  rule_authority: best_practice
  sap_impact: Purchasing documents may be created for a supplier the business meant to block, or blocked for one it did
    not.
  fix_map:
    __other__: Set or clear the block in XK05/MK05 (BP purchasing data in S/4HANA); never write other values by load.
  record_fix_template: 'Vendor {LFM1.LIFNR}, purchasing organisation {LFM1.EKORG}: purchasing block ''{actual_value}'' is
    invalid.'
- id: AP049
  field: LFM1.LOEVM
  check_class: domain_value_check
  allowed_values:
  - ''
  - X
  valid_values_with_labels:
    ? ''
    : Active in this purchasing organisation
    X: Flagged for deletion in this purchasing organisation
  severity: medium
  dimension: validity
  message: Deletion flag at purchasing-organisation level must be X (flagged) or empty
  why_it_matters: The purchasing-level deletion flag stops new documents and queues the data for archiving. A value other
    than X is not recognised as a deletion flag.
  rule_authority: best_practice
  sap_impact: Archiving and purchasing blocks behave unpredictably for this purchasing organisation.
  fix_map:
    __other__: Set or remove the deletion flag in XK06/MK06; never write other values by load.
  record_fix_template: 'Vendor {LFM1.LIFNR}, purchasing organisation {LFM1.EKORG}: deletion flag ''{actual_value}'' is invalid.'
- id: AP050
  field: LFM1.WEBRE
  check_class: domain_value_check
  allowed_values:
  - ''
  - X
  valid_values_with_labels: &id001
    ? ''
    : Not set
    X: Set
  severity: low
  dimension: validity
  message: GR-based invoice verification indicator must be X or empty
  why_it_matters: LFM1.WEBRE is the default for GR-based invoice verification in PO items. Only X switches it on.
  rule_authority: best_practice
  sap_impact: PO items get the wrong invoice-verification control; invoices match against the wrong reference.
  fix_map:
    __other__: Correct the indicator in XK02/MK02 > Purchasing data.
  record_fix_template: 'Vendor {LFM1.LIFNR}, purchasing organisation {LFM1.EKORG}: GR-based IV indicator ''{actual_value}''
    is invalid.'
- id: AP051
  field: LFM1.XERSY
  check_class: domain_value_check
  allowed_values:
  - ''
  - X
  valid_values_with_labels: *id001
  severity: low
  dimension: validity
  message: Evaluated receipt settlement indicator must be X or empty
  why_it_matters: LFM1.XERSY makes the vendor eligible for evaluated receipt settlement (MRRL). Only X switches it on.
  rule_authority: best_practice
  sap_impact: ERS settles goods receipts that should be invoiced by the vendor, or skips those that should be settled.
  fix_map:
    __other__: Correct the ERS indicator in XK02/MK02 > Purchasing data.
  record_fix_template: 'Vendor {LFM1.LIFNR}, purchasing organisation {LFM1.EKORG}: ERS indicator ''{actual_value}'' is invalid.'
- id: AP052
  field: LFB1.BUKRS
  check_class: referential_check
  severity: high
  dimension: consistency
  message: Vendor company code LFB1.BUKRS must exist in T001
  why_it_matters: Vendor company-code data can only be posted in a company code that exists. Data kept for a company code
    that was removed from the configuration contradicts the organisational structure.
  rule_authority: best_practice
  sap_impact: The vendor's company-code data is unreachable; open-item and payment reports show a non-existent company code.
  fix_map:
    __other__: Company code '{invalid_value}' is not defined in T001. Remove the obsolete company-code data.
  record_fix_template: 'Vendor {LFB1.LIFNR}: company code ''{actual_value}'' does not exist in T001.'
- id: AP053
  field: LFB1.SPERR
  check_class: domain_value_check
  allowed_values:
  - ''
  - X
  valid_values_with_labels:
    ? ''
    : No posting block in this company code
    X: Posting blocked in this company code
  severity: high
  dimension: validity
  message: Company-code posting block must be X (blocked) or empty (open)
  why_it_matters: LFB1.SPERR blocks postings to the vendor in one company code. SAP only recognises X; any other value leaves
    the block state undefined.
  rule_authority: best_practice
  sap_impact: Invoices may be posted to a supplier the business meant to block, or rejected for one it did not.
  fix_map:
    __other__: Set or clear the block in XK05/FK05 (BP company-code data in S/4HANA); never write other values by load.
  record_fix_template: 'Vendor {LFB1.LIFNR}, company code {LFB1.BUKRS}: posting block ''{actual_value}'' is invalid.'
- id: AP054
  field: LFB1.LOEVM
  check_class: domain_value_check
  allowed_values:
  - ''
  - X
  valid_values_with_labels:
    ? ''
    : Active in this company code
    X: Flagged for deletion in this company code
  severity: high
  dimension: validity
  message: Company-code deletion flag must be X (flagged) or empty
  why_it_matters: The company-code deletion flag queues the vendor's company-code data for archiving. SAP only recognises
    X.
  rule_authority: best_practice
  sap_impact: Archiving and posting checks behave unpredictably for this company code.
  fix_map:
    __other__: Set or remove the flag in XK06/FK06; never write other values by load.
  record_fix_template: 'Vendor {LFB1.LIFNR}, company code {LFB1.BUKRS}: deletion flag ''{actual_value}'' is invalid.'
- id: AP055
  field: LFB1.ZAHLS
  check_class: referential_check
  severity: high
  dimension: consistency
  message: Vendor payment block LFB1.ZAHLS must exist in T008
  why_it_matters: The payment block key decides whether F110 may pay the vendor's open items. A key that is not defined
    in T008 has no meaning to the payment program.
  rule_authority: best_practice
  sap_impact: 'F110 treats the vendor''s items inconsistently: payments are stopped without a documented reason or are released
    although a block was intended.'
  fix_map:
    __other__: Payment block '{invalid_value}' is not defined in T008. Correct it in XK02/FK02 > Payment transactions.
  record_fix_template: 'Vendor {LFB1.LIFNR}, company code {LFB1.BUKRS}: payment block ''{actual_value}'' not in T008.'
- id: AP056
  field: LFB1.HBKID
  check_class: referential_check
  severity: medium
  dimension: consistency
  message: Vendor house bank LFB1.HBKID must exist in T012
  why_it_matters: The house bank in the vendor master tells F110 which of the company's bank accounts pays this vendor.
    A house bank that is not defined cannot be used for payment.
  rule_authority: best_practice
  sap_impact: F110 cannot select a paying bank for the vendor's items; payment runs leave them as exceptions.
  fix_map:
    __other__: House bank '{invalid_value}' is not defined in T012. Correct it in XK02/FK02 > Payment transactions or remove
      it to let bank determination (FBZP) decide.
  record_fix_template: 'Vendor {LFB1.LIFNR}, company code {LFB1.BUKRS}: house bank ''{actual_value}'' not in T012.'
- id: AP057
  field: LFB1.FDGRV
  check_class: referential_check
  severity: low
  dimension: consistency
  message: Vendor planning group LFB1.FDGRV must exist in T035
  why_it_matters: The planning group places the vendor's open items in cash management and the liquidity forecast. A group
    that is not defined drops the items out of the forecast.
  rule_authority: best_practice
  sap_impact: Cash position and liquidity forecast (FF7A/FF7B) understate outgoing payments.
  fix_map:
    __other__: Planning group '{invalid_value}' is not defined in T035. Correct it in XK02/FK02 > Account management.
  record_fix_template: 'Vendor {LFB1.LIFNR}, company code {LFB1.BUKRS}: planning group ''{actual_value}'' not in T035.'
- id: AP058
  field: LFB1.TOGRU
  check_class: referential_check
  severity: low
  dimension: consistency
  message: Vendor tolerance group LFB1.TOGRU must exist in T043G
  why_it_matters: The tolerance group sets the payment differences SAP accepts when clearing the vendor's items. A group
    that is not defined leaves clearing without tolerances.
  rule_authority: best_practice
  sap_impact: Payment differences cannot be written off automatically; clearing (F-44, F110) stops on small differences.
  fix_map:
    __other__: Tolerance group '{invalid_value}' is not defined in T043G. Correct it in XK02/FK02 > Payment transactions.
  record_fix_template: 'Vendor {LFB1.LIFNR}, company code {LFB1.BUKRS}: tolerance group ''{actual_value}'' not in T043G.'
- id: AP059
  field: LFB1.XVERR
  check_class: cross_field_check
  grain: LFB1
  fail_when: '`LFA1.KUNNR`.isna()'
  applies_when:
    LFB1.XVERR:
    - X
  severity: medium
  dimension: consistency
  message: Clearing with customer is switched on but the vendor is not linked to a customer
  why_it_matters: Offsetting a vendor's payables against the same partner's receivables (F110, dunning) needs both the 'clearing
    with customer' indicator (LFB1.XVERR) and the customer number in the vendor's control data (LFA1.KUNNR). With the indicator
    alone nothing is offset.
  rule_authority: best_practice
  sap_impact: The payment program pays the vendor in full although the partner owes receivables; netting agreed with the
    partner does not happen.
  fix_map:
    __other__: Enter the customer number in XK02 > Control data (BP vendor/customer roles in S/4HANA), or remove the clearing
      indicator if no netting is agreed.
  record_fix_template: 'Vendor {LFB1.LIFNR}, company code {LFB1.BUKRS}: clearing with customer is set but no customer is
    linked.'
- id: AP060
  field: LFB1.LNRZE
  check_class: cross_field_check
  grain: LFB1
  fail_when: '`LFB1.LNRZE` == `LFB1.LIFNR`'
  applies_when:
    LFB1.LNRZE:
      populated: true
  severity: medium
  dimension: consistency
  message: Vendor is entered as its own head office
  why_it_matters: LFB1.LNRZE turns the account into a branch whose items are posted to the head office. A vendor that is
    its own head office is a self-reference with no meaning; it typically arrives by load and breaks the head office/branch
    logic for payment and dunning.
  rule_authority: best_practice
  sap_impact: Branch items are not consolidated at a real head office; payments and dunning run on the branch.
  fix_map:
    __other__: Clear the head office field or enter the real head office account in XK02 > Account management.
  record_fix_template: 'Vendor {LFB1.LIFNR}, company code {LFB1.BUKRS}: head office is the vendor itself.'
- id: AP061
  field: LFB1.LNRZB
  check_class: cross_field_check
  grain: LFB1
  fail_when: '`LFB1.LNRZB` == `LFB1.LIFNR`'
  applies_when:
    LFB1.LNRZB:
      populated: true
  severity: low
  dimension: consistency
  message: Vendor is entered as its own alternative payee in the company code
  why_it_matters: The alternative payee (LFB1.LNRZB) receives payments meant for the vendor. Naming the vendor itself is
    meaningless and usually hides a loading error in which the real payee was lost.
  rule_authority: best_practice
  sap_impact: Payments go to the vendor although a different payee was intended.
  fix_map:
    __other__: Enter the real alternative payee or clear the field in XK02 > Payment transactions.
  record_fix_template: 'Vendor {LFB1.LIFNR}, company code {LFB1.BUKRS}: alternative payee is the vendor itself.'
- id: AP062
  field: LFA1.LNRZA
  check_class: cross_field_check
  fail_when: '`LFA1.LNRZA` == `LFA1.LIFNR`'
  applies_when:
    LFA1.LNRZA:
      populated: true
  severity: low
  dimension: consistency
  message: Vendor is entered as its own alternative payee
  why_it_matters: The alternative payee (LFA1.LNRZA) receives payments meant for the vendor in every company code. Naming
    the vendor itself is meaningless and usually hides a loading error in which the real payee was lost.
  rule_authority: best_practice
  sap_impact: Payments go to the vendor although a different payee was intended.
  fix_map:
    __other__: Enter the real alternative payee or clear the field in XK02 > Payment transactions.
  record_fix_template: 'Vendor {LFA1.LIFNR}: alternative payee is the vendor itself.'
- id: AP063
  field: LFB1.AKONT
  check_class: cross_field_check
  grain: LFB1
  fail_when: (`SKB1.XSPEB` == 'X') | (`SKB1.XLOEB` == 'X')
  applies_when:
    LFB1.AKONT:
      populated: true
  severity: high
  dimension: consistency
  message: Vendor reconciliation account is blocked for posting or flagged for deletion in the company code
  why_it_matters: Every posting to the vendor is also posted to its reconciliation account. When that G/L account is blocked
    for posting (SKB1.XSPEB) or flagged for deletion (SKB1.XLOEB) in the company code, SAP rejects every invoice, credit
    memo and payment for the vendor.
  rule_authority: sap_hard_constraint
  sap_impact: MIRO, FB60 and F110 fail with 'account blocked for posting'; the vendor cannot be invoiced or paid in this
    company code.
  fix_map:
    __other__: Assign an active vendor reconciliation account (XK02, company code data; BP in S/4HANA), or lift the block
      on the G/L account in FS00 if it was set by mistake.
  record_fix_template: 'Vendor {LFB1.LIFNR}, company code {LFB1.BUKRS}: reconciliation account {LFB1.AKONT} is blocked or
    flagged for deletion.'
- id: AP064
  field: LFB5.MANSP
  check_class: referential_check
  severity: low
  dimension: consistency
  message: Vendor dunning block LFB5.MANSP must exist in T040S
  why_it_matters: The dunning block key stops dunning of the vendor's debit balances. A key that is not defined in T040S
    is not recognised by the dunning program.
  rule_authority: best_practice
  sap_impact: Debit balances (overpayments, returns) are dunned or not dunned contrary to the intention.
  fix_map:
    __other__: Dunning block '{invalid_value}' is not defined in T040S. Correct it in XK02/FK02 > Correspondence.
  record_fix_template: 'Vendor {LFB5.LIFNR}, company code {LFB5.BUKRS}: dunning block ''{actual_value}'' not in T040S.'
- id: AP065
  field: LFBK.BANKS
  check_class: referential_check
  grain: LFBK
  severity: high
  dimension: consistency
  message: Vendor bank country LFBK.BANKS must exist in T005
  why_it_matters: The bank country, with the bank key, identifies the vendor's bank. A country that is not in T005 cannot
    be resolved to a bank directory entry or a payment format.
  rule_authority: best_practice
  sap_impact: F110 cannot create the payment medium for this bank account; the vendor is not paid by transfer.
  fix_map:
    __other__: Bank country '{invalid_value}' is not defined in T005. Correct the bank details in XK02 > Payment transactions
      (BP bank details in S/4HANA).
  record_fix_template: 'Vendor {LFBK.LIFNR}: bank country ''{actual_value}'' not in T005.'
- id: AP066
  field: LFBK.KOVON
  check_class: cross_field_check
  grain: LFBK
  fail_when: '`LFBK.KOVON` > `LFBK.KOBIS`'
  require_populated: true
  severity: medium
  dimension: consistency
  message: Bank details validity starts after it ends
  why_it_matters: Bank details are used for payment only inside their validity period (KOVON-KOBIS). A period that ends
    before it starts is never valid, so the bank account is silently unusable.
  rule_authority: best_practice
  sap_impact: F110 finds no valid bank details for the vendor and leaves the items as exceptions.
  fix_map:
    __other__: Correct the validity dates of the bank details in XK02 > Payment transactions (BP bank details in S/4HANA).
  record_fix_template: 'Vendor {LFBK.LIFNR}: bank details valid from {LFBK.KOVON} to {LFBK.KOBIS}.'
- id: AP067
  field: LFA1.LAND1
  check_class: referential_check
  severity: high
  dimension: consistency
  message: Vendor country LFA1.LAND1 must exist in T005
  why_it_matters: The vendor's country drives tax determination, withholding tax, payment methods, address format and foreign-trade
    data. A country key that is not defined in T005 resolves none of them.
  rule_authority: best_practice
  sap_impact: Tax and payment method determination fail; the vendor cannot be paid or reported (EC sales list, withholding
    tax).
  fix_map:
    __other__: Country '{invalid_value}' is not defined in T005. Correct the vendor address in XK02 (BP address in S/4HANA).
  record_fix_template: 'Vendor {LFA1.LIFNR}: country ''{actual_value}'' not in T005.'
- id: AP068
  field: LFA1.REGIO
  check_class: null_check
  applies_when:
    LFA1.LAND1:
    - US
    - CA
    - BR
    - IN
  severity: medium
  dimension: completeness
  message: Region (state/province) is missing for a vendor in a country that requires it
  why_it_matters: 'In the United States, Canada, Brazil and India the region is part of every postal address and the key
    for tax: US/CA jurisdiction codes, Brazilian ICMS by state (UF) and Indian GST by state code are all determined from
    it.'
  rule_authority: best_practice
  sap_impact: Tax jurisdiction / state tax determination fails or uses the wrong rate; payment media and 1099/GST reporting
    carry an incomplete address.
  fix_map:
    __blank__: Maintain the region in XK02 > Address (BP address in S/4HANA).
  record_fix_template: 'Vendor {LFA1.LIFNR}: region is {actual_value} for country {LFA1.LAND1}.'
- id: AP069
  field: LFA1.REGIO
  check_class: referential_check
  severity: medium
  dimension: consistency
  message: Vendor region LFA1.REGIO must exist in T005S
  why_it_matters: Regions are defined per country in T005S. A region code that does not exist cannot drive tax jurisdiction
    or address formatting.
  rule_authority: best_practice
  sap_impact: State-level tax determination and reporting fail for the vendor.
  fix_map:
    __other__: Region '{invalid_value}' is not defined in T005S. Correct the vendor address in XK02 (BP in S/4HANA).
  record_fix_template: 'Vendor {LFA1.LIFNR}: region ''{actual_value}'' not in T005S.'
- id: AP070
  field: LFA1.SPRAS
  check_class: null_check
  severity: low
  dimension: completeness
  message: Vendor language key is missing
  why_it_matters: The language key selects the language of purchase orders, payment advices and dunning letters sent to
    the vendor.
  rule_authority: best_practice
  sap_impact: Output is produced in the logon language or not at all; payment advices and POs may be unreadable for the
    supplier.
  fix_map:
    __blank__: Maintain the language in XK02 > Address > Communication (BP address in S/4HANA).
  record_fix_template: 'Vendor {LFA1.LIFNR}: language key is {actual_value}.'
- id: AP071
  field: LFA1.XCPDK
  check_class: domain_value_check
  allowed_values:
  - ''
  - X
  valid_values_with_labels:
    ? ''
    : Normal account
    X: One-time account
  severity: low
  dimension: validity
  message: One-time account indicator must be X or empty
  why_it_matters: LFA1.XCPDK marks an account whose name, address and bank data are entered per document (BSEC). SAP only
    recognises X; any other value leaves it unclear where the payee data lives.
  rule_authority: best_practice
  sap_impact: Payments to one-time vendors may use master data that does not exist, or ask for document data that is never
    entered.
  fix_map:
    __other__: Correct the indicator via the account group (XK02); one-time vendors must use a one-time account group.
  record_fix_template: 'Vendor {LFA1.LIFNR}: one-time indicator ''{actual_value}'' is invalid.'
- id: AP072
  field: BSIK.AUGBL
  check_class: cross_field_check
  grain: BSIK
  fail_when: '`BSIK.AUGBL`.notna() | `BSIK.AUGDT`.notna()'
  severity: high
  dimension: consistency
  message: Open vendor item carries a clearing document or clearing date
  why_it_matters: BSIK is the secondary index of OPEN vendor items; when an item is cleared SAP moves it to BSAK. An open-item
    row with clearing data means the index and the line item disagree, so the open-item list (FBL1N) and the account balance
    no longer match.
  rule_authority: sap_hard_constraint
  sap_impact: The item can be paid or dunned again although it is cleared, or never shows in FBL1N.
  fix_map:
    __other__: Run the FI comparative analysis (SAPF190) for the company code and fiscal year; if it reports differences,
      raise an SAP incident — secondary indexes are never edited by hand.
  record_fix_template: Open item {BSIK.BUKRS}/{BSIK.LIFNR} document {BSIK.BELNR}/{BSIK.GJAHR} item {BSIK.BUZEI} carries clearing
    data.
- id: AP073
  field: BSIK.DMBTR
  check_class: cross_field_check
  grain: BSIK
  fail_when: (`BSIK.DMBTR` == 0) & (`BSIK.WRBTR` != 0)
  severity: high
  dimension: accuracy
  message: Open vendor item has a document-currency amount but zero in company-code currency
  why_it_matters: Every posted line item is translated into company-code currency. A zero local amount against a non-zero
    document amount means the translation failed (missing exchange rate, manual override), so the item is worth nothing in
    the ledger.
  rule_authority: sap_hard_constraint
  sap_impact: The sub-ledger and G/L balance in local currency understate the item; foreign-currency valuation (FAGL_FCV)
    and payment proposal amounts are wrong.
  fix_map:
    __other__: Check the exchange rate type and rate on the posting date (OB08); reverse and re-post the document with the
      correct translation.
  record_fix_template: 'Open item {BSIK.BUKRS}/{BSIK.LIFNR} document {BSIK.BELNR}/{BSIK.GJAHR} item {BSIK.BUZEI}: amount {BSIK.WRBTR}
    {BSIK.WAERS} translates to 0.'
- id: AP074
  field: BSIK.HKONT
  check_class: cross_field_check
  grain: BSIK
  fail_when: '`BSIK.HKONT`.notna() & `LFB1.AKONT`.notna() & (`BSIK.HKONT` != `LFB1.AKONT`)'
  applies_when:
    BSIK.UMSKZ:
      blank: true
    BSIK.BSTAT:
      not_in:
      - S
  severity: medium
  dimension: consistency
  message: Open vendor item sits on a reconciliation account other than the vendor's current one
  why_it_matters: Normal vendor items post to the reconciliation account in the company-code master (LFB1.AKONT). When that
    account is changed, items posted before keep the old one, so the vendor balance is split across reconciliation accounts
    until they are cleared or reposted.
  rule_authority: best_practice
  sap_impact: Balance-sheet reporting and the sub-ledger/G/L reconciliation (FAGLF03) show the balance under the wrong account;
    regrouping (FAGLF101) uses the wrong account.
  fix_map:
    __other__: 'Either restore the reconciliation account in the vendor master or repost the open items to the new reconciliation
      account (SAP note ''Changing reconciliation account with open items'': program FAGL_MM_RECON / clear and re-post).'
  record_fix_template: Open item {BSIK.BUKRS}/{BSIK.LIFNR} document {BSIK.BELNR}/{BSIK.GJAHR} item {BSIK.BUZEI} is on account
    {BSIK.HKONT}; master says {LFB1.AKONT}.
- id: AP075
  field: LFA1.LOEVM
  check_class: cross_field_check
  grain: BSIK
  fail_when: (`LFA1.LOEVM` == 'X') | (`LFB1.LOEVM` == 'X')
  severity: high
  dimension: consistency
  message: Open item on a vendor flagged for deletion
  why_it_matters: 'A vendor marked for deletion is meant to be finished with. Open items on it are still owed or receivable:
    they will not be archived, are easily overlooked in reviews of active accounts, and payments or dunning may be blocked
    by the deletion flag.'
  rule_authority: best_practice
  sap_impact: Archiving of the vendor fails; outstanding liabilities or receivables sit on a dead account.
  fix_map:
    __other__: Clear or settle the open items, or remove the deletion flag (XK06) until they are settled.
  record_fix_template: 'Open item {BSIK.BUKRS}/{BSIK.LIFNR} document {BSIK.BELNR}/{BSIK.GJAHR} item {BSIK.BUZEI}: the vendor
    is flagged for deletion.'
- id: AP076
  field: BSIK.ZFBDT
  check_class: null_check
  grain: BSIK
  severity: medium
  dimension: completeness
  message: Open vendor item has no baseline date for payment
  why_it_matters: The due date and every cash-discount date are computed from the baseline date. Without it the item has no
    due date.
  rule_authority: sap_hard_constraint
  sap_impact: Payment run (F110) and dunning (F150) cannot schedule the item; ageing reports misplace it.
  fix_map:
    __blank__: Maintain the baseline date on the item (FB02 / FBL1N-FBL5N change line items).
  record_fix_template: Open item {BSIK.BUKRS}/{BSIK.LIFNR} document {BSIK.BELNR}/{BSIK.GJAHR} item {BSIK.BUZEI} has no baseline
    date.
- id: AP077
  field: BSIK.DMBTR
  check_class: cross_field_check
  grain: BSIK
  fail_when: (`BSIK.DMBTR` < 0) | (`BSIK.WRBTR` < 0)
  severity: high
  dimension: validity
  message: Open vendor item stores a negative amount
  why_it_matters: SAP stores line-item amounts unsigned; the debit/credit indicator (SHKZG) carries the sign. A negative stored
    amount double-negates the item in every total.
  rule_authority: sap_hard_constraint
  sap_impact: Balances, payment proposals and ageing net the item the wrong way.
  fix_map:
    __other__: 'The item was written outside the posting logic: raise an SAP incident and reverse / re-post the document.'
  record_fix_template: Open item {BSIK.BUKRS}/{BSIK.LIFNR} document {BSIK.BELNR}/{BSIK.GJAHR} item {BSIK.BUZEI} stores a negative
    amount.
- id: AP078
  field: BSIK.ZBD2T
  check_class: cross_field_check
  grain: BSIK
  fail_when: ((`BSIK.ZBD2T` > 0) & (`BSIK.ZBD2T` < `BSIK.ZBD1T`)) | ((`BSIK.ZBD3T` > 0) & (`BSIK.ZBD3T` < `BSIK.ZBD2T`))
  severity: medium
  dimension: consistency
  message: Open vendor item's payment-term days are out of order
  why_it_matters: 'Cash-discount days 1 < days 2 < net days: each later period must be longer than the one before. Out-of-order
    days make the net due date fall before a discount date.'
  rule_authority: sap_hard_constraint
  sap_impact: Discount is taken after the net due date or the item is paid late; due-date analysis is wrong.
  fix_map:
    __other__: Correct the payment-term days on the item (FB02) or re-apply the payment term.
  record_fix_template: 'Open item {BSIK.BUKRS}/{BSIK.LIFNR} document {BSIK.BELNR}/{BSIK.GJAHR} item {BSIK.BUZEI}: days {BSIK.ZBD1T}
    / {BSIK.ZBD2T} / {BSIK.ZBD3T}.'
- id: AP079
  field: BSIK.ZLSPR
  check_class: referential_check
  grain: BSIK
  severity: medium
  dimension: validity
  message: Open vendor item's payment block reason is not defined (T008)
  why_it_matters: A payment block reason that is not configured cannot be released through the normal workflow and is not
    explained to whoever reviews the block.
  rule_authority: sap_hard_constraint
  sap_impact: The item is excluded from every payment run until someone notices and edits it.
  fix_map:
    __other__: Replace the block reason with one defined in T008 (OB27), or release the block.
  record_fix_template: 'Open item {BSIK.BUKRS}/{BSIK.LIFNR} document {BSIK.BELNR}/{BSIK.GJAHR} item {BSIK.BUZEI}: payment
    block ''{actual_value}'' is not defined.'
- id: AP080
  field: BSIK.UMSKZ
  check_class: referential_check
  grain: BSIK
  severity: medium
  dimension: validity
  message: Open vendor item's special G/L indicator is not defined (T074U)
  why_it_matters: The special G/L indicator decides the alternative reconciliation account (down payments, guarantees, bills
    of exchange). One that is not configured has no account determination.
  rule_authority: sap_hard_constraint
  sap_impact: The item cannot be cleared through the special G/L transactions; balance-sheet classification is wrong.
  fix_map:
    __other__: Configure the indicator (OBYR / T074U) or repost the item without it.
  record_fix_template: 'Open item {BSIK.BUKRS}/{BSIK.LIFNR} document {BSIK.BELNR}/{BSIK.GJAHR} item {BSIK.BUZEI}: special
    G/L indicator ''{actual_value}'' is not defined.'
- id: AP081
  field: BSAK.AUGDT
  check_class: cross_field_check
  grain: BSAK
  fail_when: '`BSAK.AUGDT` < `BSAK.BUDAT`'
  severity: high
  dimension: consistency
  message: Cleared vendor item was cleared before it was posted
  why_it_matters: An item can only be cleared on or after its posting date. A clearing date before the posting date means
    the clearing was back-dated incorrectly or the item data is corrupt.
  rule_authority: sap_hard_constraint
  sap_impact: Key-date open-item lists (as of a date between the two) omit an item that was open; ageing and payment-behaviour
    analysis are wrong.
  fix_map:
    __other__: Reset the clearing (FBRA) and clear again with a valid clearing date.
  record_fix_template: 'Cleared item {BSAK.BUKRS}/{BSAK.LIFNR} document {BSAK.BELNR}/{BSAK.GJAHR} item {BSAK.BUZEI}: cleared
    {BSAK.AUGDT}, posted {BSAK.BUDAT}.'
- id: AP082
  field: BSAK.AUGBL
  check_class: cross_field_check
  grain: BSAK
  fail_when: '`BSAK.AUGBL`.isna() | `BSAK.AUGDT`.isna()'
  severity: high
  dimension: completeness
  message: Cleared vendor item has no clearing document or clearing date
  why_it_matters: BSAK holds CLEARED items only; each carries the clearing document and date. A row without them cannot be
    traced to the payment or clearing that settled it.
  rule_authority: sap_hard_constraint
  sap_impact: 'The item is neither open nor traceably cleared: the audit trail from invoice to payment breaks.'
  fix_map:
    __other__: Run SAPF190 for the company code / year; raise an SAP incident if it reports differences.
  record_fix_template: Cleared item {BSAK.BUKRS}/{BSAK.LIFNR} document {BSAK.BELNR}/{BSAK.GJAHR} item {BSAK.BUZEI} has no
    clearing reference.
- id: AP083
  field: BSIK.XBLNR
  check_class: uniqueness_check
  grain: BSIK
  fields:
  - BSIK.BUKRS
  - BSIK.LIFNR
  - BSIK.XBLNR
  - BSIK.WRBTR
  - BSIK.WAERS
  normalize: alnum
  applies_when:
    BSIK.SHKZG:
    - H
    BSIK.UMSKZ:
      blank: true
  severity: critical
  dimension: uniqueness
  message: 'Possible duplicate vendor invoice: same vendor, reference, amount and currency still open'
  why_it_matters: Two open invoices from one vendor with the same reference and amount are almost always the same invoice
    entered twice. SAP's own duplicate-invoice check compares the reference exactly, so 'INV-1001' and 'INV1001' slip through;
    this check ignores spaces, dashes and punctuation.
  rule_authority: best_practice
  sap_impact: 'Both invoices are paid by the next payment run: a direct cash loss that has to be recovered from the vendor.'
  fix_map:
    __other__: Block both items for payment (FB02, payment block), confirm with the vendor statement, and reverse the duplicate
      (FB08 / MR8M).
  record_fix_template: 'Invoice {BSIK.BELNR}/{BSIK.GJAHR} of vendor {BSIK.LIFNR}: reference {BSIK.XBLNR}, {BSIK.WRBTR} {BSIK.WAERS}
    is open more than once.'
- id: AP084
  field: LFB1.LNRZE
  check_class: exists_check
  target_table: LFA1
  target_fields:
  - LIFNR
  target_when:
    LOEVM:
      blank: true
  severity: high
  dimension: consistency
  message: Head office account does not exist or is flagged for deletion
  why_it_matters: Branch accounts post their open items to the head office account. A head office that is missing or flagged
    for deletion receives postings nobody manages any more.
  rule_authority: sap_hard_constraint
  sap_impact: Payments and dunning for the branch run against a dead account; archiving of the head office fails.
  fix_map:
    __other__: Point the branch to the current head office (XK02 > Company code > Account management), or remove the deletion
      flag.
  record_fix_template: 'Vendor {LFB1.LIFNR} in company code {LFB1.BUKRS}: head office {LFB1.LNRZE} does not exist or is deleted.'
- id: AP085
  field: LFA1.LNRZA
  check_class: exists_check
  target_table: LFA1
  target_fields:
  - LIFNR
  target_when:
    LOEVM:
      blank: true
  severity: high
  dimension: consistency
  message: Alternative payee does not exist or is flagged for deletion
  why_it_matters: The payment run pays the alternative payee instead of the vendor; it must be a live vendor account.
  rule_authority: sap_hard_constraint
  sap_impact: Payments go to an account that should no longer receive money, or the payment run fails.
  fix_map:
    __other__: Maintain a current alternative payee (XK02 > Payment transactions) or remove it.
  record_fix_template: 'Vendor {LFA1.LIFNR}: alternative payee {LFA1.LNRZA} does not exist or is deleted.'
- id: AP086
  field: LFB1.LNRZB
  check_class: exists_check
  target_table: LFA1
  target_fields:
  - LIFNR
  target_when:
    LOEVM:
      blank: true
  severity: high
  dimension: consistency
  message: Company-code alternative payee does not exist or is flagged for deletion
  why_it_matters: The payment run pays the company-code alternative payee instead of the vendor; it must be a live vendor
    account.
  rule_authority: sap_hard_constraint
  sap_impact: Payments go to an account that should no longer receive money, or the payment run fails.
  fix_map:
    __other__: Maintain a current alternative payee (XK02 > Company code > Payment transactions) or remove it.
  record_fix_template: 'Vendor {LFB1.LIFNR} in company code {LFB1.BUKRS}: alternative payee {LFB1.LNRZB} does not exist or
    is deleted.'
- id: AP087
  field: BNKA.SWIFT
  check_class: regex_check
  grain: BNKA
  pattern: ^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$
  severity: high
  dimension: validity
  message: SWIFT/BIC code is not a valid ISO 9362 code
  why_it_matters: A BIC is 4 letters (bank), 2 letters (country), 2 characters (location) and an optional 3-character branch.
    Payment media and SEPA files carry the bank's BIC from the bank directory; a malformed one is rejected by the bank.
  rule_authority: iso_standard
  sap_impact: Foreign and SEPA payments to every vendor of this bank fail in the payment run (F110).
  fix_map:
    __other__: Correct the SWIFT code in the bank directory (FI02) from the bank's own confirmation.
  record_fix_template: 'Bank {BNKA.BANKS}/{BNKA.BANKL}: SWIFT code ''{actual_value}'' is malformed.'
- id: AP088
  field: BNKA.SWIFT
  check_class: cross_field_check
  grain: BNKA
  fail_when: '`BNKA.SWIFT`.notna() & `BNKA.BANKS`.notna() & (`BNKA.SWIFT`.str.slice(4, 6) != `BNKA.BANKS`)'
  severity: medium
  dimension: consistency
  message: SWIFT/BIC country (characters 5-6) differs from the bank's country
  why_it_matters: The BIC's country code identifies the bank's country. A BIC from another country on a bank key usually means
    the BIC of a different bank was copied in.
  rule_authority: iso_standard
  sap_impact: Payments are routed to the wrong bank, or rejected for an inconsistent beneficiary bank.
  fix_map:
    __other__: Check the BIC against the bank's confirmation and correct it in the bank directory (FI02).
  record_fix_template: 'Bank {BNKA.BANKS}/{BNKA.BANKL}: BIC {BNKA.SWIFT} belongs to another country.'
- id: S4-CVI-LFA1
  field: LFA1.LIFNR
  check_class: exists_check
  grain: LFA1
  applies_when:
    LFA1.LOEVM:
      blank: true
  target_table: CVI_VEND_LINK
  target_fields:
  - VENDOR
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: active vendor has no Business Partner link (CVI_VEND_LINK) - simplification item S4TWL Business
    Partner Approach, SAP Note 2265093'
  why_it_matters: In S/4HANA the Business Partner is the only maintenance object for vendors; LFA1 is kept in sync through
    Customer/Vendor Integration. The conversion pre-checks stop the system conversion while an active vendor has no BP
    assigned in CVI_VEND_LINK.
  rule_authority: sap_hard_constraint
  sap_impact: The S/4HANA conversion is blocked until every active vendor is synchronised to a Business Partner (MDS_LOAD_COCKPIT).
  fix_map:
    __other__: Synchronise the vendor to a Business Partner with the CVI synchronisation cockpit (MDS_LOAD_COCKPIT), or flag it
      for deletion if it is no longer used.
  record_fix_template: 'Vendor {LFA1.LIFNR} has no Business Partner in CVI_VEND_LINK.'
- id: AP089
  field: LFB1.REPRF
  check_class: null_check
  applies_when:
    LFA1.XCPDK: {blank: true}
  severity: high
  dimension: completeness
  message: Check for double invoices is not switched on for the vendor
  why_it_matters: >-
    With LFB1.REPRF set, FB60/MIRO warn when an invoice with the same reference, date, amount and
    vendor is entered again. Without it, the system's only preventive duplicate-invoice control is
    off, and duplicates are found only after payment, if at all.
  rule_authority: best_practice
  sap_impact: Duplicate vendor invoices post and get paid by F110 without any warning.
  fix_map:
    __blank__: 'Set "Chk double inv." in XK02 / FK02 > Company code > Payment transactions (S/4: Manage Business Partner Master Data F3163, supplier company code).'
  record_fix_template: 'Vendor {LFB1.LIFNR} in company code {LFB1.BUKRS}: double-invoice check is off.'

- id: AP095
  field: LFBK.BANKN
  check_class: cross_field_check
  grain: LFBK
  fail_when: (`LFA1.XCPDK` == 'X') & (`LFBK.BANKN`.notna() | `LFBK.BANKL`.notna())
  severity: high
  dimension: validity
  message: One-time (CPD) vendor has bank details stored in the master record
  why_it_matters: >-
    A one-time account is shared by many payees, and each document carries its own payee and bank
    data. Bank details stored on the master go to every payee who is not given explicit details,
    which turns the CPD account into a reusable channel for paying an unvetted account.
  rule_authority: sap_hard_constraint
  sap_impact: F110 can pay the stored account for any one-time invoice that lacks document bank data.
  fix_map:
    __other__: Delete the bank rows in XK02 > Payment transactions; enter bank data per document (BSEC) only.
  record_fix_template: 'One-time vendor {LFA1.LIFNR} has stored bank account LFBK.BANKN (bank key LFBK.BANKL).'

- id: AP096
  field: ADR6.SMTP_ADDR
  check_class: uniqueness_check
  grain: LFA1
  case_insensitive: true
  applies_when:
    LFA1.XCPDK: {blank: true}
    LFA1.LOEVM: {blank: true}
  severity: medium
  dimension: uniqueness
  message: E-mail address is shared by more than one vendor
  why_it_matters: >-
    Remittance advices and payment queries go to the vendor's e-mail. Two vendor records with the
    same e-mail are either the same supplier created twice, where invoices can be paid twice, or a
    fictitious vendor that routes correspondence to an existing mailbox.
  rule_authority: best_practice
  sap_impact: Duplicate payments across the two records; payment-advice e-mails can reach the wrong party.
  fix_map:
    __other__: Compare the vendors in XK03 (S/4 F3163); block and merge the duplicate, or correct the address.
  record_fix_template: 'Vendor {LFA1.LIFNR}: e-mail ADR6.SMTP_ADDR is also used by another vendor.'

- id: AP092
  field: BSIK.BELNR
  check_class: cross_field_check
  grain: BSIK
  fail_when: (`LFA1.SPERR` == 'X') | (`LFB1.SPERR` == 'X')
  severity: medium
  dimension: consistency
  message: Vendor is blocked for posting but still has open items
  why_it_matters: >-
    A posting block stops new documents, including payments and clearing. Open items left on a
    blocked vendor can no longer be paid or cleared, so they sit in the liability balance until
    someone unblocks the account. Debit balances on such a vendor are cash that will not be recovered.
  rule_authority: best_practice
  sap_impact: F110 skips the items; open liabilities or debit balances are stranded on the account.
  fix_map:
    __other__: Review open items in FBL1N (S/4 Manage Supplier Line Items F0712); clear or write off, then keep the block, or lift the block (XK05) if the vendor is active.
  record_fix_template: 'Vendor {BSIK.LIFNR} (company code {BSIK.BUKRS}) is posting-blocked with open item {BSIK.BELNR}/{BSIK.GJAHR}.'

- id: AP093
  field: BSIK.BUDAT
  check_class: freshness_check
  max_age_hours: 8760
  applies_when:
    BSIK.SHKZG: [S]
    BSIK.UMSKZ: {blank: true}
  severity: medium
  dimension: timeliness
  message: Vendor debit item (overpayment / credit memo) open for more than 12 months
  why_it_matters: >-
    A debit open item on a vendor is money owed back to the company. After a year without being
    offset or refunded it is unlikely to be recovered, and it still sits in the AP balance and
    understates liabilities.
  rule_authority: best_practice
  sap_impact: AP sub-ledger nets debits against credits; receivables from vendors are not reclassified (F101) and may be lost.
  fix_map:
    __other__: Review in FBL1N (S/4 F0712); offset against invoices (F-44), request a refund, or write off with approval.
  record_fix_template: 'Vendor {BSIK.LIFNR} (company code {BSIK.BUKRS}): debit item {BSIK.BELNR}/{BSIK.GJAHR} posted {BSIK.BUDAT} is still open.'

- id: AP094
  field: BSIK.BUDAT
  check_class: freshness_check
  max_age_hours: 8760
  applies_when:
    BSIK.UMSKZ: [A]
  severity: medium
  dimension: timeliness
  message: Vendor down payment open for more than 12 months
  why_it_matters: >-
    A down payment should be cleared against the final invoice (F-54). One still open after a year
    is either a delivery that never came or an invoice posted without clearing the down payment,
    which risks paying twice.
  rule_authority: best_practice
  sap_impact: Duplicate payment risk; prepayment balance is overstated.
  fix_map:
    __other__: Clear against the final invoice with F-54, or recover the prepayment.
  record_fix_template: 'Vendor {BSIK.LIFNR} (company code {BSIK.BUKRS}): down payment {BSIK.BELNR}/{BSIK.GJAHR} posted {BSIK.BUDAT} is still open.'

- id: AP090
  field: LFA1.XZEMP
  check_class: cross_field_check
  grain: LFA1
  fail_when: '`LFA1.XZEMP` == ''X'''
  applies_when:
    LFA1.XCPDK: {blank: true}
  severity: medium
  dimension: validity
  message: Vendor allows an individual payee to be entered in the document
  why_it_matters: >-
    With this flag, whoever enters the invoice can name any payee and bank account in the document
    itself, bypassing the vendor master and its approval. It is the most common route for
    redirecting a legitimate vendor's payment.
  rule_authority: best_practice
  sap_impact: F110 pays the document-level payee; master-data bank controls and dual control on LFBK do not apply.
  fix_map:
    __other__: Remove "Individual payee in document" in XK02 > Payment transactions unless documented and approved; use permitted alternative payees instead.
  record_fix_template: 'Vendor {LFA1.LIFNR} allows a free payee in documents.'

- id: AP091
  field: LFB1.XVERR
  check_class: cross_field_check
  grain: LFB1
  fail_when: '`LFB1.XVERR`.isna() & `KNA1.KUNNR`.notna()'
  applies_when:
    LFA1.KUNNR: {populated: true}
  severity: low
  dimension: consistency
  message: Vendor is linked to a customer but clearing with the customer is off
  why_it_matters: >-
    The customer link (LFA1.KUNNR) exists so receivables and payables can be offset in the payment
    run. With LFB1.XVERR off, F110 pays the full liability even when the same party owes money,
    which leaves cash out that offset would have kept.
  rule_authority: best_practice
  sap_impact: Payments and dunning do not net the customer balance; working capital lost.
  fix_map:
    __blank__: Set "Clrg with cust." in XK02 > Company code > Payment transactions, or remove the link if offsetting is not wanted.
  record_fix_template: 'Vendor {LFB1.LIFNR} in company code {LFB1.BUKRS} is linked to customer {LFA1.KUNNR} but clearing is off.'
- id: AP200
  field: LFBK.BANKL
  check_class: exists_check
  fields:
  - LFBK.BANKS
  - LFBK.BANKL
  target_table: BNKA
  target_fields:
  - BANKS
  - BANKL
  target_when:
    LOEVM:
      blank: true
  severity: high
  dimension: consistency
  message: Vendor bank key does not exist in the bank directory or the bank is flagged for deletion
  why_it_matters: The payment medium programs read the bank name, address and SWIFT code from the bank directory (BNKA). A
    vendor bank key without a live BNKA entry produces payment files without a routable bank.
  rule_authority: sap_hard_constraint
  sap_impact: The payment run excludes the vendor or the bank rejects the transfer; the vendor is paid late.
  fix_map:
    __other__: Create or reactivate the bank in FI01/FI02, or correct the vendor bank key (XK02 > Payment transactions).
  record_fix_template: 'Vendor {LFBK.LIFNR}: bank {LFBK.BANKS}/LFBK.BANKL is missing from the bank directory or deleted.'
- id: AP201
  field: LFBK.KOINH
  check_class: null_check
  severity: low
  dimension: completeness
  message: Vendor bank account has no account holder name
  why_it_matters: Many countries and banks (SEPA confirmation of payee, UK CoP) match the beneficiary name against the account.
    Without an account holder the payment file carries the vendor name, which often differs from the holder.
  rule_authority: best_practice
  sap_impact: Payments are returned or delayed by name-matching checks at the bank; fraud screening has no holder to compare.
  fix_map:
    __blank__: Maintain the account holder in XK02 > Payment transactions > Bank details.
  record_fix_template: 'Vendor {LFBK.LIFNR}: bank account {LFBK.BANKS}/LFBK.BANKL has no account holder.'
- id: AP202
  field: LFBK.KOBIS
  check_class: freshness_check
  max_age_hours: 0
  severity: medium
  dimension: timeliness
  message: Vendor bank details have expired (valid-to date in the past)
  why_it_matters: Bank details with a validity end date are ignored by the payment run after that date. An expired entry is
    either dead data or a bank change that was never completed.
  rule_authority: best_practice
  sap_impact: The payment run finds no valid bank for the vendor and leaves the items unpaid.
  fix_map:
    __other__: Delete the expired bank details or maintain the replacement account (XK02 > Payment transactions).
  record_fix_template: 'Vendor {LFBK.LIFNR}: bank details {LFBK.BANKS}/LFBK.BANKL expired {age_days} days ago.'
- id: AP203
  field: BSIK.ZFBDT
  check_class: freshness_check
  max_age_hours: 2160
  grain: BSIK
  applies_when:
    BSIK.ZLSPR:
      populated: true
  severity: medium
  dimension: timeliness
  message: Vendor item has been blocked for payment for more than 90 days
  why_it_matters: A payment block is meant to be temporary while a price, quantity or quality issue is resolved. Items that
    stay blocked for months are forgotten disputes that cost early-payment discounts and supplier goodwill.
  rule_authority: best_practice
  sap_impact: Liabilities stay open, discounts are lost and the vendor may put the company on credit hold.
  fix_map:
    __other__: Resolve the dispute and release the item (MRBR for invoice-verification blocks, FB02 otherwise).
  record_fix_template: 'Open item {BSIK.BUKRS}/{BSIK.LIFNR} document {BSIK.BELNR}/{BSIK.GJAHR}: blocked ({BSIK.ZLSPR}) for
    {age_days} days.'
- id: AP204
  field: BSIK.ZFBDT
  check_class: freshness_check
  max_age_hours: 8760
  grain: BSIK
  applies_when:
    BSIK.SHKZG:
    - H
    BSIK.UMSKZ:
      blank: true
  severity: medium
  dimension: timeliness
  message: Vendor invoice has been open for more than a year
  why_it_matters: An invoice still open a year after its baseline date was either paid outside SAP, disputed and forgotten,
    or is a duplicate. Auditors test these items for unrecorded settlements and stale accruals.
  rule_authority: best_practice
  sap_impact: Overstated liabilities, uncleared GR/IR side effects, and risk of paying a very old invoice twice.
  fix_map:
    __other__: Confirm the item against the vendor statement, then clear it (F-44) or reverse it.
  record_fix_template: 'Open item {BSIK.BUKRS}/{BSIK.LIFNR} document {BSIK.BELNR}/{BSIK.GJAHR}: open for {age_days} days.'
- id: AP205
  field: BSIK.XBLNR
  check_class: null_check
  grain: BSIK
  applies_when:
    BSIK.SHKZG:
    - H
    BSIK.UMSKZ:
      blank: true
  severity: medium
  dimension: completeness
  message: Open vendor invoice has no reference (vendor invoice number)
  why_it_matters: SAP's duplicate invoice check (and Meridian's AP083) compares the reference. An invoice without a reference
    cannot be checked for duplicates and cannot be matched to the vendor statement.
  rule_authority: best_practice
  sap_impact: Duplicate invoices go undetected and are paid twice.
  fix_map:
    __blank__: Enter the vendor's invoice number as reference (FB02) and make XBLNR required for vendor invoice document types
      (OBA7).
  record_fix_template: 'Open item {BSIK.BUKRS}/{BSIK.LIFNR} document {BSIK.BELNR}/{BSIK.GJAHR}: no invoice reference.'
- id: AP206
  field: BSIK.WRBTR
  check_class: cross_field_check
  grain: BSIK
  fail_when: (`BSIK.WRBTR` == 0) & (`BSIK.DMBTR` == 0)
  severity: low
  dimension: validity
  message: Open vendor item has a zero amount
  why_it_matters: A zero line item settles nothing. It is typically left over from a reversed or split posting and clutters
    open item lists and the payment proposal.
  rule_authority: best_practice
  sap_impact: Open item lists and ageing reports carry dead lines; the payment run proposes zero payments.
  fix_map:
    __other__: Clear the zero item against itself (F-44) or with the related document.
  record_fix_template: 'Open item {BSIK.BUKRS}/{BSIK.LIFNR} document {BSIK.BELNR}/{BSIK.GJAHR}: zero amount.'
- id: AP207
  field: LFB1.LOEVM
  check_class: cross_field_check
  fail_when: (`LFB1.LOEVM` == 'X') & `LFB1.SPERR`.isna()
  severity: medium
  dimension: consistency
  message: Vendor company code is flagged for deletion but not blocked for posting
  why_it_matters: The deletion flag only marks the account for archiving. Without a posting block, invoices and payments can
    still be posted to a vendor the business has retired.
  rule_authority: best_practice
  sap_impact: Postings and payments to retired vendors; archiving fails because new documents keep appearing.
  fix_map:
    __other__: Set the company-code posting block (XK05) together with the deletion flag.
  record_fix_template: 'Vendor {LFB1.LIFNR} in company code {LFB1.BUKRS}: flagged for deletion but not blocked for posting.'
- id: AP208
  field: LFM1.LOEVM
  check_class: cross_field_check
  fail_when: (`LFM1.LOEVM` == 'X') & `LFM1.SPERM`.isna()
  severity: medium
  dimension: consistency
  message: Vendor purchasing organisation is flagged for deletion but not blocked for purchasing
  why_it_matters: Purchase orders are only stopped by the purchasing block. A deleted purchasing view without the block still
    accepts new orders.
  rule_authority: best_practice
  sap_impact: New purchase orders can be issued to a vendor the business has retired.
  fix_map:
    __other__: Set the purchasing block for the purchasing organisation (XK05) together with the deletion flag.
  record_fix_template: 'Vendor {LFM1.LIFNR} in purchasing organisation {LFM1.EKORG}: flagged for deletion but not blocked.'
- id: AP209
  field: BSIK.WRBTR
  check_class: uniqueness_check
  grain: BSIK
  fields:
  - BSIK.BUKRS
  - BSIK.LIFNR
  - BSIK.WRBTR
  - BSIK.WAERS
  - BSIK.ZFBDT
  applies_when:
    BSIK.SHKZG:
    - H
    BSIK.UMSKZ:
      blank: true
  severity: medium
  dimension: uniqueness
  message: 'Possible duplicate vendor invoice: same vendor, amount, currency and baseline date still open'
  why_it_matters: Duplicate invoices are often entered with a slightly different reference (a typo, a prefix, a credit note
    number), which defeats reference-based checks. Same vendor, amount and baseline date is the classic second test used in
    duplicate-payment audits.
  rule_authority: best_practice
  sap_impact: Both invoices are paid by the next payment run.
  fix_map:
    __other__: Compare the items with the vendor statement; block and reverse the duplicate (FB08 / MR8M).
  record_fix_template: 'Invoice {BSIK.BELNR}/{BSIK.GJAHR} of vendor {BSIK.LIFNR}: {BSIK.WRBTR} {BSIK.WAERS} with baseline
    {BSIK.ZFBDT} is open more than once.'
- id: AP210
  field: LFB1.QLAND
  check_class: cross_field_check
  fail_when: '`LFB1.QSSKZ`.notna() & `LFB1.QLAND`.isna()'
  severity: medium
  dimension: completeness
  message: Vendor has a withholding tax code but no withholding tax country
  why_it_matters: Classic withholding tax determines the tax rate and reporting from the code together with the withholding
    tax country. A code without a country cannot be evaluated by the withholding tax report (RFKQSU20).
  rule_authority: best_practice
  sap_impact: Withholding tax is not deducted or not reported to the tax authority.
  fix_map:
    __other__: Maintain the withholding tax country in XK02 > Company code > Withholding tax, or remove the code.
  record_fix_template: 'Vendor {LFB1.LIFNR} in company code {LFB1.BUKRS}: withholding tax code {LFB1.QSSKZ} without country.'
- id: AP211
  field: LFB5.MAHNA
  check_class: cross_field_check
  fail_when: '`LFB5.MANSP`.notna() & `LFB5.MAHNA`.isna()'
  severity: low
  dimension: consistency
  message: Vendor dunning block is set without a dunning procedure
  why_it_matters: A dunning block only means something together with a dunning procedure. A block on a vendor that is never
    dunned points to incomplete or copied dunning data.
  rule_authority: best_practice
  sap_impact: Debit balances on the vendor are not dunned and the block hides that the dunning data was never set up.
  fix_map:
    __other__: Maintain the dunning procedure or remove the dunning block (XK02 > Company code > Correspondence).
  record_fix_template: 'Vendor {LFB5.LIFNR} in company code {LFB5.BUKRS}: dunning block {LFB5.MANSP} without procedure.'
- id: S4-CVI-KNVK-VEND
  field: KNVK.PARNR
  check_class: exists_check
  grain: KNVK
  applies_when:
    KNVK.LIFNR:
      populated: true
    LFA1.LOEVM:
      blank: true
  target_table: CVI_VEND_CT_LINK
  target_fields:
  - VENDOR_CONT
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: contact person of an active vendor has no Business Partner relationship (CVI_VEND_CT_LINK) - simplification item S4TWL Business Partner Approach, SAP Note 2265093'
  why_it_matters: In S/4HANA contact persons are Business Partners in a contact-person relationship with the vendor's Business
    Partner. Customer/Vendor Integration converts KNVK contacts and records the link in CVI_VEND_CT_LINK; a contact without the link is
    not carried over.
  rule_authority: sap_hard_constraint
  sap_impact: The contact person is lost or must be recreated by hand after the S/4HANA conversion; the CVI pre-checks report
    the vendor as not fully synchronised.
  fix_map:
    __other__: Activate contact-person synchronisation for the vendor direction in CVI customizing and synchronise the vendor
      with MDS_LOAD_COCKPIT, or delete the obsolete contact.
  record_fix_template: 'Contact person {KNVK.PARNR} of vendor {KNVK.LIFNR} has no Business Partner relationship in CVI_VEND_CT_LINK.'
- id: S4-CVI-KTOKK-NUM
  field: LFA1.KTOKK
  check_class: exists_check
  grain: LFA1
  applies_when:
    LFA1.LOEVM:
      blank: true
  target_table: CVIC_VEND_TO_BP1
  target_fields:
  - ACCOUNT_GROUP
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: account group of an active vendor has no Business Partner grouping (number assignment) assigned in CVI customizing (CVIC_VEND_TO_BP1) - simplification item S4TWL Business Partner Approach, SAP Note 2265093'
  why_it_matters: Customer/Vendor Integration derives each vendor's Business Partner from its account group. Without an
    entry in CVIC_VEND_TO_BP1 for the account group, the synchronisation cannot create a Business Partner number and the vendor cannot be converted.
  rule_authority: sap_hard_constraint
  sap_impact: The CVI synchronisation of every vendor in this account group fails, which blocks the S/4HANA conversion.
  fix_map:
    __other__: Assign a Business Partner grouping (number assignment) to the account group in CVI customizing (SPRO > Cross-Application Components > Master Data Synchronization > Customer/Vendor Integration > Business Partner Settings > Settings for Vendor Integration) before synchronising.
  record_fix_template: 'Vendor {LFA1.LIFNR}: account group {LFA1.KTOKK} has no Business Partner grouping (number assignment) in CVIC_VEND_TO_BP1.'
- id: S4-CVI-KTOKK-ROLE
  field: LFA1.KTOKK
  check_class: exists_check
  grain: LFA1
  applies_when:
    LFA1.LOEVM:
      blank: true
  target_table: CVIC_VEND_TO_BP2
  target_fields:
  - ACCOUNT_GROUP
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: account group of an active vendor has no Business Partner role assigned in CVI customizing (CVIC_VEND_TO_BP2) - simplification item S4TWL Business Partner Approach, SAP Note 2265093'
  why_it_matters: Customer/Vendor Integration derives each vendor's Business Partner from its account group. Without an
    entry in CVIC_VEND_TO_BP2 for the account group, the synchronisation cannot create the Business Partner in its role and the vendor cannot be converted.
  rule_authority: sap_hard_constraint
  sap_impact: The CVI synchronisation of every vendor in this account group fails, which blocks the S/4HANA conversion.
  fix_map:
    __other__: Assign a Business Partner role to the account group in CVI customizing (SPRO > Cross-Application Components > Master Data Synchronization > Customer/Vendor Integration > Business Partner Settings > Settings for Vendor Integration) before synchronising.
  record_fix_template: 'Vendor {LFA1.LIFNR}: account group {LFA1.KTOKK} has no Business Partner role in CVIC_VEND_TO_BP2.'
# --- Vendor master depth pass (AP212 onward): general data (LFA1) ---------------------------------------------
- id: AP212
  field: LFA1.BRSCH
  check_class: exists_check
  grain: LFA1
  fields: [LFA1.BRSCH]
  target_table: T016
  target_fields: [BRSCH]
  severity: medium
  dimension: validity
  message: Vendor industry key is not defined in T016
  why_it_matters: The industry key (LFA1.BRSCH) groups vendors for spend analysis, supplier evaluation and statutory
    reporting by sector. A key that is not in T016 was loaded around the XK01 check and drops the vendor out of every
    industry selection.
  rule_authority: sap_hard_constraint
  sap_impact: The vendor is missing from industry-based reports and selections (S_ALR_87012086, LIS, spend cubes); XK02 refuses
    to save the record until the key is corrected.
  fix_map:
    __other__: Correct the industry in XK02 > Control data, or define the industry key in customizing (OB01 / SPRO > Logistics
      General > Business Partner > Industries).
  record_fix_template: 'Vendor {LFA1.LIFNR}: industry key {LFA1.BRSCH} is not defined in T016.'
- id: AP213
  field: LFA1.VBUND
  check_class: exists_check
  grain: LFA1
  fields: [LFA1.VBUND]
  target_table: T880
  target_fields: [RCOMP]
  severity: high
  dimension: validity
  message: Vendor trading partner is not a company defined in T880
  why_it_matters: The trading partner (LFA1.VBUND) is copied into every payable posted to the vendor and is the key for
    intercompany elimination in consolidation. A trading partner that is not a company in T880 cannot be matched to the
    other side of the intercompany relationship.
  rule_authority: sap_hard_constraint
  sap_impact: Intercompany payables carry an unknown partner; reconciliation (F.2A/F.2B, FBICR) and consolidation elimination
    fail or leave differences.
  fix_map:
    __other__: Enter the company ID of the affiliated company in XK02 > Control data, or create the company in OX15 (T880).
  record_fix_template: 'Vendor {LFA1.LIFNR}: trading partner {LFA1.VBUND} is not defined in T880.'
- id: AP214
  field: LFA1.WERKS
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Plant assigned to the vendor (LFA1.WERKS) must exist in T001W
  why_it_matters: A plant on the vendor master marks the vendor as an internal plant supplier for stock transport orders
    and intercompany deliveries. A plant that does not exist breaks the link between the supplying plant and its vendor
    account.
  rule_authority: sap_hard_constraint
  sap_impact: Stock transport orders and cross-company deliveries cannot determine the supplying plant; intercompany billing
    and invoice receipt (EDI) fail.
  fix_map:
    __other__: Plant '{invalid_value}' is not defined in T001W. Correct the plant in XK02 > Control data or remove it.
  record_fix_template: 'Vendor {LFA1.LIFNR}: plant ''{actual_value}'' not in T001W.'
- id: AP215
  field: LFA1.FISKN
  check_class: exists_check
  grain: LFA1
  fields: [LFA1.FISKN]
  target_table: LFA1
  target_fields: [LIFNR]
  severity: medium
  dimension: consistency
  message: Vendor's fiscal address account (LFA1.FISKN) does not exist
  why_it_matters: The fiscal address account holds the tax address used for this vendor in tax reporting and withholding
    tax. A reference to a vendor that does not exist leaves the tax address undefined.
  rule_authority: sap_hard_constraint
  sap_impact: Withholding tax and tax reports read the tax address from a missing account; returns show wrong or empty
    address data.
  fix_map:
    __other__: Enter an existing vendor as account with tax authority in XK02 > Control data, or remove the reference.
  record_fix_template: 'Vendor {LFA1.LIFNR}: fiscal address account {LFA1.FISKN} does not exist.'
- id: AP216
  field: LFA1.KTOKK
  check_class: exists_check
  grain: LFA1
  fields: [LFA1.KTOKK]
  applies_when:
    LFA1.XCPDK: [X]
  target_table: T077K
  target_fields: [KTOKK]
  target_when:
    XCPDS: [X]
  severity: high
  dimension: consistency
  message: Vendor is flagged as one-time vendor but its account group is not a one-time account group
  why_it_matters: SAP sets the one-time indicator (LFA1.XCPDK) from the account group (T077K.XCPDS) when the vendor is
    created. A one-time flag on a normal account group comes from a direct load or table change; the vendor then expects
    the name, address and bank details in each document while its account group treats it as a regular vendor.
  rule_authority: sap_hard_constraint
  sap_impact: Postings to the vendor ask for one-time data that the number range and field status do not support; payments
    run against document-level bank details that are never maintained.
  fix_map:
    __other__: Move the vendor to a one-time account group (XK07) or create a regular vendor and block this one (XK05).
  record_fix_template: 'Vendor {LFA1.LIFNR}: one-time flag set, but account group {LFA1.KTOKK} is not a one-time group.'
- id: AP217
  field: LFA1.KTOKK
  check_class: exists_check
  grain: LFA1
  fields: [LFA1.KTOKK]
  negate: true
  applies_when:
    LFA1.XCPDK:
      blank: true
  target_table: T077K
  target_fields: [KTOKK]
  target_when:
    XCPDS: [X]
  severity: high
  dimension: consistency
  message: Vendor in a one-time account group is not flagged as one-time vendor
  why_it_matters: A vendor in a one-time account group is a collective account for many payees. Without the one-time flag
    (LFA1.XCPDK) the documents do not ask for the individual payee's name, address and bank details, so all one-time
    payments land on the collective account's own data.
  rule_authority: sap_hard_constraint
  sap_impact: Invoices on the collective account carry no payee data; the payment program pays every one-time payee to the
    same (or no) bank account.
  fix_map:
    __other__: Correct the one-time indicator so it matches the account group (XK07 to change the group if the vendor is
      a real vendor).
  record_fix_template: 'Vendor {LFA1.LIFNR}: account group {LFA1.KTOKK} is a one-time group, but the vendor is not flagged
    as one-time.'
- id: AP218
  field: LFA1.LNRZA
  check_class: exists_check
  grain: LFA1
  fields: [LFA1.LNRZA]
  target_table: LFBK
  target_fields: [LIFNR]
  severity: high
  dimension: completeness
  message: Alternative payee of the vendor has no bank details
  why_it_matters: When an alternative payee (LFA1.LNRZA) is set, the payment program pays to the payee's bank details, not
    the vendor's. A payee without bank details cannot receive a bank transfer.
  rule_authority: sap_hard_constraint
  sap_impact: F110 lists the vendor's items as exceptions (no bank details for the payee) and nothing is paid by transfer.
  fix_map:
    __other__: Maintain bank details on the alternative payee account (XK02 > Payment transactions) or remove the alternative
      payee from the vendor.
  record_fix_template: 'Vendor {LFA1.LIFNR}: alternative payee {LFA1.LNRZA} has no bank details.'
- id: AP219
  field: LFA1.LNRZA
  check_class: exists_check
  grain: LFA1
  fields: [LFA1.LNRZA]
  target_table: LFA1
  target_fields: [LIFNR]
  target_when:
    LOEVM:
      blank: true
    SPERR:
      blank: true
  severity: high
  dimension: consistency
  message: Alternative payee of the vendor is flagged for deletion or blocked for posting
  why_it_matters: Payments for the vendor are made to the alternative payee. If that account is flagged for deletion or
    posting-blocked, the payment program cannot pay the vendor although the vendor itself is active.
  rule_authority: best_practice
  sap_impact: The vendor's open items are not paid in F110 and appear in the exception list; late-payment charges follow.
  fix_map:
    __other__: Assign an active alternative payee in XK02 > Payment transactions, or remove the deletion flag or block from
      the payee if it is still in use (XK06 / XK05).
  record_fix_template: 'Vendor {LFA1.LIFNR}: alternative payee {LFA1.LNRZA} is flagged for deletion or posting-blocked.'
- id: AP220
  field: LFA1.NODEL
  check_class: cross_field_check
  grain: LFA1
  fail_when: (`LFA1.NODEL` == 'X') & (`LFA1.LOEVM` == 'X')
  severity: medium
  dimension: consistency
  message: Vendor has a central deletion block and a central deletion flag at the same time
  why_it_matters: The deletion block (LFA1.NODEL) says the vendor must never be archived; the deletion flag (LFA1.LOEVM)
    says it is to be archived. Both together come from a direct table change and leave the vendor's status undefined.
  rule_authority: sap_hard_constraint
  sap_impact: Archiving (FI_ACCPAYB) skips the vendor; users see a vendor flagged for deletion that can never be removed.
  fix_map:
    __other__: Decide the vendor's status and remove either the deletion block or the deletion flag (XK06).
  record_fix_template: 'Vendor {LFA1.LIFNR}: deletion block and deletion flag are both set.'
- id: AP221
  field: LFA1.LOEVM
  check_class: cross_field_check
  grain: LFA1
  fail_when: (`LFA1.LOEVM` == 'X') & (`LFA1.SPERR`.isna() | `LFA1.SPERM`.isna())
  severity: high
  dimension: consistency
  message: Vendor is flagged for deletion centrally but not blocked for posting and purchasing
  why_it_matters: The deletion flag only marks the vendor for archiving; it does not stop postings or purchase orders.
    A vendor that is to be removed must also carry the central posting block (SPERR) and purchasing block (SPERM), or
    invoices and orders keep arriving on it.
  rule_authority: best_practice
  sap_impact: Invoices, payments and purchase orders can still be created for a vendor that the business considers closed;
    archiving fails because new documents keep appearing.
  fix_map:
    __other__: Set the central posting and purchasing blocks in XK05 together with the deletion flag (XK06).
  record_fix_template: 'Vendor {LFA1.LIFNR}: flagged for deletion but posting block {LFA1.SPERR} / purchasing block {LFA1.SPERM}.'
- id: AP222
  field: LFA1.ORT01
  check_class: null_check
  severity: high
  dimension: completeness
  message: Vendor city is missing
  why_it_matters: The city is a required entry of the vendor address in XK01. It is printed on payment advices, cheques
    and purchase orders and is used for duplicate checks and tax jurisdiction. A vendor without a city was created around
    the address checks.
  rule_authority: sap_hard_constraint
  sap_impact: Payment media and cheques cannot be addressed; duplicate checks on name and city miss the vendor; withholding
    tax returns are incomplete.
  fix_map:
    __blank__: Maintain the city in XK02 > Address.
  record_fix_template: 'Vendor {LFA1.LIFNR}: city is missing.'
- id: AP223
  field: LFA1.STRAS
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Vendor street address is missing
  why_it_matters: The street and house number are needed for cheque payments, payment advices sent by post, withholding
    tax certificates and supplier due diligence. A vendor with a city but no street cannot be reached by post.
  rule_authority: best_practice
  sap_impact: Cheques and payment advices are returned; withholding tax certificates and 1099/annual returns carry an
    incomplete address.
  fix_map:
    __blank__: Maintain street and house number in XK02 > Address (or a PO box with its postal code).
  record_fix_template: 'Vendor {LFA1.LIFNR}: street address is missing.'
- id: AP224
  field: LFA1.PSTL2
  check_class: cross_field_check
  grain: LFA1
  fail_when: '`LFA1.PFACH`.notna() & `LFA1.PSTL2`.isna()'
  severity: low
  dimension: completeness
  message: Vendor has a PO box but no PO box postal code
  why_it_matters: Mail to a PO box goes to the PO box postal code, which usually differs from the street postal code. A PO
    box without its own postal code makes payment advices and correspondence undeliverable.
  rule_authority: best_practice
  sap_impact: Payment advices and dunning letters printed with the PO box use the wrong postal code and are returned.
  fix_map:
    __other__: Maintain the PO box postal code in XK02 > Address, or remove the PO box if it is no longer used.
  record_fix_template: 'Vendor {LFA1.LIFNR}: PO box is maintained without a PO box postal code.'
- id: AP225
  field: LFA1.ADRNR
  check_class: exists_check
  grain: LFA1
  fields: [LFA1.ADRNR]
  target_table: ADRC
  target_fields: [ADDRNUMBER]
  severity: high
  dimension: consistency
  message: Vendor address number has no address record in ADRC
  why_it_matters: Since central address management the vendor's address lives in ADRC under the address number LFA1.ADRNR;
    the LFA1 address fields are only a copy. An address number without an ADRC record is an orphan left by a direct load or
    an incomplete client copy.
  rule_authority: sap_hard_constraint
  sap_impact: XK03 shows no address; output (purchase orders, payment advices) has no address; CVI cannot create the
    Business Partner address in S/4HANA.
  fix_map:
    __other__: Re-save the vendor address in XK02 so that the address is written to ADRC, or repair the address with report
      RSADRCK1/RSADRCK2.
  record_fix_template: 'Vendor {LFA1.LIFNR}: address number LFA1.ADRNR has no ADRC record.'
- id: AP226
  field: LFA1.LAND1
  check_class: cross_field_check
  grain: LFA1
  applies_when:
    ADRC.NATION:
      blank: true
  fail_when: '((`ADRC.COUNTRY` != `LFA1.LAND1`) | (`ADRC.CITY1` != `LFA1.ORT01`) | (`ADRC.POST_CODE1`
    != `LFA1.PSTLZ`))'
  severity: medium
  dimension: consistency
  message: Vendor address in LFA1 differs from its central address in ADRC
  why_it_matters: XK01 and XK02 write the address to ADRC and copy country, city and postal code into LFA1. A difference
    means one of the two was changed directly. Reports, payment media and tax functions read LFA1 while forms and the
    Business Partner read ADRC, so the vendor has two addresses.
  rule_authority: sap_hard_constraint
  sap_impact: Payment media and tax returns (LFA1) show a different address than purchase orders and correspondence (ADRC);
    the S/4HANA Business Partner takes the ADRC version.
  fix_map:
    __other__: Check the correct address with the supplier and re-save it in XK02 so both tables are aligned.
  record_fix_template: 'Vendor {LFA1.LIFNR}: country, city or postal code in LFA1 differs from address LFA1.ADRNR in ADRC.'
- id: AP227
  field: LFA1.STCEG
  check_class: cross_field_check
  grain: LFA1
  applies_when:
    LFA1.LAND1: [AT, BE, BG, CY, CZ, DE, DK, EE, ES, FI, FR, GR, HR, HU, IE, IT, LT, LU, LV, MT, NL, PL, PT, RO, SE, SI, SK]
  fail_when: (`LFA1.STKZU` == 'X') & `LFA1.STCEG`.isna()
  severity: high
  dimension: completeness
  message: EU vendor is flagged as liable for VAT but has no VAT registration number
  why_it_matters: An EU vendor that is liable for VAT (LFA1.STKZU) must have a VAT registration number for intra-community
    acquisitions, reverse-charge invoices and the EC sales list. Without it the reverse-charge treatment cannot be proven.
  rule_authority: regulatory
  sap_impact: Intra-community acquisitions cannot be reported with the supplier's VAT number; input tax on reverse-charge
    invoices can be disallowed on audit.
  fix_map:
    __other__: Obtain and verify the VAT number (VIES) and maintain it in XK02 > Control data, or remove the VAT liability flag.
  record_fix_template: 'Vendor {LFA1.LIFNR} ({LFA1.LAND1}): liable for VAT but no VAT registration number.'
- id: AP228
  field: LFAS.STCEG
  check_class: cross_field_check
  grain: LFAS
  fail_when: (`LFAS.STCEG`.str.slice(0, 2).str.upper() != `LFAS.LAND1`) & ~((`LFAS.LAND1` == 'GR') & (`LFAS.STCEG`.str.slice(0,
    2).str.upper() == 'EL')) & ~((`LFAS.LAND1` == 'GB') & (`LFAS.STCEG`.str.slice(0, 2).str.upper() == 'XI'))
  require_populated: true
  severity: medium
  dimension: validity
  message: Additional VAT registration number of the vendor does not start with its country code
  why_it_matters: LFAS holds the vendor's VAT numbers for other EU countries. Each number must start with the code of the
    country it is registered for (EL for Greece, XI for Northern Ireland). A mismatch means the number was entered under
    the wrong country and is picked for the wrong transactions.
  rule_authority: regulatory
  sap_impact: Intra-community acquisitions from that country are reported with an invalid VAT number; VIES validation fails.
  fix_map:
    __other__: Correct the country or the VAT number in XK02 > Control data > Other (VAT registration numbers).
  record_fix_template: 'Vendor {LFAS.LIFNR}: VAT number for country {LFAS.LAND1} does not start with that country code.'
- id: AP229
  field: LFA1.STCD1
  check_class: uniqueness_check
  grain: LFA1
  fields: [LFA1.LAND1, LFA1.STCD1]
  normalize: alnum
  severity: medium
  dimension: uniqueness
  message: Several vendors in the same country share tax number 1
  why_it_matters: The same tax number on two vendor accounts in one country is almost always the same legal entity created
    twice, often in different company codes so the per-company-code duplicate check does not see it. Spend, payments and
    tax reporting split across both.
  rule_authority: best_practice
  sap_impact: Duplicate vendor masters across company codes; duplicate-invoice checks miss invoices posted to the other
    account; withholding tax returns split per account.
  fix_map:
    __other__: Confirm whether the accounts are the same supplier; if so block one (XK05), move open items and flag it for
      deletion. Legitimate branches should use the head office link (LFB1.LNRZE).
  record_fix_template: 'Vendor {LFA1.LIFNR}: tax number 1 is also used by another vendor in {LFA1.LAND1}.'
- id: AP230
  field: LFA1.STCD2
  check_class: uniqueness_check
  grain: LFA1
  fields: [LFA1.LAND1, LFA1.STCD2]
  normalize: alnum
  severity: medium
  dimension: uniqueness
  message: Several vendors in the same country share tax number 2
  why_it_matters: Tax number 2 holds the second national identifier (for example the VAT or company registration number in
    many countries). Two vendors with the same one are almost always duplicates of one legal entity.
  rule_authority: best_practice
  sap_impact: Duplicate vendor masters; fragmented spend and duplicate payments across the two accounts.
  fix_map:
    __other__: Confirm whether the accounts are the same supplier and merge them (block, move open items, flag for deletion),
      or correct the tax number.
  record_fix_template: 'Vendor {LFA1.LIFNR}: tax number 2 is also used by another vendor in {LFA1.LAND1}.'
- id: AP231
  field: LFA1.STCD3
  check_class: uniqueness_check
  grain: LFA1
  fields: [LFA1.LAND1, LFA1.STCD3]
  normalize: alnum
  severity: medium
  dimension: uniqueness
  message: Several vendors in the same country share tax number 3
  why_it_matters: Tax number 3 carries the tax registration in countries such as India (GSTIN) and South Africa (VAT number).
    Two vendors with the same one are almost always the same registered entity created twice.
  rule_authority: best_practice
  sap_impact: Duplicate vendor masters; tax credit reconciliation against the authority's records splits across accounts.
  fix_map:
    __other__: Confirm whether the accounts are the same supplier and merge them, or correct the tax number.
  record_fix_template: 'Vendor {LFA1.LIFNR}: tax number 3 is also used by another vendor in {LFA1.LAND1}.'
- id: AP232
  field: LFA1.NAME1
  check_class: similarity_check
  grain: LFA1
  block_by: [LFA1.LAND1, LFA1.ORT01]
  threshold: 0.9
  exact_rule: false
  evidence_key: LFA1.LIFNR
  severity: medium
  dimension: uniqueness
  message: 'Possible duplicate vendor: identical or near-identical name in the same city'
  why_it_matters: Duplicate vendors are often created with a different or missing postal code, so a duplicate check on name
    and postal code misses them. The same name in the same city is the second net that catches these pairs before they
    split spend and enable duplicate payments.
  rule_authority: best_practice
  sap_impact: Duplicate vendor masters; the same invoice paid twice on two accounts; fragmented spend and supplier
    evaluation.
  fix_map:
    __other__: Compare the vendor pairs listed (XK03, tax number and bank details); merge real duplicates by blocking the
      redundant account and flagging it for deletion.
  record_fix_template: 'Vendor {LFA1.LIFNR}: another vendor in the same city has an identical or near-identical name.'
- id: AP233
  field: LFA1.KUNNR
  check_class: cross_field_check
  grain: LFA1
  applies_when:
    LFA1.KUNNR:
      populated: true
  fail_when: (`KNA1.LOEVM` == 'X') & `LFA1.LOEVM`.isna()
  severity: medium
  dimension: consistency
  message: Active vendor is linked to a customer that is flagged for deletion
  why_it_matters: The customer link (LFA1.KUNNR) is used to offset payables against receivables in the payment run and in
    dunning. A link to a customer that is being removed keeps clearing open items against an account that should be
    closed.
  rule_authority: best_practice
  sap_impact: F110 and dunning offset the vendor against a dead customer; archiving of the customer fails while the link
    exists.
  fix_map:
    __other__: Remove the customer link in XK02 > Control data (and the clearing flag LFB1.XVERR), or remove the deletion
      flag from the customer if it is still in use.
  record_fix_template: 'Vendor {LFA1.LIFNR}: linked customer {LFA1.KUNNR} is flagged for deletion.'
- id: AP234
  field: LFA1.UPDAT
  check_class: freshness_check
  max_age_hours: 26280
  grain: LFA1
  applies_when:
    LFA1.SPERR:
      blank: true
    LFA1.SPERM:
      blank: true
  severity: low
  dimension: timeliness
  message: Active vendor has not been changed for more than 3 years
  why_it_matters: Supplier data (address, bank details, tax status, contacts) goes out of date. An open vendor whose master
    record has not been touched for three years has either never been revalidated or is no longer used and should be
    blocked.
  rule_authority: best_practice
  sap_impact: Payments go to outdated bank details; correspondence is returned; dormant open vendors widen the payment-fraud
    attack surface.
  fix_map:
    __other__: Revalidate the vendor with the supplier (address, bank details, tax numbers), or block it (XK05) if it is no
      longer used.
  record_fix_template: 'Vendor {LFA1.LIFNR}: last changed on {LFA1.UPDAT}.'
# --- bank data (LFBK) ----------------------------------------------------------------------------------------------
- id: AP235
  field: LFBK.BVTYP
  check_class: uniqueness_check
  grain: LFBK
  fields: [LFBK.LIFNR, LFBK.BVTYP]
  severity: high
  dimension: uniqueness
  message: Partner bank type is used twice for the same vendor
  why_it_matters: The partner bank type (LFBK.BVTYP) selects which of the vendor's bank accounts an invoice is paid to. Two
    accounts with the same type make the selection ambiguous, and the payment program takes whichever it reads first.
  rule_authority: sap_hard_constraint
  sap_impact: F110 pays invoices to an unintended bank account of the vendor.
  fix_map:
    __other__: Give each of the vendor's bank accounts its own partner bank type in XK02 > Payment transactions.
  record_fix_template: 'Vendor {LFBK.LIFNR}: partner bank type {LFBK.BVTYP} is assigned to more than one bank account.'
- id: AP236
  field: LFBK.LIFNR
  check_class: uniqueness_check
  grain: LFBK
  fields: [LFBK.LIFNR]
  applies_when:
    LFBK.BVTYP:
      blank: true
  severity: medium
  dimension: consistency
  message: Vendor has several bank accounts without a partner bank type
  why_it_matters: When a vendor has more than one bank account, the partner bank type is the only way to tell an invoice
    which account to pay. With several untyped accounts the payment program picks one by itself.
  rule_authority: best_practice
  sap_impact: F110 chooses the bank account by sequence, not by intent; payments go to an old or wrong account.
  fix_map:
    __other__: Assign a partner bank type to each bank account in XK02 > Payment transactions, or delete accounts that are
      no longer valid.
  record_fix_template: 'Vendor {LFBK.LIFNR}: more than one bank account has no partner bank type.'
- id: AP237
  field: LFBK.BANKS
  check_class: cross_field_check
  grain: LFBK
  fail_when: '`LFA1.LAND1`.notna() & (`LFBK.BANKS` != `LFA1.LAND1`)'
  require_populated: true
  severity: low
  dimension: consistency
  message: Vendor bank account is held in a different country than the vendor's address
  why_it_matters: A bank account abroad can be legitimate, but it is also a classic payment-redirection pattern and changes
    the payment method (cross-border, SWIFT, fees, regulatory reporting). Each case should be known and documented.
  rule_authority: best_practice
  sap_impact: Payments run as cross-border transfers with higher fees and central bank reporting; redirected payments to
    foreign accounts go unnoticed.
  fix_map:
    __other__: Verify the bank details with the supplier through a known contact and document the reason, or correct the
      bank country.
  record_fix_template: 'Vendor {LFBK.LIFNR}: bank country {LFBK.BANKS} differs from vendor country {LFA1.LAND1}.'
- id: AP238
  field: LFBK.BANKN
  check_class: exists_check
  grain: LFBK
  fields: [LFBK.BANKN]
  negate: true
  target_table: T012K
  target_fields: [BANKN]
  severity: high
  dimension: validity
  message: Vendor bank account number matches one of the company's own house bank accounts
  why_it_matters: A vendor paid into the company's own bank account is a test or migration artefact at best, and a way to
    hide payments at worst. The vendor's real bank details are then missing.
  rule_authority: best_practice
  sap_impact: Payments to the vendor go back to the company's own account; the supplier is not paid and the cash position
    is misstated.
  fix_map:
    __other__: Replace the bank details with the supplier's verified account in XK02 > Payment transactions.
  record_fix_template: 'Vendor {LFBK.LIFNR}: bank account number equals a house bank account of the company.'
- id: AP239
  field: LFBK.BANKL
  check_class: exists_check
  grain: LFBK
  fields: [LFBK.BANKS, LFBK.BANKL]
  negate: true
  target_table: BNKA
  target_fields: [BANKS, BANKL]
  target_when:
    LOEVM: [X]
  severity: medium
  dimension: validity
  message: Vendor bank account is at a bank that is flagged for deletion in the bank directory
  why_it_matters: Banks are flagged for deletion in BNKA when they merge or close. Transfers to a bank key that no longer
    exists are rejected by the clearing system.
  rule_authority: best_practice
  sap_impact: Payment files are rejected by the bank or the payment is returned; the supplier is paid late.
  fix_map:
    __other__: Ask the supplier for the new bank details and update them in XK02 > Payment transactions.
  record_fix_template: 'Vendor {LFBK.LIFNR}: bank in country {LFBK.BANKS} is flagged for deletion in BNKA.'
# --- company code data (LFB1) -------------------------------------------------------------------------------------
- id: AP240
  field: LFB1.ZTERM
  check_class: exists_check
  grain: LFB1
  fields: [LFB1.ZTERM]
  target_table: T052
  target_fields: [ZTERM]
  target_when:
    KOART:
      not_in: [D]
  severity: medium
  dimension: validity
  message: Vendor payment terms in the company code are defined for customers only
  why_it_matters: Payment terms in T052 can be restricted to customers (account type D). Terms that exist only for customers
    are not offered for vendors in XK01; assigned to a vendor they come from a load or copy and their day limits and
    discounts were never designed for payables.
  rule_authority: sap_hard_constraint
  sap_impact: Invoice entry (FB60, MIRO) rejects the proposed terms or calculates due dates and cash discount with
    receivable-side terms.
  fix_map:
    __other__: Assign vendor payment terms in XK02 > Payment transactions, or allow the terms for vendors in OBB8.
  record_fix_template: 'Vendor {LFB1.LIFNR}, company code {LFB1.BUKRS}: payment terms {LFB1.ZTERM} are customer-only.'
- id: AP241
  field: LFM1.ZTERM
  check_class: exists_check
  grain: LFM1
  fields: [LFM1.ZTERM]
  target_table: T052
  target_fields: [ZTERM]
  target_when:
    KOART:
      not_in: [D]
  severity: medium
  dimension: validity
  message: Vendor payment terms in the purchasing organisation are defined for customers only
  why_it_matters: The purchasing payment terms are copied into every purchase order and from there into the invoice. Terms
    restricted to customers in T052 calculate due dates and discounts that were never meant for payables.
  rule_authority: sap_hard_constraint
  sap_impact: Purchase orders carry customer-only terms; MIRO rejects them or calculates wrong due dates and cash discount.
  fix_map:
    __other__: Assign vendor payment terms in XK02 / MK02 > Purchasing data, or allow the terms for vendors in OBB8.
  record_fix_template: 'Vendor {LFM1.LIFNR}, purchasing organisation {LFM1.EKORG}: payment terms {LFM1.ZTERM} are customer-only.'
- id: AP242
  field: LFB1.HBKID
  check_class: exists_check
  grain: LFB1
  fields: [LFB1.BUKRS, LFB1.HBKID]
  target_table: T012
  target_fields: [BUKRS, HBKID]
  severity: high
  dimension: validity
  message: Vendor's house bank is not defined in the vendor's company code
  why_it_matters: House banks are defined per company code. A house bank ID (LFB1.HBKID) that exists only in another company
    code passes a plain check against T012 but cannot pay from this company code.
  rule_authority: sap_hard_constraint
  sap_impact: F110 cannot use the vendor's house bank and either falls back to the bank determination or rejects the
    items as exceptions.
  fix_map:
    __other__: Assign a house bank of the vendor's company code in XK02 > Payment transactions, or define the house bank in
      FI12 for that company code.
  record_fix_template: 'Vendor {LFB1.LIFNR}: house bank {LFB1.HBKID} is not defined in company code {LFB1.BUKRS}.'
- id: AP243
  field: LFB1.ZUAWA
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Vendor sort key LFB1.ZUAWA must exist in TZUN
  why_it_matters: The sort key fills the assignment field (ZUONR) of every line item posted to the vendor; line item
    display, open item clearing and reconciliation sort by it. A key that is not defined in TZUN fills nothing.
  rule_authority: sap_hard_constraint
  sap_impact: Vendor line items have an empty or wrong assignment; automatic clearing (F.13) and FBL1N sorting do not work.
  fix_map:
    __other__: Sort key '{invalid_value}' is not defined in TZUN. Choose a standard sort key in XK02 > Accounting information.
  record_fix_template: 'Vendor {LFB1.LIFNR}, company code {LFB1.BUKRS}: sort key ''{actual_value}'' not in TZUN.'
- id: AP244
  field: LFB1.ZUAWA
  check_class: null_check
  severity: low
  dimension: completeness
  message: Vendor sort key is missing in the company code data
  why_it_matters: Without a sort key the assignment field of vendor line items stays empty unless the user types it, so
    open items cannot be sorted or cleared automatically by reference.
  rule_authority: best_practice
  sap_impact: FBL1N lists vendor items in no useful order; automatic clearing (F.13) has no criterion to match items.
  fix_map:
    __blank__: Set a sort key (for example 009 external document number) in XK02 > Accounting information, or make it
      required in the account group field status (OBD3).
  record_fix_template: 'Vendor {LFB1.LIFNR}, company code {LFB1.BUKRS}: sort key is missing.'
- id: AP245
  field: LFB1.BUSAB
  check_class: exists_check
  grain: LFB1
  fields: [LFB1.BUKRS, LFB1.BUSAB]
  target_table: T001S
  target_fields: [BUKRS, BUSAB]
  severity: low
  dimension: validity
  message: Vendor's accounting clerk is not defined in the vendor's company code
  why_it_matters: Accounting clerks (T001S) are defined per company code and drive the clerk on correspondence, workflow
    for blocked invoices and payment-run selections. A clerk ID from another company code routes nothing.
  rule_authority: sap_hard_constraint
  sap_impact: Workflow for blocked invoices and payment exceptions has no recipient; correspondence carries no clerk.
  fix_map:
    __other__: Assign a clerk of the company code in XK02 > Correspondence, or define the clerk in OB25 (T001S).
  record_fix_template: 'Vendor {LFB1.LIFNR}: accounting clerk {LFB1.BUSAB} is not defined in company code {LFB1.BUKRS}.'
- id: AP246
  field: LFB1.ALTKN
  check_class: uniqueness_check
  grain: LFB1
  fields: [LFB1.BUKRS, LFB1.ALTKN]
  severity: medium
  dimension: uniqueness
  message: The same previous account number is used for several vendors in one company code
  why_it_matters: The previous account number (LFB1.ALTKN) maps the vendor to its legacy account. One legacy account mapped
    to two SAP vendors means a legacy supplier was migrated twice, or two legacy suppliers were merged without record.
  rule_authority: best_practice
  sap_impact: Migrated open items and history are split across two vendors; legacy reconciliation and audit trails break.
  fix_map:
    __other__: Find the correct SAP vendor for the legacy account; block and flag the duplicate for deletion, and correct
      the previous account number on the other.
  record_fix_template: 'Vendor {LFB1.LIFNR}, company code {LFB1.BUKRS}: previous account number {LFB1.ALTKN} is used by
    another vendor.'
- id: AP247
  field: LFB1.QSZDT
  check_class: cross_field_check
  grain: LFB1
  fail_when: '`LFB1.QSZNR`.notna() & (`LFB1.QSZDT` < @today)'
  severity: medium
  dimension: timeliness
  message: Vendor's withholding tax exemption certificate has expired
  why_it_matters: The exemption certificate number (LFB1.QSZNR) and its end date (LFB1.QSZDT) exempt the vendor from
    classic withholding tax. After the end date the exemption no longer applies, but the record still shows it.
  rule_authority: regulatory
  sap_impact: Withholding tax is deducted although the vendor thinks it is exempt, or (if exemption is also held in LFBW)
    not deducted although it should be; penalties from the tax authority.
  fix_map:
    __other__: Obtain a renewed certificate and update number and end date in XK02 > Accounting information, or remove the
      exemption.
  record_fix_template: 'Vendor {LFB1.LIFNR}, company code {LFB1.BUKRS}: withholding tax exemption ended on {LFB1.QSZDT}.'
- id: AP248
  field: LFB1.LNRZE
  check_class: exists_check
  grain: LFB1
  fields: [LFB1.LNRZE, LFB1.BUKRS]
  target_table: LFB1
  target_fields: [LIFNR, BUKRS]
  severity: high
  dimension: consistency
  message: Vendor's head office is not created in the vendor's company code
  why_it_matters: Postings to a branch (LFB1.LNRZE set) are managed on the head office account in the same company code.
    If the head office has no company code data there, the branch postings have no account to land on.
  rule_authority: sap_hard_constraint
  sap_impact: Invoices to the branch fail with a missing head office in the company code; payment and dunning by head
    office do not work.
  fix_map:
    __other__: Extend the head office vendor to the company code (XK01 with reference) or remove the head office link.
  record_fix_template: 'Vendor {LFB1.LIFNR}: head office {LFB1.LNRZE} has no data in company code {LFB1.BUKRS}.'
- id: AP249
  field: LFB1.LNRZE
  check_class: exists_check
  grain: LFB1
  fields: [LFB1.LNRZE, LFB1.BUKRS]
  negate: true
  target_table: LFB1
  target_fields: [LIFNR, BUKRS]
  target_when:
    LNRZE:
      populated: true
  severity: medium
  dimension: consistency
  message: Vendor's head office is itself a branch of another head office
  why_it_matters: SAP supports one level of head office and branch. A head office that points to another head office
    builds a chain that the payment program and dunning do not follow.
  rule_authority: sap_hard_constraint
  sap_impact: Branch items are managed on an intermediate account instead of the real head office; payments and dunning
    are split.
  fix_map:
    __other__: Point all branches directly at the top head office in XK02 > Accounting information.
  record_fix_template: 'Vendor {LFB1.LIFNR}, company code {LFB1.BUKRS}: head office {LFB1.LNRZE} has its own head office.'
- id: AP250
  field: LFB1.LNRZB
  check_class: exists_check
  grain: LFB1
  fields: [LFB1.LNRZB, LFB1.BUKRS]
  target_table: LFB1
  target_fields: [LIFNR, BUKRS]
  severity: high
  dimension: consistency
  message: Company-code alternative payee is not created in the vendor's company code
  why_it_matters: The alternative payee in the company code (LFB1.LNRZB) is paid from this company code. Without company
    code data the payee has no payment methods or bank selection there.
  rule_authority: sap_hard_constraint
  sap_impact: F110 cannot pay the vendor's items to the alternative payee; the items appear as exceptions.
  fix_map:
    __other__: Extend the alternative payee to the company code (XK01 with reference) or remove it from the vendor.
  record_fix_template: 'Vendor {LFB1.LIFNR}: alternative payee {LFB1.LNRZB} has no data in company code {LFB1.BUKRS}.'
- id: AP251
  field: LFB1.NODEL
  check_class: cross_field_check
  grain: LFB1
  fail_when: (`LFB1.NODEL` == 'X') & (`LFB1.LOEVM` == 'X')
  severity: medium
  dimension: consistency
  message: Vendor company code data has a deletion block and a deletion flag at the same time
  why_it_matters: The company-code deletion block (LFB1.NODEL) forbids archiving; the deletion flag (LFB1.LOEVM) requests it.
    Both together leave the status undefined and come from a direct table change.
  rule_authority: sap_hard_constraint
  sap_impact: Archiving (FI_ACCPAYB) skips the company code data; the vendor looks closed but stays forever.
  fix_map:
    __other__: Remove either the deletion block or the deletion flag in XK06 for the company code.
  record_fix_template: 'Vendor {LFB1.LIFNR}, company code {LFB1.BUKRS}: deletion block and deletion flag are both set.'
- id: AP252
  field: LFB1.SPERR
  check_class: cross_field_check
  grain: LFB1
  fail_when: (`LFA1.SPERR` == 'X') & `LFB1.SPERR`.isna()
  severity: low
  dimension: consistency
  message: Vendor is posting-blocked centrally but open in the company code
  why_it_matters: The central posting block stops postings in all company codes, so the company code flag looks redundant.
    But company-code reports, interfaces and selections (FBL1N, F110 parameter checks, external procurement systems) read
    the company-code flag, and when the central block is lifted every company code reopens at once.
  rule_authority: best_practice
  sap_impact: Company-code level reports and replicated systems show the vendor as open; removing the central block
    reactivates the vendor everywhere without a company-code decision.
  fix_map:
    __other__: Set the posting block for the company codes too (XK05, 'selected company code' and 'all company codes').
  record_fix_template: 'Vendor {LFB1.LIFNR}: blocked centrally but open in company code {LFB1.BUKRS}.'
- id: AP253
  field: LFB1.LOEVM
  check_class: cross_field_check
  grain: LFB1
  fail_when: (`LFA1.LOEVM` == 'X') & `LFB1.LOEVM`.isna() & `LFB1.SPERR`.isna() & `LFA1.SPERR`.isna()
  severity: high
  dimension: consistency
  message: Vendor is flagged for deletion centrally but its company code data is open
  why_it_matters: A central deletion flag says the vendor is finished, but the deletion flag does not stop postings. With
    company code data open and no posting block, invoices and payments can still be posted in that company code.
  rule_authority: best_practice
  sap_impact: Invoices and payments are posted to a vendor that is being removed; archiving fails because new documents
    keep arriving.
  fix_map:
    __other__: Flag the company code data for deletion and set the posting block (XK06 / XK05), or remove the central flag
      if the vendor is still in use.
  record_fix_template: 'Vendor {LFB1.LIFNR}: flagged for deletion centrally but open in company code {LFB1.BUKRS}.'
# --- dunning data (LFB5) ------------------------------------------------------------------------------------------
- id: AP254
  field: LFB5.BUKRS
  check_class: exists_check
  grain: LFB5
  fields: [LFB5.LIFNR, LFB5.BUKRS]
  target_table: LFB1
  target_fields: [LIFNR, BUKRS]
  severity: medium
  dimension: consistency
  message: Vendor dunning data exists for a company code in which the vendor is not created
  why_it_matters: Dunning data (LFB5) belongs to the vendor's company code data. A dunning record without the company code
    record is an orphan from a partial deletion or load and is never used.
  rule_authority: sap_hard_constraint
  sap_impact: The dunning data is invisible in XK03 and blocks a clean archiving of the vendor.
  fix_map:
    __other__: Create the vendor's company code data (XK01) if the vendor is used there, or delete the orphan dunning record.
  record_fix_template: 'Vendor {LFB5.LIFNR}: dunning data for company code {LFB5.BUKRS} without company code data.'
- id: AP255
  field: LFB5.LFRMA
  check_class: exists_check
  grain: LFB5
  fields: [LFB5.LFRMA]
  target_table: LFA1
  target_fields: [LIFNR]
  target_when:
    LOEVM:
      blank: true
  severity: medium
  dimension: consistency
  message: Vendor's dunning recipient does not exist or is flagged for deletion
  why_it_matters: The dunning recipient (LFB5.LFRMA) receives the dunning letters for the vendor's debit balances. A
    recipient that does not exist or is being removed sends the letters nowhere.
  rule_authority: best_practice
  sap_impact: F150 prints dunning letters to a missing or obsolete address; debit balances (credit memos, overpayments)
    are never recovered.
  fix_map:
    __other__: Enter an active dunning recipient in XK02 > Correspondence, or remove it so letters go to the vendor.
  record_fix_template: 'Vendor {LFB5.LIFNR}, company code {LFB5.BUKRS}: dunning recipient {LFB5.LFRMA} is missing or
    flagged for deletion.'
- id: AP256
  field: LFB5.BUSAB
  check_class: exists_check
  grain: LFB5
  fields: [LFB5.BUKRS, LFB5.BUSAB]
  target_table: T001S
  target_fields: [BUKRS, BUSAB]
  severity: low
  dimension: validity
  message: Dunning clerk is not defined in the vendor's company code
  why_it_matters: The dunning clerk is printed on dunning letters and receives questions about them. A clerk ID that is not
    defined in the company code (T001S) prints no name or contact.
  rule_authority: sap_hard_constraint
  sap_impact: Dunning letters carry no clerk; supplier replies have no recipient.
  fix_map:
    __other__: Assign a clerk of the company code in XK02 > Correspondence, or define the clerk in OB25.
  record_fix_template: 'Vendor {LFB5.LIFNR}: dunning clerk {LFB5.BUSAB} is not defined in company code {LFB5.BUKRS}.'
# --- purchasing organisation data (LFM1, LFM2) -------------------------------------------------------------------
- id: AP257
  field: LFM1.XERSY
  check_class: cross_field_check
  grain: LFM1
  fail_when: (`LFM1.XERSY` == 'X') & `LFM1.WEBRE`.isna()
  severity: high
  dimension: consistency
  message: Evaluated receipt settlement is active but GR-based invoice verification is off
  why_it_matters: Evaluated receipt settlement (ERS, LFM1.XERSY) creates the invoice from each goods receipt, which only
    works when invoice verification is goods-receipt based (LFM1.WEBRE). Without it, ERS settles against the order
    quantity and can settle quantities that were never received.
  rule_authority: sap_hard_constraint
  sap_impact: MRRL rejects the purchase order items or settles them incorrectly; suppliers are paid for goods not received.
  fix_map:
    __other__: Set GR-based invoice verification together with ERS in XK02 / MK02 > Purchasing data, or switch ERS off.
  record_fix_template: 'Vendor {LFM1.LIFNR}, purchasing organisation {LFM1.EKORG}: ERS active without GR-based invoice
    verification.'
- id: AP258
  field: LFM1.ZTERM
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Payment terms are missing in the vendor's purchasing organisation data
  why_it_matters: Purchase orders take their payment terms from the purchasing data (LFM1.ZTERM), and MIRO takes them from
    the purchase order. Without them every order has no terms and every invoice is due immediately with no cash discount.
  rule_authority: best_practice
  sap_impact: Invoices from purchase orders are due on the baseline date; agreed payment periods and cash discount are
    lost or entered by hand.
  fix_map:
    __blank__: Maintain the agreed payment terms in XK02 / MK02 > Purchasing data.
  record_fix_template: 'Vendor {LFM1.LIFNR}, purchasing organisation {LFM1.EKORG}: payment terms are missing.'
- id: AP259
  field: LFM1.INCO2
  check_class: cross_field_check
  grain: LFM1
  fail_when: '`LFM1.INCO1`.notna() & `LFM1.INCO2`.isna()'
  severity: low
  dimension: completeness
  message: Vendor Incoterms have no named place
  why_it_matters: Every Incoterms rule (EXW, FCA, FOB, CIF, DAP, DDP and the others) is only complete with a named place
    (LFM1.INCO2). Without it the transfer of risk and freight cost in the purchase order is undefined.
  rule_authority: best_practice
  sap_impact: Purchase orders print an incomplete delivery term; freight cost and customs value (import) are disputed.
  fix_map:
    __other__: Maintain the Incoterms location in XK02 / MK02 > Purchasing data.
  record_fix_template: 'Vendor {LFM1.LIFNR}, purchasing organisation {LFM1.EKORG}: Incoterms {LFM1.INCO1} without a named
    place.'
- id: AP260
  field: LFM1.SPERM
  check_class: cross_field_check
  grain: LFM1
  fail_when: (`LFA1.SPERM` == 'X') & `LFM1.SPERM`.isna()
  severity: low
  dimension: consistency
  message: Vendor is purchasing-blocked centrally but open in the purchasing organisation
  why_it_matters: The central purchasing block stops orders in all purchasing organisations, but sourcing lists, info
    records and replicated procurement systems read the purchasing organisation flag. When the central block is lifted,
    every purchasing organisation reopens at once.
  rule_authority: best_practice
  sap_impact: Source determination and external procurement systems still offer the vendor; removing the central block
    reactivates purchasing everywhere.
  fix_map:
    __other__: Set the purchasing block for the purchasing organisations too (XK05 / MK05).
  record_fix_template: 'Vendor {LFM1.LIFNR}: purchasing-blocked centrally but open in purchasing organisation {LFM1.EKORG}.'
- id: AP261
  field: LFM1.LOEVM
  check_class: cross_field_check
  grain: LFM1
  fail_when: (`LFA1.LOEVM` == 'X') & `LFM1.LOEVM`.isna() & `LFM1.SPERM`.isna() & `LFA1.SPERM`.isna()
  severity: high
  dimension: consistency
  message: Vendor is flagged for deletion centrally but its purchasing organisation data is active
  why_it_matters: The deletion flag does not stop purchasing. A vendor deleted centrally whose purchasing organisation is
    neither flagged nor blocked can still receive purchase orders, contracts and scheduling agreements.
  rule_authority: best_practice
  sap_impact: Buyers and automatic PO creation (ME59N) order from a vendor that is being removed.
  fix_map:
    __other__: Flag the purchasing organisation data for deletion and set the purchasing block (XK06 / XK05), or remove the
      central flag if the vendor is still in use.
  record_fix_template: 'Vendor {LFM1.LIFNR}: flagged for deletion centrally but active in purchasing organisation {LFM1.EKORG}.'
- id: AP262
  field: LFM1.LIFNR
  check_class: exists_check
  grain: LFM1
  fields: [LFM1.LIFNR]
  applies_when:
    LFM1.SPERM:
      blank: true
  target_table: LFB1
  target_fields: [LIFNR]
  severity: high
  dimension: completeness
  message: Vendor can be ordered from but has no company code data anywhere
  why_it_matters: Purchase orders only need the purchasing view, but goods receipt valuation and invoice verification post
    to the vendor's reconciliation account in a company code. A vendor with purchasing data and no company code data can be
    ordered from but never invoiced or paid.
  rule_authority: sap_hard_constraint
  sap_impact: MIRO stops because the vendor is not created in the company code; goods are received without a payable.
  fix_map:
    __other__: Extend the vendor to the company code of the ordering plant (XK01 with company code data) or block purchasing
      (XK05).
  record_fix_template: 'Vendor {LFM1.LIFNR}: purchasing data for {LFM1.EKORG} but no company code data.'
- id: AP263
  field: LFM2.EKORG
  check_class: exists_check
  grain: LFM2
  fields: [LFM2.LIFNR, LFM2.EKORG]
  target_table: LFM1
  target_fields: [LIFNR, EKORG]
  severity: medium
  dimension: consistency
  message: Vendor sub-range or plant purchasing data exists without purchasing organisation data
  why_it_matters: LFM2 holds purchasing data that differs by vendor sub-range or plant below the purchasing organisation
    (LFM1). Without the LFM1 record the lower level is an orphan that purchasing never reads.
  rule_authority: sap_hard_constraint
  sap_impact: Plant-specific purchasing data is ignored; the vendor cannot be ordered from in that purchasing organisation.
  fix_map:
    __other__: Create the purchasing organisation data (XK01 / MK01) or delete the orphan record.
  record_fix_template: 'Vendor {LFM2.LIFNR}: data for purchasing organisation {LFM2.EKORG} at sub-range or plant level
    without LFM1.'
- id: AP264
  field: LFM2.LOEVM
  check_class: exists_check
  grain: LFM2
  fields: [LFM2.LIFNR, LFM2.EKORG]
  negate: true
  applies_when:
    LFM2.LOEVM:
      blank: true
  target_table: LFM1
  target_fields: [LIFNR, EKORG]
  target_when:
    LOEVM: [X]
  severity: low
  dimension: consistency
  message: Vendor sub-range or plant purchasing data is active while the purchasing organisation is flagged for deletion
  why_it_matters: When the purchasing organisation data is flagged for deletion, the lower-level data should be flagged too.
    Active plant or sub-range records keep the vendor visible in source determination and block archiving.
  rule_authority: best_practice
  sap_impact: Archiving of the vendor's purchasing data fails; plant-level conditions still point to the vendor.
  fix_map:
    __other__: Flag the plant or sub-range data for deletion as well (XK06 / MK06).
  record_fix_template: 'Vendor {LFM2.LIFNR}: purchasing organisation {LFM2.EKORG} flagged for deletion, lower-level data
    is not.'
# --- partner functions (WYT3) -------------------------------------------------------------------------------------
- id: AP265
  field: WYT3.LIFN2
  check_class: exists_check
  grain: WYT3
  fields: [WYT3.LIFN2]
  target_table: LFA1
  target_fields: [LIFNR]
  target_when:
    LOEVM:
      blank: true
  severity: high
  dimension: consistency
  message: Vendor partner function points to a vendor that does not exist or is flagged for deletion
  why_it_matters: Partner functions (ordering address, goods supplier, invoicing party) are copied into every purchase
    order. A partner vendor that does not exist or is being removed sends orders, deliveries or invoices to a dead account.
  rule_authority: sap_hard_constraint
  sap_impact: Purchase orders carry an invalid partner; invoices for the order are posted to a deleted invoicing party.
  fix_map:
    __other__: Replace the partner in XK02 / MK02 > Partner functions, or remove the deletion flag from the partner vendor.
  record_fix_template: 'Vendor {WYT3.LIFNR}, purchasing organisation {WYT3.EKORG}: partner {WYT3.PARVW} vendor {WYT3.LIFN2}
    is missing or flagged for deletion.'
- id: AP266
  field: WYT3.LIFN2
  check_class: exists_check
  grain: WYT3
  fields: [WYT3.LIFN2]
  negate: true
  target_table: LFA1
  target_fields: [LIFNR]
  target_when:
    SPERM: [X]
  severity: medium
  dimension: consistency
  message: Vendor partner function points to a vendor that is blocked for purchasing
  why_it_matters: A purchasing block on the partner vendor was set for a reason (quality, compliance, sanctions). Through
    the partner function the blocked vendor still receives orders or invoices of the main vendor.
  rule_authority: best_practice
  sap_impact: The purchasing block is bypassed; orders and invoices reach a blocked supplier through the partner.
  fix_map:
    __other__: Replace the partner in XK02 / MK02 > Partner functions, or lift the block on the partner if it no longer
      applies.
  record_fix_template: 'Vendor {WYT3.LIFNR}, purchasing organisation {WYT3.EKORG}: partner {WYT3.PARVW} vendor {WYT3.LIFN2}
    is purchasing-blocked.'
- id: AP267
  field: WYT3.EKORG
  check_class: exists_check
  grain: WYT3
  fields: [WYT3.LIFNR, WYT3.EKORG]
  target_table: LFM1
  target_fields: [LIFNR, EKORG]
  severity: medium
  dimension: consistency
  message: Vendor partner functions exist for a purchasing organisation without purchasing data
  why_it_matters: Partner functions belong to the vendor's purchasing organisation data. Partners maintained for a
    purchasing organisation where the vendor is not created are orphans that no order uses.
  rule_authority: sap_hard_constraint
  sap_impact: The partner assignment is never used; extending the vendor later silently picks up outdated partners.
  fix_map:
    __other__: Create the purchasing organisation data (XK01 / MK01) or delete the orphan partner records.
  record_fix_template: 'Vendor {WYT3.LIFNR}: partner functions for purchasing organisation {WYT3.EKORG} without LFM1.'
- id: AP268
  field: WYT3.PARVW
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Vendor partner function WYT3.PARVW must exist in TPAR
  why_it_matters: The partner function decides what the partner does in purchasing (ordering address, goods supplier,
    invoicing party). A function that is not defined in TPAR is ignored by the partner determination.
  rule_authority: sap_hard_constraint
  sap_impact: The partner is never copied into purchase orders; invoices and deliveries go to the main vendor.
  fix_map:
    __other__: Partner function '{invalid_value}' is not defined in TPAR. Correct it in XK02 > Partner functions.
  record_fix_template: 'Vendor {WYT3.LIFNR}, purchasing organisation {WYT3.EKORG}: partner function ''{actual_value}'' not
    in TPAR.'
- id: AP269
  field: WYT3.PARVW
  check_class: uniqueness_check
  grain: WYT3
  fields: [WYT3.LIFNR, WYT3.EKORG, WYT3.PARVW]
  applies_when:
    WYT3.DEFPA: [X]
    WYT3.LTSNR:
      blank: true
    WYT3.WERKS:
      blank: true
  severity: medium
  dimension: uniqueness
  message: More than one default partner for the same partner function
  why_it_matters: The default partner indicator (WYT3.DEFPA) tells purchasing which partner to propose when several exist
    for one function. Two defaults for the same function make the proposal arbitrary.
  rule_authority: sap_hard_constraint
  sap_impact: Purchase orders propose a different ordering address or invoicing party from one order to the next.
  fix_map:
    __other__: Keep one default partner per partner function in XK02 / MK02 > Partner functions.
  record_fix_template: 'Vendor {WYT3.LIFNR}, purchasing organisation {WYT3.EKORG}: several default partners for function
    {WYT3.PARVW}.'
- id: AP270
  field: WYT3.PARNR
  check_class: exists_check
  grain: WYT3
  fields: [WYT3.PARNR]
  target_table: KNVK
  target_fields: [PARNR]
  severity: medium
  dimension: consistency
  message: Vendor partner function points to a contact person that does not exist
  why_it_matters: A contact person as partner (WYT3.PARNR) is printed on purchase orders as the supplier contact. A contact
    number that is not in KNVK prints nothing and routes order confirmations nowhere.
  rule_authority: sap_hard_constraint
  sap_impact: Purchase order output has no supplier contact; output by e-mail to the contact fails.
  fix_map:
    __other__: Assign an existing contact person in XK02 > Partner functions, or create the contact (XK02 > Contact persons).
  record_fix_template: 'Vendor {WYT3.LIFNR}, purchasing organisation {WYT3.EKORG}: contact person {WYT3.PARNR} does not exist.'
- id: AP271
  field: WYT3.LIFN2
  check_class: exists_check
  grain: WYT3
  fields: [WYT3.LIFN2]
  applies_when:
    WYT3.PARVW: [RS]
  target_table: LFB1
  target_fields: [LIFNR]
  severity: high
  dimension: completeness
  message: Invoicing party partner has no company code data
  why_it_matters: The invoicing party (partner function RS) is the account the invoice is posted to in MIRO. An invoicing
    party without company code data cannot carry a payable.
  rule_authority: sap_hard_constraint
  sap_impact: MIRO stops because the invoicing party is not created in the company code; invoices for the orders cannot be
    posted.
  fix_map:
    __other__: Extend the invoicing party to the company code (XK01 with company code data) or replace the partner.
  record_fix_template: 'Vendor {WYT3.LIFNR}, purchasing organisation {WYT3.EKORG}: invoicing party {WYT3.LIFN2} has no company
    code data.'
# --- contact persons (KNVK with LIFNR) -----------------------------------------------------------------------------
- id: AP272
  field: KNVK.LIFNR
  check_class: exists_check
  grain: KNVK
  fields: [KNVK.LIFNR]
  target_table: LFA1
  target_fields: [LIFNR]
  severity: medium
  dimension: consistency
  message: Vendor contact person belongs to a vendor that does not exist
  why_it_matters: Contact persons are attached to their vendor through KNVK.LIFNR. A contact of a vendor that does not exist
    is an orphan holding personal data that no process uses and no one maintains.
  rule_authority: sap_hard_constraint
  sap_impact: Orphan personal data is kept without a purpose (GDPR / POPIA retention); CVI cannot convert the contact.
  fix_map:
    __other__: Delete the orphan contact person, or assign it to the correct vendor.
  record_fix_template: 'Contact person {KNVK.PARNR}: vendor {KNVK.LIFNR} does not exist.'
- id: AP273
  field: KNVK.KUNNR
  check_class: cross_field_check
  grain: KNVK
  applies_when:
    KNVK.LIFNR:
      populated: true
  fail_when: '`KNVK.KUNNR`.notna()'
  severity: medium
  dimension: consistency
  message: Contact person is assigned to a vendor and a customer at the same time
  why_it_matters: A contact person (KNVK) belongs to either a customer or a vendor. A record with both is created by a load
    or table change; XD02 and XK02 each change it without knowing the other uses it.
  rule_authority: sap_hard_constraint
  sap_impact: Changes made for the customer change the vendor contact; CVI creates the contact relationship for only one of
    the two Business Partners.
  fix_map:
    __other__: Create separate contact persons for the customer and the vendor, and remove the second assignment.
  record_fix_template: 'Contact person {KNVK.PARNR}: assigned to vendor {KNVK.LIFNR} and customer {KNVK.KUNNR}.'
- id: AP274
  field: KNVK.LOEVM
  check_class: cross_field_check
  grain: KNVK
  applies_when:
    KNVK.LIFNR:
      populated: true
  fail_when: (`LFA1.LOEVM` == 'X') & `KNVK.LOEVM`.isna()
  severity: low
  dimension: consistency
  message: Contact person is active while its vendor is flagged for deletion
  why_it_matters: When a vendor is flagged for deletion its contact persons hold personal data without a purpose. They
    should be flagged too, so that they are archived or deleted with the vendor.
  rule_authority: regulatory
  sap_impact: Personal data of contacts outlives the business relationship (GDPR / POPIA storage limitation).
  fix_map:
    __other__: Flag the contact person for deletion (XK06 / XK02 > Contact persons) or delete it.
  record_fix_template: 'Contact person {KNVK.PARNR}: vendor {KNVK.LIFNR} is flagged for deletion.'
# --- cross-level lifecycle ----------------------------------------------------------------------------------------
- id: AP275
  field: LFA1.LIFNR
  check_class: exists_check
  grain: LFA1
  fields: [LFA1.LIFNR]
  applies_when:
    LFA1.SPERR:
      blank: true
    LFA1.WERKS:
      blank: true
  target_table: LFB1
  target_fields: [LIFNR]
  severity: medium
  dimension: completeness
  message: Active vendor has no company code data
  why_it_matters: Only company code data (LFB1) gives the vendor a reconciliation account, payment terms and payment
    methods. An active vendor with general data only can be selected in documents but nothing can be posted to it.
  rule_authority: best_practice
  sap_impact: Invoices and payments for the vendor fail with 'vendor not created in company code'; the vendor clutters
    search helps and duplicate checks.
  fix_map:
    __other__: Extend the vendor to the company code where it is used (XK01 with company code data), or block it (XK05)
      if it is not needed.
  record_fix_template: 'Vendor {LFA1.LIFNR}: no company code data.'
- id: AP276
  field: LFA1.LIFNR
  check_class: exists_check
  grain: LFA1
  fields: [LFA1.LIFNR]
  applies_when:
    LFA1.SPERM:
      blank: true
    LFA1.XCPDK:
      blank: true
  target_table: LFM1
  target_fields: [LIFNR]
  severity: low
  dimension: completeness
  message: Vendor is open for purchasing but has no purchasing organisation data
  why_it_matters: A vendor without a purchasing block but with no purchasing organisation data cannot be ordered from.
    Vendors meant for accounting only (utilities, authorities, employees) should carry the purchasing block, so that
    buyers and source determination do not offer them.
  rule_authority: best_practice
  sap_impact: ME21N rejects the vendor for every purchasing organisation; buyers create a second vendor instead.
  fix_map:
    __other__: Extend the vendor to the purchasing organisation (XK01 / MK01) or set the central purchasing block (XK05) for
      an accounting-only vendor.
  record_fix_template: 'Vendor {LFA1.LIFNR}: no purchasing organisation data and no purchasing block.'
