  field: VBKD.TRMTYP
  check_class: referential_check
  severity: high
  dimension: consistency
  message: Means of Transportation must exist in the check table MARA.MATNR
  why_it_matters: TRMTYP (Means of Transportation) is defined in the SAP Data Dictionary with check table MARA.MATNR on domain
    MATNR. A value outside that table is not a value SAP recognises, so the record is inconsistent with the configuration
    it depends on.
  rule_authority: sap_hard_constraint
  sap_impact: Processes that read TRMTYP resolve it through check table MARA.MATNR; an unknown value leaves the record unclassified
    and can block posting, pricing or reporting.
  fix_map:
    __other__: VBKD.TRMTYP '{invalid_value}' is not defined in the check table MARA.MATNR. Correct it there or add the missing
      entry.
  record_fix_template: VBKD.TRMTYP points at a check table MARA.MATNR entry that does not exist.
