  field: VBAK.CMGST
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: Overall status of credit checks must be a value of domain CMGST (e.g. A, B, C, D)
  why_it_matters: Domain CMGST fixes the permitted values of CMGST (Overall status of credit checks) in the SAP Data Dictionary.
    Any other non-blank value is outside SAP's own domain definition and is read inconsistently by the programs that consume
    the field.
  rule_authority: sap_hard_constraint
  sap_impact: CMGST will not evaluate correctly wherever SAP branches on its value.
  allowed_values:
  - A
  - B
  - C
  - D
  fix_map:
    __other__: 'VBAK.CMGST ''{invalid_value}'' is not in domain CMGST. Set it to one of: A, B, C, D.'
  record_fix_template: 'VBAK.CMGST is {actual_value}; expected one of: A, B, C, D.'
