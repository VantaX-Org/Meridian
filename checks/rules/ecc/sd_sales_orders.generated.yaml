- id: DXV00941
  enabled: false
  field: VBKD.REVSP
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: Revenue Distribution Type must be a value of domain RR_REVSP (e.g. A, B, C)
  why_it_matters: Domain RR_REVSP fixes the permitted values of REVSP (Revenue Distribution Type) in the SAP Data Dictionary.
    Any other non-blank value is outside SAP's own domain definition and is read inconsistently by the programs that consume
    the field.
  rule_authority: sap_hard_constraint
  sap_impact: REVSP will not evaluate correctly wherever SAP branches on its value.
  allowed_values:
  - A
  - B
  - C
  fix_map:
    __other__: 'VBKD.REVSP ''{invalid_value}'' is not in domain RR_REVSP. Set it to one of: A, B, C.'
  record_fix_template: 'VBKD.REVSP is {actual_value}; expected one of: A, B, C.'
