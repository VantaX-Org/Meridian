module: fi_gl
target_state: ECC_AND_S4HANA
rules:
  - id: GL001
    field: SKA1.SAKNR
    check_class: regex_check
    pattern: ^[A-Z0-9]{1,10}$
    severity: critical
    dimension: validity
    message: GL account number must be 1-10 alphanumeric characters (A-Z, 0-9)
    why_it_matters: GL account numbers must be numeric only, up to 10 digits. Alphanumeric account numbers from legacy systems
      are not supported in standard SAP charts of accounts and will be rejected during S/4HANA migration. In ECC, non-numeric
      accounts cause issues with account determination and reporting in transactions FS00 and F.01.
    rule_authority: sap_hard_constraint
    sap_impact: Account cannot be used in posting transactions (FB50, F-02) if the number format violates the chart of accounts
      configuration. Migration to S/4HANA is blocked for non-numeric accounts.
    fix_map:
      __other__: 'Account number ''{invalid_value}'' contains non-numeric characters or exceeds 10 digits. In ECC: create a
        mapping to a valid numeric account via T-code FS00 and repost historical data via a conversion program. In S/4HANA:
        use Fiori app F2735 (Manage G/L Account Master Data) to create the corrected account.'
    record_fix_template: 'GL Account {SKA1.SAKNR}: number format is invalid (value: ''{actual_value}''). Map to numeric equivalent
      or create new account via FS00 / Fiori app F2735.'

  - id: GL002
    field: SKA1.KTOKS
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Account group is mandatory — controls number range and field status"
    why_it_matters: >-
      Account group (KTOKS) controls which fields are required, optional, or
      suppressed in the GL master record and which number ranges apply. Without
      it the account cannot be classified in the chart of accounts. In S/4HANA,
      account group also drives the Fiori field layout via BAdI
      FINAC_GL_ACCOUNT.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      GL master record is incomplete. Account cannot be used in posting
      transactions (FB50, F-02) or period-end closing (F.16). Account group
      assignment is mandatory for both ECC and S/4HANA.
    fix_map:
      __blank__: >-
        In ECC: assign account group via T-code FS00 > Control Data tab. Common
        groups: GKNT (general), MIXT (reconciliation). In S/4HANA: use Fiori
        app F2735 (Manage G/L Account Master Data).
    record_fix_template: >-
      GL Account {SKA1.SAKNR}: KTOKS is {actual_value}. Assign the correct
      account group via FS00 / Fiori app F2735.

  - id: GL003
    field: SKA1.XBILK
    check_class: domain_value_check
    allowed_values: ["X", ""]
    severity: critical
    dimension: validity
    message: "Balance sheet indicator must be X (balance sheet) or empty (P&L)"
    why_it_matters: >-
      XBILK determines whether the account is a balance sheet account or a
      P&L account. This classification drives carry-forward behaviour at
      year-end (transaction F.16) and affects all financial reporting via
      financial statement versions (FSV) in F.01.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Year-end closing (F.16) processes the account incorrectly. Balance
      carry-forward either omits a balance sheet account or incorrectly
      carries forward a P&L account.
    valid_values_with_labels:
      "X": "Balance sheet account — balance carries forward at year-end"
      "": "P&L account — balance resets at year-end"
    fix_map:
      __other__: >-
        Value '{invalid_value}' is not valid. Must be X (balance sheet) or
        empty (P&L). In ECC: correct via T-code FS00 > Type/Description tab.
        In S/4HANA: use Fiori app F2735 (Manage G/L Account Master Data).
    record_fix_template: >-
      GL Account {SKA1.SAKNR}: XBILK is '{actual_value}'. Set to X (balance
      sheet) or leave empty (P&L) via FS00 / Fiori app F2735.



  - id: GL006
    field: SKA1.KTOPL
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Chart of accounts is mandatory — defines the account's scope"
    why_it_matters: >-
      KTOPL (chart of accounts) is the primary organisational assignment for
      every GL account. It determines which company codes can use the account.
      Without it, the account has no organisational context and cannot be
      extended to any company code for posting.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Account cannot be assigned to any company code. All posting transactions
      (FB50, F-02, FB60) fail. The account is effectively orphaned in the
      system.
    fix_map:
      __blank__: >-
        In ECC: assign chart of accounts via T-code FS00 > Type/Description tab.
        In S/4HANA: use Fiori app F2735 (Manage G/L Account Master Data).
        The chart of accounts must match the company code's assigned CoA.
    record_fix_template: >-
      GL Account {SKA1.SAKNR}: KTOPL is {actual_value}. Assign the chart of
      accounts via FS00 / Fiori app F2735.

  - id: GL007
    field: SKAT.TXT20
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Short text is required — displayed in all GL reports and postings"
    why_it_matters: >-
      TXT20 is the 20-character short description displayed in all GL line item
      reports (FBL3N), trial balance (F.01), and during posting entry (FB50).
      Without it, users see only the account number, making it difficult to
      identify accounts during posting and review, increasing error risk.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      GL reports (FBL3N, F.01, S_ALR_87012326) display blank descriptions.
      Users cannot identify accounts during manual posting, increasing the
      risk of mispostings.
    fix_map:
      __blank__: >-
        In ECC: set the short text via T-code FS00 > Type/Description tab.
        In S/4HANA: use Fiori app F2735 (Manage G/L Account Master Data).
        The text should be a concise, meaningful description of the account
        purpose (e.g., "Trade Receivables", "Rent Expense").
    record_fix_template: >-
      GL Account {SKA1.SAKNR}: TXT20 is {actual_value}. Set the short text
      via FS00 / Fiori app F2735.

  - id: GL008
    field: SKAT.TXT50
    check_class: null_check
    severity: low
    dimension: completeness
    message: Long text is recommended for full account documentation
    why_it_matters: TXT50 is the 50-character long description that provides additional context beyond the short text. It appears
      in detailed GL master data reports and helps auditors and accountants understand the account's purpose during reviews
      and reconciliations.
    rule_authority: best_practice
    sap_impact: Detailed GL master data reports show incomplete descriptions. Account purpose is not fully documented, increasing
      audit query time.
    fix_map:
      __blank__: 'In ECC: set the long text via T-code FS00 > Type/Description tab. In S/4HANA: use Fiori app F2735. Provide
        a full description of the account''s purpose and typical usage.'
    record_fix_template: 'GL Account {SKA1.SAKNR}: TXT50 is {actual_value}. Set the long text via FS00 / Fiori app F2735.'

  - id: GL009
    field: SKB1.BUKRS
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "Company code is mandatory for all GL account company code segments"
    why_it_matters: >-
      Company code (BUKRS) is the primary organisational unit for financial
      accounting. Every GL account must be assigned to at least one company
      code to be used in postings. This is a hard SAP requirement enforced
      at both the database and application level.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Account cannot be used for postings in any company code. All financial
      transactions (FB50, F-02, FB60) referencing this account fail.
    fix_map:
      __blank__: >-
        In ECC: extend the GL account to the correct company code via T-code
        FS00 > Company Code Data. In S/4HANA: use Fiori app F2735 (Manage
        G/L Account Master Data) and add the company code segment.
    record_fix_template: >-
      GL Account {SKA1.SAKNR}: BUKRS is {actual_value}. Extend the account
      to the correct company code via FS00 / Fiori app F2735.

  - id: GL010
    field: SKB1.WAERS
    check_class: regex_check
    pattern: "^[A-Z]{3}$"
    severity: critical
    dimension: validity
    message: "Account currency must be a valid 3-letter ISO currency code"
    why_it_matters: >-
      Account currency determines which currency postings are accepted. It
      must be a valid ISO 4217 3-letter code (e.g., USD, EUR, ZAR). Invalid
      currency codes cause all posting transactions to be rejected and break
      currency translation during period-end closing.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      All postings to this account are rejected. FI transactions (FB50, F-02)
      and automatic postings (clearing, taxes, foreign currency valuation
      via F.05) fail.
    fix_map:
      __other__: >-
        Currency '{invalid_value}' is not a valid ISO 4217 code. In ECC: correct
        via T-code FS00 > Company Code Data. The currency must be configured in
        the system (T-code OY03). In S/4HANA: use Fiori app F2735.
    record_fix_template: >-
      GL Account {SKA1.SAKNR}: WAERS is '{actual_value}'. Set to a valid ISO
      currency code via FS00 / Fiori app F2735.


  - id: GL012
    field: SKB1.XOPVW
    check_class: domain_value_check
    allowed_values: ["X", ""]
    severity: high
    dimension: validity
    message: "Open item management flag must be X (enabled) or empty (disabled)"
    why_it_matters: >-
      Open item management controls whether individual line items must be
      explicitly cleared. It is critical for reconciliation accounts (AP/AR),
      clearing accounts, and GR/IR accounts. Once set and items are posted,
      this flag cannot be changed without clearing all open items first.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Clearing transactions (F-03, F-04, F.13) behave incorrectly. AP/AR
      reconciliation becomes impossible if open item management is not set
      on reconciliation accounts. GR/IR clearing fails.
    valid_values_with_labels:
      "X": "Open item management enabled — items must be explicitly cleared"
      "": "Open item management disabled — balance-only management"
    fix_map:
      __other__: >-
        Value '{invalid_value}' is not valid. Must be X (enabled) or empty
        (disabled). In ECC: correct via T-code FS00 > Control Data. In S/4HANA:
        use Fiori app F2735. Note: cannot be changed if open items exist.
    record_fix_template: >-
      GL Account {SKA1.SAKNR}: XOPVW is '{actual_value}'. Set to X or empty
      via FS00 / Fiori app F2735. Warning: cannot change if open items exist.

  - id: GL013
    field: SKB1.XKRES
    check_class: domain_value_check
    allowed_values: ["X", ""]
    severity: medium
    dimension: validity
    message: "Line item display flag must be X (enabled) or empty (disabled)"
    why_it_matters: >-
      Line item display (XKRES) determines whether individual line items are
      stored and displayable for this account. It is essential for detailed
      account analysis, audit trails, and reconciliation. Enabling it increases
      storage but is strongly recommended for all accounts that require
      detailed review.
    rule_authority: best_practice
    sap_impact: >-
      Account line items cannot be displayed in FBL3N or Fiori app F0710.
      Detailed account analysis and audit trails are unavailable. Account
      reconciliation must be done at summary level only.
    valid_values_with_labels:
      "X": "Line item display enabled — individual items visible in FBL3N"
      "": "Line item display disabled — only totals available"
    fix_map:
      __other__: >-
        Value '{invalid_value}' is not valid. Must be X (enabled) or empty
        (disabled). In ECC: correct via T-code FS00 > Control Data. In S/4HANA:
        use Fiori app F2735.
    record_fix_template: >-
      GL Account {SKA1.SAKNR}: XKRES is '{actual_value}'. Set to X or empty
      via FS00 / Fiori app F2735.


  - id: GL015
    field: SKB1.FDLEV
    check_class: null_check
    severity: low
    dimension: completeness
    message: Planning level missing — required for cash management and forecasting
    why_it_matters: FDLEV (planning level) determines how this account is represented in cash management and liquidity planning
      (FF7A). Without it, postings to this account are excluded from cash position reports, reducing the accuracy of treasury
      forecasting.
    rule_authority: best_practice
    sap_impact: Account excluded from cash management reports in FF7A. Liquidity forecasting is incomplete. Treasury planning
      does not account for flows through this account.
    fix_map:
      __blank__: 'In ECC: assign the planning level via T-code FS00 > Company Code Data. The planning level must be configured
        in cash management (T-code FDFD). In S/4HANA: use Fiori app F2735.'
    record_fix_template: 'GL Account {SKA1.SAKNR}: FDLEV is {actual_value}. Assign the planning level via FS00 / Fiori app F2735.'
    applies_when:
      SKB1.XGKON:
      - X

  - id: GL016
    field: SKB1.XINTB
    check_class: domain_value_check
    allowed_values: ["X", ""]
    severity: medium
    dimension: validity
    message: "Post automatically only flag must be X or empty"
    why_it_matters: >-
      XINTB controls whether the account can only receive postings from
      automatic processes (clearing, tax posting, payment program). When set
      to X, manual postings via FB50/F-02 are blocked, protecting system
      accounts from accidental manual entries.
    rule_authority: best_practice
    sap_impact: >-
      If set incorrectly, users can post manually to system-managed accounts
      (e.g., tax clearing, GR/IR), causing reconciliation issues. If
      incorrectly blocked, legitimate manual postings are rejected.
    valid_values_with_labels:
      "X": "Post automatically only — manual postings blocked"
      "": "Manual postings allowed"
    fix_map:
      __other__: >-
        Value '{invalid_value}' is not valid. Must be X (automatic only) or
        empty (manual allowed). In ECC: correct via T-code FS00 > Control Data.
        In S/4HANA: use Fiori app F2735.
    record_fix_template: >-
      GL Account {SKA1.SAKNR}: XINTB is '{actual_value}'. Set to X or empty
      via FS00 / Fiori app F2735.

  - id: GL017
    field: SKB1.FSTAG
    check_class: null_check
    severity: medium
    dimension: completeness
    message: "Field status group is recommended — controls posting screen layout"
    why_it_matters: >-
      FSTAG (field status group) determines which fields are required, optional,
      or suppressed during posting to this account. Without it, the system uses
      a default field status that may not enforce the required level of detail
      for cost centre, profit centre, or other account assignment objects.
    rule_authority: best_practice
    sap_impact: >-
      Posting screens in FB50/F-02 may not enforce required fields (e.g.,
      cost centre, profit centre). Incomplete postings are accepted, requiring
      manual correction later.
    fix_map:
      __blank__: >-
        In ECC: assign the field status group via T-code FS00 > Company Code
        Data > Control Data. Configure field status groups in T-code OBC4.
        In S/4HANA: use Fiori app F2735.
    record_fix_template: >-
      GL Account {SKA1.SAKNR}: FSTAG is {actual_value}. Assign the field
      status group via FS00 / Fiori app F2735.

  - id: GL018
    field: SKB1.MITKZ
    check_class: domain_value_check
    allowed_values:
    - ''
    - A
    - D
    - K
    - V
    severity: critical
    dimension: validity
    message: Reconciliation account indicator must be blank (not a recon account), D (customer), K (vendor), or A (asset)
    why_it_matters: MITKZ identifies this account as a reconciliation account for a specific sub-ledger. Incorrect values prevent
      the sub-ledger from posting to the GL and break the AP/AR/AA reconciliation process. This is one of the most critical
      fields in the GL master as it links sub-ledger postings to the general ledger.
    rule_authority: sap_hard_constraint
    sap_impact: Sub-ledger postings (AP via MIRO/F-53, AR via VF01/F-28, AA via ABZON) fail if the reconciliation account type
      does not match. Period-end reconciliation between sub-ledger and GL is broken.
    valid_values_with_labels:
      D: Customer reconciliation account (AR sub-ledger)
      K: Vendor reconciliation account (AP sub-ledger)
      A: Asset reconciliation account (AA sub-ledger)
      ? ''
      : Not a reconciliation account
    fix_map:
      __other__: 'Value ''{invalid_value}'' is not valid. Must be D (customer), K (vendor), A (asset), or empty. In ECC: correct
        via T-code FS00 > Control Data. In S/4HANA: use Fiori app F2735.'
    record_fix_template: 'GL Account {SKA1.SAKNR}: MITKZ is ''{actual_value}''. Set to D, K, A, or empty via FS00 / Fiori app
      F2735.'

  - id: GL019
    field: SKA1.XLOEV
    check_class: domain_value_check
    allowed_values: ["X", ""]
    severity: high
    dimension: validity
    message: "Deletion flag must be X (marked) or empty (active)"
    why_it_matters: >-
      XLOEV flags the account for deletion. Accounts marked for deletion
      should not receive new postings and should be excluded from migration.
      However, if they have open balances, deletion is blocked until all
      items are cleared. Incorrect flagging can cause active accounts to be
      excluded from production use.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Accounts flagged for deletion are excluded from account determination
      and may not appear in selection lists for posting transactions. If
      incorrectly flagged, legitimate postings are blocked.
    valid_values_with_labels:
      "X": "Marked for deletion"
      "": "Active — not marked for deletion"
    fix_map:
      __other__: >-
        Value '{invalid_value}' is not valid. Must be X (marked) or empty
        (active). In ECC: correct via T-code FS00. In S/4HANA: use Fiori
        app F2735.
    record_fix_template: >-
      GL Account {SKA1.SAKNR}: XLOEV is '{actual_value}'. Set to X or empty
      via FS00 / Fiori app F2735.

  - id: GL020
    field: SKA1.XSPEA
    check_class: domain_value_check
    allowed_values:
    - X
    - ''
    severity: medium
    dimension: validity
    message: Creation-block flag (SKA1.XSPEA) must be X or empty
    why_it_matters: XSPEA blocks all postings to this account at the chart of accounts level. This is typically used for accounts
      under review or during chart of accounts restructuring. An invalid value causes unpredictable blocking behaviour across
      all company codes using this chart of accounts.
    rule_authority: sap_hard_constraint
    sap_impact: If incorrectly set, all postings to this account are blocked across every company code in this chart of accounts.
      FB50, F-02, and all automatic postings fail.
    valid_values_with_labels:
      X: Blocked for posting at chart of accounts level
      ? ''
      : Open for posting
    fix_map:
      __other__: 'Value ''{invalid_value}'' is not valid. Must be X (blocked) or empty (open). In ECC: correct via T-code FS00
        > Control Data. In S/4HANA: use Fiori app F2735.'
    record_fix_template: 'GL Account {SKA1.SAKNR}: XSPEA is ''{actual_value}''. Set to X or empty via FS00 / Fiori app F2735.'

  - id: GL021
    field: SKA1.XSPEB
    check_class: domain_value_check
    allowed_values:
    - X
    - ''
    severity: medium
    dimension: validity
    message: Posting-block flag (SKA1.XSPEB) must be X or empty
    why_it_matters: XSPEB blocks the account from being used in planning activities. When set, the account cannot be used in
      cost centre planning (KP06), profit centre planning, or any other CO planning transaction. An invalid value causes unpredictable
      planning behaviour.
    rule_authority: sap_hard_constraint
    sap_impact: Planning transactions (KP06, 7KE1) cannot use this account if incorrectly blocked. Budget and forecast data
      for this account cannot be entered.
    valid_values_with_labels:
      X: Blocked for planning
      ? ''
      : Open for planning
    fix_map:
      __other__: 'Value ''{invalid_value}'' is not valid. Must be X (blocked) or empty (open). In ECC: correct via T-code FS00
        > Control Data. In S/4HANA: use Fiori app F2735.'
    record_fix_template: 'GL Account {SKA1.SAKNR}: XSPEB is ''{actual_value}''. Set to X or empty via FS00 / Fiori app F2735.'

  - id: GL022
    field: SKA1.XSPEP
    check_class: domain_value_check
    allowed_values:
    - X
    - ''
    severity: medium
    dimension: validity
    message: Planning-block flag (SKA1.XSPEP) must be X or empty
    why_it_matters: XSPEP blocks the account from receiving P&L adjustment postings. This is used to prevent manual adjustments
      to specific P&L accounts during period-end closing. Incorrect values can block legitimate adjustment postings or allow
      unauthorised adjustments.
    rule_authority: sap_hard_constraint
    sap_impact: P&L adjustment postings to this account are blocked if flag is set. Period-end adjustment entries via FB50 fail
      for this account.
    valid_values_with_labels:
      X: Blocked for P&L adjustment postings
      ? ''
      : Open for P&L adjustment postings
    fix_map:
      __other__: 'Value ''{invalid_value}'' is not valid. Must be X (blocked) or empty (open). In ECC: correct via T-code FS00.
        In S/4HANA: use Fiori app F2735.'
    record_fix_template: 'GL Account {SKA1.SAKNR}: XSPEP is ''{actual_value}''. Set to X or empty via FS00 / Fiori app F2735.'

  - id: GL023
    field: SKB1.ZUAWA
    check_class: null_check
    severity: low
    dimension: completeness
    message: Sort key (SKB1.ZUAWA) missing — the line-item assignment field will not be filled
    why_it_matters: ZUAWA controls the default assignment field used for sorting and filtering in GL line item reports
      (FBL3N). Without it, the sort key defaults to a generic value, making it harder for accountants to find specific
      items during reconciliation and review.
    rule_authority: best_practice
    sap_impact: GL line item reports (FBL3N) use default sort/assignment, reducing the efficiency of account reconciliation
      and review.
    fix_map: {__blank__: 'In ECC: assign the sort key via T-code FS00 > Company Code Data > Control Data. In S/4HANA:
        use Fiori app F2735.'}
    record_fix_template: 'GL Account {SKA1.SAKNR}: ZUAWA is {actual_value}. Assign the sort key via FS00 / Fiori app
      F2735.'

  - id: GL024
    field: SKA1.SAKNR
    check_class: cross_field_check
    severity: critical
    dimension: consistency
    message: Account must be either balance sheet (XBILK=X) or have P&L type (GVTYP filled)
    why_it_matters: Every GL account must be classified as either a balance sheet account (XBILK = X) or a P&L account
      (GVTYP filled). If both are blank, the account has no financial statement classification, which means it will
      be excluded from the financial statement version (FSV) and year-end closing processes. This is a fundamental
      data quality issue that affects all financial reporting.
    rule_authority: sap_hard_constraint
    sap_impact: Account is excluded from financial statement versions (F.01). Year-end closing (F.16) does not process
      the account. Balance carry-forward is indeterminate. All financial reports are incomplete.
    fix_map: {__other__: 'Account is neither a balance sheet account nor a P&L account. In ECC: set XBILK = X for
        balance sheet accounts or fill GVTYP for P&L accounts via T-code FS00 > Type/Description tab. In S/4HANA:
        use Fiori app F2735.'}
    record_fix_template: 'GL Account {SKA1.SAKNR}: neither XBILK nor GVTYP is set. Classify as balance sheet (XBILK=X)
      or P&L (set GVTYP) via FS00 / Fiori app F2735.'
    fail_when: '`SKA1.XBILK`.isna() & `SKA1.GVTYP`.isna()'

  - id: GL025
    field: SKA1.SAKNR
    check_class: uniqueness_check
    fields: [SKA1.KTOPL, SKA1.SAKNR]
    severity: critical
    dimension: uniqueness
    message: Duplicate GL account numbers detected — each account must be unique
    why_it_matters: Duplicate GL account numbers violate the primary key constraint in the chart of accounts. The
      migration program will reject duplicates, and any that slip through cause double-posting and incorrect balances.
      In ECC, this typically indicates a data extraction or consolidation error.
    rule_authority: sap_hard_constraint
    sap_impact: Migration fails on duplicate key insert. Post-migration, duplicate accounts cause incorrect financial
      postings and balance discrepancies across all company codes using this chart of accounts.
    fix_map: {__other__: 'Duplicate GL account number detected. Identify the canonical account and merge or delete
        the duplicate. In ECC: review both records via T-code FS00 and repost transactions if needed. In S/4HANA:
        use Fiori app F2735 to review and correct.'}
    record_fix_template: 'GL Account {SKA1.SAKNR}: duplicate detected. Review and merge via FS00 / Fiori app F2735.
      Repost any transactions from the duplicate account.'



  - id: GL028
    field: SKA1.KTOPL
    check_class: referential_check
    severity: critical
    dimension: consistency
    message: Chart of accounts KTOPL must reference a valid entry in T004
    why_it_matters: KTOPL (chart of accounts) is the authoritative reference for every G/L account in SAP. A KTOPL that isn't
      in T004 means the G/L master cannot be opened (FS00) and no postings can be made against it. For group reporting and consolidation
      (S/4HANA Group Reporting / SAP SEM-BCS), an unknown COA breaks the mapping to the operational/group chart.
    rule_authority: sap_hard_constraint
    sap_impact: G/L account unusable; all FI postings fail; group reporting mapping broken.
    fix_map:
      __blank__: Assign chart of accounts at FS00 creation. Cannot be blank for any G/L master record.
      __other__: Chart of accounts '{invalid_value}' not in T004. Correct via FS00 or configure in SPRO > Financial Accounting
        > G/L Accounting > Master Data > Preparations > Edit Chart of Accounts List (OB13).
    record_fix_template: 'G/L account {SKA1.SAKNR}: chart of accounts ''{actual_value}'' is not in T004.'

  - id: GL029
    field: BKPF.BLART
    check_class: referential_check
    severity: high
    dimension: consistency
    message: Document type BLART must reference a valid entry in T003
    why_it_matters: BLART (FI document type) drives number ranges, account-type control, reversal behaviour, and whether the
      document hits sub-ledger. An invalid BLART on a posted document usually indicates an integration-broken or data-migration
      artefact — the document cannot be displayed (FB03), cannot be reversed (FB08), and breaks line-item reports.
    rule_authority: best_practice
    sap_impact: Document cannot be displayed or reversed. Line-item reports (FBL1N/FBL3N/FBL5N) show broken document-type labels.
    fix_map:
      __blank__: BLART is mandatory at posting. A blank value indicates a corrupt header — engage SAP support to repair.
      __other__: Document type '{invalid_value}' not in T003. Correct via data fix (FI-only — must be done by functional support)
        or configure in SPRO > Financial Accounting > Financial Accounting Global Settings > Document > Document Types (OBA7).
    record_fix_template: 'Document {BKPF.BELNR}: document type ''{actual_value}'' is not in T003.'

  - id: GL030
    field: SKA1.SAKNR
    check_class: null_check
    severity: critical
    dimension: completeness
    message: "G/L account number (SKA1.SAKNR) is mandatory"
    why_it_matters: >-
      SAKNR is the primary key of the G/L account master at chart-of-accounts
      level. Without it the account cannot be identified, opened in FS00, or
      referenced by any FI posting. Every line item in BSEG ties back to SAKNR.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      G/L master record cannot exist. All FI postings (FB50, F-02) and
      period-end closing referencing this account fail.
    fix_map:
      __blank__: >-
        Assign the G/L account number at FS00 creation following the chart-of-
        accounts number range. In S/4HANA use Fiori app F2735 (Manage G/L
        Account Master Data).
    record_fix_template: >-
      G/L Account record: SAKNR is {actual_value}. Assign a valid account
      number via FS00 / Fiori app F2735.

  - id: GL031
    field: SKB1.WAERS
    check_class: null_check
    severity: high
    dimension: completeness
    message: "Account currency (SKB1.WAERS) is mandatory"
    why_it_matters: >-
      WAERS at company-code level (SKB1) defines the account currency for the
      G/L account. Without it, SAP cannot determine the currency for postings,
      blocking line-item entry and breaking currency translation in reporting.
    rule_authority: sap_hard_constraint
    sap_impact: >-
      Company-code segment of the G/L master is incomplete. Postings to this
      account cannot be made and currency translation for reporting fails.
    fix_map:
      __blank__: >-
        Assign account currency via FS00 > Control Data tab at company-code
        level (typically the company-code currency). In S/4HANA use Fiori app
        F2735 (Manage G/L Account Master Data).
    record_fix_template: >-
      G/L Account {SKB1.SAKNR}: account currency WAERS is {actual_value}.
      Assign via FS00 / Fiori app F2735.
  - id: XP2P003
    field: BSEG.MWSKZ
    check_class: cross_field_check
    fail_when: (`BSEG.KOART` == 'S') & `SKB1.MWSKZ`.notna() & `SKB1.XMWNO`.isna() & `BSEG.MWSKZ`.isna()
    severity: high
    dimension: consistency
    message: G/L line posted without a tax code on an account that requires one (SKB1.MWSKZ set, SKB1.XMWNO blank)
    why_it_matters: An account with a tax category (SKB1.MWSKZ) and without 'posting without tax allowed' (SKB1.XMWNO)
      requires a tax code on every line. SAP enforces this at posting, so such lines come from migrated or interface-loaded
      documents and understate the VAT return.
    rule_authority: sap_hard_constraint
    sap_impact: VAT calculation missing; tax reporting incorrect; audit finding.
    fix_map:
      __blank__: Reverse the document (FB08) and re-post with the correct tax code, or correct the account's tax category
        if it was set in error (FS00).
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI}, account {BSEG.HKONT}: tax code missing.'

  - id: XFI001
    field: BSEG.DMBTR
    check_class: balance_check
    grain: BSEG
    group_by: [BSEG.BUKRS, BSEG.BELNR, BSEG.GJAHR]
    amount: BSEG.DMBTR
    sign_field: BSEG.SHKZG
    debit_value: S
    applies_when:
      BKPF.BSTAT: {not_in: [D, M, S, V, W, Z]}   # noted items, samples, recurring originals, parked: no posting
    severity: critical
    dimension: accuracy
    message: Posted FI document does not balance in company-code currency (debits ≠ credits)
    why_it_matters: >-
      SAP only posts a document whose line items net to zero. A posted document that does not balance
      means line items are missing from the extract or were changed outside the posting logic (direct
      table updates, a broken interface, an incomplete archive/reload) — the ledger no longer adds up.
    rule_authority: sap_hard_constraint
    sap_impact: Trial balance and financial statements do not reconcile; the imbalance is invisible in FAGLB03 totals.
    fix_map:
      __other__: Compare the document in FB03 with the extract; if the lines differ, re-extract. If FB03 shows the
        imbalance too, raise it with SAP support (the ledger was changed outside the posting logic).
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} (company code {BSEG.BUKRS}) does not balance.'

  # ── G/L master: internal consistency ─────────────────────────────────────
  - id: GL032
    field: SKA1.GVTYP
    check_class: cross_field_check
    fail_when: (`SKA1.XBILK` == 'X') & `SKA1.GVTYP`.notna()
    severity: high
    dimension: consistency
    message: Balance sheet account (XBILK = X) also carries a P&L statement account type (GVTYP)
    why_it_matters: >-
      An account is either a balance sheet account or a P&L account. The P&L statement account type
      tells year-end closing (F.16 / FAGLGVTR) which retained-earnings account receives the balance;
      on a balance sheet account it is meaningless and FS00 does not allow it. Both set at once comes
      from a migration or a direct table load and leaves the account's classification ambiguous to
      every report that reads one flag but not the other.
    rule_authority: sap_hard_constraint
    sap_impact: Year-end carry-forward and financial statement versions may classify the account
      inconsistently; reconciliation of retained earnings is unreliable.
    fix_map:
      __other__: Decide whether the account is a balance sheet or a P&L account and correct the type in
        FS00 > Type/Description (S/4HANA Fiori app F2735). Clearing XBILK makes it a P&L account; setting
        it removes the P&L statement type.
    record_fix_template: 'G/L account {SKA1.SAKNR}: balance sheet account with P&L statement type ''{actual_value}''.'

  - id: GL033
    field: SKB1.XOPVW
    check_class: cross_field_check
    fail_when: (`SKB1.XOPVW` == 'X')
    applies_when:
      SKB1.MITKZ: [A, D, K, V]
    severity: high
    dimension: consistency
    message: Reconciliation account is managed on an open item basis
    why_it_matters: >-
      The open items of a reconciliation account live in its sub-ledger (customer, vendor, asset,
      contract account). SAP does not allow open item management on a reconciliation account: the
      G/L account is updated only in total by the sub-ledger, so open items on it can never be
      cleared and automatic clearing (F.13) and the regrouping programs mis-handle it.
    rule_authority: sap_hard_constraint
    sap_impact: Line items on the account can never be cleared; open item lists and the AP/AR
      reconciliation (F.03, FAGLF03) show permanent differences.
    fix_map:
      __other__: Remove the open item management flag in FS00 > Control Data (S/4HANA F2735). If line items
        were already posted on the account with the flag set, agree the conversion with SAP support rather
        than editing tables.
    record_fix_template: 'G/L account {SKB1.SAKNR} (company code {SKB1.BUKRS}): reconciliation account
      (type {SKB1.MITKZ}) managed on an open item basis.'

  - id: GL034
    field: SKB1.MITKZ
    check_class: cross_field_check
    grain: SKB1
    fail_when: '`SKA1.SAKNR`.notna() & `SKA1.XBILK`.isna()'
    applies_when:
      SKB1.MITKZ: [A, D, K, V]
    severity: high
    dimension: consistency
    message: Reconciliation account is a P&L account (SKA1.XBILK blank)
    why_it_matters: >-
      A reconciliation account carries the G/L total of open receivables, payables or asset values —
      a balance sheet item by definition. As a P&L account its balance is closed to retained earnings
      at year-end (F.16) while the sub-ledger balances carry forward, so the sub-ledger and the G/L
      stop reconciling from the first year-end.
    rule_authority: sap_hard_constraint
    sap_impact: Sub-ledger and G/L diverge at every year-end; the balance sheet understates receivables,
      payables or fixed assets.
    fix_map:
      __other__: Classify the account as a balance sheet account (FS00 > Type/Description, S/4HANA F2735),
        or remove the reconciliation account type if the account is not a sub-ledger control account.
    record_fix_template: 'G/L account {SKB1.SAKNR} (company code {SKB1.BUKRS}): reconciliation account type
      ''{actual_value}'' on a P&L account.'

  # ── FI documents: fields every posted document carries ─────────────────────
  - id: GL035
    field: BKPF.BUDAT
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Accounting document has no posting date
    why_it_matters: >-
      The posting date decides the fiscal year and period a document updates. SAP cannot post without
      it, so a blank value means the header was loaded or changed outside the posting logic — the
      document is invisible to every period-based report.
    rule_authority: sap_hard_constraint
    sap_impact: Period balances (FAGLB03), the trial balance and every key-date report omit the document.
    fix_map:
      __blank__: Compare the document in FB03 with the extract; re-extract if FB03 shows a posting date,
        otherwise raise the corrupt header with SAP support.
    record_fix_template: 'Document {BKPF.BELNR}/{BKPF.GJAHR} (company code {BKPF.BUKRS}): posting date missing.'

  - id: GL036
    field: BKPF.BLDAT
    check_class: null_check
    severity: high
    dimension: completeness
    message: Accounting document has no document date
    why_it_matters: >-
      The document date (invoice date) is mandatory at posting; it is the default baseline date for
      payment terms and the date tax authorities and auditors match against the source document.
    rule_authority: sap_hard_constraint
    sap_impact: Due-date and cash-discount calculation, tax reporting by invoice date and audit
      sampling lose their reference date.
    fix_map:
      __blank__: Compare the document in FB03 with the extract; re-extract if FB03 shows a document date,
        otherwise raise the corrupt header with SAP support (the field cannot be changed with FB02).
    record_fix_template: 'Document {BKPF.BELNR}/{BKPF.GJAHR} (company code {BKPF.BUKRS}): document date missing.'

  - id: GL037
    field: BKPF.BLART
    check_class: null_check
    severity: high
    dimension: completeness
    message: Accounting document has no document type
    why_it_matters: >-
      The document type controls the number range, the permitted account types and reversal. SAP
      cannot post without it; a blank value is a corrupt or interface-built header.
    rule_authority: sap_hard_constraint
    sap_impact: The document cannot be reversed (FB08) and drops out of every document-type based
      report and authorisation check.
    fix_map:
      __blank__: Compare the document in FB03 with the extract; a blank document type in FB03 must be
        repaired by SAP support.
    record_fix_template: 'Document {BKPF.BELNR}/{BKPF.GJAHR} (company code {BKPF.BUKRS}): document type missing.'

  - id: GL038
    field: BKPF.WAERS
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Accounting document has no document currency
    why_it_matters: >-
      Every amount in document currency (BSEG.WRBTR) is meaningless without the currency key; SAP
      requires it at posting. Foreign currency valuation and open item clearing in document currency
      are impossible.
    rule_authority: sap_hard_constraint
    sap_impact: Foreign currency valuation (FAGL_FCV), clearing and payment in document currency fail.
    fix_map:
      __blank__: Compare the document in FB03 with the extract; a blank currency in FB03 must be repaired
        by SAP support.
    record_fix_template: 'Document {BKPF.BELNR}/{BKPF.GJAHR} (company code {BKPF.BUKRS}): document currency missing.'

  - id: GL039
    field: BKPF.STJAH
    check_class: cross_field_check
    fail_when: '`BKPF.STBLG`.notna() & (`BKPF.STJAH`.isna() | (`BKPF.STJAH` == ''0000''))'
    severity: medium
    dimension: consistency
    message: Reversal document number is set without its fiscal year
    why_it_matters: >-
      A reversal (FB08, MR8M, VF11) writes the reverse document number and its fiscal year to the
      header together; the number alone does not identify a document. A number without a year breaks
      the link between a document and its reversal.
    rule_authority: sap_hard_constraint
    sap_impact: Document flow and reversal reporting cannot find the reversing document; the original
      may be reversed again or counted as still valid.
    fix_map:
      __other__: Look up the reversal in FB03 (Environment > Document flow); re-extract if FB03 shows the
        fiscal year, otherwise raise the inconsistent header with SAP support.
    record_fix_template: 'Document {BKPF.BELNR}/{BKPF.GJAHR}: reversed by {BKPF.STBLG} but the reversal
      fiscal year is missing.'

  # ── FI line items: account assignment by account type ────────────────────
  - id: GL040
    field: BSEG.HKONT
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Line item has no G/L account
    why_it_matters: >-
      Every line item updates a G/L account — for customer, vendor and asset lines it is the
      reconciliation account. A line without one updates no ledger total, so the sub-ledger and the
      G/L stop reconciling.
    rule_authority: sap_hard_constraint
    sap_impact: The trial balance omits the line; sub-ledger to G/L reconciliation (F.03) shows differences.
    fix_map:
      __blank__: Compare the document in FB03 with the extract; re-extract if FB03 shows the account,
        otherwise raise the corrupt line item with SAP support.
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI}: G/L account missing.'

  - id: GL041
    field: BSEG.SHKZG
    check_class: null_check
    severity: critical
    dimension: completeness
    message: Line item has no debit/credit indicator
    why_it_matters: >-
      Line item amounts are stored unsigned; the debit/credit indicator alone decides the sign. A line
      without it cannot be added into any balance and the document cannot be shown to balance.
    rule_authority: sap_hard_constraint
    sap_impact: Balances, the document balance check and every line item report treat the amount with
      an undefined sign.
    fix_map:
      __blank__: Compare the document in FB03 with the extract; re-extract if FB03 shows the line, otherwise
        raise the corrupt line item with SAP support.
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI}: debit/credit indicator missing.'

  - id: GL042
    field: BSEG.BSCHL
    check_class: null_check
    severity: high
    dimension: completeness
    message: Line item has no posting key
    why_it_matters: >-
      The posting key determines the account type, debit/credit and the field status of a line. SAP
      cannot post a line without it; a blank value is an interface- or migration-built line.
    rule_authority: sap_hard_constraint
    sap_impact: Line item reports and payment / dunning selection by posting key skip the line.
    fix_map:
      __blank__: Compare the document in FB03 with the extract; a line without posting key in FB03 must be
        repaired by SAP support.
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI}: posting key missing.'

  - id: GL043
    field: BSEG.LIFNR
    check_class: null_check
    applies_when:
      BSEG.KOART: [K]
    severity: critical
    dimension: completeness
    message: Vendor line item (account type K) has no vendor
    why_it_matters: >-
      A line with account type K is a vendor open item; the vendor number is its account. Without it the
      item belongs to nobody — it cannot be paid (F110), cleared or shown on any vendor account.
    rule_authority: sap_hard_constraint
    sap_impact: The payable is in the G/L reconciliation account but on no vendor account; AP and G/L do
      not reconcile and the liability is never paid.
    fix_map:
      __blank__: Compare the document in FB03 with the extract; re-extract if FB03 shows the vendor,
        otherwise raise the corrupt line item with SAP support.
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI}: vendor line without vendor number.'

  - id: GL044
    field: BSEG.KUNNR
    check_class: null_check
    applies_when:
      BSEG.KOART: [D]
    severity: critical
    dimension: completeness
    message: Customer line item (account type D) has no customer
    why_it_matters: >-
      A line with account type D is a customer open item; the customer number is its account. Without
      it the receivable cannot be dunned, collected, cleared or shown on any customer account.
    rule_authority: sap_hard_constraint
    sap_impact: The receivable is in the G/L reconciliation account but on no customer account; AR and
      G/L do not reconcile and the amount is never collected.
    fix_map:
      __blank__: Compare the document in FB03 with the extract; re-extract if FB03 shows the customer,
        otherwise raise the corrupt line item with SAP support.
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI}: customer line without customer number.'

  - id: GL045
    field: BSEG.ANLN1
    check_class: null_check
    applies_when:
      BSEG.KOART: [A]
    severity: critical
    dimension: completeness
    message: Asset line item (account type A) has no asset number
    why_it_matters: >-
      A line with account type A posts an acquisition, retirement or transfer to a fixed asset; the
      asset number is its account. Without it the asset sub-ledger never receives the value.
    rule_authority: sap_hard_constraint
    sap_impact: The asset reconciliation account and the asset sub-ledger (AW01N, S_ALR_87011963) differ;
      depreciation is never calculated on the value.
    fix_map:
      __blank__: Compare the document in FB03 with the extract; re-extract if FB03 shows the asset,
        otherwise raise the corrupt line item with SAP support.
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI}: asset line without asset number.'

  - id: GL046
    field: BSEG.ANBWA
    check_class: null_check
    applies_when:
      BSEG.KOART: [A]
    severity: high
    dimension: completeness
    message: Asset line item (account type A) has no asset transaction type
    why_it_matters: >-
      The asset transaction type decides whether an asset line is an acquisition, retirement, transfer
      or post-capitalisation, and in which column of the asset history sheet it appears. SAP requires it
      on every asset line.
    rule_authority: sap_hard_constraint
    sap_impact: The asset history sheet (S_ALR_87011990) cannot place the value; depreciation and
      retirement gain/loss are calculated wrongly or not at all.
    fix_map:
      __blank__: Compare the document in FB03 with the extract; re-extract if FB03 shows the transaction
        type, otherwise raise the corrupt line item with SAP support.
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI}: asset {BSEG.ANLN1} posted without
      transaction type.'

  - id: GL047
    field: BSEG.ZFBDT
    check_class: null_check
    applies_when:
      BSEG.KOART: [D, K]
    severity: medium
    dimension: completeness
    message: Customer / vendor line item has no baseline date for payment
    why_it_matters: >-
      The net due date and the cash discount dates of every customer and vendor item are calculated
      from the baseline date. SAP fills it on every customer and vendor line at posting; without it the
      item has no due date.
    rule_authority: sap_hard_constraint
    sap_impact: The payment run (F110) and dunning (F150) cannot determine when the item is due; ageing
      reports (S_ALR_87012078 / 87012168) put it in the wrong bucket.
    fix_map:
      __blank__: Set the baseline date in FB02 (vendor/customer line > Baseline date) where the field is
        changeable; otherwise reverse and re-post the document.
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI}: baseline date for payment missing.'

  - id: GL048
    field: BSEG.AUGBL
    check_class: cross_field_check
    fail_when: (`BSEG.AUGBL`.notna() & `BSEG.AUGDT`.isna()) | (`BSEG.AUGDT`.notna() & `BSEG.AUGBL`.isna())
    severity: high
    dimension: consistency
    message: Line item clearing document and clearing date are not set together
    why_it_matters: >-
      Clearing writes the clearing document number and the clearing date to an item in one step, and
      resetting the clearing (FBRA) removes both. One without the other means the item is neither
      reliably open nor cleared.
    rule_authority: sap_hard_constraint
    sap_impact: Open item lists at a key date (FBL1N/FBL3N/FBL5N), the payment run and ageing reports
      treat the item inconsistently.
    fix_map:
      __other__: Display the item in FB03 (Environment > Document flow). Re-extract if FB03 is consistent;
        otherwise raise the inconsistent clearing with SAP support (do not reset it by table update).
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI}: clearing document ''{actual_value}''
      without matching clearing date (or the reverse).'

  - id: GL049
    field: BSEG.AUGDT
    check_class: cross_field_check
    grain: BSEG
    fail_when: (`BSEG.AUGDT` < `BKPF.BUDAT`)
    severity: medium
    dimension: consistency
    message: Line item was cleared before it was posted (clearing date before posting date)
    why_it_matters: >-
      An item can only be cleared on or after its own posting date; SAP rejects an earlier clearing
      date. An item cleared before it was posted is never open at any key date, so key-date open item
      lists and ageing reports never show it.
    rule_authority: sap_hard_constraint
    sap_impact: Key-date open item reports and balance confirmations disagree with the account balance.
    fix_map:
      __other__: Reset the clearing (FBRA) and clear again with a clearing date on or after the posting
        date; if FBRA is not possible, raise the item with SAP support.
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI}: cleared on {BSEG.AUGDT}, before
      its posting date {BKPF.BUDAT}.'

  # ── FI line items: consistency with the G/L account master ──────────────
  - id: GL050
    field: BSEG.HKONT
    check_class: cross_field_check
    grain: BSEG
    fail_when: >-
      `SKB1.SAKNR`.notna() & (((`BSEG.KOART` == 'K') & (`SKB1.MITKZ`.fillna('') != 'K'))
      | ((`BSEG.KOART` == 'D') & (`SKB1.MITKZ`.fillna('') != 'D'))
      | ((`BSEG.KOART` == 'A') & (`SKB1.MITKZ`.fillna('') != 'A')))
    severity: critical
    dimension: consistency
    message: Customer, vendor or asset line posted to a G/L account that is not a reconciliation account of that type
    why_it_matters: >-
      A customer (D), vendor (K) or asset (A) line updates the G/L through the reconciliation account of
      the same type. SAP determines that account from the master record and never posts the line
      elsewhere; a mismatch means the line or the account's reconciliation type was changed outside
      the posting logic.
    rule_authority: sap_hard_constraint
    sap_impact: Sub-ledger and G/L no longer reconcile (F.03, FAGLF03); the balance sheet shows the
      receivable, payable or asset on the wrong line.
    fix_map:
      __other__: Check the reconciliation account in the customer/vendor/asset class master and the
        account's reconciliation type in FS00; correct the master and repost through the sub-ledger.
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI}: account type {BSEG.KOART} posted
      to G/L account {BSEG.HKONT} with reconciliation type ''{SKB1.MITKZ}''.'

  - id: GL051
    field: BSEG.HKONT
    check_class: cross_field_check
    grain: BSEG
    fail_when: (`BSEG.KOART` == 'S') & ((`SKB1.MITKZ` == 'D') | (`SKB1.MITKZ` == 'K'))
    severity: critical
    dimension: consistency
    message: G/L line posted directly to a customer or vendor reconciliation account
    why_it_matters: >-
      A customer or vendor reconciliation account may only be updated through its sub-ledger; SAP
      rejects direct G/L postings to it. A G/L line on such an account puts an amount into the
      receivables or payables total that no customer or vendor account contains.
    rule_authority: sap_hard_constraint
    sap_impact: AR/AP sub-ledger and G/L do not reconcile; the difference cannot be cleared or paid.
    fix_map:
      __other__: Reverse the document (FB08) and post the amount through the customer or vendor account,
        or to a G/L clearing account that is not a reconciliation account.
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI}: G/L posting to reconciliation
      account {BSEG.HKONT} (type {SKB1.MITKZ}).'

  - id: GL052
    field: BSEG.HKONT
    check_class: cross_field_check
    grain: BSEG
    fail_when: (`SKB1.WAERS` != `BKPF.HWAER`) & (`BKPF.WAERS` != `SKB1.WAERS`)
    applies_when:
      BSEG.KOART: [S]
      SKB1.WAERS: {populated: true}
    severity: high
    dimension: consistency
    message: G/L account kept in a foreign currency was posted in a different currency
    why_it_matters: >-
      An account whose currency differs from the company code currency (a foreign currency bank
      account, for example) may only be posted in that currency — SAP enforces it so that the account
      balance in account currency stays complete. A posting in another currency leaves the balance in
      account currency wrong.
    rule_authority: sap_hard_constraint
    sap_impact: The account balance in account currency no longer matches the bank statement;
      foreign currency valuation (FAGL_FCV) revalues a wrong balance.
    fix_map:
      __other__: Reverse the document (FB08) and post it in the account currency, or use an account kept in
        company code currency for postings in other currencies.
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI}: account {BSEG.HKONT} (currency
      {SKB1.WAERS}) posted in {BKPF.WAERS}.'

  - id: GL053
    field: BSEG.MWSKZ
    check_class: cross_field_check
    grain: BSEG
    fail_when: '`BSEG.MWSKZ` != `SKB1.MWSKZ`'
    applies_when:
      BSEG.KOART: [S]
      BSEG.MWSKZ: {populated: true}
      SKB1.MWSKZ: {populated: true, not_in: ['*', '<', '>', '+', '-']}
    severity: high
    dimension: consistency
    message: G/L line uses a tax code other than the one its account allows
    why_it_matters: >-
      When an account's tax category is a specific tax code (rather than '<', '>', '-', '+' or '*'),
      SAP accepts only that tax code on the account. Another code on the line means the document was
      loaded or changed outside the posting checks, and the VAT return reports it under the wrong code.
    rule_authority: sap_hard_constraint
    sap_impact: Tax is reported under the wrong code in the VAT return (S_ALR_87012357); input tax may be
      claimed or output tax declared at the wrong rate.
    fix_map:
      __other__: Reverse the document (FB08) and re-post with the account's tax code, or correct the
        account's tax category (FS00 > Control Data) if it no longer reflects the business.
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI}: tax code ''{actual_value}'' on
      account {BSEG.HKONT}, which only allows ''{SKB1.MWSKZ}''.'

  # ── FI line items: amounts ───────────────────────────────────────────────
  - id: GL054
    field: BSEG.WRBTR
    check_class: cross_field_check
    grain: BSEG
    fail_when: (`BKPF.WAERS` == `BKPF.HWAER`) & (`BSEG.DMBTR` != `BSEG.WRBTR`)
    severity: high
    dimension: accuracy
    message: Document in company code currency, but the line's local and document currency amounts differ
    why_it_matters: >-
      When the document currency is the company code currency, SAP stores the same amount in both
      amount fields of every line. Different amounts mean one of them was changed or loaded wrongly —
      reports in document currency and in local currency then disagree.
    rule_authority: sap_hard_constraint
    sap_impact: Balances in transaction currency and local currency differ for the same account;
      open item clearing in document currency leaves residuals.
    fix_map:
      __other__: Compare the document in FB03 with the extract; re-extract if FB03 shows equal amounts,
        otherwise reverse and re-post the document.
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI}: local amount {BSEG.DMBTR} but
      document amount {BSEG.WRBTR} in the same currency {BKPF.WAERS}.'

  - id: GL058
    field: BSEG.WRBTR
    check_class: balance_check
    grain: BSEG
    group_by: [BSEG.BUKRS, BSEG.BELNR, BSEG.GJAHR]
    amount: BSEG.WRBTR
    sign_field: BSEG.SHKZG
    debit_value: S
    tolerance: 0.01
    applies_when:
      BKPF.BSTAT: {not_in: [D, M, S, V, W, Z]}
    severity: critical
    dimension: accuracy
    message: Posted FI document does not balance in document currency (debits ≠ credits in WRBTR)
    why_it_matters: >-
      SAP posts a document only when its lines net to zero in document currency and in company-code
      currency. A document that balances in DMBTR but not in WRBTR has lines that were changed or lost
      outside the posting logic, so foreign-currency valuation and open-item clearing will be wrong.
    rule_authority: sap_hard_constraint
    sap_impact: Foreign-currency valuation (FAGL_FCV / F.05) and clearing in document currency produce wrong differences.
    fix_map:
      __other__: Compare the document in FB03 (S/4 Manage Journal Entries F0717) with the extract; re-extract if they differ, otherwise raise with SAP support.
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} (company code {BSEG.BUKRS}) does not balance in document currency.'

  - id: GL057
    field: SKB1.XKRES
    check_class: cross_field_check
    grain: SKB1
    fail_when: (`SKB1.XOPVW` == 'X') & `SKB1.XKRES`.isna()
    severity: high
    dimension: consistency
    message: G/L account is managed on an open-item basis but line-item display is off
    why_it_matters: >-
      Open-item management relies on individual line items being available for clearing (F.13,
      F-03) and for open-item lists (FBL3N). In ECC, line-item display is a separate switch. Leaving
      it off on an OI-managed account makes the open items invisible in standard reports.
    rule_authority: sap_hard_constraint
    sap_impact: FBL3N cannot list the open items; automatic clearing and GR/IR analysis fail on the account.
    fix_map:
      __blank__: 'Set "Line item display" in FS00 > Control data and run RFSEPA01 to build the line-item index (S/4: always on, F0731 Manage G/L Account Master Data).'
    record_fix_template: 'GL Account {SKB1.SAKNR} in company code {SKB1.BUKRS}: open-item managed without line-item display.'

  - id: GL060
    field: BKPF.BUDAT
    check_class: cross_field_check
    grain: BKPF
    fail_when: (`BKPF.CPUDT` - `BKPF.BUDAT`).dt.days > 45
    require_populated: true
    applies_when:
      BKPF.BSTAT: {not_in: [D, M, S, V, W, Z]}
      BKPF.MONAT: {not_in: ['13', '14', '15', '16']}
    severity: medium
    dimension: timeliness
    message: Journal entry posted more than 45 days before it was entered (backdated)
    why_it_matters: >-
      Auditors test journals entered long after their posting date, because that is how results get
      adjusted after the period closed. A large gap between entry date (CPUDT) and posting date (BUDAT)
      means the posting-period controls (OB52) were open far longer than the close calendar allows.
    rule_authority: regulatory
    sap_impact: Closed-period figures change after reporting; OB52 period controls are not effective.
    fix_map:
      __other__: Review the document (FB03 / S/4 F0717) and its approval; tighten OB52 period opening to the close calendar.
    record_fix_template: 'Document {BKPF.BELNR}/{BKPF.GJAHR} (company code {BKPF.BUKRS}) entered {BKPF.CPUDT}, posted to {BKPF.BUDAT}.'

  - id: GL061
    field: BKPF.BUDAT
    check_class: cross_field_check
    grain: BKPF
    fail_when: (`BKPF.BUDAT` - `BKPF.CPUDT`).dt.days > 31
    require_populated: true
    applies_when:
      BKPF.BSTAT: {not_in: [D, M, S, V, W, Z]}
    severity: medium
    dimension: timeliness
    message: Journal entry posted more than 31 days after it was entered (forward-dated)
    why_it_matters: >-
      A posting date well after the entry date moves the amount into a later period than the one it was
      entered in. Auditors test these journals alongside backdated ones, because shifting income or cost
      into a future period is a known way to manage results. It also means future posting periods were
      opened in OB52 earlier than the close calendar needs.
    rule_authority: regulatory
    sap_impact: The current period's figures miss the amount; the future period opens with postings nobody expects.
    fix_map:
      __other__: Review the document (FB03 / S/4 F0717) and why it was dated ahead; keep future periods closed in OB52 until the close calendar opens them.
    record_fix_template: 'Document {BKPF.BELNR}/{BKPF.GJAHR} (company code {BKPF.BUKRS}) entered {BKPF.CPUDT}, posted to {BKPF.BUDAT}.'

  - id: GL062
    field: BKPF.BKTXT
    check_class: cross_field_check
    grain: BKPF
    fail_when: '`BKPF.BKTXT`.isna() & `BKPF.XBLNR`.isna()'
    applies_when:
      BKPF.AWTYP: [BKPF]
      BKPF.BSTAT: {not_in: [D, M, S, V, W, Z]}
    severity: low
    dimension: completeness
    message: Manual journal entry has neither a header text nor a reference
    why_it_matters: >-
      A journal keyed directly in FI (FB01, FB50, F-02) carries no source document from another module,
      so its header text and reference are the only record of why it was posted. Auditors sample manual
      journals first; one with neither field filled cannot be explained without asking the person who posted it.
    rule_authority: best_practice
    sap_impact: The journal cannot be traced to a reason or supporting document in FB03, line-item reports or the audit file.
    fix_map:
      __other__: Add a header text or reference in FB02 (both fields can be changed after posting); make one of them required for manual document types in OBA7 / the field status of the posting key.
    record_fix_template: 'Document {BKPF.BELNR}/{BKPF.GJAHR} (company code {BKPF.BUKRS}, type {BKPF.BLART}) posted by {BKPF.USNAM} has no header text or reference.'

  - id: GL063
    field: BKPF.CPUDT
    check_class: cross_field_check
    grain: BKPF
    fail_when: '`BKPF.CPUDT`.dt.dayofweek >= 5'
    require_populated: true
    applies_when:
      BKPF.AWTYP: [BKPF]
      BKPF.BSTAT: {not_in: [D, M, S, V, W, Z]}
    severity: low
    dimension: validity
    message: Manual journal entry was entered on a weekend
    why_it_matters: >-
      Journal-entry testing under ISA 240 and PCAOB AS 2401 looks for manual journals entered outside
      normal working days, because entries made when reviewers are absent carry a higher risk of error or
      override. Most weekend entries have an ordinary reason (period close, a system cut-over); the point
      is that someone can name it.
    rule_authority: regulatory
    sap_impact: None in SAP itself; the entry is selected for audit sampling and needs a documented reason.
    fix_map:
      __other__: Review the document in FB03 (S/4 F0717) and record why it was entered on a weekend; if weekend entries are routine at close, document that in the close calendar.
    record_fix_template: 'Document {BKPF.BELNR}/{BKPF.GJAHR} (company code {BKPF.BUKRS}) entered {BKPF.CPUDT} by {BKPF.USNAM}.'

  - id: GL064
    field: BSEG.DMBTR
    check_class: cross_field_check
    grain: BSEG
    fail_when: (`BSEG.DMBTR` >= 10000) & (`BSEG.DMBTR` % 1000 == 0)
    require_populated: true
    applies_when:
      BKPF.AWTYP: [BKPF]
      BKPF.BSTAT: {not_in: [D, M, S, V, W, Z]}
      BSEG.SHKZG: [S]
    severity: low
    dimension: validity
    message: Manual journal line is a large round amount
    why_it_matters: >-
      Real transactions rarely land on exact thousands. Journal-entry testing under ISA 240 and PCAOB
      AS 2401 selects large round-amount manual journals because estimates, top-side adjustments and
      plugs tend to look like this. Many have a good reason (accruals, provisions, loan drawdowns);
      the reason should be on record. Only the debit side is counted so each journal is flagged once per line pair.
    rule_authority: regulatory
    sap_impact: None in SAP itself; the line is selected for audit sampling and needs a documented basis.
    fix_map:
      __other__: Review the document in FB03 (S/4 F0717) and attach or reference the calculation behind the amount.
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI} (company code {BSEG.BUKRS}, account {BSEG.HKONT}): {BSEG.DMBTR}.'

  - id: GL065
    field: BKPF.CPUTM
    check_class: cross_field_check
    grain: BKPF
    fail_when: (`BKPF.CPUTM` >= '200000') | (`BKPF.CPUTM` < '060000')
    require_populated: true
    applies_when:
      BKPF.AWTYP: [BKPF]
      BKPF.BSTAT: {not_in: [D, M, S, V, W, Z]}
    severity: low
    dimension: validity
    message: Manual journal entry was entered between 20:00 and 06:00
    why_it_matters: >-
      Journal-entry testing under ISA 240 and PCAOB AS 2401 selects manual journals entered outside
      business hours, alongside weekend entries (GL063). Batch jobs and interfaces post overnight, but
      a person keying a journal at night is unusual and should have a reason on record. The time is the
      application server time SAP stamps on entry.
    rule_authority: regulatory
    sap_impact: None in SAP itself; the entry is selected for audit sampling and needs a documented reason.
    fix_map:
      __other__: Review the document in FB03 (S/4 F0717) and record why it was entered out of hours; if the user is a batch or interface user, exclude it from manual journal populations.
    record_fix_template: 'Document {BKPF.BELNR}/{BKPF.GJAHR} (company code {BKPF.BUKRS}) entered {BKPF.CPUDT} {BKPF.CPUTM} by {BKPF.USNAM}.'

  - id: GL066
    field: BKPF.BLDAT
    check_class: cross_field_check
    grain: BKPF
    fail_when: (`BKPF.BLDAT` - `BKPF.BUDAT`).dt.days > 0
    require_populated: true
    applies_when:
      BKPF.BSTAT: {not_in: [D, M, S, V, W, Z]}
    severity: low
    dimension: validity
    message: Document date is later than the posting date
    why_it_matters: >-
      The document date is the date of the source document, such as an invoice. A posting dated before
      its source document records a transaction that had not yet happened. SAP allows it, so it usually
      means a keying error, a back-dated posting or an invoice booked ahead of receipt. Auditors test it
      as a cut-off exception.
    rule_authority: best_practice
    sap_impact: Payment terms that use the document date as baseline give a due date after the posting;
      period-end cut-off and accrual reviews treat the posting as belonging to the wrong period.
    fix_map:
      __other__: Check the source document in FB03 (S/4 F0717); if the posting date is wrong, reverse with
        FB08 and repost in the correct period, otherwise record why the source document is dated later.
    record_fix_template: 'Document {BKPF.BELNR}/{BKPF.GJAHR} (company code {BKPF.BUKRS}): document date {BKPF.BLDAT} after posting date {BKPF.BUDAT}.'

  - id: GL067
    field: BKPF.MONAT
    check_class: cross_field_check
    grain: BKPF
    fail_when: (`BKPF.MONAT` >= '13')
    require_populated: true
    applies_when:
      BKPF.AWTYP: [BKPF]
      BKPF.BSTAT: {not_in: [D, M, S, V, W, Z]}
    severity: low
    dimension: validity
    message: Manual journal entry was posted to a special period (13-16)
    why_it_matters: >-
      Special periods hold year-end closing and audit adjustments made after the last regular period.
      Journal-entry testing under ISA 240 and PCAOB AS 2401 selects these postings, because they change
      the annual result without passing through a regular month. Each one should have an approved reason.
    rule_authority: regulatory
    sap_impact: None in SAP itself; the entry changes the annual figures and is selected for audit sampling.
    fix_map:
      __other__: Review the document in FB03 (S/4 F0717) and its approval; confirm it belongs in the year-end
        close and that OB52 opens the special periods only during the close.
    record_fix_template: 'Document {BKPF.BELNR}/{BKPF.GJAHR} (company code {BKPF.BUKRS}) posted to period {BKPF.MONAT} by {BKPF.USNAM}.'

  - id: GL059
    field: BSEG.HKONT
    check_class: cross_field_check
    grain: BSEG
    fail_when: (`SKB1.XSPEB` == 'X') | (`SKB1.XLOEB` == 'X')
    applies_when:
      BKPF.BSTAT: {not_in: [D, M, S, V, W, Z]}
    severity: medium
    dimension: consistency
    message: Recent posting to a G/L account that is blocked for posting or flagged for deletion
    why_it_matters: >-
      A blocked or deletion-flagged account should receive no postings. Postings in the current
      window mean the account was blocked too late (balances not moved), unblocked temporarily without
      control, or reached through a direct update. Its balance then falls outside the chart of
      accounts governance.
    rule_authority: best_practice
    sap_impact: Balance on an account excluded from planning/reporting; archiving of the account blocked.
    fix_map:
      __other__: Check change history (FS04 / S/4 F0731); repost to the active account and transfer the balance before blocking.
    record_fix_template: 'Document {BSEG.BELNR}/{BSEG.GJAHR} line {BSEG.BUZEI} posts to blocked/deleted account {BSEG.HKONT} (company code {BSEG.BUKRS}).'

  - id: GL056
    field: SKB1.XMITK
    check_class: cross_field_check
    grain: SKB1
    fail_when: '`SKB1.XMITK` == ''X'''
    applies_when:
      SKB1.MITKZ: [D, K, A]
    severity: medium
    dimension: consistency
    message: Reconciliation account is open for direct input
    why_it_matters: >-
      Reconciliation accounts are posted only through their sub-ledger. Making them ready for input
      lets users post to the G/L account directly, so the G/L balance and the AP/AR/AA sub-ledger
      drift apart.
    rule_authority: sap_hard_constraint
    sap_impact: Sub-ledger to G/L reconciliation (F.03 / FAGLF03) shows differences.
    fix_map:
      __other__: Clear "Recon. account ready for input" in FS00 > Create/bank/interest (S/4 F0731), after confirming no migration is running.
    record_fix_template: 'GL Account {SKB1.SAKNR} in company code {SKB1.BUKRS}: reconciliation account ({SKB1.MITKZ}) is open for input.'
  - id: GL200
    field: SKA1.XLOEV
    check_class: cross_field_check
    fail_when: (`SKA1.XLOEV` == 'X') & `SKA1.XSPEB`.isna()
    severity: medium
    dimension: consistency
    message: G/L account flagged for deletion in the chart of accounts but not blocked for posting
    why_it_matters: The deletion flag only marks the account for archiving. Postings are stopped only by the posting block,
      so a deleted account without the block still accepts postings in every company code.
    rule_authority: best_practice
    sap_impact: Documents keep landing on a retired account and archiving of the account fails.
    fix_map:
      __other__: Set the posting block in the chart of accounts segment (FS00 > Block) together with the deletion flag.
    record_fix_template: 'G/L account {SKA1.SAKNR} (chart {SKA1.KTOPL}): flagged for deletion but not blocked for posting.'
  - id: GL201
    field: SKB1.XLOEB
    check_class: cross_field_check
    fail_when: (`SKB1.XLOEB` == 'X') & `SKB1.XSPEB`.isna()
    severity: medium
    dimension: consistency
    message: G/L account flagged for deletion in the company code but not blocked for posting
    why_it_matters: The company-code deletion flag only marks the segment for archiving. Without the company-code posting block
      the account still accepts postings.
    rule_authority: best_practice
    sap_impact: Documents keep landing on a retired account and archiving of the company-code segment fails.
    fix_map:
      __other__: Set the company-code posting block (FS00 > Block) together with the deletion flag.
    record_fix_template: 'G/L account {SKB1.SAKNR} in company code {SKB1.BUKRS}: flagged for deletion but not blocked for posting.'
  - id: GL203
    field: SKB1.XOPVW
    check_class: cross_field_check
    fail_when: (`SKB1.XOPVW` == 'X') & `SKA1.SAKNR`.notna() & `SKA1.XBILK`.isna()
    severity: medium
    dimension: consistency
    message: Profit and loss account is managed on an open item basis
    why_it_matters: Open item management is meant for balance-sheet clearing accounts (GR/IR, bank clearing, salaries payable).
      On a P&L account the balance is carried forward to retained earnings at year end while the items stay open, so they can
      never be cleared against the new year's balance.
    rule_authority: best_practice
    sap_impact: Open item lists of the account grow forever; automatic clearing finds nothing to clear against.
    fix_map:
      __other__: Remove open item management from the P&L account once its open items are cleared (FS00 > Control data); move
        genuine clearing postings to a balance-sheet clearing account.
    record_fix_template: 'G/L account {SKB1.SAKNR} in company code {SKB1.BUKRS}: P&L account managed on an open item basis.'
  - id: GL204
    field: SKB1.XGKON
    check_class: cross_field_check
    fail_when: (`SKB1.XGKON` == 'X') & `SKA1.SAKNR`.notna() & `SKA1.XBILK`.isna()
    severity: medium
    dimension: consistency
    message: Profit and loss account is flagged as relevant to cash flow
    why_it_matters: The cash-relevant flag (XGKON) marks bank and cash accounts for the cash flow statement and cash management.
      A P&L account with the flag puts expense and revenue postings into cash reporting.
    rule_authority: best_practice
    sap_impact: The cash position and the direct cash flow statement include non-cash P&L postings.
    fix_map:
      __other__: Remove the 'relevant to cash flow' flag from the P&L account (FS00 > Create/bank/interest).
    record_fix_template: 'G/L account {SKB1.SAKNR} in company code {SKB1.BUKRS}: P&L account flagged as cash relevant.'
  - id: GL205
    field: SKB1.XKRES
    check_class: cross_field_check
    fail_when: (`SKB1.XKRES` == 'X')
    applies_when:
      SKB1.MITKZ:
      - A
      - D
      - K
    severity: low
    dimension: consistency
    message: Reconciliation account has line item display switched on
    why_it_matters: The line items of a reconciliation account are displayed in the sub-ledger (FBL1N, FBL5N, AW01N). SAP recommends
      switching line item display off on reconciliation accounts because it duplicates every sub-ledger line in the G/L index
      tables.
    rule_authority: best_practice
    sap_impact: Large secondary index tables (BSIS/BSAS) and slower period-end processing without any reporting benefit.
    fix_map:
      __other__: Switch off line item display on the reconciliation account (FS00) and reorganise the index (RFSEPA02).
    record_fix_template: 'G/L account {SKB1.SAKNR} in company code {SKB1.BUKRS}: reconciliation account ({SKB1.MITKZ}) with
      line item display.'
  - id: GL206
    field: SKB1.XLOEB
    check_class: cross_field_check
    fail_when: (`SKA1.XLOEV` == 'X') & `SKB1.XLOEB`.isna()
    severity: low
    dimension: consistency
    message: G/L account is deleted in the chart of accounts but still active in a company code
    why_it_matters: An account retired at chart-of-accounts level should be retired in every company code that uses it. A live
      company-code segment means one entity still uses an account the group has retired.
    rule_authority: best_practice
    sap_impact: Group reporting maps postings to an account that no longer exists in the group chart.
    fix_map:
      __other__: Flag the company-code segment for deletion and block it (FS00), or remove the chart-level deletion flag.
    record_fix_template: 'G/L account {SKB1.SAKNR} in company code {SKB1.BUKRS}: deleted in the chart of accounts but active
      here.'

  - id: S4-CE-PRIMARY-GL
    field: CSKB.KSTAR
    fields:
    - TKA01.KTOPL
    - CSKB.KSTAR
    check_class: exists_check
    grain: CSKB
    applies_when:
      CSKB.KATYP: ['01', '03', '04', '11', '12', '22', '90']
    target_table: SKA1
    target_fields:
    - KTOPL
    - SAKNR
    baseline: s4_target
    severity: high
    dimension: consistency
    message: 'S/4HANA readiness: primary cost element has no G/L account in the chart of accounts of its controlling area -
      simplification item S4TWL Cost Elements, SAP Note 2270419'
    why_it_matters: In S/4HANA cost elements are G/L accounts; CSKB is no longer maintained. Every primary cost element
      becomes the cost element category of the G/L account with the same number in the chart of accounts of the
      controlling area, so a primary cost element without that G/L account has nothing to migrate into.
    rule_authority: sap_hard_constraint
    sap_impact: The cost element migration of the S/4HANA conversion cannot carry the cost element over; postings to it
      have no G/L account after the conversion.
    fix_map:
      __other__: Create the G/L account in the chart of accounts of the controlling area (FSP0) or delete the unused
        primary cost element (KA04) before the conversion.
    record_fix_template: 'Cost element {CSKB.KSTAR} in controlling area {CSKB.KOKRS}: no G/L account {CSKB.KSTAR} in chart
      of accounts {TKA01.KTOPL}.'

