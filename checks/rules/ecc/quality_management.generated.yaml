  why_it_matters: Domain PS_CHANCE fixes the permitted values of CHANCE (Chance of Completing a Claim) in the SAP Data Dictionary.
    Any other non-blank value is outside SAP's own domain definition and is read inconsistently by the programs that consume
    the field.
  rule_authority: sap_hard_constraint
  sap_impact: CHANCE will not evaluate correctly wherever SAP branches on its value.
  allowed_values:
  - '01'
