module: asset_accounting
target_state: ECC_AND_S4HANA
rules:
- id: AA001
  field: ANLA.ANLN1
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Asset number is mandatory \u2014 primary key for all asset accounting transactions"
  why_it_matters: ANLN1 is the main asset number and the primary key for all asset accounting records. Without it, no depreciation
    can be calculated, no asset transactions (acquisitions, retirements, transfers) can be posted, and the asset cannot be
    included in the asset register.
  rule_authority: sap_hard_constraint
  sap_impact: Asset cannot be processed in any AA transaction. Depreciation run AFAB skips the record. Asset explorer (AW01N)
    cannot display it.
  fix_map:
    __blank__: 'Asset number is empty. In ECC: assign a valid asset number via transaction AS01 (create asset) or investigate
      the data source. In S/4HANA: use Fiori app F2747 (Manage Fixed Asset) or AS01. For bulk creation use LSMW.'
  record_fix_template: 'Asset {ANLA.ANLN1}: ANLN1 is {actual_value}. Assign a valid asset number via AS01 (ECC) or Fiori app
    F2747 (S/4HANA).'
- id: AA002
  field: ANLA.ANLN1
  check_class: regex_check
  pattern: ^[0-9]{1,12}$
  severity: high
  dimension: validity
  message: Asset number must be numeric, up to 12 digits
  why_it_matters: SAP asset numbers must be numeric and up to 12 digits. Non-numeric or oversized values indicate data corruption
    or incorrect data loading. Such values cannot be referenced in asset transactions (ABZON, ABAVN, ABUMN) or by the depreciation
    run (AFAB).
  rule_authority: sap_hard_constraint
  sap_impact: Asset transactions fail. AFAB depreciation run cannot process the asset. AW01N asset explorer cannot display
    the record.
  fix_map:
    __other__: 'Asset number ''{invalid_value}'' does not match the required numeric format (up to 12 digits). In ECC: recreate
      the asset via AS01. In S/4HANA: use Fiori app F2747. Verify number range configuration in AS08.'
  record_fix_template: 'Asset {ANLA.ANLN1}: ANLN1 ''{actual_value}'' is not valid. Must be numeric, up to 12 digits. Recreate
    via AS01 or Fiori app F2747.'
- id: AA003
  field: ANLA.ANLKL
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Asset class is mandatory \u2014 controls depreciation area and account determination"
  why_it_matters: ANLKL (asset class) is the central classification field in asset accounting. It determines which depreciation
    areas are active, which GL accounts receive depreciation and acquisition postings, and which screen layout is used. Without
    it, no asset accounting transaction can be processed.
  rule_authority: sap_hard_constraint
  sap_impact: "Depreciation cannot be calculated. All AA transactions blocked \u2014 acquisitions (ABZON), retirements (ABAVN),\
    \ and transfers (ABUMN) all fail. Account determination cannot resolve GL accounts for posting."
  fix_map:
    __blank__: 'Asset class is empty. In ECC: determine the correct asset class from the asset type and set via AS02 > General
      tab. In S/4HANA: use Fiori app F2747. Common classes: 1000 (buildings), 2000 (plant/machinery), 3000 (vehicles), 4000
      (IT equipment).'
  record_fix_template: 'Asset {ANLA.ANLN1}: ANLKL is {actual_value}. Assign the correct asset class via AS02 (ECC) or Fiori
    app F2747 (S/4HANA).'
- id: AA004
  field: ANLA.BUKRS
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Company code is mandatory \u2014 determines depreciation area and fiscal year variant"
  why_it_matters: BUKRS (company code) is a mandatory organisational assignment for every asset. It determines which depreciation
    areas are active, which fiscal year variant applies, and which GL accounts receive postings. Without it, the asset has
    no organisational context and cannot appear in financial statements.
  rule_authority: sap_hard_constraint
  sap_impact: Asset has no organisational assignment. Depreciation run AFAB cannot process it. No GL postings can be generated.
    The asset is orphaned from the financial statements.
  fix_map:
    __blank__: 'Company code is empty. In ECC: assign the correct company code based on the legal entity that owns the asset
      via AS02 > General tab. In S/4HANA: use Fiori app F2747.'
  record_fix_template: 'Asset {ANLA.ANLN1}: BUKRS is {actual_value}. Assign the correct company code via AS02 (ECC) or Fiori
    app F2747 (S/4HANA).'
- id: AA005
  field: ANLB.AFASL
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Depreciation key is mandatory — determines depreciation method and rates
  why_it_matters: AFASL (depreciation key) is the most critical field in asset accounting. It determines exactly how the asset
    is depreciated — which method, which rates, over what period. Missing means no depreciation is posted and the asset will
    remain at full book value indefinitely, overstating the financial statements.
  rule_authority: sap_hard_constraint
  sap_impact: No depreciation posted for this asset. Financial statements show overstated asset value. Period-end AFAB depreciation
    run excludes this asset.
  fix_map:
    __blank__: 'Depreciation key is empty. In ECC: determine the correct depreciation method from the asset class defaults
      or accounting policy and set via AS02 > Depreciation Areas tab. In S/4HANA: use Fiori app F2747. Common keys: LINA (straight-line),
      DEGR (declining balance), 0000 (no depreciation).'
  record_fix_template: 'Asset {ANLA.ANLN1}: AFASL is {actual_value}. Assign the correct depreciation key via AS02 > Depreciation
    Areas tab or Fiori app F2747.'
# AA006 catches only a blank NDJAR; NUMC '000' is not blank. AA041 supersedes it for zero useful life
# (NDJAR and NDPER both 0, scoped to depreciating keys). Kept for extracts that deliver the field empty.
- id: AA006
  field: ANLB.NDJAR
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Useful life in years is mandatory — missing means depreciation calculates as zero
  why_it_matters: NDJAR (useful life in years) defines the total depreciation period. Without it, the depreciation calculation
    has no basis period and the annual depreciation amount is zero. The asset will never be fully depreciated and book values
    will be permanently overstated.
  rule_authority: sap_hard_constraint
  sap_impact: Depreciation amount is zero — asset remains at acquisition value indefinitely. Financial statements overstate
    asset values. Tax depreciation schedules are incorrect.
  fix_map:
    __blank__: 'Useful life is empty. In ECC: determine the correct useful life from the company''s depreciation policy or
      IFRS/local GAAP guidelines and set via AS02 > Depreciation Areas tab. In S/4HANA: use Fiori app F2747. Example: buildings
      25-50 years, vehicles 5-8 years, IT equipment 3-5 years.'
  record_fix_template: 'Asset {ANLA.ANLN1}: NDJAR is {actual_value}. Set the useful life in years via AS02 > Depreciation
    Areas tab or Fiori app F2747.'
- id: AA007
  field: ANLA.AKTIV
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Capitalisation date missing — asset may not be included in depreciation run
  why_it_matters: AKTIV (capitalisation date) determines when depreciation starts for the asset. Without it, the depreciation
    run cannot determine the start period and the asset may be excluded from AFAB processing entirely. Pro-rata depreciation
    in the first year is also affected.
  rule_authority: sap_hard_constraint
  sap_impact: Depreciation start date is undefined. AFAB may skip this asset or calculate incorrect pro-rata depreciation.
    Asset reports show no capitalisation date.
  fix_map:
    __blank__: 'Capitalisation date is empty. In ECC: set to the date the asset was placed in service via AS02 > General tab
      > Capitalisation Date. In S/4HANA: use Fiori app F2747.'
  record_fix_template: 'Asset {ANLA.ANLN1}: AKTIV is {actual_value}. Set the capitalisation date via AS02 (ECC) or Fiori app
    F2747 (S/4HANA).'
  applies_when:
    ANLA.ZUGDT:
      populated: true
- id: AA008
  field: ANLZ.KOSTL
  check_class: null_check
  severity: high
  dimension: completeness
  message: "Cost centre missing \u2014 depreciation cannot be allocated to a responsible department"
  why_it_matters: KOSTL (cost centre) determines where depreciation expense is allocated in controlling. Without it, depreciation
    postings either fail (if cost centre is mandatory in the depreciation area) or are posted without CO assignment, making
    cost allocation reporting incomplete.
  rule_authority: best_practice
  sap_impact: Depreciation expense has no cost centre assignment. CO reports (S_ALR_87013611) show unallocated depreciation.
    Internal orders and profit centre reporting are incomplete.
  fix_map:
    __blank__: 'Cost centre is empty. In ECC: assign the cost centre of the department responsible for the asset via AS02
      > Time-Dependent tab > Cost Centre. In S/4HANA: use Fiori app F2747.'
  record_fix_template: 'Asset {ANLA.ANLN1}: KOSTL is {actual_value}. Assign the responsible cost centre via AS02 > Time-Dependent
    tab or Fiori app F2747.'
- id: AA009
  field: ANLA.TXT50
  check_class: null_check
  severity: medium
  dimension: completeness
  message: "Asset description missing \u2014 reduces usability of asset register"
  why_it_matters: TXT50 (asset description) is the primary text field used to identify the asset in all reports and the asset
    explorer (AW01N). Without it, users cannot identify what the asset is, leading to poor asset management and audit difficulties.
  rule_authority: best_practice
  sap_impact: Asset register and explorer (AW01N) show blank description. Physical inventory reconciliation is difficult.
    Audit queries require manual investigation.
  fix_map:
    __blank__: "Asset description is empty. In ECC: enter a meaningful description via AS02 > General tab > Description. In\
      \ S/4HANA: use Fiori app F2747. Example: \"Dell PowerEdge R740 Server \u2014 DC Room 3\"."
  record_fix_template: 'Asset {ANLA.ANLN1}: TXT50 is {actual_value}. Enter a meaningful asset description via AS02 (ECC) or
    Fiori app F2747 (S/4HANA).'
- id: AA011
  field: ANLZ.PRCTR
  check_class: null_check
  severity: high
  dimension: completeness
  applies_when:
    ANLZ.KOSTL:
      blank: true
  message: "Profit centre missing and no cost centre to derive it from \u2014 asset cannot be included in profit centre reporting"
  why_it_matters: PRCTR (profit centre) is required for segment reporting and profit centre accounting. Without it, the asset's
    depreciation and book values cannot be allocated to a profit centre, causing gaps in management reporting and potentially
    in segment disclosures under IFRS 8.
  rule_authority: best_practice
  # ECC derives the profit centre of asset postings from the cost centre (CSKS-PRCTR); an empty
  # ANLZ-PRCTR is a gap only when there is no cost centre either
  sap_impact: Profit centre reporting excludes this asset. Segment reporting under IFRS 8 is incomplete. Transfer pricing
    for inter-company asset usage is not possible.
  fix_map:
    __blank__: 'Profit centre is empty. In ECC: assign via AS02 > Time-Dependent tab > Profit Centre. In S/4HANA: use Fiori
      app F2747. The profit centre is often derived from the cost centre assignment.'
  record_fix_template: 'Asset {ANLA.ANLN1}: PRCTR is {actual_value}. Assign the profit centre via AS02 > Time-Dependent tab
    or Fiori app F2747.'
- id: AA013
  field: ANLZ.WERKS
  check_class: null_check
  severity: low
  dimension: completeness
  message: Plant missing — asset location tracking is incomplete
  why_it_matters: WERKS (plant) identifies the physical location of the asset at the plant level. Without it, asset location
    reporting is incomplete, physical inventory reconciliation by plant cannot include this asset, and insurance valuations
    by location are inaccurate.
  rule_authority: best_practice
  sap_impact: Asset location reporting is incomplete. Physical inventory by plant (AR31) cannot include this asset. Insurance
    valuations by location are inaccurate.
  fix_map:
    __blank__: 'Plant is empty. In ECC: assign via AS02 > General tab > Plant. In S/4HANA: use Fiori app F2747. Set to the
      plant where the asset is physically located.'
  record_fix_template: 'Asset {ANLA.ANLN1}: WERKS is {actual_value}. Assign the plant via AS02 (ECC) or Fiori app F2747 (S/4HANA).'
- id: AA014
  field: ANLA.INVNR
  check_class: null_check
  severity: low
  dimension: completeness
  message: "Inventory number missing \u2014 physical asset identification is not possible"
  why_it_matters: INVNR (inventory number) is the physical tag or barcode number on the asset. Without it, physical inventory
    counts cannot match the asset register to the physical asset, and asset verification audits require manual investigation
    to identify each item.
  rule_authority: best_practice
  sap_impact: Physical inventory reconciliation (AR31/AR32) cannot match this asset to a physical tag. Asset audits require
    manual identification.
  fix_map:
    __blank__: 'Inventory number is empty. In ECC: assign the physical tag or barcode number via AS02 > General tab > Inventory
      Number. In S/4HANA: use Fiori app F2747.'
  record_fix_template: 'Asset {ANLA.ANLN1}: INVNR is {actual_value}. Assign the inventory number via AS02 (ECC) or Fiori app
    F2747 (S/4HANA).'
- id: AA015
  field: ANLA.ZUGDT
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Asset acquisition date missing — lifecycle tracking is incomplete
  why_it_matters: ZUGDT (asset value date for first acquisition) records when the first acquisition posting was made. Without
    it, asset age calculations, warranty tracking, and lifecycle cost analysis cannot be performed accurately.
  rule_authority: best_practice
  sap_impact: Asset age calculations are impossible. Warranty tracking cannot determine start date. Lifecycle cost reports
    are incomplete. Replacement planning has no acquisition baseline.
  fix_map:
    __blank__: 'Acquisition date is empty. In ECC: this is normally set automatically when the first acquisition is posted
      (ABZON). If missing, investigate the acquisition history. In S/4HANA: verify via Fiori app F2747.'
  record_fix_template: 'Asset {ANLA.ANLN1}: ZUGDT is {actual_value}. Verify acquisition date via AS03 (ECC) or Fiori app F2747
    (S/4HANA).'
  applies_when:
    ANLA.AKTIV:
      populated: true
- id: AA016
  field: ANLB.AFABG
  check_class: null_check
  severity: high
  dimension: completeness
  message: Depreciation start date missing — depreciation calculation has no start point
  why_it_matters: AFABG (depreciation start date) specifies when depreciation begins for the asset in the given depreciation
    area. Without it, the AFAB depreciation run cannot calculate when to start depreciating and may skip the asset entirely
    or use an incorrect start date.
  rule_authority: sap_hard_constraint
  sap_impact: AFAB depreciation run may skip this asset. Pro-rata depreciation in the first year cannot be calculated. Accumulated
    depreciation may be understated.
  fix_map:
    __blank__: 'Depreciation start date is empty. In ECC: set via AS02 > Depreciation Areas tab > Dep. Start Date. In S/4HANA:
      use Fiori app F2747. This is typically the same as or after the capitalisation date.'
  record_fix_template: 'Asset {ANLA.ANLN1}: AFABG is {actual_value}. Set the depreciation start date via AS02 > Depreciation
    Areas tab or Fiori app F2747.'
  applies_when:
    ANLA.AKTIV:
      populated: true
- id: AA018
  field: ANLZ.STORT
  check_class: null_check
  severity: low
  dimension: completeness
  message: "Asset location missing \u2014 physical placement of asset is not tracked"
  why_it_matters: "STORT (asset location) provides a more granular location than the plant field \u2014 typically a room,\
    \ building, or floor. Without it, physical inventory teams cannot locate the asset efficiently, increasing the time and\
    \ cost of asset verification."
  rule_authority: best_practice
  sap_impact: Physical inventory teams cannot locate the asset by room or building. Location-based insurance valuations are
    incomplete.
  fix_map:
    __blank__: 'Asset location is empty. In ECC: assign via AS02 > General tab > Location. In S/4HANA: use Fiori app F2747.
      Enter the building, room, or floor identifier.'
  record_fix_template: 'Asset {ANLA.ANLN1}: STORT is {actual_value}. Assign the asset location via AS02 (ECC) or Fiori app
    F2747 (S/4HANA).'
- id: AA019
  field: ANLA.ERDAT
  check_class: null_check
  severity: low
  dimension: completeness
  message: "Asset creation date missing \u2014 audit trail for asset master is incomplete"
  why_it_matters: ERDAT records when the asset master record was created. Without it, audit trails are incomplete and it is
    impossible to determine when the asset was first entered into the system, which is relevant for data migration audits
    and master data governance.
  rule_authority: best_practice
  sap_impact: Audit trail is incomplete. Data migration audits cannot verify when the asset was created. Master data governance
    reporting is incomplete.
  fix_map:
    __blank__: Asset creation date is empty. This is normally set automatically by SAP at master record creation time. If
      missing, it indicates a data load issue. Document the gap in the data migration log.
  record_fix_template: "Asset {ANLA.ANLN1}: ERDAT is {actual_value}. This field is system-set \u2014 investigate the data\
    \ source for the missing audit trail."
- id: AA024
  field: ANLA.ERNAM
  check_class: null_check
  severity: low
  dimension: completeness
  message: Created by is missing
  why_it_matters: Created by (ANLA.ERNAM) is not maintained. This field supports downstream processes and reporting accuracy.
    Missing data may result in incomplete records or processing gaps.
  rule_authority: best_practice
  sap_impact: Missing Created by may cause incomplete data in related transactions and reports.
  fix_map:
    __blank__: 'In ECC: Set via AS02. In S/4HANA: Use Fiori app F2747 (Manage Fixed Asset).'
  record_fix_template: 'Record is missing ANLA.ERNAM. In ECC: Set via AS02. In S/4HANA: Use Fiori app F2747 (Manage Fixed
    Asset).'
- id: AA027
  field: ANLB.SAFBG
  check_class: null_check
  severity: low
  dimension: completeness
  message: Special depreciation start date missing for an area with a special depreciation rate
  why_it_matters: Special depreciation key (ANLB.SAFBG) is not maintained. This field supports downstream processes
    and reporting accuracy. Missing data may result in incomplete records or processing gaps.
  rule_authority: best_practice
  sap_impact: Missing Special depreciation key may cause incomplete data in related transactions and reports.
  fix_map: {__blank__: 'In ECC: Set via AS02. In S/4HANA: Use Fiori app F2747 (Manage Fixed Asset).'}
  record_fix_template: 'Record is missing ANLB.SAFBG. In ECC: Set via AS02. In S/4HANA: Use Fiori app F2747 (Manage
    Fixed Asset).'
  applies_when:
    ANLB.SAPRZ: {gt: 0}
- id: AA030
  field: ANLA.ANLN1
  check_class: uniqueness_check
  fields: [ANLA.BUKRS, ANLA.ANLN1, ANLA.ANLN2]
  severity: critical
  dimension: uniqueness
  message: Duplicate asset main numbers detected — each asset must be unique
  why_it_matters: Duplicate asset numbers cause double depreciation, incorrect book values, and reconciliation breaks
    between the asset subledger and general ledger. Each fixed asset must have a unique main number (ANLN1) within
    the company code.
  rule_authority: sap_hard_constraint
  sap_impact: Depreciation is posted twice. Asset subledger does not reconcile with FI-GL. Asset value reports are
    overstated. Year-end close will flag the imbalance.
  fix_map: {__blank__: Identify and merge duplicate asset records via AS06 (asset transfer within company code)
      or archive the duplicate via OAAR. Reconcile with FI-GL after correction.}
  record_fix_template: "Asset {ANLA.BUKRS}/{ANLA.ANLN1}-{ANLA.ANLN2} appears more than once. Keep one record, then migrate postings and flag the duplicate for deletion via AS06 after review in AS03."


- id: AA032
  field: ANLB.AFASL
  check_class: referential_check
  severity: high
  dimension: consistency
  message: Depreciation key ANLB.AFASL must exist in T090NA
  why_it_matters: AFASL (depreciation key) determines how and over what period an asset depreciates. An invalid AFASL means
    AFAB (depreciation run) cannot post for the record — monthly close fails for that asset, and the depreciation expense
    is understated. S/4HANA Asset Accounting (new) reconciles depreciation posting to the universal journal; an orphaned key
    breaks the reconciliation.
  rule_authority: sap_hard_constraint
  sap_impact: AFAB fails for the asset; depreciation expense missing from month-end; universal-journal reconciliation broken.
  fix_map:
    __blank__: Assign depreciation key at AS01/AS02 > Depreciation Areas tab. Required for every depreciation area.
    __other__: Depreciation key '{invalid_value}' not in T093. Reassign via AS02 or configure in SPRO > Financial Accounting
      > Asset Accounting > Depreciation > Valuation Methods > Depreciation Key > Maintain Depreciation Key (AFAMA).
  record_fix_template: 'Asset {ANLA.ANLN1}: depreciation key ''{actual_value}'' is not in T093.'

# ── Internal consistency: asset lifecycle dates ─────────────────────────────
- id: AA033
  field: ANLA.DEAKT
  check_class: cross_field_check
  fail_when: (`ANLA.DEAKT` < `ANLA.AKTIV`) | (`ANLA.DEAKT` < `ANLA.ZUGDT`)
  severity: high
  dimension: consistency
  message: Asset deactivated before it was capitalised or first acquired
  why_it_matters: >-
    The deactivation date is the value date of the retirement or transfer that took the asset's last
    value out. SAP does not post a retirement with a value date before the capitalisation date or the
    first acquisition, so a deactivation date before either means one of the dates was loaded or
    changed wrongly.
  rule_authority: sap_hard_constraint
  sap_impact: The asset history sheet (S_ALR_87011990) and depreciation simulation place the asset's
    life in the wrong periods; pro-rata depreciation and the retirement gain/loss are miscalculated.
  fix_map:
    __other__: Display the asset's transactions in AW01N and correct the date that disagrees with them
      (capitalisation date in AS02 or, for legacy assets, AS92; a wrong retirement must be reversed and
      re-posted).
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): deactivated on {ANLA.DEAKT},
    capitalised {ANLA.AKTIV}, first acquisition {ANLA.ZUGDT}.'

- id: AA034
  field: ANLZ.ADATU
  check_class: cross_field_check
  grain: ANLZ
  fail_when: (`ANLZ.ADATU` > `ANLZ.BDATU`)
  severity: medium
  dimension: consistency
  message: Time-dependent asset assignment starts after it ends (ANLZ valid-from after valid-to)
  why_it_matters: >-
    Cost centre, plant, location and profit centre of an asset are kept in time segments. A segment
    whose valid-from date is after its valid-to date covers no day at all, so the assignment in force
    for that period is undefined.
  rule_authority: sap_hard_constraint
  sap_impact: Depreciation for the period is posted to the wrong or no cost centre (AFAB); asset lists
    by cost centre or plant at a key date omit the asset.
  fix_map:
    __other__: Correct the time-dependent data in AS02 > Time-dependent tab (S/4HANA Fiori app F2747) so
      that every interval starts on or before its end date.
  record_fix_template: 'Asset {ANLZ.ANLN1}-{ANLZ.ANLN2} (company code {ANLZ.BUKRS}): time segment valid from
    {ANLZ.ADATU} to {ANLZ.BDATU}.'

- id: AA035
  field: ANLB.ADATU
  check_class: cross_field_check
  fail_when: (`ANLB.ADATU` > `ANLB.BDATU`)
  severity: medium
  dimension: consistency
  message: Time-dependent depreciation terms start after they end (ANLB valid-from after valid-to)
  why_it_matters: >-
    Depreciation terms (key, useful life) can change over time; each interval runs from its valid-from
    to its valid-to date. An interval starting after it ends covers no period, so the depreciation terms
    in force for that time are undefined.
  rule_authority: sap_hard_constraint
  sap_impact: The depreciation run (AFAB) and recalculation (AFAR) use the wrong depreciation terms for
    the periods concerned.
  fix_map:
    __other__: Correct the time-dependent depreciation terms in AS02 > Depreciation areas (S/4HANA Fiori
      app F2747).
  record_fix_template: 'Asset {ANLB.ANLN1}-{ANLB.ANLN2} area {ANLB.AFABE}: depreciation terms valid from
    {ANLB.ADATU} to {ANLB.BDATU}.'

- id: AA036
  field: ANLA.MEINS
  check_class: cross_field_check
  fail_when: (`ANLA.MENGE` > 0) & `ANLA.MEINS`.isna()
  severity: medium
  dimension: consistency
  message: Asset quantity has no unit of measure
  why_it_matters: >-
    A quantity without its unit cannot be read — 12 could be pieces, metres or square metres. SAP
    requires the unit when a quantity is entered on the asset (collective low-value assets, physical
    inventory).
  rule_authority: sap_hard_constraint
  sap_impact: The low-value asset quantity check and asset physical inventory (AR31/AR32) count the
    wrong units.
  fix_map:
    __other__: Enter the unit of measure next to the quantity in AS02 > General tab (S/4HANA Fiori app F2747).
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2}: quantity {ANLA.MENGE} without unit of measure.'

# ── Uniqueness of business identifiers ─────────────────────────────────────
- id: AA037
  field: ANLA.INVNR
  check_class: uniqueness_check
  fields: [ANLA.BUKRS, ANLA.INVNR]
  normalize: alnum
  applies_when:
    ANLA.ANLN2: ['0000']
  severity: medium
  dimension: uniqueness
  message: The same inventory number (asset tag) is used by more than one main asset in the company code
  why_it_matters: >-
    The inventory number is the physical tag or barcode that links the asset on the floor to the asset
    register. Two main assets with the same tag cannot both be confirmed in a physical inventory — one
    of them is a duplicate registration or carries the other's tag. Sub-numbers are excluded: they
    legitimately share the tag of their main asset.
  rule_authority: best_practice
  sap_impact: Physical inventory (AR31/AR32) confirms the wrong asset; duplicate registrations are
    depreciated twice and the asset register overstates fixed assets.
  fix_map:
    __other__: Compare the assets in AW01N; retire or merge a duplicate registration (ABUMN transfer, then
      deactivate), or give each physical asset its own tag in AS02 > General tab.
  record_fix_template: 'Asset {ANLA.ANLN1} (company code {ANLA.BUKRS}): inventory number {ANLA.INVNR} is also
    used by another main asset.'

# ── Validity against the system's configuration ────────────────────────────
- id: AA038
  field: ANLA.ANLKL
  check_class: referential_check
  severity: high
  dimension: validity
  message: Asset class ANLA.ANLKL must exist in the system's asset classes (ANKA)
  why_it_matters: >-
    The asset class supplies the account determination, screen layout, number range and default
    depreciation terms of the asset. An asset whose class is not defined (a migration mapping gap or a
    deleted class) has no account determination, so no transaction can post to it.
  rule_authority: sap_hard_constraint
  sap_impact: Acquisitions, retirements and the depreciation run (AFAB) fail with missing account
    determination; the asset is missing from class-based reports.
  fix_map:
    __other__: Asset class '{invalid_value}' is not defined. Create it (OAOA) with the right account
      determination, or move the asset to a valid class (AS02 is not possible — transfer with ABUMN to a
      new asset in the right class).
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2}: asset class ''{actual_value}'' is not defined in ANKA.'

- id: AA039
  field: ANLB.AFABE
  check_class: referential_check
  severity: high
  dimension: validity
  message: Depreciation area ANLB.AFABE must exist in the chart of depreciation (T093)
  why_it_matters: >-
    Every depreciation area of an asset must be defined in the company code's chart of depreciation —
    it decides the ledger, the posting rules and whether values are posted to the G/L. Terms for an
    undefined area are never read by the depreciation run and point to a broken migration.
  rule_authority: sap_hard_constraint
  sap_impact: Depreciation for the area is never calculated or posted; parallel valuation (IFRS/local
    GAAP/tax) is incomplete.
  fix_map:
    __other__: Depreciation area '{invalid_value}' is not defined. Define it in the chart of depreciation
      (OADB) or remove the orphaned terms through SAP support.
  record_fix_template: 'Asset {ANLB.ANLN1}-{ANLB.ANLN2}: depreciation area ''{actual_value}'' is not defined in T093.'
- id: AA043
  field: ANLC.KANSW
  check_class: cross_field_check
  grain: ANLC
  fail_when: >-
    ((`ANLC.KANSW`.fillna(0) + `ANLC.ANSWL`.fillna(0)) == 0) &
    ((`ANLC.KNAFA`.fillna(0) + `ANLC.NAFAG`.fillna(0) + `ANLC.NAFAV`.fillna(0) + `ANLC.NAFAL`.fillna(0) + `ANLC.ZUSNA`.fillna(0)
    + `ANLC.KSAFA`.fillna(0) + `ANLC.SAFAG`.fillna(0) + `ANLC.SAFAV`.fillna(0) + `ANLC.SAFAL`.fillna(0) + `ANLC.ZUSSA`.fillna(0)
    + `ANLC.KAAFA`.fillna(0) + `ANLC.AAFAG`.fillna(0) + `ANLC.AAFAV`.fillna(0) + `ANLC.AAFAL`.fillna(0) + `ANLC.ZUSAA`.fillna(0)).abs() > 0.01)
  severity: critical
  dimension: accuracy
  message: Asset has zero acquisition value but still carries accumulated depreciation
  why_it_matters: >-
    When an asset is fully retired or transferred, its APC and its accumulated depreciation both go
    to zero. Depreciation left behind with no APC means a retirement or transfer was posted
    incompletely, or the values were loaded inconsistently. The balance sheet then carries a book
    value with no underlying asset.
  rule_authority: sap_hard_constraint
  sap_impact: Asset history sheet does not reconcile to G/L (ABST2); year-end closing (AJAB) and fiscal year change carry forward a phantom value.
  fix_map:
    __other__: Review the asset in AW01N (S/4 Asset Explorer); post the missing retirement/transfer depreciation via ABAVN/ABUMN or correct with ABNAN/ABMA, then rerun AFAB.
  record_fix_template: 'Asset {ANLC.ANLN1}-{ANLC.ANLN2} (company code {ANLC.BUKRS}, area {ANLC.AFABE}, year {ANLC.GJAHR}): APC is zero but depreciation is {actual_value}.'

- id: AA042
  field: ANLC.KANSW
  check_class: cross_field_check
  grain: ANLC
  fail_when: >-
    ((`ANLC.NAFAG`.fillna(0) + `ANLC.NAFAV`.fillna(0) + `ANLC.NAFAL`.fillna(0) + `ANLC.ZUSNA`.fillna(0) + `ANLC.KSAFA`.fillna(0)
    + `ANLC.SAFAG`.fillna(0) + `ANLC.SAFAV`.fillna(0) + `ANLC.SAFAL`.fillna(0) + `ANLC.ZUSSA`.fillna(0) + `ANLC.KAAFA`.fillna(0)
    + `ANLC.AAFAG`.fillna(0) + `ANLC.AAFAV`.fillna(0) + `ANLC.AAFAL`.fillna(0) + `ANLC.ZUSAA`.fillna(0) + `ANLC.KMAFA`.fillna(0)
    + `ANLC.MAFAG`.fillna(0) + `ANLC.MAFAV`.fillna(0) + `ANLC.MAFAL`.fillna(0) + `ANLC.ZUSMA`.fillna(0) + `ANLC.KAUFW`.fillna(0)
    + `ANLC.AUFWB`.fillna(0) + `ANLC.AUFWV`.fillna(0) + `ANLC.AUFWL`.fillna(0) + `ANLC.KAUFN`.fillna(0) + `ANLC.AUFNG`.fillna(0)
    + `ANLC.AUFNV`.fillna(0) + `ANLC.AUFNL`.fillna(0) + `ANLC.KINVZ`.fillna(0) + `ANLC.INVZM`.fillna(0) + `ANLC.INVZV`.fillna(0)
    + `ANLC.INVZL`.fillna(0) + `ANLC.KNAFA`.fillna(0) + `ANLC.KANSW`.fillna(0) + `ANLC.ANSWL`.fillna(0)) < -0.01) &
    ((`ANLC.KANSW`.fillna(0) + `ANLC.ANSWL`.fillna(0)) > 0)
  severity: high
  dimension: accuracy
  message: Asset net book value is negative (depreciated beyond acquisition cost)
  why_it_matters: >-
    Depreciation cannot exceed acquisition cost unless the depreciation area explicitly allows a
    negative book value, which it normally does not. A negative NBV comes from a changed useful life,
    unplanned depreciation posted twice, or values migrated without matching depreciation.
  rule_authority: sap_hard_constraint
  sap_impact: Balance sheet overstates accumulated depreciation; AFAB may log errors (ANLC.XAFAR) and the asset cannot be retired cleanly.
  fix_map:
    __other__: Check the area settings (OADB "negative book value allowed") and the asset values in AW01N; reverse the excess depreciation (ABMA/ABNAN) and recalculate (AFAR).
  record_fix_template: 'Asset {ANLC.ANLN1}-{ANLC.ANLN2} (company code {ANLC.BUKRS}, area {ANLC.AFABE}, year {ANLC.GJAHR}) has a negative net book value.'

- id: AA041
  field: ANLB.NDJAR
  check_class: cross_field_check
  grain: ANLB
  fail_when: (`ANLB.NDJAR`.fillna('').str.lstrip('0') == '') & (`ANLB.NDPER`.fillna('').str.lstrip('0') == '')
  applies_when:
    ANLB.AFASL: {not_in: ['0000', 'GWG', 'LVA', 'NULL']}
  severity: high
  dimension: validity
  message: Depreciation key is set but useful life is zero years and zero periods
  why_it_matters: >-
    Life-based depreciation keys divide the APC by the useful life. With 0 years and 0 periods,
    AFAB either depreciates the whole value at once or posts nothing, depending on the key. Both
    misstate the asset and the P&L.
  rule_authority: sap_hard_constraint
  sap_impact: Planned depreciation is wrong or missing; depreciation run (AFAB) logs errors or expenses the full value immediately.
  fix_map:
    __other__: Enter the useful life in AS02 > Deprec. areas (S/4 Manage Fixed Assets F3425), or switch the area to key 0000 if it must not depreciate; then recalculate (AFAR).
  record_fix_template: 'Asset {ANLB.ANLN1}-{ANLB.ANLN2} (company code {ANLB.BUKRS}, area {ANLB.AFABE}): depreciation key {ANLB.AFASL} with zero useful life.'

- id: AA044
  field: ANLZ.KOSTL
  check_class: exists_check
  target_table: CSKS
  target_fields:
  - KOSTL
  target_when:
    BKZKP:
      blank: true
  applies_when:
    ANLZ.KOSTL: {populated: true}
  severity: high
  dimension: consistency
  message: Asset's cost centre does not exist or is locked for primary postings
  why_it_matters: >-
    Depreciation is posted to the cost centre in the asset's time-dependent data. A cost centre that
    does not exist or is locked for actual primary costs makes the depreciation run error out for
    that asset, or forces a manual workaround.
  rule_authority: sap_hard_constraint
  sap_impact: AFAB ends with errors for the asset; depreciation for the period is not posted to CO.
  fix_map:
    __other__: Assign a valid cost centre in AS02 > Time-dependent (S/4 Manage Fixed Assets F3425), or remove the lock in KS02.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): cost centre {ANLZ.KOSTL} is missing or locked.'

- id: AA040
  field: ANLB.AFABG
  check_class: cross_field_check
  grain: ANLB
  fail_when: (`ANLA.AKTIV` - `ANLB.AFABG`).dt.days.abs() > 366
  require_populated: true
  applies_when:
    ANLB.AFASL: {not_in: ['0000']}
  severity: medium
  dimension: consistency
  message: Ordinary depreciation start date is more than a year from the capitalisation date
  why_it_matters: >-
    SAP derives the depreciation start from the capitalisation date and the period control. The
    two can differ by period rules, but by less than a year. A larger gap means a manual override
    or a migration error, which shifts a year or more of depreciation expense.
  rule_authority: best_practice
  sap_impact: Depreciation expense misstated across fiscal years; catch-up depreciation posted on recalculation.
  fix_map:
    __other__: Check AS03 > Deprec. areas; correct the start date (AS02) or the capitalisation date, then recalculate (AFAR).
  record_fix_template: 'Asset {ANLB.ANLN1}-{ANLB.ANLN2} (area {ANLB.AFABE}): depreciation start {ANLB.AFABG}, capitalised {ANLA.AKTIV}.'

- id: AA046
  field: ANLA.ZUGDT
  check_class: freshness_check
  max_age_hours: 8760
  applies_when:
    ANLA.ANLKL: ['4000', '00004000', '4001', '00004001']
  severity: medium
  dimension: timeliness
  message: Asset under construction has had first acquisition more than 12 months ago
  why_it_matters: >-
    AuC carries no depreciation. Projects finished but never settled to final assets understate
    depreciation and overstate CIP, which is a recurring audit adjustment.
  rule_authority: best_practice
  sap_impact: Depreciation not started; CIP balance overstated; AIBU/AIAB settlement backlog.
  fix_map:
    __other__: Review in AW01N; settle to final assets with AIAB/AIBU (S/4 Settle AuC F3471) or confirm the project is still running.
  record_fix_template: 'AuC {ANLA.ANLN1}-{ANLA.ANLN2} (class {ANLA.ANLKL}, company code {ANLA.BUKRS}) first acquired {ANLA.ZUGDT}.'

- id: AA045
  field: ANLA.IVDAT
  check_class: freshness_check
  max_age_hours: 26280
  severity: low
  dimension: timeliness
  message: Last physical inventory of the asset is more than 3 years old
  why_it_matters: >-
    Physical verification proves the asset exists. Assets never counted for three years may be
    gone, which overstates the balance sheet.
  rule_authority: best_practice
  sap_impact: Existence assertion unsupported; ghost assets carry depreciation.
  fix_map:
    __other__: Count the asset and record the date in AS02 > General > Inventory (S/4 F3425).
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}) last inventoried {ANLA.IVDAT}.'

- id: AA047
  field: ANLA.INVNR
  check_class: regex_check
  # a tag carries a digit and is not a run of words: room names, project names and
  # custodians' names written into the tag field fail
  pattern: ^(?!.*[A-Za-z]{3,}\s+[A-Za-z]{3,})(?=.*[0-9])
  severity: medium
  dimension: validity
  message: Inventory number holds a description, location or person's name instead of an asset tag
  why_it_matters: >-
    The inventory number is meant to carry the physical tag or barcode on the asset. When it is used
    for a room, a project or the custodian's name, many assets share the same value, the physical
    inventory cannot match tag to record, and personal names end up in a field that is printed on
    inventory lists and exported to scanners.
  rule_authority: best_practice
  sap_impact: Physical inventory (AR31/AR32) cannot confirm assets by tag; asset-tag uniqueness (AA037)
    is meaningless; personal data sits in a non-personal field.
  fix_map:
    __other__: Inventory number '{invalid_value}' is not a tag. Move the location to ANLZ-RAUMN or
      ANLZ-STORT, the custodian to ANLZ-PERNR, and write the physical tag number into INVNR (AS02 or
      mass change AR31).
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2}: inventory number ''{actual_value}'' is not an asset tag.'
- id: AA048
  field: ANLA.AKTIV
  check_class: cross_field_check
  fail_when: '`ANLA.AKTIV` > @today'
  require_populated: true
  severity: high
  dimension: validity
  message: Asset capitalisation date is in the future
  why_it_matters: >-
    The capitalisation date sets the start of ordinary depreciation through the period control of the
    depreciation key. A date in the future means depreciation will not start when the asset is in use,
    so the period's depreciation and the net book value are misstated. It usually comes from a typo in
    the year during a legacy data load (AS91) or a manual change in AS02.
  rule_authority: best_practice
  sap_impact: AFAB posts no depreciation for the asset until the future date; AW01N shows the asset as not yet capitalised.
  fix_map:
    __other__: Correct the capitalisation date in AS02 (S/4HANA Manage Fixed Asset F2747), then recalculate depreciation with AFAR.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}) is capitalised on {ANLA.AKTIV}.'

- id: AA200
  field: ANLA.ANLN1
  check_class: exists_check
  fields:
  - ANLA.BUKRS
  - ANLA.ANLN1
  - ANLA.ANLN2
  target_table: ANLB
  target_fields:
  - BUKRS
  - ANLN1
  - ANLN2
  severity: high
  dimension: completeness
  message: Asset has no depreciation terms (no ANLB record for any depreciation area)
  why_it_matters: Depreciation terms (ANLB) hold the depreciation key, useful life and start date per depreciation area. An
    asset master without any ANLB record was created outside the normal AS01 flow or lost its terms in a load, and the depreciation
    run has nothing to calculate.
  rule_authority: sap_hard_constraint
  sap_impact: No planned depreciation is calculated or posted; the asset is missing from the asset history sheet values per
    area.
  fix_map:
    __other__: Maintain the depreciation areas for the asset in AS02 > Depreciation areas, or reload the asset with its depreciation
      terms.
  record_fix_template: 'Asset {ANLA.BUKRS}/{ANLA.ANLN1}-{ANLA.ANLN2}: no depreciation terms in any depreciation area.'
- id: AA201
  field: ANLA.ANLN1
  check_class: exists_check
  fields:
  - ANLA.BUKRS
  - ANLA.ANLN1
  - ANLA.ANLN2
  target_table: ANLZ
  target_fields:
  - BUKRS
  - ANLN1
  - ANLN2
  severity: high
  dimension: completeness
  message: Asset has no time-dependent assignment record (ANLZ)
  why_it_matters: ANLZ carries the cost centre, profit centre, plant and location of the asset over time. Without any ANLZ
    record the asset has no organisational assignment at all, so depreciation cannot be settled to a cost object.
  rule_authority: sap_hard_constraint
  sap_impact: The depreciation posting run cannot derive a cost centre; the asset falls out of cost centre and profit centre
    reporting.
  fix_map:
    __other__: Maintain the time-dependent data in AS02 > Time-dependent tab (cost centre, plant, location).
  record_fix_template: 'Asset {ANLA.BUKRS}/{ANLA.ANLN1}-{ANLA.ANLN2}: no time-dependent assignment.'
- id: AA202
  field: ANLA.XLOEV
  check_class: cross_field_check
  fail_when: (`ANLA.XLOEV` == 'X') & `ANLA.DEAKT`.isna() & `ANLA.AKTIV`.notna()
  severity: medium
  dimension: consistency
  message: Capitalised asset is flagged for deletion but has never been retired (no deactivation date)
  why_it_matters: A capitalised asset can only be archived after it is fully retired. A deletion flag on an asset that is
    still active means someone tried to remove it from the register without posting the retirement, so the book value stays
    on the balance sheet.
  rule_authority: sap_hard_constraint
  sap_impact: Archiving (AM_ASSET) rejects the asset; the net book value remains in the asset history sheet although the business
    considers the asset gone.
  fix_map:
    __other__: Post the retirement or scrapping (ABAVN) so the deactivation date is set, or remove the deletion flag in AS06.
  record_fix_template: 'Asset {ANLA.BUKRS}/{ANLA.ANLN1}-{ANLA.ANLN2}: flagged for deletion but still active.'
- id: AA203
  field: ANLA.ERDAT
  check_class: freshness_check
  max_age_hours: 8760
  applies_when:
    ANLA.AKTIV:
      blank: true
    ANLA.ZUGDT:
      blank: true
    ANLA.DEAKT:
      blank: true
  severity: low
  dimension: timeliness
  message: Asset master created more than a year ago has never received an acquisition posting
  why_it_matters: An asset shell with no acquisition and no capitalisation date a year after creation is an abandoned master
    record. Shells inflate the asset register count, confuse the inventory count and are often reused for unrelated acquisitions.
  rule_authority: best_practice
  sap_impact: The register carries dead records that appear in inventory lists and asset counts but never in the balance sheet.
  fix_map:
    __other__: Delete the unused asset in AS06 or post the planned acquisition; do not reuse the shell for a different asset.
  record_fix_template: 'Asset {ANLA.BUKRS}/{ANLA.ANLN1}-{ANLA.ANLN2}: created {age_days} days ago without any acquisition.'
- id: AA204
  field: ANLB.NDJAR
  check_class: cross_field_check
  fail_when: '`ANLB.NDJAR`.str.fullmatch(''0*(8[1-9]|9[0-9]|[1-9][0-9]{2})'').fillna(False)'
  severity: low
  dimension: validity
  message: Useful life is longer than 80 years
  why_it_matters: Useful lives above 80 years are very rare outside land-like assets (which normally carry no depreciation).
    A value such as 100 or 999 usually comes from a placeholder entered during a migration to suppress depreciation.
  rule_authority: best_practice
  sap_impact: Depreciation is understated for the whole life of the asset; book values and impairment tests are distorted.
  fix_map:
    __other__: Correct the useful life in AS02 > Depreciation areas, or use a no-depreciation key (for example 0000) where
      depreciation is intentionally suppressed.
  record_fix_template: 'Asset {ANLB.BUKRS}/{ANLB.ANLN1}-{ANLB.ANLN2} area {ANLB.AFABE}: useful life {ANLB.NDJAR} years.'
- id: AA206
  field: ANLA.ANLN1
  check_class: exists_check
  fields:
  - ANLA.BUKRS
  - ANLA.ANLN1
  - ANLA.ANLN2
  target_table: ANLB
  target_fields:
  - BUKRS
  - ANLN1
  - ANLN2
  target_when:
    AFABE:
    - '01'
  severity: high
  dimension: completeness
  message: Asset has no book depreciation area (area 01) record
  why_it_matters: Depreciation area 01 is the book area that posts to the general ledger in standard charts of depreciation.
    An asset with other areas but no area 01 is invisible in the financial statements.
  rule_authority: best_practice
  sap_impact: Acquisitions and depreciation for the asset do not reach the general ledger; the asset subledger does not reconcile
    to the balance sheet accounts.
  fix_map:
    __other__: Activate depreciation area 01 for the asset in AS02 > Depreciation areas, or check the asset class defaults
      in OAYZ.
  record_fix_template: 'Asset {ANLA.BUKRS}/{ANLA.ANLN1}-{ANLA.ANLN2}: no book depreciation area 01.'
- id: S4-AA-PERIODIC-APC
  field: T093.AFAPL
  check_class: exists_check
  negate: true
  grain: T093
  applies_when:
    T093.BUHBKT: ['2']
  target_table: T093C
  target_fields:
  - AFAPL
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: depreciation area of a chart of depreciation in use posts APC periodically (posting indicator
    2) - simplification item S4TWL Asset Accounting, SAP Note 2270388'
  why_it_matters: New Asset Accounting in S/4HANA posts acquisition and production costs of every depreciation area in real
    time; periodic APC posting to the general ledger is no longer supported. Only charts of depreciation assigned to a
    company code (T093C) are judged.
  rule_authority: sap_hard_constraint
  sap_impact: The Asset Accounting pre-check of the S/4HANA conversion reports the depreciation area; the conversion cannot
    continue until the posting indicator is changed.
  fix_map:
    __other__: Change the depreciation area to post APC in real time (posting indicator 1 or 4, OADB / EC08 in the
      chart of depreciation) before the conversion.
  record_fix_template: 'Chart of depreciation {T093.AFAPL}, area {T093.AFABER}: APC is posted periodically (posting indicator
    2).'

# ── Depth pass: class, account determination, depreciation terms, assignments (AA207 onward) ──────────────────
- id: AA207
  field: ANLA.ANLKL
  check_class: exists_check
  target_table: ANKA
  target_fields:
  - ANLKL
  target_when:
    XLOEV: {blank: true}
    XSPEA: {blank: true}
  severity: medium
  dimension: consistency
  message: Active asset belongs to an asset class that is blocked or flagged for deletion
  why_it_matters: An asset class is blocked (ANKA.XSPEA) or flagged for deletion (ANKA.XLOEV) when it is no longer meant
    to be used. Active assets still in such a class keep its account determination and screen layout, and cannot be
    copied or recreated with the same class.
  rule_authority: best_practice
  sap_impact: AS01 with reference to the asset fails; the class cannot be archived while assets use it; the S/4HANA
    migration carries an obsolete class into the new asset accounting.
  fix_map:
    __other__: Transfer the asset to a current class (ABUMN / ABT1N intercompany) or remove the block in OAOA if the class
      is still in use.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): class {ANLA.ANLKL} is blocked or
    flagged for deletion.'

- id: AA208
  field: ANLA.KTOGR
  fields:
  - ANLA.ANLKL
  - ANLA.KTOGR
  check_class: exists_check
  target_table: ANKA
  target_fields:
  - ANLKL
  - KTOGR
  severity: high
  dimension: consistency
  message: Asset's account determination differs from its asset class
  why_it_matters: The account determination (ANLA.KTOGR) is taken from the asset class (OAOA, ANKA.KTOGR) and cannot be
    changed on the asset in AS02. A different value comes from a load or a later class change, and the asset posts to G/L
    accounts other than its class's.
  rule_authority: sap_hard_constraint
  sap_impact: Acquisitions, depreciation and retirements of the asset post to the reconciliation and expense accounts of
    another account determination; the asset history sheet by class no longer reconciles with the G/L.
  fix_map:
    __other__: Transfer the asset to a class with the right account determination (ABUMN), or correct the class
      definition in OAOA if the class is wrong.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}, class {ANLA.ANLKL}): account
    determination {ANLA.KTOGR} differs from the class.'

- id: AA209
  field: ANLA.KTOGR
  fields:
  - T001.KTOPL
  - ANLA.KTOGR
  check_class: exists_check
  target_table: T095
  target_fields:
  - KTOPL
  - KTOGR
  severity: critical
  dimension: consistency
  message: Account determination has no balance sheet accounts in the company code's chart of accounts
  why_it_matters: The balance sheet accounts for acquisition, accumulated depreciation and retirement are assigned per
    chart of accounts and account determination in AO90 (T095). Without them no value posting on the asset can find its
    reconciliation account.
  rule_authority: sap_hard_constraint
  sap_impact: ABZON, ABAVN and AFAB stop with "no account found" for the asset; the asset cannot be capitalised or
    retired.
  fix_map:
    __other__: Assign the balance sheet accounts for the account determination in AO90 for the company code's chart of
      accounts.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): account determination {ANLA.KTOGR}
    has no balance sheet accounts in chart {T001.KTOPL}.'

- id: AA210
  field: ANLA.KTOGR
  fields:
  - T001.KTOPL
  - ANLA.KTOGR
  check_class: exists_check
  target_table: T095B
  target_fields:
  - KTOPL
  - KTOGR
  severity: high
  dimension: consistency
  message: Account determination has no depreciation accounts in the company code's chart of accounts
  why_it_matters: The expense and accumulated depreciation accounts for the depreciation run are assigned per chart of
    accounts and account determination in AO90 (T095B). A capitalised asset whose account determination has none cannot
    post depreciation.
  rule_authority: sap_hard_constraint
  sap_impact: AFAB ends with errors for every asset of the account determination; depreciation is missing from the
    period close.
  fix_map:
    __other__: Assign the depreciation accounts for the account determination in AO90 (Depreciation section).
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): account determination {ANLA.KTOGR}
    has no depreciation accounts in chart {T001.KTOPL}.'

- id: AA211
  field: ANLB.AFABE
  fields:
  - ANLA.ANLKL
  - T093C.AFAPL
  - ANLB.AFABE
  check_class: exists_check
  target_table: ANKB
  target_fields:
  - ANLKL
  - AFAPL
  - AFABE
  target_when:
    XAFBE: {blank: true}
  applies_when:
    ANLB.XAFBE: {blank: true}
  severity: medium
  dimension: consistency
  message: Asset has an active depreciation area that its class does not define for the chart of depreciation
  why_it_matters: The depreciation areas of an asset are proposed from the class for the company code's chart of
    depreciation (OAYZ, ANKB). An active area on the asset that is missing or deactivated in the class was added by a load
    or survived a class or chart change.
  rule_authority: best_practice
  sap_impact: New assets created with reference to this one carry an area the class does not expect; the asset history
    sheet and parallel valuation differ from other assets of the class.
  fix_map:
    __other__: Define the depreciation area for the class in OAYZ, or deactivate the area on the asset in AS02 if it should
      not be valuated there.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}, class {ANLA.ANLKL}): area {ANLB.AFABE}
    is not active in the class for chart of depreciation {T093C.AFAPL}.'

- id: AA212
  field: ANLB.AFASL
  fields:
  - T093C.AFAPL
  - ANLB.AFASL
  check_class: exists_check
  target_table: T090NA
  target_fields:
  - AFAPL
  - AFASL
  severity: high
  dimension: consistency
  message: Depreciation key is not defined in the company code's chart of depreciation
  why_it_matters: Depreciation keys (AFAMA, T090NA) are defined per chart of depreciation. A key that exists in another
    chart but not in the one of the asset's company code (OAOB, T093C) passes a plain key check and still cannot be
    calculated.
  rule_authority: sap_hard_constraint
  sap_impact: AFAR and AFAB cannot calculate depreciation for the area; AS02 refuses to save the asset until the key is
    changed.
  fix_map:
    __other__: Copy the depreciation key into the chart of depreciation (AFAMA) or assign a key of that chart in AS02.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}), area {ANLB.AFABE}: depreciation key
    {ANLB.AFASL} is not in chart of depreciation {T093C.AFAPL}.'

- id: AA213
  field: ANLZ.STORT
  fields:
  - ANLZ.WERKS
  - ANLZ.STORT
  check_class: exists_check
  target_table: T499S
  target_fields:
  - WERKS
  - STAND
  severity: medium
  dimension: validity
  message: Asset location is not defined for the asset's plant
  why_it_matters: Locations (OC10, T499S) are defined per plant. A location that the plant does not have was loaded or
    survived a plant change, and the asset cannot be found by location for physical inventory.
  rule_authority: sap_hard_constraint
  sap_impact: AS02 refuses to save the time-dependent data; inventory lists by location (S_ALR_87011990) and location
    based reports miss the asset.
  fix_map:
    __other__: Define the location for the plant in OC10 or assign an existing location in AS02 > Time-dependent.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): location {ANLZ.STORT} is not
    defined for plant {ANLZ.WERKS}.'

- id: AA214
  field: ANLB.NDPER
  check_class: cross_field_check
  fail_when: '`ANLB.NDPER`.str.fullmatch(''0*(1[2-9]|[2-9][0-9]|[1-9][0-9]{2})'').fillna(False)'
  applies_when:
    ANLB.XAFBE: {blank: true}
  severity: medium
  dimension: validity
  message: Useful life in periods is a full year or more
  why_it_matters: The useful life is entered as years (ANLB.NDJAR) plus the remaining periods (ANLB.NDPER). In a
    12-period fiscal year the periods must stay below 12; 12 or more periods means the years were entered as periods and
    the depreciation term is wrong.
  rule_authority: best_practice
  sap_impact: The planned depreciation runs over a different term than intended; the asset depreciates too fast or too
    slowly and the asset explorer (AW01N) shows an unexpected end of life.
  fix_map:
    __other__: Move whole years from periods to years in AS02 > Depreciation areas, then recalculate (AFAR).
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}), area {ANLB.AFABE}: useful life
    {ANLB.NDJAR} years and {ANLB.NDPER} periods.'

- id: AA215
  field: ANLC.XAFAR
  check_class: cross_field_check
  fail_when: (`ANLC.XAFAR` == '1') | (`ANLC.XAFAR` == '2')
  severity: high
  dimension: accuracy
  message: Depreciation calculation ended in error for the asset
  why_it_matters: The depreciation error indicator (ANLC.XAFAR) is set when the depreciation calculation for the
    fiscal year (2) or for previous years (1) failed. The planned values in the asset values are then not reliable.
  rule_authority: sap_hard_constraint
  sap_impact: AFAB reports the asset as faulty and does not post its depreciation; fiscal year change (AJRW) and year-end
    closing (AJAB) are blocked until it is corrected.
  fix_map:
    __other__: Run AFAR for the asset, correct the cause shown in the log (depreciation key, useful life, missing account),
      and repeat the depreciation run.
  record_fix_template: 'Asset {ANLC.ANLN1}-{ANLC.ANLN2} (company code {ANLC.BUKRS}), area {ANLC.AFABE}, fiscal year
    {ANLC.GJAHR}: depreciation calculation error {ANLC.XAFAR}.'

- id: AA216
  field: ANLA.EAUFN
  check_class: exists_check
  target_table: AUFK
  target_fields:
  - AUFNR
  severity: medium
  dimension: consistency
  message: Asset's investment order does not exist
  why_it_matters: The investment order (ANLA.EAUFN) links the asset to the order whose costs are capitalised on it, and is
    used by capital investment reporting. An order that no longer exists breaks that link.
  rule_authority: best_practice
  sap_impact: Investment programme reports and the asset's origin analysis (AW01N, S_ALR_87012050) cannot trace the
    acquisition back to its order.
  fix_map:
    __other__: Clear or correct the investment order in AS02 > Origin.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): investment order {ANLA.EAUFN} does
    not exist.'

- id: AA217
  field: ANLA.POSNR
  check_class: referential_check
  applies_when:
    ANLA.POSNR: {not_in: ['00000000']}
  severity: medium
  dimension: consistency
  message: Asset's investment WBS element does not exist
  why_it_matters: The WBS element of the investment project (ANLA.POSNR) links the asset to the project that built it. A
    WBS element that does not exist was archived or the reference was loaded with a wrong internal number.
  rule_authority: sap_hard_constraint
  sap_impact: Capital investment reports by project and the settlement history of the asset under construction cannot
    find the project.
  fix_map:
    __other__: Clear or correct the WBS element in AS02 > Origin.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): investment WBS element does not
    exist.'

- id: AA218
  field: ANLZ.CAUFN
  check_class: referential_check
  severity: high
  dimension: consistency
  message: Internal order assigned to the asset does not exist
  why_it_matters: The internal order in the asset's time-dependent data (ANLZ.CAUFN) receives the depreciation and
    interest of the asset in CO. An order that does not exist leaves those postings without a receiver.
  rule_authority: sap_hard_constraint
  sap_impact: AFAB posts with errors for the asset; depreciation is missing on the order and in CO reporting.
  fix_map:
    __other__: Assign an existing, released internal order in AS02 > Time-dependent, or remove the order.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): internal order {ANLZ.CAUFN} does not
    exist.'

- id: AA219
  field: ANLZ.KOSTLV
  check_class: exists_check
  target_table: CSKS
  target_fields:
  - KOSTL
  target_when:
    DATBI: ['99991231']
  severity: medium
  dimension: consistency
  message: Cost centre responsible for the asset does not exist
  why_it_matters: The responsible cost centre (ANLZ.KOSTLV) names the organisational unit accountable for the asset, and
    is used by asset reports and physical inventory by responsibility. A cost centre without a current validity was
    closed or never existed.
  rule_authority: best_practice
  sap_impact: Reports by responsible cost centre (S_ALR_87011964 with cost centre selection) miss the asset; inventory by
    responsibility cannot reach anyone.
  fix_map:
    __other__: Assign a current cost centre as responsible cost centre in AS02 > Time-dependent.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): responsible cost centre {ANLZ.KOSTLV}
    does not exist.'

- id: AA220
  field: ANLZ.KOSTL
  fields:
  - ANLA.BUKRS
  - ANLZ.KOSTL
  check_class: exists_check
  target_table: CSKS
  target_fields:
  - BUKRS
  - KOSTL
  target_when:
    DATBI: ['99991231']
  severity: high
  dimension: consistency
  message: Asset's cost centre belongs to another company code
  why_it_matters: Depreciation is posted in the asset's company code to the cost centre in its time-dependent data. A cost
    centre that belongs to another company code (CSKS.BUKRS) would make the depreciation a cross-company posting, which
    Asset Accounting does not allow.
  rule_authority: sap_hard_constraint
  sap_impact: AFAB ends with "cost centre belongs to company code ..." for the asset; depreciation for the period is not
    posted.
  fix_map:
    __other__: Assign a cost centre of the asset's company code in AS02 > Time-dependent, or transfer the asset to the
      company code of the cost centre (ABT1N).
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): cost centre {ANLZ.KOSTL} belongs to
    another company code.'

# Depth pass 2: asset master, depreciation areas, time-dependent data, class and chart of depreciation (AA221 onward)
- id: AA221
  field: ANLA.ANLN1
  fields:
  - ANLA.BUKRS
  - ANLA.ANLN1
  check_class: exists_check
  target_table: ANLA
  target_fields:
  - BUKRS
  - ANLN1
  target_when:
    ANLN2:
    - '0000'
  applies_when:
    ANLA.ANLN2:
      not_in:
      - '0000'
  severity: high
  dimension: consistency
  message: Asset subnumber has no main asset record
  why_it_matters: A subnumber is a part of a main asset. Without the record with subnumber 0000 the sub asset hangs on an
    asset that does not exist as its own record.
  rule_authority: sap_hard_constraint
  sap_impact: Transfers, retirements and the asset explorer (AW01N) fail for the group, and the main asset's totals leave
    out the sub asset.
  fix_map:
    __other__: Recreate the main asset (AS01) or move the sub asset to an existing main asset (ABUMN).
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} in company code {ANLA.BUKRS}: main asset record is missing.'
- id: AA222
  field: ANLA.ABGDT
  check_class: cross_field_check
  fail_when: '`ANLA.ABGDT`.notna() & `ANLA.DEAKT`.isna()'
  severity: medium
  dimension: consistency
  message: Asset has a retirement date but no deactivation date
  why_it_matters: The retirement date records when the last retirement was posted. Without a deactivation date the asset stays
    active in the register.
  rule_authority: best_practice
  sap_impact: The asset remains in depreciation runs and reports as an active asset.
  fix_map:
    __other__: Set the deactivation date in AS02 or reverse the retirement.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): retired, not deactivated.'
- id: AA223
  field: ANLA.ABGDT
  check_class: cross_field_check
  fail_when: '`ANLA.ABGDT` > @today'
  severity: high
  dimension: validity
  message: Asset retirement date is in the future
  why_it_matters: A retirement date is the posting date of a retirement that has already happened. A future value is a typing
    error or a faulty load.
  rule_authority: best_practice
  sap_impact: Retirement reports and the asset history show a retirement that has not happened.
  fix_map:
    __other__: Correct the date in AS02 or reverse the retirement (AB01L).
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): retirement date is in the future.'
- id: AA224
  field: ANLA.ABGDT
  check_class: cross_field_check
  fail_when: '`ANLA.ABGDT` < `ANLA.AKTIV`'
  require_populated: true
  severity: high
  dimension: validity
  message: Asset was retired before it was capitalised
  why_it_matters: An asset cannot be retired before its capitalisation date. The dates were loaded or changed in the wrong
    order.
  rule_authority: sap_hard_constraint
  sap_impact: Depreciation up to the retirement has no base and the asset history contradicts itself.
  fix_map:
    __other__: Correct the capitalisation date or the retirement date in AS02.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): retirement before capitalisation.'
- id: AA225
  field: ANLA.XLOEV
  check_class: cross_field_check
  fail_when: (`ANLA.XLOEV` == 'X') & `ANLA.XSPEB`.isna()
  severity: medium
  dimension: consistency
  message: Asset flagged for deletion is not blocked for posting
  why_it_matters: An asset flagged for deletion is supposed to be blocked so that nothing is posted to it before archiving.
  rule_authority: best_practice
  sap_impact: Acquisitions can still be posted to an asset that is about to be archived.
  fix_map:
    __other__: Block the asset in AS02 or remove the deletion flag.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): flagged for deletion, not blocked.'
- id: AA226
  field: ANLA.LIFNR
  check_class: exists_check
  target_table: LFA1
  target_fields:
  - LIFNR
  applies_when:
    ANLA.LIFNR:
      populated: true
  severity: medium
  dimension: consistency
  message: Asset's vendor does not exist
  why_it_matters: The vendor on the asset master records the supplier of the asset. A vendor that is not in the vendor master
    leaves a dangling reference.
  rule_authority: sap_hard_constraint
  sap_impact: Asset reports by vendor and warranty follow-up find no vendor; the vendor cannot be migrated as a business partner
    relationship.
  fix_map:
    __other__: Correct the vendor in AS02.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): vendor {ANLA.LIFNR} does not exist.'
- id: AA227
  field: ANLA.MENGE
  check_class: cross_field_check
  fail_when: '`ANLA.MENGE` < 0'
  severity: medium
  dimension: validity
  message: Asset quantity is negative
  why_it_matters: The quantity of an asset is a count of physical units and cannot be below zero.
  rule_authority: best_practice
  sap_impact: Inventory lists and quantity-based reports show wrong totals.
  fix_map:
    __other__: Correct the quantity in AS02.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): negative quantity.'
- id: AA228
  field: ANLA.ZUGDT
  check_class: cross_field_check
  fail_when: '`ANLA.ZUGDT` > @today'
  severity: medium
  dimension: validity
  message: Asset first acquisition date is in the future
  why_it_matters: The first acquisition date is the date of the first posted acquisition. A future date cannot belong to a
    posted acquisition.
  rule_authority: best_practice
  sap_impact: Ageing and the depreciation start derived from the date are wrong.
  fix_map:
    __other__: Correct the date in AS02.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): first acquisition in the future.'
- id: AA229
  field: ANLB.AFABG
  check_class: cross_field_check
  fail_when: (`ANLB.AFABG`.dt.year * 12 + `ANLB.AFABG`.dt.month) < (`ANLA.AKTIV`.dt.year * 12 + `ANLA.AKTIV`.dt.month)
  require_populated: true
  severity: medium
  dimension: consistency
  message: Depreciation starts in a period before the asset's capitalisation period
  why_it_matters: Depreciation starts in the capitalisation period or later (period control moves the start to the first day
    of that period). A start in an earlier period means depreciation for a period in which the asset was not in use.
  rule_authority: sap_hard_constraint
  sap_impact: The depreciation run posts depreciation for periods before capitalisation, or a catch-up that is not intended.
  fix_map:
    __other__: Correct the depreciation start date in AS02 > Depreciation areas.
  record_fix_template: 'Asset {ANLB.ANLN1}-{ANLB.ANLN2} area {ANLB.AFABE}: depreciation starts before capitalisation.'
- id: AA230
  field: ANLB.NAPRZ
  check_class: cross_field_check
  fail_when: '`ANLB.NAPRZ` > 100'
  severity: high
  dimension: validity
  message: Ordinary depreciation percentage rate is above 100
  why_it_matters: The percentage rate is the share of the base depreciated per year, so it cannot exceed 100.
  rule_authority: sap_hard_constraint
  sap_impact: The depreciation run posts more than the asset is worth in a year.
  fix_map:
    __other__: Correct the rate in AS02.
  record_fix_template: 'Asset {ANLB.ANLN1}-{ANLB.ANLN2} area {ANLB.AFABE}: rate above 100.'
- id: AA231
  field: ANLB.SAPRZ
  check_class: cross_field_check
  fail_when: '`ANLB.SAPRZ` > 100'
  severity: high
  dimension: validity
  message: Special depreciation percentage rate is above 100
  why_it_matters: The percentage rate for special depreciation cannot exceed 100.
  rule_authority: sap_hard_constraint
  sap_impact: Special depreciation posts more than the asset is worth.
  fix_map:
    __other__: Correct the rate in AS02.
  record_fix_template: 'Asset {ANLB.ANLN1}-{ANLB.ANLN2} area {ANLB.AFABE}: special rate above 100.'
- id: AA232
  field: ANLB.XLOEV
  check_class: cross_field_check
  fail_when: (`ANLB.XLOEV` == 'X') & `ANLA.XLOEV`.isna() & `ANLA.DEAKT`.isna()
  severity: medium
  dimension: consistency
  message: Depreciation area is flagged for deletion on an active asset
  why_it_matters: A depreciation area flagged for deletion is no longer maintained. On an asset that is still active it stops
    one valuation view of the asset.
  rule_authority: best_practice
  sap_impact: The area is left out of the depreciation run while the asset is still posted to in other areas.
  fix_map:
    __other__: Remove the flag or deactivate the asset.
  record_fix_template: 'Asset {ANLB.ANLN1}-{ANLB.ANLN2}: area {ANLB.AFABE} flagged for deletion, asset active.'
- id: AA233
  field: ANLZ.PRCTR
  fields:
  - ANLZ.KOSTL
  - ANLZ.PRCTR
  check_class: exists_check
  target_table: CSKS
  target_fields:
  - KOSTL
  - PRCTR
  target_when:
    DATBI:
    - '99991231'
  applies_when:
    ANLZ.BDATU:
    - '99991231'
    ANLZ.KOSTL:
      populated: true
    ANLZ.PRCTR:
      populated: true
  severity: medium
  dimension: consistency
  message: Asset profit centre differs from the profit centre of its cost centre
  why_it_matters: The profit centre of an asset is normally derived from its cost centre. A different one splits the asset's
    depreciation and its cost centre costs across two profit centres.
  rule_authority: best_practice
  sap_impact: Profit centre results mix the asset's depreciation with the wrong organisation unit.
  fix_map:
    __other__: Align the profit centre in AS02 > Time-dependent or change the cost centre.
  record_fix_template: 'Asset {ANLZ.ANLN1}-{ANLZ.ANLN2}: profit centre {ANLZ.PRCTR} differs from its cost centre''s.'
- id: AA234
  field: ANLZ.PRCTR
  check_class: exists_check
  target_table: CEPC
  target_fields:
  - PRCTR
  applies_when:
    ANLZ.BDATU:
    - '99991231'
    ANLZ.PRCTR:
      populated: true
  severity: high
  dimension: consistency
  message: Asset profit centre does not exist
  why_it_matters: Depreciation and acquisitions post to the asset's profit centre. A profit centre that does not exist cannot
    take the posting.
  rule_authority: sap_hard_constraint
  sap_impact: AFAB and acquisition postings fail on the profit centre.
  fix_map:
    __other__: Correct the profit centre in AS02.
  record_fix_template: 'Asset {ANLZ.ANLN1}-{ANLZ.ANLN2}: profit centre {ANLZ.PRCTR} does not exist.'
- id: AA235
  field: ANLZ.PRCTR
  check_class: exists_check
  negate: true
  target_table: CEPC
  target_fields:
  - PRCTR
  target_when:
    DATBI:
    - '99991231'
    LOCK_IND:
      populated: true
  applies_when:
    ANLZ.BDATU:
    - '99991231'
    ANLZ.PRCTR:
      populated: true
  severity: high
  dimension: consistency
  message: Asset profit centre is locked
  why_it_matters: A locked profit centre refuses postings. Depreciation of an asset assigned to it cannot post.
  rule_authority: sap_hard_constraint
  sap_impact: The depreciation run (AFAB) ends with an error for the asset.
  fix_map:
    __other__: Unlock the profit centre (KE52) or change the asset's profit centre.
  record_fix_template: 'Asset {ANLZ.ANLN1}-{ANLZ.ANLN2}: profit centre {ANLZ.PRCTR} is locked.'
- id: AA236
  field: ANLZ.WERKS
  check_class: exists_check
  target_table: T001W
  target_fields:
  - WERKS
  applies_when:
    ANLZ.BDATU:
    - '99991231'
    ANLZ.WERKS:
      populated: true
  severity: medium
  dimension: consistency
  message: Asset plant does not exist
  why_it_matters: The plant locates the asset. A plant that is not defined breaks the location hierarchy and plant reports.
  rule_authority: sap_hard_constraint
  sap_impact: Location and plant based reports miss the asset.
  fix_map:
    __other__: Correct the plant in AS02.
  record_fix_template: 'Asset {ANLZ.ANLN1}-{ANLZ.ANLN2}: plant {ANLZ.WERKS} does not exist.'
- id: AA237
  field: ANLZ.LSTAR
  check_class: exists_check
  target_table: CSLA
  target_fields:
  - LSTAR
  applies_when:
    ANLZ.BDATU:
    - '99991231'
    ANLZ.LSTAR:
      populated: true
  severity: medium
  dimension: consistency
  message: Asset activity type does not exist
  why_it_matters: The activity type on the asset is used to allocate depreciation by activity. A type that is not defined
    cannot be used.
  rule_authority: sap_hard_constraint
  sap_impact: Activity-based allocation of the asset fails.
  fix_map:
    __other__: Correct the activity type in AS02.
  record_fix_template: 'Asset {ANLZ.ANLN1}-{ANLZ.ANLN2}: activity type {ANLZ.LSTAR} does not exist.'
- id: AA238
  field: ANKA.ANLKL
  check_class: exists_check
  target_table: ANKB
  target_fields:
  - ANLKL
  applies_when:
    ANKA.XLOEV:
      blank: true
  severity: high
  dimension: completeness
  message: Asset class has no depreciation area definitions
  why_it_matters: The depreciation areas of a class (OAYD) give every new asset of the class its depreciation terms. A class
    without them creates assets with no depreciation.
  rule_authority: sap_hard_constraint
  sap_impact: New assets of the class have no depreciation areas and are never depreciated.
  fix_map:
    __other__: Define the depreciation areas of the class in OAYD or flag the class for deletion.
  record_fix_template: 'Asset class {ANKA.ANLKL}: no depreciation area definitions.'
- id: AA239
  field: ANKB.AFASL
  fields:
  - ANKB.AFAPL
  - ANKB.AFASL
  check_class: exists_check
  target_table: T090NA
  target_fields:
  - AFAPL
  - AFASL
  applies_when:
    ANKB.AFASL:
      populated: true
  severity: high
  dimension: consistency
  message: Depreciation key of the asset class is not defined in the chart of depreciation
  why_it_matters: Assets of the class inherit the depreciation key. A key that is not defined in the chart of depreciation
    cannot calculate depreciation.
  rule_authority: sap_hard_constraint
  sap_impact: New assets of the class get a depreciation key that the system rejects.
  fix_map:
    __other__: Correct the key in OAYD or define it in AFAMA.
  record_fix_template: 'Asset class {ANKB.ANLKL} area {ANKB.AFABE}: depreciation key {ANKB.AFASL} is not defined.'
- id: AA240
  field: ANKB.NAPRZ
  check_class: cross_field_check
  fail_when: '`ANKB.NAPRZ` > 100'
  severity: medium
  dimension: validity
  message: Class default depreciation rate is above 100
  why_it_matters: The percentage rate default in the class is inherited by new assets and cannot exceed 100.
  rule_authority: sap_hard_constraint
  sap_impact: New assets of the class are created with an impossible rate.
  fix_map:
    __other__: Correct the rate in OAYD.
  record_fix_template: 'Asset class {ANKB.ANLKL} area {ANKB.AFABE}: rate above 100.'
- id: AA241
  field: T093C.PERIV
  fields:
  - T093C.BUKRS
  - T093C.PERIV
  check_class: exists_check
  target_table: T001
  target_fields:
  - BUKRS
  - PERIV
  applies_when:
    T093C.PERIV:
      populated: true
  severity: critical
  dimension: consistency
  message: Fiscal year variant of the company code in Asset Accounting differs from the company code
  why_it_matters: Asset Accounting and Financial Accounting must use the same fiscal year variant. A difference breaks every
    period-based posting.
  rule_authority: sap_hard_constraint
  sap_impact: Depreciation periods and G/L periods diverge; AFAB and period close cannot reconcile.
  fix_map:
    __other__: Align the variant in OAYN or OX02.
  record_fix_template: 'Company code {T093C.BUKRS}: fiscal year variant {T093C.PERIV} in Asset Accounting differs from the
    company code.'
- id: AA242
  field: T093C.PERIV
  check_class: exists_check
  target_table: T009
  target_fields:
  - PERIV
  applies_when:
    T093C.PERIV:
      populated: true
  severity: high
  dimension: consistency
  message: Fiscal year variant of Asset Accounting does not exist
  why_it_matters: Depreciation is calculated per fiscal year period. A variant that is not defined cannot return periods.
  rule_authority: sap_hard_constraint
  sap_impact: The depreciation run cannot determine periods.
  fix_map:
    __other__: Correct the variant in OAYN.
  record_fix_template: 'Company code {T093C.BUKRS}: fiscal year variant {T093C.PERIV} does not exist.'
- id: AA243
  field: T093C.AFAPL
  check_class: exists_check
  target_table: T093
  target_fields:
  - AFAPL
  severity: critical
  dimension: consistency
  message: Chart of depreciation assigned to the company code has no depreciation areas
  why_it_matters: A chart of depreciation without areas (T093) has no valuation view to post in.
  rule_authority: sap_hard_constraint
  sap_impact: Assets of the company code cannot be created.
  fix_map:
    __other__: Define the areas in EC08.
  record_fix_template: 'Company code {T093C.BUKRS}: chart of depreciation {T093C.AFAPL} has no depreciation areas.'
- id: S4-AA-CLASS-KTOGR
  field: ANKA.KTOGR
  check_class: exists_check
  target_table: T095
  target_fields:
  - KTOGR
  applies_when:
    ANKA.XLOEV:
      blank: true
  baseline: s4_target
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: active asset class uses an account determination with no G/L accounts (T095) - simplification
    item S4TWL Asset Accounting, SAP Note 2270388'
  why_it_matters: New Asset Accounting posts every area managed in the general ledger in real time through the account determination
    of the class. An account determination without accounts cannot post the values of any asset of the class.
  rule_authority: sap_hard_constraint
  sap_impact: Assets created in the class cannot be migrated or posted in new Asset Accounting.
  fix_map:
    __other__: Maintain the G/L accounts in AO90 for each chart of accounts in use, or change the class account determination
      in OAOA.
  record_fix_template: 'Asset class {ANKA.ANLKL}: account determination {ANKA.KTOGR} has no G/L accounts.'
- id: AA244
  field: ANLA.ABGDT
  check_class: freshness_check
  max_age_hours: 17520
  severity: low
  dimension: timeliness
  message: Asset retired more than two years ago is still in the master
  why_it_matters: A retired asset has no more depreciation and no more postings. After two years it belongs in the archive
    instead of in the data to migrate.
  rule_authority: best_practice
  sap_impact: Migration volume and asset reconciliation include assets that are fully retired.
  fix_map:
    __other__: Archive the asset (SARA, object FI_ASSETS) before the conversion.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): retired more than two years ago.'
- id: AA245
  field: ANLA.AKTIV
  check_class: null_check
  applies_when:
    ANLA.ANLTP:
      not_in:
      - '2'
    ANLA.DEAKT:
      blank: true
    ANLA.XLOEV:
      blank: true
    ANLA.ERDAT:
      older_than_days: 365
  severity: medium
  dimension: timeliness
  message: Asset created more than a year ago has never been capitalised
  why_it_matters: An asset that is neither an asset under construction nor capitalised after a year was created and forgotten.
    The migration of its balances has no capitalisation date.
  rule_authority: best_practice
  sap_impact: The migration cockpit rejects assets with no capitalisation date, or carries them as open items.
  fix_map:
    __other__: Capitalise the asset (ABZON or AS02) or flag it for deletion.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): created over a year ago, not capitalised.'
- id: AA246
  field: ANLA.ANLKL
  check_class: exists_check
  negate: true
  grain: ANLA
  target_table: ANKA
  target_fields:
  - ANLKL
  target_when:
    XLOEV:
    - X
  applies_when:
    ANLA.DEAKT:
      blank: true
    ANLA.ABGDT:
      blank: true
  severity: medium
  dimension: consistency
  message: Active asset belongs to an asset class flagged for deletion
  why_it_matters: A class flagged for deletion is being phased out. Assets that are still active in it block the deletion
    and make the class part of the migration.
  rule_authority: best_practice
  sap_impact: The class cannot be deleted and its assets are migrated into a class that is obsolete.
  fix_map:
    __other__: Reclassify the assets (ABUMN) or remove the deletion flag from the class.
  record_fix_template: 'Asset {ANLA.ANLN1}-{ANLA.ANLN2} (company code {ANLA.BUKRS}): class {ANLA.ANLKL} is flagged for deletion.'
