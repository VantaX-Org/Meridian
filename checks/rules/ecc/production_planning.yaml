      Manage Routings), or create it in customizing (CUNI) if it is genuinely needed.'
  record_fix_template: 'Task list {PLKO.PLNTY}/{PLKO.PLNNR}/{PLKO.PLNAL}: task list unit ''{actual_value}'' is not configured
    (T006).'
- id: PP056
  field: PLPO.STEUS
  check_class: referential_check
  applies_when: *id002
  severity: critical
  dimension: validity
  message: Operation control key (PLPO.STEUS) is not defined in the system's configuration (T430)
