  severity: medium
  dimension: completeness
  message: Work centre costing line has a cost centre but no activity type
  why_it_matters: The activity type connects the cost centre to the rate used in the operation.
  rule_authority: sap_hard_constraint
  sap_impact: Costing finds no rate; the cost estimate omits the operation.
  fix_map:
