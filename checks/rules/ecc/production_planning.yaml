  target_fields:
  - KOKRS
  - KOSTL
  severity: high
  dimension: consistency
  message: Work centre cost centre does not exist in the controlling area
  why_it_matters: Activity costs at the work centre post to the cost centre. A cost centre outside CSKS cannot take postings.
  rule_authority: sap_hard_constraint
  sap_impact: Confirmations and activity allocation fail.
  fix_map:
    __other__: Correct the cost centre in CR02 > Costing.
  record_fix_template: 'Work centre object {CRCO.OBJID}: cost centre {actual_value} is not in controlling area {CRCO.KOKRS}.'
