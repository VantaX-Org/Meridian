module: production_planning
target_state: ECC_AND_S4HANA
rules:
- id: PP001
  field: PLKO.PLNNR
  check_class: null_check
  severity: high
  dimension: completeness
  message: "Routing number missing \u2014 routing cannot be uniquely identified"
  why_it_matters: PLNNR (routing number) is the unique identifier for a routing (sequence of manufacturing operations). Without
    it, the routing cannot be assigned to a production order and operations/scheduling cannot be determined. The production
    process for this material is undefined.
  rule_authority: sap_hard_constraint
  sap_impact: Routing cannot be used in production order creation (CO01). Operations and scheduling data are missing. Capacity
    requirements are not generated.
  fix_map:
    __blank__: 'Routing number is empty. In ECC: create or assign a valid routing via CA01/CA02. In S/4HANA: use transaction
      CA01 or the Manage Routing app. The routing must have at least one operation with a work centre assignment.'
  record_fix_template: 'Routing {PLKO.PLNNR}: PLNNR is {actual_value}. Create or assign the routing via CA01/CA02.'
- id: PP002
  field: PLKO.WERKS
  check_class: null_check
  severity: high
  dimension: completeness
  message: "Routing plant missing \u2014 routing cannot be assigned to a manufacturing location"
  why_it_matters: WERKS (plant) on the routing determines which manufacturing location uses this routing. Without it, the
    routing cannot be selected during production order creation for any plant and operations have no organisational context.
  rule_authority: sap_hard_constraint
  sap_impact: Routing cannot be selected for production orders at any plant. Operations and scheduling are not available for
    production execution.
  fix_map:
    __blank__: 'Routing plant is empty. In ECC: assign the correct manufacturing plant via CA02 > Header > Plant. In S/4HANA:
      use transaction CA02 or the Manage Routing app.'
  record_fix_template: 'Routing {PLKO.PLNNR}: WERKS is {actual_value}. Assign the plant via CA02 > Header.'
- id: PP003
  field: PLKO.KTEXT
  check_class: null_check
  severity: medium
  dimension: completeness
  message: "Routing description missing \u2014 routing cannot be identified in selection lists"
  why_it_matters: KTEXT (routing description) is the text that identifies the routing in selection lists and reports. Without
    it, production planners cannot identify which routing to select when multiple alternatives exist, and CA06 routing lists
    show blank descriptions.
  rule_authority: best_practice
  sap_impact: CA06 routing list shows blank description. Production planners cannot identify the correct routing. Selection
    errors during production order creation increase.
  fix_map:
    __blank__: 'Routing description is empty. In ECC: enter a meaningful description via CA02 > Header > Description. In S/4HANA:
      use transaction CA02. Include the product and process (e.g., "Assembly routing for pump P-100").'
  record_fix_template: 'Routing {PLKO.PLNNR}: KTEXT is {actual_value}. Enter a description via CA02 > Header.'
- id: PP004
  field: PLKO.STATU
  check_class: null_check
  severity: high
  dimension: completeness
  message: "Routing status missing \u2014 routing may not be available for production"
  why_it_matters: STATU (routing status) controls whether the routing can be used in production orders. Without a status,
    the routing's availability is undefined and it may not be selectable during production order creation (CO01).
  rule_authority: sap_hard_constraint
  sap_impact: Routing availability is undefined. CO01 may not select this routing. Production scheduling cannot use it.
  fix_map:
    __blank__: 'Routing status is empty. In ECC: set via CA02 > Header > Status. In S/4HANA: use transaction CA02. Set to
      4 (released) for production use.'
  record_fix_template: 'Routing {PLKO.PLNNR}: STATU is {actual_value}. Set the routing status via CA02.'
- id: PP005
  field: PLKO.STATU
  check_class: domain_value_check
  allowed_values:
  - '1'
  - '2'
  - '3'
  - '4'
  severity: high
  dimension: validity
  message: Routing status must be a valid status code (1-4)
  why_it_matters: STATU must be one of the defined routing status codes. Invalid values prevent the routing from being properly
    managed through its lifecycle and may cause errors during production order creation. Only status 4 (released) allows the
    routing to be used in production.
  rule_authority: sap_hard_constraint
  sap_impact: Routing lifecycle management is broken. Production order creation may fail or select the wrong routing version.
  valid_values_with_labels:
    '1': "Created \u2014 routing is in initial creation"
    '2': "To Be Released \u2014 routing is pending approval"
    '3': "Locked \u2014 routing is temporarily blocked"
    '4': "Released \u2014 routing is available for production"
  fix_map:
    __other__: 'Routing status ''{invalid_value}'' is not a valid code. Valid statuses: 1 (created), 2 (to be released), 3
      (locked), 4 (released). In ECC: correct via CA02 > Header > Status. In S/4HANA: use transaction CA02.'
  record_fix_template: 'Routing {PLKO.PLNNR}: STATU is ''{actual_value}''. Set to a valid status code via CA02.'
- id: PP006
  field: PLKO.VERWE
  check_class: domain_value_check
  allowed_values:
  - '1'
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  - '9'
  severity: medium
  dimension: validity
  message: Routing usage must be a valid usage code
  why_it_matters: VERWE (routing usage) determines where the routing can be used — production, planning, or universal. Invalid
    values prevent the routing from being selected in the correct context and may cause errors in production order creation
    or costing runs.
  rule_authority: sap_hard_constraint
  sap_impact: Routing cannot be selected in the expected context. Production order creation or costing may fail to find the
    routing.
  valid_values_with_labels:
    '1': Production — routing used in production orders
    '2': Planning — routing used for product costing only
    '9': Universal — routing used for both production and planning
  fix_map:
    __other__: 'Routing usage ''{invalid_value}'' is not a valid code. Valid usages: 1 (production), 2 (planning), 9 (universal).
      In ECC: correct via CA02 > Header > Usage. In S/4HANA: use transaction CA02.'
  record_fix_template: 'Routing {PLKO.PLNNR}: VERWE is ''{actual_value}''. Set to a valid usage code via CA02.'
- id: PP007
  field: STKO.STLNR
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "BOM number missing \u2014 Bill of Materials cannot be uniquely identified"
  why_it_matters: STLNR is the BOM number and primary key for the Bill of Materials. Without it, the BOM cannot be referenced
    in production orders, MRP cannot explode dependent requirements, and product costing has no material cost basis.
  rule_authority: sap_hard_constraint
  sap_impact: BOM cannot be used in production. MRP cannot generate dependent requirements. Product costing has no material
    component list.
  fix_map:
    __blank__: 'BOM number is empty. In ECC: create a valid BOM via CS01. In S/4HANA: use transaction CS01 or the Manage Bill
      of Materials app. The BOM must have at least one component item.'
  record_fix_template: 'BOM {STKO.STLNR}: STLNR is {actual_value}. Create a valid BOM via CS01.'
- id: PP008
  field: STKO.STLAL
  check_class: null_check
  severity: high
  dimension: completeness
  message: "BOM alternative number missing \u2014 BOM cannot be uniquely identified"
  why_it_matters: STLAL (BOM alternative) identifies which version of the Bill of Materials is used when multiple alternatives
    exist. Missing means the BOM selection logic cannot pick the correct alternative for production orders, potentially using
    the wrong component list.
  rule_authority: sap_hard_constraint
  sap_impact: BOM selection in production order creation (CO01) may pick the wrong alternative or fail entirely. Material
    reservations may be incorrect.
  fix_map:
    __blank__: 'BOM alternative is empty. In ECC: if only one BOM exists, set to 1. If multiple alternatives exist, set the
      correct number via CS02. In S/4HANA: use transaction CS02 or the Manage Bill of Materials app.'
  record_fix_template: 'BOM {STKO.STLNR}: STLAL is {actual_value}. Set the BOM alternative number via CS02.'
- id: PP010
  field: MAST.STLAN
  check_class: domain_value_check
  allowed_values:
  - '1'
  - '2'
  - '3'
  - '4'
  - '5'
  - '6'
  - '7'
  - '8'
  severity: high
  dimension: validity
  message: BOM usage must be a valid usage code
  why_it_matters: 'STLAN (BOM usage) determines the context in which the BOM can be used: production, engineering, plant maintenance,
    or sales. Invalid values prevent the BOM from being found in the correct context and may cause MRP and production order
    creation to fail.'
  rule_authority: sap_hard_constraint
  sap_impact: BOM cannot be found in the expected context. Production order creation and MRP explosion may fail.
  valid_values_with_labels:
    '1': Production — BOM used in manufacturing
    '2': Engineering — BOM used for design/engineering
    '3': Universal — BOM used in all contexts
    '5': Sales — BOM used for sales order processing
  fix_map:
    __other__: 'BOM usage ''{invalid_value}'' is not a valid code. Valid usages: 1 (production), 2 (engineering), 3 (universal),
      5 (sales). In ECC: correct via CS02 > Header > Usage. In S/4HANA: use transaction CS02.'
  record_fix_template: 'BOM {STKO.STLNR}: STLAN is ''{actual_value}''. Set to a valid usage code via CS02.'
- id: PP011
  field: STKO.STLST
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: BOM status must be a valid status code
  why_it_matters: STLST (BOM status) controls whether the BOM is active and available for use. Invalid values prevent proper
    BOM lifecycle management and may cause errors during production order creation or MRP processing.
  rule_authority: sap_hard_constraint
  sap_impact: BOM lifecycle management is broken. Production order creation may fail if the BOM status is invalid.
  valid_values_with_labels:
    '01': Active — BOM is released for use
    '02': Inactive — BOM is not available for production
  fix_map:
    __other__: 'BOM status ''{invalid_value}'' is not a valid code. Valid statuses: 01 (active), 02 (inactive). In ECC: correct
      via CS02 > Header > Status. In S/4HANA: use transaction CS02.'
  record_fix_template: 'BOM {STKO.STLNR}: STLST is ''{actual_value}''. Set to a valid status code via CS02.'
- id: PP012
  field: STKO.BMENG
  check_class: null_check
  severity: high
  dimension: completeness
  message: "BOM base quantity missing \u2014 component quantities cannot be correctly calculated"
  why_it_matters: BMENG (base quantity) is the reference quantity for the BOM. All component quantities are defined relative
    to this base quantity. Without it, component quantities cannot be scaled for the production order quantity, leading to
    incorrect material reservations and consumption.
  rule_authority: sap_hard_constraint
  sap_impact: Component quantities cannot be scaled. Material reservations are incorrect. MRP dependent requirements are wrong.
    Production execution uses incorrect material quantities.
  fix_map:
    __blank__: 'BOM base quantity is empty. In ECC: set the base quantity via CS02 > Header > Base Quantity. In S/4HANA: use
      transaction CS02. This is typically 1 unit of the parent material.'
  record_fix_template: 'BOM {STKO.STLNR}: BMENG is {actual_value}. Set the base quantity via CS02.'
- id: PP013
  field: STPO.IDNRK
  check_class: null_check
  severity: critical
  dimension: completeness
  message: BOM component material is mandatory — missing means no material reservations
  why_it_matters: IDNRK is the component material number on a BOM line. Without it, the production order has no material reservation
    for this line — the component will not be staged, not consumed, and not backflushed. The finished product will be produced
    without this component.
  rule_authority: sap_hard_constraint
  sap_impact: Production order creates no reservation for this component. Goods issue (MIGO) has nothing to post. MRP does
    not generate dependent requirements. The finished product is produced with missing components.
  fix_map:
    __blank__: 'Component material is empty. In ECC: assign the correct material number via CS02 > Item > Component field.
      In S/4HANA: use transaction CS02. The material must exist in the plant''s material master.'
  record_fix_template: 'BOM {STKO.STLNR} component: IDNRK is {actual_value}. Assign the component material via CS02.'
  applies_when:
    STPO.POSTP:
    - L
    - R
- id: PP014
  field: STPO.MENGE
  check_class: cross_field_check
  severity: critical
  dimension: completeness
  message: BOM component quantity is blank or zero (negative quantities are co-/by-products and valid)
  why_it_matters: MENGE on a BOM line defines how much of the component is consumed per parent base quantity. Zero or blank
    means no material is reserved for production, causing stock shortages during execution and incorrect product costing.
  rule_authority: sap_hard_constraint
  sap_impact: Material reservation quantity is zero. Goods issue (MIGO) posts zero. MRP generates no dependent requirements
    for this component. Production execution has no material to consume.
  fix_map:
    __blank__: 'Component quantity is zero or blank. In ECC: set the correct quantity per base unit via CS02 > Item > Quantity.
      In S/4HANA: use transaction CS02. Verify the unit of measure is correct.'
  record_fix_template: 'BOM {STKO.STLNR} component {STPO.IDNRK}: MENGE is {actual_value}. Set the component quantity via CS02.'
  applies_when:
    STPO.POSTP:
      not_in:
      - T
      - D
  fail_when: '`STPO.MENGE`.isna() | (`STPO.MENGE` == 0)'
- id: PP015
  field: STPO.MEINS
  check_class: null_check
  severity: medium
  dimension: completeness
  message: BOM component unit of measure missing — quantity has no unit context
  why_it_matters: MEINS (component unit of measure) defines the unit for the BOM component quantity. Without it, quantity
    conversion between the BOM unit and the material's base unit cannot be performed, leading to incorrect material reservations
    and consumption postings.
  rule_authority: best_practice
  sap_impact: Quantity conversion fails. Material reservations may have incorrect quantities. Goods issue postings may be
    wrong.
  fix_map:
    __blank__: 'Component unit of measure is empty. In ECC: set via CS02 > Item > Unit. In S/4HANA: use transaction CS02.
      This should match the material master base unit or have a valid conversion.'
  record_fix_template: 'BOM {STKO.STLNR} component {STPO.IDNRK}: MEINS is {actual_value}. Set the unit of measure via CS02.'
  applies_when:
    STPO.POSTP:
      not_in:
      - T
      - D
- id: PP016
  field: STPO.POSTP
  check_class: domain_value_check
  allowed_values:
  - L
  - N
  - R
  - T
  - K
  - D
  - I
  - M
  severity: high
  dimension: validity
  message: BOM item category must be a valid category code
  why_it_matters: POSTP (BOM item category) determines how the component is handled during production — as a stock item, non-stock
    item, variable-size item, text item, co-product, or document. Invalid values cause BOM explosion errors and incorrect
    material reservation behaviour.
  rule_authority: sap_hard_constraint
  sap_impact: BOM explosion may fail. Material reservation behaviour is undefined. Production order component list may be
    incorrect.
  valid_values_with_labels:
    L: Stock Item — standard material from inventory
    N: Non-Stock Item — procured directly, not from inventory
    R: Variable-Size Item — quantity depends on order
    T: Text Item — information only, no material
    K: Co-Product — joint product from production
    D: Document Item — linked document reference
  fix_map:
    __other__: 'BOM item category ''{invalid_value}'' is not a valid code. Valid categories: L (stock), N (non-stock), R (variable-size),
      T (text), K (co-product), D (document). In ECC: correct via CS02. In S/4HANA: use transaction CS02.'
  record_fix_template: 'BOM {STKO.STLNR} component {STPO.IDNRK}: POSTP is ''{actual_value}''. Set to a valid item category
    via CS02.'
- id: PP017
  field: CRHD.ARBPL
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Work centre number is mandatory \u2014 required for capacity planning and costing"
  why_it_matters: ARBPL (work centre) identifies a production resource where operations are performed. Without it, routing
    operations have no resource assignment, capacity planning (CM01) cannot schedule the operation, and production order costing
    has no basis for activity costs.
  rule_authority: sap_hard_constraint
  sap_impact: Routing operations have no work centre. Capacity planning (CM01/CM25) cannot schedule. Production order costing
    has no activity rates. Detailed scheduling is impossible.
  fix_map:
    __blank__: 'Work centre number is empty. In ECC: assign a valid work centre via CR02. In S/4HANA: use transaction CR02.
      The work centre must exist in the plant and have capacity and costing data maintained.'
  record_fix_template: 'Work centre {CRHD.ARBPL}: ARBPL is {actual_value}. Create or assign the work centre via CR01/CR02.'
- id: PP018
  field: CRHD.WERKS
  check_class: null_check
  severity: critical
  dimension: completeness
  message: "Work centre plant is mandatory \u2014 determines organisational assignment"
  why_it_matters: WERKS (plant) on the work centre determines the organisational context for capacity planning and costing.
    A work centre without a plant cannot be used in any routing or production order for any manufacturing location.
  rule_authority: sap_hard_constraint
  sap_impact: Work centre cannot be used in routings (CA01). Production orders referencing this work centre fail. Capacity
    evaluation (CM01) cannot find the resource.
  fix_map:
    __blank__: 'Plant is empty for this work centre. In ECC: assign the correct manufacturing plant via CR02 > Basic Data
      tab. In S/4HANA: use transaction CR02.'
  record_fix_template: 'Work centre {CRHD.ARBPL}: WERKS is {actual_value}. Assign the plant via CR02 > Basic Data tab.'
- id: PP019
  field: PLKO.LOSVN
  check_class: cross_field_check
  severity: high
  dimension: consistency
  message: Routing lot size from is greater than lot size to — invalid range
  why_it_matters: The lot size range (LOSVN to LOSBS) defines for which production order quantities this routing
    is valid. When the lower bound exceeds the upper bound, the range is invalid and the routing can never be selected
    for any production order quantity. This effectively disables the routing.
  rule_authority: sap_hard_constraint
  sap_impact: Routing can never be selected for any production order — the lot size range is impossible to satisfy.
    Production order creation (CO01) will not find this routing.
  fix_map: {__blank__: 'Lot size from (LOSVN) exceeds lot size to (LOSBS). In ECC: correct the lot size range via
      CA02 > Header > Lot Size fields. In S/4HANA: use transaction CA02. Ensure the from value is less than or equal
      to the to value.'}
  record_fix_template: 'Routing {PLKO.PLNNR}: LOSVN is ''{actual_value}'' which exceeds LOSBS. Correct the lot size
    range via CA02.'
  fail_when: (`PLKO.LOSBS` > 0) & (`PLKO.LOSVN` > `PLKO.LOSBS`)
  require_populated: true
- id: PP020
  field: PLKO.PLNAL
  check_class: null_check
  severity: medium
  dimension: completeness
  message: "Routing group counter missing \u2014 routing version cannot be identified"
  why_it_matters: PLNAL (group counter) identifies a specific routing within a routing group. When multiple routings exist
    for the same material, the group counter distinguishes between them. Without it, routing selection logic cannot identify
    the correct version.
  rule_authority: best_practice
  sap_impact: Routing version cannot be uniquely identified within the group. Production order creation may select the wrong
    routing. Costing runs may use incorrect operations.
  fix_map:
    __blank__: 'Routing group counter is empty. In ECC: set via CA02 > Header > Group Counter. In S/4HANA: use transaction
      CA02. If only one routing exists in the group, set to 1.'
  record_fix_template: 'Routing {PLKO.PLNNR}: PLNAL is {actual_value}. Set the group counter via CA02.'
- id: PP021
  field: PLKO.DATUV
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Valid-from date (routing) is missing
  why_it_matters: Valid-from date (routing) (PLKO.DATUV) is not maintained. This field supports downstream processes and
    reporting accuracy. Missing data may result in incomplete records or processing gaps.
  rule_authority: best_practice
  sap_impact: Missing Valid-from date (routing) may cause incomplete data in related transactions and reports.
  fix_map:
    __blank__: 'In ECC: Set via CA02 (routing) or CS02 (BOM). In S/4HANA: Use the corresponding Fiori apps.'
  record_fix_template: 'Record is missing PLKO.DATUV. In ECC: Set via CA02 (routing) or CS02 (BOM). In S/4HANA: Use the
    corresponding Fiori apps.'
- id: PP022
  field: STKO.DATUV
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Valid-from date (BOM) is missing
  why_it_matters: Valid-from date (BOM) (STKO.DATUV) is not maintained. This field supports downstream processes and reporting
    accuracy. Missing data may result in incomplete records or processing gaps.
  rule_authority: best_practice
  sap_impact: Missing Valid-from date (BOM) may cause incomplete data in related transactions and reports.
  fix_map:
    __blank__: 'In ECC: Set via CA02 (routing) or CS02 (BOM). In S/4HANA: Use the corresponding Fiori apps.'
  record_fix_template: 'Record is missing STKO.DATUV. In ECC: Set via CA02 (routing) or CS02 (BOM). In S/4HANA: Use the
    corresponding Fiori apps.'
- id: PP025
  field: STPO.POTX1
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Component description is missing
  why_it_matters: Component description (STPO.POTX1) is not maintained. This field supports downstream processes and reporting
    accuracy. Missing data may result in incomplete records or processing gaps.
  rule_authority: best_practice
  sap_impact: Missing Component description may cause incomplete data in related transactions and reports.
  fix_map:
    __blank__: 'In ECC: Set via CA02 (routing) or CS02 (BOM). In S/4HANA: Use the corresponding Fiori apps.'
  record_fix_template: 'Record is missing STPO.POTX1. In ECC: Set via CA02 (routing) or CS02 (BOM). In S/4HANA: Use the corresponding
    Fiori apps.'
  applies_when:
    STPO.POSTP:
    - T


- id: PP029
  field: MARC.DISPO
  check_class: regex_check
  pattern: ^[A-Z0-9]{1,3}$
  severity: medium
  dimension: accuracy
  message: MRP controller code format is invalid — must be exactly 3 alphanumeric characters
  why_it_matters: Invalid MRP controller codes cause MRP run exceptions, unassigned planned orders, and materials falling
    through planning coverage.
  rule_authority: best_practice
  sap_impact: MRP cannot assign planned orders to a controller. Materials are excluded from MRP monitoring. Exception messages
    are generated every run.
  fix_map:
    __blank__: Correct the MRP controller via MM02 > MRP 1 view. Ensure the controller code exists in OMD0.
# ── Rule-breadth extension (PP030+): BOM header/items, routings and operations, work centres, repetitive manufacturing, configuration ────
  record_fix_template: "Material {MARC.MATNR} plant {MARC.WERKS}: MRP controller '{actual_value}' is not a valid 3-character code. Correct it in MM02 > MRP 1 view (maintain codes in OMIE)."
- id: PP030
  field: STKO.BMENG
  check_class: cross_field_check
  require_populated: true
  fail_when: '`STKO.BMENG` <= 0'
  severity: critical
  dimension: consistency
  message: BOM base quantity is zero or negative
  why_it_matters: Component quantities are stated per base quantity of the header material; the BOM explosion scales them
    by order quantity / base quantity. CS01 requires a positive base quantity.
  rule_authority: sap_hard_constraint
  sap_impact: 'BOM explosion divides by zero: production and planned orders get no or infinite component requirements; product
    costing fails.'
  fix_map:
    __other__: Set the base quantity on the header (Quantity data) via CS02 (ECC and S/4HANA; Fiori Maintain Bill of Material).
  record_fix_template: 'BOM {STKO.STLNR} alternative {STKO.STLAL}: base quantity {actual_value}.'
- id: PP031
  field: STKO.BMEIN
  check_class: null_check
  severity: high
  dimension: completeness
  message: BOM base unit of measure is missing
  why_it_matters: The base quantity is expressed in the BOM's base unit (normally the header material's base unit); CS01
    requires it.
  rule_authority: sap_hard_constraint
  sap_impact: Order quantities cannot be converted to the BOM base quantity; explosion is wrong.
  fix_map:
    __blank__: Enter the base unit on the header via CS02 (ECC and S/4HANA; Fiori Maintain Bill of Material).
  record_fix_template: 'BOM {STKO.STLNR} alternative {STKO.STLAL}: base unit missing.'
- id: PP032
  field: MAST.LOSVN
  check_class: cross_field_check
  fail_when: (`MAST.LOSBS` > 0) & (`MAST.LOSVN` > `MAST.LOSBS`)
  severity: medium
  dimension: consistency
  message: BOM alternative lot-size range is inverted (from lot size above to lot size)
  why_it_matters: 'Alternative BOMs are selected by the order''s lot size within the range LOSVN - LOSBS of the material-BOM
    link. A from-lot-size above the to-lot-size is an empty range: the alternative is never selected.'
  rule_authority: sap_hard_constraint
  sap_impact: Automatic alternative selection (by lot size) never picks this alternative; orders use another BOM.
  fix_map:
    __other__: Correct the lot-size range of the alternative via CS02 (ECC and S/4HANA; Fiori Maintain Bill of Material)
      (header > Quantity data).
  record_fix_template: 'Material {MAST.MATNR} BOM {MAST.STLNR}/{MAST.STLAL}: lot size {actual_value} to {MAST.LOSBS}.'
- id: PP033
  field: STPO.IDNRK
  check_class: cross_field_check
  fail_when: '`STPO.IDNRK` == `MAST.MATNR`'
  applies_when:
    STPO.POSTP:
    - L
    - N
    - R
    STPO.REKRS:
      not_in:
      - X
  severity: critical
  dimension: consistency
  message: BOM component is the header material itself (recursive BOM) without recursiveness allowed
  why_it_matters: A component equal to the assembly makes the BOM explode into itself. SAP only accepts it when the item
    is explicitly flagged as recursive-allowed (e.g. recycling of a by-product).
  rule_authority: sap_hard_constraint
  sap_impact: BOM explosion in MRP, costing and order creation stops with a recursion error for the assembly.
  fix_map:
    __other__: Remove the component or, if the recursion is intended, set 'recursiveness allowed' on the item via CS02 (ECC
      and S/4HANA; Fiori Maintain Bill of Material).
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: component {actual_value} is the header material.'
- id: PP034
  field: STPO.ROMS1
  check_class: cross_field_check
  fail_when: ~(`STPO.ROMS1` > 0)
  applies_when:
    STPO.POSTP:
    - R
  severity: high
  dimension: completeness
  message: Variable-size item has no size
  why_it_matters: A variable-size item (category R) is a piece cut from a stock material; its quantity is calculated from
    its sizes with the formula. CS01 requires at least size 1.
  rule_authority: sap_hard_constraint
  sap_impact: The variable-size quantity cannot be calculated; the component requirement is wrong.
  fix_map:
    __other__: Enter the sizes (and number of pieces) on the item via CS02 (ECC and S/4HANA; Fiori Maintain Bill of Material).
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: size 1 is {actual_value}.'
- id: PP035
  field: STPO.ROMEI
  check_class: null_check
  applies_when:
    STPO.POSTP:
    - R
  severity: medium
  dimension: completeness
  message: Variable-size item has no unit for its sizes
  why_it_matters: The sizes of a variable-size item are in the size unit (mm, m); the formula converts them into the component
    quantity with it.
  rule_authority: sap_hard_constraint
  sap_impact: The variable-size quantity cannot be computed.
  fix_map:
    __blank__: Enter the unit for the sizes on the item via CS02 (ECC and S/4HANA; Fiori Maintain Bill of Material).
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: size unit missing.'
- id: PP036
  field: STPO.DOKNR
  check_class: null_check
  applies_when:
    STPO.POSTP:
    - D
  severity: medium
  dimension: completeness
  message: Document item has no document number
  why_it_matters: A document item (category D) links a drawing or specification from document management to the BOM; the
    document number is the link.
  rule_authority: sap_hard_constraint
  sap_impact: Shop papers and engineering views show an empty document reference.
  fix_map:
    __blank__: Enter the document (type, number, part, version) on the item via CS02 (ECC and S/4HANA; Fiori Maintain Bill
      of Material).
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: document item without a document.'
- id: PP037
  field: STPO.DOKAR
  check_class: null_check
  applies_when:
    STPO.POSTP:
    - D
  severity: medium
  dimension: completeness
  message: Document item has no document type
  why_it_matters: The document type is part of the document key (type, number, part, version); without it the document cannot
    be found.
  rule_authority: sap_hard_constraint
  sap_impact: The linked document cannot be opened from the BOM.
  fix_map:
    __blank__: Enter the document type on the item via CS02 (ECC and S/4HANA; Fiori Maintain Bill of Material).
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: document type missing.'
- id: PP038
  field: STPO.MATKL
  check_class: null_check
  applies_when:
    STPO.POSTP:
    - N
    STPO.IDNRK:
      blank: true
  severity: high
  dimension: completeness
  message: Non-stock item without a material has no material group
  why_it_matters: A non-stock item (category N) without a material master is procured directly for the order; the purchase
    requisition takes its material group from the BOM item, and CS01 requires it.
  rule_authority: sap_hard_constraint
  sap_impact: The order's purchase requisition cannot be created for the item.
  fix_map:
    __blank__: Enter the material group in the item's purchasing data via CS02 (ECC and S/4HANA; Fiori Maintain Bill of
      Material).
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: non-stock item without material group.'
- id: PP039
  field: STPO.SAKTO
  check_class: null_check
  applies_when:
    STPO.POSTP:
    - N
    STPO.IDNRK:
      blank: true
  severity: high
  dimension: completeness
  message: Non-stock item without a material has no cost element
  why_it_matters: Costs of a directly procured non-stock item are posted to the order under the item's cost element; CS01
    requires it in the purchasing data.
  rule_authority: sap_hard_constraint
  sap_impact: The requisition / PO for the item has no account to post to, and product costing omits the item.
  fix_map:
    __blank__: Enter the cost element in the item's purchasing data via CS02 (ECC and S/4HANA; Fiori Maintain Bill of Material).
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: non-stock item without cost element.'
- id: PP040
  field: STPO.ALPGR
  check_class: null_check
  applies_when:
    STPO.ALPOS:
    - X
  severity: medium
  dimension: completeness
  message: Alternative item has no alternative item group
  why_it_matters: Alternative items are interchangeable components grouped by the alternative item group, which carries
    the strategy and usage probabilities. An alternative item outside a group is never substituted.
  rule_authority: sap_hard_constraint
  sap_impact: Availability-driven substitution and probability-weighted planning do not work for the item.
  fix_map:
    __blank__: Enter the alternative item group (with strategy and usage probability) via CS02 (ECC and S/4HANA; Fiori Maintain
      Bill of Material).
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: alternative item without group.'
- id: PP041
  field: PLKO.PLNME
  check_class: null_check
  applies_when: &id001
    PLKO.PLNTY:
    - N
    - R
    - '2'
    - S
  severity: high
  dimension: completeness
  message: Routing / recipe has no task list unit of measure
  why_it_matters: Lot-size ranges and operation quantities of the task list are in its unit of measure (normally the material's
    base unit); CA01 requires it.
  rule_authority: sap_hard_constraint
  sap_impact: Order quantities cannot be converted into operation quantities; scheduling and costing are wrong.
  fix_map:
    __blank__: 'Enter the unit on the header via CA02 / C202 for master recipes (S/4HANA: Fiori Manage Routings).'
  record_fix_template: 'Task list {PLKO.PLNTY}/{PLKO.PLNNR}/{PLKO.PLNAL}: unit missing.'
- id: PP042
  field: PLKO.LOSBS
  check_class: cross_field_check
  require_populated: true
  fail_when: '`PLKO.LOSBS` <= 0'
  applies_when: *id001
  severity: high
  dimension: consistency
  message: Routing / recipe to-lot-size is zero
  why_it_matters: A task list is selected for an order only when the order quantity lies in its lot-size range; the standard
    upper limit is 99,999,999. A zero upper limit excludes every order.
  rule_authority: sap_hard_constraint
  sap_impact: Automatic routing selection never finds the task list; orders are created without operations.
  fix_map:
    __other__: 'Set the to-lot-size (normally 99,999,999) on the header via CA02 / C202 for master recipes (S/4HANA: Fiori
      Manage Routings).'
  record_fix_template: 'Task list {PLKO.PLNTY}/{PLKO.PLNNR}/{PLKO.PLNAL}: to-lot-size {actual_value}.'
- id: PP043
  field: PLPO.VORNR
  check_class: null_check
  applies_when: &id002
    PLPO.PLNTY:
    - N
    - R
    - '2'
    - S
    PLPO.LOEKZ:
      not_in:
      - X
  severity: high
  dimension: completeness
  message: Operation has no operation number
  why_it_matters: The operation number orders the operations and is how component allocations, confirmations and capacity
    requirements refer to it.
  rule_authority: sap_hard_constraint
  sap_impact: Operations cannot be sequenced, confirmed or referenced.
  fix_map:
    __blank__: 'Renumber the operations via CA02 / C202 for master recipes (S/4HANA: Fiori Manage Routings).'
  record_fix_template: 'Task list {PLPO.PLNTY}/{PLPO.PLNNR} operation {PLPO.VORNR}: operation number missing.'
- id: PP044
  field: PLPO.STEUS
  check_class: null_check
  applies_when: *id002
  severity: critical
  dimension: completeness
  message: Operation has no control key
  why_it_matters: The control key decides whether an operation is scheduled, costed, confirmed, printed or processed externally;
    CA01 requires it on every operation.
  rule_authority: sap_hard_constraint
  sap_impact: The operation is neither scheduled nor costed nor confirmable in production orders.
  fix_map:
    __blank__: 'Enter the control key (e.g. PP01) via CA02 / C202 for master recipes (S/4HANA: Fiori Manage Routings).'
  record_fix_template: 'Task list {PLPO.PLNTY}/{PLPO.PLNNR} operation {PLPO.VORNR}: control key missing.'
- id: PP045
  field: PLPO.BMSCH
  check_class: cross_field_check
  require_populated: true
  fail_when: '`PLPO.BMSCH` <= 0'
  applies_when: *id002
  severity: high
  dimension: consistency
  message: Operation base quantity is zero
  why_it_matters: Standard values (setup, machine, labour) are given per operation base quantity; scheduling and costing
    scale them by order quantity / base quantity.
  rule_authority: sap_hard_constraint
  sap_impact: Operation durations and costs divide by zero.
  fix_map:
    __other__: 'Set the base quantity of the operation (normally 1) via CA02 / C202 for master recipes (S/4HANA: Fiori Manage
      Routings).'
  record_fix_template: 'Task list {PLPO.PLNTY}/{PLPO.PLNNR} operation {PLPO.VORNR}: base quantity {actual_value}.'
- id: PP046
  field: PLPO.UMREZ
  check_class: cross_field_check
  require_populated: true
  fail_when: (`PLPO.UMREZ` <= 0) | (`PLPO.UMREN` <= 0)
  applies_when: *id002
  severity: high
  dimension: consistency
  message: Operation unit conversion to the task list unit is zero
  why_it_matters: Operation quantities are converted from the task list unit with UMREZ / UMREN (1 / 1 when the units are
    the same). A zero factor divides by zero.
  rule_authority: sap_hard_constraint
  sap_impact: Operation quantities, durations and confirmations cannot be computed.
  fix_map:
    __other__: 'Correct the conversion of the operation unit via CA02 / C202 for master recipes (S/4HANA: Fiori Manage Routings).'
  record_fix_template: 'Task list {PLPO.PLNTY}/{PLPO.PLNNR} operation {PLPO.VORNR}: conversion {PLPO.UMREZ}/{PLPO.UMREN}.'
- id: PP047
  field: PLPO.VGW01
  check_class: cross_field_check
  fail_when: (`PLPO.VGW01` > 0) & `PLPO.VGE01`.isna()
  applies_when: *id002
  severity: high
  dimension: completeness
  message: Operation standard value 1 (typically setup) is maintained without its unit
  why_it_matters: Each standard value is a duration or quantity whose unit (minutes, hours) is required next to it; CA01
    refuses a value without its unit. Which activity a standard value measures (setup, machine, labour) is set by the work
    centre's standard value key.
  rule_authority: sap_hard_constraint
  sap_impact: Scheduling and costing cannot convert the standard value into time or cost; the operation is scheduled and
    costed as if it took no time.
  fix_map:
    __other__: 'Enter the unit for the standard value via CA02 / C202 for master recipes (S/4HANA: Fiori Manage Routings).'
  record_fix_template: 'Task list {PLPO.PLNTY}/{PLPO.PLNNR} operation {PLPO.VORNR}: standard value 1 without unit.'
- id: PP062
  field: PLPO.VGW02
  check_class: cross_field_check
  fail_when: (`PLPO.VGW02` > 0) & `PLPO.VGE02`.isna()
  applies_when: *id002
  severity: high
  dimension: completeness
  message: Operation standard value 2 (typically machine) is maintained without its unit
  why_it_matters: Each standard value is a duration or quantity whose unit (minutes, hours) is required next to it; CA01
    refuses a value without its unit. Which activity a standard value measures (setup, machine, labour) is set by the work
    centre's standard value key.
  rule_authority: sap_hard_constraint
  sap_impact: Scheduling and costing cannot convert the standard value into time or cost; the operation is scheduled and
    costed as if it took no time.
  fix_map:
    __other__: 'Enter the unit for the standard value via CA02 / C202 for master recipes (S/4HANA: Fiori Manage Routings).'
  record_fix_template: 'Task list {PLPO.PLNTY}/{PLPO.PLNNR} operation {PLPO.VORNR}: standard value 2 without unit.'
- id: PP063
  field: PLPO.VGW03
  check_class: cross_field_check
  fail_when: (`PLPO.VGW03` > 0) & `PLPO.VGE03`.isna()
  applies_when: *id002
  severity: high
  dimension: completeness
  message: Operation standard value 3 (typically labour) is maintained without its unit
  why_it_matters: Each standard value is a duration or quantity whose unit (minutes, hours) is required next to it; CA01
    refuses a value without its unit. Which activity a standard value measures (setup, machine, labour) is set by the work
    centre's standard value key.
  rule_authority: sap_hard_constraint
  sap_impact: Scheduling and costing cannot convert the standard value into time or cost; the operation is scheduled and
    costed as if it took no time.
  fix_map:
    __other__: 'Enter the unit for the standard value via CA02 / C202 for master recipes (S/4HANA: Fiori Manage Routings).'
  record_fix_template: 'Task list {PLPO.PLNTY}/{PLPO.PLNNR} operation {PLPO.VORNR}: standard value 3 without unit.'
- id: PP048
  field: CRHD.ENDDA
  check_class: cross_field_check
  fail_when: '`CRHD.BEGDA` > `CRHD.ENDDA`'
  applies_when:
    CRHD.OBJTY:
    - A
  severity: high
  dimension: consistency
  message: Work centre validity ends before it starts
  why_it_matters: A work centre is valid from BEGDA to ENDDA; operations can only use it within that period. An end before
    the start is an empty period.
  rule_authority: sap_hard_constraint
  sap_impact: The work centre cannot be used in task lists or orders; scheduling and capacity planning fail for operations
    that reference it.
  fix_map:
    __other__: Correct the validity via CR02 (ECC and S/4HANA).
  record_fix_template: 'Work centre {CRHD.ARBPL} plant {CRHD.WERKS}: valid {CRHD.BEGDA} to {actual_value}.'
- id: PP049
  field: CRHD.VERWE
  check_class: null_check
  applies_when:
    CRHD.OBJTY:
    - A
  severity: high
  dimension: completeness
  message: Work centre has no work centre category
  why_it_matters: The work centre category controls which screens, fields and task list types the work centre can be used
    with; CR01 requires it.
  rule_authority: sap_hard_constraint
  sap_impact: The work centre cannot be maintained or assigned consistently.
  fix_map:
    __blank__: The category is set at creation; recreate the work centre via CR01 or correct it via CR02 (ECC and S/4HANA).
  record_fix_template: 'Work centre {CRHD.ARBPL} plant {CRHD.WERKS}: category missing.'
- id: PP050
  field: CRHD.ARBPL
  check_class: uniqueness_check
  fields:
  - CRHD.WERKS
  - CRHD.ARBPL
  applies_when:
    CRHD.OBJTY:
    - A
  severity: high
  dimension: uniqueness
  message: The same work centre name exists more than once in a plant
  why_it_matters: Task lists, orders and confirmations refer to a work centre by plant and name; SAP keeps that pair unique
    (CR01 refuses a duplicate). Duplicates come from direct loads and make the reference ambiguous.
  rule_authority: sap_hard_constraint
  sap_impact: Operations pick either record; capacity, costing rates and confirmations are split between them.
  fix_map:
    __other__: 'Keep one work centre per plant and name: reassign task lists and orders to it (CA85 mass replace) and flag
      the other for deletion.'
  record_fix_template: 'Work centre {CRHD.ARBPL} plant {CRHD.WERKS}: name used by another work centre (object {CRHD.OBJID}).'
- id: PP051
  field: MARC.SFEPR
  check_class: null_check
  applies_when:
    MARC.SAUFT:
    - X
  severity: high
  dimension: completeness
  message: Material allowed for repetitive manufacturing has no REM profile
  why_it_matters: 'Repetitive manufacturing (MRP 4 > ''Repetitive mfg'') is controlled entirely by the REM profile: backflushing,
    reporting points, activity posting and the planned order type. MM02 requires the profile when the indicator is set.'
  rule_authority: sap_hard_constraint
  sap_impact: Backflushing (MFBF) and run schedule quantities cannot be processed for the material.
  fix_map:
    __blank__: Enter the REM profile in MRP 4 via MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA).
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: repetitive manufacturing allowed but no REM profile.'
- id: PP052
  field: STKO.BMEIN
  check_class: referential_check
  severity: high
  dimension: validity
  message: BOM base unit (STKO.BMEIN) is not defined in the system's configuration (T006)
  why_it_matters: BOM base unit is a key into the system's own configuration (T006). A value that is not configured there
    cannot be interpreted by the functions that read it; SAP's own screens never accept it, so it comes from direct loads,
    client copies or configuration deleted after the fact.
  rule_authority: sap_hard_constraint
  sap_impact: Order quantities cannot be converted to the BOM base quantity.
  fix_map:
    __other__: '''{invalid_value}'' is not in T006. Correct the value via CS02 (ECC and S/4HANA; Fiori Maintain Bill of
      Material), or create it in customizing (CUNI) if it is genuinely needed.'
  record_fix_template: 'BOM {STKO.STLNR} alternative {STKO.STLAL}: bom base unit ''{actual_value}'' is not configured (T006).'
- id: PP053
  field: STPO.MEINS
  check_class: referential_check
  severity: high
  dimension: validity
  message: Component unit (STPO.MEINS) is not defined in the system's configuration (T006)
  why_it_matters: Component unit is a key into the system's own configuration (T006). A value that is not configured there
    cannot be interpreted by the functions that read it; SAP's own screens never accept it, so it comes from direct loads,
    client copies or configuration deleted after the fact.
  rule_authority: sap_hard_constraint
  sap_impact: Component requirements cannot be converted to the component's base unit.
  fix_map:
    __other__: '''{invalid_value}'' is not in T006. Correct the value via CS02 (ECC and S/4HANA; Fiori Maintain Bill of
      Material), or create it in customizing (CUNI) if it is genuinely needed.'
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: component unit ''{actual_value}'' is not configured (T006).'
- id: PP054
  field: STPO.LGORT
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Component issue storage location (STPO.LGORT) is not defined in the system's configuration (T001L)
  why_it_matters: Component issue storage location is a key into the system's own configuration (T001L). A value that is
    not configured there cannot be interpreted by the functions that read it; SAP's own screens never accept it, so it comes
    from direct loads, client copies or configuration deleted after the fact.
  rule_authority: sap_hard_constraint
  sap_impact: Reservations and backflushes default to a storage location that does not exist.
  fix_map:
    __other__: '''{invalid_value}'' is not in T001L. Correct the value via CS02 (ECC and S/4HANA; Fiori Maintain Bill of
      Material), or create it in customizing (OX09) if it is genuinely needed.'
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: component issue storage location ''{actual_value}'' is not configured
    (T001L).'
- id: PP055
  field: PLKO.PLNME
  check_class: referential_check
  severity: high
  dimension: validity
  message: Task list unit (PLKO.PLNME) is not defined in the system's configuration (T006)
  why_it_matters: Task list unit is a key into the system's own configuration (T006). A value that is not configured there
    cannot be interpreted by the functions that read it; SAP's own screens never accept it, so it comes from direct loads,
    client copies or configuration deleted after the fact.
  rule_authority: sap_hard_constraint
  sap_impact: Order quantities cannot be converted into operation quantities.
  fix_map:
    __other__: '''{invalid_value}'' is not in T006. Correct the value via CA02 / C202 for master recipes (S/4HANA: Fiori
      Manage Routings), or create it in customizing (CUNI) if it is genuinely needed.'
  record_fix_template: 'Task list {PLKO.PLNTY}/{PLKO.PLNNR}/{PLKO.PLNAL}: task list unit ''{actual_value}'' is not configured
    (T006).'
- id: PP056
  field: PLPO.STEUS
  check_class: referential_check
  applies_when: *id002
  severity: critical
  dimension: validity
  message: Operation control key (PLPO.STEUS) is not defined in the system's configuration (T430)
  why_it_matters: Operation control key is a key into the system's own configuration (T430). A value that is not configured
    there cannot be interpreted by the functions that read it; SAP's own screens never accept it, so it comes from direct
    loads, client copies or configuration deleted after the fact.
  rule_authority: sap_hard_constraint
  sap_impact: The operation cannot be scheduled, costed or confirmed.
  fix_map:
    __other__: '''{invalid_value}'' is not in T430. Correct the value via CA02 / C202 for master recipes (S/4HANA: Fiori
      Manage Routings), or create it in customizing (OPJ8) if it is genuinely needed.'
  record_fix_template: 'Task list {PLPO.PLNTY}/{PLPO.PLNNR} operation {PLPO.VORNR}: operation control key ''{actual_value}''
    is not configured (T430).'
- id: PP057
  field: PLPO.MEINH
  check_class: referential_check
  applies_when: *id002
  severity: medium
  dimension: validity
  message: Operation unit (PLPO.MEINH) is not defined in the system's configuration (T006)
  why_it_matters: Operation unit is a key into the system's own configuration (T006). A value that is not configured there
    cannot be interpreted by the functions that read it; SAP's own screens never accept it, so it comes from direct loads,
    client copies or configuration deleted after the fact.
  rule_authority: sap_hard_constraint
  sap_impact: Operation quantities cannot be converted.
  fix_map:
    __other__: '''{invalid_value}'' is not in T006. Correct the value via CA02 / C202 for master recipes (S/4HANA: Fiori
      Manage Routings), or create it in customizing (CUNI) if it is genuinely needed.'
  record_fix_template: 'Task list {PLPO.PLNTY}/{PLPO.PLNNR} operation {PLPO.VORNR}: operation unit ''{actual_value}'' is
    not configured (T006).'
- id: PP058
  field: CRHD.VERWE
  check_class: referential_check
  applies_when:
    CRHD.OBJTY:
    - A
  severity: high
  dimension: validity
  message: Work centre category (CRHD.VERWE) is not defined in the system's configuration (TC30)
  why_it_matters: Work centre category is a key into the system's own configuration (TC30). A value that is not configured
    there cannot be interpreted by the functions that read it; SAP's own screens never accept it, so it comes from direct
    loads, client copies or configuration deleted after the fact.
  rule_authority: sap_hard_constraint
  sap_impact: The work centre cannot be maintained or used in task lists.
  fix_map:
    __other__: '''{invalid_value}'' is not in TC30. Correct the value via CR02 (ECC and S/4HANA), or create it in customizing
      (OP40) if it is genuinely needed.'
  record_fix_template: 'Work centre {CRHD.ARBPL} plant {CRHD.WERKS}: work centre category ''{actual_value}'' is not configured
    (TC30).'
- id: PP059
  field: CRHD.PLANV
  check_class: referential_check
  applies_when:
    CRHD.OBJTY:
    - A
  severity: medium
  dimension: validity
  message: Work centre task list usage (CRHD.PLANV) is not defined in the system's configuration (TC23)
  why_it_matters: Work centre task list usage is a key into the system's own configuration (TC23). A value that is not configured
    there cannot be interpreted by the functions that read it; SAP's own screens never accept it, so it comes from direct
    loads, client copies or configuration deleted after the fact.
  rule_authority: sap_hard_constraint
  sap_impact: Task lists of the intended type cannot use the work centre.
  fix_map:
    __other__: '''{invalid_value}'' is not in TC23. Correct the value via CR02 (ECC and S/4HANA), or create it in customizing
      (OP45) if it is genuinely needed.'
  record_fix_template: 'Work centre {CRHD.ARBPL} plant {CRHD.WERKS}: work centre task list usage ''{actual_value}'' is not
    configured (TC23).'
- id: PP060
  field: CRHD.VGWTS
  check_class: referential_check
  applies_when:
    CRHD.OBJTY:
    - A
  severity: high
  dimension: validity
  message: Standard value key (CRHD.VGWTS) is not defined in the system's configuration (TC21)
  why_it_matters: Standard value key is a key into the system's own configuration (TC21). A value that is not configured
    there cannot be interpreted by the functions that read it; SAP's own screens never accept it, so it comes from direct
    loads, client copies or configuration deleted after the fact.
  rule_authority: sap_hard_constraint
  sap_impact: Operations at the work centre have no standard value parameters; scheduling and costing formulas fail.
  fix_map:
    __other__: '''{invalid_value}'' is not in TC21. Correct the value via CR02 (ECC and S/4HANA), or create it in customizing
      (OP19) if it is genuinely needed.'
  record_fix_template: 'Work centre {CRHD.ARBPL} plant {CRHD.WERKS}: standard value key ''{actual_value}'' is not configured
    (TC21).'
- id: PP061
  field: MARC.SFEPR
  check_class: referential_check
  severity: high
  dimension: validity
  message: Repetitive manufacturing profile (MARC.SFEPR) is not defined in the system's configuration (T437S)
  why_it_matters: Repetitive manufacturing profile is a key into the system's own configuration (T437S). A value that is
    not configured there cannot be interpreted by the functions that read it; SAP's own screens never accept it, so it comes
    from direct loads, client copies or configuration deleted after the fact.
  rule_authority: sap_hard_constraint
  sap_impact: Backflushing and run schedule processing fail for the material.
  fix_map:
    __other__: '''{invalid_value}'' is not in T437S. Correct the value via MM02 (ECC) or Fiori F1602 Manage Product Master
      Data (S/4HANA), or create it in customizing (OSP2) if it is genuinely needed.'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: repetitive manufacturing profile ''{actual_value}'' is
    not configured (T437S).'
- id: PP064
  field: STPO.IDNRK
  check_class: exists_check
  target_table: MARA
  target_fields:
  - MATNR
  target_when:
    LVORM:
      blank: true
  severity: high
  dimension: consistency
  message: BOM component does not exist or is flagged for deletion
  why_it_matters: BOM explosion turns each component into a dependent requirement; a dead component creates requirements for
    material that can no longer be procured or produced.
  rule_authority: sap_hard_constraint
  sap_impact: MRP plans a deleted material; production orders cannot issue the component.
  fix_map:
    __other__: Replace the component in the BOM (CS02) with its successor, or remove it.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: component {STPO.IDNRK} does not exist or is deleted.'
- id: PP065
  field: MAST.MATNR
  check_class: exists_check
  fields:
  - MAST.MATNR
  - MAST.WERKS
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    LVORM:
      blank: true
  severity: high
  dimension: consistency
  message: BOM exists for a material that is not active in the plant
  why_it_matters: A plant BOM is used by MRP and production in that plant only; without an active plant record it is never
    used.
  rule_authority: sap_hard_constraint
  sap_impact: Dead BOMs mislead costing and engineering-change analysis.
  fix_map:
    __other__: Delete the BOM allocation (CS02) or extend the material to the plant.
  record_fix_template: 'BOM allocation {MAST.MATNR} plant {MAST.WERKS}: the material is not active in the plant.'

- id: PP066
  field: PLPO.ARBID
  check_class: exists_check
  target_table: CRHD
  target_fields:
  - OBJID
  target_when:
    OBJTY: [A]
    LVORM: {blank: true}
  applies_when:
    PLPO.PLNTY: [N, R, '2', S]
  severity: critical
  dimension: consistency
  message: Operation work centre does not exist or is flagged for deletion
  why_it_matters: The work centre supplies the control key defaults, the formulas for scheduling, capacity and
    costing, and the activity types. An operation on a dead work centre cannot be scheduled or costed.
  rule_authority: sap_hard_constraint
  sap_impact: Order creation (CO01) and release fail or produce unscheduled, uncosted operations; standard cost
    estimates (CK11N) miss the activity.
  fix_map:
    __other__: Replace the work centre in the routing operation (CA02) with an active one.
  record_fix_template: 'Routing {PLPO.PLNTY}/{PLPO.PLNNR} node {PLPO.PLNKN}: work centre {PLPO.ARBID} does not
    exist or is deleted.'

- id: PP067
  field: MAPL.PLNNR
  check_class: exists_check
  fields:
  - MAPL.PLNTY
  - MAPL.PLNNR
  - MAPL.PLNAL
  - MAPL.WERKS
  target_table: PLKO
  target_fields:
  - PLNTY
  - PLNNR
  - PLNAL
  - WERKS
  target_when:
    LOEKZ: {blank: true}
  applies_when:
    MAPL.LOEKZ: {blank: true}
  severity: high
  dimension: consistency
  message: Material is assigned to a routing that is deleted or belongs to another plant
  why_it_matters: Routing selection for orders and costing reads the material assignment; an assignment to a dead
    or foreign-plant routing selects nothing, or selects the wrong operations.
  rule_authority: sap_hard_constraint
  sap_impact: Production orders are created without operations; cost estimates have no activity cost.
  fix_map:
    __other__: Delete the stale assignment (CA02 > Material assignment) and assign the active routing of the plant.
  record_fix_template: 'Material {MAPL.MATNR} plant {MAPL.WERKS}: assigned routing {MAPL.PLNTY}/{MAPL.PLNNR}/{MAPL.PLNAL}
    is deleted or in another plant.'

- id: PP068
  field: MARC.MATNR
  check_class: exists_check
  fields:
  - MARC.MATNR
  - MARC.WERKS
  target_table: MAPL
  target_fields:
  - MATNR
  - WERKS
  target_when:
    PLNTY: [N, R, '2']
    LOEKZ: {blank: true}
  applies_when:
    MARC.BESKZ: [E]
    MARC.SOBSL: {blank: true}
    MARC.DISMM: {populated: true, not_in: [ND]}
  severity: high
  dimension: completeness
  message: In-house-produced material has no routing in the plant
  why_it_matters: MRP plans in-house production for the material; without a routing, orders have no operations,
    lead time comes from MARC only, and the cost estimate has no labour or machine cost.
  rule_authority: best_practice
  sap_impact: Planned orders convert to production orders without operations; CK11N cost estimates under-cost
    the material.
  fix_map:
    __other__: Create and assign a routing (CA01) or, if the material is bought, set procurement type F (MM02 > MRP 2).
  record_fix_template: 'Material {MARC.MATNR} plant {MARC.WERKS}: in-house production but no routing.'

- id: PP069
  field: MARC.MATNR
  check_class: exists_check
  fields:
  - MARC.MATNR
  - MARC.WERKS
  target_table: MAST
  target_fields:
  - MATNR
  - WERKS
  target_when:
    STLAN: ['1', '3']
  applies_when:
    MARC.BESKZ: [E]
    MARC.SOBSL: {blank: true}
    MARC.DISMM: {populated: true, not_in: [ND]}
  severity: high
  dimension: completeness
  message: In-house-produced material has no production BOM in the plant
  why_it_matters: Without a production or universal BOM, MRP creates no dependent requirements for components and
    the order issues nothing.
  rule_authority: best_practice
  sap_impact: Component shortages are not planned; production orders have no reservations; costing has no material cost.
  fix_map:
    __other__: Create the plant BOM with usage 1 (CS01) or, if the material is bought, set procurement type F.
  record_fix_template: 'Material {MARC.MATNR} plant {MARC.WERKS}: in-house production but no production BOM.'

- id: PP070
  field: STPO.IDNRK
  check_class: exists_check
  grain: STPO
  fields:
  - STPO.IDNRK
  - MAST.WERKS
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    LVORM: {blank: true}
  applies_when:
    STPO.POSTP: [L, R]
  severity: high
  dimension: consistency
  message: BOM component is not active in the plant of the BOM
  why_it_matters: The component is planned and issued in the BOM's plant; without an active plant record there is
    no MRP, no storage location and no valuation for it there. PP064 only checks the client-level material.
  rule_authority: sap_hard_constraint
  sap_impact: BOM explosion in MRP and order creation stops with "material not maintained in plant"; costing fails.
  fix_map:
    __other__: Extend the component to the plant (MM01) or replace it in the BOM (CS02).
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: component {STPO.IDNRK} is not active in plant {MAST.WERKS}.'

- id: PP071
  field: PLKO.PLNNR
  check_class: exists_check
  fields:
  - PLKO.PLNTY
  - PLKO.PLNNR
  target_table: PLPO
  target_fields:
  - PLNTY
  - PLNNR
  target_when:
    LOEKZ: {blank: true}
  applies_when:
    PLKO.PLNTY: [N, R, '2']
  severity: high
  dimension: completeness
  message: Routing has no active operations
  why_it_matters: A routing without operations is selected for orders and costing but contributes nothing.
  rule_authority: sap_hard_constraint
  sap_impact: Orders are created without operations (no confirmation, no activity cost); cost estimates are incomplete.
  fix_map:
    __other__: Add the operations (CA02) or set the deletion flag on the empty routing.
  record_fix_template: 'Routing {PLKO.PLNTY}/{PLKO.PLNNR}/{PLKO.PLNAL}: no active operations.'

- id: PP072
  field: STKO.STLNR
  check_class: exists_check
  target_table: STPO
  target_fields:
  - STLNR
  target_when:
    STLTY: [M]
    LKENZ: {blank: true}
  applies_when:
    STKO.STLTY: [M]
  severity: high
  dimension: completeness
  message: Material BOM has no active items
  why_it_matters: An empty BOM is found by BOM selection, so MRP and costing treat the assembly as having no components.
  rule_authority: sap_hard_constraint
  sap_impact: No dependent requirements; production orders with no reservations; zero material cost in CK11N.
  fix_map:
    __other__: Add the components (CS02) or delete the empty BOM.
  record_fix_template: 'BOM {STKO.STLNR}/{STKO.STLAL}: no active items.'

- id: PP073
  field: PLPO.EKORG
  check_class: cross_field_check
  fail_when: '`PLPO.MATKL`.isna() | `PLPO.EKGRP`.isna() | `PLPO.SAKTO`.isna()'
  applies_when:
    PLPO.EKORG: {populated: true}
    PLPO.INFNR: {blank: true}
    PLPO.PLNTY: [N, R, '2', S]
  severity: medium
  dimension: completeness
  message: External-processing operation lacks material group, purchasing group or cost element
  why_it_matters: Externally processed operations (subcontracted machining, rebuilds) create a purchase requisition
    on release; without an info record, the requisition needs material group, purchasing group and cost element
    from the operation.
  rule_authority: sap_hard_constraint
  sap_impact: Order release fails to create the requisition or creates one that purchasing cannot convert; the
    external cost is not planned.
  fix_map:
    __other__: Maintain the external processing data on the operation (CA02 > External processing) or assign a
      purchasing info record.
  record_fix_template: 'Routing {PLPO.PLNTY}/{PLPO.PLNNR} node {PLPO.PLNKN}: external processing data incomplete.'
- id: PP200
  field: MAST.STLNR
  check_class: exists_check
  fields:
  - MAST.STLNR
  - MAST.STLAL
  target_table: STKO
  target_fields:
  - STLNR
  - STLAL
  target_when:
    STLTY:
    - M
  severity: high
  dimension: consistency
  message: Material is assigned to a BOM alternative that has no BOM header
  why_it_matters: MAST links a material and plant to a BOM number and alternative. If the header (STKO) for that alternative
    does not exist, BOM explosion finds an assignment but no BOM, so MRP and costing see no components.
  rule_authority: sap_hard_constraint
  sap_impact: MRP creates no dependent requirements; product costing and production orders explode an empty BOM.
  fix_map:
    __other__: Recreate the BOM alternative in CS02 or remove the broken material assignment (CS02 / CS20).
  record_fix_template: 'Material {MAST.MATNR} plant {MAST.WERKS}: BOM {MAST.STLNR} alternative {MAST.STLAL} has no header.'
- id: PP201
  field: CRHD.ENDDA
  check_class: freshness_check
  max_age_hours: 0
  applies_when:
    CRHD.OBJTY:
    - A
    CRHD.LVORM:
      blank: true
  severity: low
  dimension: timeliness
  message: Work centre validity has ended but the work centre is not flagged for deletion
  why_it_matters: A work centre whose validity has ended can no longer be used in new routings or orders, yet it still shows
    up in selections and capacity reports. It should be either extended or flagged for deletion.
  rule_authority: best_practice
  sap_impact: Routing maintenance and order creation fail with an invalid work centre; capacity reports carry dead resources.
  fix_map:
    __other__: Extend the validity in CR02, or set the deletion flag once no task list uses the work centre.
  record_fix_template: 'Work centre {CRHD.ARBPL} plant {CRHD.WERKS}: validity ended {age_days} days ago.'
- id: PP202
  field: MAST.WERKS
  check_class: exists_check
  fields:
  - MAST.MATNR
  - MAST.WERKS
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  severity: high
  dimension: consistency
  message: BOM is assigned to a material in a plant where the material has no plant view
  why_it_matters: A plant-specific material BOM is only used when the header material exists in that plant. Without the plant
    view the BOM can never be exploded by MRP, costing or production orders in that plant.
  rule_authority: sap_hard_constraint
  sap_impact: The BOM is dead data; planners maintain components that no process reads.
  fix_map:
    __other__: Extend the material to the plant (MM01) or delete the BOM assignment for that plant (CS02).
  record_fix_template: 'Material {MAST.MATNR}: BOM assigned in plant {MAST.WERKS} without a plant view.'
- id: PP203
  field: PLPO.PLNNR
  check_class: exists_check
  fields:
  - PLPO.PLNTY
  - PLPO.PLNNR
  target_table: PLKO
  target_fields:
  - PLNTY
  - PLNNR
  severity: medium
  dimension: consistency
  message: Task list operation belongs to a task list group with no header
  why_it_matters: Operations (PLPO) are read through their task list header (PLKO). An operation whose group has no header
    is orphaned - no order, cost estimate or maintenance plan can reach it - and usually remains after an incomplete deletion
    or load.
  rule_authority: sap_hard_constraint
  sap_impact: Orphaned operations inflate task list counts and break where-used and mass-change reports (CA85).
  fix_map:
    __other__: Recreate the task list header in CA02 / IA05 or delete the orphaned operations in a correction run.
  record_fix_template: 'Task list {PLPO.PLNTY}/{PLPO.PLNNR} operation {PLPO.VORNR}: no task list header.'
- id: PP204
  field: STPO.STLNR
  check_class: exists_check
  fields:
  - STPO.STLTY
  - STPO.STLNR
  target_table: STKO
  target_fields:
  - STLTY
  - STLNR
  severity: medium
  dimension: consistency
  message: BOM item belongs to a BOM number with no BOM header
  why_it_matters: BOM items (STPO) are only exploded through a BOM header (STKO). Items without a header are orphaned and
    never reach MRP or costing.
  rule_authority: sap_hard_constraint
  sap_impact: Components are missing from explosions; where-used lists (CS15) show items that no BOM uses.
  fix_map:
    __other__: Recreate the BOM header in CS02 or delete the orphaned items.
  record_fix_template: 'BOM {STPO.STLTY}/{STPO.STLNR} item {STPO.STLKN}: no BOM header.'
- id: PP205
  field: MAST.STLNR
  check_class: exists_check
  fields:
  - MAST.STLNR
  - MAST.STLAL
  target_table: STKO
  target_fields:
  - STLNR
  - STLAL
  target_when:
    STLTY:
    - M
    LKENZ:
      blank: true
  severity: high
  dimension: lifecycle
  message: Material is assigned to a BOM alternative that is flagged for deletion
  why_it_matters: The material-to-BOM link (MAST) still points at a BOM header whose deletion indicator is set. MRP and order
    creation read the link first, then find a deleted BOM.
  rule_authority: sap_hard_constraint
  sap_impact: Planned and production orders find no BOM for the material; dependent requirements are not created for the components.
  fix_map:
    __other__: Remove the assignment by deleting the BOM in CS02 completely, or restore the BOM alternative (CS02, reset the
      deletion flag).
  record_fix_template: 'Material {MAST.MATNR}, plant {MAST.WERKS}: BOM {MAST.STLNR} alternative {MAST.STLAL} is flagged for
    deletion.'
- id: PP206
  field: STKO.STLNR
  check_class: exists_check
  grain: STKO
  target_table: MAST
  target_fields:
  - STLNR
  applies_when:
    STKO.STLTY:
    - M
    STKO.LKENZ:
      blank: true
  severity: medium
  dimension: consistency
  message: Material BOM header is not assigned to any material (orphan BOM)
  why_it_matters: A material BOM (category M) is reached only through MAST. A header without a MAST row cannot be exploded
    for any material and hides stale engineering data.
  rule_authority: sap_hard_constraint
  sap_impact: The BOM is invisible to MRP, costing and order creation; it still shows in BOM reports and where-used lists
    as a valid structure.
  fix_map:
    __other__: Assign the BOM to a material in CS02, or flag the header for deletion.
  record_fix_template: 'BOM {STKO.STLNR} alternative {STKO.STLAL}: not assigned to a material (MAST).'
- id: PP207
  field: STKO.DATUV
  check_class: cross_field_check
  fail_when: (`STKO.DATUV` - @today).dt.days > 365
  applies_when:
    STKO.STLTY:
    - M
    STKO.LKENZ:
      blank: true
  severity: medium
  dimension: accuracy
  message: BOM header valid-from date is more than a year in the future
  why_it_matters: A far-future valid-from date usually comes from a mistyped year. Until the date arrives, the BOM is not
    selected for any order.
  rule_authority: best_practice
  sap_impact: MRP and order creation find no valid BOM for today; the material is planned without components.
  fix_map:
    __other__: Correct the valid-from date through a change number in CS02.
  record_fix_template: 'BOM {STKO.STLNR} alternative {STKO.STLAL}: valid from {actual_value}.'
- id: PP208
  field: STKO.AEDAT
  check_class: cross_field_check
  fail_when: '`STKO.AEDAT` < `STKO.ANDAT`'
  applies_when:
    STKO.AEDAT:
      populated: true
  severity: low
  dimension: accuracy
  message: BOM header change date is before its creation date
  why_it_matters: A change cannot precede the creation. The pair of dates shows a load that did not keep the audit fields
    of the source.
  rule_authority: best_practice
  sap_impact: Audit trails and change analysis in the BOM are unreliable.
  fix_map:
    __other__: Correct the audit fields in the load or recreate the header through CS01.
  record_fix_template: 'BOM {STKO.STLNR} alternative {STKO.STLAL}: changed {actual_value}, created {STKO.ANDAT}.'
- id: PP209
  field: STKO.STLST
  check_class: null_check
  applies_when:
    STKO.STLTY:
    - M
    STKO.LKENZ:
      blank: true
  severity: high
  dimension: completeness
  message: Material BOM has no BOM status
  why_it_matters: The BOM status decides whether MRP, costing and orders may use the BOM. A blank status is not a valid state.
  rule_authority: sap_hard_constraint
  sap_impact: The BOM is treated as unusable or is selected inconsistently between functions.
  fix_map:
    __blank__: Set the BOM status (active or inactive) in CS02 > Header.
  record_fix_template: 'BOM {STKO.STLNR} alternative {STKO.STLAL}: no BOM status.'
- id: PP210
  field: STKO.STKTX
  check_class: null_check
  applies_when:
    STKO.STLTY:
    - M
    STKO.LKENZ:
      blank: true
  severity: low
  dimension: completeness
  message: Active material BOM has no alternative text
  why_it_matters: The alternative text is how planners tell alternatives apart in CS03 and in the production-version selection.
    A multi-alternative BOM without text is hard to use.
  rule_authority: best_practice
  sap_impact: Wrong alternative is chosen when production versions are created.
  fix_map:
    __blank__: Enter a short alternative text in CS02 > Header.
  record_fix_template: 'BOM {STKO.STLNR} alternative {STKO.STLAL}: no alternative text.'
- id: PP211
  field: STKO.WRKAN
  check_class: referential_check
  severity: medium
  dimension: validity
  message: BOM alternative-determination plant (STKO.WRKAN) is not a plant (T001W)
  why_it_matters: WRKAN names the plant used to find the BOM alternative. A value that is not a plant leaves automatic alternative
    selection without a base.
  rule_authority: sap_hard_constraint
  sap_impact: Automatic BOM alternative selection fails for the BOM.
  fix_map:
    __other__: Correct the plant in CS02 > Header, or create the plant in customizing.
  record_fix_template: 'BOM {STKO.STLNR}: alternative-determination plant ''{actual_value}'' is not in T001W.'
- id: PP212
  field: STKO.LABOR
  check_class: referential_check
  severity: low
  dimension: validity
  message: BOM laboratory/design office (STKO.LABOR) is not defined in the system's configuration (T024L)
  why_it_matters: The laboratory or design office is a key into customizing. An undefined value cannot be selected or reported
    on.
  rule_authority: sap_hard_constraint
  sap_impact: Design-office reports and authorisation checks on the BOM skip the record.
  fix_map:
    __other__: Correct the value in CS02 > Header or create the office in customizing.
  record_fix_template: 'BOM {STKO.STLNR}: laboratory/design office ''{actual_value}'' is not in T024L.'
- id: PP213
  field: STKO.AENNR
  check_class: referential_check
  severity: medium
  dimension: validity
  message: BOM change number (STKO.AENNR) is not a change master (AENR)
  why_it_matters: Every history record of a BOM is tied to a change number. A number without a change master cannot show the
    reason or validity of the change.
  rule_authority: sap_hard_constraint
  sap_impact: Engineering change history for the BOM is broken; time-dependent explosion by change status is unreliable.
  fix_map:
    __other__: Create the change master (CC01) or correct the change number.
  record_fix_template: 'BOM {STKO.STLNR}: change number ''{actual_value}'' is not in AENR.'
- id: PP214
  field: STZU.STLAN
  check_class: referential_check
  severity: medium
  dimension: validity
  message: BOM general data usage (STZU.STLAN) is not defined in the system's configuration (T416)
  why_it_matters: The BOM usage (production, engineering, sales) is customizing. An undefined usage cannot be used in selection.
  rule_authority: sap_hard_constraint
  sap_impact: BOM explosions by usage skip the BOM.
  fix_map:
    __other__: Correct the usage in CS02 or create it in customizing.
  record_fix_template: 'BOM {STZU.STLNR}: usage ''{actual_value}'' is not in T416.'
- id: PP215
  field: STZU.WRKAN
  check_class: referential_check
  severity: low
  dimension: validity
  message: BOM general data plant (STZU.WRKAN) is not a plant (T001W)
  why_it_matters: The plant in the general BOM data steers alternative selection for the whole BOM group. A non-plant value
    breaks it.
  rule_authority: sap_hard_constraint
  sap_impact: Alternative selection fails for every alternative of the group.
  fix_map:
    __other__: Correct the plant in CS02 > General data.
  record_fix_template: 'BOM {STZU.STLNR}: plant ''{actual_value}'' is not in T001W.'
- id: PP216
  field: MAST.STLAL
  check_class: exists_check
  fields:
  - MAST.STLNR
  target_table: STPO
  target_fields:
  - STLNR
  target_when:
    STLTY:
    - M
    LKENZ:
      blank: true
  severity: high
  dimension: consistency
  message: Material BOM alternative has no active items
  why_it_matters: An alternative with only deleted items explodes to nothing; MRP then treats the parent as having no components.
  rule_authority: best_practice
  sap_impact: Dependent requirements are not generated and the cost estimate is empty.
  fix_map:
    __other__: Add items in CS02 or remove the assignment.
  record_fix_template: 'Material {MAST.MATNR}, plant {MAST.WERKS}: BOM {MAST.STLNR} alternative {MAST.STLAL} has no active
    items.'
- id: PP217
  field: STPO.DATUV
  check_class: cross_field_check
  fail_when: (`STPO.DATUV` - @today).dt.days > 365
  applies_when:
    STPO.LKENZ:
      blank: true
  severity: medium
  dimension: accuracy
  message: BOM item valid-from date is more than a year in the future
  why_it_matters: A far-future valid-from date is mostly a mistyped year. The item is not part of the structure until the
    date arrives.
  rule_authority: best_practice
  sap_impact: The component is missing from MRP, costing and order reservations today.
  fix_map:
    __other__: Correct the date through a change number in CS02.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: valid from {actual_value}.'
- id: PP218
  field: STPO.AEDAT
  check_class: cross_field_check
  fail_when: '`STPO.AEDAT` < `STPO.ANDAT`'
  applies_when:
    STPO.AEDAT:
      populated: true
  severity: low
  dimension: accuracy
  message: BOM item change date is before its creation date
  why_it_matters: A change cannot precede the creation. The item audit fields come from a load that did not keep them.
  rule_authority: best_practice
  sap_impact: Audit and change analysis on the item are unreliable.
  fix_map:
    __other__: Correct the audit fields in the load.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: changed {actual_value}, created {STPO.ANDAT}.'
- id: PP219
  field: STPO.POSNR
  check_class: null_check
  applies_when:
    STPO.POSTP:
    - L
    - N
    - R
    - K
    - D
    STPO.LKENZ:
      blank: true
  severity: medium
  dimension: completeness
  message: Stock, non-stock, variable-size or class item has no item number
  why_it_matters: The item number is how users, drawings and the production order identify a line. Blank numbers make lines
    indistinguishable.
  rule_authority: best_practice
  sap_impact: Component lists, drawings and order reservations cannot be matched to the BOM line.
  fix_map:
    __blank__: Enter the item number in CS02.
  record_fix_template: 'BOM {STPO.STLNR} item node {STPO.STLKN}: no item number.'
- id: PP220
  field: STPO.AUSCH
  check_class: cross_field_check
  fail_when: (`STPO.AUSCH` > 100) | (`STPO.AUSCH` < 0)
  applies_when:
    STPO.LKENZ:
      blank: true
  severity: high
  dimension: accuracy
  message: Component scrap is negative or above 100 percent
  why_it_matters: Component scrap in percent increases the planned quantity. A value above 100 or below zero gives a nonsensical
    gross quantity.
  rule_authority: sap_hard_constraint
  sap_impact: Gross requirement and costing quantity of the component are wrong.
  fix_map:
    __other__: Correct the component scrap in CS02 > Item > Basic data.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: component scrap is {actual_value} percent.'
- id: PP221
  field: STPO.AVOAU
  check_class: cross_field_check
  fail_when: (`STPO.AVOAU` > 100) | (`STPO.AVOAU` < 0)
  applies_when:
    STPO.LKENZ:
      blank: true
  severity: medium
  dimension: accuracy
  message: Operation scrap is negative or above 100 percent
  why_it_matters: Operation scrap is the loss at the operation where the component is used. Outside 0 to 100 percent it is
    not a valid rate.
  rule_authority: sap_hard_constraint
  sap_impact: Planned component quantity and cost are wrong.
  fix_map:
    __other__: Correct the operation scrap in CS02 > Item > Basic data.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: operation scrap is {actual_value} percent.'
- id: PP222
  field: STPO.NETAU
  check_class: cross_field_check
  fail_when: (`STPO.NETAU` == 'X') & (`STPO.AUSCH` > 0)
  applies_when:
    STPO.LKENZ:
      blank: true
  severity: low
  dimension: consistency
  message: Net indicator is set although component scrap is maintained
  why_it_matters: With the net indicator the system ignores the component scrap. Scrap entered on the same line has no effect
    and shows an unclear intent.
  rule_authority: best_practice
  sap_impact: Planners expect a scrap quantity that MRP never adds.
  fix_map:
    __other__: Clear the net indicator or the component scrap in CS02.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: net indicator set with scrap {STPO.AUSCH}.'
- id: PP223
  field: STPO.EWAHR
  check_class: cross_field_check
  fail_when: (`STPO.EWAHR` > 100) | (`STPO.EWAHR` < 0)
  applies_when:
    STPO.ALPOS:
    - X
    STPO.LKENZ:
      blank: true
  severity: medium
  dimension: accuracy
  message: Usage probability of an alternative item is above 100 percent or negative
  why_it_matters: Usage probability splits the requirement between alternative items. A value outside 0 to 100 percent is
    invalid.
  rule_authority: sap_hard_constraint
  sap_impact: The split of dependent requirements between alternative items is wrong.
  fix_map:
    __other__: Correct the usage probability in CS02 > Item > Alternative items.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: usage probability {actual_value}.'
- id: PP224
  field: STPO.ALPST
  check_class: null_check
  applies_when:
    STPO.ALPOS:
    - X
    STPO.LKENZ:
      blank: true
  severity: high
  dimension: completeness
  message: Alternative item has no strategy
  why_it_matters: An item that belongs to an alternative item group needs a strategy (ranking order or usage probability)
    so MRP knows which alternative to use.
  rule_authority: sap_hard_constraint
  sap_impact: MRP cannot choose between the alternative items; requirements for the group are not created.
  fix_map:
    __blank__: Maintain the strategy on the item in CS02 > Item > Alternative items.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: alternative item without strategy.'
- id: PP225
  field: STPO.ALPRF
  check_class: null_check
  applies_when:
    STPO.ALPST:
    - '1'
    STPO.LKENZ:
      blank: true
  severity: high
  dimension: completeness
  message: Alternative item ranked by priority has no ranking order
  why_it_matters: With the ranking-order strategy, MRP takes the alternative with the best rank first. A blank rank leaves
    the order undefined.
  rule_authority: sap_hard_constraint
  sap_impact: MRP may take the wrong alternative, or none.
  fix_map:
    __blank__: Enter the ranking order in CS02 > Item > Alternative items.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: ranking order missing.'
- id: PP226
  field: STPO.EWAHR
  check_class: cross_field_check
  fail_when: '`STPO.EWAHR`.isna() | (`STPO.EWAHR` <= 0)'
  applies_when:
    STPO.ALPST:
    - '2'
    STPO.LKENZ:
      blank: true
  severity: high
  dimension: completeness
  message: Alternative item with the usage-probability strategy has no usage probability
  why_it_matters: With the probability strategy the share of each alternative must be given. Blank or zero means the item
    receives no requirement.
  rule_authority: sap_hard_constraint
  sap_impact: The component receives no dependent requirement; production runs short of it.
  fix_map:
    __other__: Enter the usage probability in CS02 > Item > Alternative items.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: usage probability missing or zero.'
- id: PP227
  field: STPO.PSWRK
  check_class: exists_check
  fields:
  - STPO.IDNRK
  - STPO.PSWRK
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    LVORM:
      blank: true
  applies_when:
    STPO.POSTP:
    - L
    - R
    STPO.LKENZ:
      blank: true
    STPO.PSWRK:
      populated: true
  severity: high
  dimension: consistency
  message: Component plant override has no active plant view for the component
  why_it_matters: When the item names a different plant for the component, the component must be maintained there. Otherwise
    reservations point at a plant without the material.
  rule_authority: sap_hard_constraint
  sap_impact: Goods issue and MRP for the component fail or post to the wrong plant.
  fix_map:
    __other__: Extend the component to that plant (MM01) or clear the plant on the item.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: component {STPO.IDNRK} is not active in plant {STPO.PSWRK}.'
- id: PP228
  field: STPO.PREIS
  check_class: null_check
  applies_when:
    STPO.POSTP:
    - N
    STPO.LKENZ:
      blank: true
  severity: medium
  dimension: completeness
  message: Non-stock item has no price
  why_it_matters: A non-stock item is costed from the price on the item. Without it the BOM cost estimate omits the line.
  rule_authority: best_practice
  sap_impact: The product cost estimate is understated.
  fix_map:
    __blank__: Enter the price in CS02 > Item > Purchasing data.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: non-stock item without price.'
- id: PP229
  field: STPO.PEINH
  check_class: cross_field_check
  fail_when: (`STPO.PREIS` > 0) & ~(`STPO.PEINH` > 0)
  applies_when:
    STPO.LKENZ:
      blank: true
  severity: high
  dimension: consistency
  message: Item price is maintained but the price unit is zero
  why_it_matters: The price is per price unit. A zero unit gives a division by zero in costing.
  rule_authority: sap_hard_constraint
  sap_impact: The cost estimate of the BOM fails or is wrong for the line.
  fix_map:
    __other__: Set the price unit in CS02 > Item > Purchasing data.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: price {STPO.PREIS} with price unit {actual_value}.'
- id: PP230
  field: STPO.WAERS
  check_class: cross_field_check
  fail_when: (`STPO.PREIS` > 0) & `STPO.WAERS`.isna()
  applies_when:
    STPO.LKENZ:
      blank: true
  severity: high
  dimension: completeness
  message: Item price is maintained but has no currency
  why_it_matters: A price without currency has no value in costing.
  rule_authority: sap_hard_constraint
  sap_impact: The cost estimate treats the price as zero or fails.
  fix_map:
    __other__: Enter the currency in CS02 > Item > Purchasing data.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: price {STPO.PREIS} without currency.'
- id: PP231
  field: STPO.RFORM
  check_class: null_check
  applies_when:
    STPO.POSTP:
    - R
    STPO.LKENZ:
      blank: true
  severity: high
  dimension: completeness
  message: Variable-size item has no formula key
  why_it_matters: The formula key turns the sizes into the component quantity. Without it the quantity cannot be calculated.
  rule_authority: sap_hard_constraint
  sap_impact: Component quantity is zero or fails when the BOM is exploded.
  fix_map:
    __blank__: Enter the formula key in CS02 > Item > Variable-size item.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: variable-size item without formula.'
- id: PP232
  field: STPO.CLASS
  check_class: null_check
  applies_when:
    STPO.POSTP:
    - K
    STPO.LKENZ:
      blank: true
  severity: high
  dimension: completeness
  message: Class item has no class
  why_it_matters: A class item stands for any material of the class. Without a class it stands for nothing.
  rule_authority: sap_hard_constraint
  sap_impact: The line cannot be resolved to a material in the order.
  fix_map:
    __blank__: Enter the class in CS02 > Item > Class item.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: class item without class.'
- id: PP233
  field: STPO.KLART
  check_class: null_check
  applies_when:
    STPO.POSTP:
    - K
    STPO.LKENZ:
      blank: true
  severity: high
  dimension: completeness
  message: Class item has no class type
  why_it_matters: The class type tells which class catalogue the class is in.
  rule_authority: sap_hard_constraint
  sap_impact: The class cannot be found.
  fix_map:
    __blank__: Enter the class type in CS02 > Item > Class item.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: class item without class type.'
- id: PP234
  field: STPO.DOKVR
  check_class: null_check
  applies_when:
    STPO.POSTP:
    - D
    STPO.LKENZ:
      blank: true
  severity: low
  dimension: completeness
  message: Document item has no document version
  why_it_matters: A document item points to one document version. Without the version the right file cannot be opened.
  rule_authority: best_practice
  sap_impact: Users open the wrong document or none.
  fix_map:
    __blank__: Enter the document version in CS02 > Item > Document item.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: document item without version.'
- id: PP235
  field: STPO.MATKL
  check_class: referential_check
  severity: low
  dimension: validity
  message: BOM item material group (STPO.MATKL) is not defined in the system's configuration (T023)
  why_it_matters: The material group on the item is a key into T023. A value that is not there cannot be read by BOM, MRP
    or costing functions.
  rule_authority: sap_hard_constraint
  sap_impact: Functions that read T023 for the BOM item stop or skip the line.
  fix_map:
    __other__: Correct the value in CS02 or create it in customizing (T023).
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: material group ''{actual_value}'' is not in T023.'
