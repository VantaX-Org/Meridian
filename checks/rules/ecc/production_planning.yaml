- id: PP248
  field: STAS.STLKN
  check_class: exists_check
  fields:
  - STAS.STLTY
  - STAS.STLNR
  - STAS.STLKN
  target_table: STPO
  target_fields:
  - STLTY
  - STLNR
  - STLKN
  target_when:
    LKENZ:
      blank: true
  applies_when:
    STAS.LKENZ:
      blank: true
  severity: high
  dimension: consistency
  message: BOM alternative assignment points at an item node that does not exist or is deleted
  why_it_matters: STAS ties an item node to a BOM alternative. If the node is gone the alternative explodes with a missing
    line.
  rule_authority: sap_hard_constraint
  sap_impact: BOM explosion reports an inconsistency for the alternative.
  fix_map:
    __other__: Rebuild the assignment through CS02, or delete the assignment.
  record_fix_template: 'BOM {STAS.STLNR} alternative {STAS.STLAL}: item node {STAS.STLKN} does not exist.'
- id: PP249
  field: STPO.STLKN
  check_class: exists_check
  fields:
  - STPO.STLTY
  - STPO.STLNR
  - STPO.STLKN
  target_table: STAS
  target_fields:
  - STLTY
  - STLNR
  - STLKN
  target_when:
    LKENZ:
      blank: true
  applies_when:
    STPO.LKENZ:
      blank: true
  severity: high
  dimension: consistency
  message: Active BOM item node is not assigned to any BOM alternative
  why_it_matters: STPO items belong to alternatives only through STAS. A node without an active STAS row is in no alternative
    and never exploded.
  rule_authority: sap_hard_constraint
  sap_impact: The component is silently missing from every explosion.
  fix_map:
    __other__: Assign the item to an alternative in CS02 or delete it.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: not assigned to any alternative.'
- id: PP250
  field: STAS.STLNR
  check_class: exists_check
  fields:
  - STAS.STLTY
  - STAS.STLNR
  - STAS.STLAL
  target_table: STKO
  target_fields:
  - STLTY
  - STLNR
  - STLAL
  applies_when:
    STAS.LKENZ:
      blank: true
  severity: high
  dimension: consistency
  message: BOM alternative assignment points at an alternative that has no header
  why_it_matters: Every STAS row names an alternative; the STKO header must exist for it.
  rule_authority: sap_hard_constraint
  sap_impact: Explosion of the alternative fails.
  fix_map:
    __other__: Recreate the header through CS01 or delete the assignment.
  record_fix_template: 'BOM {STAS.STLNR} alternative {STAS.STLAL}: no header (STKO).'
- id: PP251
  field: STAS.DATUV
  check_class: cross_field_check
  fail_when: (`STAS.DATUV` - @today).dt.days > 365
  applies_when:
    STAS.LKENZ:
      blank: true
  severity: low
  dimension: accuracy
  message: BOM alternative assignment is valid from a date more than a year ahead
  why_it_matters: A far-future valid-from on the assignment keeps the item out of the alternative until then.
  rule_authority: best_practice
  sap_impact: The component is missing from the alternative today.
  fix_map:
    __other__: Correct the date through a change number in CS02.
  record_fix_template: 'BOM {STAS.STLNR} alternative {STAS.STLAL}: assignment valid from {actual_value}.'
- id: PP252
  field: STPO.IDNRK
  check_class: exists_check
  grain: STPO
  fields:
  - STPO.STLNR
  target_table: STKO
  target_fields:
  - STLNR
  target_when:
    STLTY:
    - M
    LKENZ:
      blank: true
  applies_when:
    STPO.STLTY:
    - M
    STPO.LKENZ:
      blank: true
  severity: medium
  dimension: lifecycle
  message: Active BOM item exists in a BOM whose alternatives are all flagged for deletion
  why_it_matters: Items in a deleted BOM stay active in the database but can never be exploded. They block deletion and archiving.
  rule_authority: best_practice
  sap_impact: Clutter; where-used lists show the component in a structure that is dead.
  fix_map:
    __other__: Delete the items with the BOM (CS02) or reactivate a BOM alternative.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: all BOM alternatives are deleted.'
- id: PP253
  field: STPO.NFMAT
  check_class: exists_check
  fields:
  - STPO.NFMAT
  - MAST.WERKS
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    LVORM:
      blank: true
  applies_when:
    STPO.LKENZ:
      blank: true
  grain: STPO
  severity: high
  dimension: consistency
  message: Item follow-up material is not maintained in the plant of the BOM
  why_it_matters: The follow-up material on a BOM item replaces the component when it is discontinued. It must exist in the
    plant that uses the BOM or MRP cannot use it.
  rule_authority: sap_hard_constraint
  sap_impact: The replacement requirement for the discontinued component cannot be planned or issued in the plant.
  fix_map:
    __other__: Extend the follow-up material to the plant (MM01) or correct the follow-up material on the item in CS02.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: follow-up material {actual_value} is not active in plant {MAST.WERKS}.'
- id: PP254
  field: STPO.NFMAT
  check_class: exists_check
  target_table: MARA
  target_fields:
  - MATNR
  applies_when:
    STPO.LKENZ:
      blank: true
  grain: STPO
  severity: high
  dimension: consistency
  message: Item follow-up material does not exist in the material master
  why_it_matters: A follow-up material that is not in MARA is a typing error or a deleted material. The replacement can never
    be planned.
  rule_authority: sap_hard_constraint
  sap_impact: Discontinuation of the component leaves the BOM with a dead reference.
  fix_map:
    __other__: Correct the follow-up material in CS02 or create the material.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: follow-up material {actual_value} does not exist.'
- id: PP255
  field: STPO.NFMAT
  check_class: cross_field_check
  fail_when: '`STPO.NFMAT` == `STPO.IDNRK`'
  applies_when:
    STPO.LKENZ:
      blank: true
  severity: critical
  dimension: consistency
  message: Item follow-up material is the component itself
  why_it_matters: A component cannot be its own successor. The replacement chain never leaves the part.
  rule_authority: sap_hard_constraint
  sap_impact: Supersession during MRP or BOM explosion never reaches a new part.
  fix_map:
    __other__: Enter the real successor, or clear the follow-up material in CS02.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: follow-up material {actual_value} equals the component.'
- id: PP256
  field: STPO.NFMAT
  check_class: cross_field_check
  fail_when: '`STPO.NFMAT` == `MAST.MATNR`'
  applies_when:
    STPO.LKENZ:
      blank: true
  grain: STPO
  severity: critical
  dimension: consistency
  message: Item follow-up material is the header material of the BOM
  why_it_matters: A successor that equals the assembly turns the BOM into a loop when the replacement is applied.
  rule_authority: sap_hard_constraint
  sap_impact: BOM explosion recurses into the assembly after the component is replaced.
  fix_map:
    __other__: Enter the real successor in CS02.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: follow-up material {actual_value} is the BOM header material.'
- id: PP257
  field: STPO.NFMAT
  check_class: exists_check
  fields:
  - STPO.NFMAT
  - MAST.WERKS
  negate: true
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    KZAUS:
      populated: true
    NFMAT:
      blank: true
  applies_when:
    STPO.LKENZ:
      blank: true
  grain: STPO
  severity: high
  dimension: lifecycle
  message: Item follow-up material is itself discontinued in the plant with no successor
  why_it_matters: A follow-up that is also discontinued and has no successor of its own ends in a dead end.
  rule_authority: best_practice
  sap_impact: The supersession chain ends in a part that is no longer procured.
  fix_map:
    __other__: Choose an active successor in CS02 or maintain a follow-up material on the successor in MM02 MRP 4.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: follow-up material {actual_value} is discontinued in plant {MAST.WERKS}
    with no successor.'
- id: PP258
  field: STPO.NFMAT
  check_class: exists_check
  fields:
  - STPO.NFMAT
  - MAST.WERKS
  negate: true
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    MMSTA:
      populated: true
  applies_when:
    STPO.LKENZ:
      blank: true
  grain: STPO
  severity: high
  dimension: lifecycle
  message: Item follow-up material is blocked by its plant material status
  why_it_matters: A plant-specific status on the successor can block procurement or production. The replacement would be unusable.
  rule_authority: best_practice
  sap_impact: Requirements move to a part that MRP or goods movements reject.
  fix_map:
    __other__: Release the successor (MM02) or choose another one.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: follow-up material {actual_value} is blocked in plant {MAST.WERKS}.'
- id: PP259
  field: STPO.NFMAT
  check_class: exists_check
  negate: true
  target_table: MARA
  target_fields:
  - MATNR
  target_when:
    LVORM:
    - X
  applies_when:
    STPO.LKENZ:
      blank: true
  grain: STPO
  severity: high
  dimension: lifecycle
  message: Item follow-up material is flagged for deletion
  why_it_matters: A successor with a deletion flag is on its way out of the system.
  rule_authority: best_practice
  sap_impact: The replacement is removed at the next archiving run; the BOM keeps a dead reference.
  fix_map:
    __other__: Choose a live successor in CS02.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: follow-up material {actual_value} is flagged for deletion.'
- id: PP260
  field: STPO.IDNRK
  check_class: exists_check
  fields:
  - STPO.IDNRK
  - MAST.WERKS
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    KZAUS:
      populated: true
  applies_when:
    STPO.NFMAT:
      populated: true
    STPO.POSTP:
    - L
    - R
    STPO.LKENZ:
      blank: true
  grain: STPO
  severity: medium
  dimension: consistency
  message: Item follow-up material is set although the component is not discontinued in the plant
  why_it_matters: An item follow-up material only takes effect when the component is discontinued. Without that, the entry
    is unused and misleading.
  rule_authority: best_practice
  sap_impact: Planners think a replacement is active when MRP still uses the old part.
  fix_map:
    __other__: Set the discontinuation indicator on the component in MM02 MRP 4, or clear the follow-up material.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: follow-up {STPO.NFMAT} set but component {STPO.IDNRK} is not discontinued
    in {MAST.WERKS}.'
- id: PP261
  field: STPO.IDNRK
  check_class: exists_check
  fields:
  - STPO.IDNRK
  - MAST.WERKS
  negate: true
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    KZAUS:
      populated: true
    AUSDT:
      older_than_days: 0
  applies_when:
    STPO.POSTP:
    - L
    - R
    STPO.LKENZ:
      blank: true
  grain: STPO
  severity: high
  dimension: lifecycle
  message: Active BOM component passed its effective-out date in the plant of the BOM
  why_it_matters: After the effective-out date the component is discontinued. The BOM should consume the successor or the
    item should be closed.
  rule_authority: best_practice
  sap_impact: Production plans a part that is no longer procured; shortages appear at order release.
  fix_map:
    __other__: Replace the component by its successor (CS02) or end the item with a valid-to date.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: component {STPO.IDNRK} is past effective-out in plant {MAST.WERKS}.'
- id: PP262
  field: MAST.MATNR
  check_class: exists_check
  fields:
  - MAST.MATNR
  - MAST.WERKS
  negate: true
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    KZAUS:
      populated: true
    AUSDT:
      older_than_days: 0
  severity: medium
  dimension: lifecycle
  message: BOM exists for a header material that passed its effective-out date in the plant
  why_it_matters: A discontinued assembly should not keep an active BOM. The BOM drives requirements for components that will
    never be used.
  rule_authority: best_practice
  sap_impact: Components are still planned for an assembly that is no longer built.
  fix_map:
    __other__: Flag the BOM for deletion (CS02) or reverse the discontinuation in MM02.
  record_fix_template: 'Material {MAST.MATNR}, plant {MAST.WERKS}: BOM {MAST.STLNR} remains but the material is past effective-out.'
- id: PP263
  field: MAPL.MATNR
  check_class: exists_check
  fields:
  - MAPL.MATNR
  - MAPL.WERKS
  negate: true
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    KZAUS:
      populated: true
    AUSDT:
      older_than_days: 0
  applies_when:
    MAPL.LOEKZ:
      blank: true
  severity: medium
  dimension: lifecycle
  message: Routing is assigned to a material that passed its effective-out date in the plant
  why_it_matters: A routing for a discontinued material keeps capacity and cost data alive that will never be used.
  rule_authority: best_practice
  sap_impact: Capacity planning loads work for a material that is no longer produced.
  fix_map:
    __other__: Remove the assignment (CA02) or reverse the discontinuation in MM02.
  record_fix_template: 'Material {MAPL.MATNR}, plant {MAPL.WERKS}: routing {MAPL.PLNNR} remains but the material is past effective-out.'
- id: PP264
  field: MKAL.MATNR
  check_class: exists_check
  fields:
  - MKAL.MATNR
  - MKAL.WERKS
  negate: true
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    KZAUS:
      populated: true
    AUSDT:
      older_than_days: 0
  applies_when:
    MKAL.MKSP:
      blank: true
  severity: medium
  dimension: lifecycle
  message: Production version exists for a material that passed its effective-out date in the plant
  why_it_matters: A valid production version for a discontinued material still lets planned orders convert into production
    orders.
  rule_authority: best_practice
  sap_impact: Orders are created for an assembly that should no longer be produced.
  fix_map:
    __other__: Lock the production version (C223) or reverse the discontinuation in MM02.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}: version {MKAL.VERID} is valid but the material is past
    effective-out.'
- id: PP265
  field: MARC.NFMAT
  check_class: exists_check
  fields:
  - MARC.NFMAT
  - MARC.WERKS
  target_table: MAST
  target_fields:
  - MATNR
  - WERKS
  applies_when:
    MARC.KZAUS:
      populated: true
    MARC.BESKZ:
    - E
    - X
    MARC.NFMAT:
      populated: true
  severity: high
  dimension: consistency
  message: Discontinued in-house material has a successor with no BOM in the plant
  why_it_matters: When an in-house part is replaced, the successor must be buildable. Without a BOM in the plant, planned
    orders for it cannot be exploded.
  rule_authority: best_practice
  sap_impact: Requirements passed on to the successor create orders without components.
  fix_map:
    __other__: Create the BOM for the successor in CS01.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: successor {MARC.NFMAT} has no BOM in the plant.'
- id: PP266
  field: MARC.NFMAT
  check_class: exists_check
  fields:
  - MARC.NFMAT
  - MARC.WERKS
  target_table: MAPL
  target_fields:
  - MATNR
  - WERKS
  target_when:
    PLNTY:
    - N
    - R
    - '2'
    LOEKZ:
      blank: true
  applies_when:
    MARC.KZAUS:
      populated: true
    MARC.BESKZ:
    - E
    - X
    MARC.NFMAT:
      populated: true
  severity: medium
  dimension: consistency
  message: Discontinued in-house material has a successor with no routing in the plant
  why_it_matters: A successor built in-house needs a routing for operations, capacity and cost.
  rule_authority: best_practice
  sap_impact: Orders for the successor have no operations and the cost estimate has no labour or machine cost.
  fix_map:
    __other__: Create and assign a routing for the successor in CA01.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: successor {MARC.NFMAT} has no routing in the plant.'
- id: PP267
  field: MARC.NFMAT
  check_class: exists_check
  fields:
  - MARC.NFMAT
  - MARC.WERKS
  target_table: MKAL
  target_fields:
  - MATNR
  - WERKS
  applies_when:
    MARC.KZAUS:
      populated: true
    MARC.BESKZ:
    - E
    - X
    MARC.NFMAT:
      populated: true
    MARC.SFEPR:
      populated: true
  severity: medium
  dimension: consistency
  message: Discontinued in-house material has a successor with no production version in the plant
  why_it_matters: Where production versions drive order creation, the successor needs one.
  rule_authority: best_practice
  sap_impact: Planned orders for the successor cannot be converted into production orders.
  fix_map:
    __other__: Create a production version for the successor (C223 or MM02 MRP 4).
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: successor {MARC.NFMAT} has no production version in the
    plant.'
- id: PP268
  field: STPO.NFMAT
  check_class: hierarchy_check
  grain: STPO
  id_field: STPO.IDNRK
  scope_field: STPO.STLNR
  severity: critical
  dimension: consistency
  message: Item follow-up materials form a loop inside a BOM
  why_it_matters: Following the item follow-up material from component to successor must end. A loop (A to B to A) means none
    of them can be the final part.
  rule_authority: sap_hard_constraint
  sap_impact: BOM explosion with replacement does not terminate; requirements are lost.
  fix_map:
    __other__: Break the loop by correcting one follow-up material in CS02.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: follow-up material {actual_value} is part of a loop.'
- id: PP269
  field: STPO.NFMAT
  check_class: hierarchy_check
  grain: STPO
  id_field: STPO.IDNRK
  scope_field: STPO.STLNR
  max_depth: 3
  severity: medium
  dimension: consistency
  message: Item follow-up chain in a BOM is longer than three links
  why_it_matters: Long chains of successors hide the real replacement and add lead time at each hop.
  rule_authority: best_practice
  sap_impact: Planners cannot see the final part; the cost of the chain is not visible.
  fix_map:
    __other__: Point the first component directly at the final successor in CS02.
  record_fix_template: 'BOM {STPO.STLNR} item {STPO.POSNR}: follow-up chain from {actual_value} exceeds three links.'
- id: PP270
  field: PLKO.VERWE
  check_class: null_check
  applies_when:
    PLKO.PLNTY:
    - N
    - R
    - '2'
    PLKO.LOEKZ:
      blank: true
  severity: high
  dimension: completeness
  message: Routing has no usage
  why_it_matters: The usage decides in which functions (production, costing, maintenance) the routing can be selected.
  rule_authority: sap_hard_constraint
  sap_impact: The routing is never selected by order creation or costing.
  fix_map:
    __blank__: Set the usage in CA02 > Header.
  record_fix_template: 'Routing {PLKO.PLNNR} group counter {PLKO.PLNAL}: no usage.'
- id: PP271
  field: PLKO.WERKS
  check_class: referential_check
  severity: high
  dimension: validity
  message: Routing plant (PLKO.WERKS) is not a plant (T001W)
  why_it_matters: The plant restricts who can select and maintain the routing.
  rule_authority: sap_hard_constraint
  sap_impact: Order creation in the plant never finds the routing.
  fix_map:
    __other__: Correct the plant in CA02 > Header.
  record_fix_template: 'Routing {PLKO.PLNNR}: plant ''{actual_value}'' is not in T001W.'
- id: PP272
  field: PLKO.PLNTY
  check_class: referential_check
  severity: high
  dimension: validity
  message: Task list type (PLKO.PLNTY) is not defined in the system's configuration (TCA01)
  why_it_matters: Task list types decide the type of the object and its functions.
  rule_authority: sap_hard_constraint
  sap_impact: Task list functions reject the header.
  fix_map:
    __other__: Correct the type or create it in customizing.
  record_fix_template: 'Routing {PLKO.PLNNR}: task list type ''{actual_value}'' is not in TCA01.'
- id: PP273
  field: PLKO.AENNR
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Routing change number (PLKO.AENNR) is not a change master (AENR)
  why_it_matters: A history record for a routing needs a valid change master to show the validity and the reason.
  rule_authority: sap_hard_constraint
  sap_impact: Time-dependent routing selection by change status is wrong.
  fix_map:
    __other__: Create the change master (CC01) or correct the number.
  record_fix_template: 'Routing {PLKO.PLNNR}: change number ''{actual_value}'' is not in AENR.'
- id: PP274
  field: PLKO.DATUV
  check_class: cross_field_check
  fail_when: (`PLKO.DATUV` - @today).dt.days > 365
  applies_when:
    PLKO.PLNTY:
    - N
    - R
    - '2'
    PLKO.LOEKZ:
      blank: true
  severity: medium
  dimension: accuracy
  message: Routing valid-from date is more than a year in the future
  why_it_matters: A far-future valid-from date is mostly a typo. The routing is not selected until then.
  rule_authority: best_practice
  sap_impact: Order creation finds no routing today.
  fix_map:
    __other__: Correct the date through a change number in CA02.
  record_fix_template: 'Routing {PLKO.PLNNR} counter {PLKO.PLNAL}: valid from {actual_value}.'
- id: PP275
  field: PLKO.AEDAT
  check_class: cross_field_check
  fail_when: '`PLKO.AEDAT` < `PLKO.ANDAT`'
  applies_when:
    PLKO.AEDAT:
      populated: true
  severity: low
  dimension: accuracy
  message: Routing change date is before its creation date
  why_it_matters: A change cannot precede the creation. It points at a load that lost audit fields.
  rule_authority: best_practice
  sap_impact: Audit and change analysis for the routing are unreliable.
  fix_map:
    __other__: Correct the audit fields in the load.
  record_fix_template: 'Routing {PLKO.PLNNR}: changed {actual_value}, created {PLKO.ANDAT}.'
- id: PP276
  field: PLKO.STLNR
  check_class: exists_check
  fields:
  - PLKO.STLTY
  - PLKO.STLNR
  - PLKO.STLAL
  target_table: STKO
  target_fields:
  - STLTY
  - STLNR
  - STLAL
  target_when:
    LKENZ:
      blank: true
  applies_when:
    PLKO.PLNTY:
    - N
    - R
    - '2'
    PLKO.LOEKZ:
      blank: true
  severity: high
  dimension: consistency
  message: Routing is linked to a BOM that does not exist or is flagged for deletion
  why_it_matters: A routing with a BOM link takes component allocation from it. The BOM must exist.
  rule_authority: sap_hard_constraint
  sap_impact: Component allocation to operations fails; the order explosion is wrong.
  fix_map:
    __other__: Correct the BOM link in CA02 > Header or restore the BOM (CS02).
  record_fix_template: 'Routing {PLKO.PLNNR} counter {PLKO.PLNAL}: BOM {actual_value} does not exist or is deleted.'
- id: PP277
  field: PLKO.PLNNR
  check_class: exists_check
  fields:
  - PLKO.PLNTY
  - PLKO.PLNNR
  - PLKO.PLNAL
  target_table: PLAS
  target_fields:
  - PLNTY
  - PLNNR
  - PLNAL
  target_when:
    LOEKZ:
      blank: true
  applies_when:
    PLKO.PLNTY:
    - N
    - R
    - '2'
    PLKO.LOEKZ:
      blank: true
  severity: high
  dimension: consistency
  message: Routing alternative has no sequence assignment
  why_it_matters: Operations belong to an alternative through the sequence (PLAS). Without it the alternative has no operations.
  rule_authority: sap_hard_constraint
  sap_impact: Order creation copies an empty routing.
  fix_map:
    __other__: Assign operations to the alternative in CA02.
  record_fix_template: 'Routing {PLKO.PLNTY}/{PLKO.PLNNR}/{PLKO.PLNAL}: no operations assigned.'
- id: PP278
  field: MAPL.PLNTY
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Routing assignment task list type (MAPL.PLNTY) is not defined in the system's configuration (TCA01)
  why_it_matters: The assignment type must be a valid task list type.
  rule_authority: sap_hard_constraint
  sap_impact: Routing selection for the material ignores the assignment.
  fix_map:
    __other__: Correct the type or create it in customizing.
  record_fix_template: 'Material {MAPL.MATNR}: task list type ''{actual_value}'' is not in TCA01.'
- id: PP279
  field: MAPL.MATNR
  check_class: exists_check
  fields:
  - MAPL.MATNR
  - MAPL.WERKS
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    BESKZ:
    - E
    - X
  applies_when:
    MAPL.PLNTY:
    - N
    - R
    - '2'
    MAPL.LOEKZ:
      blank: true
  severity: medium
  dimension: consistency
  message: Routing is assigned to a material that is not in-house produced in the plant
  why_it_matters: A production routing for a material that is procured externally (procurement type F) is never used by MRP.
  rule_authority: best_practice
  sap_impact: The routing keeps capacity and costing data for a material that is bought.
  fix_map:
    __other__: Remove the assignment (CA02) or set the procurement type to in-house (MM02 MRP 2).
  record_fix_template: 'Material {MAPL.MATNR}, plant {MAPL.WERKS}: routing {MAPL.PLNNR} assigned but not produced in-house.'
- id: PP280
  field: MAPL.DATUV
  check_class: cross_field_check
  fail_when: (`MAPL.DATUV` - @today).dt.days > 365
  applies_when:
    MAPL.LOEKZ:
      blank: true
