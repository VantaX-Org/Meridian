  fix_map:
    __other__: Correct the distribution.
  record_fix_template: 'Work centre object {CRCA.OBJID}: distribution ''{actual_value}'' is not in TC29.'
- id: PP376
  field: KAKO.AZNOR
  check_class: cross_field_check
  fail_when: '`KAKO.AZNOR`.isna() | (`KAKO.AZNOR` <= 0)'
  applies_when:
    KAKO.POOLK:
      blank: true
  severity: high
  dimension: completeness
  message: Capacity has no individual capacities
  why_it_matters: The number of individual capacities multiplies the available time. Zero means the resource has no capacity.
  rule_authority: sap_hard_constraint
  sap_impact: Capacity load is infinite and finite scheduling fails.
  fix_map:
    __other__: Enter a positive number in CR02 > Capacities.
  record_fix_template: 'Capacity {KAKO.KAPID}: number of individual capacities {actual_value}.'
- id: PP377
  field: KAKO.NGRAD
  check_class: cross_field_check
  fail_when: (`KAKO.NGRAD` == '000') | (`KAKO.NGRAD` > '100')
  applies_when:
    KAKO.POOLK:
      blank: true
  severity: high
  dimension: accuracy
  message: Capacity utilisation rate is zero or above 100 percent
  why_it_matters: Utilisation scales the available time. Zero removes the capacity; above 100 percent is not valid.
  rule_authority: sap_hard_constraint
  sap_impact: Available capacity is zero or overstated.
  fix_map:
    __other__: Correct the rate in CR02 > Capacities.
  record_fix_template: 'Capacity {KAKO.KAPID}: utilisation {actual_value}.'
- id: PP378
  field: KAKO.ENDZT
  check_class: cross_field_check
  fail_when: '`KAKO.ENDZT` < `KAKO.BEGZT`'
  severity: high
  dimension: consistency
  message: Capacity operating time ends before it starts
  why_it_matters: The operating time (start to finish) of the day defines the available time.
  rule_authority: sap_hard_constraint
  sap_impact: Available time is negative or zero.
  fix_map:
    __other__: Correct the times in CR02 > Capacities.
  record_fix_template: 'Capacity {KAKO.KAPID}: finish {actual_value}, start {KAKO.BEGZT}.'
- id: PP379
  field: KAKO.PAUSE
  check_class: cross_field_check
  fail_when: (`KAKO.ENDZT` > `KAKO.BEGZT`) & (`KAKO.PAUSE` >= (`KAKO.ENDZT` - `KAKO.BEGZT`))
  severity: medium
  dimension: consistency
  message: Capacity break is as long as the operating time
  why_it_matters: A break that fills the whole operating time leaves no available capacity.
  rule_authority: sap_hard_constraint
  sap_impact: Available capacity per day is zero.
  fix_map:
    __other__: Shorten the break in CR02 > Capacities.
  record_fix_template: 'Capacity {KAKO.KAPID}: break {actual_value}.'
- id: PP380
  field: KAKO.KAPAR
  check_class: null_check
  severity: high
  dimension: completeness
  message: Capacity has no capacity category
  why_it_matters: The category (machine, labour) decides what the capacity is used for.
  rule_authority: sap_hard_constraint
  sap_impact: Capacity requirements are not assigned to the resource.
  fix_map:
    __blank__: Enter the category in CR02.
  record_fix_template: 'Capacity {KAKO.KAPID}: no capacity category.'
- id: PP381
  field: KAKO.MEINS
  check_class: null_check
  applies_when:
    KAKO.POOLK:
      blank: true
  severity: high
  dimension: completeness
  message: Capacity has no base unit
  why_it_matters: Available time is given in the base unit.
  rule_authority: sap_hard_constraint
  sap_impact: Capacity load cannot be converted.
  fix_map:
    __blank__: Enter the unit in CR02.
  record_fix_template: 'Capacity {KAKO.KAPID}: no base unit.'
- id: PP382
  field: KAKO.WERKS
  check_class: null_check
  severity: high
  dimension: completeness
  message: Capacity has no plant
  why_it_matters: The plant selects the factory calendar and planning scope.
  rule_authority: sap_hard_constraint
  sap_impact: Capacity is not part of any plant.
  fix_map:
    __blank__: Enter the plant in CR02.
  record_fix_template: 'Capacity {KAKO.KAPID}: no plant.'
- id: PP383
  field: KAKO.WERKS
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Capacity plant (KAKO.WERKS) is not defined in the system's configuration (T001W)
  why_it_matters: The plant is a key into T001W. An undefined value breaks scheduling and capacity planning.
  rule_authority: sap_hard_constraint
  sap_impact: Scheduling cannot use plant of the capacity.
  fix_map:
    __other__: Correct the value in CR02 > Capacities or create it (T001W).
  record_fix_template: 'Capacity {KAKO.KAPID}: plant ''{actual_value}'' is not in T001W.'
- id: PP384
  field: KAKO.KAPAR
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Capacity capacity category (KAKO.KAPAR) is not defined in the system's configuration (TC26)
  why_it_matters: The capacity category is a key into TC26. An undefined value breaks scheduling and capacity planning.
  rule_authority: sap_hard_constraint
  sap_impact: Scheduling cannot use capacity category of the capacity.
  fix_map:
    __other__: Correct the value in CR02 > Capacities or create it (TC26).
  record_fix_template: 'Capacity {KAKO.KAPID}: capacity category ''{actual_value}'' is not in TC26.'
- id: PP385
  field: KAKO.KALID
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Capacity factory calendar (KAKO.KALID) is not defined in the system's configuration (TFACD)
  why_it_matters: The factory calendar is a key into TFACD. An undefined value breaks scheduling and capacity planning.
  rule_authority: sap_hard_constraint
  sap_impact: Scheduling cannot use factory calendar of the capacity.
  fix_map:
    __other__: Correct the value in CR02 > Capacities or create it (TFACD).
  record_fix_template: 'Capacity {KAKO.KAPID}: factory calendar ''{actual_value}'' is not in TFACD.'
- id: PP386
  field: KAKO.PLANR
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Capacity capacity planner (KAKO.PLANR) is not defined in the system's configuration (TC27)
  why_it_matters: The capacity planner is a key into TC27. An undefined value breaks scheduling and capacity planning.
  rule_authority: sap_hard_constraint
  sap_impact: Scheduling cannot use capacity planner of the capacity.
  fix_map:
    __other__: Correct the value in CR02 > Capacities or create it (TC27).
  record_fix_template: 'Capacity {KAKO.KAPID}: capacity planner ''{actual_value}'' is not in TC27.'
- id: PP387
  field: KAKO.VERSA
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Capacity shift sequence (KAKO.VERSA) is not defined in the system's configuration (TC36)
  why_it_matters: The shift sequence is a key into TC36. An undefined value breaks scheduling and capacity planning.
  rule_authority: sap_hard_constraint
  sap_impact: Scheduling cannot use shift sequence of the capacity.
  fix_map:
    __other__: Correct the value in CR02 > Capacities or create it (TC36).
  record_fix_template: 'Capacity {KAKO.KAPID}: shift sequence ''{actual_value}'' is not in TC36.'
- id: PP388
  field: KAKO.MOSID
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Capacity mode (KAKO.MOSID) is not defined in the system's configuration (TC39A)
  why_it_matters: The mode is a key into TC39A. An undefined value breaks scheduling and capacity planning.
  rule_authority: sap_hard_constraint
  sap_impact: Scheduling cannot use mode of the capacity.
  fix_map:
    __other__: Correct the value in CR02 > Capacities or create it (TC39A).
  record_fix_template: 'Capacity {KAKO.KAPID}: mode ''{actual_value}'' is not in TC39A.'
- id: PP389
  field: KAKO.REFID
  check_class: exists_check
  target_table: KAKO
  target_fields:
  - KAPID
  severity: high
  dimension: consistency
  message: Capacity refers to a capacity that does not exist
  why_it_matters: Reference capacities supply the shifts. A missing one leaves the capacity empty.
  rule_authority: sap_hard_constraint
  sap_impact: Capacity time is not found.
  fix_map:
    __other__: Correct the reference in CR02.
  record_fix_template: 'Capacity {KAKO.KAPID}: reference {actual_value} does not exist.'
- id: PP390
  field: KAKO.KAPID
  check_class: exists_check
  target_table: CRCA
  target_fields:
  - KAPID
  applies_when:
    KAKO.POOLK:
      blank: true
  severity: low
  dimension: lifecycle
  message: Capacity is assigned to no work centre
  why_it_matters: A capacity that no work centre uses is dead data.
  rule_authority: best_practice
  sap_impact: Clutter in capacity reports.
  fix_map:
    __other__: Delete the capacity or assign it in CR02.
  record_fix_template: 'Capacity {KAKO.KAPID}: not used by any work centre.'
- id: PP391
  field: MKAL.BDATU
  check_class: freshness_check
  max_age_hours: 0
  applies_when:
    MKAL.MKSP:
      blank: true
  severity: low
  dimension: timeliness
  message: Production version validity has ended and the version is not locked
  why_it_matters: An expired version is not selected by order creation, but still shows in selection lists.
  rule_authority: best_practice
  sap_impact: Planned orders fail to convert for lack of a valid version.
  fix_map:
    __other__: Extend the validity or lock the version in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, version {MKAL.VERID}: valid to ended {age_days} days ago.'
- id: PP392
  field: MKAL.MATNR
  check_class: exists_check
  fields:
  - MKAL.MATNR
  - MKAL.WERKS
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    BESKZ:
    - E
    - X
  severity: medium
  dimension: consistency
  message: Production version exists for a material that is not in-house produced in the plant
  why_it_matters: Versions only matter for materials that are produced in-house.
  rule_authority: best_practice
  sap_impact: The version never takes part in planning.
  fix_map:
    __other__: Set the procurement type to in-house or delete the version.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}: version {MKAL.VERID} but the material is not in-house.'
- id: PP393
  field: MKAL.PLNNR
  check_class: cross_field_check
  fail_when: '`MKAL.PLNNR`.isna() & `MKAL.STLAL`.isna()'
  severity: high
  dimension: completeness
  message: Production version has neither BOM nor routing
  why_it_matters: A version links BOM and routing for production. With neither, it carries nothing.
  rule_authority: best_practice
  sap_impact: Orders created with the version have no components or operations.
  fix_map:
    __other__: Maintain BOM and routing in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, version {MKAL.VERID}: no BOM and no routing.'
- id: PP394
  field: MKAL.PLNTY
  check_class: cross_field_check
  fail_when: (`MKAL.PLNNR`.notna()) != (`MKAL.PLNTY`.notna())
  severity: high
  dimension: consistency
  message: Production version routing is incomplete (type and group do not match)
  why_it_matters: A routing is given by type and group together.
  rule_authority: sap_hard_constraint
  sap_impact: The routing cannot be found.
  fix_map:
    __other__: Complete the routing in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, version {MKAL.VERID}: routing type ''{actual_value}'' without
    a group.'
- id: PP395
  field: MKAL.ALORT
  check_class: exists_check
  fields:
  - MKAL.WERKS
  - MKAL.ALORT
  target_table: T001L
  target_fields:
  - WERKS
  - LGORT
  severity: medium
  dimension: consistency
  message: Production version issue storage location does not exist in the plant
  why_it_matters: The location supplies components to the order.
  rule_authority: sap_hard_constraint
  sap_impact: Goods issue fails.
  fix_map:
    __other__: Correct the location in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, version {MKAL.VERID}: storage location {actual_value} not
    in plant.'
- id: PP396
  field: MKAL.ELPRO
  check_class: exists_check
  fields:
  - MKAL.WERKS
  - MKAL.ELPRO
  target_table: T001L
  target_fields:
  - WERKS
  - LGORT
  severity: medium
  dimension: consistency
  message: Production version receiving storage location does not exist in the plant
  why_it_matters: The location receives the finished goods from the order.
  rule_authority: sap_hard_constraint
  sap_impact: Goods receipt fails.
  fix_map:
    __other__: Correct the location in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, version {MKAL.VERID}: receiving location {actual_value}
    not in plant.'
- id: PP397
  field: MKAL.VERTO
  check_class: exists_check
  fields:
  - MKAL.WERKS
  - MKAL.VERTO
  target_table: T437V
  target_fields:
  - WERKS
  - VERTL
  severity: low
  dimension: consistency
  message: Production version distribution function does not exist for the plant
  why_it_matters: The distribution function spreads the requirement.
  rule_authority: sap_hard_constraint
  sap_impact: Splitting by distribution fails.
  fix_map:
    __other__: Correct it in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, version {MKAL.VERID}: distribution {actual_value} not in
    T437V.'
- id: PP398
  field: MKAL.SOBSL
  check_class: exists_check
  fields:
  - MKAL.WERKS
  - MKAL.SOBSL
  target_table: T460A
  target_fields:
  - WERKS
  - SOBSL
  severity: medium
  dimension: consistency
  message: Production version special procurement key is not defined for the plant
  why_it_matters: The key must exist for the plant in T460A.
  rule_authority: sap_hard_constraint
  sap_impact: Planning cannot use the key.
  fix_map:
    __other__: Correct it in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, version {MKAL.VERID}: key {actual_value} not in T460A.'
- id: PP399
  field: MKAL.BESKZ
  check_class: exists_check
  fields:
  - MKAL.WERKS
  - MKAL.SOBSL
  - MKAL.BESKZ
  target_table: T460A
  target_fields:
  - WERKS
  - SOBSL
  - BESKZ
  applies_when:
    MKAL.BESKZ:
    - E
    - F
  severity: medium
  dimension: consistency
  message: Production version procurement type differs from the type of its special procurement key
  why_it_matters: T460A fixes the procurement type of a key. A version with another type contradicts it.
  rule_authority: sap_hard_constraint
  sap_impact: Planning follows the wrong procurement path.
  fix_map:
    __other__: Align procurement type and key in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, version {MKAL.VERID}: type {actual_value} does not match
    key.'
- id: PP400
  field: MKAL.TEXT1
  check_class: null_check
  severity: low
  dimension: completeness
  message: Production version has no text
  why_it_matters: The text is shown in the version selection of orders.
  rule_authority: best_practice
  sap_impact: Planners cannot tell versions apart.
  fix_map:
    __blank__: Enter a text in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, version {MKAL.VERID}: no text.'
- id: PP401
  field: MKAL.STLAN
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Production version BOM usage (MKAL.STLAN) is not defined (T416)
  why_it_matters: BOM usage is customizing.
  rule_authority: sap_hard_constraint
  sap_impact: BOM selection fails.
  fix_map:
    __other__: Correct it.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}: usage ''{actual_value}'' is not in T416.'
- id: PP402
  field: MARC.SOBSL
  check_class: exists_check
  fields:
  - MARC.WERKS
  - MARC.SOBSL
  - MARC.BESKZ
  target_table: T460A
  target_fields:
  - WERKS
  - SOBSL
  - BESKZ
  applies_when:
    MARC.BESKZ:
    - E
    - F
    MARC.SOBSL:
      populated: true
  severity: medium
  dimension: consistency
  message: Special procurement key procurement type contradicts the material procurement type
  why_it_matters: A special procurement key carries a procurement type (E or F). A material with the other type has a contradicting
    key.
  rule_authority: sap_hard_constraint
  sap_impact: MRP follows the wrong procurement path.
  fix_map:
    __other__: Align the procurement type and the key in MM02 MRP 2.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: type {actual_value} does not match special key {MARC.SOBSL}.'
- id: PP403
  field: MARC.SOBSL
  check_class: exists_check
  fields:
  - MARC.WERKS
  - MARC.SOBSL
  target_table: T460A
  target_fields:
  - WERKS
  - SOBSL
  severity: high
  dimension: consistency
  message: Special procurement key is not defined for the plant of the material
  why_it_matters: The key exists per plant in T460A. A key from another plant does not apply.
  rule_authority: sap_hard_constraint
  sap_impact: MRP cannot apply the special procurement.
  fix_map:
    __other__: Correct it in MM02 MRP 2.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: key {actual_value} not in T460A.'
- id: PP404
  field: MARC.FEVOR
  check_class: exists_check
  fields:
  - MARC.WERKS
  - MARC.FEVOR
  target_table: T024F
  target_fields:
  - WERKS
  - FEVOR
  severity: medium
  dimension: consistency
  message: Production scheduler is not defined for the plant of the material
  why_it_matters: The scheduler is defined per plant (T024F). A scheduler of another plant is invalid.
  rule_authority: sap_hard_constraint
  sap_impact: Order lists by scheduler skip the material.
  fix_map:
    __other__: Correct it in MM02 MRP 4.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: scheduler {actual_value} not in T024F.'
- id: PP405
  field: MARC.MATNR
  check_class: exists_check
  fields:
  - MARC.MATNR
  - MARC.WERKS
  negate: true
  target_table: MAST
  target_fields:
  - MATNR
  - WERKS
  applies_when:
    MARC.BESKZ:
    - F
    MARC.SOBSL:
      blank: true
    MARC.LVORM:
      blank: true
  severity: medium
  dimension: consistency
  message: Externally procured material has a production BOM in the plant
  why_it_matters: A material that is bought has no production, unless special procurement (subcontracting, phantom) is set.
    A BOM without that is unused.
  rule_authority: best_practice
  sap_impact: The BOM is ignored or confuses planners.
  fix_map:
    __other__: Remove the BOM or set the right procurement type.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: externally procured but has a BOM.'
- id: PP406
  field: MARC.DZEIT
  check_class: cross_field_check
  fail_when: '`MARC.DZEIT`.isna() | (`MARC.DZEIT` <= 0)'
  applies_when:
    MARC.BESKZ:
    - E
    MARC.SOBSL:
      blank: true
    MARC.DISMM:
      populated: true
      not_in:
      - ND
  severity: medium
  dimension: completeness
  message: In-house produced material has no in-house production time
  why_it_matters: MRP schedules production with the in-house production time unless the lot-size dependent time is set from
    the routing.
  rule_authority: best_practice
  sap_impact: Lead time is zero; planned orders are dated too late.
  fix_map:
    __other__: Enter the time in MM02 MRP 2.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: in-house time {actual_value}.'
- id: PP407
  field: T024F.SFCPF
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Production scheduler default profile (T024F.SFCPF) is not defined (TCO43)
  why_it_matters: The scheduler sets the default scheduling profile.
  rule_authority: sap_hard_constraint
  sap_impact: Orders get no default profile.
  fix_map:
    __other__: Correct it in customizing.
  record_fix_template: 'Plant {T024F.WERKS} scheduler {T024F.FEVOR}: profile ''{actual_value}'' is not in TCO43.'
- id: PP408
  field: T437V.FUNCT
  check_class: referential_check
  severity: low
  dimension: validity
  message: Distribution function (T437V.FUNCT) is not defined (TC29V)
  why_it_matters: The distribution spreads requirements.
  rule_authority: sap_hard_constraint
  sap_impact: Distribution is not applied.
  fix_map:
    __other__: Correct it in customizing.
  record_fix_template: 'Plant {T437V.WERKS} distribution {T437V.VERTL}: function ''{actual_value}'' is not in TC29V.'
- id: PP409
  field: T460A.WRK02
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Special procurement key source plant (T460A.WRK02) is not a plant (T001W)
  why_it_matters: A key that procures from another plant needs a real plant.
  rule_authority: sap_hard_constraint
  sap_impact: Stock transfer or production in the source plant fails.
  fix_map:
    __other__: Correct it in customizing.
  record_fix_template: 'Plant {T460A.WERKS} key {T460A.SOBSL}: source plant ''{actual_value}'' is not in T001W.'
- id: PP410
  field: T460A.REWRK
  check_class: referential_check
  severity: low
  dimension: validity
  message: Special procurement key receiving plant (T460A.REWRK) is not a plant (T001W)
  why_it_matters: A key with reverse transfer needs a real plant.
  rule_authority: sap_hard_constraint
  sap_impact: Transfer fails.
  fix_map:
    __other__: Correct it in customizing.
  record_fix_template: 'Plant {T460A.WERKS} key {T460A.SOBSL}: receiving plant ''{actual_value}'' is not in T001W.'
