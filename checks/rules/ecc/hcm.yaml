- id: PA056
  field: HRP1000.OBJID
  check_class: exists_check
  grain: HRP1000
  target_table: HRP1001
  target_fields:
  - OBJID
  target_when:
    OTYPE:
    - S
    RELAT:
    - 008
    RSIGN:
    - A
    ENDDA:
    - '99991231'
  applies_when: &id005
    HRP1000.OTYPE:
    - S
    HRP1000.ENDDA: &id006
    - '99991231'
    HRP1000.ISTAT: &id007
    - '1'
    HRP1000.PLVAR: &id008
    - '01'
  severity: low
  dimension: completeness
  message: Active position has no holder (vacant)
  why_it_matters: A vacant position is legitimate while recruiting, but long-lived vacancies inflate budgeted headcount and attract
    planned cost. This rule lists vacancies for review.
  rule_authority: best_practice
  sap_impact: Headcount and budget reports show positions that nobody holds; recruitment workflows target obsolete positions.
  fix_map:
    __other__: Fill the position (PA40 hiring) or delimit it in PPOME / PO13.
  record_fix_template: 'Position {HRP1000.OBJID}: no holder in the organisational plan. Fill or delimit in PPOME.'
- id: PA057
  field: HRP1000.OBJID
  check_class: exists_check
  grain: HRP1000
  target_table: HRP1001
  target_fields:
  - OBJID
  target_when:
    OTYPE:
    - S
    RELAT:
    - '003'
    RSIGN:
    - A
    ENDDA:
    - '99991231'
  applies_when: *id005
  severity: high
  dimension: completeness
  message: Active position is not assigned to an organisational unit
  why_it_matters: A position must belong to an organisational unit (relationship 003). Without it the position and its holder are outside
    the reporting structure.
  rule_authority: sap_hard_constraint
  sap_impact: The position is invisible in the organisational structure; holders are unreachable by structural authorisations and manager
    reports.
  fix_map:
    __other__: Relate the position to an organisational unit in PPOME.
  record_fix_template: 'Position {HRP1000.OBJID}: not assigned to an organisational unit. Relate it in PPOME.'
- id: PA058
  field: HRP1000.OBJID
  check_class: exists_check
  grain: HRP1000
  target_table: HRP1001
  target_fields:
  - OBJID
  target_when:
    OTYPE:
    - S
    RELAT:
    - '007'
    RSIGN:
    - A
    ENDDA:
    - '99991231'
  applies_when: *id005
  severity: medium
  dimension: completeness
  message: Active position has no job
  why_it_matters: A position inherits its job description, grade and skill requirements from a job (relationship 007). A position without
    a job has no profile.
  rule_authority: best_practice
  sap_impact: Job-based reporting, job evaluation and compensation structures are missing the position.
  fix_map:
    __other__: Relate the position to a job in PPOME.
  record_fix_template: 'Position {HRP1000.OBJID}: not related to a job. Relate it in PPOME.'
- id: PA059
  field: HRP1000.OBJID
  check_class: exists_check
  grain: HRP1000
  target_table: HRP1001
  target_fields:
  - OBJID
  target_when:
    OTYPE:
    - O
    RELAT:
    - '012'
    RSIGN:
    - B
    ENDDA:
    - '99991231'
  applies_when:
    HRP1000.OTYPE:
    - O
    HRP1000.ENDDA: *id006
    HRP1000.ISTAT: *id007
    HRP1000.PLVAR: *id008
  severity: medium
  dimension: completeness
  message: Active organisational unit has no manager position
  why_it_matters: Each organisational unit needs a position flagged as chief (relationship 012) so approvals and manager self-service
    route to someone.
  rule_authority: best_practice
  sap_impact: Workflows and MSS cannot determine the approver; reporting lines break at this unit.
  fix_map:
    __other__: Flag the manager position of the unit in PPOME (relationship 'is managed by').
  record_fix_template: 'Organisational unit {HRP1000.OBJID}: no manager position. Maintain in PPOME.'
- id: PA060
  field: HRP1001.SOBID
  check_class: exists_check
  grain: HRP1001
  target_table: PA0001
  target_fields:
  - PERNR
  applies_when:
    HRP1001.OTYPE:
    - S
    HRP1001.RELAT:
    - 008
    HRP1001.RSIGN:
    - A
    HRP1001.SCLAS:
    - P
    HRP1001.ENDDA:
    - '99991231'
  severity: high
  dimension: consistency
  message: Position holder relationship points to a personnel number that does not exist
  why_it_matters: The holder relationship (S 008 P) stores the personnel number in SOBID. A number that has no PA0001 record leaves
    a phantom holder that fills the position.
  rule_authority: sap_hard_constraint
  sap_impact: The position appears occupied while no employee holds it; headcount is overstated.
  fix_map:
    __other__: Delimit the relationship in PPOME or correct the personnel number.
  record_fix_template: 'Position {HRP1001.OBJID}: holder relationship points to a personnel number with no assignment. Correct in PPOME.'
- id: PA061
  field: HRP1001.PROZT
  check_class: cross_field_check
  grain: HRP1001
  fail_when: (`HRP1001.PROZT` < 0) | (`HRP1001.PROZT` > 100)
  applies_when:
    HRP1001.RELAT:
    - 008
    HRP1001.RSIGN:
    - A
  severity: medium
  dimension: validity
  message: Holder relationship has a weighting percentage outside 0 to 100
  why_it_matters: A position may be shared between holders by weighting; each share must lie between 0 and 100 percent.
  rule_authority: sap_hard_constraint
  sap_impact: Position staffing totals are wrong; planned cost distribution is distorted.
  fix_map:
    __other__: Correct the percentage in PPOME > relationship maintenance.
  record_fix_template: 'Position {HRP1001.OBJID}: holder weighting is outside 0 to 100. Correct in PPOME.'
- id: PA062
  field: HRP1001.BEGDA
  check_class: interval_check
  grain: HRP1001
  group_by:
  - HRP1001.PLVAR
  - HRP1001.OTYPE
  - HRP1001.OBJID
  - HRP1001.RSIGN
  - HRP1001.RELAT
  - HRP1001.SCLAS
  - HRP1001.SOBID
  start: HRP1001.BEGDA
  end: HRP1001.ENDDA
  severity: high
  dimension: consistency
  message: Same organisational relationship exists with overlapping validity
  why_it_matters: An identical relationship (same objects, same direction) with overlapping periods duplicates the relationship and
    double-counts holders and assignments.
  rule_authority: sap_hard_constraint
  sap_impact: Holders are counted twice; evaluation paths return duplicate rows.
  fix_map:
    __other__: Delimit one of the records in PPOME.
  record_fix_template: 'Object {HRP1001.OBJID}: relationship has overlapping validity. Delimit in PPOME.'
- id: PA063
  field: HRP1000.BEGDA
  check_class: interval_check
  grain: HRP1000
  group_by:
  - HRP1000.PLVAR
  - HRP1000.OTYPE
  - HRP1000.OBJID
  - HRP1000.LANGU
  start: HRP1000.BEGDA
  end: HRP1000.ENDDA
  severity: high
  dimension: consistency
  message: Object has overlapping validity records in infotype 1000 (same language)
  why_it_matters: Infotype 1000 allows one record per language at a time. Overlaps give an object two names for the same period.
  rule_authority: sap_hard_constraint
  sap_impact: Object text lookups pick an arbitrary record; PPOME shows duplicates.
  fix_map:
    __other__: Delimit the extra record in PPOME (PP02 / PO03).
  record_fix_template: 'Object {HRP1000.OBJID}: overlapping infotype 1000 records. Delimit in PPOME.'
- id: PA064
  field: HRP1000.STEXT
  check_class: null_check
  grain: HRP1000
  applies_when:
    HRP1000.OTYPE:
    - O
    - S
    - C
    HRP1000.ENDDA:
    - '99991231'
  severity: medium
  dimension: completeness
  message: Active organisational object has no name
  why_it_matters: Every organisational unit, job and position needs a name for reports, matchcodes and workflow descriptions.
  rule_authority: best_practice
  sap_impact: Reports and selection lists show blank rows; users cannot choose the object.
  fix_map:
    __blank__: Maintain the object name in PPOME.
  record_fix_template: 'Object {HRP1000.OBJID}: no name. Maintain in PPOME.'
- id: PA065
  field: HRP1000.ISTAT
  check_class: domain_value_check
  grain: HRP1000
  allowed_values:
  - '1'
  - '2'
  - '3'
  - '4'
  - '5'
  valid_values_with_labels:
    '1': Active
    '2': Planned
    '3': Submitted
    '4': Approved
    '5': Rejected
  severity: medium
  dimension: validity
  message: Planning status is not one of the five SAP statuses
  why_it_matters: Only 1 (active), 2 (planned), 3 (submitted), 4 (approved) and 5 (rejected) are defined. Anything else is invisible
    to the standard evaluation paths.
  rule_authority: sap_hard_constraint
  sap_impact: The object is excluded from structural reports and integration checks.
  fix_map:
    __other__: Set a valid planning status in PPOME / PP01.
  record_fix_template: 'Object {HRP1000.OBJID}: planning status is invalid. Correct in PPOME.'
- id: PA066
  field: HRP1001.BEGDA
  check_class: cross_field_check
  grain: HRP1001
  fail_when: '`HRP1001.BEGDA` > `HRP1001.ENDDA`'
  severity: medium
  dimension: validity
  message: Relationship validity ends before it starts
  why_it_matters: A relationship whose end date is before its start date never applies, so the dependency the planner intended does
    not exist.
  rule_authority: sap_hard_constraint
  sap_impact: Evaluation paths ignore the relationship; position holders or reporting lines silently vanish.
  fix_map:
    __other__: Correct the validity dates in PPOME.
  record_fix_template: 'Object {HRP1001.OBJID}: relationship validity ends before it starts. Correct in PPOME.'
- id: PA067
  field: PA0000.MASSG
  check_class: exists_check
  grain: PA0000
  fields:
  - PA0000.MASSN
  - PA0000.MASSG
  target_table: T530
  target_fields:
  - MASSN
  - MASSG
  applies_when:
    PA0000.MASSG:
      populated: true
  severity: high
  dimension: validity
  message: Action reason is not defined for the action type
  why_it_matters: The reason on the action record must exist in T530 for the same action type. A reason that belongs to a different action, or was deleted from configuration, breaks action statistics and
    reason-driven workflow.
  rule_authority: sap_hard_constraint
  sap_impact: Action reports and statistics cannot decode the reason; PA40 refuses to re-save the action until the pair is valid.
  fix_map:
    __other__: Correct the reason in PA30 infotype 0000 or add the action and reason pair in table T530 (SPRO personnel actions, reasons for actions).
  record_fix_template: Personnel number {PA0000.PERNR} has an action reason that does not belong to its action type. Correct in PA30 infotype 0000.
- id: PA068
  field: PA0000.STAT1
  check_class: cross_field_check
  grain: PA0000
  fail_when: '`PA0000.STAT1` != `T529A.STAT1`'
  require_populated: true
  applies_when:
    PA0000.ENDDA:
    - '99991231'
  severity: medium
  dimension: consistency
  message: The customer-specific status on the action record differs from the status the action type sets
  why_it_matters: Table T529A defines which customer-specific status each action type sets. A stored value that differs means the record was changed by hand or the action configuration changed after the
    action ran.
  rule_authority: best_practice
  sap_impact: Headcount, payroll eligibility and authorisation checks read the stored status, so they disagree with the action history.
  fix_map:
    __other__: Review the action in PA30 infotype 0000 and re-run it through PA40, or correct the action type status in T529A.
  record_fix_template: Personnel number {PA0000.PERNR} carries a status that differs from the status of its action type. Review in PA30 infotype 0000.
- id: PA069
  field: PA0000.STAT2
  check_class: cross_field_check
  grain: PA0000
  fail_when: '`PA0000.STAT2` != `T529A.STAT2`'
  require_populated: true
  applies_when:
    PA0000.ENDDA:
    - '99991231'
  severity: high
  dimension: consistency
  message: The employment status on the action record differs from the status the action type sets
  why_it_matters: Table T529A defines which employment status each action type sets. A stored value that differs means the record was changed by hand or the action configuration changed after the action
    ran.
  rule_authority: best_practice
  sap_impact: Headcount, payroll eligibility and authorisation checks read the stored status, so they disagree with the action history.
  fix_map:
    __other__: Review the action in PA30 infotype 0000 and re-run it through PA40, or correct the action type status in T529A.
  record_fix_template: Personnel number {PA0000.PERNR} carries a status that differs from the status of its action type. Review in PA30 infotype 0000.
- id: PA070
  field: PA0000.STAT3
  check_class: cross_field_check
  grain: PA0000
  fail_when: '`PA0000.STAT3` != `T529A.STAT3`'
  require_populated: true
  applies_when:
    PA0000.ENDDA:
    - '99991231'
  severity: high
  dimension: consistency
  message: The special payment status on the action record differs from the status the action type sets
  why_it_matters: Table T529A defines which special payment status each action type sets. A stored value that differs means the record was changed by hand or the action configuration changed after the action
    ran.
  rule_authority: best_practice
  sap_impact: Headcount, payroll eligibility and authorisation checks read the stored status, so they disagree with the action history.
  fix_map:
    __other__: Review the action in PA30 infotype 0000 and re-run it through PA40, or correct the action type status in T529A.
  record_fix_template: Personnel number {PA0000.PERNR} carries a status that differs from the status of its action type. Review in PA30 infotype 0000.
- id: PA071
  field: PA0000.STAT3
  check_class: cross_field_check
  grain: PA0000
  fail_when: (`PA0000.STAT2` == '3') & (`PA0000.STAT3` == '0')
  require_populated: true
  applies_when:
    PA0000.ENDDA:
    - '99991231'
  severity: high
  dimension: consistency
  message: Employee is active but the special payment status says withdrawn
  why_it_matters: Employment status 3 (active) with special payment status 0 (withdrawn) means the person is treated as employed in the organisation but excluded from special payments such as bonuses.
  rule_authority: best_practice
  sap_impact: Bonus and special payment runs skip the employee while regular payroll pays them.
  fix_map:
    __other__: Correct the special payment status through a PA40 action that sets it to active.
  record_fix_template: Personnel number {PA0000.PERNR} is active but has a withdrawn special payment status. Review in PA30 infotype 0000.
- id: PA072
  field: PA0000.STAT2
  check_class: domain_value_check
  grain: PA0000
  allowed_values:
  - '0'
  - '1'
  - '2'
  - '3'
  valid_values_with_labels:
    '0': Withdrawn
    '1': Inactive
    '2': Retiree
    '3': Active
  severity: medium
  dimension: validity
  message: Employment status is not one of 0, 1, 2 or 3
  why_it_matters: 'Employment status has four defined values: withdrawn, inactive, retiree and active. Anything else is unknown to payroll, authorisations and headcount reports.'
  rule_authority: sap_hard_constraint
  sap_impact: Records with an undefined status fall out of every status-driven selection.
  fix_map:
    __other__: Correct the status through the action type configuration (T529A) and re-run the action in PA40.
  record_fix_template: Personnel number {PA0000.PERNR} has an undefined employment status. Review the action type in T529A.
- id: PA073
  field: PA0000.PREAS
  check_class: exists_check
  grain: PA0000
  target_table: T530E
  target_fields:
  - PREAS
  target_when:
    INFTY:
    - '0000'
  applies_when:
    PA0000.ENDDA:
    - '99991231'
    PA0000.PREAS:
      populated: true
  severity: medium
  dimension: validity
  message: Reason for change on infotype 0000 is not defined for this infotype
  why_it_matters: The reason for changing an infotype record must exist in T530E for that infotype. Reasons are maintained per infotype, so a reason copied from another infotype is invalid.
  rule_authority: best_practice
  sap_impact: Change-reason reports and workflows that read T530E cannot decode the reason.
  fix_map:
    __other__: Correct the reason in PA30 or add the infotype and reason pair in table T530E.
  record_fix_template: Personnel number {PA0000.PERNR} carries a change reason that is not defined for this infotype. Correct in PA30.
