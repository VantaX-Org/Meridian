  severity: medium
  dimension: validity
  message: Indicator Within the Release Strategy must be a value of domain FRGAK (e.g. +, X)
  why_it_matters: Domain FRGAK fixes the permitted values of FRGA8 (Indicator Within the Release Strategy) in the SAP Data
    Dictionary. Any other non-blank value is outside SAP's own domain definition and is read inconsistently by the programs
    that consume the field.
  rule_authority: sap_hard_constraint
  sap_impact: FRGA8 will not evaluate correctly wherever SAP branches on its value.
  allowed_values:
  - +
  - X
  fix_map:
    __other__: 'T16FV.FRGA8 ''{invalid_value}'' is not in domain FRGAK. Set it to one of: +, X.'
  record_fix_template: 'T16FV.FRGA8 is {actual_value}; expected one of: +, X.'
