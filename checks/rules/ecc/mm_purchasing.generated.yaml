  field: EKPO.AUREL
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: Relevant to Allocation Table must be a value of domain AUREL (e.g. 1, 2, 3, 4, 5)
  why_it_matters: Domain AUREL fixes the permitted values of AUREL (Relevant to Allocation Table) in the SAP Data Dictionary.
    Any other non-blank value is outside SAP's own domain definition and is read inconsistently by the programs that consume
    the field.
  rule_authority: sap_hard_constraint
  sap_impact: AUREL will not evaluate correctly wherever SAP branches on its value.
  allowed_values:
  - '1'
  - '2'
  - '3'
  - '4'
  - '5'
  fix_map:
    __other__: 'EKPO.AUREL ''{invalid_value}'' is not in domain AUREL. Set it to one of: 1, 2, 3, 4, 5.'
  record_fix_template: 'EKPO.AUREL is {actual_value}; expected one of: 1, 2, 3, 4, 5.'
