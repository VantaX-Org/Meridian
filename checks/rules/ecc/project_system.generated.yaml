  dimension: validity
  message: 'ID: Leading unit of measure for completing a transaction must be a value of domain KZFME (e.g. A, B)'
  why_it_matters: 'Domain KZFME fixes the permitted values of KZFME (ID: Leading unit of measure for completing a transaction)
    in the SAP Data Dictionary. Any other non-blank value is outside SAP''s own domain definition and is read inconsistently
    by the programs that consume the field.'
  rule_authority: sap_hard_constraint
  sap_impact: KZFME will not evaluate correctly wherever SAP branches on its value.
  allowed_values:
  - A
  - B
  fix_map:
