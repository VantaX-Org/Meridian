  severity: medium
  dimension: validity
  message: Object Class must be a value of domain SCOPE_CV (e.g. IV, OC, PA, PR)
  why_it_matters: Domain SCOPE_CV fixes the permitted values of SCOPE (Object Class) in the SAP Data Dictionary. Any other
    non-blank value is outside SAP's own domain definition and is read inconsistently by the programs that consume the field.
  rule_authority: sap_hard_constraint
  sap_impact: SCOPE will not evaluate correctly wherever SAP branches on its value.
