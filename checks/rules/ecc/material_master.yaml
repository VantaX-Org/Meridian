  dimension: lifecycle
  message: Production version has expired
  why_it_matters: An expired version (BDATU in the past) is never selected again. Expired versions clutter C223 and the S/4HANA
    production version migration.
  rule_authority: best_practice
  sap_impact: No effect in planning; adds noise to master data reviews.
  fix_map:
    __other__: Delete the version in C223 or extend its validity.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: valid to {actual_value}.'
- id: MM751
  field: MKAL.PRFG_F
  check_class: cross_field_check
  grain: MKAL
  fail_when: '`MKAL.PRFG_F` == ''3'''
  severity: high
  dimension: consistency
  message: Production version consistency check ended with errors
  why_it_matters: The C223 check status (PRFG_F 3) says BOM or routing selection failed when the version was last checked.
  rule_authority: sap_hard_constraint
  sap_impact: Orders created with the version have missing components or operations.
  fix_map:
    __other__: Run the check in C223, correct BOM or routing, and save.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: check status {actual_value}.'
- id: MM752
  field: MKAL.PRFG_F
  check_class: null_check
  grain: MKAL
  severity: low
  dimension: completeness
  message: Production version was never checked
  why_it_matters: A version that was never checked in C223 (PRFG_F blank) may point at a BOM or routing that does not explode.
  rule_authority: best_practice
  sap_impact: Errors appear only when the first order is created.
  fix_map:
    __blank__: Run the consistency check in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: never checked.'
- id: MM753
  field: MKAL.PLNNR
  check_class: null_check
  grain: MKAL
  applies_when:
    MKAL.PLNTY:
      populated: true
  severity: high
  dimension: completeness
  message: Production version has a task list type but no task list
  why_it_matters: A task list type (PLNTY) without a group (PLNNR) points at no routing.
  rule_authority: sap_hard_constraint
  sap_impact: Orders for the version have no operations.
  fix_map:
    __blank__: Enter the routing group in C223 or clear the task list type.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: task list type {MKAL.PLNTY},
    no group.'
- id: MM754
  field: MKAL.PLNTY
  check_class: null_check
  grain: MKAL
  applies_when:
    MKAL.PLNNR:
      populated: true
  severity: high
  dimension: completeness
  message: Production version has a task list group but no task list type
  why_it_matters: SAP reads the routing by type (PLNTY) and group (PLNNR). A group without type cannot be read.
  rule_authority: sap_hard_constraint
  sap_impact: Orders for the version have no operations.
  fix_map:
    __blank__: Enter the task list type in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: routing group {MKAL.PLNNR},
    no task list type.'
- id: MM755
  field: MKAL.ALNAL
  check_class: null_check
  grain: MKAL
  applies_when:
    MKAL.PLNNR:
      populated: true
  severity: high
  dimension: completeness
  message: Production version has a task list group but no group counter
  why_it_matters: The group counter (ALNAL) picks one routing inside the group. Without it the routing is ambiguous.
  rule_authority: sap_hard_constraint
  sap_impact: Order creation stops or picks the wrong routing.
  fix_map:
    __blank__: Enter the group counter in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: routing group {MKAL.PLNNR},
    no group counter.'
- id: MM756
  field: MKAL.STLAN
  check_class: null_check
  grain: MKAL
  applies_when:
    MKAL.STLAL:
      populated: true
  severity: high
  dimension: completeness
  message: Production version has a BOM alternative but no BOM usage
  why_it_matters: SAP reads the BOM by usage (STLAN) and alternative (STLAL). An alternative without usage cannot be read.
  rule_authority: sap_hard_constraint
  sap_impact: Orders for the version have no components.
  fix_map:
    __blank__: Enter the BOM usage in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: BOM alternative {MKAL.STLAL},
    no usage.'
- id: MM757
  field: MKAL.TEXT1
  check_class: null_check
  grain: MKAL
  severity: low
  dimension: completeness
  message: Production version has no description
  why_it_matters: Planners pick versions by text in MD04, C223 and the S/4HANA Manage Production Versions app.
  rule_authority: best_practice
  sap_impact: Planners pick the wrong version.
  fix_map:
    __blank__: Enter a short text in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: no description.'
- id: MM758
  field: MKAL.ELPRO
  check_class: exists_check
  grain: MKAL
  applies_when:
    MKAL.ELPRO:
      populated: true
  fields:
  - MKAL.MATNR
  - MKAL.WERKS
  - MKAL.ELPRO
  target_table: MARD
  target_fields:
  - MATNR
  - WERKS
  - LGORT
  severity: medium
  dimension: consistency
  message: Production version receiving storage location is not extended for the material
  why_it_matters: Goods receipts from orders for the version post to its receiving storage location (ELPRO). The material
    must be extended there (MARD).
  rule_authority: best_practice
  sap_impact: Goods receipt fails or creates the location on the fly.
  fix_map:
    __other__: Extend the material to the storage location or correct the version in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: receiving storage location
    {actual_value} not extended.'
- id: MM759
  field: MKAL.BESKZ
  check_class: domain_value_check
  grain: MKAL
  severity: low
  dimension: validity
  message: Production version procurement type is outside its domain
  why_it_matters: The version procurement type (BESKZ) accepts E, F, X or blank.
  rule_authority: sap_hard_constraint
  sap_impact: The version is rejected in load or ignored in MRP.
  fix_map:
    __other__: Correct the procurement type in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: procurement type ''{actual_value}''.'
- id: MM760
  field: MKAL.MKSP
  check_class: domain_value_check
  grain: MKAL
  severity: low
  dimension: validity
  message: Production version lock indicator is outside its domain
  why_it_matters: The lock (MKSP) accepts blank or 1.
  rule_authority: sap_hard_constraint
  sap_impact: The version is locked or unlocked unexpectedly.
  fix_map:
    __other__: Correct the lock indicator in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: lock ''{actual_value}''.'
  auto_fix:
    steps:
    - op: strip
    - op: upper
    - op: map
      values:
        X: '1'
        Y: '1'
        __other__: null
    confidence: medium
- id: MM761
  field: MKAL.MKSP
  check_class: cross_field_check
  grain: MKAL
  applies_when:
    MKAL.MKSP:
    - '1'
  fail_when: '`MKAL.BDATU` > @today'
  severity: low
  dimension: lifecycle
  message: Locked production version is still valid in the future
  why_it_matters: A locked version (MKSP 1) is skipped by MRP. When it stays valid for years it is usually a forgotten lock
    or should be closed by its valid-to date.
  rule_authority: best_practice
  sap_impact: Planners cannot see why the version is never used.
  fix_map:
    __other__: Unlock the version or set its valid-to date in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: locked, valid to {MKAL.BDATU}.'
- id: MM762
  field: MKAL.SERKZ
  check_class: domain_value_check
  grain: MKAL
  severity: low
  dimension: validity
  message: Repetitive manufacturing indicator holds a value outside its domain
  why_it_matters: The REM flag (SERKZ) allows run schedules for the version. SAP accepts only X or blank. Loads often bring
    Y, 1 or TRUE, which SAP and the S/4HANA migration cockpit reject.
  rule_authority: sap_hard_constraint
  sap_impact: The migration load fails on the field or the indicator is read as not set.
  fix_map:
    __other__: Set the indicator to X or blank in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: repetitive manufacturing
    indicator ''{actual_value}''.'
  auto_fix:
    steps:
    - op: strip
    - op: upper
    - op: map
      values:
        X: X
        Y: X
        'YES': X
        'TRUE': X
        '1': X
        N: ''
        'NO': ''
        'FALSE': ''
        '0': ''
        __other__: null
    confidence: medium
- id: MM763
  field: MDMA.BSTMA
  check_class: cross_field_check
  grain: MDMA
  fail_when: (`MDMA.BSTMA` > 0) & (`MDMA.BSTMA` < `MDMA.BSTMI`)
  severity: medium
  dimension: consistency
  message: MRP area maximum lot size is below its minimum lot size
  why_it_matters: A maximum lot size (BSTMA) below the minimum (BSTMI) matches no lot.
  rule_authority: best_practice
  sap_impact: MRP in the MRP area creates lots that break one of the limits.
  fix_map:
    __other__: Correct the lot-size limits in MM02 MRP area.
  record_fix_template: 'Material {MDMA.MATNR}, MRP area {MDMA.BERID}: minimum {MDMA.BSTMI}, maximum {actual_value}.'
- id: MM764
  field: MDMA.MINBE
  check_class: cross_field_check
  grain: MDMA
  applies_when:
    MDMA.DISMM:
    - VB
    - V1
  fail_when: '`MDMA.MINBE`.isna() | (`MDMA.MINBE` <= 0)'
  severity: high
  dimension: completeness
  message: MRP area with reorder-point planning has no reorder point
  why_it_matters: Reorder-point MRP types (VB, VM, V1, V2) in the MRP area need a reorder point (MINBE).
  rule_authority: sap_hard_constraint
  sap_impact: The MRP area is never replenished.
  fix_map:
    __other__: Maintain the reorder point in MM02 MRP area.
  record_fix_template: 'Material {MDMA.MATNR}, MRP area {MDMA.BERID}: reorder point {actual_value}.'
- id: MM765
  field: MDMA.MINBE
  check_class: cross_field_check
  grain: MDMA
  applies_when:
    MDMA.DISMM:
    - VB
  fail_when: (`MDMA.MINBE` > 0) & (`MDMA.MINBE` < `MDMA.EISBE`)
  severity: medium
  dimension: consistency
  message: MRP area reorder point is below its safety stock
  why_it_matters: The reorder point should cover safety stock plus lead-time demand. Below safety stock, replenishment starts
    only after safety stock is used.
  rule_authority: best_practice
  sap_impact: Stock-outs in the MRP area.
  fix_map:
    __other__: Raise the reorder point in MM02 MRP area.
  record_fix_template: 'Material {MDMA.MATNR}, MRP area {MDMA.BERID}: reorder point {actual_value}, safety stock {MDMA.EISBE}.'
- id: MM766
  field: MDMA.DISPO
  check_class: null_check
  grain: MDMA
  applies_when:
    MDMA.DISMM:
      populated: true
      not_in:
      - ND
  severity: high
  dimension: completeness
  message: MRP area has no MRP controller
  why_it_matters: MRP controller (DISPO) owns exceptions in MD04 and MD06. MRP areas that are planned need one.
  rule_authority: sap_hard_constraint
  sap_impact: Exceptions in the MRP area are not routed to anyone.
  fix_map:
    __blank__: Enter the MRP controller in MM02 MRP area.
  record_fix_template: 'Material {MDMA.MATNR}, MRP area {MDMA.BERID}: no MRP controller.'
- id: MM767
  field: MDMA.DISLS
  check_class: null_check
  grain: MDMA
  applies_when:
    MDMA.DISMM:
      populated: true
      not_in:
      - ND
  severity: high
  dimension: completeness
  message: Planned MRP area has no lot-sizing procedure
  why_it_matters: MRP needs a lot-sizing procedure (DISLS) to size proposals.
  rule_authority: sap_hard_constraint
  sap_impact: MRP stops for the MRP area with an error.
  fix_map:
    __blank__: Enter the lot-sizing procedure in MM02 MRP area.
  record_fix_template: 'Material {MDMA.MATNR}, MRP area {MDMA.BERID}: no lot-sizing procedure.'
- id: MM768
  field: MDMA.BSTFE
  check_class: cross_field_check
  grain: MDMA
  applies_when:
    MDMA.DISLS:
    - FX
  fail_when: '`MDMA.BSTFE`.isna() | (`MDMA.BSTFE` <= 0)'
  severity: high
  dimension: completeness
  message: MRP area with fixed lot size has no fixed lot size
  why_it_matters: Lot-sizing procedure FX orders the fixed lot size (BSTFE). Without it no proposal is made.
  rule_authority: sap_hard_constraint
  sap_impact: MRP creates no or zero proposals in the MRP area.
  fix_map:
    __other__: Maintain the fixed lot size in MM02 MRP area.
  record_fix_template: 'Material {MDMA.MATNR}, MRP area {MDMA.BERID}: fixed lot size {actual_value}.'
- id: MM769
  field: MDMA.MABST
  check_class: cross_field_check
  grain: MDMA
  applies_when:
    MDMA.DISLS:
    - HB
  fail_when: '`MDMA.MABST`.isna() | (`MDMA.MABST` <= 0)'
  severity: high
  dimension: completeness
  message: MRP area with replenish to maximum has no maximum stock level
  why_it_matters: Lot-sizing procedure HB fills up to the maximum stock level (MABST). Without it no proposal is made.
  rule_authority: sap_hard_constraint
  sap_impact: MRP creates no proposals in the MRP area.
  fix_map:
    __other__: Maintain the maximum stock level in MM02 MRP area.
  record_fix_template: 'Material {MDMA.MATNR}, MRP area {MDMA.BERID}: maximum stock level {actual_value}.'
- id: MM770
  field: MDMA.DISMM
  check_class: cross_field_check
  grain: MDMA
  applies_when:
    MDMA.LOEKZ:
    - X
  fail_when: '`MDMA.DISMM`.notna() & (`MDMA.DISMM` != ''ND'')'
  severity: medium
  dimension: lifecycle
  message: MRP area is flagged for deletion but still planned
  why_it_matters: A deletion flag (LOEKZ) on the MRP area should stop planning. MRP still plans the area while the MRP type
    is not ND.
  rule_authority: best_practice
  sap_impact: Proposals keep being created for a retired MRP area.
  fix_map:
    __other__: Set MRP type ND in the MRP area or remove the deletion flag.
  record_fix_template: 'Material {MDMA.MATNR}, MRP area {MDMA.BERID}: flagged for deletion, MRP type {actual_value}.'
  auto_fix:
    steps:
    - op: set
      value: ND
    confidence: medium
- id: MM771
  field: MDMA.PLIFZX
  check_class: cross_field_check
  grain: MDMA
  applies_when:
    MDMA.PLIFZX:
      blank: true
  fail_when: '`MDMA.PLIFZ` > 0'
  severity: low
  dimension: consistency
  message: MRP area planned delivery time is maintained but not activated
  why_it_matters: The MRP area delivery time (PLIFZ) is used only when PLIFZX is set; otherwise the plant value applies.
  rule_authority: best_practice
  sap_impact: Scheduling in the MRP area uses the plant lead time, not the one entered.
  fix_map:
    __other__: Set the indicator to use the MRP area delivery time in MM02 MRP area, or clear the value.
  record_fix_template: 'Material {MDMA.MATNR}, MRP area {MDMA.BERID}: planned delivery time {MDMA.PLIFZ} days, indicator blank.'
  auto_fix:
    steps:
    - op: set
      value: X
    confidence: medium
- id: MM772
  field: MDMA.BERID
  check_class: cross_field_check
  grain: MDMA
  fail_when: '`MDMA.BERID` == `MDMA.WERKS`'
  severity: medium
  dimension: consistency
  message: MRP area segment repeats the plant MRP area
  why_it_matters: The plant MRP area is planned from the plant data (MARC). An MDMA segment whose MRP area equals the plant
    code duplicates it.
  rule_authority: best_practice
  sap_impact: Two sets of MRP parameters exist for one area; results depend on which is read.
  fix_map:
    __other__: Delete the MDMA segment and keep plant parameters in MM02 MRP views.
  record_fix_template: 'Material {MDMA.MATNR}, MRP area {MDMA.BERID}: MRP area equals plant {MDMA.WERKS}.'
- id: MM773
  field: MDMA.LOEKZ
  check_class: domain_value_check
  grain: MDMA
  severity: low
  dimension: validity
  message: MRP area deletion flag holds a value outside its domain
  why_it_matters: The deletion flag (LOEKZ) retires the MRP area segment. SAP accepts only X or blank. Loads often bring Y,
    1 or TRUE, which SAP and the S/4HANA migration cockpit reject.
  rule_authority: sap_hard_constraint
  sap_impact: The migration load fails on the field or the indicator is read as not set.
  fix_map:
    __other__: Set the indicator to X or blank in MM02 MRP area.
  record_fix_template: 'Material {MDMA.MATNR}, MRP area {MDMA.BERID}: mrp area deletion flag ''{actual_value}''.'
  auto_fix:
    steps:
    - op: strip
    - op: upper
    - op: map
      values:
        X: X
        Y: X
        'YES': X
        'TRUE': X
        '1': X
        N: ''
        'NO': ''
        'FALSE': ''
        '0': ''
        __other__: null
    confidence: medium
- id: MM774
  field: MDMA.PLIFZX
  check_class: domain_value_check
  grain: MDMA
  severity: low
  dimension: validity
  message: MRP area delivery time indicator is outside its domain
  why_it_matters: PLIFZX accepts X or blank.
  rule_authority: sap_hard_constraint
  sap_impact: The load fails or the indicator is read as not set.
  fix_map:
    __other__: Correct the indicator in MM02 MRP area.
  record_fix_template: 'Material {MDMA.MATNR}, MRP area {MDMA.BERID}: indicator ''{actual_value}''.'
  auto_fix:
    steps:
    - op: strip
    - op: upper
    - op: map
      values:
        X: X
        Y: X
        'YES': X
        'TRUE': X
        '1': X
        N: ''
        'NO': ''
        'FALSE': ''
        '0': ''
        __other__: null
    confidence: medium
- id: MM775
  field: MAST.LOSBS
  check_class: cross_field_check
  grain: MAST
  fail_when: (`MAST.LOSBS` > 0) & (`MAST.LOSBS` < `MAST.LOSVN`)
  severity: medium
  dimension: consistency
  message: BOM lot-size range ends before it starts
  why_it_matters: The material-to-BOM link is valid from lot size LOSVN to LOSBS. A to-value below the from-value matches
    no lot.
  rule_authority: best_practice
  sap_impact: BOM selection by lot size never finds the alternative.
  fix_map:
    __other__: Correct the lot-size range in CS02.
  record_fix_template: 'BOM {MAST.STLNR}, material {MAST.MATNR}, plant {MAST.WERKS}: lot size from {MAST.LOSVN} to {actual_value}.'
- id: MM776
  field: STPO.MENGE
  check_class: cross_field_check
  grain: STPO
  applies_when:
    STPO.POSTP:
    - L
    STPO.LKENZ:
      blank: true
  fail_when: '`STPO.MENGE`.fillna(0) == 0'
  severity: high
  dimension: validity
  message: Stock item has zero component quantity
  why_it_matters: A stock item (POSTP L) with quantity 0 creates no requirement and issues nothing. Co-products use negative
    quantities; zero has no meaning.
  rule_authority: sap_hard_constraint
  sap_impact: Components are missing from orders and costing.
  fix_map:
    __other__: Enter the component quantity in CS02 or delete the item.
  record_fix_template: 'BOM {STPO.STLNR}, item {STPO.POSNR}, component {STPO.IDNRK}: quantity {actual_value}.'
- id: MM777
  field: STPO.MEINS
  check_class: null_check
  grain: STPO
  severity: high
  dimension: completeness
  message: BOM item has no unit of measure
  why_it_matters: The component quantity is meaningless without its unit (MEINS).
  rule_authority: sap_hard_constraint
  sap_impact: Explosion fails or converts with the wrong unit.
  fix_map:
    __blank__: Enter the unit in CS02.
  record_fix_template: 'BOM {STPO.STLNR}, item {STPO.POSNR}, component {STPO.IDNRK}: no unit.'
- id: MM778
  field: STPO.IDNRK
  check_class: null_check
  grain: STPO
  applies_when:
    STPO.POSTP:
    - L
    - R
  severity: high
  dimension: completeness
  message: Stock item has no component material
  why_it_matters: Stock (L) and variable-size (R) items need a component material (IDNRK).
  rule_authority: sap_hard_constraint
  sap_impact: Explosion creates requirements for no material.
  fix_map:
    __blank__: Enter the component in CS02.
  record_fix_template: 'BOM {STPO.STLNR}, item {STPO.POSNR}, component {STPO.IDNRK}: no component.'
- id: MM779
  field: STPO.POSTP
  check_class: null_check
  grain: STPO
  severity: high
  dimension: completeness
  message: BOM item has no item category
  why_it_matters: The item category (POSTP) decides whether the item is stock, non-stock, text or document.
  rule_authority: sap_hard_constraint
  sap_impact: The item cannot be exploded or migrated.
  fix_map:
    __blank__: Enter the item category in CS02.
  record_fix_template: 'BOM {STPO.STLNR}, item {STPO.POSNR}, component {STPO.IDNRK}: no item category.'
- id: MM780
  field: STPO.AUSCH
  check_class: cross_field_check
  grain: STPO
  fail_when: '`STPO.AUSCH` >= 100'
  severity: medium
  dimension: accuracy
  message: Component scrap is 100 percent or more
  why_it_matters: Component scrap (AUSCH) raises the component requirement. At 100 percent or more it at least doubles; this
    is a load error in practice.
  rule_authority: best_practice
  sap_impact: Component requirements and costs are doubled or more.
  fix_map:
    __other__: Correct the component scrap in CS02.
  record_fix_template: 'BOM {STPO.STLNR}, item {STPO.POSNR}, component {STPO.IDNRK}: component scrap {actual_value}%.'
- id: MM781
  field: STPO.ALPST
  check_class: null_check
  grain: STPO
  applies_when:
    STPO.ALPGR:
      populated: true
  severity: medium
  dimension: completeness
  message: Alternative item group has no strategy
  why_it_matters: Alternative items (ALPGR) need a strategy (ALPST) that says how the alternative is chosen.
  rule_authority: sap_hard_constraint
  sap_impact: MRP cannot choose between alternative items.
  fix_map:
    __blank__: Enter the strategy in CS02.
  record_fix_template: 'BOM {STPO.STLNR}, item {STPO.POSNR}, component {STPO.IDNRK}: alternative group {STPO.ALPGR}, no strategy.'
- id: MM782
  field: STPO.IDNRK
  check_class: exists_check
  grain: STPO
  applies_when:
    STPO.POSTP:
    - L
    - R
    STPO.IDNRK:
      populated: true
  fields:
  - STPO.IDNRK
  target_table: MARA
  target_fields:
  - MATNR
  severity: high
  dimension: consistency
  message: BOM component does not exist in the material master
  why_it_matters: A stock or variable-size item must point at an existing material (MARA).
  rule_authority: sap_hard_constraint
  sap_impact: Explosion fails; the S/4HANA migration rejects the BOM.
  fix_map:
    __other__: Create the component or correct the item in CS02.
  record_fix_template: 'BOM {STPO.STLNR}, item {STPO.POSNR}, component {STPO.IDNRK}: component {actual_value} not found.'
- id: MM783
  field: STPO.IDNRK
  check_class: exists_check
  grain: STPO
  applies_when:
    STPO.LKENZ:
      blank: true
  negate: true
  fields:
  - STPO.IDNRK
  target_table: MARA
  target_fields:
  - MATNR
  target_when:
    LVORM:
    - X
  severity: high
  dimension: lifecycle
  message: BOM component is flagged for deletion at client level
  why_it_matters: A component with the client-level deletion flag (MARA-LVORM) cannot be planned or issued.
  rule_authority: best_practice
  sap_impact: Orders carry a component that cannot be procured; archiving is blocked.
  fix_map:
    __other__: Replace the component or delete the item in CS02.
  record_fix_template: 'BOM {STPO.STLNR}, item {STPO.POSNR}, component {STPO.IDNRK}: component {actual_value} flagged for
    deletion.'
- id: MM784
  field: STPO.STLTY
  check_class: domain_value_check
  grain: STPO
  severity: low
  dimension: validity
  message: BOM category is outside its domain
  why_it_matters: The BOM category (STLTY) accepts D, E, K, M, S, T or P.
  rule_authority: sap_hard_constraint
  sap_impact: The item belongs to no BOM header type and is lost in migration.
  fix_map:
    __other__: Correct the extract or the BOM.
  record_fix_template: 'BOM {STPO.STLNR}, item {STPO.POSNR}, component {STPO.IDNRK}: BOM category ''{actual_value}''.'
- id: MM785
  field: STPO.FMENG
  check_class: domain_value_check
  grain: STPO
  severity: low
  dimension: validity
  message: Fixed quantity indicator holds a value outside its domain
  why_it_matters: Fixed quantity (FMENG) keeps the quantity independent of lot size. SAP accepts only X or blank. Loads often
    bring Y, 1 or TRUE, which SAP and the S/4HANA migration cockpit reject.
  rule_authority: sap_hard_constraint
  sap_impact: The migration load fails on the field or the indicator is read as not set.
  fix_map:
    __other__: Set the indicator to X or blank in CS02.
  record_fix_template: 'BOM {STPO.STLNR}, item {STPO.POSNR}, component {STPO.IDNRK}: fixed quantity indicator ''{actual_value}''.'
  auto_fix:
