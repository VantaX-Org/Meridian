  dimension: validity
  message: Batch management indicator holds a value outside its domain
  why_it_matters: Batch management (XCHPF) controls batch-managed stock in the plant. SAP accepts only X or blank. Loads often
    bring Y, 1 or TRUE, which SAP and the S/4HANA migration cockpit reject.
