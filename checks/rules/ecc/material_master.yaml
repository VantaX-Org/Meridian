- id: MM216
  field: MARC.PRCTR
  check_class: exists_check
  target_table: CEPC
  target_fields:
  - PRCTR
  severity: high
  dimension: consistency
  message: Profit center on the plant view does not exist in the profit center master (CEPC)
  why_it_matters: Every goods movement, production order and billing document for the material in this plant takes its
    profit center from MARC.PRCTR. A profit center that is not in the master data cannot receive postings.
  rule_authority: sap_hard_constraint
  sap_impact: Goods movements and billing post with an error or to the dummy profit center; profit center reporting misstates
    revenue and inventory by segment.
  fix_map:
    __other__: Enter an existing profit center in the plant view (MM02 > Costing 1 or Sales General/Plant) or create the profit
      center (KE51).
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: profit center {actual_value} is not in CEPC.'
- id: MM217
  field: MBEW.SALK3
  check_class: cross_field_check
  applies_when:
    MBEW.VPRSV: [S]
    MBEW.LBKUM: {gt: 0}
    MBEW.PEINH: {gt: 0}
  fail_when: abs(`MBEW.SALK3` - `MBEW.LBKUM` * `MBEW.STPRS` / `MBEW.PEINH`) > 1 + 0.01 * abs(`MBEW.SALK3`)
  severity: high
  dimension: accuracy
  message: Stock value does not equal quantity times standard price for a standard-priced material
  why_it_matters: Under standard price control SAP values every unit of stock at the standard price, so the total stock
    value (SALK3) must equal total valuated stock (LBKUM) times standard price per price unit. A difference means the value
    was loaded or changed outside goods movements and price changes.
  rule_authority: sap_hard_constraint
  sap_impact: The stock account in FI no longer matches the material valuation; the next price change (MR21 / CK24) posts
    the hidden difference as a revaluation, and the balance sheet inventory value is wrong until then.
  fix_map:
    __other__: Reconcile the valuation (MB5L stock-to-G/L, MR51 valuation history); correct with a price change (MR21) or
      a debit/credit of the material (MR22) agreed with the controller.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: stock value {actual_value} does not equal quantity
    {MBEW.LBKUM} at standard price {MBEW.STPRS} per {MBEW.PEINH}.'
- id: MM218
  field: MBEW.VERPR
  check_class: cross_field_check
  fail_when: (`MBEW.VPRSV` == 'S') & (`MBEW.LBKUM` > 0) & (`MBEW.STPRS` > 0) & (`MBEW.VERPR` > 0) & (abs(`MBEW.VERPR` - `MBEW.STPRS`)
    > 0.5 * `MBEW.STPRS`)
  severity: low
  dimension: accuracy
  message: Standard price differs from the moving average (periodic) price by more than 50 percent
  why_it_matters: For standard-priced materials SAP still tracks the moving average of actual receipts in VERPR. When the
    standard is more than half off from what the material actually costs, the standard is out of date or was entered with
    the wrong price unit.
  rule_authority: best_practice
  sap_impact: Every receipt posts a large price difference; inventory, cost of goods sold and product costing run on a price
    that does not reflect reality.
  fix_map:
    __other__: Review the standard price (MM03 Accounting 1, CK13N) against recent purchase prices and costing; roll a new
      standard via costing run (CK40N/CK24) or MR21.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: moving average price {actual_value} against standard
    price {MBEW.STPRS}.'
- id: MM219
  field: MBEW.LAEPR
  check_class: freshness_check
  max_age_hours: 26280
  applies_when:
    MBEW.VPRSV:
    - S
    MBEW.LBKUM:
      gt: 0
  severity: low
  dimension: timeliness
  message: Standard price of a material with stock has not changed in more than 3 years
  why_it_matters: Standard prices are meant to be re-costed at least yearly. A standard unchanged for three years on a
    material that still holds stock almost always no longer reflects purchase or production cost.
  rule_authority: best_practice
  sap_impact: Purchase and production price variances accumulate on every receipt; inventory and margin reporting use a stale
    cost.
  fix_map:
    __other__: Include the material in the next costing run (CK40N) or update the price via MR21 after review.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: last price change {actual_value}.'
- id: MM220
  field: MVKE.MATNR
  check_class: exists_check
  target_table: MLAN
  target_fields:
  - MATNR
  severity: high
  dimension: completeness
  message: Material with a sales view has no tax classification (MLAN)
  why_it_matters: Output tax in SD is determined from the material's tax classification per country (MLAN-TAXM1). A material
    sold without any tax classification gets no tax condition in the order.
  rule_authority: sap_hard_constraint
  sap_impact: Sales orders and billing documents are incomplete or carry no output tax; invoices are blocked or under-taxed.
  fix_map:
    __other__: Maintain the tax classification for the departure country in MM02 > Sales Org. 1.
  record_fix_template: 'Material {MVKE.MATNR}, sales organisation {MVKE.VKORG}: no tax classification.'
- id: MM221
  field: MARM.EAN11
  check_class: exists_check
  fields:
  - MARM.MATNR
  - MARM.MEINH
  - MARM.EAN11
  target_table: MEAN
  target_fields:
  - MATNR
  - MEINH
  - EAN11
  severity: medium
  dimension: consistency
  message: GTIN/EAN on a unit of measure is missing from the EAN table (MEAN)
  why_it_matters: SAP keeps every GTIN of a material in MEAN, with the main one copied to MARM-EAN11. A GTIN that is in MARM
    but not in MEAN was loaded directly and is invisible to EAN lookups.
  rule_authority: sap_hard_constraint
  sap_impact: Scanning or EDI lookups by GTIN (goods receipt, sales orders, IDocs) do not find the material.
  fix_map:
    __other__: Re-save the GTIN via MM02 > Additional data > Units of measure / EANs so MEAN is rebuilt.
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: GTIN {actual_value} is not in MEAN.'
- id: MM222
  field: MARD.LABST
  check_class: cross_field_check
  fail_when: (`MARC.LVORM` == 'X') & ((`MARD.LABST` > 0) | (`MARD.INSME` > 0) | (`MARD.SPEME` > 0))
  severity: medium
  dimension: consistency
  message: Plant view is flagged for deletion but the material still holds stock in the plant
  why_it_matters: A deletion flag says the material is no longer used in the plant, yet stock is still there. Either the
    flag is wrong or the stock has to be used up, scrapped or moved before the plant view can be archived.
  rule_authority: best_practice
  sap_impact: Archiving of the material fails; stock stays on the balance sheet for a material nobody plans or sells any more.
  fix_map:
    __other__: Remove the deletion flag (MM06) if the material is still in use; otherwise issue, scrap or transfer the stock
      first.
  record_fix_template: 'Material {MARD.MATNR}, plant {MARD.WERKS}, storage location {MARD.LGORT}: flagged for deletion with
    stock {actual_value}.'
- id: MM223
  field: MARC.PLIFZ
  check_class: cross_field_check
  fail_when: '`MARC.PLIFZ` > 365'
  severity: low
  dimension: accuracy
  message: Planned delivery time is longer than a year
  why_it_matters: The planned delivery time drives the order date MRP proposes. Lead times above 365 days are almost always
    a unit mistake (weeks or hours keyed as days) or a placeholder.
  rule_authority: best_practice
  sap_impact: MRP proposes purchase requisitions a year or more ahead, tying up working capital and swamping buyers with
    early exception messages.
  fix_map:
    __other__: Correct the planned delivery time in MM02 > MRP 2 from the purchasing info record or the supplier's quote.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: planned delivery time {actual_value} days.'
- id: MM224
  field: MARC.EISBE
  check_class: cross_field_check
  fail_when: (`MARC.MABST` > 0) & (`MARC.EISBE` > `MARC.MABST`)
  severity: medium
  dimension: consistency
  message: Safety stock is above the maximum stock level
  why_it_matters: Safety stock is the floor MRP keeps; the maximum stock level is the ceiling it replenishes to. A floor above
    the ceiling cannot be satisfied.
  rule_authority: best_practice
  sap_impact: MRP proposes receipts it then caps at the maximum, leaving the material permanently below safety stock and
    triggering exception messages on every run.
  fix_map:
    __other__: Correct safety stock or maximum stock level in MM02 > MRP 1/2.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: safety stock {actual_value} above maximum stock {MARC.MABST}.'
- id: MM225
  field: MARM.GEWEI
  check_class: cross_field_check
  applies_when:
    MARM.BRGEW: {gt: 0}
    MARA.BRGEW: {gt: 0}
    MARM.UMREN: {gt: 0}
  # the base unit's own row has UMREZ = UMREN = 1 and passes; written so the scoped weights come last
  fail_when: (`MARM.GEWEI` == `MARA.GEWEI`) & ((`MARM.UMREZ` * `MARA.BRGEW` / `MARM.UMREN` > 2 * `MARM.BRGEW`) | (`MARM.UMREZ`
    * `MARA.BRGEW` / `MARM.UMREN` < 0.5 * `MARM.BRGEW`))
  severity: medium
  dimension: accuracy
  message: Gross weight of an alternative unit does not fit the base unit's weight times the conversion factor
  why_it_matters: An alternative unit holds a fixed number of base units, so its weight should be close to the base weight
    times the conversion factor (packaging aside). Less than half or more than double points to a wrong conversion factor
    or a weight keyed for the wrong unit.
  rule_authority: best_practice
  sap_impact: Delivery and shipment weights, freight costs and loading capacity checks are wrong; a wrong conversion factor
    also mis-states every quantity entered in the alternative unit.
  fix_map:
    __other__: Check the conversion factor and both weights in MM02 > Additional data > Units of measure.
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: gross weight {MARM.BRGEW} {MARM.GEWEI} against base weight {MARA.BRGEW}
    x {MARM.UMREZ}/{MARM.UMREN}.'
- id: MM226
  field: MARA.BSTME
  check_class: exists_check
  fields:
  - MARA.MATNR
  - MARA.BSTME
  target_table: MARM
  target_fields:
  - MATNR
  - MEINH
  severity: high
  dimension: consistency
  message: Purchase order unit has no unit-of-measure conversion (no MARM row)
  why_it_matters: Every PO quantity in the order unit is converted to base unit through MARM. Without the conversion,
    receipts, stock and price per base unit cannot be computed.
  rule_authority: sap_hard_constraint
  sap_impact: ME21N rejects the unit, or interfaces post wrong quantities, and GR fails.
  fix_map:
    __other__: Add the conversion in MM02 > Additional data > Units of measure, or clear the order unit.
  record_fix_template: 'Material {MARA.MATNR}: order unit {MARA.BSTME} has no conversion to base unit {MARA.MEINS}.'
- id: MM227
  field: MVKE.VRKME
  check_class: exists_check
  fields:
  - MVKE.MATNR
  - MVKE.VRKME
  target_table: MARM
  target_fields:
  - MATNR
  - MEINH
  severity: high
  dimension: consistency
  message: Sales unit has no unit-of-measure conversion (no MARM row)
  why_it_matters: Sales order quantities are converted to base unit for availability, delivery and billing through MARM.
  rule_authority: sap_hard_constraint
  sap_impact: The sales order cannot use the unit, and deliveries or ATP compute wrong quantities.
  fix_map:
    __other__: Add the conversion in MM02 (units of measure) or correct the sales unit in the sales view.
  record_fix_template: 'Material {MVKE.MATNR} sales org {MVKE.VKORG}/{MVKE.VTWEG}: sales unit {MVKE.VRKME} has no
    conversion.'
- id: MM228
  field: MARC.KORDB
  check_class: exists_check
  fields:
  - MARC.MATNR
  - MARC.WERKS
  target_table: EORD
  target_fields:
  - MATNR
  - WERKS
  applies_when:
    MARC.KORDB:
    - X
  severity: high
  dimension: consistency
  message: Source list is mandatory for the material at the plant, but no source list exists
  why_it_matters: With the source-list requirement set, SAP accepts only vendors from the source list for this
    material and plant. Without a source list, no PO or automatic source assignment is possible.
  rule_authority: sap_hard_constraint
  sap_impact: ME21N, ME57 and ME59 fail with "source list required". MRP requisitions cannot be converted.
  fix_map:
    __other__: Create the source list (ME01), or remove the source-list requirement in MM02 (purchasing view).
  record_fix_template: 'Material {MARC.MATNR} plant {MARC.WERKS}: source list required but none exists.'
- id: MM229
  field: MBEW.VERPR
  check_class: cross_field_check
  fail_when: abs(`MBEW.SALK3` - `MBEW.LBKUM` * `MBEW.VERPR` / `MBEW.PEINH`) > 1 + 0.01 * abs(`MBEW.SALK3`)
  applies_when:
    MBEW.VPRSV:
    - V
    MBEW.LBKUM:
      gt: 0
    MBEW.PEINH:
      gt: 0
  severity: high
  dimension: accuracy
  message: Moving-average price does not match stock value divided by stock quantity
  why_it_matters: For V-price materials SAP keeps the moving average equal to stock value / stock quantity. A gap
    points to direct table loads, negative-stock history, or a corrupted valuation record.
  rule_authority: sap_hard_constraint
  sap_impact: Goods issues are valued at the wrong price, and inventory value on the balance sheet is misstated.
  fix_map:
    __other__: Analyse with MB5L / MR51. Correct with a price change (MR21) or a debit/credit to the material (MR22).
  record_fix_template: 'Material {MBEW.MATNR} valuation area {MBEW.BWKEY}: value {MBEW.SALK3}, quantity {MBEW.LBKUM},
    moving price {MBEW.VERPR} per {MBEW.PEINH}.'
- id: MM230
  field: MBEW.SALK3
  check_class: cross_field_check
  fail_when: (`MBEW.LBKUM` == 0) & (abs(`MBEW.SALK3`) >= 0.01)
  require_populated: true
  severity: high
  dimension: accuracy
  message: Stock value exists with zero stock quantity
  why_it_matters: With zero stock SAP must carry zero value. Remaining value with no quantity is a balance-sheet
    amount no goods back.
  rule_authority: sap_hard_constraint
  sap_impact: Inventory GL balance overstated or understated. Big-4 inventory valuation exception.
  fix_map:
    __other__: Clear the residual value with MR22 (debit/credit material) after review with controlling.
  record_fix_template: 'Material {MBEW.MATNR} valuation area {MBEW.BWKEY}: value {MBEW.SALK3} with zero stock.'
- id: MM231
  field: MARD.LABST
  check_class: cross_field_check
  fail_when: (`MARD.LABST` < 0) & `MARC.XMCNG`.isna()
  severity: high
  dimension: validity
  message: Negative unrestricted stock where negative stock is not allowed for the material at the plant
  why_it_matters: Negative stock is only possible when it is allowed for the movement, storage location and material
    (MARC-XMCNG). Negative stock without that permission came from a load or from a setting removed afterwards.
  rule_authority: sap_hard_constraint
  sap_impact: Valuation and availability are wrong, and goods issues of this stock fail.
  fix_map:
    __other__: Post the missing goods receipt or a stock correction (MIGO / MI07). Allow negative stock only if the
      process needs it.
  record_fix_template: 'Material {MARD.MATNR} plant {MARD.WERKS} sloc {MARD.LGORT}: stock {MARD.LABST}, negative
    stock not allowed.'
- id: MM232
  field: MARA.XCHPF
  check_class: cross_field_check
  fail_when: '`MARA.XCHPF`.isna()'
  applies_when:
    MARA.MHDHB:
      gt: 0
  severity: medium
  dimension: consistency
  message: Material has a shelf life but is not batch-managed
  why_it_matters: Expiry dates are recorded per batch. Without batch management the shelf-life data cannot be applied
    at goods receipt, and FEFO picking cannot work.
  rule_authority: best_practice
  sap_impact: Expired stock is issued, and the shelf-life check at GR is inactive.
  fix_map:
    __blank__: Activate batch management (MM02, before stock exists) or remove the shelf-life data.
  record_fix_template: 'Material {MARA.MATNR}: total shelf life {MARA.MHDHB} days, not batch-managed.'
- id: MM233
  field: MARC.XCHPF
  check_class: cross_field_check
  fail_when: '`MARC.XCHPF`.fillna('''') != `MARA.XCHPF`.fillna('''')'
  severity: medium
  dimension: consistency
  message: Batch management flag differs between client level and plant level
  why_it_matters: At the standard batch level (material or client), MM02 keeps MARC-XCHPF equal to MARA-XCHPF. A
    difference comes from loads or interfaces and makes batch handling depend on the plant.
  rule_authority: best_practice
  sap_impact: Batch determination and transfers between plants fail or behave inconsistently.
  fix_map:
    __other__: Align the flag in MM02. If batch level is plant (OMCT), mute this rule.
  record_fix_template: 'Material {MARC.MATNR} plant {MARC.WERKS}: plant batch flag ''{MARC.XCHPF}'', client
    ''{MARA.XCHPF}''.'
  auto_fix:
    steps:
    - op: copy
      from: MARA.XCHPF
    confidence: medium
- id: MM234
  field: MARC.PLIFZ
  check_class: cross_field_check
  fail_when: '`MARC.PLIFZ` == 0'
  applies_when:
    MARC.BESKZ:
    - F
    MARC.DISMM:
      populated: true
      not_in:
      - ND
  severity: medium
  dimension: accuracy
  message: Externally procured MRP material has zero planned delivery time
  why_it_matters: MRP schedules the requisition release date as the requirement date minus the planned delivery
    time. Zero means every order is planned to arrive the day it is placed.
  rule_authority: best_practice
  sap_impact: Requisitions are released late, causing stock-outs and expediting.
  fix_map:
    __other__: Maintain the planned delivery time in the MRP 2 view (MM02), or in the info record if the plant uses it.
  record_fix_template: 'Material {MARC.MATNR} plant {MARC.WERKS}: planned delivery time is 0 days.'
- id: MM235
  field: MARC.LGFSB
  check_class: exists_check
  fields:
  - MARC.MATNR
  - MARC.WERKS
  - MARC.LGFSB
  target_table: MARD
  target_fields:
  - MATNR
  - WERKS
  - LGORT
  applies_when:
    MARC.BESKZ:
    - F
    - X
    MARC.LGFSB:
      populated: true
  severity: low
  dimension: completeness
  message: Default storage location for external procurement is not extended for the material
  why_it_matters: GR and MRP propose this storage location. If MARD does not exist and automatic creation at GR is off,
    the receipt fails.
  rule_authority: best_practice
  sap_impact: The goods receipt errors with "material not maintained in storage location".
  fix_map:
    __other__: Extend the storage location (MMSC / MM01) or correct the default in MRP 2.
  record_fix_template: 'Material {MARC.MATNR} plant {MARC.WERKS}: default sloc {MARC.LGFSB} not extended.'

- id: MM236
  field: MAKT.MAKTX
  check_class: uniqueness_check
  fields:
  - MAKT.MAKTX
  normalize: alnum
  severity: medium
  dimension: uniqueness
  message: Two materials have descriptions that differ only by spaces, punctuation or case (likely duplicate material)
  why_it_matters: BOLT M10X50 and Bolt M10 x 50 are the same part typed twice. Exact-match duplicate checks miss
    them, so stock, consumption history and purchasing volume split across two material numbers.
  rule_authority: best_practice
  sap_impact: Stock is split across duplicates; MRP reorders one while the other has stock; purchasing volume and contract
    coverage are fragmented.
  fix_map:
    __other__: Confirm the duplicate, choose the surviving material, transfer stock (309), move open documents, BOM items
      and info records, then flag the duplicate for deletion (MM06) and set a blocking material status.
  record_fix_template: 'Material {MAKT.MATNR}: description ''{actual_value}'' matches another material once spaces and punctuation
    are ignored.'
- id: MM300
  field: MARC.MINBE
  check_class: cross_field_check
  fail_when: (`MARC.MINBE` > 0) & `MARC.DISMM`.notna() & ~`MARC.DISMM`.isin(['VB', 'VM', 'V1', 'V2'])
  severity: low
  dimension: consistency
  message: Reorder point is maintained but the MRP type is not reorder-point planning
  why_it_matters: The reorder point (MINBE) is only read by reorder-point MRP types (VB, VM, V1, V2 in the standard). On any
    other MRP type it is ignored, so planners believe the material is protected by a reorder level that MRP never uses.
  rule_authority: best_practice
  sap_impact: MRP plans the material by forecast or demand only; the expected reorder-level replenishment never happens.
  fix_map:
    __other__: Either switch the MRP type to reorder-point planning in MM02 > MRP 1, or clear the reorder point if the material
      is planned by demand.
  record_fix_template: 'Material {MARC.MATNR} plant {MARC.WERKS}: reorder point {MARC.MINBE} with MRP type {MARC.DISMM}.'
- id: MM301
  field: MARC.EISBE
  check_class: cross_field_check
  fail_when: (`MARC.EISBE` > 0) & (`MARC.DISMM` == 'ND')
  severity: low
  dimension: consistency
  message: Safety stock is maintained on a material that is excluded from MRP (MRP type ND)
  why_it_matters: MRP type ND means no planning. A safety stock on such a material is never replenished and gives a false
    sense of protection in stock-out analyses.
  rule_authority: best_practice
  sap_impact: Safety stock is never planned; stock-outs occur although the master record shows a buffer.
  fix_map:
    __other__: Set an MRP type that plans the material (MM02 > MRP 1) or remove the safety stock.
  record_fix_template: 'Material {MARC.MATNR} plant {MARC.WERKS}: safety stock {MARC.EISBE} with MRP type ND.'
- id: MM302
  field: MARC.EKGRP
  check_class: null_check
  applies_when:
    MARC.BESKZ:
    - F
    - X
    MARC.DISMM:
      populated: true
      not_in:
      - ND
  severity: medium
  dimension: completeness
  message: Externally procured, MRP-planned material has no purchasing group
  why_it_matters: MRP creates purchase requisitions for externally procured materials. The purchasing group on the plant view
    is copied into each requisition and routes it to the responsible buyer. Without it, requisitions are created without an
    owner.
  rule_authority: best_practice
  sap_impact: Requisitions from MRP land without a purchasing group; they are not picked up by buyer worklists (ME57) and
    release strategies keyed on purchasing group do not apply.
  fix_map:
    __blank__: Maintain the purchasing group in MM02 > Purchasing view for the plant.
  record_fix_template: 'Material {MARC.MATNR} plant {MARC.WERKS}: purchasing group is missing.'
- id: MM303
  field: MARC.LGPRO
  check_class: null_check
  applies_when:
    MARC.BESKZ:
    - E
    MARC.DISMM:
      populated: true
      not_in:
      - ND
  severity: low
  dimension: completeness
  message: In-house produced, MRP-planned material has no production storage location
  why_it_matters: The production storage location is proposed as the goods receipt location on production orders and as the
    issue location for the material when it is a component. Without it, every order needs a manual storage location.
  rule_authority: best_practice
  sap_impact: Goods receipts from production and backflushing fail or need manual entry of the storage location.
  fix_map:
    __blank__: Maintain the production storage location in MM02 > MRP 2 for the plant.
  record_fix_template: 'Material {MARC.MATNR} plant {MARC.WERKS}: production storage location is missing.'
- id: MM304
  field: MVKE.DWERK
  check_class: exists_check
  fields:
  - MVKE.MATNR
  - MVKE.DWERK
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  severity: high
  dimension: consistency
  message: Delivering plant on the sales view is not extended for the material (no plant view)
  why_it_matters: The delivering plant is proposed into sales order items. If the material has no plant view in that plant,
    the item cannot be checked for availability or delivered from it.
  rule_authority: sap_hard_constraint
  sap_impact: Sales orders raise an error or fall back to a manual plant; deliveries cannot be created from the proposed plant.
  fix_map:
    __other__: Extend the material to the delivering plant (MM01 with plant views) or correct the delivering plant in MM02
      > Sales org. 1.
  record_fix_template: 'Material {MVKE.MATNR} sales area {MVKE.VKORG}/{MVKE.VTWEG}: delivering plant {MVKE.DWERK} is not extended.'
- id: MM305
  field: MARC.WERKS
  check_class: exists_check
  fields:
  - MARC.MATNR
  - MARC.WERKS
  target_table: MBEW
  target_fields:
  - MATNR
  - BWKEY
  severity: medium
  dimension: completeness
  message: Plant view exists without an accounting (valuation) view for the plant
  why_it_matters: With valuation at plant level the valuation area equals the plant. A plant view without its MBEW record
    means the material cannot carry valuated stock there, so goods movements and inventory postings cannot be valued. Non-valuated
    material types are expected here and should be reviewed by material type.
  rule_authority: best_practice
  sap_impact: Goods receipts for a valuated material fail with a missing accounting view; costing cannot run for the plant.
  fix_map:
    __other__: Create the accounting view for the plant in MM01 (Accounting 1), or confirm the material type is non-valuated.
  record_fix_template: 'Material {MARC.MATNR} plant {MARC.WERKS}: no accounting view for the plant.'
- id: MM306
  field: MARA.MATNR
  check_class: exists_check
  target_table: MAKT
  target_fields:
  - MATNR
  severity: high
  dimension: completeness
  message: Material has no description in any language
  why_it_matters: The short text is how users find and recognise a material in every search help, purchase order, sales order
    and print form. A material with no MAKT row at all is unusable in practice.
  rule_authority: sap_hard_constraint
  sap_impact: Documents print without an item text; the material cannot be found by description in search helps.
  fix_map:
    __other__: Maintain the material description in MM02 > Basic data 1 (at least in the logon language of the company).
  record_fix_template: 'Material {MARA.MATNR}: no description in any language.'
- id: MM308
  field: MARD.LVORM
  check_class: cross_field_check
  fail_when: (`MARD.LVORM` == 'X') & ((`MARD.LABST` > 0) | (`MARD.INSME` > 0) | (`MARD.SPEME` > 0))
  severity: medium
  dimension: consistency
  message: Storage location view is flagged for deletion but still holds stock
  why_it_matters: A deletion flag at storage location level means the location should no longer be used for the material,
    yet stock still sits there. The flag cannot be archived and the stock is effectively hidden from planners.
  rule_authority: best_practice
  sap_impact: Archiving (MM_MATNR) rejects the record; the stock remains on the balance sheet but is excluded from normal
    use.
  fix_map:
    __other__: Transfer or scrap the remaining stock (MIGO), then keep the deletion flag; or remove the flag in MM06.
  record_fix_template: 'Material {MARD.MATNR} plant {MARD.WERKS} storage location {MARD.LGORT}: flagged for deletion with
    stock.'
- id: MM309
  field: MARA.MATNR
  check_class: uniqueness_check
  fields:
  - MARA.MATNR
  normalize: space
  severity: medium
  dimension: uniqueness
  message: Two material numbers differ only by spaces (likely duplicate material)
  why_it_matters: Externally assigned material numbers are typed by hand, so PUMP 100 and PUMP100 end up as two materials
    for one part. SAP treats them as different keys, so stock, consumption history and purchasing volume split across both.
  rule_authority: best_practice
  sap_impact: Users pick either number in purchasing, goods movements and BOMs; MRP plans each separately and interfaces
    that strip spaces map both to one key.
  fix_map:
    __other__: Confirm the duplicate, choose the surviving material, transfer stock (309), move open documents, BOM items
      and info records, then flag the duplicate for deletion (MM06) and set a blocking material status.
  record_fix_template: 'Material {MARA.MATNR}: matches another material number once spaces are ignored.'

- id: MM310
  field: MLAN.MATNR
  check_class: null_check
  grain: MLAN
  severity: critical
  dimension: completeness
  message: Tax classification has no material number
  why_it_matters: MATNR is the key of MLAN.
  rule_authority: sap_hard_constraint
  sap_impact: The record belongs to no material.
  fix_map:
    __blank__: Delete the orphan record or assign the material.
  record_fix_template: 'Material {MLAN.MATNR}, departure country {MLAN.ALAND}: MATNR is ''{actual_value}''. Correct it in
    MM02 > Sales Org. 1.'
- id: MM311
  field: MLAN.ALAND
  check_class: null_check
  grain: MLAN
  severity: critical
  dimension: completeness
  message: Tax classification has no departure country
  why_it_matters: ALAND is the second key field of MLAN; tax determination reads by departure country.
  rule_authority: sap_hard_constraint
  sap_impact: The tax classification is never found in pricing.
  fix_map:
    __blank__: Maintain the departure country in MM02 > Sales Org. 1.
  record_fix_template: 'Material {MLAN.MATNR}, departure country {MLAN.ALAND}: ALAND is ''{actual_value}''. Correct it in
    MM02 > Sales Org. 1.'
- id: MM312
  field: MLAN.TAXM1
  check_class: null_check
  grain: MLAN
  severity: high
  dimension: completeness
  message: Material tax classification 1 (TAXM1) is blank
  why_it_matters: TAXM1 is the first tax classification SD reads for the tax condition of the departure country.
  rule_authority: sap_hard_constraint
  sap_impact: Sales documents get no output tax and billing is blocked or under-taxed.
  fix_map:
    __blank__: Set the tax classification in MM02 > Sales Org. 1.
  record_fix_template: 'Material {MLAN.MATNR}, departure country {MLAN.ALAND}: TAXM1 is ''{actual_value}''. Correct it in
    MM02 > Sales Org. 1.'
- id: MM313
  field: MLAN.TAXIM
  check_class: null_check
  grain: MLAN
  severity: medium
  dimension: completeness
  message: Tax indicator for material (purchasing, TAXIM) is blank
  why_it_matters: TAXIM is the tax indicator the purchase order proposes for the material; it is checked against TMKM1.
  rule_authority: best_practice
  sap_impact: Purchase orders have no proposed tax code and input tax is determined by hand.
  fix_map:
    __blank__: Set the tax indicator in MM02 > Purchasing.
  record_fix_template: 'Material {MLAN.MATNR}, departure country {MLAN.ALAND}: TAXIM is ''{actual_value}''. Correct it in
    MM02 > Sales Org. 1.'
- id: MM314
  field: MLAN.ALAND
  check_class: referential_check
  grain: MLAN
  severity: high
  dimension: consistency
  message: Departure country is not a defined country
  why_it_matters: ALAND is checked against T005.
  rule_authority: sap_hard_constraint
  sap_impact: Tax determination for the country cannot be resolved.
  fix_map:
    __other__: Use a valid country key in MM02 > Sales Org. 1.
  record_fix_template: 'Material {MLAN.MATNR}, departure country {MLAN.ALAND}: ALAND is ''{actual_value}''. Correct it in
    MM02 > Sales Org. 1.'
- id: MM315
  field: MLAN.MATNR
  check_class: referential_check
  grain: MLAN
  severity: high
  dimension: consistency
  message: Tax classification points to a material that does not exist
  why_it_matters: MATNR is checked against MARA.
  rule_authority: sap_hard_constraint
  sap_impact: Orphan tax data stays in the system and confuses tax reports.
  fix_map:
    __other__: Delete the orphan record or recreate the material.
  record_fix_template: 'Material {MLAN.MATNR}, departure country {MLAN.ALAND}: MATNR is ''{actual_value}''. Correct it in
    MM02 > Sales Org. 1.'
- id: MM316
  field: MLAN.MATNR
  check_class: uniqueness_check
  grain: MLAN
  fields:
  - MLAN.MATNR
  - MLAN.ALAND
  severity: high
  dimension: uniqueness
  message: Material has two tax classification rows for one departure country
  why_it_matters: MATNR and ALAND form the key of MLAN.
  rule_authority: sap_hard_constraint
  sap_impact: Tax determination reads either row.
  fix_map:
    __other__: Remove the duplicate in MM02.
  record_fix_template: 'Material {MLAN.MATNR}, departure country {MLAN.ALAND}: Material has two tax classification rows for
    one departure country. Correct it in MM02 > Sales Org. 1.'

- id: MM317
  field: MARA.ATTYP
  check_class: domain_value_check
  severity: high
  dimension: validity
  message: Material Category (MARA.ATTYP) is not a value of its SAP domain
  why_it_matters: Material Category accepts only the fixed values of domain ATTYP. The value drives whether the material is
    handled as a single, generic, variant, sales set, prepack or display material; the SAP screens never accept a value outside
    the domain, so it comes from a direct table load or a migration.
  rule_authority: best_practice
  sap_impact: Variants, sales sets and prepacks behave like single materials, or their creation and sales processing fail.
  fix_map:
    __other__: Correct the value in MM02 Basic data 1 (material category is set at creation; use the variant or retail creation
      transactions); the allowed values are those of domain ATTYP.
  record_fix_template: 'Material {MARA.MATNR}: ATTYP is ''{actual_value}'', which is not a value of domain ATTYP.'
  auto_fix:
    steps:
    - op: strip
    - op: pad_left
      width: 2
      char: '0'
    confidence: medium
- id: MM318
  field: MARA.VABME
  check_class: domain_value_check
  severity: low
  dimension: validity
  message: Variable Purchase Order Unit Active (MARA.VABME) is not a value of its SAP domain
  why_it_matters: Variable Purchase Order Unit Active accepts only the fixed values of domain VABME. The value drives whether
    the purchase order unit may vary per supplier and whether the supplier price is kept per unit; the SAP screens never accept
    a value outside the domain, so it comes from a direct table load or a migration.
  rule_authority: best_practice
  sap_impact: Purchasing reads the wrong unit handling; price and quantity in the purchase order do not match the info record.
  fix_map:
    __other__: Correct the value in MM02 Purchasing; the allowed values are those of domain VABME.
  record_fix_template: 'Material {MARA.MATNR}: VABME is ''{actual_value}'', which is not a value of domain VABME.'
- id: MM319
  field: MARA.BRGEW
  check_class: cross_field_check
  fail_when: (`MARA.BRGEW` < 0) | (`MARA.NTGEW` < 0) | (`MARA.VOLUM` < 0) | (`MARA.LAENG` < 0) | (`MARA.BREIT` < 0) | (`MARA.HOEHE`
    < 0)
  severity: medium
  dimension: accuracy
  message: Weight, volume or dimension of the material is negative
  why_it_matters: Weights, volumes and dimensions are physical quantities and are never negative. Negative values come from
    sign errors in loads and spreadsheets.
  rule_authority: best_practice
  sap_impact: Freight cost, load planning, shipping documents and transport capacity checks compute with the negative value.
  fix_map:
    __other__: Correct the weight, volume or dimension in MM02 Basic data 1.
  record_fix_template: 'Material {MARA.MATNR}: gross weight {MARA.BRGEW}, net weight {MARA.NTGEW}, volume {MARA.VOLUM}, length
    {MARA.LAENG}, width {MARA.BREIT}, height {MARA.HOEHE} contain a negative value.'
- id: MM320
  field: MARA.SATNR
  check_class: null_check
  applies_when:
    MARA.ATTYP:
    - '02'
  severity: high
  dimension: completeness
  message: Variant has no generic (configurable) material
  why_it_matters: A material of category variant (ATTYP 02) is created from a generic material and keeps the link in SATNR.
    Without it the variant is cut off from the generic material that holds its characteristics.
  rule_authority: sap_hard_constraint
  sap_impact: Variant characteristics cannot be maintained or evaluated from the generic material; variant-specific sales
    and purchasing processes fail.
  fix_map:
    __blank__: Enter the generic material in MM02 or recreate the variant from the generic material.
  record_fix_template: 'Material {MARA.MATNR}: variant has no generic material in SATNR.'
- id: MM321
  field: MARA.SATNR
  check_class: cross_field_check
  fail_when: '`MARA.SATNR` == `MARA.MATNR`'
  require_populated: true
  severity: high
  dimension: consistency
  message: Material is its own generic material
  why_it_matters: SATNR points at the generic material a variant was created from. A material cannot be the generic material
    of itself.
  rule_authority: sap_hard_constraint
  sap_impact: Variant explosion and characteristic inheritance loop or stop.
  fix_map:
    __other__: Enter the correct generic material in MM02 or clear the field.
  record_fix_template: 'Material {MARA.MATNR}: SATNR ''{actual_value}'' equals the material itself.'
- id: MM322
  field: MARA.SATNR
  check_class: exists_check
  target_table: MARA
  target_fields:
  - MATNR
  target_when:
    ATTYP:
    - '01'
  severity: high
  dimension: consistency
  message: Generic material of a variant does not exist or is not a generic material
  why_it_matters: SATNR must point at an existing material of category generic (ATTYP 01). A reference to a deleted or ordinary
    material leaves the variant without its configuration source.
  rule_authority: sap_hard_constraint
  sap_impact: Variant creation, configuration and pricing of variants fail because the generic material cannot be found.
  fix_map:
    __other__: Correct SATNR in MM02 to an existing generic material.
  record_fix_template: 'Material {MARA.MATNR}: generic material ''{actual_value}'' does not exist as a generic material (category
    01).'
- id: MM323
  field: MARA.BMATN
  check_class: exists_check
  target_table: MARA
  target_fields:
  - MATNR
  severity: medium
  dimension: consistency
  message: Internal inventory-managed material (BMATN) does not exist
  why_it_matters: BMATN is used by materials that stand for an externally procured form of another inventory-managed material
    (for example a manufacturer part number). The inventory-managed material it names must exist in MARA.
  rule_authority: sap_hard_constraint
  sap_impact: Stock and requirements of the referenced material cannot be traced; part-number procurement fails.
  fix_map:
    __other__: Correct BMATN in MM02 Basic data 2 or create the referenced material.
  record_fix_template: 'Material {MARA.MATNR}: inventory-managed material ''{actual_value}'' does not exist in MARA.'
- id: MM324
  field: MARA.IPRKZ
  check_class: cross_field_check
  applies_when:
    MARA.IPRKZ:
      populated: true
  fail_when: '`MARA.MHDHB`.isna() | (`MARA.MHDHB` <= 0)'
  severity: medium
  dimension: consistency
  message: Shelf life period indicator is set but the material has no total shelf life
  why_it_matters: The period indicator (week, month, year) gives the unit of the total shelf life (MHDHB). With no shelf life
    the indicator has nothing to interpret.
  rule_authority: best_practice
  sap_impact: Batch master creation cannot derive an expiry date; goods receipt of the batch may stop or default to the wrong
    date.
  fix_map:
    __other__: Enter the total shelf life in MM02 Plant data / storage 1, or clear the period indicator.
  record_fix_template: 'Material {MARA.MATNR}: period indicator {actual_value} but total shelf life {MARA.MHDHB}.'
- id: MM325
  field: MARA.SLED_BBD
  check_class: cross_field_check
  applies_when:
    MARA.SLED_BBD:
      populated: true
  fail_when: '`MARA.MHDHB`.isna() | (`MARA.MHDHB` <= 0)'
  severity: medium
  dimension: consistency
  message: Expiration date type is set but the material has no total shelf life
  why_it_matters: SLED_BBD chooses whether the batch shows a best-before date or a shelf life expiration date. Both are calculated
    from the total shelf life, which is therefore required.
  rule_authority: best_practice
  sap_impact: Batch screens ask for an expiry date that cannot be calculated; expiry-based picking and FEFO logic lose their
    input.
  fix_map:
    __other__: Enter the total shelf life in MM02 or clear the expiration date type.
  record_fix_template: 'Material {MARA.MATNR}: expiration date type {actual_value} but total shelf life {MARA.MHDHB}.'
- id: MM326
  field: MARA.IPRKZ
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: Period Indicator for Shelf Life Expiration Date (MARA.IPRKZ) is not a value of its SAP domain
  why_it_matters: Period Indicator for Shelf Life Expiration Date accepts only the fixed values of domain DATTP. The value
    drives the unit in which the total shelf life is read (day, week, month, year); the SAP screens never accept a value outside
    the domain, so it comes from a direct table load or a migration.
  rule_authority: best_practice
  sap_impact: Expiry dates are calculated in the wrong unit, or goods receipt of the batch stops with an error.
  fix_map:
    __other__: Correct the value in MM02 Plant data / storage 1; the allowed values are those of domain DATTP.
  record_fix_template: 'Material {MARA.MATNR}: IPRKZ is ''{actual_value}'', which is not a value of domain DATTP.'
- id: MM327
  field: MARA.RDMHD
  check_class: domain_value_check
  severity: low
  dimension: validity
  message: Rounding rule for calculation of SLED (MARA.RDMHD) is not a value of its SAP domain
  why_it_matters: Rounding rule for calculation of SLED accepts only the fixed values of domain RDMHD. The value drives how
    the calculated expiry date is rounded (none, start or end of the period); the SAP screens never accept a value outside
    the domain, so it comes from a direct table load or a migration.
  rule_authority: best_practice
  sap_impact: Expiry dates are rounded in an unintended way and batches expire earlier or later than planned.
  fix_map:
    __other__: Correct the value in MM02 Plant data / storage 1; the allowed values are those of domain RDMHD.
  record_fix_template: 'Material {MARA.MATNR}: RDMHD is ''{actual_value}'', which is not a value of domain RDMHD.'
- id: MM328
  field: MARA.SLED_BBD
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: Expiration Date (MARA.SLED_BBD) is not a value of its SAP domain
  why_it_matters: Expiration Date accepts only the fixed values of domain SLED_BBD. The value drives whether batches carry
    a best-before date or a shelf life expiration date; the SAP screens never accept a value outside the domain, so it comes
    from a direct table load or a migration.
  rule_authority: best_practice
  sap_impact: Batch master records show the wrong kind of date; downstream expiry reports mix both.
  fix_map:
    __other__: Correct the value in MM02 Plant data / storage 1; the allowed values are those of domain SLED_BBD.
  record_fix_template: 'Material {MARA.MATNR}: SLED_BBD is ''{actual_value}'', which is not a value of domain SLED_BBD.'
  auto_fix:
    steps:
    - op: strip
    - op: upper
    confidence: high
- id: MM329
  field: MARA.MSTDE
  check_class: cross_field_check
  fail_when: '`MARA.MSTDE`.notna() & `MARA.MSTAE`.isna()'
  severity: low
  dimension: consistency
  message: Cross-plant status valid-from date is set without a cross-plant status
  why_it_matters: MSTDE is the date from which the status in MSTAE applies. A date with no status is a remnant of a status
    that was removed.
  rule_authority: best_practice
  sap_impact: The date misleads status audits and change reports; nobody can tell which status it belongs to.
  fix_map:
    __other__: Clear the date in MM02 Basic data 1 or enter the status it belongs to.
  record_fix_template: 'Material {MARA.MATNR}: status valid-from date {actual_value} but no cross-plant material status.'
- id: MM330
  field: MARA.MATNR
  check_class: exists_check
  applies_when:
    MARA.VPSTA:
      contains_any:
      - V
  target_table: MVKE
  target_fields:
  - MATNR
  severity: medium
  dimension: completeness
  message: Material with maintenance status for sales has no sales organisation data
  why_it_matters: The maintenance status of the material (VPSTA) says that sales data is maintained. A material with that
    status needs at least one sales organisation / distribution channel row (MVKE).
  rule_authority: best_practice
  sap_impact: The status says the material is ready to sell while no sales order can use it.
  fix_map:
    __other__: Create the sales view in MM01/MM02 or correct the maintenance status.
  record_fix_template: 'Material {MARA.MATNR}: maintenance status {MARA.VPSTA} contains sales (V) but no sales organisation
    data exists.'
- id: MM331
  field: MARA.MATNR
  check_class: exists_check
  applies_when:
    MARA.VPSTA:
      contains_any:
      - B
  target_table: MBEW
  target_fields:
  - MATNR
  severity: medium
  dimension: completeness
  message: Material with maintenance status for accounting has no valuation data
  why_it_matters: The maintenance status of the material (VPSTA) says that accounting data is maintained. At least one valuation
    row (MBEW) must exist.
  rule_authority: best_practice
  sap_impact: The material cannot be used in goods movements or invoices although its status says it is complete.
  fix_map:
    __other__: Create the accounting view in MM01/MM02 or correct the maintenance status.
  record_fix_template: 'Material {MARA.MATNR}: maintenance status {MARA.VPSTA} contains accounting (B) but no valuation data
    exists.'
- id: MM332
  field: MARA.MATNR
  check_class: exists_check
  applies_when:
    MARA.VPSTA:
      contains_any:
      - S
  target_table: MLGN
  target_fields:
  - MATNR
  severity: medium
  dimension: completeness
  message: Material with maintenance status for warehouse management has no warehouse data
  why_it_matters: The maintenance status of the material (VPSTA) says that warehouse management data is maintained. A row
    per warehouse (MLGN) must exist.
  rule_authority: best_practice
  sap_impact: Putaway and picking cannot be planned for a material the status shows as ready.
  fix_map:
    __other__: Create the warehouse management view in MM01/MM02 or correct the maintenance status.
  record_fix_template: 'Material {MARA.MATNR}: maintenance status {MARA.VPSTA} contains warehouse management (S) but no warehouse
    data exists.'
- id: MM333
  field: MARC.MATNR
  check_class: exists_check
  applies_when:
    MARC.PSTAT:
      contains_any:
      - L
  fields:
  - MARC.MATNR
  - MARC.WERKS
  target_table: MARD
  target_fields:
  - MATNR
  - WERKS
  severity: medium
  dimension: completeness
  message: Plant has the storage view in its status but no storage location data
  why_it_matters: The plant maintenance status (PSTAT) says that storage data is maintained. At least one storage location
    row (MARD) must exist for the plant.
  rule_authority: best_practice
  sap_impact: Goods movements cannot be posted for the material in the plant, although its status shows complete.
  fix_map:
    __other__: Extend the material to a storage location in MM01/MM02 or correct the status.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: plant status {MARC.PSTAT} contains storage (L) but no storage
    location exists.'
- id: MM334
  field: MARA.BISMT
  check_class: uniqueness_check
  fields:
  - MARA.BISMT
  severity: medium
  dimension: uniqueness
  message: Two materials carry the same old material number
  why_it_matters: BISMT holds the number the material had in the legacy system and is the key for migration cross-references
    and goods receipt scanning. Two materials with one old number make the lookup ambiguous.
  rule_authority: best_practice
  sap_impact: Legacy-number lookups, EDI mapping and scanning return the wrong material.
  fix_map:
    __other__: Decide which material keeps the old number and clear it on the other (MM02 Basic data 1) or merge the materials.
  record_fix_template: 'Material {MARA.MATNR}: old material number {actual_value} is used by more than one material.'
- id: MM335
  field: MARA.MFRPN
  check_class: similarity_check
  block_by:
  - MARA.MFRNR
  threshold: 0.9
  exact_rule: true
  severity: medium
  dimension: uniqueness
  message: Two materials of the same manufacturer have almost the same manufacturer part number
  why_it_matters: A typing error in the part number (a trailing space, a swapped character) hides a duplicate material from
    the exact comparison MM168. Duplicates split stock and purchase history.
  rule_authority: best_practice
  sap_impact: Stock, contracts and purchase history split over two materials; the same part is bought twice.
  fix_map:
    __other__: Compare the two materials. If they are the same part, keep one and flag the other for deletion (MM06) after
      moving the open documents.
  record_fix_template: 'Material {MARA.MATNR}: manufacturer part number {actual_value} is close to another material of the
    same manufacturer.'
- id: MM336
  field: MEAN.EAN11
  check_class: uniqueness_check
  grain: MEAN
  fields:
  - MEAN.EAN11
  normalize: alnum
  severity: high
  dimension: uniqueness
  message: The same GTIN/EAN is assigned to more than one material or unit of measure in the EAN table
  why_it_matters: A GTIN identifies one article in one unit of measure worldwide. MEAN holds the additional GTINs that MARM
    cannot carry; a repeated value makes the scan lookup return an arbitrary material.
  rule_authority: sap_hard_constraint
  sap_impact: Scanning, EDI and POS processes pick the wrong material; goods receipt posts to the wrong stock.
  fix_map:
    __other__: Remove the GTIN from the wrong record (MM02 > Additional data > Units of measure > International Article Numbers).
  record_fix_template: 'Material {MEAN.MATNR}, unit {MEAN.MEINH}: GTIN {actual_value} is assigned more than once.'
- id: MM337
  field: MEAN.EAN11
  check_class: format_check
  grain: MEAN
  format: gtin
  severity: medium
  dimension: validity
  message: Additional GTIN/EAN has an invalid check digit
  why_it_matters: A GTIN carries a modulo-10 check digit. An invalid digit means the number was mistyped or is not a real
    GTIN; scanners and EDI partners reject it.
  rule_authority: best_practice
  sap_impact: Scan and EDI validations reject the article number; goods receipt by scan fails.
  fix_map:
    __other__: Correct the number against the packaging or the GS1 registration.
  record_fix_template: 'Material {MEAN.MATNR}, unit {MEAN.MEINH}: GTIN {actual_value} has an invalid check digit.'
  auto_fix:
    steps:
    - op: strip
    - op: gtin_check_digit
    confidence: low
- id: MM338
  field: MEAN.EANTP
  check_class: null_check
  grain: MEAN
  applies_when:
    MEAN.EAN11:
      populated: true
  severity: low
  dimension: completeness
  message: Additional GTIN has no EAN category
  why_it_matters: The EAN category (EANTP) tells the system which numbering scheme (EAN-13, UPC, ITF-14) the number follows,
    and which check digit rule applies.
  rule_authority: best_practice
  sap_impact: Check digit validation and label printing cannot choose the right format.
  fix_map:
    __blank__: Enter the EAN category in MM02 > Additional data > Units of measure > International Article Numbers.
  record_fix_template: 'Material {MEAN.MATNR}, unit {MEAN.MEINH}: EANTP is ''{actual_value}''. Enter the EAN category in MM02
    > Additional data > Units of measure > International Article Numbers.'
- id: MM339
  field: MEAN.EANTP
  check_class: referential_check
  grain: MEAN
  severity: medium
  dimension: validity
  message: Category of International Article Number (EAN) (MEAN.EANTP) is not defined in the system's configuration (TNTP)
  why_it_matters: Category of International Article Number (EAN) is a key into customizing table TNTP. It decides which numbering
    scheme the GTIN follows. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Check digit validation and label printing fail for the number.
  fix_map:
    __other__: '''{invalid_value}'' is not in TNTP. Correct the value in MM02 or create the entry in table TNTP (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MEAN.MATNR}, unit {MEAN.MEINH}: EANTP ''{actual_value}'' is not configured in TNTP.'
  auto_fix:
    steps:
    - op: strip
    - op: upper
    confidence: medium
- id: MM340
  field: MAKT.SPRAS
  check_class: referential_check
  grain: MAKT
  severity: high
  dimension: validity
  message: Language Key (MAKT.SPRAS) is not defined in the system's configuration (T002)
  why_it_matters: Language Key is a key into customizing table T002. Every description is stored per language key. A value
    that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: The description is never shown to users who log on in that language.
  fix_map:
    __other__: '''{invalid_value}'' is not in T002. Correct the value in MM02 or create the entry in table T002 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MAKT.MATNR}, language {MAKT.SPRAS}: SPRAS ''{actual_value}'' is not configured in T002.'
- id: MM341
  field: MAKT.MAKTG
  check_class: cross_field_check
  grain: MAKT
  fail_when: '`MAKT.MAKTX`.notna() & `MAKT.MAKTG`.isna()'
  severity: medium
  dimension: completeness
  message: Search description (upper case) is missing though the description exists
  why_it_matters: MAKTG is the upper-case copy of the description that SAP fills when a description is saved. It feeds the
    matchcode and search help. A direct load can leave it blank.
  rule_authority: best_practice
  sap_impact: The material cannot be found by description in search helps (F4) and in MM60 selections.
  fix_map:
    __other__: Re-save the description in MM02 (Additional data > Descriptions) so that SAP regenerates the search term.
  record_fix_template: 'Material {MAKT.MATNR}, language {MAKT.SPRAS}: description ''{MAKT.MAKTX}'' has no search description.'
  auto_fix:
    steps:
    - op: copy
      from: MAKT.MAKTX
    - op: upper
    confidence: high
- id: MM342
  field: MAKT.MAKTG
  check_class: cross_field_check
  grain: MAKT
  fail_when: '`MAKT.MAKTX`.notna() & `MAKT.MAKTG`.notna() & (`MAKT.MAKTX`.str.upper().str.replace(''[^0-9A-Z]'', '''', regex=True)
    != `MAKT.MAKTG`.str.upper().str.replace(''[^0-9A-Z]'', '''', regex=True))'
  severity: low
  dimension: consistency
  message: Search description differs from the upper-case description
  why_it_matters: MAKTG must be the upper-case form of MAKTX. When the two differ, search help finds the material under a
    text the user does not see.
  rule_authority: best_practice
  sap_impact: The material is found under the wrong text, or not found at all, in description searches.
  fix_map:
    __other__: Re-save the description in MM02 (Additional data > Descriptions).
  record_fix_template: 'Material {MAKT.MATNR}, language {MAKT.SPRAS}: search description ''{actual_value}'' does not match
    description ''{MAKT.MAKTX}''.'
  auto_fix:
    steps:
    - op: copy
      from: MAKT.MAKTX
    - op: upper
    confidence: high
- id: MM343
  field: MAKT.MAKTX
  check_class: cross_field_check
  grain: MAKT
  fail_when: '`MAKT.MAKTX`.fillna('''').str.contains(''[^ ]  [^ ]'', regex=True)'
  severity: low
  dimension: validity
  message: Material description contains double spaces
  why_it_matters: Double spaces are invisible on screen but make equal descriptions compare unequal, break duplicate detection
    and print badly on labels and documents.
  rule_authority: best_practice
  sap_impact: Duplicate checks, search and printed documents behave differently for descriptions that look identical.
  fix_map:
    __other__: Remove the extra spaces in MM02 (Additional data > Descriptions).
  record_fix_template: 'Material {MAKT.MATNR}, language {MAKT.SPRAS}: description ''{actual_value}'' contains extra spaces.'
  auto_fix:
    steps:
    - op: collapse_spaces
    confidence: high
- id: MM344
  field: MAKT.MAKTX
  check_class: cross_field_check
  grain: MAKT
  fail_when: '`MAKT.MAKTX`.notna() & (`MAKT.MAKTX`.fillna('''').str.strip().str.upper() == `MAKT.MATNR`.fillna('''').str.strip().str.upper())'
  severity: low
  dimension: accuracy
  message: Material description only repeats the material number
  why_it_matters: A description that equals the material number tells the user nothing and usually marks a record created
    in a hurry.
  rule_authority: best_practice
  sap_impact: Buyers, planners and warehouse staff cannot identify the material; searches by description find nothing useful.
  fix_map:
    __other__: Replace the description with the real name of the material in MM02 (Additional data > Descriptions).
  record_fix_template: 'Material {MAKT.MATNR}, language {MAKT.SPRAS}: description ''{actual_value}'' equals the material number.'
- id: MM345
  field: MARM.UMREZ
  check_class: cross_field_check
  fail_when: (`MARM.UMREZ` > 0) & (`MARM.UMREN` > 0) & ((`MARM.UMREZ` / `MARM.UMREN` > 1000000) | (`MARM.UMREZ` / `MARM.UMREN`
    < 0.000001))
  severity: low
  dimension: accuracy
  message: Unit conversion factor is implausibly large or small
  why_it_matters: The conversion between an alternative unit and the base unit is the ratio of numerator to denominator. A
    ratio above one million or below one millionth almost always comes from a swapped numerator and denominator or a wrong
    unit.
  rule_authority: best_practice
  sap_impact: Quantities in purchase orders, deliveries and stock are converted by orders of magnitude wrong.
  fix_map:
    __other__: Check the conversion in MM02 > Additional data > Units of measure and correct numerator and denominator.
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: conversion {MARM.UMREZ} : {MARM.UMREN} is implausible.'
- id: MM346
  field: KLAH.KLART
  check_class: referential_check
  grain: KLAH
  severity: high
  dimension: validity
  message: Class Type (KLAH.KLART) is not defined in the system's configuration (TCLA)
  why_it_matters: Class Type is a key into customizing table TCLA. Every class belongs to one class type that controls what
    it may classify. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: The class cannot be used; objects cannot be assigned to it.
  fix_map:
    __other__: '''{invalid_value}'' is not in TCLA. Correct the value in MM02 or create the entry in table TCLA (SM30 or the
      matching IMG node).'
  record_fix_template: 'Class {KLAH.CLASS}, class type {KLAH.KLART}: KLART ''{actual_value}'' is not configured in TCLA.'
- id: MM347
  field: KLAH.STATU
  check_class: referential_check
  grain: KLAH
  severity: medium
  dimension: validity
  message: Class status (KLAH.STATU) is not defined in the system's configuration (TCLU)
  why_it_matters: Class status is a key into customizing table TCLU. The status decides whether objects may still be assigned
    to the class. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: The class status cannot be interpreted; assignments are blocked or allowed by accident.
  fix_map:
    __other__: '''{invalid_value}'' is not in TCLU. Correct the value in MM02 or create the entry in table TCLU (SM30 or the
      matching IMG node).'
  record_fix_template: 'Class {KLAH.CLASS}, class type {KLAH.KLART}: STATU ''{actual_value}'' is not configured in TCLU.'
- id: MM348
  field: KLAH.STATU
  check_class: null_check
  grain: KLAH
  severity: medium
  dimension: completeness
  message: Class has no status
  why_it_matters: The class status (released, locked, in preparation) controls whether objects can be assigned to the class
    and whether it can be used in searches.
  rule_authority: best_practice
  sap_impact: A class without a status behaves unpredictably in classification searches and assignment.
  fix_map:
    __blank__: Set the status in CL02.
  record_fix_template: 'Class {KLAH.CLASS}, class type {KLAH.KLART}: class status is blank.'
- id: MM349
  field: KLAH.BISDT
  check_class: cross_field_check
  grain: KLAH
  fail_when: '`KLAH.BISDT` < `KLAH.VONDT`'
  severity: medium
  dimension: consistency
  message: Class valid-to date is before its valid-from date
  why_it_matters: A class is valid between VONDT and BISDT. An end date before the start date means the class is never valid.
  rule_authority: sap_hard_constraint
  sap_impact: The class is excluded from every date-dependent search and assignment.
  fix_map:
    __other__: Correct the validity dates in CL02.
  record_fix_template: 'Class {KLAH.CLASS}, class type {KLAH.KLART}: valid-from {KLAH.VONDT}, valid-to {KLAH.BISDT}.'
- id: MM350
  field: KSSK.CLINT
  check_class: exists_check
  grain: KSSK
  target_table: KLAH
  target_fields:
  - CLINT
  severity: high
  dimension: consistency
  message: Classification assignment points to a class that does not exist
  why_it_matters: KSSK links an object to a class by the internal class number. If the class header (KLAH) is gone, the link
    is an orphan.
  rule_authority: sap_hard_constraint
  sap_impact: Characteristic searches and class-based reports return incomplete results; the orphan row cannot be maintained
    in CL20N.
  fix_map:
    __other__: Delete the orphan assignment or recreate the class.
  record_fix_template: 'Class assignment of object {KSSK.OBJEK}, class type {KSSK.KLART}: internal class number ''{actual_value}''
    does not exist in KLAH.'
- id: MM351
  field: AUSP.KLART
  check_class: referential_check
  grain: AUSP
  severity: high
  dimension: validity
  message: Class Type (AUSP.KLART) is not defined in the system's configuration (TCLA)
  why_it_matters: Class Type is a key into customizing table TCLA. Every characteristic value is stored under the class type
    of its assignment. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: The characteristic value cannot be read back in classification.
  fix_map:
    __other__: '''{invalid_value}'' is not in TCLA. Correct the value in MM02 or create the entry in table TCLA (SM30 or the
      matching IMG node).'
  record_fix_template: 'Object {AUSP.OBJEK}, characteristic {AUSP.ATINN}: KLART ''{actual_value}'' is not configured in TCLA.'
- id: MM352
  field: AUSP.ATINN
  check_class: exists_check
  grain: AUSP
  target_table: CABN
  target_fields:
  - ATINN
  severity: high
  dimension: consistency
  message: Characteristic value belongs to a characteristic that does not exist
  why_it_matters: AUSP stores the value of a characteristic per classified object. If the characteristic master (CABN) is
    gone, the value is an orphan.
  rule_authority: sap_hard_constraint
  sap_impact: The value shows up as a blank characteristic in CL20N and distorts class searches.
  fix_map:
    __other__: Delete the orphan value or recreate the characteristic.
  record_fix_template: 'Object {AUSP.OBJEK}, characteristic {AUSP.ATINN}: characteristic ''{actual_value}'' does not exist
    in CABN.'
- id: MM353
  field: CABN.ATFOR
  check_class: domain_value_check
  grain: CABN
  severity: high
  dimension: validity
  message: Data type of characteristic (CABN.ATFOR) is not a value of its SAP domain
  why_it_matters: The data type decides how the characteristic values are stored and compared. Only the fixed values of domain
    ATFOR (character, numeric, currency, date, time, user-defined) are valid.
  rule_authority: sap_hard_constraint
  sap_impact: Values of the characteristic cannot be stored or compared; classification searches fail.
  fix_map:
    __other__: Correct the data type in CT04 (only possible while no values exist).
  record_fix_template: 'Characteristic {CABN.ATNAM}: ATFOR is ''{actual_value}'', which is not a value of domain ATFOR.'
  auto_fix:
    steps:
    - op: strip
    - op: upper
    confidence: high
- id: MM354
  field: CABN.ANZST
  check_class: cross_field_check
  grain: CABN
  applies_when:
    CABN.ATFOR:
    - CHAR
    - NUM
    - CURR
  fail_when: '`CABN.ANZST`.isna() | (`CABN.ANZST` <= 0)'
  severity: medium
  dimension: validity
  message: Characteristic has no field length
  why_it_matters: Character, numeric and currency characteristics need a length greater than zero; SAP shows and stores values
    in that width.
  rule_authority: best_practice
  sap_impact: Values cannot be entered or displayed in the characteristic.
  fix_map:
    __other__: Set the number of characters in CT04.
  record_fix_template: 'Characteristic {CABN.ATNAM}: ATFOR {CABN.ATFOR}, length {actual_value}.'
- id: MM355
  field: CABN.ANZDZ
  check_class: cross_field_check
  grain: CABN
  applies_when:
    CABN.ATFOR:
    - NUM
    - CURR
  fail_when: '`CABN.ANZDZ` > `CABN.ANZST`'
  severity: medium
  dimension: consistency
  message: Characteristic has more decimal places than characters
  why_it_matters: The number of decimal places is part of the field length; it cannot exceed the number of characters.
  rule_authority: best_practice
  sap_impact: Numeric values of the characteristic are truncated or cannot be saved.
  fix_map:
    __other__: Correct length and decimal places in CT04.
  record_fix_template: 'Characteristic {CABN.ATNAM}: length {CABN.ANZST}, decimal places {actual_value}.'
- id: MM356
  field: MVKE.VERSG
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Material statistics group (MVKE.VERSG) is not defined in the system's configuration (TVSM)
  why_it_matters: Material statistics group is a key into customizing table TVSM. It assigns the material to the statistics
    group used in sales information. A value that is not configured there cannot be interpreted by the functions that read
    it.
  rule_authority: sap_hard_constraint
  sap_impact: Sales statistics (LIS) are updated under the wrong group or not at all.
