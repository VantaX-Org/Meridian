  record_fix_template: 'Material {MARM.MATNR}: alternative unit of measure ''{actual_value}'' is not configured (T006).'
- id: MM211
  field: MARD.LGORT
  check_class: referential_check
  severity: high
  dimension: validity
  message: Storage location (MARD.LGORT) is not defined in the system's configuration (T001L)
  why_it_matters: Storage location is a key into the system's own configuration (T001L). A value that is not configured
    there cannot be interpreted by the functions that read it; SAP's own screens never accept it, so it comes from direct
    loads, client copies or configuration deleted after the fact.
  rule_authority: sap_hard_constraint
  sap_impact: Stock is held in a storage location that is not defined for the plant; goods movements to it fail.
  fix_map:
    __other__: '''{invalid_value}'' is not in T001L. Correct the value via MM02 (ECC) or Fiori F1602 Manage Product Master
      Data (S/4HANA) or, if the value is genuinely needed, create it in customizing (OX09).'
  record_fix_template: 'Material {MARD.MATNR}, plant {MARD.WERKS}: storage location ''{actual_value}'' is not configured
    (T001L).'
- id: MM212
  field: MARC.WERKS
  check_class: referential_check
  severity: high
  dimension: validity
  message: Plant (MARC.WERKS) is not defined in the system's configuration (T001W)
  why_it_matters: The plant view of a material is keyed by the plant. A plant that is not defined in T001W has no company
    code, valuation area or factory calendar, so nothing posted against this plant view can be processed.
  rule_authority: sap_hard_constraint
  sap_impact: MRP, goods movements and purchasing for the material in this plant fail; the plant view is dead data that
    blocks archiving of the material.
  fix_map:
    __other__: '''{invalid_value}'' is not in T001W. Remove the plant view (flag for deletion via MM06 and archive) or create
      the plant in customizing (OX10) if it is genuinely needed.'
  record_fix_template: 'Material {MARC.MATNR}: plant ''{actual_value}'' is not configured (T001W).'
- id: MM213
  field: MBEW.BWKEY
  check_class: referential_check
  severity: critical
  dimension: validity
  message: Valuation area (MBEW.BWKEY) is not defined in the system's configuration (T001K)
  why_it_matters: The valuation record is keyed by the valuation area, which links stock value to a company code and its
    G/L accounts. A valuation area missing from T001K leaves the stock value with no company code to post to.
  rule_authority: sap_hard_constraint
  sap_impact: Goods movements and price changes cannot post to FI; the stock value is missing from the balance sheet.
  fix_map:
    __other__: '''{invalid_value}'' is not in T001K. Correct the valuation data or create the valuation area in customizing
      (OX14) and assign it to its company code (OX18).'
  record_fix_template: 'Material {MBEW.MATNR}: valuation area ''{actual_value}'' is not configured (T001K).'
- id: MM214
  field: MVKE.VKORG
  check_class: referential_check
  severity: high
  dimension: validity
  message: Sales organisation (MVKE.VKORG) is not defined in the system's configuration (TVKO)
  why_it_matters: The sales view of a material is keyed by sales organisation. A sales organisation that is not defined
    in TVKO has no company code assignment, so the sales view can never be used in an order.
  rule_authority: sap_hard_constraint
  sap_impact: Sales orders for the material in this sales organisation fail; the sales view is dead data.
  fix_map:
    __other__: '''{invalid_value}'' is not in TVKO. Remove the sales view or create the sales organisation in customizing
      (OVX5).'
  record_fix_template: 'Material {MVKE.MATNR}: sales organisation ''{actual_value}'' is not configured (TVKO).'
  auto_fix:
    steps:
    - op: strip
    - op: upper
    confidence: high
- id: MM215
  field: MVKE.VTWEG
  check_class: referential_check
  severity: high
