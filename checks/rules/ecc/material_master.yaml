    - F
  fail_when: '`MARC.SAUFT` == ''X'''
  severity: medium
  dimension: consistency
  message: Repetitive manufacturing is allowed on an externally procured material
  why_it_matters: Repetitive manufacturing (SAUFT) plans run schedules for materials made in-house. On procurement type F
