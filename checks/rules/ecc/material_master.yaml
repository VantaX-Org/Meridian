      blank: true
  negate: true
  fields:
  - MARC.MATNR
  - MARC.WERKS
  target_table: EQUK
  target_fields:
  - MATNR
  - WERKS
  severity: medium
  dimension: consistency
  message: Quota arrangement exists but quota usage is not set
  why_it_matters: A quota arrangement (EQUK) splits requirements between sources only when the quota usage (USEQU) is set.
  rule_authority: best_practice
