    - op: strip
    - op: upper
    - op: map
      values:
        X: X
        Y: X
        'YES': X
        'TRUE': X
        '1': X
        N: ''
        'NO': ''
        'FALSE': ''
        '0': ''
        __other__: null
    confidence: medium
- id: MM786
  field: STPO.SANKO
  check_class: domain_value_check
  grain: STPO
  severity: low
  dimension: validity
  message: Engineering relevance indicator holds a value outside its domain
  why_it_matters: SANKO marks items relevant for engineering. SAP accepts only X or blank. Loads often bring Y, 1 or TRUE,
    which SAP and the S/4HANA migration cockpit reject.
  rule_authority: sap_hard_constraint
