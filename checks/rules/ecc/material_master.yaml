        Y: X
        'YES': X
        'TRUE': X
        '1': X
        N: ''
        'NO': ''
        'FALSE': ''
        '0': ''
        __other__: null
    confidence: medium
- id: MM787
  field: MAPL.PLNNR
  check_class: exists_check
  grain: MAPL
  fields:
  - MAPL.PLNTY
  - MAPL.PLNNR
  - MAPL.PLNAL
  target_table: PLKO
  target_fields:
  - PLNTY
