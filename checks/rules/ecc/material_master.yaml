    steps:
    - op: strip
    - op: upper
    - op: map
      values:
        X: X
        Y: X
        'YES': X
        'TRUE': X
        '1': X
        N: ''
        'NO': ''
        'FALSE': ''
        '0': ''
        __other__: null
    confidence: medium
