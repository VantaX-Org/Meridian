- id: MM138
  field: MARA.MATNR
  check_class: uniqueness_check
  fields: [MARA.MATNR]
  severity: critical
  dimension: uniqueness
  message: Duplicate material numbers detected — each material must be unique
  why_it_matters: Duplicate materials cause fragmented stock, incorrect MRP planning, split purchase orders, and
    inventory valuation errors. MATNR must be unique across the client landscape.
  rule_authority: sap_hard_constraint
  sap_impact: Inventory is split across duplicate materials. MRP generates incorrect requirements. Purchasing creates
    POs against the wrong material. Stock valuation is fragmented.
  fix_map: {__blank__: 'Identify and consolidate duplicate materials. Use MMAM to change material type if needed.
      Merge stock via movement type 309. Update all dependent documents (BOM, source list, info records).'}

- id: MM140
  field: MARA.MTART
  check_class: referential_check
  severity: critical
  dimension: consistency
  message: Material type MTART must reference a valid entry in T134
  why_it_matters: MTART (material type) drives which views/fields are available, which number range applies, which valuation
    class defaults, and whether the material is stock-relevant. A MTART that isn't in T134 means MM02 cannot open the record,
    MRP does not run, and goods-movements are blocked. In S/4HANA, an unknown MTART blocks the record from appearing in Fiori
    'Manage Material Master Data' (F1602).
  rule_authority: best_practice
  sap_impact: Material cannot be maintained (MM02); MRP skips the record; goods movements (MIGO) blocked. All MM processes
    that key off type — procurement, production, sales — fail.
  fix_map:
    __blank__: Assign material type at MM01. Cannot be changed after creation without MMAM (change material type) which requires
      zero stock and zero reservations.
    __other__: 'Material type ''{invalid_value}'' is not in T134. Use MMAM to change type (prerequisites: zero stock, no open
      POs/reservations) or configure the missing type in SPRO > Logistics — General > Material Master > Basic Settings > Material
      Types.'
  record_fix_template: 'Material {MARA.MATNR}: material type ''{actual_value}'' is not in T134.'

- id: MM141
  field: MARA.MATKL
  check_class: referential_check
  severity: medium
  dimension: consistency
  message: Material group MATKL must reference a valid entry in T023
  why_it_matters: MATKL (material group) is the primary reporting hierarchy for spend, inventory, and category management.
    An invalid MATKL means spend reports (ME2N, ME5A) aggregate incorrectly and category manager assignments fail. For contract
    and source-list determination, MATKL is a key matching attribute — invalid groups break outline-agreement matching.
  rule_authority: best_practice
  sap_impact: Spend reporting by group is incorrect. Contract/source-list determination fails for affected materials. Category
    management assignment invalid.
  fix_map:
    __blank__: Assign material group via MM02 > Basic Data 1. Required for all materials per SAP best practice.
    __other__: Material group '{invalid_value}' not in T023. Reassign via MM02 or configure in SPRO > Logistics — General
      > Material Master > Settings for Key Fields > Define Material Groups.
  record_fix_template: 'Material {MARA.MATNR}: material group ''{actual_value}'' is not in T023.'

- id: MM142
  field: MARA.MEINS
  check_class: referential_check
  severity: high
  dimension: consistency
  message: Base unit of measure MEINS must reference a valid entry in T006
  why_it_matters: MEINS (base unit of measure) is the authoritative UoM for stock, costing, and every quantity conversion
    for a material. An invalid MEINS breaks every UoM conversion — POs, sales orders, and goods movements using different
    UoMs cannot resolve to a stock quantity. CO-PA and valuation calculations fail.
  rule_authority: best_practice
  sap_impact: UoM conversions fail; stock quantities cannot be resolved; costing and CO-PA calculations error.
  fix_map:
    __blank__: Assign base UoM at MM01. Cannot be changed after creation if stock exists or open documents reference the material.
    __other__: Base UoM '{invalid_value}' not in T006. Use MM02 to change (prerequisites apply) or configure the missing UoM
      in SPRO > SAP NetWeaver > General Settings > Check Units of Measurement (CUNI).
  record_fix_template: 'Material {MARA.MATNR}: base UoM ''{actual_value}'' is not in T006.'


- id: MM144
  field: MBEW.VPRSV
  check_class: null_check
  severity: high
  dimension: completeness
  message: Price control indicator (MBEW.VPRSV) is mandatory and must not be blank
  why_it_matters: VPRSV controls whether the material is valuated at standard price (S) or moving average price (V). Without
    it, the valuation view is incomplete and SAP cannot determine how to value goods movements, blocking inventory postings
    and costing.
  rule_authority: sap_hard_constraint
  sap_impact: Material valuation view is incomplete. Goods movements, invoice verification, and costing runs that reference
    this material will fail.
  fix_map:
    __blank__: Assign price control via MM01/MM02 > Accounting view (S for standard price, V for moving average). In S/4HANA
      use Fiori app F1602 (Manage Product Master Data).
  record_fix_template: 'Material {MARA.MATNR}: price control indicator (VPRSV) is missing. Assign S or V via MM02 Accounting
    view.'
  applies_when:
    MBEW.BWKEY:
      populated: true
- id: MM150
  field: MARM.MEINH
  check_class: cross_field_check
  grain: MARM
  fail_when: (`MARM.MEINH` == `MARA.MEINS`) & ((`MARM.UMREZ` != 1) | (`MARM.UMREN` != 1))
  severity: critical
  dimension: consistency
  message: The base unit's own conversion is not 1:1
  why_it_matters: SAP converts every alternative unit through the base unit, whose MARM entry must be 1 = 1. Any other
    factor silently scales every quantity posted in the base unit — stock, valuation and MRP are all off by that factor.
  rule_authority: sap_hard_constraint
  sap_impact: Quantities in the base unit are multiplied by the wrong factor across inventory, valuation and planning.
  fix_map:
    __other__: Correct the base unit's conversion to 1/1 (MM02 > Additional data > Units of measure); if stock exists,
      check the impact with the controller first.
  record_fix_template: 'Material {MARM.MATNR}: base unit {MARM.MEINH} converts {MARM.UMREZ}/{MARM.UMREN} instead of 1/1.'
# ── Rule-breadth extension (MM151+): valuation, stock, units, GTIN, MRP, domains, configuration ─────────
- id: MM151
  field: MBEW.PEINH
  check_class: cross_field_check
  require_populated: true
  fail_when: '`MBEW.PEINH` <= 0'
  severity: critical
  dimension: consistency
  message: Price unit of the valuation record is zero or negative
  why_it_matters: 'Every valuation price (standard, moving average, future price) is stored per price unit: value = quantity
    x price / PEINH. A price unit of 0 divides by zero; SAP''s MM01/MM02 never accept it, so it only enters through direct
    loads or broken migrations.'
  rule_authority: sap_hard_constraint
  sap_impact: Goods movements, revaluation and costing for the material at this valuation area dump or post nonsense values;
    inventory value cannot be computed.
  fix_map:
    __other__: Set the price unit to 1 (or the unit the price is quoted per) in the Accounting 1 view via MM02 (ECC) or
      Fiori F1602 Manage Product Master Data (S/4HANA). If stock exists, correct the price together with the unit through
      MR21 so the stock value stays right.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: price unit is {actual_value}; it must be at least 1.'
- id: MM152
  field: MBEW.VERPR
  check_class: cross_field_check
  fail_when: (`MBEW.VPRSV` == 'V') & (`MBEW.LBKUM` > 0) & ~(`MBEW.VERPR` > 0)
  severity: high
  dimension: consistency
  message: Moving-average-priced material holds valuated stock at a zero moving average price
  why_it_matters: Under price control V the stock value is quantity x moving average price. Stock on hand at a zero price
    is inventory with no value on the balance sheet, and every goods issue from it is posted at zero cost.
  rule_authority: sap_hard_constraint
  sap_impact: Inventory is understated; consumption and cost of goods sold for this material post at zero; product costs
    built on the price are wrong.
  fix_map:
    __other__: Establish the correct price with the controller and revalue the stock via MR21 (price change); then check
      why receipts posted at zero value (free-of-charge receipts, initial stock entry without a value).
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: {MBEW.LBKUM} units in stock at moving average price {actual_value}.'
- id: MM153
  field: MBEW.SALK3
  check_class: cross_field_check
  fail_when: (`MBEW.LBKUM` > 0) & (`MBEW.SALK3` < 0)
  severity: critical
  dimension: consistency
  message: Valuated stock has a positive quantity but a negative value
  why_it_matters: Stock value is quantity x price, and neither the standard nor the moving average price can be negative,
    so a positive quantity can never carry a negative value. The record is out of balance with the stock account.
  rule_authority: sap_hard_constraint
  sap_impact: The material's stock account in FI disagrees with the physical stock; goods issues post negative consumption;
    the moving average price derived from value / quantity is negative.
  fix_map:
    __other__: Analyse the valuation history (MB5L, CKM3N with the material ledger) with the controller and correct the
      value via MR21 / MR22.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: {MBEW.LBKUM} in stock valued at {actual_value}.'
- id: MM154
  field: MBEW.ZKDAT
  check_class: cross_field_check
  fail_when: (`MBEW.ZKPRS` > 0) & `MBEW.ZKDAT`.isna()
  severity: medium
  dimension: consistency
  message: Future standard price is set without the date from which it is valid
  why_it_matters: The future price (ZKPRS) only becomes the standard price when MR21 / CK24 activates it on its valid-from
    date (ZKDAT). MM02 does not accept a future price without that date.
  rule_authority: sap_hard_constraint
  sap_impact: The future price is never activated; standard price changes planned by costing are silently skipped.
  fix_map:
    __other__: Enter the valid-from date of the future price in Costing 2 via MM02 (ECC) or Fiori F1602 Manage Product Master
      Data (S/4HANA), or remove the future price.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: future price {MBEW.ZKPRS} has no valid-from date.'
- id: MM155
  field: MBEW.VPRSV
  check_class: cross_field_check
  fail_when: (`MBEW.VPRSV` != 'V')
  applies_when:
    MBEW.BWTTY:
      populated: true
    MBEW.BWTAR:
      blank: true
  severity: high
  dimension: consistency
  message: Split-valuated material is not under moving average price control at its valuation header
  why_it_matters: With split valuation the stock of each valuation type is valued separately and the header record (no valuation
    type) only totals them. SAP requires price control V on the header, because its price is the quantity-weighted average
    of the valuation-type prices.
  rule_authority: sap_hard_constraint
  sap_impact: Totals at the valuation header do not reconcile with the valuation-type records; MM02 rejects further changes
    to the accounting view.
  fix_map:
    __other__: Set price control V on the valuation header (MM02 > Accounting 1, no valuation type); keep S or V per valuation
      type as required.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: split-valuated header has price control {actual_value}.'
- id: MM156
  field: MARD.LABST
  check_class: cross_field_check
  fail_when: (`MARD.LABST` < 0) & (`MARC.XMCNG`.isna() | (`MARC.XMCNG` != 'X'))
  severity: high
  dimension: consistency
  message: Unrestricted-use stock is negative in a plant where negative stock is not allowed for the material
  why_it_matters: SAP lets unrestricted-use stock go below zero only when negative stocks are allowed for the material in
    the plant (MARC.XMCNG) and for the storage location. Without that flag a negative quantity cannot arise from a goods
    movement; it points to a direct table load or an inconsistency between stock and documents.
  rule_authority: sap_hard_constraint
  sap_impact: Availability checks, MRP and physical inventory work from a quantity that cannot exist; valuation of the missing
    quantity is undefined.
  fix_map:
    __other__: Reconcile the storage-location stock with its material documents (MB5B / MMBE); post the missing receipt
      or correct the stock via inventory (MI01-MI07). Only allow negative stock (MRP view, plant) if the business genuinely
      posts issues before receipts.
  record_fix_template: 'Material {MARD.MATNR}, plant {MARD.WERKS}, storage location {MARD.LGORT}: unrestricted stock {actual_value}.'
- id: MM157
  field: MARD.INSME
  check_class: cross_field_check
  fail_when: (`MARD.INSME` < 0) | (`MARD.SPEME` < 0) | (`MARD.RETME` < 0) | (`MARD.EINME` < 0) | (`MARD.UMLME` < 0)
  severity: high
  dimension: consistency
  message: Quality-inspection, blocked, returns, restricted or in-transfer stock is negative
  why_it_matters: Negative stock is only ever possible for unrestricted-use stock. Quality-inspection, blocked, blocked
    returns, restricted-use and stock in transfer can never fall below zero through a goods movement.
  rule_authority: sap_hard_constraint
  sap_impact: Stock overviews, usage decisions and transfer postings work from an impossible quantity; the storage location's
    stock totals and valuation are wrong.
  fix_map:
    __other__: Reconcile the stock types with their material documents (MB5B, MB52) and correct them through physical inventory
      or a transfer posting with the controller's agreement.
  record_fix_template: 'Material {MARD.MATNR}, plant {MARD.WERKS}, storage location {MARD.LGORT}: negative stock in a non-unrestricted
    stock type.'
- id: MM158
  field: MARD.LBSTF
  check_class: cross_field_check
  fail_when: ~(`MARD.LBSTF` > 0)
  applies_when:
    MARD.DISKZ:
    - '1'
  severity: medium
  dimension: consistency
  message: Storage location planned separately (storage-location MRP) has no replenishment quantity
  why_it_matters: With storage-location MRP indicator 1 the location is planned by its own reorder point and replenished
    by the fixed replenishment quantity. Without a quantity, MRP creates no (or zero) replenishment proposals.
  rule_authority: sap_hard_constraint
  sap_impact: The storage location runs out of stock without MRP ever proposing a stock transfer or purchase.
  fix_map:
    __other__: Maintain the replenishment quantity (and reorder point) for the storage location in MRP 4 via MM02 (ECC)
      or Fiori F1602 Manage Product Master Data (S/4HANA), or remove indicator 1 if the location should be planned with
      the plant.
  record_fix_template: 'Material {MARD.MATNR}, plant {MARD.WERKS}, storage location {MARD.LGORT}: replenishment quantity
    {actual_value}.'
- id: MM159
  field: MARA.GEWEI
  check_class: cross_field_check
  fail_when: ((`MARA.BRGEW` > 0) | (`MARA.NTGEW` > 0)) & `MARA.GEWEI`.isna()
  severity: medium
  dimension: completeness
  message: The weight of the material is maintained without its unit
  why_it_matters: A weight value is a quantity field whose meaning is defined by its unit field (MARA.GEWEI); SAP screens
    refuse a quantity without a unit. Without it the number cannot be converted, so shipping, packing and freight calculations
    cannot use it.
  rule_authority: sap_hard_constraint
  sap_impact: Delivery and shipment weight totals, packing proposals, freight costing and dangerous-goods / foreign-trade
    declarations ignore or mis-read the value.
  fix_map:
    __other__: Enter the unit for the weight (Basic data 1 / Additional data > Units of measure) via MM02 (ECC) or Fiori
      F1602 Manage Product Master Data (S/4HANA).
  record_fix_template: 'Material {MARA.MATNR}: weight maintained but unit MARA.GEWEI is blank.'
- id: MM160
  field: MARA.VOLEH
  check_class: cross_field_check
  fail_when: (`MARA.VOLUM` > 0) & `MARA.VOLEH`.isna()
  severity: medium
  dimension: completeness
  message: The volume of the material is maintained without its unit
  why_it_matters: A volume value is a quantity field whose meaning is defined by its unit field (MARA.VOLEH); SAP screens
    refuse a quantity without a unit. Without it the number cannot be converted, so shipping, packing and freight calculations
