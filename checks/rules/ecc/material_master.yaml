- id: MM164
  field: MARM.MEABM
  check_class: cross_field_check
  fail_when: ((`MARM.LAENG` > 0) | (`MARM.BREIT` > 0) | (`MARM.HOEHE` > 0)) & `MARM.MEABM`.isna()
  severity: medium
  dimension: completeness
  message: The dimensions of the alternative unit of measure is maintained without its unit
