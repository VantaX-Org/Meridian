  sap_impact: Push distribution runs, or does not run, for the plant in an unintended way.
  fix_map:
    __other__: Correct the value in MM02 MRP 4; the allowed values are those of domain DPLPU.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: DPLPU is ''{actual_value}'', which is not a value of domain
    DPLPU.'
- id: MM387
  field: MARC.KZAGL
  check_class: domain_value_check
  severity: low
  dimension: validity
  message: 'Indicator: smooth promotion consumption (MARC.KZAGL) is not a value of its SAP domain'
  why_it_matters: 'Indicator: smooth promotion consumption accepts only the fixed values of domain KZAGL. The value drives
    whether smooth promotion consumption applies to the material; the SAP screens never accept a value outside the domain,
    so it comes from a direct table load or a migration.'
  rule_authority: best_practice
  sap_impact: Promotion consumption is smoothed, or not, in an unintended way.
  fix_map:
    __other__: Correct the value in MM02 MRP 4; the allowed values are those of domain KZAGL.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: KZAGL is ''{actual_value}'', which is not a value of domain
    KZAGL.'
- id: MM388
  field: MARC.USEQU
  check_class: referential_check
  severity: low
  dimension: validity
  message: Quota arrangement usage (MARC.USEQU) is not defined in the system's configuration (TMQ2)
  why_it_matters: Quota arrangement usage is a key into customizing table TMQ2. It is the quota arrangement usage key. A value
    that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Quota arrangements cannot be maintained or used for the material.
  fix_map:
    __other__: '''{invalid_value}'' is not in TMQ2. Correct the value in MM02 or create the entry in table TMQ2 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: USEQU ''{actual_value}'' is not configured in TMQ2.'
- id: MM389
  field: MARC.LAGPR
  check_class: referential_check
  severity: low
  dimension: validity
  message: Storage costs indicator (MARC.LAGPR) is not defined in the system's configuration (T439L)
  why_it_matters: Storage costs indicator is a key into customizing table T439L. It is the storage costs indicator used when
    the lot size is calculated by the least unit cost or part-period procedures. A value that is not configured there cannot
    be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Lot-size calculations that include storage costs cannot read the indicator.
  fix_map:
    __other__: '''{invalid_value}'' is not in T439L. Correct the value in MM02 or create the entry in table T439L (SM30 or
      the matching IMG node).'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: LAGPR ''{actual_value}'' is not configured in T439L.'
- id: MM390
  field: MARC.EISLO
  check_class: cross_field_check
  fail_when: (`MARC.EISLO` > 0) & (`MARC.EISBE` > 0) & (`MARC.EISLO` > `MARC.EISBE`)
  severity: medium
  dimension: consistency
  message: Minimum safety stock is larger than the safety stock
  why_it_matters: EISLO is the lowest level to which safety stock may be reduced by dynamic safety stock logic. It cannot
    be above the regular safety stock (EISBE).
  rule_authority: best_practice
  sap_impact: The dynamic safety stock calculation cannot lower the stock to the minimum, or MRP shows contradicting values.
  fix_map:
    __other__: Correct the safety stock values in MM02 MRP 2.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: minimum safety stock {MARC.EISLO} exceeds safety stock
    {MARC.EISBE}.'
- id: MM391
  field: MARC.SHZET
  check_class: cross_field_check
  applies_when:
    MARC.SHFLG:
      blank: true
  fail_when: (`MARC.SHZET`.notna() & (`MARC.SHZET`.str.lstrip('0') != ''))
  severity: medium
  dimension: consistency
  message: Safety time (days) is entered without a safety time indicator
  why_it_matters: SHZET is the number of days of safety time. SHFLG tells MRP to apply it. Without the indicator, the days
    are ignored.
  rule_authority: best_practice
  sap_impact: Planned receipts are not moved earlier although the planner entered a safety time.
  fix_map:
    __other__: Set the safety time indicator in MM02 MRP 2 or clear the days.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: safety time {actual_value} days but no safety time indicator.'
  auto_fix:
    steps:
    - op: set
      value: '00'
    confidence: medium
- id: MM392
  field: MARC.SHFLG
  check_class: cross_field_check
  applies_when:
    MARC.SHFLG:
      populated: true
  fail_when: (`MARC.SHZET`.isna() | (`MARC.SHZET`.str.lstrip('0') == ''))
  severity: medium
  dimension: consistency
  message: Safety time indicator is set without any safety time
  why_it_matters: The indicator tells MRP to use the safety time (SHZET). With zero days it changes nothing and misleads the
    planner.
  rule_authority: best_practice
  sap_impact: Planners assume a safety time protects the supply while it does not.
  fix_map:
    __other__: Enter the safety time in days in MM02 MRP 2 or clear the indicator.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: safety time indicator {actual_value} but safety time is
    {MARC.SHZET}.'
- id: MM393
  field: MARC.MAXLZ
  check_class: cross_field_check
  applies_when:
    MARC.LZEIH:
      blank: true
  fail_when: '`MARC.MAXLZ` > 0'
  severity: low
  dimension: consistency
  message: Maximum storage period is entered without a unit
  why_it_matters: The maximum storage period (MAXLZ) is a number; LZEIH gives its unit (days, months, years).
  rule_authority: best_practice
  sap_impact: Shelf life and storage time checks read the number in the wrong unit.
  fix_map:
    __other__: Enter the unit in MM02 Plant data / storage 1.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: maximum storage period {actual_value} with no time unit.'
  auto_fix:
    steps:
    - op: set
      value: '0'
    confidence: low
- id: MM394
  field: MARC.FXHOR
  check_class: cross_field_check
  applies_when:
    MARC.DISMM:
    - ND
  fail_when: (`MARC.FXHOR`.notna() & (`MARC.FXHOR`.str.lstrip('0') != ''))
  severity: low
  dimension: consistency
  message: Planning time fence is set for a material that is not planned by MRP
  why_it_matters: The planning time fence freezes the plan inside the horizon. It only has meaning when MRP plans the material
    (MRP type other than ND).
  rule_authority: best_practice
  sap_impact: The fence is ignored; planners believe a frozen horizon protects the plan.
  fix_map:
    __other__: Clear the planning time fence in MM02 MRP 1 or change the MRP type.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: planning time fence {actual_value} but MRP type ND.'
  auto_fix:
    steps:
    - op: set
      value: '000'
    confidence: medium
- id: MM395
  field: MARC.VINT1
  check_class: cross_field_check
  applies_when:
    MARC.VRMOD:
    - '1'
    - '2'
    - '4'
  fail_when: '`MARC.VINT1`.isna() | (`MARC.VINT1`.astype(''string'').str.strip().str.lstrip(''0'') == '''')'
  severity: medium
  dimension: completeness
  message: Consumption mode needs a backward consumption period that is missing
  why_it_matters: Consumption modes 1, 2 and 4 read the backward consumption period (VINT1) to decide which sales orders consume
    the forecast. Without it consumption is not applied.
  rule_authority: best_practice
  sap_impact: Forecast and sales orders are both planned, so demand is counted twice.
  fix_map:
    __other__: Enter the backward consumption period in MM02 MRP 3.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: consumption mode {MARC.VRMOD} but backward consumption
    period {actual_value}.'
- id: MM396
  field: MARC.VINT2
  check_class: cross_field_check
  applies_when:
    MARC.VRMOD:
    - '2'
    - '3'
    - '4'
  fail_when: '`MARC.VINT2`.isna() | (`MARC.VINT2`.astype(''string'').str.strip().str.lstrip(''0'') == '''')'
  severity: medium
  dimension: completeness
  message: Consumption mode needs a forward consumption period that is missing
  why_it_matters: Consumption modes 2, 3 and 4 read the forward consumption period (VINT2) to decide which sales orders consume
    the forecast. Without it consumption is not applied.
  rule_authority: best_practice
  sap_impact: Forecast and sales orders are both planned, so demand is counted twice.
  fix_map:
    __other__: Enter the forward consumption period in MM02 MRP 3.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: consumption mode {MARC.VRMOD} but forward consumption period
    {actual_value}.'
- id: MM397
  field: MARC.DZEIT
  check_class: cross_field_check
  applies_when:
    MARC.BESKZ:
    - F
  fail_when: '`MARC.DZEIT` > 0'
  severity: medium
  dimension: consistency
  message: In-house production time is set for an externally procured material
  why_it_matters: The in-house production time (DZEIT) is read for in-house production (procurement type E). A value on an
    externally procured material (F) is ignored and misleads planners.
  rule_authority: best_practice
  sap_impact: Lead time scheduling uses the planned delivery time instead; the value in DZEIT is stale.
  fix_map:
    __other__: Clear the in-house production time in MM02 MRP 2 or change the procurement type.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: procurement type F but in-house production time {actual_value}.'
  auto_fix:
    steps:
    - op: set
      value: '0'
    confidence: medium
- id: MM398
  field: MARC.AUSDT
  check_class: cross_field_check
  fail_when: '`MARC.AUSDT`.notna() & (`MARC.AUSDT` < @today) & (`MARC.DISMM` != ''ND'') & `MARC.LVORM`.isna()'
  severity: medium
  dimension: lifecycle
  message: Effective-out date has passed but the material is still planned by MRP
  why_it_matters: The effective-out date (AUSDT) is the day a material is phased out. After it passes, MRP should no longer
    plan the material (MRP type ND or deletion flag).
  rule_authority: best_practice
  sap_impact: MRP keeps creating planned orders and requisitions for a material that is already phased out.
  fix_map:
    __other__: Set the MRP type to ND or the plant deletion flag in MM02, or correct the date.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: effective-out date {actual_value} has passed, MRP type
    {MARC.DISMM}.'
- id: MM399
  field: MARC.DISMM
  check_class: cross_field_check
  applies_when:
    MARC.LVORM:
    - X
  fail_when: '`MARC.DISMM` != ''ND'''
  require_populated: true
  severity: medium
  dimension: lifecycle
  message: Plant is flagged for deletion but the material is still planned by MRP
  why_it_matters: A plant row flagged for deletion should not be planned. MRP type other than ND keeps it in the planning
    run.
  rule_authority: best_practice
  sap_impact: MRP creates planned orders and requisitions for a plant row that is being retired.
  fix_map:
    __other__: Set the MRP type to ND in MM02 MRP 1 or remove the deletion flag in MM06.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: plant row flagged for deletion but MRP type is {actual_value}.'
  auto_fix:
    steps:
    - op: set
      value: ND
    confidence: medium
- id: MM400
  field: MARC.SFCPF
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Production Scheduling Profile (MARC.SFCPF) is not defined in the system's configuration (TCO43)
  why_it_matters: Production Scheduling Profile is a key into customizing table TCO43. It is the production scheduling profile
    that sets release, scheduling and confirmation defaults of production orders. A value that is not configured there cannot
    be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Production orders for the material cannot take their defaults.
  fix_map:
    __other__: '''{invalid_value}'' is not in TCO43. Correct the value in MM02 or create the entry in table TCO43 (SM30 or
      the matching IMG node).'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: SFCPF ''{actual_value}'' is not configured in TCO43.'
- id: MM401
  field: MARC.SFEPR
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Repetitive manufacturing profile (MARC.SFEPR) is not defined in the system's configuration (T437S)
  why_it_matters: Repetitive manufacturing profile is a key into customizing table T437S. It is the repetitive manufacturing
    profile that controls backflush and planning in repetitive manufacturing. A value that is not configured there cannot
    be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Repetitive manufacturing backflush and planning cannot be run for the material.
  fix_map:
    __other__: '''{invalid_value}'' is not in T437S. Correct the value in MM02 or create the entry in table T437S (SM30 or
      the matching IMG node).'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: SFEPR ''{actual_value}'' is not configured in T437S.'
- id: MM402
  field: MARC.SFCPF
  check_class: null_check
  applies_when:
    MARC.BESKZ:
    - E
    - X
  severity: medium
  dimension: completeness
  message: Production scheduling profile is missing though the material is produced in-house
  why_it_matters: The production scheduling profile sets release, scheduling and confirmation defaults for production orders.
    Without it, shop floor users must enter them for every order.
  rule_authority: best_practice
  sap_impact: Production orders are created with incomplete defaults; scheduling and release deviate from plan.
  fix_map:
    __blank__: Enter the profile in MM02 Work scheduling.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: in-house production but no production scheduling profile.'
- id: MM403
  field: MARC.SFEPR
  check_class: null_check
  applies_when:
    MARC.SAUFT:
    - X
  severity: medium
  dimension: completeness
  message: Repetitive manufacturing is allowed but the material has no repetitive manufacturing profile
  why_it_matters: A material that may be produced repetitively needs the repetitive manufacturing profile (SFEPR). It controls
    backflushing, reporting points and planning in REM.
  rule_authority: best_practice
  sap_impact: Repetitive manufacturing confirmations and backflush cannot be posted for the material.
  fix_map:
    __blank__: Enter the profile in MM02 Work scheduling.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: repetitive manufacturing is allowed but no profile is set.'
- id: MM404
  field: MARC.SFEPR
  check_class: cross_field_check
  applies_when:
    MARC.SAUFT:
      blank: true
  fail_when: '`MARC.SFEPR`.notna()'
  severity: low
  dimension: consistency
  message: Repetitive manufacturing profile is set though repetitive manufacturing is not allowed
  why_it_matters: The profile only has meaning if repetitive manufacturing is allowed for the material (SAUFT). Otherwise
    it is a leftover from a changed setup.
  rule_authority: best_practice
  sap_impact: The profile misleads planners; the material cannot be confirmed with REM.
  fix_map:
    __other__: Allow repetitive manufacturing in MM02 Work scheduling or clear the profile.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: profile {actual_value} but repetitive manufacturing is
    not allowed.'
- id: MM405
  field: MARC.SSQSS
  check_class: null_check
  applies_when:
    MARA.QMPUR:
    - X
  severity: medium
  dimension: completeness
  message: QM procurement is active but the material has no QM control key
  why_it_matters: When QM in procurement is active for the material (MARA.QMPUR X), the QM control key (SSQSS) says which
    quality checks the system runs for a delivery. Without it no inspection is triggered.
  rule_authority: best_practice
  sap_impact: Goods receipts post without the inspection lot that quality planning expects.
  fix_map:
    __blank__: Enter the QM control key in MM02 Quality management.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: QM in procurement active but no QM control key.'
- id: MM406
  field: MARC.SSQSS
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Control Key for Quality Management in Procurement (MARC.SSQSS) is not defined in the system's configuration (TQ08)
  why_it_matters: Control Key for Quality Management in Procurement is a key into customizing table TQ08. It is the QM control
    key that decides whether inspection is triggered for a delivery. A value that is not configured there cannot be interpreted
    by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Goods receipts cannot determine the inspection behaviour for the delivery.
  fix_map:
    __other__: '''{invalid_value}'' is not in TQ08. Correct the value in MM02 or create the entry in table TQ08 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: SSQSS ''{actual_value}'' is not configured in TQ08.'
- id: MM407
  field: MARC.QSSYS
  check_class: referential_check
  severity: low
  dimension: validity
  message: Required QM system for vendor (MARC.QSSYS) is not defined in the system's configuration (TQ02)
  why_it_matters: Required QM system for vendor is a key into customizing table TQ02. It is the QM system that a vendor must
    hold to supply the material. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Vendor evaluation and QM system checks cannot be run.
  fix_map:
    __other__: '''{invalid_value}'' is not in TQ02. Correct the value in MM02 or create the entry in table TQ02 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: QSSYS ''{actual_value}'' is not configured in TQ02.'
- id: MM408
  field: MARC.QMATA
  check_class: referential_check
  severity: low
  dimension: validity
  message: Material authorization group for activities in QM (MARC.QMATA) is not defined in the system's configuration (TQ01B)
  why_it_matters: Material authorization group for activities in QM is a key into customizing table TQ01B. It is the material
    authorization group for QM activities. A value that is not configured there cannot be interpreted by the functions that
    read it.
  rule_authority: sap_hard_constraint
  sap_impact: QM authorisation checks for the material cannot be evaluated.
  fix_map:
    __other__: '''{invalid_value}'' is not in TQ01B. Correct the value in MM02 or create the entry in table TQ01B (SM30 or
      the matching IMG node).'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: QMATA ''{actual_value}'' is not configured in TQ01B.'
- id: MM409
  field: MARC.KAUSF
  check_class: cross_field_check
  fail_when: '`MARC.KAUSF` > 100'
  severity: low
  dimension: accuracy
  message: Component scrap above 100 percent
  why_it_matters: Component scrap (KAUSF) is a percentage of the required quantity that is lost during production. More than
    100 percent is not a loss, it is a data entry error.
  rule_authority: best_practice
  sap_impact: BOM explosion and MRP plan several times the required component quantity.
  fix_map:
    __other__: Correct the component scrap in MM02 MRP 4.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: component scrap is {actual_value} percent.'
- id: MM410
  field: QMAT.ART
  check_class: referential_check
  grain: QMAT
  severity: high
  dimension: validity
  message: Inspection Type (QMAT.ART) is not defined in the system's configuration (TQ30)
  why_it_matters: Inspection Type is a key into customizing table TQ30. Every inspection type setup is held per material,
    plant and inspection type. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Inspection lots of the type are not created or fail to open.
  fix_map:
    __other__: '''{invalid_value}'' is not in TQ30. Correct the value in MM02 or create the entry in table TQ30 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {QMAT.MATNR}, plant {QMAT.WERKS}, inspection type {QMAT.ART}: ART ''{actual_value}'' is not
    configured in TQ30.'
- id: MM411
  field: QMAT.WERKS
  check_class: referential_check
  grain: QMAT
  severity: high
  dimension: validity
  message: Plant (QMAT.WERKS) is not defined in the system's configuration (T001W)
  why_it_matters: Plant is a key into customizing table T001W. It is the plant in which the inspection type is active. A value
    that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: The inspection setup is unreachable.
  fix_map:
    __other__: '''{invalid_value}'' is not in T001W. Correct the value in MM02 or create the entry in table T001W (SM30 or
      the matching IMG node).'
  record_fix_template: 'Material {QMAT.MATNR}, plant {QMAT.WERKS}, inspection type {QMAT.ART}: WERKS ''{actual_value}'' is
    not configured in T001W.'
- id: MM412
  field: MARC.QMATV
  check_class: exists_check
  applies_when:
    MARC.QMATV:
    - X
  fields:
  - MARC.MATNR
  - MARC.WERKS
  target_table: QMAT
  target_fields:
  - MATNR
  - WERKS
  severity: medium
  dimension: consistency
  message: Inspection setup is active for the plant but no inspection type is defined
  why_it_matters: The flag QMATV states that an inspection setup exists. Without a row in QMAT, no inspection lot is created.
  rule_authority: best_practice
  sap_impact: Goods receipts post without an inspection lot, so goods go to unrestricted stock unchecked.
  fix_map:
    __other__: Create the inspection type in QM01 or clear the flag in MM02 Quality management.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: inspection setup flag is set but no inspection type setup
    (QMAT) exists.'
- id: MM413
  field: QMAT.MATNR
  check_class: exists_check
  grain: QMAT
  fields:
  - QMAT.MATNR
  - QMAT.WERKS
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    QMATV:
    - X
  severity: medium
  dimension: consistency
  message: Inspection type is defined but the plant row does not have the inspection setup flag
  why_it_matters: A QMAT row is only read when the plant data of the material has the inspection setup flag (QMATV) set.
  rule_authority: best_practice
  sap_impact: The inspection type exists, but the system ignores it, so no inspection lot is created.
  fix_map:
    __other__: Set the inspection setup flag in MM02 Quality management.
  record_fix_template: 'Material {QMAT.MATNR}, plant {QMAT.WERKS}, inspection type {QMAT.ART}: inspection type {QMAT.ART}
    exists but the plant row has no inspection setup flag.'
- id: MM414
  field: MBEW.VMVPR
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: Price control indicator for previous period (MBEW.VMVPR) is not a value of its SAP domain
  why_it_matters: Price control indicator for previous period accepts only the fixed values of domain VPRSV. The value drives
    the price control of the previous period; the SAP screens never accept a value outside the domain, so it comes from a
    direct table load or a migration.
  rule_authority: best_practice
  sap_impact: Period-end revaluation reads the wrong price control.
  fix_map:
    __other__: Correct the value in MM02 Accounting 1; the allowed values are those of domain VPRSV.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: VMVPR is ''{actual_value}'', which is not a value
    of domain VPRSV.'
- id: MM415
  field: MBEW.VJVPR
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: Price control indicator for previous year (MBEW.VJVPR) is not a value of its SAP domain
  why_it_matters: Price control indicator for previous year accepts only the fixed values of domain VPRSV. The value drives
    the price control of the previous year; the SAP screens never accept a value outside the domain, so it comes from a direct
    table load or a migration.
  rule_authority: best_practice
  sap_impact: Year-end revaluation reads the wrong price control.
  fix_map:
    __other__: Correct the value in MM02 Accounting 1; the allowed values are those of domain VPRSV.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: VJVPR is ''{actual_value}'', which is not a value
    of domain VPRSV.'
- id: MM416
  field: MBEW.SPERW
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: Physical inventory blocking indicator (MBEW.SPERW) is not a value of its SAP domain
  why_it_matters: Physical inventory blocking indicator accepts only the fixed values of domain SPERR. The value drives the
    physical inventory blocking indicator of the valuation record; the SAP screens never accept a value outside the domain,
    so it comes from a direct table load or a migration.
  rule_authority: best_practice
  sap_impact: Posting freeze during counting is applied, or not, in an unintended way.
  fix_map:
    __other__: Correct the value in MI01 or MM02 Accounting 1; the allowed values are those of domain SPERR.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: SPERW is ''{actual_value}'', which is not a value
    of domain SPERR.'
- id: MM417
  field: MBEW.EKLAS
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Valuation Class for Sales Order Stock (MBEW.EKLAS) is not defined in the system's configuration (T025)
  why_it_matters: Valuation Class for Sales Order Stock is a key into customizing table T025. It is the valuation class for
    sales order stock. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Sales order stock cannot be posted.
  fix_map:
    __other__: '''{invalid_value}'' is not in T025. Correct the value in MM02 or create the entry in table T025 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: EKLAS ''{actual_value}'' is not configured in
    T025.'
- id: MM418
  field: MBEW.VMBKL
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Valuation class of previous period (MBEW.VMBKL) is not defined in the system's configuration (T025)
  why_it_matters: Valuation class of previous period is a key into customizing table T025. It is the valuation class of the
    previous period. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Revaluation of the previous period cannot resolve the account.
  fix_map:
    __other__: '''{invalid_value}'' is not in T025. Correct the value in MM02 or create the entry in table T025 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: VMBKL ''{actual_value}'' is not configured in
    T025.'
- id: MM419
  field: MBEW.BWTTY
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Valuation Category (MBEW.BWTTY) is not defined in the system's configuration (T149)
  why_it_matters: Valuation Category is a key into customizing table T149. It is the valuation category that drives split
    valuation. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Split valuation cannot be set up.
  fix_map:
    __other__: '''{invalid_value}'' is not in T149. Correct the value in MM02 or create the entry in table T149 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: BWTTY ''{actual_value}'' is not configured in
    T149.'
- id: MM420
  field: MBEW.HRKFT
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Origin Group as Subdivision of Cost Element (MBEW.HRKFT) is not defined in the system's configuration (TKKH1)
  why_it_matters: Origin Group as Subdivision of Cost Element is a key into customizing table TKKH1. It is the origin group
    used to split costs. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Cost element splitting by origin group is not applied.
  fix_map:
    __other__: '''{invalid_value}'' is not in TKKH1. Correct the value in MM02 or create the entry in table TKKH1 (SM30 or
      the matching IMG node).'
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: HRKFT ''{actual_value}'' is not configured in
    TKKH1.'
- id: MM421
  field: MBEW.KOSGR
  check_class: referential_check
  severity: low
  dimension: validity
  message: Costing overhead group (MBEW.KOSGR) is not defined in the system's configuration (TCK14)
  why_it_matters: Costing overhead group is a key into customizing table TCK14. It is the costing overhead group. A value
    that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Overhead is not calculated for the material.
  fix_map:
    __other__: '''{invalid_value}'' is not in TCK14. Correct the value in MM02 or create the entry in table TCK14 (SM30 or
      the matching IMG node).'
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: KOSGR ''{actual_value}'' is not configured in
    TCK14.'
- id: MM422
  field: MBEW.STPRS
  check_class: cross_field_check
  fail_when: (`MBEW.STPRS` < 0) | (`MBEW.VERPR` < 0)
  severity: high
  dimension: accuracy
  message: Standard price or moving average price is negative
  why_it_matters: A price is the value of one price unit and cannot be negative. A negative value comes from a sign error
    in a load or a revaluation.
  rule_authority: best_practice
  sap_impact: Goods movements and invoices post negative inventory value; margin and profit reports are wrong.
  fix_map:
    __other__: Correct the price in MR21 (standard) or MM02 Accounting 1.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: standard price {MBEW.STPRS}, moving average price
    {MBEW.VERPR}.'
- id: MM423
  field: MBEW.ZKPRS
  check_class: cross_field_check
  fail_when: (`MBEW.ZKPRS` > 0) & `MBEW.ZKDAT`.notna() & (`MBEW.ZKDAT` < @today)
  severity: low
  dimension: freshness
  message: Future price is set but its valid-from date is already past
  why_it_matters: The future price becomes the current standard price on its date. A date in the past means the planned change
    never took effect.
  rule_authority: best_practice
  sap_impact: Planned price changes are missed; standard costs stay on the old price.
  fix_map:
    __other__: Release the future price in CKR1 or MR21, or correct the date in MM02 Costing.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: future price {MBEW.ZKPRS} with date {MBEW.ZKDAT}
    already past.'
- id: MM424
  field: MBEW.LVORM
  check_class: cross_field_check
  applies_when:
    MARC.LVORM:
    - X
  fail_when: '`MBEW.LVORM`.isna()'
  severity: medium
  dimension: consistency
  message: Valuation row is active although the plant row is flagged for deletion
  why_it_matters: A valuation row should carry the deletion flag when the plant row does. Otherwise the material can still
    be valuated and posted in that area.
  rule_authority: best_practice
  sap_impact: Goods movements and price changes remain possible for a retired material.
  fix_map:
    __other__: Set the deletion flag in MM06 on the valuation row or remove it on the plant row.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: plant row flagged for deletion but valuation row
    is not.'
  auto_fix:
    steps:
    - op: set
      value: X
    confidence: medium
- id: MM425
  field: MBEW.LBKUM
  check_class: group_sum_check
  grain: MBEW
  applies_when:
    MBEW.BWTAR:
      blank: true
  amount: MARD.LABST
  group_keys:
    MARD.MATNR: MBEW.MATNR
    MARD.WERKS: MBEW.BWKEY
  compare: <=
  tolerance: 0.001
  no_children: pass
  severity: high
  dimension: consistency
  message: Valuated stock quantity is less than the sum of the storage location unrestricted stock
  why_it_matters: The valuated stock (MBEW.LBKUM) is the total of all storage locations of the plant. If unrestricted storage
    location stock exceeds it, the inventory value and the physical stock have drifted apart.
  rule_authority: sap_hard_constraint
  sap_impact: Inventory value and quantity differ; balance sheet inventory is wrong and the reconciliation MB5K shows differences.
  fix_map:
    __other__: Run the reconciliation in MB5K and correct with the standard repair or a stock reorganisation.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: valuated stock {MBEW.LBKUM} is smaller than the
    unrestricted stock in the storage locations.'
- id: MM426
  field: MBEW.LBKUM
  check_class: group_sum_check
  grain: MBEW
  applies_when:
    MBEW.BWTAR:
      blank: true
  amount: MARD.INSME
  group_keys:
    MARD.MATNR: MBEW.MATNR
    MARD.WERKS: MBEW.BWKEY
  compare: <=
  tolerance: 0.001
  no_children: pass
  severity: medium
  dimension: consistency
  message: Valuated stock quantity is less than the sum of the storage location quality inspection stock
  why_it_matters: Quality inspection stock is part of the valuated stock. Storage location inspection stock above the valuated
    total means that the valuation record lost a posting.
  rule_authority: sap_hard_constraint
  sap_impact: Inventory value and quantity differ; the reconciliation in MB5K shows a difference.
  fix_map:
    __other__: Run the reconciliation in MB5K and correct with the standard repair or a stock reorganisation.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: valuated stock {MBEW.LBKUM} is smaller than the
    inspection stock in the storage locations.'
- id: MM427
  field: MBEW.LBKUM
  check_class: group_sum_check
  grain: MBEW
  applies_when:
    MBEW.BWTAR:
      blank: true
  amount: MARD.SPEME
  group_keys:
    MARD.MATNR: MBEW.MATNR
    MARD.WERKS: MBEW.BWKEY
  compare: <=
  tolerance: 0.001
  no_children: pass
  severity: medium
  dimension: consistency
  message: Valuated stock quantity is less than the sum of the storage location blocked stock
  why_it_matters: Blocked stock is part of the valuated stock. Storage location blocked stock above the valuated total means
    that the valuation record lost a posting.
  rule_authority: sap_hard_constraint
  sap_impact: Inventory value and quantity differ; the reconciliation in MB5K shows a difference.
  fix_map:
    __other__: Run the reconciliation in MB5K and correct with the standard repair or a stock reorganisation.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: valuated stock {MBEW.LBKUM} is smaller than the
    blocked stock in the storage locations.'
- id: MM428
  field: MARD.SPERR
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: Physical inventory blocking indicator (MARD.SPERR) is not a value of its SAP domain
  why_it_matters: Physical inventory blocking indicator accepts only the fixed values of domain SPERR. The value drives the
    physical inventory blocking indicator of the storage location; the SAP screens never accept a value outside the domain,
    so it comes from a direct table load or a migration.
  rule_authority: best_practice
  sap_impact: Posting freeze during counting is applied, or not, in an unintended way.
  fix_map:
    __other__: Correct the value in MI01 or MM02 Plant data / storage; the allowed values are those of domain SPERR.
  record_fix_template: 'Material {MARD.MATNR}, plant {MARD.WERKS}, storage location {MARD.LGORT}: SPERR is ''{actual_value}'',
    which is not a value of domain SPERR.'
- id: MM429
  field: MARD.DISKZ
  check_class: domain_value_check
  severity: low
  dimension: validity
  message: Storage location MRP indicator (MARD.DISKZ) is not a value of its SAP domain
  why_it_matters: Storage location MRP indicator accepts only the fixed values of domain DISKZ. The value drives whether the
    storage location is included in MRP (storage location MRP indicator); the SAP screens never accept a value outside the
    domain, so it comes from a direct table load or a migration.
  rule_authority: best_practice
  sap_impact: MRP includes or excludes the storage location stock unintentionally.
  fix_map:
    __other__: Correct the value in MM02 MRP 4; the allowed values are those of domain DISKZ.
  record_fix_template: 'Material {MARD.MATNR}, plant {MARD.WERKS}, storage location {MARD.LGORT}: DISKZ is ''{actual_value}'',
    which is not a value of domain DISKZ.'
- id: MM430
  field: MARD.LSOBS
  check_class: referential_check
  severity: low
  dimension: validity
  message: Special procurement type at storage location level (MARD.LSOBS) is not defined in the system's configuration (T460A)
  why_it_matters: Special procurement type at storage location level is a key into customizing table T460A. It is the special
    procurement type at storage location level. A value that is not configured there cannot be interpreted by the functions
    that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Storage-location-level special procurement cannot be resolved.
  fix_map:
    __other__: '''{invalid_value}'' is not in T460A. Correct the value in MM02 or create the entry in table T460A (SM30 or
      the matching IMG node).'
  record_fix_template: 'Material {MARD.MATNR}, plant {MARD.WERKS}, storage location {MARD.LGORT}: LSOBS ''{actual_value}''
    is not configured in T460A.'
- id: MM431
  field: MLGN.VOMEM
  check_class: domain_value_check
  grain: MLGN
  severity: low
  dimension: validity
  message: Default for unit of measure from material master record (MLGN.VOMEM) is not a value of its SAP domain
  why_it_matters: Default for unit of measure from material master record accepts only the fixed values of domain LVS_VOME.
    The value drives which unit of measure the warehouse management transfer order defaults; the SAP screens never accept
    a value outside the domain, so it comes from a direct table load or a migration.
  rule_authority: best_practice
  sap_impact: Transfer orders default the wrong unit of measure.
  fix_map:
    __other__: Correct the value in MM02 Warehouse management 1; the allowed values are those of domain LVS_VOME.
  record_fix_template: 'Material {MLGN.MATNR}, warehouse {MLGN.LGNUM}: VOMEM is ''{actual_value}'', which is not a value of
    domain LVS_VOME.'
- id: MM432
  field: MLGN.MATNR
  check_class: exists_check
  grain: MLGN
  target_table: MARA
  target_fields:
  - MATNR
  severity: high
  dimension: consistency
  message: Warehouse management data exists for a material that does not exist in the material master
  why_it_matters: MLGN is a child of MARA. A row without its general data is an orphan from a partial load or deletion.
  rule_authority: sap_hard_constraint
  sap_impact: Warehouse tasks refer to a material that cannot be displayed or maintained.
  fix_map:
    __other__: Delete the orphan row or recreate the material.
  record_fix_template: 'Material {MLGN.MATNR}, warehouse {MLGN.LGNUM}: warehouse data for material ''{actual_value}'' which
    does not exist in MARA.'
- id: MM433
  field: MLGT.MATNR
  check_class: exists_check
  grain: MLGT
  fields:
  - MLGT.MATNR
  - MLGT.LGNUM
  target_table: MLGN
  target_fields:
  - MATNR
  - LGNUM
  severity: high
  dimension: consistency
  message: Storage type data exists without warehouse data for the material
  why_it_matters: MLGT holds the settings per storage type; MLGN holds the warehouse number data. Storage type data is only
    valid under an existing warehouse row.
  rule_authority: sap_hard_constraint
  sap_impact: Putaway and removal strategies find no warehouse-level control data and fall back to defaults.
  fix_map:
    __other__: Create the warehouse view in MM01/MM02 or delete the storage type row.
  record_fix_template: 'Material {MLGT.MATNR}, warehouse {MLGT.LGNUM}, storage type {MLGT.LGTYP}: storage type {MLGT.LGTYP}
    has no warehouse number data in MLGN.'
- id: MM434
  field: MARD.LABST
  check_class: group_sum_check
  grain: MARD
  amount: MCHB.CLABS
  group_keys:
    MCHB.MATNR: MARD.MATNR
    MCHB.WERKS: MARD.WERKS
    MCHB.LGORT: MARD.LGORT
  compare: ==
  tolerance: 0.001
  no_children: skip
  severity: high
  dimension: consistency
  message: Unrestricted storage location stock differs from the sum of its batches
  why_it_matters: For a batch-managed material the stock of a storage location is held per batch (MCHB). The sum over the
    batches must equal the storage location total in MARD.
  rule_authority: sap_hard_constraint
  sap_impact: The stock total and the batch stock differ; goods issue by batch cannot clear the full quantity.
  fix_map:
    __other__: Run the reconciliation report RM07MMFI / MBQ1 and correct with the standard stock correction.
  record_fix_template: 'Material {MARD.MATNR}, plant {MARD.WERKS}, storage location {MARD.LGORT}: unrestricted stock {MARD.LABST}
    differs from the sum of the batches.'
- id: MM435
  field: MARD.INSME
  check_class: group_sum_check
  grain: MARD
  amount: MCHB.CINSM
  group_keys:
    MCHB.MATNR: MARD.MATNR
    MCHB.WERKS: MARD.WERKS
    MCHB.LGORT: MARD.LGORT
  compare: ==
  tolerance: 0.001
  no_children: skip
  severity: medium
  dimension: consistency
  message: Quality inspection stock of a storage location differs from the sum of its batches
  why_it_matters: For a batch-managed material the quality inspection stock of a storage location is held per batch (MCHB.CINSM).
    The sum must equal the storage location total.
  rule_authority: sap_hard_constraint
  sap_impact: The stock total and the batch stock differ; goods movements out of inspection stock fail or post partially.
  fix_map:
    __other__: Run the reconciliation report MBQ1 and correct with the standard stock correction.
  record_fix_template: 'Material {MARD.MATNR}, plant {MARD.WERKS}, storage location {MARD.LGORT}: inspection stock {MARD.INSME}
    differs from the sum of the batches.'
- id: MM436
  field: MARD.SPEME
  check_class: group_sum_check
  grain: MARD
  amount: MCHB.CSPEM
  group_keys:
    MCHB.MATNR: MARD.MATNR
    MCHB.WERKS: MARD.WERKS
    MCHB.LGORT: MARD.LGORT
  compare: ==
  tolerance: 0.001
  no_children: skip
  severity: medium
  dimension: consistency
  message: Blocked stock of a storage location differs from the sum of its batches
  why_it_matters: For a batch-managed material the blocked stock of a storage location is held per batch (MCHB.CSPEM). The
    sum must equal the storage location total.
  rule_authority: sap_hard_constraint
  sap_impact: The stock total and the batch stock differ; unblocking by batch fails or posts partially.
  fix_map:
    __other__: Run the reconciliation report MBQ1 and correct with the standard stock correction.
  record_fix_template: 'Material {MARD.MATNR}, plant {MARD.WERKS}, storage location {MARD.LGORT}: blocked stock {MARD.SPEME}
    differs from the sum of the batches.'
- id: MM437
  field: MARD.DLINL
  check_class: freshness_check
  applies_when:
    MARD.LABST:
      gt: 0
  max_age_hours: 17520
  severity: low
  dimension: freshness
  message: Storage location has stock but no physical inventory for more than two years
  why_it_matters: The date of the last posted count (DLINL) tells when the stock was last verified. Stock not counted for
    two years has an unknown real quantity.
  rule_authority: best_practice
  sap_impact: Audit findings on inventory valuation; stock differences found late are larger and more costly.
  fix_map:
    __other__: Schedule a physical inventory in MI01 and post the count with MI07.
  record_fix_template: 'Material {MARD.MATNR}, plant {MARD.WERKS}, storage location {MARD.LGORT}: last physical inventory
    {actual_value} is more than two years ago.'
- id: MM438
  field: MARC.MTVFP
  check_class: null_check
  applies_when:
    MARC.PSTAT:
      contains_any:
      - V
  severity: medium
  dimension: completeness
  message: Sales view is maintained but the material has no availability check group
  why_it_matters: The checking group for the availability check (MTVFP) decides whether and how a sales order or delivery
    checks stock. Without it the system cannot run the check, or runs it under a default that the sales team has not agreed.
  rule_authority: best_practice
  sap_impact: Sales orders confirm quantities without a stock check, or the check stops with an error.
  fix_map:
    __blank__: 'Enter the checking group in MM02 Sales: General/plant.'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: sales view maintained but no availability checking group.'
- id: MM439
  field: MARC.MMSTD
  check_class: cross_field_check
  fail_when: '`MARC.MMSTD`.notna() & `MARC.MMSTA`.isna()'
  severity: low
  dimension: consistency
  message: Plant status valid-from date is set without a plant-specific status
  why_it_matters: MMSTD is the date from which the status in MMSTA applies. A date with no status is a remnant of a removed
    status.
  rule_authority: best_practice
  sap_impact: Status audits and change reports show a date that belongs to nothing.
  fix_map:
    __other__: Clear the date in MM02 Basic data 1 or enter the status.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: status valid-from date {actual_value} but no plant-specific
    status.'
- id: MM440
  field: MARA.MSTDV
  check_class: cross_field_check
  fail_when: '`MARA.MSTDV`.notna() & `MARA.MSTAV`.isna()'
  severity: low
  dimension: consistency
  message: Distribution-chain status valid-from date is set without a cross-distribution-chain status
  why_it_matters: MSTDV is the date from which the status in MSTAV applies. A date with no status is a remnant of a removed
    status.
  rule_authority: best_practice
  sap_impact: Status audits and change reports show a date that belongs to nothing.
  fix_map:
    __other__: 'Clear the date in MM02 Sales: Sales org. 1 or enter the status.'
  record_fix_template: 'Material {MARA.MATNR}: status valid-from date {actual_value} but no cross-distribution-chain status.'
- id: MM441
  field: MARD.LABST
  check_class: cross_field_check
  applies_when:
    MARA.LVORM:
    - X
  fail_when: '`MARD.LABST` > 0'
  severity: high
  dimension: lifecycle
  message: Material is flagged for deletion at client level but still holds unrestricted stock
  why_it_matters: A deletion flag on the general material data means the material is being retired. Stock still on hand blocks
    the deletion run (MM71) and the material cannot be archived.
  rule_authority: best_practice
  sap_impact: The deletion run skips the material; stock stays on the books under a material nobody plans.
  fix_map:
    __other__: Move the stock out (MIGO) or remove the deletion flag in MM06.
  record_fix_template: 'Material {MARD.MATNR}, plant {MARD.WERKS}, storage location {MARD.LGORT}: client-level deletion flag
    set, unrestricted stock {actual_value}.'
- id: MM442
  field: MARC.VINT1
  check_class: cross_field_check
  applies_when:
    MARC.VRMOD:
      blank: true
  fail_when: (`MARC.VINT1`.notna() & (`MARC.VINT1`.str.lstrip('0') != '')) | (`MARC.VINT2`.notna() & (`MARC.VINT2`.str.lstrip('0')
    != ''))
  severity: low
  dimension: consistency
  message: Consumption periods are entered but no consumption mode is set
  why_it_matters: The consumption periods VINT1 and VINT2 are read only when a consumption mode (VRMOD) tells MRP how to consume
    the forecast. Without a mode the periods have no effect.
  rule_authority: best_practice
  sap_impact: Planners believe forecast consumption is active while MRP plans forecast and sales orders together.
  fix_map:
    __other__: Set the consumption mode in MM02 MRP 3 or clear the periods.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: consumption periods {MARC.VINT1} / {MARC.VINT2} but no
    consumption mode.'
- id: MM443
  field: MARM.BRGEW
  check_class: cross_field_check
  fail_when: (`MARM.BRGEW` < 0) | (`MARM.VOLUM` < 0) | (`MARM.LAENG` < 0) | (`MARM.BREIT` < 0) | (`MARM.HOEHE` < 0)
  severity: medium
  dimension: accuracy
  message: Weight, volume or dimension of an alternative unit is negative
  why_it_matters: Weights, volumes and dimensions of a packaging unit are physical quantities and are never negative.
  rule_authority: best_practice
  sap_impact: Shipping weight, load planning and freight calculation for the packaging unit use the negative value.
  fix_map:
    __other__: Correct the value in MM02 > Additional data > Units of measure.
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: weight {MARM.BRGEW}, volume {MARM.VOLUM}, length {MARM.LAENG}
    contain a negative value.'
- id: MM444
  field: MEAN.MATNR
  check_class: exists_check
  grain: MEAN
  fields:
  - MEAN.MATNR
  - MEAN.MEINH
  target_table: MARM
  target_fields:
  - MATNR
  - MEINH
  severity: high
  dimension: consistency
  message: GTIN is assigned to a unit of measure that the material does not have
  why_it_matters: Each row in MEAN belongs to one alternative unit of the material. If that unit is missing in MARM, the GTIN
    points at a unit that cannot be used in a document.
  rule_authority: sap_hard_constraint
  sap_impact: Scanning returns a unit that the material cannot be posted in.
  fix_map:
    __other__: Create the unit in MM02 > Additional data > Units of measure or delete the GTIN.
  record_fix_template: 'Material {MEAN.MATNR}, unit {MEAN.MEINH}: GTIN {MEAN.EAN11} belongs to unit {MEAN.MEINH}, which is
    not a unit of the material.'
- id: MM445
  field: MEAN.MATNR
  check_class: uniqueness_check
  grain: MEAN
  applies_when:
    MEAN.HPEAN:
    - X
  fields:
  - MEAN.MATNR
  severity: medium
  dimension: uniqueness
  message: Material has more than one main GTIN
  why_it_matters: Exactly one GTIN per material may be flagged as the main GTIN (HPEAN). Two main GTINs make the choice of
    the number on labels and documents arbitrary.
  rule_authority: best_practice
  sap_impact: Labels and EDI messages print either number; partners receive different GTINs for one article.
  fix_map:
    __other__: Keep the flag on one GTIN only (MM02 > Additional data > Units of measure > International Article Numbers).
  record_fix_template: 'Material {MEAN.MATNR}, unit {MEAN.MEINH}: material has more than one main GTIN.'
- id: MM446
  field: CABN.MSEHI
  check_class: referential_check
  grain: CABN
  severity: low
  dimension: validity
  message: Unit of Measurement (CABN.MSEHI) is not defined in the system's configuration (T006)
  why_it_matters: Unit of Measurement is a key into customizing table T006. It is the unit of measure of the characteristic.
    A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Values with a unit cannot be converted or displayed.
  fix_map:
    __other__: '''{invalid_value}'' is not in T006. Correct the value in MM02 or create the entry in table T006 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Characteristic {CABN.ATNAM}: MSEHI ''{actual_value}'' is not configured in T006.'
- id: MM447
  field: MARA.MHDLP
  check_class: cross_field_check
  fail_when: '`MARA.MHDLP` > 100'
  severity: low
  dimension: accuracy
  message: Storage percentage of the shelf life is above 100 percent
  why_it_matters: The storage percentage (MHDLP) is the part of the shelf life that must remain after goods receipt. More
    than 100 percent cannot be met by any delivery.
  rule_authority: best_practice
  sap_impact: Goods receipt of every batch is rejected as short-dated.
  fix_map:
    __other__: Correct the percentage in MM02 Plant data / storage 1.
  record_fix_template: 'Material {MARA.MATNR}: storage percentage is {actual_value}.'
- id: MM448
  field: MAKT.MATNR
  check_class: exists_check
  grain: MAKT
  target_table: MARA
  target_fields:
  - MATNR
  severity: high
  dimension: consistency
  message: Material description exists for a material that is not in the material master
  why_it_matters: MAKT holds the descriptions of a material per language. A row whose material is missing from MARA is an
    orphan left behind by a partial deletion or a failed load.
  rule_authority: sap_hard_constraint
  sap_impact: The text is never shown and cannot be maintained or deleted from MM02; it blocks the archiving of the material
    number.
  fix_map:
    __other__: Delete the orphan description row or recreate the material.
  record_fix_template: 'Material {MAKT.MATNR}, language {MAKT.SPRAS}: description language {MAKT.SPRAS} belongs to material
    ''{actual_value}'', which is not in MARA.'
- id: MM449
  field: MARA.MATNR
  check_class: exists_check
  target_table: MAKT
  target_fields:
  - MATNR
  target_when:
    SPRAS:
    - E
  severity: high
  dimension: completeness
  message: Material has no English description
  why_it_matters: SAP shows the description in the logon language and falls back to nothing when that language has no text.
    English is the language the integration, EDI and reporting layers read, so a material without an English text appears
    blank there.
  rule_authority: best_practice
  sap_impact: Search help, purchase orders, outbound documents and interfaces show a blank material text.
  fix_map:
    __other__: Add the English description in MM02 (Additional data > Descriptions).
  record_fix_template: 'Material {MARA.MATNR}: no English description exists in MAKT.'
- id: MM450
  field: MAKT.MAKTX
  check_class: cross_field_check
  grain: MAKT
  fail_when: '`MAKT.MAKTX`.notna() & (`MAKT.MAKTX`.fillna('''').str.strip().str.len() < 4)'
  severity: low
  dimension: accuracy
  message: Material description is shorter than four characters
  why_it_matters: A description of one to three characters cannot identify a material. It usually comes from a placeholder
    or a truncated load.
  rule_authority: best_practice
  sap_impact: Buyers, planners and warehouse staff cannot identify the material; search by description finds too many hits.
  fix_map:
    __other__: Replace the description with the real name of the material in MM02 (Additional data > Descriptions).
  record_fix_template: 'Material {MAKT.MATNR}, language {MAKT.SPRAS}: description ''{actual_value}'' is too short.'
- id: MM451
  field: MAKT.MAKTX
  check_class: cross_field_check
  grain: MAKT
  fail_when: "`MAKT.MAKTX`.fillna('').str.contains('[\x01-\x1F]', regex=True)"
  severity: medium
  dimension: validity
  message: Material description contains control characters
  why_it_matters: Tabs, line feeds and other control characters come from pasted spreadsheet cells. They are invisible on
    screen but break EDI messages, labels and flat-file interfaces.
  rule_authority: best_practice
  sap_impact: Interfaces reject or split the record; labels and printed documents show broken lines.
  fix_map:
    __other__: Retype the description in MM02 (Additional data > Descriptions) without pasted line breaks.
  record_fix_template: 'Material {MAKT.MATNR}, language {MAKT.SPRAS}: description ''{actual_value}'' contains a control character.'
  auto_fix:
    steps:
    - op: regex_replace
      pattern: '[\x01-\x1f]'
      repl: ' '
    - op: collapse_spaces
    - op: strip
    confidence: medium
- id: MM452
  field: MARA.LAEDA
  check_class: cross_field_check
  fail_when: '`MARA.LAEDA`.notna() & `MARA.ERSDA`.notna() & (`MARA.LAEDA` < `MARA.ERSDA`)'
  severity: medium
  dimension: consistency
  message: Material was changed before it was created
  why_it_matters: The date of last change cannot be earlier than the creation date. The pair shows a record that was loaded
    with edited administrative data.
  rule_authority: best_practice
  sap_impact: Change reports and audit trails order the material history wrongly.
  fix_map:
    __other__: Correct the administrative dates in the source of the load; they cannot be maintained in MM02.
  record_fix_template: 'Material {MARA.MATNR}: created {MARA.ERSDA}, last changed {actual_value}.'
- id: MM453
  field: MARA.ERSDA
  check_class: cross_field_check
  fail_when: '`MARA.ERSDA`.notna() & (`MARA.ERSDA` > @today)'
  severity: medium
  dimension: validity
  message: Material creation date is in the future
  why_it_matters: A record cannot be created after today. A future creation date comes from a direct load with a wrong date.
  rule_authority: best_practice
  sap_impact: Date-driven selections such as new-material reports and release workflows skip the material.
  fix_map:
    __other__: Correct the creation date in the source of the load; it cannot be maintained in MM02.
  record_fix_template: 'Material {MARA.MATNR}: creation date {actual_value} is in the future.'
- id: MM454
  field: MARA.MSTAE
  check_class: referential_check
  severity: high
  dimension: validity
  message: Cross-Plant Material Status (MARA.MSTAE) is not defined in the system's configuration (T141)
  why_it_matters: Cross-Plant Material Status is a key into customizing table T141. It is the cross-plant material status
    that blocks or warns in each business function. A value that is not configured there cannot be interpreted by the functions
    that read it.
  rule_authority: sap_hard_constraint
  sap_impact: The status cannot be interpreted; the blocks it should set do not take effect.
  fix_map:
    __other__: '''{invalid_value}'' is not in T141. Correct the value in MM02 or create the entry in table T141 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MARA.MATNR}: MSTAE ''{actual_value}'' is not configured in T141.'
  auto_fix:
    steps:
    - op: strip
    - op: upper
    confidence: medium
- id: MM455
  field: MARA.KZUMW
  check_class: domain_value_check
  severity: low
  dimension: validity
  message: 'Indicator: Environmentally relevant (MARA.KZUMW) is not a value of its SAP domain'
  why_it_matters: 'Indicator: Environmentally relevant accepts only the fixed values of domain XFELD. The value drives whether
    the environment-relevant flag of the material is evaluated; the SAP screens never accept a value outside the domain, so
    it comes from a direct table load or a migration.'
  rule_authority: best_practice
  sap_impact: Environmental reports and hazardous-goods screening misclassify the material.
  fix_map:
    __other__: Correct the value in MM02 Basic data 2; the allowed values are those of domain XFELD.
  record_fix_template: 'Material {MARA.MATNR}: KZUMW is ''{actual_value}'', which is not a value of domain XFELD.'
  auto_fix:
    steps:
    - op: strip
    - op: map
      values:
        x: X
        Y: X
        y: X
        '1': X
        'TRUE': X
        'true': X
        __other__: null
    confidence: medium
- id: MM456
  field: MARC.SERNP
  check_class: cross_field_check
  fail_when: '`MARC.SERNP`.notna() & `MARA.SERLV`.isna()'
  severity: medium
  dimension: consistency
  message: Serial number profile is set but the material has no serial number level
  why_it_matters: The serial number profile makes the material serialized in the plant. The serial number level (SERLV) decides
    how explicitly the numbers are assigned. Without a level, the profile is read with a default that nobody chose.
  rule_authority: best_practice
  sap_impact: Goods movements and deliveries ask for serial numbers in a way that differs between plants or fail.
  fix_map:
    __other__: Enter the serial number level in MM02 Basic data 2 or remove the profile.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: serial profile {actual_value} but no serial number level.'
- id: MM457
  field: MARA.MATNR
  check_class: exists_check
  fields:
  - MARA.MATNR
  - MARA.MEINS
  target_table: MARM
  target_fields:
  - MATNR
  - MEINH
  severity: low
  dimension: completeness
  message: Base unit of measure has no row in the unit of measure table
  why_it_matters: SAP writes a row for the base unit (factor 1:1) in MARM when a material is saved. A material without that
    row was created by a direct load and fails in functions that read the units from MARM.
  rule_authority: best_practice
  sap_impact: Unit conversions, EAN assignment and warehouse unit lookups fail for the base unit.
  fix_map:
    __other__: Open the material in MM02 > Additional data > Units of measure and save it, so that the base unit row is created.
  record_fix_template: 'Material {MARA.MATNR}: base unit {MARA.MEINS} has no row in MARM.'
- id: MM458
  field: MEAN.EAN11
  check_class: null_check
  grain: MEAN
  applies_when:
    MEAN.MATNR:
      populated: true
  severity: medium
  dimension: completeness
  message: GTIN row exists without an article number
  why_it_matters: A row in the EAN table (MEAN) has to carry the GTIN. A row without it keeps the unit of measure flagged
    as having a GTIN but cannot be scanned.
  rule_authority: best_practice
  sap_impact: Scanning and EDI lookups by GTIN return nothing for the unit; the row is dead weight in the key.
  fix_map:
    __blank__: Enter the GTIN or delete the row (MM02 > Additional data > Units of measure > International Article Numbers).
  record_fix_template: 'Material {MEAN.MATNR}, unit {MEAN.MEINH}: GTIN is blank.'
- id: MM459
  field: MCH1.MATNR
  check_class: exists_check
  grain: MCH1
  target_table: MARA
  target_fields:
  - MATNR
  severity: high
  dimension: consistency
  message: Batch exists for a material that is not in the material master
  why_it_matters: MCH1 holds the cross-plant batch master. A batch whose material is missing from MARA is an orphan.
  rule_authority: sap_hard_constraint
  sap_impact: The batch cannot be selected, displayed or archived; it blocks the deletion of the material number.
  fix_map:
    __other__: Delete the orphan batch or recreate the material.
  record_fix_template: 'Material {MCH1.MATNR}, batch {MCH1.CHARG}: batch {MCH1.CHARG} belongs to material ''{actual_value}'',
    which is not in MARA.'
- id: MM460
  field: MCH1.CHARG
  check_class: cross_field_check
  grain: MCH1
  fail_when: '`MARA.XCHPF`.isna()'
  severity: high
  dimension: consistency
  message: Batch exists for a material that is not batch managed
  why_it_matters: Batches are created only for materials with the batch management indicator. A batch under a material without
    the indicator is a leftover from a removed indicator or from a direct load.
  rule_authority: best_practice
  sap_impact: Goods movements ignore the batch; stock sits in a batch that no function can select.
  fix_map:
    __other__: Set the batch management indicator on the material (MSC1N / MM02) or delete the batch.
  record_fix_template: 'Material {MCH1.MATNR}, batch {MCH1.CHARG}: batch {actual_value} exists but the material has no batch
    management indicator.'
- id: MM461
  field: MCH1.VFDAT
  check_class: cross_field_check
  grain: MCH1
  fail_when: '`MCH1.VFDAT`.notna() & `MCH1.HSDAT`.notna() & (`MCH1.VFDAT` < `MCH1.HSDAT`)'
  severity: medium
  dimension: consistency
  message: Batch shelf life expiration date is before the date of manufacture
  why_it_matters: A batch cannot expire before it is made. The pair usually comes from swapped dates in a batch load.
  rule_authority: best_practice
  sap_impact: Expiry-based picking, FEFO and restricted-use logic treat the batch as expired from day one.
  fix_map:
    __other__: Correct the dates in MSC2N.
  record_fix_template: 'Material {MCH1.MATNR}, batch {MCH1.CHARG}: date of manufacture {MCH1.HSDAT}, expiration {actual_value}.'
- id: MM462
  field: MCH1.LAEDA
  check_class: cross_field_check
  grain: MCH1
  fail_when: '`MCH1.LAEDA`.notna() & `MCH1.ERSDA`.notna() & (`MCH1.LAEDA` < `MCH1.ERSDA`)'
  severity: low
  dimension: consistency
  message: Batch was changed before it was created
  why_it_matters: The date of last change cannot be earlier than the creation date of the batch.
  rule_authority: best_practice
  sap_impact: Change reports and audit trails order the batch history wrongly.
  fix_map:
    __other__: Correct the administrative dates in the source of the load.
  record_fix_template: 'Material {MCH1.MATNR}, batch {MCH1.CHARG}: created {MCH1.ERSDA}, last changed {actual_value}.'
- id: MM463
  field: MCH1.VFDAT
  check_class: cross_field_check
  grain: MCH1
  fail_when: '`MCH1.VFDAT`.notna() & (`MCH1.VFDAT` < @today) & `MCH1.LVORM`.isna() & `MCH1.ZUSTD`.isna()'
  severity: medium
  dimension: lifecycle
  message: Batch is past its expiration date but not restricted or flagged
  why_it_matters: 'An expired batch must be taken out of use: restricted-use stock, a batch status or a deletion flag. Otherwise
    it is still selected by batch determination and picked for delivery.'
  rule_authority: best_practice
  sap_impact: Expired product is delivered to customers or consumed in production.
  fix_map:
    __other__: Set the batch to restricted use or blocked in MSC2N, or move the stock to blocked stock.
  record_fix_template: 'Material {MCH1.MATNR}, batch {MCH1.CHARG}: batch expired on {actual_value} and is still unrestricted.'
- id: MM464
  field: MCH1.HERKL
  check_class: referential_check
  grain: MCH1
  severity: medium
  dimension: validity
  message: Country of origin of the material (MCH1.HERKL) is not defined in the system's configuration (T005)
  why_it_matters: Country of origin of the material is a key into customizing table T005. It is the country of origin of the
    batch for customs and certificates of origin. A value that is not configured there cannot be interpreted by the functions
    that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Origin statements for the batch are rejected.
  fix_map:
    __other__: '''{invalid_value}'' is not in T005. Correct the value in MM02 or create the entry in table T005 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MCH1.MATNR}, batch {MCH1.CHARG}: HERKL ''{actual_value}'' is not configured in T005.'
  auto_fix:
    steps:
    - op: strip
    - op: upper
    confidence: high
- id: MM465
  field: KLAH.CLASS
  check_class: null_check
  grain: KLAH
  severity: high
  dimension: completeness
  message: Class has no class name
  why_it_matters: The class name is the key a user types in CL20N and in search helps. A class header without a name cannot
    be found.
  rule_authority: best_practice
  sap_impact: Objects cannot be assigned to the class from the screens; searches by class return nothing.
  fix_map:
    __blank__: Enter the class name in CL02 or delete the class header.
  record_fix_template: 'Class {KLAH.CLASS}, class type {KLAH.KLART}: class name is blank.'
- id: MM466
  field: KLAH.KLAGR
  check_class: referential_check
  grain: KLAH
  severity: low
  dimension: validity
  message: Class Group (KLAH.KLAGR) is not defined in the system's configuration (TCLG)
  why_it_matters: Class Group is a key into customizing table TCLG. It groups classes for authorisation and selection. A value
    that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Authorisation checks on the class group cannot be evaluated.
  fix_map:
    __other__: '''{invalid_value}'' is not in TCLG. Correct the value in MM02 or create the entry in table TCLG (SM30 or the
      matching IMG node).'
  record_fix_template: 'Class {KLAH.CLASS}, class type {KLAH.KLART}: KLAGR ''{actual_value}'' is not configured in TCLG.'
- id: MM467
  field: CABN.ATKLA
  check_class: referential_check
  grain: CABN
  severity: low
  dimension: validity
  message: Chars Group (CABN.ATKLA) is not defined in the system's configuration (TCMG)
  why_it_matters: Chars Group is a key into customizing table TCMG. It groups characteristics for authorisation and selection.
    A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Authorisation checks on the characteristic group cannot be evaluated.
  fix_map:
    __other__: '''{invalid_value}'' is not in TCMG. Correct the value in MM02 or create the entry in table TCMG (SM30 or the
      matching IMG node).'
  record_fix_template: 'Characteristic {CABN.ATNAM}: ATKLA ''{actual_value}'' is not configured in TCMG.'
- id: MM468
  field: INOB.KLART
  check_class: referential_check
  grain: INOB
  severity: high
  dimension: validity
  message: Class Type (INOB.KLART) is not defined in the system's configuration (TCLA)
  why_it_matters: Class Type is a key into customizing table TCLA. Every classified object is stored under the class type
    of its assignment. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: The object link cannot be resolved in classification.
  fix_map:
    __other__: '''{invalid_value}'' is not in TCLA. Correct the value in MM02 or create the entry in table TCLA (SM30 or the
      matching IMG node).'
  record_fix_template: 'Classification link of object {INOB.OBJEK}, class type {INOB.KLART}: KLART ''{actual_value}'' is not
    configured in TCLA.'
- id: MM469
  field: INOB.OBTAB
  check_class: referential_check
  grain: INOB
  severity: high
  dimension: validity
  message: Name of database table for object (INOB.OBTAB) is not defined in the system's configuration (TCLO)
  why_it_matters: Name of database table for object is a key into customizing table TCLO. It names the database table of the
    classified object (MARA for materials). A value that is not configured there cannot be interpreted by the functions that
    read it.
  rule_authority: sap_hard_constraint
  sap_impact: The object link cannot be resolved to its master data.
  fix_map:
    __other__: '''{invalid_value}'' is not in TCLO. Correct the value in MM02 or create the entry in table TCLO (SM30 or the
      matching IMG node).'
  record_fix_template: 'Classification link of object {INOB.OBJEK}, class type {INOB.KLART}: OBTAB ''{actual_value}'' is not
    configured in TCLO.'
- id: MM470
  field: KSSK.DATUB
  check_class: cross_field_check
  grain: KSSK
  fail_when: '`KSSK.DATUB` < `KSSK.DATUV`'
  severity: medium
  dimension: consistency
  message: Class assignment valid-to date is before its valid-from date
  why_it_matters: An assignment applies between DATUV and DATUB. An end date before the start date means the assignment never
    applies.
  rule_authority: sap_hard_constraint
  sap_impact: The object is invisible in every date-dependent class search.
  fix_map:
    __other__: Correct the validity dates in CL24N or CL20N.
  record_fix_template: 'Class assignment of object {KSSK.OBJEK}, class type {KSSK.KLART}: valid-from {KSSK.DATUV}, valid-to
    {actual_value}.'
- id: MM471
  field: AUSP.ATWRT
  check_class: cross_field_check
  grain: AUSP
  fail_when: '`AUSP.ATWRT`.isna() & `AUSP.ATFLV`.isna()'
  severity: low
  dimension: completeness
  message: Characteristic value row holds neither a character nor a numeric value
  why_it_matters: An AUSP row exists to carry the value of a characteristic. A row with no character value and no numeric
    value is empty.
  rule_authority: best_practice
  sap_impact: Searches by characteristic match the object with an empty value; reports show a blank value.
  fix_map:
    __other__: Enter the value in CL20N or delete the empty row.
  record_fix_template: 'Object {AUSP.OBJEK}, characteristic {AUSP.ATINN}: characteristic {AUSP.ATINN} has no value.'
- id: MM472
  field: CAWN.ATINN
  check_class: exists_check
  grain: CAWN
  target_table: CABN
  target_fields:
  - ATINN
  severity: high
  dimension: consistency
  message: Allowed characteristic value belongs to a characteristic that does not exist
  why_it_matters: CAWN holds the allowed values of a characteristic. If the characteristic master (CABN) is gone, the value
    is an orphan.
  rule_authority: sap_hard_constraint
  sap_impact: The value cannot be maintained or displayed in CT04 and distorts value help.
  fix_map:
    __other__: Delete the orphan values or recreate the characteristic.
  record_fix_template: 'Characteristic internal number {CAWN.ATINN}, value counter {CAWN.ATZHL}: characteristic ''{actual_value}''
    does not exist in CABN.'
- id: MM473
  field: CAWN.ATWRT
  check_class: cross_field_check
  grain: CAWN
  fail_when: '`CAWN.ATWRT`.isna() & `CAWN.ATFLV`.isna()'
  severity: low
  dimension: completeness
  message: Allowed characteristic value has neither a character nor a numeric value
  why_it_matters: A value row in CAWN exists to be offered in the value help. A row with neither value is empty.
  rule_authority: best_practice
  sap_impact: The value help shows an empty line.
  fix_map:
    __other__: Enter the value in CT04 or delete the row.
  record_fix_template: 'Characteristic internal number {CAWN.ATINN}, value counter {CAWN.ATZHL}: allowed value {CAWN.ATZHL}
    of characteristic {CAWN.ATINN} is empty.'
- id: MM474
  field: MVKE.VKORG
  check_class: exists_check
  fields:
  - MVKE.VKORG
  - MVKE.VTWEG
  target_table: TVKOV
  target_fields:
  - VKORG
  - VTWEG
  severity: high
  dimension: consistency
  message: Sales data exists for a sales organization and distribution channel that is not linked
  why_it_matters: A material is extended to a sales organization and distribution channel pair only if the pair exists in
    TVKOV. Without the pair, no sales order can use the data.
  rule_authority: sap_hard_constraint
  sap_impact: The material cannot be sold in that combination; sales order entry rejects it.
  fix_map:
    __other__: Remove the sales row or assign the distribution channel to the sales organization (OVXK).
  record_fix_template: 'Material {MVKE.MATNR}, sales org {MVKE.VKORG}, distribution channel {MVKE.VTWEG}: sales organization
    {MVKE.VKORG} / channel {MVKE.VTWEG} is not assigned.'
- id: MM475
  field: MVKE.MVGR4
  check_class: referential_check
  severity: low
  dimension: validity
  message: Material group 4 (MVKE.MVGR4) is not defined in the system's configuration (TVM4)
  why_it_matters: Material group 4 is a key into customizing table TVM4. It is material group 4 of the sales view, used for
    pricing and statistics. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Pricing and statistics selections on the group return nothing.
  fix_map:
    __other__: '''{invalid_value}'' is not in TVM4. Correct the value in MM02 or create the entry in table TVM4 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MVKE.MATNR}, sales org {MVKE.VKORG}, distribution channel {MVKE.VTWEG}: MVGR4 ''{actual_value}''
    is not configured in TVM4.'
- id: MM476
  field: MVKE.MVGR5
  check_class: referential_check
  severity: low
  dimension: validity
  message: Material group 5 (MVKE.MVGR5) is not defined in the system's configuration (TVM5)
  why_it_matters: Material group 5 is a key into customizing table TVM5. It is material group 5 of the sales view, used for
    pricing and statistics. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Pricing and statistics selections on the group return nothing.
  fix_map:
    __other__: '''{invalid_value}'' is not in TVM5. Correct the value in MM02 or create the entry in table TVM5 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MVKE.MATNR}, sales org {MVKE.VKORG}, distribution channel {MVKE.VTWEG}: MVGR5 ''{actual_value}''
    is not configured in TVM5.'
- id: MM477
  field: MVKE.BONUS
  check_class: referential_check
  severity: low
  dimension: validity
  message: Volume rebate group (MVKE.BONUS) is not defined in the system's configuration (TVBO)
  why_it_matters: Volume rebate group is a key into customizing table TVBO. It is the volume-based rebate group of the material.
    A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Rebate agreements that select by group never include the material.
  fix_map:
    __other__: '''{invalid_value}'' is not in TVBO. Correct the value in MM02 or create the entry in table TVBO (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MVKE.MATNR}, sales org {MVKE.VKORG}, distribution channel {MVKE.VTWEG}: BONUS ''{actual_value}''
    is not configured in TVBO.'
- id: MM478
  field: MVKE.PROVG
  check_class: referential_check
  severity: low
  dimension: validity
  message: Commission group (MVKE.PROVG) is not defined in the system's configuration (TVPR)
  why_it_matters: Commission group is a key into customizing table TVPR. It is the commission group of the material. A value
    that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Commission is not calculated for the material.
  fix_map:
    __other__: '''{invalid_value}'' is not in TVPR. Correct the value in MM02 or create the entry in table TVPR (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MVKE.MATNR}, sales org {MVKE.VKORG}, distribution channel {MVKE.VTWEG}: PROVG ''{actual_value}''
    is not configured in TVPR.'
- id: MM479
  field: MVKE.PMATN
  check_class: exists_check
  target_table: MARA
  target_fields:
  - MATNR
  severity: medium
  dimension: consistency
  message: Pricing reference material does not exist
  why_it_matters: PMATN names the material from which pricing is taken. If it is missing from MARA, condition records cannot
    be found.
  rule_authority: sap_hard_constraint
  sap_impact: Sales orders for the material get no price and stop on pricing errors.
  fix_map:
    __other__: 'Correct the pricing reference material in MM02 Sales: Sales org. 2.'
  record_fix_template: 'Material {MVKE.MATNR}, sales org {MVKE.VKORG}, distribution channel {MVKE.VTWEG}: pricing reference
    material ''{actual_value}'' does not exist.'
- id: MM480
  field: MVKE.SCMNG
  check_class: cross_field_check
  fail_when: (`MVKE.SCMNG` < 0) | (`MVKE.LFMNG` < 0) | (`MVKE.AUMNG` < 0)
  severity: medium
  dimension: accuracy
  message: Minimum order, delivery or rounding quantity of the sales view is negative
  why_it_matters: Minimum order quantity, minimum delivery quantity and delivery unit rounding are quantities that are never
    negative.
  rule_authority: best_practice
  sap_impact: Sales orders reject all quantities or round to a negative value.
  fix_map:
    __other__: 'Correct the quantity in MM02 Sales: Sales org. 1 and 2.'
  record_fix_template: 'Material {MVKE.MATNR}, sales org {MVKE.VKORG}, distribution channel {MVKE.VTWEG}: minimum order {MVKE.AUMNG},
    delivery unit {MVKE.SCMNG}, minimum delivery {MVKE.LFMNG}.'
- id: MM481
  field: MLAN.TAXIM
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Tax indicator for material (Purchasing) (MLAN.TAXIM) is not defined in the system's configuration (TMKM1)
  why_it_matters: Tax indicator for material (Purchasing) is a key into customizing table TMKM1. It is the tax indicator of
    the material in purchasing. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Tax determination in purchase orders cannot find the tax code.
  fix_map:
    __other__: '''{invalid_value}'' is not in TMKM1. Correct the value in MM02 or create the entry in table TMKM1 (SM30 or
      the matching IMG node).'
  record_fix_template: 'Material {MLAN.MATNR}, tax country {MLAN.ALAND}: TAXIM ''{actual_value}'' is not configured in TMKM1.'
- id: MM482
  field: MARC.MATNR
  check_class: exists_check
  applies_when:
    MARC.BESKZ:
    - F
  fields:
  - MARC.MATNR
  target_table: EINA
  target_fields:
  - MATNR
  severity: low
  dimension: completeness
  message: Externally procured material has no purchasing info record
  why_it_matters: A material procured externally normally has an info record that holds the supplier price, delivery time
    and order unit. Without one, buyers type the price in every purchase order or rely on contracts only.
  rule_authority: best_practice
  sap_impact: Price and delivery time proposals are missing in purchase orders; source determination has no record to read.
  fix_map:
    __other__: Create the info record in ME11 or confirm that the material is bought on contracts only.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: externally procured material has no info record.'
- id: MM483
  field: MARC.EXPME
  check_class: referential_check
  severity: low
  dimension: validity
  message: Unit of measure for commodity code (foreign trade) (MARC.EXPME) is not defined in the system's configuration (T006)
  why_it_matters: Unit of measure for commodity code (foreign trade) is a key into customizing table T006. It is the unit
    of measure for the commodity code or intrastat number. A value that is not configured there cannot be interpreted by the
    functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Foreign trade documents show the quantity in a unit the system cannot convert.
  fix_map:
    __other__: '''{invalid_value}'' is not in T006. Correct the value in MM02 or create the entry in table T006 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: EXPME ''{actual_value}'' is not configured in T006.'
- id: MM484
  field: MARC.FRTME
  check_class: referential_check
  severity: low
  dimension: validity
  message: Production unit (MARC.FRTME) is not defined in the system's configuration (T006)
  why_it_matters: Production unit is a key into customizing table T006. It is the production unit of the material. A value
    that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Quantities in the production unit cannot be converted.
  fix_map:
    __other__: '''{invalid_value}'' is not in T006. Correct the value in MM02 or create the entry in table T006 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: FRTME ''{actual_value}'' is not configured in T006.'
- id: MM485
  field: EINE.INFNR
  check_class: exists_check
  grain: EINE
  target_table: EINA
  target_fields:
  - INFNR
  severity: high
  dimension: consistency
  message: Info record purchasing data exists without a general info record
  why_it_matters: EINE holds the purchasing organization data of an info record; EINA holds the header. Without the header
    the record is an orphan.
  rule_authority: sap_hard_constraint
  sap_impact: Purchasing cannot read the record and archiving of the material or supplier fails.
  fix_map:
    __other__: Delete the orphan row or recreate the info record header.
  record_fix_template: 'Info record {EINE.INFNR}, purchasing organization {EINE.EKORG}, plant {EINE.WERKS}: info record ''{actual_value}''
    has no general data in EINA.'
- id: MM486
  field: EINA.MATNR
  check_class: exists_check
  grain: EINA
  target_table: MARA
  target_fields:
  - MATNR
  severity: high
  dimension: consistency
  message: Info record is created for a material that is not in the material master
  why_it_matters: An info record links a supplier to a material. If the material is gone, the record is an orphan.
  rule_authority: sap_hard_constraint
  sap_impact: Source determination offers a supplier for a material that no longer exists; archiving fails.
  fix_map:
    __other__: Delete the info record in ME15 or recreate the material.
  record_fix_template: 'Info record {EINA.INFNR}, material {EINA.MATNR}: info record {EINA.INFNR} references material ''{actual_value}'',
    which is not in MARA.'
- id: MM487
  field: EINE.NETPR
  check_class: cross_field_check
  grain: EINE
  fail_when: (`EINE.NETPR` < 0) | (`EINE.PEINH` <= 0)
  severity: high
  dimension: accuracy
  message: Info record price is negative or the price unit is not positive
  why_it_matters: The net price is a positive amount per price unit. A negative price or a price unit of zero produces a negative
    or undefined order value.
  rule_authority: best_practice
  sap_impact: Purchase orders and invoice verification compute a wrong value or stop on a division by zero.
  fix_map:
    __other__: Correct the price and price unit in ME12.
  record_fix_template: 'Info record {EINE.INFNR}, purchasing organization {EINE.EKORG}, plant {EINE.WERKS}: net price {actual_value}
    per {EINE.PEINH}.'
- id: MM488
  field: EINE.UEBTO
  check_class: cross_field_check
  grain: EINE
  fail_when: (`EINE.UEBTO` > 100) | (`EINE.UNTTO` > 100)
  severity: medium
  dimension: validity
  message: Info record over or under delivery tolerance is above 100 percent
  why_it_matters: A tolerance is a percentage of the order quantity. A value above 100 percent allows the supplier to deliver
    more than double, or none at all, without any warning.
  rule_authority: best_practice
  sap_impact: Goods receipt accepts quantities far off the order; invoice verification and stock distort.
  fix_map:
    __other__: Correct the tolerance in ME12.
  record_fix_template: 'Info record {EINE.INFNR}, purchasing organization {EINE.EKORG}, plant {EINE.WERKS}: over delivery
    {actual_value}, under delivery {EINE.UNTTO}.'
- id: MM489
  field: EINE.APLFZ
  check_class: cross_field_check
  grain: EINE
  fail_when: (`EINE.APLFZ` < 0) | (`EINE.NORBM` < 0) | (`EINE.MINBM` < 0)
  severity: medium
  dimension: accuracy
  message: Info record planned delivery time or minimum order quantity is negative
  why_it_matters: The planned delivery time in days and the minimum and standard order quantities are never negative.
  rule_authority: best_practice
  sap_impact: MRP proposes order dates and quantities with a negative lead time.
  fix_map:
    __other__: Correct the value in ME12.
  record_fix_template: 'Info record {EINE.INFNR}, purchasing organization {EINE.EKORG}, plant {EINE.WERKS}: delivery time
    {actual_value}, standard quantity {EINE.NORBM}, minimum quantity {EINE.MINBM}.'
- id: MM490
  field: EINA.UMREZ
  check_class: cross_field_check
  grain: EINA
  fail_when: (`EINA.UMREZ` <= 0) | (`EINA.UMREN` <= 0)
  severity: medium
  dimension: accuracy
  message: Info record order unit conversion is not positive
  why_it_matters: The conversion from the order unit to the base unit is a ratio of two positive numbers.
  rule_authority: best_practice
  sap_impact: Purchase order quantities are converted to zero or cause a division error.
  fix_map:
    __other__: Correct the conversion in ME12.
  record_fix_template: 'Info record {EINA.INFNR}, material {EINA.MATNR}: conversion {actual_value} : {EINA.UMREN}.'
- id: MM491
  field: MARC.DISPR
  check_class: referential_check
  severity: medium
  dimension: validity
  message: 'Material: MRP profile (MARC.DISPR) is not defined in the system''s configuration (MDIP)'
  why_it_matters: 'Material: MRP profile is a key into customizing table MDIP. It is the MRP profile whose values are copied
    into the planning data. A value that is not configured there cannot be interpreted by the functions that read it.'
  rule_authority: sap_hard_constraint
  sap_impact: The profile cannot be applied; the planning values it should carry are blank.
  fix_map:
    __other__: '''{invalid_value}'' is not in MDIP. Correct the value in MM02 or create the entry in table MDIP (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: DISPR ''{actual_value}'' is not configured in MDIP.'
- id: MM492
  field: MARC.RWPRO
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Range of coverage profile (MARC.RWPRO) is not defined in the system's configuration (T438R)
  why_it_matters: Range of coverage profile is a key into customizing table T438R. It is the range of coverage profile that
    MRP uses for the days' supply. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: MRP calculates the days' supply and exception messages without the profile.
  fix_map:
    __other__: '''{invalid_value}'' is not in T438R. Correct the value in MM02 or create the entry in table T438R (SM30 or
      the matching IMG node).'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: RWPRO ''{actual_value}'' is not configured in T438R.'
- id: MM493
  field: MARC.SHPRO
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Period profile for safety time (MARC.SHPRO) is not defined in the system's configuration (T438V)
  why_it_matters: Period profile for safety time is a key into customizing table T438V. It is the period profile for safety
    time. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: MRP ignores the safety time for the material.
  fix_map:
    __other__: '''{invalid_value}'' is not in T438V. Correct the value in MM02 or create the entry in table T438V (SM30 or
      the matching IMG node).'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: SHPRO ''{actual_value}'' is not configured in T438V.'
- id: MM494
  field: MARC.EPRIO
  check_class: referential_check
  severity: low
  dimension: validity
  message: Stock determination group (MARC.EPRIO) is not defined in the system's configuration (T434G)
  why_it_matters: Stock determination group is a key into customizing table T434G. It is the stock determination group. A
    value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Stock determination cannot find a rule for the material.
  fix_map:
    __other__: '''{invalid_value}'' is not in T434G. Correct the value in MM02 or create the entry in table T434G (SM30 or
      the matching IMG node).'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: EPRIO ''{actual_value}'' is not configured in T434G.'
- id: MM495
  field: MARC.MRPPP
  check_class: referential_check
  severity: low
  dimension: validity
  message: PPC planning calendar (MARC.MRPPP) is not defined in the system's configuration (T439G)
  why_it_matters: PPC planning calendar is a key into customizing table T439G. It is the planning calendar used by production
    planning (PPC). A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Planning periods for the material cannot be built.
  fix_map:
    __other__: '''{invalid_value}'' is not in T439G. Correct the value in MM02 or create the entry in table T439G (SM30 or
      the matching IMG node).'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: MRPPP ''{actual_value}'' is not configured in T439G.'
- id: MM496
  field: MARC.SAUFT
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: 'Ind.: Repetitive mfg allowed (MARC.SAUFT) is not a value of its SAP domain'
  why_it_matters: 'Ind.: Repetitive mfg allowed accepts only the fixed values of domain XFELD. The value drives whether the
    material is produced with repetitive manufacturing; the SAP screens never accept a value outside the domain, so it comes
    from a direct table load or a migration.'
  rule_authority: best_practice
  sap_impact: Production planning treats the material as discrete or repetitive wrongly.
  fix_map:
    __other__: Correct the value in MM02 Work scheduling; the allowed values are those of domain XFELD.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: SAUFT is ''{actual_value}'', which is not a value of domain
    XFELD.'
  auto_fix:
    steps:
    - op: strip
    - op: upper
    - op: map
      values:
        X: X
        Y: X
        'YES': X
        'TRUE': X
        '1': X
        N: ''
        'NO': ''
        'FALSE': ''
        '0': ''
        __other__: null
    confidence: medium
- id: MM497
  field: MDMA.DISMM
  check_class: referential_check
  grain: MDMA
  severity: high
  dimension: validity
  message: MRP Type (MDMA.DISMM) is not defined in the system's configuration (T438A)
  why_it_matters: MRP Type is a key into customizing table T438A. It is the MRP type of the MRP area, the key to the planning
    procedure. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: MRP does not plan the material in that MRP area.
  fix_map:
    __other__: '''{invalid_value}'' is not in T438A. Correct the value in MM02 or create the entry in table T438A (SM30 or
      the matching IMG node).'
  record_fix_template: 'Material {MDMA.MATNR}, plant {MDMA.WERKS}, MRP area {MDMA.BERID}: DISMM ''{actual_value}'' is not
    configured in T438A.'
- id: MM498
  field: MDMA.DISLS
  check_class: referential_check
  grain: MDMA
  severity: medium
  dimension: validity
  message: Lot size (materials planning) (MDMA.DISLS) is not defined in the system's configuration (T439A)
  why_it_matters: Lot size (materials planning) is a key into customizing table T439A. It is the lot-sizing procedure of the
    MRP area. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: MRP cannot size the lots in that MRP area.
  fix_map:
    __other__: '''{invalid_value}'' is not in T439A. Correct the value in MM02 or create the entry in table T439A (SM30 or
      the matching IMG node).'
  record_fix_template: 'Material {MDMA.MATNR}, plant {MDMA.WERKS}, MRP area {MDMA.BERID}: DISLS ''{actual_value}'' is not
    configured in T439A.'
- id: MM499
  field: MDMA.MATNR
  check_class: exists_check
  grain: MDMA
  fields:
  - MDMA.MATNR
  - MDMA.WERKS
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  severity: high
  dimension: consistency
  message: MRP area data exists for a material that is not extended to the plant
  why_it_matters: MDMA holds planning data per MRP area. The plant row (MARC) must exist for it to be read.
  rule_authority: sap_hard_constraint
  sap_impact: MRP ignores the area data; the planner believes the area is planned.
  fix_map:
    __other__: Extend the material to the plant or delete the MRP area row.
  record_fix_template: 'Material {MDMA.MATNR}, plant {MDMA.WERKS}, MRP area {MDMA.BERID}: MRP area {MDMA.BERID} of plant {MDMA.WERKS}
    has no plant data.'
- id: MM500
  field: MARC.MATNR
  check_class: exists_check
  applies_when:
    MARC.BESKZ:
    - E
  fields:
  - MARC.MATNR
  - MARC.WERKS
  target_table: MAST
  target_fields:
  - MATNR
  - WERKS
  severity: medium
  dimension: completeness
  message: In-house produced material has no bill of material in the plant
  why_it_matters: A material with procurement type E is produced from components. Without a BOM link (MAST) a planned or production
    order has nothing to explode.
  rule_authority: best_practice
  sap_impact: MRP creates planned orders with no components; production orders cannot be released.
  fix_map:
    __other__: Create the BOM in CS01 or correct the procurement type.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: in-house produced material has no bill of material.'
- id: MM501
  field: MARC.MATNR
  check_class: exists_check
  applies_when:
    MARC.BESKZ:
    - E
  fields:
  - MARC.MATNR
  - MARC.WERKS
  target_table: MAPL
  target_fields:
  - MATNR
  - WERKS
  severity: low
  dimension: completeness
  message: In-house produced material has no routing in the plant
  why_it_matters: A material with procurement type E is produced in steps. Without a task list assignment (MAPL) the order
    has no operations and no capacity requirements.
  rule_authority: best_practice
  sap_impact: Scheduling and costing run without operations; production lead time is only the default.
  fix_map:
    __other__: Create the routing in CA01 or confirm that the material is produced without operations.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: in-house produced material has no routing.'
- id: MM502
  field: MARC.MATNR
  check_class: exists_check
  applies_when:
    MARC.SAUFT:
    - X
  fields:
  - MARC.MATNR
  - MARC.WERKS
  target_table: MKAL
  target_fields:
  - MATNR
  - WERKS
  severity: medium
  dimension: completeness
  message: Material allowed for repetitive manufacturing has no production version
  why_it_matters: Repetitive manufacturing posts to a production version (MKAL). Without one, no backflush is possible for
    the plant.
  rule_authority: best_practice
  sap_impact: Goods receipt and backflush for repetitive manufacturing stop with an error.
  fix_map:
    __other__: Create the production version in C223.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: repetitive manufacturing is allowed but no production version
    exists.'
- id: MM503
  field: MKAL.MATNR
  check_class: exists_check
  grain: MKAL
  fields:
  - MKAL.MATNR
  - MKAL.WERKS
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  severity: high
  dimension: consistency
  message: Production version exists for a material that is not extended to the plant
  why_it_matters: A production version (MKAL) belongs to the plant data of the material. Without MARC the version is an orphan.
  rule_authority: sap_hard_constraint
  sap_impact: Production orders and planned orders cannot use the version.
  fix_map:
    __other__: Delete the production version or extend the material to the plant.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: production version {MKAL.VERID}
    has no plant data.'
- id: MM504
  field: MKAL.BDATU
  check_class: cross_field_check
  grain: MKAL
  fail_when: '`MKAL.BDATU` < `MKAL.ADATU`'
  severity: high
  dimension: consistency
  message: Production version valid-to date is before its valid-from date
  why_it_matters: A version is valid between ADATU and BDATU. An end before the start means the version is never valid.
  rule_authority: sap_hard_constraint
  sap_impact: MRP and order creation find no valid production version.
  fix_map:
    __other__: Correct the validity dates in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: valid-from {MKAL.ADATU},
    valid-to {actual_value}.'
- id: MM505
  field: MKAL.BSTMA
  check_class: cross_field_check
  grain: MKAL
  fail_when: (`MKAL.BSTMA` > 0) & (`MKAL.BSTMA` < `MKAL.BSTMI`)
  severity: medium
  dimension: consistency
  message: Production version maximum lot size is below its minimum lot size
  why_it_matters: The lot-size range of a production version has a minimum and a maximum. A maximum below the minimum matches
    no lot.
  rule_authority: best_practice
  sap_impact: MRP never selects the version for any lot size.
  fix_map:
    __other__: Correct the lot-size range in C223.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: minimum {MKAL.BSTMI},
    maximum {actual_value}.'
- id: MM506
  field: MKAL.STLAL
  check_class: exists_check
  grain: MKAL
  applies_when:
    MKAL.STLAL:
      populated: true
  fields:
  - MKAL.MATNR
  - MKAL.WERKS
  - MKAL.STLAN
  - MKAL.STLAL
  target_table: MAST
  target_fields:
  - MATNR
  - WERKS
  - STLAN
  - STLAL
  severity: high
  dimension: consistency
  message: Production version points at a bill of material that does not exist
  why_it_matters: The production version names a BOM usage and alternative. If no such BOM is assigned to the material in
    the plant, order creation has no BOM to explode.
  rule_authority: best_practice
  sap_impact: Production orders for the version have no components.
  fix_map:
    __other__: Correct the BOM usage and alternative in C223 or create the BOM.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: BOM usage {MKAL.STLAN},
    alternative {actual_value} is not assigned to the material.'
- id: MM507
  field: MKAL.PLNNR
  check_class: exists_check
  grain: MKAL
  fields:
  - MKAL.PLNTY
  - MKAL.PLNNR
  target_table: MAPL
  target_fields:
  - PLNTY
  - PLNNR
  severity: high
  dimension: consistency
  message: Production version points at a routing that does not exist
  why_it_matters: The production version names a task list type and group. If no such task list is assigned to a material,
    order creation has no operations.
  rule_authority: best_practice
  sap_impact: Production orders for the version have no operations.
  fix_map:
    __other__: Correct the task list in C223 or create the routing.
  record_fix_template: 'Material {MKAL.MATNR}, plant {MKAL.WERKS}, production version {MKAL.VERID}: task list type {MKAL.PLNTY},
    group {actual_value} is not assigned to any material.'
- id: MM508
  field: MAST.MATNR
  check_class: exists_check
  grain: MAST
  fields:
  - MAST.MATNR
  - MAST.WERKS
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  severity: high
  dimension: consistency
  message: BOM assignment exists for a material that is not extended to the plant
  why_it_matters: MAST assigns a BOM to the plant data of a material. Without MARC the assignment is an orphan.
  rule_authority: sap_hard_constraint
  sap_impact: The BOM cannot be exploded for the material; the assignment blocks deletion of the BOM.
  fix_map:
    __other__: Delete the assignment or extend the material to the plant.
  record_fix_template: 'Material {MAST.MATNR}, plant {MAST.WERKS}, BOM usage {MAST.STLAN}: BOM {MAST.STLNR} is assigned to
    a material without plant data.'
- id: MM509
  field: MAST.STLNR
  check_class: exists_check
  grain: MAST
  target_table: STKO
  target_fields:
  - STLNR
  severity: high
  dimension: consistency
  message: BOM assignment points at a bill of material header that does not exist
  why_it_matters: MAST links a material to a BOM number held in STKO. Without the header the link is an orphan.
  rule_authority: sap_hard_constraint
  sap_impact: Order creation and MRP explosion fail for the material.
  fix_map:
    __other__: Delete the assignment or recreate the BOM.
  record_fix_template: 'Material {MAST.MATNR}, plant {MAST.WERKS}, BOM usage {MAST.STLAN}: BOM ''{actual_value}'' has no header
    in STKO.'
- id: MM510
  field: MAPL.MATNR
  check_class: exists_check
  grain: MAPL
  fields:
  - MAPL.MATNR
  - MAPL.WERKS
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  severity: high
  dimension: consistency
  message: Routing assignment exists for a material that is not extended to the plant
  why_it_matters: MAPL assigns a task list to the plant data of a material. Without MARC the assignment is an orphan.
  rule_authority: sap_hard_constraint
  sap_impact: The routing cannot be used for the material; the assignment blocks deletion of the task list.
  fix_map:
    __other__: Delete the assignment or extend the material to the plant.
  record_fix_template: 'Material {MAPL.MATNR}, plant {MAPL.WERKS}, task list group {MAPL.PLNNR}: task list {MAPL.PLNNR} is
    assigned to a material without plant data.'
- id: MM511
  field: MBEW.VERPR
  check_class: cross_field_check
  fail_when: (`MBEW.VERPR` > 0) & (`MBEW.STPRS` > 0) & ((`MBEW.VERPR` > 10 * `MBEW.STPRS`) | (`MBEW.STPRS` > 10 * `MBEW.VERPR`))
  severity: low
  dimension: accuracy
  message: Moving average price and standard price differ by more than a factor of ten
  why_it_matters: Both prices are kept for every valuated material, and they normally stay in the same range. A factor of
    ten shows a decimal slip in one of them.
  rule_authority: best_practice
  sap_impact: Stock is valued at the wrong price; price differences post to the wrong amount at the next settlement.
  fix_map:
    __other__: Check both prices in MM02 Accounting 1 and correct the wrong one.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: moving average price {actual_value}, standard
    price {MBEW.STPRS}.'
- id: MM512
  field: MBEW.LBKUM
  check_class: cross_field_check
  fail_when: '`MBEW.LBKUM` < 0'
  severity: medium
  dimension: lifecycle
  message: Valuated stock quantity is negative
  why_it_matters: Negative stock means more was issued than received. It values at a negative amount and distorts the moving
    average price.
  rule_authority: best_practice
  sap_impact: Inventory value and cost of goods sold are wrong; the moving average price drifts.
  fix_map:
    __other__: Post the missing goods receipt or correct the issue (MIGO), then check the price.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: valuated stock {actual_value}.'
- id: MM513
  field: MBEW.ZPLP1
  check_class: cross_field_check
  fail_when: ((`MBEW.ZPLP1` > 0) & `MBEW.ZPLD1`.isna()) | ((`MBEW.ZPLP2` > 0) & `MBEW.ZPLD2`.isna()) | ((`MBEW.ZPLP3` > 0)
    & `MBEW.ZPLD3`.isna())
  severity: low
  dimension: consistency
  message: Planned price is entered without its valid-from date
  why_it_matters: A planned price (ZPLP1 to ZPLP3) is read by costing only for the date in ZPLD1 to ZPLD3. Without the date
    the price is never used.
  rule_authority: best_practice
  sap_impact: Costing runs with the wrong price; the planned price looks maintained but has no effect.
  fix_map:
    __other__: Enter the date in MM02 Costing 2 or clear the price.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: planned prices {actual_value} / {MBEW.ZPLP2} /
    {MBEW.ZPLP3} with dates {MBEW.ZPLD1} / {MBEW.ZPLD2} / {MBEW.ZPLD3}.'
- id: MM514
  field: MBEW.ZPLD1
  check_class: cross_field_check
  fail_when: (`MBEW.ZPLD1`.notna() & ~(`MBEW.ZPLP1` > 0)) | (`MBEW.ZPLD2`.notna() & ~(`MBEW.ZPLP2` > 0)) | (`MBEW.ZPLD3`.notna()
    & ~(`MBEW.ZPLP3` > 0))
  severity: low
  dimension: consistency
  message: Planned price date is entered without a planned price
  why_it_matters: A planned price date has no meaning without its price. It marks a price that was removed without clearing
    the date.
  rule_authority: best_practice
  sap_impact: Planned price reports show a date with no price behind it.
  fix_map:
    __other__: Enter the price in MM02 Costing 2 or clear the date.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: planned price dates {actual_value} / {MBEW.ZPLD2}
    / {MBEW.ZPLD3} with prices {MBEW.ZPLP1} / {MBEW.ZPLP2} / {MBEW.ZPLP3}.'
- id: MM515
  field: MBEW.LFMON
  check_class: cross_field_check
  fail_when: '`MBEW.LFMON`.notna() & ~`MBEW.LFMON`.isin([''01'',''02'',''03'',''04'',''05'',''06'',''07'',''08'',''09'',''10'',''11'',''12''])'
  severity: medium
  dimension: validity
  message: Current valuation period is not a month between 1 and 12
  why_it_matters: The current period (LFMON) and fiscal year (LFGJA) tell the system into which period goods movements post.
    A period outside 1 to 12 is invalid for a calendar-month posting period.
  rule_authority: best_practice
  sap_impact: Goods movements post to the wrong period or are rejected by the period check.
  fix_map:
    __other__: Correct the period with the period close transaction (MMPV) or a correction of the load.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: current period {actual_value}, fiscal year {MBEW.LFGJA}.'
- id: MM516
  field: MBEW.QKLAS
  check_class: referential_check
  severity: low
  dimension: validity
  message: Valuation Class for Project Stock (MBEW.QKLAS) is not defined in the system's configuration (T025)
  why_it_matters: Valuation Class for Project Stock is a key into customizing table T025. It is the valuation class for project
    stock. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Costing cannot find the account assignment of the class.
  fix_map:
    __other__: '''{invalid_value}'' is not in T025. Correct the value in MM02 or create the entry in table T025 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: QKLAS ''{actual_value}'' is not configured in
    T025.'
- id: MM517
  field: MBEW.HKMAT
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: Material-related origin (MBEW.HKMAT) is not a value of its SAP domain
  why_it_matters: Material-related origin accepts only the fixed values of domain HKMAT. The value drives whether the material
    origin is carried into the costing of materials that use it; the SAP screens never accept a value outside the domain,
    so it comes from a direct table load or a migration.
  rule_authority: best_practice
  sap_impact: Cost estimates split the material cost incorrectly by origin.
  fix_map:
    __other__: Correct the value in MM02 Costing 1; the allowed values are those of domain HKMAT.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: HKMAT is ''{actual_value}'', which is not a value
    of domain HKMAT.'
- id: MM518
  field: MBEW.MLMAA
  check_class: cross_field_check
  applies_when:
    MBEW.MLMAA:
    - X
  fail_when: '`MBEW.MLAST`.isna()'
  severity: high
  dimension: consistency
  message: Material ledger is active but no price determination is set
  why_it_matters: A material with an active material ledger needs a price determination (1 transaction-based, 2 single-level,
    3 multilevel). Without it the period close cannot decide how to price the material.
  rule_authority: best_practice
  sap_impact: The material ledger period close skips the material or stops with an error.
  fix_map:
    __other__: Set the price determination in MM02 Accounting 1.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: material ledger is active, price determination
    {MBEW.MLAST} is blank.'
- id: MM519
  field: MBEW.MATNR
  check_class: exists_check
  applies_when:
    MBEW.MLMAA:
    - X
  fields:
  - MBEW.MATNR
  - MBEW.BWKEY
  target_table: CKMLHD
  target_fields:
  - MATNR
  - BWKEY
  severity: high
  dimension: completeness
  message: Material ledger is active but the material has no material ledger header
  why_it_matters: A valuation row with the material ledger active needs a material ledger number in CKMLHD. Without it no
    period record can be written for the material.
  rule_authority: best_practice
  sap_impact: The material ledger period close and actual costing skip the material; goods movements may stop.
  fix_map:
    __other__: Run the material ledger activation program (CKMM) or correct the indicator.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: material ledger is active but no ledger number
    exists.'
- id: MM520
  field: CKMLHD.MATNR
  check_class: exists_check
  grain: CKMLHD
  fields:
  - CKMLHD.MATNR
  - CKMLHD.BWKEY
  target_table: MBEW
  target_fields:
  - MATNR
  - BWKEY
  severity: high
  dimension: consistency
  message: Material ledger header exists for a valuation that does not exist
  why_it_matters: CKMLHD numbers the material ledger records per material and valuation area. Without a valuation row (MBEW)
    the header is an orphan.
  rule_authority: sap_hard_constraint
  sap_impact: The material ledger carries a number that no document can post to.
  fix_map:
    __other__: Delete the ledger header via the material ledger tools or recreate the valuation.
  record_fix_template: 'Material ledger number {CKMLHD.KALNR}, material {CKMLHD.MATNR}, valuation area {CKMLHD.BWKEY}: ledger
    number {CKMLHD.KALNR} has no valuation row.'
- id: MM522
  field: MLGN.LGNUM
  check_class: referential_check
  grain: MLGN
  severity: high
  dimension: validity
  message: Warehouse Number / Warehouse Complex (MLGN.LGNUM) is not defined in the system's configuration (T300)
  why_it_matters: Warehouse Number / Warehouse Complex is a key into customizing table T300. Every warehouse management row
    is kept per warehouse number. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Putaway, picking and stock transfers for the warehouse cannot be planned.
  fix_map:
    __other__: '''{invalid_value}'' is not in T300. Correct the value in MM02 or create the entry in table T300 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MLGN.MATNR}, warehouse {MLGN.LGNUM}: LGNUM ''{actual_value}'' is not configured in T300.'
- id: MM523
  field: MLGN.LVSME
  check_class: referential_check
  grain: MLGN
  severity: medium
  dimension: validity
  message: Warehouse Management Unit of Measure (MLGN.LVSME) is not defined in the system's configuration (T006)
  why_it_matters: Warehouse Management Unit of Measure is a key into customizing table T006. It is the unit in which stock
    is kept in the warehouse. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Transfer orders cannot convert quantities to the warehouse unit.
  fix_map:
    __other__: '''{invalid_value}'' is not in T006. Correct the value in MM02 or create the entry in table T006 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MLGN.MATNR}, warehouse {MLGN.LGNUM}: LVSME ''{actual_value}'' is not configured in T006.'
- id: MM524
  field: MLGN.LVSME
  check_class: exists_check
  grain: MLGN
  fields:
  - MLGN.MATNR
  - MLGN.LVSME
  target_table: MARM
  target_fields:
  - MATNR
  - MEINH
  severity: high
  dimension: consistency
  message: Warehouse unit of measure is not a unit of the material
  why_it_matters: The unit the warehouse keeps the stock in must be the base unit or an alternative unit in MARM.
  rule_authority: sap_hard_constraint
  sap_impact: Transfer orders ask for a quantity in a unit the material cannot convert to.
  fix_map:
    __other__: Create the unit in MM02 > Additional data > Units of measure or correct the warehouse unit.
  record_fix_template: 'Material {MLGN.MATNR}, warehouse {MLGN.LGNUM}: warehouse unit {actual_value} is not a unit of the
    material.'
- id: MM525
  field: MLGN.LGBKZ
  check_class: referential_check
  grain: MLGN
  severity: low
  dimension: validity
  message: Storage Section Indicators (MLGN.LGBKZ) is not defined in the system's configuration (T304)
  why_it_matters: Storage Section Indicators is a key into customizing table T304. It is the storage section indicator used
    in putaway and picking. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Putaway cannot find the storage section.
  fix_map:
    __other__: '''{invalid_value}'' is not in T304. Correct the value in MM02 or create the entry in table T304 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MLGN.MATNR}, warehouse {MLGN.LGNUM}: LGBKZ ''{actual_value}'' is not configured in T304.'
- id: MM526
  field: MLGN.LTKZE
  check_class: referential_check
  grain: MLGN
  severity: medium
  dimension: validity
  message: Storage type indicator for stock placement (MLGN.LTKZE) is not defined in the system's configuration (T305)
  why_it_matters: Storage type indicator for stock placement is a key into customizing table T305. It is the storage type
    indicator for stock placement. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Putaway strategies cannot find a storage type.
  fix_map:
    __other__: '''{invalid_value}'' is not in T305. Correct the value in MM02 or create the entry in table T305 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MLGN.MATNR}, warehouse {MLGN.LGNUM}: LTKZE ''{actual_value}'' is not configured in T305.'
- id: MM527
  field: MLGN.LTKZA
  check_class: referential_check
  grain: MLGN
  severity: medium
  dimension: validity
  message: Storage type indicator for stock removal (MLGN.LTKZA) is not defined in the system's configuration (T305)
  why_it_matters: Storage type indicator for stock removal is a key into customizing table T305. It is the storage type indicator
    for stock removal. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Picking strategies cannot find a storage type.
  fix_map:
    __other__: '''{invalid_value}'' is not in T305. Correct the value in MM02 or create the entry in table T305 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MLGN.MATNR}, warehouse {MLGN.LGNUM}: LTKZA ''{actual_value}'' is not configured in T305.'
- id: MM528
  field: MLGN.BSSKZ
  check_class: referential_check
  grain: MLGN
  severity: low
  dimension: validity
  message: Special movement indicator for warehouse management (MLGN.BSSKZ) is not defined in the system's configuration (T306)
  why_it_matters: Special movement indicator for warehouse management is a key into customizing table T306. It is the special
    movement indicator of the warehouse management view. A value that is not configured there cannot be interpreted by the
    functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Special movements for the material cannot be interpreted.
  fix_map:
    __other__: '''{invalid_value}'' is not in T306. Correct the value in MM02 or create the entry in table T306 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MLGN.MATNR}, warehouse {MLGN.LGNUM}: BSSKZ ''{actual_value}'' is not configured in T306.'
- id: MM529
  field: MLGN.PLKPT
  check_class: referential_check
  grain: MLGN
  severity: low
  dimension: validity
  message: Picking storage type for rough-cut and detailed planning (MLGN.PLKPT) is not defined in the system's configuration
    (T301)
  why_it_matters: Picking storage type for rough-cut and detailed planning is a key into customizing table T301. It is the
    picking storage type for rough-cut and detailed planning. A value that is not configured there cannot be interpreted by
    the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Planning cannot find the picking storage type.
  fix_map:
    __other__: '''{invalid_value}'' is not in T301. Correct the value in MM02 or create the entry in table T301 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MLGN.MATNR}, warehouse {MLGN.LGNUM}: PLKPT ''{actual_value}'' is not configured in T301.'
- id: MM530
  field: MLGN.LHMG1
  check_class: cross_field_check
  grain: MLGN
  fail_when: ((`MLGN.LHMG1` > 0) & `MLGN.LHME1`.isna()) | ((`MLGN.LHMG2` > 0) & `MLGN.LHME2`.isna()) | ((`MLGN.LHMG3` > 0)
    & `MLGN.LHME3`.isna())
  severity: low
  dimension: consistency
  message: Loading equipment quantity is entered without its unit
  why_it_matters: A loading equipment quantity (LHMG1 to LHMG3) needs a unit (LHME1 to LHME3) to say what is loaded on one
    pallet or carrier.
  rule_authority: best_practice
  sap_impact: Putaway quantities on a pallet are computed with no unit; transfer orders stop.
  fix_map:
    __other__: Enter the unit in MM02 Warehouse management 2 or clear the quantity.
  record_fix_template: 'Material {MLGN.MATNR}, warehouse {MLGN.LGNUM}: loading quantities {actual_value} / {MLGN.LHMG2} /
    {MLGN.LHMG3} with units {MLGN.LHME1} / {MLGN.LHME2} / {MLGN.LHME3}.'
- id: MM531
  field: MLGT.LGTYP
  check_class: referential_check
  grain: MLGT
  severity: high
  dimension: validity
  message: Storage Type (MLGT.LGTYP) is not defined in the system's configuration (T301)
  why_it_matters: Storage Type is a key into customizing table T301. Every storage type row is kept per storage type of the
    warehouse. A value that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Putaway and picking cannot find the storage type.
  fix_map:
    __other__: '''{invalid_value}'' is not in T301. Correct the value in MM02 or create the entry in table T301 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MLGT.MATNR}, warehouse {MLGT.LGNUM}, storage type {MLGT.LGTYP}: LGTYP ''{actual_value}''
    is not configured in T301.'
- id: MM532
  field: MLGT.LPMIN
  check_class: cross_field_check
  grain: MLGT
  fail_when: (`MLGT.LPMAX` > 0) & (`MLGT.LPMIN` > `MLGT.LPMAX`)
  severity: medium
  dimension: consistency
  message: Storage type minimum bin quantity is above its maximum
  why_it_matters: A bin quantity range has a minimum and a maximum. A minimum above the maximum matches no quantity.
  rule_authority: best_practice
  sap_impact: Replenishment triggers permanently; putaway never finds room.
  fix_map:
    __other__: Correct the range in MM02 Warehouse management 2.
  record_fix_template: 'Material {MLGT.MATNR}, warehouse {MLGT.LGNUM}, storage type {MLGT.LGTYP}: minimum {actual_value},
    maximum {MLGT.LPMAX}.'
- id: MM533
  field: MLGT.MAMNG
  check_class: cross_field_check
  grain: MLGT
  fail_when: (`MLGT.MAMNG` < 0) | (`MLGT.NSMNG` < 0) | (`MLGT.RDMNG` < 0)
  severity: medium
  dimension: accuracy
  message: Storage type maximum, replenishment or control quantity is negative
  why_it_matters: Maximum bin quantity, minimum replenishment quantity and control quantity are never negative.
  rule_authority: best_practice
  sap_impact: Putaway and replenishment compute with a negative quantity.
  fix_map:
    __other__: Correct the quantity in MM02 Warehouse management 2.
  record_fix_template: 'Material {MLGT.MATNR}, warehouse {MLGT.LGNUM}, storage type {MLGT.LGTYP}: maximum {actual_value},
    replenishment {MLGT.NSMNG}, control {MLGT.RDMNG}.'
- id: MM534
  field: MLGT.KOBER
  check_class: referential_check
  grain: MLGT
  severity: low
  dimension: validity
  message: Picking Area (MLGT.KOBER) is not defined in the system's configuration (T30A)
  why_it_matters: Picking Area is a key into customizing table T30A. It is the picking area within the storage type. A value
    that is not configured there cannot be interpreted by the functions that read it.
  rule_authority: sap_hard_constraint
  sap_impact: Picking from the area fails.
  fix_map:
    __other__: '''{invalid_value}'' is not in T30A. Correct the value in MM02 or create the entry in table T30A (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {MLGT.MATNR}, warehouse {MLGT.LGNUM}, storage type {MLGT.LGTYP}: KOBER ''{actual_value}''
    is not configured in T30A.'
- id: MM535
  field: QMAT.AKTIV
  check_class: domain_value_check
  grain: QMAT
  severity: medium
  dimension: validity
  message: Inspection Type - Material Combination is Active (QMAT.AKTIV) is not a value of its SAP domain
  why_it_matters: Inspection Type - Material Combination is Active accepts only the fixed values of domain QKZ. The value
    drives whether the inspection type is active for the material; the SAP screens never accept a value outside the domain,
    so it comes from a direct table load or a migration.
  rule_authority: best_practice
  sap_impact: Inspection lots are created, or not, against the plan of the quality team.
  fix_map:
    __other__: Correct the value in QA08; the allowed values are those of domain QKZ.
  record_fix_template: 'Material {QMAT.MATNR}, plant {QMAT.WERKS}, inspection type {QMAT.ART}: AKTIV is ''{actual_value}'',
    which is not a value of domain QKZ.'
  auto_fix:
    steps:
    - op: strip
    - op: upper
    confidence: high
- id: MM536
  field: QMAT.SPROZ
  check_class: cross_field_check
  grain: QMAT
  fail_when: '`QMAT.SPROZ` > 100'
  severity: medium
  dimension: validity
  message: Inspection percentage is above 100
  why_it_matters: The inspection percentage is the share of the lot that is inspected. More than 100 percent cannot be sampled.
  rule_authority: best_practice
  sap_impact: Inspection lots demand a sample larger than the lot.
  fix_map:
    __other__: Correct the percentage in QA08.
  record_fix_template: 'Material {QMAT.MATNR}, plant {QMAT.WERKS}, inspection type {QMAT.ART}: inspection percentage {actual_value}.'
- id: MM537
  field: QMAT.QPMAT
  check_class: cross_field_check
  grain: QMAT
  fail_when: '`QMAT.QPMAT` > 100'
  severity: low
  dimension: validity
  message: Allowed scrap share in the inspection lot is above 100 percent
  why_it_matters: The allowed share of scrap is a percentage of the lot. More than 100 percent is no limit.
  rule_authority: best_practice
  sap_impact: The scrap check of the inspection lot never triggers.
  fix_map:
    __other__: Correct the percentage in QA08.
  record_fix_template: 'Material {QMAT.MATNR}, plant {QMAT.WERKS}, inspection type {QMAT.ART}: allowed scrap {actual_value}
    percent.'
- id: MM538
  field: QMAT.CHG
  check_class: referential_check
  grain: QMAT
  severity: low
  dimension: validity
  message: Control of Inspection Lot Creation (Lot Summary) (QMAT.CHG) is not defined in the system's configuration (TQ32C)
  why_it_matters: Control of Inspection Lot Creation (Lot Summary) is a key into customizing table TQ32C. It controls how
    inspection lots are summarised. A value that is not configured there cannot be interpreted by the functions that read
    it.
  rule_authority: sap_hard_constraint
  sap_impact: Inspection lots are created individually or summarised against the plan.
  fix_map:
    __other__: '''{invalid_value}'' is not in TQ32C. Correct the value in MM02 or create the entry in table TQ32C (SM30 or
      the matching IMG node).'
  record_fix_template: 'Material {QMAT.MATNR}, plant {QMAT.WERKS}, inspection type {QMAT.ART}: CHG ''{actual_value}'' is not
    configured in TQ32C.'
- id: MM539
  field: QMAT.QKZVERF
  check_class: referential_check
  grain: QMAT
  severity: low
  dimension: validity
  message: Procedure for Calculating Quality Score (QMAT.QKZVERF) is not defined in the system's configuration (TQ06)
  why_it_matters: Procedure for Calculating Quality Score is a key into customizing table TQ06. It is the procedure for the
    quality score of the inspection type. A value that is not configured there cannot be interpreted by the functions that
    read it.
  rule_authority: sap_hard_constraint
  sap_impact: The quality score cannot be calculated.
  fix_map:
    __other__: '''{invalid_value}'' is not in TQ06. Correct the value in MM02 or create the entry in table TQ06 (SM30 or the
      matching IMG node).'
  record_fix_template: 'Material {QMAT.MATNR}, plant {QMAT.WERKS}, inspection type {QMAT.ART}: QKZVERF ''{actual_value}''
    is not configured in TQ06.'
- id: MM540
  field: MLGN.LVORM
  check_class: cross_field_check
  grain: MLGN
  applies_when:
    MARA.LVORM:
    - X
  fail_when: '`MLGN.LVORM`.isna()'
  severity: medium
  dimension: lifecycle
  message: Warehouse view is active although the material is flagged for deletion
  why_it_matters: A material flagged for deletion at client level is being retired. Its warehouse rows should carry the flag
    as well.
  rule_authority: best_practice
  sap_impact: Putaway and picking remain possible for a retired material.
  fix_map:
    __other__: Set the deletion flag on the warehouse view (MM06) or remove the client-level flag.
  record_fix_template: 'Material {MLGN.MATNR}, warehouse {MLGN.LGNUM}: warehouse view is active, client-level deletion flag
    is set.'
  auto_fix:
    steps:
    - op: set
      value: X
    confidence: medium
- id: MM541
  field: MLGT.LVORM
  check_class: cross_field_check
  grain: MLGT
  applies_when:
    MLGN.LVORM:
    - X
  fail_when: '`MLGT.LVORM`.isna()'
  severity: low
  dimension: lifecycle
  message: Storage type data is active although the warehouse view is flagged for deletion
  why_it_matters: A warehouse row flagged for deletion should carry the flag on all its storage type rows.
  rule_authority: best_practice
  sap_impact: Putaway into a storage type of a retired warehouse view stays possible.
  fix_map:
    __other__: Set the deletion flag on the storage type data (MM06).
  record_fix_template: 'Material {MLGT.MATNR}, warehouse {MLGT.LGNUM}, storage type {MLGT.LGTYP}: storage type data is active,
    warehouse deletion flag is set.'
  auto_fix:
    steps:
    - op: set
      value: X
    confidence: medium
- id: MM542
  field: MARC.NFMAT
  check_class: cross_field_check
  fail_when: '`MARC.NFMAT`.notna() & `MARC.KZAUS`.isna()'
  severity: medium
  dimension: consistency
  message: Follow-up material is set but the plant has no discontinuation indicator
  why_it_matters: The follow-up material (NFMAT) only takes effect when the discontinuation indicator (KZAUS) is set. Without
    the indicator MRP never passes requirements on to the successor, and the entry is silently ignored.
  rule_authority: best_practice
  sap_impact: Requirements are not transferred to the successor; the old material keeps being planned and bought.
  fix_map:
    __other__: Set the discontinuation indicator in MM02 MRP 4 (Discontinued parts) or clear the follow-up material.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: follow-up material {actual_value} but no discontinuation
    indicator.'
- id: MM543
  field: MARC.AUSDT
  check_class: cross_field_check
  fail_when: '`MARC.AUSDT`.notna() & `MARC.KZAUS`.isna()'
  severity: medium
  dimension: consistency
  message: Effective-out date is set but the plant has no discontinuation indicator
  why_it_matters: The effective-out date only works with the discontinuation indicator. Without it, MRP plans the material
    after the date as if nothing was set.
  rule_authority: best_practice
  sap_impact: The planned phase-out does not happen; the material is still ordered after the date.
  fix_map:
    __other__: Set the discontinuation indicator in MM02 MRP 4 or clear the date.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: effective-out date {actual_value} but no discontinuation
    indicator.'
- id: MM544
  field: MARC.NFMAT
  check_class: exists_check
  fields:
  - MARC.NFMAT
  - MARC.WERKS
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  severity: high
  dimension: consistency
  message: Follow-up material does not exist in the material master or is not in the same plant
  why_it_matters: The follow-up material must be a material that is extended to the plant of the discontinued material. If
    it is not, MRP cannot transfer requirements.
  rule_authority: sap_hard_constraint
  sap_impact: Requirements are lost or the MRP run reports an error for the material; shortages follow.
  fix_map:
    __other__: Create the successor, extend it to the plant (MM01 / MM02) or correct the follow-up material.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: follow-up material ''{actual_value}'' is not extended to
    plant {MARC.WERKS} or does not exist.'
- id: MM545
  field: MARC.NFMAT
  check_class: exists_check
  target_table: MARA
  target_fields:
  - MATNR
  severity: high
  dimension: consistency
  message: Follow-up material does not exist in the material master
  why_it_matters: A follow-up material that is missing from MARA is a typing error or a deleted material.
  rule_authority: sap_hard_constraint
  sap_impact: Requirements go to a material that does not exist; MRP stops with an error for the part.
  fix_map:
    __other__: Correct the follow-up material in MM02 MRP 4.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: follow-up material ''{actual_value}'' does not exist in
    MARA.'
- id: MM546
  field: MARC.NFMAT
  check_class: exists_check
  negate: true
  target_table: MARA
  target_fields:
  - MATNR
  target_when:
    LVORM:
    - X
  severity: high
  dimension: lifecycle
  message: Follow-up material is flagged for deletion at client level
  why_it_matters: A successor that is flagged for deletion is being retired itself. Requirements moved to it end up on a dying
    part.
  rule_authority: best_practice
  sap_impact: Purchasing and production continue on a material that will be archived.
  fix_map:
    __other__: Choose an active successor in MM02 MRP 4.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: follow-up material ''{actual_value}'' is flagged for deletion.'
- id: MM547
  field: MARC.NFMAT
  check_class: exists_check
  negate: true
  fields:
  - MARC.NFMAT
  - MARC.WERKS
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    LVORM:
    - X
  severity: high
  dimension: lifecycle
  message: Follow-up material is flagged for deletion in the plant
  why_it_matters: A successor with a plant-level deletion flag cannot be planned or procured in that plant.
  rule_authority: best_practice
  sap_impact: MRP skips the successor; the transferred requirement is never covered.
  fix_map:
    __other__: Choose an active successor, or remove the deletion flag in MM02 (plant data).
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: follow-up material ''{actual_value}'' is flagged for deletion
    in plant {MARC.WERKS}.'
- id: MM548
  field: MARC.NFMAT
  check_class: exists_check
  negate: true
  fields:
  - MARC.NFMAT
  - MARC.WERKS
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    MMSTA:
      populated: true
  severity: high
  dimension: lifecycle
  message: Follow-up material is blocked by its plant-specific material status
  why_it_matters: A plant-specific status (MMSTA) blocks procurement or production for the successor in that plant.
  rule_authority: best_practice
  sap_impact: Purchase orders and production orders for the successor are rejected or warn.
  fix_map:
    __other__: Release the successor (clear MMSTA in MM02) or choose another successor.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: follow-up material ''{actual_value}'' has plant status
    in plant {MARC.WERKS}.'
- id: MM549
  field: MARC.NFMAT
  check_class: exists_check
  negate: true
  fields:
  - MARC.NFMAT
  - MARC.WERKS
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    DISMM:
    - ND
  severity: medium
  dimension: lifecycle
  message: Follow-up material has MRP type ND, so it is not planned
  why_it_matters: An MRP type of ND excludes the material from planning. A successor that is not planned never gets the transferred
    requirements covered.
  rule_authority: best_practice
  sap_impact: Requirements land on a part that MRP does not plan; no order proposals result.
  fix_map:
    __other__: Set a planning MRP type on the successor in MM02 MRP 1.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: follow-up material ''{actual_value}'' has MRP type ND in
    plant {MARC.WERKS}.'
- id: MM550
  field: MARC.NFMAT
  check_class: exists_check
  negate: true
  fields:
  - MARC.NFMAT
  - MARC.WERKS
  target_table: MARC
  target_fields:
  - MATNR
  - WERKS
  target_when:
    KZAUS:
      populated: true
    NFMAT:
      blank: true
  severity: high
  dimension: consistency
  message: Follow-up material is itself discontinued with no successor (dead end)
  why_it_matters: A successor that is discontinued without its own follow-up ends the chain in a dead end. The requirement
    passes to a part that is being phased out.
  rule_authority: best_practice
  sap_impact: Requirements stop at a discontinued part; nothing is bought for them.
  fix_map:
    __other__: Enter a follow-up material on the successor or choose another successor.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: follow-up material ''{actual_value}'' is discontinued with
    no follow-up in plant {MARC.WERKS}.'
- id: MM551
  field: MARC.NFMAT
  check_class: hierarchy_check
  grain: MARC
  id_field: MARC.MATNR
  scope_field: MARC.WERKS
  severity: critical
  dimension: consistency
  message: Follow-up materials form a loop within a plant
  why_it_matters: Following the follow-up material from record to record must end at a material with no successor. A loop
    (A to B to A, or longer) means no material in it can receive the requirements.
  rule_authority: sap_hard_constraint
  sap_impact: MRP follows the chain without end or stops with an error; requirements for every material in the loop are lost.
  fix_map:
    __other__: Break the loop by clearing or correcting one follow-up material in MM02 MRP 4.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: follow-up material {actual_value} is part of a supersession
    loop.'
- id: MM552
  field: MARC.NFMAT
  check_class: hierarchy_check
  grain: MARC
  id_field: MARC.MATNR
  scope_field: MARC.WERKS
  max_depth: 3
  severity: medium
  dimension: consistency
  message: Follow-up chain is longer than three links
  why_it_matters: Each follow-up hop adds a replacement step. A chain of more than three links shows that old successors were
    never collapsed to the final part.
  rule_authority: best_practice
  sap_impact: MRP passes requirements through several parts; planners cannot see the final replacement and lead times add
    up.
  fix_map:
    __other__: Point the first part directly at the current successor in MM02 MRP 4.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: follow-up material {actual_value} starts a chain of more
    than three links.'
- id: MM553
  field: MARC.NFMAT
  check_class: exists_check
  fields:
  - MARC.NFMAT
  - MARA.MEINS
  target_table: MARA
  target_fields:
  - MATNR
  - MEINS
  severity: high
  dimension: consistency
  message: Follow-up material has a different base unit of measure or does not exist
  why_it_matters: Requirements are transferred in the base unit of the predecessor. If the successor has another base unit,
    the quantity is wrong by the conversion factor.
  rule_authority: sap_hard_constraint
  sap_impact: The successor is ordered in the wrong quantity.
  fix_map:
    __other__: Check the base units of both materials; the predecessor must be reviewed by engineering.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: follow-up material ''{actual_value}'' has a different base
    unit than {MARA.MEINS} or does not exist.'
- id: MM554
  field: MARC.NFMAT
  check_class: exists_check
  fields:
  - MARC.NFMAT
  - MARA.MTART
  target_table: MARA
  target_fields:
  - MATNR
  - MTART
  severity: low
  dimension: consistency
  message: Follow-up material has a different material type or does not exist
  why_it_matters: A successor normally has the same material type as its predecessor. A change of type shows a different procurement
    or valuation logic and should be intended.
  rule_authority: best_practice
  sap_impact: Stock accounts, procurement and the available screens differ between predecessor and successor.
  fix_map:
    __other__: Review the pair; change the type only through a controlled material type change.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: follow-up material ''{actual_value}'' has a different type
    than {MARA.MTART} or does not exist.'
- id: MM555
  field: MBEW.BKLAS
  check_class: exists_check
  applies_when:
    MARC.NFMAT:
      populated: true
  fields:
  - MARC.NFMAT
  - MBEW.BKLAS
  target_table: MBEW
  target_fields:
  - MATNR
  - BKLAS
  severity: low
  dimension: consistency
  message: Follow-up material has a different valuation class or no valuation
  why_it_matters: A successor normally posts to the same stock account as its predecessor. A different valuation class moves
    value between accounts when the stock is exchanged.
  rule_authority: best_practice
  sap_impact: Stock value moves between G/L accounts when the predecessor is replaced.
  fix_map:
    __other__: Review both valuation classes with Finance; change only through a controlled valuation class change.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: follow-up material ''{MARC.NFMAT}'' has a different
    valuation class than {actual_value} or no valuation.'
- id: MM556
  field: MBEW.MATNR
  check_class: exists_check
  fields:
  - MARC.NFMAT
  - MBEW.BWKEY
  target_table: MBEW
  target_fields:
  - MATNR
  - BWKEY
  severity: medium
  dimension: completeness
  message: Material has valuation but its follow-up material has none in the same valuation area
  why_it_matters: A successor that the predecessor's requirements go to must be valuated in the same area, otherwise goods
    receipts for it cannot post.
  rule_authority: best_practice
  sap_impact: Goods receipts of the successor are rejected; production and purchasing stop.
  fix_map:
    __other__: Create the accounting view for the successor in MM01 / MM02.
  record_fix_template: 'Material {MBEW.MATNR}, valuation area {MBEW.BWKEY}: follow-up material ''{MARC.NFMAT}'' has no valuation
    in area {MBEW.BWKEY}.'
- id: MM557
  field: MARC.NFMAT
  check_class: exists_check
  applies_when:
    MARA.VPSTA:
      contains_any:
      - V
  fields:
  - MARC.NFMAT
  target_table: MVKE
  target_fields:
  - MATNR
  severity: medium
  dimension: completeness
  message: Material has a sales view but its follow-up material has none
  why_it_matters: A predecessor that is sold needs a sellable successor. Without a sales view on the successor, customers
    cannot order the replacement.
  rule_authority: best_practice
  sap_impact: Sales orders for the replacement are rejected; revenue is lost in the changeover.
  fix_map:
    __other__: Extend the successor to the sales organization in MM01 / MM02.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: follow-up material ''{actual_value}'' has no sales data.'
- id: MM558
  field: MARC.AUSDT
  check_class: cross_field_check
  applies_when:
    MARC.LVORM:
      blank: true
  fail_when: '`MARC.AUSDT`.notna() & (`MARC.AUSDT` < @today) & `MARC.MMSTA`.isna() & `MARA.MSTAE`.isna()'
  severity: medium
  dimension: lifecycle
  message: Effective-out date has passed but the material has no status that stops procurement
  why_it_matters: After the effective-out date the material is discontinued. If neither the plant status (MMSTA) nor the cross-plant
    status (MSTAE) blocks procurement, purchase orders and production orders can still be created.
  rule_authority: best_practice
  sap_impact: New orders are placed for a part that is no longer supplied.
  fix_map:
    __other__: Set a plant-specific status that blocks procurement (MM02 Basic data / MRP 1) or extend the date.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: effective-out date {actual_value} has passed and no material
    status is set.'
- id: MM559
  field: MARC.AUSDT
  check_class: cross_field_check
  applies_when:
    MARC.LVORM:
      blank: true
  fail_when: '`MARC.AUSDT`.notna() & ((@today - `MARC.AUSDT`).dt.days > 365) & `MARC.MMSTA`.isna() & `MARA.MSTAE`.isna()'
  severity: high
  dimension: lifecycle
  message: Effective-out date is more than a year old and the material is not blocked
  why_it_matters: A discontinued part that is still active a year after its date was forgotten in the phase-out. It keeps
    being planned and clutters every selection.
  rule_authority: best_practice
  sap_impact: Stale parts keep demand, stock and MRP lists alive long after the product is gone.
  fix_map:
    __other__: Block the material by status (MM02) or flag it for deletion after the stock is used up.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: effective-out date {actual_value} is more than a year ago
    and the material is still active.'
- id: MM560
  field: STPO.IDNRK
  check_class: exists_check
  grain: STPO
  applies_when:
    STPO.NFGRP:
      blank: true
    STPO.LKENZ:
      blank: true
  negate: true
  target_table: MARC
  target_fields:
  - MATNR
  target_when:
    KZAUS:
      populated: true
  severity: high
  dimension: consistency
  message: Active BOM component is a discontinued part and the item has no discontinuation group
  why_it_matters: A discontinued component needs a discontinuation group (NFGRP) so that the BOM can switch to the successor.
    Without it the BOM keeps exploding the old part after the effective-out date.
  rule_authority: best_practice
  sap_impact: Production orders pick a part that is no longer made or bought.
  fix_map:
    __other__: Maintain the discontinuation group in CS02 (item, Discontinuation data) or replace the component.
  record_fix_template: 'BOM {STPO.STLNR}, item {STPO.POSNR}, component {STPO.IDNRK}: component ''{actual_value}'' is discontinued
    in at least one plant and the item has no discontinuation group.'
- id: MM561
  field: STPO.NFEAG
  check_class: exists_check
  grain: STPO
  applies_when:
    STPO.NFEAG:
      populated: true
  fields:
  - STPO.STLTY
  - STPO.STLNR
  - STPO.NFEAG
  target_table: STPO
  target_fields:
  - STLTY
  - STLNR
  - NFGRP
  severity: medium
  dimension: consistency
  message: Item is a discontinuation-group leader but no other item has the same group
  why_it_matters: A BOM item with a discontinuation group as leader (NFEAG) hands its demand to items in the same group (NFGRP).
    With no other item in the group, the leader has no successor in the BOM.
  rule_authority: best_practice
  sap_impact: The BOM keeps the discontinued item; no replacement item takes over.
  fix_map:
    __other__: Maintain the group on the successor item in CS02 or clear the group on the leader.
  record_fix_template: 'BOM {STPO.STLNR}, item {STPO.POSNR}, component {STPO.IDNRK}: item {STPO.POSNR} leads discontinuation
    group ''{actual_value}'' but no item follows it.'
- id: MM562
  field: STPO.NFGRP
  check_class: exists_check
  grain: STPO
  applies_when:
    STPO.NFGRP:
      populated: true
  fields:
  - STPO.STLTY
  - STPO.STLNR
  - STPO.NFGRP
  target_table: STPO
  target_fields:
  - STLTY
  - STLNR
  - NFEAG
  severity: medium
  dimension: consistency
  message: Item follows a discontinuation group that has no leader
  why_it_matters: A BOM item with a discontinuation group (NFGRP) takes over from the leader (NFEAG) of the same group. With
    no leader, the follower is never activated.
  rule_authority: best_practice
  sap_impact: The successor item never enters the BOM; the old part is used instead.
  fix_map:
    __other__: Maintain the leader item in CS02 or clear the group on the follower.
  record_fix_template: 'BOM {STPO.STLNR}, item {STPO.POSNR}, component {STPO.IDNRK}: item {STPO.POSNR} follows discontinuation
    group ''{actual_value}'' which has no leader.'
- id: MM563
  field: STPO.NFGRP
  check_class: null_check
  grain: STPO
  applies_when:
    STPO.KZNFP:
    - X
  severity: medium
  dimension: completeness
  message: BOM item is flagged as follow-up item but has no discontinuation group
  why_it_matters: The follow-up item indicator (KZNFP) marks an item that replaces another one. The group (NFGRP) says which
    item it replaces. Without the group, the link is missing.
  rule_authority: best_practice
  sap_impact: The item is never activated as a replacement.
  fix_map:
    __blank__: Enter the discontinuation group in CS02 or clear the follow-up indicator.
  record_fix_template: 'BOM {STPO.STLNR}, item {STPO.POSNR}, component {STPO.IDNRK}: follow-up item has no discontinuation
    group.'
# --- basic data depth (mm-basic) ---
- id: MM600
  field: MARA.MATNR
  check_class: cross_field_check
  fail_when: '`MARA.MATNR`.str.contains(''[*%&?#;,]'', regex=True)'
  severity: medium
  dimension: validity
  message: Material number contains a character that breaks searches, URLs or file interfaces
  why_it_matters: '*, % and ? are wildcards in SAP selection screens and OData filters; & and # break URLs in Fiori and web
    services; ; and , break CSV and flat-file interfaces. A material number with these characters cannot be searched or exchanged
    reliably.'
  rule_authority: best_practice
  sap_impact: Selections return the wrong materials, Fiori apps fail to open the product, and interface files split the key.
  fix_map:
    __other__: Renumber the material (create a new material and move stock and documents) or, before go-live, change the key
      in the load file.
  record_fix_template: 'Material {MARA.MATNR}: material number contains a reserved character.'
- id: MM601
  field: MARA.KZKFG
  check_class: cross_field_check
  fail_when: (`MARA.MTART` == 'KMAT') & `MARA.KZKFG`.isna()
  severity: high
  dimension: consistency
  message: Material of type KMAT (configurable material) is not flagged as configurable
  why_it_matters: Material type KMAT exists for configurable materials; its type definition (T134) sets the configurable flag
    (KZKFG). A KMAT material without the flag cannot hold a configuration profile or a variant class.
  rule_authority: sap_hard_constraint
  sap_impact: Sales orders cannot configure the material; variant pricing and the super BOM are not used.
  fix_map:
    __other__: Set the configurable-material flag in MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA) (Basic
      data 2).
  record_fix_template: 'Material {MARA.MATNR}: material type KMAT but configurable flag is blank.'
  auto_fix:
    when: '`MARA.MTART` == ''KMAT'''
    steps:
    - op: set
      value: X
    confidence: medium
- id: MM602
  field: MARA.MATNR
  check_class: exists_check
  applies_when:
    MARA.KZKFG:
    - X
  fields:
  - MARA.MATNR
  target_table: INOB
  target_fields:
  - OBJEK
  target_when:
    KLART:
    - '300'
  severity: high
  dimension: completeness
  message: Configurable material has no variant class (class type 300)
  why_it_matters: A configurable material (KZKFG = X) gets its characteristics from a variant class of class type 300, assigned
    through the object table INOB. Without that class the configuration has no characteristics to value.
  rule_authority: sap_hard_constraint
  sap_impact: Configuration in sales orders and production orders shows no characteristics; variant conditions and object
    dependencies never fire.
  fix_map:
    __other__: Assign a variant class (class type 300) in CU41 / CL20N, or remove the configurable flag.
  record_fix_template: 'Material {MARA.MATNR}: configurable material has no variant class.'
- id: MM603
  field: MARA.XCHPF
  check_class: cross_field_check
  fail_when: (`MARA.XCHPF` == 'X') & `MARA.MTART`.isin(['DIEN', 'NLAG'])
  severity: medium
  dimension: consistency
  message: Service or non-stock material is flagged as batch-managed
  why_it_matters: Batches exist only for stock. Material types DIEN (service) and NLAG (non-stock) carry no quantity-based
    inventory, so a batch flag on them is a load error.
  rule_authority: sap_hard_constraint
  sap_impact: Purchase order and goods receipt ask for a batch that can never exist; account-assigned postings fail.
  fix_map:
    __other__: Remove the batch-management flag in MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA).
  record_fix_template: 'Material {MARA.MATNR}: material type {MARA.MTART} is batch-managed.'
- id: MM604
  field: MARA.NTGEW
  check_class: cross_field_check
  fail_when: (`MARA.MEINS` == `MARA.GEWEI`) & `MARA.NTGEW`.notna() & (`MARA.NTGEW` != 1)
  severity: high
  dimension: accuracy
  message: Net weight of a weight-based material is not 1 in its own unit
  why_it_matters: When the base unit is itself the weight unit (base unit KG, weight unit KG), one base unit weighs exactly
    one weight unit by definition. Any other net weight is impossible.
  rule_authority: sap_hard_constraint
  sap_impact: Delivery weights, freight and customs values are multiplied by a wrong factor.
  fix_map:
    __other__: Set the net weight to 1 in MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA) (Basic data 1).
  record_fix_template: 'Material {MARA.MATNR}: base unit and weight unit are {MARA.MEINS} but net weight is {actual_value}.'
  auto_fix:
    when: '`MARA.MEINS` == `MARA.GEWEI`'
    steps:
    - op: set
      value: '1'
    confidence: high
- id: MM605
  field: MARA.VOLUM
  check_class: cross_field_check
  fail_when: (`MARA.MEINS` == `MARA.VOLEH`) & `MARA.VOLUM`.notna() & (`MARA.VOLUM` != 1)
  severity: medium
  dimension: accuracy
  message: Volume of a volume-based material is not 1 in its own unit
  why_it_matters: When the base unit is itself the volume unit (base unit L, volume unit L), one base unit has a volume of
    exactly one volume unit.
  rule_authority: sap_hard_constraint
  sap_impact: Shipment volumes, load planning and storage capacity checks use a wrong factor.
  fix_map:
    __other__: Set the volume to 1 in MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA) (Basic data 1).
  record_fix_template: 'Material {MARA.MATNR}: base unit and volume unit are {MARA.MEINS} but volume is {actual_value}.'
  auto_fix:
    when: '`MARA.MEINS` == `MARA.VOLEH`'
    steps:
    - op: set
      value: '1'
    confidence: medium
