- id: MM180
  field: MBEW.MLAST
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: Material price determination (material ledger) (MBEW.MLAST) is not a value of its SAP domain
  why_it_matters: Material price determination (material ledger) has a fixed set of values defined by SAP in the field's
    domain; no customizing can add values. Any other value can only come from a direct load and is ignored or rejected by
    the programs that read it.
  rule_authority: sap_hard_constraint
  sap_impact: The function controlled by the indicator (planning periods, requirements grouping, BOM selection, discontinuation,
