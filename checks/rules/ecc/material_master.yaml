- id: MM614
  field: MARA.MEABM
  check_class: domain_value_check
  allowed_values:
  - MM
  - CM
  - DM
  - M
  - KM
  - IN
  - FT
  - YD
  severity: medium
  dimension: validity
  message: Length unit is not a recognised length unit
  why_it_matters: The length unit must be one of the SAP internal unit codes for length (MM, CM, DM, M, KM, IN, FT, YD). ISO
    codes (for example KGM, MTR, LTR) or free text are the external representation and do not convert.
  rule_authority: sap_hard_constraint
  sap_impact: Length conversions in logistics, packing and customs fail or return a wrong figure.
  fix_map:
    __other__: Replace the unit with the SAP internal code (MM, CM, DM, M, KM, IN, FT, YD) in MM02.
  record_fix_template: 'Material {MARA.MATNR}: dimension unit is ''{actual_value}''.'
  auto_fix:
    steps:
    - op: strip
    - op: map
      values:
        MMT: MM
        CMT: CM
        DMT: DM
        MTR: M
        KMT: KM
        INH: IN
        FOT: FT
        YRD: YD
        mm: MM
        cm: CM
        m: M
        __other__: null
    confidence: high
