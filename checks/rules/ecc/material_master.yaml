      F1602 Manage Product Master Data (S/4HANA).
  record_fix_template: 'Material {MARA.MATNR}: volume maintained but unit MARA.VOLEH is blank.'
- id: MM161
  field: MARA.MEABM
  check_class: cross_field_check
  fail_when: ((`MARA.LAENG` > 0) | (`MARA.BREIT` > 0) | (`MARA.HOEHE` > 0)) & `MARA.MEABM`.isna()
  severity: medium
  dimension: completeness
  message: The dimensions of the material is maintained without its unit
  why_it_matters: A dimensions value is a quantity field whose meaning is defined by its unit field (MARA.MEABM); SAP screens
