- id: MM165
  field: MARM.EAN11
  check_class: format_check
  format: gtin
  severity: medium
  dimension: validity
  message: GTIN/EAN of an alternative unit of measure has an invalid check digit
  why_it_matters: Each unit of measure (carton, pallet) carries its own GTIN in MARM. Its last digit is a GS1 mod-10 check
    digit; a mistyped digit gives a barcode that looks right but is rejected by scanners and trading partners.
  rule_authority: sap_hard_constraint
  sap_impact: Goods receipt and picking by scanning fail for that unit; EDI messages (DESADV, ORDERS) quoting the GTIN are
    rejected by the partner.
  fix_map:
    __other__: GTIN '{invalid_value}' fails the GS1 check digit. Verify it against the GS1 registration and correct it in
      Additional data > Units of measure via MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA).
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: GTIN {actual_value} fails the GS1 check digit.'
  auto_fix:
    steps:
    - op: strip
    - op: gtin_check_digit
    confidence: low
- id: MM166
  field: MARM.NUMTP
  check_class: null_check
  applies_when:
    MARM.EAN11:
      populated: true
  severity: low
  dimension: completeness
  message: EAN category is missing for a unit of measure that carries a GTIN
  why_it_matters: The EAN category (NUMTP) tells SAP how the GTIN was assigned (manufacturer EAN, in-store number, UPC)
    and drives the check-digit and number-range validation of the GTIN. MM01 requires it as soon as a GTIN is entered.
  rule_authority: sap_hard_constraint
  sap_impact: The GTIN is not validated against its category; internal number assignment and EAN reporting by category miss
    the unit.
  fix_map:
    __blank__: Enter the EAN category for the unit in Additional data > Units of measure via MM02 (ECC) or Fiori F1602 Manage
      Product Master Data (S/4HANA).
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: GTIN {MARM.EAN11} has no EAN category.'
  auto_fix:
    when: '`MARM.MEINH` == `MARA.MEINS`'
    steps:
    - op: copy
      from: MARA.NUMTP
    confidence: medium
- id: MM167
  field: MARM.EAN11
  check_class: uniqueness_check
  fields:
  - MARM.EAN11
  normalize: alnum
  severity: high
  dimension: uniqueness
  message: The same GTIN/EAN is assigned to more than one material or unit of measure
  why_it_matters: A GTIN identifies exactly one trade item (one material in one packaging level) worldwide. When two units
    or materials share it, a scan or an EDI line cannot be resolved to the right material or quantity.
  rule_authority: best_practice
  sap_impact: Scanning at goods receipt / picking and inbound EDI (ORDERS, DESADV) map to the wrong material or unit; quantities
    are converted with the wrong factor.
  fix_map:
    __other__: Determine which material/unit the GTIN is registered for (GS1) and remove or replace it on the others in
      Additional data > Units of measure via MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA).
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: GTIN {actual_value} is also used by another material or
    unit.'
- id: MM168
  field: MARA.MFRPN
  check_class: uniqueness_check
  fields:
  - MARA.MFRNR
  - MARA.MFRPN
  normalize: alnum
  applies_when:
    MARA.BMATN:
      blank: true
  severity: medium
  dimension: uniqueness
  message: Two materials carry the same manufacturer and manufacturer part number (duplicate material)
  why_it_matters: The manufacturer part number identifies the physical part. Two materials for the same manufacturer part
    split its stock, consumption history and purchasing volume and are the classic duplicate in a spare-parts catalogue.
    Manufacturer part number materials (MPN, with an internal material in BMATN) are deliberately separate and are not judged.
  rule_authority: best_practice
  sap_impact: Stock is split across duplicates; MRP reorders one while the other has stock; purchasing volume and contract
    coverage are fragmented.
  fix_map:
    __other__: Confirm the duplicate, choose the surviving material, transfer stock (309), move open documents, BOM items
      and info records, then flag the duplicate for deletion (MM06) and set a blocking material status.
  record_fix_template: 'Material {MARA.MATNR}: manufacturer {MARA.MFRNR} part {actual_value} is also used by another material.'
- id: MM169
  field: MARC.BESKZ
  check_class: null_check
  applies_when:
    MARC.DISMM:
      populated: true
      not_in:
      - ND
  severity: high
  dimension: completeness
  message: Procurement type is missing on a material planned by MRP
  why_it_matters: MRP uses the procurement type to decide whether a shortage becomes a planned order for in-house production,
    a purchase requisition, or both. It is a required field of the MRP 2 view whenever the material is planned.
  rule_authority: sap_hard_constraint
  sap_impact: MRP cannot create the right procurement proposal; the material is reported with exception messages instead
    of being replenished.
  fix_map:
    __blank__: Set the procurement type (E in-house, F external, X both) in MRP 2 via MM02 (ECC) or Fiori F1602 Manage Product
      Master Data (S/4HANA).
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: MRP type {MARC.DISMM} but no procurement type.'
- id: MM170
  field: MARC.MINBE
  check_class: cross_field_check
  require_populated: true
  fail_when: '`MARC.MINBE` < `MARC.EISBE`'
  applies_when:
    MARC.DISMM:
    - VB
    - VM
  severity: medium
  dimension: consistency
  message: Reorder point is below the safety stock
  why_it_matters: In reorder point planning the reorder point is the safety stock plus the expected consumption during the
    replenishment lead time. A reorder point below the safety stock means MRP orders only after the safety stock is already
    being consumed.
  rule_authority: best_practice
  sap_impact: Replenishment starts too late; the safety stock is regularly breached and shortages occur during the lead
    time.
  fix_map:
    __other__: Recalculate the reorder point (safety stock + lead-time consumption) and maintain it in MRP 1 via MM02 (ECC)
      or Fiori F1602 Manage Product Master Data (S/4HANA), or switch to automatic reorder point planning (VM).
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: reorder point {actual_value} below safety stock {MARC.EISBE}.'
- id: MM171
  field: MARC.MABST
  check_class: cross_field_check
  fail_when: (`MARC.MABST` > 0) & (`MARC.MINBE` > `MARC.MABST`)
  applies_when:
    MARC.DISLS:
    - HB
    MARC.DISMM:
    - VB
    - VM
  severity: high
  dimension: consistency
  message: Maximum stock level is below the reorder point (replenish-to-maximum lot sizing)
  why_it_matters: With lot-sizing procedure HB the order quantity is maximum stock level minus available stock. When the
    reorder point is above the maximum stock level, MRP triggers at a stock that is already above the maximum and computes
    a zero or negative quantity.
  rule_authority: sap_hard_constraint
  sap_impact: Reorder point planning fires without producing a usable proposal; the material is not replenished.
  fix_map:
    __other__: Set the maximum stock level above the reorder point in MRP 1 via MM02 (ECC) or Fiori F1602 Manage Product
      Master Data (S/4HANA).
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: maximum stock {actual_value} below reorder point {MARC.MINBE}.'
- id: MM172
  field: MARC.AUSDT
  check_class: null_check
  applies_when:
    MARC.KZAUS:
      populated: true
  severity: high
  dimension: completeness
  message: Discontinued material has no effective-out date
  why_it_matters: Discontinuation (MRP 4) makes MRP switch dependent requirements to the follow-up material once the discontinued
    material's stock is used up, but only from the effective-out date on. Without the date the discontinuation never takes
    effect.
  rule_authority: sap_hard_constraint
  sap_impact: Requirements stay on the discontinued part; MRP keeps ordering a part that is being phased out, or the follow-up
    material is never planned.
  fix_map:
    __blank__: Enter the effective-out date in MRP 4 via MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA).
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: discontinuation indicator {MARC.KZAUS} without effective-out
    date.'
- id: MM173
  field: MARC.NFMAT
  check_class: null_check
  applies_when:
    MARC.KZAUS:
    - '1'
  severity: high
  dimension: completeness
  message: Material under simple discontinuation has no follow-up material
  why_it_matters: Simple discontinuation (indicator 1) hands the remaining requirements of the discontinued part to its
    follow-up material. Without a follow-up material the requirements have nowhere to go.
  rule_authority: best_practice
  sap_impact: Once the stock of the discontinued part is consumed, dependent requirements are left uncovered; production
    orders are short of the component.
  fix_map:
    __blank__: Enter the follow-up material in MRP 4 via MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA);
      it must have an MRP view in the same plant.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: discontinued without a follow-up material.'
- id: MM174
  field: MARC.NFMAT
  check_class: cross_field_check
  require_populated: true
  fail_when: '`MARC.NFMAT` == `MARC.MATNR`'
  severity: medium
  dimension: consistency
  message: Material is its own follow-up material
  why_it_matters: A follow-up material replaces the discontinued one. Naming the material itself creates a loop, and the
    discontinuation never moves requirements anywhere.
  rule_authority: sap_hard_constraint
  sap_impact: Discontinuation is ineffective; MRP keeps planning the outgoing part.
  fix_map:
    __other__: Replace the follow-up material with the successor part in MRP 4 via MM02 (ECC) or Fiori F1602 Manage Product
      Master Data (S/4HANA).
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: follow-up material is the material itself.'
- id: MM175
  field: MARC.PERKZ
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: Period indicator (MARC.PERKZ) is not a value of its SAP domain
  why_it_matters: Period indicator has a fixed set of values defined by SAP in the field's domain; no customizing can add
    values. Any other value can only come from a direct load and is ignored or rejected by the programs that read it.
  rule_authority: sap_hard_constraint
  sap_impact: The function controlled by the indicator (planning periods, requirements grouping, BOM selection, discontinuation,
    backflushing, material-ledger price determination) behaves unpredictably.
  fix_map:
    __other__: Replace '{invalid_value}' with one of the domain values via MM02 (ECC) or Fiori F1602 Manage Product Master
      Data (S/4HANA).
  record_fix_template: 'Material {MARC.MATNR}: MARC.PERKZ is ''{actual_value}''.'
