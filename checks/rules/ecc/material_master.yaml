  check_class: cross_field_check
  grain: MARD
  applies_when:
    MARC.LVORM:
    - X
  fail_when: '`MARD.LVORM`.isna()'
  severity: medium
  dimension: lifecycle
  message: Storage location is active although the plant is flagged for deletion
  why_it_matters: A deletion flag on the plant (MARC-LVORM) covers all storage locations. An active storage location under
    a deleted plant row is inconsistent and blocks archiving.
  rule_authority: best_practice
  sap_impact: Archiving MM_MATNR stops; postings to the location still work.
  fix_map:
    __other__: Flag the storage location for deletion in MM06 or remove the plant deletion flag.
  record_fix_template: 'Material {MARD.MATNR}, plant {MARD.WERKS}, storage location {MARD.LGORT}: plant flagged for deletion,
    storage location active.'
  auto_fix:
    steps:
    - op: set
      value: X
    confidence: medium
