- id: MM179
  field: MARC.RGEKZ
  check_class: domain_value_check
  severity: medium
  dimension: validity
  message: Backflush indicator (MARC.RGEKZ) is not a value of its SAP domain
  why_it_matters: Backflush indicator has a fixed set of values defined by SAP in the field's domain; no customizing can
