- id: MM671
  field: KSSK.CLINT
  check_class: exists_check
  grain: KSSK
  target_table: KLAH
  target_fields:
  - CLINT
  target_when:
    STATU:
    - '1'
  severity: medium
  dimension: lifecycle
  message: Object is assigned to a class that is not released
  why_it_matters: Only classes with status 1 (released) can be used for classification and searches. Assignments to classes
    in preparation or locked are not evaluated.
  rule_authority: sap_hard_constraint
  sap_impact: Class searches (CL30N), variant configuration and batch determination ignore the assignment.
  fix_map:
    __other__: Release the class in CL02 or move the assignment to a released class in CL20N.
  record_fix_template: 'Class assignment of object {KSSK.OBJEK}, class type {KSSK.KLART}: class {actual_value} is not released.'
- id: MM672
  field: AUSP.ATFLB
  check_class: cross_field_check
  grain: AUSP
  fail_when: '`AUSP.ATFLB`.notna() & (`AUSP.ATFLB` != 0) & (`AUSP.ATFLB` < `AUSP.ATFLV`)'
  severity: medium
  dimension: consistency
  message: Numeric characteristic interval has an upper limit below its lower limit
  why_it_matters: An interval value is stored as lower limit (ATFLV) and upper limit (ATFLB). An upper limit below the lower
    limit is an empty interval that no value can satisfy.
  rule_authority: sap_hard_constraint
  sap_impact: Classification searches and batch selection by this characteristic never match the object.
  fix_map:
    __other__: Correct the interval in CL20N / MSC2N.
  record_fix_template: 'Object {AUSP.OBJEK}, characteristic {AUSP.ATINN}: upper limit {actual_value} is below lower limit
    {AUSP.ATFLV}.'
- id: MM673
  field: CAWN.ATFLB
  check_class: cross_field_check
  grain: CAWN
  fail_when: '`CAWN.ATFLB`.notna() & (`CAWN.ATFLB` != 0) & (`CAWN.ATFLB` < `CAWN.ATFLV`)'
  severity: medium
  dimension: consistency
  message: Allowed value interval of a characteristic has an upper limit below its lower limit
  why_it_matters: An allowed interval is stored as lower limit (ATFLV) and upper limit (ATFLB). An upper limit below the lower
    limit allows no value at all.
  rule_authority: sap_hard_constraint
  sap_impact: Every value entered for the characteristic is rejected or the interval is silently ignored.
  fix_map:
    __other__: Correct the allowed values of the characteristic in CT04.
  record_fix_template: 'Characteristic {CAWN.ATINN}, value {CAWN.ATZHL}: upper limit {actual_value} is below lower limit {CAWN.ATFLV}.'
- id: MM674
  field: CABN.ATNAM
  check_class: uniqueness_check
  grain: CABN
  fields:
  - CABN.ATNAM
  - CABN.ADZHL
  severity: high
  dimension: uniqueness
  message: Two characteristics have the same name
  why_it_matters: The characteristic name (ATNAM) is the external key that users, BAPIs and object dependencies use. Two internal
    characteristics with one name make every reference ambiguous.
  rule_authority: sap_hard_constraint
  sap_impact: Classification loads and dependencies attach values to the wrong characteristic.
  fix_map:
    __other__: Rename or delete the duplicate characteristic in CT04.
  record_fix_template: 'Characteristic {CABN.ATINN}: name ''{actual_value}'' is used by another characteristic.'
- id: MM675
  field: CABN.ATNAM
  check_class: cross_field_check
  grain: CABN
  fail_when: '`CABN.ATNAM`.str.contains(''[a-z]'', regex=True)'
  severity: medium
  dimension: validity
  message: Characteristic name contains lower-case letters
  why_it_matters: Characteristic names are stored in upper case; CT04 converts every entry. A lower-case name comes from a
    direct load and cannot be found by the upper-case search that SAP applies.
  rule_authority: sap_hard_constraint
  sap_impact: CT04, CL20N and BAPIs do not find the characteristic by name; dependencies referring to it fail.
  fix_map:
    __other__: Correct the name in upper case.
  record_fix_template: 'Characteristic {CABN.ATINN}: name ''{actual_value}'' contains lower-case letters.'
  auto_fix:
    steps:
    - op: upper
    confidence: high
- id: MM676
  field: KLAH.CLASS
  check_class: cross_field_check
  grain: KLAH
  fail_when: '`KLAH.CLASS`.str.contains(''[a-z]'', regex=True)'
  severity: medium
  dimension: validity
  message: Class name contains lower-case letters
  why_it_matters: Class names are stored in upper case; CL01 converts every entry. A lower-case name comes from a direct load
    and cannot be found by the upper-case search that SAP applies.
  rule_authority: sap_hard_constraint
  sap_impact: CL02, CL20N and BAPIs do not find the class by name.
  fix_map:
    __other__: Correct the name in upper case.
  record_fix_template: 'Class {KLAH.CLINT}, class type {KLAH.KLART}: name ''{actual_value}'' contains lower-case letters.'
  auto_fix:
    steps:
    - op: upper
    confidence: high
- id: MM677
  field: INOB.OBJEK
  check_class: exists_check
  grain: INOB
  applies_when:
    INOB.OBTAB:
    - MARA
  target_table: MARA
  target_fields:
  - MATNR
  severity: medium
  dimension: consistency
  message: Classification object points to a material that does not exist
  why_it_matters: INOB links an internal object number to a material for class types that use it (for example 300 variant
    classes, 023 batch classes). A material number that is not in MARA leaves the classification orphaned.
  rule_authority: sap_hard_constraint
  sap_impact: Orphan classification data is migrated and searched but belongs to no material.
  fix_map:
    __other__: Delete the orphan object link (and its values) or recreate the material.
  record_fix_template: 'Object {INOB.CUOBJ}: material ''{actual_value}'' does not exist.'
- id: MM678
  field: KSSK.OBJEK
  check_class: exists_check
  grain: KSSK
  applies_when:
    KSSK.KLART:
    - '001'
  target_table: MARA
  target_fields:
  - MATNR
  severity: medium
  dimension: consistency
  message: Material class assignment points to a material that does not exist
  why_it_matters: For class type 001 (material class) the object key in KSSK is the material number. An assignment to a material
    that is not in MARA is an orphan.
  rule_authority: sap_hard_constraint
  sap_impact: Class searches return material numbers that cannot be opened; migration carries orphan rows.
  fix_map:
    __other__: Delete the orphan assignment in CL24N or recreate the material.
  record_fix_template: 'Class assignment of object {actual_value}, class type {KSSK.KLART}: material does not exist.'
- id: MM679
  field: AUSP.OBJEK
  check_class: exists_check
  grain: AUSP
  applies_when:
    AUSP.KLART:
    - '001'
  target_table: MARA
  target_fields:
  - MATNR
  severity: medium
  dimension: consistency
  message: Material characteristic value belongs to a material that does not exist
  why_it_matters: For class type 001 (material class) the object key in AUSP is the material number. Values for a material
    that is not in MARA are orphans.
  rule_authority: sap_hard_constraint
  sap_impact: Characteristic searches return material numbers that cannot be opened; migration carries orphan values.
  fix_map:
    __other__: Delete the orphan values or recreate the material.
  record_fix_template: 'Object {actual_value}, characteristic {AUSP.ATINN}: material does not exist.'
- id: MM680
  field: AUSP.OBJEK
  check_class: exists_check
  grain: AUSP
  fields:
  - AUSP.OBJEK
  - AUSP.KLART
  target_table: KSSK
  target_fields:
  - OBJEK
  - KLART
  severity: medium
  dimension: consistency
  message: Characteristic value exists without a class assignment
  why_it_matters: Values are entered for the characteristics of the classes an object is assigned to. A value whose object
    has no class assignment of that class type cannot be displayed or changed in CL20N.
  rule_authority: sap_hard_constraint
  sap_impact: Hidden values still drive searches and batch selection but cannot be maintained.
  fix_map:
    __other__: Assign the object to a class in CL20N or delete the orphan values.
  record_fix_template: 'Object {actual_value}, class type {AUSP.KLART}, characteristic {AUSP.ATINN}: no class assignment.'
- id: MM681
  field: CABN.MSEHI
  check_class: cross_field_check
  grain: CABN
  fail_when: (`CABN.ATFOR` == 'CHAR') & `CABN.MSEHI`.notna()
  severity: low
  dimension: consistency
  message: Character-format characteristic carries a unit of measure
  why_it_matters: A unit of measure applies only to numeric characteristics (NUM, CURR). On a character characteristic it
    is ignored and shows that the format was changed after the unit was set.
  rule_authority: best_practice
  sap_impact: Values are compared as text; users read them as quantities in the unit.
  fix_map:
    __other__: Clear the unit or change the characteristic to numeric format in CT04.
  record_fix_template: 'Characteristic {CABN.ATNAM}: format CHAR with unit {actual_value}.'
- id: MM682
  field: CABN.ANZST
  check_class: cross_field_check
  grain: CABN
  fail_when: (`CABN.ATFOR` == 'CHAR') & (`CABN.ANZST` > 30)
  severity: high
  dimension: validity
  message: Character characteristic is longer than 30 characters
  why_it_matters: In ECC a character-format characteristic holds at most 30 characters (AUSP.ATWRT is CHAR 30). A longer length
    cannot be stored.
  rule_authority: sap_hard_constraint
  sap_impact: Values are truncated at 30 characters when saved; loads fail.
  fix_map:
    __other__: Reduce the length to 30 or use a long-text approach in CT04.
  record_fix_template: 'Characteristic {CABN.ATNAM}: format CHAR with length {actual_value}.'
- id: MM683
  field: CABN.ANZST
  check_class: cross_field_check
  grain: CABN
  fail_when: '`CABN.ATFOR`.isin([''NUM'', ''CURR'']) & (`CABN.ANZST` > 15)'
  severity: high
  dimension: validity
  message: Numeric characteristic has more than 15 digits
  why_it_matters: Numeric characteristic values are stored as floating point (ATFLV); SAP limits numeric characteristics to
    15 digits including decimals.
  rule_authority: sap_hard_constraint
  sap_impact: Values beyond 15 digits lose precision; CT04 rejects the definition on the next change.
  fix_map:
    __other__: Reduce the number of digits to 15 or less in CT04.
  record_fix_template: 'Characteristic {CABN.ATNAM}: format {CABN.ATFOR} with {actual_value} digits.'
# --- plant / MRP depth (mm-plant) ---
- id: MM700
  field: MARC.BSTRF
  check_class: cross_field_check
  fail_when: (`MARC.BSTRF` > 0) & (`MARC.BSTMA` > 0) & (`MARC.BSTRF` > `MARC.BSTMA`)
  severity: medium
  dimension: consistency
  message: Rounding value is larger than the maximum lot size
  why_it_matters: MRP rounds every lot up to a multiple of the rounding value (BSTRF). A rounding value above the maximum
    lot size (BSTMA) forces every lot above the maximum.
  rule_authority: best_practice
  sap_impact: Planned orders and purchase requisitions break the maximum lot size; MRP issues exception messages on every
    run.
  fix_map:
    __other__: Lower the rounding value or raise the maximum lot size in MM02 MRP 1.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: rounding value {actual_value} above maximum lot size {MARC.BSTMA}.'
- id: MM701
  field: MARC.BSTFE
  check_class: cross_field_check
  applies_when:
    MARC.DISLS:
    - FX
  fail_when: (`MARC.BSTRF` > 0) & (`MARC.BSTFE` > 0) & ((`MARC.BSTFE` % `MARC.BSTRF`) != 0)
  severity: medium
  dimension: consistency
  message: Fixed lot size is not a multiple of the rounding value
  why_it_matters: With fixed lot size (FX) MRP still rounds each lot to the rounding value (BSTRF). A fixed lot that is not
    a multiple is rounded up, so the fixed quantity is never ordered.
  rule_authority: best_practice
  sap_impact: Order quantities differ from the fixed lot size; packaging and container planning are wrong.
  fix_map:
    __other__: Align the fixed lot size with the rounding value in MM02 MRP 1.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: fixed lot size {actual_value}, rounding value {MARC.BSTRF}.'
- id: MM702
  field: MARC.BSTFE
  check_class: cross_field_check
  applies_when:
    MARC.DISLS:
    - EX
    - TB
    - WB
    - MB
    - PB
    - HB
  fail_when: '`MARC.BSTFE` > 0'
  severity: low
  dimension: consistency
  message: Fixed lot size is maintained but the lot-sizing procedure is not fixed lot size
  why_it_matters: The fixed lot size (BSTFE) is read only with lot-sizing procedure FX. With another standard procedure the
    value is ignored and misleads planners and the S/4HANA migration review.
  rule_authority: best_practice
  sap_impact: MRP ignores the value; planners believe a fixed lot size applies.
  fix_map:
    __other__: Clear the fixed lot size in MM02 MRP 1 or switch the lot-sizing procedure to FX.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: lot-sizing procedure {MARC.DISLS} with fixed lot size {actual_value}.'
  auto_fix:
    steps:
    - op: set
      value: '0'
    confidence: low
- id: MM703
  field: MARC.MABST
  check_class: cross_field_check
  applies_when:
    MARC.DISLS:
    - EX
    - TB
    - WB
    - MB
    - PB
    - FX
  fail_when: '`MARC.MABST` > 0'
  severity: low
  dimension: consistency
  message: Maximum stock level is maintained but the lot-sizing procedure is not replenish to maximum
  why_it_matters: The maximum stock level (MABST) drives lot size only with procedure HB. With another standard procedure
    the value is ignored.
  rule_authority: best_practice
  sap_impact: MRP ignores the value; planners believe stock is capped.
  fix_map:
    __other__: Clear the maximum stock level in MM02 MRP 1 or switch the lot-sizing procedure to HB.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: lot-sizing procedure {MARC.DISLS} with maximum stock level
    {actual_value}.'
  auto_fix:
    steps:
    - op: set
      value: '0'
    confidence: low
- id: MM704
  field: MARC.BSTMI
  check_class: cross_field_check
  applies_when:
    MARC.DISLS:
    - HB
  fail_when: (`MARC.MABST` > 0) & (`MARC.BSTMI` > `MARC.MABST`)
  severity: medium
  dimension: consistency
  message: Minimum lot size is above the maximum stock level (replenish to maximum)
  why_it_matters: With procedure HB MRP fills up to the maximum stock level (MABST). A minimum lot size above it forces every
    lot past the maximum.
  rule_authority: best_practice
  sap_impact: Stock is pushed above the maximum level on every replenishment.
  fix_map:
    __other__: Lower the minimum lot size or raise the maximum stock level in MM02 MRP 1.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: minimum lot size {actual_value}, maximum stock level {MARC.MABST}.'
- id: MM705
  field: MARC.EISBE
  check_class: cross_field_check
  fail_when: '`MARC.EISBE` < 0'
  severity: high
  dimension: validity
  message: Safety stock is negative
  why_it_matters: Safety stock (EISBE) is a quantity. MM02 rejects negative values; a negative value comes from a load or
    interface.
  rule_authority: sap_hard_constraint
  sap_impact: MRP calculates wrong net requirements and lot sizes; the migration load rejects the row.
  fix_map:
    __other__: Enter the correct non-negative safety stock in MM02.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: safety stock {actual_value}.'
- id: MM706
  field: MARC.MINBE
  check_class: cross_field_check
  fail_when: '`MARC.MINBE` < 0'
  severity: high
  dimension: validity
  message: Reorder point is negative
  why_it_matters: Reorder point (MINBE) is a quantity. MM02 rejects negative values; a negative value comes from a load or
    interface.
  rule_authority: sap_hard_constraint
  sap_impact: MRP calculates wrong net requirements and lot sizes; the migration load rejects the row.
  fix_map:
    __other__: Enter the correct non-negative reorder point in MM02.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: reorder point {actual_value}.'
- id: MM707
  field: MARC.BSTMI
  check_class: cross_field_check
  fail_when: '`MARC.BSTMI` < 0'
  severity: high
  dimension: validity
  message: Minimum lot size is negative
  why_it_matters: Minimum lot size (BSTMI) is a quantity. MM02 rejects negative values; a negative value comes from a load
    or interface.
  rule_authority: sap_hard_constraint
  sap_impact: MRP calculates wrong net requirements and lot sizes; the migration load rejects the row.
  fix_map:
    __other__: Enter the correct non-negative minimum lot size in MM02.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: minimum lot size {actual_value}.'
- id: MM708
  field: MARC.BSTMA
  check_class: cross_field_check
  fail_when: '`MARC.BSTMA` < 0'
  severity: high
  dimension: validity
  message: Maximum lot size is negative
  why_it_matters: Maximum lot size (BSTMA) is a quantity. MM02 rejects negative values; a negative value comes from a load
    or interface.
  rule_authority: sap_hard_constraint
  sap_impact: MRP calculates wrong net requirements and lot sizes; the migration load rejects the row.
  fix_map:
    __other__: Enter the correct non-negative maximum lot size in MM02.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: maximum lot size {actual_value}.'
- id: MM709
  field: MARC.BSTFE
  check_class: cross_field_check
  fail_when: '`MARC.BSTFE` < 0'
  severity: high
  dimension: validity
  message: Fixed lot size is negative
  why_it_matters: Fixed lot size (BSTFE) is a quantity. MM02 rejects negative values; a negative value comes from a load or
    interface.
  rule_authority: sap_hard_constraint
  sap_impact: MRP calculates wrong net requirements and lot sizes; the migration load rejects the row.
  fix_map:
    __other__: Enter the correct non-negative fixed lot size in MM02.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: fixed lot size {actual_value}.'
- id: MM710
  field: MARC.BSTRF
  check_class: cross_field_check
  fail_when: '`MARC.BSTRF` < 0'
  severity: high
  dimension: validity
  message: Rounding value is negative
  why_it_matters: Rounding value (BSTRF) is a quantity. MM02 rejects negative values; a negative value comes from a load or
    interface.
  rule_authority: sap_hard_constraint
  sap_impact: MRP calculates wrong net requirements and lot sizes; the migration load rejects the row.
  fix_map:
    __other__: Enter the correct non-negative rounding value in MM02.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: rounding value {actual_value}.'
- id: MM711
  field: MARC.FXHOR
  check_class: cross_field_check
  applies_when:
    MARC.DISMM:
    - P1
    - P2
    - P3
    - P4
  fail_when: '`MARC.FXHOR`.fillna('''').str.lstrip(''0'') == '''''
  severity: medium
  dimension: consistency
  message: MRP type with planning time fence has no planning time fence
  why_it_matters: MRP types P1 to P4 firm proposals inside the planning time fence (FXHOR). A zero fence turns them into plain
    MRP (PD), so the firming the planner asked for never happens.
  rule_authority: best_practice
  sap_impact: Planned orders are rescheduled inside the frozen zone; the shop floor sees plan changes every night.
  fix_map:
    __other__: Enter the planning time fence in MM02 MRP 1 or change the MRP type to PD.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: MRP type {MARC.DISMM} with planning time fence {actual_value}.'
- id: MM712
  field: MARC.STRGR
  check_class: cross_field_check
  applies_when:
    MARC.DISMM:
    - ND
  fail_when: '`MARC.STRGR`.notna()'
  severity: low
  dimension: consistency
  message: Planning strategy group is set on a material excluded from MRP
  why_it_matters: The strategy group (STRGR) controls how independent requirements are planned. With MRP type ND no planning
    happens, so the strategy is dead data.
  rule_authority: best_practice
  sap_impact: No effect in MRP; misleads strategy reviews in S/4HANA.
  fix_map:
    __other__: Clear the strategy group in MM02 MRP 3 or set the right MRP type.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: MRP type ND with strategy group {actual_value}.'
- id: MM713
  field: MARC.PLIFZ
  check_class: cross_field_check
  fail_when: '`MARC.PLIFZ` < 0'
  severity: high
  dimension: validity
  message: Planned delivery time is negative
  why_it_matters: Planned delivery time (PLIFZ) is a number of days. MM02 rejects negative values.
  rule_authority: sap_hard_constraint
  sap_impact: Scheduling puts the delivery date before the order date.
  fix_map:
    __other__: Enter the planned delivery time in MM02 MRP 2.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: planned delivery time {actual_value} days.'
- id: MM714
  field: MARC.WEBAZ
  check_class: cross_field_check
  fail_when: (`MARC.WEBAZ` < 0) | (`MARC.WEBAZ` > 30)
  severity: low
  dimension: accuracy
  message: Goods receipt processing time is negative or more than 30 days
  why_it_matters: GR processing time (WEBAZ) covers inspection and put-away. Values below zero are invalid; values above 30
    days are almost always a typing error (hours or calendar days).
  rule_authority: best_practice
  sap_impact: Available-to-promise dates and MRP coverage are pushed back by the extra days.
  fix_map:
    __other__: Correct the GR processing time in MM02 MRP 2.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: GR processing time {actual_value} days.'
- id: MM715
  field: MARC.DZEIT
  check_class: cross_field_check
  applies_when:
    MARC.BESKZ:
    - E
    - X
  fail_when: '`MARC.DZEIT` > 365'
  severity: low
  dimension: accuracy
  message: In-house production time is longer than one year
  why_it_matters: In-house production time (DZEIT) above 365 days is almost always a load error (hours or minutes entered
    as days).
  rule_authority: best_practice
  sap_impact: Planned orders start a year early; capacity and stock projections are distorted.
  fix_map:
    __other__: Correct the in-house production time in MM02 MRP 2.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: in-house production time {actual_value} days.'
- id: MM716
  field: MARC.DZEIT
  check_class: cross_field_check
  applies_when:
    MARC.BESKZ:
    - E
    MARC.DISMM:
      populated: true
      not_in:
      - ND
  fail_when: (`MARC.DZEIT`.fillna(0) == 0) & (`MARC.BEARZ`.fillna(0) == 0)
  severity: medium
  dimension: completeness
  message: In-house produced MRP material has no production time
  why_it_matters: Basic date scheduling uses the in-house production time (DZEIT) or the lot-size dependent times (BEARZ).
    With both zero, planned orders start and finish the same day.
  rule_authority: best_practice
  sap_impact: Planned orders and dependent requirements are scheduled too late; components arrive after production starts.
  fix_map:
    __other__: Enter the in-house production time or the scheduling times in MM02 MRP 2 / Work scheduling.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: in-house production time {actual_value}, processing time
    {MARC.BEARZ}.'
- id: MM717
  field: MARC.PLIFZ
  check_class: cross_field_check
  applies_when:
    MARC.BESKZ:
    - E
    MARC.SOBSL:
      blank: true
  fail_when: '`MARC.PLIFZ` > 0'
  severity: low
  dimension: consistency
  message: Planned delivery time is set on a material produced in-house only
  why_it_matters: Planned delivery time (PLIFZ) is read for external procurement. On procurement type E without special procurement
    it is ignored.
  rule_authority: best_practice
  sap_impact: Lead time scheduling ignores the value; it is stale data.
  fix_map:
    __other__: Clear the planned delivery time in MM02 MRP 2 or change the procurement type.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: procurement type E with planned delivery time {actual_value}.'
  auto_fix:
    steps:
    - op: set
      value: '0'
    confidence: medium
- id: MM718
  field: MARC.UNETO
  check_class: cross_field_check
  fail_when: '`MARC.UNETO` > 100'
  severity: medium
  dimension: validity
  message: Under-delivery tolerance is above 100 percent
  why_it_matters: Under-delivery tolerance (UNETO) is a share of the ordered quantity. Above 100 percent it has no meaning.
  rule_authority: best_practice
  sap_impact: Goods receipt and order confirmation tolerance checks never trigger.
  fix_map:
    __other__: Enter a tolerance between 0 and 100 in MM02 Work scheduling.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: under-delivery tolerance {actual_value}%.'
- id: MM719
  field: MARC.AUSSS
  check_class: cross_field_check
  fail_when: '`MARC.AUSSS` >= 100'
  severity: medium
  dimension: accuracy
  message: Assembly scrap is 100 percent or more
  why_it_matters: Assembly scrap (AUSSS) raises every planned order. At 100 percent or more, MRP orders at least double the
    requirement; this is a load error in practice.
  rule_authority: best_practice
  sap_impact: Production and component requirements are doubled or more.
  fix_map:
    __other__: Correct the assembly scrap in MM02 MRP 1.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: assembly scrap {actual_value}%.'
- id: MM720
  field: MARC.SOBSL
  check_class: cross_field_check
  fail_when: '`MARC.SOBSL`.notna() & `MARC.BESKZ`.isna()'
  severity: high
  dimension: consistency
  message: Special procurement type is set but the procurement type is blank
  why_it_matters: A special procurement type (SOBSL) refines the procurement type (BESKZ). Without a procurement type, MRP
    does not procure the material at all.
  rule_authority: sap_hard_constraint
  sap_impact: MRP creates no proposals; the special procurement is never used.
  fix_map:
    __other__: Set the procurement type in MM02 MRP 2.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: special procurement {actual_value} with blank procurement
    type.'
- id: MM721
  field: MARC.SOBSL
  check_class: exists_check
  applies_when:
    MARC.BESKZ:
    - E
    - F
    MARC.SOBSL:
      populated: true
  fields:
  - MARC.WERKS
  - MARC.SOBSL
  - MARC.BESKZ
  target_table: T460A
  target_fields:
  - WERKS
  - SOBSL
  - BESKZ
  severity: high
  dimension: consistency
  message: Special procurement type does not fit the procurement type
  why_it_matters: Each special procurement key (T460A) belongs to one procurement type. Subcontracting or stock transfer keys
    need F; phantom, direct production or production in another plant need E.
  rule_authority: sap_hard_constraint
  sap_impact: MM02 rejects the combination; MRP ignores the special procurement or raises errors.
  fix_map:
    __other__: Pick a special procurement key that matches the procurement type in MM02 MRP 2.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: procurement type {MARC.BESKZ} with special procurement
    {actual_value}.'
- id: MM722
  field: MARC.MTVFP
  check_class: null_check
  applies_when:
    MARC.BESKZ:
    - E
    - X
    MARC.DISMM:
      populated: true
      not_in:
      - ND
  severity: medium
  dimension: completeness
  message: In-house produced material has no availability check group
  why_it_matters: Production orders run a component and material availability check with the checking group (MTVFP). In S/4HANA
    advanced ATP and production order release need it.
  rule_authority: best_practice
  sap_impact: Availability checks fail or are skipped; orders are released without stock.
  fix_map:
    __blank__: Enter the availability check group in MM02 MRP 3.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: no availability check group.'
- id: MM723
  field: MARC.LGPRO
  check_class: null_check
  applies_when:
    MARC.RGEKZ:
    - '1'
  severity: high
  dimension: completeness
  message: Backflushed component has no issue storage location
  why_it_matters: With backflush indicator 1 the component is issued automatically at confirmation from the production storage
    location (LGPRO). Without one the backflush goods issue fails.
  rule_authority: sap_hard_constraint
  sap_impact: Confirmations post with errors (COGI); stock and costs are wrong until cleared.
  fix_map:
    __blank__: Enter the production storage location in MM02 MRP 2.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: backflush set but no production storage location.'
- id: MM724
  field: MARC.LGPRO
  check_class: exists_check
  applies_when:
    MARC.LGPRO:
      populated: true
  fields:
  - MARC.MATNR
  - MARC.WERKS
  - MARC.LGPRO
  target_table: MARD
  target_fields:
  - MATNR
  - WERKS
  - LGORT
  severity: high
  dimension: consistency
  message: Production storage location is not extended for the material
  why_it_matters: Goods receipts and backflush issues post to the production storage location (LGPRO). The material must exist
    in that storage location (MARD).
  rule_authority: best_practice
  sap_impact: Postings create the storage location on the fly or fail; S/4HANA migration flags the gap.
  fix_map:
    __other__: Extend the material to the storage location in MM02 or MMSC, or correct LGPRO.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: production storage location {actual_value} not extended.'
- id: MM725
  field: MARC.VERKZ
  check_class: exists_check
  applies_when:
    MARC.VERKZ:
    - X
  fields:
  - MARC.MATNR
  - MARC.WERKS
  target_table: MKAL
  target_fields:
  - MATNR
  - WERKS
  severity: high
  dimension: consistency
  message: Production version indicator is set but no production version exists
  why_it_matters: The version indicator (VERKZ) says production versions are maintained. Without a version in MKAL, BOM and
    routing selection fails.
  rule_authority: sap_hard_constraint
  sap_impact: Planned and production orders cannot pick a BOM or routing.
  fix_map:
    __other__: Create the production version in C223 or clear the indicator.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: version indicator set, no production version.'
- id: MM726
  field: MARC.BESKZ
  check_class: exists_check
  applies_when:
    MARA.MTART:
    - FERT
    - HALB
    MARC.BESKZ:
    - E
    - X
    MARC.DISMM:
      populated: true
      not_in:
      - ND
  fields:
  - MARC.MATNR
  - MARC.WERKS
  target_table: MKAL
  target_fields:
  - MATNR
  - WERKS
  severity: high
  dimension: consistency
  message: In-house produced material has no production version
  why_it_matters: S/4HANA selects BOM and routing only through production versions (MKAL); selection by order quantity or
    explosion date is gone. Every finished and semi-finished product produced in-house needs a version.
  rule_authority: sap_hard_constraint
  sap_impact: After conversion, MRP Live and order creation find no BOM or routing for the material.
  fix_map:
    __other__: Create production versions in C223 (or run CS_BOM_PRODVER_MIGRATION) before conversion.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: procurement type {actual_value}, no production version.'
- id: MM727
  field: MARC.MMSTA
  check_class: exists_check
  applies_when:
    MARC.MMSTA:
      populated: true
    MARC.DISMM:
      populated: true
      not_in:
      - ND
  negate: true
  fields:
  - MARC.MMSTA
  target_table: T141
  target_fields:
  - MMSTA
  target_when:
    DDISP:
    - B
  severity: high
  dimension: consistency
  message: Plant status blocks MRP but the material is still planned
  why_it_matters: The plant status (MMSTA) has MRP set to error (T141-DDISP B). MRP stops on the material every run while
    the MRP type still asks for planning.
  rule_authority: best_practice
  sap_impact: MRP runs log errors and leave requirements uncovered.
  fix_map:
    __other__: Set MRP type ND for the blocked material in MM02, or change the plant status.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: plant status {actual_value} blocks MRP, MRP type {MARC.DISMM}.'
- id: MM728
  field: MARC.MMSTA
  check_class: cross_field_check
  fail_when: '`MARC.MMSTA`.notna() & `MARA.MSTAE`.notna() & (`MARC.MMSTA` != `MARA.MSTAE`)'
  severity: low
  dimension: consistency
  message: Plant status differs from the cross-plant status
  why_it_matters: When both statuses are set, SAP applies the stricter one per business process. Different codes usually come
    from a partial roll-out or a stale block.
  rule_authority: best_practice
  sap_impact: Procurement or production is blocked or allowed in a way nobody intended.
  fix_map:
    __other__: Align the plant status with the cross-plant status in MM02, or document the difference.
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: plant status {actual_value}, cross-plant status {MARA.MSTAE}.'
