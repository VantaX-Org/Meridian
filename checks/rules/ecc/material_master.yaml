- id: MM618
  field: MARA.ERGEI
  check_class: cross_field_check
  fail_when: (`MARA.ERGEW` > 0) & `MARA.ERGEI`.isna()
  severity: medium
  dimension: completeness
  message: Allowed packaging weight is maintained without its unit
  why_it_matters: The allowed packaging weight (ERGEW) of a packaging material is a quantity; its meaning comes from the unit
    ERGEI. Without the unit the value cannot be compared with the weight of the packed goods.
  rule_authority: sap_hard_constraint
  sap_impact: Handling-unit packing does not check the load limit of the packaging material.
  fix_map:
    __other__: 'Enter the unit of the allowed packaging weight in MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA)
      (Sales: general/plant).'
  record_fix_template: 'Material {MARA.MATNR}: allowed packaging weight {MARA.ERGEW} has no unit.'
- id: MM619
  field: MARA.ERVOE
  check_class: cross_field_check
  fail_when: (`MARA.ERVOL` > 0) & `MARA.ERVOE`.isna()
  severity: medium
  dimension: completeness
  message: Allowed packaging volume is maintained without its unit
  why_it_matters: The allowed packaging volume (ERVOL) of a packaging material is a quantity; its meaning comes from the unit
    ERVOE. Without the unit the value cannot be compared with the volume of the packed goods.
  rule_authority: sap_hard_constraint
  sap_impact: Handling-unit packing does not check the volume limit of the packaging material.
  fix_map:
    __other__: 'Enter the unit of the allowed packaging volume in MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA)
      (Sales: general/plant).'
  record_fix_template: 'Material {MARA.MATNR}: allowed packaging volume {MARA.ERVOL} has no unit.'
- id: MM620
  field: MARM.BRGEW
  check_class: cross_field_check
  grain: MARM
  fail_when: (`MARM.MEINH` == `MARA.MEINS`) & (`MARA.BRGEW` > 0) & (`MARM.BRGEW` != `MARA.BRGEW`)
  severity: medium
  dimension: consistency
  message: Gross weight on the base unit row differs from the material's gross weight
  why_it_matters: SAP keeps the gross weight of the base unit in two places, MARA and the MARM row of the base unit, and the
    material master transaction keeps them equal. A difference comes from a direct load into one table.
  rule_authority: sap_hard_constraint
  sap_impact: Deliveries in the base unit and deliveries converted through MARM show different weights for the same quantity.
  fix_map:
    __other__: Re-save the weight in MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA) (Basic data 1) so both
      tables are aligned.
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: base unit gross weight {actual_value} differs from material
    gross weight {MARA.BRGEW}.'
  auto_fix:
    when: (`MARM.MEINH` == `MARA.MEINS`)
    steps:
    - op: copy
      from: MARA.BRGEW
    confidence: high
- id: MM621
  field: MARM.VOLUM
  check_class: cross_field_check
  grain: MARM
  fail_when: (`MARM.MEINH` == `MARA.MEINS`) & (`MARA.VOLUM` > 0) & (`MARM.VOLUM` != `MARA.VOLUM`)
  severity: medium
  dimension: consistency
  message: Volume on the base unit row differs from the material's volume
  why_it_matters: SAP keeps the volume of the base unit in MARA and in the MARM row of the base unit and keeps them equal.
    A difference comes from a direct load into one table.
  rule_authority: sap_hard_constraint
  sap_impact: Volume totals differ depending on whether a document reads MARA or the unit conversion.
  fix_map:
    __other__: Re-save the volume in MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA) (Basic data 1) so both
      tables are aligned.
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: base unit volume {actual_value} differs from material volume
    {MARA.VOLUM}.'
  auto_fix:
    when: (`MARM.MEINH` == `MARA.MEINS`)
    steps:
    - op: copy
      from: MARA.VOLUM
    confidence: high
- id: MM622
  field: MARM.EAN11
  check_class: cross_field_check
  grain: MARM
  fail_when: (`MARM.MEINH` == `MARA.MEINS`) & `MARM.EAN11`.isna() & `MARA.EAN11`.notna()
  severity: medium
  dimension: consistency
  message: Base unit row has no GTIN although the material has one
  why_it_matters: The GTIN of the base unit is stored in MARA.EAN11 and in the MARM row of the base unit. Scanning and EDI
    read the unit row; if it is blank, the GTIN is invisible to them.
  rule_authority: sap_hard_constraint
  sap_impact: Barcode scanning, EDI order lines and POS lookups by GTIN do not find the material in its base unit.
  fix_map:
    __other__: Re-save the GTIN in MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA) (Basic data 1 or Units of
      measure).
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: base unit has no GTIN, material GTIN is {MARA.EAN11}.'
  auto_fix:
    when: (`MARM.MEINH` == `MARA.MEINS`) & `MARA.EAN11`.notna()
    steps:
    - op: copy
      from: MARA.EAN11
    confidence: high
- id: MM623
  field: MARM.EAN11
  check_class: cross_field_check
  grain: MARM
  fail_when: (`MARM.MEINH` == `MARA.MEINS`) & `MARM.EAN11`.notna() & `MARA.EAN11`.notna() & (`MARM.EAN11` != `MARA.EAN11`)
  severity: high
  dimension: consistency
  message: GTIN on the base unit row differs from the material's GTIN
  why_it_matters: MARA.EAN11 and the GTIN on the base unit row must be the same number. Two different GTINs for one unit mean
    one of them belongs to another product or packaging level.
  rule_authority: sap_hard_constraint
  sap_impact: Scanning finds the material under one GTIN, EDI and catalogues send the other; GS1 data pools reject the item.
  fix_map:
    __other__: Confirm the correct GTIN and maintain it in MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA)
      (Units of measure).
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: base unit GTIN {actual_value} differs from material GTIN
    {MARA.EAN11}.'
  auto_fix:
    when: (`MARM.MEINH` == `MARA.MEINS`)
    steps:
    - op: copy
      from: MARA.EAN11
    confidence: medium
- id: MM624
  field: MARM.GEWEI
  check_class: cross_field_check
  grain: MARM
  fail_when: (`MARM.MEINH` == `MARA.MEINS`) & `MARM.GEWEI`.notna() & `MARA.GEWEI`.notna() & (`MARM.GEWEI` != `MARA.GEWEI`)
  severity: medium
  dimension: consistency
  message: Weight unit on the base unit row differs from the material's weight unit
  why_it_matters: The base unit row in MARM mirrors the weight unit of MARA. A different unit makes the same weight figure
    mean two different things.
  rule_authority: sap_hard_constraint
  sap_impact: Weights converted through MARM are off by the factor between the two units.
  fix_map:
    __other__: Re-save the weight and weight unit in MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA) (Basic
      data 1).
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: base unit weight unit {actual_value} differs from material
    weight unit {MARA.GEWEI}.'
- id: MM625
  field: MARM.NUMTP
  check_class: cross_field_check
  grain: MARM
  fail_when: (`MARM.MEINH` == `MARA.MEINS`) & `MARM.NUMTP`.notna() & `MARA.NUMTP`.notna() & (`MARM.NUMTP` != `MARA.NUMTP`)
  severity: low
  dimension: consistency
  message: EAN category on the base unit row differs from the material's EAN category
  why_it_matters: The EAN category (NUMTP) of the base unit is stored in MARA and in the MARM row of the base unit. Different
    categories mean the same GTIN is validated by two different rules.
  rule_authority: sap_hard_constraint
  sap_impact: GTIN check-digit and number-range checks give different results depending on the table read.
  fix_map:
    __other__: Re-save the EAN category in MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA) (Basic data 1).
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: base unit EAN category {actual_value} differs from material
    EAN category {MARA.NUMTP}.'
  auto_fix:
    when: (`MARM.MEINH` == `MARA.MEINS`)
    steps:
    - op: copy
      from: MARA.NUMTP
    confidence: medium
- id: MM626
  field: MARM.BRGEW
  check_class: cross_field_check
  grain: MARM
  fail_when: (`MARM.GEWEI` == `MARA.GEWEI`) & (`MARM.BRGEW` > 0) & (`MARM.UMREN` > 0) & (`MARM.BRGEW` < `MARM.UMREZ` / `MARM.UMREN`
    * `MARA.NTGEW` * 0.999)
  severity: high
  dimension: accuracy
  message: Gross weight of a packing unit is lower than the net weight of its contents
  why_it_matters: A packing unit holding UMREZ/UMREN base units weighs at least that many times the net weight of one base
    unit. A lower gross weight is physically impossible and points to a wrong conversion or a weight entered per base unit.
  rule_authority: sap_hard_constraint
  sap_impact: Pallet and carton weights in deliveries, shipments and freight bills are understated; axle and pallet load limits
    are not respected.
  fix_map:
    __other__: Correct the gross weight or the conversion of the unit in MM02 (Additional data > Units of measure).
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: gross weight {actual_value} {MARM.GEWEI} for {MARM.UMREZ}/{MARM.UMREN}
    base units of net weight {MARA.NTGEW}.'
- id: MM627
  field: MARM.MESUB
  check_class: exists_check
  grain: MARM
  fields:
  - MARM.MATNR
  - MARM.MESUB
  target_table: MARM
  target_fields:
  - MATNR
  - MEINH
  severity: medium
  dimension: consistency
  message: Lower-level unit of measure is not a unit of the material
  why_it_matters: The lower-level unit (MESUB) builds the packaging hierarchy, for example pallet contains carton. It must
    itself be a unit of the same material, or the hierarchy breaks.
  rule_authority: sap_hard_constraint
  sap_impact: Packaging hierarchies in EWM, retail and GDSN are incomplete; the unit cannot be broken down.
  fix_map:
    __other__: Create the lower-level unit for the material or correct MESUB in MM02 (Additional data > Units of measure).
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: lower-level unit ''{actual_value}'' is not a unit of this
    material.'
- id: MM628
  field: MARM.MESUB
  check_class: cross_field_check
  grain: MARM
  fail_when: '`MARM.MESUB` == `MARM.MEINH`'
  severity: medium
  dimension: consistency
  message: Unit of measure is its own lower-level unit
  why_it_matters: The lower-level unit points to the next smaller packaging level. A unit that contains itself creates a loop
    in the packaging hierarchy.
  rule_authority: sap_hard_constraint
  sap_impact: Packaging hierarchy explosion loops or stops; GDSN and EWM packaging data are rejected.
  fix_map:
    __other__: Clear MESUB or set it to the next smaller unit in MM02 (Additional data > Units of measure).
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: lower-level unit is the unit itself.'
- id: MM629
  field: MARM.UMREZ
  check_class: cross_field_check
  grain: MARM
  applies_when:
    MARM.MEINH:
    - PAL
    - KAR
    - CS
    - BOX
    - CRT
    - PAK
    - CAR
    MARA.MEINS:
    - ST
    - EA
    - PC
    - STK
    - PCE
  fail_when: '`MARM.UMREZ` < `MARM.UMREN`'
  severity: high
  dimension: accuracy
  message: Packaging unit holds less than one piece
  why_it_matters: A pallet, carton, case or box holds a whole number of pieces, at least one. A conversion below one piece
    means numerator and denominator are swapped.
  rule_authority: sap_hard_constraint
  sap_impact: Orders in cartons or pallets are converted to a fraction of a piece; stock, prices and replenishment are wrong.
  fix_map:
    __other__: Swap or correct the numerator and denominator of the unit in MM02 (Additional data > Units of measure).
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: 1 {MARM.MEINH} = {MARM.UMREZ}/{MARM.UMREN} {MARA.MEINS}.'
- id: MM630
  field: MARM.UMREZ
  check_class: uniqueness_check
  grain: MARM
  fields:
  - MARM.MATNR
  - MARM.UMREZ
  - MARM.UMREN
  severity: low
  dimension: uniqueness
  message: Two units of measure of the material have the same conversion factor
  why_it_matters: Two units with the same conversion (for example CS = 12 and CAR = 12) are the same quantity under two names.
    Users pick either one, which splits order history and confuses packaging data.
  rule_authority: best_practice
  sap_impact: Purchasing and sales documents use different units for the same pack; GTINs and pack data diverge.
  fix_map:
    __other__: Keep one unit per packaging level and delete the duplicate in MM02 (Additional data > Units of measure).
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: conversion {MARM.UMREZ}/{MARM.UMREN} is used by another
    unit of the same material.'
- id: MM631
  field: MARM.BRGEW
  check_class: cross_field_check
  grain: MARM
  fail_when: (`MARM.MEINH` != `MARA.MEINS`) & (`MARA.BRGEW` > 0) & ~(`MARM.BRGEW` > 0) & (`MARM.UMREZ` > `MARM.UMREN`)
  severity: low
  dimension: completeness
  message: Packing unit has no gross weight although the material has one
  why_it_matters: A packing unit that contains several base units weighs more than the base unit, and its own gross weight
    feeds shipment and pallet weights. SAP does not derive it from the base unit.
  rule_authority: best_practice
  sap_impact: Shipments planned in cartons or pallets show no weight; freight and load checks are skipped.
  fix_map:
    __other__: Maintain the gross weight of the unit in MM02 (Additional data > Units of measure).
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: unit has no gross weight.'
- id: MM632
  field: MEAN.EAN11
  check_class: exists_check
  grain: MEAN
  applies_when:
    MEAN.HPEAN:
    - X
  fields:
  - MEAN.MATNR
  - MEAN.MEINH
  - MEAN.EAN11
  target_table: MARM
  target_fields:
  - MATNR
  - MEINH
  - EAN11
  severity: medium
  dimension: consistency
  message: Main GTIN in the EAN table is not the GTIN of the unit of measure
  why_it_matters: For each unit, the GTIN flagged as main (HPEAN) in MEAN must be the GTIN stored on the unit (MARM.EAN11).
    SAP keeps them equal when the GTIN is maintained in the material master.
  rule_authority: sap_hard_constraint
  sap_impact: Documents print the unit GTIN while scanning and EDI identify the material by a different main GTIN.
  fix_map:
    __other__: Set the main GTIN flag on the GTIN of the unit, or maintain the unit GTIN, in MM02 (Units of measure > EANs).
  record_fix_template: 'Material {MEAN.MATNR}, unit {MEAN.MEINH}: main GTIN {actual_value} is not the GTIN of the unit.'
- id: MM633
  field: MEAN.EAN11
  check_class: cross_field_check
  grain: MEAN
  fail_when: '`MEAN.EAN11`.notna() & (((`MEAN.EANTP` == ''HE'') & ~`MEAN.EAN11`.str.len().isin([8, 13])) | ((`MEAN.EANTP`
    == ''UC'') & (`MEAN.EAN11`.str.len() != 12)))'
  severity: medium
  dimension: validity
  message: GTIN length does not match its EAN category
  why_it_matters: EAN category HE (manufacturer EAN) is an EAN-13 or EAN-8 number; category UC is a 12-digit UPC-A. A GTIN
    whose length does not match its category was loaded under the wrong category or is truncated.
  rule_authority: sap_hard_constraint
  sap_impact: SAP's GTIN check for the category rejects the number on the next change; scanners and EDI partners reject it.
  fix_map:
    __other__: Correct the GTIN or its EAN category in MM02 (Units of measure > EANs).
  record_fix_template: 'Material {MEAN.MATNR}, unit {MEAN.MEINH}: GTIN {actual_value} has category {MEAN.EANTP}.'
- id: MM634
  field: MARM.EAN11
  check_class: cross_field_check
  grain: MARM
  fail_when: '`MARM.EAN11`.notna() & (((`MARM.NUMTP` == ''HE'') & ~`MARM.EAN11`.str.len().isin([8, 13])) | ((`MARM.NUMTP`
    == ''UC'') & (`MARM.EAN11`.str.len() != 12)))'
  severity: medium
  dimension: validity
  message: GTIN length of a unit of measure does not match its EAN category
  why_it_matters: EAN category HE (manufacturer EAN) is an EAN-13 or EAN-8 number; category UC is a 12-digit UPC-A. A GTIN
    whose length does not match its category was loaded under the wrong category or is truncated.
  rule_authority: sap_hard_constraint
  sap_impact: SAP's GTIN check for the category rejects the number on the next change; scanners and EDI partners reject it.
  fix_map:
    __other__: Correct the GTIN or its EAN category in MM02 (Additional data > Units of measure).
  record_fix_template: 'Material {MARM.MATNR}, unit {MARM.MEINH}: GTIN {actual_value} has category {MARM.NUMTP}.'
- id: MM635
  field: MARA.EAN11
  check_class: cross_field_check
  fail_when: '`MARA.EAN11`.notna() & (((`MARA.NUMTP` == ''HE'') & ~`MARA.EAN11`.str.len().isin([8, 13])) | ((`MARA.NUMTP`
    == ''UC'') & (`MARA.EAN11`.str.len() != 12)))'
  severity: medium
  dimension: validity
  message: GTIN length of the material does not match its EAN category
  why_it_matters: EAN category HE (manufacturer EAN) is an EAN-13 or EAN-8 number; category UC is a 12-digit UPC-A. A GTIN
    whose length does not match its category was loaded under the wrong category or is truncated.
  rule_authority: sap_hard_constraint
  sap_impact: SAP's GTIN check for the category rejects the number on the next change; scanners and EDI partners reject it.
  fix_map:
    __other__: Correct the GTIN or its EAN category in MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA) (Basic
      data 1).
  record_fix_template: 'Material {MARA.MATNR}: GTIN {actual_value} has category {MARA.NUMTP}.'
- id: MM636
  field: MEAN.EANTP
  check_class: cross_field_check
  grain: MEAN
  fail_when: (`MEAN.EANTP` == 'HE') & `MEAN.EAN11`.str.startswith('2')
  severity: low
  dimension: validity
  message: In-store (restricted circulation) GTIN is classified as a manufacturer EAN
  why_it_matters: GS1 reserves GTINs starting with 2 for restricted circulation (in-store numbers, variable-weight labels).
    Such a number is not a manufacturer EAN and is not unique outside the company.
  rule_authority: best_practice
  sap_impact: The number is sent to GS1 data pools and trading partners as if it were a global GTIN.
  fix_map:
    __other__: Change the EAN category to an in-store category in MM02 (Units of measure > EANs).
  record_fix_template: 'Material {MEAN.MATNR}, unit {MEAN.MEINH}: GTIN {MEAN.EAN11} starts with 2 but has category HE.'
- id: MM637
  field: MARA.EAN11
  check_class: exists_check
  fields:
  - MARA.MATNR
  - MARA.MEINS
  - MARA.EAN11
  target_table: MEAN
  target_fields:
  - MATNR
  - MEINH
  - EAN11
  target_when:
    HPEAN:
    - X
  severity: low
  dimension: consistency
  message: Material GTIN is not the main GTIN of the base unit in the EAN table
  why_it_matters: MARA.EAN11 is the main GTIN of the base unit. When the EAN table (MEAN) is in use it must hold the same
    GTIN for the base unit, flagged as main GTIN.
  rule_authority: sap_hard_constraint
  sap_impact: Scanning and EDI that read MEAN identify the base unit by a different GTIN than documents print.
  fix_map:
    __other__: Re-save the GTIN in MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA) so that SAP rebuilds the
      EAN table entry, or set the main flag.
  record_fix_template: 'Material {MARA.MATNR}: GTIN {actual_value} is not the main GTIN of base unit {MARA.MEINS} in MEAN.'
- id: MM638
  field: MAKT.MAKTX
  check_class: cross_field_check
  grain: MAKT
  fail_when: '`MAKT.MAKTX`.str.contains(''[|^~]'', regex=True)'
  severity: low
  dimension: validity
  message: Material description contains a pipe, caret or tilde
  why_it_matters: '| is the field separator of many flat-file and IDoc interfaces; ^ and ~ are the command prefixes of ZPL
    label printers. In a description they split interface records or corrupt labels.'
  rule_authority: best_practice
  sap_impact: Interface files shift columns; warehouse and shipping labels print garbage or stop.
  fix_map:
    __other__: Remove the character from the description in MM02 (Additional data > Descriptions).
  record_fix_template: 'Material {MAKT.MATNR}, language {MAKT.SPRAS}: description ''{actual_value}'' contains |, ^ or ~.'
  auto_fix:
    steps:
    - op: regex_replace
      pattern: '[|^~]'
      repl: ' '
    - op: collapse_spaces
    - op: strip
    confidence: low
- id: MM639
  field: MAKT.MAKTX
  check_class: cross_field_check
  grain: MAKT
  fail_when: '`MAKT.MAKTX`.str.upper().str.contains(''DO NOT USE|DONT USE|NOT TO BE USED|OBSOLETE|DUPLICATE|DUPLICATED'',
    regex=True) & `MARA.LVORM`.isna() & `MARA.MSTAE`.isna()'
  severity: medium
  dimension: lifecycle
  message: Description says the material is obsolete but the material is not blocked
  why_it_matters: Writing DO NOT USE, OBSOLETE or DUPLICATE in the description is a manual block that SAP does not enforce.
    Only a material status or the deletion flag stops purchasing, MRP and sales from using the material.
  rule_authority: best_practice
  sap_impact: MRP keeps planning the material, buyers can still order it and it stays in S/4HANA migration scope.
  fix_map:
    __other__: Set a blocking cross-plant material status (and the deletion flag if appropriate) in MM02 (ECC) or Fiori F1602
      Manage Product Master Data (S/4HANA).
  record_fix_template: 'Material {MAKT.MATNR}, language {MAKT.SPRAS}: description ''{actual_value}'' marks the material as
    not to be used, but it has no status or deletion flag.'
- id: MM640
  field: MAKT.MAKTX
  check_class: cross_field_check
  grain: MAKT
  fail_when: '`MAKT.MAKTX`.str.contains(''�|Ã|Â'', regex=True)'
  severity: medium
  dimension: validity
  message: Material description contains corrupted characters from a wrong code page
  why_it_matters: Characters such as Ã, Â or the replacement character appear when UTF-8 text was loaded as a single-byte
    code page (or the reverse). The original letters (é, ü, °) are lost.
  rule_authority: best_practice
  sap_impact: Descriptions print wrongly on documents and labels; searches by the real word do not find the material.
  fix_map:
    __other__: Reload the description from the source in the correct encoding, or retype it in MM02 (Descriptions).
  record_fix_template: 'Material {MAKT.MATNR}, language {MAKT.SPRAS}: description ''{actual_value}'' contains code-page errors.'
- id: MM641
  field: MAKT.MAKTX
  check_class: cross_field_check
  grain: MAKT
  fail_when: '`MAKT.MAKTX`.str.fullmatch(''[0-9 ./-]+'')'
  severity: low
  dimension: accuracy
  message: Material description consists only of digits
  why_it_matters: A description made only of digits and separators is a number (old material number, drawing or GTIN), not
    a name. Users cannot recognise the material from it.
  rule_authority: best_practice
  sap_impact: Buyers, planners and warehouse staff cannot identify the material; searches by name find nothing.
  fix_map:
    __other__: Enter a descriptive name in MM02 (Additional data > Descriptions) and keep the number in its own field.
  record_fix_template: 'Material {MAKT.MATNR}, language {MAKT.SPRAS}: description ''{actual_value}'' contains no letters.'
- id: MM642
  field: MAKT.MAKTX
  check_class: cross_field_check
  grain: MAKT
  fail_when: '`MAKT.MAKTX`.str.match(r''[^\w(\[]'')'
  severity: low
  dimension: validity
  message: Material description starts with a special character
  why_it_matters: 'Descriptions that start with a symbol (*, -, ., #) are usually status markers or load artefacts. They sort
    apart from the real names in lists and search helps.'
  rule_authority: best_practice
  sap_impact: Alphabetical lists, search helps and catalogues place the material out of order.
  fix_map:
    __other__: Remove the leading symbol in MM02 (Additional data > Descriptions); use material status for blocking.
  record_fix_template: 'Material {MAKT.MATNR}, language {MAKT.SPRAS}: description ''{actual_value}'' starts with a special
    character.'
- id: MM643
  field: MAKT.MAKTX
  check_class: cross_field_check
  grain: MAKT
  fail_when: '`MAKT.MAKTX`.str.endswith(''-'') | `MAKT.MAKTX`.str.endswith('','') | `MAKT.MAKTX`.str.endswith(''/'') | `MAKT.MAKTX`.str.endswith('';'')
    | `MAKT.MAKTX`.str.endswith('':'') | `MAKT.MAKTX`.str.endswith(''&'') | `MAKT.MAKTX`.str.endswith(''+'') | `MAKT.MAKTX`.str.endswith(''('')'
  severity: low
  dimension: accuracy
  message: Material description ends with a separator (likely cut off)
  why_it_matters: A description that ends with -, comma, /, &, + or an open bracket was cut off at 40 characters by a load
    program; the rest of the name is missing.
  rule_authority: best_practice
  sap_impact: Users see half a description; descriptions of similar materials become identical.
  fix_map:
    __other__: Shorten the description so it ends with a complete word in MM02 (Additional data > Descriptions); keep the
      full text in the basic data text.
  record_fix_template: 'Material {MAKT.MATNR}, language {MAKT.SPRAS}: description ''{actual_value}'' ends with a separator.'
- id: MM644
  field: MAKT.MAKTX
  check_class: cross_field_check
  grain: MAKT
  fail_when: '`MAKT.MAKTX`.str.islower()'
  severity: low
  dimension: validity
  message: Material description is entirely in lower case
  why_it_matters: Descriptions in a consistent case are easier to read on documents and labels. An all-lower-case description
    is usually a load from a source system that lost the case convention.
  rule_authority: best_practice
  sap_impact: Printed documents and catalogues mix case conventions.
  fix_map:
    __other__: Apply the company's description convention in MM02 (Additional data > Descriptions).
  record_fix_template: 'Material {MAKT.MATNR}, language {MAKT.SPRAS}: description ''{actual_value}'' is all lower case.'
- id: MM645
  field: MARA.MSTAE
  check_class: cross_field_check
  fail_when: (`MARA.LVORM` == 'X') & `MARA.MSTAE`.isna()
  severity: low
  dimension: lifecycle
  message: Material is flagged for deletion but has no blocking cross-plant status
  why_it_matters: The deletion flag only marks the material for archiving; until archiving runs, many transactions only warn.
    A blocking cross-plant material status stops purchasing, MRP and inventory from using it.
  rule_authority: best_practice
  sap_impact: Deleted materials keep appearing in purchase requisitions, MRP runs and S/4HANA migration scope.
  fix_map:
    __other__: Set a blocking cross-plant material status in MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA)
      (Basic data 1).
  record_fix_template: 'Material {MARA.MATNR}: flagged for deletion without a cross-plant status.'
- id: MM646
  field: MARA.SATNR
  check_class: cross_field_check
  fail_when: '`MARA.ATTYP`.isin([''00'', ''01'']) & `MARA.SATNR`.notna()'
  severity: medium
  dimension: consistency
  message: Single or generic material carries a generic material reference
  why_it_matters: Only variants (material category 02) belong to a generic material (SATNR). A single material (00) or a generic
    material (01) with SATNR set contradicts its own category.
  rule_authority: sap_hard_constraint
  sap_impact: Retail variant maintenance, assortments and article hierarchies treat the material inconsistently.
  fix_map:
    __other__: Clear the generic material or correct the material category.
  record_fix_template: 'Material {MARA.MATNR}: material category {MARA.ATTYP} with generic material {actual_value}.'
- id: MM647
  field: MARA.EAN11
  check_class: null_check
  applies_when:
    MARA.GDS_RELEVANT:
    - X
  severity: high
  dimension: completeness
  message: Material is relevant for global data synchronisation but has no GTIN
  why_it_matters: Global data synchronisation (GDS) publishes the material to GS1 data pools by its GTIN. A GDS-relevant material
    without a GTIN cannot be published.
  rule_authority: sap_hard_constraint
  sap_impact: The item is rejected by the data pool and does not reach trading partners.
  fix_map:
    __blank__: Maintain the GTIN in MM02 (ECC) or Fiori F1602 Manage Product Master Data (S/4HANA) or remove the GDS-relevant
      flag.
  record_fix_template: 'Material {MARA.MATNR}: GDS-relevant but no GTIN.'
- id: MM648
  field: MARA.EAN11
  check_class: null_check
  applies_when:
    MARA.GTIN_VARIANT:
      populated: true
  severity: medium
  dimension: completeness
  message: GTIN variant is set but the material has no GTIN
  why_it_matters: The GTIN variant identifies a version of a GTIN. Without the GTIN itself it has nothing to qualify.
  rule_authority: sap_hard_constraint
