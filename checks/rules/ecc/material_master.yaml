  fix_map:
    __other__: Replace '{invalid_value}' with one of the domain values via MM02 (ECC) or Fiori F1602 Manage Product Master
      Data (S/4HANA).
  record_fix_template: 'Material {MARC.MATNR}: MBEW.MLAST is ''{actual_value}''.'
- id: MM181
  field: MBEW.BKLAS
  check_class: referential_check
  severity: critical
  dimension: validity
  message: Valuation class (MBEW.BKLAS) is not defined in the system's configuration (T025)
  why_it_matters: Valuation class is a key into the system's own configuration (T025). A value that is not configured there
    cannot be interpreted by the functions that read it; SAP's own screens never accept it, so it comes from direct loads,
    client copies or configuration deleted after the fact.
  rule_authority: sap_hard_constraint
  sap_impact: Account determination for every goods movement and invoice of the material fails (no G/L account found).
  fix_map:
    __other__: '''{invalid_value}'' is not in T025. Correct the value via MM02 (ECC) or Fiori F1602 Manage Product Master
      Data (S/4HANA) or, if the value is genuinely needed, create it in customizing (OMSK).'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: valuation class ''{actual_value}'' is not configured
    (T025).'
- id: MM182
  field: MARC.MMSTA
  check_class: referential_check
  severity: high
  dimension: validity
  message: Plant-specific material status (MARC.MMSTA) is not defined in the system's configuration (T141)
  why_it_matters: Plant-specific material status is a key into the system's own configuration (T141). A value that is not
    configured there cannot be interpreted by the functions that read it; SAP's own screens never accept it, so it comes
    from direct loads, client copies or configuration deleted after the fact.
  rule_authority: sap_hard_constraint
  sap_impact: 'The status cannot be interpreted: the procurement, production or sales blocks it should enforce do not apply.'
  fix_map:
    __other__: '''{invalid_value}'' is not in T141. Correct the value via MM02 (ECC) or Fiori F1602 Manage Product Master
      Data (S/4HANA) or, if the value is genuinely needed, create it in customizing (OMS4).'
  record_fix_template: 'Material {MARC.MATNR}, plant {MARC.WERKS}: plant-specific material status ''{actual_value}'' is
    not configured (T141).'
- id: MM183
  field: MARA.MSTAV
  check_class: referential_check
