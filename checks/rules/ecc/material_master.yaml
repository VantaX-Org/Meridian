  message: Distribution channel (MVKE.VTWEG) is not defined in the system's configuration (TVTW)
  why_it_matters: The sales view of a material is keyed by distribution channel. A channel that is not defined in TVTW can
    never be part of a sales area, so the sales view can never be used in an order.
  rule_authority: sap_hard_constraint
  sap_impact: Sales orders for the material in this distribution channel fail; the sales view is dead data.
