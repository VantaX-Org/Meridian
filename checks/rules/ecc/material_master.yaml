- id: MM745
  field: MARD.LMINB
  check_class: cross_field_check
  grain: MARD
  applies_when:
    MARD.DISKZ:
    - '1'
  fail_when: ~(`MARD.LMINB` > 0)
  severity: high
  dimension: completeness
  message: Storage location planned separately has no reorder point
  why_it_matters: With storage-location MRP indicator 1 the location is planned by its own reorder point (LMINB). Without
    one no replenishment is ever triggered.
  rule_authority: sap_hard_constraint
  sap_impact: The storage location runs empty without proposals.
  fix_map:
    __other__: Maintain the storage location reorder point in MM02 MRP 4, or clear indicator 1.
  record_fix_template: 'Material {MARD.MATNR}, plant {MARD.WERKS}, storage location {MARD.LGORT}: reorder point {actual_value}.'
- id: MM746
  field: MARD.LMINB
  check_class: cross_field_check
  grain: MARD
  applies_when:
    MARD.DISKZ:
      blank: true
  fail_when: '`MARD.LMINB` > 0'
  severity: low
  dimension: consistency
  message: Storage location reorder point is set but the location is not planned separately
  why_it_matters: The storage location reorder point (LMINB) is read only with MRP indicator 1. Otherwise it is ignored.
  rule_authority: best_practice
  sap_impact: MRP ignores the value; planners believe the location is replenished.
  fix_map:
    __other__: Clear the reorder point in MM02 MRP 4 or set storage-location MRP indicator 1.
  record_fix_template: 'Material {MARD.MATNR}, plant {MARD.WERKS}, storage location {MARD.LGORT}: reorder point {actual_value}
    with MRP indicator ''{MARD.DISKZ}''.'
  auto_fix:
    steps:
    - op: set
      value: '0'
    confidence: low
- id: MM747
