  applies_when:
    MARA.LVORM:
    - X
  fail_when: '`MVKE.LVORM`.isna()'
  severity: medium
  dimension: consistency
  message: Sales row is active although the material is flagged for deletion
  why_it_matters: When the material is flagged for deletion at client level, every sales organisation row should carry the
    flag too. Otherwise the material can still be sold from that organisation until the deletion run.
  rule_authority: best_practice
  sap_impact: Sales orders can still be created for a material that is being retired.
  fix_map:
    __other__: Set the deletion flag in MM06 for the sales row, or remove the client-level flag.
  record_fix_template: 'Material {MVKE.MATNR}, sales org {MVKE.VKORG}, distribution channel {MVKE.VTWEG}: client-level deletion
    flag {MARA.LVORM} but sales row is not flagged.'
  auto_fix:
    steps:
    - op: set
      value: X
    confidence: medium
