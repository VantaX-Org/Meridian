  record_fix_template: 'Material {MVKE.MATNR}, sales org {MVKE.VKORG}, distribution channel {MVKE.VTWEG}: material pricing
    group is blank.'
- id: MM363
  field: MVKE.AUMNG
  check_class: cross_field_check
  fail_when: (`MVKE.AUMNG` > 0) & (`MVKE.LFMNG` > 0) & (`MVKE.AUMNG` > `MVKE.LFMNG`)
  severity: low
  dimension: accuracy
  message: Minimum order quantity is larger than the minimum delivery quantity
  why_it_matters: The minimum order quantity (AUMNG) is the least a customer may order; the minimum delivery quantity (LFMNG)
    is the least that may be delivered. A minimum order above the minimum delivery means the delivery rule can never be applied.
  rule_authority: best_practice
  sap_impact: Sales orders are blocked or confirmed with a quantity that the delivery rule rejects.
  fix_map:
    __other__: 'Align both quantities in MM02 Sales: Sales org. 2.'
  record_fix_template: 'Material {MVKE.MATNR}, sales org {MVKE.VKORG}, distribution channel {MVKE.VTWEG}: minimum order quantity
    {MVKE.AUMNG} exceeds minimum delivery quantity {MVKE.LFMNG}.'
