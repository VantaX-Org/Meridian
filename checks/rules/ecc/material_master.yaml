  check_class: cross_field_check
  fail_when: '`MVKE.VMSTD`.notna() & `MVKE.VMSTA`.isna()'
  severity: low
  dimension: consistency
  message: Sales status valid-from date is set without a distribution-chain status
  why_it_matters: VMSTD is the date from which the status in VMSTA applies. A date with no status is a remnant of a removed
    status.
  rule_authority: best_practice
  sap_impact: Status audits and change reports show a date that belongs to nothing.
  fix_map:
    __other__: 'Clear the date in MM02 Sales: Sales org. 1 or enter the status.'
  record_fix_template: 'Material {MVKE.MATNR}, sales org {MVKE.VKORG}, distribution channel {MVKE.VTWEG}: status valid-from
    date {actual_value} but no distribution-chain status.'
- id: MM365
