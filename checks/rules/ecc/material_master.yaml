- id: MM162
  field: MARM.GEWEI
  check_class: cross_field_check
  fail_when: (`MARM.BRGEW` > 0) & `MARM.GEWEI`.isna()
  severity: medium
  dimension: completeness
  message: The weight of the alternative unit of measure is maintained without its unit
  why_it_matters: A weight value is a quantity field whose meaning is defined by its unit field (MARM.GEWEI); SAP screens
