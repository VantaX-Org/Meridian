  rule_authority: sap_hard_constraint
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Re-save the address in BP so SAP rebuilds the search field.
  record_fix_template: 'E-mail address {ADR6.ADDRNUMBER}: e-mail address is set but the search field is blank.'
- id: BP392
  field: ADR6.DFT_RECEIV
  check_class: cross_field_check
  fail_when: (`ADR6.DFT_RECEIV` == 'X') & (`ADR6.FLG_NOUSE` == 'X')
  grain: ADR6
  severity: low
  dimension: consistency
  message: Default e-mail receiver is also flagged as not to be used
  why_it_matters: An address cannot be both the default receiver and excluded from use.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Clear one of the two flags.
  record_fix_template: 'E-mail address {ADR6.ADDRNUMBER}: default e-mail receiver is also flagged as not to be used.'
- id: BP393
  field: ADR6.HOME_FLAG
  check_class: cross_field_check
  fail_when: (`ADR6.HOME_FLAG` == 'X') & (`ADR6.PERSNUMBER`.isna())
  grain: ADR6
  severity: low
  dimension: consistency
  message: E-mail is flagged as private but is not linked to a person
  why_it_matters: A private address belongs to a contact person. Without a person number the flag points nowhere.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Link the address to the person or clear the flag.
  record_fix_template: 'E-mail address {ADR6.ADDRNUMBER}: e-mail is flagged as private but is not linked to a person.'
- id: BP394
  field: ADR6.VALID_TO
  check_class: cross_field_check
  fail_when: '`ADR6.VALID_TO` < `ADR6.VALID_FROM`'
  require_populated: true
  grain: ADR6
  severity: medium
  dimension: consistency
  message: E-mail valid-to is before valid-from
  why_it_matters: A validity interval that ends before it starts is never active.
  rule_authority: sap_hard_constraint
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Correct the validity dates.
  record_fix_template: 'E-mail address {ADR6.ADDRNUMBER}: e-mail valid-to is before valid-from.'
- id: BP395
  field: CVI_CUST_LINK.CRUSER
  check_class: cross_field_check
  fail_when: '`CVI_CUST_LINK.CRDAT`.notna() & `CVI_CUST_LINK.CRUSER`.isna()'
  grain: CVI_CUST_LINK
  severity: low
  dimension: completeness
  message: Link has a creation date but no creating user
  why_it_matters: The link audit trail names who created the customer-partner link. A date without a user cannot be traced.
  rule_authority: best_practice
  sap_impact: The record is incomplete after migration; downstream processes fall back to defaults or stop.
  fix_map:
    __other__: None needed in SAP; document the source of the load.
  record_fix_template: 'Customer link {CVI_CUST_LINK.PARTNER_GUID}: link has a creation date but no creating user.'
- id: BP396
  field: CVI_CUST_LINK.CRDAT
  check_class: cross_field_check
  fail_when: '`CVI_CUST_LINK.CRDAT` > @today'
  require_populated: true
  grain: CVI_CUST_LINK
  severity: medium
  dimension: validity
  message: Link creation date is in the future
  why_it_matters: A link cannot be created tomorrow. A future date comes from a faulty load or wrong system clock.
  rule_authority: sap_hard_constraint
  sap_impact: The value is rejected or misread by S/4HANA conversion and by downstream interfaces.
  fix_map:
    __other__: Correct the date at source.
  record_fix_template: 'Customer link {CVI_CUST_LINK.PARTNER_GUID}: link creation date is in the future.'
- id: BP397
  field: CVI_CUST_LINK.CUSTOMER
  check_class: cross_field_check
  fail_when: (`BUT000.TYPE` == '2') & `BUT000.NAME_ORG1`.notna() & `KNA1.NAME1`.notna() & (`BUT000.NAME_ORG1`.str.strip().str.upper()
    != `KNA1.NAME1`.str.strip().str.upper())
  grain: CVI_CUST_LINK
  severity: medium
  dimension: consistency
  message: Organisation partner name differs from the linked customer name
  why_it_matters: CVI keeps the business partner name and KNA1.NAME1 in step. A difference means one side was changed outside
    the synchronisation.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Correct the name on the side that is wrong and re-synchronise.
  record_fix_template: 'Customer link {CVI_CUST_LINK.PARTNER_GUID}: organisation partner name differs from the linked customer
    name.'
