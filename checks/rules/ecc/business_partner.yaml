  check_class: cross_field_check
  fail_when: '`ADRC.COUNTY_CODE`.notna() & `ADRC.COUNTY`.isna()'
  grain: ADRC
  severity: low
  dimension: consistency
  message: County code is set but the county name is blank
  why_it_matters: The code and the name describe the same county; one without the other prints incompletely.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Fill COUNTY or clear the code.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: county code is set but the county name is blank.'
