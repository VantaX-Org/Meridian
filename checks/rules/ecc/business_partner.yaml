  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Link the number to the person or clear the flag.
  record_fix_template: 'Telephone {ADR2.ADDRNUMBER}: telephone is flagged as private but is not linked to a person.'
- id: BP390
  field: ADR2.VALID_TO
  check_class: cross_field_check
  fail_when: '`ADR2.VALID_TO` < `ADR2.VALID_FROM`'
  require_populated: true
  grain: ADR2
  severity: medium
  dimension: consistency
  message: Telephone valid-to is before valid-from
  why_it_matters: A validity interval that ends before it starts is never active.
  rule_authority: sap_hard_constraint
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Correct the validity dates.
  record_fix_template: 'Telephone {ADR2.ADDRNUMBER}: telephone valid-to is before valid-from.'
- id: BP391
  field: ADR6.SMTP_ADDR
