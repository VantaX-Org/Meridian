  check_class: cross_field_check
  fail_when: '`ADRC.NAME4`.notna() & `ADRC.NAME3`.isna()'
  grain: ADRC
  severity: low
  dimension: consistency
  message: Address name 4 is filled but name 3 is blank
  why_it_matters: Name lines fill in order; a gap prints a hole in the address block.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Shift the text up into NAME3, or clear NAME4.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: address name 4 is filled but name 3 is blank.'
- id: BP353
