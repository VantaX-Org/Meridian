  check_class: cross_field_check
  fail_when: '`ADRC.TOWNSHIP_CODE`.notna() & `ADRC.TOWNSHIP`.isna()'
  grain: ADRC
  severity: low
  dimension: consistency
  message: Township code is set but the township name is blank
  why_it_matters: The code and the name describe the same township; one without the other prints incompletely.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Fill TOWNSHIP or clear the code.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: township code is set but the township name is blank.'
- id: BP383
  field: ADRC.DELI_SERV_TYPE
  check_class: cross_field_check
  fail_when: '`ADRC.DELI_SERV_TYPE`.notna() != `ADRC.DELI_SERV_NUMBER`.notna()'
  grain: ADRC
  severity: low
  dimension: consistency
  message: Delivery service type and number are not both filled
  why_it_matters: A delivery service (for example a post bag) needs both its type and its number.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Fill both or clear both.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: delivery service type and number are not both filled.'
- id: BP384
  field: ADRC.EXTENSION1
  check_class: cross_field_check
  fail_when: '`ADRC.EXTENSION1`.notna() | `ADRC.EXTENSION2`.notna()'
  grain: ADRC
  severity: low
  dimension: validity
  message: Data-conversion extension fields hold values
  why_it_matters: EXTENSION1 and EXTENSION2 are reserved for data conversion. Leftover values carry stale migration data into
    S/4HANA.
  rule_authority: s4hana_migration
  sap_impact: The value is rejected or misread by S/4HANA conversion and by downstream interfaces.
  fix_map:
    __other__: Clear the fields after confirming nothing reads them.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: data-conversion extension fields hold values.'
- id: BP385
  field: ADRC.DATE_TO
  check_class: cross_field_check
  fail_when: '`ADRC.DATE_TO` < `ADRC.DATE_FROM`'
  require_populated: true
  grain: ADRC
  severity: medium
  dimension: consistency
  message: Address valid-to date is before its valid-from date
  why_it_matters: A validity interval that ends before it starts is never active; the address is invisible to every process.
  rule_authority: sap_hard_constraint
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Correct the validity dates.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: address valid-to date is before its valid-from date.'
- id: BP386
  field: ADR2.TEL_EXTENS
  check_class: cross_field_check
  fail_when: '`ADR2.TEL_EXTENS`.notna() & `ADR2.TEL_NUMBER`.isna()'
  grain: ADR2
  severity: low
  dimension: consistency
  message: Telephone extension is set but the number is blank
  why_it_matters: An extension needs the main number it belongs to.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Enter the number or clear the extension.
  record_fix_template: 'Telephone {ADR2.ADDRNUMBER}: telephone extension is set but the number is blank.'
- id: BP387
  field: ADR2.TELNR_LONG
  check_class: cross_field_check
  fail_when: '`ADR2.TEL_NUMBER`.notna() & `ADR2.TELNR_LONG`.isna()'
  grain: ADR2
  severity: low
  dimension: consistency
  message: Telephone number is set but the long number is blank
  why_it_matters: TELNR_LONG is the number in international format used by dialling and SMS. A blank copy breaks them.
  rule_authority: sap_hard_constraint
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Re-save the number in BP so SAP rebuilds it.
  record_fix_template: 'Telephone {ADR2.ADDRNUMBER}: telephone number is set but the long number is blank.'
- id: BP388
  field: ADR2.DFT_RECEIV
  check_class: cross_field_check
  fail_when: (`ADR2.DFT_RECEIV` == 'X') & (`ADR2.FLG_NOUSE` == 'X')
  grain: ADR2
  severity: low
  dimension: consistency
  message: Default SMS receiver is also flagged as not to be used
  why_it_matters: A number cannot be both the default receiver and excluded from use.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Clear one of the two flags.
  record_fix_template: 'Telephone {ADR2.ADDRNUMBER}: default SMS receiver is also flagged as not to be used.'
- id: BP389
  field: ADR2.HOME_FLAG
  check_class: cross_field_check
  fail_when: (`ADR2.HOME_FLAG` == 'X') & (`ADR2.PERSNUMBER`.isna())
  grain: ADR2
  severity: low
  dimension: consistency
  message: Telephone is flagged as private but is not linked to a person
