  grain: ADRC
  severity: medium
  dimension: completeness
  message: PO box is set but no postal code is held
  why_it_matters: A PO box needs a postal code (PO box code or city code) to be deliverable.
  rule_authority: best_practice
  sap_impact: The record is incomplete after migration; downstream processes fall back to defaults or stop.
  fix_map:
    __other__: Enter the PO box postal code.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: pO box is set but no postal code is held.'
- id: BP358
  field: ADRC.PO_BOX_LOC
