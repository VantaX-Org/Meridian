- id: BP400
  field: CVI_VEND_LINK.VENDOR
  check_class: cross_field_check
  fail_when: (`BUT000.TYPE` == '2') & `BUT000.NAME_ORG1`.notna() & `LFA1.NAME1`.notna() & (`BUT000.NAME_ORG1`.str.strip().str.upper()
    != `LFA1.NAME1`.str.strip().str.upper())
  grain: CVI_VEND_LINK
  severity: medium
  dimension: consistency
  message: Organisation partner name differs from the linked vendor name
  why_it_matters: CVI keeps the business partner name and LFA1.NAME1 in step. A difference means one side was changed outside
    the synchronisation.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Correct the name on the side that is wrong and re-synchronise.
