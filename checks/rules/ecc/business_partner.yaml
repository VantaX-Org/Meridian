- id: BP202
  field: BUT000.PARTNER
  check_class: exists_check
  target_table: BUT100
  target_fields:
  - PARTNER
  severity: medium
  dimension: completeness
  message: Business partner has no role
  why_it_matters: Roles (customer, vendor, contact person and so on) decide which data the partner carries and which processes
    may use it. A partner with no role at all is either an incomplete load or an orphan.
  rule_authority: best_practice
  sap_impact: The partner cannot be used in sales, purchasing or FI; it inflates partner counts in reporting.
  fix_map:
    __other__: Assign the required role in BP, or archive the partner if it is no longer needed.
  record_fix_template: 'Business partner {BUT000.PARTNER}: no role assigned.'
