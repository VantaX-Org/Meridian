- id: BP401
  field: CVI_CUST_LINK.CUSTOMER
  check_class: cross_field_check
  fail_when: '`BUT000.BU_SORT1`.notna() & `KNA1.KUNNR`.notna() & `KNA1.SORTL`.isna()'
  grain: CVI_CUST_LINK
  severity: low
  dimension: consistency
  message: Partner search term 1 is set but the linked customer has no search term
  why_it_matters: CVI keeps BUT000.BU_SORT1 and KNA1.SORTL in step. A blank on the customer side means the synchronisation
    did not run for that field.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Re-run the synchronisation or fill SORTL.
  record_fix_template: 'Customer link {CVI_CUST_LINK.PARTNER_GUID}: partner search term 1 is set but the linked customer has
    no search term.'
