  grain: ADRC
  severity: low
  dimension: consistency
  message: Address name 2 repeats name 1
  why_it_matters: Repeating the name on a second line prints it twice on every label and letter.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Clear NAME2 or enter the real second line.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: address name 2 repeats name 1.'
- id: BP352
