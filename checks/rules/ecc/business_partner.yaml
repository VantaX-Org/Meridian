  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Clear the reason, or enter the PO box.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: pO box is marked undeliverable but no PO box is held.'
- id: BP362
  field: ADRC.DONT_USE_S
