  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Clear the flag or the number.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: pO box is flagged ''without number'' but a PO box number is held.'
- id: BP361
  field: ADRC.DONT_USE_P
