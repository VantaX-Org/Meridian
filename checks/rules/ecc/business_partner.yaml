    mean one address was loaded twice.
  rule_authority: best_practice
  sap_impact: The same fact is held twice; programs pick one copy at random and the others drift.
  fix_map:
    __other__: Compare the addresses in BP and remove the duplicate.
  record_fix_template: 'Business partner address {BUT020.PARTNER}: several address assignments share the same external address
    number.'
