  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Clear the reason, or enter the street.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: street address is marked undeliverable but no street is held.'
- id: BP363
  field: ADRC.STR_SUPPL2
  check_class: cross_field_check
  fail_when: '`ADRC.STR_SUPPL2`.notna() & `ADRC.STR_SUPPL1`.isna()'
  grain: ADRC
  severity: low
  dimension: consistency
  message: Street 3 is filled but street 2 is blank
  why_it_matters: Street lines fill in order; a gap prints a hole in the address.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Shift the text up into STR_SUPPL1, or clear STR_SUPPL2.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: street 3 is filled but street 2 is blank.'
- id: BP364
  field: ADRC.STR_SUPPL3
  check_class: cross_field_check
  fail_when: '`ADRC.STR_SUPPL3`.notna() & `ADRC.STR_SUPPL2`.isna()'
  grain: ADRC
  severity: low
  dimension: consistency
  message: Street 4 is filled but street 3 is blank
  why_it_matters: Street lines fill in order; a gap prints a hole in the address.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Shift the text up into STR_SUPPL2, or clear STR_SUPPL3.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: street 4 is filled but street 3 is blank.'
- id: BP365
  field: ADRC.ROOMNUMBER
  check_class: cross_field_check
  fail_when: (`ADRC.ROOMNUMBER`.notna() | `ADRC.FLOOR`.notna()) & `ADRC.STREET`.isna()
  grain: ADRC
  severity: low
  dimension: consistency
  message: Room or floor is set but there is no street
  why_it_matters: A room or floor refers to a building on a street. Without a street the detail points nowhere.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Enter the street, or clear room and floor.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: room or floor is set but there is no street.'
- id: BP366
  field: ADRC.ADDR_GROUP
  check_class: null_check
  grain: ADRC
  severity: low
  dimension: completeness
  message: Address has no address group
  why_it_matters: The address group steers which fields are shown and which numbering applies. Blank means the default rules
    are guessed.
  rule_authority: best_practice
  sap_impact: The record is incomplete after migration; downstream processes fall back to defaults or stop.
  fix_map:
    __blank__: Set the address group in BP.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: address has no address group.'
- id: BP367
  field: ADRC.SORT1
  check_class: cross_field_check
  fail_when: '`ADRC.NAME1`.notna() & `ADRC.SORT1`.isna()'
  grain: ADRC
  severity: low
  dimension: completeness
  message: Address search term 1 is blank although the address has a name
  why_it_matters: Search term 1 is what address search uses. Without it the address is found only by exact name.
  rule_authority: best_practice
  sap_impact: The record is incomplete after migration; downstream processes fall back to defaults or stop.
  fix_map:
    __other__: Fill SORT1.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: address search term 1 is blank although the address has a name.'
- id: BP368
  field: ADRC.SORT2
  check_class: cross_field_check
  fail_when: '`ADRC.SORT2`.notna() & `ADRC.SORT1`.isna()'
  grain: ADRC
  severity: low
  dimension: consistency
  message: Address search term 2 is filled but search term 1 is blank
  why_it_matters: Search term 1 is the primary search key.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Fill SORT1 or clear SORT2.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: address search term 2 is filled but search term 1 is blank.'
- id: BP369
  field: ADRC.DEFLT_COMM
  check_class: cross_field_check
  fail_when: (`ADRC.DEFLT_COMM` == 'FAX') & `ADRC.FAX_NUMBER`.isna()
  grain: ADRC
  severity: medium
  dimension: consistency
  message: Standard communication method is fax but no fax number is held
  why_it_matters: Output set to the standard method fax has no number to send to; the document fails or is lost.
  rule_authority: sap_hard_constraint
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Enter a fax number or change the standard method.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: standard communication method is fax but no fax number is held.'
- id: BP370
  field: ADRC.DEFLT_COMM
  check_class: cross_field_check
  fail_when: (`ADRC.DEFLT_COMM` == 'TEL') & `ADRC.TEL_NUMBER`.isna()
  grain: ADRC
  severity: medium
  dimension: consistency
  message: Standard communication method is telephone but no telephone number is held
  why_it_matters: Output set to the standard method telephone has no number to call.
  rule_authority: sap_hard_constraint
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Enter a telephone number or change the standard method.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: standard communication method is telephone but no telephone number is held.'
- id: BP371
  field: ADRC.DEFLT_COMM
  check_class: cross_field_check
  fail_when: (`ADRC.DEFLT_COMM` == 'INT') & `ADRC.FLAGCOMM6`.isna()
  grain: ADRC
  severity: medium
  dimension: consistency
  message: Standard communication method is e-mail but the e-mail flag is blank
  why_it_matters: Output set to the standard method e-mail has no recipient address; mail output fails.
  rule_authority: sap_hard_constraint
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Enter an e-mail address or change the standard method.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: standard communication method is e-mail but the e-mail flag is blank.'
- id: BP372
  field: ADRC.TEL_EXTENS
  check_class: cross_field_check
  fail_when: '`ADRC.TEL_EXTENS`.notna() & `ADRC.TEL_NUMBER`.isna()'
  grain: ADRC
  severity: low
  dimension: consistency
  message: Telephone extension is set but the telephone number is blank
  why_it_matters: An extension needs the main number it belongs to.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Enter the number or clear the extension.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: telephone extension is set but the telephone number is blank.'
- id: BP373
  field: ADRC.FAX_EXTENS
  check_class: cross_field_check
  fail_when: '`ADRC.FAX_EXTENS`.notna() & `ADRC.FAX_NUMBER`.isna()'
  grain: ADRC
  severity: low
  dimension: consistency
  message: Fax extension is set but the fax number is blank
  why_it_matters: An extension needs the main number it belongs to.
  rule_authority: best_practice
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Enter the number or clear the extension.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: fax extension is set but the fax number is blank.'
- id: BP374
  field: ADRC.FAX_NUMBER
  check_class: cross_field_check
  fail_when: '`ADRC.FAX_NUMBER`.notna() & ~`ADRC.FAX_NUMBER`.str.strip().str.fullmatch(''[0-9 +()/.-]+'')'
  grain: ADRC
  severity: medium
  dimension: validity
  message: Fax number contains characters other than digits, space, plus, brackets, dot, slash and hyphen
  why_it_matters: Fax gateways only accept dialling characters. Letters or symbols make the transmission fail.
  rule_authority: best_practice
  sap_impact: The value is rejected or misread by S/4HANA conversion and by downstream interfaces.
  fix_map:
    __other__: Correct the fax number.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: fax number contains characters other than digits, space, plus, brackets,
    dot, slash and hyphen.'
- id: BP375
  field: ADRC.MC_NAME1
  check_class: cross_field_check
  fail_when: '`ADRC.NAME1`.notna() & `ADRC.MC_NAME1`.isna()'
  grain: ADRC
  severity: low
  dimension: consistency
  message: Search field MC_NAME1 is blank although NAME1 is filled
  why_it_matters: MC_NAME1 is the upper-case search copy of NAME1. A blank copy hides the address from address search.
  rule_authority: sap_hard_constraint
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Re-save the address so SAP rebuilds the search fields.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: search field MC_NAME1 is blank although NAME1 is filled.'
- id: BP376
  field: ADRC.MC_CITY1
  check_class: cross_field_check
  fail_when: '`ADRC.CITY1`.notna() & `ADRC.MC_CITY1`.isna()'
  grain: ADRC
  severity: low
  dimension: consistency
  message: Search field MC_CITY1 is blank although CITY1 is filled
  why_it_matters: MC_CITY1 is the upper-case search copy of CITY1. A blank copy hides the address from address search.
  rule_authority: sap_hard_constraint
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Re-save the address so SAP rebuilds the search fields.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: search field MC_CITY1 is blank although CITY1 is filled.'
- id: BP377
  field: ADRC.MC_STREET
  check_class: cross_field_check
  fail_when: '`ADRC.STREET`.notna() & `ADRC.MC_STREET`.isna()'
  grain: ADRC
  severity: low
  dimension: consistency
  message: Search field MC_STREET is blank although STREET is filled
  why_it_matters: MC_STREET is the upper-case search copy of STREET. A blank copy hides the address from address search.
  rule_authority: sap_hard_constraint
  sap_impact: Related fields disagree, so different programs read different answers from the same partner.
  fix_map:
    __other__: Re-save the address so SAP rebuilds the search fields.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: search field MC_STREET is blank although STREET is filled.'
- id: BP378
  field: ADRC.TIME_ZONE
  check_class: null_check
  grain: ADRC
  severity: low
  dimension: completeness
  message: Address has no time zone
  why_it_matters: Time zone drives date and time conversion for appointments and service orders at the address.
  rule_authority: best_practice
  sap_impact: The record is incomplete after migration; downstream processes fall back to defaults or stop.
  fix_map:
    __blank__: Set the time zone in BP > Address.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: address has no time zone.'
- id: BP379
  field: ADRC.TAXJURCODE
  check_class: null_check
  grain: ADRC
  applies_when:
    ADRC.COUNTRY:
    - US
  severity: medium
  dimension: completeness
  message: US address has no tax jurisdiction code
  why_it_matters: US sales tax is calculated from the jurisdiction code. Without it tax determination fails or falls back
    to the wrong rate.
  rule_authority: regulatory
  sap_impact: The record is incomplete after migration; downstream processes fall back to defaults or stop.
  fix_map:
    __blank__: Set the jurisdiction code in BP > Address.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: uS address has no tax jurisdiction code.'
- id: BP380
  field: ADRC.ADRC_ERR_STATUS
  check_class: cross_field_check
  fail_when: '`ADRC.ADRC_ERR_STATUS` == ''E'''
  grain: ADRC
  severity: medium
  dimension: validity
  message: Address carries an error status from SAP address checks
  why_it_matters: SAP sets status E when the address failed its own checks. Such addresses are rejected by postal validation
    and by S/4HANA conversion.
  rule_authority: sap_hard_constraint
  sap_impact: The value is rejected or misread by S/4HANA conversion and by downstream interfaces.
  fix_map:
    __other__: Open the address in BP and correct the reported error.
  record_fix_template: 'Address {ADRC.ADDRNUMBER}: address carries an error status from SAP address checks.'
- id: BP381
