module: project_system
target_state: ECC_AND_S4HANA
rules:
- id: PS001
  field: PROJ.PSPID
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Project definition ID is missing
  why_it_matters: PSPID is the external key users type in CJ20N, CN41 and every PS report. A project definition without it
    cannot be found, selected or referenced by its WBS elements, orders or sales documents.
  rule_authority: sap_hard_constraint
  sap_impact: The project cannot be displayed, planned or settled by ID. Reports that select by project definition skip it.
  fix_map:
    __blank__: 'Project definition has no ID. Recreate it in CJ20N with a valid ID (number range and edit mask in OPSK). Do
      not patch the table: the WBS elements point at the internal number.'
  record_fix_template: 'Project {PROJ.PSPNR}: PSPID is {actual_value}. Recreate the project definition in CJ20N.'
- id: PS002
  field: PROJ.PSPID
  check_class: regex_check
  pattern: ^[A-Z0-9][A-Z0-9\-./_]{0,23}$
  severity: medium
  dimension: validity
  message: Project definition ID has characters outside the usual project coding mask
  why_it_matters: Project IDs are built with an edit mask (OPSK) that fixes the separators and character classes. Values with
    spaces, lower-case or stray symbols point at a load that bypassed the mask and will not match the keys users type.
  rule_authority: best_practice
  sap_impact: The project is hard to find in CJ20N / CN41 selections, and external interfaces that rebuild the ID from the
    mask do not match it.
  fix_map:
    __other__: Project ID '{invalid_value}' does not fit the project coding mask. Check the mask in OPSK and rename the project
      (CJ02 does not rename; copy to a new ID with CJ20N and move the objects) or correct the load.
  record_fix_template: 'Project {PROJ.PSPNR}: PSPID ''{actual_value}'' does not fit the project coding mask. Review in OPSK.'
- id: PS003
  field: PROJ.POST1
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Project definition has no description
  why_it_matters: The description is the only readable identity of a project in selection lists, approval workflows and management
    reports.
  rule_authority: best_practice
  sap_impact: Project lists show an empty line; approvers and controllers cannot tell what the project is for.
  fix_map:
    __blank__: Enter the short description in CJ20N > Project definition > Basic data.
  record_fix_template: 'Project {PROJ.PSPNR}: POST1 is {actual_value}. Add a description in CJ20N.'
- id: PS004
  field: PROJ.VBUKR
  check_class: null_check
  severity: high
  dimension: completeness
  message: Project definition has no company code
  why_it_matters: The project-definition company code is the default for every WBS element created under it. Without it the
    elements start without a legal entity and postings cannot be assigned to a balance sheet.
  rule_authority: sap_hard_constraint
  sap_impact: WBS elements inherit no company code; account assignment to the project fails with a missing-company-code message.
  fix_map:
    __blank__: Set the company code in CJ20N > Project definition > Control data. Existing WBS elements keep their own company
      code (PRPS.PBUKR).
  record_fix_template: 'Project {PROJ.PSPNR}: VBUKR is {actual_value}. Set the company code in CJ20N.'
- id: PS005
  field: PROJ.VKOKR
  check_class: null_check
  severity: high
  dimension: completeness
  message: Project definition has no controlling area
  why_it_matters: A project belongs to exactly one controlling area. All costs, plan values and settlements of its WBS elements
    are held in that area.
  rule_authority: sap_hard_constraint
  sap_impact: No controlling area means no cost collection, no planning and no settlement for the project.
  fix_map:
    __blank__: Set the controlling area in CJ20N > Project definition > Control data.
  record_fix_template: 'Project {PROJ.PSPNR}: VKOKR is {actual_value}. Set the controlling area in CJ20N.'
- id: PS006
  field: PROJ.VBUKR
  check_class: exists_check
  target_table: T001
  target_fields:
  - BUKRS
  severity: high
  dimension: validity
  message: Project company code is not a defined company code
  why_it_matters: The company code must exist in T001. An undefined code is left over from a deleted entity or a bad load.
  rule_authority: sap_hard_constraint
  sap_impact: Postings to the project's WBS elements are rejected because the legal entity does not exist.
  fix_map:
    __other__: Company code '{invalid_value}' is not defined in T001. Replace it in CJ20N, or create the company code (OX02)
      if the entity is real.
  record_fix_template: 'Project {PROJ.PSPNR}: company code {actual_value} is not in T001. Correct it in CJ20N.'
- id: PS007
  field: PROJ.VKOKR
  check_class: exists_check
  target_table: TKA01
  target_fields:
  - KOKRS
  severity: high
  dimension: validity
  message: Project controlling area is not a defined controlling area
  why_it_matters: The controlling area must exist in TKA01. All CO objects of the project are keyed by it.
  rule_authority: sap_hard_constraint
  sap_impact: Cost collection and settlement of the project fail because the controlling area does not exist.
  fix_map:
    __other__: Controlling area '{invalid_value}' is not defined in TKA01. Correct it in CJ20N or define the area (OKKP).
  record_fix_template: 'Project {PROJ.PSPNR}: controlling area {actual_value} is not in TKA01. Correct it in CJ20N.'
- id: PS008
  field: PROJ.VBUKR
  check_class: exists_check
  fields:
  - PROJ.VBUKR
  - PROJ.VKOKR
  target_table: TKA02
  target_fields:
  - BUKRS
  - KOKRS
  severity: high
  dimension: consistency
  message: Project company code is not assigned to the project's controlling area
  why_it_matters: A controlling area only controls the company codes assigned to it (OX19 / TKA02). A project whose company
    code belongs to another controlling area cannot collect costs consistently.
  rule_authority: sap_hard_constraint
  sap_impact: Postings from that company code do not reach the project's controlling area; settlement and reporting disagree.
  fix_map:
    __other__: Company code and controlling area do not match in TKA02. Fix the project's company code or controlling area
      in CJ20N, or correct the assignment in OX19.
  record_fix_template: 'Project {PROJ.PSPNR}: company code {PROJ.VBUKR} is not assigned to controlling area {PROJ.VKOKR}.
    Review in CJ20N and OX19.'
- id: PS009
  field: PROJ.PRCTR
  check_class: exists_check
  fields:
  - PROJ.VKOKR
  - PROJ.PRCTR
  target_table: CEPC
  target_fields:
  - KOKRS
  - PRCTR
  severity: medium
  dimension: validity
  message: Project profit centre does not exist in the project's controlling area
  why_it_matters: The profit centre on the project definition is the default for new WBS elements. It must exist in the same
    controlling area (CEPC).
  rule_authority: sap_hard_constraint
  sap_impact: New WBS elements inherit a profit centre that cannot be posted to, so postings fall back to the dummy profit
    centre or are rejected.
  fix_map:
    __other__: Profit centre '{invalid_value}' is not in CEPC for the project's controlling area. Create it (KE51) or choose
      an existing one in CJ20N.
  record_fix_template: 'Project {PROJ.PSPNR}: profit centre {actual_value} does not exist in controlling area {PROJ.VKOKR}.
    Review in KE53 and CJ20N.'
- id: PS010
  field: PROJ.VERNR
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Project has no person responsible
  why_it_matters: The project manager receives status, budget and deadline notifications, and approval workflows route to
    that person.
  rule_authority: best_practice
  sap_impact: Nobody owns the project; budget overruns and open items have no addressee.
  fix_map:
    __blank__: Enter the project manager in CJ20N > Project definition > Control data (persons responsible are maintained
      in the PS customising).
  record_fix_template: 'Project {PROJ.PSPNR}: VERNR is {actual_value}. Assign a project manager in CJ20N.'
- id: PS011
  field: PROJ.VERNR
  check_class: exists_check
  target_table: TCJ04
  target_fields:
  - VERNR
  severity: medium
  dimension: validity
  message: Project manager number is not a defined person responsible
  why_it_matters: VERNR must exist in TCJ04. A number that is not defined is left over after the person responsible was deleted.
  rule_authority: sap_hard_constraint
  sap_impact: Display of the project shows no name; notifications cannot be sent.
  fix_map:
    __other__: Person responsible '{invalid_value}' is not in TCJ04. Create the person in the PS customising or assign a defined
      one in CJ20N.
  record_fix_template: 'Project {PROJ.PSPNR}: project manager {actual_value} is not defined. Assign a valid person in CJ20N.'
- id: PS012
  field: PROJ.PLFAZ
  check_class: cross_field_check
  fail_when: '`PROJ.PLFAZ` > `PROJ.PLSEZ`'
  require_populated: true
  severity: high
  dimension: consistency
  message: Project planned start is after the planned finish
  why_it_matters: A project cannot finish before it starts. The dates drive scheduling, the default dates of new WBS elements
    and date-based reports.
  rule_authority: sap_hard_constraint
  sap_impact: Scheduling and deadline monitoring (CN41, CNS41) report negative durations; new WBS elements inherit impossible
    dates.
  fix_map:
    __other__: Planned start is after planned finish. Correct the dates in CJ20N > Project definition > Control data.
  record_fix_template: 'Project {PROJ.PSPNR}: planned start {PROJ.PLFAZ} is after planned finish {PROJ.PLSEZ}. Correct in
    CJ20N.'
- id: PS013
  field: PROJ.PWHIE
  check_class: null_check
  severity: high
  dimension: completeness
  message: Project definition has no WBS currency
  why_it_matters: The project currency is the default currency of every WBS element and the currency of plan, budget and commitments.
  rule_authority: sap_hard_constraint
  sap_impact: Planning and budgeting in the project cannot start; amounts have no currency.
  fix_map:
    __blank__: Set the project currency in CJ20N > Project definition > Control data.
  record_fix_template: 'Project {PROJ.PSPNR}: PWHIE is {actual_value}. Set the project currency in CJ20N.'
- id: PS014
  field: PROJ.PSPID
  check_class: uniqueness_check
  fields:
  - PROJ.PSPID
  normalize: alnum
  case_insensitive: true
  severity: medium
  dimension: uniqueness
  message: Project IDs that differ only in separators or case
  why_it_matters: P-1000 and P1000 are different keys to SAP but the same project to people. Twins split costs, budget and
    reporting between two shells.
  rule_authority: best_practice
  sap_impact: Costs are posted to the wrong twin; consolidated project reports understate both.
  fix_map:
    __other__: Compare both projects in CN41 and move the WBS elements of one into the other (CJ20N). Mark the empty shell
      for deletion (CJ02).
  record_fix_template: 'Project {PROJ.PSPNR}: PSPID has a twin that differs only in separators or case. Merge the two projects.'
- id: PS015
  field: PROJ.POST1
  check_class: similarity_check
  block_by:
  - PROJ.VBUKR
  threshold: 0.92
  exact_rule: false
  severity: medium
  dimension: uniqueness
  message: Near-duplicate project description in the same company code
  why_it_matters: Two projects with almost the same description in one company code are usually one project entered twice,
    or a copy that was never renamed.
  rule_authority: best_practice
  sap_impact: Budget, hours and costs are split across two project definitions; approvers pick the wrong one.
  fix_map:
    __other__: Compare the projects in CN41. Merge them or rename the copy so the description is unique.
  record_fix_template: 'Project {PROJ.PSPNR}: description ''{actual_value}'' is almost the same as another project in this
    company code.'
- id: PS016
  field: PRPS.POSID
  check_class: null_check
  severity: high
  dimension: completeness
  message: WBS element has no external ID
  why_it_matters: POSID is what users type in CJ20N, CJ03, KOB1 and CN41. Without it the element is anonymous.
  rule_authority: sap_hard_constraint
  sap_impact: The element cannot be selected by ID in postings or reports; cost and settlement documents show a blank WBS.
  fix_map:
    __blank__: WBS element has no ID. Recreate it in CJ20N with a valid ID and move dependent objects.
  record_fix_template: 'WBS element {PRPS.PSPNR}: POSID is {actual_value}. Recreate the element in CJ20N.'
- id: PS017
  field: PRPS.POSID
  check_class: regex_check
  pattern: ^[A-Z0-9][A-Z0-9\-./_]{0,23}$
  severity: medium
  dimension: validity
  message: WBS element ID has characters outside the usual coding mask
  why_it_matters: WBS IDs follow the project coding mask (OPSK). Spaces, lower-case or stray symbols indicate a load that
    skipped the mask.
  rule_authority: best_practice
  sap_impact: Users cannot key the element in postings; hierarchy reports sort it in the wrong place.
  fix_map:
    __other__: WBS element ID '{invalid_value}' does not fit the coding mask. Review in OPSK and CJ20N.
  record_fix_template: 'WBS element {PRPS.PSPNR}: POSID ''{actual_value}'' does not fit the coding mask.'
- id: PS018
  field: PRPS.POST1
  check_class: null_check
  severity: medium
  dimension: completeness
  message: WBS element has no description
  why_it_matters: Cost and commitment line items show the WBS description. A blank text makes budget owners guess what a cost
    belongs to.
  rule_authority: best_practice
  sap_impact: Reports and line items (CJI3) show elements by number only.
  fix_map:
    __blank__: Enter a description in CJ20N > WBS element > Basic data.
  record_fix_template: 'WBS element {PRPS.PSPNR}: POST1 is {actual_value}. Add a description in CJ20N.'
- id: PS019
  field: PRPS.PSPHI
  check_class: exists_check
  target_table: PROJ
  target_fields:
  - PSPNR
  severity: critical
  dimension: consistency
  message: WBS element points at a project definition that does not exist
  why_it_matters: Every WBS element belongs to one project definition (PROJ). An orphaned element cannot be reached in the
    Project Builder or any project report.
  rule_authority: sap_hard_constraint
  sap_impact: The element and its costs are invisible to project reporting, budgeting and settlement.
  fix_map:
    __other__: Project definition '{invalid_value}' is missing. Restore the project definition or archive the orphaned elements.
  record_fix_template: 'WBS element {PRPS.PSPNR}: project definition {actual_value} does not exist. Restore it or archive
    the element.'
- id: PS020
  field: PRPS.PBUKR
  check_class: null_check
  severity: high
  dimension: completeness
  message: WBS element has no company code
  why_it_matters: Postings to a WBS element are made in the company code of the element.
  rule_authority: sap_hard_constraint
  sap_impact: Postings to the element are rejected; the company code cannot be derived.
  fix_map:
    __blank__: Set the company code in CJ20N > WBS element > Assignments.
  record_fix_template: 'WBS element {PRPS.PSPNR}: PBUKR is {actual_value}. Set it in CJ20N.'
- id: PS021
  field: PRPS.PKOKR
  check_class: null_check
  severity: high
  dimension: completeness
  message: WBS element has no controlling area
  why_it_matters: Costs on a WBS element are collected in its controlling area.
  rule_authority: sap_hard_constraint
  sap_impact: Cost collection, planning and settlement of the element fail.
  fix_map:
    __blank__: Set the controlling area in CJ20N > WBS element > Assignments.
  record_fix_template: 'WBS element {PRPS.PSPNR}: PKOKR is {actual_value}. Set it in CJ20N.'
- id: PS022
  field: PRPS.PBUKR
  check_class: exists_check
  target_table: T001
  target_fields:
  - BUKRS
  severity: high
  dimension: validity
  message: WBS company code is not a defined company code
  why_it_matters: The company code must exist in T001.
  rule_authority: sap_hard_constraint
  sap_impact: Postings to the WBS element fail with an undefined company code.
  fix_map:
    __other__: Company code '{invalid_value}' is not in T001. Correct it in CJ20N.
  record_fix_template: 'WBS element {PRPS.PSPNR}: company code {actual_value} is not in T001.'
- id: PS023
  field: PRPS.PBUKR
  check_class: exists_check
  fields:
  - PRPS.PBUKR
  - PRPS.PKOKR
  target_table: TKA02
  target_fields:
  - BUKRS
  - KOKRS
  severity: high
  dimension: consistency
  message: WBS company code is not assigned to the WBS controlling area
  why_it_matters: The company code of the element must be controlled by the controlling area of the element (OX19 / TKA02).
  rule_authority: sap_hard_constraint
  sap_impact: Costs are collected in an area that does not control the legal entity; settlement to FI fails.
  fix_map:
    __other__: Company code and controlling area do not match in TKA02. Correct the element in CJ20N or the assignment in
      OX19.
  record_fix_template: 'WBS element {PRPS.PSPNR}: company code {PRPS.PBUKR} is not assigned to controlling area {PRPS.PKOKR}.'
- id: PS024
  field: PRPS.PKOKR
  check_class: cross_field_check
  fail_when: '`PRPS.PKOKR` != `PROJ.VKOKR`'
  require_populated: true
  severity: high
  dimension: consistency
  message: WBS controlling area differs from the project definition's controlling area
  why_it_matters: A project is controlled in one controlling area only. WBS elements in another area cannot be planned, budgeted
    or settled with the rest of the project.
  rule_authority: sap_hard_constraint
  sap_impact: Project-level plan, budget and settlement leave the odd element out; cost reports do not add up.
  fix_map:
    __other__: Align the WBS controlling area with the project's (CJ20N). Elements with postings need a transfer posting first.
  record_fix_template: 'WBS element {PRPS.PSPNR}: controlling area {PRPS.PKOKR} differs from the project''s {PROJ.VKOKR}.'
- id: PS025
  field: PRPS.PBUKR
  check_class: cross_field_check
  fail_when: '`PRPS.PBUKR` != `PROJ.VBUKR`'
  require_populated: true
  severity: medium
  dimension: consistency
  message: WBS company code differs from the project definition's company code
  why_it_matters: SAP allows cross-company projects, but a mixed company code is more often a default that was never changed.
    Costs then post to the wrong legal entity and need intercompany clearing.
  rule_authority: best_practice
  sap_impact: Intercompany postings and clearing are created; project profitability is split across entities.
  fix_map:
    __other__: Confirm the cross-company set-up is intended. If not, set the element's company code to the project's (CJ20N).
  record_fix_template: 'WBS element {PRPS.PSPNR}: company code {PRPS.PBUKR} differs from the project''s {PROJ.VBUKR}.'
- id: PS026
  field: PRPS.PRCTR
  check_class: null_check
  applies_when:
    PRPS.BELKZ:
    - X
    PRPS.LOEVM:
      blank: true
  severity: high
  dimension: completeness
  message: Account assignment element has no profit centre
  why_it_matters: Costs and revenues post to the profit centre of the account assignment element. Without one they land on
    the dummy profit centre and profit centre accounting is wrong.
  rule_authority: sap_hard_constraint
  sap_impact: Profit centre reports carry unallocated amounts; period-end clean-up needs a manual reassignment.
  fix_map:
    __blank__: Set the profit centre in CJ20N > WBS element > Assignments, then transfer already posted amounts (3KE5 for
      existing documents).
  record_fix_template: 'WBS element {PRPS.PSPNR}: PRCTR is {actual_value} on an account assignment element. Set it in CJ20N.'
- id: PS027
  field: PRPS.PRCTR
  check_class: exists_check
  fields:
  - PRPS.PKOKR
  - PRPS.PRCTR
  target_table: CEPC
  target_fields:
  - KOKRS
  - PRCTR
  severity: medium
  dimension: validity
  message: WBS profit centre does not exist in the WBS controlling area
  why_it_matters: The profit centre must exist in CEPC for the element's controlling area.
  rule_authority: sap_hard_constraint
  sap_impact: Postings fall back to the dummy profit centre or are rejected.
  fix_map:
    __other__: Profit centre '{invalid_value}' is missing for this controlling area. Create it (KE51) or select a valid one
      in CJ20N.
  record_fix_template: 'WBS element {PRPS.PSPNR}: profit centre {actual_value} does not exist in controlling area {PRPS.PKOKR}.'
- id: PS028
  field: PRPS.VERNR
  check_class: null_check
  applies_when:
    PRPS.LOEVM:
      blank: true
  severity: medium
  dimension: completeness
  message: WBS element has no person responsible
  why_it_matters: The element owner approves budget and takes the deadline and cost alerts for the element.
  rule_authority: best_practice
  sap_impact: Budget overruns and status changes on the element have no addressee.
  fix_map:
    __blank__: Assign the person responsible in CJ20N > WBS element > Basic data.
  record_fix_template: 'WBS element {PRPS.PSPNR}: VERNR is {actual_value}. Assign a person responsible in CJ20N.'
- id: PS029
  field: PRPS.VERNR
  check_class: exists_check
  target_table: TCJ04
  target_fields:
  - VERNR
  severity: medium
  dimension: validity
  message: WBS person responsible is not a defined person responsible
  why_it_matters: VERNR must exist in TCJ04.
  rule_authority: sap_hard_constraint
  sap_impact: The element shows no responsible person; notifications fail.
  fix_map:
    __other__: Person responsible '{invalid_value}' is not in TCJ04. Assign a defined person in CJ20N.
  record_fix_template: 'WBS element {PRPS.PSPNR}: person responsible {actual_value} is not defined.'
- id: PS030
  field: PRPS.FKSTL
  check_class: exists_check
  fields:
  - PRPS.PKOKR
  - PRPS.FKSTL
  target_table: CSKS
  target_fields:
  - KOKRS
  - KOSTL
  severity: medium
  dimension: validity
  message: WBS responsible cost centre does not exist in the controlling area
  why_it_matters: The responsible cost centre carries the element's organisational ownership and is used for reporting and
    authorisation.
  rule_authority: sap_hard_constraint
  sap_impact: Responsibility reports and cost-centre-based authorisation do not recognise the element.
  fix_map:
    __other__: Cost centre '{invalid_value}' is not in CSKS for this controlling area. Correct it in CJ20N or create it (KS01).
  record_fix_template: 'WBS element {PRPS.PSPNR}: responsible cost centre {actual_value} does not exist in controlling area
    {PRPS.PKOKR}.'
- id: PS031
  field: PRPS.FAKKZ
  check_class: cross_field_check
  fail_when: (`PRPS.FAKKZ` == 'X') & `PRPS.BELKZ`.isna()
  severity: medium
  dimension: consistency
  message: Billing element is not also an account assignment element
  why_it_matters: Revenue from sales orders and billing is posted to the WBS element. An element flagged for billing but not
    for account assignment cannot hold the revenue lines.
  rule_authority: best_practice
  sap_impact: Billing postings against the element are rejected or land on another element.
  fix_map:
    __other__: Set the account assignment indicator on the billing element in CJ20N, or remove the billing indicator.
  record_fix_template: 'WBS element {PRPS.PSPNR}: billing indicator is set but the account assignment indicator is not.'
- id: PS032
  field: PRPS.PSPNR
  check_class: cross_field_check
  fail_when: '`PRHI.DOWN`.isna() & `PRPS.PLAKZ`.isna() & `PRPS.BELKZ`.isna() & `PRPS.FAKKZ`.isna()'
  applies_when:
    PRPS.LOEVM:
      blank: true
  severity: medium
  dimension: consistency
  message: Lowest-level WBS element carries no planning, account assignment or billing indicator
  why_it_matters: A WBS element with no children that is neither planning, account assignment nor billing element can hold
    no values. It is a dead end in the structure.
  rule_authority: best_practice
  sap_impact: The element cannot take costs, plan or revenue; users post to a sibling instead.
  fix_map:
    __other__: Set at least one of the three indicators on the element (CJ20N > Control data), or delete it.
  record_fix_template: 'WBS element {PRPS.PSPNR}: element has no children and no planning, account assignment or billing indicator.'
- id: PS033
  field: PRPS.STUFE
  check_class: cross_field_check
  fail_when: '`PRPS.STUFE` < 1'
  severity: high
  dimension: validity
  message: WBS element level is zero or negative
  why_it_matters: The hierarchy level starts at 1 for the top element. A level below 1 is meaningless and breaks level-based
    reporting.
  rule_authority: sap_hard_constraint
  sap_impact: Level-based reporting (CN41, structure overview) drops or misplaces the element.
  fix_map:
    __other__: Rebuild the WBS hierarchy in CJ20N; the level is set from the position in the tree.
  record_fix_template: 'WBS element {PRPS.PSPNR}: level {actual_value} is below 1. Rebuild the hierarchy in CJ20N.'
- id: PS034
  field: PRPS.STUFE
  check_class: cross_field_check
  fail_when: '`PRHI.POSNR`.notna() & `PRHI.UP`.isna() & (`PRPS.STUFE` != 1)'
  severity: high
  dimension: consistency
  message: Top-of-hierarchy WBS element is not at level 1
  why_it_matters: An element without a parent in PRHI is a root of the tree and must be at level 1.
  rule_authority: sap_hard_constraint
  sap_impact: Roll-up of plan, budget and actuals starts at the wrong level.
  fix_map:
    __other__: Rebuild the WBS hierarchy in CJ20N so the level follows the tree.
  record_fix_template: 'WBS element {PRPS.PSPNR}: element has no parent but its level is {actual_value}.'
- id: PS035
  field: PRPS.STUFE
  check_class: cross_field_check
  fail_when: '`PRHI.UP`.notna() & (`PRPS.STUFE` == 1)'
  severity: high
  dimension: consistency
  message: WBS element with a parent is at level 1
  why_it_matters: Level 1 is reserved for roots. An element below a parent that still shows level 1 means the hierarchy was
    changed outside the Project Builder.
  rule_authority: sap_hard_constraint
  sap_impact: Roll-up and level-based reports treat a child as a root.
  fix_map:
    __other__: Rebuild the WBS hierarchy in CJ20N so the level follows the tree.
  record_fix_template: 'WBS element {PRPS.PSPNR}: element has a parent but level is {actual_value}.'
- id: PS036
  field: PRHI.UP
  check_class: hierarchy_check
  grain: PRHI
  id_field: PRHI.POSNR
  severity: critical
  dimension: consistency
  message: WBS hierarchy loops back on itself
  why_it_matters: Following the parent pointer upward must end at a root. A loop means roll-up of plan, budget and actual
    costs never terminates.
  rule_authority: sap_hard_constraint
  sap_impact: Roll-up, budget distribution and settlement of the loop elements fail or hang; the Project Builder cannot display
    the tree.
  fix_map:
    __other__: Break the loop by moving one element in CJ20N (or repair PRHI by a controlled SAP repair report).
  record_fix_template: 'WBS element {PRHI.POSNR}: part of a hierarchy loop. Re-parent it in CJ20N.'
- id: PS037
  field: PRHI.UP
  check_class: exists_check
  grain: PRHI
  target_table: PRPS
  target_fields:
  - PSPNR
  severity: high
  dimension: consistency
  message: WBS hierarchy points at a parent element that does not exist
  why_it_matters: Every parent pointer must lead to a WBS element master record. A dangling pointer cuts the subtree off from
    its root.
  rule_authority: sap_hard_constraint
  sap_impact: Roll-up skips the subtree; the Project Builder shows it detached.
  fix_map:
    __other__: Parent element '{invalid_value}' is missing. Restore it or re-parent the child in CJ20N.
  record_fix_template: 'WBS element {PRHI.POSNR}: parent {actual_value} does not exist.'
- id: PS038
  field: PRHI.POSNR
  check_class: exists_check
  grain: PRHI
  target_table: PRPS
  target_fields:
  - PSPNR
  severity: high
  dimension: consistency
  message: Hierarchy entry has no WBS element master record
  why_it_matters: PRHI rows exist only for elements in PRPS. A row without a master is a remnant of a partly deleted or archived
    element.
  rule_authority: sap_hard_constraint
  sap_impact: The hierarchy shows a ghost node that cannot be displayed or changed.
  fix_map:
    __other__: Remove the orphaned hierarchy entry through a project check/repair (CJ20N > Project > Check), not by table
      edit.
  record_fix_template: 'Hierarchy entry {actual_value}: no WBS element master record.'
- id: PS039
  field: PRPS.PSPNR
  check_class: exists_check
  grain: PRPS
  target_table: PRHI
  target_fields:
  - POSNR
  severity: high
  dimension: consistency
  message: WBS element is missing from the hierarchy table
  why_it_matters: Every WBS element must have a row in PRHI that holds its place in the tree. Without it the element is unreachable
    from its project.
  rule_authority: sap_hard_constraint
  sap_impact: The element does not show in the Project Builder or in any hierarchy report.
  fix_map:
    __other__: Re-insert the element into the structure in CJ20N, or archive it.
  record_fix_template: 'WBS element {PRPS.PSPNR}: no hierarchy entry in PRHI.'
- id: PS040
  field: PRHI.PSPHI
  check_class: cross_field_check
  fail_when: '`PRHI.PSPHI` != `PRPS.PSPHI`'
  require_populated: true
  severity: high
  dimension: consistency
  message: Hierarchy entry belongs to a different project than the WBS element
  why_it_matters: PRHI.PSPHI and PRPS.PSPHI must name the same project. A mismatch means the element was moved by direct table
    change.
  rule_authority: sap_hard_constraint
  sap_impact: The element appears in one project's tree but is owned by another; roll-up is wrong in both.
  fix_map:
    __other__: Re-assign the element to the intended project in CJ20N and run the project check.
  record_fix_template: 'WBS element {PRPS.PSPNR}: hierarchy project {PRHI.PSPHI} differs from the element''s project {PRPS.PSPHI}.'
- id: PS041
  field: PRPS.PSPNR
  check_class: cross_field_check
  fail_when: '`PROJ.LOEVM` == ''X'''
  applies_when:
    PRPS.LOEVM:
      blank: true
  severity: medium
  dimension: consistency
  message: Active WBS element under a project marked for deletion
  why_it_matters: When the project definition is flagged for deletion, its elements should follow. An active element under
    a deleted project keeps collecting postings no one monitors.
  rule_authority: best_practice
  sap_impact: Costs continue to post to a project that is on its way to archiving; archiving then fails on residual items.
  fix_map:
    __other__: Flag the element for deletion too (CJ02) after settling, or take the deletion flag off the project (CJ02).
  record_fix_template: 'WBS element {PRPS.PSPNR}: element is active under a project marked for deletion.'
- id: PS042
  field: PRPS.POSID
  check_class: uniqueness_check
  fields:
  - PRPS.POSID
  normalize: alnum
  case_insensitive: true
  severity: medium
  dimension: uniqueness
  message: WBS element IDs that differ only in separators or case
  why_it_matters: A-100.01 and A100-01 look like different keys to SAP and the same element to people.
  rule_authority: best_practice
  sap_impact: Costs are split between twins; settlement and budget reports disagree.
  fix_map:
    __other__: Compare both elements in CN41 and merge one into the other (CJ20N).
  record_fix_template: 'WBS element {PRPS.PSPNR}: POSID has a twin that differs only in separators or case.'
- id: PS043
  field: PRPS.OBJNR
  check_class: exists_check
  target_table: COBRB
  target_fields:
  - OBJNR
  applies_when:
    PRPS.BELKZ:
    - X
    PRPS.LOEVM:
      blank: true
  severity: medium
  dimension: consistency
  message: Account assignment WBS element has no settlement rule
  why_it_matters: Costs collected on a WBS element must be settled to a receiver. Without a settlement rule, CJ88 / CJ8G stops
    with an error and the costs stay on the element.
  rule_authority: sap_hard_constraint
  sap_impact: Costs remain unsettled at period end; assets under construction and cost centres are not relieved.
  fix_map:
    __other__: Maintain the settlement rule in CJ02 > Goto > Settlement rule (or derive it with the settlement rule strategy).
  record_fix_template: 'WBS element {PRPS.PSPNR}: no settlement rule in COBRB.'
- id: PS044
  field: PRPS.PSPHI
  check_class: null_check
  severity: high
  dimension: completeness
  message: WBS element carries no project definition
  why_it_matters: PSPHI is the link from the element to its project. A blank link is a half-created element.
  rule_authority: sap_hard_constraint
  sap_impact: The element is not part of any project and cannot be reported or settled with one.
  fix_map:
    __blank__: Assign the element to a project in CJ20N, or delete it.
  record_fix_template: 'WBS element {PRPS.PSPNR}: PSPHI is {actual_value}.'
- id: PS045
  field: AUFK.AUART
  check_class: null_check
  severity: high
  dimension: completeness
  message: Order has no order type
  why_it_matters: The order type controls number range, status profile, settlement profile and screen layout.
  rule_authority: sap_hard_constraint
  sap_impact: The order cannot be released or settled; behaviour is undefined.
  fix_map:
    __blank__: Order type is empty. Recreate the order with KO01 (internal) or the relevant order transaction.
  record_fix_template: 'Order {AUFK.AUFNR}: AUART is {actual_value}.'
- id: PS046
  field: AUFK.AUART
  check_class: exists_check
  target_table: T003O
  target_fields:
  - AUART
  severity: high
  dimension: validity
  message: Order type is not defined in the order-type table
  why_it_matters: AUART must exist in T003O (CO order types) so that status profile, settlement profile and number range apply.
  rule_authority: sap_hard_constraint
  sap_impact: Release, settlement and posting rules cannot be found for the order.
  fix_map:
    __other__: Order type '{invalid_value}' is not in T003O. Define it (KOT2 / OKKP) or correct the order.
  record_fix_template: 'Order {AUFK.AUFNR}: order type {actual_value} is not defined in T003O.'
- id: PS047
  field: AUFK.AUTYP
  check_class: cross_field_check
  fail_when: '`AUFK.AUTYP` != `T003O.AUTYP`'
  require_populated: true
  severity: high
  dimension: consistency
  message: Order category differs from the category of its order type
  why_it_matters: T003O fixes the order category of every order type (01 internal, 10 production, 30 maintenance). A differing
    category on the order means the header was changed outside SAP.
  rule_authority: sap_hard_constraint
  sap_impact: Category-specific processing (status management, settlement, archiving) reads the wrong category.
  fix_map:
    __other__: Recreate the order under an order type of the intended category. Never change AUTYP on the table.
  record_fix_template: 'Order {AUFK.AUFNR}: category {AUFK.AUTYP} differs from order type category {T003O.AUTYP}.'
- id: PS048
  field: AUFK.KTEXT
  check_class: null_check
  applies_when:
    AUFK.LOEKZ:
      blank: true
  severity: medium
  dimension: completeness
  message: Order has no description
  why_it_matters: The description identifies the order in cost reports and when picking a settlement receiver.
  rule_authority: best_practice
  sap_impact: Controllers cannot tell the purpose of the order in KOB1 or reports.
  fix_map:
    __blank__: Enter the description in KO02.
  record_fix_template: 'Order {AUFK.AUFNR}: KTEXT is {actual_value}.'
- id: PS049
  field: AUFK.BUKRS
  check_class: null_check
  applies_when: &id001
    AUFK.AUTYP:
    - '01'
    AUFK.LOEKZ:
      blank: true
  severity: high
  dimension: completeness
  message: Internal order has no company code
  why_it_matters: The company code determines where postings of the order land in FI.
  rule_authority: sap_hard_constraint
  sap_impact: Postings to the order cannot be derived to a legal entity.
  fix_map:
    __blank__: Set the company code in KO02 > Assignments.
  record_fix_template: 'Order {AUFK.AUFNR}: BUKRS is {actual_value}.'
- id: PS050
  field: AUFK.KOKRS
  check_class: null_check
  applies_when: *id001
  severity: high
  dimension: completeness
  message: Internal order has no controlling area
  why_it_matters: An internal order is a CO object of one controlling area.
  rule_authority: sap_hard_constraint
  sap_impact: No cost collection, planning or settlement for the order.
  fix_map:
    __blank__: Set the controlling area in KO02.
  record_fix_template: 'Order {AUFK.AUFNR}: KOKRS is {actual_value}.'
- id: PS051
  field: AUFK.BUKRS
  check_class: exists_check
  target_table: T001
  target_fields:
  - BUKRS
  severity: high
  dimension: validity
  message: Order company code is not defined
  why_it_matters: The company code must exist in T001.
  rule_authority: sap_hard_constraint
  sap_impact: Postings to the order fail on an undefined company code.
  fix_map:
    __other__: Company code '{invalid_value}' is not in T001. Correct it in KO02.
  record_fix_template: 'Order {AUFK.AUFNR}: company code {actual_value} is not in T001.'
- id: PS052
  field: AUFK.KOKRS
  check_class: exists_check
  target_table: TKA01
  target_fields:
  - KOKRS
  severity: high
  dimension: validity
  message: Order controlling area is not defined
  why_it_matters: The controlling area must exist in TKA01.
  rule_authority: sap_hard_constraint
  sap_impact: Cost collection for the order fails.
  fix_map:
    __other__: Controlling area '{invalid_value}' is not in TKA01. Correct it in KO02.
  record_fix_template: 'Order {AUFK.AUFNR}: controlling area {actual_value} is not in TKA01.'
- id: PS053
  field: AUFK.BUKRS
  check_class: exists_check
  fields:
  - AUFK.BUKRS
  - AUFK.KOKRS
  target_table: TKA02
  target_fields:
  - BUKRS
  - KOKRS
  severity: high
  dimension: consistency
  message: Order company code is not assigned to the order's controlling area
  why_it_matters: The company code must be controlled by the controlling area of the order (OX19 / TKA02).
  rule_authority: sap_hard_constraint
  sap_impact: Costs are collected in an area that does not control the company code; settlement to FI fails.
  fix_map:
    __other__: Company code and controlling area do not match in TKA02. Correct the order in KO02 or the assignment in OX19.
  record_fix_template: 'Order {AUFK.AUFNR}: company code {AUFK.BUKRS} is not assigned to controlling area {AUFK.KOKRS}.'
- id: PS054
  field: AUFK.PRCTR
  check_class: null_check
  applies_when: *id001
  severity: medium
  dimension: completeness
  message: Active internal order has no profit centre
  why_it_matters: The profit centre of the order receives its costs in profit centre accounting. Without it costs fall on
    the dummy profit centre.
  rule_authority: best_practice
  sap_impact: Profit centre reports contain unallocated amounts.
  fix_map:
    __blank__: Set the profit centre in KO02 > Assignments.
  record_fix_template: 'Order {AUFK.AUFNR}: PRCTR is {actual_value}.'
- id: PS055
  field: AUFK.PRCTR
  check_class: exists_check
  fields:
  - AUFK.KOKRS
  - AUFK.PRCTR
  target_table: CEPC
  target_fields:
  - KOKRS
  - PRCTR
  severity: medium
  dimension: validity
  message: Order profit centre does not exist in the order's controlling area
  why_it_matters: The profit centre must exist in CEPC for the order's controlling area.
  rule_authority: sap_hard_constraint
  sap_impact: Postings fall back to the dummy profit centre or are rejected.
  fix_map:
    __other__: Profit centre '{invalid_value}' is missing for this controlling area. Create it (KE51) or select another in
      KO02.
  record_fix_template: 'Order {AUFK.AUFNR}: profit centre {actual_value} does not exist in controlling area {AUFK.KOKRS}.'
- id: PS056
  field: AUFK.KOSTV
  check_class: null_check
  applies_when: *id001
  severity: medium
  dimension: completeness
  message: Active internal order has no responsible cost centre
  why_it_matters: The responsible cost centre ties the order to an owner and to responsibility reporting.
  rule_authority: best_practice
  sap_impact: Nobody is accountable for the order's costs.
  fix_map:
    __blank__: Set the responsible cost centre in KO02 > Assignments.
  record_fix_template: 'Order {AUFK.AUFNR}: KOSTV is {actual_value}.'
- id: PS057
  field: AUFK.KOSTV
  check_class: exists_check
  fields:
  - AUFK.KOKRS
  - AUFK.KOSTV
  target_table: CSKS
  target_fields:
  - KOKRS
  - KOSTL
  severity: medium
  dimension: validity
  message: Order responsible cost centre does not exist in the controlling area
  why_it_matters: KOSTV must exist in CSKS for the order's controlling area.
  rule_authority: sap_hard_constraint
  sap_impact: Responsibility reporting and authorisation do not recognise the order.
  fix_map:
    __other__: Cost centre '{invalid_value}' is not in CSKS. Correct it in KO02 or create it (KS01).
  record_fix_template: 'Order {AUFK.AUFNR}: responsible cost centre {actual_value} does not exist in controlling area {AUFK.KOKRS}.'
- id: PS058
  field: AUFK.PSPEL
  check_class: exists_check
  target_table: PRPS
  target_fields:
  - PSPNR
  target_when:
    LOEVM:
      blank: true
  applies_when:
    AUFK.LOEKZ:
      blank: true
  severity: high
  dimension: consistency
  message: Order is assigned to a WBS element that is missing or marked for deletion
  why_it_matters: An order assigned to a WBS element reports its costs into the project. If the element is gone or flagged
    for deletion, the order's costs leave the project reports and cannot be rolled up.
  rule_authority: sap_hard_constraint
  sap_impact: Project costs are understated; archiving of the project is blocked by the open order.
  fix_map:
    __other__: Re-assign the order to a live WBS element in KO02 > Assignments, or remove the WBS assignment.
  record_fix_template: 'Order {AUFK.AUFNR}: WBS element {actual_value} is missing or flagged for deletion.'
- id: PS059
  field: AUFK.BUKRS
  check_class: cross_field_check
  fail_when: '`AUFK.BUKRS` != `PRPS.PBUKR`'
  require_populated: true
  severity: high
  dimension: consistency
  message: Order company code differs from the company code of its WBS element
  why_it_matters: An order assigned to a WBS element must post in the same legal entity as the element; otherwise project
    and order costs sit in different companies.
  rule_authority: sap_hard_constraint
  sap_impact: Intercompany differences arise and project costs are split across entities.
  fix_map:
    __other__: Correct the company code of the order (KO02) or the WBS assignment.
  record_fix_template: 'Order {AUFK.AUFNR}: company code {AUFK.BUKRS} differs from WBS company code {PRPS.PBUKR}.'
- id: PS060
  field: AUFK.KOKRS
  check_class: cross_field_check
  fail_when: '`AUFK.KOKRS` != `PRPS.PKOKR`'
  require_populated: true
  severity: high
  dimension: consistency
  message: Order controlling area differs from the controlling area of its WBS element
  why_it_matters: An order and its WBS element must share the controlling area, or costs cannot be settled or rolled up between
    them.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement between order and WBS fails; project reporting misses the order.
  fix_map:
    __other__: Correct the controlling area of the order (KO02) or the WBS assignment.
  record_fix_template: 'Order {AUFK.AUFNR}: controlling area {AUFK.KOKRS} differs from WBS controlling area {PRPS.PKOKR}.'
- id: PS061
  field: AUFK.PRCTR
  check_class: cross_field_check
  fail_when: '`AUFK.PRCTR` != `PRPS.PRCTR`'
  require_populated: true
  severity: medium
  dimension: consistency
  message: Order profit centre differs from the profit centre of its WBS element
  why_it_matters: Costs of an order assigned to a project normally follow the project's profit centre. A different profit
    centre splits project profitability.
  rule_authority: best_practice
  sap_impact: Profit centre reports show the same project in two profit centres.
  fix_map:
    __other__: Confirm the profit centre. If the project's is right, change it on the order (KO02).
  record_fix_template: 'Order {AUFK.AUFNR}: profit centre {AUFK.PRCTR} differs from WBS profit centre {PRPS.PRCTR}.'
- id: PS062
  field: AUFK.OBJNR
  check_class: exists_check
  target_table: COBRB
  target_fields:
  - OBJNR
  applies_when:
    AUFK.AUTYP:
    - '01'
    - '30'
    AUFK.LOEKZ:
      blank: true
    AUFK.ASTKZ:
      blank: true
  severity: high
  dimension: consistency
  message: Open internal or maintenance order has no settlement rule
  why_it_matters: Order costs must be settled to a receiver (cost centre, WBS, asset). Without a rule, KO88 stops with an
    error and the order cannot be closed.
  rule_authority: sap_hard_constraint
  sap_impact: Costs stay on the order at period end; the order cannot be completed (TECO) or closed.
  fix_map:
    __other__: Maintain the settlement rule in KO02 > Goto > Settlement rule, or flag the order statistical if it must not
      settle.
  record_fix_template: 'Order {AUFK.AUFNR}: no settlement rule in COBRB.'
- id: PS063
  field: AUFK.IDAT1
  check_class: null_check
  applies_when:
    AUFK.PHAS1:
    - X
  severity: medium
  dimension: completeness
  message: Order is in the released phase but has no release date
  why_it_matters: The release date is set when the order is released. A missing date with the released phase on points at
    a changed status that bypassed the order logic.
  rule_authority: sap_hard_constraint
  sap_impact: Date-based reporting, interest and ageing of the order are wrong.
  fix_map:
    __blank__: Review the status history in KO03 > Extras > Status. Correct the date through a status action, not by table
      edit.
  record_fix_template: 'Order {AUFK.AUFNR}: released phase set but IDAT1 is {actual_value}.'
- id: PS064
  field: AUFK.IDAT2
  check_class: null_check
  applies_when:
    AUFK.PHAS2:
    - X
  severity: medium
  dimension: completeness
  message: Order is technically completed but has no completion date
  why_it_matters: The TECO date closes the period in which costs are expected. Without it, accruals and ageing treat the order
    as still running.
  rule_authority: sap_hard_constraint
  sap_impact: Accrual and WIP calculation and TECO ageing reports are wrong.
  fix_map:
    __blank__: Review the status history in KO03. Correct through a status action, not by table edit.
  record_fix_template: 'Order {AUFK.AUFNR}: completed phase set but IDAT2 is {actual_value}.'
- id: PS065
  field: AUFK.IDAT3
  check_class: null_check
  applies_when:
    AUFK.PHAS3:
    - X
  severity: medium
  dimension: completeness
  message: Order is closed but has no close date
  why_it_matters: The close date marks when the order stopped taking postings. Archiving rules and retention periods read
    it.
  rule_authority: sap_hard_constraint
  sap_impact: Archiving residence times cannot be computed; closed-order reports are incomplete.
  fix_map:
    __blank__: Review the status history in KO03. Correct through a status action, not by table edit.
  record_fix_template: 'Order {AUFK.AUFNR}: closed phase set but IDAT3 is {actual_value}.'
- id: PS066
  field: AUFK.IDAT2
  check_class: cross_field_check
  fail_when: (`AUFK.IDAT2` < `AUFK.IDAT1`) | (`AUFK.IDAT3` < `AUFK.IDAT2`)
  severity: medium
  dimension: consistency
  message: Order dates are out of sequence (release, completion, close)
  why_it_matters: Release, technical completion and close occur in that order. A completion before release or a close before
    completion shows tampered or wrongly loaded status dates.
  rule_authority: sap_hard_constraint
  sap_impact: Order ageing and lifecycle reports are wrong.
  fix_map:
    __other__: Review the status history in KO03 and correct through status actions.
  record_fix_template: 'Order {AUFK.AUFNR}: release {AUFK.IDAT1}, completion {AUFK.IDAT2}, close {AUFK.IDAT3} are out of sequence.'
- id: PS067
  field: AUFK.PDAT1
  check_class: cross_field_check
  fail_when: (`AUFK.PDAT1` > `AUFK.PDAT2`) | (`AUFK.PDAT2` > `AUFK.PDAT3`)
  severity: medium
  dimension: consistency
  message: Planned order dates are out of sequence (release, completion, close)
  why_it_matters: Planned release, completion and close dates must follow in that order. A plan that completes before it is
    released cannot be scheduled.
  rule_authority: best_practice
  sap_impact: Scheduling and overdue monitoring give wrong results.
  fix_map:
    __other__: Correct the planned dates in KO02 > Control data.
  record_fix_template: 'Order {AUFK.AUFNR}: planned release {AUFK.PDAT1}, completion {AUFK.PDAT2}, close {AUFK.PDAT3} are
    out of sequence.'
- id: PS068
  field: AUFK.STDAT
  check_class: freshness_check
  max_age_hours: 8760
  applies_when:
    AUFK.PHAS1: &id002
    - X
    AUFK.PHAS2: &id003
      blank: true
    AUFK.PHAS3: &id004
      blank: true
  severity: medium
  dimension: timeliness
  message: Released order without a status change for over a year
  why_it_matters: Open orders that nobody completes keep accruals, commitments and reservations alive and distort period-end
    results.
  rule_authority: best_practice
  sap_impact: Stale open orders carry old commitments and block archiving of the project they belong to.
  fix_map:
    __other__: Review the order in KOB1 / KO03. Settle and complete (TECO) or close it (KO02), or flag it for deletion if
      never used.
  record_fix_template: 'Order {AUFK.AUFNR}: released and unchanged since {actual_value}. Settle and close it.'
- id: PS069
  field: AUFK.PDAT2
  check_class: cross_field_check
  fail_when: '`AUFK.AUFNR`.notna()'
  applies_when:
    AUFK.PHAS1: *id002
    AUFK.PHAS2: *id003
    AUFK.PHAS3: *id004
    AUFK.LOEKZ:
      blank: true
    AUFK.PDAT2:
      older_than_days: 180
  severity: medium
  dimension: timeliness
  message: Order is open more than six months after its planned completion date
  why_it_matters: An order that is far past its planned completion is either finished and not completed in the system, or
    really late and needs a new plan.
  rule_authority: best_practice
  sap_impact: Overdue orders keep costs open and mislead variance reports and accrual calculations.
  fix_map:
    __other__: Check whether work is done. If yes, settle and TECO the order (KO88, KO02). If not, replan the completion date.
  record_fix_template: 'Order {AUFK.AUFNR}: planned completion {AUFK.PDAT2} is more than six months ago and the order is still
    open.'
- id: PS070
  field: AUFK.IDAT3
  check_class: cross_field_check
  fail_when: '`AUFK.AUFNR`.notna()'
  applies_when:
    AUFK.PHAS3:
    - X
    AUFK.IDAT3:
      older_than_days: 730
    AUFK.LOEKZ:
      blank: true
  severity: low
  dimension: timeliness
  message: Order closed over two years ago and not flagged for deletion
  why_it_matters: Closed orders without a deletion flag cannot be archived. They stay in AUFK and the CO tables indefinitely.
  rule_authority: best_practice
  sap_impact: Table growth and slow CO reports; archiving of the order's cost documents never starts.
  fix_map:
    __other__: Set the deletion flag (KO02) after the residence time and run the archiving object CO_ORDER (SARA).
  record_fix_template: 'Order {AUFK.AUFNR}: closed on {AUFK.IDAT3} and not flagged for deletion. Archive candidate.'
- id: PS071
  field: AUFK.ERDAT
  check_class: cross_field_check
  fail_when: '`AUFK.ERDAT` > @today'
  severity: medium
  dimension: accuracy
  message: Order created in the future
  why_it_matters: A creation date after today comes from a wrong load or a clock error.
  rule_authority: sap_hard_constraint
  sap_impact: Age-based rules, archiving and audit trails treat the order wrongly.
  fix_map:
    __other__: Correct through the source of the load; do not patch the date by table edit.
  record_fix_template: 'Order {AUFK.AUFNR}: creation date {AUFK.ERDAT} is in the future.'
- id: PS072
  field: AUFK.ERDAT
  check_class: cross_field_check
  fail_when: '`AUFK.ERDAT` > `AUFK.AEDAT`'
  severity: low
  dimension: consistency
  message: Order changed before it was created
  why_it_matters: The change date can never be earlier than the creation date.
  rule_authority: sap_hard_constraint
  sap_impact: Audit trail is unreliable; change-based freshness rules mis-age the order.
  fix_map:
    __other__: Review change documents in KO03 > Environment > Change documents.
  record_fix_template: 'Order {AUFK.AUFNR}: created {AUFK.ERDAT} after the last change {AUFK.AEDAT}.'
- id: PS073
  field: AUFK.KTEXT
  check_class: similarity_check
  block_by:
  - AUFK.BUKRS
  - AUFK.AUART
  threshold: 0.92
  exact_rule: false
  severity: medium
  dimension: uniqueness
  message: Near-duplicate order description in the same company code and order type
  why_it_matters: Two orders with almost the same description in the same company code and order type are usually the same
    activity entered twice.
  rule_authority: best_practice
  sap_impact: Costs for one activity are split across two orders; budgets and reports disagree.
  fix_map:
    __other__: Compare the orders in KOB1 and settle one into the other, then close it.
  record_fix_template: 'Order {AUFK.AUFNR}: description ''{actual_value}'' is almost the same as another order.'
- id: PS074
  field: COBRA.APROF
  check_class: null_check
  severity: high
  dimension: completeness
  message: Settlement header has no settlement profile
  why_it_matters: The settlement profile controls allowed receivers, residual-cost handling and the allocation structure.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement (KO88, CJ88) of the object fails with a missing-profile error.
  fix_map:
    __blank__: Assign the settlement profile on the object (KO02 / CJ02 > Settlement parameters) or in the order type / project
      profile (OKO7).
  record_fix_template: 'Settlement object {COBRA.OBJNR}: APROF is {actual_value}.'
- id: PS075
  field: COBRB.OBJNR
  check_class: exists_check
  grain: COBRB
  target_table: COBRA
  target_fields:
  - OBJNR
  severity: high
  dimension: consistency
  message: Settlement distribution rule has no settlement header
  why_it_matters: Every distribution rule belongs to a settlement header (COBRA). A rule without it comes from a partial deletion
    or archiving.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement of the object stops with an error; the rule is ignored or reported as a residue.
  fix_map:
    __other__: Re-create the settlement parameters on the object (KO02 / CJ02), then re-enter the rule.
  record_fix_template: 'Settlement rule {COBRB.OBJNR}/{COBRB.LFDNR}: no settlement header.'
- id: PS076
  field: COBRB.PERBZ
  check_class: null_check
  severity: high
  dimension: completeness
  message: Settlement rule has no settlement type
  why_it_matters: The settlement type decides whether the rule settles periodically or in full, and when.
  rule_authority: sap_hard_constraint
  sap_impact: The rule is not applied or settlement ends with an error.
  fix_map:
    __blank__: Set the settlement type (PER / FUL) in the settlement rule (KO02 / CJ02).
  record_fix_template: 'Settlement rule {COBRB.OBJNR}/{COBRB.LFDNR}: PERBZ is {actual_value}.'
- id: PS077
  field: COBRB.PROZS
  check_class: cross_field_check
  fail_when: (`COBRB.PROZS` > 100) | (`COBRB.PROZS` < 0)
  severity: high
  dimension: validity
  message: Settlement percentage is above 100 or below 0
  why_it_matters: A percentage rule distributes a share of the cost. Above 100 over-settles; below 0 is meaningless.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement posts more than the collected cost or fails the consistency check.
  fix_map:
    __other__: Correct the percentage in the settlement rule (KO02 / CJ02).
  record_fix_template: 'Settlement rule {COBRB.OBJNR}/{COBRB.LFDNR}: percentage {actual_value} is out of range.'
- id: PS078
  field: COBRB.AUFNR
  check_class: exists_check
  grain: COBRB
  target_table: AUFK
  target_fields:
  - AUFNR
  target_when:
    LOEKZ:
      blank: true
  severity: high
  dimension: consistency
  message: Settlement receiver order is missing or marked for deletion
  why_it_matters: Settling to an order that is gone or flagged for deletion stops the settlement run and strands the costs.
  rule_authority: sap_hard_constraint
  sap_impact: KO88 / CJ88 reports an error for the sender; costs stay unsettled.
  fix_map:
    __other__: Change the receiver in the settlement rule (KO02 / CJ02) or remove the deletion flag on the receiver order.
  record_fix_template: 'Settlement rule {COBRB.OBJNR}/{COBRB.LFDNR}: receiver order {actual_value} is missing or flagged for
    deletion.'
- id: PS079
  field: COBRB.PS_PSP_PNR
  check_class: exists_check
  grain: COBRB
  target_table: PRPS
  target_fields:
  - PSPNR
  target_when:
    LOEVM:
      blank: true
  severity: high
  dimension: consistency
  message: Settlement receiver WBS element is missing or marked for deletion
  why_it_matters: Settling to a WBS element that is gone or flagged for deletion stops the settlement and strands the costs.
  rule_authority: sap_hard_constraint
  sap_impact: CJ88 / KO88 reports an error for the sender; costs stay unsettled.
  fix_map:
    __other__: Change the receiver in the settlement rule (KO02 / CJ02) or remove the deletion flag on the receiver WBS element.
  record_fix_template: 'Settlement rule {COBRB.OBJNR}/{COBRB.LFDNR}: receiver WBS element {actual_value} is missing or flagged
    for deletion.'
- id: PS080
  field: COBRB.KOSTL
  check_class: exists_check
  grain: COBRB
  fields:
  - COBRB.KOKRS
  - COBRB.KOSTL
  target_table: CSKS
  target_fields:
  - KOKRS
  - KOSTL
  severity: medium
  dimension: consistency
  message: Settlement receiver cost centre does not exist in the controlling area
  why_it_matters: A cost-centre receiver must exist in CSKS for the receiver's controlling area, or settlement posts to a
    cost centre that cannot take costs.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement fails with an invalid account assignment.
  fix_map:
    __other__: Correct the receiver cost centre in the settlement rule (KO02 / CJ02) or create it (KS01).
  record_fix_template: 'Settlement rule {COBRB.OBJNR}/{COBRB.LFDNR}: receiver cost centre {actual_value} does not exist.'
- id: PS081
  field: PROJ.KALID
  check_class: referential_check
  applies_when:
    PROJ.LOEVM:
      blank: true
  severity: medium
  dimension: validity
  message: Factory calendar of the project definition is not defined in customizing
  why_it_matters: The factory calendar drives scheduling of the project dates. A calendar that is not defined cannot count
    working days.
  rule_authority: sap_hard_constraint
  sap_impact: Scheduling in CJ20N runs on calendar days or fails.
  fix_map:
    __other__: Use a factory calendar defined in SCOW.
  record_fix_template: 'Project {PROJ.PSPNR}: factory calendar ''''{invalid_value}'''' is not defined.'
- id: PS082
  field: PROJ.PWHIE
  check_class: referential_check
  applies_when:
    PROJ.LOEVM:
      blank: true
  severity: high
  dimension: validity
  message: WBS currency of the project definition is not defined in customizing
  why_it_matters: The project currency is the default for planning and settlement. A currency outside TCURC cannot post.
  rule_authority: sap_hard_constraint
  sap_impact: Cost planning and commitments in the project cannot be valued.
  fix_map:
    __other__: Use a currency defined in OY04.
  record_fix_template: 'Project {PROJ.PSPNR}: currency ''''{invalid_value}'''' is not defined.'
- id: PS083
  field: PROJ.WERKS
  check_class: referential_check
  applies_when:
    PROJ.LOEVM:
      blank: true
    PROJ.WERKS:
      populated: true
  severity: medium
  dimension: validity
  message: Plant of the project definition is not defined in customizing
  why_it_matters: The project plant is the default for activities and material components. An undefined plant cannot be defaulted.
  rule_authority: sap_hard_constraint
  sap_impact: Networks created under the project fail on the plant default.
  fix_map:
    __other__: Use a defined plant.
  record_fix_template: 'Project {PROJ.PSPNR}: plant ''''{invalid_value}'''' is not defined.'
- id: PS084
  field: PROJ.KOSTL
  check_class: exists_check
  fields:
  - PROJ.VKOKR
  - PROJ.KOSTL
  target_table: CSKS
  target_fields:
  - KOKRS
  - KOSTL
  applies_when:
    PROJ.LOEVM:
      blank: true
  severity: medium
  dimension: consistency
  message: Project responsible cost centre does not exist in the controlling area
  why_it_matters: The responsible cost centre is the owner for the project costs. A cost centre that is not in the project
    controlling area cannot own them.
  rule_authority: sap_hard_constraint
  sap_impact: Cost owner reports and authorisation by cost centre skip the project.
  fix_map:
    __other__: Assign a cost centre of the controlling area in CJ20N or create it in KS01.
  record_fix_template: 'Project {PROJ.PSPNR}: cost centre {PROJ.KOSTL} does not exist in controlling area {PROJ.VKOKR}.'
- id: PS085
  field: PROJ.PLSEZ
  check_class: cross_field_check
  fail_when: '`PROJ.PLFAZ`.notna() & `PROJ.PLSEZ`.isna()'
  applies_when:
    PROJ.LOEVM:
      blank: true
  severity: low
  dimension: completeness
  message: Project has a planned start but no planned finish
  why_it_matters: Scheduling and the project timeline need both ends. A start without a finish leaves the project open ended.
  rule_authority: best_practice
  sap_impact: Overdue and milestone monitoring cannot judge the project.
  fix_map:
    __other__: Enter the planned finish in CJ20N.
  record_fix_template: 'Project {PROJ.PSPNR}: planned start is set and planned finish is empty.'
- id: PS086
  field: PROJ.ERDAT
  check_class: cross_field_check
  fail_when: (`PROJ.ERDAT` - @today).dt.days > 0
  severity: medium
  dimension: validity
  message: Project definition created in the future
  why_it_matters: A creation date after today comes from a load or a clock error and breaks age-based monitoring.
  rule_authority: best_practice
  sap_impact: Project ageing and archiving selection skip the project.
  fix_map:
    __other__: Correct the date at the source.
  record_fix_template: 'Project {PROJ.PSPNR}: creation date is in the future.'
- id: PS087
  field: PROJ.AEDAT
  check_class: cross_field_check
  fail_when: '`PROJ.AEDAT` < `PROJ.ERDAT`'
  severity: low
  dimension: consistency
  message: Project definition changed before it was created
  why_it_matters: A change date before the creation date means the record was written outside the normal transaction.
  rule_authority: best_practice
  sap_impact: The audit trail of the project cannot be trusted.
  fix_map:
    __other__: Check the load that wrote the dates.
  record_fix_template: 'Project {PROJ.PSPNR}: change date is before the creation date.'
- id: PS088
  field: PRPS.KALSM
  check_class: referential_check
  applies_when:
    PRPS.LOEVM:
      blank: true
  severity: medium
  dimension: validity
  message: Costing sheet of the WBS element is not defined in customizing
  why_it_matters: The costing sheet drives overhead surcharges. A sheet outside T683 cannot be applied.
  rule_authority: sap_hard_constraint
  sap_impact: Overhead is not calculated on the WBS element.
  fix_map:
    __other__: Use a costing sheet defined in customizing (KZS2).
  record_fix_template: 'WBS element {PRPS.POSID}: costing sheet ''''{invalid_value}'''' is not defined.'
- id: PS089
  field: PRPS.FABKL
  check_class: referential_check
  applies_when:
    PRPS.LOEVM:
      blank: true
  severity: low
  dimension: validity
  message: Factory calendar of the WBS element is not defined in customizing
  why_it_matters: The factory calendar drives scheduling of the WBS dates. A calendar that is not defined cannot count working
    days.
  rule_authority: sap_hard_constraint
  sap_impact: Scheduling of the WBS element runs on calendar days or fails.
  fix_map:
    __other__: Use a factory calendar defined in SCOW.
  record_fix_template: 'WBS element {PRPS.POSID}: factory calendar ''''{invalid_value}'''' is not defined.'
- id: PS090
  field: PRPS.PWPOS
  check_class: referential_check
  applies_when:
    PRPS.LOEVM:
      blank: true
  severity: high
  dimension: validity
  message: WBS currency of the WBS element is not defined in customizing
  why_it_matters: The WBS currency is the currency of planning and postings. A currency outside TCURC cannot post.
  rule_authority: sap_hard_constraint
  sap_impact: Costs and commitments on the WBS element cannot be valued.
  fix_map:
    __other__: Use a currency defined in OY04.
  record_fix_template: 'WBS element {PRPS.POSID}: currency ''''{invalid_value}'''' is not defined.'
- id: PS091
  field: PRPS.WERKS
  check_class: referential_check
  applies_when:
    PRPS.LOEVM:
      blank: true
    PRPS.WERKS:
      populated: true
  severity: medium
  dimension: validity
  message: Plant of the WBS element is not defined in customizing
  why_it_matters: The WBS plant is the default for procurement and activities. An undefined plant cannot be defaulted.
  rule_authority: sap_hard_constraint
  sap_impact: Purchase requisitions from the WBS element fail on the plant.
  fix_map:
    __other__: Use a defined plant.
  record_fix_template: 'WBS element {PRPS.POSID}: plant ''''{invalid_value}'''' is not defined.'
- id: PS092
  field: PRPS.KOSTL
  check_class: exists_check
  fields:
  - PRPS.PKOKR
  - PRPS.KOSTL
  target_table: CSKS
  target_fields:
  - KOKRS
  - KOSTL
  applies_when:
    PRPS.LOEVM:
      blank: true
  severity: medium
  dimension: consistency
  message: WBS requesting cost centre does not exist in the controlling area
  why_it_matters: The requesting cost centre is the owner in project reports. A cost centre outside the controlling area cannot
    be resolved.
  rule_authority: sap_hard_constraint
  sap_impact: Cost owner reports skip the WBS element.
  fix_map:
    __other__: Assign a cost centre of the controlling area in CJ20N or create it in KS01.
  record_fix_template: 'WBS element {PRPS.POSID}: cost centre {PRPS.KOSTL} does not exist in the controlling area.'
- id: PS093
  field: PRPS.AKSTL
  check_class: exists_check
  fields:
  - PRPS.AKOKR
  - PRPS.AKSTL
  target_table: CSKS
  target_fields:
  - KOKRS
  - KOSTL
  applies_when:
    PRPS.LOEVM:
      blank: true
  severity: medium
  dimension: consistency
  message: WBS applicant cost centre does not exist in the controlling area
  why_it_matters: The applicant cost centre is the owner in project reports. A cost centre outside the controlling area cannot
    be resolved.
  rule_authority: sap_hard_constraint
  sap_impact: Cost owner reports skip the WBS element.
  fix_map:
    __other__: Assign a cost centre of the controlling area in CJ20N or create it in KS01.
  record_fix_template: 'WBS element {PRPS.POSID}: cost centre {PRPS.AKSTL} does not exist in the controlling area.'
- id: PS094
  field: PRPS.MATNR
  check_class: exists_check
  target_table: MARA
  target_fields:
  - MATNR
  applies_when:
    PRPS.LOEVM:
      blank: true
  severity: medium
  dimension: consistency
  message: WBS element points at a material that does not exist
  why_it_matters: The material on a WBS element names the project stock or the product. A missing material breaks the link.
  rule_authority: sap_hard_constraint
  sap_impact: Project stock and requirement planning cannot find the material.
  fix_map:
    __other__: Correct the material in CJ20N.
  record_fix_template: 'WBS element {PRPS.POSID}: material {PRPS.MATNR} does not exist.'
- id: PS095
  field: PRPS.EQUNR
  check_class: exists_check
  target_table: EQUI
  target_fields:
  - EQUNR
  applies_when:
    PRPS.LOEVM:
      blank: true
  severity: medium
  dimension: consistency
  message: WBS element points at equipment that does not exist
  why_it_matters: The equipment on a WBS element links the project to maintenance. A missing equipment breaks the link.
  rule_authority: sap_hard_constraint
  sap_impact: Equipment cost reports do not show the project.
  fix_map:
    __other__: Correct the equipment in CJ20N.
  record_fix_template: 'WBS element {PRPS.POSID}: equipment {PRPS.EQUNR} does not exist.'
- id: PS096
  field: PRPS.TPLNR
  check_class: exists_check
  target_table: IFLOT
  target_fields:
  - TPLNR
  applies_when:
    PRPS.LOEVM:
      blank: true
  severity: medium
  dimension: consistency
  message: WBS element points at a functional location that does not exist
  why_it_matters: The functional location on a WBS element links the project to the plant structure. A missing location breaks
    the link.
  rule_authority: sap_hard_constraint
  sap_impact: Location cost reports do not show the project.
  fix_map:
    __other__: Correct the location in CJ20N.
  record_fix_template: 'WBS element {PRPS.POSID}: functional location {PRPS.TPLNR} does not exist.'
- id: PS097
  field: PRPS.PWPOS
  check_class: cross_field_check
  fail_when: '`PRPS.PWPOS` != `PROJ.PWHIE`'
  applies_when:
    PRPS.LOEVM:
      blank: true
  severity: low
  dimension: consistency
  message: WBS currency differs from the project currency
  why_it_matters: WBS elements inherit the project currency. A different currency makes roll-up of plan and actual values
    need conversion.
  rule_authority: best_practice
  sap_impact: Project totals mix currencies and rely on exchange rates.
  fix_map:
    __other__: Align the WBS currency with the project currency unless the difference is intended.
  record_fix_template: 'WBS element {PRPS.POSID}: currency {PRPS.PWPOS} differs from the project currency {PROJ.PWHIE}.'
- id: PS098
  field: PRPS.PBUKR
  check_class: cross_field_check
  fail_when: '`PRPS.PBUKR` != `PRPS.ABUKR`'
  applies_when:
    PRPS.LOEVM:
      blank: true
    PRPS.ABUKR:
      populated: true
  severity: low
  dimension: consistency
  message: Requesting company code differs from the WBS company code
  why_it_matters: A different requesting company code means the WBS element is settled across company codes, which needs intercompany
    clearing.
  rule_authority: best_practice
  sap_impact: Cross-company settlement posts through clearing accounts.
  fix_map:
    __other__: Confirm the cross-company setup or align the codes in CJ20N.
  record_fix_template: 'WBS element {PRPS.POSID}: requesting company code {PRPS.ABUKR} differs from {PRPS.PBUKR}.'
- id: PS099
  field: PRPS.AEDAT
  check_class: cross_field_check
  fail_when: '`PRPS.AEDAT` < `PRPS.ERDAT`'
  severity: low
  dimension: consistency
  message: WBS element changed before it was created
  why_it_matters: A change date before the creation date means the record was written outside the normal transaction.
  rule_authority: best_practice
  sap_impact: The audit trail of the WBS element cannot be trusted.
  fix_map:
    __other__: Check the load that wrote the dates.
  record_fix_template: 'WBS element {PRPS.POSID}: change date is before the creation date.'
- id: PS100
  field: PRPS.PSPNR
  check_class: cross_field_check
  fail_when: (`JEST.STAT` == 'I0046') & ((@today - `PRPS.AEDAT`).dt.days > 730)
  applies_when:
    PRPS.LOEVM:
      blank: true
  severity: info
  dimension: timeliness
  message: 'S/4HANA readiness: WBS element of a closed project untouched for two years and not flagged for deletion'
  why_it_matters: Closed projects carry no open work. Keeping their WBS elements active adds to the data volume the conversion
    must move (Simplification Item Project System data model).
  rule_authority: s4hana_migration
  sap_impact: Larger conversion volume; archiving before conversion removes closed projects.
  fix_map:
    __other__: Set the deletion flag and archive with PS_PROJECT (SARA) once settlement is done.
  record_fix_template: 'WBS element {PRPS.POSID}: project is closed and the element has not changed for over two years.'
- id: PS101
  field: AUFK.AUFNR
  check_class: cross_field_check
  fail_when: '`JEST.STAT` == ''I0046'''
  applies_when:
    AUFK.LOEKZ:
      blank: true
    AUFK.PSPEL:
      populated: true
    AUFK.IDAT3:
      blank: true
  severity: high
  dimension: consistency
  message: Open order is assigned to a WBS element of a closed project
  why_it_matters: Once a project is closed no further postings are allowed. An open order on its WBS element can no longer
    settle.
  rule_authority: sap_hard_constraint
  sap_impact: Order costs cannot settle to the closed project; the conversion pre-check lists the order as inconsistent.
  fix_map:
    __other__: Reassign the order or reopen the project in CJ20N.
  record_fix_template: 'Order {AUFK.AUFNR}: still open on a WBS element whose project is closed.'
- id: PS102
  field: PROJ.AEDAT
  check_class: cross_field_check
  fail_when: (@today - `PROJ.AEDAT`).dt.days > 1825
  applies_when:
    PROJ.LOEVM:
      blank: true
  severity: info
  dimension: timeliness
  message: 'S/4HANA readiness: project definition unchanged for five years and not flagged for deletion'
  why_it_matters: A project that nobody changed in five years is a candidate for closing and archiving before conversion.
  rule_authority: s4hana_migration
  sap_impact: Dormant projects add conversion volume and noise to the migration cockpit selection.
  fix_map:
    __other__: Close the project, settle it, set the deletion flag and archive.
  record_fix_template: 'Project {PROJ.PSPNR}: unchanged for over five years and not flagged for deletion.'
- id: PS103
  field: AFKO.AUFNR
  check_class: exists_check
  target_table: AUFK
  target_fields:
  - AUFNR
  grain: AFKO
  severity: high
  dimension: consistency
  message: Order header has no order master record
  why_it_matters: AFKO holds the scheduling header of an order or network. Without the AUFK master the header is orphaned.
  rule_authority: sap_hard_constraint
  sap_impact: The order cannot be displayed; the conversion rejects the orphan header.
  fix_map:
    __other__: Remove the orphan through the SAP archiving or repair note process; do not patch tables.
  record_fix_template: 'Order header {AFKO.AUFNR}: no order master exists.'
- id: PS104
  field: AFKO.PRONR
  check_class: exists_check
  target_table: PROJ
  target_fields:
  - PSPNR
  severity: medium
  dimension: consistency
  message: Network points at a project definition that does not exist
  why_it_matters: Networks under a project carry its number. A missing project breaks the hierarchy.
  rule_authority: sap_hard_constraint
  sap_impact: The network is not shown in project reports.
  fix_map:
    __other__: Correct the project assignment in CN22.
  record_fix_template: 'Network {AFKO.AUFNR}: project {AFKO.PRONR} does not exist.'
- id: PS105
  field: AFKO.GSTRP
  check_class: cross_field_check
  fail_when: '`AFKO.GSTRP` > `AFKO.GLTRP`'
  severity: medium
  dimension: consistency
  message: Basic start of the network is after the basic finish
  why_it_matters: Scheduling reads start and finish in sequence. A start after the finish cannot be scheduled.
  rule_authority: sap_hard_constraint
  sap_impact: Capacity and deadline monitoring give wrong results.
  fix_map:
    __other__: Reschedule the network in CN22.
  record_fix_template: 'Network {AFKO.AUFNR}: basic start is after basic finish.'
- id: PS106
  field: AFKO.GSTRS
  check_class: cross_field_check
  fail_when: '`AFKO.GSTRS` > `AFKO.GLTRS`'
  severity: medium
  dimension: consistency
  message: Scheduled start of the order is after the scheduled finish
  why_it_matters: Scheduling reads start and finish in sequence. A start after the finish cannot be scheduled.
  rule_authority: sap_hard_constraint
  sap_impact: Capacity and deadline monitoring give wrong results.
  fix_map:
    __other__: Reschedule the order.
  record_fix_template: 'Order header {AFKO.AUFNR}: scheduled start is after scheduled finish.'
- id: PS107
  field: AFKO.GSTRI
  check_class: cross_field_check
  fail_when: '`AFKO.GSTRI` > `AFKO.GETRI`'
  severity: medium
  dimension: consistency
  message: Actual start of the order is after the actual finish
  why_it_matters: Confirmations set the actual dates in sequence. A start after the finish points at a wrong confirmation.
  rule_authority: sap_hard_constraint
  sap_impact: Actual lead time reports are wrong.
  fix_map:
    __other__: Correct the confirmation.
  record_fix_template: 'Order header {AFKO.AUFNR}: actual start is after actual finish.'
- id: PS108
  field: AFVC.WERKS
  check_class: referential_check
  applies_when:
    AFVC.LOEKZ:
      blank: true
  severity: medium
  dimension: validity
  message: Plant of the order activity is not defined in customizing
  why_it_matters: The activity plant decides where it is planned and costed. An undefined plant cannot schedule it.
  rule_authority: sap_hard_constraint
  sap_impact: Capacity planning and costing skip the activity.
  fix_map:
    __other__: Use a defined plant.
  record_fix_template: 'Order activity {AFVC.VORNR}: plant ''''{invalid_value}'''' is not defined.'
- id: PS109
  field: AFVC.BUKRS
  check_class: referential_check
  applies_when:
    AFVC.LOEKZ:
      blank: true
  severity: medium
  dimension: validity
  message: Company code of the order activity is not defined in customizing
  why_it_matters: The activity company code is the posting company code. An undefined code cannot post.
  rule_authority: sap_hard_constraint
  sap_impact: Confirmations and externally processed activities fail on the company code.
  fix_map:
    __other__: Use a defined company code.
  record_fix_template: 'Order activity {AFVC.VORNR}: company code ''''{invalid_value}'''' is not defined.'
- id: PS110
  field: AFVC.PROJN
  check_class: exists_check
  target_table: PRPS
  target_fields:
  - PSPNR
  target_when:
    LOEVM:
      blank: true
  applies_when:
    AFVC.LOEKZ:
      blank: true
  severity: high
  dimension: consistency
  message: Network activity is assigned to a WBS element that is missing or flagged for deletion
  why_it_matters: Activity costs post to its WBS element. A missing or deleted element blocks the postings.
  rule_authority: sap_hard_constraint
  sap_impact: Confirmations and commitments for the activity fail.
  fix_map:
    __other__: Reassign the activity in CN22 or reactivate the WBS element.
  record_fix_template: 'Order activity {AFVC.VORNR}: WBS element {AFVC.PROJN} is missing or flagged for deletion.'
- id: PS111
  field: AFVC.LIFNR
  check_class: exists_check
  target_table: LFA1
  target_fields:
  - LIFNR
  applies_when:
    AFVC.LOEKZ:
      blank: true
  severity: medium
  dimension: consistency
  message: Externally processed activity points at a vendor that does not exist
  why_it_matters: Externally processed activities create purchase requisitions for the vendor. A missing vendor blocks them.
  rule_authority: sap_hard_constraint
  sap_impact: The purchase requisition cannot be converted to an order.
  fix_map:
    __other__: Correct the vendor in CN22.
  record_fix_template: 'Order activity {AFVC.VORNR}: vendor {AFVC.LIFNR} does not exist.'
- id: PS112
  field: AFVC.LIFNR
  check_class: exists_check
  target_table: CVI_VEND_LINK
  target_fields:
  - VENDOR
  applies_when:
    AFVC.LOEKZ:
      blank: true
  severity: high
  dimension: consistency
  message: 'S/4HANA readiness: activity vendor has no business partner link'
  why_it_matters: In S/4HANA the vendor exists only as a business partner (simplification item Business Partner Approach).
    An activity for an unsynchronised vendor loses its vendor on conversion.
  rule_authority: s4hana_migration
  sap_impact: Open externally processed activities cannot be converted with their vendor.
  fix_map:
    __other__: Synchronise the vendor to a business partner with CVI before conversion.
  record_fix_template: 'Order activity {AFVC.VORNR}: vendor {AFVC.LIFNR} has no business partner link.'
- id: PS113
  field: AFVC.ANFKO
  check_class: exists_check
  fields:
  - AFVC.ANFKOKRS
  - AFVC.ANFKO
  target_table: CSKS
  target_fields:
  - KOKRS
  - KOSTL
  applies_when:
    AFVC.LOEKZ:
      blank: true
  severity: medium
  dimension: consistency
  message: Activity requesting cost centre does not exist in the controlling area
  why_it_matters: The requesting cost centre owns the activity costs. A missing one cannot be charged.
  rule_authority: sap_hard_constraint
  sap_impact: Internal charges for the activity fail.
  fix_map:
    __other__: Assign a valid cost centre in CN22.
  record_fix_template: 'Order activity {AFVC.VORNR}: requesting cost centre {AFVC.ANFKO} does not exist.'
- id: PS114
  field: AFVC.EBELN
  check_class: exists_check
  target_table: EKKO
  target_fields:
  - EBELN
  applies_when:
    AFVC.LOEKZ:
      blank: true
  severity: medium
  dimension: consistency
  message: Activity refers to a purchase order that does not exist
  why_it_matters: Externally processed activities keep the purchase order that procures them. A missing order breaks the link.
  rule_authority: sap_hard_constraint
  sap_impact: Commitment values of the activity are lost.
  fix_map:
    __other__: Correct the purchase order in CN22.
  record_fix_template: 'Order activity {AFVC.VORNR}: purchase order {AFVC.EBELN} does not exist.'
- id: PS115
  field: AFVC.LTXA1
  check_class: null_check
  applies_when:
    AFVC.LOEKZ:
      blank: true
  severity: low
  dimension: completeness
  message: Order activity has no description
  why_it_matters: Planners and shop paper identify the activity by its short text.
  rule_authority: best_practice
  sap_impact: Activity lists show an empty line.
  fix_map:
    __blank__: Enter a short text in CN22.
  record_fix_template: 'Order activity {AFVC.VORNR}: description is {actual_value}.'
- id: PS116
  field: PROJ.STSPD
  check_class: referential_check
  applies_when:
    PROJ.LOEVM:
      blank: true
  severity: medium
  dimension: validity
  message: User status profile of the project definition is not defined in customizing
  why_it_matters: The user status profile controls which business transactions are allowed at each project stage. A profile
    that is not in TJ20 cannot be read, so status-based controls on the project stop working.
  rule_authority: sap_hard_constraint
  sap_impact: Setting a user status on the project fails; transaction control by status is lost.
  fix_map:
    __other__: Profile '{invalid_value}' is not defined in TJ20. Assign a defined status profile in CJ20N.
  record_fix_template: 'Project {PROJ.PSPID}: status profile of the project definition is not defined in TJ20.'
- id: PS117
  field: PROJ.STSPR
  check_class: referential_check
  applies_when:
    PROJ.LOEVM:
      blank: true
  severity: medium
  dimension: validity
  message: Default user status profile for WBS elements is not defined in customizing
  why_it_matters: New WBS elements inherit this status profile from the project definition. An undefined profile makes every
    new WBS element on the project fail to create or start without status control.
  rule_authority: sap_hard_constraint
  sap_impact: Creating WBS elements under the project fails or produces elements without status control.
  fix_map:
    __other__: Profile '{invalid_value}' is not defined in TJ20. Assign a defined WBS status profile in CJ20N.
  record_fix_template: 'Project {PROJ.PSPID}: WBS status profile is not defined in TJ20.'
- id: PS118
  field: PROJ.ZTEHT
  check_class: referential_check
  applies_when:
    PROJ.LOEVM:
      blank: true
  severity: low
  dimension: validity
  message: Time unit for project scheduling is not defined in customizing
  why_it_matters: The time unit converts durations in project scheduling. An undefined unit stops scheduling of the project
    and its networks.
  rule_authority: sap_hard_constraint
  sap_impact: Project scheduling cannot convert durations and ends with an error.
  fix_map:
    __other__: Unit '{invalid_value}' is not defined in T006. Correct the time unit in the project definition.
  record_fix_template: 'Project {PROJ.PSPID}: scheduling time unit is not defined in T006.'
- id: PS119
  field: PROJ.TXTSP
  check_class: referential_check
  severity: low
  dimension: validity
  message: Language of the project definition texts is not defined in customizing
  why_it_matters: Project texts are stored in the text language. An undefined language key makes descriptions and long texts
    unreadable in reports.
  rule_authority: sap_hard_constraint
  sap_impact: Long texts are not found; project reports show no description.
  fix_map:
    __other__: Language '{invalid_value}' is not defined in T002. Correct the language in CJ20N.
  record_fix_template: 'Project {PROJ.PSPID}: text language is not defined in T002.'
- id: PS120
  field: PROJ.PROFL
  check_class: null_check
  applies_when:
    PROJ.LOEVM:
      blank: true
  severity: high
  dimension: completeness
  message: Active project definition has no project profile
  why_it_matters: The project profile carries the defaults and control parameters for the whole project (planning, budgeting,
    settlement, scheduling). A project without a profile was loaded outside the standard dialogue and every new WBS element
    lacks its defaults.
  rule_authority: sap_hard_constraint
  sap_impact: CJ20N cannot process the project; new WBS elements miss their profile defaults.
  fix_map:
    __blank__: Assign the correct project profile to the project definition.
  record_fix_template: 'Project {PROJ.PSPID}: no project profile.'
- id: PS121
  field: PROJ.PLSEZ
  check_class: cross_field_check
  fail_when: '`JEST.STAT`.fillna('''') != ''I0046'''
  applies_when:
    PROJ.LOEVM:
      blank: true
    PROJ.PLSEZ:
      older_than_days: 365
  severity: medium
  dimension: timeliness
  message: Project is not closed more than a year after its planned finish
  why_it_matters: A project that runs a year past its planned finish without being closed either has an outdated plan or
    was never closed. Open projects still accept postings, keep commitments alive and must be migrated as active objects.
  rule_authority: s4hana_migration
  sap_impact: Costs can still post to finished projects; period-end settlement and the conversion carry them as open.
  fix_map:
    __other__: Update the planned finish or technically complete and close the project in CJ20N.
  record_fix_template: 'Project {PROJ.PSPID}: still open more than a year after its planned finish.'
- id: PS122
  field: PROJ.KALID
  check_class: null_check
  applies_when:
    PROJ.LOEVM:
      blank: true
  severity: low
  dimension: completeness
  message: Active project definition has no factory calendar
  why_it_matters: The factory calendar defines working days for project and network scheduling. Without it scheduling falls
    back to defaults and dates do not match the plant calendar.
  rule_authority: best_practice
  sap_impact: Scheduled dates of the project ignore holidays and non-working days.
  fix_map:
    __blank__: Assign the factory calendar of the executing plant to the project definition.
  record_fix_template: 'Project {PROJ.PSPID}: no factory calendar.'
- id: PS123
  field: PROJ.PRCTR
  check_class: null_check
  applies_when:
    PROJ.LOEVM:
      blank: true
  severity: medium
  dimension: completeness
  message: Active project definition has no profit centre
  why_it_matters: New WBS elements take the profit centre from the project definition. A project without a profit centre
    creates WBS elements that post to the dummy profit centre and break segment and profit-centre reporting.
  rule_authority: s4hana_migration
  sap_impact: Postings fall on the dummy profit centre; in S/4HANA document splitting needs a profit centre on every line.
  fix_map:
    __blank__: Assign the profit centre to the project definition in CJ20N.
  record_fix_template: 'Project {PROJ.PSPID}: no profit centre.'
- id: PS124
  field: PRPS.TXTSP
  check_class: referential_check
  severity: low
  dimension: validity
  message: Language of the WBS element texts is not defined in customizing
  why_it_matters: WBS texts are stored in the text language. An undefined language key makes descriptions and long texts
    unreadable in reports.
  rule_authority: sap_hard_constraint
  sap_impact: Long texts are not found; reports show no description for the element.
  fix_map:
    __other__: Language '{invalid_value}' is not defined in T002. Correct the language in CJ20N.
  record_fix_template: 'WBS element {PRPS.POSID}: text language is not defined in T002.'
- id: PS125
  field: PRPS.ERDAT
  check_class: cross_field_check
  fail_when: '`PRPS.ERDAT` > @today'
  severity: medium
  dimension: accuracy
  message: WBS element created in the future
  why_it_matters: The creation date is set by the system. A future date comes from a load that wrote the field directly and
    misleads every age-based check and archiving residence time.
  rule_authority: best_practice
  sap_impact: Archiving and freshness evaluations treat the element as new.
  fix_map:
    __other__: Trace the load that wrote the date and correct the creation date at source.
  record_fix_template: 'WBS element {PRPS.POSID}: creation date is in the future.'
- id: PS126
  field: PRPS.PRART
  check_class: null_check
  applies_when:
    PRPS.LOEVM:
      blank: true
  severity: low
  dimension: completeness
  message: Active WBS element has no project type
  why_it_matters: The project type classifies WBS elements (capital, customer, overhead) and drives selection in settlement,
    results analysis and reporting. Elements without a type fall out of these selections.
  rule_authority: best_practice
  sap_impact: Type-based reports and settlement selections miss the element.
  fix_map:
    __blank__: Assign the project type to the WBS element in CJ20N.
  record_fix_template: 'WBS element {PRPS.POSID}: no project type.'
- id: PS127
  field: PRPS.FKSTL
  check_class: null_check
  applies_when:
    PRPS.BELKZ:
    - X
    PRPS.LOEVM:
      blank: true
  severity: low
  dimension: completeness
  message: Account assignment WBS element has no responsible cost centre
  why_it_matters: The responsible cost centre identifies the department accountable for the element and is a common default
    for settlement and overhead. Account assignment elements without one leave costs without an owner.
  rule_authority: best_practice
  sap_impact: Responsibility reports omit the element; settlement defaults are missing.
  fix_map:
    __blank__: Enter the responsible cost centre in CJ20N > Responsibilities.
  record_fix_template: 'WBS element {PRPS.POSID}: account assignment element without a responsible cost centre.'
- id: PS128
  field: PRPS.FKOKR
  check_class: cross_field_check
  fail_when: '`PRPS.FKOKR` != `PRPS.PKOKR`'
  require_populated: true
  severity: medium
  dimension: consistency
  message: Controlling area of the responsible cost centre differs from the WBS controlling area
  why_it_matters: A WBS element can only reference cost centres in its own controlling area. A different controlling area on
    the responsible cost centre comes from a load or a reorganisation and points at a cost centre the element cannot use.
  rule_authority: sap_hard_constraint
  sap_impact: CJ20N rejects the element on the next change; responsibility reporting is wrong.
  fix_map:
    __other__: Reassign the responsible cost centre from the WBS controlling area in CJ20N.
  record_fix_template: 'WBS element {PRPS.POSID}: responsible cost centre is in controlling area {PRPS.FKOKR}, element is in
    {PRPS.PKOKR}.'
- id: PS129
  field: PRPS.AKOKR
  check_class: cross_field_check
  fail_when: '`PRPS.AKOKR` != `PRPS.PKOKR`'
  require_populated: true
  severity: low
  dimension: consistency
  message: Controlling area of the requesting cost centre differs from the WBS controlling area
  why_it_matters: The requesting cost centre must belong to the controlling area of the WBS element. A mismatch points at a
    cost centre the element cannot reference.
  rule_authority: sap_hard_constraint
  sap_impact: CJ20N rejects the element on the next change; requester reporting is wrong.
  fix_map:
    __other__: Reassign the requesting cost centre from the WBS controlling area in CJ20N.
  record_fix_template: 'WBS element {PRPS.POSID}: requesting cost centre is in controlling area {PRPS.AKOKR}, element is in
    {PRPS.PKOKR}.'
- id: PS130
  field: PRPS.POST1
  check_class: similarity_check
  block_by:
  - PRPS.PSPHI
  threshold: 0.95
  exact_rule: false
  evidence_key: PRPS.PSPNR
  grain: PRPS
  severity: low
  dimension: uniqueness
  message: Near-duplicate WBS element descriptions within one project
  why_it_matters: Two WBS elements of one project with almost the same description are often duplicates created by copying,
    and costs then split between them. Users cannot tell which element to post to.
  rule_authority: best_practice
  sap_impact: Costs split across duplicate elements; project reports double count planned work.
  fix_map:
    __other__: Compare the elements; merge postings to one and flag the duplicate for deletion.
  record_fix_template: 'WBS element {PRPS.POSID}: description nearly matches another element of the same project.'
- id: PS131
  field: PRPS.FAKKZ
  check_class: cross_field_check
  fail_when: '`JEST.STAT`.fillna('''') != ''I0046'''
  applies_when:
    PRPS.FAKKZ:
    - X
    PRPS.LOEVM:
      blank: true
    PRPS.AEDAT:
      older_than_days: 1095
  severity: low
  dimension: timeliness
  message: Billing element of an open project unchanged for three years
  why_it_matters: Billing elements carry revenue and resource-related billing. One that has not changed in three years on a
    project that is not closed is usually finished business that still accepts revenue postings.
  rule_authority: s4hana_migration
  sap_impact: Revenue can still post; results analysis and the conversion carry the element as active.
  fix_map:
    __other__: Confirm the billing is complete, then technically complete or close the element in CJ20N.
  record_fix_template: 'WBS element {PRPS.POSID}: billing element unchanged for over three years on an open project.'
- id: PS132
  field: PRPS.ABUKR
  check_class: referential_check
  severity: low
  dimension: validity
  message: Requesting company code of the WBS element is not defined
  why_it_matters: The requesting company code identifies who ordered the work. An undefined company code cannot be reported
    or used in intercompany evaluations.
  rule_authority: sap_hard_constraint
  sap_impact: CJ20N rejects the element on the next change; intercompany reports omit it.
  fix_map:
    __other__: Company code '{invalid_value}' is not defined in T001. Correct the requesting company code.
  record_fix_template: 'WBS element {PRPS.POSID}: requesting company code is not defined in T001.'
- id: PS133
  field: AUFK.WAERS
  check_class: null_check
  applies_when:
    AUFK.LOEKZ:
      blank: true
  severity: medium
  dimension: completeness
  message: Active order has no order currency
  why_it_matters: The order currency is the currency for planning and reporting on the order. An order without one was loaded
    outside the standard dialogue and plan values cannot be entered.
  rule_authority: sap_hard_constraint
  sap_impact: Planning on the order fails; order reports show values without a currency.
  fix_map:
    __blank__: Set the order currency (usually the controlling area or company code currency) on the order.
  record_fix_template: 'Order {AUFK.AUFNR}: no order currency.'
- id: PS134
  field: AUFK.WAERS
  check_class: referential_check
  severity: medium
  dimension: validity
  message: Order currency is not defined in customizing
  why_it_matters: An order currency that is not in TCURC cannot be translated, so plan and actual values on the order cannot
    be valued.
  rule_authority: sap_hard_constraint
  sap_impact: Postings and planning on the order fail with a currency error.
  fix_map:
    __other__: Currency '{invalid_value}' is not defined in TCURC. Correct the order currency.
  record_fix_template: 'Order {AUFK.AUFNR}: order currency is not defined in TCURC.'
- id: PS135
  field: AUFK.WERKS
  check_class: referential_check
  applies_when:
    AUFK.LOEKZ:
      blank: true
  severity: medium
  dimension: validity
  message: Plant of the order is not defined in customizing
  why_it_matters: The plant on the order drives material staging, capacity and valuation. A plant that is not in T001W cannot be
    used by any logistics function.
  rule_authority: sap_hard_constraint
  sap_impact: Goods movements and confirmations against the order fail.
  fix_map:
    __other__: Plant '{invalid_value}' is not defined in T001W. Correct the plant on the order.
  record_fix_template: 'Order {AUFK.AUFNR}: plant is not defined in T001W.'
- id: PS136
  field: AUFK.KOSTL
  check_class: exists_check
  fields:
  - AUFK.KOKRS
  - AUFK.KOSTL
  target_table: CSKS
  target_fields:
  - KOKRS
  - KOSTL
  applies_when:
    AUFK.LOEKZ:
      blank: true
  severity: medium
  dimension: consistency
  message: Cost centre of the order does not exist in the controlling area
  why_it_matters: Statistical orders post to the real cost centre on the order. A cost centre that does not exist in the
    controlling area makes those postings fail.
  rule_authority: sap_hard_constraint
  sap_impact: Postings to the statistical order are rejected; cost centre reports miss the costs.
  fix_map:
    __other__: Correct the cost centre on the order (KO02) to one in the order's controlling area.
  record_fix_template: 'Order {AUFK.AUFNR}: cost centre does not exist in controlling area {AUFK.KOKRS}.'
- id: PS137
  field: AUFK.ABUKR
  check_class: cross_field_check
  fail_when: '`AUFK.ABUKR` != `AUFK.BUKRS`'
  require_populated: true
  applies_when:
    AUFK.LOEKZ:
      blank: true
  severity: low
  dimension: consistency
  message: Requesting company code of the order differs from the order company code
  why_it_matters: A different requesting company code means the order serves another legal entity. That is valid only with
    intercompany settlement in place; otherwise costs stay in the wrong company.
  rule_authority: best_practice
  sap_impact: Costs remain in the executing company unless an intercompany settlement rule exists.
  fix_map:
    __other__: Confirm the intercompany setup or correct the requesting company code on the order.
  record_fix_template: 'Order {AUFK.AUFNR}: requesting company code {AUFK.ABUKR} differs from company code {AUFK.BUKRS}.'
- id: PS138
  field: AUFK.IDAT1
  check_class: cross_field_check
  fail_when: '`AUFK.IDAT1` > @today'
  severity: medium
  dimension: accuracy
  message: Order release date is in the future
  why_it_matters: The release date is set when the order is released. A future date comes from a load that wrote the field
    directly and misleads ageing and freshness evaluations.
  rule_authority: best_practice
  sap_impact: Order ageing and lifecycle reports are wrong.
  fix_map:
    __other__: Trace the load that wrote the date and correct the release date at source.
  record_fix_template: 'Order {AUFK.AUFNR}: release date is in the future.'
- id: PS139
  field: AUFK.AEDAT
  check_class: cross_field_check
  fail_when: '`AUFK.AEDAT` > @today'
  severity: medium
  dimension: accuracy
  message: Order changed in the future
  why_it_matters: The change date is set by the system. A future value comes from a direct load or a wrong clock and breaks
    every freshness and delta evaluation on orders.
  rule_authority: best_practice
  sap_impact: Delta extraction and freshness checks skip or misread the order.
  fix_map:
    __other__: Trace the load that wrote the date and correct the change date at source.
  record_fix_template: 'Order {AUFK.AUFNR}: change date is in the future.'
- id: PS140
  field: AUFK.OBJNR
  check_class: exists_check
  target_table: COBRB
  target_fields:
  - OBJNR
  negate: true
  applies_when:
    AUFK.ASTKZ:
    - X
  severity: low
  dimension: consistency
  message: Statistical order carries a settlement rule
  why_it_matters: A statistical order only mirrors costs that post to a real object, so it is never settled. A settlement rule
    on it is left over from a type change and confuses period-end settlement runs.
  rule_authority: best_practice
  sap_impact: Settlement runs list the order as an error; users expect settlement that never happens.
  fix_map:
    __other__: Delete the settlement rule or correct the statistical indicator on the order.
  record_fix_template: 'Order {AUFK.AUFNR}: statistical order with a settlement rule.'
- id: PS141
  field: AUFK.KDPOS
  check_class: cross_field_check
  fail_when: '`AUFK.KDAUF`.notna()'
  applies_when:
    AUFK.KDPOS:
      blank: true
  severity: medium
  dimension: completeness
  message: Order is assigned to a sales order without a sales order item
  why_it_matters: Make-to-order and customer-service costs are collected per sales order item. A sales order without an item
    cannot be resolved, so costs and revenue cannot be matched in results analysis.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement to the sales order item fails; results analysis on the item misses the costs.
  fix_map:
    __other__: Enter the sales order item on the order or remove the sales order assignment.
  record_fix_template: 'Order {AUFK.AUFNR}: sales order assignment without an item.'
- id: PS142
  field: AFKO.PNETSTARTD
  check_class: cross_field_check
  fail_when: '`AFKO.PNETSTARTD` > `AFKO.PNETENDD`'
  require_populated: true
  severity: medium
  dimension: consistency
  message: Network planned start is after the planned finish
  why_it_matters: The planned network dates frame the activities and their capacity requirements. A start after the finish
    is impossible and makes scheduling and capacity planning unreliable.
  rule_authority: sap_hard_constraint
  sap_impact: Network scheduling fails or produces negative durations; capacity loads are wrong.
  fix_map:
    __other__: Correct the planned dates and reschedule the network in CN22.
  record_fix_template: 'Order {AFKO.AUFNR}: planned network start is after the planned finish.'
- id: PS143
  field: AFKO.GSTRP
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Order header has no basic start date
  why_it_matters: The basic start date anchors scheduling of the order or network. Without it scheduling cannot place the
    activities and capacity requirements are not created.
  rule_authority: sap_hard_constraint
  sap_impact: Scheduling fails; material and capacity requirements have no date.
  fix_map:
    __blank__: Enter the basic start date and reschedule the order.
  record_fix_template: 'Order {AFKO.AUFNR}: no basic start date.'
- id: PS144
  field: AFKO.GLTRS
  check_class: cross_field_check
  fail_when: (`AFKO.GLTRS` - `AFKO.GLTRP`).dt.days > 365
  require_populated: true
  severity: low
  dimension: accuracy
  message: Scheduled finish is more than a year after the basic finish
  why_it_matters: The scheduled finish should lie close to the basic finish. A gap of more than a year points at wrong
    durations, a wrong calendar or a basic date that was never updated, so the schedule is not credible.
  rule_authority: best_practice
  sap_impact: Requirement dates and capacity loads sit a year or more away from the planned dates.
  fix_map:
    __other__: Review activity durations and the factory calendar, then reschedule the order.
  record_fix_template: 'Order {AFKO.AUFNR}: scheduled finish is more than a year after the basic finish.'
- id: PS145
  field: AFKO.GSTRI
  check_class: cross_field_check
  fail_when: '`AFKO.GETRI`.notna() & `AFKO.GSTRI`.isna()'
  severity: medium
  dimension: consistency
  message: Order has an actual finish but no actual start
  why_it_matters: Confirmations set the actual start before the actual finish. A finish without a start comes from a direct
    load or a reversed confirmation and breaks lead-time analysis.
  rule_authority: best_practice
  sap_impact: Lead-time and on-time reports cannot compute the actual duration.
  fix_map:
    __other__: Check the confirmations and correct the actual dates of the order.
  record_fix_template: 'Order {AFKO.AUFNR}: actual finish without an actual start.'
- id: PS146
  field: AFKO.GSTRI
  check_class: cross_field_check
  fail_when: '`AFKO.GSTRI` > @today'
  severity: medium
  dimension: accuracy
  message: Order actual start is in the future
  why_it_matters: The actual start is set by the first confirmation, which cannot happen in the future. A future date is a
    load error or a wrongly keyed confirmation.
  rule_authority: best_practice
  sap_impact: Progress and lead-time reports count work that has not happened.
  fix_map:
    __other__: Reverse the wrong confirmation or correct the actual start at source.
  record_fix_template: 'Order {AFKO.AUFNR}: actual start is in the future.'
- id: PS147
  field: AFVC.EKORG
  check_class: referential_check
  applies_when:
    AFVC.LOEKZ:
      blank: true
  severity: medium
  dimension: validity
  message: Purchasing organisation of the activity is not defined in customizing
  why_it_matters: External activities create purchase requisitions for the purchasing organisation on the activity. An
    undefined organisation makes the requisition fail.
  rule_authority: sap_hard_constraint
  sap_impact: No purchase requisition is created for the external activity.
  fix_map:
    __other__: Purchasing organisation '{invalid_value}' is not defined in T024E. Correct the activity.
  record_fix_template: 'Order operation list {AFVC.AUFPL}, activity {AFVC.VORNR}: purchasing organisation is not defined in
    T024E.'
- id: PS148
  field: AFVC.EKGRP
  check_class: referential_check
  applies_when:
    AFVC.LOEKZ:
      blank: true
  severity: medium
  dimension: validity
  message: Purchasing group of the activity is not defined in customizing
  why_it_matters: The purchasing group on an external activity is copied to the purchase requisition. An undefined group makes
    the requisition fail or land with no buyer.
  rule_authority: sap_hard_constraint
  sap_impact: The requisition is not created or is not routed to a buyer.
  fix_map:
    __other__: Purchasing group '{invalid_value}' is not defined in T024. Correct the activity.
  record_fix_template: 'Order operation list {AFVC.AUFPL}, activity {AFVC.VORNR}: purchasing group is not defined in T024.'
- id: PS149
  field: AFVC.MATKL
  check_class: referential_check
  applies_when:
    AFVC.LOEKZ:
      blank: true
  severity: medium
  dimension: validity
  message: Material group of the activity is not defined in customizing
  why_it_matters: The material group on an external activity drives account determination and purchasing statistics for the
    requisition. An undefined group stops the requisition.
  rule_authority: sap_hard_constraint
  sap_impact: The purchase requisition is not created; spend analysis misses the activity.
  fix_map:
    __other__: Material group '{invalid_value}' is not defined in T023. Correct the activity.
  record_fix_template: 'Order operation list {AFVC.AUFPL}, activity {AFVC.VORNR}: material group is not defined in T023.'
- id: PS150
  field: AFVC.EKORG
  check_class: null_check
  applies_when:
    AFVC.LIFNR:
      populated: true
    AFVC.LOEKZ:
      blank: true
  severity: medium
  dimension: completeness
  message: External activity with a vendor has no purchasing organisation
  why_it_matters: An activity with a vendor is processed externally and needs a purchasing organisation to create the
    requisition. Without it the external work is never procured.
  rule_authority: sap_hard_constraint
  sap_impact: No purchase requisition is created; the external work is not ordered.
  fix_map:
    __blank__: Enter the purchasing organisation on the external activity.
  record_fix_template: 'Order operation list {AFVC.AUFPL}, activity {AFVC.VORNR}: external activity without a purchasing
    organisation.'
- id: PS151
  field: AFVC.PREIS
  check_class: cross_field_check
  fail_when: '`AFVC.PREIS`.fillna(0) <= 0'
  applies_when:
    AFVC.LIFNR:
      populated: true
    AFVC.LOEKZ:
      blank: true
  severity: medium
  dimension: accuracy
  message: External activity with a vendor has no price
  why_it_matters: The price of an external activity drives planned costs and the requisition value. A zero price understates
    project costs and leaves the buyer without a reference value.
  rule_authority: best_practice
  sap_impact: Planned costs of the network are understated; requisitions carry no value for release strategies.
  fix_map:
    __other__: Enter the agreed price or link a purchasing info record to the activity.
  record_fix_template: 'Order operation list {AFVC.AUFPL}, activity {AFVC.VORNR}: external activity without a price.'
- id: PS152
  field: AFVC.WAERS
  check_class: referential_check
  applies_when:
    AFVC.LOEKZ:
      blank: true
  severity: medium
  dimension: validity
  message: Currency of the activity price is not defined in customizing
  why_it_matters: The activity price cannot be valued in an undefined currency, so planned costs and requisitions for the
    activity fail.
  rule_authority: sap_hard_constraint
  sap_impact: Costing of the activity and creation of the requisition fail.
  fix_map:
    __other__: Currency '{invalid_value}' is not defined in TCURC. Correct the activity currency.
  record_fix_template: 'Order operation list {AFVC.AUFPL}, activity {AFVC.VORNR}: currency is not defined in TCURC.'
- id: PS153
  field: AFVC.KALID
  check_class: referential_check
  applies_when:
    AFVC.LOEKZ:
      blank: true
  severity: low
  dimension: validity
  message: Factory calendar of the activity is not defined in customizing
  why_it_matters: The activity calendar decides working days for scheduling. An undefined calendar stops scheduling of the
    activity.
  rule_authority: sap_hard_constraint
  sap_impact: Scheduling of the order fails at this activity.
  fix_map:
    __other__: Calendar '{invalid_value}' is not defined in TFACD. Correct the activity calendar.
  record_fix_template: 'Order operation list {AFVC.AUFPL}, activity {AFVC.VORNR}: factory calendar is not defined in TFACD.'
- id: PS154
  field: AFVC.SAKTO
  check_class: null_check
  applies_when:
    AFVC.LIFNR:
      populated: true
    AFVC.LOEKZ:
      blank: true
  severity: low
  dimension: completeness
  message: External activity with a vendor has no cost element
  why_it_matters: The cost element on an external activity decides the account the purchase posts to. Without it the
    requisition relies on defaults that may post to the wrong account.
  rule_authority: best_practice
  sap_impact: External costs post to a default cost element; project cost reports misclassify them.
  fix_map:
    __blank__: Enter the cost element on the external activity.
  record_fix_template: 'Order operation list {AFVC.AUFPL}, activity {AFVC.VORNR}: external activity without a cost element.'
- id: PS155
  field: AFVC.MATKL
  check_class: null_check
  applies_when:
    AFVC.LIFNR:
      populated: true
    AFVC.LOEKZ:
      blank: true
  severity: low
  dimension: completeness
  message: External activity with a vendor has no material group
  why_it_matters: The material group classifies external spend and drives account determination in purchasing. Without it the
    requisition cannot be created or spend analysis misses the work.
  rule_authority: best_practice
  sap_impact: The purchase requisition fails; spend reports omit the activity.
  fix_map:
    __blank__: Enter the material group on the external activity.
  record_fix_template: 'Order operation list {AFVC.AUFPL}, activity {AFVC.VORNR}: external activity without a material group.'
- id: PS156
  field: COBRA.AEDAT
  check_class: cross_field_check
  fail_when: '`COBRA.AEDAT` < `COBRA.ERDAT`'
  require_populated: true
  severity: low
  dimension: accuracy
  message: Settlement rule changed before it was created
  why_it_matters: A change date before the creation date is impossible. It comes from a load that wrote audit fields directly,
    and the audit trail of the settlement rule cannot be trusted.
  rule_authority: best_practice
  sap_impact: Audit and change reports on settlement rules are wrong.
  fix_map:
    __other__: Trace the load that wrote the dates and correct the audit fields at source.
  record_fix_template: 'Settlement rule of object {COBRA.OBJNR}: changed before it was created.'
- id: PS157
  field: COBRB.KONTY
  check_class: null_check
  grain: COBRB
  severity: high
  dimension: completeness
  message: Settlement distribution rule has no receiver category
  why_it_matters: The receiver category (cost centre, order, WBS element, G/L account, asset) tells settlement where to post.
    A distribution rule without one cannot be executed.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement of the sender fails; costs stay on the sender.
  fix_map:
    __blank__: Delete the distribution rule and create it again with a receiver in the settlement rule.
  record_fix_template: 'Settlement rule of object {COBRB.OBJNR}, line {COBRB.LFDNR}: no receiver category.'
- id: PS158
  field: COBRB.KOSTL
  check_class: cross_field_check
  grain: COBRB
  fail_when: '`COBRB.OBJNR`.notna()'
  applies_when:
    COBRB.KONTY:
    - KS
    COBRB.KOSTL:
      blank: true
  severity: high
  dimension: completeness
  message: Settlement to a cost centre has no receiver cost centre
  why_it_matters: A distribution rule with receiver category cost centre must name the cost centre. Without it settlement has
    no receiver and the sender keeps its costs.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement of the sender fails; period-end close stalls.
  fix_map:
    __other__: Enter the receiver cost centre in the settlement rule.
  record_fix_template: 'Settlement rule of object {COBRB.OBJNR}, line {COBRB.LFDNR}: cost centre receiver without a cost centre.'
- id: PS159
  field: COBRB.AUFNR
  check_class: cross_field_check
  grain: COBRB
  fail_when: '`COBRB.OBJNR`.notna()'
  applies_when:
    COBRB.KONTY:
    - OR
    COBRB.AUFNR:
      blank: true
  severity: high
  dimension: completeness
  message: Settlement to an order has no receiver order
  why_it_matters: A distribution rule with receiver category order must name the order. Without it settlement has no receiver
    and the sender keeps its costs.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement of the sender fails; period-end close stalls.
  fix_map:
    __other__: Enter the receiver order in the settlement rule.
  record_fix_template: 'Settlement rule of object {COBRB.OBJNR}, line {COBRB.LFDNR}: order receiver without an order.'
- id: PS160
  field: COBRB.PS_PSP_PNR
  check_class: cross_field_check
  grain: COBRB
  fail_when: '`COBRB.OBJNR`.notna()'
  applies_when:
    COBRB.KONTY:
    - PR
    COBRB.PS_PSP_PNR:
      blank: true
  severity: high
  dimension: completeness
  message: Settlement to a WBS element has no receiver WBS element
  why_it_matters: A distribution rule with receiver category WBS element must name the element. Without it settlement has no
    receiver and the sender keeps its costs.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement of the sender fails; period-end close stalls.
  fix_map:
    __other__: Enter the receiver WBS element in the settlement rule.
  record_fix_template: 'Settlement rule of object {COBRB.OBJNR}, line {COBRB.LFDNR}: WBS receiver without a WBS element.'
- id: PS161
  field: COBRB.HKONT
  check_class: cross_field_check
  grain: COBRB
  fail_when: '`COBRB.OBJNR`.notna()'
  applies_when:
    COBRB.KONTY:
    - SK
    COBRB.HKONT:
      blank: true
  severity: high
  dimension: completeness
  message: Settlement to a G/L account has no receiver account
  why_it_matters: A distribution rule with receiver category G/L account must name the account. Without it settlement has no
    receiver and the sender keeps its costs.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement of the sender fails; period-end close stalls.
  fix_map:
    __other__: Enter the receiver G/L account in the settlement rule.
  record_fix_template: 'Settlement rule of object {COBRB.OBJNR}, line {COBRB.LFDNR}: G/L receiver without an account.'
- id: PS162
  field: COBRB.ANLN1
  check_class: cross_field_check
  grain: COBRB
  fail_when: '`COBRB.OBJNR`.notna()'
  applies_when:
    COBRB.KONTY:
    - AN
    COBRB.ANLN1:
      blank: true
  severity: high
  dimension: completeness
  message: Settlement to an asset has no receiver asset
  why_it_matters: A distribution rule with receiver category asset must name the asset, usually the asset under construction
    of a capital project. Without it capitalisation cannot run.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement and capitalisation of the sender fail; assets under construction are not capitalised.
  fix_map:
    __other__: Enter the receiver asset in the settlement rule.
  record_fix_template: 'Settlement rule of object {COBRB.OBJNR}, line {COBRB.LFDNR}: asset receiver without an asset.'
- id: PS163
  field: COBRB.BUKRS
  check_class: referential_check
  grain: COBRB
  severity: medium
  dimension: validity
  message: Company code of the settlement receiver is not defined
  why_it_matters: Settlement posts to the receiver's company code. An undefined company code makes the settlement posting
    fail.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement of the sender fails at this distribution rule.
  fix_map:
    __other__: Company code '{invalid_value}' is not defined in T001. Correct the receiver in the settlement rule.
  record_fix_template: 'Settlement rule of object {COBRB.OBJNR}, line {COBRB.LFDNR}: receiver company code is not defined in
    T001.'
- id: PS164
  field: COBRB.PROZS
  check_class: cross_field_check
  grain: COBRB
  fail_when: (`COBRB.PROZS`.fillna(0) == 0) & (`COBRB.AQZIF`.fillna(0) == 0) & (`COBRB.BETRR`.fillna(0) == 0)
  applies_when:
    COBRB.KONTY:
      populated: true
  severity: medium
  dimension: completeness
  message: Settlement distribution rule has no percentage, equivalence number or amount
  why_it_matters: Each distribution rule must say how much of the cost it takes, as a percentage, an equivalence number or a
    fixed amount. A rule with none of them takes nothing and leaves costs on the sender.
  rule_authority: sap_hard_constraint
  sap_impact: Settlement finds no share for the receiver; costs remain on the sender or settle with an error.
  fix_map:
    __other__: Enter the percentage, equivalence number or amount for the distribution rule.
  record_fix_template: 'Settlement rule of object {COBRB.OBJNR}, line {COBRB.LFDNR}: no settlement share.'
- id: PS165
  field: COBRB.KOSTL
  check_class: exists_check
  grain: COBRB
  fields:
  - COBRB.KOKRS
  - COBRB.KOSTL
  target_table: CSKS
  target_fields:
  - KOKRS
  - KOSTL
  target_when:
    DATBI:
      within_days: 0
  applies_when:
    COBRB.KONTY:
    - KS
  severity: medium
  dimension: timeliness
  message: Settlement receiver cost centre is no longer valid
  why_it_matters: A cost centre whose validity has ended cannot receive postings. Settlement rules that still point at it fail
    at the next period-end, usually after a cost centre reorganisation.
  rule_authority: s4hana_migration
  sap_impact: Settlement fails at period-end; costs stay on the sender until the rule is corrected.
  fix_map:
    __other__: Replace the expired receiver with its successor cost centre in the settlement rule.
  record_fix_template: 'Settlement rule of object {COBRB.OBJNR}, line {COBRB.LFDNR}: receiver cost centre is no longer valid.'
