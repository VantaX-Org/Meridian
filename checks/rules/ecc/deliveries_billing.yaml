- id: DL084
  field: LIPS.MATNR
  check_class: exists_check
  fields:
  - LIPS.MATNR
  target_table: MARA
  target_fields:
  - MATNR
  severity: critical
  dimension: accuracy
  message: Delivery item references a material that does not exist in the material master
  why_it_matters: LIPS.MATNR must resolve to MARA. An orphan material means the stock movement and the
    billing item point at a material that the system does not know, so no valuation or costing can be
    derived.
  rule_authority: sap_hard_constraint
  sap_impact: Goods issue and billing fail valuation; stock cannot be valued for the item.
  fix_map:
    __missing__: Create the material or correct the item's material number.
  record_fix_template: 'LIPS.MATNR: ''{actual_value}'' has no MARA master record. Create the material
    or correct the item''s material number.'
