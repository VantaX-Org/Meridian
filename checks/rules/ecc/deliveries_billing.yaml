  record_fix_template: 'VBRK.ERDAT: ''{actual_value}'' is in the future. Correct the creation date.'
- id: DL069
  field: VBRP.VBELN
  check_class: uniqueness_check
  fields:
  - VBRP.VBELN
  - VBRP.POSNR
  severity: critical
  dimension: uniqueness
  message: Duplicate billing item keys detected
  why_it_matters: VBELN+POSNR is the primary key of VBRP.
  rule_authority: sap_hard_constraint
  sap_impact: The item load is rejected; revenue posts twice.
