  record_fix_template: 'LIKP.KUNNR: ''{actual_value}'' has no KNA1 master record. Create the customer
    or correct the ship-to party.'
- id: DL087
  field: LIKP.KUNAG
  check_class: exists_check
  fields:
  - LIKP.KUNAG
  target_table: KNA1
  target_fields:
  - KUNNR
  severity: high
  dimension: accuracy
  message: Delivery sold-to party does not exist in the customer master
  why_it_matters: LIKP.KUNAG must resolve to KNA1 so the delivery can be billed to a valid customer.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue posts to a non-existent customer or not at all.
  fix_map:
    __missing__: Create the customer or correct the sold-to party.
