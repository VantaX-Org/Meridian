  why_it_matters: The item must identify the material so revenue can be matched to COGS.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue cannot be matched to material margin.
  fix_map:
    __blank__: Assign the material in VF02.
  record_fix_template: 'VBRP.MATNR: ''{actual_value}'' is blank. Assign the material in VF02.'
- id: DL071
  field: VBRP.FKIMG
  check_class: cross_field_check
  fail_when: '`VBRP.FKIMG` < 0'
  require_populated: true
  severity: high
  dimension: validity
  message: Billed quantity is negative on a standard invoice
  why_it_matters: FKIMG is the quantity billed; on an invoice it is positive, a negative value credits
