  why_it_matters: SPART is part of the account-determination and reporting key.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue is not reported by division.
  fix_map:
    __blank__: Assign the division in VF02.
  record_fix_template: 'VBRK.SPART: ''{actual_value}'' is blank. Assign the division in VF02.'
- id: DL066
  field: VBRK.POPER
  check_class: domain_value_check
  allowed_values:
  - '01'
  - '02'
  - '03'
  - '04'
  - '05'
  - '06'
  - '07'
  - 08
  - 09
  - '10'
  - '11'
  - '12'
  - '13'
  - '14'
  - '15'
  - '16'
