  rule_authority: sap_hard_constraint
  sap_impact: Quantity reconciliation between order, delivery and invoice fails.
  fix_map:
    __blank__: Assign the sales unit.
  record_fix_template: 'VBRP.VRKME: ''{actual_value}'' is blank. Assign the sales unit.'
