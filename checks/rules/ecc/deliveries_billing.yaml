  why_it_matters: KUNRG is the party that pays. Without it the receivable has no customer.
  rule_authority: sap_hard_constraint
  sap_impact: The FI receivable cannot be posted to a customer.
  fix_map:
    __blank__: Assign the payer in VF02.
  record_fix_template: 'VBRK.KUNRG: ''{actual_value}'' is blank. Assign the payer in VF02.'
- id: DL055
  field: VBRK.BUKRS
  check_class: null_check
  severity: high
  dimension: completeness
  message: Company code is blank on the invoice
  why_it_matters: BUKRS is the legal entity the revenue and receivable post to.
  rule_authority: sap_hard_constraint
  sap_impact: The FI document cannot be created.
  fix_map:
    __blank__: Assign the company code in VF02.
  record_fix_template: 'VBRK.BUKRS: ''{actual_value}'' is blank. Assign the company code in VF02.'
