  field: VBRP.MATNR
  check_class: exists_check
  fields:
  - VBRP.MATNR
  target_table: MARA
  target_fields:
  - MATNR
  severity: critical
  dimension: accuracy
  message: Billing item references a material that does not exist in the material master
  why_it_matters: VBRP.MATNR must resolve to MARA so revenue can be matched to the material and its cost
    of goods sold.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue cannot be matched to COGS; margin reporting breaks for the item.
  fix_map:
    __missing__: Create the material or correct the billing item.
  record_fix_template: 'VBRP.MATNR: ''{actual_value}'' has no MARA master record. Create the material
    or correct the billing item.'
