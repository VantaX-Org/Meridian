  check_class: null_check
  severity: medium
  dimension: completeness
  message: Currency conversion rate is blank
  why_it_matters: KURRF is the rate used to translate the document currency into local currency.
  rule_authority: sap_hard_constraint
  sap_impact: Local-currency amounts cannot be derived for the invoice.
  fix_map:
    __blank__: Enter the conversion rate in VF02.
  record_fix_template: 'VBRK.KURRF: ''{actual_value}'' is blank. Enter the conversion rate in VF02.'
- id: DL059
  field: VBRK.KURRF
  check_class: cross_field_check
  fail_when: '`VBRK.KURRF` < 0'
  require_populated: true
  severity: high
  dimension: validity
  message: Currency conversion rate is negative or zero
  why_it_matters: An exchange rate must be positive; zero or negative destroys every translated amount.
  rule_authority: sap_hard_constraint
  sap_impact: Local-currency revenue and receivables are wrong.
  fix_map:
    __other__: Correct the conversion rate in VF02.
  record_fix_template: 'VBRK.KURRF: ''{actual_value}'' is negative. Correct the conversion rate in VF02.'
- id: DL060
  field: VBRK.NETWR
  check_class: cross_field_check
  fail_when: '`VBRK.NETWR` < 0'
  require_populated: true
  severity: medium
  dimension: validity
  message: Net value is negative on a standard invoice
  why_it_matters: NETWR is the net value of the billing document. On an invoice it is positive; a negative
    value means a credit was posted as an invoice.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue is reduced instead of increased.
  fix_map:
    __other__: Correct the net value or use the right billing type.
  record_fix_template: 'VBRK.NETWR: ''{actual_value}'' is negative. Correct the net value or use the right
    billing type.'
- id: DL061
  field: VBRK.ZTERM
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Payment terms are blank
  why_it_matters: ZTERM determines the due date and any cash discount for the receivable.
  rule_authority: sap_hard_constraint
  sap_impact: The receivable has no due date; dunning and cash discount fail.
  fix_map:
    __blank__: Assign the payment terms in VF02.
  record_fix_template: 'VBRK.ZTERM: ''{actual_value}'' is blank. Assign the payment terms in VF02.'
- id: DL062
  field: VBRK.ZLSCH
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Payment method is blank
  why_it_matters: ZLSCH selects how the receivable is collected.
  rule_authority: sap_hard_constraint
  sap_impact: Automatic payment cannot process the receivable.
  fix_map:
    __blank__: Assign the payment method in VF02.
  record_fix_template: 'VBRK.ZLSCH: ''{actual_value}'' is blank. Assign the payment method in VF02.'
- id: DL063
  field: VBRK.KTGRD
  check_class: null_check
  severity: low
  dimension: completeness
  message: Account assignment group is blank
  why_it_matters: KTGRD is part of the account-determination key for revenue postings.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue account determination may fall back or fail.
  fix_map:
    __blank__: Assign the account assignment group.
  record_fix_template: 'VBRK.KTGRD: ''{actual_value}'' is blank. Assign the account assignment group.'
