  severity: low
  dimension: completeness
  message: Material group is blank on a billing item
  why_it_matters: MATKL supports material-group revenue and margin analysis.
  rule_authority: sap_hard_constraint
  sap_impact: The item is missing from material-group reporting.
  fix_map:
    __blank__: Assign the material group.
  record_fix_template: 'VBRP.MATKL: ''{actual_value}'' is blank. Assign the material group.'
