  field: VBRK.KURRF
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Currency conversion rate is blank
  why_it_matters: KURRF is the rate used to translate the document currency into local currency.
  rule_authority: sap_hard_constraint
  sap_impact: Local-currency amounts cannot be derived for the invoice.
  fix_map:
    __blank__: Enter the conversion rate in VF02.
  record_fix_template: 'VBRK.KURRF: ''{actual_value}'' is blank. Enter the conversion rate in VF02.'
- id: DL059
  field: VBRK.KURRF
  check_class: cross_field_check
  fail_when: '`VBRK.KURRF` < 0'
  require_populated: true
  severity: high
  dimension: validity
  message: Currency conversion rate is negative
  why_it_matters: An exchange rate must be positive; zero or negative destroys every translated amount.
  rule_authority: sap_hard_constraint
  sap_impact: Local-currency revenue and receivables are wrong.
  fix_map:
    __other__: Correct the conversion rate in VF02.
  record_fix_template: 'VBRK.KURRF: ''{actual_value}'' is negative. Correct the conversion rate in VF02.'
- id: DL060
  field: VBRK.NETWR
  check_class: cross_field_check
  fail_when: '`VBRK.NETWR` < 0'
  require_populated: true
  severity: medium
  dimension: validity
  message: Billing document net value is negative
  why_it_matters: NETWR is the net value of the billing document. On an invoice it is positive; a negative
    value means a credit was posted as an invoice.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue is reduced instead of increased.
  fix_map:
    __other__: Correct the net value or use the right billing type.
  record_fix_template: 'VBRK.NETWR: ''{actual_value}'' is negative. Correct the net value or use the right
    billing type.'
- id: DL061
  field: VBRK.ZTERM
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Payment terms are blank
  why_it_matters: ZTERM determines the due date and any cash discount for the receivable.
  rule_authority: sap_hard_constraint
  sap_impact: The receivable has no due date; dunning and cash discount fail.
  fix_map:
    __blank__: Assign the payment terms in VF02.
  record_fix_template: 'VBRK.ZTERM: ''{actual_value}'' is blank. Assign the payment terms in VF02.'
- id: DL062
  field: VBRK.ZLSCH
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Payment method is blank
  why_it_matters: ZLSCH selects how the receivable is collected.
  rule_authority: sap_hard_constraint
  sap_impact: Automatic payment cannot process the receivable.
  fix_map:
    __blank__: Assign the payment method in VF02.
  record_fix_template: 'VBRK.ZLSCH: ''{actual_value}'' is blank. Assign the payment method in VF02.'
- id: DL063
  field: VBRK.KTGRD
  check_class: null_check
  severity: low
  dimension: completeness
  message: Account assignment group is blank
  why_it_matters: KTGRD is part of the account-determination key for revenue postings.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue account determination may fall back or fail.
  fix_map:
    __blank__: Assign the account assignment group.
  record_fix_template: 'VBRK.KTGRD: ''{actual_value}'' is blank. Assign the account assignment group.'
- id: DL064
  field: VBRK.LAND1
  check_class: null_check
  severity: low
  dimension: completeness
  message: Country is blank on the invoice
  why_it_matters: LAND1 drives tax determination and the legality of the invoice.
  rule_authority: sap_hard_constraint
  sap_impact: Tax is not determined correctly for the invoice.
  fix_map:
    __blank__: Assign the country in VF02.
  record_fix_template: 'VBRK.LAND1: ''{actual_value}'' is blank. Assign the country in VF02.'
- id: DL065
  field: VBRK.SPART
  check_class: null_check
  severity: low
  dimension: completeness
  message: Division is blank on the invoice
  why_it_matters: SPART is part of the account-determination and reporting key.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue is not reported by division.
  fix_map:
    __blank__: Assign the division in VF02.
  record_fix_template: 'VBRK.SPART: ''{actual_value}'' is blank. Assign the division in VF02.'
- id: DL066
  field: VBRK.POPER
  check_class: domain_value_check
  allowed_values:
  - '01'
  - '02'
  - '03'
  - '04'
  - '05'
  - '06'
  - '07'
  - 08
  - 09
  - '10'
  - '11'
  - '12'
  - '13'
  - '14'
  - '15'
  - '16'
  severity: medium
  dimension: validity
  message: Posting period must be 01-16
  why_it_matters: POPER is the posting period within the fiscal year; SAP allows 01-16 including special
    periods.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue posts to a non-existent period.
  fix_map:
    __other__: Correct the posting period in VF02.
  record_fix_template: 'VBRK.POPER: ''{actual_value}'' is not a permitted value. Correct the posting period
    in VF02.'
- id: DL067
  field: VBRK.FKTYP
  check_class: domain_value_check
  allowed_values:
  - A
  - B
  - C
  - D
  - E
  - F
  - I
  - K
  - L
  - P
  - R
  - U
  - W
  - X
  severity: low
  dimension: validity
  message: Billing category is not a recognised value
  why_it_matters: FKTYP classifies the billing document for account determination and reporting.
  rule_authority: sap_hard_constraint
  sap_impact: The document is misclassified in revenue reporting.
  fix_map:
    __other__: Correct the billing category.
  record_fix_template: 'VBRK.FKTYP: ''{actual_value}'' is not a permitted value. Correct the billing category.'
- id: DL068
  field: VBRK.ERDAT
  check_class: cross_field_check
  fail_when: (`VBRK.ERDAT` - @today).dt.days > 0
  require_populated: true
  severity: low
  dimension: timeliness
  message: Invoice was created with a future date
  why_it_matters: ERDAT is stamped by SAP at creation.
  rule_authority: sap_business_convention
  sap_impact: Invoice ageing reporting is wrong.
  fix_map:
    __other__: Correct the creation date.
  record_fix_template: 'VBRK.ERDAT: ''{actual_value}'' is in the future. Correct the creation date.'
- id: DL069
  field: VBRP.VBELN
  check_class: uniqueness_check
  fields:
  - VBRP.VBELN
  - VBRP.POSNR
  severity: critical
  dimension: uniqueness
  message: Duplicate billing item keys detected
  why_it_matters: VBELN+POSNR is the primary key of VBRP.
  rule_authority: sap_hard_constraint
  sap_impact: The item load is rejected; revenue posts twice.
  fix_map:
    __other__: Keep one row per document/item.
  record_fix_template: 'VBRP.VBELN: duplicate key. Keep one row per document/item.'
- id: DL070
  field: VBRP.MATNR
  check_class: null_check
  severity: high
  dimension: completeness
  message: Material is blank on a billing item
  why_it_matters: The item must identify the material so revenue can be matched to COGS.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue cannot be matched to material margin.
  fix_map:
    __blank__: Assign the material in VF02.
  record_fix_template: 'VBRP.MATNR: ''{actual_value}'' is blank. Assign the material in VF02.'
- id: DL071
  field: VBRP.FKIMG
  check_class: cross_field_check
  fail_when: '`VBRP.FKIMG` < 0'
  require_populated: true
  severity: high
  dimension: validity
  message: Billed quantity is negative
  why_it_matters: FKIMG is the quantity billed; on an invoice it is positive, a negative value credits
    revenue.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue is reduced instead of increased.
  fix_map:
    __other__: Correct the quantity or use a credit memo type.
  record_fix_template: 'VBRP.FKIMG: ''{actual_value}'' is negative. Correct the quantity or use a credit
    memo type.'
- id: DL072
  field: VBRP.NETWR
  check_class: cross_field_check
  fail_when: '`VBRP.NETWR` < 0'
  require_populated: true
  severity: medium
  dimension: validity
  message: Net value is negative on a billing item
  why_it_matters: NETWR is the net value of the item; on an invoice it is positive.
  rule_authority: sap_hard_constraint
  sap_impact: Item revenue is wrong and margin reporting is distorted.
  fix_map:
    __other__: Correct the item value.
  record_fix_template: 'VBRP.NETWR: ''{actual_value}'' is negative. Correct the item value.'
- id: DL073
  field: VBRP.MEINS
  check_class: null_check
  severity: high
  dimension: completeness
  message: Base unit of measure is blank on a billing item
  why_it_matters: MEINS is required to convert the billed quantity into the material's base unit.
  rule_authority: sap_hard_constraint
  sap_impact: The billed quantity cannot be converted for costing.
  fix_map:
    __blank__: Assign the base unit of measure.
  record_fix_template: 'VBRP.MEINS: ''{actual_value}'' is blank. Assign the base unit of measure.'
- id: DL074
  field: VBRP.VRKME
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Sales unit of measure is blank on a billing item
  why_it_matters: VRKME records the unit the customer was billed in.
  rule_authority: sap_hard_constraint
  sap_impact: Quantity reconciliation between order, delivery and invoice fails.
  fix_map:
    __blank__: Assign the sales unit.
  record_fix_template: 'VBRP.VRKME: ''{actual_value}'' is blank. Assign the sales unit.'
- id: DL075
  field: VBRP.WERKS
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Plant is blank on a billing item
  why_it_matters: WERKS is needed for the cost of goods sold and for plant-level margin.
  rule_authority: sap_hard_constraint
  sap_impact: COGS and plant margin cannot be determined.
  fix_map:
    __blank__: Assign the plant in VF02.
  record_fix_template: 'VBRP.WERKS: ''{actual_value}'' is blank. Assign the plant in VF02.'
- id: DL076
  field: VBRP.PSTYV
  check_class: null_check
  severity: low
  dimension: completeness
  message: Item category is blank on a billing item
  why_it_matters: PSTYV controls how the item is treated in billing and account determination.
  rule_authority: sap_hard_constraint
  sap_impact: Account determination may fall back or fail.
  fix_map:
    __blank__: Assign the item category.
  record_fix_template: 'VBRP.PSTYV: ''{actual_value}'' is blank. Assign the item category.'
- id: DL077
  field: VBRP.MATKL
  check_class: null_check
  severity: low
  dimension: completeness
  message: Material group is blank on a billing item
  why_it_matters: MATKL supports material-group revenue and margin analysis.
  rule_authority: sap_hard_constraint
  sap_impact: The item is missing from material-group reporting.
  fix_map:
    __blank__: Assign the material group.
  record_fix_template: 'VBRP.MATKL: ''{actual_value}'' is blank. Assign the material group.'
- id: DL078
  field: VBRP.GSBER
  check_class: null_check
  severity: low
  dimension: completeness
  message: Business area is blank on a billing item
  why_it_matters: GSBER is needed for business-area P&L reporting.
  rule_authority: sap_hard_constraint
  sap_impact: The item is missing from business-area reporting.
  fix_map:
    __blank__: Assign the business area.
  record_fix_template: 'VBRP.GSBER: ''{actual_value}'' is blank. Assign the business area.'
- id: DL079
  field: VBRP.VSTEL
  check_class: null_check
  severity: low
  dimension: completeness
  message: Shipping point is blank on a billing item
  why_it_matters: VSTEL supports logistics reporting and revenue by shipping location.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue cannot be reported by shipping point.
  fix_map:
    __blank__: Assign the shipping point.
  record_fix_template: 'VBRP.VSTEL: ''{actual_value}'' is blank. Assign the shipping point.'
- id: DL080
  field: VBRP.KURSK
  check_class: cross_field_check
  fail_when: '`VBRP.KURSK` < 0'
  require_populated: true
  severity: high
  dimension: validity
  message: Exchange rate is negative on a billing item
  why_it_matters: KURSK translates the item values into local currency.
  rule_authority: sap_hard_constraint
  sap_impact: Local-currency item values are wrong.
  fix_map:
    __other__: Correct the exchange rate.
  record_fix_template: 'VBRP.KURSK: ''{actual_value}'' is negative. Correct the exchange rate.'
- id: DL081
  field: VBRP.PRSDT
  check_class: cross_field_check
  fail_when: (`VBRP.PRSDT` - @today).dt.days > 0
  require_populated: true
  severity: low
  dimension: timeliness
  message: Pricing date is in the future
  why_it_matters: PRSDT determines which pricing conditions applied. A pricing date after today means
    the item was priced from a period that has not begun.
  rule_authority: sap_business_convention
  sap_impact: The invoice may carry prices from a period that does not exist yet.
  fix_map:
    __other__: Correct the pricing date in VF02.
  record_fix_template: 'VBRP.PRSDT: ''{actual_value}'' is in the future. Correct the pricing date in VF02.'
- id: DL082
  field: VBRP.NTGEW
  check_class: cross_field_check
  fail_when: '`VBRP.NTGEW` < 0'
  require_populated: true
  severity: low
  dimension: validity
  message: Item net weight is negative
  why_it_matters: NTGEW is the item weight used for freight and customs.
  rule_authority: sap_hard_constraint
  sap_impact: Freight and customs values are wrong for the item.
  fix_map:
    __other__: Correct the weight.
  record_fix_template: 'VBRP.NTGEW: ''{actual_value}'' is negative. Correct the weight.'
