  rule_authority: sap_hard_constraint
  sap_impact: The billed quantity cannot be converted for costing.
  fix_map:
    __blank__: Assign the base unit of measure.
  record_fix_template: 'VBRP.MEINS: ''{actual_value}'' is blank. Assign the base unit of measure.'
