  rule_authority: sap_hard_constraint
  sap_impact: The FI reference is incomplete and reconciliation fails.
  fix_map:
    __blank__: Release the invoice to accounting.
  record_fix_template: 'VBRK.GJAHR: ''{actual_value}'' is blank. Release the invoice to accounting.'
