  field: VBRK.FKTYP
  check_class: domain_value_check
  allowed_values:
  - A
  - B
  - C
  - D
  - E
  - F
  - I
  - K
  - L
  - P
  - R
  - U
  - W
  - X
  severity: low
  dimension: validity
  message: Billing category is not a recognised value
  why_it_matters: FKTYP classifies the billing document for account determination and reporting.
  rule_authority: sap_hard_constraint
  sap_impact: The document is misclassified in revenue reporting.
  fix_map:
    __other__: Correct the billing category.
  record_fix_template: 'VBRK.FKTYP: ''{actual_value}'' is not a permitted value. Correct the billing category.'
