module: deliveries_billing
target_state: ECC_AND_S4HANA
rules:
- id: DL001
  field: LIKP.VBELN
  check_class: uniqueness_check
  fields:
  - LIKP.VBELN
  severity: critical
  dimension: uniqueness
  message: Duplicate delivery numbers detected
  why_it_matters: VBELN is the primary key of LIKP. Duplicates break the join to LIPS, the reference from
    billing and the goods movement documents.
  rule_authority: sap_hard_constraint
  sap_impact: The migration load is rejected; documents and movements attach to the wrong delivery.
  fix_map:
    __other__: Keep one delivery per number.
  record_fix_template: 'LIKP.VBELN: duplicate key. Keep one delivery per number.'
- id: DL002
  field: LIKP.VBELN
  check_class: regex_check
  pattern: ^[0-9]{10}$
  severity: high
  dimension: validity
  message: Delivery number must be 10 digits
  why_it_matters: VBELN is CHAR 10 and assigned by an internal number range. Any other shape means the
    key was built outside SAP.
  rule_authority: sap_hard_constraint
  sap_impact: The delivery cannot be addressed by standard transactions or interfaces.
  fix_map:
    __other__: Renumber the delivery from the SAP number range.
  record_fix_template: 'LIKP.VBELN: ''{actual_value}'' has an invalid format. Renumber the delivery from
    the SAP number range.'
- id: DL003
  field: LIKP.VKORG
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Sales organisation is mandatory on a delivery
  why_it_matters: VKORG drives pricing, plant determination and billing and is copied from the reference
    document at creation.
  rule_authority: sap_hard_constraint
  sap_impact: Delivery cannot be billed; VF01 fails.
  fix_map:
    __blank__: Assign the sales organisation in VL02N.
  record_fix_template: 'LIKP.VKORG: ''{actual_value}'' is blank. Assign the sales organisation in VL02N.'
- id: DL004
  field: LIKP.LFART
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Delivery type is mandatory
  why_it_matters: LFART selects the item categories, the shipping point rules and the goods movement.
  rule_authority: sap_hard_constraint
  sap_impact: Delivery cannot be picked, packed or posted.
  fix_map:
    __blank__: Assign the delivery type in VL02N.
  record_fix_template: 'LIKP.LFART: ''{actual_value}'' is blank. Assign the delivery type in VL02N.'
- id: DL005
  field: LIKP.VSTEL
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Shipping point is mandatory
  why_it_matters: VSTEL determines loading times, the working calendar and which shipping activities are
    required.
  rule_authority: sap_hard_constraint
  sap_impact: Scheduling and goods issue cannot be executed for the delivery.
  fix_map:
    __blank__: Assign the shipping point in VL02N.
  record_fix_template: 'LIKP.VSTEL: ''{actual_value}'' is blank. Assign the shipping point in VL02N.'
- id: DL006
  field: LIKP.KUNNR
  check_class: null_check
  severity: high
  dimension: completeness
  message: Ship-to party is blank
  why_it_matters: KUNNR is the party the goods are delivered to and is required for the delivery note
    and the export documents.
  rule_authority: sap_hard_constraint
  sap_impact: Delivery note and transport documents cannot be produced.
  fix_map:
    __blank__: Assign the ship-to party in VL02N.
  record_fix_template: 'LIKP.KUNNR: ''{actual_value}'' is blank. Assign the ship-to party in VL02N.'
- id: DL007
  field: LIKP.KUNAG
  check_class: null_check
  severity: high
  dimension: completeness
  message: Sold-to party is blank
  why_it_matters: KUNAG is the party that ordered. It is required to bill the delivery to the correct
    customer.
  rule_authority: sap_hard_constraint
  sap_impact: Billing cannot determine the payer; revenue posts to the wrong customer.
  fix_map:
    __blank__: Assign the sold-to party in VL02N.
  record_fix_template: 'LIKP.KUNAG: ''{actual_value}'' is blank. Assign the sold-to party in VL02N.'
- id: DL008
  field: LIKP.LFDAT
  check_class: null_check
  severity: high
  dimension: completeness
  message: Delivery date is blank
  why_it_matters: LFDAT is when the delivery is due to leave and drives scheduling, picking waves and
    on-time-delivery reporting.
  rule_authority: sap_hard_constraint
  sap_impact: Delivery is invisible to logistics planning and OTD KPIs.
  fix_map:
    __blank__: Enter the delivery date in VL02N.
  record_fix_template: 'LIKP.LFDAT: ''{actual_value}'' is blank. Enter the delivery date in VL02N.'
- id: DL009
  field: LIKP.WADAT
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Goods issue date is blank
  why_it_matters: WADAT is the planned goods issue date and is the basis for the material availability
    check and stock commitment.
  rule_authority: sap_hard_constraint
  sap_impact: Stock is not committed for the delivery; availability is overstated.
  fix_map:
    __blank__: Enter the goods issue date in VL02N.
  record_fix_template: 'LIKP.WADAT: ''{actual_value}'' is blank. Enter the goods issue date in VL02N.'
- id: DL010
  field: LIKP.ERDAT
  check_class: null_check
  severity: high
  dimension: completeness
  message: Creation date is blank
  why_it_matters: ERDAT is stamped by SAP when the delivery is created and is used for ageing and lead-time
    reporting.
  rule_authority: sap_hard_constraint
  sap_impact: Delivery ageing and lead-time reporting cannot place the document in time.
  fix_map:
    __blank__: Correct the creation date or reload the delivery.
  record_fix_template: 'LIKP.ERDAT: ''{actual_value}'' is blank. Correct the creation date or reload the
    delivery.'
- id: DL011
  field: LIKP.ERDAT
  check_class: cross_field_check
  fail_when: (`LIKP.ERDAT` - @today).dt.days > 0
  require_populated: true
  severity: low
  dimension: timeliness
  message: Delivery was created with a future date
  why_it_matters: ERDAT is stamped by SAP. A future creation date means the timestamp was manipulated
    during the load.
  rule_authority: sap_business_convention
  sap_impact: Logistics ageing and lead-time reports are wrong for this delivery.
  fix_map:
    __other__: Correct the creation date.
  record_fix_template: 'LIKP.ERDAT: ''{actual_value}'' is in the future. Correct the creation date.'
- id: DL012
  field: LIKP.AEDAT
  check_class: cross_field_check
  fail_when: (`LIKP.AEDAT` - @today).dt.days > 0
  require_populated: true
  severity: low
  dimension: timeliness
  message: Delivery was changed with a future date
  why_it_matters: AEDAT is stamped at the last change. A future date indicates a manipulated timestamp.
  rule_authority: sap_business_convention
  sap_impact: Change-audit and ageing reporting are wrong for this delivery.
  fix_map:
    __other__: Correct the change date.
  record_fix_template: 'LIKP.AEDAT: ''{actual_value}'' is in the future. Correct the change date.'
- id: DL013
  field: LIKP.WAERK
  check_class: null_check
  severity: high
  dimension: completeness
  message: Document currency is blank on a delivery
  why_it_matters: WAERK is the currency of the values on the delivery and is carried into billing.
  rule_authority: sap_hard_constraint
  sap_impact: Values on the delivery have no currency unit; billing inherits the gap.
  fix_map:
    __blank__: Assign the document currency in VL02N.
  record_fix_template: 'LIKP.WAERK: ''{actual_value}'' is blank. Assign the document currency in VL02N.'
- id: DL014
  field: LIKP.BZIRK
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Sales district is blank
  why_it_matters: BZIRK drives sales reporting by region and the sales-district-based pricing and statistics.
  rule_authority: sap_hard_constraint
  sap_impact: The delivery is missing from sales-district reporting.
  fix_map:
    __blank__: Assign the sales district in VL02N.
  record_fix_template: 'LIKP.BZIRK: ''{actual_value}'' is blank. Assign the sales district in VL02N.'
- id: DL015
  field: LIKP.ROUTE
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Route is blank
  why_it_matters: ROUTE determines transport scheduling, the route stages and the freight charge basis.
  rule_authority: sap_hard_constraint
  sap_impact: Transport planning and freight costing skip the delivery.
  fix_map:
    __blank__: Assign the route in VL02N.
  record_fix_template: 'LIKP.ROUTE: ''{actual_value}'' is blank. Assign the route in VL02N.'
- id: DL016
  field: LIKP.LPRIO
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Delivery priority is blank
  why_it_matters: LPRIO orders deliveries in the picking and shipping queue; a blank priority is treated
    as undefined.
  rule_authority: sap_hard_constraint
  sap_impact: The delivery is not ordered correctly in the shipping queue.
  fix_map:
    __blank__: Assign the delivery priority in VL02N.
  record_fix_template: 'LIKP.LPRIO: ''{actual_value}'' is blank. Assign the delivery priority in VL02N.'
- id: DL017
  field: LIKP.VSBED
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Shipping conditions are blank
  why_it_matters: VSBED selects the shipping point and the transport planning rules.
  rule_authority: sap_hard_constraint
  sap_impact: Shipping point determination loses a criterion for this delivery.
  fix_map:
    __blank__: Assign the shipping conditions in VL02N.
  record_fix_template: 'LIKP.VSBED: ''{actual_value}'' is blank. Assign the shipping conditions in VL02N.'
- id: DL019
  field: LIKP.BTGEW
  check_class: cross_field_check
  fail_when: '`LIKP.BTGEW` < 0'
  require_populated: true
  severity: high
  dimension: validity
  message: Total weight is negative
  why_it_matters: BTGEW is the gross weight of the delivery and feeds freight costing and transport documents.
  rule_authority: sap_hard_constraint
  sap_impact: Freight cost and transport documents are calculated with a negative weight.
  fix_map:
    __other__: Correct the total weight in VL02N.
  record_fix_template: 'LIKP.BTGEW: ''{actual_value}'' is negative. Correct the total weight in VL02N.'
- id: DL020
  field: LIKP.NTGEW
  check_class: cross_field_check
  fail_when: '`LIKP.NTGEW` < 0'
  require_populated: true
  severity: high
  dimension: validity
  message: Net weight is negative
  why_it_matters: NTGEW is the net weight of the goods and is used for customs and freight.
  rule_authority: sap_hard_constraint
  sap_impact: Customs and freight values are wrong for this delivery.
  fix_map:
    __other__: Correct the net weight in VL02N.
  record_fix_template: 'LIKP.NTGEW: ''{actual_value}'' is negative. Correct the net weight in VL02N.'
- id: DL021
  field: LIKP.VOLUM
  check_class: cross_field_check
  fail_when: '`LIKP.VOLUM` < 0'
  require_populated: true
  severity: medium
  dimension: validity
  message: Total volume is negative
  why_it_matters: VOLUM is the volume shipped and drives load planning and the freight rate.
  rule_authority: sap_hard_constraint
  sap_impact: Load planning and freight rates are wrong for this delivery.
  fix_map:
    __other__: Correct the volume in VL02N.
  record_fix_template: 'LIKP.VOLUM: ''{actual_value}'' is negative. Correct the volume in VL02N.'
- id: DL022
  field: LIKP.ERDAT
  check_class: cross_field_check
  fail_when: '`LIKP.ERDAT` > `LIKP.LFDAT`'
  require_populated: true
  severity: medium
  dimension: consistency
  message: Delivery date is before the creation date
  why_it_matters: A delivery cannot be due to leave before it was created; an inverted pair means the
    dates were loaded out of order.
  rule_authority: sap_business_convention
  sap_impact: On-time-delivery and lead-time reporting are wrong for this delivery.
  fix_map:
    __other__: Correct the delivery date in VL02N.
  record_fix_template: LIKP.ERDAT '{actual_value}' follows LIKP.LFDAT. Correct the delivery date in VL02N.
- id: DL023
  field: LIKP.WADAT
  check_class: cross_field_check
  fail_when: '`LIKP.WADAT` > `LIKP.LFDAT`'
  require_populated: true
  severity: medium
  dimension: consistency
  message: Goods issue date is after the delivery date
  why_it_matters: Goods must be issued on or before the delivery leaves; the reverse makes the shipment
    schedule impossible.
  rule_authority: sap_business_convention
  sap_impact: Transport scheduling reports a negative transit plan.
  fix_map:
    __other__: Correct the goods issue or delivery date.
  record_fix_template: LIKP.WADAT '{actual_value}' follows LIKP.LFDAT. Correct the goods issue or delivery
    date.
- id: DL024
  field: LIKP.VBTYP
  check_class: domain_value_check
  allowed_values:
  - '7'
  - J
  - T
  severity: medium
  dimension: validity
  message: Delivery category must be an outbound delivery, delivery or returns delivery
  why_it_matters: VBTYP identifies the document category. Only outbound delivery categories belong in
    a delivery load.
  rule_authority: sap_hard_constraint
  sap_impact: The document is classified wrongly and is picked up by the wrong processes.
  fix_map:
    __other__: Correct the document category.
  record_fix_template: 'LIKP.VBTYP: ''{actual_value}'' is not a permitted value. Correct the document
    category.'
- id: DL025
  field: LIKP.AUTLF
  check_class: domain_value_check
  allowed_values:
  - ''
  - X
  severity: low
  dimension: validity
  message: Complete-delivery indicator must be blank or X
  why_it_matters: AUTLF is a flag; SAP accepts only blank or X.
  rule_authority: sap_hard_constraint
  sap_impact: The complete-delivery rule is interpreted unpredictably.
  fix_map:
    __other__: Set the indicator to X or clear it.
  record_fix_template: 'LIKP.AUTLF: ''{actual_value}'' is not a permitted value. Set the indicator to
    X or clear it.'
- id: DL026
  field: LIKP.KZAZU
  check_class: domain_value_check
  allowed_values:
  - ''
  - X
  severity: low
  dimension: validity
  message: Order-combination indicator must be blank or X
  why_it_matters: KZAZU is a flag controlling whether the delivery may be combined with others.
  rule_authority: sap_hard_constraint
  sap_impact: Delivery combination behaves unpredictably for this document.
  fix_map:
    __other__: Set the indicator to X or clear it.
  record_fix_template: 'LIKP.KZAZU: ''{actual_value}'' is not a permitted value. Set the indicator to
    X or clear it.'
- id: DL027
  field: LIPS.VBELN
  check_class: uniqueness_check
  fields:
  - LIPS.VBELN
  - LIPS.POSNR
  severity: critical
  dimension: uniqueness
  message: Duplicate delivery item keys detected
  why_it_matters: VBELN+POSNR is the primary key of LIPS. Duplicates break goods issue and billing references.
  rule_authority: sap_hard_constraint
  sap_impact: The item load is rejected; quantities post twice.
  fix_map:
    __other__: Keep one row per delivery/item number.
  record_fix_template: 'LIPS.VBELN: duplicate key. Keep one row per delivery/item number.'
- id: DL028
  field: LIPS.MATNR
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Material is mandatory on a delivery item
  why_it_matters: Every stock item must carry a material so the goods movement and billing can determine
    it.
  rule_authority: sap_hard_constraint
  sap_impact: Goods issue and billing cannot determine the material.
  fix_map:
    __blank__: Assign the material or delete the item.
  record_fix_template: 'LIPS.MATNR: ''{actual_value}'' is blank. Assign the material or delete the item.'
- id: DL029
  field: LIPS.WERKS
  check_class: null_check
  severity: high
  dimension: completeness
  message: Plant is blank on a delivery item
  why_it_matters: WERKS determines the plant the stock is issued from and the storage-location search.
  rule_authority: sap_hard_constraint
  sap_impact: Goods issue cannot determine stock; the delivery cannot be picked.
  fix_map:
    __blank__: Assign the plant in VL02N.
  record_fix_template: 'LIPS.WERKS: ''{actual_value}'' is blank. Assign the plant in VL02N.'
- id: DL030
  field: LIPS.LGORT
  check_class: null_check
  severity: high
  dimension: completeness
  message: Storage location is blank on a delivery item
  why_it_matters: LGORT is where the stock is taken from. Without it the goods issue cannot post.
  rule_authority: sap_hard_constraint
  sap_impact: Goods issue fails with a storage-location error.
  fix_map:
    __blank__: Assign the storage location in VL02N.
  record_fix_template: 'LIPS.LGORT: ''{actual_value}'' is blank. Assign the storage location in VL02N.'
- id: DL031
  field: LIPS.PSTYV
  check_class: null_check
  severity: high
  dimension: completeness
  message: Item category is blank
  why_it_matters: PSTYV controls whether the item is relevant for delivery, billing and stock movement.
  rule_authority: sap_hard_constraint
  sap_impact: The item is not processed by delivery or billing.
  fix_map:
    __blank__: Assign the item category in VL02N.
  record_fix_template: 'LIPS.PSTYV: ''{actual_value}'' is blank. Assign the item category in VL02N.'
- id: DL032
  field: LIPS.MEINS
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Sales unit of measure is blank
  why_it_matters: MEINS is the unit the delivery quantity is expressed in; without it the quantity has
    no meaning.
  rule_authority: sap_hard_constraint
  sap_impact: Goods issue cannot convert the quantity to the base unit.
  fix_map:
    __blank__: Assign the sales unit of measure.
  record_fix_template: 'LIPS.MEINS: ''{actual_value}'' is blank. Assign the sales unit of measure.'
- id: DL033
  field: LIPS.VRKME
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Alternative sales unit is blank
  why_it_matters: VRKME records the unit the customer ordered in, needed to reconcile the order to the
    delivery.
  rule_authority: sap_hard_constraint
  sap_impact: Order-to-delivery quantity reconciliation is impossible for the item.
  fix_map:
    __blank__: Assign the sales unit in VL02N.
  record_fix_template: 'LIPS.VRKME: ''{actual_value}'' is blank. Assign the sales unit in VL02N.'
- id: DL034
  field: LIPS.LFIMG
  check_class: cross_field_check
  fail_when: '`LIPS.LFIMG` < 0'
  require_populated: true
  severity: high
  dimension: validity
  message: Delivery quantity is negative
  why_it_matters: LFIMG is the quantity to be delivered. An outbound delivery carries a positive quantity;
    a negative one reverses the stock movement.
  rule_authority: sap_hard_constraint
  sap_impact: Goods issue increases stock instead of reducing it.
  fix_map:
    __other__: Correct the quantity sign; use a returns delivery for returns.
  record_fix_template: 'LIPS.LFIMG: ''{actual_value}'' is negative. Correct the quantity sign; use a returns
    delivery for returns.'
- id: DL035
  field: LIPS.NTGEW
  check_class: cross_field_check
  fail_when: '`LIPS.NTGEW` < 0'
  require_populated: true
  severity: medium
  dimension: validity
  message: Item net weight is negative
  why_it_matters: NTGEW is the item weight and feeds freight and customs calculations.
  rule_authority: sap_hard_constraint
  sap_impact: Freight and customs values are wrong for the item.
  fix_map:
    __other__: Correct the item weight in VL02N.
  record_fix_template: 'LIPS.NTGEW: ''{actual_value}'' is negative. Correct the item weight in VL02N.'
- id: DL036
  field: LIPS.BRGEW
  check_class: cross_field_check
  fail_when: '`LIPS.BRGEW` < 0'
  require_populated: true
  severity: medium
  dimension: validity
  message: Item gross weight is negative
  why_it_matters: BRGEW is the gross item weight used for transport documents.
  rule_authority: sap_hard_constraint
  sap_impact: Transport documents show a negative weight.
  fix_map:
    __other__: Correct the gross weight in VL02N.
  record_fix_template: 'LIPS.BRGEW: ''{actual_value}'' is negative. Correct the gross weight in VL02N.'
- id: DL037
  field: LIPS.VOLUM
  check_class: cross_field_check
  fail_when: '`LIPS.VOLUM` < 0'
  require_populated: true
  severity: low
  dimension: validity
  message: Item volume is negative
  why_it_matters: VOLUM is the item volume used for load planning.
  rule_authority: sap_hard_constraint
  sap_impact: Load planning is wrong for the item.
  fix_map:
    __other__: Correct the volume in VL02N.
  record_fix_template: 'LIPS.VOLUM: ''{actual_value}'' is negative. Correct the volume in VL02N.'
- id: DL038
  field: LIPS.MATKL
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Material group is blank
  why_it_matters: MATKL drives material-group statistics and purchasing/spend analysis.
  rule_authority: sap_hard_constraint
  sap_impact: The item is missing from material-group reporting.
  fix_map:
    __blank__: Assign the material group in VL02N.
  record_fix_template: 'LIPS.MATKL: ''{actual_value}'' is blank. Assign the material group in VL02N.'
- id: DL039
  field: LIPS.BWART
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Movement type is blank
  why_it_matters: BWART determines the stock movement and the account determination for the goods issue.
  rule_authority: sap_hard_constraint
  sap_impact: Goods issue cannot post; stock and cost accounts are not updated.
  fix_map:
    __blank__: Assign the movement type in VL02N.
  record_fix_template: 'LIPS.BWART: ''{actual_value}'' is blank. Assign the movement type in VL02N.'
- id: DL040
  field: LIPS.GSBER
  check_class: null_check
  severity: low
  dimension: completeness
  message: Business area is blank
  why_it_matters: GSBER is required for business-area balance sheets in classic GL.
  rule_authority: sap_hard_constraint
  sap_impact: The goods issue cannot be split by business area.
  fix_map:
    __blank__: Assign the business area in VL02N.
  record_fix_template: 'LIPS.GSBER: ''{actual_value}'' is blank. Assign the business area in VL02N.'
- id: DL041
  field: LIPS.VKBUR
  check_class: null_check
  severity: low
  dimension: completeness
  message: Sales office is blank
  why_it_matters: VKBUR is used for sales-office reporting and salesperson determination.
  rule_authority: sap_hard_constraint
  sap_impact: The item is missing from sales-office reporting.
  fix_map:
    __blank__: Assign the sales office in VL02N.
  record_fix_template: 'LIPS.VKBUR: ''{actual_value}'' is blank. Assign the sales office in VL02N.'
- id: DL042
  field: LIPS.VKGRP
  check_class: null_check
  severity: low
  dimension: completeness
  message: Sales group is blank
  why_it_matters: VKGRP groups sales staff for reporting and commission.
  rule_authority: sap_hard_constraint
  sap_impact: The item is missing from sales-group reporting.
  fix_map:
    __blank__: Assign the sales group in VL02N.
  record_fix_template: 'LIPS.VKGRP: ''{actual_value}'' is blank. Assign the sales group in VL02N.'
- id: DL043
  field: LIPS.VTWEG
  check_class: null_check
  severity: low
  dimension: completeness
  message: Distribution channel is blank
  why_it_matters: VTWEG determines pricing and the sales statistics the item contributes to.
  rule_authority: sap_hard_constraint
  sap_impact: The item is missing from distribution-channel reporting.
  fix_map:
    __blank__: Assign the distribution channel in VL02N.
  record_fix_template: 'LIPS.VTWEG: ''{actual_value}'' is blank. Assign the distribution channel in VL02N.'
- id: DL044
  field: LIPS.ERDAT
  check_class: cross_field_check
  fail_when: (`LIPS.ERDAT` - @today).dt.days > 0
  require_populated: true
  severity: low
  dimension: timeliness
  message: Item was created with a future date
  why_it_matters: ERDAT is stamped by SAP at creation; a future date means a manipulated timestamp.
  rule_authority: sap_business_convention
  sap_impact: Item ageing and lead-time reporting are wrong.
  fix_map:
    __other__: Correct the creation date.
  record_fix_template: 'LIPS.ERDAT: ''{actual_value}'' is in the future. Correct the creation date.'
- id: DL045
  field: LIPS.LFIMG
  check_class: cross_field_check
  fail_when: '`LIPS.LFIMG` > `LIPS.LGMNG`'
  require_populated: true
  severity: low
  dimension: consistency
  message: Delivery quantity exceeds the warehouse-managed quantity
  why_it_matters: Where warehouse management is active, LGMNG is the quantity the WM system handles and
    must not be below the delivered quantity.
  rule_authority: sap_business_convention
  sap_impact: WM and inventory management disagree on the quantity for the item.
  fix_map:
    __other__: Align the WM quantity in VL02N.
  record_fix_template: LIPS.LFIMG '{actual_value}' follows LIPS.LGMNG. Align the WM quantity in VL02N.
- id: DL046
  field: VBRK.VBELN
  check_class: uniqueness_check
  fields:
  - VBRK.VBELN
  severity: critical
  dimension: uniqueness
  message: Duplicate billing document numbers detected
  why_it_matters: VBELN is the primary key of VBRK. Duplicates break the link to the FI document and post
    revenue twice.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue is double counted; FI reconciliation fails.
  fix_map:
    __other__: Keep one billing document per number.
  record_fix_template: 'VBRK.VBELN: duplicate key. Keep one billing document per number.'
- id: DL047
  field: VBRK.VBELN
  check_class: regex_check
  pattern: ^[0-9]{10}$
  severity: high
  dimension: validity
  message: Billing document number must be 10 digits
  why_it_matters: VBELN is CHAR 10 assigned by an internal number range.
  rule_authority: sap_hard_constraint
  sap_impact: The document cannot be addressed by standard transactions.
  fix_map:
    __other__: Renumber from the SAP number range.
  record_fix_template: 'VBRK.VBELN: ''{actual_value}'' has an invalid format. Renumber from the SAP number
    range.'
- id: DL048
  field: VBRK.FKART
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Billing type is mandatory
  why_it_matters: FKART determines invoice/credit memo/debit memo, account determination and posting keys.
  rule_authority: sap_hard_constraint
  sap_impact: Invoice cannot be released to accounting.
  fix_map:
    __blank__: Assign the billing type in VF02.
  record_fix_template: 'VBRK.FKART: ''{actual_value}'' is blank. Assign the billing type in VF02.'
- id: DL049
  field: VBRK.WAERK
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Document currency is blank
  why_it_matters: WAERK is the currency of every amount in the billing document.
  rule_authority: sap_hard_constraint
  sap_impact: The FI document cannot be posted; amounts have no unit.
  fix_map:
    __blank__: Assign the document currency in VF02.
  record_fix_template: 'VBRK.WAERK: ''{actual_value}'' is blank. Assign the document currency in VF02.'
- id: DL050
  field: VBRK.FKDAT
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Billing date is blank
  why_it_matters: FKDAT determines the posting period and the FI document date.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue is not attributable to a period.
  fix_map:
    __blank__: Enter the billing date in VF02.
  record_fix_template: 'VBRK.FKDAT: ''{actual_value}'' is blank. Enter the billing date in VF02.'
- id: DL051
  field: VBRK.FKDAT
  check_class: cross_field_check
  fail_when: (`VBRK.FKDAT` - @today).dt.days > 0
  require_populated: true
  severity: medium
  dimension: timeliness
  message: Billing date is in the future
  why_it_matters: A billing date after today means revenue is recognised in a period that has not begun.
  rule_authority: sap_business_convention
  sap_impact: Revenue is recognised early and period reporting is distorted.
  fix_map:
    __other__: Correct the billing date in VF02.
  record_fix_template: 'VBRK.FKDAT: ''{actual_value}'' is in the future. Correct the billing date in VF02.'
- id: DL052
  field: VBRK.VKORG
  check_class: null_check
  severity: high
  dimension: completeness
  message: Sales organisation is blank on the invoice
  why_it_matters: VKORG drives account determination and the revenue accounts posted to.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue posts to the wrong accounts or not at all.
  fix_map:
    __blank__: Assign the sales organisation in VF02.
  record_fix_template: 'VBRK.VKORG: ''{actual_value}'' is blank. Assign the sales organisation in VF02.'
- id: DL053
  field: VBRK.VTWEG
  check_class: null_check
  severity: high
  dimension: completeness
  message: Distribution channel is blank on the invoice
  why_it_matters: VTWEG is part of the account-determination key for revenue.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue account determination fails for the invoice.
  fix_map:
    __blank__: Assign the distribution channel in VF02.
  record_fix_template: 'VBRK.VTWEG: ''{actual_value}'' is blank. Assign the distribution channel in VF02.'
- id: DL054
