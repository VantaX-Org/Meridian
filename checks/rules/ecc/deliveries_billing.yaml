  field: VBRP.VSTEL
  check_class: null_check
  severity: low
  dimension: completeness
  message: Shipping point is blank on a billing item
  why_it_matters: VSTEL supports logistics reporting and revenue by shipping location.
  rule_authority: sap_hard_constraint
  sap_impact: Revenue cannot be reported by shipping point.
  fix_map:
    __blank__: Assign the shipping point.
  record_fix_template: 'VBRP.VSTEL: ''{actual_value}'' is blank. Assign the shipping point.'
- id: DL080
  field: VBRP.KURSK
  check_class: cross_field_check
  fail_when: '`VBRP.KURSK` < 0'
  require_populated: true
  severity: high
  dimension: validity
  message: Exchange rate is negative or zero on a billing item
  why_it_matters: KURSK translates the item values into local currency.
  rule_authority: sap_hard_constraint
  sap_impact: Local-currency item values are wrong.
  fix_map:
    __other__: Correct the exchange rate.
  record_fix_template: 'VBRP.KURSK: ''{actual_value}'' is negative. Correct the exchange rate.'
