  field: VBRP.GSBER
  check_class: null_check
  severity: low
  dimension: completeness
  message: Business area is blank on a billing item
  why_it_matters: GSBER is needed for business-area P&L reporting.
  rule_authority: sap_hard_constraint
  sap_impact: The item is missing from business-area reporting.
  fix_map:
    __blank__: Assign the business area.
  record_fix_template: 'VBRP.GSBER: ''{actual_value}'' is blank. Assign the business area.'
