    __other__: 'Value {invalid_value} is not valid for Invoice receipt indicator. Allowed values: ['''', ''X''].'
  record_fix_template: 'Record has invalid EKPO.REPOS value ''{actual_value}''. In ECC: Set via ME22N. In S/4HANA: Use Fiori
    app F2229 (Create Purchase Order).'
- id: PUR041
  field: EKPO.TXZ01
  check_class: null_check
  severity: high
  dimension: completeness
  message: Item description is missing
  why_it_matters: Item description (EKPO.TXZ01) is not maintained. This field supports downstream processes and reporting
    accuracy. Missing data may result in incomplete records or processing gaps.
  rule_authority: best_practice
  sap_impact: Missing Item description may cause incomplete data in related transactions and reports.
  fix_map:
    __blank__: 'In ECC: Set via ME22N. In S/4HANA: Use Fiori app F2229 (Create Purchase Order).'
  record_fix_template: 'Record is missing EKPO.TXZ01. In ECC: Set via ME22N. In S/4HANA: Use Fiori app F2229 (Create Purchase
    Order).'
- id: PUR042
  field: EKKO.EBELN
  check_class: uniqueness_check
  fields: [EKKO.EBELN]
  severity: critical
  dimension: uniqueness
  message: Duplicate purchase order numbers detected — each PO must be unique
  why_it_matters: Duplicate PO numbers indicate a data extract or migration error. Each purchase order must have
    a unique EBELN. Duplicates cause goods receipt posting ambiguity and invoice verification failures.
  rule_authority: sap_hard_constraint
  sap_impact: MIGO cannot determine which PO to post against. Invoice verification (MIRO) matches to the wrong PO.
    Goods receipt history is ambiguous.
  fix_map: {__blank__: 'Investigate the source of duplicate PO numbers. This is typically a data extract issue (duplicate
      rows from joined tables). If genuine duplicates exist in SAP, escalate to Basis — this indicates a number
      range collision.'}
  record_fix_template: "Purchase order {EKKO.EBELN} appears more than once. Investigate the load or interface that created it; keep one document and reverse or delete the other via ME22N."

- id: PUR043
  field: EKKO.BEDAT
  check_class: freshness_check
  max_age_hours: 8760
  severity: medium
  dimension: timeliness
  message: Purchase order older than 1 year — open POs older than 12 months should be reviewed and closed if no longer needed
  rule_authority: best_practice
  why_it_matters: Purchase orders open beyond 12 months usually represent abandoned commitments, over-delivery risk, or uncleared
    GR/IR that distorts open-commitment reporting.
  sap_impact: Open commitment and accrual figures are overstated; GR/IR clearing is blocked; MRP plans against orders that
    will never be received.
  fix_map:
    __blank__: 'Review the PO in ME23N / ME2M: confirm whether goods/invoice are still expected; close the line with a delivery-completed
      flag (ME22N) or set a deletion indicator if abandoned.'
  record_fix_template: PO {field} dated {age_days} days ago. Confirm delivery still expected in ME23N; set delivery-completed
    or deletion indicator if abandoned.
  applies_when:
    EKPO.PSTYP:
      not_in:
      - '1'
      - '7'
      - '9'
    EKPO.ELIKZ:
      not_in:
      - X
    EKKO.BSTYP:
    - F

- id: PUR044
  field: EKPO.NETPR
  check_class: cross_field_check
  severity: high
  dimension: accuracy
  message: Purchase order line has negative net price — indicates pricing error or incorrect credit memo configuration
  why_it_matters: Negative PO prices cause goods receipt valuation errors, invoice verification mismatches, and
    incorrect cost centre charges.
  rule_authority: best_practice
  sap_impact: GR posting creates negative stock value. Invoice verification shows price variance. Cost centre is
    credited instead of debited.
  fix_map: {__blank__: 'Review the PO line price via ME22N. If a credit memo is intended, use the correct document
      type (returns PO). If data error, correct the net price.'}
  fail_when: '`EKPO.NETPR` < 0'
  require_populated: true
  record_fix_template: "Purchase order {EKPO.EBELN} item {EKPO.EBELP}: net price is {actual_value}. Correct the price in ME22N, or use a return item or credit memo for credits."

- id: PUR045
  field: EKKO.BSART
  check_class: referential_check
  severity: high
  dimension: consistency
  message: Purchasing document type BSART must reference a valid entry in T161
  why_it_matters: BSART (purchasing document type) drives number range, field selection, item-category defaults, and release-strategy
    determination for every PO, contract, and scheduling agreement. An invalid BSART means the document cannot be displayed
    (ME23N) or released, and the release strategy cannot resolve — procurement workflow halts.
  rule_authority: best_practice
  sap_impact: ME23N cannot display the document; release strategy cannot resolve; procurement workflow blocked.
  fix_map:
    __blank__: BSART is mandatory at ME21N. Blank indicates document-header corruption.
    __other__: Document type '{invalid_value}' not in T161. Reassign via ME22N (if document editable) or configure in SPRO
      > Materials Management > Purchasing > Purchase Order > Define Document Types.
  record_fix_template: 'PO {EKKO.EBELN}: document type ''{actual_value}'' is not in T161.'
- id: XP2P001
  field: EKKO.ZTERM
  check_class: cross_field_check
  fail_when: '`EKKO.ZTERM` != `LFM1.ZTERM`'
  require_populated: true
  severity: low
  dimension: consistency
  message: PO payment terms differ from the vendor's purchasing-organisation payment terms (LFM1.ZTERM)
  why_it_matters: SAP defaults EKKO.ZTERM from the vendor's purchasing data (LFM1) for the PO's purchasing organisation. When
    they diverge the AP clerk sees different terms at invoice posting (MIRO) than on the PO and F110 may pay in the wrong
    window — usually a PO copied from an old document after the vendor terms changed.
  rule_authority: best_practice
  sap_impact: Payment timing mis-scheduled; cash discount may be missed; ageing inconsistent with vendor statements.
  fix_map:
    __other__: Align the PO terms via ME22N, or — if the vendor terms are outdated — update LFM1 via XK02/MK02 (ECC) or the
      BP purchasing role (S/4HANA).
  record_fix_template: 'PO {EKKO.EBELN}: terms ''{EKKO.ZTERM}'' differ from vendor {EKKO.LIFNR} purchasing terms ''{LFM1.ZTERM}''.'
- id: XP2P002
  field: EKKO.WAERS
  check_class: cross_field_check
  fail_when: '`EKKO.WAERS` != `LFM1.WAERS`'
  require_populated: true
  severity: low
  dimension: consistency
  message: PO currency differs from the vendor's order currency (LFM1.WAERS)
  why_it_matters: LFM1.WAERS is the vendor's order currency for the purchasing organisation. A PO in another currency
    is legitimate for multi-currency suppliers but is often a data-entry error that creates exchange-rate differences
    at settlement.
  rule_authority: best_practice
  sap_impact: Exchange-rate gain/loss on settlement; reconciliation effort at month end.
  fix_map:
    __other__: Correct the PO currency via ME22N, or update the vendor order currency (LFM1) if the supplier genuinely
      trades in this currency.
  record_fix_template: 'PO {EKKO.EBELN}: currency ''{EKKO.WAERS}'' differs from vendor {EKKO.LIFNR} order currency
    ''{LFM1.WAERS}''.'
- id: XP2P005
  field: EKPO.EBELP
  check_class: cross_field_check
  grain: EKPO
  fail_when: (`LFA1.LOEVM` == 'X') | (`LFA1.SPERM` == 'X')
  applies_when:
    EKPO.ELIKZ: {not_in: [X]}
  severity: high
  dimension: consistency
  message: Open PO item for a vendor flagged for deletion or blocked for purchasing
  why_it_matters: Deletion flags and purchasing blocks stop new documents, not open ones. Goods receipts and invoices
    keep arriving against the open item, so a vendor the business has retired still receives orders and payments.
  rule_authority: best_practice
  sap_impact: GR/IR and payments continue for a retired or blocked supplier; the vendor cannot be archived while
    open items exist.
  fix_map:
    __other__: Close the item (set 'delivery completed' in ME22N) or reassign it to the successor vendor; if the
      vendor is still active, remove the deletion flag/purchasing block (XK05/XK06, BP in S/4HANA).
  record_fix_template: 'PO {EKPO.EBELN} item {EKPO.EBELP}: vendor {EKKO.LIFNR} is flagged for deletion or purchasing-blocked.'
- id: XP2P006
  field: EKPO.MATNR
  check_class: cross_field_check
  grain: EKPO
  fail_when: (`MARA.LVORM` == 'X') | (`MARC.LVORM` == 'X')
  applies_when:
    EKPO.ELIKZ: {not_in: [X]}
    EKPO.MATNR: {populated: true}
  severity: high
  dimension: consistency
  message: Open PO item for a material flagged for deletion (client or plant level)
  why_it_matters: A material flagged for deletion is on its way to archiving, yet this open item will still post
    goods receipts, stock and valuation against it.
  rule_authority: best_practice
  sap_impact: Stock and value post to a material queued for archiving; the material cannot be archived while the
    item is open.
  fix_map:
    __other__: Close or delete the PO item (ME22N), or remove the deletion flag (MM06) if the material is still needed.
  record_fix_template: 'PO {EKPO.EBELN} item {EKPO.EBELP}: material {EKPO.MATNR} is flagged for deletion.'
# ── Rule-breadth extension (PUR046+): agreements, item quantities/prices/units, indicators, open items on blocked masters, requisitions, info records, source lists, configuration ────
- id: PUR046
  field: EKKO.KDATE
  check_class: null_check
  applies_when: &id001
    EKKO.BSTYP:
    - K
    - L
  severity: high
  dimension: completeness
  message: Contract or scheduling agreement has no validity end date
  why_it_matters: Contracts and scheduling agreements are valid for a period; ME31K / ME31L require its end date. Source
    determination and release-order creation only use agreements whose period covers the date.
  rule_authority: sap_hard_constraint
  sap_impact: The agreement is never found as a valid source of supply, or never expires, so release orders and delivery
    schedules run against outdated terms.
  fix_map:
    __blank__: 'Enter the validity end date on the header via ME32K / ME32L (S/4HANA: Fiori Manage Purchase Contracts /
      Scheduling Agreements).'
  record_fix_template: 'Agreement {EKKO.EBELN}: validity end date missing.'
- id: PUR047
  field: EKKO.KDATB
  check_class: null_check
  applies_when: *id001
  severity: medium
  dimension: completeness
  message: Contract or scheduling agreement has no validity start date
  why_it_matters: The validity start is the other half of an outline agreement's period and is required by ME31K / ME31L.
    Without it source determination cannot tell from when the agreement may be used.
  rule_authority: sap_hard_constraint
  sap_impact: Source determination and release documentation cannot evaluate the agreement period.
  fix_map:
    __blank__: 'Enter the validity start date on the header via ME32K / ME32L (S/4HANA: Fiori Manage Purchase Contracts
      / Scheduling Agreements).'
  record_fix_template: 'Agreement {EKKO.EBELN}: validity start date missing.'
- id: PUR048
  field: EKKO.KDATE
  check_class: cross_field_check
  fail_when: '`EKKO.KDATB` > `EKKO.KDATE`'
  applies_when: *id001
  severity: high
  dimension: consistency
  message: Outline agreement validity ends before it starts
  why_it_matters: 'An agreement''s validity period runs from KDATB to KDATE. An end before the start is an empty period:
    the agreement is never valid, and SAP''s screens reject it.'
  rule_authority: sap_hard_constraint
  sap_impact: The agreement is never proposed as a source of supply; release orders against it are refused.
  fix_map:
    __other__: 'Correct the validity period on the header via ME32K / ME32L (S/4HANA: Fiori Manage Purchase Contracts /
      Scheduling Agreements).'
  record_fix_template: 'Agreement {EKKO.EBELN}: valid from {EKKO.KDATB} to {actual_value}.'
- id: PUR049
  field: EKKO.SPRAS
  check_class: null_check
  applies_when:
    EKKO.LIFNR:
      populated: true
  severity: low
  dimension: completeness
  message: Purchasing document has no language for its output to the vendor
  why_it_matters: The document language selects the texts and form language of the PO / agreement output sent to the vendor.
    It is copied from the vendor master and required on every vendor document.
  rule_authority: sap_hard_constraint
  sap_impact: Message output (print, e-mail, EDI) fails or is issued without item and header texts.
  fix_map:
    __blank__: Enter the language on the header (Communication tab) via ME22N (ECC and S/4HANA; Fiori F0842A Manage Purchase
      Orders); maintain the vendor's language too.
  record_fix_template: 'Purchasing document {EKKO.EBELN}: no output language.'
- id: PUR050
  field: EKKO.BSTYP
  check_class: domain_value_check
  severity: high
  dimension: validity
  message: Purchasing document category is not a value of its SAP domain
  why_it_matters: The document category (A RFQ, F purchase order, K contract, L scheduling agreement) is fixed by SAP and
    set by the transaction that creates the document. Any other value cannot be processed.
  rule_authority: sap_hard_constraint
  sap_impact: The document cannot be displayed or processed by any purchasing transaction.
  fix_map:
    __other__: Investigate how the document was created; documents of an unknown category must be corrected by SAP support
      or archived.
  record_fix_template: 'Purchasing document {EKKO.EBELN}: category ''{actual_value}''.'
- id: PUR051
  field: EKPO.MENGE
  check_class: cross_field_check
  require_populated: true
  fail_when: '`EKPO.MENGE` <= 0'
  applies_when:
    EKKO.BSTYP:
    - F
    EKPO.PSTYP:
      not_in:
      - '1'
      - '6'
  severity: critical
  dimension: completeness
  message: Purchase order item has no order quantity
  why_it_matters: 'A purchase order item orders a quantity: goods receipt, invoice verification and the commitment all work
    from it. ME21N rejects a zero quantity; limit and text items, which carry no quantity, are not judged.'
  rule_authority: sap_hard_constraint
  sap_impact: Nothing can be received or invoiced against the item; the commitment and the vendor's delivery schedule are
    empty.
  fix_map:
    __other__: Enter the order quantity via ME22N (ECC and S/4HANA; Fiori F0842A Manage Purchase Orders), or delete the
      item if it is not needed.
  record_fix_template: 'PO {EKPO.EBELN} item {EKPO.EBELP}: order quantity {actual_value}.'
- id: PUR052
  field: EKPO.NETPR
  check_class: cross_field_check
  fail_when: '`EKPO.NETPR` == 0'
  applies_when:
    EKKO.BSTYP:
    - F
    EKPO.REPOS:
    - X
    EKPO.PSTYP:
      not_in:
      - '1'
      - '2'
      - '6'
      - '9'
  severity: high
  dimension: accuracy
  message: Invoiced purchase order item has a net price of zero
  why_it_matters: 'An item that expects an invoice (IR indicator) must have a price: SAP rejects a zero net price unless
    the item is free of charge, which removes the invoice indicator. Limit, consignment and text items are priced elsewhere
    and are not judged.'
  rule_authority: sap_hard_constraint
  sap_impact: The goods receipt is valued at zero; the invoice cannot be matched and is blocked for price variance; commitments
    and spend are understated.
  fix_map:
    __other__: Enter the agreed price via ME22N (ECC and S/4HANA; Fiori F0842A Manage Purchase Orders) (or mark the item
      free of charge if it is), and maintain the info record so the price is proposed next time.
  record_fix_template: 'PO {EKPO.EBELN} item {EKPO.EBELP}: net price {actual_value} although an invoice is expected.'
- id: PUR053
  field: EKPO.PEINH
  check_class: cross_field_check
  require_populated: true
  fail_when: '`EKPO.PEINH` <= 0'
  applies_when:
    EKPO.NETPR:
      gt: 0
  severity: high
  dimension: consistency
  message: Price unit of the purchasing document item is zero
  why_it_matters: The item value is quantity x net price / price unit. A zero price unit divides by zero; ME21N never accepts
    it. Items without a price (stock transport, free of charge) carry no price unit and are judged by the zero-price rule
    instead.
  rule_authority: sap_hard_constraint
  sap_impact: Item value, goods receipt valuation and invoice matching cannot be computed.
  fix_map:
    __other__: Set the price unit (normally 1) via ME22N (ECC and S/4HANA; Fiori F0842A Manage Purchase Orders).
  record_fix_template: 'PO {EKPO.EBELN} item {EKPO.EBELP}: price unit {actual_value}.'
- id: PUR054
  field: EKPO.BPUMZ
  check_class: cross_field_check
  fail_when: ~(`EKPO.BPUMZ` > 0) | ~(`EKPO.BPUMN` > 0)
  applies_when: &id002
    EKPO.MATNR:
      populated: true
    EKPO.PSTYP:
      not_in:
      - '1'
      - '6'
  severity: high
  dimension: consistency
  message: Conversion between order price unit and order unit is zero
  why_it_matters: When the price is quoted in a different unit than the quantity is ordered in, SAP converts with BPUMZ
    / BPUMN (1 / 1 when both units are the same). A zero factor divides by zero.
  rule_authority: sap_hard_constraint
  sap_impact: Item value and invoice amounts cannot be converted; invoice verification fails for the item.
  fix_map:
    __other__: Re-enter the order price unit on the item (Conditions / Quantities) via ME22N (ECC and S/4HANA; Fiori F0842A
      Manage Purchase Orders) so SAP re-derives the conversion from the info record or material master.
  record_fix_template: 'PO {EKPO.EBELN} item {EKPO.EBELP}: price-unit conversion {EKPO.BPUMZ}/{EKPO.BPUMN}.'
- id: PUR055
  field: EKPO.UMREZ
  check_class: cross_field_check
  fail_when: ~(`EKPO.UMREZ` > 0) | ~(`EKPO.UMREN` > 0)
  applies_when: *id002
  severity: high
  dimension: consistency
  message: Conversion between order unit and base unit is zero
  why_it_matters: Goods receipts post stock in the material's base unit, converted from the order unit with UMREZ / UMREN
    (copied from the material's units of measure). A zero factor divides by zero.
  rule_authority: sap_hard_constraint
  sap_impact: The goods receipt quantity in the base unit cannot be computed; stock and valuation postings fail.
  fix_map:
    __other__: Maintain the conversion for the order unit in the material master (MM02 > Units of measure) and re-enter
      the order unit via ME22N (ECC and S/4HANA; Fiori F0842A Manage Purchase Orders).
  record_fix_template: 'PO {EKPO.EBELN} item {EKPO.EBELP}: order-unit conversion {EKPO.UMREZ}/{EKPO.UMREN}.'
- id: PUR056
  field: EKPO.UMREZ
  check_class: cross_field_check
  require_populated: true
  fail_when: (`EKPO.MEINS` == `EKPO.LMEIN`) & (`EKPO.UMREZ` != `EKPO.UMREN`)
  severity: high
  dimension: consistency
  message: Order unit equals the base unit but is not converted 1:1
  why_it_matters: When the item is ordered in the material's base unit the conversion to the base unit must be 1 = 1. Any
    other factor multiplies every received quantity.
  rule_authority: sap_hard_constraint
  sap_impact: Goods receipts post the wrong stock quantity; GR/IR and valuation are off by the factor.
  fix_map:
    __other__: Re-enter the order unit via ME22N (ECC and S/4HANA; Fiori F0842A Manage Purchase Orders); check the material's
      base-unit conversion (MARM) is 1/1.
  record_fix_template: 'PO {EKPO.EBELN} item {EKPO.EBELP}: unit {EKPO.MEINS} converts {EKPO.UMREZ}/{EKPO.UMREN} to itself.'
- id: PUR057
  field: EKPO.WEBRE
  check_class: cross_field_check
  fail_when: (`EKPO.WEBRE` == 'X') & (`EKPO.WEPOS`.isna() | (`EKPO.WEPOS` != 'X'))
  severity: high
  dimension: consistency
  message: GR-based invoice verification is set on an item that expects no goods receipt
  why_it_matters: 'GR-based invoice verification matches each invoice to a goods receipt. SAP only allows the indicator
    together with the goods-receipt indicator: without a receipt there is nothing to match.'
  rule_authority: sap_hard_constraint
  sap_impact: Invoices for the item can never be posted (no goods receipt to reference).
  fix_map:
    __other__: Set the goods-receipt indicator, or remove GR-based IV, on the Delivery / Invoice tab via ME22N (ECC and
      S/4HANA; Fiori F0842A Manage Purchase Orders).
  record_fix_template: 'PO {EKPO.EBELN} item {EKPO.EBELP}: GR-based IV without goods receipt.'
- id: PUR058
  field: EKPO.WEUNB
  check_class: cross_field_check
  fail_when: (`EKPO.WEUNB` == 'X') & (`EKPO.WEPOS`.isna() | (`EKPO.WEPOS` != 'X'))
  severity: medium
  dimension: consistency
  message: Non-valuated goods receipt is set on an item that expects no goods receipt
  why_it_matters: The non-valuated GR indicator says how the goods receipt is posted; it is only valid together with the
    goods-receipt indicator.
  rule_authority: sap_hard_constraint
  sap_impact: The indicators contradict each other; receipt and invoice processing follow neither intention.
  fix_map:
    __other__: Correct the goods-receipt indicators on the Delivery tab via ME22N (ECC and S/4HANA; Fiori F0842A Manage
      Purchase Orders).
  record_fix_template: 'PO {EKPO.EBELN} item {EKPO.EBELP}: non-valuated GR without goods receipt.'
- id: PUR059
  field: EKKO.RESWK
  check_class: cross_field_check
  grain: EKPO
  fail_when: '`EKKO.RESWK`.isna()'
  applies_when:
    EKPO.PSTYP:
    - '7'
  severity: critical
  dimension: completeness
  message: Stock transport item has no supplying plant
  why_it_matters: A stock transport item (item category U) moves stock from a supplying plant to the receiving plant. Delivery
    creation, goods issue and shipping point determination all start from the supplying plant on the header.
  rule_authority: sap_hard_constraint
  sap_impact: No outbound delivery can be created; the stock transfer cannot be shipped.
  fix_map:
    __other__: Enter the supplying plant on the header via ME22N (ECC and S/4HANA; Fiori F0842A Manage Purchase Orders)
      (or recreate the stock transport order).
  record_fix_template: 'PO {EKPO.EBELN} item {EKPO.EBELP}: stock transport item without supplying plant.'
- id: PUR060
  field: EKPO.KTMNG
  check_class: cross_field_check
  fail_when: ~(`EKPO.KTMNG` > 0)
  applies_when:
    EKKO.BSTYP:
    - L
    EKPO.PSTYP:
      not_in:
      - '6'
  severity: high
  dimension: completeness
  message: Scheduling agreement item has no target quantity
  why_it_matters: A scheduling agreement item is called off by delivery schedule lines up to its target quantity; ME31L
    requires the target quantity.
  rule_authority: sap_hard_constraint
  sap_impact: Delivery schedules cannot be checked against the agreed quantity; release documentation and statistics for
    the agreement are empty.
  fix_map:
    __other__: 'Enter the target quantity via ME32K / ME32L (S/4HANA: Fiori Manage Purchase Contracts / Scheduling Agreements).'
  record_fix_template: 'Scheduling agreement {EKPO.EBELN} item {EKPO.EBELP}: target quantity {actual_value}.'
- id: PUR061
  field: EKPO.KTMNG
  check_class: cross_field_check
  fail_when: ~(`EKPO.KTMNG` > 0) & ~(`EKKO.KTWRT` > 0)
  applies_when:
    EKKO.BSTYP:
    - K
    EKPO.PSTYP:
      not_in:
      - '6'
  severity: medium
  dimension: completeness
  message: Contract item has neither a target quantity nor a header target value
  why_it_matters: A contract is either a quantity contract (target quantity per item) or a value contract (target value
    on the header). An item with neither has nothing to release against.
  rule_authority: sap_hard_constraint
  sap_impact: Release orders are not checked against any agreed volume; contract consumption cannot be monitored.
  fix_map:
    __other__: 'Enter the item target quantity or the header target value via ME32K / ME32L (S/4HANA: Fiori Manage Purchase
      Contracts / Scheduling Agreements).'
  record_fix_template: 'Contract {EKPO.EBELN} item {EKPO.EBELP}: no target quantity and no target value.'
- id: PUR062
  field: EKPO.MATNR
  check_class: null_check
  applies_when:
    EKPO.PSTYP:
    - '2'
    - '3'
  severity: high
  dimension: completeness
  message: Consignment or subcontracting item has no material
  why_it_matters: Consignment (item category K) and subcontracting (L) both manage stock of a specific material — vendor
    consignment stock or components provided to the subcontractor — so SAP requires a material number.
  rule_authority: sap_hard_constraint
  sap_impact: Goods receipt into consignment stock or provision of components to the subcontractor is impossible.
  fix_map:
    __blank__: Recreate the item with the material via ME22N (ECC and S/4HANA; Fiori F0842A Manage Purchase Orders).
  record_fix_template: 'PO {EKPO.EBELN} item {EKPO.EBELP}: consignment/subcontracting item without material.'
- id: PUR063
  field: EKPO.EBELP
  check_class: cross_field_check
  grain: EKPO
  fail_when: (`LFM1.SPERM` == 'X') | (`LFM1.LOEVM` == 'X')
  applies_when:
    EKPO.ELIKZ:
      not_in:
      - X
  severity: high
  dimension: consistency
  message: Open PO item for a vendor blocked or flagged for deletion in the purchasing organisation
  why_it_matters: A purchasing block or deletion flag on the vendor's purchasing-organisation data stops new documents in
    that purchasing organisation, not the open ones; deliveries and invoices keep arriving against this item.
  rule_authority: sap_hard_constraint
  sap_impact: Receipts and payments continue for a supplier the purchasing organisation has stopped; the vendor's purchasing
    data cannot be archived while the item is open.
  fix_map:
    __other__: Close the item (delivery completed in ME22N) or move it to the successor vendor; if the vendor is still active
      in this purchasing organisation, remove the block (XK05 / BP in S/4HANA).
  record_fix_template: 'PO {EKPO.EBELN} item {EKPO.EBELP}: vendor {EKKO.LIFNR} is blocked or deleted in purchasing organisation
    {EKKO.EKORG}.'
- id: PUR064
  field: EKPO.EBELP
  check_class: cross_field_check
  grain: EKPO
  fail_when: '`LFA1.SPERR` == ''X'''
  applies_when:
    EKPO.REPOS:
    - X
    EKPO.EREKZ:
      not_in:
      - X
  severity: medium
  dimension: consistency
  message: PO item still awaiting its invoice for a vendor with a central posting block
  why_it_matters: A central posting block on the vendor stops every posting to the vendor account, including the invoice
    this item still expects (IR indicator set, final invoice not yet posted).
  rule_authority: sap_hard_constraint
  sap_impact: The vendor's invoice cannot be posted in MIRO; the goods receipt stays on GR/IR indefinitely.
  fix_map:
    __other__: Agree with accounts payable whether the block is still needed; then either remove it (XK05 / BP) or close
      the item (final invoice indicator) and clear GR/IR (MR11).
  record_fix_template: 'PO {EKPO.EBELN} item {EKPO.EBELP}: vendor {EKKO.LIFNR} has a central posting block.'
- id: PUR065
  field: EBAN.MENGE
  check_class: cross_field_check
  fail_when: ~(`EBAN.MENGE` > 0)
  applies_when:
    EBAN.PSTYP:
      not_in:
      - '1'
      - '6'
  severity: high
  dimension: completeness
  message: Purchase requisition item has no quantity
  why_it_matters: A requisition requests a quantity; ME51N rejects zero. Text and limit items, which have no quantity, are
    not judged.
  rule_authority: sap_hard_constraint
  sap_impact: The requisition cannot be converted into a purchase order; MRP coverage is overstated.
  fix_map:
    __other__: 'Enter the quantity via ME52N (S/4HANA: Fiori Manage Purchase Requisitions) or delete the item.'
  record_fix_template: 'Requisition {EBAN.BANFN} item {EBAN.BNFPO}: quantity {actual_value}.'
- id: PUR066
  field: EBAN.MEINS
  check_class: null_check
  applies_when:
    EBAN.PSTYP:
      not_in:
      - '1'
      - '6'
  severity: medium
  dimension: completeness
  message: Purchase requisition item has no unit of measure
  why_it_matters: The requested quantity has no meaning without its unit; ME51N requires it.
  rule_authority: sap_hard_constraint
  sap_impact: The requisition cannot be converted into a purchase order.
  fix_map:
    __blank__: 'Enter the unit via ME52N (S/4HANA: Fiori Manage Purchase Requisitions).'
  record_fix_template: 'Requisition {EBAN.BANFN} item {EBAN.BNFPO}: unit missing.'
- id: PUR067
  field: EBAN.WERKS
  check_class: null_check
  severity: high
  dimension: completeness
  message: Purchase requisition item has no plant
  why_it_matters: The plant is where the goods are needed; ME51N requires it for source determination, account determination
    and the delivery address.
  rule_authority: sap_hard_constraint
  sap_impact: No source of supply can be assigned; the requisition cannot be converted into a purchase order.
  fix_map:
    __blank__: 'Enter the plant via ME52N (S/4HANA: Fiori Manage Purchase Requisitions).'
  record_fix_template: 'Requisition {EBAN.BANFN} item {EBAN.BNFPO}: plant missing.'
- id: PUR068
  field: EBAN.LFDAT
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Purchase requisition item has no delivery date
  why_it_matters: The delivery date tells purchasing and MRP when the goods are needed; ME51N requires it.
  rule_authority: sap_hard_constraint
  sap_impact: The requisition cannot be scheduled or converted; MRP cannot net it against requirements.
  fix_map:
    __blank__: 'Enter the delivery date via ME52N (S/4HANA: Fiori Manage Purchase Requisitions).'
  record_fix_template: 'Requisition {EBAN.BANFN} item {EBAN.BNFPO}: delivery date missing.'
- id: PUR069
  field: EBAN.MATKL
  check_class: null_check
  applies_when:
    EBAN.PSTYP:
      not_in:
      - '6'
  severity: medium
  dimension: completeness
  message: Purchase requisition item has no material group
  why_it_matters: The material group classifies the requirement for buyer assignment, release strategies and spend reporting;
    it is copied from the material or required when there is none.
  rule_authority: sap_hard_constraint
  sap_impact: Release strategies classified by material group do not apply; spend analysis loses the item.
  fix_map:
    __blank__: 'Enter the material group via ME52N (S/4HANA: Fiori Manage Purchase Requisitions).'
  record_fix_template: 'Requisition {EBAN.BANFN} item {EBAN.BNFPO}: material group missing.'
- id: PUR070
  field: EBAN.KNTTP
  check_class: cross_field_check
  fail_when: '`EBAN.MATNR`.isna() & `EBAN.KNTTP`.isna() & (`EBAN.PSTYP`.isna() | (`EBAN.PSTYP` != ''6''))'
  severity: high
  dimension: completeness
  message: Requisition item without a material has no account assignment
  why_it_matters: An item without a material master cannot go into stock, so SAP requires an account assignment (cost centre,
    order, asset, project) to know where the consumption is posted. Text items are not judged.
  rule_authority: sap_hard_constraint
  sap_impact: The requisition cannot be converted; the goods receipt or invoice would have no account to post to.
  fix_map:
    __other__: 'Enter the account assignment category and its object via ME52N (S/4HANA: Fiori Manage Purchase Requisitions),
      or enter the material.'
  record_fix_template: 'Requisition {EBAN.BANFN} item {EBAN.BNFPO}: no material and no account assignment.'
- id: PUR071
  field: EBAN.PEINH
  check_class: cross_field_check
  require_populated: true
  fail_when: '`EBAN.PEINH` <= 0'
  severity: medium
  dimension: consistency
  message: Price unit of the requisition item is zero
  why_it_matters: The requisition value (used by release strategies and budget checks) is quantity x valuation price / price
    unit; a zero price unit divides by zero.
  rule_authority: sap_hard_constraint
  sap_impact: The requisition value cannot be computed; value-based release strategies cannot classify the item.
  fix_map:
    __other__: 'Set the price unit (normally 1) via ME52N (S/4HANA: Fiori Manage Purchase Requisitions).'
  record_fix_template: 'Requisition {EBAN.BANFN} item {EBAN.BNFPO}: price unit {actual_value}.'
- id: PUR072
  field: EINA.LIFNR
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Purchasing info record has no vendor
  why_it_matters: An info record holds the conditions of one vendor for one material (or material group); the vendor is
    part of its identity.
  rule_authority: sap_hard_constraint
  sap_impact: The record can never be used for source determination or price proposals.
  fix_map:
    __blank__: 'Info records cannot change vendor; create a new info record via ME11 and delete this one via ME12 (S/4HANA:
      Fiori Manage Purchasing Info Records).'
  record_fix_template: 'Info record {EINA.INFNR}: vendor missing.'
- id: PUR073
  field: EINA.MATKL
  check_class: null_check
  applies_when:
    EINA.MATNR:
      blank: true
  severity: high
  dimension: completeness
  message: Info record without a material has no material group
  why_it_matters: Info records for materials without a master record are found by material group (and sort term); ME11 requires
    the material group when there is no material.
  rule_authority: sap_hard_constraint
  sap_impact: The record is never proposed for requisitions or POs of that material group.
  fix_map:
    __blank__: 'Enter the material group via ME12 (S/4HANA: Fiori Manage Purchasing Info Records).'
  record_fix_template: 'Info record {EINA.INFNR}: no material and no material group.'
- id: PUR074
  field: EINA.MEINS
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Purchasing info record has no order unit
  why_it_matters: The order unit is the unit the vendor sells in; its price and the PO quantity proposed from the info record
    are expressed in it.
  rule_authority: sap_hard_constraint
  sap_impact: POs proposed from the record have no unit; the price cannot be applied.
  fix_map:
    __blank__: 'Enter the order unit via ME12 (S/4HANA: Fiori Manage Purchasing Info Records).'
  record_fix_template: 'Info record {EINA.INFNR}: order unit missing.'
- id: PUR075
  field: EINA.UMREZ
  check_class: cross_field_check
  fail_when: ~(`EINA.UMREZ` > 0) | ~(`EINA.UMREN` > 0)
  applies_when:
    EINA.MATNR:
      populated: true
  severity: high
  dimension: consistency
  message: Info record conversion between order unit and base unit is zero
  why_it_matters: The info record converts the vendor's order unit to the material's base unit with UMREZ / UMREN; a zero
    factor divides by zero when the PO quantity is converted.
  rule_authority: sap_hard_constraint
  sap_impact: PO items created from the record cannot convert the quantity; goods receipts post wrong stock.
  fix_map:
    __other__: 'Re-enter the order unit and its conversion via ME12 (S/4HANA: Fiori Manage Purchasing Info Records).'
  record_fix_template: 'Info record {EINA.INFNR}: conversion {EINA.UMREZ}/{EINA.UMREN}.'
- id: PUR076
  field: EINA.UMREZ
  check_class: cross_field_check
  require_populated: true
  fail_when: (`EINA.MEINS` == `EINA.LMEIN`) & (`EINA.UMREZ` != `EINA.UMREN`)
  severity: high
  dimension: consistency
  message: Info record order unit equals the base unit but is not converted 1:1
  why_it_matters: When the vendor sells in the material's base unit the conversion must be 1 = 1; any other factor scales
    every PO quantity proposed from the record.
  rule_authority: sap_hard_constraint
  sap_impact: PO quantities and goods receipts are off by the factor.
  fix_map:
    __other__: 'Correct the conversion via ME12 (S/4HANA: Fiori Manage Purchasing Info Records).'
  record_fix_template: 'Info record {EINA.INFNR}: unit {EINA.MEINS} converts {EINA.UMREZ}/{EINA.UMREN} to itself.'
- id: PUR077
  field: EINA.LIFBI
  check_class: cross_field_check
  fail_when: '`EINA.LIFAB` > `EINA.LIFBI`'
  severity: medium
  dimension: consistency
  message: Info record is available until a date before it is available from
  why_it_matters: The availability period (LIFAB - LIFBI) says when the vendor can deliver the material; an end before the
    start is an empty period.
  rule_authority: sap_hard_constraint
  sap_impact: Source determination never finds the vendor deliverable.
  fix_map:
    __other__: 'Correct the availability period via ME12 (S/4HANA: Fiori Manage Purchasing Info Records).'
  record_fix_template: 'Info record {EINA.INFNR}: available {EINA.LIFAB} to {actual_value}.'
- id: PUR078
  field: EINA.MATNR
  check_class: uniqueness_check
  fields:
  - EINA.MATNR
  - EINA.LIFNR
  severity: high
  dimension: uniqueness
  message: More than one purchasing info record exists for the same material and vendor
  why_it_matters: SAP keeps exactly one info record per vendor and material (ME11 refuses a second); price proposals, source
    determination and the PO's info-record update all assume it. Duplicates come from direct loads and split the price history.
  rule_authority: sap_hard_constraint
  sap_impact: POs pick one of the records at random; conditions and price history are split; the 'update info record' indicator
    updates only one.
  fix_map:
    __other__: 'Keep one info record per material and vendor; move conditions to it and flag the other for deletion via
      ME12 (S/4HANA: Fiori Manage Purchasing Info Records).'
  record_fix_template: 'Info record {EINA.INFNR}: material {EINA.MATNR} / vendor {EINA.LIFNR} has another info record.'
- id: PUR079
  field: EINE.NETPR
  check_class: cross_field_check
  fail_when: '`EINE.NETPR` < 0'
  severity: high
  dimension: accuracy
  message: Info record net price is negative
  why_it_matters: The info record price is proposed into every PO for the vendor and material; a purchase price cannot be
    negative.
  rule_authority: sap_hard_constraint
  sap_impact: POs are proposed with negative prices; goods receipts are valued negatively.
  fix_map:
    __other__: 'Correct the price (conditions) via ME12 (S/4HANA: Fiori Manage Purchasing Info Records).'
  record_fix_template: 'Info record {EINE.INFNR}, purchasing org {EINE.EKORG}: net price {actual_value}.'
- id: PUR080
  field: EINE.PEINH
  check_class: cross_field_check
  require_populated: true
  fail_when: '`EINE.PEINH` <= 0'
  severity: high
  dimension: consistency
  message: Info record price unit is zero
  why_it_matters: The info record price is per price unit; zero divides by zero when the price is applied to a PO.
  rule_authority: sap_hard_constraint
  sap_impact: PO items proposed from the record get no usable price.
  fix_map:
    __other__: 'Set the price unit via ME12 (S/4HANA: Fiori Manage Purchasing Info Records).'
  record_fix_template: 'Info record {EINE.INFNR}, purchasing org {EINE.EKORG}: price unit {actual_value}.'
- id: PUR081
  field: EINE.WAERS
  check_class: null_check
  severity: high
  dimension: completeness
  message: Info record purchasing data has no currency
  why_it_matters: The info record price is meaningless without its currency, and SAP requires it with the price.
  rule_authority: sap_hard_constraint
  sap_impact: The price cannot be proposed into POs or compared with other sources.
  fix_map:
    __blank__: 'Enter the currency via ME12 (S/4HANA: Fiori Manage Purchasing Info Records).'
  record_fix_template: 'Info record {EINE.INFNR}, purchasing org {EINE.EKORG}: currency missing.'
- id: PUR082
  field: EINE.BPUMZ
  check_class: cross_field_check
  fail_when: ~(`EINE.BPUMZ` > 0) | ~(`EINE.BPUMN` > 0)
  applies_when:
    EINE.BPRME:
      populated: true
  severity: medium
  dimension: consistency
  message: Info record conversion between order price unit and order unit is zero
  why_it_matters: When the vendor quotes in a different unit than it sells in, SAP converts with BPUMZ / BPUMN; a zero factor
    divides by zero.
  rule_authority: sap_hard_constraint
  sap_impact: PO prices proposed from the record cannot be converted.
  fix_map:
    __other__: 'Re-enter the order price unit via ME12 (S/4HANA: Fiori Manage Purchasing Info Records).'
  record_fix_template: 'Info record {EINE.INFNR}, purchasing org {EINE.EKORG}: conversion {EINE.BPUMZ}/{EINE.BPUMN}.'
- id: PUR083
  field: EINE.MINBM
  check_class: cross_field_check
  fail_when: (`EINE.BSTMA` > 0) & (`EINE.MINBM` > `EINE.BSTMA`)
  severity: medium
  dimension: consistency
  message: Info record minimum order quantity exceeds the maximum order quantity
  why_it_matters: Minimum and maximum PO quantity bound what may be ordered from the vendor; a minimum above the maximum
    leaves no valid quantity.
  rule_authority: sap_hard_constraint
  sap_impact: Every PO quantity for the vendor triggers a quantity warning or error.
  fix_map:
    __other__: 'Correct the minimum or maximum quantity via ME12 (S/4HANA: Fiori Manage Purchasing Info Records).'
  record_fix_template: 'Info record {EINE.INFNR}, purchasing org {EINE.EKORG}: minimum {actual_value} above maximum {EINE.BSTMA}.'
- id: PUR084
  field: EORD.BDATU
  check_class: cross_field_check
  fail_when: '`EORD.VDATU` > `EORD.BDATU`'
  severity: high
  dimension: consistency
  message: Source list record is valid to a date before it is valid from
  why_it_matters: A source list record is used only within its validity period; an end before the start makes it never valid,
    and ME01 rejects it.
  rule_authority: sap_hard_constraint
  sap_impact: The source is never proposed; with a source list requirement the material cannot be ordered from it.
  fix_map:
    __other__: 'Correct the validity via ME01 (S/4HANA: Fiori Manage Source Lists).'
  record_fix_template: 'Source list {EORD.MATNR} plant {EORD.WERKS} record {EORD.ZEORD}: valid {EORD.VDATU} to {actual_value}.'
- id: PUR085
  field: EORD.VDATU
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Source list record has no valid-from date
  why_it_matters: ME01 requires a validity period for each source list record; source determination selects records by it.
  rule_authority: sap_hard_constraint
  sap_impact: The record is not found by source determination.
  fix_map:
    __blank__: 'Enter the validity via ME01 (S/4HANA: Fiori Manage Source Lists).'
  record_fix_template: 'Source list {EORD.MATNR} plant {EORD.WERKS} record {EORD.ZEORD}: valid-from missing.'
- id: PUR086
  field: EORD.BDATU
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Source list record has no valid-to date
  why_it_matters: ME01 requires a validity period for each source list record; source determination selects records by it.
  rule_authority: sap_hard_constraint
  sap_impact: The record is not found by source determination.
  fix_map:
    __blank__: 'Enter the validity via ME01 (S/4HANA: Fiori Manage Source Lists).'
  record_fix_template: 'Source list {EORD.MATNR} plant {EORD.WERKS} record {EORD.ZEORD}: valid-to missing.'
- id: PUR087
  field: EORD.LIFNR
  check_class: cross_field_check
  fail_when: '`EORD.LIFNR`.isna() & `EORD.RESWK`.isna()'
  severity: high
  dimension: completeness
  message: Source list record names neither a vendor nor a supplying plant
  why_it_matters: A source of supply is either an external vendor (optionally with an agreement) or a supplying plant for
    stock transfers; a record with neither names no source.
  rule_authority: sap_hard_constraint
  sap_impact: Source determination proposes nothing; MRP cannot assign a source to requisitions.
  fix_map:
