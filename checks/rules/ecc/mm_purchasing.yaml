- id: PUR042
  field: EKKO.EBELN
  check_class: uniqueness_check
  fields: [EKKO.EBELN]
  severity: critical
  dimension: uniqueness
  message: Duplicate purchase order numbers detected — each PO must be unique
  why_it_matters: Duplicate PO numbers indicate a data extract or migration error. Each purchase order must have
    a unique EBELN. Duplicates cause goods receipt posting ambiguity and invoice verification failures.
  rule_authority: sap_hard_constraint
  sap_impact: MIGO cannot determine which PO to post against. Invoice verification (MIRO) matches to the wrong PO.
    Goods receipt history is ambiguous.
  fix_map: {__blank__: 'Investigate the source of duplicate PO numbers. This is typically a data extract issue (duplicate
      rows from joined tables). If genuine duplicates exist in SAP, escalate to Basis — this indicates a number
      range collision.'}

- id: PUR043
  field: EKKO.BEDAT
  check_class: freshness_check
  max_age_hours: 8760
  severity: medium
  dimension: timeliness
  message: Purchase order older than 1 year — open POs older than 12 months should be reviewed and closed if no longer needed
  rule_authority: best_practice
  why_it_matters: Purchase orders open beyond 12 months usually represent abandoned commitments, over-delivery risk, or uncleared
    GR/IR that distorts open-commitment reporting.
  sap_impact: Open commitment and accrual figures are overstated; GR/IR clearing is blocked; MRP plans against orders that
    will never be received.
  fix_map:
    __blank__: 'Review the PO in ME23N / ME2M: confirm whether goods/invoice are still expected; close the line with a delivery-completed
      flag (ME22N) or set a deletion indicator if abandoned.'
  record_fix_template: PO {field} dated {age_days} days ago. Confirm delivery still expected in ME23N; set delivery-completed
    or deletion indicator if abandoned.
  applies_when:
    EKPO.ELIKZ:
      not_in:
      - X

- id: PUR044
  field: EKPO.NETPR
  check_class: cross_field_check
  severity: high
  dimension: accuracy
  message: Purchase order line has negative net price — indicates pricing error or incorrect credit memo configuration
  why_it_matters: Negative PO prices cause goods receipt valuation errors, invoice verification mismatches, and
    incorrect cost centre charges.
  rule_authority: best_practice
  sap_impact: GR posting creates negative stock value. Invoice verification shows price variance. Cost centre is
    credited instead of debited.
  fix_map: {__blank__: 'Review the PO line price via ME22N. If a credit memo is intended, use the correct document
      type (returns PO). If data error, correct the net price.'}
  fail_when: '`EKPO.NETPR` < 0'
  require_populated: true

- id: PUR045
  field: EKKO.BSART
  check_class: referential_check
  severity: high
  dimension: consistency
  message: Purchasing document type BSART must reference a valid entry in T161
  why_it_matters: BSART (purchasing document type) drives number range, field selection, item-category defaults, and release-strategy
    determination for every PO, contract, and scheduling agreement. An invalid BSART means the document cannot be displayed
    (ME23N) or released, and the release strategy cannot resolve — procurement workflow halts.
  rule_authority: best_practice
  sap_impact: ME23N cannot display the document; release strategy cannot resolve; procurement workflow blocked.
  fix_map:
    __blank__: BSART is mandatory at ME21N. Blank indicates document-header corruption.
    __other__: Document type '{invalid_value}' not in T161. Reassign via ME22N (if document editable) or configure in SPRO
      > Materials Management > Purchasing > Purchase Order > Define Document Types.
  record_fix_template: 'PO {EKKO.EBELN}: document type ''{actual_value}'' is not in T161.'
- id: XP2P001
  field: EKKO.ZTERM
  check_class: cross_field_check
  fail_when: '`EKKO.ZTERM` != `LFM1.ZTERM`'
  require_populated: true
  severity: low
  dimension: consistency
  message: PO payment terms differ from the vendor's purchasing-organisation payment terms (LFM1.ZTERM)
  why_it_matters: SAP defaults EKKO.ZTERM from the vendor's purchasing data (LFM1) for the PO's purchasing organisation. When
    they diverge the AP clerk sees different terms at invoice posting (MIRO) than on the PO and F110 may pay in the wrong
    window — usually a PO copied from an old document after the vendor terms changed.
  rule_authority: best_practice
  sap_impact: Payment timing mis-scheduled; cash discount may be missed; ageing inconsistent with vendor statements.
  fix_map:
    __other__: Align the PO terms via ME22N, or — if the vendor terms are outdated — update LFM1 via XK02/MK02 (ECC) or the
      BP purchasing role (S/4HANA).
  record_fix_template: 'PO {EKKO.EBELN}: terms ''{EKKO.ZTERM}'' differ from vendor {EKKO.LIFNR} purchasing terms ''{LFM1.ZTERM}''.'
- id: XP2P002
  field: EKKO.WAERS
  check_class: cross_field_check
  fail_when: '`EKKO.WAERS` != `LFM1.WAERS`'
  require_populated: true
  severity: low
  dimension: consistency
  message: PO currency differs from the vendor's order currency (LFM1.WAERS)
  why_it_matters: LFM1.WAERS is the vendor's order currency for the purchasing organisation. A PO in another currency
    is legitimate for multi-currency suppliers but is often a data-entry error that creates exchange-rate differences
    at settlement.
  rule_authority: best_practice
  sap_impact: Exchange-rate gain/loss on settlement; reconciliation effort at month end.
  fix_map:
    __other__: Correct the PO currency via ME22N, or update the vendor order currency (LFM1) if the supplier genuinely
      trades in this currency.
  record_fix_template: 'PO {EKKO.EBELN}: currency ''{EKKO.WAERS}'' differs from vendor {EKKO.LIFNR} order currency
    ''{LFM1.WAERS}''.'
