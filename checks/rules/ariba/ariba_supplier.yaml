# SAP Ariba suppliers (canonical view ARIBA_SUPPLIER in
# sap/dictionaries/canonical/ariba.yaml). Tax IDs, bank details and the SM
# vendor to ERP vendor link are not read by the connector, so no rule here
# checks them.
module: ariba_supplier
target_state: ARIBA
rules:
- id: ARS001
  field: ARIBA_SUPPLIER.VENDOR_ID
  check_class: null_check
  severity: critical
  dimension: completeness
  message: Ariba supplier has no supplier ID
  why_it_matters: The supplier ID is the key that contracts, purchase orders and invoices reference. A supplier without it
    cannot be ordered from or paid.
  rule_authority: sap_hard_constraint
  sap_impact: Contracts, POs and invoices cannot reference the supplier; the ERP vendor replication has no key.
  fix_map:
    __blank__: Re-extract the supplier list; a blank ID points to an incomplete page or an unfinished registration.
  record_fix_template: 'Ariba supplier {ARIBA_SUPPLIER.NAME}: supplier ID is {actual_value}.'
- id: ARS002
  field: ARIBA_SUPPLIER.VENDOR_ID
  check_class: uniqueness_check
  fields:
  - ARIBA_SUPPLIER.VENDOR_ID
  severity: critical
  dimension: uniqueness
  message: Supplier ID appears on more than one Ariba supplier
  why_it_matters: Two supplier records with one ID make every reference to that ID ambiguous.
  rule_authority: sap_hard_constraint
  sap_impact: POs and invoices resolve to the wrong supplier record; spend and compliance reporting double-counts.
  fix_map:
    __other__: Re-extract; if the duplicate persists, merge the records in Supplier Management.
  record_fix_template: 'Ariba supplier {ARIBA_SUPPLIER.VENDOR_ID}: ID is not unique.'
- id: ARS003
  field: ARIBA_SUPPLIER.NAME
  check_class: uniqueness_check
  fields:
  - ARIBA_SUPPLIER.NAME
  - ARIBA_SUPPLIER.COUNTRY
  normalize: name
  severity: high
  dimension: uniqueness
  message: Possible duplicate supplier (same name and country)
  why_it_matters: Duplicate suppliers split spend, weaken negotiating leverage and are the usual route for duplicate payments
    and fraudulent vendors. Same normalised name in the same country is the standard duplicate signal.
  rule_authority: best_practice
  sap_impact: Duplicate vendors replicate to the ERP; the same invoice can be paid to both; spend analysis understates the
    supplier.
  fix_map:
    __other__: Review the pair, keep one supplier and deactivate or merge the other in Supplier Management.
  record_fix_template: 'Ariba supplier {ARIBA_SUPPLIER.VENDOR_ID}: name ''{ARIBA_SUPPLIER.NAME}'' in {ARIBA_SUPPLIER.COUNTRY}
    matches another supplier.'
- id: ARS004
  field: ARIBA_SUPPLIER.NAME
  check_class: null_check
  severity: high
  dimension: completeness
  message: Ariba supplier has no name
  why_it_matters: The name is what buyers search and what is printed on POs and payment files.
  rule_authority: sap_hard_constraint
  sap_impact: Buyers cannot find the supplier; POs and payments show no payee name.
  fix_map:
    __blank__: Maintain the legal name in the supplier's registration questionnaire.
  record_fix_template: 'Ariba supplier {ARIBA_SUPPLIER.VENDOR_ID}: name is {actual_value}.'
- id: ARS005
  field: ARIBA_SUPPLIER.COUNTRY
  check_class: null_check
  severity: high
  dimension: completeness
  message: Ariba supplier has no country
  why_it_matters: The country drives tax treatment, bank and address validation, sanctions screening and the ERP vendor's
    country key.
  rule_authority: sap_hard_constraint
  sap_impact: The replicated ERP vendor fails country-dependent checks (tax number, bank, address); screening is incomplete.
  fix_map:
    __blank__: Maintain the country in the supplier's registration questionnaire.
  record_fix_template: 'Ariba supplier {ARIBA_SUPPLIER.VENDOR_ID}: country is {actual_value}.'
- id: ARS006
  field: ARIBA_SUPPLIER.COUNTRY
  check_class: regex_check
  pattern: ^[A-Z]{2}$
  severity: medium
  dimension: validity
  message: Supplier country is not an ISO 3166 two-letter code
  why_it_matters: The ERP country key and tax / bank validation expect the ISO 3166-1 alpha-2 code.
  rule_authority: iso_standard
  sap_impact: Vendor replication to the ERP fails or maps to the wrong country.
  fix_map:
    __other__: Replace the value with the ISO 3166-1 alpha-2 code.
  record_fix_template: 'Ariba supplier {ARIBA_SUPPLIER.VENDOR_ID}: country ''{actual_value}'' is not an ISO code.'
- id: ARS007
  field: ARIBA_SUPPLIER.CITY
  check_class: null_check
  severity: medium
  dimension: completeness
  message: Ariba supplier has no city
  why_it_matters: The city is part of the postal address used on POs, payment files and sanctions screening.
  rule_authority: best_practice
  sap_impact: Incomplete vendor address in the ERP; payment media and screening may reject the record.
  fix_map:
    __blank__: Maintain the address in the supplier's registration questionnaire.
  record_fix_template: 'Ariba supplier {ARIBA_SUPPLIER.VENDOR_ID}: city is {actual_value}.'
- id: ARS008
  field: ARIBA_SUPPLIER.COUNTRY
  check_class: cross_field_check
  fail_when: '`ARIBA_SUPPLIER.COUNTRY`.isna()'
  severity: high
  dimension: completeness
  message: Ariba supplier has no country
  why_it_matters: Country drives tax, banking and the business partner address in S/4HANA.
  rule_authority: sap_hard_constraint
  sap_impact: The supplier cannot be loaded as a business partner.
  fix_map:
    __other__: Maintain the country in the supplier profile.
  record_fix_template: Ariba supplier {ARIBA_SUPPLIER.VENDOR_ID} has no country.
- id: ARS009
  field: ARIBA_SUPPLIER.VENDOR_ID
  check_class: cross_field_check
  fail_when: '`ARIBA_SUPPLIER.VENDOR_ID`.isna()'
  severity: critical
  dimension: completeness
  message: Ariba supplier has no ERP vendor ID
  why_it_matters: The vendor ID links the supplier to the ERP vendor and the S/4HANA business partner.
  rule_authority: sap_hard_constraint
  sap_impact: Orders and invoices cannot be mapped to the ERP.
  fix_map:
    __other__: Link the supplier to its ERP vendor.
  record_fix_template: Ariba supplier {ARIBA_SUPPLIER.CATEGORY} has no ERP vendor ID.
- id: ARS010
  field: ARIBA_SUPPLIER.REGISTRATION_DATE
  check_class: cross_field_check
  fail_when: '`ARIBA_SUPPLIER.REGISTRATION_DATE` > @today'
  severity: medium
  dimension: validity
  message: Ariba supplier registration date is in the future
  why_it_matters: A supplier cannot register later than today.
  rule_authority: sap_hard_constraint
  sap_impact: Onboarding reports are wrong.
  fix_map:
    __other__: Correct the date.
  record_fix_template: 'Ariba supplier {ARIBA_SUPPLIER.VENDOR_ID}: registered {actual_value}, in the future.'
- id: ARS011
  field: ARIBA_SUPPLIER.LAST_UPDATED
  check_class: cross_field_check
  fail_when: '`ARIBA_SUPPLIER.LAST_UPDATED` < `ARIBA_SUPPLIER.REGISTRATION_DATE`'
  severity: low
  dimension: consistency
  message: Ariba supplier was updated before it registered
  why_it_matters: Update timestamps cannot precede registration.
  rule_authority: sap_hard_constraint
  sap_impact: Change history is unreliable.
  fix_map:
    __other__: Correct the dates.
  record_fix_template: 'Ariba supplier {ARIBA_SUPPLIER.VENDOR_ID}: updated {ARIBA_SUPPLIER.LAST_UPDATED}, registered {ARIBA_SUPPLIER.REGISTRATION_DATE}.'
- id: ARS012
  field: ARIBA_SUPPLIER.QUALIFICATION_STATUS
  check_class: cross_field_check
  fail_when: '`ARIBA_SUPPLIER.QUALIFICATION_STATUS`.isna()'
  severity: medium
  dimension: completeness
  message: Ariba supplier has no qualification status
  why_it_matters: Qualification shows whether the supplier is approved to receive orders.
  rule_authority: best_practice
  sap_impact: Unqualified suppliers may be used.
  fix_map:
    __other__: Run qualification for the supplier.
  record_fix_template: Ariba supplier {ARIBA_SUPPLIER.VENDOR_ID} has no qualification status.
- id: ARS013
  field: ARIBA_SUPPLIER.CATEGORY
  check_class: cross_field_check
  fail_when: '`ARIBA_SUPPLIER.CATEGORY`.isna()'
  severity: low
  dimension: completeness
  message: Ariba supplier has no category
  why_it_matters: Category drives sourcing and spend analysis.
  rule_authority: best_practice
  sap_impact: Spend cannot be grouped by category.
  fix_map:
    __other__: Assign a category.
  record_fix_template: Ariba supplier {ARIBA_SUPPLIER.VENDOR_ID} has no category.
- id: ARS014
  field: ARIBA_SUPPLIER.LAST_UPDATED
  check_class: freshness_check
  max_age_hours: 17520
  severity: low
  dimension: timeliness
  message: Ariba supplier profile not updated for two years
  why_it_matters: A stale profile is an archive or review candidate before migration.
  rule_authority: best_practice
  sap_impact: Stale suppliers are carried into the new system.
  fix_map:
    __other__: Review the supplier and archive it if inactive.
  record_fix_template: 'Ariba supplier {ARIBA_SUPPLIER.VENDOR_ID}: last updated {actual_value}.'
