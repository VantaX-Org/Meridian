module: concur_expense
target_state: CONCUR
generated: true
rules:
- id: DXI809888e9
  enabled: false
  field: CONCUR_REPORT.SUBMIT_DATE
  check_class: cross_field_check
  severity: high
  dimension: consistency
  message: Submit date must not be after approved date
  why_it_matters: CONCUR_REPORT.SUBMIT_DATE and CONCUR_REPORT.APPROVED_DATE are both carried by the same CONCUR_REPORT
    record, so their order is a property of the record itself and not of any process. The source system cannot produce
    an inverted pair, so one marks a load, mapping or transformation defect rather than a data-entry mistake.
  rule_authority: sap_hard_constraint
  sap_impact: Every duration, age or validity window derived from SUBMIT_DATE and APPROVED_DATE is wrong, and the
    record's place in time is unreliable.
  fail_when: '`CONCUR_REPORT.SUBMIT_DATE`.notna() & `CONCUR_REPORT.APPROVED_DATE`.notna() & (`CONCUR_REPORT.SUBMIT_DATE`
    > `CONCUR_REPORT.APPROVED_DATE`)'
  fix_map:
    __other__: Correct CONCUR_REPORT.SUBMIT_DATE or CONCUR_REPORT.APPROVED_DATE so the pair is ordered.
  record_fix_template: CONCUR_REPORT.SUBMIT_DATE is after CONCUR_REPORT.APPROVED_DATE.
