- id: CNU040
  field: CONCUR_USER.LAST_NAME
  check_class: cross_field_check
  fail_when: "`CONCUR_USER.LAST_NAME`.str[0].str.islower()"
  severity: low
  dimension: validity
  message: Last name does not start with a capital letter
  why_it_matters: Surnames are conventionally capitalised. A lower-case initial letter usually means the value was
    lower-cased by an upstream system (for example a username-style extract) rather than the properly cased HR value.
  rule_authority: best_practice
  sap_impact: The payee name appears without proper capitalisation on payment advices and expense reports.
  fix_map:
