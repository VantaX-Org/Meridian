# Local source build overlay — use instead of pulling from GHCR
# Usage: docker compose -f docker-compose.yml -f docker-compose.build.yml build

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api.prod
      args:
        INSTALL_PYRFC: "false"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker.prod

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend.prod
