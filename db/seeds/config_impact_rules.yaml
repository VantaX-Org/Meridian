# Config Impact Rules — maps check_id to downstream feature / system impact.
#
# Each rule describes what breaks when a specific data quality check fails.
# Used by the config_impact agent node to produce feature-level readiness
# assessments and opportunity-cost analysis.
#
# Fields:
#   check_id                  — matches findings_summary[].check_id
#   module                    — SAP module key
#   target_feature            — the downstream feature / capability affected
#   target_system             — the system or component that owns target_feature
#   impact_type               — full_block | degraded | cosmetic
#   blocked_transactions      — SAP t-codes or SF processes that cannot execute
#   opportunity_cost_category — revenue | efficiency | compliance | risk
#   opportunity_cost_description — business-language impact statement
#   cost_driver               — what drives the financial impact
#   cross_system_dependencies — dict of external system -> failure description

rules:

  # ===========================================================================
  # SuccessFactors — Employee Central
  # ===========================================================================
  - check_id: EC001
    module: employee_central
    target_feature: All SuccessFactors Modules
    target_system: SuccessFactors BizX
    impact_type: full_block
    blocked_transactions:
      - Onboarding 2.0
      - Payroll Control Center
      - Compensation Planning
      - Learning Management
      - Performance & Goals
      - Time Management
    opportunity_cost_category: compliance
    opportunity_cost_description: >-
      Core employee record failures cascade to every downstream SF module.
      No module can function without a valid Employee Central foundation.
    cost_driver: headcount_affected
    cross_system_dependencies:
      concur: Employee profile sync fails — expense policy assignment breaks
      payroll: Payroll integration cannot resolve employee records
      third_party_benefits: Benefits carrier feeds contain invalid employee data

  - check_id: EC005
    module: employee_central
    target_feature: SF Onboarding 2.0
    target_system: SuccessFactors Onboarding
    impact_type: full_block
    blocked_transactions:
      - Onboarding workflow initiation
      - Day-1 task generation
      - Equipment provisioning trigger
      - Manager notification chain
    opportunity_cost_category: efficiency
    opportunity_cost_description: >-
      New hire onboarding cannot proceed. Day-1 readiness tasks are not
      generated, IT provisioning is not triggered, and manager notifications
      are suppressed.
    cost_driver: new_hire_volume
    cross_system_dependencies:
      concur: Employee sync fails — new hire cannot submit expenses
      payroll: Tenure calculation fails — incorrect leave accrual from day 1

  - check_id: EC010
    module: employee_central
    target_feature: Manager Self-Service
    target_system: SuccessFactors Employee Central
    impact_type: degraded
    blocked_transactions:
      - Manager org-chart view
      - Direct report listing
      - Approval delegation
    opportunity_cost_category: efficiency
    opportunity_cost_description: >-
      Managers see incomplete or incorrect team structures, leading to
      mis-routed approvals and delayed HR actions.
    cost_driver: manager_headcount
    cross_system_dependencies: {}

  - check_id: EC015
    module: employee_central
    target_feature: Payroll Integration
    target_system: SuccessFactors Employee Central Payroll
    impact_type: full_block
    blocked_transactions:
      - Payroll Control Center replication
      - Pay statement generation
      - Tax withholding calculation
    opportunity_cost_category: compliance
    opportunity_cost_description: >-
      Payroll replication fails — employees may be paid incorrectly or not
      at all, creating legal and compliance exposure.
    cost_driver: payroll_cycle_value
    cross_system_dependencies:
      erp_payroll: Wage type mapping breaks if EC cost centre is invalid

  # ===========================================================================
  # SuccessFactors — Compensation
  # ===========================================================================
  - check_id: COMP001
    module: compensation
